changelog: |
  # Changelog

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [1.0.1] - 2026-10-01

  ### Changed

  - Removed redundant environment cloning and lock allocation per HTTP/2 stream in `withHttp2Stream` and push-promise handling. Streams now run synchronously on the calling thread without overhead.

  ## [1.0.0] - 2026-07-07

  ### Added

  - Initial release.
