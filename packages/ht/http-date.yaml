changelog: |
  # ChangeLog for http-date

  ## 0.0.12

  * Security: `formatHTTPDate` read outside its tables if `hdMonth` or
    `hdWkday` was out of range (a huge value could crash). Such values
    are now rendered as `___`.
  * `epochTimeToHTTPDate` with a negative value spent a lot of CPU
    time and returned a wrong date. It now returns the correct date.
