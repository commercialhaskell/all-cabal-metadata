description: |
  # dear-imgui-impl-sdl2

  Platform backend for [Dear ImGui] on SDL2 windows.
  Pair it with a renderer backend.

  ```haskell
  import DearImGui.Impl.SDL2 qualified as ImplSDL2
  import SDL qualified

  quitRequested :: IO Bool
  quitRequested = any ((== SDL.QuitEvent) . SDL.eventPayload) <$> ImplSDL2.pollEvents
  ```

  [Dear ImGui]: https://github.com/ocornut/imgui
