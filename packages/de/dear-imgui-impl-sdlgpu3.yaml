changelog-type: markdown
description: |
  # dear-imgui-impl-sdlgpu3

  Renderer backend for [Dear ImGui] on the SDL3 GPU API.
  Pair it with the SDL3 platform backend.

  ```haskell
  import DearImGui.Impl.SDLGPU3 qualified as ImplSDLGPU3
  import DearImGui.Raw.ImGui qualified as ImGui
  import Foreign.Ptr (Ptr, nullPtr)
  import SDL3.Sys qualified as SDL3

  renderImGui :: Ptr SDL3.SDL_GPUCommandBuffer -> IO (Ptr SDL3.SDL_GPURenderPass) -> IO ()
  renderImGui commandBuffer beginRenderPass = do
    drawData <- ImGui.getDrawData
    ImplSDLGPU3.prepareDrawData drawData commandBuffer
    renderPass <- beginRenderPass
    ImplSDLGPU3.renderDrawData drawData commandBuffer renderPass nullPtr
    SDL3.endGPURenderPass renderPass
  ```

  [Dear ImGui]: https://github.com/ocornut/imgui
