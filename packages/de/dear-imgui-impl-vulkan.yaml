description: |
  # dear-imgui-impl-vulkan

  Renderer backend for [Dear ImGui] on Vulkan.
  Pair it with a platform backend.

  ```haskell
  import Control.Exception (finally)
  import Control.Monad.IO.Class (liftIO)
  import Control.Monad.Trans.Resource (ResourceT)
  import DearImGui.Impl.Vulkan qualified as ImplVulkan

  withImGuiVulkan :: ImplVulkan.InitArgs -> IO a -> ResourceT IO a
  withImGuiVulkan args frames = do
    _descriptorPool <- ImplVulkan.withBackend 0 args
    liftIO (frames `finally` ImplVulkan.shutdown)
  ```

  [Dear ImGui]: https://github.com/ocornut/imgui
