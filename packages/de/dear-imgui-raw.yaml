description: |
  # dear-imgui-raw

  Raw FFI bindings to [Dear ImGui].

  ```haskell
  {-# LANGUAGE BlockArguments #-}
  {-# LANGUAGE OverloadedRecordDot #-}

  import Data.Bits ((.|.))
  import DearImGui.Context (withContext)
  import DearImGui.Raw.Enums.ImGuiConfigFlags qualified as ImGuiConfigFlags
  import DearImGui.Raw.ImGui qualified as ImGui
  import DearImGui.Raw.ImGuiIO qualified
  import Foreign.Storable (peek, poke)

  main :: IO ()
  main = withContext do
    io <- ImGui.getIO
    flags <- peek io.configFlags
    poke io.configFlags (flags .|. ImGuiConfigFlags.DockingEnable)
  ```

  Getting pixels on screen takes one platform and one renderer backend from the
  `dear-imgui-impl-*` packages.

  [Dear ImGui]: https://github.com/ocornut/imgui
