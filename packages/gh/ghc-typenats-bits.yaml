description: |
  # ghc-typenats-bits
  Do you feel sad at the lack of bitwise functions for Haskell type-level natural
  numbers? Me too. It's OK. Please enjoy this library. Includes such classics as:

  - left shift
  - logical right shift
  - XOR

  ## Why?
  [hackage-type-level-prng]: https://hackage.haskell.org/package/type-level-prng

  I need these definitions in multiple libraries (e.g.
  [type-level-prng][hackage-type-level-prng], a WIP generics lib), and they appear
  to have gone undefined on Hackage.

  ## License
