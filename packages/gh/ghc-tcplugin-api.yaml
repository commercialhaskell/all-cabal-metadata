changelog: "# Version 0.20.2.0 (2026-11-13)\n\n- Add `mkStringExpr :: MonadTcPlugin
  m => String -> m CoreExpr` and\n  `mkStringExprFS :: MonadTcPlugin m => FastString
  -> m CoreExpr` to\n  `GHC.TcPlugin.API`.\n\n  These replace the functions of the
  same name from `GHC.Core.Make`. Those\n  functions were deleted in GHC 10.2 (alongside
  the `MonadThings` class they\n  used for their contexts). Adapt to this change by
  importing `mkStringExpr`\n  from `GHC.TcPlugin.API`, and not through `GHC.Core.Make`
  nor `GHC.Plugins`.\n\n# Version 0.20.1.1 (2026-11-03)\n\n- Adapt to GHC HEAD `ModuleName`
  change (GHC commit 575c4bc6cb).\n\n# Version 0.20.1.0 (2026-09-01)\n\n- Add `cTupleTyConName`
  and `isCTupleTyConName` to the export list of\n  `GHC.Builtins`.\n\n# Version 0.20.0.0
  (2026-09-01)\n\n- Preliminary support for GHC 10.2 (with the known-entities refactor).\n\n-
  The re-exports of `GHC.Builtin.Names`, `GHC.Builtin.Types` and\n  `GHC.Builtin.Types.Prim`
  have been replaced by a single umbrella helper\n  module, `GHC.Builtins`. Remarks:\n\n
  \   - GHC 10.2 no longer defines static `Name`s for known-key entities. Instead,\n
  \     these need to be resolved at runtime. Accordingly, `GHC.Builtins`\n      exports
  `KnownKey` uniques such as `errorMessageTypeErrorFamKey` on\n      GHC >= 10.2,
  instead of `Name`s such as `errorMessageTypeErrorFamName`.\n\n    - The `MonadThings`
  class has been removed. Use `tcLookupTyCon`,\n      `tcLookupDataCon` etc instead.\n\n#
  Version 0.19.0.0 (2026-05-12)\n\n- Starting from GHC 10.0, typechecker plugins are
  kept running during the\n  desugaring phase, in order to improve the accuracy of
  pattern-match warnings.\n\n  For this reason, the `tcPluginStop` function has been
  split into two:\n    - `tcPluginPostTc`, for actions to run at the end of typechecking.\n
  \   - `tcPluginShutdown`, to shut down the plugin. This action runs in `IO`\n       instead
  of a `TcM`-like monad.\n\n  On GHC versions prior to 10.0, both of these actions
  will run at the end of\n  typechecking, and typechecker plugins aren't invoked during
  pattern-match\n  checking.\n\n# Version 0.18.2.1 (2026-04-28)\n\n- Add preliminary
  support for GHC 10.0.\n\n# Version 0.18.2.0 (2025-01-14)\n\n- Add a new function
  `ctsSubst` which computes a fix-point substitution from\n  a collection of constraints
  which define a terminating generalised\n  substitution. Mainly for use with the
  set of inert Given constraints.\n\n- Re-export several functions to deal with substitutions:
  `substTy`,\n  `substTys`, `extendTvSubst` and `mkTvSubstPrs`. Also re-export the
  `Subst`\n  type (alias for `TCvSubst` on GHC <= 9.6).\n\n# Version 0.18.1.0 (2025-10-09)\n\n-
  Bugfix for v0.18.0.0: deal with constraints generated by unflattening\n  in `splitTyConApp_upTo`.
  Fixes #19.\n\n# Version 0.18.0.0 (2025-09-15)\n\n- On GHC 9.0 and below, `ghc-tcplugin-api`
  will now automatically unflatten all\n  Given constraints. That is, all flattening
  skolems `[G] fsk ~ F tys` will be\n  substituted away, both in Givens and in Wanteds/Deriveds.\n\n
  \ No change for GHC 9.2 and above, as GHC stopped producing flattening variables\n
  \ from 9.2 onwards.\n\n# Version 0.17.2.0 (2025-09-08)\n\n- Fix the package failing
  to build on GHC 9.6.1 through 9.6.6 and\n  on GHC 9.8.1 through 9.8.3. GHC versions
  9.6.7 and 9.8.4 are unaffected.\n\n# Version 0.17.1.0 (2025-08-27)\n\n- Fix a regression,
  introduced in `0.17.0.0`, in which `splitTyConApp_upTo` would\n  fail to take into
  account equalities of the form `tv1 ~ tv2`.\n\n# Version 0.17.0.0 (2025-08-25)\n\n-
  `splitTyConApp_upTo` now additionally returns a `[Coercion]` for tracking\n  Given
  dependencies (which should be passed to functions such as `mkPluginUnivCo`,\n  `mkPluginUnivEvTerm`
  and `mkTyFamAppReduction`).\n\n# Version 0.16.2.0 (2025-08-22)\n\n- `splitTyConApp_upTo`
  now correctly splits apart type families. This ensures\n  it is a valid drop-in
  replacement for `splitTyConApp_maybe` (fixes issue #13).\n\n# Version 0.16.1.0 (2025-07-18)\n\n-
  Correctness fix for the `GHC.TcPlugin.API.TyConSubst` module: ensure that\n  the
  `TyConSubst` does not mistake representational Given equalities for\n  nominal equalities.
  For the time being, the `splitTyConApp_upTo` functionality\n  only works at nominal
  role.\n\n# Version 0.16.0.0 (2025-07-18)\n\n- Re-export `tyConDataCons`, `tyConSingleDataCon_maybe`,\n
  \ `tyConSingleDataCon`, `dataConTyCon`, `isNewTyCon` and `isNewDataCon`\n  from
  GHC.\n\n- The `isWanted` function now correctly returns `False` for derived\n  constraints.
  This is only relevant for GHC 9.2 and below.\n\n- Add `GHC.TcPlugin.API.TyConSubst`
  module, which implements logic for\n  recognising when a type is a `TyConApp` up
  to Given constraints.\n\n# Version 0.15.0.0 (2025-06-03)\n\n- Remove `tcPluginIO`
  in favour of new `MonadIO` instance.  \n  To migrate, use `liftIO` instead of `tcPluginIO`.\n\n-
  Add `lookupTHName` function, which allows looking up Template Haskell names\n  in
  typechecker plugins. Useful in conjunction with `TemplateHaskellQuotes`.\n\n- Helper
  functions to construct evidence terms have been adjusted to return\n  values of
  type `EvExpr`, rather than `EvTerm`. This makes the functions more\n  composable,
  and allows typechecker plugin to provide evidence for quantified\n  constraints
  more easily.\n\n  Affected functions: `evDFunApp`, `evDataConApp`, `evCast`.\n\n
  \ To migrate, you will need to manually wrap evidence terms with the\n  `EvExpr`
  constructor in places that expect an `EvTerm`.\n\n- Added `natKind`, `symbolKind`
  and `charKind` for the kinds of type-level\n  `Nat`, `Symbol` and `Char`.\n\n- Added
  several re-exports from the `ghc` library:\n  - `isGiven` & `isWanted`.\n  - `ctEvPred`,
  `ctEvId`, `ctEvExpr` and `ctEvLoc`.\n  - `className` & `tyConName`.\n  - `isEqPred`
  (unboxed equality) and `isEqClassPred` (boxed equality).\n  - `evId` & `ctEvId`.\n
  \ - `typeKind`.\n  - `nonDetCmpType`.\n\n- Removed re-exports of `ctev_pred`, `ctev_loc`,
  `ctev_evar`, and `ctev_dest`.\n\n  Migration: use `ctEvPred` instead of `ctev_pred`
  and `ctEvLoc` instead of `ctev_loc`.\n  Uses of `ctev_evar` and `ctev_dest` should
  be covered by `ctEvEvId` and/or\n  `ctEvExpr`.\n\n# Version 0.14.0.0 (2024-11-28)\n\n-
  Rename `mkPrimEqPredRole` to `mkEqPredRole`. This is a re-exported function\n  from
  GHC, and the renaming adapts to the renaming in GHC-9.13.\n\n# Version 0.13.0.0
  (2024-10-30)\n\n- Update to changes in the type of GHC's `mkUnivCo`\n  in order
  to (properly) add support for GHC 9.12.\n\n- Change `mkPluginUnivCo`, `mkPluginUnivEvTerm`
  and `mkTyFamAppReduction`\n  to take a `[Coercion]` rather than a `DVarSet` for
  specifying dependencies.\n\n- Stop re-exporting `DVarSet`, `emptyDVarSet`, `extendDVarSet`,
  `unionDVarSet`,\n  `unitDVarSet`, and `mkDVarSet`.\n\n- Update documentation to
  suggest using `ctEvCoercion`\n  rather than `ctEvId` to specify coercions that a
  `UnivCo` depends on.\n\n- Re-export `ctEvCoercion`, and stop re-exporting `ctEvId`.\n\n#
  Version 0.12.0.0 (2024-10-22)\n\n- Add preliminary support for GHC 9.12.\n\n- `mkPluginUnivCo`,
  `mkPluginUnivEvTerm` and `mkTyFamAppReduction` now all take\n  an additional `DVarSet`
  argument which allows specifying evidence that we\n  depend on. This stops evidence
  terms being floated out past used enclosing\n  Givens (see [GHC issue #23923](https://gitlab.haskell.org/ghc/ghc/-/issues/23923)).\n\n-
  Re-export `DVarSet`, `emptyDVarSet`, `extendDVarSet`, `unionDVarSet`,\n  `unitDVarSet`,
  and `mkDVarSet`, as well as `ctEvId`, in order to facilitate\n  construction and
  manipulation of `DVarSet`s.\n\n- Re-export `GHC.Types.Unique.Set`, `GHC.Types.Unique.DSet`.\n\n#
  Version 0.11.0.0 (2023-08-29)\n\n- Add support for GHC 9.8.\n\n- Re-export functionality
  relating to GHC's constraint solving `TcS` monad,\n  such as `{get,set}InertSet`,
  `{get,set}TcEvBindsMap`.\n\n- Re-export `readTcRef` and `writeTcRef`.\n\n# Version
  0.10.0.0 (2023-02-28)\n\n- Introduce `resolveImport`, and make `PkgQual` opaque.\n\n-
  Rename `tcRewriterWanteds` to `tcRewriterNewWanteds`\n  (bringing it in line with
  nomenclature in GHC 9.4).\n\n# Version 0.9.0.0 (2023-01-24)\n\n- Add support for
  GHC 9.6 and `transformers` 0.6.\n\n- The `One` and `Many` pattern synonyms are now
  `OneTy` and `ManyTy`.\n\n- Use `mkInvisFunTy`/`mkInvisFunTys` instead of `mkInvisFunTyMany`/`mkInvisFunTysMany`.\n\n#
  Version 0.8.3.0 (2022-10-05)\n\n- Bugfix for the GHC 9.0 rewriter plugin compatibility
  shim:\n  fix coercion orientations in family application cache\n\n# Version 0.8.2.0
  (2022-10-05)\n\n- Bugfix for the GHC 9.0 rewriter plugin compatibility shim:\n  fix
  coercion orientations in family rewriting.\n\n# Version 0.8.1.0 (2022-10-05)\n\n-
  Bugfix for the GHC 9.2 rewriter plugin compatibility shim:\n  fix coercion orientations
  in family rewriting.\n\n# Version 0.8.0.0 (2022-07-07)\n\n- Compatibility for GHC
  9.4.\n\n- Change API for `lookupImportedModule` to use `PkgQual` and `UnitId`\n
  \ instead of `Maybe FastString`, with back-compatibility function `pkgQual_pkg`\n
  \ for use with older module lookup functions.\n\n- Re-export `splitAppTys` and `unpackFS`.\n\n#
  Version 0.7.1.0 (2022-01-04)\n\n- `newWanted` now always uses the `CtLoc` information
  that it is provided with,\n  as opposed to obtaining some information from the monadic
  environment.\n  This means you no longer need to wrap calls to `newWanted` in `setCtLocM`\n
  \ to ensure that GHC reports the correct source span when reporting unsolved\n  Wanteds
  in error messages.\n\n- Remove the `newDerived` function, as Derived constraints
  are going to be\n  removed from GHC.\n\n# Version 0.7.0.0 (2021-12-31)\n\n- Re-export
  functions for dealing with type-level literals,\n  such as `mkNumLitTy` and `isStrLitTy`.\n\n-
  Re-export functions for splitting apart type applications, such as\n  `splitAppTy_maybe`
  and `tyConAppTyCon_maybe`.\n\n- Redefine and re-export `mkUncheckedIntExpr` for
  GHC versions prior to 9.0.\n\n- Re-export some basic types from `GHC.Types.Basic`
  such as `Arity`,\n  `PromotionFlag` and `Boxity`.\n\n- Re-export `GHC.Builtin.Names`
  and `GHC.Builin.Types.Prim`.\n\n- Provide `MonadThings` instances for `TcPluginM`
  monads.\n\n# Version 0.6.1.0 (2021-12-13)\n\n- Re-export various useful types and
  functions to deal with type and coercion variables.\n\n- Re-export a few types and
  functions to deal with source locations.\n\n- Remove some re-exports for constructing
  function types, as not all functions make sense\n  across all GHC versions supported
  by the library.\n\n- Re-export `panic` and `pprPanic`.\n\n# Version 0.6.0.0 (2021-12-13)\n\n-
  Add support for GHC 8.8.\n\n- Re-export `evDataConApp`, which is useful for constructing
  typeclass dictionaries.\n\n# Version 0.5.1.0 (2021-08-31)\n\n- Fix a bug in the
  type-family rewriting compatibility layer (GHC 8.10, 9.0, 9.2)\n  by correctly downgrading
  the coercion used to cast the evidence, when necessary.\n\n# Version 0.5.0.0 (2021-08-30)\n\n-
  Re-export some additional types and functions that are useful for inspecting\n  and
  constructing evidence terms, such as `mkTyVar`, `newName`, `mkLocalId`, `lookupEvBind`...\n\n#
  Version 0.4.1.0 (2021-08-24)\n\n- Re-export a few GHC modules, such as GHC.Core.Make
  and GHC.Plugins.\n  These re-exports might be changed to be more selective in the
  future\n  to aid cross-version compatibility.\n\n# Version 0.4.0.0 (2021-08-24)\n\n-
  Adapt to GHC 9.4 changes in the `TcPluginSolveResult` datatype:\n  are now able
  to solve and emit constraints even when reporting\n  a contradiction. This can help
  with error messages.\n  Unfortunately these extra constraints will be dropped in
  versions\n  of GHC prior to 9.4.\n\n- Add a utility module for name resolution using
  constrained traversals.\n\n- Add compatibility for GHC 8.10.\n\n# Version 0.3.1.0
  (2021-08-09)\n\nEnsure that the coercions stored in `Reduction`s are always\noriented
  left-to-right, by making the internal rewriting compatibility layer\nalso use left-to-right
  coercions.\n\n# Version 0.3.0.0 (2021-08-04)\n\nAccount for changes in rewriting
  in GHC 9.4:\n\n  - rewriter plugins can no longer emit new Wanted constraints\n
  \   if they don't rewrite the type family application;\n  - coercions in the rewriter
  are now oriented left-to-right,\n    requiring `mkTyFamAppReduction` to be adapted.\n\n#
  Version 0.2.0.0 (2021-07-22)\n\nInitial release on Hackage.\n"
changelog-type: markdown
description: |-
  This library provides a streamlined monadic interface
  for writing GHC type-checking plugins.

  Each stage in a type-checking plugin (initialisation, solving, rewriting,
  post-tc) has a corresponding monad, preventing operations that are only
  allowed in some stages to be used in the other stages.
  Operations that work across multiple stages are overloaded across monads
  using MTL-like typeclasses.

  Some operations, like creating evidence for constraints or creating
  custom type error messages, are also simplified.

  Please refer to the <https://github.com/sheaf/ghc-tcplugin-api associated GitHub repository>
  for example usage.
