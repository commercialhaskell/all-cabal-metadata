description: "# bluefin-postgresql\n\nThis package provides `bluefin` effects for
  [postgresql-simple](https://hackage.haskell.org/package/postgresql-simple)'s `Connection`
  type.\n\nIt defines:\n- a dynamic `WithConnection` effect to allow effectful functions
  to use a `Connection`, without worrying about where that `Connection` comes from.\n-
  a dynamic `PostgreSQL` effect ro run database operations from `postgresql-simple`.\n\nFor
  a higher-level effect library using [Opaleye](https://hackage.haskell.org/package/opaleye),
  see [bluefin-opaleye](https://github.com/fpringle/bluefin-postgresql/blob/main/bluefin-opaleye#readme).\n\n##
  Effectful functions\n\nIn the `WithConnection` effect we can always request a `Connection`
  and use it as we normally\nwould:\n\n```haskell\nimport Bluefin.PostgreSQL as BP\nimport
  qualified Database.PostgreSQL.Simple as PSQL\n\ninsertAndList ::\n  (e :> es, e1
  :> es) =>\n  WithConnection e ->\n  IOE e1 ->\n  Eff es [User]\ninsertAndList wc
  ioe = BP.withConnection wc $ \\conn -> do\n  effIO ioe $ PSQL.execute conn \"insert
  into users (first_name) values (?)\" [\"Nuala\"]\n  effIO ioe $ PSQL.query conn
  \"select * from users where first_name in ?\" $ PSQL.Only $ PSQL.In [\"Anna\", \"Boris\",
  \"Carla\"]\n```\n\nThe `PostgreSQL` effect lets us completely forget about `Connection`
  and rewrite the above to:\n\n```haskell\n\nimport Bluefin.PostgreSQL\n\ninsertAndList
  ::\n  (e :> es) =>\n  PostgreSQL e ->\n  Eff es [User]\ninsertAndList psql = do\n
  \ BP.execute psql \"insert into users (first_name) values (?)\" [\"Nuala\"]\n  BP.query
  psql \"select * from users where first_name in ?\" $ PSQL.Only $ PSQL.In [\"Anna\",
  \"Boris\", \"Carla\"]\n```\n\nThe same goes for other functions:\n\n```haskell\n--
  use a transaction\ninsertAndListCarefully ::\n  (e :> es) =>\n  PostgreSQL e ->\n
  \ Eff es [User]\ninsertAndListCarefully psql = BP.withTransaction psql $ insertAndList
  psql\n\n-- stream + fold over results (in Eff)\ncountUsersIneffeciently ::\n  (e
  :> es, e1 :> es) =>\n  PostgreSQL e ->\n  IOE e1 ->\n  Eff es Int\ncountUsersIneffeciently
  psql ioe =\n  BP.fold_ psql \"select * from users\" 0 $ \\acc (row :: User) -> do\n
  \   effIO ioe . putStrLn $ \"User: \" <> show row\n    pure $ acc + 1\n```\n\n##
  Interpreters\n\nIn order to discharge the `PostgreSQL` effect we use the `WithConnection`
  effect:\n\n```haskell\ndischargePostgreSQL :: (e :> es, e1 :> es) => WithConnection
  e -> IOE e1 -> Eff es [User]\ndischargePostgreSQL withConn ioe =\n  runPostgreSQL
  withConn ioe $ \\psql -> insertAndListCarefully psql\n```\n\nAlternatively we can
  use the OpenTelemetry support provided by [hs-opentelemetry-instrumentation-postgresql-simple](https://hackage-content.haskell.org/package/hs-opentelemetry-instrumentation-postgresql-simple/docs/OpenTelemetry-Instrumentation-PostgresqlSimple.html)
  (note that this requires enabling the `enable-opentel` cabal flag):\n\n```haskell\ndischargePostgreSQLUsingOpenTelemetry
  :: (e :> es, e1 :> es) => WithConnection e -> IOE e1 -> Eff es [User]\ndischargePostgreSQLUsingOpenTelemetry
  withConn ioe =\n  runPostgreSQLOT withConn ioe $ \\psql -> insertAndListCarefully
  psql\n```\n\nThe simplest way of running the `WithConnection` effect is by just
  providing a `Connection`, which we can get in the normal ways:\n\n```haskell\nimport
  Bluefin.PostgreSQL as BP\nimport qualified Database.PostgreSQL.Simple as PSQL\n\nusingConnection
  :: IO ()\nusingConnection =\n  runEff $ \\ioe ->\n    bracket (effIO ioe $ PSQL.connectPostgreSQL
  \"\") (effIO ioe . PSQL.close) $ \\conn ->\n      BP.runWithConnection conn $ \\wc
  -> \n        BP.runPostgreSQL wc ioe $ \\psql -> \n          insertAndListCarefully
  wc ioe >>= effIO ioe . print\n\nusingConnectInfo :: IO ()\nusingConnectInfo =\n
  \ runEff $ \\ioe ->\n    BP.runWithConnectInfo ioe PSQL.defaultConnectInfo $ \\wc
  ->\n      BP.runPostgreSQL wc ioe $ \\psql -> \n        insertAndListCarefully psql
  >>= effIO ioe . print\n```\n\nAlternatively, we can use a connection pool (from
  [resource-pool](https://hackage.haskell.org/package/resource-pool)\nand [unliftio-pool](https://hackage.haskell.org/package/unliftio-pool)),
  which is much better suited to\nlong-running processes like servers.\n\n```haskell\nimport
  Bluefin.PostgreSQL as BP\nimport qualified Database.PostgreSQL.Simple as PSQL\nimport
  qualified UnliftIO.Pool as P\n\nusingConnectionPool :: IO ()\nusingConnectionPool
  = do\n  poolCfg <- P.mkDefaultPoolConfig (PSQL.connectPostgreSQL \"\") PSQL.close
  5.0 10\n  pool <- P.newPool poolCfg\n  runEff $ \\ioe ->\n    BP.runWithConnectionPool
  ioe pool $ \\wc ->\n      insertAndListCarefully wc ioe >>= effIO ioe . print\n```\n"
