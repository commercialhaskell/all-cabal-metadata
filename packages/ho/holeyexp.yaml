changelog: "# Changelog for `holeyexp`\n\nAll notable changes to this project will
  be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand
  this project adheres to the\n[Haskell Package Versioning Policy](https://pvp.haskell.org/).\n\n##
  Unreleased\n## [0.3.0.1] - 2026-09-04\n### Changed\n    - We migrated to the hole
  syntax `$i(f)` from `$i{f}`, but we forgot to \n      migrate the parser combinators.\n\n##
  [0.3.0.0] - 2026-09-02\n### Changed\n    - Now builds with GHC 9.8.4. This required
  the removal of the \n      TypeApplications extension in the Test.QuickCheck.HExp.
  In order to \n      continue building we had to add new constraints to the genHExpNat,
  \n      genHExp, and the Arbitrary instance for HExp.\n\n## [0.2.0.0] - 2026-08-28\n###
  Added\n    - New documentation and complete Haddock docs on all definitions.\n    -
  New cabal package.\n### Changed\n    - Better naming of combinators. \n           -
  Data.HoleyExp.HExp.empty is now emptyExp\n           - Data.HoleyExp.HExp.hole is
  now empty           \n           - Data.HoleyExp.HExp.plugHole is now plug\n           -
  Data.HoleyExp.HExp.fillHole is now update\n           - Data.HoleyExp.HExp.placeInHole
  is now place\n    - Moved template haskell and JSON out of this package and into
  their own packages.\n\n## [0.1.0.0] - 2026-08-14\n    - First complete implementation."
changelog-type: markdown
description: |-
  # Holey Expression

  [![License BSD-3](https://img.shields.io/badge/license-BSD3-brightgreen.svg)](http://opensource.org/licenses/BSD-3-Clause)

  * [Documentation](#documentation)

  Holey expressions correspond to a monoid with two kinds of elements: i. chunks
  and ii. holes. The former correspond to chunks of "text" which we leave
  abstract, and the latter correspond to placeholders for values that will
  eventually be translated into "text".

  # Documentation

  The API is well documented. Please see [hackage] for the complete documentation.

  [hackage]: https://hackage.haskell.org/package/holeyexp
