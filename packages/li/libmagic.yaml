changelog: |
  haskell-libmagic (1.3) unstable; urgency=medium

    * Use ByteString for magic results, rather than String
    * Small improvements to documentation.
    * Improved use of Coercion

   -- Joey Hess <id@joeyh.name>  Mon, 26 Oct 2026 12:06:27 -0400

  haskell-libmagic (1.2) unstable; urgency=medium

    * Initial release, forked from John Goerzen's magic package.
    * Don't use unsafe FFI calls for blocking I/O
      (thanks, Niklas Hambüchen)
    * Made the Magic handle thread safe.
    * magicLoad takes a list of paths.
    * Convert from FilePath to OsPath.
    * Remove magicCompile.

   -- Joey Hess <id@joeyh.name>  Mon, 26 Oct 2026 10:02:59 -0400
changelog-type: text
description: |-
  This package provides a Haskell interface to the C libmagic library.
  With it, you can determine the type of a file by examining its contents
  rather than its name.  The Haskell interface provides a full-featured
  binding.
