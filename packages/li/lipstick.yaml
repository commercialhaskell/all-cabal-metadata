changelog: |
  # Revision history for lipstick

  ## [0.1.0.0] - 2026-11-09

  First version: a port of lipgloss v2.

  * Styles as optparse-applicative-style modifiers (`Mod`): text attributes,
    padding and margins (with fill characters), borders (presets, per-side
    colours, gradients), width and height, alignment, wrapping or truncation,
    inline rendering, tab width, `transform`, unset modifiers and getters.
    Text attributes work on every kind of thing, and `maxWidth`/`maxHeight`
    on every kind but `Inline` text.
  * Blocks: rendering to a structured block of styled spans, joining, placing,
    framing and measuring; ANSI only on output.
  * Inline text with nested styles, `fromAnsi` for text with escape sequences,
    `breakAfter` for extra break characters, `styleRanges` and `styleIndices`.
  * Blocks are laid out in the width they are given: text wraps to fit,
    `fillWidth` / `grow` share out spare columns, `stretchHeight` matches the
    height of a row, and the `RenderEnv` carries the output's width.
  * Unicode 16.0.0 grapheme clusters (UAX #29) and East Asian Width, from
    tables generated by `scripts/GenUnicodeTable.hs`.
  * Tables: cells are blocks; header, column and row rules, cell styles by
    position, fitting a width, height with scrolling, truncation.
  * Text settings (alignment, wrapping, break characters, tab width,
    transform, inline) are inherited by the text inside a framed block.
  * Lists and trees (`Outline`): enumerators, indenters, item, enumerator and
    indenter styles, width, item offsets.
  * Layers: offsets, z-order, `transparent` layers, sublayers, hit testing.
  * `Lipstick.Grid`: the laid-out lines, cells and styled spans of a block,
    for other outputs.
  * Colours: hex and palette literals, light/dark and per-profile colours,
    downsampling, `blend`, `blend2D`, `darken`, `lighten`, `complementary`.
  * Output: colour profile detection (`NO_COLOR`, `CLICOLOR_FORCE`,
    `COLORTERM`, `TERM`), ANSI processing on Windows, background detection
    from `COLORFGBG` or by asking the terminal, hyperlinks.
changelog-type: markdown
description: "# lipstick\n\nStyle definitions for nice terminal layouts, in Haskell.
  lipstick is a port\nof [lipgloss](https://github.com/charmbracelet/lipgloss) (v2)
  for\ncommand-line programs: colours, borders, padding, alignment, tables, lists,\ntrees
  and layered compositions, rendered to text with ANSI escape sequences.\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\nimport Lipstick\n\ncard :: Mod Style\ncard =\n  bold\n
  \   <> fg \"#FAFAFA\"\n    <> bg \"#7D56F4\"\n    <> padding 1 4\n    <> width 24\n
  \   <> border roundedBorder\n    <> borderFg \"#874BFD\"\n\nmain :: IO ()\nmain
  = putBlock (render card \"Hello, kitty\")\n```\n\n![A purple card with a rounded
  border saying \"Hello, kitty\"](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/quickstart.svg)\n\nlipstick
  is on Hackage and builds with GHC 9.10, 9.12 and 9.14. Add it to\nthe `build-depends`
  of your package:\n\n```\nbuild-depends: lipstick ^>=0.1\n```\n\nFor brick and vty
  applications, add\n[`lipstick-brick`](https://hackage.haskell.org/package/lipstick-brick)
  too.\n\nThe examples import `Lipstick` whole and use `OverloadedStrings`; the table\nexample
  also uses `LambdaCase` (part of GHC2024), the layers example\n`import Data.Text
  qualified as T`, and the output example\n`import System.IO (stdout)`. Some of lipstick's
  names (`bold`, `fg`,\n`border`, `center`, `text`, `render`, `width`, the colour
  names) are also\nexported by brick, vty, colour or prettyprinter; programs that
  use those\ntoo can `import Lipstick qualified as L`.\n\n## Styles are modifiers\n\nA
  `Mod Style` is a modifier, in the same sense as optparse-applicative's\n`Mod`: modifiers
  form a monoid and later settings win, so styles are built\nand extended with `<>`.\n\n```haskell\nwarning
  :: Mod Style\nwarning = card <> bg \"#F25D94\"\n```\n\nText attributes (`fg`, `bg`,
  `bold`, `underline`, `link`, …) apply to\nevery kind of thing lipstick draws, not
  just styles, so the same modifier\nworks everywhere:\n\n```haskell\nbase :: Mod
  f\nbase = fg red <> bold\n\nrender base \"text\"            -- a styled box\ntable
  base headers rows       -- the base style of a table\nlist base items               --
  the base style of a list\n```\n\nOther modifiers apply to the things that have the
  corresponding part:\n`padding` and `margin` to styles, `border` to styles and tables,
  `width` to\nstyles, tables, lists, trees and placed blocks, `align` to styles and
  placed\nblocks, and the `maxWidth` / `maxHeight` crop to everything but `styled`\ntext.
  A modifier on something that does not support it is a type error.\n\nThe sizes mean
  the same for everything that has them. With `width n`, a\nthing is `n` columns wide
  when there is room, and with less it shrinks like\nany other. `height n` is the
  least number of lines. For a style, `width`\nand `height` include padding and border
  but not margins, as in lipgloss.\n`maxWidth` and `maxHeight` crop the whole result,
  a style's margins\nincluded, to at most that many columns or lines; with `maxHeight`,
  a table\nleaves out body rows instead. With a width, text is word-wrapped to fit,
  or\ncut with an ellipsis with `noWrap`.\n\n## Blocks and layout\n\n`render` returns
  a `Block`: a rectangle of styled text, which gets its width\nonly when it is laid
  out.\n\n```haskell\njoinHorizontal center\n  [ render card \"Hello, kitty\"\n  ,
  render (warning <> marginLeft 2) \"Later settings win\"\n  ]\n```\n\n![Two cards
  side by side, purple and pink, centred vertically](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/layout.svg)\n\n```haskell\nplace\n
  \ (width 30 <> height 3 <> align center <> valign center <> whitespaceChars \"·\"
  <> fg \"#383838\")\n  (render (bold <> fg \"#F25D94\") \"centred\")\n```\n\n![The
  word \"centred\" in the middle of an area filled with dots](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/place.svg)\n\n`frame`
  puts an existing block in a box: `render style text` is\n`frame style (fromInline
  text)`. A style's text settings (`align`,\n`noWrap`, `breakAfter`, `tabWidth`, `transform`,
  `inline`) apply, like its\ncolours, to all the text inside what it frames, unless
  something nearer\nsets them again. `hcat` / `joinHorizontal` put blocks side by
  side and\n`vcat` / `joinVertical` stack them.\n\nText in a block wraps to the width
  the block is laid out in. `fillWidth`\n(or `grow n`, for a weighted share) makes
  a block take the spare columns of\nits row, and `stretchHeight` makes it as tall
  as the tallest block next to\nit. The output functions lay blocks out in the `RenderEnv`'s
  width (with\n`Nothing`, at their natural width); `layout` does it explicitly.\n\n##
  Text\n\nText with several styles is `Inline`, built with `styled` and `<>`. Styles\nnest:
  the attributes of the enclosing style show through wherever the inner\nones do not
  set them.\n\n```haskell\nrender\n  (width 30 <> border normalBorder <> borderFg
  \"#874BFD\" <> padding 0 1)\n  (styled (bold <> fg \"#F25D94\") \"Error: \" <> \"the
  file \" <> styled italic \"notes.txt\" <> \" was not found\")\n```\n\n![A bordered
  message with a bold pink \"Error:\" and an italic file name, wrapped to two lines](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/text.svg)\n\nOutput
  from other programs that already contains escape sequences goes\nthrough `fromAnsi`,
  which keeps colours, attributes and hyperlinks and drops\neverything else:\n\n```haskell\nrender
  (border roundedBorder) (fromAnsi \"\\ESC[1;32mok\\ESC[0m 3 tests passed\")\n```\n\nAlso:
  `breakAfter` (wrap after extra characters such as `-`),\n`styleRanges` and `styleIndices`
  (highlight columns or characters of\nexisting text, e.g. fuzzy-search matches),
  `transform`, `ansiWidth`.\n\nWidths follow the Unicode 16.0.0 grapheme cluster rules
  (the official\nconformance tests pass) and East Asian Width, so CJK text, emoji,
  flags and\ncombining marks line up.\n\n## Tables\n\n```haskell\ntable\n  ( borderFg
  \"#874BFD\"\n      <> headerStyle (bold <> fg \"#F25D94\" <> align center)\n      <>
  cellStyle (\\case BodyCell r _ | odd r -> padding 0 1 <> faint; _ -> padding 0 1)\n
  \ )\n  [\"Language\", \"Formal\", \"Informal\"]\n  [ [\"Chinese\", \"您好\", \"你好\"]\n
  \ , [\"Japanese\", \"こんにちは\", \"やあ\"]\n  , [\"Russian\", \"Здравствуйте\", \"Привет\"]\n
  \ ]\n```\n\n![A table of greetings in Chinese, Japanese and Russian with a purple
  border; the columns line up across the CJK text](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/table.svg)\n\nCells
  are blocks, so they can hold lists, other tables or anything else.\nA table fits
  the width it is laid out in: columns shrink, wrapping their\ncells, widest first
  but without breaking a word while another column can\nstill wrap (headers are cut
  short instead), and with `fillWidth` they grow\nto fill it. With a `width`, columns
  shrink or grow to fit that instead;\n`fitContent` makes the width a maximum. With
  a `maxHeight`, the body rows\nthat do not fit are left out, with a row of `…` in
  their place where it\nfits, `yOffset` scrolls, and `visibleRows` tells which rows
  are shown; a\n`height` adds empty rows up to it. `headerRule`, `columnRules`, `rowRules`\nand
  the `border*` modifiers choose which lines are drawn.\n\n## Lists and trees\n\nTrees
  take a `Data.Tree`; items are blocks, so anything can go in them,\ntables included.\n\n```haskell\ntree\n
  \ (enumerator roundedTreeEnumerator <> enumeratorStyle (fg \"#874BFD\") <> rootStyle
  (fg \"#F25D94\"))\n  (Node \".\" [Node \"macOS\" [], Node \"Linux\" [Node \"NixOS\"
  [], Node \"Arch\" []], Node \"BSD\" []])\n\nnestedList\n  (enumerator (byDepth (\\depth
  -> if depth == 0 then roman else bullet)) <> enumeratorStyle (fg \"#F25D94\"))\n
  \ [Node \"Glossier\" [Node \"Cloud Paint\" [], Node \"Boy Brow\" []], Node \"Nyx\"
  []]\n```\n\n![A tree of operating systems with rounded purple branches, next to
  a list numbered with roman numerals and nested bullets](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/outlines.svg)\n\nThe
  enumerators are `treeEnumerator`, `roundedTreeEnumerator`, `bullet`,\n`dash`, `asterisk`,
  `arabic`, `alphabet` and `roman`, or your own, made\nwith `markers`. Items, enumerators
  and indentation are styled separately,\nby position if needed. Items wrap in the
  width left after their\nindentation.\n\n## Layers\n\nBlocks can be stacked at any
  position, for dialogs, overlays and the like.\n`layerAt` finds the named layer under
  a point, for mouse handling.\n\n```haskell\ncompose\n  [ layer (fg \"#383838\")
  (text (T.intercalate \"\\n\" (replicate 6 (T.replicate 34 \"╱\"))))\n  , layer (offset
  7 2 <> zIndex 1) (render (bg \"#0A0A0A\" <> width 22 <> height 3) \"\")\n  , layer\n
  \     (offset 5 1 <> zIndex 2 <> layerId \"dialog\")\n      (render (border roundedBorder
  <> borderFg \"#F25D94\" <> bg \"#3C3C3C\" <> padding 0 2 <> width 22 <> align center)
  \"Really quit?\")\n  ]\n```\n\n![A dialog saying \"Really quit?\" with a drop shadow,
  over a hatched background](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/layers.svg)\n\n##
  Colours\n\nColours are written as `\"#7D56F4\"`, `\"#fa0\"`, palette indices (`\"201\"`,\n`\"5\"`)
  or names (`red`, `brightBlue`, …). Adaptive colours are resolved only\nwhen printing:\n\n-
  `lightDark light dark` picks by the terminal background;\n- `complete trueColor
  color256 color16` picks by what the terminal supports.\n\n`blend` and `blend2D`
  make gradients, `darken`, `lighten` and `complementary`\nadjust colours; they work
  in the OkLab colour space. `borderFgBlend` draws a\ngradient around a border.\n\n```haskell\nvcat\n
  \ [ hcat [render (bg c) \"  \" | c <- blend 24 [\"#7D56F4\", \"#F25D94\", \"#FAD45A\"]]\n
  \ , text \"\"\n  , render\n      (border roundedBorder <> borderFgBlend [\"#7D56F4\",
  \"#F25D94\", \"#FAD45A\"] <> padding 1 4)\n      ( styled (fg (darken 0.4 \"#F25D94\"))
  \"darker \"\n          <> styled (fg \"#F25D94\") \"pink \"\n          <> styled
  (fg (lighten 0.4 \"#F25D94\")) \"lighter\"\n      )\n  ]\n```\n\n![A purple-to-pink-to-yellow
  gradient, and a box with a gradient border containing darker, normal and lighter
  pink text](https://raw.githubusercontent.com/andreabedini/lipstick/main/docs/images/colours.svg)\n\n##
  Output\n\n`putBlock` and `hPutBlock` print a block, reducing colours to what the\noutput
  supports. Detection follows the usual conventions: no escape\nsequences when the
  output is not a terminal (unless `CLICOLOR_FORCE` is\nset to anything but `0`),
  no colours with `NO_COLOR`, and the colour depth\nfrom `COLORTERM` and `TERM`. On
  Windows the console's ANSI processing is\nswitched on as needed. Blocks are laid
  out in `COLUMNS` if it is set to a\npositive number, even when the output is not
  a terminal, or else in the\nterminal's width; output that is not going to a terminal
  otherwise keeps\nits natural width.\n\nThe background is taken from `COLORFGBG`
  when the terminal sets it and is\nassumed dark otherwise. To ask the terminal, which
  takes a round trip and\nreads from stdin, detect once and keep the result:\n\n```haskell\nmain
  = do\n  env <- detectEnvQuery stdout\n  hPutBlockWith env stdout (render card \"Hello\")\n```\n\n`toAnsi
  env block` gives the text without printing it, and `renderPlain`\ngives it without
  any escape sequences.\n\n## brick and vty\n\n[`lipstick-brick`](https://hackage.haskell.org/package/lipstick-brick)\nshows
  blocks in brick and vty applications. It uses only the public API:\n`Lipstick.Grid`
  gives the laid-out lines, cells and styled spans of a\nblock, so blocks can be shown
  in other outputs too.\n\n## How lipstick differs from lipgloss\n\nlipgloss renders
  to strings with escape sequences in them, and measures and\njoins them by parsing
  those sequences again. lipstick renders to blocks of\nstyled spans and produces
  escape sequences only when printing. Layout never\nparses an escape sequence, and
  adaptive colours are resolved for the actual\nterminal when printing.\n\nlipgloss
  is where lipstick started, not a compatibility target: where a\nclearer rule exists,
  lipstick follows it. Notable differences:\n\n- Nested styles keep the outer style.
  In lipgloss the outer style wraps the\n  line once, so a reset at the end of nested
  styled text ends it for the\n  rest of the line.\n- The text attributes of any thing
  are the base for everything it draws:\n  for a table they are lipgloss's `BaseStyle`,
  and for `place` they apply to\n  the placed block as well as to the whitespace.\n-
  Lists and trees are both `Outline`s (`Mod Tree` would clash with\n  `Data.Tree`).\n-
  Blocks are laid out in the width they are given, so text and tables\n  reflow without
  explicit widths.\n- Table columns shrink as CSS tables do: not below their longest
  word while\n  another column can still wrap. lipgloss shrinks columns by their median\n
  \ cell width and may break words that did not need breaking.\n- An emoji with a
  skin tone modifier is two columns wide even when the\n  emoji alone is one, as in
  `☝\U0001F3FB` (UTS #51). lipgloss measures it by its\n  first character, one column.\n\nNot
  ported: `Alpha` (terminals cannot show transparency), the Windows\nbuild-number
  check (lipstick asks the console to switch on ANSI processing,\nand prints plain
  text where it cannot), and Go-specific API such as\n`SetString`, `Copy`, `WrapWriter`
  and the table data interfaces, which\nplain values and lists cover.\n\n## Compared
  with layoutz\n\nI did not know about [layoutz](https://hackage.haskell.org/package/layoutz)\nwhile
  writing lipstick, and came across it only when preparing the first\nrelease. It
  is another Haskell library for terminal output, and it does a\nlot that lipstick
  does not: charts (bars, sparklines, braille line and pie\nplots, heatmaps), spinners
  and progress bars, inline images for kitty,\ninteractive prompts and a small Elm-style
  application runtime, all in one\nmodule with only boot-package dependencies. For
  a quick dashboard or an\nanimated script, it is worth a look.\n\nThe two are built
  differently. layoutz renders each element to a `String`\nwith escape sequences in
  it and measures it again by stripping them;\nlipstick renders to blocks of styled
  cells and produces escape sequences\nonly when printing. From the source of layoutz
  0.4.0.0:\n\n|                        | layoutz                                                          |
  lipstick                                                    |\n| ----------------------
  | ---------------------------------------------------------------- | -----------------------------------------------------------
  |\n| Width of text          | a list of wide ranges: CJK lines up, emoji sequences
  and flags do not | Unicode grapheme clusters and East Asian Width          |\n|
  Colours                | foreground only, in 16, 256 or 24-bit colour                     |
  foreground, background and underline; light/dark and per-profile colours; gradients
  |\n| Terminal support       | always prints escape sequences                                   |
  `NO_COLOR`, `CLICOLOR_FORCE`, `COLORTERM`, `TERM`; colours reduced to what the output
  shows |\n| Nested styles          | an inner style ends the outer one                                |
  the outer style shows through                               |\n| Layout                 |
  as wide as the content; wrapping at a given width                | laid out in the
  width available: text wraps, tables shrink their columns |\n| Tables                 |
  columns as wide as their widest cell                             | columns that
  shrink and grow, styles by cell, scrolling     |\n| Placing and layers     | no
  \                                                              | `place`, `compose`,
  hit testing                             |\n| Existing ANSI text, hyperlinks | no
  \                                                      | `fromAnsi`, `link`                                          |\n|
  Charts, spinners, prompts, application loop | yes                                         |
  no; for full-screen applications, brick through lipstick-brick |\n\n## Documentation\n\nThe
  API documentation of the latest release is at\n<https://andreabedini.github.io/lipstick/>.\n\nEach
  [release](https://github.com/andreabedini/lipstick/releases) also has the\ndocumentation
  of every package with a library, as\n`PACKAGE-VERSION-docs.tar.gz`, in the format
  Hackage takes.\n\n## Development\n\nSee\n[CONTRIBUTING.md](https://github.com/andreabedini/lipstick/blob/main/CONTRIBUTING.md)\nfor
  building, testing, commit messages and releases.\n\n## Licence\n\nMIT, see [LICENSE](https://github.com/andreabedini/lipstick/blob/main/LICENSE).
  lipstick is a port of\n[lipgloss](https://github.com/charmbracelet/lipgloss), ©
  Charmbracelet,\nalso MIT licensed. The Unicode tables in\n`internal/Lipstick/Internal/UnicodeTable.hs`
  are generated from the Unicode\nCharacter Database, and `test/data/GraphemeBreakTest.txt`
  comes from it;\nboth are © Unicode, Inc., under the Unicode License v3, see\n[LICENSE.Unicode](https://github.com/andreabedini/lipstick/blob/main/LICENSE.Unicode).\n"
