description: "# libheif-hs\n\nA minimal Haskell library that decodes `.HEIC` files
  via \n[libheif](https://github.com/strukturag/libheif) C bindings.\n\nThis package
  is a standard Cabal project designed to integrate seamlessly with \n[Nix flakes](https://wiki.nixos.org/wiki/Flakes).
  \nIt currently exposes a core subset of the HEIF format's available data, with \nbuilt-in
  support for WebAssembly (`wasm32-wasi`) cross-compilation.\n\n## Usage\n\nThe flake
  outputs provide the following packages for each supported system:\n\n* `packages.default`:
  The natively compiled Cabal package.\n* `packages.wasm`: The WebAssembly cross-compiled
  Cabal package.\n\n*Note: If you are not using Nix, this functions as a standard
  Cabal package (see below).*\n\n## How to use the Cabal package without a flake shell\n\nSince
  some project dependencies (`hs-bindgen-runtime`) are not yet published to hackage,
  you \nmust add them them from `cabal.project` in this repository into your local
  `cabal.project` \nfile.\n\nYou'll also need the following libraries present in pkg-config
  compiled with at least the flags \nseen the flake:\n\n* kvazaar-2.3.2 (to encode
  HEIF)\n* libde265-1.1.1 (to decode HEIF)\n* libheif-1.23.1\n\n## Development\n\nThe
  repository provides two distinct Nix development shells depending on your target
  environment.\n\n**Native Development**\n\nFor standard system development (includes
  tooling support like Haskell Language Server):\n\n```bash\nnix develop .#default\ncabal
  test libheif-hs-test\n```\n\n**WebAssembly Development**\n\nFor wasm32-wasi cross-compilation
  testing:\n\n```bash\nnix develop .#wasm\nwasm-test libheif-hs-test\n```\n\n**Nix
  flake checking**\n\nFor testing that both output packages build correctly:\n\n```bash\nnix
  flake check\n```\n\n# Future work\n\n* Expanded API: expose more features of the
  underlying libheif interface.\n* Broader codec support: the dependent libheif is
  currently compiled only with HEIF format\n    support. Future versions might expose
  additional encode/decode formats supported by\n    libheif such as AVIF, VVC, JPEG,
  etc.\n"
