changelog: |
  1.3.0

  * Replace ormolu with fourmolu
  * Remove CPP, raise lens lower bound to >= 4.20
  * Move Data.Validation to Data.Validation.Validation, re-export from
    Data.Validation
  * Add ValidationMonadT monad transformer with short-circuiting
    Applicative, Bind, Monad, MonadError, MonadTrans, and related instances
  * Add Eq1, Eq2, Ord1, Ord2, Show1, Show2 instances for Validation
  * Add Generic1, Plus, Alternative, Bifoldable1, Bitraversable1, Assoc,
    Extend instances for Validation
  * Add four validator newtypes with different parameter orders:
    - Validator x err a (Bifunctor, accumulating Applicative)
    - ValidatorProfunctor err x a (Profunctor, accumulating Applicative)
    - ValidatorMonadT x err f a (Monad, MonadTrans, BindTrans)
    - ValidatorMonadProfunctorT err f x a (Profunctor, Monad, Category, Arrow)
  * Add cross-type optics instances between all four validator newtypes
  * Add classy optics (Get/Has/Review/As) for all new types
  * Add Wrapped/Rewrapped instances for all new types
  * Add validationMonad isomorphism between Validation and ValidationMonad
  * Remove Validator profunctor transformer (replaced by above newtypes)
  * Remove ReifiedIso', ReifiedPrism' profunctor wrappers
  * Remove examples/ subdirectory
  * Drop support for GHC < 9.6
  * Add 728 doctests across all modules
  * Remove unused profunctors and tagged dependencies from test suite

  1.2.2

  * Implement Either instances for ReviewFailure, AsFailure, ReviewSuccess,
    and AsSuccess
  * Add hedgehog property tests for Either optic instances

  1.2.1

  * Updates to documentation.

  1.2.0

  * Add Validator e p x a profunctor transformer newtype with instances
    for Functor, Apply, Applicative, Alt, Selective, Profunctor, Strong,
    Choice, Semigroupoid, Category, Arrow, ArrowChoice, ArrowApply, and
    Wrapped/Rewrapped
  * Add classy optics for Validator (GetValidator, HasValidator,
    ReviewValidator, AsValidator)
  * Add profunctor newtypes Iso'' and Prism'' for wrapping monomorphic
    optics as two-parameter profunctors
  * Add unitValidator, taggedValidator, and swapValidator isomorphisms
  * Add nonEmptyList example validators using Iso'' and Prism''
  * Add tagged package dependency
  * Expand hedgehog property tests from 4 to 35 covering semigroup,
    monoid, functor, applicative, apply, alt, bifunctor, foldValidation,
    iso/prism roundtrips, swap, and all Validator instances
  * Replace HUnit tests with doctest suite (187 examples)
  * Add tests: True to cabal.project
  * Update examples for current API (remove Validate class, use either iso)
  * Hide Prelude.either to avoid ambiguity with Data.Validation.either

  1.1.5

  * Update version bounds

  1.1.4

  * Remove nix build
  * Add `Selective` instance

  1.1.3

  * Fix CI for older GHC

  1.1.2

  * Drop support for GHC-7.8.*, GHC-7.6.*, GHC-7.4.*, and GHC-7.2.*
  * Adjust lower bounds of most dependencies to be inline with the lowest supported GHC version of 7.10.3

  1.1.1

  * Add `Data.Bifunctor.Swap.Swap` instance from `swap`
  * Support `lens ^>= 5`

  1.1

  * Generalise types of `validate` and `ensure` functions to use `Maybe` instead of `Bool`

  1

  * Rename `AccValidation` to `Validation`

  0.6.3

  * Add `Generic` and `NFData` instances
  * Make AccValidation Apply and Applicative lazier

  0.6.2

  * Add `bindValidation` and `validationed`

  0.6.1

  * Add validate, validationnel, fromEither, liftError, validation, toEither, orElse, valueOr, ensure, codiagonal, revalidate

  0.6.0

  * Delete `Validation`, `ValidationB`, `ValidationT`, `Validation'`
  * Remove `_Validation` member from `Validate` class

  0.5.5

  * Raise upper bounds on base.
  * Include nix build.

  0.5.4

  * remove redundant constraints.
  * add instance `Validate` for `ValidationB Identity`.

  0.5.3

  * Update `transformers` dependency to work with GHC8.

  0.5.2

  * Remove LANGUAGE Safe because won't build against lens-4.13 or higher otherwise.

  0.5.1

  * Update documentation

  0.5.0

  * Export the `ValidationB` (formerly `ValidationTB`) data type.
  * Renamed `ValidationTB` to `ValidationB`.
  * Add upper-bounds on some dependencies.
  * Move repository to https://github.com/NICTA/validation.
  * Add README.
  * Update copyright notice for 2015.

  0.4.3

  * Rename `ValidationT` to `ValidationTB`
  * Introduce `ValidationT` with `MonadTrans` instance

  0.4.2

  * Export constructors on `AccValidation` and `Validation`.

  0.4.1

  * Remove `Alternative` instances. They are obscene.
  * INLINE pragmas

  0.4.0

  * Change the premise of the `Validate` type-class to more strongly reflect the isomorphism to Either.
  * The `_Failure` and `_Success` prisms are now derived.
  * Lots more examples

  0.3.0

  A restructuring of 0.2.x where:

  * Tests updated to use doctest
  * Update API to use Prism and Iso (Control.Lens)
  * Rename package Validation (deprecated) to validation

  0.3.1

  Use Safe Haskell pragma

  0.3.2

  Implement Validate on Either

  0.3.3

  Provide Isos between (ValidationT Identity) and other data types.

  0.3.4

  Loosen the type of the Isos for polymorphic update.
changelog-type: text
description: |-
  <<https://logo.systemf.com.au/systemf-450x450.png>>

  A data type like @Either@ but with an accumulating @Applicative@ instance.

  == @Validation@

  The @Validation@ data type is isomorphic to @Either@, but has an instance
  of @Applicative@ that accumulates on the error side. That is to say, if two
  (or more) errors are encountered, they are appended using a @Semigroup@
  operation.

  As a consequence of this @Applicative@ instance, there is no corresponding
  @Bind@ or @Monad@ instance. @Validation@ is an example of, "An applicative
  functor that is not a monad."

  The library provides:

  * Classy optics (@GetValidation@, @HasValidation@, @ReviewValidation@,
  @AsValidation@) following the conventions of @makeClassy@ and
  @makeClassyPrisms@ from @lens@.
  * Polymorphic prisms (@__Failure@, @__Success@) for type-changing operations.
  * Isomorphisms to @Either@ and @(Bool, a)@.

  == @ValidationMonadT@

  @ValidationMonadT err m a@ is a monad transformer wrapping @m (Validation err a)@.
  Unlike @Validation@, it has short-circuiting @Applicative@, @Bind@, @Monad@,
  and @MonadError@ instances.

  == Validators

  Four validator newtypes wrap a validation function with different type
  parameter orders, enabling different class instances:

  * @Validator x err a@ — @Bifunctor@, accumulating @Applicative@
  * @ValidatorProfunctor err x a@ — @Profunctor@, accumulating @Applicative@
  * @ValidatorMonadT x err f a@ — @Monad@, @MonadTrans@, @BindTrans@
  * @ValidatorMonadProfunctorT err f x a@ — @Profunctor@, @Monad@, @Category@, @Arrow@

  All four are isomorphic and have cross-type optics instances.
