changelog: "0.4.1.0 (2026-10-15)\n====================\n\n- Decoding refuses images
  above `blpMaxPixels` pixels, 8192x8192 by default,\n  before allocating anything.
  `decodeBlpWith` and `decodeBlpMipmapsWith` take\n  `BlpDecodeOptions` to set the
  limit. The 0.4.0.0 notes claimed that small\n  files could no longer demand gigabytes;
  that was wrong. A JPEG frame\n  smaller than its level is padded to the level size,
  and the level size\n  comes from the header, so a 493-byte file claiming 65535x65535
  pixels\n  still made the decoder allocate about 17 GB.\n- `blpInfo` reads the header
  (content type, size, alpha bits, usable mip\n  levels) without decoding any pixels,
  so callers can reject textures\n  before decoding them.\n- `BlpCompression` is exported
  from `Codec.Picture.Blp`.\n- blp2any:\n  - `--timeout SECONDS` gives up on a file
  that takes too long, so a corrupt\n    JPEG that makes decoding hang no longer stalls
  a batch.\n  - An output name with an unknown extension is an error; it used to be\n
  \   written as PNG regardless, and `.tif` output really was PNG.\n  - It refuses
  to write over its input, rejects `-q` outside 1..100, prints\n    encoding errors
  in words, and `stats` finds `*.BLP` in upper case.\n- Lower bounds now match the
  oldest versions CI tests: JuicyPixels 3.3.6,\n  vector 0.12.3, attoparsec 0.14.4,
  binary 0.8.9, bytestring 0.11.5 and\n  deepseq 1.4.8 (and for blp2any directory
  1.3.7, filepath 1.4.2,\n  optparse-simple 0.1, transformers 0.5.6), and a CI job
  builds and tests\n  with exactly those. The old bounds allowed versions that were
  never\n  tested.\n- Fixed the documentation of `decodeBlpMipmaps`, which rendered
  as \"Element\n  @ is always mip level @\".\n\n0.4.0.0 (2026-10-15)\n====================\n\nBreaking
  changes:\n\n- New encoding API: `encodeBlpWith` and `writeBlpWith` take\n  `BlpEncodeOptions`
  (a `BlpFormat` and a mip level count) and return\n  `Either BlpEncodeError`. Empty
  images, sides above 65535, JPEG quality\n  outside 1..100 and files over 4 GiB are
  errors instead of crashes or\n  silent wrap-around (#31). `encodeBlpJpeg`, `encodeBlpUncompressedWithAlpha`,\n
  \ `encodeBlpUncompressedWithoutAlpha` and their `writeBlp*` variants still\n  work
  as deprecated wrappers; they clamp the JPEG quality, which used to\n  wrap modulo
  256.\n- The decoder takes alpha from the `alphaBits` header field, as the format\n
  \ specifies, instead of from the `extra` field. Paletted files with 1-bit and\n
  \ 4-bit alpha now decode, files whose `extra` field says otherwise keep their\n
  \ alpha, and unknown `extra` values are no longer rejected (#25).\n- Non-square
  textures get the full mip chain down to 1x1 instead of\n  stopping when the shorter
  side reaches one pixel, and `mipMapsUpTo` counts\n  levels by the larger side, capped
  at 16 (#26, #31).\n- Mipmap colour is averaged with alpha as the weight, so transparent
  pixels\n  no longer darken the edges of sprites, and the alpha of paletted mipmaps\n
  \ is averaged instead of sampled. Opaque textures encode exactly as before\n  (#32).\n-
  `Codec.Picture.Blp.Internal.*`:\n  - `BlpStruct` keeps the raw header values in
  `blpAlphaBits`, `blpExtra` and\n    `blpHasMipmaps`; `blpCompression` is a function
  of `blpExt`. `BlpFlag` and\n    `BlpPictureType` are gone.\n  - Paletted content
  is one `BlpPaletted` constructor holding each level's\n    raw data.\n  - The parser
  is `parseBlp` plus `mipLevels` and `jpegFrameSize`; the\n    attoparsec walk over
  the content (`blpJpegParser`, `skipToOffset`, ...)\n    is gone.\n  - `encodeBlp`
  and `blpEncoder` take just the `BlpStruct`; `toBlpStruct`\n    takes a `BlpFormat`.\n\nDecoding
  untrusted files (#30):\n\n- Errors that JuicyPixels' JPEG decoder raises from pure
  code are returned\n  as `Left`; in a tail mipmap they end the list.\n- Width and
  height must be between 1 and 65535. Larger values used to\n  overflow the size checks
  and leave an exception in the decoded image.\n- Each JPEG level's frame size is
  read before decoding. A frame larger than\n  the level is rejected; a smaller one
  is padded with transparent black.\n  (This was described as stopping small files
  from demanding gigabytes;\n  it did not, see 0.4.1.0.)\n- Mipmap slots are read
  by index. A missing or garbage slot ends the chain\n  instead of shifting the later
  levels, and a garbage slot that points into\n  the palette no longer breaks the
  file.\n- Some corrupt JPEG streams still make JuicyPixels loop forever\n  (haskell-github-trust/Juicy.Pixels#230),
  so decoding untrusted files needs\n  a timeout.\n\nEncoder fixes (#31):\n\n- Unused
  mipmap slots are zero, as the format requires, and `hasMipmaps` is\n  0 when only
  one level is written.\n- Only the levels that are written are encoded; asking for
  one level of a\n  2048x2048 JPEG texture used to encode all of them.\n\nFaster (#34):
  JPEG decoding is 2.1–2.7x and JPEG encoding 2.2–2.8x as fast,\nmeasured with the
  new benchmark suite (`bench/Main.hs`). Output is\nbyte-identical.\n\nblp2any (#33):\n\n-
  `-s`/`--shallow` and `-p` (now also `--flatten`) were accepted but did\n  nothing;
  they now keep conversion to the top folder and write all output\n  into one folder.\n-
  A file that fails no longer aborts a batch conversion or `stats`: it is\n  reported
  on stderr and skipped, and `convert` prints a summary and exits\n  with status 1
  if anything failed.\n- An input folder given with a trailing slash no longer sends
  output to the\n  root of the file system.\n- `--version` reports the package version.\n\nDocumentation:
  `docs/format.md` describes the BLP1 format and what the\nlibrary does with each
  part; the README covers usage, `blp2any`,\nlimitations and benchmarking; every module
  has haddock (#27).\n\n0.3.0.0 (2026-10-15)\n====================\n\nBreaking changes:\n\n-
  `encodeBlpUncompressedWithAlpha` always writes an alpha plane and\n  `encodeBlpUncompressedWithoutAlpha`
  never does. Both used to pick by the\n  input image, so the two were identical and
  `blp2any -b` had no effect.\n- `decodeBlp` and `decodeBlpMipmaps` always return
  `ImageRGBA8`. JPEG BLPs\n  whose stream is not four-component (greyscale, YCbCr)
  used to come back as\n  `ImageY8` or `ImageRGB8`.\n- Removed unused functions from
  `Codec.Picture.Blp.Internal.Convert`:\n  `toPngRepresentable` and `toBlpUncompressable`.\n-
  `mipMapsUpTo` counts every level down to the minimum side; it was one short\n  and
  returned 0 or less for tiny images.\n- Removed the `TextShow` and `Hashable` instances
  from\n  `Codec.Picture.Blp.Internal.Data`, and with them the `text-show` and\n  `hashable`
  dependencies. `blp2any` no longer depends on\n  `unordered-containers`.\n\nThe encoder
  always writes mip 0; a mipmap count of zero or less used to\nproduce an unreadable
  file, which `blp2any` did for 1x1 images.\n\nThe uncompressed encoder no longer
  hands out ByteStrings over image memory it\ndoes not keep alive, and no longer relies
  on an orphan, endianness-dependent\n`Storable PixelRGBA8` instance.\n\nDecoder robustness
  for BLP1 files found in the wild:\n\n- Accept picture type 6 (WoW JPEG variant)
  and picture type 0 (#5, #10).\n- Tolerate palettes shorter than 256 entries (#6).\n-
  Decode files labelled with-alpha whose mipmap 0 has no alpha plane as\n  without-alpha
  instead of crashing (#8).\n- A corrupt JPEG mipmap no longer fails the whole file;
  the mipmap list is\n  cut at the first broken level (#9).\n- `decodeBlpMipmaps`
  renders uncompressed mipmaps at their own sizes instead of\n  crashing; a mip 0
  too short for the image is a `Left` (#13).\n- Without-alpha textures decode opaque
  regardless of the palette's fourth\n  byte, so the encoder's own output no longer
  comes back transparent (#14).\n- Decoding no longer dumps the parsed structure to
  stderr (#15).\n- The JPEG encoder writes plain BGRA planes instead of dividing colour
  by\n  alpha, and a uniformly semi-transparent alpha plane is kept; only all-0x00\n
  \ or all-0xFF planes count as unpopulated (#17).\n- The JPEG encoder shares one
  header between mipmaps; 1x1 textures no longer\n  encode to a file without image
  data (#18).\n- Skip mipmap slots that point past the end of the file or overlap
  an earlier\n  one (#7).\n- Decode JPEG planes as BGRA instead of CMYK (#11).\n\nSupport
  GHC 9.4 – 9.14: relax upper bounds for `attoparsec`, `bytestring`,\n`hashable`,
  `text-show`, `vector` and `filepath`. Minimum supported GHC is now 9.4.\n\n0.2.1.0\n=======\n\nRelax
  upper boundary for `text-show-3.9`.\n\n0.2.0.0\n=======\n\nImplement #1. Tool now
  preserves subfolder structure.\n\n0.1.3.0\n=======\n\nFix #2 index error. \n\n0.1.2.0\n=======\n\nRelax
  upper boundary for `hashable` and `text-show`.\n\n0.1.1.0\n=======\n\nRelax upper
  boundary for `JuicyPixels-3.3`.\n\n0.1.0.1\n=======\n\nRelax upper boundary for
  `binary-0.9.0.0`.\n\n0.1.0.0\n=======\n\nInitial release.\n"
