changelog: "0.3.0.0 (2026-10-15)\n====================\n\nBreaking changes:\n\n- `encodeBlpUncompressedWithAlpha`
  always writes an alpha plane and\n  `encodeBlpUncompressedWithoutAlpha` never does.
  Both used to pick by the\n  input image, so the two were identical and `blp2any
  -b` had no effect.\n- `decodeBlp` and `decodeBlpMipmaps` always return `ImageRGBA8`.
  JPEG BLPs\n  whose stream is not four-component (greyscale, YCbCr) used to come
  back as\n  `ImageY8` or `ImageRGB8`.\n- Removed unused functions from `Codec.Picture.Blp.Internal.Convert`:\n
  \ `toPngRepresentable` and `toBlpUncompressable`.\n- `mipMapsUpTo` counts every
  level down to the minimum side; it was one short\n  and returned 0 or less for tiny
  images.\n- Removed the `TextShow` and `Hashable` instances from\n  `Codec.Picture.Blp.Internal.Data`,
  and with them the `text-show` and\n  `hashable` dependencies. `blp2any` no longer
  depends on\n  `unordered-containers`.\n\nThe encoder always writes mip 0; a mipmap
  count of zero or less used to\nproduce an unreadable file, which `blp2any` did for
  1x1 images.\n\nThe uncompressed encoder no longer hands out ByteStrings over image
  memory it\ndoes not keep alive, and no longer relies on an orphan, endianness-dependent\n`Storable
  PixelRGBA8` instance.\n\nDecoder robustness for BLP1 files found in the wild:\n\n-
  Accept picture type 6 (WoW JPEG variant) and picture type 0 (#5, #10).\n- Tolerate
  palettes shorter than 256 entries (#6).\n- Decode files labelled with-alpha whose
  mipmap 0 has no alpha plane as\n  without-alpha instead of crashing (#8).\n- A corrupt
  JPEG mipmap no longer fails the whole file; the mipmap list is\n  cut at the first
  broken level (#9).\n- `decodeBlpMipmaps` renders uncompressed mipmaps at their own
  sizes instead of\n  crashing; a mip 0 too short for the image is a `Left` (#13).\n-
  Without-alpha textures decode opaque regardless of the palette's fourth\n  byte,
  so the encoder's own output no longer comes back transparent (#14).\n- Decoding
  no longer dumps the parsed structure to stderr (#15).\n- The JPEG encoder writes
  plain BGRA planes instead of dividing colour by\n  alpha, and a uniformly semi-transparent
  alpha plane is kept; only all-0x00\n  or all-0xFF planes count as unpopulated (#17).\n-
  The JPEG encoder shares one header between mipmaps; 1x1 textures no longer\n  encode
  to a file without image data (#18).\n- Skip mipmap slots that point past the end
  of the file or overlap an earlier\n  one (#7).\n- Decode JPEG planes as BGRA instead
  of CMYK (#11).\n\nSupport GHC 9.4 – 9.14: relax upper bounds for `attoparsec`, `bytestring`,\n`hashable`,
  `text-show`, `vector` and `filepath`. Minimum supported GHC is now 9.4.\n\n0.2.1.0\n=======\n\nRelax
  upper boundary for `text-show-3.9`.\n\n0.2.0.0\n=======\n\nImplement #1. Tool now
  preserves subfolder structure.\n\n0.1.3.0\n=======\n\nFix #2 index error. \n\n0.1.2.0\n=======\n\nRelax
  upper boundary for `hashable` and `text-show`.\n\n0.1.1.0\n=======\n\nRelax upper
  boundary for `JuicyPixels-3.3`.\n\n0.1.0.1\n=======\n\nRelax upper boundary for
  `binary-0.9.0.0`.\n\n0.1.0.0\n=======\n\nInitial release.\n"
changelog-type: markdown
description: |
  JuicyPixels-blp
  ===============

  [![CI](https://github.com/NCrashed/JuicyPixels-blp/actions/workflows/ci.yml/badge.svg)](https://github.com/NCrashed/JuicyPixels-blp/actions/workflows/ci.yml)

  The library provides decoding/encoding functions for BLP1 texture format of Warcraft III game.
  The result is represented in types of [JuicyPixels](http://hackage.haskell.org/package/JuicyPixels) library.

  Features:

  - Supported all three subtypes of BLP1: JPEG with alpha, paletted without alpha and paletted with alpha.

  - Command line utility to convert BLPs from/to PNG, JPEG, BMP, TGA, TIFF, GIF, Radiance formats.

  TODO:

  - BLP0 support

  - BLP2 support
