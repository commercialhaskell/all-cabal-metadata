changelog: "Change log\n==========\n\nv3.3.10 November 2026\n---------------------\n\n
  * Bmp: Fixed an out-of-bounds write (CWE-787) in the RLE decoder: the\n   pixel
  buffer size was computed with 32-bit `Int32` multiplication\n   (wrapping on large
  headers), and the RLE cursor (delta escapes,\n   end-of-line) was neither clamped
  nor bounds-checked before\n   `unsafeWrite`. Dimensions are now validated centrally
  (pixel count\n   capped at 2^29), allocations use exact `Int` arithmetic, and\n
  \  out-of-bounds RLE writes are clipped. (HSEC-2026-00XX / CVE pending)\n * Tiff:
  Fixed an out-of-bounds write (CWE-787) in contiguous strip\n   decoding: uncompressed
  and PackBits strip copies had no destination\n   bound, and the per-strip size computation
  wrapped negative for strips\n   starting past the end of the raster. Strip writes
  are now bounded by\n   the destination buffer and strip counts saturate at the raster\n
  \  boundary. (HSEC-2026-00XX / CVE pending)\n * Added `bmp-rle-safety` regression
  test-suite.\n\nv3.3.9 June 2024\n----------------\n\n * Something something compilation\n\nv3.3.7
  July 2022\n----------------\n\n * Dependence fidling\n * Jpg: do not call \"error\"
  in the parser, use fail instead.\n\nv3.3.7 March 2022\n-----------------\n\n * Jpg:
  Fixing renderng bug with MCUs with single block in width and\n   multiple in height\n\nv3.3.6
  October 2021\n-------------------\n\n * Bytestring bound bump\n * Fix bug #187.
  \ (Some JPEGs are misidentified as SourceTiff.)\n * Fix EXIF handling of strings
  of four characters or fewer.\n * Fix endianness bug in short ExifString and ExifUndefined.\n\n\nv3.3.5
  January 2020\n-------------------\n\nMaintenance release to push various pull requests
  onto\nhackage\n\n * Exporting Pixel32 (will)\n * Palettization of transparent frames
  in Gif (flutterlice)\n * Documentation fixes (lehins)\n\nv3.3.4 September 2019\n---------------------\n\n
  * support reading compressed zTXt metadata from PNG files (claudeha)\n * Add helper
  functions to convert a DynamicImage to RGB16 (uglyoldbob)\n * Fix RGB to CMYK conversion
  (lehins)\n\nv3.3.3.1 June 2019\n------------------\n\n * New GHC maintenance (thanks
  to ekmett)\n\nv3.3.3 December 2018\n--------------------\n\n * Enhanced: loading
  of bitmap format (thanks to CLowcay)\n * Refactoring: exposing more internal modules
  (thanks to wyager)\n * Refactoring: exposing dynamicMap & dynamicPixelMap\n   through
  `Codec.Picture` (thnks to LightAndLight)\n\n * v3.3.3.1: fixing compilation with
  older GHC\n\nv3.3.2 October 2018\n-------------------\n\n * Fix: GHC-8.6 compilation
  fix (no upper bound on base)\n * Fix: upper bound on containers (pull request phadej)\n
  * Fix: palette validation for gifs (pull request omedan)\n * New: More complete
  gif creation API (pull request omedan)\n\nv3.3.1 August 2018\n------------------\n\n
  * Fix: gif decoding of 1bit palette (fix Ornedan)\n * Fix: end of stream handling
  for gif's lzw encoding (fix Ornedan)\n\nv3.3 July 2018\n--------------\n\n * New:
  Eq instances for image\n * Fix: color gif resolution offset\n * New: support for
  Float Tiff\n * Breaking change: New `ImageY32` constructor for `Dynamic`\n\t\t\t\t\thence
  the version bump.\n\nv3.2.9.5 March 2018\n-------------------\n \n * Fix: uniform
  color quantization\n\nv3.2.9.4 January 2018\n----------------------\n\n * Compat
  for GHC-8.4 (pull request)\n * Fix: a character in latin1 which was still around.
  Whatever.\n        So tired of this.\n\n\nv3.2.9.3 December 2017\n----------------------\n\n
  * Fix: remove bad invisible unicode char\n\nv3.2.9.2 December 2017\n----------------------\n\n
  * Fix: Progressive jpeg decoding when number of blocks of the MCU\n\t\tis below
  line size\n\nv3.2.9.1 November 2017\n----------------------\n\n * Feature: Paletted
  alpha png saving\n\nv3.2.9 November 2017\n----------------------\n\n * Fix: Adding
  correct import of Exif Flash for Jpeg (thanks to Alexander Kjeldaas)\n * Feature:
  Jpg Exif writing\n\n\nv3.2.8.3 August 2017\n------------------\n\n * Fix: Jpeg loading
  of extended sequential jpg, not sure of all\n\t\tthe implications, works with the
  sample\n\nv3.2.8.2 June 2017\n------------------\n\n * Fix: usage of fail in Either
  monad, giving an unwanted exception\n\nv3.2.8.1 March 2016\n-------------------\n\n
  * Fix: proper flushing of jpeg writing, avoiding warning from libjpeg.\n * Fix:
  RGB jpeg get an Adobe's APP14 block to help MacOS & Photoshop reading\n\nv3.2.8
  September 2016\n---------------------\n\n * Added: possibility to retrieve the parsed
  palette.\n * Fix: Fixing problem of progressive Jpeg decoding when\n\t\tblock height
  is different of block width (#)\n\nv3.2.7.2 June 2016\n------------------\n\n *
  Fix: no more libjpeg warning when decoding Juicy.Pixels encoded images.\n\nv3.2.7.1
  May 2016\n-----------------\n * Fix: some wrongly infinitely looping JPEG decoding\n\nv3.2.7
  January 2016\n-------------------\n * Addition: convertRGB8 and convertRGBA8 helper
  functions\n * Addition: new output colorspace for JPEG format: Y, RGB & CMYK\n *
  Addition: RGBA8 bitmap reading (thanks to mtolly)\n * Enhancement: Optimized JPG
  & Tiff reading (thanks to Calvin Beck)\n * Enhancement: INLINE SPECIALIZE for pixelMap
  (Pixel8 -> Pixel8) (thx to Calvin Beck)\n * Fix: GHC 8.0 compilation (thanks to
  phadej)\n\nv3.2.6.5 December 2015\n----------------------\n * Fix: Compilation on
  GHC 7.6/7.8\n\nv3.2.6.4 December 2015\n----------------------\n * Fix: previous
  broken bugfix.\n\nv3.2.6.3 November 2015\n----------------------\n * Fix: Fixing
  unwanted sharing with createMutableImage due to\n\t\twrongly used INLINE pragma\n\nv3.2.6.2
  November 2015\n----------------------\n * Fix: Using minimal GIF version if outputting
  a single image.\n\nv3.2.6.1 August 2015\n--------------------\n * Fix: handling
  of negative height & width in bitmap format.\n * Fix: regression on Tiff parsing.\n\nV3.2.6
  August 2015\n--------------------\n\n * Added: imageToTga saving helper function.\n
  * Fix: don't invert TGA alpha channel.\n * Fix: various typo in documentation.\n\nV3.2.5.3
  July 2015\n------------------\n\n * Fix: bumping vector upper bounds.\n\nV3.2.5.2
  June 2015\n------------------\n\n * Adding: Width & Height metadata to help querying
  image information\n\twithout decompressing the whole.\n * Adding: Source format
  metadata.\n\nv3.2.5.1 May 2015\n---------------\n\n * Fixing: utf-8 encoding of
  Jpg/Types causing problems with Haddock.\n\nv3.2.5 May 2015\n---------------\n\n
  * Adding: Metadata extraction for various file format.\n * Adding: Metadata writing
  for various file format.\n * Adding: light EXIF mapping.\n * Fix: handling of Tiff
  with predictors (thanks to Patrick Pelletier)\n \nv3.2.4 April 2015\n-----------------\n\n
  * Adding: Traversals compatible with the lens library.\n\nv3.2.3.2 April 2015\n-------------------\n\n
  * Bumping: zlib max bound\n\nv3.2.3.1 March 2015\n-------------------\n\n * Bumping:
  primitive to allow 0.6\n * Fix: BMP output generated wrong size (thanks to mtolly).\n
  * Fix: 7.10.1 warning free\n\nv3.2.3 March 2015\n-----------------\n\n * Adding:
  Support for RGB in jpeg (yeah, that exist...)\n * Adding: Support of CMYK & YCrCbK
  color space in jpeg files.\n * Addinng: a pixelFoldMap functions analog to the `foldMap`
  function\n  of the Foldable type class.\n * Fix: better performances for the pixelFold*
  functions\n\nv3.2.2 January 2015\n-------------------\n\n * Fix: Squashing GHC 7.10
  warnings\n\nv3.2.1 December 2014\n--------------------\n * Fix: Bumping deepseq
  dependencies preparing for GHC 7.10\n   release.\n\nv3.2 December 2014\n------------------\n\n*BREAKING
  CHANGES*: the Codec.Picture.Gif functions has changed interfaces.\n\n * Adding:
  TGA reading.\n * Adding: TGA writing.\n * Adding: Packeable pixel unpack.\n * Fix:
  Returning gif with transparency (breaking Codec.Picture.Gif interface)\n\nv3.1.7.1
  August 2014\n--------------------\n\n * Previous gif fix was not working within
  the readImage\n   function, only in specialized gif images. Correcting\n   miscorection\n\nv3.1.7
  August 2014\n------------------\n\n * Making Juicy.Pixels compatible with GHC 7.9
  HEAD (ggreif)\n * Adding writing to uncompressed radiance file, due to\n   problems
  with Mac OS X \"preview\" application\n * Fixing problem of gif parsing without
  global palette\n * Some inlining annotations on some functions\n\nv3.1.6.1 August
  2014\n--------------------\n\n * Fix of Gif palette creation (jeffreyrosenbluth)\n
  * Restoring transformers 0.3.* compat\n\nv3.1.6 August 2014\n------------------\n\n
  * Fix bad disposal handling in GIF animations.\n * Added ColorConvertible instance
  for PixelRGB8 -> PixelRGBA16 (KaiHa)\n * Fixing a bad handling of tRNS causing bad
  transparency decoding in\n   some circonstances.\n * Adding the concept of Packeable
  pixel for faster pixel filling\n   using mutable array.\n\nv3.1.5.2 May 2014\n-----------------\n\n
  * Bumping the transformers dependency\n\nv3.1.5.1 May 2014\n-----------------\n\n
  * Adding some INLINE annotations for some pixel functions\n\nv3.1.5 March 2014\n-----------------\n\n
  * Typos and documentation proof reading fixes\n   (pull request from iger).\n *
  Fix of progressive jpeg loading with more than two\n   huffman tables (4 allowed).\n
  * Fix of progressive jpeg rendering (was too noisy before)\n * Added loading of
  paletted bitmap files.\n * Function to load gif images with frame duration\n   information
  (pull request from bit-shift)\n * Fixing bug showing when loading JPEG with component\n
  \  ID starting at 0.\n * Adding reading for YA8 et YA16 Tiff images (pull \n   request
  from iger)\n * Adding a mixWithAlpha method, to help work on transparent\n   pixel
  types\n\n\nv3.1.4.1 February 2014\n----------------------\n\n * Putting back data
  URI logo for cabal description, it's\n   apparently not supported by Hackage :-(\n\nv3.1.4
  February 2014\n--------------------\n\n * Adding a pixelOpacity method to the pixel
  type class.\n * Adding handling greyscale BMP files (phischu)\n * Fixing promotePixel
  for Pixel8 -> Pixel16\n * Some type fixes in the documentation\n * Updating the
  pixel conversion graph\n * Removed URI-encoded images, now using clean cabal embedding\n\nv3.1.3.3
  February 2014\n----------------------\n\n * Lowering cabal version limit to be compiled
  with older GHCs\n\nv3.1.3.2 January 2014\n---------------------\n\n * Hacking around
  Binary to accept old version of it, down to version 0.5\n   allowing Juicy.Pixels
  to be compiled with GHC 6.3\n\nv3.1.3.1 January 2014\n---------------------\n\n
  * Fixing color counting function in color quantisation.\n * Adding missing documentation
  for foreign pointer import.\n\nv3.1.3 January 2014\n-------------------\n\n * Adding
  palette creation (color Quantization) by Jeffrey Rosenbluth.\n * Adding support
  for Gif writing\n * Adding support for Gif animation writing\n * Fixing some progressive
  Jpeg decoding problems (#39)\n\nv3.1.2 December 2013\n--------------------\n\n *
  Adding support for progressive jpeg.\n * Adding support for plane separated MCU
  jpeg.\n * Adding support for grayscale 32bit decoding (with reduced precision to\n\t16bits).\n
  * Fixing erroneous bitmap decoding in case of excessive padding (#31).\n\nv3.1.1.1
  October 2013\n---------------------\n\n * Fixing some spurious crash while decoding
  some JPEG image (#30).\n\nv3.1.1  October 2013\n--------------------\n\n * Adding
  uncompressed TIFF saving.\n * Adding error message to avoid loading progressive
  loading.\n * Made MMAP optional, controlled by a cabal flag.\n * adding dynamicPixelMap
  helper function.\n * Handling png transparency using color key (#26).\n\nv3.1 June
  2013\n--------------\n\n * Adding basic handling of 16bits pixel types.\n * Addition
  of Tiff reading:\n    - 2, 4, 8, 16 bit depth reading (planar and contiguous for
  each).\n    - CMYK, YCbCr, RGB, Paletted, Greyscale.\n    - Uncompressed, PackBits,
  LZW.\n * Some new tiny helper functions (nothing too fancy).\n * Huge performances
  improvement.\n\nv3.0 January 2013\n-----------------\n\n * Simplification of the
  'Pixel' typeclass, removed many unused part.\n * Removal of some Storable instances
  for pixel types.\n * Amelioration of the documentation.\n * Support for High Dynamic
  range images, opening support for different pixel\n   base component.\n * Support
  for the Radiance file format (or RGBE, file extension .pic and .hdr).\n * Dropped
  the cereal library in favor of the last version of Binary, present \n   in the Haskell
  platform. Every dependencies are now present in the platform.\n\nv2.0.2 October
  2012\n-------------------\n\n * Decoding of interleaved gif image.\n * Decoding
  delta coded gif animation.\n * Bumping dependencies.\n\nv2.0.1 September 2012\n---------------------\n\n
  * Documentation enhancements.\n * Fixing some huge gif file loading.\n * Fixing
  performance problem of Bitmap and Jpeg savings.\n\nv2.0 September 2012\n-------------------\n\n
  * New extractComponent version with type safe plane extraction.\n * Gif file reading.\n\nv1.3
  June 2012\n--------------\n\n * Fix extractComponent function.\n * Adding saving
  for YA8 functions.\n\nv1.2.1 April 2012\n-----------------\n\n * Dependencies version
  bump.\n * Dropping array dependency.\n\nv1.2 March 2012\n---------------\n\n * Adding
  a generateImage helper function.\n * Adding NFData instances for image.\n * Adding
  JPEG writing.\n\nv1.1 February 2012\n------------------\n\n * Switching to vector
  for arrays, big performance improvement.\n\nv1.0 January 2012\n-----------------\n\n
  * Initial release\n\n"
changelog-type: text
description: "![Juicy logo](https://raw.github.com/Twinside/Juicy.Pixels/master/docimages/juicy.png)\r\n\r\n\r\n[![Hackage](https://img.shields.io/hackage/v/JuicyPixels.svg)](http://hackage.haskell.org/package/JuicyPixels)\r\n\r\nJuicy.Pixels\r\n============\r\n\r\nThis
  library provides saving & loading of different picture formats for the\r\nHaskell
  language. The aim of the library is to be as lightweight as possible,\r\nyou ask
  it to load an image, and it'll dump you a big Vector full of juicy\r\npixels. Or
  squared pixels, or whatever, as long as they're unboxed.\r\n\r\nDocumentation\r\n-------------\r\n\r\nThe
  library documentation can be accessed on [Hackage](http://hackage.haskell.org/package/JuicyPixels)\r\n\r\nWrappers\r\n--------\r\n\r\nFor
  the user of:\r\n\r\n * [REPA](http://www.haskell.org/haskellwiki/Numeric_Haskell:_A_Repa_Tutorial),
  check-out JuicyPixels-repa on [GitHub](https://github.com/TomMD/JuicyPixels-repa)
  or [Hackage](http://hackage.haskell.org/package/JuicyPixels-repa)\r\n\r\n * [Gloss](http://hackage.haskell.org/package/gloss),
  check-out gloss-juicy on [GitHub](https://github.com/alpmestan/gloss-juicy) or [Hackage](http://hackage.haskell.org/package/gloss-juicy)\r\n\r\nStatus\r\n------\r\n\r\n
  - PNG    (.png) \r\n    * Reading \r\n        - 1,2,4,8 bits loading, Grayscale,
  24bits, 24 bits with alpha,\r\n          interleaved & filtered (fully compliant
  with the standard,\r\n          tested against png suite).\r\n\r\n    * Writing\r\n
  \       - 8bits RGB (non interleaved)\r\n        - 8bits RGBA (non interleaved)\r\n
  \       - 8bits greyscale (non interleaved)\r\n        - 16bits greyscale (non interleaved)\r\n
  \       - 16bits RGB (non interleaved)\r\n        - 16bits RGBA (non interleaved)\r\n
  \       - 8bits RGB paletted image\r\n        - 8bits RGBA paletted image\r\n\r\n
  \   * Metadata (reading/writing)\r\n        * in a tEXT chunk: 'Title', 'Description',
  'Author', 'Copyright',\r\n          'Software', 'Comment', 'Disclaimer', 'Source',
  'Warning'\r\n        * any other tEXT chunk.\r\n        * in a gAMA field : 'Gamma'\r\n
  \       * DPI information in a pHYs chunk.\r\n\r\n - Bitmap (.bmp)\r\n    * Reading\r\n
  \       - 16 or 32 bit RGBA images\r\n        - 16, 24, 32 bit RGB images\r\n        -
  1, 4, or 8 bit (greyscale & paletted) images\r\n        - RLE encoded or uncompressed\r\n
  \       - Windows 2.0/3.1/95/98 style bitmaps all supported\r\n\r\n    * Writing\r\n
  \       - 32bits (RGBA) per pixel images\r\n        - 24bits (RGB) per pixel images\r\n
  \       - 8 bits greyscale (with palette)\r\n\r\n    * Metadata (reading/writing):
  DPI information\r\n\r\n - Jpeg   (.jpg, .jpeg)\r\n    * Reading normal and interlaced
  baseline DCT image\r\n        - YCbCr (default) CMYK/YCbCrK/RGB colorspaces\r\n\r\n
  \   * Writing non-interlaced JPG\r\n        - YCbCr (favored), Y, RGB & CMYK colorspaces\r\n\r\n
  \   * Metadata:\r\n        - Reading and writing DpiX & DpiY from JFIF header.\r\n
  \       - Reading & writing EXIF metadata. No GPS information\r\n          can be
  written now.\r\n\r\n - Gif (.gif)\r\n    * Reading single image & animated Gif image,
  handles interlaced images.\r\n    * Writing single & animated Gif images.\r\n    *
  No metadata.\r\n\r\n - Radiance (.pic, .hdr)\r\n    * Reading\r\n    * Writing\r\n
  \   * No metadata.\r\n\r\n - Tga\r\n    * Reading\r\n        - 8, 16, 24 & 32 bits\r\n
  \       - paletted and unpaletted\r\n        - RLE encoded or uncompressed\r\n    *
  Writing\r\n        - uncompressed 8bits (Pixel8)\r\n        - uncompressed 24bits
  (PixelRGB8)\r\n        - uncompressed 32bits (PixelRGBA8)\r\n    * No metadata\r\n\r\n
  - Tiff\r\n    * Reading\r\n        - 2, 4, 8, 16 int bit depth reading (planar and
  contiguous for each)\r\n        - 32 bit floating point reading\r\n          \r\n
  \       - CMYK, YCbCr, RGB, RGBA, Paletted, Greyscale\r\n        - Uncompressed,
  PackBits, LZW\r\n\r\n    * Writing\r\n        - 8 and 16 bits\r\n        - CMYK,
  YCbCr, RGB, RGBA, Greyscale\r\n        - Uncompressed\r\n    * Metadata: reading
  DpiX, DpiY and EXIF information.\r\n\r\n_I love juicy pixels_\r\n\r\nYou can make
  [donations on this page](http://twinside.github.com/Juicy.Pixels/).\r\n\r\n"
