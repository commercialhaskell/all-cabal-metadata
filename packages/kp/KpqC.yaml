  # Changelog

  ## 0.1.0 - 2026-10-15

  - Initial release with synchronous Haskell APIs for AIMer, HAETAE, NTRU+, and
    SMAUG-T.
  - Added scrubbed storage for secret keys and shared secrets.
  - Added tests for all supported parameter sets and 1,600 known-answer vectors.
