description: |
  # vehicle
  Standard Classification for Space Launch &amp; Reentry Vehicles

  [ASTM F3388-23](https://store.astm.org/f3388-23.html)

  Usage
  ```
  vhcl --help
  vhcl w | vhcl r
  ```

  Install

  ```
  cabal install vehicle
  ```

  Development

  ```
  cabal build
  cabal haddock
  cabal test
  cabal run vhcl -- --help
  ```
