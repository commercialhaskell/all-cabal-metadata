description: High-level, type-safe, and resource-managed Haskell interface for Linux
  GPIO character devices using libgpiod v2. Built on top of fuyu-gpio-direct, fuyu-gpio
  provides automatic memory management (bracket / with* style), typed exception handling,
  metadata snapshots, and zero-copy vector operations for high-performance GPIO I/O.
