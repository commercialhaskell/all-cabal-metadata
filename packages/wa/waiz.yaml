changelog: |
  0.0.2.0

  * Upgrade responseStatus and responseHeaders from Getter to Lens' on
    HasResponse, using mapResponseStatus / mapResponseHeaders for the setter
  * Add getResponseStatus and getResponseHeaders getters to GetResponse
  * Add applicationResponse :: Setter' Application Response, using
    modifyResponse under the hood

  0.0.1.0

  * Initial release
  * Classy optics (Get/Has/Review/As) for Request, Response, FilePart,
    RequestBodyLength
  * Field lenses for Request and FilePart
  * Constructor prisms for Response and RequestBodyLength
  * Constructor classy optics for Response and RequestBodyLength
changelog-type: text
description: |-
  Classy optics (@GetXXX@, @HasXXX@, @ReviewXXX@, @AsXXX@) for all
  data types in the
  <https://hackage.haskell.org/package/wai wai> package.

  For each data type in @wai@ (@Request@, @Response@, @FilePart@,
  @RequestBodyLength@), this package provides:

  * Getter type class (@GetXXX@)
  * Lens type class (@HasXXX@)
  * Review type class (@ReviewXXX@)
  * Prism type class (@AsXXX@)

  For record types, individual field lenses are provided.
  For sum types, constructor prisms with their own classy optics are provided.
