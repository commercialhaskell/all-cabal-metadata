description: |-
  Instrumented @<https://hackage.haskell.org/package/wai wai>@ middleware that
  extracts and injects OpenTelemetry tracing context on requests, in the style
  of @<https://hackage.haskell.org/package/hs-opentelemetry-instrumentation-wai hs-opentelemetry-instrumentation-wai>@,
  built on top of @<https://hackage.haskell.org/package/wai-effectful wai-effectful>@
  and @otel-effectful@.
