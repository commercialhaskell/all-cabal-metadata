changelog: |
  # Changelog

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [1.0.2] - 2026-11-07

  ### Added

  - `Effectful.Wai.Internal` with the constructors of `Request` and `Response`.

  ### Fixed

  - Lifted raw responses can read and write from different threads.

  ## [1.0.1] - 2026-10-01

  ### Changed

  - Optimised response lifting to preserve original response types. This enables Warp's fast path for builder and file responses.

  ## [1.0.0] - 2026-07-27

  ### Added

  - Initial release.
