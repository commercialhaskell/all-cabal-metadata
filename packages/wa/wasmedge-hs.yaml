description: "# wasmedge-hs\n\nType-safe, idiomatic, high-performance Haskell FFI
  bindings for the [WasmEdge](https://wasmedge.org) WebAssembly runtime.\n\n[![Build
  & Test](https://github.com/tusharad/wasmedge-hs/actions/workflows/ci.yml/badge.svg)](https://github.com/tusharad/wasmedge-hs/actions/workflows/ci.yml)\n[![Release](https://github.com/tusharad/wasmedge-hs/actions/workflows/release.yml/badge.svg)](https://github.com/tusharad/wasmedge-hs/actions/workflows/release.yml)\n[![Hackage](https://img.shields.io/hackage/v/wasmedge-hs.svg)](https://hackage.haskell.org/package/wasmedge-hs)\n[![Hackage
  Deps](https://img.shields.io/hackage-deps/v/wasmedge-hs.svg)](https://hackage.haskell.org/package/wasmedge-hs)\n[![License:
  MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://tusharad.github.io/wasmedge-hs/)\n\n---\n\n##
  Overview\n\n`wasmedge-hs` provides a ground-up rework of the Haskell bindings for
  WasmEdge (supporting 0.17.x and 0.18.x). It is designed following modern Haskell
  FFI best practices:\n\n- **Two-Layer Architecture**:\n  - `WasmEdge.Internal.FFI.*`:
  Raw low-level C FFI with shim layer handling struct-by-value C ABI.\n  - Safe, idiomatic
  Haskell interface with standard types (`Text`, `ByteString`, sum types).\n- **Strong
  Phantom Ownership**:\n  - `OwnedCtx tag` ensures resources are tracked and finalized
  via GC finalizers or explicit bracket calls.\n  - Container-owned elements (such
  as `FunctionInstance` added to a `ModuleInstance`) are automatically disarmed to
  eliminate double-free bugs.\n- **Full Feature Coverage**:\n  - WebAssembly execution
  (one-shot and step-by-step pipeline)\n  - Bidirectional host functions (calling
  Haskell functions from WASM)\n  - Ahead-of-Time (AOT) compilation to native shared
  objects (`.so` / `.dylib`)\n  - WASI support with arguments, environment variables,
  and preopened directories\n  - Non-blocking asynchronous execution via `WasmEdge.Async`\n
  \ - Plug-in discovery and loading (e.g. `wasi_nn`, `wasi_logging`)\n  - WasmEdge
  0.18+ exception handling and Tag instances\n\n---\n\n## Installation & Prerequisites\n\n###
  1. Install the WasmEdge C runtime\n\n**macOS (Homebrew)**\n```bash\nbrew install
  wasmedge\n```\n\n**Linux**\n```bash\ncurl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh
  \\\n  | sudo bash -s -- -v 0.18.1 -p /usr/local\n```\n\n### 2. Add `wasmedge-hs`
  to your project\n\n**Cabal** (`cabal.project` / `.cabal`):\n```cabal\n-- your-package.cabal\nbuild-depends:
  wasmedge-hs >= 0.18.1 && < 0.19\n```\n\n```bash\ncabal build\ncabal test\n```\n\n**Stack**
  (`stack.yaml`):\n```yaml\nextra-deps:\n  - wasmedge-hs-0.18.1.0\n```\n\n```bash\n#
  Default build (LTS 22 / GHC 9.6.6)\nstack build\nstack test\n\n# Or choose a specific
  GHC / LTS version:\nstack --stack-yaml stack-lts-22.yaml test  # GHC 9.6.6\nstack
  --stack-yaml stack-lts-23.yaml test  # GHC 9.8.4\nstack --stack-yaml stack-lts-24.yaml
  test  # GHC 9.10.1\nstack --stack-yaml stack-nightly.yaml test # GHC 9.12.x\n```\n\n---\n\n##
  Quick Start\n\n### 1. Execute a WebAssembly Function\n\n```haskell\n{-# LANGUAGE
  OverloadedStrings #-}\nimport qualified Data.ByteString as BS\nimport WasmEdge.VM\nimport
  WasmEdge.Types\n\n-- Minimal WebAssembly module implementing: add(a: i32, b: i32)
  -> i32\naddWasm :: BS.ByteString\naddWasm = BS.pack\n  [ 0x00, 0x61, 0x73, 0x6D,
  0x01, 0x00, 0x00, 0x00  -- magic + version\n  , 0x01, 0x07, 0x01, 0x60, 0x02, 0x7F,
  0x7F, 0x01, 0x7F  -- type: (i32, i32) -> i32\n  , 0x03, 0x02, 0x01, 0x00                              --
  function section\n  , 0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00  -- export
  \"add\"\n  , 0x0A, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6A, 0x0B  --
  body\n  ]\n\nmain :: IO ()\nmain = do\n  result <- withVM Nothing Nothing $ \\vm
  ->\n    runWasmBytes vm addWasm \"add\" [WasmI32 40, WasmI32 2]\n  case result of\n
  \   Right [WasmI32 ans] -> putStrLn $ \"Result: 40 + 2 = \" ++ show ans -- 42\n
  \   Left err            -> putStrLn $ \"Error: \" ++ show err\n```\n\n### 2. Export
  Haskell Functions to WebAssembly\n\n```haskell\n{-# LANGUAGE OverloadedStrings #-}\nimport
  WasmEdge.VM\nimport WasmEdge.Types\nimport WasmEdge.Function\nimport WasmEdge.Module\n\nhaskellAddOne
  :: CallingFrame -> [WasmVal] -> IO (WasmResult [WasmVal])\nhaskellAddOne _ [WasmI32
  n] = pure $ Right [WasmI32 (n + 1)]\nhaskellAddOne _ args        = pure $ Right
  args\n\nmain :: IO ()\nmain = do\n  withFunctionType [I32] [I32] $ \\fnType ->\n
  \   withFunction fnType haskellAddOne $ \\hostFn -> do\n      hostMod <- buildHostModule
  \"host_module\" $ \\b ->\n        builderAddFunction b \"add_one\" hostFn\n\n      withVM
  Nothing Nothing $ \\vm -> do\n        Right () <- registerModuleFromImport vm hostMod\n
  \       res <- runWasmBytes vm guestWasm \"call_host\" [WasmI32 99]\n        print
  res -- Right [WasmI32 100]\n```\n\nFor typed host functions (no manual `WasmVal`
  unpacking), use `builderAddHostFunc`:\n\n```haskell\nbuildHostModule \"host_module\"
  $ \\b -> do\n  builderAddHostFunc b \"add\" $ \\(x :: Int32) (y :: Int32) -> pure
  (x + y) :: IO Int32\n```\n\nSee `cabal run wasmedge-hs-example-hostfunc` for the
  complete, runnable example.\n\n\n### 3. Ahead-Of-Time (AOT) Compilation\n\n```haskell\nimport
  WasmEdge.Compiler\nimport WasmEdge.Configure\nimport WasmEdge.Types (OptimizationLevel
  (..))\n\ncompileToNative :: IO ()\ncompileToNative = do\n  withConfigure $ \\cfg
  -> do\n    setCompilerOptions cfg (defaultCompilerOptions { compOptLevel = OptO3
  })\n    withCompiler (Just cfg) $ \\compiler -> do\n      res <- compileFile compiler
  \"input.wasm\" \"output.so\"\n      case res of\n        Right () -> putStrLn \"Compiled
  successfully to output.so\"\n        Left err -> putStrLn $ \"Compilation failed:
  \" ++ show err\n```\n\n---\n\n## Examples\n\nRun any of the included examples:\n\n```bash\n#
  Cabal\ncabal run wasmedge-hs-example-hello\ncabal run wasmedge-hs-example-hostfunc\ncabal
  run wasmedge-hs-example-plugin\ncabal run wasmedge-hs-example-aot\n\n# Stack\nstack
  run wasmedge-hs-example-hello\n```\n\n- **`hello`** — Minimal WASM execution (add
  two i32 values)\n- **`hostfunc`** — Calling Haskell callbacks from WebAssembly\n-
  **`plugin`** — Dynamic plugin discovery and module introspection\n- **`aot`** —
  AOT compilation of bytecode to optimized native code\n\n---\n\n## Benchmarks\n\nMicrobenchmarks
  with Criterion:\n\n```bash\ncabal run wasmedge-hs-bench --enable-benchmarks\n```\n\n|
  Benchmark Scenario | Mean Latency |\n| :--- | :--- |\n| Pre-loaded Function Execution
  | **~380 ns** |\n| One-shot WASM Execution (`runWasmBytes`) | **~26 μs** |\n| Step-by-step
  Pipeline (`load/validate/instantiate/exec`) | **~26 μs** |\n| VM Lifecycle (`createVM`/`deleteVM`)
  | **~23 μs** |\n\n---\n\n## Supported GHC Versions\n\n| GHC | Stackage LTS | Status
  |\n| :--- | :--- | :--- |\n| 9.6.6 | LTS 22 | ✅ Tested |\n| 9.8.4 | LTS 23 | ✅ Tested
  |\n| 9.10.1 | LTS 24 | ✅ Tested |\n| 9.12.x | Nightly | \U0001F9EA Experimental
  |\n\n---\n\n## Documentation\n\n- [Haddock API Docs](https://tusharad.github.io/wasmedge-hs/)
  (GitHub Pages)\n- [Hackage Package Page](https://hackage.haskell.org/package/wasmedge-hs)\n-
  [Architecture Design](docs/ARCHITECTURE.md)\n- [Backwards Compatibility Guidelines](docs/BACKWARDS_COMPAT.md)\n-
  [Maintenance & Upgrades](docs/MAINTAINING.md)\n- [Contributing Guide](docs/CONTRIBUTING.md)\n-
  [Changelog](CHANGELOG.md)\n\n---\n\n## Branching Strategy\n\n| Branch | Purpose
  |\n| :--- | :--- |\n| `main` | Stable, release-tagged. Only release commits land
  here. |\n| `develop` | Integration branch. All PRs target `develop` first. |\n|
  `feat/*` | Feature branches — merge into `develop` via PR. |\n| `fix/*` | Bug-fix
  branches — merge into `develop` via PR. |\n| `chore/*` | Infrastructure, docs, CI
  changes. |\n\nReleases are created by merging `develop → main`, then pushing an
  annotated tag `v<version>`.\n\n---\n\n## Contributing\n\nSee [docs/CONTRIBUTING.md](docs/CONTRIBUTING.md)
  for the full guide.\nQuick start:\n\n```bash\ngit clone https://github.com/tusharad/wasmedge-hs\ncd
  wasmedge-hs\nbrew install wasmedge        # macOS\nstack build\nstack test\n```\n\n---\n\n##
  License\n\nMIT License. Copyright (c) 2026 Tushar Adhatrao. See [LICENSE](LICENSE)
  for details.\n"
