changelog: "# Changelog for `wasmedge-hs`\n\nAll notable changes to this project will
  be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand
  this project adheres to the [Haskell Package Versioning Policy (PVP)](https://pvp.haskell.org/).\n\n##
  [Unreleased]\n\n_(nothing yet — open a PR against `develop`)_\n\n---\n\n## [0.18.1.0]
  - 2026-11-08\n\n### Changed\n- Target runtime upgraded to **WasmEdge 0.18.1**.\n-
  Verified all 86 unit and property tests against WasmEdge 0.18.1 C headers and shared
  libraries.\n- Updated `VersionSpec` suite to assert WasmEdge 0.18.1 ABI compatibility
  (`minor == 18`, `patch == 1`).\n- Updated CI/CD matrix and deployment environments
  to install WasmEdge 0.18.1.\n- Updated package metadata and Cabal source repository
  stanzas.\n\n---\n\n## [0.17.1.0] - 2026-11-07\n\n**Initial public release.** Ground-up
  rewrite of Haskell bindings for WasmEdge 0.17.1.\n\n### Added\n\n- **WasmEdge.Caller**
  — Safe host function access to guest memory:\n  `getCallerMemory`, `readCallerMemory`,
  `writeCallerMemory`, `readCallerCString`.\n- **`ToHostFunc` typeclass** — Type-level
  host function registration.  \n  Register typed Haskell functions (e.g. `Int32 ->
  Int32 -> IO Int32`) directly,\n  without manual `WasmVal` unpacking.\n- **`builderAddHostFunc`**
  in `WasmEdge.Module` for ergonomic host module construction.\n- **Declarative `VMConfig`
  / `withVMConfig`** in `WasmEdge.VM` inspired by the Rust SDK's `VmBuilder`.\n- **Multi-version
  Stack build matrix**:\n  - `stack.yaml` / `stack-lts-22.yaml` — Stackage LTS 22.44
  (GHC 9.6.6)\n  - `stack-lts-23.yaml` — Stackage LTS 23.18 (GHC 9.8.4)\n  - `stack-lts-24.yaml`
  — Stackage LTS 24.33 (GHC 9.10.1)\n  - `stack-nightly.yaml` — Stackage Nightly (GHC
  9.12.x)\n- **Two-layer architecture**:\n  - `WasmEdge.Internal.FFI.*` — Raw C FFI
  bindings and shims (no business logic).\n  - Public safe modules: `WasmEdge`, `WasmEdge.VM`,
  `WasmEdge.Configure`,\n    `WasmEdge.Types`, `WasmEdge.Value`, `WasmEdge.Module`,
  `WasmEdge.Function`,\n    `WasmEdge.Table`, `WasmEdge.Memory`, `WasmEdge.Global`,
  `WasmEdge.Tag`,\n    `WasmEdge.Plugin`, `WasmEdge.Async`, `WasmEdge.Compiler`,\n
  \   `WasmEdge.Statistics`, `WasmEdge.Store`, `WasmEdge.Executor`, `WasmEdge.Log`,\n
  \   `WasmEdge.Error`, `WasmEdge.Caller`, `WasmEdge.Bindgen`,\n    `WasmEdge.Memory.Codec`,
  `WasmEdge.Memory.Alloc`.\n- **Phantom-typed ownership model** (`OwnedCtx` vs `BorrowedCtx`)
  preventing\n  double-free and use-after-free bugs via GHC finalizers.\n- **C shim
  layer** (`cbits/wasmedge_hs_shims.c`) handling struct-by-value C ABI\n  conversions
  cleanly across ARM64 (Apple Silicon) and x86_64 (Linux).\n- **Bidirectional host
  function calling** (`createFunction`, `buildHostModule`,\n  `builderAddFunction`)
  with automatic finalizer disarming on ownership transfer.\n- **AOT compiler** support
  via `compileFile` and `compileBytes`\n  (`WasmEdge.Compiler`).\n- **Asynchronous
  WASM execution** via `asyncRunWasmFile`, `asyncRunWasmBytes`,\n  `asyncExecute`
  (`WasmEdge.Async`).\n- **Plugin system** — loading and discovery via `loadDefaultPlugins`,\n
  \ `listPlugins`, `findPlugin` (`WasmEdge.Plugin`).\n- **Exception handling / Tag
  instances** (`TagType`, `TagInstance`) for\n  WasmEdge 0.18+ exception proposals.\n-
  **Full test suite** — 52 unit and property tests (HSpec + Hedgehog).\n- **Criterion
  benchmarks** — sub-microsecond pre-loaded execution (~380 ns).\n- **Comprehensive
  examples** — `Hello`, `HostFunc`, `Plugin`, `AOTCompile`,\n  plus a full stress/API-suite
  with 20 scenario modules.\n- **GitHub Actions CI** — format, HLint, multi-GHC build
  matrix, tests,\n  examples build.\n- **GitHub Actions Release pipeline** — Hackage
  upload (token-based), Haddock\n  to GitHub Pages, GitHub Release creation.\n- MIT
  License (Author: Tushar Adhatrao).\n\n---\n\n[Unreleased]: https://github.com/tusharad/wasmedge-hs/compare/v0.18.1.0...HEAD\n[0.18.1.0]:
  https://github.com/tusharad/wasmedge-hs/compare/v0.17.1.0...v0.18.1.0\n[0.17.1.0]:
  https://github.com/tusharad/wasmedge-hs/releases/tag/v0.17.1.0\n"
