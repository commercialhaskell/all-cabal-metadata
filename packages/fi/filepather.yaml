changelog: |
  # Changelog

  ## 0.8.0.0

  * Replace the optics of every data type with the classy optics recipe of
    claude-haskell: each data type has a class, `TLike`, whose method is its
    own name (`step`, `trail`, `repetition`, `cycle`, `filePather`,
    `tracked`), each field and constructor has a name, a class in its own
    module under System.FilePather.Name (`stepName`, `stepInput`, `steps`,
    `once`, `repeatable`, `file`, `pathFunction`), and each data type has a
    manifest (`lawNamesT`), a synonym and function of inheritance (`InheritT`,
    `inheritT`) and, where it holds another data type, a check of inheritance
    (`inheritsT`)
  * Remove the GetX, HasX, ReviewX and AsX classes, the Field and Injection
    instances of Step, Repetition and Cycle, and the Wrapped and Rewrapped
    instances of FilePather, Tracked and Trail; read the function of a
    FilePather with `view (cloneLens pathFunction)`
  * Remove the lenses `cycleStep` and `cycleTrail`, and the prisms `_Once`,
    `_Repeatable`, `_ReproducesInput` and `_RepeatsStep`: use `step`, `trail`
    (affine traversals of a Cycle), `once`, `repeatable`, `reproducesInput` and
    `repeatsStep`
  * Split System.FilePather.Trail into System.FilePather.Step,
    System.FilePather.Trail, System.FilePather.Repetition,
    System.FilePather.ReproducesInput, System.FilePather.RepeatsStep and
    System.FilePather.Cycle (checkStep and displayCycle)
  * The constructors of Cycle each hold a product type of their own:
    `CycleReproducesInput (ReproducesInput file step trail)` and
    `CycleRepeatsStep (RepeatsStep step trail)`
  * Rename step, stepWith, step' and stepWith' to track, trackWith, track' and
    trackWith', because `step` is the name of Step
  * System.FilePather exports the name `cycle`, which has the same name as
    Prelude.cycle
  * Remove the dependency on either-n
  * Build with -Werror=incomplete-patterns, and without
    -Wredundant-constraints
  * Add hedgehog tests of the classy optics: generators in the shape of each
    manifest, the coverage of each sum, the manifest laws, and the laws of the
    kind of every instance of every name

  ## 0.7.0.0

  * Start again, replacing filepather 0.6, in the document-build repository
  * Add System.FilePather.FilePather: FilePather f a, a newtype for
    FilePath -> f a, with type aliases (FilePather', FilePatherIO,
    FilePatherMaybe, FilePatherList, FilePatherNonEmpty, FilePatherEither,
    FilePatherMaybeT, FilePatherExceptT, FilePatherExitcode,
    FilePatherExitcode'), and instances, derived through ReaderT FilePath f
    where possible, for Generic, Generic1, NFData, Semigroup, Monoid, Functor,
    Apply, Applicative, Bind, Monad, Alt, Plus, Alternative, MonadPlus,
    MonadFail, MonadFix, MonadZip, MonadIO, MonadTrans, MonadReader FilePath,
    MonadState, MonadWriter, MonadError, MonadCont, Selective, Filterable,
    Distributive, Representable, Contravariant, Divisible, Decidable, Wrapped
    and Rewrapped
  * Add filePatherReaderT, the isomorphism between FilePather and ReaderT,
    and the classy optics GetFilePather, HasFilePather, ReviewFilePather and
    AsFilePather
  * Add System.FilePather.Combinators: (~>), (~>>), onFile, hoistFilePather,
    Rule, whenFile, rule, everyFile, hasExtension, isFile, isWithin,
    directoryFiles and directoryFilesWhere
  * Add System.FilePather.Trail: Step, Trail, Repetition and Cycle, with
    lenses, prisms and classy optics, checkStep and displayCycle
  * Add System.FilePather.Tracked: Tracked f a, named build steps that record
    the files they make, with step, stepWith, step', stepWith', untracked,
    askTrail, onPath, whenPath, whenTrail, hoistTracked, trackedFunction and
    classy optics, and instances for Generic, NFData, Functor, Apply,
    Applicative, Bind, Monad, Selective, Alt, Plus, Alternative, MonadPlus,
    Semigroup, Monoid, Filterable, MonadTrans, MonadIO, MonadFail,
    MonadReader FilePath, MonadState, MonadError, MonadWriter, Contravariant,
    Wrapped and Rewrapped
  * Add rewrite rules fusing compositions of fmap and mapMaybe for FilePather
    and Tracked
  * Add hedgehog property tests for the laws of every instance and optic, and
    doctests
changelog-type: markdown
description: |
  # filepather

  ![System F Logo](https://logo.systemf.com.au/systemf-450x450.png)

  Computations that depend on a file path, and named build steps that record
  the files they make.

  ## `FilePather`

  ```haskell
  newtype FilePather f a = FilePather (FilePath -> f a)
  type FilePather' a = FilePather Identity a
  ```

  A `FilePather` is isomorphic to `ReaderT FilePath f a`, with the same
  instances, and `ask` is the file path being operated on.
  `System.FilePather.Combinators` builds larger `FilePather` values from
  smaller ones:

  * `p ~> q` runs `q` on the file path that `p` produces, and `p ~>> q` runs `q`
    on each of the file paths that `p` produces.
  * `onFile` runs on another file path, and `hoistFilePather` changes `f`.
  * A `Rule f a` is a `FilePather` that applies to some file paths and not
    others. Make one with `rule predicate x`, and combine rules with `<|>`,
    where the first rule that applies is used.
  * `everyFile directoryFiles r` applies the rule `r` to every file in the
    directory being operated on.

  ## `Tracked`

  ```haskell
  newtype Tracked f a = Tracked (FilePather (ReaderT Trail (ExceptT Cycle f)) (Outputs, a))
  type Outputs = [(FilePath, Step)]
  ```

  A `Tracked` value is a build step, or several, run on a file path with the
  `Trail` of that file: the `Step`s that built it, nearest first, back to its
  source file. It produces its result and the files it made, each with the step
  that made it.

  * `track name outputs x` names the `FilePather` `x`, which makes the files
    `outputs` gives for its input. Before `x` runs, the step is checked against
    the trail: a step whose name is already in the trail (`CycleRepeatsStep`),
    or that would make a file already in the trail (`CycleReproducesInput`), is
    stopped with a `Cycle`, and `x` does not run.
  * `track' name x` names a `FilePather` that returns the files it made, for a
    step whose outputs are known only after it runs. It is checked after it
    runs.
  * `trackWith Repeatable` allows a step to appear more than once in a trail.
  * `whenPath`, `whenTrail`, `onPath`, `askTrail` and `untracked` choose
    files, and run `FilePather` values that make no files.
  * `displayCycle` describes the chain of a `Cycle`:

  ```
  src/a.md → markdown to pdf → public/a.pdf → pdf page 1 → public/a_page1.pdf → pdf page 1 again
  ```

  `Tracked` is separate from `FilePather`, so that `FilePather` keeps all of its
  instances (`Distributive`, `Representable`, `Selective`, `Decidable`, and the
  `MonadError` and `MonadWriter` of `f`). `Tracked` has `Functor`, `Apply`,
  `Applicative`, `Bind`, `Monad`, `Selective`, `Alt`, `Plus`, `Alternative`,
  `MonadPlus`, `Semigroup`, `Monoid`, `Filterable`, `MonadTrans`, `MonadIO`,
  `MonadFail`, `MonadReader FilePath`, `MonadState`, `MonadError`,
  `MonadWriter` and `Contravariant` instances. `<>` runs both steps and keeps
  the outputs of both; `<|>` and `catchError` alternate in `f`; and a `Cycle`
  is never caught or discarded by any of them.

  ## Optics

  Every data type has a name for each of its fields and constructors: a class
  whose method is an optic, of the kind that each data type gives it (the
  classy optics recipe of
  [claude-haskell](https://github.com/sirius-beta/claude-haskell)). Each name
  is in its own module under `System.FilePather.Name`, and each data type also
  has its own name (`step`, `trail`, `cycle`, `filePather`, `tracked`). A data
  type that holds another inherits its names, so `stepName` reaches the name of
  the step in a `Step`, a `ReproducesInput`, or a `Cycle`:

  ```haskell
  view (cloneLens stepName) (Step "pdf page 1" "a.pdf")        -- a lens
  preview stepName (CycleRepeatsStep (RepeatsStep s t))         -- an affine traversal
  view (cloneLens pathFunction) (asks length :: FilePather' Int) "notes.md"
  ```

  Read one value with `view (cloneLens n)`, at most one with `preview n`, and
  set with `set` and `over`. `System.FilePather` exports `cycle`, the name of
  `Cycle`, so hide `Prelude.cycle` where both are used.

  ## Development

  This package is built and tested with
  [document-build](https://gitlab.com/tonymorris/document-build), which
  uses it:

  ```
  cabal build all
  cabal test all
  bin/lint.sh --check
  ```
