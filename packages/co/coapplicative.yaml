changelog-type: markdown
description: |-
  Provides covariant oplax monoidal functors. These functors
  can be "split" and support pattern-matching while
  retaining the functorial context.
  Default instances are provided for CoApplicatives that
  agree with their Comonad instances,
  as well as a wrapper for (usually non-lawful)
  instances on any Comonad.
