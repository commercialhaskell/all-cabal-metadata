description: |-
  Provides Splittable and Coapplicative classes.
  Splittable functors are oplax monoidal functors over
  Either/Void and support pattern-matching that preserves
  the context.
  Coapplicatives support this while also having extraction/
  cocartesian costrength. Unlike the situation with cartesian
  strength, not all functors support this natively.

  Every Comonad can define an instance of Coapplicative,
  but these need not agree with duplication, and need
  not be unique due to the non-uniqueness of the costrength.

  Instances are provided when they are compatible with
  the existing Comonad instance.

  Credit to Chris McKinlay's profunctor-optics for informing
  the typeclass structure
