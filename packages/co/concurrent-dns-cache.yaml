changelog: |
  # ChangeLog for concurrent-dns-cache

  ## 0.1.4

  * If `resolve` (or `lookup`) was interrupted by an asynchronous
    exception such as `timeout`, all later calls for the same domain
    blocked forever. Now waiting threads are woken up.
  * Malformed numeric hosts such as `1..2.3` made `resolve`, `lookup`,
    `resolveCache` and `lookupCache` throw an error. Now only strict
    dotted-decimal IPv4 addresses are treated as numeric.
