changelog: |
  # Changelog

  ## 0.13.0.0 — 2026-11-14

  ### Breaking Changes

  - Require the published `shibuya-core ^>=0.13.0.0` from
    `mori://shinzui/shibuya` across the library, tests, examples and benchmarks.
    Core 0.13 renames processing spans from `<processor> process` to
    `process <processor>` and adds `messaging.operation.name = "process"`; update
    trace queries, dashboards and alerts that match the old span name.
  - Add the strict field `telemetry :: AdapterTelemetry` to `KafkaAdapterConfig`.
    Configurations built from `defaultConfig` with record update need no change;
    a full `KafkaAdapterConfig { .. }` literal must set it, normally to
    `defaultAdapterTelemetry`.

  ### New Features

  - Choose how each record's processing span relates to the producer's span with
    `telemetry = defaultAdapterTelemetry {traceCorrelation = LinkOnly}`. The
    default, `ParentAndLink`, keeps the span in the producer's trace as its child
    and now also links to the producer. `LinkOnly` starts a new trace per record,
    linked to the producer, for replay, sustained lag and wide consumer-group
    fan-out. Without a usable `traceparent` neither adds a link. Re-export
    `AdapterTelemetry (traceCorrelation)`, `defaultAdapterTelemetry` and
    `TraceCorrelation (..)` from `Shibuya.Adapter.Kafka`.

  ### Other Changes

  - Add broker-free correlation tests over the scripted log, document the setting
    in the README, and let `otel-demo` select `LinkOnly` with
    `OTEL_DEMO_LINK_ONLY=true`.
  - Refresh the README usage and runtime guidance.
  - Update `nix-haskell-flake` to 0.40.0 so the `redpanda-local-*` scripts use
    the host's container CLI.

  ## 0.12.0.0 — 2026-10-26

  ### Breaking Changes

  - Require the published `shibuya-core ^>=0.12.0.0` across the library, tests,
    examples, and benchmarks. Its delivery-status contract lets the runner skip
    superseded deliveries. This also adopts the extended application configuration,
    processor metrics, and paused-state API introduced in core 0.11.0.0 from
    `mori://shinzui/shibuya`.
  - In the exposed internal module, replace `dropStaleRecords` with `gateRecords`;
    `kafkaSource` now yields seek-stamped `Polled` records.

  ### Bug Fixes

  - Under serial single-message processing, skip buffered successors before
    handler entry until the retried record resolves. Same-batch work already
    admitted together and later revocation races retain their documented limits.
  - Retain replayed successors behind a pending retry so successful processing
    advances stored offsets to the log end without a restart. Missing retry offsets
    resume at the next available record with a warning.

  ### Other Changes

  - Keep all three repository packages on the shared `0.12.0.0` version line.
  - Update the Nix library build to use the published Shibuya core 0.12.0.0.
  - Run integration tests against the project-local Redpanda cluster, with
    `KAFKA_TEST_BROKER` available to select another broker.

  ## 0.9.1.0 — 2026-09-21

  ### Bug Fixes

  - Preserve the earliest unresolved delivery when multiple buffered Kafka
    callbacks request retry. Delivery tokens distinguish an original callback
    from the replay that may resolve its recovery boundary, so later buffered or
    duplicate callbacks cannot advance the stored offset past unresolved work.
  - Throw exhausted acknowledgement operations synchronously from the finalizer
    boundary. Core can now retain them as processor failures even after ingestion
    has stopped instead of depending on a future source poll of the fatal slot.
    The public `KafkaAcknowledgementException` carries the underlying
    `KafkaError` for callers that need to classify it.
  - Fence callbacks retained across a revoke/assign cycle when callers install
    `kafkaRebalanceHandler`. Assignment generations prevent an old owner from
    storing, seeking, or pausing a partition after reassignment.
  - Serialize each delivery finalizer with exception-safe ownership. Successful
    duplicates are no-ops, while failed or cancelled attempts remain retryable.

  ### Other Changes

  - Require `shibuya-core ^>=0.10.0.0` across the library, tests, benchmark,
    and example so the adapter is certified against the lifecycle-remediation
    release candidate. Keep all three repository packages on version `0.9.1.0`.
  - Add deterministic reference-model, cancellation, timeout, terminal-failure,
    repeated-shutdown, buffered-retry, restart, and actual-reassignment coverage.
  - Make the live restart fixture stream delivery identities to external files,
    emit a reconciled per-delivery ledger, and fail on duplicates, missing
    deliveries, unexpected deliveries, or malformed payloads without retaining
    the identity set in the measured process heap.
  - Keep the documented absence of a DLQ producer: `AckDeadLetter` still warns
    and stores the offset deliberately.
  - Exclude `effectful-core` 2.7.0.0 through 2.7.1.0 from the library, tests,
    benchmark, and examples because upstream records a per-operation performance
    regression for dynamically dispatched effects. The 2.6 family and 2.7.1.1 or
    later remain accepted.

  ## 0.9.0.1 — 2026-09-15

  ### Other Changes

  - Support `effectful-core` 2.7: raise the upper bound from `<2.7` to `<2.8`.
    Built and tested against effectful-core 2.7.1.2 on GHC 9.12.4; no source
    changes were needed. Nothing here uses the APIs 2.7 deprecated, renamed, or
    removed: `withLiftMap`, `stateM`/`modifyM`, the `*StateMVar` functions,
    `Effectful.Internal.MTL`, `SharedSuffix`, `KnownEffects`, or the `LocalEnv`
    `handlerEs` parameter. The lower bound stays at 2.6.1 so consumers are not
    forced to upgrade.
  - Require `shibuya-core ^>=0.9.0.1` and `kafka-effectful ^>=0.3.1.0`. Both are
    bounds-only upstream releases that widen `effectful` to `<2.8`; the previous
    versions cap it at `<2.7` and would hold the whole build on effectful 2.6.
    `kafka-effectful` 0.3.1.0 also fixes consumer crash-loops on partition EOF
    and idle-commit conditions.
  - Keep the example and benchmark packages on the shared `0.9.0.1` repo version
    line.

  ## 0.9.0.0 — 2026-08-10

  ### Breaking Changes

  - Require `shibuya-core ^>=0.9.0.0`. The upstream major bump adds the
    `DeadLetterReason.ApplicationFailure` constructor and the total
    `deadLetterReasonCode`, `deadLetterReasonDetail`, and
    `renderDeadLetterReason` projections. The adapter itself needed no code
    change for the new constructor, but consumers are forced onto the new
    `shibuya-core` major and must review their own `DeadLetterReason` matches.
  - The `AckDeadLetter` stderr warning now renders the reason with
    `renderDeadLetterReason` instead of derived `Show`. Application failures now
    log as `reason=my.app.code: detail` rather than
    `reason=ApplicationFailure (DeadLetterCode "my.app.code") "detail"`, matching
    the canonical rendering `shibuya-pgmq-adapter` writes to its DLQ payloads.
    The `[shibuya-kafka-adapter] WARNING: dead-lettered message DROPPED` prefix
    and the offset-acknowledgement semantics are unchanged.
  - Keep the example and benchmark packages on the same `shibuya-core` bound and
    repo version line.

  ## 0.8.0.1 — 2026-07-05

  ### Other Changes

  - Require `shibuya-core ^>=0.8.0.1`, picking up the upstream patch release
    with hot-path allocation fixes for `Async` and `Ahead` processing.
  - Keep the example and benchmark packages on the shared `0.8.0.1` repo
    version line.

  ## 0.8.0.0 — 2026-07-04

  ### Breaking Changes

  - Require `shibuya-core ^>=0.8.0.0`.
  - Remove the dead `KafkaAdapterConfig.offsetReset` field. Offset reset policy
    belongs to the `Subscription` passed to `runKafkaConsumer`; `topics` remains
    adapter metadata and is checked against the live subscription with a stderr
    warning on mismatch.

  ### New Features

  - Add `kafkaAdapterWith`, `newKafkaAdapterState`, and
    `kafkaRebalanceHandler` for callers that want rebalance logging and eager
    cleanup of retry barriers for revoked partitions.
  - Compute Kafka headers once in `consumerRecordToEnvelope` and expose
    `extractTraceHeadersFromList` for callers that already have a materialized
    header list.

  ### Bug Fixes

  - `AckRetry` now seeks the partition back to the failed message instead of
    storing the offset, preserving at-least-once redelivery.
  - Handler-exception retries from core no longer allow later buffered messages
    to commit past the failed offset.
  - Ack-path Kafka errors are classified inside `finalize`; transient failures
    are retried briefly, and persistent failures terminate the source stream as
    adapter errors instead of handler errors.
  - `AckHalt` pause failures no longer cancel the halt decision.
  - Idle shutdown exits promptly and ignores Kafka's no-offset response when
    there is nothing to commit.
  - `AckDeadLetter` still stores the offset, but now emits a prominent stderr
    warning because this adapter does not include a DLQ producer.

  ### Other Changes

  - Use the `shibuya-core 0.8.0.0` adapter-facing `mkEnvelope` and
    `mkIngested` smart constructors, and update runnable examples to the
    `runApp defaultAppConfig` / `Message` handler API.
  - Document the Serial-only processing contract, the dead-letter limitation,
    Kafka's lack of delivery-attempt counts, halt/eviction behavior, and shutdown
    ordering.
  - Keep the example and benchmark packages on the shared `0.8.0.0` repo version
    line.

  ## 0.7.0.0 — 2026-06-05

  ### Changed

  - Require `shibuya-core ^>=0.7.0.0`. `Envelope` now carries a
    `headers :: Maybe Headers` field; `consumerRecordToEnvelope` populates it
    with every Kafka header verbatim (ordered, duplicates preserved) via
    `headersToList`. A record with no headers yields `Just []`. The parsed W3C
    trace headers continue to appear in `traceContext` and now also appear
    verbatim in `headers`.

  ## 0.6.0.0 — 2026-05-31

  ### Breaking Changes

  - Tracks the `shibuya-core 0.6.0.0` release and the `hs-opentelemetry`
    1.0 package set. The framework's per-message OpenTelemetry span now
    emits `messaging.operation.type="process"` instead of the deprecated
    `messaging.operation="process"` key. Dashboards, alerts, and trace
    queries filtering on the old key must be updated.
  - Bumps the `kafka-effectful` dependency to `^>=0.3.0.0`, the first
    release with native `hs-opentelemetry` 1.0 support.

  ### Other Changes

  - Bumps direct OpenTelemetry dependencies to
    `hs-opentelemetry-api ^>=1.0` and
    `hs-opentelemetry-semantic-conventions ^>=1.40`.
  - Bumps example-only OpenTelemetry dependencies to the 1.0 package set:
    `hs-opentelemetry-sdk`, `hs-opentelemetry-exporter-otlp`, and
    `hs-opentelemetry-instrumentation-hw-kafka-client`.
  - Updates the OpenTelemetry examples for the 1.0
    `shutdownTracerProvider` API, which now takes an optional timeout.

  ## 0.5.0.1 — 2026-05-08

  ### Changed

  - Upgraded `hw-kafka-streamly` dependency from `^>=0.1` to `^>=0.2`. The
    upstream 0.2.0.0 release renames `Kafka.Streamly.Source` to
    `Kafka.Streamly.Stream` and `Kafka.Streamly.Sink` to `Kafka.Streamly.Fold`
    to match Streamly's native vocabulary. The adapter only used `skipNonFatal`
    and `isFatal` from the renamed module, both of which keep identical
    signatures; this is a mechanical import rename with no API-shape change.
    Haddock cross-references in `Shibuya.Adapter.Kafka` and
    `Shibuya.Adapter.Kafka.Internal` are updated accordingly.

  ## 0.5.0.0 — 2026-05-05

  ### Breaking Changes

  - Tracks the `shibuya-core 0.5.0.0` release, which adds an
    `attributes :: !(HashMap Text Attribute)` field to the `Envelope`
    record exported from `Shibuya.Core.Types`. The adapter's
    `consumerRecordToEnvelope` now populates this field with
    Kafka-typed OpenTelemetry attributes:
    `messaging.system="kafka"` (overrides the framework default of
    `"shibuya"`), the typed `messaging.kafka.destination.partition`
    (`Int64`) and `messaging.kafka.message.offset` (`Int64`).
  - The opt-in module `Shibuya.Adapter.Kafka.Tracing` is **deleted**.
    Its single export `traced :: TopicName -> Stream (Eff es)
    (Ingested es v) -> Stream (Eff es) (Ingested es v)` opened a
    duplicate Consumer-kind span per message under `runApp`, with
    the typed Kafka attributes split across the two spans (see plan
    9 of the `shinzui/shibuya` repo, Finding F1). The same job is
    now done by the framework's `processOne`, which reads
    `Envelope.attributes` and emits exactly one span. Callers that
    imported `traced` should remove the import and the
    `traced topic source` step; the rest of the wiring (the
    `runApp` / `runWithMetrics` integration) is unchanged.
  - The companion test
    `Shibuya.Adapter.Kafka.TracingTest` is deleted; its assertions
    (span shape, attribute set, ack passthrough) move into the
    framework's `Shibuya.Telemetry.SemanticSpec` upstream and into
    this repo's `Shibuya.Adapter.Kafka.ConvertTest` (the
    attribute-set assertions, against the envelope produced by
    `consumerRecordToEnvelope` in isolation).

  ### Other Changes

  - Bumps the `shibuya-core` build-depends pin to `^>=0.5` in all
    three packages of this repo (`shibuya-kafka-adapter`,
    `shibuya-kafka-adapter-bench`, `shibuya-kafka-adapter-jitsurei`).
  - The `shibuya-kafka-adapter-jitsurei/app/OtelDemo.hs` example is
    refactored to drive its message stream through Shibuya's
    `runWithMetrics`, so the framework's `processOne` opens the
    per-message span. The pre-deletion `traced` shape opened a
    sibling span; the new shape emits exactly one Consumer-kind
    span per message, parented on the producer's `traceparent`
    when present, carrying the spec-aligned messaging attributes
    plus the typed `messaging.kafka.*` attributes.
  - `unordered-containers ^>=0.2` is now a direct build-depends of
    `shibuya-kafka-adapter` (library and test stanzas) since
    `Convert.hs` constructs the new attribute `HashMap`.

  ## 0.4.0.0 — 2026-04-29

  ### Breaking Changes

  - Tracks the `shibuya-core 0.4.0.0` release, which adds an
    `attempt :: !(Maybe Attempt)` field to the `Envelope` record
    exported from `Shibuya.Core.Types`. The adapter's
    `consumerRecordToEnvelope` now sets this field to `Nothing`,
    consistent with the upstream guidance that adapters which cannot
    observe broker-side redeliveries (e.g. Kafka) report `Nothing`.
    Downstream code that pattern-matches on `Envelope` with positional
    patterns or with non-punned record patterns that name every field
    must be updated.

  ### Other Changes

  - Bumps the `shibuya-core` build-depends pin to `^>=0.4` in all three
    packages of this repo.
  - Drops three orphan `NFData` instances (`MessageId`, `Cursor`,
    `Envelope a`) from `shibuya-kafka-adapter-bench/bench/Main.hs`;
    these instances have been provided upstream by `shibuya-core` since
    `0.2.0.0` and the orphans had become duplicate-instance hazards
    whenever the bench resolved against a `shibuya-core` newer than
    `0.1`.
  - `shibuya-kafka-adapter-bench` and `shibuya-kafka-adapter-jitsurei`
    are re-released at `0.4.0.0` to track the shared version of this
    repo; neither has user-visible changes of its own.

  ## 0.3.0.0 — 2026-04-22

  Telemetry wire-format change. No Haskell API break —
  `Shibuya.Adapter.Kafka.Tracing.traced`'s signature is unchanged — but
  operators with dashboards filtering on the old attribute-key strings
  or span name must update their queries.

  ### Changed

  - Per-message spans now follow the OpenTelemetry messaging
    semantic-conventions span-name pattern `"<destination> <operation>"`,
    yielding e.g. `"orders process"` in place of the previous constant
    `"shibuya.process.message"`.
  - The `messaging.operation` attribute is now set to `"process"` on
    every consumer span.
  - The Kafka partition is now emitted as the typed Kafka-specific key
    `messaging.kafka.destination.partition` (Int64), replacing the
    never-defined `messaging.destination.partition.id` (Text). If the
    envelope's partition text does not parse as an integer, the
    shibuya-namespaced `shibuya.partition` is emitted as a defensive
    fallback.
  - The Kafka offset is now emitted as `messaging.kafka.message.offset`
    (Int64), derived from `Envelope.cursor` when it is a `CursorInt`.

  ### Aligned with

  - `Shibuya.Telemetry.Semantic` as of sibling `shibuya` plan 2
    (`docs/plans/2-align-opentelemetry-semantic-conventions.md` in the
    shibuya repo). Attribute keys for the generic `messaging.*`
    namespace are sourced from that module, which in turn derives them
    from typed `AttributeKey` values in
    `OpenTelemetry.SemanticConventions`.
  - `OpenTelemetry.SemanticConventions` (new direct `build-depends`)
    for the typed Kafka-specific keys
    `messaging_kafka_destination_partition` and
    `messaging_kafka_message_offset`.

  ## 0.2.0.0 — 2026-04-18

  Additive release. Adds one new exposed module, no changes to existing
  public types or to `kafkaAdapter`'s signature.

  ### Added

  - `Shibuya.Adapter.Kafka.Tracing` exposing a single stream transformer
    `traced :: (Tracing :> es, IOE :> es) => TopicName -> Stream (Eff es)
    (Ingested es v) -> Stream (Eff es) (Ingested es v)`. For each emitted
    `Ingested`, `traced` rewrites the envelope's `AckHandle` so that
    when the downstream handler calls `finalize` the call is enclosed
    in a Consumer-kind `shibuya.process.message` span parented on the
    envelope's carried W3C `traceparent` (or a root span when absent).
    The span carries the v1.27 messaging-conventions attribute set
    (`messaging.system`, `messaging.destination.name`,
    `messaging.message.id`, and — when partition is known —
    `messaging.destination.partition.id`) from
    `Shibuya.Telemetry.Semantic`.

  - Explicit `hs-opentelemetry-api ^>=0.3` build-depends edge on the
    library. The package was previously in the closure transitively via
    `shibuya-core`, but cabal does not let a library import from a
    transitively-present dependency.

  ## 0.1.0.0 — 2026-04-18

  Initial release.

  `shibuya-kafka-adapter` bridges Apache Kafka to the
  [Shibuya](https://github.com/shinzui/shibuya) queue-processing framework. It
  builds on [`kafka-effectful`](https://github.com/shinzui/kafka-effectful) for
  the consumer effect (polling, offset store, partition pause) and
  [`hw-kafka-streamly`](https://hackage.haskell.org/package/hw-kafka-streamly)
  for error classification (`skipNonFatal`), on top of
  [`hw-kafka-client`](https://github.com/haskell-works/hw-kafka-client).

  ### Features

  - Poll-driven consumer that produces Shibuya `Envelope` values from Kafka
    `ConsumerRecord`s.
  - Offset-commit semantics combining `noAutoOffsetStore`, explicit
    `storeOffsetMessage` on successful acknowledgement, and librdkafka
    auto-commit of the stored offsets.
  - Partition-aware dispatch: `Envelope`s carry topic/partition/offset, and
    `AckHalt` pauses the originating partition via the consumer effect.
  - W3C `traceparent` / `tracestate` header extraction from Kafka message
    headers, surfaced on the Shibuya `Envelope` for OpenTelemetry propagation.
  - Kafka message timestamp conversion to Shibuya's `UTCTime` representation.
  - Graceful shutdown that calls `commitAllOffsets` so stored offsets are
    flushed before the consumer handle closes.

  ### Known Limitations

  - No automatic partition resume after `AckHalt` within the consumer session;
    resumption is left to the operator or the next rebalance.
  - No dead-letter queue production. `AckDead` stores the offset so the stream
    advances past the poison message but does not publish it anywhere.
changelog-type: markdown
description: |
  # shibuya-kafka-adapter

  Consume Kafka messages through the [Shibuya](mori://shinzui/shibuya)
  queue-processing framework, with explicit acknowledgements, partition-aware
  retries, offset management, and OpenTelemetry context propagation.

  **Release:** [0.12.0.0 on Hackage](https://hackage.haskell.org/package/shibuya-kafka-adapter-0.12.0.0)
  · [API documentation](https://hackage.haskell.org/package/shibuya-kafka-adapter-0.12.0.0/docs/Shibuya-Adapter-Kafka.html)
  · [Changelog](CHANGELOG.md)

  The adapter requires `shibuya-core ^>=0.12.0.0` and GHC 9.12. The repository's
  Nix shell uses GHC 9.12.4. It builds on
  [kafka-effectful](mori://shinzui/kafka-effectful) for consumer operations and
  [hw-kafka-streamly](mori://shinzui/hw-kafka-streamly) for poll-error classification.

  ## Using the adapter

  Add these dependencies to your application:

  ```cabal
  build-depends:
    base ^>=4.21,
    effectful-core,
    hw-kafka-client >=5.3 && <6,
    kafka-effectful ^>=0.3.1.0,
    shibuya-core ^>=0.12.0.0,
    shibuya-kafka-adapter ^>=0.12.0.0
  ```

  The consumer scope owns the Kafka connection and subscription. Create the
  adapter inside that scope and use `mkProcessor`, which defaults to serial
  processing. Disable automatic offset storage so a record's offset is stored
  only after acknowledgement.

  This example prints messages from `orders` on `localhost:9092`:

  ```haskell
  {-# LANGUAGE GHC2024 #-}
  {-# LANGUAGE OverloadedRecordDot #-}
  {-# LANGUAGE OverloadedStrings #-}

  module Main (main) where

  import Control.Monad.IO.Class (liftIO)
  import Effectful (runEff)
  import Effectful.Error.Static (runError)
  import Kafka.Consumer.Types (OffsetReset (Earliest))
  import Kafka.Effectful.Consumer qualified as Kafka
  import Shibuya.Adapter.Kafka
    ( BrokerAddress (..), ConsumerGroupId (..), KafkaError, TopicName (..)
    , defaultConfig, kafkaAdapter
    )
  import Shibuya.App (ProcessorId (..), defaultAppConfig, mkProcessor, runApp, waitApp)
  import Shibuya.Core.Ack (AckDecision (AckOk))
  import Shibuya.Core.Ingested (Message (..))
  import Shibuya.Core.Types (Envelope (..))
  import Shibuya.Telemetry.Effect (runTracingNoop)

  main :: IO ()
  main = do
    result <- runEff . runError @KafkaError . runTracingNoop $ do
      let props = Kafka.brokersList [BrokerAddress "localhost:9092"]
               <> Kafka.groupId (ConsumerGroupId "orders-consumer")
               <> Kafka.noAutoOffsetStore
          sub = Kafka.topics [TopicName "orders"] <> Kafka.offsetReset Earliest
      Kafka.runKafkaConsumer props sub $ do
        adapter <- kafkaAdapter (defaultConfig [TopicName "orders"])
        let handler message = do
              liftIO (print message.envelope.payload)
              pure AckOk
        app <- runApp defaultAppConfig
          [(ProcessorId "orders", mkProcessor adapter handler)]
        case app of
          Left err -> liftIO (fail (show err))
          Right handle -> waitApp handle
    case result of
      Left err -> fail (show err)
      Right () -> pure ()
  ```

  `defaultConfig` polls with a 1,000 ms timeout and a maximum batch size of 100.
  Its `topics` field supplies adapter metadata and is checked against the live
  subscription. Subscription topics and offset-reset policy belong to
  `runKafkaConsumer`.

  ## Acknowledgements and ordering

  **Use serial processing.** The adapter does not support Shibuya's `Async` or
  `Ahead` policies. librdkafka stores the highest offset per partition without
  tracking gaps; concurrent finalization can commit past unresolved work. The
  adapter cannot inspect or enforce the processor's concurrency policy.

  | Decision | Adapter behavior |
  | --- | --- |
  | `AckOk` | Store the record's offset locally; auto-commit or consumer close flushes it to the broker. |
  | `AckRetry` | Keep the earliest unresolved delivery as the retry boundary, seek back to it, and leave its offset unstored. |
  | `AckDeadLetter` | Store the offset and log a `dead-lettered message DROPPED` warning. The adapter has no DLQ producer. |
  | `AckHalt` | Pause the originating partition without storing its offset; the processor stops. |

  With serial single-message processing, a retry blocks later messages in the
  same partition. Pre-seek records are discarded, already-buffered successors
  are skipped before handler entry, and replayed successors wait until the
  retried record resolves. Later callbacks cannot replace the earliest retry
  boundary or store offsets past it. A retry cannot undo messages already
  admitted together in the same handler batch.

  If retention or compaction removed the retry offset, the adapter warns and
  resumes at the next available record. Kafka provides no delivery-attempt
  counter here: `Envelope.attempt` is always `Nothing`. Use an external store
  for bounded retry counts, or halt processing.

  A dead-letter acknowledgement advances the group's position without publishing
  the message elsewhere. Arrange any required DLQ publication before returning
  `AckDeadLetter`.

  ## Rebalances and shutdown

  For assignment fencing, create state with `newKafkaAdapterState`, add
  `Kafka.Consumer.setCallback (Kafka.Consumer.rebalanceCallback (kafkaRebalanceHandler state))`
  to the consumer properties before consumer creation, and construct the adapter
  with `kafkaAdapterWith state config`.

  The callback logs assignment changes, clears retry state on revocation, and
  fences old delivery callbacks so they cannot store, seek, or pause a later
  assignment. Deliveries revoked before their admission check are skipped. A
  revocation after that check cannot cancel a handler already admitted. The
  helper is optional; `kafkaAdapter` alone does not provide this ownership fence.

  Keep the consumer scope open while stopping the Shibuya application. Adapter
  shutdown signals the source to stop and commits offsets already stored. Let
  `runKafkaConsumer` close normally afterward so it can flush offsets stored
  during draining.

  After `AckHalt`, polling stops. The consumer can lose its assignment when
  `max.poll.interval.ms` expires; a single-member group needs a restart to resume.
  Partition pause state belongs to the consumer session.

  ## Errors and tracing

  Non-fatal poll errors, including timeouts and partition EOFs, are filtered out.
  Fatal poll errors terminate the source through `Error KafkaError`. Exhausted
  acknowledgement operations throw `KafkaAcknowledgementException` at the
  finalizer boundary so Shibuya can retain the processor failure.

  The adapter preserves Kafka headers, extracts W3C `traceparent` and `tracestate`,
  and adds `messaging.system=kafka`, `messaging.kafka.destination.partition`, and
  `messaging.kafka.message.offset` to the envelope. Shibuya's runner uses these
  attributes on its per-message span. The example above disables tracing with
  `runTracingNoop`; use the configured tracing interpreter to export spans.

  ## Trace correlation

  When a record carries a W3C `traceparent` header, Shibuya opens a Consumer span
  named `process <processor>` around the handler and always adds a *link* to the
  producer's span. The `telemetry` field of `KafkaAdapterConfig` decides whether
  that span is also the producer's child:

  ```haskell
  import Shibuya.Adapter.Kafka

  -- Default (ParentAndLink): the handler runs inside the producer's trace.
  config = defaultConfig [TopicName "orders"]

  -- LinkOnly: each record's processing starts its own trace, linked to the producer.
  replaying =
    (defaultConfig [TopicName "orders"])
      { telemetry = defaultAdapterTelemetry {traceCorrelation = LinkOnly}
      }
  ```

  `ParentAndLink` suits records consumed close to real time: producer and
  consumer appear in one connected trace. Choose `LinkOnly` when the producer's
  trace has usually ended before processing starts, so the consumer span would
  only stretch it:

  - replay from an old offset, or a reprocessing job over retained data;
  - sustained consumer lag;
  - many consumer groups on one topic, each of which would otherwise add its
    processing to the same producer trace.

  A `LinkOnly` trace is sampled on its own, independently of the producer's
  sampling decision, and a tail-sampling collector sees it as a new trace. The
  link still lets a trace backend navigate to the producer.

  OpenTelemetry's messaging conventions allow creation-context parenting for a
  single message and recommend against it by default only when processing runs
  inside another span; Shibuya records its choice in its ADR 0014
  (`mori://shinzui/shibuya`, `docs/adr/0014-define-consumer-correlation-and-bounded-batch-link-accounting.md`;
  artifact URI pending). Without a usable `traceparent` neither setting adds a
  link, and the span keeps whatever span is active on the processing thread as
  its parent.

  Batch processors ignore the setting: a batch span is always a root with one
  link per record (the first 128 records with a valid context), each link
  carrying the record's `messaging.message.id`, and
  `messaging.batch.message_count` on the span.

  ## Examples and development

  See the [repository README](https://github.com/shinzui/shibuya-kafka-adapter#development)
  for runnable examples, the Nix toolchain, and live Kafka integration tests. Only
  the adapter library is published to Hackage.

