changelog: "# Revision history for base64\n\n## 2.1\n\nThis release completes the
  typed parser API for URL-safe Base64. It removes\n`isBase64Url` and `isValidBase64Url`;
  see [MIGRATION-2.1.md](MIGRATION-2.1.md)\nfor replacement examples.\n\n* Adds `parseBase64Padded`
  and `parseBase64Unpadded` to all six URL-safe\n  modules: strict, lazy, and short
  ByteString and Text. URL Parsers validate the URL alphabet, length, padding policy,
  and canonical padding bits before returning the original encoded value. Lazy parsers
  validate\n  the whole input and preserve its chunk boundaries; Text parsers do not\n
  \ require the decoded payload to be valid UTF-8.\n* Removed both URL `Bool` validators
  in line with the `2.0` work. No one was using them. \n\n## 2.0\n\nThis release removes
  two public functions. See [MIGRATION-2.0.md](MIGRATION-2.0.md)\nfor replacement
  examples and the stricter validation behavior.\n\n* Replace `isBase64` and `isValidBase64`
  with `parseBase64` in all six\n  standard-alphabet modules. The parser returns\n
  \ `Either Text (Base64 'StdPadded a)`, preserving the original encoded input\n  after
  checking its alphabet, length, padding, and canonicity.\n* For a Boolean check,
  migrate to `isRight . parseBase64`. This is stricter\n  than the old shape-only
  `isValidBase64` check. URL-specific validators\n  are unchanged.\n* Remove the predicates
  without a deprecation period. A source scan of 45\n  published direct dependents
  found no occurrences of either function;\n  private projects and other historical
  versions were not covered.\n* Add an optional, manual `simd` flag (off by default)
  for bundled ARM64 NEON\n  and runtime-detected x86-64 AVX2/SSSE3 encoding and strict
  decoding.\n* The SIMD path retains scalar fallbacks, encoding and decoding behavior,\n
  \ padding/canonicity checks, and decoding error offsets.\n* Add flag-on/off test
  and benchmark variants, SIMD boundary regressions,\n  and native memory checks in
  CI.\n\n## 1.0.1\n\n* Support GHC 9.6 through 9.14, including `base-4.22`.\n* Require
  GHC 9.6 or later (`base >= 4.18`) and `bytestring >= 0.11`.\n* Refresh CI for current
  stable GHC releases and GitHub Actions; retire the i386 CI job.\n* Update maintainer
  metadata and copyright notices through 2026.\n* No changes to the public API.\n\n##
  1.0\n\nNew epoch time! lots of changes to the API. Please see [MIGRATION-1.0.md](MIGRATION-1.0.md)
  for more info:\n\n* Add support for GHC 9.x\n* Bumped bounds to more modern dependency
  set\n* Introduced `Base64` newtype, located in `Data.Base64.Types`, as well as ADT
  for associated alphabets.\n* Signature for `encodeBase64` has changed so that it
  produces a `Base64` wrapped value.\n* `decodeBase64` and its URLsafe variants now
  consume a value of type `Base64` and produces a decoded value of the underlying
  type.\n* The *old* `decodeBase64` and its URLsafe variants is now renamed to `decodeBase64Untyped*`.\n*
  Fix for 32-bit systems in which memory barriers were not respected in the encoe
  loop (see: #56)\n* Optimize encode and decode loops to achieve *significant speedup*
  across the board.\n\nThanks to everyone who contributed (especially @sofia-m-a!).\n\n##
  0.4.2.4\n\n* Support for GHC 9.2.x\n* Remove dependency on `ghc-byteorder`\n* Bump
  base lower bound to GHC 8.10.x to make sure endianness is properly support\n  (see:
  https://gitlab.haskell.org/ghc/ghc/-/issues/20338)\n* Bump upper bound for `deepseq`\n\n##
  0.4.2.3\n\n* Tighter length calculations in unpadded base64url [#35](https://github.com/emilypi/base64/pull/35)\n\n##
  0.4.2.2\n\n* Add `NFData`, `Exception`, and `Generic` instances for `Base64Error`
  + `@since` annotations for new instances. ([#28](https://github.com/emilypi/base64/pull/28))\n*
  Doc improvements and add `-XTrustworty` and `-XSafe` annotations where needed. ([#27](https://github.com/emilypi/base64/pull/27))\n*
  Improve URL canonicity validation and correctness checking (now supports correct
  checking for unpadded Base64url) ([#26](https://github.com/emilypi/base64/pull/26))\n*
  Fixed perf regressions in decode\n* Test coverage is at 98%\n\n## 0.4.2.1\n\n* Security
  fix: reject non-canonical base64 encoded values - ([#25](https://github.com/emilypi/base64/pull/25))\n\n*
  Perf improvements\n\n## 0.4.2\n\n* Added support for `Data.ByteString.Short`, `Data.ByteString.Lazy`,
  `Data.Text.Short`, and `Data.Text.Lazy`. ([#17](https://github.com/emilypi/base64/pull/17))\n*
  Optimize decode algorithm (now beats `base64-bytestring` in every category!) - ([#13](https://github.com/emilypi/base64/pull/13))\n*
  Use `decodeLatin1` when decoding to text, so that functions are total - ([#13](https://github.com/emilypi/base64/pull/13))\n*
  Added `decodeWith*` variants and a `Base64Error` type to handle decoding errors
  when decoding base64 values - ([#13](https://github.com/emilypi/base64/pull/13))\n*
  Improved error reporting: all offsets are now precisely accurate. - ([#13](https://github.com/emilypi/base64/pull/13))\n*
  Validations added to head, rejecting invalid corner cases (such as bytestrings of
  length `l == 1 mod 4`, which are never correct) - ([#16](https://github.com/emilypi/base64/pull/16))\n*
  Added `decodeBase64Padded` for symmetry - ([#13](https://github.com/emilypi/base64/pull/13))\n\n\n##
  0.4.1 -- 2020-02-04\n\n* Optimize loops for 32-bit and 64-bit architectures\n* Restructure
  project to be more amenable to swapping head/tail/loops\n* Fix module header alignment\n\n##
  0.4.0 -- 2020-01-26\n\n* With this major version release, we remove the redundant
  `encodeBase64Unpadded` and `decodeBase64Unpadded` functions from `Base64.hs`. This
  is for two reasons:\n  1. There is no reason for them to exist, since all std base64
  is expected to be padded (in contrast to base64url)\n  2. it was literally redundant
  with `decodeBase64`.\n\n* Use a specialized `Bool` type to give better visual cues
  regarding which functions add padding\n\n## 0.3.1.1 -- 2020-01-15\n\n* Make sure
  benchmark code builds\n\n## 0.3.1.0 -- 2020-01-08\n\n* Bug fix for `isBase64` and
  `isBase64Url` - wrong alphabet was used\n* Added `isValidBase64` and `isValidBase64Url`
  for alphabet conformity. The `isBase64*` functions now tell if it's *correct* base64
  now in the sense that it's decodable and valid.\n* Dropped Cabal version to 2.0
  for backcompat with Stack\n* Better documentation\n\n## 0.3.0.0 -- 2020-01-07\n\n*
  After a discussion with lexilambda, we're making 'encodeBase64' be `ByteString ->
  Text` by default, offering `ByteString -> ByteString` as\n  a secondary format.\n*
  Add `decodeBase64Lenient` to the API for phadej\n* Fix unpadded decoding bug where
  garbage was appended to the end of garbage inputs. A cleaner way to do this is to
  simply encode as Base64 with\n  padding and then strip padding chars until I come
  up with a workflow specific to unpadded inputs (I used to have this, so I'll have
  to dig it up)\n* Added `isBase64` and `isBase64Url` to the API\n* Performance is
  stable\n\n## 0.2.0.0 -- 2020-01-05\n\n* After a discussion with phadej, we're doing
  away with the flags, and splitting the optics out into their own separate library\n*
  Removed unnecessary inline pragmas\n\n## 0.1.0.0 -- 2020-01-05\n\n* Do away with
  the typeclasses, and just provide prisms + synonyms\n* Continued performance improvements
  to decoding\n* Corrected benchmarks\n\n## 0.0.1.0 -- 2020-01-03\n\n* First version.
  Released on an unsuspecting world.\n* Preliminary release\n"
changelog-type: markdown
description: |
  # Base64

  ![Build Status](https://github.com/emilypi/base64/workflows/ci/badge.svg)
  [![Hackage](https://img.shields.io/hackage/v/base64.svg)](https://hackage.haskell.org/package/base64)

  Base64 encoding and decodings.

  For the companion optics and pattern synonyms, see [base64-lens](https://hackage.haskell.org/package/base64-lens).

  ### Summary

  The following types are supported for both std, padded url-safe, and unpadded url-safe alphabets:

  - `Data.ByteString`
  - `Data.ByteString.Lazy`
  - `Data.ByteString.Short`
  - `Data.Text`
  - `Data.Text.Lazy`
  - `Data.Text.Short`

  Additionally this library has

  - Better performance than `base64-bytestring` for encode and decode.
  - Optics for handling more complex structures with Base64 representations via the `base64-lens` package
  - Parses standard and URL-safe Base64 into validated `Base64` values
  - Rejects non-canonical encodings that do not roundtrip in other base64 libraries like `ZE==`.

  The library supports GHC 9.6 through 9.14. Its dependencies are `base`,
  `bytestring`, `deepseq`, `text`, and `text-short`.

  Upgrading to 2.1? See the [migration guide](MIGRATION-2.1.md) and
  [release notes](CHANGELOG.md#21) for the replacement of the URL-safe Boolean
  validators. If upgrading from 1.x, also follow the [2.0 migration guide](MIGRATION-2.0.md)
  for the standard-alphabet parsers and optional SIMD support.

  ### Parsing existing Base64

  Use `parseBase64` to validate externally supplied standard Base64 and retain the
  encoded value in a typed wrapper:

  ```haskell
  >>> import qualified Data.ByteString.Base64 as B64
  >>> :set -XOverloadedStrings
  >>> B64.parseBase64 "U3Vu"
  Right "U3Vu"
  >>> fmap B64.decodeBase64 (B64.parseBase64 "U3Vu")
  Right "Sun"
  >>> B64.parseBase64 "U3V="
  Left "non-canonical encoding detected at offset: 2"
  ```

  Each standard-alphabet module exports `parseBase64 :: a -> Either Text (Base64
  'StdPadded a)`, specialized to its string type. Parsing checks the alphabet,
  length, padding, and canonical padding bits, then returns the original encoded
  input. The Text variants validate Base64 independently of the decoded payload's
  UTF-8 validity; use `decodeBase64UntypedWith` to check that conversion.

  `parseBase64` replaces `isBase64` and `isValidBase64`. For a Boolean check, use
  `isRight . parseBase64` from `Data.Either`. Unlike the old `isValidBase64`, this
  rejects missing padding and non-canonical encodings.

  Each URL-safe module likewise replaces `isBase64Url` and `isValidBase64Url`
  with two parsers:

  ```haskell
  parseBase64Padded   :: a -> Either Text (Base64 'UrlPadded a)
  parseBase64Unpadded :: a -> Either Text (Base64 'UrlUnpadded a)
  ```

  Choose the parser for the required padding policy. Both preserve the input
  and check canonicity; the padded parser requires complete padding when needed,
  and the unpadded parser rejects any padding.

  ```haskell
  >>> import qualified Data.ByteString.Base64.URL as B64U
  >>> B64U.parseBase64Padded "PDw_Pj4="
  Right "PDw_Pj4="
  >>> B64U.parseBase64Unpadded "PDw_Pj4"
  Right "PDw_Pj4"
  >>> fmap B64U.decodeBase64Unpadded (B64U.parseBase64Unpadded "PDw_Pj4")
  Right "<<?>>"
  ```

  For a Boolean check that accepts either padding policy, use
  `isRight (B64U.parseBase64Padded input) || isRight (B64U.parseBase64Unpadded input)`.
  See the [migration guide](MIGRATION-2.1.md#parse-url-safe-input) for typed use.

  The complete parser API covers all six string representations:

  | Representation | Standard module | URL-safe module |
  | --- | --- | --- |
  | Strict `ByteString` | `Data.ByteString.Base64` | `Data.ByteString.Base64.URL` |
  | Lazy `ByteString` | `Data.ByteString.Lazy.Base64` | `Data.ByteString.Lazy.Base64.URL` |
  | `ShortByteString` | `Data.ByteString.Short.Base64` | `Data.ByteString.Short.Base64.URL` |
  | Strict `Text` | `Data.Text.Encoding.Base64` | `Data.Text.Encoding.Base64.URL` |
  | Lazy `Text` | `Data.Text.Lazy.Encoding.Base64` | `Data.Text.Lazy.Encoding.Base64.URL` |
  | `ShortText` | `Data.Text.Short.Encoding.Base64` | `Data.Text.Short.Encoding.Base64.URL` |

  Every standard module exports `parseBase64` for `StdPadded`. Every URL-safe
  module exports both `parseBase64Padded` for `UrlPadded` and
  `parseBase64Unpadded` for `UrlUnpadded`. All 18 combinations validate the whole
  input and preserve its encoded representation, including lazy chunk boundaries.
  `NonStandard` is a marker for input handled by lenient decoders; it does not
  define an alphabet or canonical validation rules.

  ### Optional SIMD

  Enable the manual `simd` Cabal flag to use bundled SIMD kernels for standard
  and URL-safe encoding and strict decoding, including the typed decoders:

  ```sh
  cabal build -fsimd
  cabal test -fsimd --test-show-details=direct
  ```

  The flag is **off by default**. ARM64 uses NEON; x86-64 selects AVX2 when
  the CPU and operating system support it, then SSSE3 on older processors.
  Other targets and short inputs use the existing
  Haskell loops. No external C library is required. Remainders, padding checks,
  canonical-encoding checks, and error messages still use the Haskell code.
  Lenient decoding remains scalar.

  Test both configurations and compare optimized benchmark builds separately:

  ```sh
  cabal test -f-simd --builddir=dist-scalar --test-show-details=direct
  cabal test -fsimd --builddir=dist-simd --test-show-details=direct
  cabal bench -f-simd --builddir=dist-scalar -O2 --benchmark-options='--csv scalar.csv'
  cabal bench -fsimd --builddir=dist-simd -O2 --benchmark-options='--csv simd.csv'
  ```

  Benchmark names identify the selected flag configuration. The suite covers
  standard Base64 and padded/unpadded Base64url, encoding and typed/untyped
  decoding, short and large buffers, and sliced inputs. The test suite exercises
  block boundaries, scalar tails, slices, invalid input, and wrapper types in
  both configurations; CI also runs native memory checks on x86-64 and ARM64,
  explicitly requiring AVX2 on Linux x86-64 and checking the SSSE3 and scalar
  fallbacks separately.

  For native kernel measurements, a standalone benchmark validates every case
  against scalar output and checks both alphabets. It times pseudorandom,
  cycling, and repeated inputs at two alignments.
  It reports the detected backend and writes CSV results:

  ```sh
  cc -O2 -std=c99 -Icbits cbits/base64_simd.c benchmarks/simd-native.c -o base64-native-bench
  ./base64-native-bench --seconds 0.05 --rounds 5 > native.csv
  ```

  Add `--url` to time the URL alphabet, or `--pattern random` to select one
  input distribution. On x86-64, compile a second executable with
  `-DHS_BASE64_SIMD_FORCE_SSSE3` to compare the older backend on the same CPU.
  These measurements cover native prefixes only; use the Cabal benchmarks above
  to include Haskell allocation and scalar tails.
