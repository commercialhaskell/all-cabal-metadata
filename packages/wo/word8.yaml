changelog: |
  # ChangeLog

  ## 0.1.4

  * `toUpper` and `toTitle` no longer convert `ÿ` (0xFF) to `ß` (0xDF).
  * `isPunctuation` and `isSymbol` are now implemented with bitmaps.
  * Dropped support for base < 4.9.
  * Fixed documentation.
