description: |
  # realdentalcosts (Haskell)

  Typed client for the [Real Dental Costs Open Data API](https://realdentalcosts.com/en/api/):
  US dental procedure cash price ranges by state, state cost indexes and Medicaid paid amounts
  per CDT code (HHS/CMS T-MSIS, 2018-2024). Data CC BY 4.0, code MIT.

  ```haskell
  import RealDentalCosts.Api

  main :: IO ()
  main = do
    Right p <- getProcedure "root-canal"
    print (avgUsd (procNational p), stateRow "TX" p, provConfidence (procProvenance p))
    Right m <- getMedicaid "D3330"
    print (msPaidPerLine (mdNational m))
  ```

  Human-readable tables: [root canal cost by state](https://realdentalcosts.com/en/root-canal/),
  [denture cost by state](https://realdentalcosts.com/en/dentures/),
  [dental implant cost by state](https://realdentalcosts.com/en/dental-implants/),
  [Medicaid dental coverage by state](https://realdentalcosts.com/en/medicaid-dental-coverage-by-state/).
  Methodology: <https://realdentalcosts.com/en/methodology/>. Dataset DOI 10.7910/DVN/7F2BZI.
  Pricing and market research, not medical advice.

  Status: source published; Hackage upload pending uploader-group approval.
