description: "# recollections\n\nThe splicing module needs these extensions and imports:\n\n```haskell\n{-#
  LANGUAGE TemplateHaskell #-}\n{-# LANGUAGE DerivingStrategies #-}\n{-# LANGUAGE
  DerivingVia #-}\n\nimport GHC.Generics (Generically1(..))\n```\n\nGiven an enumeration
  of things like\n\n```haskell\ndata Things\n  = This\n  | That\n  | Something\n  |
  Else\n  | Entirely\n  deriving (Eq, Ord, Show, Enum, Bounded, Generic)\n```\n\nWe
  can derive a record that will behave like a homogenous zip-list of static size:\n\n```haskell\nmkCollection
  ''Things\n\n-- data Collection a = Collection\n--   { this, that, something, else',
  entirely :: a\n--   }\n--   deriving stock (Eq, Show, Generic1, Functor, Foldable,
  Traversable)\n--   deriving Applicative via (Generically1 Collection)\n\n-- Fill
  the record with its indices\nmkIndices ''Things\n```\n\n## Kmettoverse-lite\n\n```haskell\n--
  Distributive\nmkDistribute ''Things\n-- collect is \n\n-- Representable\nmkIndex
  ''Things\nmkTabulate ''Things\n```\n\n## VS\n\n- Vanilla monomorphic records: don't
  have functor/foldable/traversable/applicative goodies.\n- Hand-rolling the functor:
  be my guest, hand-roll the field enum too, while you're at it.\n- `Map Things a`:
  All fields are mandatory, all keys are known -> lookups are total and O(1). The
  optional fields are recoverable, with `Collection (Maybe a)`.\n- `Things -> a`:
  The collection can be stored and loaded.\n\n## Gotchas\n\nAll the constructors of
  the tag type must be nullary — anything else is a\ncompile-time error, since a partial
  `Collection` would make `index` partial too.\n\nThe generated names (`Collection`,
  `indices`, `distribute`, `index`,\n`tabulate`) are fixed, so a tag named e.g. `Index`
  will clash with them.\n"
