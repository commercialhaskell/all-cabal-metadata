description: "# Terminal3DGraphics\r\n\r\nThis is a little 3D engine written in Haskell
  that draws straight into your terminal. You can walk around the scene with keyboard
  input, and it all renders in true-colour using ANSI half-block characters (▀), which
  lets each character cell show two stacked \"pixels\". This works on both Linux and
  Windows and also exports as a library if anyone wants to make custom 3D worlds.\r\n\r\n![Demo
  Portal World with Recursive Portal](SampleImages/Portal.png)\r\n\r\n![Demo Chess
  World in Low Resolution](SampleImages/Chess.png)\r\n\r\n![Demo Rainbow World](SampleImages/Rainbow.png)\r\n\r\n#
  Features\r\n\r\n - Movement around the worlds is done via entering keys on the keyboard
  and pressing enter. \r\n - Allows for Portals with recursive views through\r\n -
  Allows for selections of post processing and super sampling anti-aliasing\r\n -
  Has multiple demo worlds\r\n - Translations are selectable in the program\r\n -
  Allows customizable screen size\r\n - Pipelines auto-build versions for X64 Linux
  and Windows\r\n\r\n## Building the demo\r\n\r\nTo build with Cabal and have it actually
  run quickly\r\n\r\n```bash\r\ncabal build all\r\ncabal run t3d\r\n```\r\n\r\nTo
  run with the interpreter\r\n\r\n```bash\r\nghci -isrc -iapp -package parallel -package
  bytestring -package transformers -package array -package deepseq -package comonad
  -package process app/Main.hs\r\n:main\r\n```\r\n\r\n## Using as a library\r\n\r\nAdd
  to your `your-project.cabal`:\r\n\r\n```cabal\r\nbuild-depends: terminal-3d-graphics\r\n```\r\n\r\nThen
  in your Haskell source:\r\n\r\n```haskell\r\nimport Terminal3D\r\nimport Control.Monad.Trans.State
  (evalStateT)\r\n\r\nmain :: IO ()\r\nmain = do\r\n    tex <- readBMP \"myTexture.bmp\"\r\n
  \   let tris   = cubeFormer (texWallFormer tex)\r\n        lights = [Ray (Vec3 0.5
  1 0.5), Ambient 0.3]\r\n        world  = World (map (bakeLight lights) tris) Nothing\r\n
  \   evalStateT (loop world) def\r\n```\r\n"
