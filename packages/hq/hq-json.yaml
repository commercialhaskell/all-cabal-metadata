description: "# hq\n\n`hq` is a JSON processor inspired by `jq`. It queries JSON with
  optics and\nrewrites values with transformations, streaming input so large documents\nnever
  load fully into memory.\n\n## Usage\n\n```sh\nhq [OPTIONS] COMMAND OPTIC [ARGS]
  < input.json\n```\n\n```text\nhq v0.1.0\n\nUsage: hq [-f|--file FILE] [-r|--raw]
  [-c|--compact] [-j|--join] COMMAND\n\n  Query JSON using optics\n\nAvailable options:\n
  \ -f,--file FILE           Input JSON file, or '-' for stdin\n  -r,--raw                 Print
  strings without JSON quotes\n  -c,--compact             Print compact JSON\n  -j,--join
  \               Print without separators\n  -h,--help                Show this help
  text\n\nAvailable commands:\n  fold                     \n  preview                  \n
  \ set                      \n  over                     \n  delete\n```\n\n## Commands\n\nOptics
  are used with different queries:\n\n| Command | Meaning |\n| --- | --- |\n| `fold
  OPTIC` | Print every focused value, one per line. |\n| `preview OPTIC` | Print at
  most the first focused value. |\n| `set OPTIC VALUE` | Replace each focus with `VALUE`.
  |\n| `over OPTIC TRANSFORMATION` | Rewrite each focused value in place. |\n| `delete
  OPTIC` | Remove each focused value. |\n\n`preview` accepts any optic and prints
  its first focus in document\norder, stopping input there; it is `fold` capped at
  one value.\n`set` takes a JSON literal and\nis `over` with a constant transformation.
  `over` fails the whole query\nwhen a focused value rejects the transformation (adding
  to a string,\nfor example). Deleting a missing field, or an empty focus, leaves
  the\ninput unchanged.\n\nInput may hold any number of whitespace-separated JSON
  values\n(JSON-lines style); every command except `preview` processes each\ntop-level
  value in turn.\n\n## Optic language\n\nOptics select and traverse JSON values. Optics
  are composed with `.`;\neach component focuses on a new set of values. Spaces around
  `.` are\noptional, so `@a.each.@b` means `@a . each . @b`. Parentheses group\nexplicitly:
  `(@a . each) . @b`.\n\nAn optic may focus on nothing at all (a missing field, a
  value of the\nwrong shape, an out-of-bounds `ix`); such focuses simply select no\nvalues.
  Rewriting through `keys` renames object members.\n\n| Optic | Meaning |\n| --- |
  --- |\n| `@field` | Focus the `\"field\"` member of an object. |\n| `each` | Focus
  every element of an array, or every value of an object. |\n| `keys` | Focus every
  object key, as a string. |\n| `values` | Focus every value of an object. For arrays
  use `each` or `ix`. |\n| `id` | Focus the whole value unchanged (the unit of `.`).
  |\n| `_String` | Focus the value only if it is a string, and nothing otherwise.
  |\n| `_Number` | Focus the value only if it is a number, and nothing otherwise.
  |\n| `_Bool` | Focus the value only if it is a boolean, and nothing otherwise. |\n|
  `_Null` | Focus the value only if it is null, and nothing otherwise. |\n| `_Array`
  | Focus the value only if it is an array, and nothing otherwise. |\n| `_Object`
  | Focus the value only if it is an object, and nothing otherwise. |\n| `_Just` |
  Focus any non-null value. |\n| `ix N` | Focus array element `N` (0-based). |\n|
  `A . B` | Composition: focus `A`, then `B` within each target. |\n\n### `filter
  OPTIC TRANSFORMATION`\n\nKeep the input when `TRANSFORMATION` maps some value focused
  by `OPTIC`\nto `true`, and focus on nothing otherwise. The transformation must\nproduce
  a boolean.\n\nSingle atoms stay bare:\n\n```sh\nfilter @age == 30\n```\n\nAnything
  longer takes its own paren group per side:\n\n```sh\nfilter (each . @age) (== 30)\n```\n\nA
  `.` after a bare optic starts an outer composition, so a dotted optic\ninside `filter`
  needs its sides parenthesized:\n\n```sh\neach . filter (@tags . each) (== \"x\")\n```\n\nExamples:\n\n-
  `@name` : Focus the `\"name\"` field.\n- `@users . each . @name` : Focus the `\"name\"`
  field of every\n  element in `\"users\"`.\n- `@users . each . @age` : Focus the
  `\"age\"` field of every element\n  in `\"users\"`.\n- `each . _Number` : Focus
  every number inside an array.\n- `@a . ix 1` : Focus the second element of the array
  in `\"a\"`.\n\n## Transformations\n\nTransformations describe how a focused value
  is rewritten. They apply\nto one value at a time and compose right-to-left with
  `.`: in `A . B`,\n`B` runs first and `A` runs over its result. So `+ 1 . * 2` doubles\nfirst,
  then adds one.\n\nOperators bind tightest at the atoms, then `.`, then `and`/`&&`,
  then\n`xor`/`^^`, then `or`/`||` loosest. Parentheses override:\n`(== \"x\") or
  (== \"hi\")`.\n\n### Numbers (input and output are numbers)\n\n| Transformation
  | Meaning |\n| --- | --- |\n| `+ N` | Add `N`. Example: `+ 1`. |\n| `* N` | Multiply
  by `N`. Example: `* 2`. |\n| `- N` | Subtract `N`. Example: `- 1`. |\n\n### Comparisons
  (input is a number, output is a boolean)\n\n| Transformation | Meaning |\n| ---
  | --- |\n| `< N` | Test whether the value is less than `N`. Example: `< 30`. |\n|
  `<= N` | Test whether the value is at most `N`. Example: `<= 30`. |\n| `> N` | Test
  whether the value is greater than `N`. Sugar for `not . <= N`. |\n| `>= N` | Test
  whether the value is at least `N`. Sugar for `not . < N`. |\n\n### Strings (input
  is a string)\n\n| Transformation | Meaning |\n| --- | --- |\n| `++ \"s\"` | Append
  `s`. Example: `++ \"!\"`. |\n| `trim` | Strip surrounding whitespace. |\n| `replace
  \"a\" \"b\"` | Replace occurrences of `a` with `b`. |\n| `stripPrefix \"p\"` | Remove
  the prefix when present. |\n| `stripSuffix \"s\"` | Remove the suffix when present.
  |\n| `isPrefixOf \"p\"` | Test whether the value starts with `p`. |\n| `isSuffixOf
  \"s\"` | Test whether the value ends with `s`. |\n| `isInfixOf \"i\"` | Test whether
  the value contains `i`. |\n\n`stripPrefix` and `stripSuffix` leave the value unchanged
  when the\naffix is absent. The `is*` tests yield a boolean.\n\n### Arrays (input
  is an array)\n\n| Transformation | Meaning |\n| --- | --- |\n| `concat [...]` |
  Append the given elements. Example: `concat [3, 4]`. |\n| `reverse` | Reverse the
  elements. |\n| `unique` | Drop duplicates, keeping first occurrences. |\n| `sort`
  | Sort (canonical order): null, bools, nums, strings, arrays, objs. |\n| `length`
  | Element count, as a number. |\n| `isEmpty` | Test whether the array is empty,
  yielding a boolean. |\n\n### Objects (input is an object)\n\n| Transformation |
  Meaning |\n| --- | --- |\n| `merge {...}` | Shallow-merge the operand into the value
  (operand has pref). |\n| `deepMerge {...}` | Recursively merge the operand into
  the value. |\n\n### Any value\n\n| Transformation | Meaning |\n| --- | --- |\n|
  `== VALUE` (or `= VALUE`) | Test equality with a JSON literal. |\n| `const VALUE`
  | Replace with `VALUE`. |\n\nEquality examples: `== 30`, `== \"hi\"`, `== true`.
  `set` is `over`\nwith `const`.\n\n### Booleans (inputs are booleans, outputs are
  booleans)\n\n| Transformation | Meaning |\n| --- | --- |\n| `not` | Negate the value.
  |\n| `A or B` (or `A \\|\\| B`) | Disjunction; `B` runs only when `A` is `false`.
  |\n| `A and B` (or `A && B`) | Conjunction; `B` runs only when `A` is `true`. |\n|
  `A xor B` (or `A ^^ B`) | Exclusive disjunction. |\n| `A . B` | Composition: apply
  `B` first, then `A` over its result. |\n\nFor example:\n\n```sh\nhq over '@users
  . each . @age' '+ 1'\n```\n\nincrements every user's age, and\n\n```sh\nhq over
  '@users . each . @name' 'stripPrefix \"dr. \"'\n```\n\nstrips the prefix from every
  user's name when present.\n\n### Static checks\n\nQueries are checked before running.
  Steps that cannot work are\nrejected up front instead of failing mid-stream:\n\n-
  `/ 0` is rejected: division by zero.\n- A transformation applied where it cannot
  fit is rejected:\n  `over 'each._Number' '++ \"x\"'` fails because the optic focuses\n
  \ numbers and the transformation needs a string. Optics without a\n  pinned shape
  (`@field`, `each`, `ix`) focus values of unknown\n  type and accept anything; only
  prisms (and `keys`) narrow the\n  focus, so only provable mismatches are reported.\n-
  `filter` predicates must produce booleans, and accept their\n  sub-optic's focus
  type.\n\n## Examples\n\n```sh\necho '{\"name\":\"ada\",\"score\":96}' | hq fold
  '@name'\n# \"ada\"\n\necho '{\"name\":\"ada\"}' | hq fold '@name' -r\n# ada (raw:
  strings print without quotes)\n\necho '{\"a\":[1,2,3]}' | hq fold '@a . each'\n#
  1, 2, 3 (one per line)\n\necho '[{\"a\":90},{\"a\":96}]' | hq fold 'each . filter
  (@a) (== 90)' -c\n# [{\"a\":90}]\n\necho '{\"a\":1}' | hq over '@a' '+ 1' -c\n#
  {\"a\":2}\n\necho '{\"a\":1,\"b\":2}' | hq set '@b' '3' -c\n# {\"a\":1,\"b\":3}\n\necho
  '{\"a\":1,\"b\":2}' | hq delete '@b' -c\n# {\"a\":1}\n\n# nix\nnix build . --json
  \\\n  | hq -r fold 'each . @outputs . values' \\\n  | cachix push my-cachix-cache\n\n#
  Kubernetes\nkubectl get pods -o json \\\n  | hq -r fold '@items . each . @metadata
  . @name'\n\n# ffmpeg\nffprobe -v quiet -print_format json -show_streams video.mp4
  \\\n  | hq -r fold 'each . @codec_name'\n\n# Github\ncurl -s https://api.github.com/repos/damianfral/hq
  \\\n  | hq -r fold '@topics.each'\n```\n\n## Performance\n\nOn the 100 MB hq-bench-data
  benchmark (bench/bench.sh), fold runs about\n3x faster than jq, while over/set/delete
  perform around 1.2x faster.\n\nhq streams the input without materializing the document,
  keeping peak\nRSS at \\~14MB versus \\~600 MB for jq.\n\n![runtime](https://raw.githubusercontent.com/damianfral/hq/refs/heads/master/bench/v0.1.1/bench_runtime.svg)\n\n![memory](https://raw.githubusercontent.com/damianfral/hq/refs/heads/master/bench/v0.1.1/bench_memory.svg)\n"
