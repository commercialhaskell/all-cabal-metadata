changelog: |
  ## MMark 0.1.0.0

  * The package now requires `mmark-0.1` and `mmark-ext-0.3` or later.

  * `--ext-footnotes` now checks the footnotes of a document: a reference that
    leads nowhere, a footnote that nothing refers to, a footnote that is
    defined twice, and more than one footnote section are all reported as
    errors.

  * `--ext-toc` reports a document that asks for a table of contents but has
    no headings to put in one. The table of contents is also inserted before
    the other extensions run now, so `--ext-punctuation` applies to it too.

  * Added the following extensions, all new in `mmark-ext-0.3`:

      * `--ext-emoji`, which replaces `:shortcode:` with the emoji it names
        and reports a name it does not recognize.
      * `--ext-lazy-images`, which gives every image `loading="lazy"` and
        `decoding="async"`.
      * `--ext-line-highlight`, which points at the lines of a code block
        named by its info string, as in ```` ```haskell {2,4-6} ````. Both
        syntax highlighters read the same specification, so this renders the
        blocks they do not take.
      * `--ext-mermaid`, which renders a `mermaid` code block as `<pre
        class="mermaid">` for the mermaid script to pick up in the browser.
      * `--ext-permalinks`, which appends to every heading a link to its own
        id.

  * Removed `--ext-font-awesome` and `--ext-obfuscate-email`, because the
    extensions behind them are gone from `mmark-ext-0.3`.

  ## MMark CLI 0.0.5.2

  * Maintenance release with more minimal dependencies.

  ## MMark CLI 0.0.5.1

  * Dropped support for GHC 8.6 and older.
  * Works with aeson 2.

  ## MMark CLI 0.0.5.0

  * Added support for the `ghcSyntaxHighlighter` extension. Only available
    when compiled with GHC >= 8.4.1.

  ## MMark CLI 0.0.4.0

  * This version works with `mmark-0.0.6.0` and `megaparsec-7.0.0`.

  ## MMark CLI 0.0.3.0

  * This version works with `mmark-ext-0.2.0.0` and later.

  ## MMark CLI 0.0.2.0

  * Added two new extensions: footnotes (`--ext-footnotes`) and MathJax
    support (`--ext-mathjax`).

  ## MMark CLI 0.0.1.0

  * Initial release.
changelog-type: markdown
description: "# MMark CLI\n\n[![License BSD3](https://img.shields.io/badge/license-BSD3-brightgreen.svg)](http://opensource.org/licenses/BSD-3-Clause)\n[![Hackage](https://img.shields.io/hackage/v/mmark-cli.svg?style=flat)](https://hackage.haskell.org/package/mmark-cli)\n[![Stackage
  Nightly](http://stackage.org/package/mmark-cli/badge/nightly)](http://stackage.org/nightly/package/mmark-cli)\n[![Stackage
  LTS](http://stackage.org/package/mmark-cli/badge/lts)](http://stackage.org/lts/package/mmark-cli)\n[![CI](https://github.com/mmark-md/mmark-cli/actions/workflows/ci.yaml/badge.svg)](https://github.com/mmark-md/mmark-cli/actions/workflows/ci.yaml)\n\n*
  [Templates](#templates)\n* [Extensions](#extensions)\n  * [Comment paragraph](#comment-paragraph)\n
  \ * [Emoji](#emoji)\n  * [Footnotes](#footnotes)\n  * [Kbd tags](#kbd-tags)\n  *
  [Lazy images](#lazy-images)\n  * [Line highlighting](#line-highlighting)\n  * [Link
  targets](#link-targets)\n  * [MathJax](#mathjax)\n  * [Mermaid](#mermaid)\n  * [Permalinks](#permalinks)\n
  \ * [Punctuation prettifier](#punctuation-prettifier)\n  * [GHC syntax highlighter](#ghc-syntax-highlighter)\n
  \ * [Skylighting](#skylighting)\n  * [Table of contents](#table-of-contents)\n*
  [Contribution](#contribution)\n* [License](#license)\n\nThis is a command line application
  serving as an interface to the MMark\nmarkdown processor.\n\n```\nmmark—command
  line interface to the MMark markdown processor\n\nUsage: mmark [-v|--version] [-i|--ifile
  IFILE] [-o|--ofile OFILE] [-j|--json]\n             [-t|--template FILE] [--ext-comment
  PREFIX] [--ext-emoji]\n             [--ext-footnotes] [--ext-kbd] [--ext-lazy-images]\n
  \            [--ext-line-highlight] [--ext-link-target] [--ext-mathjax]\n             [--ext-mermaid]
  [--ext-permalinks] [--ext-punctuation]\n             [--ext-ghc-highlighter] [--ext-skylighting]
  [--ext-toc RANGE]\n\n  Command line interface to the MMark markdown processor\n\nAvailable
  options:\n  -h,--help                Show this help text\n  -v,--version             Print
  version of the program\n  -i,--ifile IFILE         Read markdown source from this
  file (otherwise read\n                           from stdin)\n  -o,--ofile OFILE
  \        Save rendered HTML document to this file (otherwise\n                           write
  to stdout)\n  -j,--json                Output parse errors and result in JSON format\n
  \ -t,--template FILE       Use the template located at this path\n  --ext-comment
  PREFIX     Remove paragraphs that start with the given prefix\n  --ext-emoji              Replace
  :shortcode: with the emoji it names\n  --ext-footnotes          Enable support for
  footnotes\n  --ext-kbd                Enable support for wrapping things in kbd
  tags\n  --ext-lazy-images        Let the browser decide when to fetch each image\n
  \ --ext-line-highlight     Point at the lines of a code block named by its info\n
  \                          string, e.g. \"haskell {2,4-6}\"\n  --ext-link-target
  \       Enable support for specifying link targets\n  --ext-mathjax            Enable
  support for MathJax formulas\n  --ext-mermaid            Render mermaid code blocks
  as diagrams in the browser\n  --ext-permalinks         Append a link to its own
  id to every heading\n  --ext-punctuation        Enable punctuation prettifier\n
  \ --ext-ghc-highlighter    Enable GHC syntax highlighter for Haskell code\n  --ext-skylighting
  \       Enable syntax highlighting of code snippets with\n                           Skylighting\n
  \ --ext-toc RANGE          Enable generation of table of contents using the\n                           supplied
  range of headers to include, e.g. \"1-6\" or\n                           \"2-4\"\n```\n\nAn
  extension may find something in the document that it cannot make sense\nof, such
  as a footnote reference that leads nowhere. When that happens it is\nreported the
  same way a parse error is, against the source of the document,\nand nothing is written
  to the output.\n\n## Templates\n\nBy using the `--template` argument, it's possible
  to create a standalone\nHTML page. The templating system we use is\n[Mustache](https://mustache.github.io/mustache.5.html),
  as implemented by\nthe [stache](https://hackage.haskell.org/package/stache) library.
  The\nlibrary conforms to version 1.1.3 of the official [Mustache\nspecification](https://github.com/mustache/spec),
  but does not implement\nlambdas (which is an optional feature of the specification)
  for simplicity\nand other technical reasons we won't touch here.\n\nIf the markdown
  source file has a YAML section, its contents will be\nprovided as context for rendering
  of the template. In addition to that, a\nnew top-level value bound to the variable
  named `output` will be available.\nThat variable contains the HTML rendition of
  the markdown document. It's\nbest to interpolate it without HTML escaping, like
  so: `{{& output }}`.\n\n## Extensions\n\nHere we list how to use the available extensions.
  The extensions come from\nthe [`mmark-ext`](https://hackage.haskell.org/package/mmark-ext)
  package.\n\n### Comment paragraph\n\n* Option: `--ext-comment PREFIX`\n\nThis extension
  removes paragraphs that start with the given `PREFIX`. For\nexample:\n\n```\n$ mmark
  --ext-comment REM\nFirst.\n\nREM Second.\n\nThird.\n----------------------- Control-D\n<p>First.</p>\n<p>Third.</p>\n```\n\n###
  Emoji\n\n* Option: `--ext-emoji`\n\nReplace every `:shortcode:` with the emoji it
  names:\n\n```\n$ mmark --ext-emoji\nShip it :rocket: and :tada:.\n-----------------------
  Control-D\n<p>Ship it \U0001F680 and \U0001F389.</p>\n```\n\nA shortcode is a run
  of letters, digits, `_`, `+`, and `-` between colons. A\nname that is not one of
  the recognized ones is reported as an error rather\nthan left alone, on the grounds
  that it is far more likely to be a typo than\nsomething you meant to keep:\n\n```\n$
  mmark --ext-emoji\nShip it :nosuchthing:.\n----------------------- Control-D\n<stdin>:1:1:\n
  \ |\n1 | Ship it :nosuchthing:.\n  | ^\nthere is no emoji called \"nosuchthing\"\n```\n\n###
  Footnotes\n\n* Option: `--ext-footnotes`\n\nThe extension performs two transformations:\n\n*
  It turns links with URIs with `footnote` scheme and single path piece\n  consisting
  of a number into links to footnote references.\n* It turns block quotes with the
  `\"footnotes\"` label (see the example below)\n  into a footnote section.\n\n```\n$
  mmark --ext-footnotes\nHere goes some text [1](footnote:1).\n\n> footnotes\n>\n>
  1. Here we have the footnote.\n----------------------- Control-D\n<p>Here goes some
  text <a href=\"#fn1\" id=\"fnref1\"><sup>1</sup></a>.</p>\n<ol>\n<li id=\"fn1\">\nHere
  we have the footnote.\n<a href=\"#fnref1\">↩</a></li>\n</ol>\n```\n\nThe footnotes
  of a document are also checked, so a reference that leads\nnowhere, a footnote that
  nothing refers to, a footnote that is defined\ntwice, and more than one footnote
  section are all reported as errors:\n\n```\n$ mmark --ext-footnotes\nHere goes some
  text [1](footnote:1).\n----------------------- Control-D\n<stdin>:1:21:\n  |\n1
  | Here goes some text [1](footnote:1).\n  |                     ^\nthere is no footnote
  1\n```\n\n### Kbd tags\n\n* Option: `--ext-kbd`\n\nIntroduce kbd tags into resulting
  HTML document by wrapping content in links\nwith URL with `kbd` scheme. For example:\n\n```\n$
  mmark --ext-kbd\nTo enable that mode press [Ctrl+A][kbd].\n\n[kbd]: kbd:\n-----------------------
  Control-D\n<p>To enable that mode press <kbd>Ctrl+A</kbd>.</p>\n```\n\nThe use of
  reference-style links seems more aesthetically pleasant to the\nauthor, but you
  can of course do something like this instead:\n\n```\nTo enable that mode press
  [Ctrl+A](kbd:).\n```\n\n### Lazy images\n\n* Option: `--ext-lazy-images`\n\nGive
  every image `loading=\"lazy\"` and `decoding=\"async\"`, so that an image\nfar down
  the page does not hold up the ones the reader can already see:\n\n```\n$ mmark --ext-lazy-images\n![a
  cat](cat.png)\n----------------------- Control-D\n<p><img loading=\"lazy\" decoding=\"async\"
  alt=\"a cat\" src=\"cat.png\"></p>\n```\n\n### Line highlighting\n\n* Option: `--ext-line-highlight`\n\nPoint
  at the lines of a code block that the prose is about by naming them\nafter the language
  in the info string. The lines are given the class\n`\"highlighted-line\"`, and the
  language, if there is one, still becomes the\n`language-` class of the `<code>`
  element:\n\n````\n$ mmark --ext-line-highlight\n```elixir {2}\nalpha\nbeta\ngamma\n```\n-----------------------
  Control-D\n<pre><code class=\"language-elixir\">alpha\n<span class=\"highlighted-line\">beta\n</span>gamma\n</code></pre>\n````\n\nThe
  specification is a comma-separated list of line numbers and ranges, so\n`{2,4-6}`
  points at lines 2, 4, 5, and 6.\n\nBoth syntax highlighters read the same specification
  and point at the lines\nthemselves, around the tokens they have coloured. This extension
  is what\nrenders the blocks they do not take, so combining it with one of them\nhighlights
  the languages that highlighter knows and still points at the\nlines in every other
  block:\n\n````\n$ mmark --ext-skylighting --ext-line-highlight\n```haskell {2}\nmain
  :: IO ()\nmain = return ()\n```\n----------------------- Control-D\n<div class=\"source-code\"><pre><code
  class=\"language-haskell\"><span class=\"ot\">main ::</span><span> </span><span
  class=\"dt\">IO</span><span> ()</span>\n<span class=\"highlighted-line\"><span>main
  </span><span class=\"ot\">=</span><span> </span><span class=\"fu\">return</span><span>
  ()</span>\n</span></code></pre></div>\n````\n\n### Link targets\n\n* Option: `--ext-link-target`\n\nWhen
  the title of a link starts with the word `\"_blank\"`, `\"_self\"`,\n`\"_parent\"`,
  or `\"_top\"`, it's stripped from the title (as well as all\nwhitespace after it)
  and added as the value of the `target` attribute of the\nresulting link. For example:\n\n```\n$
  mmark --ext-link-target\nThis [link](/url '_blank My title') opens in new tab.\n-----------------------
  Control-D\n<p>This <a target=\"_blank\" rel=\"noopener noreferrer\" href=\"/url\"
  title=\"My title\">link</a>\nopens in new tab.</p>\n```\n\n### MathJax\n\n* Option:
  `--ext-mathjax`\n\nThe extension allows us to transform inline code spans into MathJax
  inline\nspans and code blocks with the info string `\"mathjax\"` (case-sensitive)
  into\nMathJax display spans. Every line in such a code block will produce a\nseparate
  display span, i.e. a separate line with a formula (which is\nprobably what you want
  anyway).\n\nInline code spans must start and end with the dollar sign `$` to be\nrecognized
  as MathJax markup:\n\n````\n$ mmark --ext-mathjax\nLet's talk about `$A$` and `$B$`.\n\n```mathjax\nA
  \\xrightarrow{f} B\n```\n----------------------- Control-D\n<p>Let&#39;s talk about\n
  \ <span class=\"math inline\">\\(A\\)</span> and\n  <span class=\"math inline\">\\(B\\)</span>.\n</p>\n<p>\n
  \ <span class=\"math display\">\\[A \\xrightarrow{f} B\\]</span>\n</p>\n````\n\n###
  Mermaid\n\n* Option: `--ext-mermaid`\n\nRender a `mermaid` code block as `<pre class=\"mermaid\">`,
  which is what the\n[mermaid](https://mermaid.js.org/) script in the page looks for
  when it\nturns the diagram into an SVG in the browser:\n\n````\n$ mmark --ext-mermaid\nA
  diagram:\n\n```mermaid\ngraph TD;\n  A-->B;\n```\n----------------------- Control-D\n<p>A
  diagram:</p>\n<pre class=\"mermaid\">graph TD;\n  A--&gt;B;\n</pre>\n````\n\nYou
  will need to include the mermaid script for anything to happen; this\nextension
  only marks the block for it. Rendering diagrams ahead of time\ninstead requires
  the mermaid command line tool, which this program does not\ncall — use the `mermaidScanner`
  and `mermaidSvg` functions of `mmark-ext`\nfor that.\n\n### Permalinks\n\n* Option:
  `--ext-permalinks`\n\nAppend to every heading a link to the id MMark gives that
  heading. The link\nis labelled `\"#\"` and given the class `\"permalink\"`, so that
  a style sheet\ncan show it only when the heading is hovered:\n\n```\n$ mmark --ext-permalinks\n#
  Story of my life\n----------------------- Control-D\n<h1 id=\"story-of-my-life\">Story
  of my life<a href=\"#story-of-my-life\" class=\"permalink\" aria-hidden=\"true\"
  tabindex=\"-1\">#</a></h1>\n```\n\nThe link says nothing a screen reader can use,
  so it is hidden from one and\ntaken out of the order the keyboard walks.\n\n###
  Punctuation prettifier\n\n* Option: `--ext-punctuation`\n\nThis makes MMark prettify
  punctuation (only affects plain text in inlines),\nthe effect is the following:\n\n*
  Replace `...` with ellipsis `…`\n* Replace `---` with em-dash `—`\n* Replace `--`
  with en-dash `–`\n* Replace `\"` with left double quote `“` when previous character
  was a space\n  character, otherwise replace it with right double quote `”`\n* Replace
  `'` with left single quote `‘` when previous character was a space\n  character,
  otherwise replace it with right single quote `’` aka apostrophe\n\nFor example (not
  sure if this is the correct punctuation to use here, but it\ndemonstrates the effect):\n\n```\n$
  mmark --ext-punctuation\nSomething---we don't know what, happened...\n-----------------------
  Control-D\n<p>Something—we don’t know what, happened…</p>\n```\n\n### GHC syntax
  highlighter\n\n* Option: `--ext-ghc-highlighter`\n\nUse the [GHC syntax\nhighlighter](https://hackage.haskell.org/package/ghc-syntax-highlighter)\npackage
  to highlight code blocks with `\"haskell\"` info string using lexer of\nGHC itself.\n\nThe
  resulting HTML will be rendered as described\n[here](https://hackage.haskell.org/package/mmark-ext/docs/Text-MMark-Extension-GhcSyntaxHighlighter.html#v:ghcSyntaxHighlighter).\n\nExample:\n\n````\n$
  mmark --ext-ghc-highlighter\nSome Haskell:\n\n```haskell\nmain :: IO ()\nmain =
  return ()\n```\n----------------------- Control-D\n<p>Some Haskell:</p>\n<div class=\"source-code\"><pre><code
  class=\"language-haskell\"><span class=\"va\">main</span><span> </span><span class=\"sy\">::</span><span>
  </span><span class=\"cr\">IO</span><span> </span><span class=\"sy\">(</span><span
  class=\"sy\">)</span><span>\n</span><span class=\"va\">main</span><span> </span><span
  class=\"sy\">=</span><span> </span><span class=\"va\">return</span><span> </span><span
  class=\"sy\">(</span><span class=\"sy\">)</span><span>\n</span></code></pre></div>\n````\n\n###
  Skylighting\n\n* Option: `--ext-skylighting`\n\nUse the [skylighting](https://hackage.haskell.org/package/skylighting)\npackage
  to render code blocks with info strings that result in a successful\nlookup from
  the syntax table that comes with the library.\n\nThe resulting HTML will be rendered
  as described\n[here](https://hackage.haskell.org/package/mmark-ext/docs/Text-MMark-Extension-Skylighting.html#v:skylighting).\n\nExample:\n\n````\n$
  mmark --ext-skylighting\nSome Haskell:\n\n```haskell\nmain :: IO ()\nmain = return
  ()\n```\n----------------------- Control-D\n<p>Some Haskell:</p>\n<div class=\"source-code\"><pre><code
  class=\"language-haskell\"><span class=\"ot\">main ::</span><span> </span><span
  class=\"dt\">IO</span><span> ()</span>\n<span>main </span><span class=\"ot\">=</span><span>
  </span><span class=\"fu\">return</span><span> ()</span>\n</code></pre></div>\n````\n\n###
  Table of contents\n\n* Option: `--ext-toc RANGE`\n\nReplace the code block with
  info string `\"toc\"` by a table of contents\nassembled from headings with levels
  from `N` to `M`, where `N-M` is `RANGE`.\nA document that asks for a table of contents
  but has no headings to put in\none is reported as an error at the code block that
  asks.\n\nThe table of contents is inserted before the other extensions run, so\n`--ext-punctuation`
  prettifies the headings in the table just as it does the\nheadings in the document.\n\nFor
  example:\n\n````\n$ mmark --ext-toc 2-4\n# Story of my life\n\n```toc\n```\n\n##
  Chapter 1\n\nFoo.\n\n## Chapter 2\n\nBar.\n\n### Something\n\nBaz.\n-----------------------
  Control-D\n<h1 id=\"story-of-my-life\">Story of my life</h1>\n<ul>\n<li>\n<a href=\"#chapter-1\">Chapter
  1</a>\n</li>\n<li>\n<a href=\"#chapter-2\">Chapter 2</a>\n<ul>\n<li>\n<a href=\"#something\">Something</a>\n</li>\n</ul>\n</li>\n</ul>\n<h2
  id=\"chapter-1\">Chapter 1</h2>\n<p>Foo.</p>\n<h2 id=\"chapter-2\">Chapter 2</h2>\n<p>Bar.</p>\n<h3
  id=\"something\">Something</h3>\n<p>Baz.</p>\n````\n\n## Contribution\n\nIssues,
  bugs, and questions may be reported in [the GitHub issue tracker for\nthis project](https://github.com/mmark-md/mmark-cli/issues).\n\nPull
  requests are also welcome.\n\n## License\n\nCopyright © 2018–present Mark Karpov\n\nDistributed
  under the BSD 3-clause license.\n"
