changelog: |
  ## MMark Ext 0.3.0.0

  * The package now requires `mmark-0.1` or later.

  * Added the following modules:

      * `Text.MMark.Extension.Emoji`
      * `Text.MMark.Extension.Heading`
      * `Text.MMark.Extension.Icons`
      * `Text.MMark.Extension.Image`
      * `Text.MMark.Extension.LineHighlight`
      * `Text.MMark.Extension.Link`
      * `Text.MMark.Extension.Mermaid`
      * `Text.MMark.Extension.Metadata`
      * `Text.MMark.Extension.Permalinks`

  * Removed the following modules:

      * `Text.MMark.Extension.FontAwesome`
      * `Text.MMark.Extension.LinkTarget`
      * `Text.MMark.Extension.ObfuscateEmail`

  ## MMark Ext 0.2.1.5

  * The test suite now passes with `modern-uri-0.3.4.4`.

  ## MMark Ext 0.2.1.4

  * Prevent the test suite from failing ever again. [Issue
    25](https://github.com/mmark-md/mmark-ext/issues/25).

  ## MMark Ext 0.2.1.3

  * The test suite passes with `modern-uri-0.3.4` and later.

  * Dropped support for GHC 8.6 and older.

  ## MMark Ext 0.2.1.2

  * Made the tests pass with `skylighting-0.7.6`.

  ## MMark Ext 0.2.1.1

  * Made the tests pass with `skylighting-0.7.4`.

  ## MMark Ext 0.2.1.0

  * Added the module `Text.MMark.Extension.GhcSyntaxHighlighter` with
    `ghcSyntaxHighlighter` in it. This only works with GHC 8.4.1 and newer,
    with older GHCs the extension just won't have any effect.

  ## MMark Ext 0.2.0.0

  * The `skylighting` extension no longer accepts any arguments. Skylighting
    built-in facilities for rendering to HTML are not acceptable as they
    produce invalid HTML (with duplicate ids), so they were re-implemented.

  ## MMark Ext 0.1.1.0

  * Added the `Text.MMark.Extension.MathJax` module.

  * Added the `Text.MMark.Extension.Footnotes` module.

  ## MMark Ext 0.1.0.0

  * This version has little in common with previous versions.

  ## MMark Ext 0.0.1.2

  * Compiles with `modern-uri-0.2.0.0` and later.

  ## MMark Ext 0.0.1.1

  * Fixed test suite failure with newer MMark versions. This version is to be
    used with `mmark-0.0.2.0` and later.

  ## MMark Ext 0.0.1.0

  * Initial release.
changelog-type: markdown
description: |
  # MMark Extensions

  [![License BSD3](https://img.shields.io/badge/license-BSD3-brightgreen.svg)](http://opensource.org/licenses/BSD-3-Clause)
  [![Hackage](https://img.shields.io/hackage/v/mmark-ext.svg?style=flat)](https://hackage.haskell.org/package/mmark-ext)
  [![Stackage Nightly](http://stackage.org/package/mmark-ext/badge/nightly)](http://stackage.org/nightly/package/mmark-ext)
  [![Stackage LTS](http://stackage.org/package/mmark-ext/badge/lts)](http://stackage.org/lts/package/mmark-ext)
  [![CI](https://github.com/mmark-md/mmark-ext/actions/workflows/ci.yaml/badge.svg)](https://github.com/mmark-md/mmark-ext/actions/workflows/ci.yaml)

  Commonly useful extensions for the
  [MMark](https://hackage.haskell.org/package/mmark) markdown processor.

  ## Contribution

  Issues, bugs, and questions may be reported in [the GitHub issue tracker for
  this project](https://github.com/mmark-md/mmark-ext/issues).

  Pull requests are also welcome.

