changelog: |
  # Changelog for `smirk-effectful`

  All notable changes to the `smirk-effectful` package will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the Haskell Package Versioning Policy (PVP).

  ## [0.1.0.0] — 2026-10-24

  ### Added
  - **`Smirk.Effect.Effectful`**: First-class algebraic effect for Smirk's PCRE engine in the `effectful` ecosystem:
    - `SmirkRegex`: First-class effect type for regex matching, searching, and substitution.
    - `runSmirkPure`: Pure in-memory interpreter evaluating matches without side effects.
    - `runSmirkFuel`: Step-budgeted interpreter enforcing ReDoS bounds and raising `OutOfFuel` on budget exhaustion.
    - Combinators: `match`, `search`, `substitute`, `substituteAll`.
  - Full Hspec test suite verifying pure and fuel-bounded execution.
changelog-type: markdown
description: |
  # smirk-effectful

  **Effectful (algebraic effects) interface for the Smirk PCRE engine.**

  `smirk-effectful` provides first-class `effectful` bindings for Smirk's pure, step-bounded PCRE regular expression engine.

  ---

  ## Features

  - **First-Class Effect (`SmirkRegex`):** Idiomatic effect definition integrating seamlessly into `Eff es` stacks.
  - **Dual Interpreters:**
    - `runSmirkPure`: Unbounded pure in-memory execution.
    - `runSmirkFuel`: Fuel-bounded execution guaranteeing ReDoS immunity by returning `Left OutOfFuel` if a step budget is exceeded.
  - **Lightweight Dependency:** Only depends on `smirk` and `effectful`, without dragging in `polysemy`.

  ---

  ## Quick Example

  ```haskell
  {-# LANGUAGE DataKinds #-}
  {-# LANGUAGE QuasiQuotes #-}
  {-# LANGUAGE TypeApplications #-}

  import Effectful
  import Smirk (re)
  import Smirk.Effect.Effectful

  prog :: (SmirkRegex :> es) => Eff es (Maybe (Match Text))
  prog = match [re|hello (\w+)|] "hello world"

  main :: IO ()
  main = do
    let result = runPureEff (runSmirkPure prog)
    print result
  ```

  ---

