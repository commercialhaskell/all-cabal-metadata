changelog: |
  # Changelog for `smirk-polysemy`

  All notable changes to the `smirk-polysemy` package will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the Haskell Package Versioning Policy (PVP).

  ## [0.1.0.0] — 2026-10-24

  ### Added
  - **`Smirk.Effect.Polysemy`**: Extensible effect bindings for Smirk's PCRE engine in the `polysemy` ecosystem:
    - `SmirkRegex`: Polysemy higher-order effect for regex matching, searching, and substitution.
    - `runSmirkPure`: Pure in-memory interpreter.
    - `runSmirkFuel`: Fuel-bounded interpreter enforcing ReDoS bounds and raising `OutOfFuel` on budget exhaustion.
    - Smart constructors: `match`, `search`, `substitute`, `substituteAll`.
  - Full Hspec test suite verifying pure and fuel-bounded execution.
changelog-type: markdown
description: |
  # smirk-polysemy

  **Polysemy interface for the Smirk PCRE engine.**

  `smirk-polysemy` provides first-class `polysemy` bindings for Smirk's pure, step-bounded PCRE regular expression engine.

  ---

  ## Features

  - **Polysemy Effect (`SmirkRegex`):** Idiomatic effect definition integrating seamlessly into `Sem r` effect rows.
  - **Dual Interpreters:**
    - `runSmirkPure`: Unbounded pure in-memory execution.
    - `runSmirkFuel`: Fuel-bounded execution guaranteeing ReDoS immunity by returning `Left OutOfFuel` if a step budget is exceeded.
  - **Lightweight Dependency:** Only depends on `smirk` and `polysemy`, without dragging in `effectful`.

  ---

  ## Quick Example

  ```haskell
  {-# LANGUAGE DataKinds #-}
  {-# LANGUAGE QuasiQuotes #-}
  {-# LANGUAGE TypeApplications #-}

  import Polysemy
  import Smirk (re)
  import Smirk.Effect.Polysemy

  prog :: (Member SmirkRegex r) => Sem r (Maybe (Match Text))
  prog = match [re|hello (\w+)|] "hello world"

  main :: IO ()
  main = do
    let result = run (runSmirkPure prog)
    print result
  ```

