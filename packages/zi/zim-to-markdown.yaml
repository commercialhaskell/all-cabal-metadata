changelog: |
  # Changelog

  All notable changes to this project are documented in this file. This project follows the Haskell Package Versioning Policy.

  ## [Unreleased]

  ## [0.3.1.0] - 2026-10-29

  ### Added

  - Added `--images copy|symlink|relative` for external notebook images. `copy` is the default and copies them to `_assets`; `symlink` creates absolute symbolic links in `_assets`; `relative` links straight to the original files with `..` segments.
  - Added `relativePathTo` for relative targets that leave the output tree, with tests for the path helper and for the option parsing.

  ### Fixed

  - Stripped Zim image display options such as `?width=512` from Markdown image targets.
  - Handled images referenced outside the notebook with `~` or an absolute path, rewriting each link relative to its page so the images open in Markdown editors.
  - Skipped verbatim blocks when scanning image targets, and stopped compounding collision suffixes for generated assets.
  - Imported the shared warning stanza in every component and moved `-Werror` behind the manual `development` flag, because `cabal check` rejects an unconditional `-Werror`; CI now builds and tests with `-fdevelopment`. Fixed the warnings this exposed and raised the executable's `directory` bound to 1.3.1 for `createFileLink`.

  ### Changed

  - The converter exposes `convertZimPageWithAssets` with the final per-page image targets, and `ZimToMarkdown.Zim` exports the image target scanner.
  - Single pages reject the `symlink` and `relative` modes, and `markdown-to-zim` rejects every mode except `copy`.

  ## [0.3.0.3] - 2026-10-23

  ### Changed

  - Documented the planned domain smart constructors and the remaining conversion gaps in `docs/roadmap.md`.
  - Added a test that fails when any link target in the README is relative, so the Hackage readme keeps working, and made `directory` a test dependency.
  - Documented the installed executable in the README and CLI examples, keeping `cabal run` as the development form.
  - Updated the cache, artifact, attestation, and Gitleaks actions to Node 24 releases.
  - Documented the `libgmp-dev` build prerequisite on Debian and Ubuntu.

  ### Fixed

  - Replaced the partial `maximum` call in table normalization with a total fold.
  - Enabled `-Wincomplete-patterns` and `-Werror` in the shared build options, as `LANGUAGE.md` requires, and documented the single process failure boundary.
  - Replaced the relative documentation links in the README with absolute GitHub URLs, because Hackage resolves relative links against the package URL and they return 404 on the package page. Recorded the rule in `LANGUAGE.md` and `docs/releasing.md`.
  - Removed the stale "available after the first publication" note from the README.

  ## [0.3.0.2] - 2026-10-23

  ### Changed

  - Adopted Fourmolu formatting with a pinned configuration.
  - Added Fourmolu and Gitleaks checks to CI and pinned GitHub Actions by commit SHA.
  - Added a dedicated release guide and made binary publication an explicit manual step.
  - Added the HLint configuration and documented SSH tag signing, checksum basenames, and environment secret handling.
  - Declared every compiler exercised by CI in `tested-with`.

  ### Fixed

  - Removed partial `Text.head` calls from thematic break detection.

  ## [0.3.0.1] - 2026-10-21

  ### Fixed

  - Removed leading Zim metadata headers such as `Content-Type`, `Wiki-Format`, `Creation-Date`, and `Modification-Date`.
  - Normalized per-page heading levels into consecutive Markdown levels capped at `###`.
  - Translated namespace colons in internal links, so `[[Sistema:cron]]` resolves to `Sistema/cron.md`.
  - Rendered `user@host` pseudo-links as plain text instead of page links.
  - Corrected the reported application version to `0.3.0.1`.

  ### Changed

  - Added Hackage and GitHub package metadata, a changelog, and source repository information.
  - Added prebuilt Linux, macOS, and Windows binaries to GitHub releases.

  ## [0.3.0.0] - 2026-10-20

  ### Added

  - Pipe table conversion in both directions.
  - Horizontal rules, blockquotes, setext headings, anchors, HTML inline tags, autolinks, image alt text, and additional task states.
  - Recursive formatting inside link labels.
  - Support for passing `notebook.zim` as an alternative notebook root.

  ### Changed

  - Reflowed the README and documentation to avoid hard wrapped lines.
  - Documented the supported conversion rules and known limitations.

  ## [0.2.0.0] - 2026-10-20

  ### Added

  - Conversion of whole notebooks, preserving the folder structure.
  - Asset copying and internal link resolution across notebooks.
  - Markdown to Zim conversion.
  - Initial formatting rules for headings, emphasis, lists, tasks, links, images, and code blocks.
  - A dependency free test suite.

  ## [0.1.0.0] - 2026-10-20

  ### Added

  - Initial Cabal project scaffold with a pure library and a thin executable.
  - Command line parsing, domain types, versioning, and documentation.
changelog-type: markdown
description: |
  # zim-to-markdown

  Command line converter between Zim wiki pages and Markdown. It handles single pages and whole notebooks in both directions.

  ## Stack

  Haskell with Cabal. Stack is not used.

  ## Versioning

  PVP, single-sourced from the `zim-to-markdown.cabal` file.

  - Patch: fixes and minor refinements.
  - Minor: new user-facing features or screens.
  - Major 2: data model breaking changes.
  - Major 1: major release milestones.

  ## Features

  - Converts a single page to standard output or to a file.
  - Converts a whole notebook recursively, reconstructing its folder structure.
  - Accepts the notebook directory or its `notebook.zim` configuration file as input.
  - Strips the leading Zim metadata header and normalizes heading levels to `#`, `##`, and `###`.
  - Copies or links external images with `--images copy|symlink|relative`, so images and attachments keep working.
  - Resolves internal Zim links across the notebook.
  - Converts Markdown back to Zim, including notebook structure.
  - Supports headings, emphasis, lists, task lists, links, images, anchors, tables, blockquotes, horizontal rules, and code blocks.
  - Keeps conversion pure and reports failures as data.

  ## Links

  - Hackage: <https://hackage.haskell.org/package/zim-to-markdown>
  - GitHub: <https://github.com/Tralen/zim-to-markdown>

  ## Documentation

  - [Architecture](https://github.com/Tralen/zim-to-markdown/blob/main/docs/architecture.md)
  - [Domain model](https://github.com/Tralen/zim-to-markdown/blob/main/docs/domain.md)
  - [Command line interface](https://github.com/Tralen/zim-to-markdown/blob/main/docs/cli.md)
  - [Conversion rules](https://github.com/Tralen/zim-to-markdown/blob/main/docs/conversion.md)
  - [Release guide](https://github.com/Tralen/zim-to-markdown/blob/main/docs/releasing.md)
  - [Roadmap](https://github.com/Tralen/zim-to-markdown/blob/main/docs/roadmap.md)
  - [Versioning](https://github.com/Tralen/zim-to-markdown/blob/main/docs/versioning.md)
  - [Changelog](https://github.com/Tralen/zim-to-markdown/blob/main/CHANGELOG.md)

  ## Installation

  Install the published package from Hackage with:

  ```sh
  cabal install zim-to-markdown
  ```

  The executable is installed into the Cabal binary directory, usually `~/.cabal/bin`, which must be on `PATH`.

  ## Prebuilt binaries

  Prebuilt Linux, macOS, and Windows binaries are attached to [GitHub releases](https://github.com/Tralen/zim-to-markdown/releases/latest). The release workflow builds Linux x86_64 on Ubuntu 22.04 (glibc 2.35 or newer), macOS ARM64, and Windows x86_64 archives. Build from source for other Linux distributions.

  ## Requirements

  Building from source or installing with `cabal install` requires:

  - GHC 9.14.1
  - cabal-install 3.18.1.0

  On Debian and Ubuntu, install the `libgmp-dev` package before building, because GHC links against GMP.

  The prebuilt binaries attached to the GitHub releases do not need a Haskell toolchain.

  ## Build and test

  ```sh
  cabal build
  cabal test
  ```

  ## Development

  Run the formatter and linter with:

  ```sh
  fourmolu --mode check src app test
  hlint src app test
  ```

  Install the pre-commit hook to scan staged changes for secrets:

  ```sh
  pre-commit install
  ```

  The hook requires `gitleaks` to be installed. The equivalent manual command is:

  ```sh
  gitleaks git --staged --redact
  ```

  ## Usage

  The examples use the installed `zim-to-markdown` executable. From a repository checkout, replace `zim-to-markdown` with `cabal run zim-to-markdown --`.

  Convert a single Zim page to standard output:

  ```sh
  zim-to-markdown page.txt
  ```

  Convert a single page to a Markdown file:

  ```sh
  zim-to-markdown page.txt --output page.md
  ```

  Convert a whole Zim notebook, preserving its folders:

  ```sh
  zim-to-markdown my-notebook --output my-notebook-markdown
  ```

  The notebook directory or its `notebook.zim` file can be used as input:

  ```sh
  zim-to-markdown my-notebook/notebook.zim --output my-notebook-markdown
  ```

  Convert Markdown back to Zim:

  ```sh
  zim-to-markdown --direction markdown-to-zim notes --output notes-zim
  ```

  Run `zim-to-markdown --help` for the complete option list.

  ## Releasing

  Follow the [release guide](https://github.com/Tralen/zim-to-markdown/blob/main/docs/releasing.md).

  ## Status

  The converter covers headings, emphasis, lists, task lists, links, images, anchors, tables, blockquotes, horizontal rules, and code blocks. Reference links, footnotes, nested links, raw HTML blocks, and Markdown indented code blocks are not converted yet. See [conversion rules](https://github.com/Tralen/zim-to-markdown/blob/main/docs/conversion.md) for details and known limitations, and the [roadmap](https://github.com/Tralen/zim-to-markdown/blob/main/docs/roadmap.md) for the planned work.

  ## License

  BSD-3-Clause. See [LICENSE](https://github.com/Tralen/zim-to-markdown/blob/main/LICENSE).
