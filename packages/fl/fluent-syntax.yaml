changelog: |
  # Changelog

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [1.1.0] - 2026-10-16

  ### Added

  - `parseResourceLenient`, which turns an entry with a syntax error into a `JunkEntry`.
  - `ParseError`, with the `offset`, `line`, `column` and `reason` of a syntax error.
  - `rejectJunk`, which fails with the syntax errors of a `Resource`.
  - `describeError`, which describes a syntax error by its line, column and reason.

  ### Fixed

  - A carriage return without a line feed is text, not junk.
  - Spaces at the end of a file are not junk.

  ### Changed

  - **Breaking:** `JunkEntry` additionally holds a `ParseError`.
  - **Breaking:** `parseResource` fails on a syntax error, with a line for each error.
    Use `parseResourceLenient` to get a `JunkEntry` instead.
  - **Breaking:** the `fluent` quasi-quoter and `messageIdentifiers` fail to compile on a syntax
    error.
  - **Breaking:** `message` and `term` no longer take a `Maybe Comment`.
  - **Breaking:** `patternElement` returns a `Maybe`.
  - An entry with a syntax error on a continuation line is junk as a whole.
  - Requires `text` 2.0.
  - Requires `extra`.

  ### Removed

  - **Breaking:** `anyChar`, `blank`, `blankBlock`, `blankInline`, `blockPlaceable`, `blockText`,
    `dedent`, `entryEnd`, `functionName`, `indentedChar`, `isAnyChar`, `junk`, `line`,
    `namedArgument`, `placeable`, `quotedChar`, `variant`

  ## [1.0.0] - 2026-10-01

  ### Added

  - Initial release.
