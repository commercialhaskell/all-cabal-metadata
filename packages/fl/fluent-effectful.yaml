changelog: |
  # Changelog

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [1.1.0] - 2026-10-20

  ### Changed

  - **Breaking:** `fluent` 1.1.0 breaking changes:
    - `SomeValue` is now `Value`.
    - The `Value` class is now `ToValue`.
    - Constructors are used qualified: `Value.String`, `Value.Number`, `Value.Time`.
    - `CustomValue` and `ToValue.format` are replaced by `Value.Formatted`.
    - The `fluent` quasi-quoter and `messageIdentifiers` fail to compile on a syntax error.
    - `parseResource` fails on a syntax error. `parseResourceLenient` returns a `JunkEntry` instead.

  ## [1.0.0] - 2026-10-01

  ### Added

  - Initial release.
