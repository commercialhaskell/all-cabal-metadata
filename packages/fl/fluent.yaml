changelog: |
  # Changelog

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [1.1.0] - 2026-10-20

  ### Added

  - `Language.Fluent` re-exports `parseResourceLenient`.
  - `ToValue` instances for sized integers, `Natural` and `Float`.
  - `Value.fromIntegral` and `Value.fromFloatDigits`.
  - `Value.Invalid`, a value that fails to format.
  - `Number.integerDigits`.
  - A small example English locale in `Language.Fluent.Locale.English`.
  - `Language.Fluent` re-exports `Plural.Category`.
  - `type` option of `NUMBER`: `"cardinal"` or `"ordinal"`.

  ### Changed

  - **Breaking:** `fluent-syntax` 1.1.0 breaking changes:
    - `parseResource` fails on a syntax error. `parseResourceLenient` returns a `JunkEntry` instead.
    - The `fluent` quasi-quoter and `messageIdentifiers` fail to compile on a syntax error.
  - **Breaking:** `SomeValue` is now `Value`, the `Value` class is now `ToValue`, and constructors are used qualified: `Value.String`, `Value.Number`, `Value.Time`.
  - **Breaking:** `CustomValue` and `ToValue.format` are replaced by `Value.Formatted`.

  ### Fixed

  - Correct `base` version requirement (requires 4.16).
  - `NaN` and infinities fail to format instead of printing nonsense numbers.
  - Huge digit options, such as `minimumIntegerDigits: 1000000000`, are capped to the ranges of `Intl.NumberFormat`.
  - BiDi isolation additionally applies to number literals, function calls, and select expressions.
  - A select expression fails when its selector fails, instead of picking the default variant.
  - A string selector no longer matches numeric variant keys by plural category.
  - `NUMBER` no longer depends on option order to settle `style`, and a `currency` or `unit` style without a currency or unit fails.
  - A message that expands more than 100 placeables fails instead of running for hours.

  ## [1.0.0] - 2026-10-01

  ### Added

  - Initial release.
changelog-type: markdown
description: |-
  This library implements <https://projectfluent.org Project Fluent>,
  a localisation system designed to unleash the entire expressive power of natural
  language translations.

  Project Fluent keeps simple things simple and makes complex things possible.
  The syntax used for describing translations is easy to read and understand.
  At the same time it allows, when necessary, to represent complex concepts from
  natural languages like gender, plurals, conjugations, and others.
