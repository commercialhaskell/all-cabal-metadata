changelog: "## 2.8.0\n\n * `maxBackgroundJobs`, a new field of `Config`: how many
  threads RocksDB may\n   use at once to flush memtables and to compact files, where
  its default is\n   two, one of each. A database that has a backlog of compactions,
  after a\n   bulk load for instance, works through it with one thread unless it is\n
  \  given more. More threads only help where the disk and the cores have room\n   for
  them: a compaction that already waits for a slow disk is not made\n   faster by
  a second one, and both take from the reads.\n * `partitionIndexAndFilters`, another
  new field of `Config`: the index and\n   the filter of each table file are written
  in pieces of 4 KiB under a small\n   index of their own. Each is otherwise one block
  that grows with the file,\n   megabytes for a file of 64 MiB with a filter, and
  a database that has more\n   of them than its block cache holds loads and drops
  them at nearly every\n   lookup. Measured on a database of 1.6 TB with a cache of
  1 GiB: the cache\n   held the index and filter of 400 of 32,000 files and three
  megabytes of\n   data, and a lookup took 0.8 ms of processor time on an idle disk.
  With\n   pieces, a lookup loads the two that it needs. It applies to files written\n
  \  from then on; existing files keep their layout until compacted.\n * `compactRange`
  writes again every table file of a range of keys, those of\n   the last level included,
  so that the files a database already has get the\n   layout of its present `Config`:
  a Bloom filter, or\n   `partitionIndexAndFilters`. RocksDB's own compactions rarely
  reach the\n   last level, where most of the data is.\n * Many entries of an iterator
  in one foreign call. `iterNext` and `iterPrev`\n   can wait for the disk, so each
  is a call for which the Haskell thread\n   gives up its capability and has to get
  one back, and a scan made one for\n   every entry. `iterChunk` walks the iterator
  in C, in a small function\n   that now comes with the package (`cbits/rocksdb_haskell.c`),
  and returns\n   up to 256 entries or 1 MiB from one call, forwards or backwards,
  within a\n   prefix if one is given, with a flag that tells whether more follow.
  A\n   `ChunkConfig` sets those limits. `iterEntries`, `iterEntriesBack`,\n   `iterEntriesPrefix`
  and `iterEntriesPrefixBack` are short forms for a\n   known number of entries. All
  of them leave the iterator on the first\n   entry that they did not return, respect
  the bounds of an `IterConfig`,\n   and throw if the iterator stopped at an error.
  The single steps are\n   unchanged.\n\n   Seconds for every thread to read 200,000
  entries of 52 bytes, on four\n   capabilities and four cores (`stack bench`):\n\n
  \  | Scan                                  | 1 thread | 16 threads |\n   | -------------------------------------
  | -------- | ---------- |\n   | Single steps, loop not tail recursive | 0.78     |
  3.9        |\n   | Single steps, loop tail recursive     | 0.090    | 0.50       |\n
  \  | Chunks of 256 entries                 | 0.048    | 0.25       |\n\n   With
  all 24 hardware threads of the machine free, the sixteen threads\n   took 4.4, 0.83
  and 0.12 seconds: threads inside the call hold no\n   capability, so chunks gain
  more where there are more cores than\n   capabilities. The first row is a loop that
  returns its list with\n   `(entry :) <$> go`; the run-time system walks the stack
  at every such\n   call, and that loop leaves a frame on it for every entry.\n *
  A large batch in a few foreign calls. `write` hands RocksDB the\n   operations of
  a batch one call at a time, each a call for which the\n   Haskell thread gives up
  its capability and has to get one back. For the\n   65,000 keys of a Bitcoin block
  that was more than half of the time of\n   the batch, and nearly all of it in a
  program whose other threads were\n   busy. `writePacked` takes the batch as chunks
  of packed records, and a\n   second function of `cbits/rocksdb_haskell.c` adds the
  operations of a\n   chunk to the batch in one call. The batch is then written as
  before:\n   atomically, with one write, however many chunks it came in.\n\n   `packOps`
  packs a list of `BatchOp` into a chunk. A program that\n   serialises its keys and
  values itself can write records straight into\n   its own buffers instead, with
  no `ByteString` for each: it leaves\n   `packedHeaderSize` bytes, serialises the
  key and the value after them,\n   and fills in the header with `pokePackedHeader`
  once the lengths are\n   known. Records are not aligned, so the next one starts
  where the last\n   one ended.\n\n   A chunk is checked in C before anything of it
  is used. One that is cut\n   short, that has a length reaching past its end, an
  operation that does\n   not exist or a delete with a value, makes `writePacked`
  throw, with\n   nothing written.\n\n   A record can also ask for a merge (`PackedMerge`),
  which is handed to\n   `rocksdb_writebatch_merge`. The binding still has no way
  to give a\n   column family a merge operator, so RocksDB refuses such a batch; the\n
  \  format has it so that it need not change later.\n\n   The format is this package's
  own. It is not RocksDB's internal encoding\n   of a batch (`rocksdb_writebatch_create_from`),
  which would save a copy\n   and tie the binding to the insides of RocksDB.\n\n   Milliseconds
  to write a batch of 65,000 operations and 6 MB over four\n   column families, on
  four capabilities and four cores\n   (`stack bench rocksdb-haskell-jprupp:bench:batch`):\n\n
  \  | Way to write the batch                    | Alone | Next to 8 busy threads
  |\n   | ----------------------------------------- | ----- | ----------------------
  |\n   | `write`: a call for each operation        | 48    | 420                    |\n
  \  | `writePacked`, with `packOps` in the time | 28    | 115                    |\n
  \  | `writePacked`, chunks packed beforehand   | 22    | 28                     |\n\n
  \  All three end with the same write, of about 20 ms. Alone, the calls of\n   `write`
  cost 400 ns an operation. Next to threads that compute, the\n   thread waits for
  a capability after each of its 65,000 calls. With all\n   24 hardware threads of
  the machine free, that took `write` 1,160 ms,\n   and packed chunks 31.\n * Merge
  records and merge operators. A merge record is a third kind of\n   write, next to
  a put and a delete: it says how a value changes, and\n   RocksDB stores it without
  reading the value. The merge operator of the\n   column family works out the value
  when the key is read, and when a\n   compaction brings the records and the value
  together. A program that\n   adds to counters or to lists by the thousand no longer
  reads each one\n   first.\n   - `mergeOperator`, a new field of `Config`, gives
  a column family its\n     operator, or the default one when it is in the `Config`
  of the\n     database. `UInt64Add` is RocksDB's own, for counters. `MergeFunctions`\n
  \    makes one of a name and the addresses of two C functions, a full merge\n     and
  a partial merge, with the types `FullMerge` and `PartialMerge`.\n     They are C
  functions because RocksDB calls them from its own threads;\n     `cbits/rocksdb_haskell.h`
  says what they must do, and a third function\n     of `cbits/rocksdb_haskell.c`
  makes the operator around them.\n   - `Merge` and `MergeCF` are new constructors
  of `BatchOp`, written by\n     `write` and packed by `packOps` as `PackedMerge`
  records. `merge` and\n     `mergeCF` write one record. Code that matches on every
  `BatchOp` has\n     two more cases.\n   - `get`, `multiGet`, iterators and chunks
  return merged values, and\n     need no change.\n   - A column family with merge
  records must be given its operator by\n     every program that opens the database.
  RocksDB 11.1 opens it without:\n     it then drops the merge records that are still
  in the write-ahead\n     log, with no error, and a read of a key with a value under
  merge\n     records crashes the process. The README has the whole table.\n * `flush`
  writes the memtable of a column family to a table file and waits\n   for it, and
  `disableAutoCompactions`, a new field of `Config`, stops\n   RocksDB from compacting
  a column family in the background. They are for\n   tests and benchmarks that need
  data in table files, a file for each\n   flush, and for bulk loads that end with
  `compactRange`.\n * The `Config` record has new fields, so code that builds one
  without `def`\n   has to set them; code that starts from `def` needs no change.
  This is why\n   the version is 2.8.0 and not 2.7.2.\n\n## 2.7.1\n\n * Documentation
  and tests only; the library behaves as in 2.7.0.\n * The documentation of `prefixSameAsStart`
  was wrong on one point and silent\n   on another. It said that the option does nothing
  after `iterFirst` or\n   `iterLast`: it does, the iterator stays within the prefix
  of the key that\n   it finds there. And it did not say that every key, sought or
  stored, has\n   to be at least as long as the `prefixLength`: RocksDB takes the
  prefix of\n   a key without checking its length, and reads past the end of a shorter\n
  \  one. Both are now in the Haddock and in the README, and the first has\n   tests.\n\n##
  2.7.0\n\n * Bounded iterators. `withIterConfig` creates an iterator that RocksDB
  itself\n   stops, as an `IterConfig` says: at a `lowerBound` or an `upperBound`,
  or at\n   the end of the prefix that it was sent to, with `prefixSameAsStart`. Until\n
  \  now a scan of a range could only stop by reading the first key past it,\n   and
  when the keys past it had been deleted, RocksDB stepped over the marker\n   of every
  one to find that key. A scan of an empty range followed by 20,000\n   deleted keys
  took 2,600 microseconds; with an upper bound it takes 2.5.\n   `prefixUpperBound`
  gives the bound that ends a prefix, and\n   `createIteratorConfig` manages such
  an iterator by hand.\n * `totalOrderSeek`, also in `IterConfig`, walks every key
  in order in a\n   database that has a `prefixLength`, where a plain iterator only
  promises\n   the keys of one prefix.\n * The `DB` record has a new field, `snapshot`,
  with the snapshot that its\n   read options read from. Code that builds a `DB` by
  hand has to set it;\n   code that gets one from `withDB`, `withDBCF` or `withSnapshot`
  needs no\n   change. This is why the version is 2.7.0 and not 2.6.5.\n\n## 2.6.4\n\n
  * Iterators read rows about three times faster. `iterValid`, `iterKey` and\n   `iterValue`
  now reach RocksDB through unsafe foreign calls. The three only\n   read what the
  iterator already holds, and reading one row with `iterEntry`\n   and `iterNext`
  makes five of them; as safe calls each cost about 0.4\n   microseconds. Walking
  700,000 rows took 2.8 microseconds a row before and\n   0.8 after. The calls that
  move an iterator, which can read from disk, are\n   safe calls as before.\n\n##
  2.6.3\n\n * Documentation only; the library behaves as in 2.6.2.\n * References
  in the Haddock that named both a type and its constructor, such\n   as `DB` and
  `Config`, now say that they mean the type, and two that named\n   nothing in scope
  are fixed: the documentation builds without warnings about\n   ambiguous or unresolved
  identifiers.\n * The documentation of `withIter` said to set a snapshot in the read
  options,\n   which the API has no way to do. It now says how: create the iterator
  from\n   the `DB` that `withSnapshot` provides.\n * Remove an unused import.\n *
  The test suite grows from 17 tests to 51. It now covers deletes, batches,\n   `withSnapshot`,
  iteration backwards, empty keys and values, binary data,\n   and the errors of opening
  a database, none of which had a test. Six of the\n   tests are QuickCheck properties
  that compare the database with a `Map`\n   after random writes. The suite also compiles
  without warnings.\n * A badge in the README shows the state of CI on `master`.\n\n##
  2.6.2\n\n * Build the Bloom filters that `bloomFilter` asks for. The bits per key
  were\n   passed to `rocksdb_filterpolicy_create_bloom_full` as an integer, which
  is\n   what RocksDB took until 6.23; since 6.24 the function takes a `double`. An\n
  \  integer and a `double` travel in different registers, so RocksDB read\n   something
  else as the bits per key and built no filters: table files had\n   `filter block
  size=0`, and a lookup of an absent key read a data block in\n   every file that
  could hold it. Nothing failed, and no test noticed. In a\n   measurement with 2,600,000
  keys, such a lookup took about 5.5 microseconds\n   without the filters and 1.5
  with them.\n\n   The function is now imported with the `capi` calling convention,
  through a\n   stub compiled against `rocksdb/c.h`, so the C compiler passes the
  argument\n   as the installed RocksDB declares it, before or after 6.24. The headers\n
  \  were already needed to install RocksDB for development; they are now\n   needed
  to build this package too.\n\n   Databases opened with `bloomFilter` start building
  filters when they are\n   opened with this version: for the table files written
  from then on, at\n   about 1.25 bytes per key. Files written before have none until
  compaction\n   rewrites them.\n * Pass the error pointer that `rocksdb_approximate_sizes`
  takes since RocksDB\n   6.16. `approximateSize` called it with one argument too
  few, leaving RocksDB\n   to read a pointer that was never passed, and to write an
  error message\n   through it if the call failed. It now throws an `IOError` on failure.\n
  * Both were found by comparing every foreign import with the `rocksdb/c.h` of\n
  \  RocksDB 11.1: the other 70 match.\n * Tests that table files have filters when
  asked for and not otherwise, and\n   of `approximateSize`, which had none.\n\n##
  2.6.1\n\n * Documentation, lots of it, with detailed explanations.\n\n## 2.6.0\n\n
  * Add `multiGet` and `multiGetCF`, which read the values of many keys in\n   one
  call to RocksDB's `MultiGet`.\n * Add `blockCacheSize` to `Config`: the bytes of
  a least-recently-used block\n   cache shared by the database and all its column
  families. Without it\n   RocksDB gives each column family its own default cache,
  of 32 MiB in\n   RocksDB 8.\n * Add `cacheIndexAndFilterBlocks` to `Config`, to
  keep the index and filter\n   blocks of a column family in the block cache, at high
  priority, with\n   those of level 0 pinned, instead of in memory outside the cache
  for every\n   open file.\n * Stop leaking the block-based table options of every
  database and column\n   family opened with a Bloom filter.\n\n## 2.5.0\n\n * Add
  the `EstimateTableReadersMem`, `CurSizeAllMemTables` and\n   `BlockCacheUsage` properties,
  and `PropertyName` for any other property by\n   its name.\n * Add `getPropertyCF`
  to read a property of a column family.\n * Add `maxTotalWalSize` (`max_total_wal_size`)
  to `Config`, to bound the\n   write-ahead log.\n * Add `createMissingColumnFamilies`
  (`create_missing_column_families`) to\n   `Config`, to add column families to an
  existing database.\n * Destroy the handle of the default column family when `withDBCF`
  opens an\n   existing database. It was leaked, and RocksDB built with assertions\n
  \  aborted when the database was closed.\n\n## 2.4.0\n\n * Add `writeBufferSize`
  (`write_buffer_size`) and `dbWriteBufferSize`\n   (`db_write_buffer_size`) to `Config`,
  to bound memtable memory.\n\n## 2.3.1\n\n * Do not call next/prev on invalid iterators
  (fixes assertion failure).\n\n## 2.3.0\n\n * Remove UnliftIO and remain in IO monad.\n\n##
  2.2.0\n\n * Move Iterator module to plain IO.\n * Properly manage read options in
  createSnapshot.\n * Add nix flake for development.\n * API allows manual database
  lifecycle management.\n\n## 2.1.7\n\n * Simplify author name.\n\n## 2.1.6\n\n *
  Refactor memory use further.\n * Improve tests.\n\n## 2.1.5\n\n * Fix errors not
  releasing memory.\n\n## 2.1.4\n\n * Add ResourceT support for snapshots and iterators.\n\n##
  2.1.3\n\n * Correct bug where database was ignoring prefix length config.\n\n\n##
  2.1.2\n\n * Correct bug when opening database with column families.\n\n\n## 2.1.1\n\n
  * Expose ColumnFamily type.\n \n\n## 2.1.0\n\n * Add support for column families.\n\n\n##
  2.0.0\n\n * Fork into a different project\n * Rewrite most of the code to make it
  faster and easier to use\n * Remove many features that I don't need or want to maintain\n\n\n##
  1.0.1\n\n * Add support for UTF-8 characters in a database's path\n\n\n## 1.0.0\n\n
  * First version by Serokell\n\n\n## 0.3x.0\n\n * ResourceT is no longer compulsory\n\n\n##
  0.2.0\n\n * requires LevelDB v1.7\n * support for filter policy (LevelDB v1.5),
  either custom or using the built-in\n   bloom filter implementation\n * write batch
  values no longer require a `memcpy` to be early-finalizer-safe\n   (introduced in
  0.1.1)\n\n\n## 0.1.0\n\n * memory (foreign pointers) is managed through\n   [ResourceT](http://hackage.haskell.org/package/resourcet).
  Note that this\n   requires to lift monadic actions inside the `MonadResource` monad,
  see the\n   examples.\n * links against shared library (LevelDB v1.3 or higher)\n
  * LevelDB 1.3 API fully supported (including custom comparators, excluding\n   custom
  environments)\n\n\n## 0.0.x\n\n * experimental releases\n"
