changelog: "## 2.6.4\n\n * Iterators read rows about three times faster. `iterValid`,
  `iterKey` and\n   `iterValue` now reach RocksDB through unsafe foreign calls. The
  three only\n   read what the iterator already holds, and reading one row with `iterEntry`\n
  \  and `iterNext` makes five of them; as safe calls each cost about 0.4\n   microseconds.
  Walking 700,000 rows took 2.8 microseconds a row before and\n   0.8 after. The calls
  that move an iterator, which can read from disk, are\n   safe calls as before.\n\n##
  2.6.3\n\n * Documentation only; the library behaves as in 2.6.2.\n * References
  in the Haddock that named both a type and its constructor, such\n   as `DB` and
  `Config`, now say that they mean the type, and two that named\n   nothing in scope
  are fixed: the documentation builds without warnings about\n   ambiguous or unresolved
  identifiers.\n * The documentation of `withIter` said to set a snapshot in the read
  options,\n   which the API has no way to do. It now says how: create the iterator
  from\n   the `DB` that `withSnapshot` provides.\n * Remove an unused import.\n *
  The test suite grows from 17 tests to 51. It now covers deletes, batches,\n   `withSnapshot`,
  iteration backwards, empty keys and values, binary data,\n   and the errors of opening
  a database, none of which had a test. Six of the\n   tests are QuickCheck properties
  that compare the database with a `Map`\n   after random writes. The suite also compiles
  without warnings.\n * A badge in the README shows the state of CI on `master`.\n\n##
  2.6.2\n\n * Build the Bloom filters that `bloomFilter` asks for. The bits per key
  were\n   passed to `rocksdb_filterpolicy_create_bloom_full` as an integer, which
  is\n   what RocksDB took until 6.23; since 6.24 the function takes a `double`. An\n
  \  integer and a `double` travel in different registers, so RocksDB read\n   something
  else as the bits per key and built no filters: table files had\n   `filter block
  size=0`, and a lookup of an absent key read a data block in\n   every file that
  could hold it. Nothing failed, and no test noticed. In a\n   measurement with 2,600,000
  keys, such a lookup took about 5.5 microseconds\n   without the filters and 1.5
  with them.\n\n   The function is now imported with the `capi` calling convention,
  through a\n   stub compiled against `rocksdb/c.h`, so the C compiler passes the
  argument\n   as the installed RocksDB declares it, before or after 6.24. The headers\n
  \  were already needed to install RocksDB for development; they are now\n   needed
  to build this package too.\n\n   Databases opened with `bloomFilter` start building
  filters when they are\n   opened with this version: for the table files written
  from then on, at\n   about 1.25 bytes per key. Files written before have none until
  compaction\n   rewrites them.\n * Pass the error pointer that `rocksdb_approximate_sizes`
  takes since RocksDB\n   6.16. `approximateSize` called it with one argument too
  few, leaving RocksDB\n   to read a pointer that was never passed, and to write an
  error message\n   through it if the call failed. It now throws an `IOError` on failure.\n
  * Both were found by comparing every foreign import with the `rocksdb/c.h` of\n
  \  RocksDB 11.1: the other 70 match.\n * Tests that table files have filters when
  asked for and not otherwise, and\n   of `approximateSize`, which had none.\n\n##
  2.6.1\n\n * Documentation, lots of it, with detailed explanations.\n\n## 2.6.0\n\n
  * Add `multiGet` and `multiGetCF`, which read the values of many keys in\n   one
  call to RocksDB's `MultiGet`.\n * Add `blockCacheSize` to `Config`: the bytes of
  a least-recently-used block\n   cache shared by the database and all its column
  families. Without it\n   RocksDB gives each column family its own default cache,
  of 32 MiB in\n   RocksDB 8.\n * Add `cacheIndexAndFilterBlocks` to `Config`, to
  keep the index and filter\n   blocks of a column family in the block cache, at high
  priority, with\n   those of level 0 pinned, instead of in memory outside the cache
  for every\n   open file.\n * Stop leaking the block-based table options of every
  database and column\n   family opened with a Bloom filter.\n\n## 2.5.0\n\n * Add
  the `EstimateTableReadersMem`, `CurSizeAllMemTables` and\n   `BlockCacheUsage` properties,
  and `PropertyName` for any other property by\n   its name.\n * Add `getPropertyCF`
  to read a property of a column family.\n * Add `maxTotalWalSize` (`max_total_wal_size`)
  to `Config`, to bound the\n   write-ahead log.\n * Add `createMissingColumnFamilies`
  (`create_missing_column_families`) to\n   `Config`, to add column families to an
  existing database.\n * Destroy the handle of the default column family when `withDBCF`
  opens an\n   existing database. It was leaked, and RocksDB built with assertions\n
  \  aborted when the database was closed.\n\n## 2.4.0\n\n * Add `writeBufferSize`
  (`write_buffer_size`) and `dbWriteBufferSize`\n   (`db_write_buffer_size`) to `Config`,
  to bound memtable memory.\n\n## 2.3.1\n\n * Do not call next/prev on invalid iterators
  (fixes assertion failure).\n\n## 2.3.0\n\n * Remove UnliftIO and remain in IO monad.\n\n##
  2.2.0\n\n * Move Iterator module to plain IO.\n * Properly manage read options in
  createSnapshot.\n * Add nix flake for development.\n * API allows manual database
  lifecycle management.\n\n## 2.1.7\n\n * Simplify author name.\n\n## 2.1.6\n\n *
  Refactor memory use further.\n * Improve tests.\n\n## 2.1.5\n\n * Fix errors not
  releasing memory.\n\n## 2.1.4\n\n * Add ResourceT support for snapshots and iterators.\n\n##
  2.1.3\n\n * Correct bug where database was ignoring prefix length config.\n\n\n##
  2.1.2\n\n * Correct bug when opening database with column families.\n\n\n## 2.1.1\n\n
  * Expose ColumnFamily type.\n \n\n## 2.1.0\n\n * Add support for column families.\n\n\n##
  2.0.0\n\n * Fork into a different project\n * Rewrite most of the code to make it
  faster and easier to use\n * Remove many features that I don't need or want to maintain\n\n\n##
  1.0.1\n\n * Add support for UTF-8 characters in a database's path\n\n\n## 1.0.0\n\n
  * First version by Serokell\n\n\n## 0.3x.0\n\n * ResourceT is no longer compulsory\n\n\n##
  0.2.0\n\n * requires LevelDB v1.7\n * support for filter policy (LevelDB v1.5),
  either custom or using the built-in\n   bloom filter implementation\n * write batch
  values no longer require a `memcpy` to be early-finalizer-safe\n   (introduced in
  0.1.1)\n\n\n## 0.1.0\n\n * memory (foreign pointers) is managed through\n   [ResourceT](http://hackage.haskell.org/package/resourcet).
  Note that this\n   requires to lift monadic actions inside the `MonadResource` monad,
  see the\n   examples.\n * links against shared library (LevelDB v1.3 or higher)\n
  * LevelDB 1.3 API fully supported (including custom comparators, excluding\n   custom
  environments)\n\n\n## 0.0.x\n\n * experimental releases\n"
