changelog: |
  # Changelog

  All notable changes to `ollama-haskell` will be documented in this file.
  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to [PVP (Haskell Package Versioning Policy)](https://pvp.haskell.org/).

  ---

  ## [0.3.0.0] - 2026-08-04

  ### Added
  - **`OllamaClient` Core**: Thread-safe client handle with automatic connection manager lifecycle management (`newClient`, `defaultClient`, `clientFromEnv`, `withClient`).
  - **First-Class Streaming Pipeline**: `conduit`-based response streaming (`chatStream`, `generateStream`, `pullStream`, `pushStream`, `createModelStream`).
  - **Stream Combinators**: `collectStream` and `foldStream` in `Ollama.Streaming`.
  - **Structured Output DSL**: Type-safe `SchemaBuilder` DSL in `Ollama.Types.Format.SchemaBuilder` (`|+`, `|++`, `|!`, `|!!`) for constructing JSON Schemas.
  - **Thinking / Reasoning Models Support**: `Think` ADT (`ThinkEnabled`, `ThinkDisabled`, `ThinkLevel`) and `ThinkingLevel` (`ThinkLow`, `ThinkMedium`, `ThinkHigh`, `ThinkMax`) supporting models such as `qwen3.5` and `deepseek-r1`.
  - **Function / Tool Calling**: `Tool`, `FunctionDef`, `FunctionParameters`, `ToolCall`, and `toolResultMessage` helper.
  - **Environment Resolution**: Automatic `OLLAMA_HOST` parsing and normalization in `clientFromEnv` supporting `host:port`, `http://host:port`, and bare `host`.
  - **Authorization & Headers**: Support for `OLLAMA_API_KEY` bearer tokens and custom `configHeaders`.
  - **Configurable Resilience**: `RetryPolicy` ADT (`NoRetry`, `ConstantRetry`, `ExponentialRetry`), lifecycle callbacks (`configOnStart`, `configOnSuccess`, `configOnError`), and structured logger `configLogger`.
  - **Token Throughput Metrics**: Metrics helpers `chatEvalTokensPerSecond`, `chatPromptEvalTokensPerSecond`, `evalTokensPerSecond`, `promptEvalTokensPerSecond`, `tokensPerSecond`.
  - **Testing Infrastructure**: Built-in mock testing module `Ollama.Testing` (`newMockClient`, `withMockClient`, `mockGenerateResponse`, `mockChatResponse`, `mockEmbedResponse`, `mockListModelsResponse`).
  - **Conversation Store**: Transactional STM-backed `InMemoryStore` and `ConversationStore` typeclass.
  - **New API Endpoints**: `Ollama.API.Embed` (`/api/embed`), `Ollama.API.Blobs` (`/api/blobs`), `Ollama.API.Ps` (`/api/ps`), `Ollama.API.Version` (`/api/version`).
  - **Benchmark Suite**: Criterion/tasty-bench suite in `bench/Main.hs` measuring serialization and throughput.

  ### Changed
  - **MonadIO / MonadUnliftIO Polymorphism**: All API functions use `MonadIO m =>` / `MonadUnliftIO m =>` signatures instead of dual `*M` variants.
  - **Typed Newtypes**: `ModelName`, `Digest`, `Base64Image`, `Duration`, `Version` replace primitive string types.
  - **Unified Error Type**: `OllamaError` sum type with structured constructors and `Exception` instance.

  ### Deprecated
  - `embeddings` endpoint (`/api/embeddings`) marked deprecated in favor of `/api/embed`.
changelog-type: markdown
description: "# ollama-haskell\n\n[![Hackage](https://img.shields.io/hackage/v/ollama-haskell.svg)](https://hackage.haskell.org/package/ollama-haskell)\n[![MIT
  License](https://img.shields.io/badge/license-MIT-blue.svg)](LICENSE)\n\nIndustry-grade,
  feature-complete, modern Haskell client library for the [Ollama](https://ollama.com)
  local LLM engine.\n\n## Features\n\n- **Client-Centric Architecture**: Thread-safe
  `OllamaClient` handle with connection pooling and resource management (`newClient`,
  `defaultClient`, `clientFromEnv`, `withClient`).\n- **First-Class Streaming**: `conduit`-based
  response streaming (`chatStream`, `generateStream`, `pullStream`, `pushStream`,
  `createModelStream`).\n- **Complete API Surface**: Text generation, chat completions,
  vector embeddings, model management (list, show, copy, delete, pull, push, create),
  and system endpoints.\n- **Structured Outputs**: Powerful `SchemaBuilder` DSL (`|+`,
  `|++`, `|!`, `|!!`) for type-safe JSON Schema structured responses.\n- **Function
  / Tool Calling**: Full support for tool definitions (`Tool`), tool calls (`ToolCall`),
  and execution results (`toolResultMessage`).\n- **Thinking Models Support**: Native
  support for reasoning models (`qwen3.5`, `deepseek-r1`) with `Think` / `ThinkingLevel`
  types.\n- **Environment & Auth Integration**: Robust URL normalization for `OLLAMA_HOST`
  and bearer token support for `OLLAMA_API_KEY`.\n- **Configurable Resilience**: Flexible
  retry policies (`NoRetry`, `ConstantRetry`, `ExponentialRetry`), lifecycle callbacks,
  and structured logging.\n- **Conversation Store**: Transactional STM-backed `InMemoryStore`
  and `ConversationStore` typeclass for managing multi-turn chat sessions.\n- **SDK
  Comparison Matrix**: Detailed feature comparison against Python, JS/TS, and Go SDKs
  in [doc/COMPARISON.md](doc/COMPARISON.md).\n\n---\n\n## Installation\n\nAdd `ollama-haskell`
  to your `.cabal` file:\n\n```cabal\nbuild-depends:\n    base >= 4.17 && < 5\n  ,
  ollama-haskell >= 0.3.0.0\n```\n\nOr using Stack in `package.yaml`:\n\n```yaml\ndependencies:\n
  \ - ollama-haskell >= 0.3.0.0\n```\n\n---\n\n## Quick Start (5 Lines)\n\n```haskell\nimport
  Data.List.NonEmpty (NonEmpty ((:|)))\nimport Data.Text.IO qualified as TIO\nimport
  Ollama\n\nmain :: IO ()\nmain = do\n  client <- defaultClient\n  res <- chat client
  $ chatRequest \"qwen3.5:2b\" (userMessage \"Why is the sky blue?\" :| [])\n  case
  res of\n    Left err   -> print err\n    Right resp -> mapM_ (TIO.putStrLn . messageContent)
  (crMessage resp)\n```\n\n---\n\n## Streaming Responses with Conduit\n\nStream LLM
  responses token-by-token as they generate:\n\n```haskell\nimport Data.List.NonEmpty
  (NonEmpty ((:|)))\nimport Data.Text.IO qualified as TIO\nimport Ollama\n\nmain ::
  IO ()\nmain = do\n  client <- defaultClient\n  let req = chatRequest \"qwen3.5:2b\"
  (userMessage \"Count from 1 to 5.\" :| [])\n  \n  -- Stream chunks directly into
  stdout or collect them\n  chunks <- collectStream (chatStream client req)\n  mapM_
  (TIO.putStr . maybe \"\" messageContent . crMessage) chunks\n  putStrLn \"\"\n```\n\n---\n\n##
  Function & Tool Calling\n\nDefine function signatures and let the LLM execute structured
  tool calls:\n\n```haskell\nimport Data.List.NonEmpty (NonEmpty ((:|)))\nimport Ollama\n\ncalculatorTool
  :: Tool\ncalculatorTool = Tool \"function\" $ FunctionDef\n  { fnName = \"add\"\n
  \ , fnDescription = Just \"Add two numbers\"\n  , fnParameters = Just (FunctionParameters
  \"object\" Nothing (Just [\"a\", \"b\"]) Nothing Nothing Nothing)\n  , fnStrict
  = Just True\n  }\n\nmain :: IO ()\nmain = do\n  client <- defaultClient\n  let req
  = (chatRequest \"qwen3.5:2b\" (userMessage \"What is 40 + 2?\" :| []))\n        {
  chatTools = Just [calculatorTool] }\n  res <- chat client req\n  case res of\n    Left
  err   -> print err\n    Right resp -> print (crMessage resp)\n```\n\n---\n\n## Structured
  Outputs (JSON Schema DSL)\n\nEnforce structured JSON output formats using `SchemaBuilder`:\n\n```haskell\nimport
  Data.Text.IO qualified as TIO\nimport Ollama\nimport Ollama.Types.Format.SchemaBuilder\n\npersonSchema
  :: Schema\npersonSchema = buildSchema $ emptyObject\n  |+ (\"name\", JString)\n
  \ |+ (\"age\", JInteger)\n  |! \"name\"\n\nmain :: IO ()\nmain = do\n  client <-
  defaultClient\n  let req = (generateRequest \"qwen3.5:2b\" \"Generate a person profile.\")\n
  \       { genFormat = Just (SchemaFormat personSchema) }\n  res <- generate client
  req\n  case res of\n    Left err   -> print err\n    Right resp -> TIO.putStrLn
  (grResponse resp)\n```\n\n---\n\n## Environment Variables & Configuration\n\nConstruct
  a client using environment variables (`OLLAMA_HOST`, `OLLAMA_API_KEY`):\n\n```haskell\nmain
  :: IO ()\nmain = do\n  client <- clientFromEnv\n  -- Automatically connects to OLLAMA_HOST
  with optional Authorization: Bearer header\n  ...\n```\n\nOr configure custom retry
  policies and loggers:\n\n```haskell\ncustomConfig :: OllamaClientConfig\ncustomConfig
  = defaultConfig\n  { configBaseUrl = \"http://my-ollama-server:11434\"\n  , configTimeout
  = 120\n  , configRetry   = ExponentialRetry 3 1 -- 3 retries with exponential backoff\n
  \ , configLogger  = Just (\\level msg -> putStrLn $ \"[\" <> show level <> \"] \"
  <> show msg)\n  }\n\nmain :: IO ()\nmain = withClient customConfig $ \\client ->
  do\n  ...\n```\n\n---\n\n## Documentation & SDK Comparison\n\n- [doc/COMPARISON.md](doc/COMPARISON.md)
  — SDK Feature Matrix comparing `ollama-haskell` with Python, JS/TS, and Go SDKs.\n-
  [ARCHITECTURE.md](ARCHITECTURE.md) — Detailed internal module design and extension
  guide.\n- [CONTRIBUTING.md](CONTRIBUTING.md) — Development setup, testing guidelines,
  and code style.\n- [CHANGELOG.md](CHANGELOG.md) — Release notes and changelog.\n-
  [Hackage Documentation](https://hackage.haskell.org/package/ollama-haskell) — Full
  Haddock reference.\n\n---\n\n## License\n\nMIT © 2024–2026 Tushar Adhatrao\n"
