description: |
  # side-hustle-hourly

  True hourly rate math for side hustles and gig work.

  A gig's posted rate counts gross cash over paid hours. The real rate
  takes the platform cut and the costs of each job off the gross first,
  then divides by hours that include the unpaid admin around the paid
  ones. Messaging a client, invoicing, restocking supplies, the drive to
  the job: none of it bills, and all of it lands on the same denominator.

  The package follows the effective-hourly-rate method used on
  [Extra Hustles](https://extrahustles.com). It depends only on base.

  ## Example

  A gig pays $200 gross, the platform keeps 15 percent, supplies run
  $40, the paid block is 5 hours, and admin eats 3 more:

  * net cash: `netCash 200 0.15 40` = $130
  * true hourly rate: `hourlyRate 130 5 3` = $16.25
  * the same net with zero admin hours: $26 an hour

  That last number is the trap. The two rates describe the same gig, and
  `compareGigs 16.25 12.00` says a second gig paying $12 an hour on an
  honest denominator still loses to this one by $4.25 an hour. Compare
  rates on hours that count everything, or the comparison is fiction.
