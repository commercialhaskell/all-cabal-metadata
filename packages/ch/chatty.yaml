changelog: "# Revision history for chatty\n\n## 0.9.0.0 -- 2021-??-??\n\n* Renamed
  DeafT to DiscardT (it had nothing to do with deafness).\n* Removed many dependencies.\n*
  runOutRedirFT and runInRedirFT are now constrained on MonadResource. \n* RedirectionTarget
  is now a five-param class and the constraints depend on the instance. For file paths,
  it is MonadResource, but for DiscardO and RecordO it is relaxed to Monad (previously
  MonadIO for all instances).\n* Same for RedirectionSource.\n* The module Text.Chatty.Finalizer
  has been removed, including HandleCloserT and ChFinalizer. Instead, we're using
  MonadResource and ResourceT now.\n\n## 0.8.0.0 -- 2021-01-04\n\nPurged many modules
  from 0.7.0.0 that encouraged antipatterns and were far away from the original core
  idea of chatty. Affected modules.\n\n * System.Chatty.Commands\n * System.Chatty.Filesystem\n
  * System.Chatty.Misc\n * System.Chatty.Spawn\n * System.Chatty.Spawn.Builtins\n
  * System.Chatty.Spawn.Overlay\n \n More removals will follow later.\n"
changelog-type: markdown
description: |-
  Some monad transformers and typeclasses abstracting global dependencies, like Text in- and output (incl. here-strings, pipes, recorders and file-redirections on a per-function scope).
  Note that a lot of modules have been removed since version 0.7, as they were encouraging antipatterns and had nothing to do with the core idea of chatty. Also, there will be more removals in the future! Version 1.0 will only contain core features.
