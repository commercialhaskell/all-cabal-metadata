changelog: |
  # Changelog for `pykinos-core`

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the [Haskell Package Versioning Policy (PVP)](https://pvp.haskell.org/).

  ## [0.1.0.2] - 2026-11-19

  ### Changed
  - Bump package version to 0.1.0.2 to synchronize forge releases, CI, and Hackage upload artifacts.
  - Dual-license package under EUPL-1.2 OR Apache-2.0.
  - Elaborate documentation corpus to Cellarius standards with Greek etymological exegesis.

  ## [0.1.0.0] - 2026-11-18

  ### Added
  - Unboxed SIMD two-tier Roaring Bitmaps (`Pykinos.Bitset.Roaring`).
  - Cache-conscious 4-tier Adaptive Radix Tree (`Pykinos.IntMap.ART`).
  - Multi-way balanced B+ search trees (`Pykinos.Tree.BPlus`).
  - FAST architecture-sensitive sequential search accelerators (`Pykinos.Tree.FAST`).
  - Swiss table open-addressing hash table (`Pykinos.Mutable.SwissTable`).
  - Dynamic hidden class schema interning (`Pykinos.Schema.HiddenClass`).
  - Comprehensive Hackage package manifest, documentation, and unit test suite.
changelog-type: markdown
description: "# pykinos-core — Unboxed Blocked Memory Substrates\n\n> **πυκινός**
  (*pykinos*, Epic Greek; Attic **πυκνός** *pyknos*): *close, compact, dense, solid,
  shrewd, terse*.  \n> Named after the Homeric *πυκινὸς θώρηξ* (*Iliad* 15.529, \"a
  close-fitting corselet\") and *πυκιναὶ φάλαγγες* (*Iliad* 4.281, \"dense close-packed
  phalanxes\"), in opposition to *ἀραιός* (\"sparse, dispersed\").\n\n`pykinos-core`
  provides high-performance, cache-conscious, unboxed data structures engineered to
  minimize pointer indirection, eliminate object header overhead, and maximize CPU
  cache line density in Haskell:\n\n1. **Roaring Bitsets (`Pykinos.Bitset.Roaring`):**
  Unboxed two-tier compressed bitsets partitioned into 64 KiB chunks (`ArrayChunk`
  for sparse clusters $\\le 4096$, `BitmapChunk` for dense bitmasks).\n2. **Adaptive
  Radix Trees (`Pykinos.IntMap.ART`):** Cache-conscious 4-tier radix tree (`Node4`,
  `Node16`, `Node48`, `Node256`) that adapts node sizing to branch density, slashing
  pointer chasing.\n3. **B+ Trees (`Pykinos.Tree.BPlus`):** Multi-way balanced search
  trees with unboxed key/value leaf nodes for ordered traversal and range slicing.\n4.
  **FAST Accelerators (`Pykinos.Tree.FAST`):** Fast Architecture Sensitive Tree accelerators
  with sequential layouts tailored for SIMD and hardware prefetchers.\n5. **Swiss
  Tables (`Pykinos.Mutable.SwissTable`):** High-speed open-addressing hash table with
  1-byte control words and SSE/AVX metadata scanning.\n6. **Hidden Classes (`Pykinos.Schema.HiddenClass`):**
  Self-optimizing schema transitions and interning for dynamic and extensible record
  representations.\n\n## License\n\nEUPL-1.2.\n"
