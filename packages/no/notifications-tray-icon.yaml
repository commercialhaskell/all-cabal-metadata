changelog: |
  # Changelog for notifications-tray-icon

  ## 0.2.1.0

  - Send Gmail desktop notifications directly over D-Bus instead of shelling out to `notify-send`
  - Add `sendDesktopNotification` to `StatusNotifier.Item.Notifications.Util`
  - Add "Mark all as read" menu item to the Gmail tray icon
  - Fix Gmail OAuth URL/form encoding and start the redirect listener before opening the browser
  - Open URLs through `systemd-run --user` so browsers are not parented to the tray service
  - Let dbusmenu assign ids to GitHub notification menu items instead of reusing notification ids

  ## 0.2.0.2

  - Fix polling threads silently dying on transient network errors

  ## 0.2.0.0

  - Add Gmail notification tray icon with browser-based OAuth2 loopback flow
  - Add Gitea notification tray icon with REST API client
  - Refactor CLI to use subcommands (github, gmail, gitea, sample)
  - Bundle SVG icons (gmail, github, gitea, notification-indicator) with IconThemePath
  - Fix build compatibility with GHC 9.10 and latest dependencies
  - Update CI to use cachix/install-nix-action v30

  ## 0.1.1.0

  - Initial release
