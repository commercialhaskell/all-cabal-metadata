changelog: "# Revision history for mysql-haskell\n\n## 1.4.1 -- 2026.11.11\n\nFaster
  decoding. No type changes beyond one new exception, but one change of\nbehaviour,
  described last. `query_` and\n`queryStmt` decode rows with dates and text up to
  a third faster than 1.4.0:\na date in a common range is computed without `Integer`
  arithmetic, and a\nstring is decoded as UTF-8 once, when its value is used, instead
  of checked\nwhile the row is read and decoded again later. A string whose bytes
  are not\nUTF-8, as a connection in another charset can send, now raises\n`InvalidUtf8Text`
  when the value is used, where 1.4.0 refused the whole row;\nthe decoders of `Database.MySQL.Decoder`
  still refuse it while reading.\n\n* Text decoded when used, common dates without
  `Integer` arithmetic\n  [#107](https://github.com/winterland1989/mysql-haskell/pull/107)\n\n##
  1.4.0 -- 2026.11.11\n\nFixes for MySQL and MariaDB alike, found comparing mysql-haskell
  with the\nmariadb-haskell fork, and faster row decoding. A text query no longer
  loses a\nrow whose first value is 16 MiB or longer; insert IDs above 2^63 come back\nintact;
  a `?` inside a quoted string or a comment is no longer taken for a\nplaceholder;
  dates such as `0000-00-00` round-trip instead of turning into\n`0000-01-01`; latin1
  results decode; FLOAT and DOUBLE values in exponent form\nno longer lose their exponent
  through `query_` (`1e20` came back as 1); the\nbinlog row decoder no longer drops
  a statement's rows events after its first;\nand the Mozilla CA bundle is installed
  with the library. `query_` and\n`queryStmt` resolve each column's type once per
  result set, and the new\n`Database.MySQL.Decoder` decodes rows straight into Haskell
  values with typed\nerrors through `queryRows_`, `queryRows` and `queryStmtRows`,
  or by column\nnumber through `queryRawRows_` and `queryStmtRawRows`.\n\nNew in `Database.MariaDB`,
  for MariaDB servers only: connections that ask for\ncapabilities only MariaDB has.
  Extended column metadata names JSON, UUID, INET6\nand geometry columns through `prepareStmtMetadata`,
  and `executeBulk` runs a\nprepared statement for many parameter rows in one round
  trip, several times\nfaster than `executeMany`. Its connect functions refuse a MySQL
  server with\n`NotMariaDB`; `mysqlConnection` gives the underlying connection for
  everything\nin `Database.MySQL.Base`. Connections made with `Database.MySQL.Base`
  send the\nsame handshake as before.\n\nUpgrading can break code. `okLastInsertID`
  is a `Word64`. `MySQLValue` gains\n`MySQLDateRaw`, `MySQLDateTimeRaw` and `MySQLTimeStampRaw`
  for dates a `Day`\ncannot hold, `DecodeError` gains `DecodeUnrepresentableDate`,
  and\n`BinLogEventType` gains `BINLOG_UNRECOGNIZED_EVENT` and loses its `Enum`\ninstance
  (use `binLogEventTypeCode`). A connection whose reply was interrupted,\nfor example
  by a timeout, now refuses further commands with `AbandonedReply`\ninstead of handing
  the rest of that reply to the next query (#10); discard it\nand reconnect. `resetStmt`
  with rows still unread raises `UnconsumedResultSet`,\n`withTransaction` rethrows
  the procedure's own exception, and\n`decodeRowBinLogEvent` raises `RowEventDecodeException`
  on an event that may\nhold rows it cannot decode, such as MySQL's compressed transactions,
  where it\nused to crash or skip it. `Database.MySQL.Base` now also exports the five
  new\nquery functions and re-exports `Database.MySQL.Protocol.RawRow`, which can
  clash\nwith same-named definitions under an unqualified import.\n\nIt needs GHC
  9.6 or newer, for the new `unwitch` dependency, and bytestring\n0.11.2; projects
  on older compilers keep resolving to 1.3.2, the last release\nbefore this on Hackage
  (1.3.3 was never uploaded).\n\n* Fix eight defects for MySQL and MariaDB, each with
  a reproducer\n  [#102](https://github.com/winterland1989/mysql-haskell/pull/102)\n*
  Faster row decoding, decoders straight into Haskell values, and FLOAT and\n  DOUBLE
  in exponent form read correctly\n  [#98](https://github.com/winterland1989/mysql-haskell/pull/98)\n*
  A MariaDB module with capability negotiation and extended column metadata\n  [#100](https://github.com/winterland1989/mysql-haskell/pull/100)\n*
  MariaDB bulk execution with NULL, DEFAULT and IGNORE parameters\n  [#101](https://github.com/winterland1989/mysql-haskell/pull/101)\n*
  `Database.MariaDB` for MariaDB servers only, with `mysqlConnection` for the\n  MySQL
  functions [#104](https://github.com/winterland1989/mysql-haskell/pull/104)\n* Allow
  crypton 2.2 and tls 2.5\n  [#105](https://github.com/winterland1989/mysql-haskell/pull/105)\n*
  Examples for `executeBulk` and the functions that decode rows without\n  `MySQLValue`
  [#106](https://github.com/winterland1989/mysql-haskell/pull/106)\n* A comparison
  with the mariadb-haskell fork and a plan to adopt its\n  features, in `docs/`\n
  \ [#99](https://github.com/winterland1989/mysql-haskell/pull/99)\n* Benchmark figures
  re-measured on current hardware\n  [#95](https://github.com/winterland1989/mysql-haskell/pull/95)\n*
  A profile of where the CPU time goes, in `benchmark/`\n  [#96](https://github.com/winterland1989/mysql-haskell/pull/96)\n\n##
  1.3.3 -- 2026.10.07\n\nNew functions, and fixes to `executeMany` and `executeMany_`
  for inputs that\nleft 1.3.2's connection out of step. `queryMulti_` and `queryMulti`
  return every\nresult of a CALL or a multi-statement query in order: each result
  set with its\ncolumns and rows, and each statement's `OK`.\n\n`executeMany` and
  `executeMany_` now read the whole reply. A statement that\nreturns rows raises `ExtraResultSets`,
  where 1.3.2 threw `UnexpectedPacket` or\nleft the rows for the next command. A query
  with several statements per\nparameter set gives one `OK` per statement, where 1.3.2
  returned one per\nparameter set and left the rest. `executeMany` with no parameter
  sets returns\n`[]` without contacting the server, where 1.3.2 sent an empty query
  whose error\nreached the next command.\n\n+ Every result set of a CALL or multi-statement
  query through `queryMulti_`\n  [#94](https://github.com/winterland1989/mysql-haskell/pull/94)\n\n##
  1.3.2 -- 2026.10.07\n\nRequires crypton 2.0 or newer, the first crypton with the
  timing side-channel\nfixes that TLS connections reach; a project held to crypton
  1.x keeps\nresolving to 1.3.1. The only API addition is the `ExtraResultSets` exception.\nThe
  query functions now return an empty result for an INSERT, UPDATE or DELETE\ninstead
  of hanging. `execute_`, `executeStmt` and the query functions read the\nwhole reply
  of a CALL or a multi-statement query, so they no longer leave\nresults behind for
  the next command; `executeMany` and `executeMany_` are\nunchanged (#93).\n\nErrors
  change only for statements that produce several results, or rows where\n`execute_`
  and `executeStmt` expect none. Those two raise `ExtraResultSets` for\na result set
  (1.3.1 threw `UnexpectedPacket` when it came first and returned the\n`OK` when it
  came later); the query functions raise it after the first result\nset's rows when
  a second one follows, which 1.3.1 left on the connection. A\nlater statement that
  fails raises its `ERRException` from that call or its row\nstream, also ahead of
  `ExtraResultSets`. Stack users who set the removed\n`crypton-1-1` flag must delete
  it from `stack.yaml`, since Stack rejects flags a\npackage does not define.\n\n+
  Query functions no longer hang on statements without a result set,\n  multi-result
  replies are read to the end, and crypton 2 is required\n  [#91](https://github.com/winterland1989/mysql-haskell/pull/91)\n+
  CI: the cabal job builds and runs the test suite\n  [#90](https://github.com/winterland1989/mysql-haskell/pull/90)\n\n##
  1.3.1 -- 2026.10.06\n+ Allow crypton 2.0 and 2.1 (commercialhaskell/stackage#8128).
  The library\n  code needed no change; CI now builds and tests against every crypton\n
  \ series the bounds admit (0.34, 1.0, 1.1, 2.0 and 2.1).\n\n## 1.3.0 -- 2026.07.22\n+
  Add `Database.MySQL.Field` with a `Field` typeclass for converting\n  individual
  Haskell values to and from `MySQLValue` (#86). One combined\n  class in the style
  of persistent's `PersistField`, with a `DecodeError`\n  sum type for decode failures
  and named top-level encode/decode functions\n  backing every instance.\n\n## 1.2.5
  -- 2026.05.04\n+ Replace abandoned `pem` dependency with `crypton-pem` (#84)\n\n##
  1.2.4 -- 2026.04.20\n+ Fix benchmark compilation failures (#82):\n  + Replace deleted
  `Data.Binary.Parser.Char8` import in benchmark with\n    `Word8`-based combinators
  from `Data.Binary.Parser`\n  + Replace `GHC.Prim`/`GHC.Types` imports with `GHC.Exts`
  from `base`\n  + Fix `Word8#` vs `Word#` type mismatch in `mhDigitToInt`\n  + Remove
  stale haddock reference to deleted `Char8` module\n\n## 1.2.3 -- 2026.04.12\n+ Support
  caching_sha2_password full auth via RSA on non-TLS connections#81 thanks @ikaro1192\n\n##
  1.2.2 -- 2026.03.25\n+ Widen tls upper bound to allow tls 2.4.x\n+ Fix unsafe ByteString
  operations (`unsafeDrop`, `unsafeTail`, `unsafeIndex`)\n  on untrusted wire protocol
  data that caused undefined behavior (segfaults,\n  garbage reads) on malformed input.
  The safe alternatives are also O(1).\n  Affected parsers: text protocol timestamp/datetime/time/date
  fields,\n  NEWDECIMAL in binlog, and `eventHeaderLen` for unknown event types.\n\n##
  1.2.1 -- 2026.03.23\n+ Export `connectUnixSocket` function.\n+ Tweak cabal file
  to better handle crypton vs cryptonite.\n+ Fix version cut off for tls compatibility.\n+
  Fix missing `liftA2` import when running tests on GHC 9.4.\n+ Add integration test
  for Unix socket.\n\n## 1.2.0 -- 2026.03.07\n+ Add support for  caching_sha2_password
  authentiation.\n\n## 1.1.9 -- 2026.03.07\n+ Fix binary protocol error 1210 on modern
  MySQL/MariaDB:\n  `MYSQL_TYPE_BIT` and `MYSQL_TYPE_YEAR` are not valid parameter
  types\n  for `COM_STMT_EXECUTE`. Send `MySQLBit` as `MYSQL_TYPE_LONGLONG`\n  (unsigned,
  little-endian) and `MySQLYear` as `MYSQL_TYPE_SHORT`\n  (unsigned, 2-byte integer)
  instead.\n+ Fix `MySQLYear` binary encoding: was sending a length-encoded string\n
  \ which caused data misalignment for all subsequent parameters.\n+ Fix version detection
  for MariaDB 10+/11+ (fractional seconds support).\n+ Fix CI: enable binary logging
  and grant binlog privileges for\n  integration tests on MariaDB.\n+ Add roundtrip
  integration tests for `MySQLBit` and `MySQLYear`.\n\n## 1.1.8\n+ bump constraints\n\n##
  1.1.7 -- 2025.08.23 \n+ bump constraints\n+ upgrade cabal file\n+ add upper bounds
  to all the warnings\n  + it was only the test suite so I made them broad.\n+ Disable
  inline-rule-shadowing for Int24 and Word24.\n  those rules fire fine. you can test
  it our yourself with\n  the Main.hs in the main repository.\n  There is a stanza
  to do so in cabal.\n+ clean up cabal file a bit, use GHC2021\n\n## 1.1.6 -- 2024.10.23
  \n+ bump constraints\n\n## 1.1.5 -- 2024.06.25\n+ bump constraints\n\n## 1.1.4 --
  2024.02.17 \n+ bump constraints\n\n## 1.1.3 -- 2023.08.30\n+ bump constraints\n\n##
  1.1.2 -- 2023.08.14\n\n+ Fix package name of changelog\n+ Drop support for RC4 chipher
  which is depracated\n+ drop dependency on binary-ieee754, which was unused.\n+ Fix
  text 2 support, thanks @RikvanToor\n\n## 1.1.1 -- 2023.08.14\n\n+ cleaned up some
  warnings\n+ Merge back into mysql-haskell after gaining hackage access.\n+ Deprecate
  mysql-pure in favor of old hackage\n  since it's only been out for a day this sort
  off\n  stream lines upgrading for most applications.\n  Cabal will just figure it
  out, rather then\n  users having to \"find\" mysql-pure.\n  I'll just make a bonus
  announcement to\n  let people not depend on mysql-pure.\n\n## 1.1.0 -- 2023.08.12
  \nThere was a bunch of stuff unrelated to mysql\nwhich I purged.\nIf you need any
  on these go depend on the \nrespective unmaintained package.\n\n+ Delete module
  System.IO.Streams.UnixSocket\n+ Dleete module Data.Binary.Parser.Char8\n+ Delete
  module System.IO.Streams.Binary\n\n## 1.0.2 -- 2023.08.12 \n+ Bump dependencies,
  go all into crypton\n+ merge tcp-streams into the package\n\n## 1.0.1 -- 2023.08.12
  \n+ add json testfiles as extra source files to make tests pass in nix builds\n\n##
  1.0.0 -- 2023.08.12 \n\n+ Fork from mysql-haskell into mysql-pure\n+ add flake\n+
  merge packages:\n  + word24\n  + binary-parsers\n  + wirestreams\n  \n  This involved
  copying over all source files,\n  furthermore I copied in all tests and benchmarks.\n
  \ The tests are now one giant test suite.\n  I temporarly disabled the mysql tests
  as they need a mysql\n  database to run which won't work nicely with CI right now.\n
  \ However you can run these locally by uncommenting that line.\n+ Add CI which relies
  on native cabal instead of stack\n+ Add an action to automatically bump version.\n+
  Add nightly build cron job.\n\n## 0.8.4.3 -- 2020-11-04\n\n* Fix build with GHC
  8.8.\n\n## 0.8.4.2 -- 2019-01-22\n\n* Fix [stackage#4312](https://github.com/commercialhaskell/stackage/issues/4312):
  Relax `network` bounds.\n\n## 0.8.4.1 -- 2018-10-23\n\n* Relax `tasty` version bound
  to build with latest stackage. [#26](https://github.com/winterland1989/mysql-haskell/pull/26)\n\n##
  0.8.4.0  -- 2018-10-23\n\n* Add `executeMany_` to execute batch SQLs, [#26](https://github.com/winterland1989/mysql-haskell/issues/26).\n*
  Optimize connection closing sequence, [#20](https://github.com/winterland1989/mysql-haskell/pull/20),
  [#25](https://github.com/winterland1989/mysql-haskell/pull/25).\n\n## 0.8.3.0  --
  2017-10-09\n\n* Remove unnecessary exports from `Database.MySQL.Base`.\n* Reuse
  TCP connection when using TLS.\n* Clean up some compiler warnings.\n\n## 0.8.2.0
  \ -- 2017-10-09\n\nCourtesy of naushadh, `mysql-haskell` will be on stackage again.\n\n*
  Update to use `tcp-streams-1.x`.\n* Fix compatibility with new  `tls/memory` version.\n\n##
  0.8.1.0  -- 2016-11-09\n\n* Add `Show` instance to `ConnectInfo`.\n* Add proper
  version bound for `binary`.\n\n## 0.8.0.0  -- 2016-11-09\n\n* Add `ciCharset` field
  to support `utf8mb4` charset.\n* Add `BitMap` field to `COM_STMT_EXECUTE`, and [#8](https://github.com/winterland1989/mysql-haskell/pull/8)
  by [alexbiehl](https://github.com/alexbiehl).\n\n## 0.7.1.0 -- 2016-11-21\n\n* Add
  `QueryParam` class and `Param` datatype for multi-valued parameter(s) by [naushadh](https://github.com/naushadh).\n\n##
  0.7.0.0 -- 2016-11-09\n\n* Split openssl support to [mysql-haskell-openssl](http://hackage.haskell.org/package/mysql-haskell-openssl).\n*
  Expose `Database.MySQL.Connection` module due to this split, it shouldn't be used
  by user directly.\n\n## 0.6.0.0 -- 2016-10-25\n\n* Use binary-ieee754 for older
  binary compatibility.\n* Clean up `Database.MySQL.Protocol.MySQLValue` 's export.\n\n##
  0.5.1.0 -- 2016-10-20\n\n* Add `queryVector`, `queryVector_` and `queryStmtVector`.\n*
  Use binary-parsers to speed up binary parsers.\n\n## 0.5.0.0 -- 2016-8-22\n\n* Export
  exception types.\n* Fix a regression cause password authentication failed, add tests.\n*
  Fix a reading order bug cause 'prepareStmt/prepareStmtDetail' failed.\n\n## 0.4.0.0
  -- 2016-8-22\n\n* Enable TLS support via `tls` package, add benchmarks.\n\n## 0.3.0.0
  \ -- 2016-8-22\n\n* Fix tls connection, change TLS implementation to HsOpenSSL,
  add benchmarks.\n* Fix a bug in 'putLenEncInt' which cause sending large field fail.\n*
  Various optimizations.\n\n## 0.2.0.0  -- 2016-8-19\n\n* Fix OK packet decoder.\n*
  Fix sending large packet(>16M).\n* Add `executeMany`, `withTransaction` to Base
  module.\n* Add timestamp field to `RowBinLogEvent`.\n* Add test, add insert benchmark.\n\n##
  0.1.0.0  -- 2016-8-16\n\n* First version. Released on an unsuspecting world.\n"
changelog-type: markdown
description: "mysql-haskell\n=============\n\n[![Hackage](https://img.shields.io/hackage/v/mysql-haskell.svg?style=flat)](http://hackage.haskell.org/package/mysql-haskell)\n\n`mysql-haskell`
  is a MySQL driver written entirely in haskell.\n\n<a href=\"http://chordify.net/\"><img
  height=42 src='https://chordify.net/img/about/slide_250_1.jpg'></a>\n\nIs it fast?\n----------\n\nIn
  short, reading is as fast as the C client (`libmysqlclient`) on one connection and
  up to 1.7 times slower with ten connections in parallel, and 5 to 8 times faster
  than `mysql-simple`. Writing one statement at a time is 1.2 to 1.4 times slower
  than C, and on par with C through `executeMany`.\n\nMedian wall time in milliseconds
  over 10 runs, for 1 to 10 threads that each use their own connection:\n\n| threads
  \                                  |   1 |   2 |   3 |   4 |   10 |\n|-------------------------------------------|----:|----:|----:|----:|-----:|\n|
  libmysqlclient select                     |  76 |  80 |  88 | 108 |  178 |\n| mysql-haskell
  select                      |  80 |  95 | 106 | 130 |  309 |\n| mysql-haskell select
  over TLS (`tls`)     | 120 | 130 | 148 | 172 |  436 |\n| libmysqlclient select,
  prepared           |  82 |  86 |  94 | 120 |  179 |\n| mysql-haskell select, prepared
  \           |  77 |  88 | 102 | 124 |  275 |\n| mysql-simple select                       |
  462 | 504 | 578 | 698 | 2399 |\n| libmysqlclient insert                     |  29
  |  30 |  36 |  38 |   62 |\n| mysql-haskell insert                      |  40 |
  \ 40 |  45 |  46 |   76 |\n| mysql-haskell insert, `executeMany`       |  27 |  29
  |  36 |  37 |   63 |\n| mysql-haskell insert, prepared            |  38 |  38 |
  \ 45 |  46 |   82 |\n\nEach thread either reads all 300,024 rows of the [sample
  employees table](https://github.com/datacharmer/test_db) with `select * from employees`,
  or inserts 1000 rows into a 29-column table with auto-commit off. The programs are
  the ones in `benchmark/`. They ran on mysql-haskell 1.3.3 with GHC 9.10.3 and `+RTS
  -N4`, against MySQL 8.0.45 and its own client library (mysql-simple goes through
  MariaDB Connector/C 3.3.5), with TLS off unless stated, on an AMD Ryzen AI 7 350
  (October 2026). The server kept its data in RAM, so the inserts measure the clients
  rather than the disk.\n\nLeave the allocation area (`-A`) at its default when running
  with several capabilities: `-A128M` with `-N4` makes the runtime fault in a 128
  MB allocation area for each capability it touches, which costs 35 to 280 ms per
  run in these benchmarks on every GHC version tried. Since GHC 8.2 it touches all
  four even when one thread does the work, where GHC 8.0, used for the 2016 figures
  this README showed until 2026, touched one or two. Without the flag, mysql-haskell
  0.6.0.0 and 1.3.3 run plain and prepared selects equally fast, and 1.3.3 is 1.4
  to 1.6 times faster over TLS.\n\nMotivation\n----------\n\nWhile MySQL may not be
  the most advanced sql database, it's widely used among China companies, including
  but not limited to Baidu, Alibaba, Tecent etc., but haskell's MySQL support is not
  ideal, we only have a very basic MySQL binding written by Bryan O'Sullivan, and
  some higher level wrapper built on it, which have some problems:\n\n+ lack of prepared
  statment and binary protocol support.\n\n+ limited concurrency due to FFI.\n\n+
  no replication protocol support.\n\n`mysql-pure` is intended to solve these problems,
  and provide foundation for higher level libraries such as groundhog and persistent,
  so that accessing MySQL is both fast and easy in haskell.\n\nGuide\n-----\n\nThe
  `Database.MySQL.Base` module provides everything you need to start making queries:\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\n\nmodule Main where\n\nimport Database.MySQL.Base\nimport
  qualified System.IO.Streams as Streams\n\nmain :: IO () \nmain = do\n    conn <-
  connect\n        defaultConnectInfo {ciUser = \"username\", ciPassword = \"password\",
  ciDatabase = \"dbname\"}\n    (defs, is) <- query_ conn \"SELECT * FROM some_table\"\n
  \   print =<< Streams.toList is\n```\n\n`query/query_` will return a column definition
  list, and an `InputStream` of rows, you should consume this stream completely before
  start new queries.\n\nIt's recommanded to use prepared statement to improve query
  speed:\n\n```haskell\n    ...\n    s <- prepareStmt conn \"SELECT * FROM some_table
  where person_age > ?\"\n    ...\n    (defs, is) <- queryStmt conn s [MySQLInt32U
  18]\n    ...\n```\n\nIf you want to do batch inserting/deleting/updating, you can
  use `executeMany` to save considerable time.\n\nTo decode rows straight into your
  own types, skipping `MySQLValue`, give `queryRows_`, `queryRows` or `queryStmtRows`
  a decoder from `Database.MySQL.Decoder`. Each column is checked against its decoder
  once, before the first row:\n\n```haskell\nimport qualified Database.MySQL.Decoder
  as Decode\n\ndata Person = Person { name :: Text, age :: Word32 }\n\nperson :: Decode.RowDecoder
  Person\nperson = Person <$> Decode.field Decode.text <*> Decode.field Decode.word32\n\n
  \   ...\n    (defs, people) <- queryRows_ person conn \"SELECT name, person_age
  FROM some_table\"\n```\n\nThe `Database.MySQL.BinLog` module provides binlog listenning
  functions and row-based event decoder, following program will automatically get
  last binlog position, and print every row event it receives:\n\n```haskell\n{-#
  LANGUAGE LambdaCase #-}\nmodule Main where\n\nimport           Control.Monad         (forever)\nimport
  qualified Database.MySQL.BinLog as MySQL\nimport qualified System.IO.Streams     as
  Streams\n\nmain :: IO () \nmain = do\n    conn <- MySQL.connect \n        MySQL.defaultConnectInfo\n
  \         { MySQL.ciUser = \"username\"\n          , MySQL.ciPassword = \"password\"\n
  \         , MySQL.ciDatabase = \"dbname\"\n          }\n    MySQL.getLastBinLogTracker
  conn >>= \\ case\n        Just tracker -> do\n            es <- MySQL.decodeRowBinLogEvent
  =<< MySQL.dumpBinLog conn 1024 tracker False\n            forever $ do\n                Streams.read
  es >>= \\ case\n                    Just v  -> print v\n                    Nothing
  -> return ()\n        Nothing -> error \"can't get latest binlog position\"\n```\n\nBuild
  Test Benchmark\n--------------------\n\nJust use the old way:\n\n```bash\ngit clone
  https://github.com/winterland1989/mysql-pure.git\ncd mysql-pure\ncabal install --enable-tests
  --only-dependencies\ncabal build\n```\n\nRunning tests require:\n\n* A local MySQL
  server, a user `testMySQLHaskell` and a database `testMySQLHaskell`, you can do
  it use following script:\n\n```bash\nmysql -u root -e \"CREATE DATABASE IF NOT EXISTS
  testMySQLHaskell;\"\nmysql -u root -e \"CREATE USER 'testMySQLHaskell'@'localhost'
  IDENTIFIED BY ''\"\nmysql -u root -e \"GRANT ALL PRIVILEGES ON testMySQLHaskell.*
  TO 'testMySQLHaskell'@'localhost'\"\nmysql -u root -e \"FLUSH PRIVILEGES\"\n```\n\n*
  Enable binlog by adding `log_bin = filename` to `my.cnf` or add `--log-bin=filename`
  to the server, and grant replication access to `testMySQLHaskell` with:\n\n```bash\nmysql
  -u root -e \"GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'testMySQLHaskell'@'localhost';\"\n```\n\n*
  Set `binlog_format` to `ROW`.\n\n* Set `max_allowed_packet` to larger than 256M(for
  test large packet).\n\nEnter benchmark directory and run `./bench.sh` to benchmark
  1) c++ version 2) mysql-pure 3) FFI version mysql, you may need to:\n\n+ Modify
  `bench.sh`(change the include path) to get c++ version compiled.\n+ Modify `mysql-pure-bench.cabal`(change
  the openssl's lib path) to get haskell version compiled.\n+ Setup MySQL's TLS support,
  modify `MySQLHaskellOpenSSL.hs/MySQLHaskellTLS.hs` to change the CA file's path,
  and certificate's subject name.\n+ Adjust rts options `-N` to get best results,
  and leave `-A` at its default (see \"Is it fast?\").\n\nWith `-N10` on my company's
  24-core machine, binary protocol performs almost identical to c version!\n\nThe
  `.cabal` files in `benchmark/` date from 2016 and no longer build; the figures in
  \"Is it fast?\" came from the same programs compiled against the current library.\n\nReference\n---------\n\n[MySQL
  official site](https://dev.mysql.com/doc/internals/en/) provided intensive document,
  but without following project, `mysql-pure` may not be written at all:\n\n+ [mysql-binlog-connector-java](https://github.com/shyiko/mysql-binlog-connector-java)\n\n+
  [canal](https://github.com/alibaba/canal)\n\n+ [go mysql toolkit](https://github.com/siddontang/go-mysql)\n\n+
  [python binlog parser](https://github.com/noplay/python-mysql-replication)\n\nLicense\n-------\n\nCopyright
