changelog: |
  # Change log for the `cabal-flatpak` package

  ## 1.0.0

  cabal-flatpak has changed ownership and now lives at https://codeberg.org/haskell/cabal-flatpak.

  ### Breaking changes

  * The CLI has been completely revamped, please read the README.
  * GHC comes from the `deb12` binary distributions.
  * `plan.json` must come from cabal-install 3.18.1.0 or later, to be able to
    use revisions.

  ### Migration

  1. Install cabal-install 3.18.1.0 or later.
  2. Run `cabal build --dry-run --disable-tests --disable-benchmarks`.
  3. Run `cabal-flatpak generate --dependencies`.
  4. Put `haskell-sources.yaml` in the `modules` list of your manifest,
     before the module that builds your package.

  ## 0.1.1

   * reduce file size of manifests using inlined script `revise.sh`.


  ## 0.1

   * No need to specify `main-sources` field anymore.

   * Fix Cabal revisions in the imported packages.
     Manually fetch necessary information from `01-index.tar`
     and downloaded packages.

  ## 0.0

   * First experimental version inspired by `stackpak`.
