description: "# Canontra\r\n\r\nDeterministic Polyglot Program Identity and Semantic
  Graph Engine\r\n\r\nVersion: v0.3.0.0 (Release v0.3.0)\r\n\r\nOpen-source research
  project by [Jash Thakkar](https://github.com/JashT14) & SymtraceLabs\r\n\r\nRepository:
  <https://github.com/symtrace/canontra>\r\n\r\n## What is Canontra?\r\n\r\nImagine
  you are working on a team project. You open a source code file, add an inline comment
  to explain a tricky line of code, adjust indentation, or swap the order of two independent
  helper functions.\r\n\r\nTo traditional tools like Git, Docker, Bazel, or your Continuous
  Integration (CI) pipeline, the entire file looks completely different. Traditional
  tools calculate a raw cryptographic hash (like SHA-256) over the raw text bytes
  of the file. Because a single added space changes every single character of a raw
  hash, automated systems are forced to assume that your entire program changed.\r\n\r\nAs
  a result, your build system might rebuild large containers, invalidate build caches,
  and spend 20 to 30 minutes running long test suites, even though the actual behavior
  of your program did not change at all.\r\n\r\nCanontra solves this problem. It looks
  past surface-level formatting, comments, and file organization to understand the
  true structural meaning of your code. Written in 100% pure Haskell with zero runtime
  dependencies and zero network access, Canontra projects source code into an orthogonal
  hierarchy of deterministic semantic fingerprints:\r\n\r\n* Did the raw file text
  change? (Source Fingerprint, F0)\r\n* Did the executable logic, math, or if-statements
  change? (Structural Fingerprint, F1)\r\n* Did public function names, parameters,
  or export signatures change? (Declaration Fingerprint, F2)\r\n* Did imported packages
  or modules change? (Dependency Fingerprint, F3)\r\n* Did function caller-to-callee
  relationships change? (Call Graph Fingerprint, F_CG)\r\n* Did if-else branching
  or loop pathways change? (Control Flow Fingerprint, F_CF)\r\n* Did variable definition
  and usage chains change? (Data Flow Fingerprint, F_DF)\r\n* Did structural interface
  types or trait contracts change? (Type Contract Fingerprint, F_T)\r\n* Did the composite
  program identity change? (Composite Fingerprint, F4)\r\n\r\nCanontra works across
  five major programming languages: Python, JavaScript, TypeScript, Go, and Rust.\r\n\r\n##
  What's New in v0.3.0\r\n\r\nThe v0.3.0 release deepens Canontra's semantic invariance
  across local variable renaming, algebraic laws, control-flow branch inversions,
  generic type contracts, and multi-file PR impact slicing:\r\n\r\n* **Scope-Aware
  Bound Lexical $\\alpha$-Canonicalization (`Canontra.Normalize.Alpha`)**: Renaming
  local variables, loop counters, comprehension variables, lambda arguments, or exception
  bindings produces **100% bit-identical** $F_1$, $F_{DF}$, and $F_4$ fingerprints
  while keeping public function names and parameter contracts strictly sensitive in
  $F_2$.\r\n* **Commutative & Associative Algebraic Normal Form (`Canontra.Normalize.Algebraic`)**:
  Pure commutative expressions (`a + b` vs `b + a`, `x * y` vs `y * x`, `a == b` vs
  `b == a`), relational duals (`b > a` vs `a < b`, `b >= a` vs `a <= b`), and unordered
  set/dict literals (`{1, 2, 3}` vs `{3, 1, 2}`) normalize to identical canonical
  forms without reordering impure function calls.\r\n* **CFG Dominator-Tree & Reverse
  Post-Order Canonicalization (`Canontra.Analysis.CFGCanonical`)**: Branch inversions
  (`if not cond: B else: A` vs `if cond: A else: B`), early-exit guard clauses, and
  unreachable statements after `return`/`raise` normalize to identical $F_{CF}$ and
  $F_1$ digests.\r\n* **Deepened Structural Type Contract ($F_T$) Lattice**: Nested
  union/intersection flattening (`(A | B) | C` == `C | (B | A)`), positional de Bruijn
  generic type parameter normalization (`interface Store<K, V>` == `interface Store<Key,
  Val>`), and structural record field sorting across Python, TypeScript, Go, and Rust.\r\n*
  **CSR-Native Multi-File PR Batch Change Impact Analysis (`canontra impact --pr-base
  <ref>`)**: Computes joint backward reachability cones over unboxed CSR graphs in
  under 50 microseconds and emits ready-to-run test commands for `pytest`, `jest`,
  `go test`, and `cargo test`.\r\n<!-- \r\n## What's New in v0.2.0\r\n\r\nThe v0.2.0
  release makes Canontra dramatically faster, slashes memory consumption, and expands
  language support to modern standards:\r\n\r\n* **Blazing-Fast Multi-Core Processing**:
  Canontra now distributes work across all available CPU cores automatically, scanning
  and analyzing over **110,000 lines of code per second**. Entire repositories analyze
  in a fraction of a second.\r\n* **70% Less Memory Footprint**: Whole-repository
  call graphs and data-flow graphs now use ultra-compact arrays instead of heavy memory
  trees, keeping RAM usage low and execution smooth even on massive projects.\r\n*
  **Instant Incremental Caching (2.8×-3.7× Faster)**: Re-checking files you haven't
  touched is practically instantaneous (under 1 microsecond per file). The cache also
  includes self-healing recovery that protects against unexpected shutdowns or corrupted
  files.\r\n* **Modern Polyglot Language Support**:\r\n  * **Python 3.12**: Supports
  nested f-strings with quote reuse, new generic type parameter syntax (`type Alias[T]
  = ...`), and walrus operator `:=` expressions in comprehensions.\r\n  * **TypeScript
  5.2 & JavaScript**: Supports explicit resource management (`using` and `await using`)
  with automated cleanup tracking.\r\n  * **Go 1.21+**: Supports built-in functions
  (`min`, `max`, `clear`) and generic interface tilde constraint sets (`~T`).\r\n
  \ * **Rust 2021 Edition**: Supports Generic Associated Types (GATs) and raw identifiers
  (`r#type`, `r#match`).\r\n* **Rock-Solid Reliability**: Added automatic retry handling
  on Windows to eliminate file-locking conflicts from antivirus or search indexers,
  circular directory link detection, and bit-identical results across Windows, macOS,
  and Linux. -->\r\n\r\n## A Concrete Example\r\n\r\nConsider this Python file, `original.py`:\r\n\r\n```python\r\n#
  Calculate customer discount for orders\r\ndef calculate_discount(price: float, discount:
  float = 0.1) -> float:\r\n    return price * (1.0 - discount)\r\n\r\ndef get_service_version():\r\n
  \   return \"1.0.0\"\r\n```\r\n\r\nNow consider `modified.py`, where a developer
  ran a code formatter, added a docstring, and reordered the two independent functions:\r\n\r\n```python\r\ndef
  get_service_version():\r\n    return \"1.0.0\"\r\n\r\ndef calculate_discount(  price:
  float, discount: float = 0.1  ) -> float:\r\n    \"\"\"Calculates customer discount
  for orders.\"\"\"\r\n    return price * (1.0 - discount)\r\n```\r\n\r\nIf you run
  standard Git diff or raw SHA-256 on these files, they appear completely different.
  But when you run Canontra:\r\n\r\n```bash\r\ncanontra compare original.py modified.py\r\n```\r\n\r\nCanontra
  outputs:\r\n\r\n```\r\n================================================================================\r\n
  \ CANONTRA SEMANTIC COMPARISON\r\n================================================================================\r\n
  \ Target A:             original.py\r\n  Target B:             modified.py\r\n................................................................................\r\n
  \ Source Text (F0):     DIFFERENT  (raw formatting and docstrings modified)\r\n
  \ Structural AST (F1):  IDENTICAL  (executable logic is unchanged)\r\n  Declarations
  (F2):    IDENTICAL  (public API signatures are unchanged)\r\n  Dependencies (F3):
  \   IDENTICAL  (imported packages are unchanged)\r\n  Type Contract (F_T):  IDENTICAL
  \ (interface contracts are unchanged)\r\n  Composite (F4):       IDENTICAL  (overall
  semantic identity preserved)\r\n================================================================================\r\n
  \ Verdict: SEMANTICALLY IDENTICAL\r\n================================================================================\r\n```\r\n\r\nCanontra
  proves mathematically that while the raw text changed, the actual program logic,
  public interface, and behavior are 100% identical. Your build system can safely
  skip recompiling and skip re-running tests.\r\n\r\nNow consider `buggy.py`, where
  someone made an accidental change to the math operator:\r\n\r\n```python\r\ndef
  calculate_discount(price: float, discount: float = 0.1) -> float:\r\n    return
  price - (1.0 - discount)  # Bug: changed * to -\r\n```\r\n\r\nWhen compared against
  `original.py`:\r\n\r\n```bash\r\ncanontra compare original.py buggy.py\r\n```\r\n\r\nCanontra
  immediately reports:\r\n\r\n```\r\n================================================================================\r\n
  \ CANONTRA SEMANTIC COMPARISON\r\n================================================================================\r\n
  \ Structural AST (F1):  DIFFERENT  (arithmetic operator mutated)\r\n  Declarations
  (F2):    IDENTICAL  (public signature unchanged)\r\n  Composite (F4):       DIFFERENT\r\n================================================================================\r\n
  \ Verdict: SEMANTICALLY DIVERGENT (Exit Code: 1)\r\n================================================================================\r\n```\r\n\r\nCanontra
  pinpoints that an internal calculation changed while the public function signatures
  remained untouched.\r\n\r\n## Installation\r\n\r\nCanontra can be installed directly
  from **[Hackage](https://hackage.haskell.org/package/canontra)** using `cabal`,
  or via automated pre-built installer scripts (no Haskell toolchain required).\r\n\r\n###
  Option 1: Install from Hackage (via Cabal)\r\n\r\nIf you already have Haskell GHC
  and Cabal installed, you can install Canontra with a single command:\r\n\r\n```bash\r\ncabal
  update\r\ncabal install canontra\r\n```\r\n\r\n> **Tip**: Ensure that your Cabal
  binary directory (usually `~/.cabal/bin` on Linux/macOS or `%APPDATA%\\cabal\\bin`
  on Windows) is in your system `PATH`.\r\n\r\n### Option 2: Automated Install Scripts
  (No Haskell Toolchain Required)\r\n\r\nIf you don't have Haskell installed, use
  our automated one-line installer scripts. They automatically detect your operating
  system and CPU architecture, download the native binary, add it to your PATH, and
  configure shell completions:\r\n\r\n#### Linux and macOS (POSIX)\r\n\r\nRun the
  direct installer in your terminal:\r\n\r\n```bash\r\ncurl -fsSL https://raw.githubusercontent.com/symtrace/canontra/main/install.sh
  | bash\r\n```\r\n\r\nOr run the local script directly:\r\n\r\n```bash\r\n./install.sh\r\n```\r\n\r\nThe
  script automatically detects your operating system (Linux or macOS) and processor
  architecture (x86_64 or ARM64/Apple Silicon), installs the standalone binary into
  `~/.local/bin`, configures your PATH, and sets up shell completions for Bash, Zsh,
  or Fish. Official release binaries are stripped on Linux and ad-hoc codesigned on
  macOS.\r\n\r\nTo simulate the installation without modifying files:\r\n\r\n```bash\r\n./install.sh
  --dry-run\r\n```\r\n\r\n#### Windows (PowerShell)\r\n\r\nOpen PowerShell and run
  the direct installer:\r\n\r\n```powershell\r\nirm https://raw.githubusercontent.com/symtrace/canontra/main/install.ps1
  | iex\r\n```\r\n\r\nOr run the local script directly:\r\n\r\n```powershell\r\n.\\install.ps1\r\n```\r\n\r\nOfficial
  release binaries of `canontra.exe` are Authenticode self-signed with SHA-256 for
  code integrity verification. The script detects your architecture (AMD64 or ARM64),
  installs `canontra.exe` into `%LOCALAPPDATA%\\Programs\\canontra`, updates your
  User environment PATH permanently without needing administrator privileges, and
  registers autocompletions in your PowerShell profile.\r\n\r\nTo simulate the installation
  on Windows:\r\n\r\n```powershell\r\n.\\install.ps1 -DryRun\r\n```\r\n\r\n### Option
  3: Building from Source\r\n\r\nYou can build Canontra from source using Haskell
  Stack or Cabal:\r\n\r\nUsing Stack:\r\n\r\n```bash\r\ngit clone https://github.com/symtrace/canontra.git\r\ncd
  canontra\r\nstack build --fast\r\nstack install\r\n```\r\n\r\nUsing Cabal:\r\n\r\n```bash\r\ncabal
  update\r\ncabal build\r\ncabal install --installdir=$HOME/.local/bin\r\n```\r\n\r\nTo
  run the full test suite with strict compiler verification:\r\n\r\n```bash\r\nstack
  test --pedantic\r\n```\r\n\r\n## Commands and Usage\r\n\r\nCanontra provides a unified,
  production-ready command line interface.\r\n\r\n### 1. Compute Semantic Fingerprints
  (`canontra fp`)\r\n\r\nGenerate the full multi-tier fingerprint manifest for any
  file:\r\n\r\n```bash\r\ncanontra fp src/main.py\r\n```\r\n\r\nOutput formatted as
  JSON for automated pipelines:\r\n\r\n```bash\r\ncanontra fp src/main.py --json\r\n```\r\n\r\nOutput
  only the composite hash for fast scripting:\r\n\r\n```bash\r\ncanontra fp src/main.py
  --hash\r\n```\r\n\r\n### 2. Standard Input Streaming (`canontra fp -`)\r\n\r\nYou
  can pipe source code directly into Canontra using standard input (`-`). Specify
  the language with `--language` (or `-l`):\r\n\r\n```bash\r\necho \"def add(x, y):
  return x + y\" | canontra fp - --language python --hash\r\n```\r\n\r\nThis makes
  it easy to integrate Canontra into Git pre-commit hooks, editor linters, and shell
  scripts without writing temporary files to disk.\r\n\r\n### 3. Compare Two Source
  Files (`canontra compare`)\r\n\r\nCompare two versions of a file across all semantic
  tiers:\r\n\r\n```bash\r\ncanontra compare v1/service.ts v2/service.ts\r\n```\r\n\r\nCanontra
  returns strict POSIX exit codes:\r\n\r\n* Exit code 0: The files are semantically
  identical.\r\n* Exit code 1: The files have semantic differences.\r\n* Exit code
  2: Command line syntax or argument error.\r\n* Exit code 3: Source code parse error.\r\n*
  Exit code 4: File I/O or security boundary error.\r\n\r\n### 4. Structural Diff
  (`canontra diff`)\r\n\r\nInspect fine-grained AST and declaration differences between
  two files:\r\n\r\n```bash\r\ncanontra diff old_auth.py new_auth.py\r\n```\r\n\r\nThis
  output separates superficial changes from actual structural modifications, showing
  exactly which functions were added, removed, or changed.\r\n\r\n### 5. Call Graph
  and Flow Analysis (`canontra graph`)\r\n\r\nGenerate call graphs, control-flow graphs,
  or data-flow graphs for a file or directory:\r\n\r\n```bash\r\ncanontra graph src/
  --dot\r\n```\r\n\r\nOutputs standard Graphviz DOT format that you can visualize
  using Graphviz or modern graph viewers.\r\n\r\n### 6. Export Machine Interchange
  Formats (`canontra export`)\r\n\r\nExport semantic diffs and impact findings in
  standard machine formats:\r\n\r\nExport in OASIS SARIF v2.1.0 format (supported
  by GitHub Code Scanning, SonarQube, and CI dashboards):\r\n\r\n```bash\r\ncanontra
  export src/service.ts --format sarif -o findings.sarif\r\n```\r\n\r\nExport in Graphviz
  DOT format:\r\n\r\n```bash\r\ncanontra export src/service.ts --format dot -o callgraph.dot\r\n```\r\n\r\n###
  7. Manage the Local Build Cache (`canontra cache`)\r\n\r\nCanontra includes an ultra-fast
  local binary cache (`.canontra/cache.bin`) that remembers file fingerprints in compact,
  cache-aligned records. It delivers sub-microsecond warm lookups (< 500 ns per file)
  and features isolated 4KB page CRC32 checksums for automatic self-healing against
  corrupted files:\r\n\r\nView cache statistics and hit rates:\r\n\r\n```bash\r\ncanontra
  cache info\r\n```\r\n\r\nVerify the cryptographic CRC32 integrity of all 4KB cache
  pages:\r\n\r\n```bash\r\ncanontra cache verify\r\n```\r\n\r\nRemove records for
  files that have been deleted from disk:\r\n\r\n```bash\r\ncanontra cache prune\r\n```\r\n\r\nClear
  the local cache completely:\r\n\r\n```bash\r\ncanontra cache clean\r\n```\r\n\r\n###
  8. Shell Autocompletions (`canontra completions`)\r\n\r\nGenerate native completion
  scripts for your favorite shell:\r\n\r\n```bash\r\ncanontra completions bash > ~/.local/share/bash-completion/completions/canontra\r\ncanontra
  completions zsh > ~/.zfunc/_canontra\r\ncanontra completions fish > ~/.config/fish/completions/canontra.fish\r\ncanontra
  completions powershell >> $PROFILE\r\n```\r\n\r\n## Where is Canontra Used?\r\n\r\nCanontra
  is designed for modern development workflows and infrastructure:\r\n\r\n### Smart
  CI/CD Build Caches\r\n\r\nIn continuous integration pipelines, running test suites
  and building packages takes substantial time and cloud compute budget. By replacing
  raw byte hashes with Canontra semantic fingerprints, CI pipelines can safely skip
  rebuilding and testing packages when developers only update documentation, comments,
  formatting, or internal variable names.\r\n\r\n### Monorepo Impact Analysis\r\n\r\nIn
  large monorepos with thousands of interdependent services, determining what needs
  to be re-tested after a commit is difficult. Canontra combines call graph analysis
  and declaration hashes to calculate exact change impact boundaries, ensuring you
  test only what could actually be affected.\r\n\r\n### Meaningful Code Review and
  PR Triage\r\n\r\nAutomated pull request bots can run Canontra to tell reviewers
  immediately: \"This pull request changed 400 lines of code across 12 files, but
  all changes are cosmetic formatting and comment updates. Zero public APIs and zero
  executable logic pathways were altered.\"\r\n\r\n### Security and Vendor Dependency
  Auditing\r\n\r\nWhen updating external open-source packages, security teams can
  use Canontra to verify whether a minor patch release modified executable statements
  or merely updated license text and comments.\r\n\r\n## Documentation Index\r\n\r\nExplore
  the rest of the documentation for full technical details:\r\n\r\n* [CHANGELOG.md](CHANGELOG.md):
  Complete release history, version notes, and PVP conformance.\r\n* [benchmarkReport.md](benchmarkReport.md):
  Empirical benchmark report, multi-tool comparative evaluation, and whole-repository
  graph synthesis evaluation across 15 production repositories.\r\n* [BENCHMARKS.md](BENCHMARKS.md):
  Performance benchmarks, latency measurements, and throughput statistics across supported
  languages.\r\n* [REAL_WORLD_BENCHMARKS.md](REAL_WORLD_BENCHMARKS.md): Empirical
  reproduction runbook and evaluation methodology across real-world open-source repositories.\r\n*
  [technicalSpecs.md](technicalSpecs.md): Comprehensive technical architecture, compiler
  pipeline flow, 9-tier identity math, flat linear arenas, unboxed CSR graphs, and
  cache specifications.\r\n* [CONTRIBUTING.md](CONTRIBUTING.md): Guide for contributors,
  development environment setup, code conventions, and test verification standards.\r\n*
  [SECURITY.md](SECURITY.md): Security policy, air-gapped isolation guarantees, path
  traversal sandboxing, and vulnerability reporting.\r\n\r\n## License\r\n\r\nCanontra
  is open-source software licensed under the Apache License, Version 2.0. See the
  [LICENSE](LICENSE) file for details.\r\n"
