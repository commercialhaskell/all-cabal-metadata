changelog: |
  ### 0.7.0.0

  - Add support for OTLP over HTTP/Protobuf. To use HTTP/Protobuf, use:
    - `--otlp-protocol=http/protobuf`
    - `--otlp-endpoint=http://my-http-endpoint:my-http-port`

    See `demo-http-protobuf` for a demo that uses `eventlog-live-otelcol` to
    sends data directly to Prometheus over HTTP/Protobuf.

  - **BREAKING**: Rename `--otelcol` command-line options to `--otlp`, and
    change the separate `host`/`port`/`ssl` options to `--otlp-endpoint`,
    which accepts an URL similar to the OTLP environment variables.

    Moreover, the `certificate-store` and `ssl-key-log`/`ssl-key-log-from-env`
    options are now prefixed by `--otlp-grpc-`, e.g., `--otlp-grpc-ssl-key-log`.

  - **BREAKING**: Rename `profiles` processors to `call_stack_profile` and
    `cost_centre_stack_profile`. These processors now respect the name given
    in the configuration file, e.g., using the default configuration, these
    profiles will be available in Pyroscope as...
    - `ghc_eventlog_CallStackProfile:cpu:samples`
    - `ghc_eventlog_CostCentreStackProfile:cpu:samples`

  - **BREAKING**: Change default semantics of the configuration file.

    Starting from version 0.7.0.0, if the key for any specific processor
    is present in the file, even if it sets none of the properties, the
    processor is _enabled_, and any missing keys will default to the values
    in this file. Otherwise, the processor is _disabled_. For instance,
    the following configuration will run _only_ the `heap_prof_sample`
    processor with the default configuration.

    ```yaml
    processors:
      metrics:
        heap_prof_sample:
    ```

    Previously, if any key in the configuration file was commented out,
    it was given the value in the default configuration. Unfortunately,
    this was very unintuitive. Consider the following configuration...

    ```yaml
    processors:
      metrics:
        heap_prof_sample:
          name: ghc_eventlog_HeapProfSample
          aggregate: 5s
          export: 5s
    ```

    Previously, this would activate `heap_prof_sample` with the given
    configuration and activate _all other processors_ with their default
    configuration. Moreover, if the user edited the file and commented out
    the `heap_prof_sample` section...

    ```yaml
    processors:
      metrics:
    #     heap_prof_sample:
    #       name: ghc_eventlog_HeapProfSample
    #       aggregate: 5s
    #       export: 5s
    ```

    ...this would _not_ deactive the `heap_prof_sample` processor. Rather,
    it would keep the `heap_prof_sample` processor active with its default
    configuration.

  ### 0.6.1.0

  - Support eventlog over TCP/IP.

  ### 0.6.0.0

  - **BREAKING**: Drop `enabled` from configuration files.
  - **BREAKING**: Change value of `aggregate` in configuration files to ``(boolean | `${number}x`)``.
  - Support logs and markers (`thread_label`, `user_marker`, `user_message`, `internal_log_message`).
  - Support internal telemetry (currently only `internal_log_message`).
  - Support cost-centre profiles.
  - Support `ghc-stack-profiler` call-stack profiles.
  - **BREAKING**: Use OTLP v1.9.
  - Support an optional control server via a REST API.

  ### 0.5.0.0

  - **BREAKING**: Put `ghc-debug-stub` support behind `use-ghc-debug-stub` feature flag.

  ### 0.4.0.0

  - Fix space leak in `processHeapProfSampleData`.
  - Support aggregation (via configuration files).
  - Support statistics with the `--stats` flag:

    ```
    ┌────────┬──────────┬──────────────┬───────────────┬───────────────────┐
    │  Item  │  Action  │ Total (item) │ Rate (item/s) │ Peak (item/batch) │
    ╞════════╪══════════╪══════════════╪═══════════════╪═══════════════════╡
    │ Event  │ Received │        66036 │        6603/s │           22197/s │
    ├────────┼──────────┼──────────────┼───────────────┼───────────────────┤
    │ Metric │ Exported │          274 │          45/s │              59/s │
    ├────────┼──────────┼──────────────┼───────────────┼───────────────────┤
    │        │ Rejected │            0 │           0/s │               0/s │
    ├────────┼──────────┼──────────────┼───────────────┼───────────────────┤
    │ Span   │ Exported │        19372 │        3228/s │            5979/s │
    ├────────┼──────────┼──────────────┼───────────────┼───────────────────┤
    │        │ Rejected │            0 │           0/s │               0/s │
    └────────┴──────────┴──────────────┴───────────────┴───────────────────┘
    ```

  ### 0.3.0.0

  - Support configuration files (via `--config`; see `--print-defaults`).
  - **BREAKING**: Remove `--otelcol-no-metrics` and `--otelcol-no-traces` flags.
    The behaviour of these flags is superceded by the configuration files.

  ### 0.2.0.0

  - **BREAKING**: Support info and debug verbosity. This changes the semantics of `--verbosity=3` and up.
  - Support reading the eventlog from stdin.
  - Support reading the eventlog from file.

  ### 0.1.0.3

  - Support `random-1.2`

  ### 0.1.0.2

  - Lower `cabal-version` constraint to `3.0`

  ### 0.1.0.0

  - Initial release.
changelog-type: markdown
description: |-
  This executable collects telemetry data from any Haskell application
  and sends it over the OpenTelemetry protocol. The next release of this
  executable will be as part of the
  [@eventlog-live@ package](https://hackage.haskell.org/package/eventlog-live)
  under the name @eventlog-live-otlp@.

  For more information, see [the README](https://github.com/well-typed/eventlog-live#readme).

  > Usage: eventlog-live-otelcol (--eventlog-stdin | --eventlog-file FILE |
  >                                --eventlog-socket SOCKET |
  >                                --eventlog-socket-host HOST
  >                                --eventlog-socket-port PORT)
  >                              [--eventlog-socket-timeout SECONDS]
  >                              [--eventlog-socket-exponent NUMBER]
  >                              [--eventlog-flush-interval SECONDS]
  >                              [--eventlog-log-file FILE] [-h Tcmdyrbi]
  >                              [--service-name STRING] [--ipedb FILE]
  >                              [--ccdb FILE]
  >                              [-v|--verbosity fatal|error|warning|info|debug|trace]
  >                              [-s|--stats] [--config FILE] [--otlp-protocol ARG]
  >                              --otlp-endpoint ARG
  >                              [--otlp-grpc-certificate-store FILE]
  >                              [--otlp-grpc-ssl-key-log FILE |
  >                                --otlp-grpc-ssl-key-log-from-env]
  >                              [--otlp-http-headers ARG] [--print-defaults]
  >                              [--print-config-json-schema]
  >
  > Available options:
  >   --eventlog-stdin         Read the eventlog from stdin.
  >   --eventlog-file FILE     Read the eventlog from a file.
  >   --eventlog-socket SOCKET Read the eventlog from a Unix socket.
  >   --eventlog-socket-host HOST
  >                            Read the eventlog from a TCP/IP socket.
  >   --eventlog-socket-port PORT
  >                            Read the eventlog from a TCP/IP socket.
  >   --eventlog-socket-timeout SECONDS
  >                            Eventlog socket connection retry timeout in seconds.
  >   --eventlog-socket-exponent NUMBER
  >                            Eventlog socket connection retry timeout exponent.
  >   --eventlog-flush-interval SECONDS
  >                            Eventlog flush interval in seconds.
  >                            Should match the option passed to the application.
  >   --eventlog-log-file FILE Use file to log binary eventlog data.
  >   -h Tcmdyrbi              Heap profile breakdown.
  >                            Should match the option passed to the application.
  >   --service-name STRING    The name of the profiled service.
  >   --ipedb FILE             The path to an IPE database.
  >   --ccdb FILE              The path a cost-centre database.
  >   -v,--verbosity fatal|error|warning|info|debug|trace
  >                            The severity threshold for logging.
  >   -s,--stats               Display runtime statistics.
  >   --config FILE            The path to a detailed configuration file.
  >   --print-defaults         Print default configuration options.
  >   --print-config-json-schema
  >                            Print JSON Schema for configuration format.
  >   --help                   Show this help text.
  >   --version                Show version information
  >
  > OTLP Exporter Options
  >   --otlp-protocol ARG      The OTLP transport protocol to be used for all telemetry data (gRPC, HTTP/Protobuf).
  >                            Default value: gRPC
  >   --otlp-endpoint ARG      The OTLP endpoint URL for all telemetry data, with an optionally-specified port number.
  >                            Default value:
  >                              gRPC: http://localhost:4317
  >                              HTTP: http://localhost:4318
  >                            Example:
  >                              gRPC: https://my-api-endpoint:443
  >                              HTTP: http://my-api-endpoint/
  >   --otlp-grpc-certificate-store FILE
  >                            Store for certificate validation.
  >   --otlp-grpc-ssl-key-log FILE
  >                            Use file to log SSL keys.
  >   --otlp-grpc-ssl-key-log-from-env
  >                            Use SSLKEYLOGFILE to log SSL keys.
  >   --otlp-http-headers ARG  A list of headers to apply to all outgoing data.
  >
  > Control Server Options
  >   --control                Unsupported. Requires build with -f+control.
  >                            Start the control server.
  >   --control-port           Unsupported. Requires build with -f+control.
  >                            The port number for the control server.
  >   --control-cors-allow-origin
  >                            Unsupported. Requires build with -f+control.
  >                            Set the allowed origins for the control server CORS policy.
  >   --control-cors-max-age   Unsupported. Requires build with -f+control.
  >                            Set the maximum age of a cached CORS preflight request for the control server CORS policy.
  >   --control-cors-require-origin
  >                            Unsupported. Requires build with -f+control.
  >                            If enabled, the control server will not accept requests without an Origin header.
  >   --control-cors-ignore-failure
  >                            Unsupported. Requires build with -f+control.
  >                            If enabled, the control server will accept malformed CORS preflight requests.
  >
  > Debug Options
  >   --my-eventlog-socket-unix
  >                            Unsupported. Requires build with -f+use-eventlog-socket.
  >                            Open an eventlog socket for this program on the given Unix socket.
  >   --my-ghc-debug-socket    Unsupported. Requires build with -f+use-ghc-debug-stub.
  >                            Open the default ghc-debug socket for this program.
  >   --my-ghc-debug-socket-unix
  >                            Unsupported. Requires build with -f+use-ghc-debug-stub.
  >                            Open a ghc-debug Unix domain socket with the given file path.
  >   --my-ghc-debug-socket-tcp
  >                            Unsupported. Requires build with -f+use-ghc-debug-stub.
  >                            Open a ghc-debug TCP/IP socket with the given address as 'host:port'.
