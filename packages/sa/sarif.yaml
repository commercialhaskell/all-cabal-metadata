changelog: |
  # Changelog for `sarif`

  ## 0.2 - 1 November 2026

  * Added Aeson instances for all objects listed in the SARIF v2.1.0 specification. [#5](https://github.com/mbg/sarif/pull/5) by [@lllssskkk](https://github.com/lllssskkk)

  ## 0.1 - 22 December 2022

  * First release with an initial implementation of some key aspects of the SARIF specification
