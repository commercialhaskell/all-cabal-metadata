  ## 5. Integration Points & Subsystem Boundaries

  `gargamelle-logic` resides at **Tier 2 (Semantic Foundations)** of the monorepo architecture:

  ```
  ┌────────────────────────────────────────────────────────┐
  │               Downstream Consumers                     │
  │  - gargamelle-model: ObsMor in Verifier AST & Evidence │
  │  - gargamelle-core: Institutions, Weaving, Signatures  │
  │  - gargamelle-fol: Hyperdoctrines, SMT Pipe           │
  │  - gargamelle-sheaf: Cellular Sheaf Restrictions      │
  └──────────────────────────▲─────────────────────────────┘
                             │
                   [gargamelle-logic]
                             │
  ┌──────────────────────────▼─────────────────────────────┐
  │               Upstream Substrates                      │
  │  - lattices (>= 2.2): Heyting algebras, Op functor     │
  │  - profunctors (>= 5.6): Strong, Choice, Category      │
  │  - polytropos-core (>= 0.1.0.1): Open records/variants │
  └────────────────────────────────────────────────────────┘
  ```

  ---

  ## 6. Diagnostic & Troubleshooting Guide

  ### 6.1 Refinement Direction Inversion Errors
  - **Symptom:** Composing contracts results in an unexpectedly strict assumption or relaxed guarantee.
  - **Root Cause:** Attempting to manually invert assumptions (e.g. `not a`) instead of using `Op a`.
  - **Remedy:** Use `contract a g` smart constructor and standard meet `c1 /\ c2`. The `Op` wrapper mechanically maps `/\` to join `\/` on assumptions.

  ### 6.2 Opaque Closure Contamination
  - **Symptom:** An autonomous agent or verifier is unable to explain or serialize a transformation pipeline.
  - **Root Cause:** Introducing raw Haskell functions `(a -> b)` or `Kleisli m a b` directly into signatures instead of `ObsMor a b`.
  - **Remedy:** Wrap all custom logic into `SymbolicStep "step-name" fn` or use the standard category and profunctor combinators (`first'`, `left'`).

