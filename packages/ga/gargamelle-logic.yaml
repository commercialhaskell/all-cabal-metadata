description: |
  # `gargamelle-logic` — Pure Syntax, Order-Theoretic Contracts & Defunctionalized Morphisms

  [![Haskell](https://img.shields.io/badge/Language-Haskell2010-purple.svg)](https://haskell.org)
  [![License: EUPL-1.2](https://img.shields.io/badge/License-EUPL--1.2-blue.svg)](https://spdx.org/licenses/EUPL-1.2.html)
  [![Tier 2 Substrate](https://img.shields.io/badge/Tier-2%20Substrate%20%26%20Semantics-teal.svg)](../../README.md#architectural-tier-map)

  ---

  ## 1. Executive Summary & Problem Framing

  In autonomous multi-agent verification and sheaf-theoretic program synthesis, software specifications must satisfy three competing criteria:
  1. **Unambiguous Compositional Semantics:** Subsystems must compose algebraically without hidden side effects or ad-hoc casing.
  2. **First-Class Introspectability:** SMT solvers, AI agents, and refactoring engines must inspect, rewrite, and verify transformation pipelines without executing opaque host closures `(->)`.
  3. **Sound Contract Dualization:** When refining or composing assume-guarantee contracts, assumptions and guarantees must vary contravariantly (weakening assumptions while strengthening guarantees).

  `gargamelle-logic` provides the foundational mathematical substrates for the Gargamelle engine:
  - Order-theoretic contract refinement via functorial order dualization (`Algebra.Lattice.Op`).
  - Defunctionalized observable morphisms (`ObsMor`) that reify function arrows into an inspectable GADT obeying `Category`, `Profunctor`, `Strong`, and `Choice` laws.
  - Contravariant Galois connections ($\alpha \dashv \gamma$) between interior component stalks and boundary communication interfaces.
  - Flat First-Order Logic ASTs (`LogicAST`) designed for $O(N)$ linear SMT-LIB2 emission and zero recursive stack blowups.
  - Multiparty Session Types (`MPST`) choreography specifications and contextual hole specifications (`HoleSpec`) for resilient grammar parsing.

  ---

  ## 2. Mathematical Foundations & Theoretical Invariants

  ### 2.1 Order-Theoretic Inversion via `Op` Dualization
  In contract-based design, contract refinement $C_1 \sqsubseteq C_2$ (evaluated as lattice meet $C_1 \wedge C_2$) establishes that $C_1$ is a strictly safer, more capable specification that can substitute for $C_2$ in any environment.

  For guarantees $G$, refinement requires strengthening ($G_1 \wedge G_2$). For assumptions $A$, refinement requires *weakening* ($A_1 \vee A_2$), because a more refined component makes fewer demands upon its environment:

  ```
                    Base Lattice L                       Order-Dual Lattice Op L
                   (Guarantees: Meet)                      (Assumptions: Join)
                         ⊤ (Weak)                                ⊤ = Op ⊥ (Demanding)
                        / \                                     / \
                       /   \                                   /   \
                      /     \                                 /     \
                     g1     g2                              Op a1  Op a2
                      \     /                                 \     /
                       \   /                                   \   /
                        \ /                                     \ /
                     g1 ∧ g2 (Strong)                    Op a1 ∧ Op a2 = Op (a1 ∨ a2) (Relaxed)
                        ...                                     ...
                         ⊥ (Impossible)                          ⊥ = Op ⊤ (Trivial)
  ```

  By wrapping assumptions inside `Op a` from `Algebra.Lattice.Op`, the contract meet becomes the standard cartesian product meet:
  $$(Op(A_1), G_1) \wedge (Op(A_2), G_2) = (Op(A_1 \vee A_2), G_1 \wedge G_2)$$

  <!-- See Note [Lattice Inversion via Op Dualization] [ref:note-lattice-op-dualization] -->

  ### 2.2 Circular Assume-Guarantee Soundness
  For mutually dependent components $C_1 = (A_1, G_1)$ and $C_2 = (A_2, G_2)$ communicating across a shared boundary, circular reasoning is sound in any Heyting algebra if and only if both entailments hold simultaneously:
  $$(A_1 \wedge G_2 \implies G_1) \wedge (A_2 \wedge G_1 \implies G_2) = \top$$

  <!-- See Note [Circular Assume-Guarantee Soundness] [ref:note-circular-ag-soundness] -->

  ### 2.3 Galois Adjunction Between Cell Stalks
  To transfer contracts soundly between interior vertex stalks $\mathcal{V}$ and boundary communication channels $\mathcal{E}$, `Galois` defines an adjunction $\alpha \dashv \gamma$:
  $$\operatorname{restrict}(v) \le_{\mathcal{E}} e \iff v \le_{\mathcal{V}} \operatorname{coRestrict}(e)$$

  - **Unit:** $v \le_{\mathcal{V}} \operatorname{coRestrict}(\operatorname{restrict}(v))$ (projecting to boundary and lifting over-approximates).
  - **Counit:** $\operatorname{restrict}(\operatorname{coRestrict}(e)) \le_{\mathcal{E}} e$ (lifting from boundary and restricting is contractive).

  <!-- See Note [Adjoint Restrict-CoRestrict Galois Connections] [ref:note-galois-connection-stalks] -->

  ---

