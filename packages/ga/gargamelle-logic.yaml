  ## 4. Executable Worked Examples

  ### 4.1 Order-Theoretic Contract Composition
  ```haskell
  module ExampleContract where

  import Algebra.Lattice (Lattice(..))
  import Gargamelle.Logic.Contract

  -- Define two boolean contracts
  -- C1 assumes False (strictest requirement), guarantees True (strongest promise)
  -- C2 assumes True (weak requirement), guarantees False (weak promise)
  exampleRefine :: (Bool, Bool)
  exampleRefine =
    let c1 = contract False True
        c2 = contract True False
        refined = c1 /\ c2
    in (getAssumption refined, getGuarantee refined)
    -- Evaluates to (True, False):
    -- Assumption was weakened (False \/ True = True)
    -- Guarantee was strengthened (True /\ False = False)
  ```

  ### 4.2 Observable Morphism Pipeline Inspection
  ```haskell
  module ExampleObsMor where

  import Control.Category (Category(..))
  import Prelude hiding (id, (.))
  import Gargamelle.Logic.Defunctionalize

  -- Compose a multi-stage data transformation
  pipeline :: ObsMor Int String
  pipeline =
    SymbolicStep "showResult" show
      . SymbolicStep "double" (* 2)
      . SymbolicStep "validatePositive" (\x -> if x >= 0 then x else 0)

  -- Statically inspect steps without running any evaluation
  steps :: [String]
  steps = inspectObsMor pipeline
  -- Evaluates to: ["Step:validatePositive", "Step:double", "Step:showResult"]

  -- Run the compiled function
  result :: String
  result = evalObsMor pipeline 21 -- "42"
  ```

