                             │
  ┌──────────────────────────▼─────────────────────────────┐
  │               Upstream Substrates                      │
  │  - gargamelle-core: Institutional Signatures & Proxies │
  │  - hs-tree-sitter (>= 0.1): Concrete Syntax Trees      │
  │  - tree-diff (>= 0.3): Tree Edit Distances             │
