  ```

  ---

  ## 6. Diagnostic & Troubleshooting Guide

  ### 6.1 Tree-Sitter Parser Version Mismatch
  - **Symptom:** `tsNodeToDataTree` fails or returns malformed child node indices.
  - **Root Cause:** Incompatible C library bindings or out-of-date grammar shared objects.
  - **Remedy:** Ensure the tree-sitter grammars are compiled against matching `tree-sitter` ABI versions in the Nix/Cabal environment.

  ### 6.2 Threshold Sensitivity in CEGIS Synthesizer
  - **Symptom:** Valid candidate patches are prematurely rejected as "similar failures."
  - **Root Cause:** `threshold` in `proposesSimilarFailure` is set too high (e.g., $\ge 5$), catching legitimate divergent code edits.
  - **Remedy:** Retain the default threshold of $\le 2$ (allowing single-node substitutions while pruning identical leaf mutations).

  ---

