  ## 4. Executable Worked Examples

  ### 4.1 Constructing and Running an Arrow Rope Pipeline
  ```haskell
  {-# LANGUAGE OverloadedStrings #-}

  module ExampleRope where

  import Control.Arrow (Kleisli(..))
  import Control.Category ((.))
  import Prelude hiding ((.))
  import Data.Text (Text)
  import Data.Word (Word64)
  import Effect.Rope
  import Effect.Handlers

  -- Compose a sequential effect pipeline: log initialization then fetch random seed
  samplePipeline :: Rope (Kleisli (Either Text)) mantle () Word64
  samplePipeline = getRandomWordRope . logInfoRope "Initializing workflow pipeline"

  -- Execute using pure in-memory mock handlers
  runMock :: Either Text Word64
  runMock = runKleisli (runRope samplePipeline pureMockHandlers) ()
  -- Returns: Right 42
  ```

  ### 4.2 Fusing Pure Post-Processing Transformations via Coyoneda
  ```haskell
  module ExampleFusion where

  import Control.Arrow (arr, Kleisli(..))
  import Data.Text (Text)
  import Effect.Rope
  import Effect.Handlers
  import Gargamelle.Effect.Fusion

  -- Base arrow multiplying input by 2
  baseArrow :: Rope (Kleisli (Either Text)) mantle Int Int
  baseArrow = ropeFromCore (arr (* 2))

  -- Fuse pure arithmetic without intermediate arrow frames
  fusedPipeline :: Rope (Kleisli (Either Text)) mantle Int Int
  fusedPipeline = fuseRope $
    fuseRopeMap (+ 10) $
      fuseRopeMap (+ 5) $
        liftCoyoneda baseArrow

  -- Executing: ((10 * 2) + 5) + 10 = 35
  runFusedPipe :: Either Text Int
  runFusedPipe = runKleisli (runRope fusedPipeline pureMockHandlers) 10
  -- Returns: Right 35
  ```

  ---

  ## 5. Integration Points & Subsystem Boundaries

  `gargamelle-effect` sits at **Tier 3 (Substrate & Semantics)** of the architecture:

  ```
  ┌────────────────────────────────────────────────────────┐
  │               Downstream Consumers                     │
  │  - gargamelle-workflow: Sheaf-Gated CEGIS Loop         │
  │  - gargamelle-sandbox: Bubblewrap Execution Strands    │
  │  - gargamelle-persistence: Beam SQLite Transactions    │
  └──────────────────────────▲─────────────────────────────┘
                             │
                   [gargamelle-effect]
                             │
  ┌──────────────────────────▼─────────────────────────────┐
  │               Upstream Substrates                      │
  │  - kernmantle (>= 0.1.0.1): Core Rope Arrow abstraction│
  │  - polytropos-core (>= 0.1.0.1): Flat SmallArray Rep   │
  │  - polytropos-profunctors (>= 0.1.0.1): Lenses, Prisms │
  │  - kan-extensions (>= 5.2): Coyoneda construction      │
  └────────────────────────────────────────────────────────┘
  ```

  ---

  ## 6. Diagnostic & Troubleshooting Guide

  ### 6.1 Host Sandbox Binary Missing at Configuration Time
  - **Symptom:** `validateWorkflowResources` returns `Left ["Sandbox binary missing: /usr/bin/bwrap"]`.
  - **Root Cause:** Bubblewrap (`bwrap`) is not installed or not in the specified path.
  - **Remedy:** Ensure Bubblewrap is installed (`sudo apt-get install bubblewrap` or Nix environment `pkgs.bubblewrap`).

  ### 6.2 Variant Router Tag Bounds Overflow
  - **Symptom:** `indexSmallArray: index out of bounds` during variant routing.
  - **Root Cause:** A variant with tag $K \ge N$ was routed through a `VariantRouter` built with $N$ handlers.
  - **Remedy:** Ensure `makeRouter` receives handlers for all possible tags in the open variant row.

  ---

