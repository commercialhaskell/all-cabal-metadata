description: |
  # `gargamelle-effect` — Arrow Rope Orchestration, $O(1)$ Variant Router & Coyoneda Fusion

  [![Haskell](https://img.shields.io/badge/Language-Haskell2010-purple.svg)](https://haskell.org)
  [![License: EUPL-1.2](https://img.shields.io/badge/License-EUPL--1.2-blue.svg)](https://spdx.org/licenses/EUPL-1.2.html)
  [![Tier 3 Substrate](https://img.shields.io/badge/Tier-3%20Substrate%20%26%20Semantics-teal.svg)](../../README.md#architectural-tier-map)

  ---

  ## 1. Executive Summary & Problem Framing

  Extensible effect systems in modern Haskell typically suffer from three fundamental limitations:
  1. **$O(N)$ Dynamic Dispatch Overhead:** Conventional extensible effect stacks (such as `freer-simple` or `polysemy`) route effects by walking type-level lists at runtime via `Member eff r` dictionaries, incurring linear traversals, pointer indirection, and heap allocation on the hot path.
  2. **Coupled Execution and Inability to Fail-Fast:** Monadic effect frameworks interleave computation with interpretation. Workflows cannot statically audit host dependencies (e.g., verifying whether `/usr/bin/bwrap` or SQLite database paths exist) *prior* to executing side effects.
  3. **Intermediate Arrow Pipeline Allocations:** Chaining pure post-processing transformations onto arrow pipelines introduces intermediate `arr` lifting frames and redundant compositions.

  `gargamelle-effect` solves these challenges by combining the **Kernmantle Arrow Rope** model with **Polytropos $O(1)$ jump-table dispatch**:
  - **Hardware-Level $O(1)$ Variant Routing:** Dispatches open sum variants through an unboxed array jump-table in $O(1)$ CPU time.
  - **Pure Profunctor Optics:** Views and updates structural records and variants in-place via `Polytropos.Profunctors`.
  - **Coyoneda Pipeline Fusion:** Defers and fuses pure post-processing transformations into a single atomic composition step via the Coyoneda lemma.
  - **Config-Time Environment Auditing:** Inspects required capabilities and verifies physical host prerequisites before executing a single workflow effect.

  ---

  ## 2. Mathematical Foundations & Theoretical Invariants

  ### 2.1 The Arrow Rope Functor
  A Kernmantle `Rope` separates the computation arrow from the effect interpreter mantle:

  ```
                    ┌─────────────────────────────────────────┐
                    │          Handlers core (Mantle)         │
                    └────────────────────┬────────────────────┘
                                         │ (Supplied at invocation)
                                         ▼
    Input a ════════════════════► [Rope core mantle] ════════════════════► Output b
                       (Arrow Pipeline Composition: >>>, ***, &&&)
  ```

  Formally, `Rope` is a reader over the mantle of handlers:
  $$\operatorname{Rope}(\operatorname{core}, \operatorname{mantle}, a, b) \cong \operatorname{Handlers}(\operatorname{core}) \to \operatorname{core}(a, b)$$

  This guarantees that the pipeline topology is purely structural, allowing the exact same workflow to run under pure in-memory mock handlers during unit tests and production OS sandboxes during execution.

  <!-- See Note [Mantle Decoupling and Config-Time Resource Verification] [ref:note-mantle-static-requirements] -->

  ### 2.2 $O(1)$ Variant Jump-Table Physics
  In Polytropos, open sums (variants) are represented by an unboxed constructor tag and a flat `SmallArray` of payload slots:
  $$\operatorname{Rep} = \langle \operatorname{tag} : \operatorname{Int}, \operatorname{slots} : \operatorname{SmallArray} \, \operatorname{Any} \rangle$$

  The `VariantRouter` constructs a contiguous lookup table of handler arrows indexed by tag:

  ```
  Incoming Variant: [Tag = 1 | Slots = [Any "payload"]]
                           │
                           ▼  (O(1) Array Indexing)
  VariantRouter Table:
    ┌───┬───────────────────────────────────────────────────────┐
    │ 0 │ Handler 0: \rep -> Kleisli (handleTag0 (getSlot 0 rep))│
    ├───┼───────────────────────────────────────────────────────┤
    │ 1 │ Handler 1: \rep -> Kleisli (handleTag1 (getSlot 0 rep))│ ──► Dispatched in O(1)
    ├───┼───────────────────────────────────────────────────────┤
    │ 2 │ Handler 2: \rep -> Kleisli (handleTag2 (getSlot 0 rep))│
    └───┴───────────────────────────────────────────────────────┘
  ```

  The CPU executes a single indirect jump:
  $$\operatorname{handler} = \operatorname{indexSmallArray} \, \operatorname{table} \, \operatorname{tag}$$
  $$\operatorname{action} = \operatorname{handler}(\operatorname{slots})$$

  Dispatch executes in $O(1)$ time with **zero heap allocation** on the hot path.

  <!-- See Note [O(1) Variant Jump-Table Dispatch Physics] [ref:note-variant-jump-table-physics] -->

  ### 2.3 Coyoneda Pipeline Fusion
  By the Coyoneda lemma, any functorial or arrow transformation can be accumulated purely:
  $$\operatorname{Coyoneda}(F, A) \cong \exists B.\, (B \to A) \times F(B)$$

  ```
    fmap f          fmap g          fmap h
  (───────►)      (───────►)      (───────►)
     Coyoneda id r  ──► Coyoneda f r ──► Coyoneda (g . f) r ──► Coyoneda (h . g . f) r
                                                                      │
                                                   fuseRope           ▼
                                                       arr (h . g . f) <<< r
  ```

  Rather than inserting 3 intermediate `arr` lifting frames, `fuseRope` materializes the accumulated Haskell function composition $(h \circ g \circ f)$ in a single composition step.

  <!-- See Note [Coyoneda Pipeline Fusion] [ref:note-coyoneda-pipeline-fusion] -->

  ---

