changelog: |
  # Changelog for gargamelle-effect

  ## 0.1.0.0 — Initial Release

  - Integrated Penelope polycategorical effect system (`penelope-core`, `penelope-effects`, `penelope-static`) and Polytropos 0.1.0.3.
  - Arrow Rope effect orchestration layer with Polytropos O(1) jump-table variant routers.
  - Pure optic dispatch, arrow loop handling, and Coyoneda pipeline fusion.
  - Integrated beam database and sandbox execution strands.
