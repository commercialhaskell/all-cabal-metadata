description: |
  # `gargamelle-sheaf` — Cellular Sheaves, Store Comonad Diffusion & Homological Fault Localization

  [![Haskell](https://img.shields.io/badge/Language-Haskell2010-purple.svg)](https://haskell.org)
  [![License: EUPL-1.2](https://img.shields.io/badge/License-EUPL--1.2-blue.svg)](https://spdx.org/licenses/EUPL-1.2.html)
  [![Tier 4 Applied Topology](https://img.shields.io/badge/Tier-4%20Applied%20Topology%20%26%20Sheaf%20Cohomology-teal.svg)](../../README.md#architectural-tier-map)

  ---

  ## 1. Executive Summary & Problem Framing

  Verifying distributed software architectures, multi-agent microservices, and modular contract networks typically relies on monolithic whole-program SMT encoding. As systems scale, this monolithic approach suffers from three critical bottlenecks:
  1. **Combinatorial State Explosion:** Encoding every module simultaneously produces exponential solver slowdowns and out-of-memory timeouts.
  2. **Opaque Global Failure Reports:** When a composite system fails to satisfy a specification, provers return a monolithic counterexample without pinpointing which subsystem interface caused the contradiction.
  3. **Fragile Contract Reconciliation:** Components developed independently lack an automated algebraic mechanism to negotiate mutually acceptable contract relaxations across boundaries.

  `gargamelle-sheaf` transforms software verification using applied algebraic topology:
  - **Cellular Graph Complexes:** Formalizes architectures as 1-dimensional cell complexes $G = (V, E)$, modeling modules as 0-cells and shared interfaces as 1-cells.
  - **Cellular Sheaves:** Assigns contract and model stalks over cells, with directional restriction maps ($\rho_{u \trianglelefteq e}, \rho_{v \trianglelefteq e}$) projecting internal specifications to interface boundaries.
  - **Store Comonad Consensus Diffusion:** Models cellular space comonadically via `Store vId stalk`, evaluating parallel discrete diffusion across all vertices via comonadic `extend`.
  - **Knaster-Tarski Harmonic Convergence:** Iterates meet semi-lattice contractions (`diffuseUntilHarmonic`) to compute the greatest lower bound contract refinement satisfying all interfaces.
  - **Sheaf Coboundary ($\delta^0$) & Homological Fault Localization ($H^1$):** Detects vanishing coboundaries as certified global sections ($H^0(G; \mathcal{F}) = \ker \delta^0$) and uses cohomological obstructions ($H^1 = \operatorname{coker} \delta^0$) to pinpoint the exact failing interface boundaries to guide automated repair.

  ---

  ## 2. Mathematical Foundations & Theoretical Invariants

  ### 2.1 Software Architectures as Cell Complexes
  A 1-dimensional cell complex (graph complex) $G = (V, E)$ consists of:
  - **0-cells (Vertices $v \in V$):** Component scopes or module stalks.
  - **1-cells (Edges $e \in E$):** Communication channels or shared interface contracts.
  - **Graded Poset:** Faces satisfy $\sigma \trianglelefteq \tau$, with incidence signs $[e : u] = -1$ (source) and $[e : v] = +1$ (target).
  - **Euler Characteristic:** $\chi(G) = |V| - |E|$.

  ### 2.2 Cellular Sheaves & Stalk Assignments
  A cellular sheaf $\mathcal{F}$ over $G$ associates:
  1. To each vertex $v \in V$, a stalk $\mathcal{F}(v)$ (e.g. assume-guarantee contract or model).
  2. To each edge $e = (u, v) \in E$, an edge stalk $\mathcal{F}(e)$ (shared interface schema).
  3. To each face relation $u \trianglelefteq e$, a restriction morphism $\rho_{u \trianglelefteq e} : \mathcal{F}(u) \to \mathcal{F}(e)$.

  <!-- See Note [Cellular Sheaf Restriction Maps and Stalk Functors] [ref:note-cellular-sheaf-stalks] -->

  ### 2.3 Store Comonad Cellular Diffusion & Knaster-Tarski Consensus
  Evaluating cellular diffusion across all vertices simultaneously is expressed comonadically using `Control.Comonad.Store`:
  $$\text{Store } s \; a \cong (s \to a) \times s$$

  ```
                ┌───────────────────────────────────────────┐
                │  Store vId stalk (Comonadic Space)        │
                │  - pos w      : Focused active vertex     │
                │  - extract w  : Current vertex stalk      │
                │  - peek nbr w : Stalk at neighbor nbr     │
                └─────────────────────┬─────────────────────┘
                                      │
                         extend diffuseLocalRule
                                      │
                                      ▼
                ┌───────────────────────────────────────────┐
                │  Updated Cochain0 across all V in ||      │
                └───────────────────────────────────────────┘
  ```

  By the **Knaster-Tarski fixed-point theorem**, because contract meet semi-lattices are monotonic and contractive ($c_{t+1} \le c_t$), the diffusion sequence $c_0 \ge c_1 \ge c_2 \dots$ generated by `diffuseUntilHarmonic` converges monotonically to the unique greatest lower bound.

  <!-- See Note [Store Comonad Cellular Diffusion and Harmonic Consensus] [ref:note-store-comonad-diffusion] -->

  ### 2.4 Sheaf Coboundary ($\delta^0$) & Cohomological Obstructions ($H^1$)
  The 0-th coboundary operator $\delta^0 : C^0(G; \mathcal{F}) \to C^1(G; \mathcal{F})$ evaluates boundary discrepancies along every edge $e = (u, v)$:
  $$\delta^0(x)_e = (\rho_{u \trianglelefteq e}(x_u), \rho_{v \trianglelefteq e}(x_v))$$

  ```
            F(u) (Vertex u)                      F(v) (Vertex v)
              │                                    │
              │ ρ_{u ⊴ e}                         │ ρ_{v ⊴ e}
              ▼                                    ▼
            F(e) ───────── Discrepancy? ─────────► F(e)
                       (s == t) => H^0 Section
                       (s /= t) => H^1 Obstruction
  ```

  - **Harmonic Global Sections ($H^0(G; \mathcal{F}) = \ker \delta^0$):** When all boundary evaluations match ($\forall e: \rho_u(x_u) = \rho_v(x_v)$), $x$ forms a global section certifying system-wide compatibility.
  - **Model Amalgamation Theorem:** $H^0(G; \mathbf{Mod}) \cong \mathbf{Mod}(\operatorname{colim} D)$.
  - **Cohomological Obstructions ($H^1 = \operatorname{coker} \delta^0$):** When $\delta^0(x) \neq 0$, `locateObstructions` pinpoints the exact failing edges $e$ and mismatched values $(s, t)$ to guide directed repair.

  <!-- See Note [Sheaf Coboundary Operator and Cohomological Obstructions] [ref:note-sheaf-coboundary-obstructions] -->

  ---

