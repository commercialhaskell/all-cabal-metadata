  ---

  ## 4. Executable Worked Examples

  ### 4.1 Comonadic Consensus Diffusion Over Cell Complex
  ```haskell
  module ExampleSheafDiffusion where

  import Algebra.Lattice (Lattice(..), BoundedMeetSemiLattice(..))
  import Gargamelle.Sheaf

  -- Define contract lattice: meet strengthens the requirement
  data SecLevel = Public | Confidential | TopSecret deriving (Eq, Ord, Show)

  instance Lattice SecLevel where
    (/\) = max
    (\/) = min

  instance BoundedMeetSemiLattice SecLevel where
    top = Public

  diffuseSecurityPolicy :: IO ()
  diffuseSecurityPolicy = do
    -- Graph: ServiceA <---> ServiceB <---> ServiceC
    let complex = fromEdges [("e1", "ServiceA", "ServiceB"), ("e2", "ServiceB", "ServiceC")]
        sheaf = symmetricSheaf (\_ c -> c) (\_ e -> e)
        initial = fromListCochain0
          [ ("ServiceA", TopSecret)
          , ("ServiceB", Public)
          , ("ServiceC", Public)
          ]
        -- Diffuse until consensus is reached
        harmonic = diffuseUntilHarmonic 10 complex sheaf initial

    putStrLn $ "Diffused consensus: " ++ show harmonic
    -- Evaluates to TopSecret across all three vertices
  ```

  ### 4.2 Pinpointing Failing Interfaces via $H^1$ Cohomology
  ```haskell
  module ExampleFaultLocalization where

  import Gargamelle.Sheaf

  localizeFailingInterface :: IO ()
  localizeFailingInterface = do
    let complex = fromEdges [("api_edge", "AuthService", "BillingService")]
        sheaf = symmetricSheaf (\_ (v :: String) -> v) (\_ e -> e)
        candidate = fromListCochain0
          [ ("AuthService", "BearerTokenV2")
          , ("BillingService", "BasicAuthLegacy")
          ]
        obstructions = locateObstructions complex sheaf candidate

    case obstructions of
      [] -> putStrLn "System globally consistent (H^1 = 0)."
      obs -> mapM_ (\o -> putStrLn $ "Interface failure on: " ++ obstructedEdge o) obs
  ```

  ---

  ## 5. Integration Points & Subsystem Boundaries

  `gargamelle-sheaf` forms **Tier 4 (Applied Topology)** of the architecture:

  ```
  ┌────────────────────────────────────────────────────────┐
  │               Downstream Consumers                     │
  │  - gargamelle-workflow: Sheaf-Gated CEGIS Synthesis    │
  │  - Automated Repair Engines: H¹ Obstruction Guided Fix │
  └──────────────────────────▲─────────────────────────────┘
                             │
                    [gargamelle-sheaf]
                             │
  ┌──────────────────────────▼─────────────────────────────┐
  │               Upstream Substrates                      │
  │  - comonad (>= 5.0): Store Comonad                     │
  │  - lattices (>= 2.2): BoundedMeetSemiLattice           │
  │  - gargamelle-core: Institutions, Colimits             │
  │  - gargamelle-logic: Contracts, Galois Connections     │
  └────────────────────────────────────────────────────────┘
  ```

  ---

  ## 6. Diagnostic & Troubleshooting Guide

  ### 6.1 Diffusion Oscillation or Non-Termination
  - **Symptom:** `diffuseUntilHarmonic` exhausts max step limit without reaching a fixed point.
  - **Root Cause:** The underlying stalk lattice violates the descending chain condition or the local update rule is non-monotonic.
  - **Remedy:** Ensure the stalk type implements `BoundedMeetSemiLattice` where `(/\)` is strictly monotonic ($x \wedge y \le x$), guaranteeing finite convergence on finite graphs.

  ### 6.2 Missing Vertex in Coboundary Lookup
  - **Symptom:** Runtime error `coboundary: source vertex missing`.
  - **Root Cause:** A 0-cochain was constructed missing an entry for a vertex declared in the cell complex.
  - **Remedy:** Use `fromListCochain0` covering all `vertices complex`, or initialize via `cochainToStore top c0`.

  ---

