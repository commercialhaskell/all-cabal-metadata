changelog: |
  # Changelog for gachi-core

  ## 0.1.0.1 — 2026-11-03

  - Strict Hackage metadata hardening: added category, description, and PVP upper bounds across all build dependencies.

  ## 0.1.0.0 — Initial Release

  - Foundational osteological memory representations and lock-free synchronization.
  - Polytropos-backed osteological data structures.
  - Concurrent atomic updates, rewriting primitives, and graph traversals.
changelog-type: markdown
description: |
  # gachi-core

  Foundational osteological memory representations and lock-free synchronization primitives for `gachi`.

  ## Modules
  - **`Gachi.Core`**: High-level skeletal types, bone/joint identifiers, and chattering synchronization.
  - **`Gachi.Osteology`**: Primitive unboxed memory layouts and contiguous array indexing.

  ## Notes Architecture
  - `Note [Chattering Lock-Free Atomic Synchronization]` `[ref:note-chattering-synchronization]`
  - `Note [Osteological Contiguous Memory Layout]` `[ref:note-osteology-memory-layout]`

  ## License
  EUPL-1.2
