  ## 4. Executable Worked Examples

  ### 4.1 Checking Satisfaction Condition Invariance
  ```haskell
  {-# LANGUAGE DataKinds #-}
  {-# LANGUAGE TypeApplications #-}
  {-# LANGUAGE TypeOperators #-}
  {-# LANGUAGE AllowAmbiguousTypes #-}

  module ExampleInstitution where

  import Proarrow.Core (type (~>))
  import Gargamelle.Core.Institution

  -- Given a signature morphism morph :: s1 ~> s2,
  -- a sentence phi, and a target model mPrime:
  verifyPreservation
    :: forall i s1 s2. CategoricalInstitution i
    => (s1 ~> s2)
    -> Sen i s1
    -> Mod i s2
    -> Bool
  verifyPreservation morph phi mPrime =
    let (evLHS, evRHS, isPreserved) = checkSatisfactionInvariance @i morph phi mPrime
    in isPreserved && evLHS == evRHS
  ```

  ### 4.2 Non-Invasive Feature Weaving
  ```haskell
  module ExampleWeaving where

  import Proarrow.Category.Instance.Unit (Unit(..))
  import Gargamelle.Core.Weaving

  -- Weave an aspect into a base specification along their common interface:
  weaveSystem :: IO ()
  weaveSystem = do
    let inclBase   = Unit
        inclAspect = Unit
    weaveAspect inclBase inclAspect $ \_injBase _injAspect -> do
      putStrLn "Weaving completed: canonical injection morphisms established."
  ```

  ---

  ## 5. Integration Points & Subsystem Boundaries

  `gargamelle-core` occupies **Tier 3 (Logic & Institution Engine)** in the Gargamelle hierarchy:

  ```
  ┌────────────────────────────────────────────────────────┐
  │               Downstream Consumers                     │
  │  - gargamelle-fol: First-Order Logic Institution       │
  │  - gargamelle-equational: DPO Graph Rewriting          │
  │  - gargamelle-sheaf: Sheaf Restriction Functors        │
  │  - gargamelle-workflow: Full CEGIS Synthesis Pipelines │
  └──────────────────────────▲─────────────────────────────┘
                             │
                   [gargamelle-core]
                             │
  ┌──────────────────────────▼─────────────────────────────┐
  │               Upstream Substrates                      │
  │  - gargamelle-logic: Contracts, Galois, ObsMor         │
  │  - gargamelle-model: Free Verifier AST, Evidence       │
  │  - proarrow (>= 0.2): Thin categories, Colimits        │
  │  - polytropos-core (>= 0.1.0.1): Structural Rep        │
  └────────────────────────────────────────────────────────┘
  ```

  ---

  ## 6. Diagnostic & Troubleshooting Guide

  ### 6.1 Satisfaction Invariance Failure
  - **Symptom:** `checkSatisfactionInvariance` returns `isPreserved = False` or `evLHS /= evRHS`.
  - **Root Cause:** Either the sentence translation functor $\mathbf{Sen}(\sigma)$ did not preserve the semantics of operators, or the model reduction functor $\mathbf{Mod}(\sigma)$ dropped necessary interpretations during pullback.
  - **Remedy:** Inspect the `Evidence` produced by `evLHS` and `evRHS`. If `evLHS` contains a `Counterexample` but `evRHS` returns `VerifiedSection`, verify that variables in the reduct model are mapped correctly.

  ### 6.2 Pushout Apex Ambiguity
  - **Symptom:** GHC complains of ambiguous type variables when invoking `weaveAspect`.
  - **Root Cause:** The pushout apex type is existential in `weaveAspect`.
  - **Remedy:** Use rank-N continuation pattern `weaveAspect inclB inclW $ \injB injW -> ...` and ensure the continuation consumes the injections polymorphically.

  ---

