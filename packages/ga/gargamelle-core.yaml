description: |
  # `gargamelle-core` — Categorical Institutions, Colimit Pushout Weaving & Interface Discovery

  [![Haskell](https://img.shields.io/badge/Language-Haskell2010-purple.svg)](https://haskell.org)
  [![License: EUPL-1.2](https://img.shields.io/badge/License-EUPL--1.2-blue.svg)](https://spdx.org/licenses/EUPL-1.2.html)
  [![Tier 3 Logic Engine](https://img.shields.io/badge/Tier-3%20Logic%20%26%20Institution%20Engine-teal.svg)](../../README.md#architectural-tier-map)

  ---

  ## 1. Executive Summary & Problem Framing

  Formal verification and automated program synthesis across complex systems encounter three fundamental architectural challenges:
  1. **Heterogeneous Specification Logics:** Real-world systems mix propositional assertions, first-order relational constraints, equational graph rewrites, and temporal choreographies. Hardcoding a single logical framework fractures tooling and prevents compositional reasoning.
  2. **Invasive Aspect Mutation:** Augmenting a verified component with auxiliary capabilities (logging, authentication, persistent storage, or transactional safety) frequently mutates the base AST directly, invalidating existing safety proofs and risking name/sort collisions.
  3. **Implicit Interface Mismatches:** Distributed and multi-agent components evolve independently, making manual schema coordination fragile, unscalable, and error-prone.

  `gargamelle-core` resolves these challenges through classical and modern category theory:
  - **Goguen-Burstall Institutions:** Formalizes logical systems via signatures $\mathbf{Sig}$, covariant sentence translation $\mathbf{Sen}$, contravariant model reduction $\mathbf{Mod}$, and executable satisfaction invariance.
  - **Categorical Pushout Feature Weaving ($B \amalg_C W$):** Non-invasively synthesizes composite system specifications by amalgamating a base specification $B$ and an aspect extension $W$ along their shared boundary $C$.
  - **Pullback Protocol Discovery ($A \times_E B$):** Automatically discovers the maximal compatible communication interface between two independently specified components interacting with an ambient host environment $E$.
  - **Colimit Mediating Morphisms:** Computes universal semantic deltas (`factorSemanticDelta`) that propagate updates and proofs incrementally across structural modifications.

  ---

  ## 2. Mathematical Foundations & Theoretical Invariants

  ### 2.1 The Goguen-Burstall Satisfaction Invariance Condition
  An institution $\mathcal{I} = (\mathbf{Sig}, \mathbf{Sen}, \mathbf{Mod}, \models)$ consists of:
  1. A category of signatures $\mathbf{Sig}$ and signature morphisms $\sigma : \Sigma_1 \to \Sigma_2$.
  2. A functor $\mathbf{Sen} : \mathbf{Sig} \to \mathbf{Set}$ translating sentences.
  3. A contravariant functor $\mathbf{Mod} : \mathbf{Sig}^{\mathrm{op}} \to \mathbf{Cat}$ reducing models.
  4. A family of satisfaction relations $\models_\Sigma \;\subseteq |\mathbf{Mod}(\Sigma)| \times \mathbf{Sen}(\Sigma)$ satisfying:
     $$M' \models_{\Sigma_2} \mathbf{Sen}(\sigma)(\varphi) \iff \mathbf{Mod}(\sigma)(M') \models_{\Sigma_1} \varphi$$

  In `gargamelle-core`, this condition is verified operationally through inspectable `Verifier` ASTs:
  ```
             translateSen σ
     Sen(Σ1) ──────────────► Sen(Σ2)
        │                       │
        │ ⊨_Σ1                 │ ⊨_Σ2
        ▼                       ▼
     Mod(Σ1) ◄────────────── Mod(Σ2)
                reductMod σ
  ```

  <!-- See Note [Goguen-Burstall Categorical Institution Satisfaction Invariance] [ref:note-institution-satisfaction-invariance] -->

  ### 2.2 Pushout Feature Weaving ($B \amalg_C W$)
  Given a base specification $B$, an aspect concern $W$, and their common interface $C$, feature weaving is formalized as the categorical pushout in the category of signatures:

  ```
          C ──────────────► W (Aspect Extension)
          │                 │
          │ inclB           │ injAspect
          ▼                 ▼
          B ──────────────► P = B ⨿_C W (Woven Specification)
     (Base System)  injBase
  ```

  - **Commutativity:** $\operatorname{injBase} \circ \operatorname{inclB} = \operatorname{injAspect} \circ \operatorname{inclW}$.
  - **Model Amalgamation:** By contravariance of $\mathbf{Mod}$, the pushout in $\mathbf{Sig}$ induces a pullback in $\mathbf{Cat}$. Any pair of models $(M_B, M_W)$ that coincide on $C$ amalgamate into a unique model $M_P$ over $P$.
  - **Proof Preservation:** Invariants proven on $B$ translate functorially along $\operatorname{injBase}$ into $P$ with zero re-verification overhead.

  <!-- See Note [Categorical Pushout Feature Weaving] [ref:note-pushout-feature-weaving] -->

  ### 2.3 Pullback Interface Discovery ($A \times_E B$)
  When two components $A$ and $B$ interact with an ambient environment $E$ via morphisms $f : A \to E$ and $g : B \to E$, the universal shared interface $P$ through which they communicate is given by the categorical pullback:

  ```
          P = A ×_E B ────────► B (Component 2)
               │                │
               │ projA          │ g
               ▼                ▼
          A ─────────────► E (Environment / Host)
     (Component 1)   f
  ```

  - **Interface Compatibility:** The square commutes ($f \circ \operatorname{projA} = g \circ \operatorname{projB}$), guaranteeing environmental compatibility.
  - **Universal Factorization:** For any candidate protocol $Q$ with $f \circ q_A = g \circ q_B$, `factorInterface` calculates the unique mediating arrow $u : Q \to P$.

  <!-- See Note [Pullback Interface Discovery] [ref:note-pullback-interface-discovery] -->

  ### 2.4 Colimit Mediating Morphisms & Semantic Deltas
  When an architectural specification $P$ undergoes evolution to candidate cocone $Q$, `factorSemanticDelta` evaluates the unique arrow $u : P \to Q$ mediating between the colimit legs. This mediating arrow reifies the exact structural delta required to migrate proofs and properties to the new architecture.

  <!-- See Note [Colimit Mediating Morphisms and Semantic Delta Propagation] [ref:note-colimit-semantic-delta] -->

  ---

