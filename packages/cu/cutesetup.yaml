description: "#+author: Alice Liddell \n#+options: toc:nil\n\n[[file:demo.gif]]\n\n*
  What?\n✿ A cute Haskell TUI for quickly scaffolding =flake.nix= + =.envrc= for common
  languages.\n\n* Why?\nBecause manually writing Nix flakes every time you start a
  new project is annoying! Let a cute TUI do the heavy lifting.\n\n* Features\n- *Language
  picker* - 13 languages: Python, Rust, Go, Node.js, Haskell, Ruby, Zig, C, Java,
  Elixir, Gleam, OCaml, Nix\n- *Package picker* - pre-curated packages per language,
  toggle on/off with =Space=\n- *nix search integration* - press =s= to open a live
  search screen powered by =nix search nixpkgs=, add results to your devshell\n- *Auto-generates*
  =flake.nix= (with =flake-utils=, =eachDefaultSystem=, =mkShell=) and =.envrc= (=use
  flake=)\n- Backs up existing files to =.bak= before overwriting\n\n* How?\n\n**
  Keys\n| Screen     | Key           | Action                 |\n|------------+---------------+------------------------|\n|
  Language   | =↑= / =↓=     | Navigate               |\n| Language   | =Enter=       |
  Select language        |\n| Language   | =q=           | Quit                   |\n|
  Packages   | =↑= / =↓=     | Navigate               |\n| Packages   | =Space=       |
  Toggle package         |\n| Packages   | =s=           | Open nix search        |\n|
  Packages   | =Enter=       | Continue to output dir |\n| Packages   | =Esc=         |
  Back to lang picker    |\n| nix search | type          | Search nixpkgs live    |\n|
  nix search | =↑= / =↓=     | Navigate results       |\n| nix search | =Enter=       |
  Add / remove result    |\n| nix search | =Tab=         | Skip to output dir     |\n|
  nix search | =Esc=         | Back to packages       |\n| Dir        | type          |
  Edit output path       |\n| Dir        | =Enter=       | *Generate files*       |\n|
  Dir        | =Esc=         | Back to packages       |\n| Done       | =q= / =Enter=
  | Exit                   |\n\n** Nix Run\n#+BEGIN_SRC bash\nnix run github:petalmaya/cutesetup\n#+END_SRC\n\n\n**
  Building from source\n\n*** With nix\n#+BEGIN_SRC bash\nnix build\n#+END_SRC\n\n***
  With cabal (inside nix shell)\n#+BEGIN_SRC bash\nnix develop\ncabal build\n#+END_SRC\n\n***
  \"Install\"\nI don't recommend this but if you want to use profiles go ahead~\n\n#+BEGIN_SRC
  bash\nnix profile install .\n#+END_SRC\n\n* Who's Alice?\nIm Alice silly goose~\n\n*
  License Note\nWhile the generator itself is licensed under the Apache License, all
  templates and configuration files generated by it are dedicated to the public domain
  under the CC0 1.0 Universal license. You may use, modify, and distribute the output
  without any restrictions.\n\nGod this is horribly written for a README, I promise
  you the code is much better :3\n"
