description: "# cube-hs\n\n[![Hackage](https://img.shields.io/hackage/v/cube-hs.svg)](https://hackage.haskell.org/package/cube-hs)\n[![License:
  MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n[![GitHub](https://img.shields.io/badge/github-coshz%2Fcube-blue?logo=github)](https://github.com/coshz/cube/tree/HEAD/bindings/haskell)\n\nA
  performant and type-safe Rubik's Cube manipulation and permutation library for Haskell.\n\n##
  Features\n\n- **Type-Safe Representation**: Strongly typed representations of Cubes,
  Faces, Turns, and Moves.\n- **Algebraic Group Actions**: Pure permutation math leveraging
  `Semigroup`, `Monoid`, and the `ActsOn` typeclass.\n- **Flexible Interactions**:
  Turn individual faces, apply sequence moves, or compose transformations seamlessly.\n\n##
  Installation\n\nAdd `cube-hs` to your project's `.cabal` file dependencies:\n\n```cabal\nbuild-depends:
  base >= 4.14 && < 5, cube-hs\n```\n\nOr install it via `cabal`: \n\n```bash\ncabal
  update\ncabal install cube-hs\n```\n\n## Usage\n\n```haskell \nmodule Main where\n\nimport
  Data.Cube\nimport Data.Maybe (fromMaybe)\n\nmain :: IO ()\nmain = do\n    -- 1.
  Inspect solved cube state\n    let solvedCube = cubeId\n    putStrLn $ \"Solved
  Cube Colors: \" ++ showCube solvedCube\n    -- \"UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB\"\n\n
  \   -- 2. Parse standard turn notations\n    let turnNotation = \"U F U' L2 R L'
  D2 B\"\n    let turns = fromMaybe [] $ parseTurns turnNotation\n    \n    -- 3.
  Scramble the cube by folding turns\n    let scrambledCube = foldl (&>) solvedCube
  turns\n    putStrLn $ \"Scrambled Cube:     \" ++ showCube scrambledCube\n\n    --
  4a. build tables (`False` means without symmetry) under \"cache\" directory \n    cubeInit
  False \"cache\"  \n\n    -- 4b. Solve the scrambled cube & verify solution\n    let
  solution = unsafeSolveFrom scrambledCube\n    let restoredCube = applyTurns scrambledCube
  solution\n\n    if restoredCube == solvedCube\n        then putStrLn $ \"Solution:
  \" ++ showTurns solution ++ \".\"\n        else putStrLn \"Solving failed.\"\n```\n\n"
