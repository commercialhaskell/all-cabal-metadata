changelog: "* Hackage: <http://hackage.haskell.org/package/crackNum>\n* GitHub:  <http://github.com/LeventErkok/crackNum/>\n\n*
  Latest Hackage released version: 4.2, 2026-08-25\n\n### Version 4.2, 2026-08-25\n\n
  \ * Documentation only; no functional changes.\n\n  * Simplified the README's download
  section further. It is now just the three\n    platforms, each linking to the latest
  release. The per-platform notes (static\n    linking, the macOS quarantine flag,
  the Windows SmartScreen prompt) and the\n    unpack/PATH instructions are gone from
  here -- every bundle ships a `README.txt`\n    that covers them for that platform,
  and it is the first thing you see when you\n    unpack.\n\n  * Trimmed the note
  about needing z3 when installing from Hackage.\n\n### Version 4.1, 2026-08-25\n\n
  \ * Documentation only; no functional changes.\n\n  * Substantially shortened the
  README. It had grown to fifteen worked examples,\n    all showing the same output
  fields with different numbers in them, plus a copy\n    of the per-platform install
  commands that already ship inside every release\n    bundle. The examples are down
  to four -- an encode with a non-default rounding\n    mode, a decode, an E8M0 encode,
  and a two-lane decode -- and the install\n    section now points at the `README.txt`
  in the bundle rather than repeating it,\n    so those steps have a single home and
  cannot drift.\n\n  * The \"Supported formats\" section is now just the flag table.
  The per-format\n    prose that followed it -- the FP4 (E0M3) and E8M0 explanations,
  the integer\n    flavors, the TF32 bit-count note -- is gone; the first three were
  already\n    stated in the `--help` output reproduced further down.\n\n  * Downloading
  a prebuilt binary is now the first thing the README talks about,\n    under its
  own heading, instead of being a sub-section whose point was hidden in\n    a parenthetical.
  Building from Hackage is presented as the alternative, and\n    each platform bullet
  links to the latest release.\n\n  * Replaced the README's markdown tables with lists.
  Hackage renders the README\n    outside the `#description` pane, and its stylesheet
  only borders tables inside\n    that pane, so a table there comes out unstyled and
  the columns run together.\n\n  * Dropped the per-platform GUI build instructions
  from the README; each GUI's\n    own directory documents itself. `GUI/winGUI/README.md`
  is new; `GUI/swiftGUI/`\n    and `GUI/tclGUI/` already had one. The note about needing
  `wish` on Linux went\n    with it -- when `wish` is missing, the binary already
  prints the `apt`/`dnf`/`nix`\n    command to install it.\n\n  * Reworded the cabal
  Description's pointer to the releases page: it now leads\n    with not needing a
  Haskell toolchain, rather than with the word \"releases\".\n\n### Version 4.0, 2026-08-24\n\n
  \ * The Windows GUI now carries the CrackNum icon instead of the stock WinForms\n
  \   one. The artwork is rendered by the same generator that produces the macOS\n
  \   AppIcon.icns, so the two platforms cannot drift apart.\n\n  * Note on numbering:
  3.32 was tagged and published as a GitHub release, but never\n    uploaded to Hackage.
  So for anyone installing from Hackage, this is the first\n    version to support
  Windows -- see the 3.32 entry below for what that involves.\n\n### Version 3.32,
  2026-08-24\n\n  * Windows is now a supported platform, with a prebuilt bundle\n
  \   (`crackNum-<version>-windows-x86_64.zip`) alongside the Mac and Linux ones.
  It\n    carries the CLI, a native GUI, and a copy of z3, and needs nothing installed:\n
  \   the GUI targets .NET Framework 4.8, which ships with Windows 10 and 11, and
  z3\n    brings its own Microsoft C runtime. The binaries are not code-signed, so\n
  \   SmartScreen warns on first run; the bundled README says how to get past it.\n\n
  \ * The Windows GUI (`GUI/winGUI/`) is a native WinForms application rather than
  a\n    port of the Tcl/Tk script that serves Linux. Reusing the Tcl would have been
  a\n    far smaller change, but it would have required users to install a Tcl\n    distribution
  before `--gui` did anything, and a GUI behind a prerequisite that\n    most people
  will not clear is worth less than the code it saves.\n\n  * `--version` and the
  usage text no longer print the executable's `.exe`\n    extension on Windows, where
  `getProgName` keeps it.\n\n  * The golden test suite writes its temporary files
  with newline translation\n    turned off, so the golds stay LF everywhere. Previously,
  running the suite on\n    Windows compared CRLF output against LF golds, and `--accept`
  there would have\n    rewritten every gold in the process.\n\n### Version 3.31,
  2026-08-22\n\n  * The Hackage description now shows a screenshot of the GUI, and
  points at the\n    releases page for the prebuilt Mac and Linux bundles. The screenshot
  was dropped\n    from README.md in the same breath: Hackage renders the README below
  the description,\n    so keeping it in both would have shown the same image twice
  on one page.\n\n  * The READMEs shipped inside the binary bundles now walk through
  a single install\n    sequence -- unpack, place the files, set PATH, check -- instead
  of splitting the CLI\n    and the GUI into separately numbered steps that had to
  cross-reference each other.\n    The macOS one leads with the quarantine removal,
  since nothing runs before that.\n\n### Version 3.30, 2026-08-21\n\n  * The GUIs
  now group the floating-point formats by provenance instead of listing all\n    twelve
  of them in one flat \"Float\" section. The formats that exist because of machine\n
  \   learning -- FP4 (E2M1), FP4 (E0M3), FP8 (E4M3), FP8 (E5M2), FP8 (E8M0), Brain,
  and\n    TF32 -- come first under \"AI formats\", followed by the IEEE-754 ones
  (Half, Single,\n    Double, Quad, and Custom) under \"IEEE-754\". Integers now precede
  words, so the\n    sidebar reads AI formats, IEEE-754, Integer (Signed), Word (Unsigned).
  Both the\n    macOS (Swift) and the Tcl/Tk GUI are grouped identically. No format
  was added,\n    removed, or renamed, and the command line is unaffected.\n\n  *
  The \"Custom parameters\" box in the GUIs is now titled \"Custom IEEE-754 float:\",
  and\n    its heading lines up flush left with \"Rounding mode\" above it rather
  than being\n    indented past it. The \"(exponent width applies to custom floats)\"
  note is gone, the\n    new title having made it redundant. Note that the \"Total
  width\" field also applies\n    to the Custom entries under Integer (Signed) and
  Word (Unsigned), which take a width\n    but no exponent.\n\n  * The format list
  in the Tcl/Tk GUI now has a vertical scrollbar. With four sections\n    it is taller
  than the sidebar at the default window size, and without a scrollbar the\n    formats
  past the bottom were not merely off-screen but unreachable. (The macOS GUI\n    needed
  no equivalent change; its list already scrolled.)\n\n  * Scrollbars in the Tcl/Tk
  GUI now appear only when there is something to scroll to,\n    rather than always
  taking up room. This covers the output pane's pair as well as the\n    new one on
  the format list.\n\n  * Internally, `Main.hs` has been split into per-topic modules
  -- `CrackNum.Types`,\n    `.Formats`, `.Options`, `.Utils`, `.Output`, `.GUI`, `.Decode`,
  and `.Encode` --\n    leaving `Main` with just the argument dispatch. It had grown
  to some 1400 lines\n    holding everything from option parsing to the hand-rolled
  layouts for the formats\n    that have no IEEE look-alike. This is purely a reorganization:
  every definition\n    moved verbatim, so there is no change in behavior or output.\n\n###
  Version 3.29, 2026-08-21\n\n  * `crackNum.vim`'s TAB completion no longer offers
  a hardcoded set of `-lN` lane\n    counts, since `-lN` is never valid on its own
  and always needs pairing with a\n    `-f`/`-i`/`-w` flag; type it directly instead.
  `-i`/`-w` completion now offers\n    the bare flag and prompts for the bit-width
  separately, rather than baking in a\n    fixed set of widths -- crackNum accepts
  any `-iN`/`-wN`, so there was never a\n    complete list to offer.\n\n### Version
  3.28, 2026-08-21\n\n  * Add support for the E8M0 format, via `-fe8m0`. This is the
  shared scale of the OCP\n    Microscaling (MX) formats: the value that scales a
  block of MXFP8/MXFP6/MXFP4\n    elements, all of which crackNum already knew about.
  It is the mirror image of\n    FP4 (E0M3): where that format is all significand
  and no exponent, E8M0 is all\n    exponent and no significand, with no sign bit
  either. Every value it holds is\n    therefore a power of two, from 2^-127 to 2^127.\n\n
  \   Note that it has no zero and no subnormals -- with nothing for the all-zero\n
  \   encoding to mean, it simply denotes 2^-127 -- and no infinities. `0xFF` is its\n
  \   one and only NaN. Negative inputs are rejected rather than saturated: with no\n
  \   sign bit there is no direction to saturate towards, and clamping would quietly\n
  \   turn a negative into a positive. Values outside the range, infinity included,\n
  \   saturate to the nearest end-point, and anything that is not a power of two\n
  \   rounds according to `-r`.\n\n### Version 3.27, 2026-08-20\n\n  * There is now
  a Linux binary distribution, alongside the macOS one: see the\n    Releases page.
  It ships the `crackNum` executable, a copy of `z3` (which crackNum\n    shells out
  to for every operation), the Tcl/Tk GUI script, and a README. Both\n    binaries
  are statically linked, so there is no libc or distribution requirement:\n    they
  run as-is on any x86_64 Linux, old or new. The GUI additionally needs `wish`,\n
  \   which does have to come from your system.\n\n  * `--gui` now also looks for
  `crackNum.tcl` next to the crackNum executable itself,\n    after `$CRACKNUM_TCL`
  and the PATH but before the cabal data-directory. A binary\n    distribution carries
  the script alongside the binary, where the data-directory\n    baked in at build
  time names a path from the build machine that does not exist\n    on the user's;
  the GUI now works in such a bundle however it is unpacked or\n    copied, rather
  than only when the script was also placed on the PATH.\n\n### Version 3.26, 2026-08-19\n\n
  \ * New flag `--list-formats`, which prints the floating-point formats `-f` accepts,\n
  \   one name per line. It is meant for editor integrations, which would otherwise
  have\n    to hardcode the list and let it go stale; the VIM plugin now asks rather
  than\n    guesses, and picks up any format added later for free.\n\n  * `--help`
  now also lists the supported floating-point formats. Both it and the\n    `-f` error
  message are generated from a single table, so they cannot disagree.\n\n  * Fix the
  VIM integration, which had been broken since version 3.0. The plugin\n    offered
  `i`, `w`, and `f` as the choices at its precision prompt, and passed\n    whichever
  you picked through as-is, so `:CrackNum` ran `crackNum i 0b0110`:\n    no leading
  dash, and no bit-width. Every invocation was rejected, and the\n    quickfix window
  filled up with crackNum's usage text instead of an answer.\n    The completion list
  now offers real flags (`-i8`, `-fhp`, ...), and anything\n    else crackNum accepts,
  such as `-f3+4` or `-l4 -fhp`, can be typed in directly.\n\n  * The VIM plugin also
  set `grepformat` to `VIM %m`, matching a `--vim` output\n    mode that was removed
  in 3.0. Nothing matched that format, so even a correct\n    invocation produced
  an empty quickfix window. Take crackNum's output as-is now.\n\n  * The VIM plugin
  now finds the bit-pattern under the cursor itself, instead of\n    relying on `<cword>`.
  Verilog notation stops at the quote (`64'hdeadbeef` came\n    out as just `64`),
  and the value is quoted before it reaches the shell.\n\n### Version 3.25, 2026-08-18\n\n
  \ * Add support for the FP4 (E0M3) format, via `-ffp4e0m3`. Unlike every other\n
  \   format crackNum knows about, this one has no exponent bits at all, which makes\n
  \   it a plain 4-bit sign-magnitude integer: a sign bit and a 3-bit magnitude,\n
  \   covering -7 to 7, with both a positive and a negative zero. It has neither NaN\n
  \   nor Inf, so those inputs are rejected; values outside [-7, 7] saturate to the\n
  \   nearest end-point, and fractional inputs round according to `-r`.\n\n  * Report
  the format the user actually asked for when decoding E4M3 and FP4.\n    Both are
  modeled by an IEEE look-alike, and the patterns that need no special\n    handling
  were printed straight from it, so `crackNum -ffp4 0b0100` answered\n    `2.0 ::
  FloatingPoint 2 2` and `crackNum -fe4m3 0b00111000` answered\n    `1.0 :: FloatingPoint
  4 4`. The values were right, only the type name leaked.\n    The patterns that do
  deviate, and E5M2 throughout, were already correct.\n\n### Version 3.24, 2026-08-17\n\n
  \ * Add a quad-precision example to the help output. `-fqp` has always been\n    accepted,
  but `--help` never mentioned it, so the only way to find out it\n    existed was
  to trip over the error message for a bad `-f` argument.\n\n  * Bring the README
  up to date: document the installation steps (including the\n    z3 requirement),
  add a table of all supported formats, list the rounding\n    modes, and add worked
  examples for the FP8, FP4, TF32, and unsigned-word\n    formats. A couple of the
  existing sample outputs had drifted from what the\n    tool actually prints, and
  are now regenerated.\n\n### Version 3.23, 2026-08-17\n\n  * Do not ignore bad flags
  when `--gui` is given. A mistyped format, such as\n    `crackNum -ft32 4 --gui`,
  used to bring the GUI up with nothing selected,\n    silently swallowing the error
  the command line would have reported. We now\n    diagnose the flag first, and only
  launch the GUI if everything checks out.\n\n  * Add quad-precision (`-fqp`) to the
  format list in both GUIs. It was accepted\n    on the command line, but was missing
  from the interfaces.\n\n### Version 3.22, 2026-08-17\n\n  * Fix text alignment in
  the Tcl/Tk GUI's entry fields. We asked for the `Courier`\n    font, which on X11
  is an alias that typically resolves to Nimbus Mono PS. Its\n    ascent/descent split
  is lopsided (9/6 at size 11), and since an entry centers\n    text on the linespace,
  the glyphs ended up hugging the top of the box with a\n    large gap underneath.
  We now pick the first monospaced family that is actually\n    installed, preferring
  ones with sane metrics.\n\n### Version 3.21, 2026-08-16\n\n  * Add support for TF32
  (TensorFloat-32), via `-ftf32`. This is the 19-bit format\n    with 8 exponent and
  10 significand bits, i.e., the exponent range of single\n    precision with the
  significand of half precision. Note that we crack the 19\n    architectural bits;
  hardware typically carries these in a 32-bit container\n    with the remaining bits
  unused.\n\n### Version 3.20, 2026-08-13\n\n  * Fix tool lookup in both GUIs: a *directory*
  named `crackNum` (or `z3`) sitting\n    on the PATH was accepted as the executable,
  since directories carry the search\n    bit and so look executable. The GUI would
  then fail with a \"permission denied\"\n    on that directory. We now require a
  regular file.\n\n### Version 3.19, 2026-08-13\n\n  * Fix decoding in the Tcl/Tk
  GUI: hex and binary input was silently converted\n    to decimal before being handed
  to `crackNum`, so entering `0xdeadbeef` encoded\n    the value 3735928559 instead
  of decoding the bit-pattern. Verilog (`N'h`) input\n    was unaffected.\n\n  * Drop
  the lane count from both GUIs. The number of lanes is inferred from\n    Verilog
  (`N'h`) input, and everything else is a single lane, so there was\n    nothing useful
  for the interface to set.\n\n### Version 3.18, 2026-08-13\n\n  * Add a Tcl/Tk GUI
  (`GUI/tclGUI/crackNum.tcl`) that works on Linux and macOS.\n    When `--gui` is
  used on Linux, `crackNum` now launches this interface\n    (requires `wish`) instead
  of erroring out.\n\n  * The Tcl/Tk GUI script is now a cabal data-file, so it is
  installed along\n    with the binary: `cabal install crackNum` is enough for `crackNum
  --gui` to\n    work on Linux, with no PATH setup. To run a different copy of the
  script,\n    set `CRACKNUM_TCL`, or put it on your PATH as `crackNum.tcl`.\n\n  *
  Both front-ends now live under `GUI/`: the macOS app moved from `gui/` to\n    `GUI/swiftGUI/`,
  and the Tcl/Tk script to `GUI/tclGUI/`.\n\n  * Encoding a NaN now always displays
  the canonical quiet-NaN pattern (sign 0,\n    all-ones exponent, leading significand
  bit set; `0x7FC00000` for a single).\n    SMTLib's floating-point sort has a single
  NaN value, so the solver returns an\n    abstract NaN and the concrete bit-pattern
  shown was whatever the model\n    materialized -- which could differ between solver/library
  versions. The\n    E4M3 path already pinned its NaN this way; the rest now do too.\n\n
  \ * Exponent/significand sizes of 1 bit are accepted by `-f`, but the solver\n    requires
  at least 2 of each. This now produces a regular error message\n    instead of an
  uncaught exception with a backtrace.\n\n### Version 3.17, 2026-08-10\n\n  * Add
  support for the FP4 (E2M1) format, via `-ffp4`. Like E4M3, this format\n    deviates
  from IEEE-754: The all-ones exponent encodes the values 4 and 6,\n    instead of
  infinity and NaN. Consequently, FP4 can represent neither NaN nor\n    infinity,
  and finite values outside of [-6, 6] saturate to the end-points.\n\n### Version
  3.16, 2026-07-24\n\n  * Add the `--gui` option, launching a graphical interface
  (macOS) for\n    interactively encoding/decoding values.\n\n### Version 3.15, 2024-11-09\n\n
  \ * Bump up SBV dependence to >= 11.0\n\n### Version 3.14, 2024-09-23\n\n  * Fix
  README\n\n### Version 3.13, 2024-09-23\n\n  * Fix help text\n\n### Version 3.12,
  2024-04-05\n\n  * Fix hexadecimal float parsing for e4m3\n\n### Version 3.11, 2024-04-05\n\n
  \ * Allow for encoding of hexadecimal floats\n\n### Version 3.10, 2024-03-01\n  \n
  \ * More relaxed parsing for verilog input format\n\n### Version 3.9, 2024-02-23\n
  \ \n  * Fix verilog input format parsing\n\n### Version 3.8, 2024-02-21\n\n  * Add
  support for FP8 formats, as decribed in: https://arxiv.org/pdf/2209.05433.pdf\n
  \     - E5M2: Which is essentially a synonym for f5+3\n      - E4M3: Similar to
  f4+4, except it does not have infinities and interprets NaN values differently\n\n
  \ * Fix a bug in cracking of arbitrary-sized floats, that yielded wrong values for
  some NaN cases\n\n### Version 3.7, 2024-02-15\n\n  * Support signaling/quiet indication
  for decoded NaN values.\n\n  * Add support for decoding over multiple lanes. See
  the -l option.\n\n  * Add support for verilog bit-vector notation, e.g., 128'hXXX.
  If\n    you use this notation, crackNum will automatically infer the\n    number
  of lanes to crack based on the width given; unless\n    explicitly specified.\n\n###
  Version 3.6, 2024-01-24\n\n  * Be more clear when the provided input isn't a recognizable
  float,\n    instead of treating it as NaN implicitly. Thanks to Dmitry Blotsky for\n
  \   pointing out the confusion.\n\n### Version 3.5, 2024-01-11\n\n  * Resolve compilation
  issues with GHC 9.8 series\n\n### Version 3.4, 2023-04-14\n\n  * Fix compilation
  in previous build\n\n### Version 3.3, 2023-04-14\n\n  * Allow compilation with newer
  versions of SBV\n\n### Version 3.2, 2021-06-30\n\n  * Add an explicit note when
  conversion is exact.\n\n### Version 3.1, 2021-03-29\n  \n  * Fix readme\n\n### Version
  3.0, 2021-03-29\n\n  * A complete rewrite, much simplified, and supporting\n    arbitrary
  precision floats. Some of the old features\n    and the library are dropped; so
  if you rely on the library\n    nature of CrackNum, do not upgrade. For other users
  who\n    merely use crackNum as an executable, the new version is\n    strongly
  recommended.\n\n### Version 2.4, 2020-09-05\n\n  * Changes required to compile cleanly
  with GHC 8.10.2\n\n### Version 2.3, 2018-11-17\n\n  * Remove dependency on the ieee754
  and reinterpret-cast packages. The goal is\n    to remove any FFI dependencies.
  We now define and export the required\n    utilities directly in the CrackNum package.\n\n###
  Version 2.2, 2018-09-01\n\n  * Instead of data-binary-ieee754, use reinterpret-cast
  package. According\n    to documents, the former is deprecated.\n\n### Version 2.1,
  2018-07-20\n\n  * Support for vi-editor bindings. See the file \"crackNum.vim\"
  in the\n    distribution or in the github repo You can put \"so ~/.vim/crackNum.vim\"\n
  \   (use the correct path!) and have vi crack numbers directly from inside\n    your
  editor. Simply locate your cursor on a binary/hex stream of digits\n    and type
  \":CrackNum\".  See the \"crackNum.vim\" file for binding details.\n\n### Version
  2.0, 2018-03-17\n\n  * Import FloatingHex qualified to avoid GHC 8.4.1 compilation
  issue\n\n### Version 1.9, 2017-01-22\n\n  * Minor fix to printing of +/-0\n\n###
  Version 1.8, 2017-01-15\n\n  * Bump up FloatingHex dependency to >0.4, this enables\n
  \   proper support for large doubles\n\n### Version 1.7, 2017-01-14\n\n  * Fix a
  snafu in reading hexadecimal floats\n\n### Version 1.6, 2017-01-14\n\n  * Add support
  for hexadecimal-floats. These now\n    work both in toIEEE option as input, and
  also\n    when printing the values out. (i.e., numbers\n    of the form 0x1.abp-3,
  etc.)\n\n### Version 1.5, 2016-01-23\n\n  * Typo fixes; no functionality changes\n\n###
  Version 1.4, 2016-01-17\n\n  * Fix NaN nomenclature: Screaming->Signaling\n  * Add
  an example to README.md\n\n### Version 1.3, 2015-04-11\n  \n  * Fix docs, github
  location\n\n### Version 1.2, 2015-04-11\n\n  * Fix the constant qnan values for
  SP/DP\n  * Add conversions from float/double. Much easier to use.\n  * Better handling
  of nan values.\n\n### Version 1.1, 2015-04-02\n  \n  * Clean-up the API, examples
  etc.\n\n### Version 1.0, 2015-04-01\n\n  * First implementation. Supports HP/SP/DP\n
  \   and signed/unsigned numbers in 8/16/32/64 bits.\n"
changelog-type: markdown
description: |
  ## Decode/Encode Integers, Words, and IEEE754 and other float formats

  `crackNum` shows you exactly how a number is laid out in memory: the bit
  pattern, its fields, the classification, and the value in binary, octal,
  decimal, and hex. It works in both directions:

    - **Encoding**: give it a value (`2.5`, `-2.3e6`, `NaN`, `0x3.2p5`), and it shows
      the bit-pattern it turns into, together with the rounding that took place.
    - **Decoding**: give it a bit-pattern (`0xdeadbeef`, `0b0110`, `32'hfdc71fc6`),
      and it shows the value it stands for.

  ### Download crackNum

  Ready-to-run bundles — nothing to build, no Haskell toolchain:

    - [**Linux** (x86_64)](https://github.com/LeventErkok/crackNum/releases/latest)
    - [**macOS** (Apple Silicon)](https://github.com/LeventErkok/crackNum/releases/latest)
    - [**Windows** (x86_64)](https://github.com/LeventErkok/crackNum/releases/latest)

  ### Building from source

  crackNum is on [Hackage](http://hackage.haskell.org/package/crackNum):

  ```
  $ cabal install crackNum
  ```

  Note that you also need [z3](https://github.com/Z3Prover/z3) on your `PATH`.

  ### Supported formats

  ```
  Flag        Format                               Exponent   Significand
  -----------------------------------------------------------------------
  -fhp        Half precision (IEEE-754 binary16)          5            11
  -fbp        Brain float (bfloat16)                      8             8
  -ftf32      TensorFloat-32                              8            11
  -fsp        Single precision (binary32)                 8            24
  -fdp        Double precision (binary64)                11            53
  -fqp        Quad precision (binary128)                 15           113
  -fe5m2      FP8, IEEE-754 style                         5             3
  -fe4m3      FP8, alternate (no infinities)              4             4
  -ffp4       FP4 (E2M1)                                  2             2
  -ffp4e0m3   FP4 (E0M3), sign-magnitude                  0             3
  -fe8m0      E8M0 (MX scale), exponent-only              8             0
  -fa+b       Arbitrary IEEE-754 float                    a             b
  ```

  Significand sizes include the implicit bit.

  Rounding mode is selected with `-r`, and defaults to `RNE` if not given:
  `RNE` (nearest, ties to even), `RNA` (nearest, ties away), `RTP` (towards
  positive infinity), `RTN` (towards negative infinity), and `RTZ` (towards zero).

  ### Example: Encode a single-precision float, rounding towards zero
  ```
  $ crackNum -fsp 1.3 -rRTZ
  Satisfiable. Model:
    ENCODED = 1.3 :: Float
                    3  2          1         0
                    1 09876543 21098765432109876543210
                    S ---E8--- ----------S23----------
     Binary layout: 0 01111111 01001100110011001100110
        Hex layout: 3FA6 6666
         Precision: Single
              Sign: Positive
          Exponent: 0 (Stored: 127, Bias: 127)
    Classification: FP_NORMAL
            Binary: 0b1.0100110011001100110011
             Octal: 0o1.23146314
           Decimal: 1.3
               Hex: 0x1.4ccccc
     Rounding mode: RTZ: Round towards zero.
              Note: Conversion from "1.3" was not faithful. Status: Inexact.
  ```

  ### Example: Decode a single-precision bit-pattern
  ```
  $ crackNum -fsp  0xfc00 abc1
  Satisfiable. Model:
    DECODED = -2.6723903e36 :: Float
                    3  2          1         0
                    1 09876543 21098765432109876543210
                    S ---E8--- ----------S23----------
     Binary layout: 1 11111000 00000001010101111000001
        Hex layout: FC00 ABC1
         Precision: Single
              Sign: Negative
          Exponent: 121 (Stored: 248, Bias: 127)
    Classification: FP_NORMAL
            Binary: -0b1.00000001010101111000001p+121
             Octal: -0o2.00527404p+120
           Decimal: -2.6723903e36
               Hex: -0x2.02af04p+120
  ```

  ### Example: Encode an E8M0 MX scale
  Only powers of two are representable, so everything else rounds according to `-r`:
  ```
  $ crackNum -fe8m0 -- 10
  Satisfiable. Model:
    ENCODED = 8.0 :: E8M0
                    76543210
                    ---E8---
     Binary layout: 10000010
        Hex layout: 82
         Precision: 8 exponent bits, no significand
              Sign: Positive (always)
          Exponent: 3 (Stored: 130, Bias: 127)
    Classification: FP_NORMAL
            Binary: 0b1p+3
             Octal: 0o1p+3
           Decimal: 8.0
               Hex: 0x8
     Rounding mode: RNE: Round nearest ties to even.
              Note: Original value of 10.0 was rounded to 8.0.
  ```

  ### Example: Decode two half-precision lanes
  ```
  $ crackNum -l2 -fhp 32\'hfdc71fc6
  == Lane 1 ============================================================
  Satisfiable. Model:
    DECODED = NaN :: FloatingPoint 5 11
                    1       0
                    5 43210 9876543210
                    S -E5-- ---S10----
     Binary layout: 1 11111 0111000111
        Hex layout: FDC7
         Precision: Half (5 exponent bits, 10 significand bits.)
              Sign: Negative
          Exponent: 16 (Stored: 31, Bias: 15)
    Classification: FP_NAN (Signaling)
             Value: NaN
              Note: Representation for NaN's is not unique
  == Lane 0 ============================================================
  Satisfiable. Model:
    DECODED = 0.0075912476 :: FloatingPoint 5 11
                    1       0
                    5 43210 9876543210
                    S -E5-- ---S10----
     Binary layout: 0 00111 1111000110
        Hex layout: 1FC6
         Precision: Half (5 exponent bits, 10 significand bits.)
              Sign: Positive
          Exponent: -8 (Stored: 7, Bias: 15)
    Classification: FP_NORMAL
            Binary: 0b1.111100011p-8
             Octal: 0o3.706p-9
           Decimal: 0.0075912476
               Hex: 0x1.f18p-8
  ```

  With verilog notation (`N'h...`) the lane count is inferred from the width, so
  `-l` is optional.

  ### Graphical interface

  An optional GUI: pick a format on the left, type a value, see the result. It is a
  thin front-end over the `crackNum` binary, so it supports exactly the same formats.

  ![The crackNum GUI](https://raw.githubusercontent.com/LeventErkok/crackNum/master/crackNumGUI.png)

  Launch it with `--gui`, which forwards any flags and value to the app:

  ```
  $ crackNum --gui                 -- open the graphical interface
  $ crackNum --gui -fsp 2.5        -- open it with single-precision selected, and 2.5 cracked
  $ crackNum --gui 0xdeadbeef      -- open it pre-filled with a value to decode
  ```

  ### Usage info
  ```
  Usage: crackNum value OR binary/hex-pattern
    -i N                      Signed   integer of N-bits
    -w N                      Unsigned integer of N-bits
    -f fp                     Floating point format fp
    -r rm                     Rounding mode to use. If not given, Nearest-ties-to-Even.
    -l lanes                  Number of lanes to decode
    -h, -?    --help          print help, with examples
    -v        --version       print version info
    -d        --debug         debug mode, developers only
              --gui           launch the graphical interface
              --list-formats  list the formats supported by -f, one per line

  Supported floating-point formats (for use with -f):

         hp: Half float             ( 5 +  11)
         bp: Brain float            ( 8 +   8)
       tf32: TensorFloat-32         ( 8 +  11)
         sp: Single precision       ( 8 +  24)
         dp: Double precision       (11 +  53)
         qp: Quad   precision       (15 + 113)
        a+b: Arbitrary IEEE-754     ( a +   b)
       e5m2: FP8 format (IEEE-754)  ( 5 +   3)
       e4m3: FP8 format (Alternate) ( 4 +   4)
        fp4: FP4 format (E2M1)      ( 2 +   2)
    fp4e0m3: FP4 format (E0M3)      ( 0 +   3)
       e8m0: FP8 format (MX scale)  ( 8 +   0)

  Examples:
   Encoding:
     crackNum -i4       -- -2                   -- encode as 4-bit signed integer
     crackNum -w4       2                       -- encode as 4-bit unsigned integer
     crackNum -f3+4     2.5                     -- encode as float with 3 bits exponent, 4 bits significand
     crackNum -f3+4     2.5 -rRTZ               -- encode as above, but use RTZ rounding mode.
     crackNum -fbp      2.5                     -- encode as a brain-precision float
     crackNum -ftf32    2.5                     -- encode as a TensorFloat-32 float
     crackNum -fdp      2.5                     -- encode as a double-precision float
     crackNum -fqp      2.5                     -- encode as a quad-precision float
     crackNum -fe4m3    2.5                     -- encode as an E4M3 FP8 float
     crackNum -fe5m2    2.5                     -- encode as an E5M2 FP8 float
     crackNum -ffp4     2.5                     -- encode as an FP4 (E2M1) float
     crackNum -ffp4e0m3 3.5                     -- encode as an FP4 (E0M3) sign-magnitude integer
     crackNum -fe8m0    2.5                     -- encode as an E8M0 MX scale (power of two)
     crackNum -fsp      0x3.2p5                 -- encode as single-precision from hex-float

   Decoding:
     crackNum -i4       0b0110                  -- decode as 4-bit signed integer, from binary
     crackNum -w4       0xE                     -- decode as 4-bit unsigned integer, from hex
     crackNum -f3+4     0b0111001               -- decode as float with 3 bits exponent, 4 bits significand
     crackNum -fbp      0x000F                  -- decode as a brain-precision float
     crackNum -ftf32    19\'h0000F              -- decode as a TensorFloat-32 float
     crackNum -fdp      0x8000000000000000      -- decode as a double-precision float
     crackNum -fhp      0x8000                  -- decode as a half-precision float
     crackNum -ffp4     0b0111                  -- decode as an FP4 (E2M1) float
     crackNum -ffp4e0m3 0b1101                  -- decode as an FP4 (E0M3) sign-magnitude integer
     crackNum -fe8m0    0x7F                    -- decode as an E8M0 MX scale (power of two)
     crackNum -l4 -fhp  64\'hbdffaaffdc71fc60   -- decode as half-precision float over 4 lanes using verilog notation

   GUI:
     crackNum --gui                             -- launch the graphical interface
     crackNum --gui      0xdeadbeef             -- launch the GUI, pre-filled with the given value
     crackNum --gui -fsp 0xdeadbeef             -- launch the GUI, using the given format

   Notes:
     - For encoding:
         - Use -- to separate your argument if it's a negative number.
         - For floats: You can pass in NaN, Inf, -0, -Inf etc as the argument
                       along with a decimal (2.3, -4.1e5) or hexadecimal float (0x2.4p3)
         - FP4 (E2M1) has neither NaN nor Inf, so those inputs are rejected. Finite
           values outside its range of [-6, 6] saturate to the nearest end-point.
         - FP4 (E0M3) is a sign-magnitude integer: a sign bit and a 3-bit magnitude,
           covering -7 to 7, with both a positive and a negative zero. It has no NaN
           and no Inf either, and values outside [-7, 7] saturate to the end-point.
         - E8M0 (MX scale) is all exponent: no sign bit and no significand at all,
           so every value is a power of two, from 2^-127 to 2^127. It has no zero
           and no Inf, and 0xFF is its only NaN. Negative inputs are rejected;
           values outside the range saturate to the nearest end-point.
     - For decoding:
         - Use hexadecimal (0x) binary (0b), or N'h (verilog) notation as input.
           Input must have one of these prefixes.
         - You can use _,- or space as a digit to improve readability for the pattern to be decoded
         - With -lN parameter, you can decode multiple lanes of data.
         - If you use verilog input format, then we will infer the number of lanes unless you provide it.
  ```

  VIM users: [crackNum.vim](http://github.com/LeventErkok/crackNum/blob/master/crackNum.vim)
  cracks the text under the cursor with `:CrackNum options`.
