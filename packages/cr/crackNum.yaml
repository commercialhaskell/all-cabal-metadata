changelog: "* Hackage: <http://hackage.haskell.org/package/crackNum>\n* GitHub:  <http://github.com/LeventErkok/crackNum/>\n\n*
  Latest Hackage released version: 3.20, 2026-08-13\n\n### Version 3.20, 2026-08-13\n\n
  \ * Fix tool lookup in both GUIs: a *directory* named `crackNum` (or `z3`) sitting\n
  \   on the PATH was accepted as the executable, since directories carry the search\n
  \   bit and so look executable. The GUI would then fail with a \"permission denied\"\n
  \   on that directory. We now require a regular file.\n\n### Version 3.19, 2026-08-13\n\n
  \ * Fix decoding in the Tcl/Tk GUI: hex and binary input was silently converted\n
  \   to decimal before being handed to `crackNum`, so entering `0xdeadbeef` encoded\n
  \   the value 3735928559 instead of decoding the bit-pattern. Verilog (`N'h`) input\n
  \   was unaffected.\n\n  * Drop the lane count from both GUIs. The number of lanes
  is inferred from\n    Verilog (`N'h`) input, and everything else is a single lane,
  so there was\n    nothing useful for the interface to set.\n\n### Version 3.18,
  2026-08-13\n\n  * Add a Tcl/Tk GUI (`GUI/tclGUI/crackNum.tcl`) that works on Linux
  and macOS.\n    When `--gui` is used on Linux, `crackNum` now launches this interface\n
  \   (requires `wish`) instead of erroring out.\n\n  * The Tcl/Tk GUI script is now
  a cabal data-file, so it is installed along\n    with the binary: `cabal install
  crackNum` is enough for `crackNum --gui` to\n    work on Linux, with no PATH setup.
  To run a different copy of the script,\n    set `CRACKNUM_TCL`, or put it on your
  PATH as `crackNum.tcl`.\n\n  * Both front-ends now live under `GUI/`: the macOS
  app moved from `gui/` to\n    `GUI/swiftGUI/`, and the Tcl/Tk script to `GUI/tclGUI/`.\n\n
  \ * Encoding a NaN now always displays the canonical quiet-NaN pattern (sign 0,\n
  \   all-ones exponent, leading significand bit set; `0x7FC00000` for a single).\n
  \   SMTLib's floating-point sort has a single NaN value, so the solver returns an\n
  \   abstract NaN and the concrete bit-pattern shown was whatever the model\n    materialized
  -- which could differ between solver/library versions. The\n    E4M3 path already
  pinned its NaN this way; the rest now do too.\n\n  * Exponent/significand sizes
  of 1 bit are accepted by `-f`, but the solver\n    requires at least 2 of each.
  This now produces a regular error message\n    instead of an uncaught exception
  with a backtrace.\n\n### Version 3.17, 2026-08-10\n\n  * Add support for the FP4
  (E2M1) format, via `-ffp4`. Like E4M3, this format\n    deviates from IEEE-754:
  The all-ones exponent encodes the values 4 and 6,\n    instead of infinity and NaN.
  Consequently, FP4 can represent neither NaN nor\n    infinity, and finite values
  outside of [-6, 6] saturate to the end-points.\n\n### Version 3.16, 2026-07-24\n\n
  \ * Add the `--gui` option, launching a graphical interface (macOS) for\n    interactively
  encoding/decoding values.\n\n### Version 3.15, 2024-11-09\n\n  * Bump up SBV dependence
  to >= 11.0\n\n### Version 3.14, 2024-09-23\n\n  * Fix README\n\n### Version 3.13,
  2024-09-23\n\n  * Fix help text\n\n### Version 3.12, 2024-04-05\n\n  * Fix hexadecimal
  float parsing for e4m3\n\n### Version 3.11, 2024-04-05\n\n  * Allow for encoding
  of hexadecimal floats\n\n### Version 3.10, 2024-03-01\n  \n  * More relaxed parsing
  for verilog input format\n\n### Version 3.9, 2024-02-23\n  \n  * Fix verilog input
  format parsing\n\n### Version 3.8, 2024-02-21\n\n  * Add support for FP8 formats,
  as decribed in: https://arxiv.org/pdf/2209.05433.pdf\n      - E5M2: Which is essentially
  a synonym for f5+3\n      - E4M3: Similar to f4+4, except it does not have infinities
  and interprets NaN values differently\n\n  * Fix a bug in cracking of arbitrary-sized
  floats, that yielded wrong values for some NaN cases\n\n### Version 3.7, 2024-02-15\n\n
  \ * Support signaling/quiet indication for decoded NaN values.\n\n  * Add support
  for decoding over multiple lanes. See the -l option.\n\n  * Add support for verilog
  bit-vector notation, e.g., 128'hXXX. If\n    you use this notation, crackNum will
  automatically infer the\n    number of lanes to crack based on the width given;
  unless\n    explicitly specified.\n\n### Version 3.6, 2024-01-24\n\n  * Be more
  clear when the provided input isn't a recognizable float,\n    instead of treating
  it as NaN implicitly. Thanks to Dmitry Blotsky for\n    pointing out the confusion.\n\n###
  Version 3.5, 2024-01-11\n\n  * Resolve compilation issues with GHC 9.8 series\n\n###
  Version 3.4, 2023-04-14\n\n  * Fix compilation in previous build\n\n### Version
  3.3, 2023-04-14\n\n  * Allow compilation with newer versions of SBV\n\n### Version
  3.2, 2021-06-30\n\n  * Add an explicit note when conversion is exact.\n\n### Version
  3.1, 2021-03-29\n  \n  * Fix readme\n\n### Version 3.0, 2021-03-29\n\n  * A complete
  rewrite, much simplified, and supporting\n    arbitrary precision floats. Some of
  the old features\n    and the library are dropped; so if you rely on the library\n
  \   nature of CrackNum, do not upgrade. For other users who\n    merely use crackNum
  as an executable, the new version is\n    strongly recommended.\n\n### Version 2.4,
  2020-09-05\n\n  * Changes required to compile cleanly with GHC 8.10.2\n\n### Version
  2.3, 2018-11-17\n\n  * Remove dependency on the ieee754 and reinterpret-cast packages.
  The goal is\n    to remove any FFI dependencies. We now define and export the required\n
  \   utilities directly in the CrackNum package.\n\n### Version 2.2, 2018-09-01\n\n
  \ * Instead of data-binary-ieee754, use reinterpret-cast package. According\n    to
  documents, the former is deprecated.\n\n### Version 2.1, 2018-07-20\n\n  * Support
  for vi-editor bindings. See the file \"crackNum.vim\" in the\n    distribution or
  in the github repo You can put \"so ~/.vim/crackNum.vim\"\n    (use the correct
  path!) and have vi crack numbers directly from inside\n    your editor. Simply locate
  your cursor on a binary/hex stream of digits\n    and type \":CrackNum\".  See the
  \"crackNum.vim\" file for binding details.\n\n### Version 2.0, 2018-03-17\n\n  *
  Import FloatingHex qualified to avoid GHC 8.4.1 compilation issue\n\n### Version
  1.9, 2017-01-22\n\n  * Minor fix to printing of +/-0\n\n### Version 1.8, 2017-01-15\n\n
  \ * Bump up FloatingHex dependency to >0.4, this enables\n    proper support for
  large doubles\n\n### Version 1.7, 2017-01-14\n\n  * Fix a snafu in reading hexadecimal
  floats\n\n### Version 1.6, 2017-01-14\n\n  * Add support for hexadecimal-floats.
  These now\n    work both in toIEEE option as input, and also\n    when printing
  the values out. (i.e., numbers\n    of the form 0x1.abp-3, etc.)\n\n### Version
  1.5, 2016-01-23\n\n  * Typo fixes; no functionality changes\n\n### Version 1.4,
  2016-01-17\n\n  * Fix NaN nomenclature: Screaming->Signaling\n  * Add an example
  to README.md\n\n### Version 1.3, 2015-04-11\n  \n  * Fix docs, github location\n\n###
  Version 1.2, 2015-04-11\n\n  * Fix the constant qnan values for SP/DP\n  * Add conversions
  from float/double. Much easier to use.\n  * Better handling of nan values.\n\n###
  Version 1.1, 2015-04-02\n  \n  * Clean-up the API, examples etc.\n\n### Version
  1.0, 2015-04-01\n\n  * First implementation. Supports HP/SP/DP\n    and signed/unsigned
  numbers in 8/16/32/64 bits.\n"
changelog-type: markdown
description: |
  ## Decode/Encode Integers, Words, and IEE754 Floats

  On Hackage: http://hackage.haskell.org/package/crackNum

  ### Example: Encode a decimal number as a single-precision IEEE754 number
  ```
  $ crackNum -fsp -- -2.3e6
  Satisfiable. Model:
    ENCODED = -2300000.0 :: Float
                    3  2          1         0
                    1 09876543 21098765432109876543210
                    S ---E8--- ----------S23----------
     Binary layout: 1 10010100 00011000110000110000000
        Hex layout: CA0C 6180
         Precision: Single
              Sign: Negative
          Exponent: 21 (Stored: 148, Bias: 127)
    Classification: FP_NORMAL
            Binary: -0b1.0001100011000011p+21
             Octal: -0o1.061414p+21
           Decimal: -2300000.0
               Hex: -0x2.3186p+20
     Rounding mode: RNE: Round nearest ties to even.
              Note: Conversion from "-2.3e6" was exact. No rounding happened.
  ```

  ### Example: Decode a single-precision IEEE754 number float from memory-layout
  ```
  $ crackNum -fsp  0xfc00 abc1
  Satisfiable. Model:
    DECODED = -2.6723903e36 :: Float
                    3  2          1         0
                    1 09876543 21098765432109876543210
                    S ---E8--- ----------S23----------
     Binary layout: 1 11111000 00000001010101111000001
        Hex layout: FC00 ABC1
         Precision: Single
              Sign: Negative
          Exponent: 121 (Stored: 248, Bias: 127)
    Classification: FP_NORMAL
            Binary: -0b1.00000001010101111000001p+121
             Octal: -0o2.00527404p+120
           Decimal: -2.6723903e36
               Hex: -0x2.02AF04p+120
  $ crackNum -fdp 0xfc00 abc1 7F80 0001
  ```

  ### Example: Decode a custom (2+3) IEEE754 float from memory-layout
  ```
  $ crackNum -f2+3 0b10011
  Satisfiable. Model:
    DECODED = -0.75 :: FloatingPoint 2 3
                    4 32 10
                    S E2 S2
     Binary layout: 1 00 11
        Hex layout: 13
         Precision: 2 exponent bits, 2 significand bits
              Sign: Negative
          Exponent: 0 (Subnormal, with fixed exponent value. Stored: 0, Bias: 1)
    Classification: FP_SUBNORMAL
            Binary: -0b1.1p-1
             Octal: -0o6p-3
           Decimal: -0.75
               Hex: -0xcp-4
  ```

  ### Example: Encode an integer as a 7-bit signed word
  ```
  $ crackNum -i7 12
  Satisfiable. Model:
    ENCODED = 12 :: IntN 7
                    654 3210
     Binary layout: 000 1100
        Hex layout: 0C
              Type: Signed 7-bit 2's complement integer
              Sign: Positive
            Binary: 0b1100
             Octal: 0o14
           Decimal: 12
               Hex: 0xc
  ```

  ### Example: Decode two half-precision floats in two lanes
  ```
  $ crackNum -l2 -fhp 32\'hfdc71fc6
  == Lane 1 ============================================================
  Satisfiable. Model:
    DECODED = NaN :: FloatingPoint 5 11
                    1       0
                    5 43210 9876543210
                    S -E5-- ---S10----
     Binary layout: 1 11111 0111000111
        Hex layout: FDC7
         Precision: Half (5 exponent bits, 10 significand bits.)
              Sign: Negative
          Exponent: 16 (Stored: 31, Bias: 15)
    Classification: FP_NAN (Signaling)
             Value: NaN
              Note: Representation for NaN's is not unique
  == Lane 0 ============================================================
  Satisfiable. Model:
    DECODED = 0.0075912 :: FloatingPoint 5 11
                    1       0
                    5 43210 9876543210
                    S -E5-- ---S10----
     Binary layout: 0 00111 1111000110
        Hex layout: 1FC6
         Precision: Half (5 exponent bits, 10 significand bits.)
              Sign: Positive
          Exponent: -8 (Stored: 7, Bias: 15)
    Classification: FP_NORMAL
            Binary: 0b1.111100011p-8
             Octal: 0o3.706p-9
           Decimal: 0.0075912
               Hex: 0x1.f18p-8
  ```

  ### Graphical interface (optional)

  Optionally, crackNum comes with a GUI: pick a format on the left, type a value,
  and see the encoding/decoding in detail. It is entirely optional — crackNum is
  fully functional as a command-line tool without it. The GUI is just a thin
  front-end that calls the `crackNum` binary underneath, so it supports exactly
  the same formats.

  ![crackNum GUI](https://raw.githubusercontent.com/LeventErkok/crackNum/master/crackNumGUI.png)

  **macOS** — a native Swift/AppKit app (`GUI/swiftGUI/`). Building requires the
  Swift compiler that comes with the Xcode Command Line Tools
  (`xcode-select --install`):

  ```
  $ cd GUI/swiftGUI
  $ make install      # builds CrackNum.app and copies it into /Applications
  ```

  **Linux** — a Tcl/Tk script (`GUI/tclGUI/crackNum.tcl`). The script ships with the
  package and is installed alongside the binary, so there is nothing to build; you
  only need `wish` (Tk 8.6+):

  ```
  $ nix profile install nixpkgs#tk   # or: sudo apt install tk / sudo dnf install tk
  ```

  Then `crackNum --gui` just works. If you want to run a modified copy of the
  script, either put it on your PATH as `crackNum.tcl`, or point at it directly
  with `CRACKNUM_TCL=/path/to/crackNum.tcl`. See
  [`GUI/tclGUI/README.md`](GUI/tclGUI/README.md) for details.

  On both platforms, launch the GUI from the command line via the `--gui` option,
  which forwards any format/rounding flags and value to the app:

  ```
  $ crackNum --gui                 -- open the graphical interface
  $ crackNum --gui -fsp 2.5        -- open it with single-precision selected, and 2.5 cracked
  $ crackNum --gui 0xdeadbeef      -- open it pre-filled with a value to decode
  ```

  See [`GUI/swiftGUI/README.md`](GUI/swiftGUI/README.md) for macOS build details and other build targets.

  ### Usage info
  ```
  Usage: crackNum value OR binary/hex-pattern
    -i N                 Signed   integer of N-bits
    -w N                 Unsigned integer of N-bits
    -f fp                Floating point format fp
    -r rm                Rounding mode to use. If not given, Nearest-ties-to-Even.
    -l lanes             Number of lanes to decode
    -h, -?    --help     print help, with examples
    -v        --version  print version info
    -d        --debug    debug mode, developers only
              --gui      launch the graphical interface

  Examples:
   Encoding:
     crackNum -i4    -- -2                    -- encode as 4-bit signed integer
     crackNum -w4    2                        -- encode as 4-bit unsigned integer
     crackNum -f3+4  2.5                      -- encode as float with 3 bits exponent, 4 bits significand
     crackNum -f3+4  2.5 -rRTZ                -- encode as above, but use RTZ rounding mode.
     crackNum -fbp   2.5                      -- encode as a brain-precision float
     crackNum -fdp   2.5                      -- encode as a double-precision float
     crackNum -fe4m3 2.5                      -- encode as an E4M3 FP8 float
     crackNum -fe5m2 2.5                      -- encode as an E5M2 FP8 float
     crackNum -ffp4  2.5                      -- encode as an FP4 (E2M1) float
     crackNum -fsp   0x3.2p5                  -- encode as single-precision from hex-float

   Decoding:
     crackNum -i4      0b0110                -- decode as 4-bit signed integer, from binary
     crackNum -w4      0xE                   -- decode as 4-bit unsigned integer, from hex
     crackNum -f3+4    0b0111001             -- decode as float with 3 bits exponent, 4 bits significand
     crackNum -fbp     0x000F                -- decode as a brain-precision float
     crackNum -fdp     0x8000000000000000    -- decode as a double-precision float
     crackNum -fhp     0x8000                -- decode as a half-precision float
     crackNum -ffp4    0b0111                -- decode as an FP4 (E2M1) float
     crackNum -l4 -fhp 64\'hbdffaaffdc71fc60 -- decode as half-precision float over 4 lanes using verilog notation

   GUI:
     crackNum --gui                     -- launch the graphical interface
     crackNum --gui 0xdeadbeef          -- launch the GUI, pre-filled with the given value

   Notes:
     - For encoding:
         - Use -- to separate your argument if it's a negative number.
         - For floats: You can pass in NaN, Inf, -0, -Inf etc as the argument
                       along with a decimal (2.3, -4.1e5) or hexadecimal float (0x2.4p3)
         - FP4 (E2M1) has neither NaN nor Inf, so those inputs are rejected. Finite
           values outside its range of [-6, 6] saturate to the nearest end-point.
     - For decoding:
         - Use hexadecimal (0x) binary (0b), or N'h (verilog) notation as input.
           Input must have one of these prefixes.
         - You can use _,- or space as a digit to improve readability for the pattern to be decoded
         - With -lN parameter, you can decode multiple lanes of data.
         - If you use verilog input format, then we will infer the number of lanes unless you provide it.
  ```

  VIM users: You can use the http://github.com/LeventErkok/crackNum/blob/master/crackNum.vim file to
  use CrackNum directly from VIM. Simply locate your cursor on the text to crack, and use the
  command `:CrackNum options`.
