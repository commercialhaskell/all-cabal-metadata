description: "# \U0001F9F6\U0001F9F5\U0001F9F6 zwirn \U0001F9F6\U0001F9F5\U0001F9F6
  \n\nzwirn is a live coding language for playing with nested functions of time.\n\n##
  Inspiration\n\nzwirn is an experiment in making the pattern language [TidalCycles](https://tidalcycles.org/)
  into a small functional language of it's own. while zwirn's internals are quite
  different from Tidal's, zwirns design owes almost everything to tidals design by
  [Alex McLean](https://slab.org/).\n\nthe internal representation of signals of time
  was implemented together (and parallel) with [Julian Rohrhuber](https://wertlos.org/~rohrhuber/),
  in an effort to port tidal to SuperCollider. This can be found in the [zwirn-core](https://codeberg.org/uzu/zwirn/src/branch/main/src/zwirn-core/Zwirn/Core)
  sublibrary.\n\nthe implementation of the compiler is inspired by the excellent [Write
  You a Haskell](https://github.com/sdiehl/write-you-a-haskell) by Stephen Diehl.\n\n##
  Installing zwirn\n\nCurrently, the easiest way to play with zwirn is through the
  small terminal UI zwirnmill, which comes with the sound engine [doux](https://doux.livecoding.fr/)
  bundled.\nYou can grab a release for your operating system [here](https://github.com/polymorphicengine/zwirnmill-release/releases).\n\n##
  Compiling from Source\n\nTo compile zwirnmill or zwirnzi with Doux as the sound
  engine, you will need both Haskell and Rust installed. Then, clone the following
  repositories:\n\n```\ngit clone https://codeberg.org/uzu/zwirn/\ngit clone https://codeberg.org/polymorphicengine/haskell-doux\n```\n\nNow
  we will compile  `doux-ffi`:\n\n```\ncd haskell-doux/doux-ffi\ncargo build --release\n```\n\nThen
  you will have to edit the paths in `zwirn/cabal.project.local` to point to your
  `haskell-doux` folder.\nNow we are ready to install zwirnzi or zwirnmill:\n\n```\ncd
  zwirn\ncabal install zwirnzi\ncabal install zwirnmill\n```\n\nIf you want to use
  `zwirnzi` with SuperCollider / SuperDirt instead, the installation is simpler:\n\n```\ngit
  clone https://codeberg.org/uzu/zwirn/\ncd zwirn\ncabal install zwirnzi --flags +superdirt\n```\n"
