description: "\n<p align=\"center\">\n  <a href=\"https://solana.com/docs\">\n    <img
  src=\"https://raw.githubusercontent.com/mariusgeorgescu/solana-haskell-sdk/main/solana-haskell-logo.jpeg\"
  alt=\"Solana Haskell SDK Logo\" width=\"425\" />\n  </a>\n  <h1 align=\"center\">Solana
  SDK library for Haskellers</h1>\n  <p align=\"center\">\n    <a href=\"https://hackage.haskell.org/package/solana-haskell-sdk\">\n
  \     <img src=\"https://img.shields.io/hackage/v/solana-haskell-sdk.svg?style=flat-square&logo=haskell&logoColor=white&label=Hackage\"
  />\n    </a>\n    <a href=\"https://github.com/mariusgeorgescu/solana-haskell-sdk/actions/workflows/ci.yml\">\n
  \     <img src=\"https://github.com/mariusgeorgescu/solana-haskell-sdk/actions/workflows/ci.yml/badge.svg?branch=main\"
  />\n    </a>\n    <a href=\"https://github.com/mariusgeorgescu/solana-haskell-sdk/blob/main/CONTRIBUTING.md\">\n
  \     <img src=\"https://img.shields.io/badge/PRs-welcome-brightgreen.svg?style=flat-square\"
  />\n    </a>\n  </p>\n</p>\n\n## Table of contents\n\n- \U0001F4CB [Documentation](#documentation)\n-
  \U0001F9EA [Integration tests](#integration-tests)\n- \U0001F50C [WebSocket subscriptions](#websocket-subscriptions)\n-
  \U0001F680 [Features](#features)\n- \U0001F9D1‍\U0001F4BB [Usage Examples](#usage-examples)\n-
  \U0001F4DD [Contributing](#contributing)\n- ✨ [Credits](#credits)\n- ⚖️ [License](#license)\n\n##
  Documentation\n\nAPI documentation is generated with Haddock (`cabal haddock`).
  Serialization correctness methodology: every instruction, message, and transaction
  encoder is asserted byte-identical to vectors generated from the official Rust crates
  (solana-sdk, spl-token, mpl-token-metadata) — see [tools/README.md](https://github.com/mariusgeorgescu/solana-haskell-sdk/blob/main/tools/README.md).\n\n##
  Integration tests\n\nAn opt-in test suite runs the SDK against a local validator.
  It sits behind the `integration` cabal flag, so a plain `cabal test all` neither
  builds it nor pulls its extra dependencies:\n\n    solana-test-validator --reset\n
  \   cabal test integration-tests --flags=integration\n\nWithout a validator listening
  on `127.0.0.1:8899` the suite skips itself and exits 0, so it stays green in CI
  even when enabled. Set `SOLANA_INTEGRATION=1` to make an unreachable validator a
  failure instead, or `SOLANA_RPC_URL` to target a different endpoint.\n\n## WebSocket
  subscriptions\n\n`Network.Solana.RPC.WebSocket` speaks Solana's PubSub protocol:
  signature and account subscriptions, and `awaitSignature`, which waits for a transaction
  to be *pushed* to you instead of polling for it.\n\nThe module is transport-agnostic,
  so the SDK carries no WebSocket dependency and the same code serves plain `ws://`
  and TLS `wss://` endpoints — you supply the connection. With the [`websockets`](https://hackage.haskell.org/package/websockets)
  package:\n\n```haskell\nimport Network.Solana.RPC.WebSocket\nimport Network.WebSockets
  qualified as WS\n\nWS.runClient \"127.0.0.1\" 8900 \"/\" $ \\conn -> do\n  let transport
  = WsTransport (WS.sendTextData conn) (WS.receiveData conn)\n  result <- awaitSignature
  transport (RequestId 1) (Just \"confirmed\") 30 signature\n  print result   -- Right
  <slot>, or Left with the on-chain or protocol error\n```\n\nFor `wss://` endpoints
  use [`wuss`](https://hackage.haskell.org/package/wuss)'s `runSecureClient` in place
  of `runClient`; nothing else changes.\n\n## Features\n\n- [x] Full JSON-RPC API
  client (accounts, blocks, chain, ledger, tokens, tokenomics, transactions)\n- [x]
  Wallet, account and keys management (ed25519 keypairs, base58 addresses)\n- [x]
  Program Derived Addresses (`findProgramAddress` / `createProgramAddress`)\n- [x]
  Transaction building, signing and submission\n  - [x] Priority fees via Compute
  Budget (`setComputeUnitLimit`, `setComputeUnitPrice`)\n  - [x] Versioned (v0) transactions
  and Address Lookup Tables\n  - [x] Clients for native programs\n    - [x] Address
  Lookup Table\n    - [x] BPF Loader (upgradeable)\n    - [x] Compute Budget\n    -
  [x] Secp256k1 (instruction construction; signing out of scope)\n    - [x] Stake
  (delegation lifecycle; seed-authority variants out of scope)\n    - [x] System Program
  (all 13 instructions)\n    - [x] Vote (account management)\n  - [x] Clients for
  Solana Program Library (SPL)\n    - [x] Memo\n    - [x] SPL Token (instructions
  0-20, incl. `transferChecked`)\n    - [x] Associated Token Account (derive + create,
  idempotent variant)\n  - [x] Metaplex Token Metadata (create/update metadata, master
  edition)\n- [x] On-chain account state decoders (SPL token accounts and mints, lookup
  tables, stake and nonce accounts, Metaplex metadata)\n- [x] PubSub (WebSocket) signature
  and account subscriptions, with push-based confirmation\n- [x] Serialization verified
  byte-for-byte against the official Rust crates (solana-sdk, spl-token, mpl-token-metadata)
  (golden-vector tests)\n\n### Release status\n\nThe current stable release is **v1.2.0.0**.
  Serialization is verified byte-for-byte against the official Rust SDK by golden-vector
  tests (see test/fixtures/ and [tools/README.md](https://github.com/mariusgeorgescu/solana-haskell-sdk/blob/main/tools/README.md)).\n\n##
  Usage Examples\n\n### Simple transfer\n\nThis example demonstrates how to use the
  Haskell Solana SDK to interact with a Solana validator and perform basic blockchain
  operations such as keypair generation, account funding via airdrop, balance checking,
  and transferring SOL tokens.\n\nIn the provided sample:\n\n1. We start by generating
  a new keypair to act as the transaction sender and fee payer.\n\n2. We connect to
  a local Solana validator using an HTTP provider.\n\n3. The newly generated keypair
  receives an airdrop of 10 SOL to ensure it has sufficient funds.\n\n4. We define
  a recipient's public address from a base58 encoded string.\n\n5. We **construct**,
  **sign** and **submit** the transaction by defining the signers and the transaction's
  list of instructions with their parameters.\n\nBefore and after performing the transfer
  of 1 SOL to the recipient, we check and print the account balances to verify the
  transaction's success.\n\nThis straightforward example highlights the convenience
  and expressiveness of Haskell when building decentralized applications on Solana.\n\n>
  The examples use `GHC2021` (this package's `default-language`). If you compile them
  under `Haskell2010`, additionally enable `NumericUnderscores` and `ImportQualifiedPost`.\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\n\nmodule Main where\n\nimport Control.Monad (void)\nimport
  Control.Monad.IO.Class (liftIO)\nimport Network.Solana.Core.Crypto\nimport Network.Solana.NativePrograms.SystemProgram
  qualified as SystemProgram\nimport Network.Solana.RPC.HTTP.Transaction\nimport Network.Solana.SolanaWeb3\nimport
  Network.Web3.Provider\n\nmain :: IO ()\nmain = do\n  -- Generate keypairs for fee
  payer (sender)\n  (myPublicKey, myPrivateKey) <- createSolanaKeyPair\n\n  -- Create
  Connection, local validator in this example\n  result <- runWeb3' (HttpProvider
  \"http://127.0.0.1:8899\") $ do\n    -- Fund fee payer\n    void $ requestAirdrop
  myPublicKey 10_000_000_000\n    wait 15 -- Wait 15 seconds be sure the tx was confirmed\n\n
  \   -- Define recipient's address from a base58-encoded string\n    let recipient
  = \"A988FuUtUVk8jMUuVc1ccaoTA3VS9CB4dkEf9XUAUqV4\"\n\n    -- Check balance\n    printBalances
  [myPublicKey, recipient]\n\n    -- Create a new transaction.\n    txId <-\n      newTransaction\n
  \       [myPrivateKey] -- Signing keys (with all required signers)\n        -- List
  of instructions\n        [ SystemProgram.transfer\n            myPublicKey -- sender
  address\n            recipient -- recipient address\n            1_000_000_000 --
  amount to transfer 1 SOL\n        ]\n    liftIO $ putStrLn (\"Transaction sent:
  \" <> show txId)\n\n    void $ confirmTransaction txId\n    -- Check balance\n    printBalances
  [myPublicKey, recipient]\n\n  either (\\e -> putStrLn (\"RPC error: \" <> show e))
  pure result\n```\n\n### SPL token transfer (Associated Token Accounts)\n\nTokens
  live in *associated token accounts* (ATAs) — program-derived addresses computed
  from the wallet and the mint. This example derives both ATAs with `getAssociatedTokenAddress`,
  creates the recipient's ATA if missing (idempotent, safe to include unconditionally),
  and moves tokens with the decimals-checked `transferChecked`.\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\n\nmodule Main where\n\nimport Control.Monad (void)\nimport
  Data.Maybe (fromJust)\nimport Network.Solana.Core.Crypto\nimport Network.Solana.SolanaWeb3\nimport
  Network.Solana.SplPrograms.AssociatedTokenAccount qualified as Ata\nimport Network.Solana.SplPrograms.Token
  qualified as Token\nimport Network.Web3.Provider\n\nmain :: IO ()\nmain = do\n  (myPublicKey,
  myPrivateKey) <- createSolanaKeyPair\n\n  void $ runWeb3' (HttpProvider \"http://127.0.0.1:8899\")
  $ do\n    let mint = \"4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU\" -- the token's
  mint address\n        recipient = \"A988FuUtUVk8jMUuVc1ccaoTA3VS9CB4dkEf9XUAUqV4\"
  -- recipient wallet\n\n        -- ATAs are PDAs of (wallet, token program, mint):
  derived, not generated.\n        sourceAta = fromJust (Ata.getAssociatedTokenAddress
  myPublicKey mint)\n        destinationAta = fromJust (Ata.getAssociatedTokenAddress
  recipient mint)\n\n    void $\n      newTransaction\n        [myPrivateKey]\n        [
  -- Create the recipient's token account if it does not exist yet (no-op otherwise).\n
  \         Ata.createAssociatedTokenAccountIdempotent\n            myPublicKey --
  funder (pays rent)\n            recipient -- wallet that will own the ATA\n            mint,\n
  \         -- Transfer 1 token (here: 6 decimals); mint and decimals are verified
  on-chain.\n          Token.transferChecked\n            sourceAta -- source token
  account\n            mint -- token mint\n            destinationAta -- destination
  token account\n            myPublicKey -- owner of the source account\n            []
  -- extra multisig signers (none)\n            1_000_000 -- amount in base units\n
  \           6 -- decimals of the mint\n        ]\n```\n\n### Priority fees and memo\n\nCompute
  Budget instructions raise a transaction's scheduling priority by paying a fee per
  compute unit; a memo attaches a signed, human-readable note recorded on-chain. Both
  are ordinary `Instruction`s added to the same instruction list.\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\n\nmodule Main where\n\nimport Control.Monad (void)\nimport
  Network.Solana.Core.Crypto\nimport Network.Solana.NativePrograms.ComputeBudget qualified
  as ComputeBudget\nimport Network.Solana.NativePrograms.SystemProgram qualified as
  SystemProgram\nimport Network.Solana.SolanaWeb3\nimport Network.Solana.SplPrograms.Memo
  qualified as Memo\nimport Network.Web3.Provider\n\nmain :: IO ()\nmain = do\n  (myPublicKey,
  myPrivateKey) <- createSolanaKeyPair\n\n  void $ runWeb3' (HttpProvider \"http://127.0.0.1:8899\")
  $ do\n    let recipient = \"A988FuUtUVk8jMUuVc1ccaoTA3VS9CB4dkEf9XUAUqV4\"\n\n    void
  $\n      newTransaction\n        [myPrivateKey]\n        [ ComputeBudget.setComputeUnitLimit
  200_000, -- cap the compute units this tx may use\n          ComputeBudget.setComputeUnitPrice
  10_000, -- priority fee: micro-lamports per compute unit\n          SystemProgram.transfer
  myPublicKey recipient 1_000_000_000, -- 1 SOL\n          Memo.buildMemo \"thanks
  for the coffee\" [myPublicKey] -- signed on-chain note\n        ]\n```\n\n## Contributing\n\nWe
  welcome all contributors! See [contributing guide](https://github.com/mariusgeorgescu/solana-haskell-sdk/blob/main/CONTRIBUTING.md)
  for how to get started.\n\n## Credits\n\nCreated and maintained by Marius Georgescu.\n\n##
  License\n\n[Apache-2.0](https://github.com/mariusgeorgescu/solana-haskell-sdk/blob/main/LICENSE)\n"
