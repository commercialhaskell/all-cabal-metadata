changelog: |
  # Changelog for `mangrove`

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the
  [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## Unreleased

  ## 0.4.0.0 - 2026-09-13

  ### Added

  - Show instances for data structures related to parser trees
  - A TextParser for paths (FilePath)
  - 'Request' type family associated with Scheme class
  - Property based tests using QuickCheck

  ### Changed

  - Split Mangrove.Parser module back into several modules (ParseTree,
    Scheme, Stream, Token)
  - Move the contents of Mangrove module to Mangrove.Parser, then
    re-export them from the Mangrove module
  - Parameterize the StreamParser monad by request type
  - Drop phantom type parameter from ProgramInfo

  ### Removed

  - usageInfo method of Scheme class
  - HelpContinuation family
  - HelpHandler type alias

  ## 0.3.0.0 - 2026-08-27

  ### Added

  - Request options that trigger a request when matched
  - Literate Haskell mkuser tutorial that demonstrates how to build
    parsers for options and parameters
  - Literate Haskell pkgtool tutorial that demonstrates how to build
    command parsers
  - Individual text parsers for common data types

  ### Changed

  - Generalize help requests to help or version requests
  - Rewrite mkuser tutorial as a Literate Haskell program
  - Add version information to ProgramInfo
  - Move tutorials from the inside the README to dedicated pages on the
    GitHub wiki which are built from Literate Haskell files in the `doc`
    directory

  ### Fixed

  - Include commands with no options in help output
  - Factor out duplicate code in Mangrove.Unix.optionPure

  ### Removed

  - Separable module and Separable typeclass
  - Exhibit type
  - Modal type

  ## 0.2.0.0 - 2026-08-14

  ### Added

  - Documentation about where to obtain this library

  ### Changed

  - Loosen bounds on dependency versions so the project can be built
    against a wider range of snapshots
  - Change the error message type for TextParsers from 'Builder' to 'Text'
  - Fix missing help options in help output
  - Fix unit test builds when using cabal
  - Make minor code quality improvements
  - Add strictness annotations to simple values in constructors

  ## 0.1.0.0 - 2026-08-12

  ### Added

  - Types and data structures for building argument parsers
  - Combinators for constructing parsers
  - Typeclass for parsing schemes (Scheme)
  - A UNIX-style parsing scheme with a subargument parsing scheme
  - A stream parsing monad (StreamParser)
  - Support for generating help information
  - A basic test suite with 53 unit tests
  - An API for running parsers and collecting the results
changelog-type: markdown
description: |
  # Mangrove (mangrove-cli)

  [![Hackage](https://img.shields.io/hackage/v/mangrove-cli.svg)](https://hackage.haskell.org/package/mangrove-cli)
  [![Unit Tests](https://github.com/quytelda/mangrove/actions/workflows/unit-tests.yml/badge.svg)](https://github.com/quytelda/mangrove/actions/workflows/unit-tests.yml)

  Mangrove is a library for building command line argument parsers using
  Haskell's `Applicative` interface. It provides parsers for UNIX-style
  command line syntax, including positional parameters, named options,
  and commands, as well as complex subparameters and suboptions (e.g.
  `--mount src=/webroot,dst=/var/www,rw`). It is also extensible, so you
  can define alternative command line syntaxes.

  ## Documentation

  The API documentation is available on Hackage:
  <https://hackage.haskell.org/package/mangrove-cli>

  There is a tutorial to help with getting started:
  <https://github.com/quytelda/mangrove/wiki/Tutorial>

  Commands are covered in a separate tutorial:
  <https://github.com/quytelda/mangrove/wiki/Commands>

  ## Obtaining

  Mangrove is available on Hackage as `mangrove-cli`:
  <https://hackage.haskell.org/package/mangrove-cli>

  __NOTE__: This project is not related to the `mangrove` package on
  Hackage. Make sure to use the package name `mangrove-cli`.

  The source code for Mangrove is hosted on GitHub:
  <https://github.com/quytelda/mangrove>

  ## Building

  This project uses `stack` as its primary build system (though building
  with `cabal` should also work). As usual, you can build the library
  by running `stack build` and you can install it with `stack install`.
  Use `stack haddock` to build the API documentation.

  ## Test Suite

  Mangrove has a test suite using HSpec. Run `stack test` to build and
  run the tests. The `main` branch should always pass all tests, so if
  something fails, please make an issue!

  ## Project Roadmap

  This project is currently under active development. Goals currently on
  the horizon include:

  - Stabilize the client-facing API
  - Simplify the code structure
  - Improve test suite coverage
  - Profiling & optimization

  Once these are addressed, a 1.0.0 release will be appropriate.
