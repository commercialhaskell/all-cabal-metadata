changelog: |
  # Changelog for `mangrove`

  All notable changes to this project will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the
  [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## Unreleased

  ## 0.1.0.0 - 2026-08-12

  ### Added

  - Types and data structures for building argument parsers
  - Combinators for constructing parsers
  - Typeclass for parsing schemes (Scheme)
  - A UNIX-style parsing scheme with a subargument parsing scheme
  - A stream parsing monad (StreamParser)
  - Support for generating help information
  - A basic test suite with 53 unit tests
  - An API for running parsers and collecting the results
changelog-type: markdown
description: "# Mangrove\n\n[![Unit Tests](https://github.com/quytelda/mangrove/actions/workflows/unit-tests.yml/badge.svg)](https://github.com/quytelda/mangrove/actions/workflows/unit-tests.yml)\n\nMangrove
  is a library for building command line argument parsers using\nHaskell's `Applicative`
  interface. It provides parsers for UNIX-style\ncommand line syntax, including positional
  parameters, named options,\nand commands, as well as complex subparameters and suboptions
  (e.g.\n`--mount src=/webroot,dst=/var/www,rw`). It is also extensible, so you\ncan
  define alternative command line syntaxes.\n\n## Building\n\nThis project uses `stack`
  as its primary build system (though building\nwith `cabal` should also work). As
  usual, you can build the library\nby running `stack build` and you can install it
  with `stack install`.\nUse `stack haddock` to build the API documentation.\n\n##
  Test Suite\n\nMangrove has a test suite using HSpec. Run `stack test` to build and\nrun
  the tests. The `main` branch should always pass all tests, so if\nsomething fails,
  please make an issue!\n\n## Project Roadmap\n\nThis project is currently under active
  development. Goals currently on\nthe horizon include:\n\n- Stabilize the client-facing
  API\n- Simplify the code structure\n- Improve test suite coverage\n- Profiling &
  optimization\n\nOnce these are addressed, a 1.0.0 release will be appropriate.\n\n#
  Tutorial\n\n## A Metaphor\n\nImagine the roots of a plant branching out like a tree
  as they\ndescend. Eventually, they dip into a stream. The roots collect water\nand
  nutrients from the flowing stream. These resources travel back up\nthe structure
  toward the plant, combining along the way.\n\nThis is kind of like how the Mangrove
  library works. We build a\ntree-shaped parser from simple applicative combinators,
  then feed it a\nsequence of CLI arguments. Simple parsers stationed at the bottom
  of\nthe tree consume these arguments and produce values which are then\npassed back
  up the tree and combined with the results of other parsers\nuntil a final result
  is reached.\n\n## Example\n\n__NOTE__: See the full example file in `doc/MkUser.hs`.\n\nSuppose
  we are writing a simple program that creates new user\naccounts - we'll call it
  \"mkuser\". The goal will be to provide a\ncommand line interface with the following
  syntax:\n\n```\nmkuser [--uid=INT] [--system] [--groups={GROUP...}] USERNAME\n```\n\nFirst,
  let's create a new record that captures the program's runtime\nconfiguration.\n\n```haskell\ndata
  Settings = Settings\n  { userId     :: Maybe Int -- ^ An optional target user ID\n
  \ , userSystem :: Bool -- ^ Is this a system user?\n  , userGroups :: [Text] --
  ^ Groups the new user will be in\n  , userName   :: Text  -- ^ Username for the
  new user\n  } deriving (Show)\n```\n\nLet's also pretend that our program's logic
  lives inside a function\n`run :: Settings -> IO ()`. We pass it the settings we
  want, and it\nruns the program accordingly. However, since this is just an example\nprogram,
  we won't actually create any user accounts; instead we'll\njust have the program
  print its settings to `stdout`.\n\n```haskell\nrun :: Settings -> IO ()\nrun = print\n```\n\nNow
  we need to construct a parser that reads a list of arguments and\nyields a `Settings`.
  Our parser will have the type `UnixParser\nSettings`.\n\n__NOTE__: This example
  uses the language extensions `OverloadedLists`\nand `OverloadedStrings` since we
  need to write lots of `NonEmpty` list\nand `Text` literals.\n\n__NOTE__: `UnixParser`
  is just a convenient type synonym for\n`ParseTree UnixScheme`. This tells us that
  we will build a `ParseTree`\nby combining parsers from the UNIX scheme.\n\n## Positional
  Parameters\n\nA \"positional parameter\" is a positional input that accepts the
  first\nnon-flag argument it encounters. In Mangrove, positional parameters\nare
  usually just referred to as \"parameters\" since other kinds of\nparameters have
  their own names. Consider an example program called\n`substring` whose command line
  syntax is `substring START END STRING`.\n`START`, `END`, and `STRING` would be parameters.
  If we invoke\n`substring 1 3 \"example\"`, we know that `START` is `1`, `END` is
  `3`,\nand `STRING` is `\"example\"` because of the order in which they appear.\n\nOur
  program will have just one parameter: a username. Here is how we\ndefine a parser
  for it:\n\n```haskell\nprm_name :: UnixParser Text\nprm_name = parameter defaultParser\n```\n\nThe
  `parameter` function creates a parameter parser out of a\n`TextParser`.\n\n### TextParsers\n\nA
  `TextParser r` is just a wrapper around a function that parses\n`Text` into a value
  of type `r`. It also contains a \"hint\" string used\nfor displaying usage information.\n\nMany
  common data types have a reasonable default `TextParser`\nimplementation. Types
  that are instances of the `DefaultParser` class\nimplement `defaultParser :: DefaultParser
  a => TextParser a`, letting\nus automatically select the correct parser based on
  the required type.\n\nIn the example above, `Text` has a very simple `DefaultParser`\ninstance
  that just returns its input unchanged.\n\n## Options\n\nAn \"option\" is a construct
  representing a named input. Options begin\nwith a flag followed by an optional subargument
  string.\n\nA \"flag\" is special symbol that signals the beginning of a particular\noption.
  Per UNIX tradition there are long flags (e.g. `--foo`) and\nshort flags (e.g `-f`).\n\nTo
  prevent ambiguity, sometimes an equals sign is used to separate a\nlong flag from
  its subargument string (instead of a space). For\nexample, `--uid=1000` is an option
  that begins with the `--uid` flag\nand is followed by the subargument string `1000`.
  Similarly, an\noption's short flag can be directly concatenated with its argument,\ne.g.
  `-u 1000` can be written `-u1000`.\n\nLet's define a parser for the `--uid` option:\n\n```haskell\nopt_uid
  :: UnixParser Int\nopt_uid = option [\"--uid\", \"-u\"]\n          \"Specify a user
  ID\"\n\t\t  $ subparameter defaultParser\n```\n\nThe `option` function creates a
  parser for CLI options. It takes three\narguments:\n\n1. A `NonEmpty` list of `Flag`s
  that trigger the option, in this case\n   \"--uid\" and \"-u\". `Flag` is an instance
  of `IsString`, so we can\n   just write the string representation instead of `LongFlag
  \"uid\"`\n   and `ShortFlag 'u'`.\n2. A human readable description. This will be
  displayed when help\n   output is triggered.\n3. A subparser tree (`SubParser r`)
  that will parse any subparameters or\n   suboptions. In this case, we declare a
  single subparameter (an\n   integer).\n\nThe `subparameter` function behaves just
  like `parameter` from\nearlier, except it creates a `SubParser` instead of a `UnixParser`.
  We\nalso use `defaultParser` to automatically select an appropriate\n`TextParser`
  for `Int`.\n\n__NOTE__: `SubParser` is a type synonym for `ParseTree SubScheme`.\nThat
  means we build a `SubParser` by combining `SubScheme` parsers.\n`SubScheme` provides
  parsers for handling subarguments to options.\n\nYou might notice that our `Settings`
  record requires a `Maybe Int`,\nnot an `Int`. However, since `UnixParser` is an
  instance of\n`Alternative`, we can use `optional` from `Control.Applicative`.\n`optional
  opt_uid :: UnixParser (Maybe Int)` describes an option that\nis not required and
  might be absent (which should give us `Nothing`).\n\n### Switches\n\nThe `--system`
  option is simpler because because it doesn't accept any\nsubarguments - it is either
  present (`True`) or absent (`False`). This\nspecial type of option is a \"switch\",
  and we can use the `switch`\nfunction to create a parser:\n\n```haskell\nopt_system
  :: UnixParser Bool\nopt_system = switch [\"--system\", \"-s\"] \"Create a system
  user\"\n\n-- If we defined this without 'switch' it would look like this:\n-- opt_system
  = option [\"--system\", \"-s\"]\n--              \"Create a system user\"\n--              (pure
  True)\n--              <|> pure False\n\n```\n\n### Options with Multiple Subparameters\n\nLet's
  deal with the `--groups` option. This option is a bit different\nfrom the `--uid`
  option because we want the user to be able to specify\na list of groups for the
  new user to join. Thus, we want to create an\noption that accepts one or more subarguments.\n\nThankfully,
  `SubParser` is also an `Alternative` instance. We can use\n`some` (from `Control.Applicative`)
  to convert a `SubParser r` into a\n`SubParser [r]` that will expect to parse one
  or more `r` values.\n\n```haskell\nopt_groups :: UnixParser [Text]\nopt_groups =\n
  \ option [\"--groups\", \"-g\"]\n  \"Specify what groups the user is part of\"\n
  \ $ some $ subparameter defaultParser\n```\n\nMangrove recognizes that the subparser
  `some $ subparameter\ndefaultParser :: SubParser [Text]` can consume multiple subarguments,\nso
  it splits those subarguments apart by comma. This allows us to pass\na list of group
  names like so: `--groups=wheel,audio,input`, and the\nparser will yield `[\"wheel\",\"audio\",\"input\"]`.\n\nBy
  using `some` instead of the similar function `many`, we have\ncreated a subparser
  that will fail if no subarguments are provided\n(e.g. `mkuser alice --groups`).\n\nWhat
  if the `--groups` option isn't present at all? We still need a\n`[Text]` value for
  our `Settings` record. In that case, an empty list\nmakes sense. Just like with
  our `--uid` option, we use `Alternative`\nto define what happens if our parser never
  finds applicable input.\n\n```\nopt_groups <|> pure [] :: UnixParser [Text]\n```\n\n__NOTE__:
  There is an important distinction between a parser that\nnever finds relevant input
  and a parser that fails. In an expression\nlike `opt_groups <|> pure []`, if `opt_groups`
  never finds relevant\ninput, the alternative provides a default value. However,
  if\n`opt_groups` *does* find applicable input, but parsing it fails, an\nerror will
  be thrown instead.\n\nMore generally, if `p` and `q` are parsers, then `p <|> q`
  is a parser\nthat yields the result from whichever parser finds applicable input\nfirst.
  If neither parser finds input, we first try resolving `p` and\nthen `q` with no
  input and yield the first result we get. If neither\nsucceeds, we throw an error.\n\n##
  Applicative\n\nWe are now ready to construct our `Settings` parser using `<$>` and\n`<*>`:\n\n```haskell\nparseSettings
  :: UnixParser Settings\nparseSettings =\n  Settings\n  <$> optional opt_uid\n  <*>
  opt_system\n  <*> (opt_groups <|> pure [])\n  <*> prm_name\n```\n\nNow we can inspect
  the automatically generated usage information for\nour parser in GHCi using `render`
  from `Mangrove.Text`:\n\n```\nghci> render parseSettings\n\"[--uid=INT] [--system]
  [--groups={STRING...}] STRING\"\n```\n\nThis output indicates that our parser accepts
  (but does not require) a\n`--uid` option with an integer subargument, a `--system`
  option, and a\n`--groups` option with a list of string subarguments. Finally, it\nrequires
  a single parameter, which is a string. We'll see how to\nimprove those type hints
  later.\n\n## Program Metadata\n\nThe last thing we need to define before running
  our parser is a\nstructure with some metadata about the program:\n\n```haskell\nprogramInfo
  :: ProgramInfo\nprogramInfo = ProgramInfo\n  { programName = \"mkuser\" -- The name
  of the program\n  , programDesc = \"Create user accounts\" -- A short description
  of the program\n  }\n```\n\nThis information is used to display nice, human-readable
  help and\nusage information, which will is discussed in more detail in the [Help\nOptions](#help-options)
  section.\n\n## Running the Parser\n\nThe `parseArguments` function will run our
  parser with the arguments\npassed to our program by the operating system.\n\n```haskell\nmain
  :: IO ()\nmain = parseArguments programInfo parseSettings run\n```\n\n`parseArguments`
  takes three arguments: the program metadata (for help\noutput), a `UnixParser r`,
  and a function of type `r -> IO a`. When\nthe parser completes successfully, this
  function will be called with\nthe result. Otherwise, `parseArguments` will print
  error messages or\nhelp information as appropriate, and then exit.\n\nIf you want
  to run an argument parser without using `IO`, or you want\nto pass your own argument
  list, check out `runHelpfulParser` from\n`Mangrove`.\n\nNow we have a complete program
  we can build and run to show the\nargument parser in action!\n\n```\n$ ghc -o mkuser
  MkUser.hs\n[1 of 2] Compiling Main             ( MkUser.hs, MkUser.o )\n[2 of 2]
  Linking mkuser\n\n$ ./mkuser --system --groups audio,input bilbo\nSettings {userId
  = Nothing, userSystem = True, userGroups = [\"audio\",\"input\"], userName = \"bilbo\"}\n\n$
  ./mkuser --badinput\nunexpected --badinput\n\n$ ./mkuser --system\nexpected: STRING\n\n$
  ./mkuser --uid=InvalidNumber bilbo\n--uid=InvalidNumber: InvalidNumber: input does
  not start with a digit\n```\n\n## Help Options\n\nCurrently, our CLI interface is
  missing something important: an option\nfor displaying help and usage information.
  Let's create a new\n`Settings` parser that recognizes `--help` as a request for
  help\ninformation.\n\n```haskell\nparseSettings' :: UnixParser Settings\nparseSettings'
  = addHelpOptions [\"--help\"]\n                 \"Display help and usage information\"\n
  \                parseSettings\n\nmain :: IO ()\nmain = parseArguments programInfo
  parseSettings' run\n```\n\nNow if we invoke our program with the `--help` option,
  it will display\na nice summary of how to use it:\n\n```\n./mkuser --help\nUsage:\nmkuser
  [--uid=INT] [--system] [--groups={STRING...}] STRING\nmkuser --help\n\nCreate user
  accounts\n\n    --help                 Display help and usage information\n-g  --groups
  \ {STRING...}  Specify what groups the user is part of\n-s  --system               Create
  a system user\n-u  --uid     INT          Specify a user ID\n```\n\n__NOTE__: If
  an interface defines any commands (see below),\n`addHelpOptions` will add a help
  option at the root of the parse tree\nas well as the root of every command subtree.
  This is so that you can\ninvoke `myprogram --help` to get general help or `myprogram\nsomecommand
  --help` to get help information specifically for\n`somecommand`.\n\n## Hints\n\nType
  hints are displayed as placeholders for parameters in help and\nusage information.
  They are a hint to the user about what kind of\ninformation is expected by that
  input. For example, `--uid=INT`\nindicates the `--uid` option expects an integer
  as a subargument.\nHints stored inside the `parserHint` field of a `TextParser`.\n\nOur
  program uses the generic hints defined in the `DefaultParser`\ninstances for `Int`
  and `Text`. These defaults are often reasonable,\nbut we can also tailor hints more
  specifically for our use case. All\nwe need to do is alter the value of `parserHint`
  for the relevant\n`TextParser`.\n\n```\nopt_groups :: UnixParser [Text]\nopt_groups
  =\n  option [\"--groups\", \"-g\"]\n  \"Specify what groups the user is part of\"\n
  \ $ some $ subparameter defaultParser {parserHint = \"GROUP\"}\n\nprm_name :: UnixParser
  Text\nprm_name = parameter defaultParser {parserHint = \"USERNAME\"}\n```\n\nNow
  our help output looks like this:\n\n```\n$ ./mkuser --help\nUsage:\nmkuser [--uid=INT]
  [--system] [--groups={GROUP...}] USERNAME\nmkuser --help\n\nCreate user accounts\n\n
  \   --help                Display help and usage information\n-g  --groups  {GROUP...}
  \ Specify what groups the user is part of\n-s  --system              Create a system
  user\n-u  --uid     INT         Specify a user ID\n```\n\n## Commands\n\nA \"command\"
  is a special argument changes the context of a parser.\nWhen a command is encountered,
  the parser begins using the parse tree\nassociated with that command as a new context
  until it completes.\nCommands are usually used as a way to invoke different modes
  of\nfunctionality for a single program. For example, `git` supports\nvarious commands
  like `commit` or `pull`.\n\nSuppose we are creating a basic version control system
  similar to\n`git`. Our program will have several runtime modes for doing\noperations
  like `commit` or `pull`. Here is how we might define a\nparser that recognizes the
  corresponding commands (for the full code,\nsee `doc/VersionControl.hs`):\n\n```haskell\ndata
  Mode\n  = CommitMode CommitSettings\n  | PullMode PullSettings\n  -- ... and probably
  other modes too\n  deriving (Show)\n\nparseMode :: UnixParser Mode\nparseMode =
  cmd_commit <|> cmd_pull\n  where\n    cmd_commit =\n      command [\"commit\"]\n
  \     \"Make a new commit\"\n      $ CommitMode <$> parseCommitSettings\n    cmd_pull
  =\n      command [\"pull\"]\n      \"Download remote changes\"\n      $ PullMode
  <$> parsePullSettings\n```\n"
