changelog: "# Revision history\n\n## mariadb-haskell 0.1.0.0 — alpha candidate preparation\n\nAlpha:
  extensive automated validation, without real-world application validation.\nPublic
  Hackage publication awaits Anton's review of the candidate documentation\nand explicit
  approval.\n\nMariaDB-only fork of [mysql-haskell](https://github.com/winterland1989/mysql-haskell),\nmaintained
  by Anton Antich. This starts an independent release series; the\nupstream changelog
  below is retained as history. Public `Database.MySQL.*`\nmodule names remain, with
  no MySQL server support target.\n\n* Bounded framing/metadata/cleanup and explicit
  command/stream ownership,\n  cancellation retirement, generation-safe handles and
  uncertain-COMMIT diagnostics.\n* MariaDB extended capability negotiation, utf8mb4
  defaults, strict session-aware\n  bindings, raw dates, unsigned 64-bit IDs and exact
  fixed-width Field conversions.\n* Verified TLS/SNI, client certificates, native/ed25519/PARSEC/SHA-2
  authentication,\n  explicit PAM dialogs and principal-pinned Kerberos GSSAPI.\n*
  Managed prepared statements, complete multiple/OUT results, native binary bulk\n
  \ with indicators/per-unit results and cached/extended metadata.\n* Session/change
  observations and reset/restoration with exclusive initialization.\n* One-shot long-data
  sources, server cursor batches, progress callbacks and opt-in\n  zlib transport
  compression.\n* Stateful bounded CDC decoding, checksums/compressed events, MariaDB
  GTID resume,\n  complete-group checkpoints and consumer-controlled semisync ACKs.\n*
  Full correctness/benchmark history with frozen original/feature references;\n  retained
  Mac/Linux validation: 844 passing records and 63 Mac profiles.\n* Independent package
  identity, GHC 9.4+ bounds, opt-in developer executable,\n  native-dependency/source-archive
  CI, a verified November 2026 Mozilla CA snapshot\n  with MPL-2.0 notices, and password-redacted
  connection diagnostics.\n* Packaged user, migration and benchmark guides with compilable
  examples and\n  expanded Haddock ownership/lifetime/error contracts.\n\nSee the
  [migration guide](https://github.com/aantich/mariadb-haskell/blob/main/docs/MIGRATION.md)\nfor
  behavior changes, and [release readiness](https://github.com/aantich/mariadb-haskell/blob/main/docs/RELEASING.md)\nfor
  final validation evidence and Hackage candidate/publication status.\n\n## Upstream
  mysql-haskell history\n\n## 1.3.3 -- 2026.10.07\n\nNew functions, and fixes to `executeMany`
  and `executeMany_` for inputs that\nleft 1.3.2's connection out of step. `queryMulti_`
  and `queryMulti` return every\nresult of a CALL or a multi-statement query in order:
  each result set with its\ncolumns and rows, and each statement's `OK`.\n\n`executeMany`
  and `executeMany_` now read the whole reply. A statement that\nreturns rows raises
  `ExtraResultSets`, where 1.3.2 threw `UnexpectedPacket` or\nleft the rows for the
  next command. A query with several statements per\nparameter set gives one `OK`
  per statement, where 1.3.2 returned one per\nparameter set and left the rest. `executeMany`
  with no parameter sets returns\n`[]` without contacting the server, where 1.3.2
  sent an empty query whose error\nreached the next command.\n\n+ Every result set
  of a CALL or multi-statement query through `queryMulti_`\n  [#94](https://github.com/winterland1989/mysql-haskell/pull/94)\n\n##
  1.3.2 -- 2026.10.07\n\nRequires crypton 2.0 or newer, the first crypton with the
  timing side-channel\nfixes that TLS connections reach; a project held to crypton
  1.x keeps\nresolving to 1.3.1. The only API addition is the `ExtraResultSets` exception.\nThe
  query functions now return an empty result for an INSERT, UPDATE or DELETE\ninstead
  of hanging. `execute_`, `executeStmt` and the query functions read the\nwhole reply
  of a CALL or a multi-statement query, so they no longer leave\nresults behind for
  the next command; `executeMany` and `executeMany_` are\nunchanged (#93).\n\nErrors
  change only for statements that produce several results, or rows where\n`execute_`
  and `executeStmt` expect none. Those two raise `ExtraResultSets` for\na result set
  (1.3.1 threw `UnexpectedPacket` when it came first and returned the\n`OK` when it
  came later); the query functions raise it after the first result\nset's rows when
  a second one follows, which 1.3.1 left on the connection. A\nlater statement that
  fails raises its `ERRException` from that call or its row\nstream, also ahead of
  `ExtraResultSets`. Stack users who set the removed\n`crypton-1-1` flag must delete
  it from `stack.yaml`, since Stack rejects flags a\npackage does not define.\n\n+
  Query functions no longer hang on statements without a result set,\n  multi-result
  replies are read to the end, and crypton 2 is required\n  [#91](https://github.com/winterland1989/mysql-haskell/pull/91)\n+
  CI: the cabal job builds and runs the test suite\n  [#90](https://github.com/winterland1989/mysql-haskell/pull/90)\n\n##
  1.3.1 -- 2026.10.06\n+ Allow crypton 2.0 and 2.1 (commercialhaskell/stackage#8128).
  The library\n  code needed no change; CI now builds and tests against every crypton\n
  \ series the bounds admit (0.34, 1.0, 1.1, 2.0 and 2.1).\n\n## 1.3.0 -- 2026.07.22\n+
  Add `Database.MySQL.Field` with a `Field` typeclass for converting\n  individual
  Haskell values to and from `MySQLValue` (#86). One combined\n  class in the style
  of persistent's `PersistField`, with a `DecodeError`\n  sum type for decode failures
  and named top-level encode/decode functions\n  backing every instance.\n\n## 1.2.5
  -- 2026.05.04\n+ Replace abandoned `pem` dependency with `crypton-pem` (#84)\n\n##
  1.2.4 -- 2026.04.20\n+ Fix benchmark compilation failures (#82):\n  + Replace deleted
  `Data.Binary.Parser.Char8` import in benchmark with\n    `Word8`-based combinators
  from `Data.Binary.Parser`\n  + Replace `GHC.Prim`/`GHC.Types` imports with `GHC.Exts`
  from `base`\n  + Fix `Word8#` vs `Word#` type mismatch in `mhDigitToInt`\n  + Remove
  stale haddock reference to deleted `Char8` module\n\n## 1.2.3 -- 2026.04.12\n+ Support
  caching_sha2_password full auth via RSA on non-TLS connections#81 thanks @ikaro1192\n\n##
  1.2.2 -- 2026.03.25\n+ Widen tls upper bound to allow tls 2.4.x\n+ Fix unsafe ByteString
  operations (`unsafeDrop`, `unsafeTail`, `unsafeIndex`)\n  on untrusted wire protocol
  data that caused undefined behavior (segfaults,\n  garbage reads) on malformed input.
  The safe alternatives are also O(1).\n  Affected parsers: text protocol timestamp/datetime/time/date
  fields,\n  NEWDECIMAL in binlog, and `eventHeaderLen` for unknown event types.\n\n##
  1.2.1 -- 2026.03.23\n+ Export `connectUnixSocket` function.\n+ Tweak cabal file
  to better handle crypton vs cryptonite.\n+ Fix version cut off for tls compatibility.\n+
  Fix missing `liftA2` import when running tests on GHC 9.4.\n+ Add integration test
  for Unix socket.\n\n## 1.2.0 -- 2026.03.07\n+ Add support for  caching_sha2_password
  authentiation.\n\n## 1.1.9 -- 2026.03.07\n+ Fix binary protocol error 1210 on modern
  MySQL/MariaDB:\n  `MYSQL_TYPE_BIT` and `MYSQL_TYPE_YEAR` are not valid parameter
  types\n  for `COM_STMT_EXECUTE`. Send `MySQLBit` as `MYSQL_TYPE_LONGLONG`\n  (unsigned,
  little-endian) and `MySQLYear` as `MYSQL_TYPE_SHORT`\n  (unsigned, 2-byte integer)
  instead.\n+ Fix `MySQLYear` binary encoding: was sending a length-encoded string\n
  \ which caused data misalignment for all subsequent parameters.\n+ Fix version detection
  for MariaDB 10+/11+ (fractional seconds support).\n+ Fix CI: enable binary logging
  and grant binlog privileges for\n  integration tests on MariaDB.\n+ Add roundtrip
  integration tests for `MySQLBit` and `MySQLYear`.\n\n## 1.1.8\n+ bump constraints\n\n##
  1.1.7 -- 2025.08.23 \n+ bump constraints\n+ upgrade cabal file\n+ add upper bounds
  to all the warnings\n  + it was only the test suite so I made them broad.\n+ Disable
  inline-rule-shadowing for Int24 and Word24.\n  those rules fire fine. you can test
  it our yourself with\n  the Main.hs in the main repository.\n  There is a stanza
  to do so in cabal.\n+ clean up cabal file a bit, use GHC2021\n\n## 1.1.6 -- 2024.10.23
  \n+ bump constraints\n\n## 1.1.5 -- 2024.06.25\n+ bump constraints\n\n## 1.1.4 --
  2024.02.17 \n+ bump constraints\n\n## 1.1.3 -- 2023.08.30\n+ bump constraints\n\n##
  1.1.2 -- 2023.08.14\n\n+ Fix package name of changelog\n+ Drop support for RC4 chipher
  which is depracated\n+ drop dependency on binary-ieee754, which was unused.\n+ Fix
  text 2 support, thanks @RikvanToor\n\n## 1.1.1 -- 2023.08.14\n\n+ cleaned up some
  warnings\n+ Merge back into mysql-haskell after gaining hackage access.\n+ Deprecate
  mysql-pure in favor of old hackage\n  since it's only been out for a day this sort
  off\n  stream lines upgrading for most applications.\n  Cabal will just figure it
  out, rather then\n  users having to \"find\" mysql-pure.\n  I'll just make a bonus
  announcement to\n  let people not depend on mysql-pure.\n\n## 1.1.0 -- 2023.08.12
  \nThere was a bunch of stuff unrelated to mysql\nwhich I purged.\nIf you need any
  on these go depend on the \nrespective unmaintained package.\n\n+ Delete module
  System.IO.Streams.UnixSocket\n+ Dleete module Data.Binary.Parser.Char8\n+ Delete
  module System.IO.Streams.Binary\n\n## 1.0.2 -- 2023.08.12 \n+ Bump dependencies,
  go all into crypton\n+ merge tcp-streams into the package\n\n## 1.0.1 -- 2023.08.12
  \n+ add json testfiles as extra source files to make tests pass in nix builds\n\n##
  1.0.0 -- 2023.08.12 \n\n+ Fork from mysql-haskell into mysql-pure\n+ add flake\n+
  merge packages:\n  + word24\n  + binary-parsers\n  + wirestreams\n  \n  This involved
  copying over all source files,\n  furthermore I copied in all tests and benchmarks.\n
  \ The tests are now one giant test suite.\n  I temporarly disabled the mysql tests
  as they need a mysql\n  database to run which won't work nicely with CI right now.\n
  \ However you can run these locally by uncommenting that line.\n+ Add CI which relies
  on native cabal instead of stack\n+ Add an action to automatically bump version.\n+
  Add nightly build cron job.\n\n## 0.8.4.3 -- 2020-11-04\n\n* Fix build with GHC
  8.8.\n\n## 0.8.4.2 -- 2019-01-22\n\n* Fix [stackage#4312](https://github.com/commercialhaskell/stackage/issues/4312):
  Relax `network` bounds.\n\n## 0.8.4.1 -- 2018-10-23\n\n* Relax `tasty` version bound
  to build with latest stackage. [#26](https://github.com/winterland1989/mysql-haskell/pull/26)\n\n##
  0.8.4.0  -- 2018-10-23\n\n* Add `executeMany_` to execute batch SQLs, [#26](https://github.com/winterland1989/mysql-haskell/issues/26).\n*
  Optimize connection closing sequence, [#20](https://github.com/winterland1989/mysql-haskell/pull/20),
  [#25](https://github.com/winterland1989/mysql-haskell/pull/25).\n\n## 0.8.3.0  --
  2017-10-09\n\n* Remove unnecessary exports from `Database.MySQL.Base`.\n* Reuse
  TCP connection when using TLS.\n* Clean up some compiler warnings.\n\n## 0.8.2.0
  \ -- 2017-10-09\n\nCourtesy of naushadh, `mysql-haskell` will be on stackage again.\n\n*
  Update to use `tcp-streams-1.x`.\n* Fix compatibility with new  `tls/memory` version.\n\n##
  0.8.1.0  -- 2016-11-09\n\n* Add `Show` instance to `ConnectInfo`.\n* Add proper
  version bound for `binary`.\n\n## 0.8.0.0  -- 2016-11-09\n\n* Add `ciCharset` field
  to support `utf8mb4` charset.\n* Add `BitMap` field to `COM_STMT_EXECUTE`, and [#8](https://github.com/winterland1989/mysql-haskell/pull/8)
  by [alexbiehl](https://github.com/alexbiehl).\n\n## 0.7.1.0 -- 2016-11-21\n\n* Add
  `QueryParam` class and `Param` datatype for multi-valued parameter(s) by [naushadh](https://github.com/naushadh).\n\n##
  0.7.0.0 -- 2016-11-09\n\n* Split openssl support to [mysql-haskell-openssl](http://hackage.haskell.org/package/mysql-haskell-openssl).\n*
  Expose `Database.MySQL.Connection` module due to this split, it shouldn't be used
  by user directly.\n\n## 0.6.0.0 -- 2016-10-25\n\n* Use binary-ieee754 for older
  binary compatibility.\n* Clean up `Database.MySQL.Protocol.MySQLValue` 's export.\n\n##
  0.5.1.0 -- 2016-10-20\n\n* Add `queryVector`, `queryVector_` and `queryStmtVector`.\n*
  Use binary-parsers to speed up binary parsers.\n\n## 0.5.0.0 -- 2016-8-22\n\n* Export
  exception types.\n* Fix a regression cause password authentication failed, add tests.\n*
  Fix a reading order bug cause 'prepareStmt/prepareStmtDetail' failed.\n\n## 0.4.0.0
  -- 2016-8-22\n\n* Enable TLS support via `tls` package, add benchmarks.\n\n## 0.3.0.0
  \ -- 2016-8-22\n\n* Fix tls connection, change TLS implementation to HsOpenSSL,
  add benchmarks.\n* Fix a bug in 'putLenEncInt' which cause sending large field fail.\n*
  Various optimizations.\n\n## 0.2.0.0  -- 2016-8-19\n\n* Fix OK packet decoder.\n*
  Fix sending large packet(>16M).\n* Add `executeMany`, `withTransaction` to Base
  module.\n* Add timestamp field to `RowBinLogEvent`.\n* Add test, add insert benchmark.\n\n##
  0.1.0.0  -- 2016-8-16\n\n* First version. Released on an unsuspecting world.\n"
changelog-type: markdown
description: |
  # MariaDB Haskell

  **Status: Alpha.** Extensive automated tests and benchmarks cover the documented
  MariaDB capabilities, but the driver has not yet been validated in real-world
  applications. Evaluate it in your own environment; APIs and behavior may change.

  A streaming Haskell driver for **MariaDB only**, forked from
  [mysql-haskell](https://github.com/winterland1989/mysql-haskell). This fork adds
  MariaDB's native statement, session, authentication and replication capabilities,
  with bounded decoding and explicit connection ownership. MySQL servers are not
  a support target.

  **[User guide and examples](https://github.com/aantich/mariadb-haskell/blob/main/docs/USER_GUIDE.md)** ·
  **[Live test and benchmark report](https://github.com/aantich/mariadb-haskell/blob/main/validation/RESULTS.md)** ·
  **[Benchmark guide](https://github.com/aantich/mariadb-haskell/blob/main/docs/BENCHMARKS.md)** ·
  **[Migration guide](https://github.com/aantich/mariadb-haskell/blob/main/docs/MIGRATION.md)**

  ## Features

  | Area | What the driver provides |
  | --- | --- |
  | Connections | TCP, Unix sockets, verified TLS and client certificates; full Unicode (`utf8mb4`) by default |
  | Queries | Streaming list/vector rows, checked text parameters, managed binary prepared statements, multiple results and stored-procedure OUT parameters |
  | Native statements | MariaDB binary bulk execution, NULL/DEFAULT/IGNORE indicators, per-unit results, cached and extended column metadata |
  | Large data | One-shot streamed byte/text parameters, bounded upload chunks and server cursor fetches |
  | Sessions | Public session observations and connection reset with role/schema/charset restoration and an initialization hook for pools |
  | Operations | Progress callbacks and opt-in zlib transport compression |
  | Authentication | Native password, Unix-socket accounts, ed25519, PARSEC, SHA-2, TLS certificate accounts, explicit PAM dialogs and Kerberos GSSAPI |
  | MariaDB values | Signed/unsigned integers, exact decimals, Unicode and bytes, raw zero/partial dates, and wire representations for JSON, UUID, INET, VECTOR and geometry |
  | CDC | Row-based binlog decoding, checksums and compressed events, MariaDB GTID resume, complete-transaction checkpoints and consumer-controlled semisync ACKs |
  | Reliability | One command owner per connection, bounded messages/metadata/cleanup, stale-handle rejection, cancellation retirement and uncertain-COMMIT diagnostics |

  SQL features such as CTEs, window functions, sequences, `RETURNING`, Oracle mode
  and system-versioned tables pass through to MariaDB. The driver does not need
  a separate API for every server function. This is not an ORM or a collection
  of Haskell domain types for every SQL type.

  ## Quick start

  The package is `mariadb-haskell`, starting with version `0.1.0.0`.
  Public modules retain `Database.MySQL.*` names, which do not imply MySQL support.
  See [release status](https://github.com/aantich/mariadb-haskell/blob/main/docs/RELEASING.md)
  for candidate/publication status. Build the checkout as follows; after publication,
  add `mariadb-haskell >=0.1 && <0.2` to your application's Cabal dependencies.

  On Linux install a C toolchain, zlib development files and MIT Kerberos
  (`libkrb5-dev` on Debian/Ubuntu), even when not using GSSAPI. macOS uses the
  system GSS framework and Apple's command-line tools. The driver itself does
  not require Connector/C.

  ```sh
  cabal update
  cabal build lib:mariadb-haskell
  ```

  The complete [Quickstart.hs](https://github.com/aantich/mariadb-haskell/blob/main/examples/Quickstart.hs)
  reads connection settings from the environment. For an existing `ConnectInfo`,
  a prepared query looks like this:

  ```haskell
  {-# LANGUAGE OverloadedStrings #-}
  import Control.Exception (bracket)
  import qualified Database.MySQL.Base as DB
  import qualified System.IO.Streams as Streams

  printCustomer ci customerId =
    bracket (DB.connect ci) DB.close $ \conn ->
      DB.withPreparedStatement conn
        "SELECT name FROM customers WHERE id = ?" $ \statement -> do
          (_, rows) <- DB.queryPrepared statement [DB.MySQLInt64 customerId]
          Streams.foldM (\() row -> print row) () rows
  ```

  Consume every result stream within the connection and statement brackets,
  before issuing another command. A connection and its stream have one owning
  thread; use separate connections for concurrent workers. Use TLS or a Unix
  socket for sensitive credentials. The
  [user guide](https://github.com/aantich/mariadb-haskell/blob/main/docs/USER_GUIDE.md)
  covers connections, values, transactions, bulk, uploads, cursors, pooling,
  authentication, failures and durable CDC consumers.

  ## Validation and performance

  The committed release-input capture from `6bbcf13`, recorded on **9 November
  2026**, reports **844 PASS, 0 FAIL, 0 unsupported API inventory entries and 0 unavailable
  fixtures** on macOS. The inherited suites cover **183 unit/property cases** (182 pass and one
  inherited external-HTTPS case is ignored) and **32 passing integration tests**;
  **180 policy tests** pass. A separate Linux profile also passes all 844 checks
  and 39 native benchmark smoke paths; its exact revision is retained in the
  [release evidence](https://github.com/aantich/mariadb-haskell/blob/main/docs/RELEASING.md#evidence-checkpoint).
  This closes the original suite's missing driver APIs
  and authentication fixtures; it does not certify every version or platform.

  The Mac run measures **63 profiles, seven process repetitions each**. Selected
  comparisons use alternatives in the **same current build**:

  | Comparison (Current vs Baseline) | Time unit | Baseline | Current | Change vs baseline |
  | --- | --- | ---: | ---: | ---: |
  | Native bulk vs sequential prepared insert | ns/row | 41,574.20 | 1,966.40 | -95.27% |
  | Native bulk vs text batch insert | ns/row | 11,001.40 | 1,966.40 | -82.13% |
  | Cached vs uncached wide prepared metadata | ns/execution | 76,824.00 | 56,378.00 | -26.61% |
  | Reset/restore vs reconnect/prepare TLS session | ns/request | 38,469,366.67 | 464,833.33 | -98.79% |

  Baseline means the named alternative in this build. Change is
  `(current / baseline − 1) × 100`; negative means less elapsed time.
  The benchmark guide also records allocations. These local measurements are not
  promises for other applications.
  The host was **not idle** and timing investigations remain open. Streaming
  uploads allocate more in the measured case; cursors and compression cost time
  on local transfers. Some ordinary workloads remain slower than the original
  fork baseline. No allocation-regression signals were found against the frozen
  references; this differs from comparing two alternatives within this build.

  See the [benchmark guide](https://github.com/aantich/mariadb-haskell/blob/main/docs/BENCHMARKS.md)
  for environment, tradeoffs and immutable data. The
  **[live report on main](https://github.com/aantich/mariadb-haskell/blob/main/validation/RESULTS.md)**
  is refreshed from complete captures, retaining failures, baselines and exact
  source provenance. This dated snapshot describes the recorded release inputs;
  ordinary documentation/results commits do not claim another measurement.

  [![Live validation status](https://raw.githubusercontent.com/aantich/mariadb-haskell/main/validation/results/overview.svg)](https://github.com/aantich/mariadb-haskell/blob/main/validation/RESULTS.md)

  ## Tested scope and limits

  Full recorded profiles use **MariaDB 12.3.3**, macOS arm64/GHC 9.10.3 and
  Linux/GHC 9.4.7. Other server/compiler versions need separate profiles.
  Capabilities depend on the server version/configuration. Windows is not a
  verified release platform and its GSSAPI implementation is unavailable.

  CDC fails closed on unsupported non-ignorable events. Advanced XA checkpointing,
  two-phase ALTER and storage-engine-binlog GTID semisync are unsupported by the
  transaction-aware API. Checkpoints are not persisted by the driver; ACKs alone
  do not provide exactly-once destination writes. Text codecs cover UTF-8, ASCII
  and MariaDB latin1; other result charsets remain bytes.

  Timeouts/cancellation during protocol I/O retire the connection. Reconnect;
  never blindly replay a transaction with an uncertain COMMIT. There is no built-in
  pool or automatic SQL replay.

  ## Development and license

  Unit/property tests: `cabal test test --enable-tests`. Integration/benchmarks
  require a provisioned server first; follow the
  [validation instructions](https://github.com/aantich/mariadb-haskell/blob/main/validation/README.md)
  and [managed macOS setup](https://github.com/aantich/mariadb-haskell/blob/main/validation/MACOS.md).
  Implementation history remains in `docs/`.

  Driver code: BSD 3-Clause; see [LICENSE](https://github.com/aantich/mariadb-haskell/blob/main/LICENSE).
  Bundled Mozilla CA data: MPL-2.0; see [CA provenance](https://github.com/aantich/mariadb-haskell/blob/main/docs/CA_BUNDLE.md).
  Original work by Winterland and upstream contributors retains its copyright
  notices. Report reproducible problems through
  [GitHub issues](https://github.com/aantich/mariadb-haskell/issues), including
  server/compiler versions and sanitized diagnostics.
