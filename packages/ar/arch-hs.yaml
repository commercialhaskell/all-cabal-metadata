description: "# arch-hs\n\n[![Hackage](https://img.shields.io/hackage/v/arch-hs.svg?logo=haskell)](https://hackage.haskell.org/package/arch-hs)\n[![MIT
  license](https://img.shields.io/badge/license-MIT-blue.svg)](LICENSE)\n\n| Env              |
  CI                                                                                                                        |\n|
  ---------------- | -------------------------------------------------------------------------------------------------------------------------
  |\n| pacman (-f alpm) | [![ArchLinux](https://github.com/berberman/arch-hs/actions/workflows/archlinux.yml/badge.svg)](https://github.com/berberman/arch-hs/actions/workflows/archlinux.yml)
  |\n| cabal-install    | [![CI](https://github.com/berberman/arch-hs/actions/workflows/ci.yml/badge.svg)](https://github.com/berberman/arch-hs/actions/workflows/ci.yml)
  \    |\n\nA program generating PKGBUILD for hackage packages. Special thanks to
  [felixonmars](https://github.com/felixonmars/).\n\n**Notice that `arch-hs` will
  always support only the latest GHC version used by Arch Linux.**\n\n\n## Introduction\n\nGiven
  the name of a package in hackage, `arch-hs` can generate PKGBUILD files, not only
  for the package\nwhose name is given, but also for all dependencies missing in [[extra]](https://www.archlinux.org/packages/).\n`arch-hs`
  has a naive built-in dependency solver, which can fetch those dependencies and find
  out which are required to be packaged.\nDuring the dependency calculation, all version
  constraints will be discarded due to the arch haskell packaging strategy,\nthus
  there is no guarantee of dependencies' version consistency.\n\n## Prerequisite\n\n`arch-hs`
  is a PKGBUILD text file generator, which is not integrated with `pacman`(See [Alpm
  Support](#Alpm-Support)), depending on nothing than:\n\n* Pacman databases (`extra.db`,
  `extra.files`, `core.db`, and `core.files`)\n\n* Hackage index tarball (`01-index.tar`,
  or `00-index.tar` previously) -- usually provided by `cabal-install`\n\n## Installation\n\n`arch-hs`
  is portable, which means it's not restricted to Arch Linux.\nHowever, `arch-hs`
  can optionally use libalpm to load pacman database on Arch Linux,\nand if you want
  to run on other systems, you have to build it from source.\n\n### Install the latest
  release\n\n```\n# pacman -S arch-hs\n```\n\n`arch-hs` is available in [[extra]](https://www.archlinux.org/packages/extra/x86_64/arch-hs/),
  so you can install it using `pacman`.\n\n### Install the development version\n\n```\n#
  pacman -S arch-hs-git\n```\n\nThe `-git` version is available in [[archlinuxcn]](https://github.com/archlinuxcn/repo),
  following the latest git commit.\n\n## Build\n\n```\n$ git clone https://github.com/berberman/arch-hs\n```\n\nThen
  build it via stack or cabal.\n\n#### Stack\n```\n$ stack build\n```\n\n#### Cabal
  (dynamic)\n```\n$ cabal configure --disable-library-vanilla --enable-shared --enable-executable-dynamic
  --ghc-options=-dynamic \n$ cabal build\n```\n\n## Usage\n\nJust run `arch-hs` in
  command line with options and a target. Here is an example:\nwe will create the
  archlinux package of [gi-gdk](https://hackage.haskell.org/package/gi-gdk).\n\n<details
  open>\n<summary>\nOutput:\n</summary>\n\n```\n$ arch-hs -o ~/test gi-gdk\nⓘ Loading
  hackage from /home/berberman/.cabal/packages/hackage.haskell.org/01-index.tar\nⓘ
  Loading extra.db from /var/lib/pacman/sync/extra.db\nⓘ Start running...\nⓘ Solved:\n...\ngi-gdk
  \                                     ✘\n ├─Cabal (Setup)                            ✔
  [extra]\n ├─bytestring (Lib)                         ✔ [extra]\n ├─containers (Lib)
  \                        ✔ [extra]\n ├─gi-cairo (Lib, Setup)                    ✔
  [extra]\n ├─gi-gdkpixbuf (Lib, Setup)                ✘\n ├─gi-gio (Lib, Setup)                      ✘\n
  ├─gi-glib (Lib, Setup)                     ✘\n ├─gi-gobject (Lib, Setup)                  ✘\n
  ├─gi-pango (Lib, Setup)                    ✘\n ├─haskell-gi (Lib, Setup)                  ✔
  [extra]\n ├─haskell-gi-base (Lib)                    ✔ [extra]\n ├─haskell-gi-overloading
  (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔ [extra]\n
  └─transformers (Lib)                       ✔ [extra]\ngi-gdkpixbuf                                ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─gi-gio (Lib,
  Setup)                      ✘\n ├─gi-glib (Lib, Setup)                     ✘\n ├─gi-gobject
  (Lib, Setup)                  ✘\n ├─haskell-gi (Lib, Setup)                  ✔ [extra]\n
  ├─haskell-gi-base (Lib)                    ✔ [extra]\n ├─haskell-gi-overloading
  (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔ [extra]\n
  └─transformers (Lib)                       ✔ [extra]\ngi-gio                                      ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─gi-glib (Lib,
  Setup)                     ✘\n ├─gi-gobject (Lib, Setup)                  ✘\n ├─haskell-gi
  (Lib, Setup)                  ✔ [extra]\n ├─haskell-gi-base (Lib)                    ✔
  [extra]\n ├─haskell-gi-overloading (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔
  [extra]\n └─transformers (Lib)                       ✔ [extra]\ngi-glib                                     ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─haskell-gi (Lib,
  Setup)                  ✔ [extra]\n ├─haskell-gi-base (Lib)                    ✔
  [extra]\n ├─haskell-gi-overloading (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔
  [extra]\n └─transformers (Lib)                       ✔ [extra]\ngi-gobject                                  ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─gi-glib (Lib,
  Setup)                     ✘\n ├─haskell-gi (Lib, Setup)                  ✔ [extra]\n
  ├─haskell-gi-base (Lib)                    ✔ [extra]\n ├─haskell-gi-overloading
  (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔ [extra]\n
  └─transformers (Lib)                       ✔ [extra]\ngi-harfbuzz                                 ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─gi-glib (Lib,
  Setup)                     ✘\n ├─gi-gobject (Lib, Setup)                  ✘\n ├─haskell-gi
  (Lib, Setup)                  ✔ [extra]\n ├─haskell-gi-base (Lib)                    ✔
  [extra]\n ├─haskell-gi-overloading (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔
  [extra]\n └─transformers (Lib)                       ✔ [extra]\ngi-pango                                    ✘\n
  ├─Cabal (Setup)                            ✔ [extra]\n ├─bytestring (Lib)                         ✔
  [extra]\n ├─containers (Lib)                         ✔ [extra]\n ├─gi-glib (Lib,
  Setup)                     ✘\n ├─gi-gobject (Lib, Setup)                  ✘\n ├─gi-harfbuzz
  (Lib, Setup)                 ✘\n ├─haskell-gi (Lib, Setup)                  ✔ [extra]\n
  ├─haskell-gi-base (Lib)                    ✔ [extra]\n ├─haskell-gi-overloading
  (Lib)             ✔ [extra]\n ├─text (Lib)                               ✔ [extra]\n
  └─transformers (Lib)                       ✔ [extra]\n...\n\nⓘ Recommended package
  order:\n1. gi-glib\n2. gi-gobject\n3. gi-harfbuzz\n4. gi-pango\n5. gi-gio\n6. gi-gdkpixbuf\n7.
  gi-gdk\n\nⓘ Detected pkgconfig or extraLib from target(s):\ngi-gdk:      gtk4.pc\ngi-gdkpixbuf:gdk-pixbuf-2.0.pc\ngi-gio:
  \     gio-2.0.pc\ngi-glib:     glib-2.0.pc\ngi-gobject:  gobject-2.0.pc\ngi-harfbuzz:
  harfbuzz.pc, harfbuzz-gobject.pc\ngi-pango:    pango.pc\n\nⓘ Now finding corresponding
  system package(s) using files db:\nⓘ Loading [core] files from /var/lib/pacman/sync\nⓘ
  Loading [extra] files from /var/lib/pacman/sync\nⓘ Done:\ngtk4.pc               ⇒
  \  gtk4\ngdk-pixbuf-2.0.pc     ⇒   gdk-pixbuf2\ngio-2.0.pc            ⇒   glib2\nglib-2.0.pc
  \          ⇒   glib2\ngobject-2.0.pc        ⇒   glib2\nharfbuzz.pc           ⇒   harfbuzz\nharfbuzz-gobject.pc
  \  ⇒   harfbuzz\npango.pc              ⇒   pango\n\nⓘ Write file: /home/berberman/test/haskell-gi-gdk/PKGBUILD\nⓘ
  Write file: /home/berberman/test/haskell-gi-gdkpixbuf/PKGBUILD\nⓘ Write file: /home/berberman/test/haskell-gi-gio/PKGBUILD\nⓘ
  Write file: /home/berberman/test/haskell-gi-glib/PKGBUILD\nⓘ Write file: /home/berberman/test/haskell-gi-gobject/PKGBUILD\nⓘ
  Write file: /home/berberman/test/haskell-gi-harfbuzz/PKGBUILD\nⓘ Write file: /home/berberman/test/haskell-gi-pango/PKGBUILD\n✔
  Success!\n```\n</details>\n\nThis output tells us that in order to package `gi-gdk`,
  we must package its dependencies\nlisted in package order, which are not present
  in [extra] repo. Particularly, `gi-gdk`\nrequires external system dependencies,
  so `arch-hs` can map them to system packages using files db.\n\n```\n$ tree ~/test\n/home/berberman/test\n├──
  haskell-gi-gdk\n│   └── PKGBUILD\n├── haskell-gi-gdkpixbuf\n│   └── PKGBUILD\n├──
  haskell-gi-gio\n│   └── PKGBUILD\n├── haskell-gi-glib\n│   └── PKGBUILD\n├── haskell-gi-gobject\n│
  \  └── PKGBUILD\n├── haskell-gi-harfbuzz\n│   └── PKGBUILD\n└── haskell-gi-pango\n
  \   └── PKGBUILD\n```\n\n`arch-hs` generates PKGBUILD for each package. Let's see
  what we have in `./haskell-gi-harfbuzz/PKGBUILD`:\n\n``` bash\n# This file was generated
  by https://github.com/berberman/arch-hs, please check it manually.\n# Maintainer:
  Your Name <youremail@domain.com>\n\n_hkgname=gi-harfbuzz\npkgname=haskell-gi-harfbuzz\npkgver=0.0.3\npkgrel=1\npkgdesc=\"HarfBuzz
  bindings\"\nurl=\"https://github.com/haskell-gi/haskell-gi\"\nlicense=(\"LGPL2.1\")\narch=('x86_64')\ndepends=('ghc-libs'
  'haskell-gi-glib' 'haskell-gi-gobject' 'haskell-gi' 'haskell-gi-base' 'haskell-gi-overloading'
  'harfbuzz')\nmakedepends=('ghc')\nsource=(\"https://hackage.haskell.org/packages/archive/$_hkgname/$pkgver/$_hkgname-$pkgver.tar.gz\")\nsha256sums=('5f61c7b07427d0b77f867c3bc560043239c6184f98921295ce28fc8c9ce257e5')\n\nbuild()
  {\n  cd $_hkgname-$pkgver\n\n  runhaskell Setup configure -O --enable-shared --enable-executable-dynamic
  --disable-library-vanilla \\\n    --prefix=/usr --docdir=/usr/share/doc/$pkgname
  --enable-tests \\\n    --dynlibdir=/usr/lib --libsubdir=\\$compiler/site-local/\\$pkgid
  \\\n    --ghc-option=-optl-Wl\\,-z\\,relro\\,-z\\,now \\\n    --ghc-option='-pie'\n\n
  \ runhaskell Setup build\n  runhaskell Setup register --gen-script\n  runhaskell
  Setup unregister --gen-script\n  sed -i -r -e \"s|ghc-pkg.*update[^ ]* |&'--force'
  |\" register.sh\n  sed -i -r -e \"s|ghc-pkg.*unregister[^ ]* |&'--force' |\" unregister.sh\n}\n\npackage()
  {\n  cd $_hkgname-$pkgver\n\n  install -D -m744 register.sh \"$pkgdir\"/usr/share/haskell/register/$pkgname.sh\n
  \ install -D -m744 unregister.sh \"$pkgdir\"/usr/share/haskell/unregister/$pkgname.sh\n
  \ runhaskell Setup copy --destdir=\"$pkgdir\"\n  install -D -m644 LICENSE -t \"$pkgdir\"/usr/share/licenses/$pkgname/\n
  \ rm -f \"$pkgdir\"/usr/share/doc/$pkgname/LICENSE\n}\n```\n\n`arch-hs` will collect
  the information from hackage db, and apply it into a fixed template after some processing
  steps\nincluding renaming, matching license, and filling out dependencies etc.\nHowever,
  packaging haven't been done so far.\n`arch-hs` can't guarantee that this package
  can be built by ghc with the latest dependencies;\nhence some patches may be required
  in `prepare()`, such as [uusi](#Uusi).\n\n\n## Options\n\n### Output\n\n```\n$ arch-hs
  -o ~/test TARGET\n```\n\nUsing `-o` can generate a series of PKGBUILD including
  `TARGET` with its dependencies into the output dir. If you don't pass it, only dependency
  calculation will occur.\n\n### Flag Assignments\n```\n$ arch-hs -f TARGET:FLAG_A:true
  TARGET\n```\n\nUsing `-f` can pass flags, which may affect the results of resolving.
  \ \n\n### AUR Searching\n\n```\n$ arch-hs -a TARGET\n```\n\nWith `-a`, `arch-hs`
  will regard AUR as another package provider, and it will try to search missing packages
  in AUR as well.\n\n### Skipping Components\n\n```\n$ arch-hs -s COMPONENT_A TARGET\n```\n\nUsing
  `-s` can force skip runnable components in dependency resolving.\nThis is useful
  when a package doesn't provide flag to disable its runnables, which will be built
  by default but are trivial in system level packaging.\nNotice that this only makes
  sense in the lifetime of `arch-hs`, whereas generated PKGBUILD and actual build
  processes will not be affected.\n\n### Extra Cabal Files\n\n```\n$ arch-hs -e ~/TARGET
  TARGET\n```\n\n**For Testing Purposes Only**\n\nUsing `-e` can include extra `.cabal`
  files as supplementary.\nUseful when the `TARGET` hasn't been released to hackage.\n\n###
  Trace\n\n```\n$ arch-hs --trace TARGET\n```\n\nWith `--trace`, `arch-hs` can print
  the process of dependency resolving into stdout.\n\n```\n$ arch-hs --trace-file
  foo.log TARGET\n```\n\nSimilar to `--trace`, but the log will be written into a
  file.\n\n### Uusi\n\n`arch-hs` automatically detects updated bounds in revisions
  and includes them using the `uusi` command where necessary.\n\nIf none are detected,
  the behaviour can be overridden manually via the `--uusi` flag:\n\n```\n$ arch-hs
  -o ~/test --uusi TARGET\n```\n\nWith `--uusi`, `arch-hs` will generate the following
  snippet for each package:\n\n```bash\nprepare() {\n  cd $_hkgname-$pkgver\n  uusi\n}\n```\n\nSee
  [uusi](https://hackage.haskell.org/package/uusi) for details.\n\n### Alpm\n\nSee
  [Alpm Support](#Alpm-Support).\n\n### Force\n\n```\n$ arch-hs --force TARGET\n```\n\nWith
  `--force`, `arch-hs` will try to package even if the target is provided.\n\n###
  Json\n\n```\n$ arch-hs --json ./output.json TARGET\n```\n\nWith `--json`, `arch-hs`
  will dump information presented in stdout to file as JSON format, including:\n  *
  abnormal dependencies\n  * solved packages\n  * recommended package order\n  * system
  dependencies\n  * flags\n\n### No skip missing\n\n```\n$ arch-hs --no-skip-missing
  TARGET\n```\n\nWith `--no-skip-missing`, `arch-hs` will try to package if the dependent
  of this package exist whereas this package does not.\n\n## [Name preset](https://github.com/berberman/arch-hs/blob/master/data/NAME_PRESET.json)\n\nTo
  distribute a haskell package to archlinux, the name of package should be changed
  according to the naming convention:\n\n* for haskell libraries, their names must
  have `haskell-` prefix\n\n* for programs, it depends on circumstances\n\n* names
  should always be in lower case\n\nHowever, it's not enough to prefix the string
  with `haskell-` and transform to lower case; in some special situations, the hackage
  name\nmay have `haskell-` prefix already, or the case is irregular, thus we have
  to a name preset manually. Once a package distributed to archlinux,\nwhose name
  conform to above-mentioned situation, the name preset should be upgraded correspondingly.\n\n##
  Diff\n\n`arch-hs` also provides a component called `arch-hs-diff`. `arch-hs-diff`
  can show the differences of package description between two versions of a package,\nand
  remind us if some required packages in extra repo can't satisfy the version constraints,
  or they are non-existent.\nBy default, `arch-hs-diff` reads revision 0 cabal files
  from the local Hackage index.\n`-h`/`--hackage` can be used to specify the index
  tarball path.\nUse `--online` to download revision 0 cabal files from Hackage instead.\nThis
  is useful in the subsequent maintenance of a package. For example:\n\n```\n$ arch-hs-diff
  comonad 5.0.6 5.0.7\nⓘ Loading extra.db from /var/lib/pacman/sync/extra.db\nⓘ Loading
  hackage from /home/berberman/.cabal/packages/hackage.haskell.org/01-index.tar\nⓘ
  Start running...\nⓘ Reading revision 0 cabal file from /home/berberman/.cabal/packages/hackage.haskell.org/01-index.tar:
  comonad/5.0.6/comonad.cabal\nⓘ Reading revision 0 cabal file from /home/berberman/.cabal/packages/hackage.haskell.org/01-index.tar:
  comonad/5.0.7/comonad.cabal\nPackage: comonad\nVersion: 5.0.6  ⇒  5.0.7\nSynopsis:
  Comonads\nURL: http://github.com/ekmett/comonad/\nDepends:\n  base  >=4 && <5\n
  \ containers  >=0.3 && <0.7\n  distributive  >=0.2.2 && <1\n  tagged  >=0.7 && <1\n
  \ transformers  >=0.2 && <0.6\n  transformers-compat  >=0.3 && <1\n--------------------------------------\n
  \ base  >=4 && <5\n  containers  >=0.3 && <0.7\n  distributive  >=0.2.2 && <1\n
  \ indexed-traversable  >=0.1 && <0.2\n  tagged  >=0.7 && <1\n  transformers  >=0.2
  && <0.6\n  transformers-compat  >=0.3 && <1\n \nMakeDepends:\n  base  -any\n  doctest
  \ >=0.11.1 && <0.17\n--------------------------------------\n  base  -any\n  doctest
  \ >=0.11.1 && <0.18\n\"doctest\" is required to be in range (>=0.11.1 && <0.17),
  but [extra] provides (0.17). \nFlags:\n  comonad\n    ⚐ test-doctests:\n        description:\n
  \         \n        default: True\n        isManual: True\n    ⚐ containers:\n        description:\n
  \         You can disable the use of the `containers` package using `-f-containers`.\n\n
  \         Disabling this is an unsupported configuration, but it may be useful for
  accelerating builds in sandboxes for expert users.\n        default: True\n        isManual:
  True\n    ⚐ distributive:\n        description:\n          You can disable the use
  of the `distributive` package using `-f-distributive`.\n\n          Disabling this
  is an unsupported configuration, but it may be useful for accelerating builds in
  sandboxes for expert users.\n\n          If disabled we will not supply instances
  of `Distributive`\n\n        default: True\n        isManual: True\n--------------------------------------\n
  \ comonad\n    ⚐ test-doctests:\n        description:\n          \n        default:
  True\n        isManual: True\n    ⚐ containers:\n        description:\n          You
  can disable the use of the `containers` package using `-f-containers`.\n\n          Disabling
  this is an unsupported configuration, but it may be useful for accelerating builds
  in sandboxes for expert users.\n        default: True\n        isManual: True\n
  \   ⚐ distributive:\n        description:\n          You can disable the use of
  the `distributive` package using `-f-distributive`.\n\n          Disabling this
  is an unsupported configuration, but it may be useful for accelerating builds in
  sandboxes for expert users.\n\n          If disabled we will not supply instances
  of `Distributive`\n\n        default: True\n        isManual: True\n    ⚐ indexed-traversable:\n
  \       description:\n          You can disable the use of the `indexed-traversable`
  package using `-f-indexed-traversable`.\n\n          Disabling this is an unsupported
  configuration, but it may be useful for accelerating builds in sandboxes for expert
  users.\n\n          If disabled we will not supply instances of `FunctorWithIndex`\n\n
  \       default: True\n        isManual: True\n✔ Success!\n```\n\n## Reverse dependency
  checks\n\n`arch-hs-rdepcheck` lists Haskell reverse dependencies in [extra] and
  the Cabal version ranges they require:\n\n```\n$ arch-hs-rdepcheck aeson\nReverse
  dependency: agda\n  Depends: >=1.1.2.0 && <2.3\n...\n```\n\nFor each reverse dependency's
  version in [extra], the command reads both the latest `.cabal` revision and revision
  0 from the local Hackage index. When their dependency ranges differ, both are shown
  under `latest revision` and `revision 0`. Equivalent ranges are shown only once.
  This also works without a candidate version.\n\nPass an optional version to check
  whether that version satisfies every listed range. Ranges that accept the current
  [extra] version but reject the candidate are marked in red as `rdep`. Ranges that
  reject both versions are marked in yellow as `rdep-old`. Both are counted separately,
  and the command exits with a non-zero status only for newly unmet ranges (or runtime
  errors):\n\n```\n$ arch-hs-rdepcheck aeson 3.0\nReverse dependency: agda\n  Depends:
  >=1.1.2.0 && <2.3\n  rdep: 3.0 is outside Depends range (>=1.1.2.0 && <2.3)\nReverse
  dependency: haskell-example\n  Depends: <2.2\n  rdep-old: 3.0 is outside Depends
  range (<2.2)\n...\nReverse dependency range check(s) failed: rdep=60, rdep-old=8\n```\n\nThis
  example assumes the current [extra] version is 2.2.3.0. If only existing failures
  remain, the command prints a warning such as `Existing reverse dependency range
  failure(s): rdep=0, rdep-old=8` and exits successfully. Ranges satisfied by the
  candidate are not counted, even if they reject the current version.\n\nPass multiple
  targets to check them together. Each target can have its own optional candidate
  version:\n\n```\n$ arch-hs-rdepcheck aeson text\n$ arch-hs-rdepcheck aeson 3.0 text
  2.1\n$ arch-hs-rdepcheck aeson 3.0 text\n```\n\nResults are combined by reverse
  dependency: each dependent package appears once, with the ranges and revision comparisons
  labeled by target. The final counts combine all targets, and newly unmet ranges
  for any target cause a non-zero exit status.\n\nCandidate versions form one upgrade
  set. When a target depends on another target, its candidate version's Cabal metadata
  supplies the ranges, including newly added dependencies. Targets without a candidate
  version and other reverse dependencies keep their [extra] versions. Existing failures
  are identified using the installed dependent's ranges; revision comparisons use
  the corresponding revisions of the candidate and installed versions.\n\nWhen revisions
  differ, each revision's counts accompany its ranges:\n\n```\nReverse dependency:
  haskell-example\n  latest revision (rdep=1, rdep-old=0):\n    Depends: <3\n    rdep:
  3.0 is outside Depends range (<3)\n  revision 0 (rdep=0, rdep-old=1):\n    Depends:
  <2.2\n    rdep-old: 3.0 is outside Depends range (<2.2)\n```\n\nThe final totals
  and exit status use the latest revision; revision 0 is shown for comparison. If
  only one revision can be parsed, its ranges are still shown and the other revision
  is labeled `unchecked` with the lookup error.\n\n## Planning coordinated updates\n\n`arch-hs-plan`
  checks a proposed update set against both its Cabal dependencies and the reverse
  dependencies that stay in [extra]:\n\n```\n$ arch-hs-plan aeson 2.2.3.0 scientific
  0.3.8.0\n$ arch-hs-plan aeson scientific\n```\n\nWithout `--solve`, explicit versions
  are checked exactly. When a version is omitted, the command selects the next newer
  preferred Hackage release. Every target uses its candidate metadata and the proposed
  versions of other targets. Packages outside the target set retain their installed
  versions. Library, executable, test, setup, and Haskell build-tool dependencies
  are included, using the installed GHC and the usual `-f PACKAGE:FLAG:true|false`
  assignments.\n\nGHC can also be requested as a toolchain update:\n\n```sh\n$ arch-hs-plan
  ghc\n$ arch-hs-plan --solve ghc\n$ arch-hs-plan --solve ghc 9.8.1 aeson\n```\n\nFor
  `ghc`, an omitted version selects the next stable upstream release after the repository
  compiler, not the latest release. Explicit versions are exact without `--solve`
  and minimums with it, just like other targets. The solver counts compiler release
  steps alongside package release steps when minimizing the update.\n\nGHC plans fetch
  [Stackage's upstream GHC bundled-library snapshots](https://github.com/commercialhaskell/stackage-content/blob/master/stack/global-hints.yaml);
  no built Arch GHC package is needed. Each candidate compiler fixes its entire Unix
  library bundle, including newly bundled and removed libraries. Missing or invalid
  compiler metadata is an error rather than a reason to guess library versions. Bundled
  libraries cannot be requested or upgraded independently. The snapshots do not specify
  versions of compiler-provided executables such as `hsc2hs`; dependencies on these
  tools are explicitly reported as unchecked, rather than assuming the tools were
  removed or retaining their old versions.\n\nThe planner rechecks every repository
  Haskell package with the proposed compiler and bundled versions, including `impl(ghc
  ...)` conditionals. Existing-failure comparisons still use the repository compiler
  and dependency versions, so newly activated incompatibilities block the plan. With
  `--solve`, blocking packages can be updated automatically. Only changed bundled
  versions, including added or removed libraries, are shown separately; unchanged
  versions and empty bundled summaries are hidden. Bundled libraries do not become
  individual package updates in the commit message or rebuild command.\n\nAdd `--solve`
  to search for a compatible combination:\n\n```\n$ arch-hs-plan --solve aeson scientific\n$
  arch-hs-plan --solve aeson 2.2.3.0 scientific\n```\n\nIn solve mode, explicit versions
  are minimums. The search starts at those minimums (or the next newer preferred release
  for an unversioned target) and advances through preferred releases in ascending
  order. When a dependency or reverse dependency blocks the plan, the solver can automatically
  add that package to the update set. It then checks the added package's dependencies
  and reverse dependencies, expanding recursively as needed. A missing Haskell dependency
  available on Hackage can also be added as a new package.\n\nThe solver minimizes
  the **total number of release steps beyond the starting set**. Adding a package
  at its next preferred release costs one step; each further release costs another.
  For a new package, its earliest preferred release costs one step. Alternative combinations
  keep their own update sets, so an added package does not force unrelated branches
  to update it. If one step for A avoids three steps for B, the one-step solution
  is chosen. Equal-cost solutions are ordered deterministically by package name and
  version. Explicit minimums may name deprecated versions; automatically selected
  versions respect Hackage's preferred-version ranges. No package is downgraded.\n\nThe
  output lists installed and proposed versions, marking automatically included packages
  with `(added by solver)`. It also shows the number of candidate sets checked and
  any blocking dependency or reverse dependency ranges. If no working set can be found,
  it reports the remaining conflicts and exits unsuccessfully.\n\nPlans with version
  changes also print a commit message listing all updated packages and versions on
  one comma-separated line, including packages added by the solver. A copyable `genrebuild
  -H <pkgbases...>` command follows, using the corresponding Arch package bases of
  all packages in the plan and respecting package name presets. Blocked plans include
  both too, so their updates can be tried manually.\n\nThe planner compares the latest
  Cabal revision with revision 0 for the chosen packages and their reverse dependencies,
  showing only dependencies whose check outcomes change. Range-only differences are
  hidden when both revisions pass, block, warn, or remain unchecked; adding or removing
  an already-satisfied dependency is also hidden. Changes between those outcomes,
  including whether a revision can be checked, remain visible. Version selection and
  the final status use the latest revision; revision 0 is shown for comparison.\n\nExisting
  repository incompatibilities are yellow `dep-old` or `rdep-old` warnings and do
  not block a plan. Missing metadata for existing reverse dependencies is reported
  as an unchecked warning. Newly introduced incompatibilities and missing or unparseable
  candidate metadata still block the plan.\n\nFor dependencies already used by the
  installed package in the same dependency category, candidate upper bounds already
  exceeded by the repository version are also warnings, even if the installed package's
  metadata omitted those bounds. This keeps incremental releases available instead
  of skipping ahead solely to accommodate an already newer dependency. New dependencies,
  newly unmet lower bounds, and dependency updates that newly cross an upper bound
  still block the plan. Warnings do not establish build compatibility.\n\nThe planner
  reads the latest revisions from the local Hackage index and accepts the usual `--extra`
  and `--hackage` paths. It does not build or install packages, validate non-Haskell
  system dependencies or ABI compatibility, or determine a build order. GHC and its
  bundled libraries remain fixed unless `ghc` is explicitly requested. Only GHC plans
  fetch upstream metadata; ordinary package plans remain local. A GHC plan checks
  ecosystem metadata compatibility, not compiler bootstrap requirements or Arch-specific
  changes to the upstream bundle. Refresh the local databases before planning against
  newer repository or Hackage metadata.\n\n## Sync\n\nFor Hackage distribution maintainers,
  `arch-hs-sync check` compares Haskell package versions in [extra] with Hackage:\n\n```\n$
  arch-hs-sync check\nhaskell-aeson in [extra] has version 2.2.3.0, but linked aeson
  in Hackage has newer versions 2.2.3.1, 2.2.3.2\n```\n\nOnly non-deprecated Hackage
  versions newer than the [extra] version are reported. Version checks use Hackage
  index metadata, so they also report packages whose `.cabal` format is newer than
  the Cabal library used to build `arch-hs`.\n\nGHC and its bundled libraries and
  tools, including `hsc2hs`, are excluded by default because they are updated with
  the compiler rather than independently. This includes packages listed in the repository
  `provides` metadata for `ghc` and `ghc-libs`. Pass `--show-ghc-libs` to include
  them.\n\nPass `--depcheck` to check whether each newer Hackage version is currently
  upgradable with the packages already in [extra]. A version is shown as `ok` only
  when both its dependency ranges are satisfied by [extra] and all current reverse
  dependency ranges accept that version:\n\n```\n$ arch-hs-sync check --depcheck\nhaskell-aeson
  in [extra] has version 2.2.3.0, but linked aeson in Hackage has newer versions 2.2.3.1
  (existing: rdep-old=2), 2.2.3.2 (blocked: dep=1, rdep=1, rdep-old=2)\n```\n\n`rdep`
  counts ranges that accept the current [extra] version but reject the candidate.
  `rdep-old` counts ranges that reject both versions. Each failing range is counted
  separately, including different dependency sources of the same reverse dependency.
  Ranges satisfied by the candidate are not counted, even if they reject the current
  version.\n\n`dep` counts newly unmet direct dependency ranges. `dep-old` counts
  failing ranges for dependencies whose requirements are already unmet for the installed
  package, comparing runtime dependencies separately from build and test dependencies.
  Each candidate is compared with the installed version's latest Cabal revision, even
  if that version is deprecated. Dependencies removed or satisfied by the candidate
  are not counted. If the installed version's metadata cannot be read or checked,
  direct dependency failures remain blocking rather than being assumed existing.\n\nCandidates
  with only existing direct or reverse dependency failures are shown in yellow as
  `existing: dep-old=N, rdep-old=M`, omitting zero counts. Candidates with newly unmet
  direct or reverse dependency ranges are shown in red as `blocked`, with existing
  failures counted separately when present. Existing failure warnings do not establish
  build compatibility.\n\nFor example, both `tree-diff` 0.3.3 and 0.3.4 require `ansi-wl-pprint
  ^>=1.0.2`, which rejects [extra]'s 1.1.1. Since upgrading does not introduce that
  failure, 0.3.4 is shown as `existing: dep-old=1`, not `blocked: dep=1`.\n\nIf a
  candidate's `.cabal` file cannot be parsed, `--depcheck` marks it as `unchecked:
  cabal parse failed` and continues checking the other candidates. Use `--verbose`
  to include the lookup error.\n\nAdd `--verbose` with `--depcheck` to list the dependency
  and reverse dependency ranges that fail for a version, with existing failures labeled
  `dep-old:` and `rdep-old:`:\n\n```\n$ arch-hs-sync check --depcheck --verbose\nhaskell-aeson
  in [extra] has version 2.2.3.0, but linked aeson in Hackage has newer versions 2.2.3.2
  (blocked: dep=1, rdep=1, rdep-old=1)\n  2.2.3.2:\n    dep: scientific requires >=0.3
  && <0.4, [extra] has 0.4\n    rdep: haskell-example Depends requires >=2.2 && <2.2.3.2\n
  \   rdep-old: agda Depends requires >=1.1.2.0 && <2.2\n```\n\nOther sync commands,
  including `submit` and `list`, are documented in `arch-hs-sync --help`.\n\n## Limitations\n\n*
  `arch-hs` will run into error, if solved targets contain cycle. Indeed, circular
  dependency lies ubiquitously in hackage because of tests,\nbut basic cycles are
  resolved manually in [extra] by maintainers. So after the provider simplification,
  `arch-hs` can eliminate these cycles.\nNevertheless, if the target introduces new
  cycle or it dependens on a package in an unknown cycle, `arch-hs` will throw `CyclicExist`
  exception.\n\n* `arch-hs` is not able to handle with complicated situations: the
  libraries of a package partially exist in hackage, some libraries include external
  sources, etc. \n\n* `arch-hs`'s functionality is limited to dependency processing,
  whereas necessary procedures like\nfile patches, version range processes, etc. They
  need to be done manually, so **DO NOT** give too much trust in generated PKGBUILD
  files.\n\n## Alpm Support\n\n[alpm](https://www.archlinux.org/pacman/libalpm.3.html)
  is Arch Linux Package Management library.\nWhen running on Arch Linux, `arch-hs`
  can load `extra.db` and files dbs through this library instead of using its internal
  parser.\n`arch-hs` provides a Cabal flag `alpm` to build this feature:\n\n```\ncabal
  build -f alpm\n```\n\nThis flag is enabled by default in `arch-hs` Arch Linux package.\nCompiled
  with `alpm`, `arch-hs` still reads pacman databases from `/var/lib/pacman/sync`
  by default.\nPass `--alpm` to load pacman databases through libalpm explicitly:\n\n```\narch-hs
  --alpm -o ~/test gi-gdk\n```\n\nFor commands that load only `extra.db`, such as
  `arch-hs-diff`, `arch-hs-sync`, `arch-hs-rdepcheck`, and `arch-hs-plan`, `--alpm`
  applies to `extra.db`.\nFor `arch-hs`, `--alpm` applies to both `extra.db` and files
  dbs.\nWhen `--alpm` is used, explicit `--extra` and `--files` paths are ignored.\n\n\n##
  Contributing\n\nIssues and PRs are always welcome. **\\_(:з」∠)\\_**\n"
