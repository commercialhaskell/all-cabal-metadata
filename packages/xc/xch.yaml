description: |
  # Xch
  Standard Guidance for Space Data Exchange

  [ASTM F3514-21](https://store.astm.org/catalog/product/view/id/1126697/)

  Usage

  ```
  xch --help
  xch w --excellent | xch r
  ```

  Install

  ```
  cabal install xch
  ```

  Development

  ```
  cabal build
  cabal haddock
  cabal test
  cabal run xch -- --help
  ```
