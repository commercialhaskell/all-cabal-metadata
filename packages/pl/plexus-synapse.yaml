changelog: |
  # Changelog for plexus-synapse

  ## 4.2.0

  A call follows the files it reads (SYNAPSE-43, SYNAPSE-44).

  ### Added

  - **`--watch`** (SYNAPSE-43): the call is made at once and again each time a
    file it reads with `@FILE` changes — the command as written, run again as
    a process of its own, the files read anew. stderr says what changed, how
    the call ended, how long it took and how long after the save its answer
    was whole; stdout carries the answers alone. A truncate and its write are
    one call; changes during a call are one more call; a failing call ends
    nothing; Ctrl-C ends it, 130. Refused, 2, for a command that reads no
    file or reads stdin. `Synapse.Watch`; test: `watch-test` (25).
  - **A record in a list, a field a flag** (SYNAPSE-44): `--sources.name
    clock --sources.source @clock.svelte` is one record of the list
    `sources`, built by the record's type; a field given again begins the
    next record. So a field of a record can come from a file. Before, a
    dotted key into a list was refused. Test: `parse-test` (84).

  ## 4.1.1

  synapse steps into a schema's slots (NEST-21, SYNAPSE-41). Requires
  `plexus-protocol >= 0.8` (its `MethodRole` carries the peer slot and the
  dynamic child's slot type).

  ### Fixed

  - **A dynamic child's names are navigated** (NEST-21). A segment that is
    neither a child nor a method of a schema with a `dynamic_child` slot
    (NEST-5: plexus-core's `config.{key}`) is asked of the service as the
    slot's instance (`<path>.<segment>.schema`) and stepped into, so
    `synapse … config transport insecure_ws set --value true` reaches
    `config.transport.insecure_ws.set`.
  - **A peer slot's names are navigated** (SYNAPSE-41, NEST-7). After a method
    marked `peer` (plexus-dyn's `dyn.peer`) the next segment is a peer's name:
    `synapse … dyn peer <name> <ns> <method>` reaches
    `dyn.peer.<name>.<ns>.<method>`, whether or not the slot lists its peers
    as children.
  - **A slot's instance is a tree of its own.** A peer is another service, so
    its activations' hashes (its `dyn` has the host's `dyn`'s) are no longer a
    `Cycle detected` with the path that reached it; the same for a dynamic
    child's keys, which share their type's hash.
  - A name the service says is not there (activation or method not found, or a
    slot's `not_found`) is still `Command not found`; any other failure while
    asking for it — an outage, a refusal, a sign-in — is that failure, never
    `Command not found`. Test: `nav-dynamic-test` (11).

  ## 4.1.0

  bidir removed (ASK-1, ASK-3); plexus 0.10's schemas read (NEST-10). Breaking
  under the PVP.

  ### Breaking

  - **bidir is gone.** `--bidir-mode`, `--bidir-cmd`, `--bidir-respond`, the
    `respond` subcommand and `Synapse.Bidir` are removed, with spec/08's
    `request` item and `{ns}.respond` (plexus-protocol 0.7). Nothing replaces
    them: synapse has no in-call or protocol-wide confirmation, and an item a
    service names `needs_input` is printed like any other. IR 3.1 is 3.0
    without `mdBidirType` / `mdBidirResponseType` / `mdBidirResponseSchema`
    (an older IR's are read past). Requires `plexus-protocol >= 0.7`.
  - **Holder protocol 6.** The connection holder's socket is
    `$XDG_RUNTIME_DIR/synapse/holder-6.sock` (4 carried the input half; 5 was
    VISION-7's unmerged question routing, never reused; 6 relays plexus-protocol
    0.7's items, with no `request` item, and routes nothing). A run never uses
    or replaces a holder of another protocol (3.x's `holder-2.sock`, 4.0.0's
    `holder-4.sock`), nor the reverse; they run side by side.

  ### Changed

  - plexus-core 0.10's `MethodRole` is read whole: a peer slot is a
    `static_child` marked `peer` with its `interface` (NEST-7), and a
    `dynamic_child` carries its slot's type, `child` (NEST-5).

  ## 4.0.0

  Everything since 3.17.3 (3.17.4 was never published; its change is listed here).

  ### Breaking

  - **IR 3.0, on the plexus 0.7 schema.** Requires `plexus-protocol >= 0.6`.
    A method's `returns`, `error`, `progress` and `cardinality` are read from
    its schema, never guessed; servers on the published 0.7.0 line are still
    read, cardinality taken from the method's own `streaming` flag. A title
    collision (two types under one title) refuses that activation by name
    (`-i` exits 65 and says what was left out) instead of failing the whole
    walk.
  - **Holder protocol 4.** The connection holder's socket is
    `$XDG_RUNTIME_DIR/synapse/holder-4.sock`. A 4.0 run never uses or
    replaces a 3.x holder (`holder-2.sock`), nor the reverse; the two run
    side by side.
  - **Schema cache moved** to `$XDG_CACHE_HOME/synapse/schemas-4`
    (`~/.cache/synapse/schemas-4`). 3.x's `schemas` directory is never read,
    so a 4.0 run and a rolled-back 3.x never share an entry. The first 4.0
    run against a service fetches its schemas again.
  - **A failed stream exits non-zero.** An error item, or a data item whose
    content has `type: error`, sets exit status 1. Services report their
    failures in band; scripts that relied on exit 0 after such a stream will
    now see 1.
  - **One holder per user**, not one per address and agent. The agent rides
    in each request; a connection whose server is gone is let go at once; at
    most 256 connections are held, the longest idle closed first; the newest
    synapse takes over holding.

  ### Added

  - **Streaming input (`Input<T>`, plexus-wire spec/10).** `--input -` (stdin)
    or `--input @FILE` sends a method's input half: lines, NDJSON items, or
    raw bytes as binary frames (`--chunk N`, 4096 by default, at most
    16 MiB), sent as the service grants credit, ended at EOF, carried through
    the holder. A disconnect is reported with sent / acked / unacked counts
    and never resent (exit 69); typed closes exit 70, 65 or 77, a failed read
    74. `--progress` prints sent / acked / credit on stderr once a second. A
    flag whose name a method parameter already has (`input`, `chunk`,
    `progress`) becomes `--input-stream`, `--input-chunk` or
    `--input-progress`. The IR reads a bytes input as string/binary.
  - **The service's own `ir` first.** When a service's root schema lists an
    `ir` method, synapse asks it for the whole IR in one call instead of one
    schema call per activation; otherwise it walks the raw schemas as before.
    A 0.7.0 service spends no call on it.
  - The server's own error message is shown and kept; an unknown error kind
    is rendered `kind: message`, and a missing grant as the Rust side writes
    it. Re-sign-in and cache repair work against both 0.8 and 0.7.0 servers.

  ### Changed

  - `cabal.project` no longer lists `../plexus-protocol`; it comes from
    Hackage.
  - The suites that need a live service (`cli-test`, `websocket-raw-test`,
    `ir-test`, `bidir-integration-test`) are opt-in behind the manual flag
    `live-tests` (`cabal test -f live-tests`), so a default `cabal test`
    needs nothing running.
changelog-type: markdown
description: |
  # synapse

  The command line of every Plexus RPC service: it reads a service's own
  schema and offers its activations, methods and flags.

  ## Most people want plexus-rpc

  [plexus-rpc](https://github.com/hypermemetic-ai/plexus-rpc) is the front
  door to Plexus RPC: its README builds a service in a few lines of Rust and
  calls it. The service in every example below is that one: `myservice`, with
  an `echo` activation, on `ws://127.0.0.1:4444`.

  ## Install

  The package is `plexus-synapse` and its executable is `synapse`. It builds
  with GHC 9.8.4 and cabal. Version 4.2.0 builds from this repository, with
  [plexus-protocol](https://github.com/hypermemetic-ai/plexus-protocol) 0.8
  checked out beside it:

  ```sh
  git clone https://github.com/hypermemetic-ai/synapse
  git clone https://github.com/hypermemetic-ai/plexus-protocol
  cd synapse
  echo 'packages: ../plexus-protocol/' > cabal.project.local
  cabal update
  cabal install exe:synapse -w ghc-9.8.4
  synapse --version
  ```

  [Hackage](https://hackage.haskell.org/package/plexus-synapse) holds
  `plexus-synapse` 4.1.0.

  ## An example

  Name the service, then an activation, and synapse lists its methods.

  <!-- plexus-rpc: examples/echo/out/echo.txt -->
  ```console
  $ synapse myservice echo
  echo v0.1.0
    Say things back.

  USAGE
    synapse myservice echo <method> [flags]

  METHODS
    count     Ticks from 1 up to `to`.
    schema    Get plugin or method schema

  Run 'synapse myservice echo <method> --help' for its options.
  Run 'synapse --help' for synapse's own options.
  ```

  A method's flags are its parameters.

  <!-- plexus-rpc: examples/echo/out/help.txt -->
  ```console
  $ synapse myservice echo count --help
  Ticks from 1 up to `to`.

  Usage: synapse myservice echo count --to <TO>

  Options:
    --to <uint32>  the last tick

  A value may be read from a file (--flag @FILE) or stdin (--flag -);
  @@text sends a literal @text.

  Example:
    synapse myservice echo count --to 1

  Run 'synapse --help' for synapse's own options.
  ```

  A call prints each item of the answer as it arrives.

  <!-- plexus-rpc: examples/echo/out/count.txt -->
  ```console
  $ synapse myservice echo count --to 3
  n: 1
  type: tick
  n: 2
  type: tick
  n: 3
  type: tick
  ```

  On a service with sign-in, a caller signs in once with a key, and every
  later call carries the session.

  <!-- plexus-rpc: examples/users/out/login.txt -->
  ```console
  $ synapse _login myservice --key dev --as dev
  signed in to myservice at 127.0.0.1:4444 as dev
    principal key:b379e10bed307ff7a5f367ef07433434729d4ab7589cace401cd957da8c73549
    scope     the key's own grants
    until     2026-11-12 03:22:56 UTC
    kept in   ~/.plexus/sessions/127.0.0.1_4444/dev.json
  ```

  <!-- plexus-rpc: examples/users/out/hello.txt -->
  ```console
  $ synapse myservice echo hello
  you: key:b379e10bed307ff7a5f367ef07433434729d4ab7589cace401cd957da8c73549
  ```

  Each block above is a file under plexus-rpc's
  [`examples/`](https://github.com/hypermemetic-ai/plexus-rpc/tree/main/examples),
  which `scripts/examples.sh` there writes again from synapse's own output.

  ## More

  - [Invoking](docs/invoking.md): the order of a command line, flags, lists, values from a file or stdin.
  - [Finding a service](docs/finding-a-service.md): the registry, `-H` and `-P`, `--url` and TLS.
  - [Signing in](docs/signing-in.md): keys, `_login`, `_logout`, sessions, `--as`.
  - [Credentials](docs/credentials.md): `--token`, `--cookie`, `--header` and a service's stored defaults.
  - [Output](docs/output.md): `-j`, `--raw`, `-o FILE`, templates, exit codes.
  - [Discovery](docs/discovery.md): listings, `--help`, `_find`, `-s`.
  - [Outages and the connection holder](docs/outages.md): `--reconnect-for`, `_hold`, `--no-hold`, the schema cache.
  - [A stream in](docs/input-streams.md): `--input` from stdin or a file.
  - [The IR](docs/ir.md): `-i`, what a client generator reads.
  - [Developing](docs/developing.md): building, the tests, the `_self` checks.
  - [Changelog](CHANGELOG.md)

  MIT.
