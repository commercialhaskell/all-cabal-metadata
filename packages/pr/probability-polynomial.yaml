changelog: "# Revision history for `probability-polynomial`\n\n## 1.0.2.0 - 2026-11-05\n\n###
  Added\n\n* New module `Numeric.Function.Piecewise.Polynomial` containing:\n    *
  Function `integral` to compute the continuous antiderivative of a piecewise polynomial\n\n##
  1.0.1.0 — 2025-09-26\n\n### Added\n\n* Add `beforeOrAt` and `after` for mixed measures\n*
  Add `beforeOrAt` and `after` for discrete measures\n* Add `instance Functor Moments`\n*
  Allow `containers-0.8`, `QuickCheck-2.16`\n\n## 1.0.0.1 — 2025-01-17\n\n### Fixed
  \n\n* Improved implementation of `findRoot` to handle repeated roots\n* Added test
  to check repeated roots handled correctly\n\n## 1.0.0.0 — 2024-12-23\n\n* Initial
  release\n    * Polynomials\n    * Finite, signed measures on the number line\n    *
  Probability measures\n"
