changelog: |+
  # Changelog

  - 0.2.6 (2026-10-10)
    * Fixes several decoding bugs: inputs with fewer than six checksum
      characters are now rejected, bech32m decoding no longer accepts
      mixed-case input, and all-uppercase input is now accepted, per
      BIP173. 'verify' follows the same case rules.
    * Improves decoding performance by roughly 1.5x.
    * Adds the BIP173 and BIP350 test vectors to the test suite.

  - 0.2.5 (2026-05-16)
    * Improves bech32 encode/decode performance by about 2x.

  - 0.2.4 (2025-12-28)
    * Adds an 'llvm' build flag and tests with GHC 9.10.3.

  - 0.2.3 (2025-06-21)
    * Minor performance improvements and internal housekeeping.

  - 0.2.2 (2025-02-28)
    * Various optimizations, including roughly 2x faster decoding
      performance.

  - 0.2.1 (2025-01-07)
    * Removes the 'primitive' dependency.

  - 0.2.0 (2025-01-04)
    * Adds bech32/bech32m/base32 decoding.
    * Fixes a bug in which mixed-case HRP's would result in encodings with
      invalid checksums (IIRC this also affects the Haskell reference
      implementation).

  - 0.1.2 (2024-12-15)
    * Minor performance improvements.

  - 0.1.1 (2024-12-14)
    * Simply improves generated Haddocks.

  - 0.1.0 (2024-12-14)
    * Initial release, supporting encoding and checksum verification for
      bech32 and bech32m.

