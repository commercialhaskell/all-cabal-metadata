changelog: |
  # Changelog

  - 0.1.0 (2026-10-10)
    * Breaking: the API is redesigned and now lives entirely in
      Lightning.Protocol.BOLT9, with snake_case names. The submodules,
      the bit-index newtypes, the name-based feature lookups and the
      duplicate bit operations are gone.

    * Breaking: features are a closed enumeration matching the BOLT #9
      table at lightning/bolts@1aadb719, which adds zero_fee_commitments,
      option_splice and option_onion_messages_only_channels.

    * Breaking: contexts follow the spec. C- and C+ are no longer
      contexts, and channel_type is validated as a BOLT #2 channel type
      (the new ChannelType) rather than as a feature vector.

    * FeatureVector preserves received bytes exactly for re-encoding,
      compares equal regardless of leading zero bytes, and gains union.

    * Fixes remote validation, which skipped the dependency check, let
      bits above 65535 wrap onto known features, and applied the init
      rules in every context. Local validation now rejects unknown bits,
      and a dependency on an ASSUMED feature counts as met.

    * Fixes setting a feature, which could leave both bits of its pair
      set.

    * Drops the dependency on containers.

  - 0.0.1 (2026-04-18)
    * Initial release.
changelog-type: text
description: |-
  Lightning Network feature flags, per
  [BOLT #9](https://github.com/lightning/bolts/blob/master/09-features.md).
  Provides an abstract feature vector type that preserves its wire
  bytes, the table of known features with their contexts and
  dependencies, sender- and receiver-side validation for each context,
  and BOLT #2 channel types.
