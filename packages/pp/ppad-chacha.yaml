changelog: |+
  # Changelog

  - 0.3.2 (2026-11-14)
    * Adds Crypto.Cipher.ChaCha, with ChaCha keystreams of 8, 12, or 20
      rounds.

  - 0.3.1 (2026-10-31)
    * Uses SSE2 on x86_64, along with AVX2 on CPUs that support it,
      detected at runtime. With AVX2, 'cipher' is roughly 3.5x faster on
      short inputs and over 10x faster on long ones.

  - 0.3.0 (2026-09-06)
    * Adds a counter overflow error.

  - 0.2.2 (2026-05-16)
    * Features order-of-magnitude performance improvements, especially
      on ARM platforms where NEON intrinsics are available.

  - 0.2.1 (2025-12-28)
    * Adds an 'llvm' build flag and tests with GHC 9.10.3.

  - 0.2.0 (2025-06-21)
    * Both the ChaCha block function and stream cipher are now total,
      returning values of 'Left InvalidKey' or 'Left InvalidNonce' when
      supplied with the corresponding bad inputs.

  - 0.1.0 (2025-03-09)
    * Initial release, supporting the chacha20 stream cipher and block
      function.

