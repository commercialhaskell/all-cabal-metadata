changelog: |+
  # Changelog

  - 0.4.0 (2026-11-16)
    * Mnemonic encoding and validation now run in constant time, but for
      the length of the mnemonic in bytes. Seed derivation is constant
      time for ASCII mnemonics and passphrases (ICU's NFKD is not, on
      non-ASCII text).
    * Embeds the wordlists, rather than reading them from etc/ at
      runtime, which failed outside the package source.
    * Fixes a table lookup indexed by the checksum byte.
    * 'Wordlist' is now abstract.
    * Words are separated by ASCII whitespace or U+3000 only.

  - 0.3.3 (2026-02-25)
    * Bumps ppad-sha{256,512} dependencies.

  - 0.3.2 (2026-01-10)
    * Bumps some dependency lower bounds.

  - 0.3.1 (2025-12-28)
    * Bumps some dependency lower bounds.
    * Adds an 'llvm' build flag and tests with GHC 9.10.3.

  - 0.3.0 (2025-06-21)
    * The 'mnemonic' and 'seed' function families are now total, returning
      'Nothing' when supplied with bad inputs.

  - 0.2.1 (2025-03-02)
    * Various documentation improvements.

  - 0.2.0 (2025-02-27)
    * 'seed' now validates the words in the mnemonic supplied to it;
      'seed_unsafe' has been added as a function that works for any
      wordlist.

  - 0.1.1 (2025-02-27)
    * Include wordlists in generated Haddocks.

  - 0.1.0 (2025-02-27)
    * Initial release.


