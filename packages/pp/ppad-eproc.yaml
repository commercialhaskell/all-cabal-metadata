changelog: |
  # Changelog

  - 0.5.5 (2026-11-20)
    * The test suite draws from ppad-random's xoshiro256++, in place of
      its own generator. The library is unchanged.

  - 0.5.4 (2026-11-15)
    * Fixes Numeric.Eproc.Mixture.update turning a component's infinite
      log e-value into NaN: the mixture is infinite too, and rejects.
    * Numeric.Eproc.TwoSample mixes and latches its components through
      Numeric.Eproc.Mixture, as its own copy of that logic did; its
      results are unchanged. An interval null with no clip bounds, which
      mixed no component, is now refused (InvalidComponentCount).
    * One log-sum-exp (Numeric.Eproc.Common.log_sum_exps) under Mixture
      and Merge. Paired's and Mixture's documentation point to TwoSample
      and Merge.

  - 0.5.3 (2026-11-15)
    * Adds to Numeric.Eproc.TwoSample the anytime-valid p-value and
      each component's supremum so far (log_evalue_sup_sign,
      log_evalue_sup_magnitude, log_evalue_sup_cdf): which component's
      evidence peaked is the shape of a difference found.

  - 0.5.2 (2026-11-15)
    * Adds Numeric.Eproc.Merge: the mean of e-values (an e-value under
      any dependence), their product (under sequential validity), and
      the e-BH procedure (Wang & Ramdas 2022).
    * Adds Numeric.Eproc.ConfSeq.Bernoulli: an anytime-valid
      confidence sequence for a Bernoulli rate by Robbins' uniform
      mixture, exact at any rate and resumable from counts.
    * Adds Numeric.Eproc.TwoSample: a two-sample test of equality in law
      over an antisymmetric statistic, hedged over its sign, its
      magnitude clipped at several bounds, and indicators at cut points;
      an interval null on the clipped mean (configInterval); and the
      warmup calibration of its clip bounds and cut points.

  - 0.5.1 (2026-10-11)
    * Supports GHC 9.8 (base 4.19), where Prelude does not export
      foldl'.

  - 0.5.0 (2026-08-21)
    * Adds Numeric.Eproc.Bounded.configInterval: interval nulls
      H_0: m_lo <= E[x | F] <= m_hi for the two-sided bounded-mean
      test, with the positive-direction process centred at m_hi and
      the negative-direction process at m_lo. The point-null 'config'
      is the degenerate case m_lo = m_hi and behaves exactly as
      before.
    * Adds InvalidNullInterval to ConfigError (a breaking change for
      exhaustive matches on that type).

  - 0.4.1 (2026-07-04)
    * Fixes a bug that made confidence sequences needlessly conservative.

  - 0.4.0 (2026-07-03)
    * Adds calibrated evidence accessors to every test module:
      'log_evalue', 'log_evalue_sup', and the anytime-valid 'p_value'.
    * Adds Numeric.Eproc.Mixture: uniform convex mixtures of
      e-processes, for testing a null against a union of qualitatively
      different alternatives at a single Ville threshold.
    * Adds Numeric.Eproc.ConfSeq: anytime-valid confidence sequences
      for bounded means, via the hedged-capital construction of
      Waudby-Smith & Ramdas (2024).
    * Adds InvalidComponentCount and InvalidGridSize to ConfigError.

  - 0.3.0 (2026-07-02)
    * Introduces a breaking API change: 'log_wealth' now returns the
      current log-wealth, whereas the supremum-thus-far statistic is
      exposed as 'log_wealth_sup'.

  - 0.2.2 (2026-07-02)
    * Adds a Numeric.Eproc.Bernoulli.TwoSided module for a two-sided
      Bernoulli rate test.

  - 0.2.1 (2026-07-02)
    * Two-sided bounded-mean tests now reject faster, or at least never
      later.

  - 0.2.0 (2026-06-28)
    * Introduces several breaking API changes, along with various internal
      refinements:

      * config functions now return 'Either ConfigError Config' and reject invalid
        parameters.

      * the 'Bernoulli.config' argument order changed from (a, p, b) to (p, a, b),
        for consistency with other modules.

      * log_wealth now returns the supremum, not the current value.

  - 0.1.0 (2026-06-03)
    * Initial release, supporting anytime-valid sequential testing via
      e-processes: bounded-mean, Bernoulli, and paired two-sample tests,
      with fixed-lambda, aGRAPA, and ONS bettors.
changelog-type: text
description: |-
  Anytime-valid sequential hypothesis testing and estimation for
  bounded random variables, via the e-process / betting framework of
  Waudby-Smith and Ramdas (2024). Provides bounded-mean, paired
  two-sample, and one- and two-sided Bernoulli rate tests with fixed,
  adaptive (aGRAPA), and online Newton bettors; anytime-valid p-values
  and e-values; uniform convex mixtures of e-processes; and
  time-uniform confidence sequences for bounded means.
