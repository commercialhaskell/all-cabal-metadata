changelog: "# Changelog for srtree-db\n\n## 0.1.1.0\n\n- Added cli tools to populate
  and fit data into a database \n\n## 0.1.0.0\n\n- Initial release\n- Two-section
  data model: dataset-agnostic e-graph section + per-dataset fit section\n- SQLite
  and PostgreSQL backends\n- Out-of-core import with page store\n- Dataset-aware queries:
  topN, pareto, paretoBySize, distributionCounts\n- Frontier re-saturation support\n-
  Streaming page export via cursor (O(1) memory)\n"
changelog-type: markdown
description: |-
  Reusable storage layer for srtree multiset e-graphs:
  a driver-neutral serialization of the Algorithm.EqSat.Store
  rows (backed by SQLite and PostgreSQL) plus SQL queries
  (topN, pareto, distribution counts, patterns).
  Dataset-specific fit tables are a later phase.
