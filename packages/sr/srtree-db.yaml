changelog: |
  # Changelog for srtree-db

  ## 0.1.0.0

  - Initial release
  - Two-section data model: dataset-agnostic e-graph section + per-dataset fit section
  - SQLite and PostgreSQL backends
  - Out-of-core import with page store
  - Dataset-aware queries: topN, pareto, paretoBySize, distributionCounts
  - Frontier re-saturation support
  - Streaming page export via cursor (O(1) memory)
changelog-type: markdown
description: |-
  Reusable storage layer for srtree multiset e-graphs:
  a driver-neutral serialization of the Algorithm.EqSat.Store
  rows (backed by SQLite and PostgreSQL) plus SQL queries
  (topN, pareto, distribution counts, patterns).
  Dataset-specific fit tables are a later phase.
