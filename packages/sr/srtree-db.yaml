changelog: "# Changelog for srtree-db\n\n## 0.1.2.0\n\n- **Split-DB architecture**:
  e-graph and per-dataset fit data now live in separate SQLite files to eliminate
  WAL bloat during fitting. Schema split into `egraphSchemaSQL` and `fitSchemaSQL`.\n-
  **Blob format**: switched `cstore_page` from hex-encoded TEXT to binary BLOB; added
  `SqlBlob` and `loadPagesBulk` for bulk page preloading.\n- **New CLI subcommands**:
  `ingest` (streaming line-by-line expression parser with batched inserts), `eqsat`
  (standalone eqsat on paged graphs), `fitdata` (resumable batch fitting with periodic
  commit checkpoints), `status` (fit summary per dataset), `refit` (clear and re-fit
  from scratch).\n- **fitdata performance overhaul**: batch page preloading (`loadPagesBulk`),
  persistent page cache, sub-expression expansion for bulk dependency loading, analytical
  fitting for parameter-free expressions, parallel fitting with `setMTPopParallel`,
  `--no-header` flag (default True), `compileLossAndGrad` reuse across restarts.\n-
  **Ingest performance**: `writeNode` writes class pages inline (O(1) per new class);
  removed `writeMissingPages`. Added `--reparam` flag for float constants to parameters.\n-
  **Frontier re-saturation**: `frontier` table marks changed classes; matcher restricted
  to frontier via `cpsBeginFrontier`/`cpsEndFrontier`.\n- **Page streaming**: `pushFit`
  streams the page store via `SqlBackend.streamPages` (SQLite cursor / Postgres grid
  fallback), bounded O(1) memory.\n- **Legacy cleanup**: removed `fit` table; `enode_child`
  populated during eqsat by write-through.\n- **NaN propagation**: parameter-less
  subexpressions that evaluate to NaN/Infinity detected analytically and propagated
  to ancestors.\n- **DB bloat fixes**: `INSERT OR REPLACE` replaced with upsert; batched
  transactions; secondary indexes dropped; `PRAGMA journal_mode=DELETE` in fitdata.\n-
  **In-memory vs DB eqsat equivalence test**: `testEquivInMemDB` proves paged and
  in-memory eqsat converge to the same merge structure.\n- **Extract module**: `extractTreeFromDB`
  (standalone SRTree reconstruction from DB pages) and `reconstructFromCache` (pure
  IntMap-based).\n- **Conversion script**: `tools/convert_db.py` converts single-DB
  to split format.\n\n## 0.1.1.0\n\n- Added cli tools to populate and fit data into
  a database \n\n## 0.1.0.0\n\n- Initial release\n- Two-section data model: dataset-agnostic
  e-graph section + per-dataset fit section\n- SQLite and PostgreSQL backends\n- Out-of-core
  import with page store\n- Dataset-aware queries: topN, pareto, paretoBySize, distributionCounts\n-
  Frontier re-saturation support\n- Streaming page export via cursor (O(1) memory)\n"
changelog-type: markdown
description: |-
  Reusable storage layer for srtree multiset e-graphs:
  a driver-neutral serialization of the Algorithm.EqSat.Store
  rows (backed by SQLite and PostgreSQL) plus SQL queries
  (topN, pareto, distribution counts, patterns, dataset-aware fit).
