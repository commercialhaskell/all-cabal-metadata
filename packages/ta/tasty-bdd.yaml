changelog: |
  # Changelog

  ## 0.1.0.2 — release candidate

  - Verify GHC 9.12.3 support and migrate development from Stack/hpack to Cabal 3.0 and a locked Nix build.
  - Point package homepage, source repository and issue links to `lambdasistemi/tasty-bdd` following the repository transfer.
  - Bound dependencies and add executable build, package, formatting, lint, documentation and source-archive checks.
  - Add regression tests for recursive decorators over Tasty dependencies, including blocked tests after a failed prerequisite.
  - Add a compiled example, contributor documentation and Spec Kit records.
  - Enforce the published 0.1.0.1 source API and Hackage-quality archive/Haddock checks in CI. Document all exported lenses explicitly and test `onEach` across every Tasty wrapper.
  - Deploy MkDocs to GitHub Pages and verify the served commit and generated bytes.
  - Preserve the public API and published 0.1.0.1 behavior, including the `Succeded` spelling and dependency-wrapper traversal fix.

  This candidate has not been uploaded to Hackage or tagged as a release. Fresh compiler evidence covers GHC 9.12.3; older compilers allowed by dependency bounds have not been revalidated.

  ## 0.1.0.1 — published

  The published library and test sources match GitLab master. This release includes the recursive Tasty dependency-wrapper traversal fix; 0.1.0.2 preserves that behavior.
changelog-type: markdown
description: |
  # tasty-bdd

  Typed Given/When/Then scenarios for Haskell's Tasty test framework.

  ## User stories: write readable test scenarios

  As a test author, you can express setup, an action and assertions using constructors or `do` notation. Successful assertions pass the Tasty test; failed equality assertions show structural differences.

  ```mermaid
  flowchart LR
    Given -->|prepare input| When
    When -->|pass result| Then
    Then -->|report outcome| Tasty
  ```

  ```haskell
  import Test.BDD.LanguageFree (given, then_, when_)
  import Test.Tasty (defaultMain)
  import Test.Tasty.Bdd ((@?=), testBehaviorF)

  main :: IO ()
  main = defaultMain $ testBehaviorF id "addition" $ do
      initial <- given $ pure (40 :: Int)
      when_ (pure $ initial + 2) $ then_ (@?= 42)
  ```

  This example is compiled and run by the `example` test suite. See [scenario examples](docs/stories/scenarios.md) and the [execution model](docs/architecture/execution.md) for setup, teardown and fail-fast behavior.

  ## Build and contribute

  ```sh
  nix develop --accept-flake-config
  just build
  just unit
  just ci
  ```

  The locked flake uses GHC 9.12.3 on x86_64 Linux. `nix flake check --accept-flake-config` runs the packaged build, tests, lint, formatting and documentation checks. Other systems have not been verified. Read the [published documentation](https://lambdasistemi.github.io/tasty-bdd/). See [development](docs/development.md) and the [Spec Kit plan](specs/001-modernization/plan.md).

  ## Published package

  [Hackage](https://hackage.haskell.org/package/tasty-bdd) carries 0.1.0.0 and 0.1.0.1. GitLab history through January 2025 is retained here, including the source published in 0.1.0.1. This modernization has not published a new package. See [release preparation](docs/releases.md).

  Licensed under [BSD-3-Clause](LICENSE).
