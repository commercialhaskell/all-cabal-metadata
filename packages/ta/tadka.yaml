  ansi-terminal: '>=1.0 && <1.2'
  array: '>=0.5 && <0.6'
  base: '>=4.18 && <4.23'
  bytestring: '>=0.11 && <0.13'
  containers: '>=0.6 && <0.9'
  network-uri: '>=2.6 && <2.7'
  prettyprinter: '>=1.7 && <1.8'
  prettyprinter-ansi-terminal: '>=1.1 && <1.2'
