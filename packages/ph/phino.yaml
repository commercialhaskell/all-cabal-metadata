description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.121\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\n##
  Build\n\nTo build `phino` from source, clone this repository:\n\n```bash\ngit clone
  git@github.com:objectionary/phino.git\ncd phino\n```\n\nThen, run the following
  command (ensure you have [Cabal][cabal] installed):\n\n```bash\ncabal build all\n```\n\nNext,
  run this command to install `phino` system-wide:\n\n```bash\nsudo cp \"$(cabal list-bin
  phino)\" /usr/local/bin/phino\n```\n\nVerify that `phino` is installed correctly:\n\n```bash\n$
  phino --version\n0.0.0\n```\n\nYou can ensure scripts are run with a specific version
  of `phino` using\nthe `--pin` global option. It exits with an error when the version
  supplied\ndoesn't match the installed one:\n\n```bash\nphino --pin=0.0.0.67 dataize
  hello.phi\n```\n\n## Dataize\n\nThen, you dataize the expression:\n\n```bash\n$
  phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n### Atoms\n\nWhich λ functions exist
  is a property of the object model being dataized, not\nof the calculus, so `phino`
  implements none of them. They come from a JSON\nregistry given with `--atoms`, keyed
  by regular expressions over λ names:\n\n```json\n{\n  \"L_number_plus\": {\n    \"rt\":
  \"node\",\n    \"script\": \"const readline = require('readline'); ...\"\n  }\n}\n```\n\nThe
  `rt` field names the interpreter the `script` is run under. Only `node` is\nsupported
  for now; a registry naming any other interpreter is refused when the\nfile is read,
  before dataization starts.\n\nWhen \U0001D53C reaches a λ function the registry
  carries, `phino` writes its `script`\nto a temporary file and runs it as a POSIX
  process under that interpreter:\n\n```text\nnode /tmp/phino-atom-4f2a.js\n```\n\nAn
  atom that is already a program needs no interpreter and no staging. Such an\nentry
  says `exec` and gives a `path` instead of a `script`:\n\n```json\n{\n  \"L_number_plus\":
  {\n    \"rt\": \"exec\",\n    \"path\": \"/opt/eo/atoms/number-plus\"\n  }\n}\n```\n\n`phino`
  spawns that file directly, as the executable binary it is, with no\narguments. A
  `path` that names no file, or a file nobody may run, is refused\nwhere the registry
  is read, together with the unknown runtimes.\n\nWhichever way it is run, the program
  is talked to over `stdin` and `stdout`,\none JSON object per line, in the letters
  of the evaluation rule of the\n[\U0001D711-calculus paper](https://github.com/objectionary/calculus-paper),\n\U0001D53C(\U0001D44F,
  \U0001D452, \U0001D460) = \U0001D45B, where \U0001D44F is the formation, \U0001D452
  the universe and \U0001D45B the normal\nform the atom answers with:\n\n```text\n{\"\U0001D452\":
  \"⟦ bytes ↦ ⟦ … ⟧, number ↦ ⟦ … ⟧, φ ↦ … ⟧\"}\n{\"id\": 1, \"λ\": \"L_number_plus\",
  \"\U0001D44F\": \"⟦ x ↦ Φ.number( … ), ρ ↦ ⟦ … ⟧ ⟧\"}\n{\"id\": 1, \"\U0001D45B\":
  \"11\"}\n```\n\nThe first two lines are `phino`'s, the third is the program's. The
  universe Φ\ngoes under `\U0001D452`, in a line of its own, before the first request.
  Then comes the\nrequest: an `id`, the λ name under `λ` — one program may be registered
  under\nseveral names and branch on it — and, under `\U0001D44F`, the formation being\nevaluated,
  with its λ binding removed. Both payloads are canonical \U0001D711-calculus\non
  a single line — no syntax sugar, whatever `--sweet` says about the output of\nthe
  run — so a program never has to know about `phino`'s sugar in order to find\na datum:
  every byte array is spelled out as a Δ binding.\n\nThe program answers with one
  line carrying the same `id` and, under `\U0001D45B`, the\n\U0001D711-expression
  the atom answers with, in any syntax `phino`'s parser reads —\nsyntax sugar included,
  so the `11` above and the `Φ.number( … )` it stands for\nare the same answer. `phino`
  parses it back and hands it to \U0001D53C as the atom's\nraw result, normalizing
  it exactly as it normalizes anything else, so\n`--evaluations`, `--partial` and
  `--max-steps` keep working unchanged.\n\nA program started for the fire is asked
  one request, always `id` 1, and its\n`stdin` is closed behind it, so it may read
  its input whole or line by line, as\nit pleases. It is waited for once it has answered,
  and a non-zero exit fails\nthe run. So does a reply that is not JSON, carries neither
  `\U0001D45B` nor `ask` (the\nnext section is about `ask`), answers another `id`,
  or an `\U0001D45B` that does not\nparse, or a program that quits without answering
  — always with the program's\nown `stderr` in the message.\n\nEach key of the registry
  is a regular expression, and it must match the whole\nλ name, so a plain name such
  as `L_number_plus` means that one atom and nothing\nelse, while `L_number_.*` stands
  for every atom of `number`. When \U0001D53C reaches a\nλ function, the keys are
  tried top to bottom, in the order the file lists them,\nand the first one that matches
  is the entry fired, so a key placed above\nanother hides whatever the two have in
  common. A key that is not a regular\nexpression is refused where the registry is
  read.\n\nA λ name no key matches has no λ function at all, so \U0001D53C gets stuck
  on it.\nWithout `--atoms` the registry is empty and every atom gets stuck.\n\nOne
  process per fire is where a program that is slow to start — a JVM, say —\nspends
  most of the run. An entry saying `serve` has `phino` start its program\nonce, on
  the first fire, and keep it for the rest of the run, whether it is a\n`script` or
  a `path`. Together with a key that matches many names, this is how\none program
  stands for a whole object model without being spelled once per\natom:\n\n```json\n{\n
  \ \"L_bytes_eq\": {\n    \"rt\": \"node\",\n    \"script\": \"const readline = require('readline');
  ...\"\n  },\n  \".*\": {\n    \"rt\": \"exec\",\n    \"path\": \"/opt/eo/atoms/resident\",\n
  \   \"serve\": true\n  }\n}\n```\n\nEvery λ name registered on the same program,
  under one key or under several,\nis served by the same process, so there is one
  of it, however many atoms it\nstands for. The lines are the same:\nthe program reads
  request after request off its `stdin`, each with the next\n`id`, and answers each
  in turn. The universe is told again only when a fire\ncomes with a different one;
  the program keeps the last one it was told. When\nthe run is over, whatever it ended
  with, `phino` closes the program's `stdin`,\nwhich is its cue to quit, and terminates
  it if it has not quit within a second.\n\n### Reducing the operands of an atom\n\nAn
  operand reaches a program as it was written: `5.plus( 6.plus( 7 ) )` fires\n`L_number_plus`
  with `x ↦ Φ.number( … ).plus( … )`, and getting a number out of\nthat is dataization,
  which is `phino`'s business and not a program's. So the\nprogram asks. It writes
  a line of its own, an `id` it mints and, under `ask`,\nthe \U0001D711-expression
  it wants reduced, and `phino` answers with that `id` and the\nresult under `\U0001D45B`:\n\n```text\n{\"\U0001D452\":
  \"⟦ bytes ↦ ⟦ … ⟧, number ↦ ⟦ … ⟧, φ ↦ … ⟧\"}\n{\"id\": 1, \"λ\": \"L_number_plus\",
  \"\U0001D44F\": \"⟦ x ↦ Φ.number( … ).plus( … ), ρ ↦ … ⟧\"}\n{\"id\": 7, \"ask\":
  \"⟦ x ↦ Φ.number( … ).plus( … ), ρ ↦ … ⟧.ρ\"}\n{\"id\": 7, \"\U0001D45B\": \"⟦ Δ
  ⤍ 40-14-00-00-00-00-00-00 ⟧\"}\n{\"id\": 8, \"ask\": \"⟦ x ↦ Φ.number( … ).plus(
  … ), ρ ↦ … ⟧.x\"}\n{\"id\": 8, \"\U0001D45B\": \"⟦ Δ ⤍ 40-2A-00-00-00-00-00-00 ⟧\"}\n{\"id\":
  1, \"\U0001D45B\": \"Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 40-32-00-00-00-00-00-00 ⟧
  ) )\"}\n```\n\nThe universe, the request and the two answers are `phino`'s; the
  two questions\nand the last line are the program's. A question mints an `id` of
  its own,\nwhich `phino` echoes, so a program may keep several of them open and still\ntell
  the answers apart.\n\n`phino` serves a question by binding the expression to a fresh
  synthetic\nattribute of the universe, normalizing it there and dataizing it — the
  same\ntrick `--inside` plays — so the answer is a byte formation and the program\nreads
  its `Δ`; where an atom on the way cannot fire and `--partial` parks it,\nthe answer
  is the residual program instead.\n\nServing a question re-enters the evaluator,
  so a question may cost a fire of\nthe very atom that asked it. That request arrives
  while the question is still\nopen, which is why a program that asks reads on instead
  of waiting for one\nline. The step budget of the run, `--max-steps`, bounds the
  nesting.\n\nOnly a program kept for the run may ask. `phino` closes the `stdin`
  of a\nprogram started for the fire behind its request, since such a program may
  read\nits input whole before it answers, so there is nothing left to answer a\nquestion
  over, and one that asks anyway fails the fire.\n\nSo a `serve` entry of `L_number_plus`
  that has `phino` reduce its operands\nreads like this:\n\n```js\nconst readline
  = require('readline');\nconst open = new Map();\nlet minted = 0;\nconst said = (message)
  => process.stdout.write(`${JSON.stringify(message)}\\n`);\nconst number = (answer)
  => Buffer\n  .from(/Δ ⤍ ([0-9A-F-]+)/.exec(answer)[1].replace(/-/g, ''), 'hex')\n
  \ .readDoubleBE(0);\nconst hex = (value) => {\n  const bytes = Buffer.alloc(8);\n
  \ bytes.writeDoubleBE(value);\n  return [...bytes]\n    .map((octet) => octet.toString(16).toUpperCase().padStart(2,
  '0'))\n    .join('-');\n};\nfunction* plus(b) {\n  const rho = number(yield `${b}.ρ`);\n
  \ const x = number(yield `${b}.x`);\n  return `Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍
  ${hex(rho + x)} ⟧ ) )`;\n}\nconst advance = (atom, id, answer) => {\n  const step
  = atom.next(answer);\n  if (step.done) {\n    said({ id, '\U0001D45B': step.value
  });\n    return;\n  }\n  minted += 1;\n  open.set(minted, { atom, id });\n  said({
  id: minted, ask: step.value });\n};\nreadline.createInterface({ input: process.stdin
  }).on('line', (line) => {\n  const message = JSON.parse(line);\n  if ('λ' in message)
  {\n    advance(plus(message['\U0001D44F']), message.id, undefined);\n  } else if
  ('\U0001D45B' in message) {\n    const waiting = open.get(message.id);\n    open.delete(message.id);\n
  \   advance(waiting.atom, waiting.id, message['\U0001D45B']);\n  }\n});\n```\n\nEvery
  request is a coroutine there, so a question suspends the request that\nasked it
  rather than the program: whatever `phino` says next, the answer or\nanother request,
  is served on the spot.\n\nA program may run a `phino` of its own instead of asking,
  and the `--inside`\noption is how it does that: the expression it names is bound
  to a fresh\nsynthetic attribute of the input expression, which the run takes as
  the\nuniverse, normalized there, and then dataized.\n\n```bash\n$ phino dataize
  --atoms=atoms.json --inside='5.plus( 6 )' universe.phi\n40-26-00-00-00-00-00-00\n```\n\nHere
  `universe.phi` is the \U0001D711-program the atom is being fired inside — the very\ntext
  the program was told under `\U0001D452`, which it feeds back on `stdin`. That costs\na
  process and a re-parse of the whole universe per operand, which is what the\n`ask`
  line is for.\n\nThe `--inside` option cannot be combined with `--locator`, since
  it aims the\nrun at the binding it mints itself. Both `dataize` and `morph` take
  `--atoms`\nand `--inside`.\n\n### Recording what fired\n\nEvery atom fired on the
  way to the bytes may be recorded in a machine-readable\nprotocol, with the `--evaluations`
  option. One firing is one line of three\ntab-separated fields: the name of the λ
  function, the formation it was applied\nto, and the expression it returned:\n\n```bash\n$
  cat sum.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  φ ↦ 5.plus( 6 )\n⟧\n$ phino dataize --atoms=atoms.json --evaluations=atoms.tsv
  --quiet \\\n    --sweet --hide-rho sum.phi\n$ cat -T atoms.tsv\nL_number_plus^I⟦
  x ↦ 6 ⟧^I11\n```\n\nRecords follow the syntax of the other options, such as `--sweet`
  and\n`--hide-rho`, but always stay on one line. The file is truncated at the\nbeginning
  of every run, and `--output=phi` is the only output format it\nworks with, since
  one record must fit into one line.\n\n### Partial evaluation\n\nAn atom that cannot
  fire fails the run: its λ function is not in the registry\ngiven with `--atoms`.
  This is what happens when an operation is deliberately\nleft unimplemented — a data
  input replaced by a placeholder formation such as\n`⟦ λ ⤍ Sym_arg_0 ⟧`, or an operation
  whose answer is not known yet. With\n`--partial`, dataization becomes partial evaluation
  instead: what the known\ninputs decide is computed, the rest survives as the residual
  program, which is\nprinted in place of the bytes, and the run ends successfully:\n\n```bash\n$
  cat partial.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(x)
  ↦ ⟦ λ ⤍ L_number_plus ⟧,\n    times(x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦
  ⟦ λ ⤍ L_number_as_bool ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino
  dataize --atoms=atoms.json --partial --sweet --hide-rho partial.phi\n⟦ λ ⤍ L_number_as_bool
  ⟧\n```\n\nHere `2.times( 3 ).plus( 4 )` was decided by the atoms the registry carries,
  so\nit was computed (its result, `10`, sits in the hidden `ρ` of the residual\nprogram),
  while `as-bool` names a λ function no script answers for, so it stays\nin place
  as a normal-form subterm. Each such stuck site also lands in the\n`--evaluations`
  file, as a record with the first two fields only, since there is\nno result to report:\n\n```bash\n$
  phino dataize --atoms=atoms.json --partial --evaluations=atoms.tsv --quiet \\\n
  \   --sweet --hide-rho partial.phi\n$ cat -T atoms.tsv\nL_number_times^I⟦ x ↦ 3
  ⟧^I6\nL_number_plus^I⟦ x ↦ 4 ⟧^I10\nL_number_as_bool^I⟦⟧\n```\n\nEvaluation stays
  demand-driven, as the calculus prescribes: an argument\nthat nothing asked for before
  the run got stuck is left as it is in the\nresidual program, for the next iteration.\n\nThe
  nested morphing and dataization recursion is bounded by the\n`--max-steps` option
  (default `1000`): when the budget is exhausted, the run\nfails with `Dataization
  did not finish before reaching the limit of steps`.\nThis guards against non-terminating
  terms, which used to loop forever before\nthe bound was introduced:\n\n```bash\n$
  phino dataize --max-steps=50 problem.phi\n[ERROR]: Dataization did not finish before
  reaching the limit of steps: --max-steps=50\n```\n\n## Morph\n\nDataization insists
  on bytes. Morphing \U0001D544 asks a different question: evaluate\nas far as the
  object model allows, without demanding data. It resolves Φ\nagainst the universe,
  peels dispatches and applications through\nnormalization, fires whichever atoms
  sit under a dispatch, and stops at the\nfirst formation it reaches, handing that
  formation back untouched. The\n`morph` command runs \U0001D544 on its own:\n\n```bash\n$
  cat two.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  φ ↦ 5.plus( 6 ).plus( 7 )\n⟧\n$ phino dataize --atoms=atoms.json --sweet
  --hide-rho two.phi\n40-32-00-00-00-00-00-00\n$ phino morph --atoms=atoms.json --locator=Q.φ
  --sweet --hide-rho two.phi\n⟦ x ↦ 7, λ ⤍ L_number_plus ⟧\n```\n\nThe inner `5.plus(
  6 )` fires, because `.plus` is dispatched on its result,\nand `11` lands in the
  `ρ` hidden by `--hide-rho`. The outer application is\nsaturated but bare, so \U0001D544
  returns it and is finished; firing it is\ndataization's job and takes `dataize`
  on to `18`.\n\nThe default locator `Q` morphs the whole top formation, which \U0001D544
  returns\nunchanged, so `--locator` is how one aims \U0001D544 at a subterm, exactly
  as in\n`dataize`. Unlike \U0001D53B, \U0001D544 is total: where no formation is
  reachable the answer\nis the terminator `⊥`, printed rather than reported as a failed
  run:\n\n```bash\n$ phino morph --locator=Q.x <<< '⟦ x ↦ ξ ⟧'\n⊥\n```\n\nThe whole
  `dataize` option surface applies unchanged — `--atoms`, `--inside`,\n`--sequence`,
  `--headers`, `--steps-dir`, `--evaluations`, `--partial`,\n`--max-steps`, `--shuffle`/`--seed`,
  `--output`, `--focus` and the rest.\n\n### Deep morphing\n\n\U0001D544 stops at
  the first formation it reaches and hands its bindings back as they\nwere written,
  since firing a bare λ is dataization's job, and `dataize`\nfollows the one path
  dataization demands and ends in bytes. What a program\nholds but nothing demands
  — the argument of an atom the registry does not\nserve, for one — is therefore reduced
  by neither. The `--deep` flag enters it:\n\n```bash\n$ cat gap.phi\n⟦\n  bytes ↦
  ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, times(x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,\n  bar(x) ↦
  ⟦ λ ⤍ L_bar ⟧,\n  demo ↦ ⟦ foo ↦ ⟦ n ↦ 3, φ ↦ Φ.bar( ξ.n.times( 5 ).times( 7 ) )
  ⟧ ⟧\n⟧\n$ phino morph --atoms=atoms.json --inside='Q.demo.foo' \\\n    --sweet --hide-rho
  gap.phi\n⟦ n ↦ 3, φ ↦ Φ.bar( n.times( 5 ).times( 7 ) ) ⟧\n$ phino morph --deep --atoms=atoms.json
  --inside='Q.demo.foo' \\\n    --sweet --hide-rho gap.phi\n⟦ n ↦ 3, φ ↦ Φ.bar( 105
  ) ⟧\n```\n\nEvery binding of the formation is entered, recursively. \U0001D544 is
  asked about the\nterm standing there and, where it lands on a saturated formation
  whose λ the\nregistry serves, that λ is fired and \U0001D544 is asked about the
  answer again. A term\non whose way an atom fired is replaced by the answer of the
  last firing, which\nis the \U0001D711-program the atom wrote rather than the normal
  form of it, so `105`\nstands where the arithmetic stood. A term no atom touched
  stays exactly as it\nwas written and only its own parts are walked, so `Φ.bar` keeps
  its name and\nwhat comes back is still the same program, reduced as far as the registry\nallows.
  The step joins the chain under the name `deep`, so `--sequence` shows\nit, and `--max-steps`
  bounds the walk.\n\nTwo things are left alone. A λ the registry does not serve is
  not fired at\nall, so `--deep` stays as total as \U0001D544 itself and needs no
  `--partial`; an atom\nthat gets stuck deeper on a spine still fails the run, and
  `--partial` parks\nit, leaving that term as it was written. A formation still holding
  a void\nbinding is not fired either: the void is an argument the program has not
  given\nyet, so `times(x) ↦ ⟦ λ ⤍ L_number_times ⟧` is a method waiting to be applied,\nnot
  an application waiting to be computed. Walking the whole program therefore\nfolds
  what it can and leaves the object model as it was declared:\n\n```bash\n$ phino
  morph --deep --atoms=atoms.json --sweet --hide-rho gap.phi\n⟦\n  bytes(φ) ↦ ⟦⟧,\n
  \ number(φ) ↦ ⟦ times(x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,\n  bar(x) ↦ ⟦ λ ⤍ L_bar ⟧,\n
  \ demo ↦ ⟦ foo ↦ ⟦ n ↦ 3, φ ↦ Φ.bar( 105 ) ⟧ ⟧\n⟧\n```\n\n## Rewrite\n\nYou can
  rewrite this expression with the help of [rules](#rule-structure)\ndefined in the
  `my-rule.yml` YAML file (here, the `!d` is a capturing group,\nsimilar to regular
  expressions):\n\n```yaml\nname: My custom rule\npattern: Δ ⤍ !d\nresult: Δ ⤍ 62-79-65\n```\n\nThen,
  rewrite:\n\n```bash\n$ phino rewrite --rule=my-rule.yml hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65
  ⟧, t ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\nIf you want to use many rules, just use `--rule` as
  many times as you need:\n\n```bash\nphino rewrite --rule=rule1.yaml --rule=rule2.yaml
  ...\n```\n\nYou can also use [built-in rules](resources), which are designed\nto
  normalize expressions:\n\n```bash\nphino rewrite --normalize hello.phi\n```\n\nBoth
  flags may be combined, so that your own rules are applied\nalongside the built-in
  ones, in a single rewriting session:\n\n```bash\nphino rewrite --normalize --rule=my-rule.yaml
  hello.phi\n```\n\nSome rules mint fresh synthetic names via the `random-string`
  built-in. To\nkeep the output reproducible across runs, `phino` seeds the random
  generator\ndeterministically with `0` by default. Use `--seed` to pick a different
  seed:\n\n```bash\nphino rewrite --seed=42 --rule=my-rule.yml hello.phi\n```\n\nIf
  no input file is provided, the \U0001D711-expression is taken from `stdin`:\n\n```bash\n$
  echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino rewrite --rule=my-rule.yml\n⟦ φ ↦
  ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass [`XMIR`][xmir] as input. Use `--input=xmir`
  and `phino`\nwill parse given `XMIR` from file or `stdin` and convert it to `phi`
  AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml --input=xmir file.xmir\n```\n\nAlso
  `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout(\n    α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦
  ⟦ Δ ⤍ 68-65-6C-6C-6F, ρ ↦ ∅ ⟧ ) )\n  ),\n  ρ ↦ ∅\n⟧\n```\n\n## Merge\n\nYou can
  merge several \U0001D711-expressions into a single one by merging their\ntop level
  formations:\n\n```bash\n$ cat bytes.phi\n⟦ bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n
  \ number ↦ ⟦\n    φ ↦ ∅,\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦
  number ↦ ⟦ minus(x) ↦ ⟦ λ ⤍ L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi
  minus.phi --sweet\n⟦\n  bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    minus(x) ↦ ⟦ λ ⤍ L_number_minus ⟧\n  ⟧\n⟧\n```\n\n## Match\n\nYou can test
  the \U0001D711-expression matches against the [rule](#rule-structure)\npattern.
  The result output contains matched substitutions:\n\n```bash\n$ phino match --pattern='⟦
  Δ ⤍ !d, !B ⟧' hello.phi\nB >> ⟦ ρ ↦ ∅ ⟧\nd >> 68-65-6C-6C-6F\n```\n\n## Explain\n\nYou
  can _explain_ the built-in rules by printing them in [LaTeX][latex]\nformat. Pass
  exactly one of `--normalize`, `--morph`, `--dataize` or\n`--contextualize` for the
  rewriting, morphing (\U0001D544), dataization (\U0001D53B) or\ncontextualization
  (\U0001D49E) rules (or `--rule` for a custom rule file):\n\n```bash\n$ phino explain
  --normalize\n\\begin{tabular}{rl}\n\\phinoNormalizationRule{alpha}\n  { [[ B_1,
  \\tau -> ?, B_2 ]] ( \\phiTerminal{\\alpha_{i}} -> e ) }\n  { [[ B_1, \\tau -> ?,
  B_2 ]] ( \\tau -> e ) }\n  { $ i = \\vert \\overline{ B_1 } \\vert $ }\n  { }\n\\phinoNormalizationRule{dc}\n
  \ { T ( \\tau -> e ) }\n  { T }\n  { }\n  { }\n...\n\\phinoNormalizationRule{stop}\n
  \ { [[ B ]] . \\tau }\n  { T }\n  { $ \\tau \\notin B \\;\\text{and}\\; @ \\notin
  B \\;\\text{and}\\; L \\notin B $ }\n  { }\n\\end{tabular}\n```\n\nThe morphing
  and dataization rules are printed the same way:\n\n```bash\n$ phino explain --morph\n\\begin{tabular}{rl}\n\\phinoMorphingRule{mf}\n
  \ { \\mathbb{M}( [[ B ]], e ) }\n  { [[ B ]] }\n  { }\n  { }\n...\n\\phinoMorphingRule{universe}\n
  \ { \\mathbb{M}( Q, e ) }\n  { \\mathbb{M}( \\phinoNormalize{ e }, e ) }\n  { $
  e \\not= Q $ }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --dataize\n\\begin{tabular}{rl}\n\\phinoDataizationRule{delta}\n
  \ { \\phinoDataize{ [[ B_1, D> δ, B_2 ]] } }\n  { δ }\n  { }\n  { }\n...\n\\phinoDataizationRule{norm}\n
  \ { \\phinoDataize{ n } }\n  { \\phinoDataize{ \\mathbb{M}( n, e ) } }\n  { }\n
  \ { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --contextualize\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cxi}\n  \\phinoConclusion{ \\phinoContextualize{ \\phiTerminal{\\xi}
  }{ k }{ k } }\n\\end{phinoContextualizationInference}\n...\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cd}\n  \\phinoPremise{ \\phinoContextualize{ n }{ k }{ n_1 } }\n  \\phinoConclusion{
  \\phinoContextualize{ n . \\tau }{ k }{ n_1 . \\tau } }\n\\end{phinoContextualizationInference}\n```\n\nFor
  more details, use `phino [COMMAND] --help` option.\n\n## Rule structure\n\nThis
  is BNF-like yaml rule structure. Here types ended with\napostrophe, like `Attribute'`
  are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # check if attributes exist in bindings\n      - Attribute'\n
  \     - Binding'\n  | nf: Expression'      # returns True if given expression in
  normal form\n                         # which means that no more other normalization
  rules\n                         # can be applied\n  | absolute: Expression' # returns
  True if given expression is xi-free, i.e.\n                         # there is no
  ξ outside of a formation: it is Φ, a\n                         # formation, a dispatch
  with a xi-free subject, or an\n                         # application with a xi-free
  subject and argument.\n                         # Combined with a normal-form check
  by the '\U0001D458'/'!k'\n                         # meta variable, which ranges
  over the absolute\n                         # expressions \U0001D4A6 ⊆ \U0001D4A9,
  used by the Rcopy rule.\n  | matches:             # returns True if given expression
  after dataization\n      - String           # matches to given regex\n      - Expression\n
  \ | part-of:             # returns True if given expression is attached to any\n
  \     - Expression'      # attribute in ginve bindings\n      - BiMeta'\n  | formation:
  \          # returns True if given expression is a formation\n      Expression'
  \       # (an abstraction ⟦…⟧); used by morphing 'md'\n                         #
  as 'not (formation \U0001D45B)', so a non-formation head is\n                         #
  morphed and a formation head is left to 'ml'\n  | gt:                  # returns
  True if the first comparable object is\n      - Comparable       # greater than
  the second one\n      - Comparable\n  | disjoint:            # returns True if none
  of the given attributes exists\n      - [Attribute']     # in the given bindings\n
  \     - Binding'\n\nComparable:              # comparable object that may be used
  in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:                  #
  comparable number\n  = Integer              # just regular integer\n  | IndexMeta'
  \          # \U0001D456 (or !i), the index captured by an α\U0001D456 argument\n
  \ | length: BiMeta'      # calculate length of bindings by given meta binding\n
  \ | domain: BiMeta'      # calculate number of unique attributes in given\n                         #
  meta binding (excluding 'assets')\n\nExtension:               # substitutions extension
  used to introduce new meta variables\n  meta: [ExtArgument]    # new introduced
  meta variable\n  function: String       # name of the function\n  args: [ExtArgument]
  \   # arguments of the function\n\nExtArgument\n  = Bytes'               # !d\n
  \ | Binding'             # !B\n  | Expression'          # !e\n  | Attribute'           #
  !t\n```\n\nHere's list of functions that are supported for extensions:\n\n* `contextualize`
  - function of two arguments, that rewrites given expression\n  depending on provided
  context according to the contextualization\n  [rules](assets/contextualize.jpg)\n*
  `random-tau` - creates attribute with random unique name. Accepts bindings,\n  and
  attributes. Ensures that created attribute is not present in list of\n  provided
  attributes and does not exist as attribute in provided bindings.\n* `dataize` -
  dataizes given expression and returns bytes.\n* `concat` - accepts bytes or dataizable
  expressions as arguments,\n  concatenates them into single sequence and convert
  it to expression\n  that can be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦
  Δ ⤍ !d ⟧)`.\n* `sed` - pattern replacer, works like unix `sed` function.\n  Accepts
  two arguments: target expression and pattern.\n  Pattern must start with `s/`, consists
  of three parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces
  all the spaces with empty string. To escape braces and slashes\n  in pattern and
  replacement parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string`
  - accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `δ` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n\nA meta variable carries
  a suffix, like `!B1` or `\U0001D70F0`, to name what it\ncaptured, so that the `result`,
  `when`, `where` and `having` of a rule can\nread it back.\n\nWritten bare, with
  no suffix at all, a meta variable is anonymous: it matches\nwhatever term stands
  in its place, every occurrence on its own, and binds no\nname. Two anonymous metas
  of one kind are therefore two different captures,\nwhich is what lets a pattern
  ask for any two attributes without inventing\nnames for them:\n\n```yaml\nname:
  two-attributes\npattern: '⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧'\nresult:
  '⟦ x ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧'\n```\n\nSpelled with suffixes, that pattern would read `⟦
  \U0001D70F1 ↦ \U0001D4521, \U0001D70F2 ↦ \U0001D4522 ⟧` and\nname four captures
  the result never mentions, while `⟦ \U0001D70F1 ↦ \U0001D4521, \U0001D70F1 ↦ \U0001D4521
  ⟧`\nwould be rejected as a duplicated attribute.\n\nNothing can refer to an anonymous
  meta, since it has no name to be referred to\nby. Writing one outside a `pattern`
  (or the `match`, `e-match` and `c-match` of\nan inference rule) is a mistake in
  the rule and is reported as the rule loads.\n\nA positional (α) application argument
  is written as `α0`, `~0` (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured
  by an `!i`/`\U0001D456` meta variable.\n\nIncorrect usage of meta variables in \U0001D711-expression
  patterns leads to\nparsing errors.\n\n## Benchmark\n\nTo run performance benchmarks,
  you need [Java 8+][java] and [curl][curl].\nMaven is downloaded automatically on
  first run via `benchmark/mvnw`.\n\nThe benchmark uses the compiled [`Native`][jna-native]
  class from\n[JNA][jna] — a large real-world Java class — as its test input.\nOn
  first run, `make bench` downloads the class, disassembles it to\n[XMIR][xmir] via
  [jeo-maven-plugin][jeo], converts it to \U0001D711 using\n`phino rewrite`, and caches
  the results in `benchmark/tmp/`.\nSubsequent runs skip straight to the benchmarks.\n\n```bash\nmake
  bench\n```\n\n<!-- benchmark_begin -->\n\n```text\n=== parse/phi ===\n  warmup:
  \    3 iterations\n  batches:    10 x 1\n  total:      1775922.415 μs\n  avg:        177592.242
  μs\n  min:        161735.069 μs\n  max:        206519.406 μs\n  std dev:    15129.161
  μs\n=== parse/xmir ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     7571386.164 μs\n  avg:        757138.616 μs\n  min:        691286.480 μs\n
  \ max:        813614.260 μs\n  std dev:    32034.618 μs\n=== rewrite/normalize ===\n
  \ warmup:     3 iterations\n  batches:    10 x 1\n  total:      579674.000 μs\n
  \ avg:        57967.400 μs\n  min:        56388.139 μs\n  max:        61829.190
  μs\n  std dev:    1703.063 μs\n=== print/sweet/multiline ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      3876263.188 μs\n  avg:        387626.319 μs\n
  \ min:        373639.628 μs\n  max:        405513.521 μs\n  std dev:    10018.938
  μs\n=== print/sweet/flat ===\n  warmup:     3 iterations\n  batches:    10 x 1\n
  \ total:      3789406.984 μs\n  avg:        378940.698 μs\n  min:        367216.617
  μs\n  max:        395082.263 μs\n  std dev:    8761.575 μs\n=== print/salty/multiline
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      13982361.998
  μs\n  avg:        1398236.200 μs\n  min:        1366361.442 μs\n  max:        1433666.397
  μs\n  std dev:    17717.682 μs\n```\n\nThe results were calculated in [this GHA
  job][benchmark-gha]\non 2026-09-09 at 15:41,\non Linux with 4 CPUs.\n\n<!-- benchmark_end
  -->\n\n## How to Contribute\n\nFork repository, make changes, then send us a [pull
  request][guidelines].\nWe will review your changes and apply them to the `master`
  branch shortly,\nprovided they don't violate our quality standards. To avoid frustration,\nbefore
  sending us your pull request please make sure all your tests pass:\n\n```bash\nmake
  all\n```\n\nTo generate a local coverage report for development, run:\n\n```bash\nmake
  coverage\n```\n\nTo build a `phino` executable into the root of the repository,
  run:\n\n```bash\nmake phino\n```\n\nThis produces an executable `phino` (or `phino.exe`
  on Windows) in the\nproject root, which you can run directly for quick local testing:\n\n```bash\n./phino
  --version\n```\n\nYou will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor
  [Stack ≥ 3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]:
  https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]: https://www.haskell.org/ghc/\n[guidelines]:
  https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]: https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]:
  https://en.wikipedia.org/wiki/LaTeX\n[java]: https://www.java.com/en/download/\n[curl]:
  https://curl.se/\n[jna]: https://github.com/java-native-access/jna\n[jna-native]:
  https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[benchmark-gha]: https://github.com/objectionary/phino/actions/runs/34371511775\n"
