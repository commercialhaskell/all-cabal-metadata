  markdownlint-enable MD013 -->\n\n`\U0001D70E3` is minted by the fourth firing and
  consumed by the third as\n`\U0001D53B(\U0001D70E3:λ)`, and `\U0001D70E2` by the
  first and consumed by the fork. `\U0001D70E4` and\n`\U0001D70E5` are what the two
  branches came to, and the fork consumes both: its `join`\nline makes them one term
  carrying `\U0001D70E6`, which the `plus( 5 )` standing after\nthe fork then reads
  as `\U0001D53B(\U0001D70E6:λ)`. The line\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ),
  \U0001D53B(\U0001D70E5:λ) }` is what ties the three\ntogether: dataizing the formation
  `\U0001D70E6` names answers what dataizing one of the\nother two answers. A reader
  who knows the entry knows that `\U0001D6FF1` is what decides\nbetween them and that
  the first of the two belongs to `then`. Nothing is\nassigned to a `\U0001D70E`,
  it being the name of a λ function, so the fact stands on a\nline of its own the
  way what a `symbolize` line knows does, and the line under\nit binds the meta, commented
  with the two metas it joined.\n\nWere the fork to answer one of its branches instead,
  the value of the other\nwould be minted and never consumed, and `foo` would read
  as a program that\ncomputes a condition, computes both branches and then drops the
  branch point.\n\nA firing that happened while an operand of another was being reduced
  stands one\nlevel deeper, under the firing that asked for it. The `plus( 1 )` of
  `then` is\nfired while the outer `plus` brings its `x` down, so it stands inside
  that\nfiring. The two branches reach the fork as calls \U0001D544 left unfired,
  and its\n`evaluate` lines fire them, so both stand inside the fork, each commented
  with\nthe meta it fired, `\U0001D53C(\U0001D45B1)` and `\U0001D53C(\U0001D45B2)`.\n\n###
  The protocol as XML\n\nThe name of the file decides which of the two formats `--protocol`
  writes: a\nname ending in `.xml` gets the same tree as markup, every other name
  gets the\nindented text above. There is no option for it, since a caller who asks
  for a\nfile called `atoms.xml` and gets text back has been told nothing useful.
  Here\nis the run at the top of this section again:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml --protocol=atoms.xml
  --quiet \\\n    --sweet --hide-rho sum.phi\n$ cat atoms.xml\n<?xml version=\"1.0\"
  encoding=\"UTF-8\"?>\n<protocol>\n  <dataize at=\"Φ\">\n    <morph at=\"Φ\">\n      <applied
  meta=\"\U0001D45B·0·1\" by=\"morph\" at=\"Φ\" of=\"Φ.number\"><attr name=\"φ\">Φ.bytes(
  φ ↦ 40-14-00-00-00-00-00-00:Δ )</attr></applied>\n      <applied meta=\"\U0001D45B·0·2\"
  by=\"morph\" at=\"Φ\" of=\"\U0001D45B·0·1.plus\"><attr name=\"x\">6</attr></applied>\n
  \   </morph>\n    <evaluate λ=\"L_number_plus\" by=\"dataize\" at=\"Φ\">\n      <dataize
  at=\"Φ.a\U0001F3350\">\n        <morph at=\"Φ.a\U0001F3350\">\n          <applied
  meta=\"\U0001D45B·1·1\" by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.number\"><attr
  name=\"φ\">Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )</attr></applied>\n          <applied
  meta=\"\U0001D45B·1·2\" by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.bytes\"><attr
  name=\"φ\">40-14-00-00-00-00-00-00:Δ</attr></applied>\n        </morph>\n        <delta
  meta=\"\U0001D6FF·1·1\" number=\"5.0\">40-14-00-00-00-00-00-00</delta>\n      </dataize>\n
  \     <bind meta=\"\U0001D6FF1·1\">\U0001D6FF·1·1</bind>\n      <dataize at=\"Φ.a\U0001F3351\">\n
  \       <morph at=\"Φ.a\U0001F3351\">\n          <applied meta=\"\U0001D45B·1·3\"
  by=\"morph\" at=\"Φ.a\U0001F3351\" of=\"Φ.number\"><attr name=\"φ\">Φ.bytes( φ ↦
  40-18-00-00-00-00-00-00:Δ )</attr></applied>\n          <applied meta=\"\U0001D45B·1·4\"
  by=\"morph\" at=\"Φ.a\U0001F3351\" of=\"Φ.bytes\"><attr name=\"φ\">40-18-00-00-00-00-00-00:Δ</attr></applied>\n
  \       </morph>\n        <delta meta=\"\U0001D6FF·1·2\" number=\"6.0\">40-18-00-00-00-00-00-00</delta>\n
  \     </dataize>\n      <bind meta=\"\U0001D6FF2·1\">\U0001D6FF·1·2</bind>\n      <minted
  symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \     <built meta=\"\U0001D45B·1·5\">Φ.number( φ ↦ \U0001D70E1:λ )</built>\n      <morph
  at=\"\U0001D45B·1·5\">\n        <applied meta=\"\U0001D45B·1·6\" by=\"morph\" at=\"\U0001D45B·1·5\"
  of=\"Φ.number\"><attr name=\"φ\">\U0001D70E1</attr></applied>\n      </morph>\n
  \     <answer meta=\"\U0001D45B·1·7\">\U0001D45B·1·6</answer>\n    </evaluate>\n
  \ </dataize>\n</protocol>\n```\n\n<!-- markdownlint-enable MD013 -->\n\nThe root
  is `<protocol>`, and the run stands inside it, named after the\njudgment it ran
  — `<dataize>` for a \U0001D53B, `<morph>` for a \U0001D544 — with `at` naming\nthe
  term it was aimed at, which is what the text format opens with as `\U0001D53B(Φ)`.\nAfter
  the run the root holds `<msec>`, `<firings>` and `<fps>`: how long the\nrun took,
  how many λ functions it fired, and how many it fired per second. The\ntext format
  ends with the same three as `msec(…)`, `firings(…)` and `fps(…)`.\nThe examples
  here leave them out, since the time differs from run to run.\n`<evaluate>` is one
  firing of \U0001D53C, `λ` naming the entry that answered it, `by`\nnaming the judgment
  that asked for the firing — the same word the run is named\nafter and an `<unanswered>`
  carries —\nand `at` naming the site it was fired at. The text format leaves those
  two to\nthe block the firing stands in, `\U0001D53B(Φ):`, while the markup keeps
  them on every\nelement, so a program reading it never has to track the elements
  around one.\nA nested `<dataize at=\"Φ.a\U0001F3350\">` or `<morph at=\"Φ.a\U0001F3350\">`
  is a judgment started\nat a new site, which the text format writes as `\U0001D53B(Φ.a\U0001F3350):`
  or `\U0001D544(Φ.a\U0001F3350):`,\nand `at` names that site. Whatever the judgment
  does is written inside the\nelement, so it closes where the text format drops back
  to the indentation it\nopened at, and like the text line it counts nothing and names
  no meta.\n`<delta>` is the datum the `delta` rule found, `meta` naming it the way
  the\ntext format does, and the `<bind>` after the element holds that name in place\nof
  the data. A datum of eight bytes also carries `number`, the double the text\nformat
  writes as the comment of its line.\n`<bind>` is one meta the firing bound, `meta`
  naming it the same way the text\nformat names it, counter and all, and the element
  holding the value it took: a\nterm where the operand was reduced with \U0001D544,
  the datum itself where a `dataize`\noperand came down to data. `<dataize>` inside
  a firing is the other thing a\n`dataize` operand may come to, the datum manufactured
  for an unknown, and holds\nthe formation that unknown names rather than the 42 standing
  for it: a `\U0001D70E` is\nthe name of a λ function and no term of its own, so what
  \U0001D53B was applied to is\n`\U0001D70E2:λ` and never `\U0001D70E2` alone. It
  carries `meta` where the run carries\n`at`, the same difference the text format
  draws between `\U0001D53B(Φ)` at the top\nand `\U0001D6FF1·2 := \U0001D53B(…)` in
  a block. The name of the element is what tells a\nmanufactured datum from data,
  the way `\U0001D53B(…)` does in the text format, so\nnothing has to be read off
  the presence of an attribute. `<answer>` holds the\nterm the firing answered with,
  named the same way by its own `meta`, and\n`<built>` before it holds the term the
  entry wrote, the one \U0001D544 made that answer\nof: two elements rather than two
  attributes of one, for the same reason\n`<dataize>` is no `<bind>`.\n\n`<applied
  meta=\"\U0001D45B·1·6\" by=\"morph\" at=\"\U0001D45B·1·5\" of=\"Φ.number\">` is
  an object an\napplication made, which the text format writes as `\U0001D45B·1·6
  := …` in the block\n`\U0001D544(\U0001D45B·1·5):`: `meta` names the object the way
  the text format\ndoes, counted with the `<built>` and the `<answer>` of the firing
  it stands in,\n`by` and `at` name the judgment that normalized and the site it stood
  at, and\n`of` names the object applied.\nThe argument stands in an `<attr>`, `name`
  naming the attribute it fills and\nthe text holding the name of the object or the
  application it is, the symbol,\nsuch as `\U0001D70E1`, where it is a bare one, and
  the term itself otherwise. A later\nelement holding that object holds its name instead,
  in its text or in its\n`term`, so `<answer meta=\"\U0001D45B·1·7\">\U0001D45B·1·6</answer>`
  says the firing answered with\nit and `<dataize at=\"Φ\">` that \U0001D53B got into
  it.\n\n`<known symbol=\"\U0001D70E44\">3F-F0-00-00-00-00-00-00</known>` is the fact
  a `symbolize`\nline writes about a symbol it minted, which the text format writes
  as\n`\U0001D53B(\U0001D70E44:λ) == …`: the symbol stands in the attribute a reader
  joins\nlines on and the data dataizing its formation answers are the text of the\nelement.
  It takes `symbol` and not `meta`, since the fact is about the unknown\nand not about
  a meta the firing bound.\n\n`<joined symbol=\"\U0001D70E6\">\U0001D70E4 \U0001D70E5</joined>`
  is the same kind of fact about a symbol\na `join` line minted, which the text format
  writes as\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ), \U0001D53B(\U0001D70E5:λ)
  }`: the fresh symbol stands\nin `symbol` and the two it was minted for are the text,
  in the order the line\nlisted the metas it joined. A line whose two terms differ
  at several places\nwrites one element per pair of symbols, and one whose terms are
  alike writes\nnone. The meta the line binds is a `<bind>` like every other meta
  of the\nfiring.\n\n`<minted symbol=\"\U0001D70E1\">40-14-… 40-18-…</minted>` is
  one symbol the firing\nminted, one element per bare `\U0001D70E` the entry wrote
  its answer with, standing\ninside the block ahead of the `<built>` carrying them.
  The symbol stands in\n`symbol`, the way `<known>` and `<joined>` put theirs, and
  the text is what is\nknown about it: the values the `dataize` lines of the entry
  took, in the order\nthe entry declares them, each spelled as its own line spells
  it — the bytes\nfor a datum, `\U0001D70E1` for a symbol — and separated by a space
  the way `<joined>`\nlists its pair. With the `λ` of the block the element reads
  as the fact\n`\U0001D53B(\U0001D70E1:λ) == L_number_plus(40-14-…, 40-18-…)`, and
  a firing of an entry with\nno `dataize` line writes `<minted symbol=\"\U0001D70E1\"/>`.
  The symbol is also the edge\na reader joins on: a later `<dataize meta=\"\U0001D6FF1·5\">\U0001D70E2:λ</dataize>`
  names the\nsymbol the firing that wrote `<minted symbol=\"\U0001D70E2\">` handed
  out. A firing\nminting two symbols writes two elements and one minting none writes
  none,\nwhich no attribute on the answer could say: a term may carry several symbols,\nor
  carry one where the value it stands for is not a symbol at all. In the fork\nabove,
  `\U0001D53C(L_gt)` writes `<minted symbol=\"\U0001D70E2\">` although `\U0001D70E2`
  sits under `if`\nand not where the value of the term is, while `\U0001D53C(L_fork)`
  writes none at all,\nsince the symbol it answers with comes from a `join` line and
  stands in a\n`<joined>` of its own.\n\nA λ name no entry answers is `<unanswered
  λ=\"…\">`, standing where its\n`<evaluate>` would have stood with the formation
  \U0001D53C was fired against as its text\nand the judgment that asked in its `by`
  attribute, where the text format writes\nthe letter of it. A firing that happened
  while an operand of another was being\nreduced is an `<evaluate>` inside the one
  that asked, which is what the deeper\nindentation means in the text. Elements are
  written as the run goes and\nthe open ones are closed when it ends, so a run that
  fails still leaves a\nwell-formed document behind:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml --protocol=atoms.xml
  --quiet \\\n    --sweet --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers
  the λ function 'L_number_nope'\n$ cat atoms.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<protocol>\n
  \ <dataize at=\"Φ\">\n    <morph at=\"Φ\">\n      <applied meta=\"\U0001D45B·0·1\"
  by=\"morph\" at=\"Φ\" of=\"Φ.number\"><attr name=\"φ\">Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ
  )</attr></applied>\n      <applied meta=\"\U0001D45B·0·2\" by=\"morph\" at=\"Φ\"
  of=\"\U0001D45B·0·1.plus\"><attr name=\"x\">6</attr></applied>\n      <evaluate
  λ=\"L_number_plus\" by=\"morph\" at=\"Φ\">\n        <dataize at=\"Φ.a\U0001F3350\">\n
  \         <morph at=\"Φ.a\U0001F3350\">\n            <applied meta=\"\U0001D45B·1·1\"
  by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.number\"><attr name=\"φ\">Φ.bytes( φ ↦
  40-14-00-00-00-00-00-00:Δ )</attr></applied>\n            <applied meta=\"\U0001D45B·1·2\"
  by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.bytes\"><attr name=\"φ\">40-14-00-00-00-00-00-00:Δ</attr></applied>\n
  \         </morph>\n          <delta meta=\"\U0001D6FF·1·1\" number=\"5.0\">40-14-00-00-00-00-00-00</delta>\n
  \       </dataize>\n        <bind meta=\"\U0001D6FF1·1\">\U0001D6FF·1·1</bind>\n
  \       <dataize at=\"Φ.a\U0001F3351\">\n          <morph at=\"Φ.a\U0001F3351\">\n
  \           <applied meta=\"\U0001D45B·1·3\" by=\"morph\" at=\"Φ.a\U0001F3351\"
  of=\"Φ.number\"><attr name=\"φ\">Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )</attr></applied>\n
  \           <applied meta=\"\U0001D45B·1·4\" by=\"morph\" at=\"Φ.a\U0001F3351\"
  of=\"Φ.bytes\"><attr name=\"φ\">40-18-00-00-00-00-00-00:Δ</attr></applied>\n          </morph>\n
  \         <delta meta=\"\U0001D6FF·1·2\" number=\"6.0\">40-18-00-00-00-00-00-00</delta>\n
  \       </dataize>\n        <bind meta=\"\U0001D6FF2·1\">\U0001D6FF·1·2</bind>\n
  \       <minted symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \       <built meta=\"\U0001D45B·1·5\">Φ.number( φ ↦ \U0001D70E1:λ )</built>\n        <morph
  at=\"\U0001D45B·1·5\">\n          <applied meta=\"\U0001D45B·1·6\" by=\"morph\"
  at=\"\U0001D45B·1·5\" of=\"Φ.number\"><attr name=\"φ\">\U0001D70E1</attr></applied>\n
  \       </morph>\n        <answer meta=\"\U0001D45B·1·7\">\U0001D45B·1·6</answer>\n
  \     </evaluate>\n    </morph>\n    <unanswered λ=\"L_number_nope\" by=\"dataize\">L_number_nope:λ</unanswered>\n
  \ </dataize>\n</protocol>\n```\n\n<!-- markdownlint-enable MD013 -->\n\n### Abridging
  the protocol\n\nA formation carrying a whole object is written flat on one line,
  so a real\nrun fills the protocol with lines tens of thousands of characters long.
  The\n`--abridged` option shortens every term the protocol writes, in the text and\nthe
  XML alike: a formation longer than sixty-four characters keeps its `φ`,\n`Δ` and
  `λ` bindings and folds the rest into a count. The width is a value of\nthe option,
  `--abridged=120`, for a run that can read longer lines. The result\nthe run prints
  stays whole, and the option is refused without `--protocol`.\nEvery byte string
  the protocol writes stays whole too, since a reader may need\nthe data a firing
  came down to:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ cat wide.phi\n⟦\n
  \ t ↦ ⟦\n    φ ↦ ⟦ Δ ⤍ 48-65-6C-6C-6F-2C-20-77-6F-72-6C-64 ⟧,\n    left ↦ ξ.right,\n
  \   right ↦ ξ.left,\n    middle ↦ ξ.left\n  ⟧\n⟧\n$ phino dataize --locator=Q.t
  --protocol=wide.txt --abridged --quiet \\\n    --sweet --hide-rho wide.phi\n$ cat
  wide.txt\n\U0001D53B(Φ.t):\n  \U0001D6FF·0·1 := 48-65-6C-6C-6F-2C-20-77-6F-72-6C-64\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nThe `--abridged-data` option cuts the data too:
  a byte string longer than eight\nbytes keeps its first two bytes and its last two,
  with the count of the bytes\ncut out between them. A formation folded into a count
  loses its data either\nway, and the option is refused without `--abridged`:\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize --locator=Q.t --protocol=wide.txt
  --abridged \\\n    --abridged-data --quiet --sweet --hide-rho wide.phi\n$ cat wide.txt\n\U0001D53B(Φ.t):\n
  \ \U0001D6FF·0·1 := 48-65-..(8b)..-6C-64\n```\n\n<!-- markdownlint-enable MD013
  -->\n\n### Reducing a term inside a universe\n\nA term that is no part of the program
  may still be reduced against it, with the\n`--inside` option: the expression it
  names is bound to a synthetic attribute\nprepended to the input expression, which
  the run takes as the universe Φ,\nnormalized there and then reduced.\n\n```bash\n$
  cat universe.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ
  ⤍ L_number_plus ⟧ ⟧\n⟧\n$ phino dataize --symbolic=atoms.yaml --inside='5.plus(
  6 )' universe.phi\n40-45-00-00-00-00-00-00\n```\n\nThis is the very trick `phino`
  plays internally to reduce the operands of a\nfiring, made available to whoever
  asks it to reduce a term the program does not\nhold. The option cannot be combined
  with `--locator`, since it aims the run at\nthe binding it mints itself. Both `dataize`
  and `morph` take `--symbolic` and\n`--inside`.\n\n### Partial evaluation\n\nA λ
  function no entry of the `--symbolic` file answers fails the run. This is\nwhat
  happens when an operation is deliberately left out — an input the object\nmodel
  has not declared yet, or an operation whose answer is not known. With\n`--partial`,
  dataization becomes partial evaluation instead: what the known\ninputs decide is
  computed, the rest survives as the residual program, which is\nprinted in place
  of the bytes, and the run ends successfully:\n\n```bash\n$ cat partial.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦ ⟦ λ ⤍ L_number_as_bool
  ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --sweet --hide-rho partial.phi\n[ERROR]: No entry of --symbolic answers the λ function
  'L_number_as_bool'\n$ phino dataize --symbolic=atoms.yaml --partial --sweet --hide-rho
  partial.phi\nL_number_as_bool:λ\n```\n\nHere `2.times( 3 ).plus( 4 )` was answered
  by the entries the file carries, so\nit was reduced — the symbol it came to sits
  in the hidden `ρ` of the residual\nprogram — while `as-bool` names a λ function
  no entry answers, so it stays in\nplace as a normal-form subterm. A stuck site opens
  no block in the\n`--protocol` file, since nothing fired there, and stands in it
  as\n`unanswered(…)`:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino
  dataize --symbolic=atoms.yaml --partial --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho partial.phi\n$ cat atoms.txt\n\U0001D53B(Φ):\n  \U0001D544(Φ):\n    \U0001D45B·0·1
  := 2\n    \U0001D45B·0·2 := \U0001D45B·0·1.times( x ↦ 3 )\n    \U0001D53C(L_number_times):\n
  \     \U0001D53B(Φ.a\U0001F3350):\n        \U0001D544(Φ.a\U0001F3350):\n          \U0001D45B·1·1
  := 2\n          \U0001D45B·1·2 := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·1
  := 40-00-00-00-00-00-00-00  # 2.0\n      \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n
  \     \U0001D53B(Φ.a\U0001F3351):\n        \U0001D544(Φ.a\U0001F3351):\n          \U0001D45B·1·3
  := 3\n          \U0001D45B·1·4 := Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·2
  := 40-08-00-00-00-00-00-00  # 3.0\n      \U0001D6FF2·1 := \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n
  \     \U0001D45B·1·5 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·1·5):\n
  \       \U0001D45B·1·6 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D45B·1·7 :=
  \U0001D45B·1·6  # \U0001D544(\U0001D45B·1·5)\n    \U0001D45B·0·3 := \U0001D45B·1·6.plus(
  x ↦ 4 )\n    \U0001D53C(L_number_plus):\n      \U0001D53B(Φ.a\U0001F3352):\n        \U0001D544(Φ.a\U0001F3352):\n
  \         \U0001D45B·2·1 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D6FF1·2 :=
  \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F3353):\n
  \       \U0001D544(Φ.a\U0001F3353):\n          \U0001D45B·2·2 := 4\n          \U0001D45B·2·3
  := Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ )\n        \U0001D6FF·2·1 := 40-10-00-00-00-00-00-00
  \ # 4.0\n      \U0001D6FF2·2 := \U0001D6FF·2·1  # \U0001D53B(ξ.x)\n      \U0001D45B·2·4
  := Φ.number( φ ↦ \U0001D70E2:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·2·4):\n
  \       \U0001D45B·2·5 := Φ.number( φ ↦ \U0001D70E2:λ )\n      \U0001D45B·2·6 :=
  \U0001D45B·2·5  # \U0001D544(\U0001D45B·2·4)\n  unanswered(L_number_as_bool)  #
  \U0001D53B(L_number_as_bool:λ)\n```\n\n<!-- markdownlint-enable MD013 -->\n\nEvaluation
  stays demand-driven, as the calculus prescribes: an argument\nthat nothing asked
  for before the run got stuck is left as it is in the\nresidual program, for the
  next iteration.\n\nAn operand of a firing that reaches the terminator `⊥`, or a
  term no\ndataization rule matches, such as a formation whose `φ` is a void nothing\nfilled,
  never comes down to data either, and `--partial` parks that firing\nthe same way,
  writing the dead end into the protocol as `unanswered(⊥)` with the\nterm that could
  not be dataized beside it. Dataization aimed at `⊥` itself still\nfails, with or
  without `--partial`, since there is no firing to park.\n\nThe nested morphing and
  dataization recursion is bounded by the\n`--max-steps` option (default `1000`):
  when the budget is exhausted, the run\nfails with `Dataization did not finish before
  reaching the limit of steps`.\nThis guards against non-terminating terms, which
  used to loop forever before\nthe bound was introduced:\n\n```bash\n$ phino dataize
  --max-steps=50 problem.phi\n[ERROR]: Dataization did not finish before reaching
  the limit of steps: --max-steps=50\n```\n\nThat budget bounds how deep one branch
  goes, not how much the whole run does.\nAn entry that reduces two operands, each
  firing it again, doubles its work at\nevery level and still never gets deep, so
  no `--max-steps` stops it. The\n`--max-firings` option counts every λ function the
  run fires and fails the\nrun once the count is spent; `--partial` parks it instead,
  the way it parks a\nspent `--max-steps`. There is no limit unless the option is
  given:\n\n```bash\n$ cat split.yaml\n- λ: L_split\n  morph:\n    \U0001D45B1: Φ.s.foo\n
  \   \U0001D45B2: Φ.s.foo\n  \U0001D45B: ⟦ l ↦ \U0001D45B1, r ↦ \U0001D45B2 ⟧\n$
  cat split.phi\n⟦ s ↦ ⟦ λ ⤍ L_split ⟧, x ↦ Φ.s.foo ⟧\n$ phino morph --symbolic=split.yaml
  --locator=Q.x --max-firings=64 split.phi\n[ERROR]: Evaluation did not finish before
  reaching the limit of firings: --max-firings=64\n```\n\nBoth budgets count work,
  so a run inside both of them may still take longer\nthan its caller can wait, and
  a caller that kills it gets a protocol nobody\nclosed. The `--max-seconds` option
  stops the run by the clock instead: once\nthat many seconds have passed since the
  command started, the next step the\nrun is about to take, whether it fires a λ function
  or not, fails it with\n`Evaluation did not finish before reaching the limit of seconds`,
  and so does\na check of `--acyclic` that is still comparing formations by then.\n`--partial`
  does not park it, since a run out of time has no site to park and\nnothing left
  to go on with. The protocol is closed as usual and its last line\nsays where the
  time ran out. There is no limit unless the option is given:\n\n```bash\n$ phino
  morph --symbolic=split.yaml --locator=Q.x --partial --max-seconds=5 \\\n    --protocol=split.txt
  --sweet --flat split.phi\n[ERROR]: Evaluation did not finish before reaching the
  limit of seconds: --max-seconds=5\n$ grep -o 'timeout.*' split.txt\ntimeout(5)\n```\n\n##
  Morph\n\nDataization insists on bytes. Morphing \U0001D544 asks a different question:
  evaluate\nas far as the object model allows, without demanding data. It resolves
  Φ\nagainst the universe, peels dispatches and applications through\nnormalization,
  fires whichever λ functions sit under a dispatch, and stops at\nthe first formation
  it reaches, handing that formation back untouched. The\n`morph` command runs \U0001D544
  on its own:\n\n```bash\n$ cat two.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦
  ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n  φ ↦ 5.plus( 6 ).plus( 7 )\n⟧\n$ phino
  dataize --symbolic=atoms.yaml --sweet --hide-rho two.phi\n40-45-00-00-00-00-00-00\n$
  phino morph --symbolic=atoms.yaml --locator=Q.φ --sweet --hide-rho two.phi\n⟦ x
  ↦ 7, λ ⤍ L_number_plus ⟧\n```\n\nThe inner `5.plus( 6 )` fires, because `.plus`
  is dispatched on its result,\nand the symbol it answered with lands in the `ρ` hidden
  by `--hide-rho`. The\nouter application is saturated but bare, so \U0001D544 returns
  it and is finished;\nfiring it is dataization's job and takes `dataize` on to a
  datum.\n\nThe default locator `Q` morphs the whole top formation, which \U0001D544
  returns\nunchanged, so `--locator` is how one aims \U0001D544 at a subterm, exactly
  as in\n`dataize`. Unlike \U0001D53B, \U0001D544 is total: where no formation is
  reachable the answer\nis the terminator `⊥`, printed rather than reported as a failed
  run:\n\n```bash\n$ phino morph --locator=Q.x <<< '⟦ x ↦ ξ ⟧'\n⊥\n```\n\n\U0001D544
  maps normal forms to formations and `morph` does not normalize what it is\ngiven,
  so a term that is not a normal form, such as a dispatch off a formation\nwith neither
  `φ` nor `λ`, is reported as a failed run rather than answered:\n\n```bash\n$ phino
  morph --locator=Q.t <<< '⟦ t ↦ ⟦ x ↦ ⟦⟧ ⟧.x ⟧'\n[ERROR]: Morphing expects a normal
  form, but no morphing rule matches: ⟦⟧:x.x\n```\n\nThe whole `dataize` option surface
  applies unchanged — `--symbolic`,\n`--inside`, `--sequence`, `--headers`, `--steps-dir`,
  `--protocol`,\n`--partial`, `--max-steps`, `--shuffle`/`--seed`, `--output`, `--focus`
  and the\nrest.\n\n### Acyclic morphing\n\nWhether a program terminates is the object
  model's business, not the\ncalculus's, so phino prevents no recursion of its own
  and `--max-steps` is what\nends a run that never finishes. An entry answering with
  a firing of itself\ntherefore spends the whole budget before it fails, and what
  it fails on is the\nlimit rather than the loop:\n\n```bash\n$ cat loop.yaml\n- λ:
  L_loop\n  \U0001D45B: ⟦ λ ⤍ L_loop ⟧\n$ cat loop.phi\n⟦ x ↦ ⟦ λ ⤍ L_loop ⟧.foo ⟧\n$
  phino morph --symbolic=loop.yaml --locator='Q.x' --max-steps=40 loop.phi\n[ERROR]:
  Dataization did not finish before reaching the limit of steps: --max-steps=40\n```\n\nThe
  `--acyclic=<mode>` option makes a reduction notice. Every frame of \U0001D544 and\nof
  \U0001D53B remembers the formations the frames above it have entered, and only four\nplaces
  enter one: `fire` of \U0001D53B, `ml` of \U0001D544 and an `evaluate` line of an
  entry,\nwhich fire the λ function of a formation, and `box` of \U0001D53B, which
  gets into the\n`φ` body of a formation carrying no λ and no `Δ`. A frame about to
  enter a\nformation one of the frames above it has already entered is asking a question\nonly
  ever answered by asking it again, so the option stops there and parks the\nsite
  the way `--partial` parks a λ function that cannot fire: the answer is the\nterm
  the spine had reached, left where it stood, and the command exits\nsuccessfully.\n\n```bash\n$
  phino morph --symbolic=loop.yaml --locator='Q.x' --acyclic=proven \\\n    --max-steps=40
  --hide-rho loop.phi\n⟦ λ ⤍ L_loop ⟧.foo\n```\n\n\U0001D544 and \U0001D53B share
  that one memory. They call each other on the very term they\nwere asked about, and
  that handover is no loop, but it enters no formation\neither, so it is never remembered
  and never mistaken for one. A body\ndispatching the object it stands in is a loop
  \U0001D53B walks round on its own — \U0001D544\nstops at a formation every round,
  and `box` gets into it again — so `dataize`\ntakes the option too, and so does the
  run of \U0001D53B a λ function's `dataize` operand\nis brought down with:\n\n```bash\n$
  cat cyc.phi\n⟦ cyc ↦ ⟦ x ↦ ∅, φ ↦ Φ.cyc( ξ.x ) ⟧, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n$ phino dataize
  --locator='Q.t' --acyclic=proven --partial \\\n    --sweet --hide-rho --flat cyc.phi\n⟦
  cyc(x) ↦ Φ.cyc( x ):φ, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n```\n\n\U0001D53B insists on bytes and
  a parked term carries none, so under `dataize` the option\nwants `--partial` to
  have something to print: the residual program, exactly the\none it prints for a
  λ function that cannot fire. Without it the run stops on\nthe loop all the same,
  naming the formation it entered again instead of running\nthe budget down. Under
  `morph` nothing is asked for: \U0001D544 always has a term to\nanswer with, and
  a loop \U0001D53B meets under a firing parks the site the firing\nstands at.\n\nThe
  mode says what \"the same formation\" means, and there is no default, since\nno
  answer is right for every run. Under `proven` it means the same up to a\nrenaming
  of symbols: two\nformations are one where some one-to-one pairing of the symbols
  of the first\nwith those of the second makes them equal, so `\U0001D70E5` may stand
  where `\U0001D70E3` stood\nas long as it does so everywhere and no other symbol
  stands there too. Data,\nattribute names and λ names must still match exactly. That
  is what catches a\nrecursion over an unknown, which never repeats a term: every
  round mints fresh\nsymbols, so the formation it enters on the second round is the
  one it entered\non the first with new names for the unknowns. The renaming is sound
  because a\nsymbol is an opaque value nobody worked out — every one of them dataizes
  to the\nsame manufactured datum and no entry of `--symbolic` answers one — so a\nformation
  entered again with nothing but its symbols renamed replays the round\nit is inside
  forever. Data still tells rounds apart: a formation entered with\n`n ↦ 3` and then
  with `n ↦ 2` is two formations, so a recursion over data is\nnot cut while it goes
  on computing. Take an entry that answers a call of its\nown object over a fresh
  symbol, so every round fires the same λ function over\nan unknown it has never seen:\n\n```bash\n$
  cat down.yaml\n- λ: L_down\n  dataize:\n    \U0001D6FF1: $.x\n  \U0001D45B: Φ.down(
  x ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n$ cat down.phi\n⟦\n  down ↦ ⟦ x ↦ ∅, λ ⤍ L_down ⟧,\n  y
  ↦ Φ.down( x ↦ ⟦ λ ⤍ \U0001D70E1 ⟧ ).φ\n⟧\n$ phino morph --symbolic=down.yaml --locator=Q.y
  --acyclic=proven \\\n    --protocol=down.txt --sweet --hide-rho down.phi\n⟦ x ↦
  \U0001D70E1:λ, λ ⤍ L_down ⟧.φ\n$ cat down.txt\n\U0001D544(Φ.y):\n  \U0001D45B·0·1
  := Φ.down( x ↦ \U0001D70E1:λ )\n  \U0001D53C(L_down):\n    \U0001D6FF1·1 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.x)\n    \U0001D45B·1·1 := Φ.down( x ↦ \U0001D70E2:λ )  # \U0001D45B\n
  \   \U0001D544(\U0001D45B·1·1):\n      \U0001D45B·1·2 := Φ.down( x ↦ \U0001D70E2:λ
  )\n    \U0001D45B·1·3 := \U0001D45B·1·2  # \U0001D544(\U0001D45B·1·1)\n  looped(\U0001D45B·0·1)
  \ # proven\n```\n\nThe first round fires `down` with `x ↦ \U0001D70E1` and answers
  it with `x ↦ \U0001D70E2`, and\nthe `φ` dispatched off that answer would fire it
  again: the formation the first\nround entered, `\U0001D70E2` standing where `\U0001D70E1`
  stood, so the firing is cut before it\nopens. The cut is the `looped(…)` line, standing
  where the block of the cut\nfiring would have stood: the block it stands in names
  the judgment the frame\nbelonged to and the site it was cut at, and the comment
  names the mode that\ncut it. What it carries is the formation the frame above entered,
  named by the\nline that made it, `\U0001D45B·0·1`, so the two are paired by their
  terms and no reader\nhas to rename symbols by eye or find the cut in the residue.
  Nothing runs under\na cut, so no block opens under the line. In the XML protocol
  it is\n`<looped by=\"morph\" match=\"proven\" at=\"Φ.y\"><e>\U0001D45B·0·1</e></looped>`,
  with the\nsite and the mode as attributes and the formation in `<e>`. Without the
  option\nthe same run nests one round inside another until `--max-steps` runs out.\n\nWhat
  a frame remembers is the branch from the run down to it, never everything\nthe run
  has touched, so two siblings entering one formation enter it twice and\nonly a formation
  entered from inside itself is a loop. The cut costs one lookup\nand fires on the
  turn the repeat appears, so raising `--max-steps` from 40 to a\nmillion changes
  neither the answer nor the time.\n\nWhat `proven` cannot see is a recursion that
  never comes back to the same\nformation: one whose arguments grow by a wrapper every
  round. Take a factorial\nwith an accumulator it builds a `pair` onto, with `facta.yaml`
  answering\n`L_zero` and `L_dec` with a fresh symbol each and `L_if` a fork joining
  its two\nbranches. Under `proven` the run nests deeper until `--max-steps` runs
  out,\nsince no renaming of symbols turns a longer chain of pairs into a shorter
  one:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ cat facta.phi\n⟦\n  if
  ↦ ⟦ c ↦ ∅, left ↦ ∅, right ↦ ∅, λ ⤍ L_if ⟧,\n  zero ↦ ⟦ x ↦ ∅, λ ⤍ L_zero ⟧,\n  dec
  ↦ ⟦ x ↦ ∅, λ ⤍ L_dec ⟧,\n  pair ↦ ⟦ head ↦ ∅, tail ↦ ∅ ⟧,\n  fact ↦ ⟦ n ↦ ∅, acc
  ↦ ∅, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ ξ.n ), left ↦ ξ.acc, right ↦ Φ.fact( n ↦ Φ.dec( x
  ↦ ξ.n ), acc ↦ Φ.pair( head ↦ ξ.n, tail ↦ ξ.acc ) ).φ ).φ ⟧,\n  x ↦ Φ.fact( n ↦
  ⟦ λ ⤍ \U0001D70E1 ⟧, acc ↦ ⟦ Δ ⤍ 00- ⟧ ).φ\n⟧\n$ cat facta.yaml\n- λ: L_zero\n  dataize:\n
  \   \U0001D6FF1: $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_dec\n  dataize:\n
  \   \U0001D6FF1: $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_if\n  dataize:\n
  \   \U0001D6FF1: $.c\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n
  \ symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n
  \   \U0001D45B5: [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n$ phino
  morph --acyclic=plausible --partial --sweet --hide-rho --flat \\\n    --symbolic=facta.yaml
  --locator='Q.x' --protocol=facta.txt facta.phi\nΦ.if( c ↦ Φ.zero( x ↦ \U0001D70E1:λ
  ), left ↦ 00-:Δ, right ↦ Φ.fact( n ↦ Φ.dec( x ↦ \U0001D70E1:λ ), acc ↦ Φ.pair( head
  ↦ \U0001D70E1:λ, tail ↦ 00-:Δ ) ).φ ).φ\n$ grep looped facta.txt\n      looped(\U0001D45B·0·5)
  \ # plausible\n```\n\n<!-- markdownlint-enable MD013 -->\n\nUnder `plausible` the
  same formation means one the formation entered earlier\nis embedded in: the two
  have the same attributes, data and λ function at the\ntop, and every term the earlier
  one bound there is found again in the later\none, as it stands or somewhere below
  a wrapper it gained. Any symbol stands for\nany other, and nothing is looked for
  under a `ρ`, which holds the object a term\ncame from rather than a term it grew
  into. The second `if` above holds the\nfirst under one more `pair` and one more
  `dec`, so it is cut, and its\n`looped(…)` line says `plausible`. The `right` operand
  of the first `if` then\ncomes back as the term the cut left, which no `join` pairs
  with the datum of\nthe other branch, so that firing gets stuck and `--partial` parks
  it. A call\nnested in its own operand, such as a sum of sums, is never\ncut, since
  the inner call is smaller than the outer one and cannot hold it.\nThe mode is not
  sound, though: a recursion whose argument grows on its way to\nstopping is cut too,
  which is why the line names the mode that made the cut.\n\nThe mode also fires every
  formation once. Every use of a binding copies the\nterm bound to it, so a program
  reading `truncated ↦ ρ.abs.floor` in five\nplaces fires `abs` and `floor` five times
  over and mints five symbols for one\nvalue, and a guard written that way spends
  its whole budget saying the same\nthing again. \U0001D53C is a function of the formation
  it fires: the entry that\nanswers is found by the λ name the formation carries,
  every operand is\nreduced from its bindings inside the one universe of the run,
  and the answer\nis built from what they came down to. So a run under `plausible`
  keeps what\nevery firing answered, by the formation it fired, and a later firing
  of the\nsame formation takes that answer, with the very symbols the first one minted,\ninstead
  of making it again. Two arguments spelling one term then come to one\nsymbol, here
  through an entry `L_pair` that fires both with `evaluate` lines:\n\n```bash\n$ cat
  twins.yaml\n- λ: L_number_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2:
  $.x\n  \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_pair\n  morph:\n    \U0001D45B1:
  $.a\n    \U0001D45B2: $.b\n  evaluate:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4:
  \U0001D45B2\n  \U0001D45B: ⟦ φ ↦ ⟦ a ↦ \U0001D45B3, b ↦ \U0001D45B4 ⟧ ⟧\n$ cat twins.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n
  \ pair ↦ ⟦ a ↦ ∅, b ↦ ∅, λ ⤍ L_pair ⟧,\n  t ↦ Φ.pair( 7.plus( 5.plus( 6 ) ), 7.plus(
  5.plus( 6 ) ) ).φ\n⟧\n$ phino morph --symbolic=twins.yaml --acyclic=plausible --locator=Q.t
  \\\n    --sweet --hide-rho twins.phi\n⟦\n  a ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ
  ⟧,\n  b ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ ⟧\n⟧\n```\n\nUnder `proven`
  `b` lands on `\U0001D70E4`, since its `evaluate` line fires the outer sum\nand the
  inner one once more. The protocol of the run above holds three firings\nof `L_number_plus`,
  two for `a` and one for `b`, since it records where \U0001D53C was\nasked and what
  it answered there; the one for `b` carries the answer lines of\nthe outer one for
  `a` and no operand line, since nothing was reduced for it,\nand it is not charged
  to `--max-firings`, which counts the firings the run\nmade. The formation is compared
  with everything it carries, `ρ` included, so\na firing on another object is another
  firing, yet it may take the same answer\nall the same: the run keeps every answer
  by the λ name and what the operands\ncame down to as well, and a firing whose operands
  come down to the data, the\nsymbols and the normal forms of one already answered
  takes that answer once\nthey are down, minting nothing. An attribute read from the
  `φ` of an object\nand then reached as a binding of it is read through two `ξ`, each
  the object\nminus the attribute being read, so it is two formations, but one firing,
  and\nso one symbol. A symbol counts as the symbol it is, not as the datum every\nsymbol
  manufactures, so two firings over two symbols stay two. The protocol\nwrites such
  a firing with its operand lines and the answer lines of the one\nit took the answer
  from, and `--max-firings` charges it like a firing made,\nsince a firing is charged
  as it starts bringing its operands down, which is\nthe only place a recursion widening
  inside its operands can be cut. A firing\ncut by the mode on its way to an answer
  keeps the cut, and the next firing of\nthe same formation is cut at its own site
  without reducing anything first. A\nfiring that got stuck keeps the λ function it
  got stuck on, and the next\nfiring of the same formation gets stuck at its own site
  the same way, with\nnothing reduced under it, as long as nothing new was answered
  in between.\nOnce something was, the formation is fired again, since an operand
  that could\nnot be brought down the first time may come down now.\n\nThe `--max-loops=<n>`
  option makes either mode more patient. A frame is cut\nonly once more than `n` of
  the formations the frames above it entered are the\nsame as the one it is about
  to enter, so a recursion that stops within `n`\nrounds is never cut, and one that
  goes on is cut `n` rounds later. The default\nis `0`, which cuts on the first repeat.
  The option needs `--acyclic`, since\nnothing else cuts a loop. Here the second `f`
  holds `Φ.start`, which the first\n`f` is bound to, under a `Φ.stop`, so `plausible`
  cuts it, even though `stop`\nanswers data at once:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ cat once.phi\n⟦\n  f ↦ ⟦ x ↦ ∅, φ ↦ ξ.x.again ⟧,\n  start
  ↦ ⟦ again ↦ Φ.f( x ↦ Φ.stop( v ↦ Φ.start ) ) ⟧,\n  stop ↦ ⟦ v ↦ ∅, again ↦ ⟦ Δ ⤍
  01- ⟧ ⟧,\n  t ↦ Φ.f( x ↦ Φ.start )\n⟧\n$ phino dataize --locator=Q.t --acyclic=plausible
  once.phi\n[ERROR]: Reduction entered a formation it is already inside: ⟦ x ↦ Φ.stop(
  v ↦ Φ.start ), φ ↦ x.again ⟧\n$ phino dataize --locator=Q.t --acyclic=plausible
  --max-loops=1 once.phi\n01-\n```\n\n<!-- markdownlint-enable MD013 -->\n\n## Rewrite\n\nYou
  can rewrite this expression with the help of [rules](#rule-structure)\ndefined in
  the `my-rule.yml` YAML file (here, the `!d1` and `!B1` are capturing\ngroups, similar
  to regular expressions):\n\n```yaml\nname: My custom rule\npattern: ⟦ Δ ⤍ !d1, !B1
  ⟧\nresult: ⟦ Δ ⤍ 62-79-65, !B1 ⟧\n```\n\nThen, rewrite:\n\n```bash\n$ phino rewrite
  --rule=my-rule.yml hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧, t ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\nIf
  you want to use many rules, just use `--rule` as many times as you need:\n\n```bash\nphino
  rewrite --rule=rule1.yaml --rule=rule2.yaml ...\n```\n\nYou can also use [built-in
  rules](resources), which are designed\nto normalize expressions:\n\n```bash\nphino
  rewrite --normalize hello.phi\n```\n\nBoth flags may be combined, so that your own
  rules are applied\nalongside the built-in ones, in a single rewriting session:\n\n```bash\nphino
  rewrite --normalize --rule=my-rule.yaml hello.phi\n```\n\nSome rules mint fresh
  synthetic names via the `random-string` built-in. To\nkeep the output reproducible
  across runs, `phino` seeds the random generator\ndeterministically with `0` by default.
  Use `--seed` to pick a different seed:\n\n```bash\nphino rewrite --seed=42 --rule=my-rule.yml
  hello.phi\n```\n\nIf no input file is provided, the \U0001D711-expression is taken
  from `stdin`:\n\n```bash\n$ echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino rewrite
  --rule=my-rule.yml\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass [`XMIR`][xmir]
  as input. Use `--input=xmir` and `phino`\nwill parse given `XMIR` from file or `stdin`
  and convert it to `phi` AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml --input=xmir
  file.xmir\n```\n\nAlso `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout( α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍
  68-65-6C-6C-6F ⟧ ) ) )\n⟧\n```\n\nThe two styles may be mixed in one expression,
  so `[[ x -> ∅ ]]` reads the\nsame as `⟦ x ↦ ∅ ⟧`. The `--monoform` option forbids
  that: the first symbol\nthat has two spellings picks the style of the whole expression,
  and a later\nsymbol of the other style is an error. Under `--monoform`, `[[ x ->
  ∅ ]]`\nfails, since `∅` at 1:9 mixes with the ASCII `[[` at 1:1. The option is\naccepted
  by `rewrite`, `dataize`, `morph`, `merge` and `match`.\n\nA formation of a single
  binding may be written as its asset, a colon,\nand the attribute the asset is bound
  to:\n\n```text\n⟦ Δ ⤍ FF-AA ⟧    = FF-AA:Δ    = FF-AA:D\n⟦ λ ⤍ \U0001D70E1 ⟧       =
  \U0001D70E1:λ       = !S1:L\n⟦ a ↦ ∅ ⟧        = ∅:a        = ?:a\n⟦ φ ↦ ξ.a ⟧      =
  ξ.a:φ      = $.a:@\n```\n\nThe colon binds as tightly as a dot, so `ξ.a:φ.b` is
  `⟦ φ ↦ ξ.a ⟧.b`.\nWith `--sweet`, `phino` prints every such formation this way,
  so\n`⟦ x ↦ ⟦ φ ↦ ξ.a ⟧ ⟧` comes out as `a:φ:x` and `⟦ x(a) ↦ ⟦ φ ↦ a ⟧ ⟧`\nas `⟦
  x(a) ↦ a:φ ⟧`: the formation inline voids open takes the sugar,\nwhile the one holding
  the voids keeps its brackets, and so does\nevery formation in the salty syntax and
  in [LaTeX][latex].\n\nA formation has a receiver `ρ` only when it declares one among
  its voids, the\nway EO declares `^`: `⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧`, or `a(ρ) ↦ ⟦ t ↦ ξ.ρ.k
  ⟧` with\nthe void inline. `phino` adds none of its own, and a dispatch into a formation\nthat
  declares none hands it no `ρ` (the `skip` rule), so `ξ.ρ` there is `⊥`:\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ echo '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍ 01- ⟧, a ↦
  ⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧ ⟧.a.t ⟧' | phino rewrite --normalize --sweet\n01-:Δ:x\n$ echo
  '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍ 01- ⟧, b ↦ ⟦ t ↦ ξ.ρ.k ⟧ ⟧.b.t ⟧' | phino rewrite --normalize
  --sweet\n⊥:x\n```\n\n<!-- markdownlint-enable MD013 -->\n\n## Merge\n\nYou can merge
  several \U0001D711-expressions into a single one by merging their\ntop level formations:\n\n```bash\n$
  cat bytes.phi\n⟦ bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n  number ↦ ⟦\n    φ ↦
  ∅,\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦ number ↦ ⟦ minus(x)
  ↦ ⟦ λ ⤍ L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi minus.phi --sweet\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ, minus(x) ↦ L_number_minus:λ
  ⟧\n⟧\n```\n\n## Match\n\nYou can test the \U0001D711-expression matches against
  the [rule](#rule-structure)\npattern. The result output contains matched substitutions:\n\n```bash\n$
  phino match --pattern='⟦ Δ ⤍ !d, !B ⟧' hello.phi\nB >> ⟦⟧\nd >> 68-65-6C-6C-6F\n```\n\n##
  Compile\n\nBy default, `phino` reads its rules from YAML and interprets them at
  every\nstep. The `compile` command turns the rules into Haskell instead. Then a\nsecond
  build of `phino` runs them as plain functions:\n\n```bash\nphino compile\ncabal
  build all\n```\n\nThe command writes the module `compiled/generated/Compiled.hs`,
  which git\nignores. It compiles the built-in rules of normalization, the\ncontextualization
  function \U0001D49E, and every file you pass with `--rule`. The\n`--target` option
  writes the module somewhere else.\n\nA build links the module in only when the Cabal
  flag `compiled` is on. If\nthere is no `cabal.project.local`, `compile` creates
  one that turns the flag\non. If the file already exists, `compile` leaves it alone
  and prints the two\nlines to add to it:\n\n```text\npackage phino\n  flags: +compiled\n```\n\nThe
  compiled rules take exactly the same steps as the YAML ones, so the\noutput and
  every `--sequence` stay the same. A few things are still read from\nYAML at runtime:\n\n*
  the rules of morphing (\U0001D544) and dataization (\U0001D53B);\n* a `--rule` file
  that changed after `compile`;\n* the pattern of `match` and the `rewrite:` blocks
  of the `--symbolic` file.\n\nThe `explain` command also reads the rules from YAML.\n\n`compile`
  refuses a rule it cannot turn into Haskell and names the reason.\nFor example, it
  refuses a rule with `having`, a `where` function other than\n`contextualize` or
  `named`, or the conditions `matches` and `part-of`.\n\nA binary built this way refuses
  to run if the built-in rules changed after\nthe last `compile`, since it would run
  rules nobody wrote. Run `compile`\nagain and rebuild. To test the whole suite against
  the compiled rules, run:\n\n```bash\nmake compiled\n```\n\n## Explain\n\nYou can
  _explain_ the built-in rules by printing them in [LaTeX][latex]\nformat. Pass exactly
  one of `--normalize`, `--morph`, `--dataize` or\n`--contextualize` for the rewriting,
  morphing (\U0001D544), dataization (\U0001D53B) or\ncontextualization (\U0001D49E)
  rules (or `--rule` for a custom rule file):\n\n```bash\n$ phino explain --normalize\n\\begin{tabular}{rl}\n\\phinoNormalizationRule{alpha}\n
  \ { [[ B_1, \\tau -> ?, B_2 ]] ( \\phiTerminal{\\alpha_{i}} -> e ) }\n  { [[ B_1,
  \\tau -> ?, B_2 ]] ( \\tau -> e ) }\n  { $ i = \\vert \\overline{ B_1 } \\vert $
  }\n  { }\n\\phinoNormalizationRule{dc}\n  { T ( \\tau -> e ) }\n  { T }\n  { }\n
  \ { }\n...\n\\phinoNormalizationRule{stop}\n  { [[ B ]] . \\tau }\n  { T }\n  {
  $ [ \\tau \\char44{} @ \\char44{} L ] \\cap B = \\emptyset $ }\n  { }\n\\end{tabular}\n```\n\nThe
  morphing and dataization rules are printed the same way:\n\n```bash\n$ phino explain
  --morph\n\\begin{tabular}{rl}\n\\phinoMorphingRule{mf}\n  { \\mathbb{M}( [[ B ]],
  e ) }\n  { [[ B ]] }\n  { }\n  { }\n...\n\\phinoMorphingRule{universe}\n  { \\mathbb{M}(
  Q, e ) }\n  { \\mathbb{M}( \\phinoNormalize{ e }, e ) }\n  { $ e \\not= Q $ }\n
  \ { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --dataize\n\\begin{tabular}{rl}\n\\phinoDataizationRule{delta}\n
  \ { \\phinoDataize{ [[ B_1, D> \\delta_0, B_2 ]] } }\n  { \\delta_0 }\n  { }\n  {
  }\n...\n\\phinoDataizationRule{norm}\n  { \\phinoDataize{ n } }\n  { \\phinoDataize{
  \\mathbb{M}( n, e ) } }\n  { }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain
  --contextualize\n\\begin{phinoContextualizationInference}\n  \\phinoName{cxi}\n
  \ \\phinoConclusion{ \\phinoContextualize{ \\phiTerminal{\\xi} }{ k }{ k } }\n\\end{phinoContextualizationInference}\n...\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cd}\n  \\phinoPremise{ \\phinoContextualize{ n }{ k }{ n_1 } }\n  \\phinoConclusion{
  \\phinoContextualize{ n . \\tau }{ k }{ n_1 . \\tau } }\n\\end{phinoContextualizationInference}\n```\n\nFor
  more details, use `phino [COMMAND] --help` option.\n\n## Rule structure\n\nThis
  is BNF-like yaml rule structure. Here types ended with\napostrophe, like `Attribute'`
  are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # returns True if every given attribute exists in\n      - Attribute'
  | [Attribute'] # the union of the given bindings\n      - Binding' | [Binding']\n
  \ | nf: Expression'      # returns True if given expression in normal form\n                         #
  which means that no more other normalization rules\n                         # can
  be applied\n  | absolute: Expression' # returns True if given expression is xi-free,
  i.e.\n                         # there is no ξ outside of a formation: it is Φ,
  a\n                         # formation, a dispatch with a xi-free subject, or an\n
  \                        # application with a xi-free subject and argument.\n                         #
  Combined with a normal-form check by the '\U0001D458'/'!k'\n                         #
  meta variable, which ranges over the absolute\n                         # expressions
  \U0001D4A6 ⊆ \U0001D4A9, used by the Rcopy rule.\n  | matches:             # returns
  True if given expression after dataization\n      - String           # matches to
  given regex\n      - Expression\n  | part-of:             # returns True if given
  expression is attached to any\n      - Expression'      # attribute in ginve bindings\n
  \     - BiMeta'\n  | formation:           # returns True if given expression is
  a formation\n      Expression'        # (an abstraction ⟦…⟧); used by morphing 'md'\n
  \                        # as 'not (formation \U0001D45B)', so a non-formation head
  is\n                         # morphed and a formation head is left to 'ml'\n  |
  gt:                  # returns True if the first comparable object is\n      - Comparable
  \      # greater than the second one\n      - Comparable\n  | disjoint:            #
  returns True if none of the given attributes exists\n      - [Attribute']     #
  in the given bindings\n      - Binding'\n\nComparable:              # comparable
  object that may be used in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:
  \                 # comparable number\n  = Integer              # just regular integer\n
  \ | IndexMeta'           # \U0001D456 (or !i), the index captured by an α\U0001D456
  argument\n  | length: BiMeta'      # calculate length of bindings by given meta
  binding\n  | domain: BiMeta'      # calculate number of unique attributes in given\n
  \                        # meta binding (excluding 'assets')\n\nExtension:               #
  substitutions extension used to introduce new meta variables\n  meta: [ExtArgument]
  \   # new introduced meta variable\n  function: String       # name of the function\n
  \ args: [ExtArgument]    # arguments of the function\n\nExtArgument\n  = Bytes'
  \              # !d\n  | Binding'             # !B\n  | Expression'          # !e\n
  \ | Attribute'           # !t\n```\n\nHere's list of functions that are supported
  for extensions:\n\n* `contextualize` - function of two arguments, that rewrites
  given expression\n  depending on provided context according to the contextualization\n
  \ [rules](assets/contextualize.jpg)\n* `random-tau` - creates an attribute with
  a random unique name. It accepts no\n  arguments; uniqueness is guaranteed across
  all names already taken in the\n  document.\n* `dataize` - dataizes given expression
  and returns bytes.\n* `concat` - accepts bytes or dataizable expressions as arguments,\n
  \ concatenates them into single sequence and convert it to expression\n  that can
  be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦ Δ ⤍ !d ⟧)`.\n*
  `sed` - pattern replacer, works like unix `sed` function.\n  Accepts two arguments:
  target expression and pattern.\n  Pattern must start with `s/`, consists of three
  parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces all
  the spaces with empty string. To escape braces and slashes\n  in pattern and replacement
  parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string` -
  accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `\U0001D6FF` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n* `!S` || `\U0001D70E`
  - a symbol standing where a λ name stands (see\n                [Symbols](#symbols)).
  It is spelled the way a meta variable is\n                spelled but is a name
  and no capture: `\U0001D70E1` is one concrete\n                symbol, which no
  substitution ever binds, and a bare `\U0001D70E` in the\n                answer
  of a `--symbolic` entry asks for a fresh one\n\nA meta variable carries a suffix,
  like `!B1` or `\U0001D70F2`, to name what it\ncaptured, so that the `result`, `when`,
  `where` and `having` of a rule can\nread it back. An index starts with one: a suffix
  of `0`, as in `!B0` or\n`\U0001D70F0`, is refused where it is written, because it
  is a first index spelled\nwrong and no name. A positional argument keeps counting
  from zero, though,\nsince `α0` is an index of the calculus and no meta variable.\n\nWritten
  bare, with no suffix at all, a meta variable is anonymous: it matches\nwhatever
  term stands in its place, every occurrence on its own, and binds no\nname. Two anonymous
  metas of one kind are therefore two different captures,\nwhich is what lets a pattern
  ask for any two attributes without inventing\nnames for them:\n\n```yaml\nname:
  two-attributes\npattern: '⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧'\nresult:
  '⟦ x ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧'\n```\n\nSpelled with suffixes, that pattern would read `⟦
  \U0001D70F1 ↦ \U0001D4521, \U0001D70F2 ↦ \U0001D4522 ⟧` and\nname four captures
  the result never mentions, while `⟦ \U0001D70F1 ↦ \U0001D4521, \U0001D70F1 ↦ \U0001D4521
  ⟧`\nwould be rejected as a duplicated attribute.\n\nNothing can refer to an anonymous
  meta, since it has no name to be referred to\nby. Writing one outside a `pattern`
  (or the `match`, `universe` and `c-match` of\nan inference rule) is a mistake in
  the rule and is reported as the rule loads.\n\nA positional (α) application argument
  is written as `α0`, `~0` (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured
  by an `!i`/`\U0001D456` meta variable.\n\nIncorrect usage of meta variables in \U0001D711-expression
  patterns leads to\nparsing errors.\n\n## Benchmark\n\nTo run performance benchmarks,
  you need [Java 8+][java] and [curl][curl].\nMaven is downloaded automatically on
  first run via `benchmark/mvnw`.\n\nThe benchmark uses the compiled [`Native`][jna-native]
  class from\n[JNA][jna] — a large real-world Java class — as its test input.\nOn
  first run, `make bench` downloads the class, disassembles it to\n[XMIR][xmir] via
  [jeo-maven-plugin][jeo], converts it to \U0001D711 using\n`phino rewrite`, and caches
  the results in `benchmark/tmp/`.\nSubsequent runs skip straight to the benchmarks.\n\nBesides
  parsing, printing and rewriting that class, the suite morphs\nsymbolically. `benchmark/demo.phi`
  is a small world whose entries name the λ\nfunctions of `benchmark/atoms.yaml`,
  and each entry is a case of its own, so\nthat a slowdown of one of them is a line
  of the report rather than a share of\na single total. The smallest entry — one λ
  function fired against one unknown\n— is timed twice, over the demo world alone
  and over the same world merged\ninto the class, and the two numbers say between
  them what the world around an\nentry costs (see [#1291][issue-1291]).\n\nA case
  whose single run is measured in seconds gets fewer warmups and fewer\nbatches than
  a case measured in microseconds, since the whole suite runs\ninside one job; the
  report says how many of each a case was given.\n\n```bash\nmake bench\n```\n\n<!--
  benchmark_begin -->\n\n```text\n=== parse/phi ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      1797890.573 μs\n  avg:        179789.057 μs\n
  \ min:        162091.874 μs\n  max:        210027.085 μs\n  std dev:    16246.548
  μs\n=== parse/xmir ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     7935401.706 μs\n  avg:        793540.171 μs\n  min:        737257.079 μs\n
  \ max:        864759.805 μs\n  std dev:    46225.278 μs\n=== rewrite/normalize ===\n
  \ warmup:     3 iterations\n  batches:    10 x 1\n  total:      17.396 μs\n  avg:
  \       1.740 μs\n  min:        1.603 μs\n  max:        2.082 μs\n  std dev:    0.127
  μs\n=== print/sweet/multiline ===\n  warmup:     3 iterations\n  batches:    10
  x 1\n  total:      5454056.634 μs\n  avg:        545405.663 μs\n  min:        515758.348
  μs\n  max:        582503.512 μs\n  std dev:    22764.961 μs\n=== print/sweet/flat
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      552072.467
  μs\n  avg:        55207.247 μs\n  min:        49412.521 μs\n  max:        67399.308
  μs\n  std dev:    7769.298 μs\n=== print/salty/multiline ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      17341236.442 μs\n  avg:        1734123.644 μs\n
  \ min:        1695951.065 μs\n  max:        1783518.134 μs\n  std dev:    22630.032
  μs\n=== morph/symbolic/demo/e1 ===\n  warmup:     3 iterations\n  batches:    10
  x 11\n  total:      10945.365 μs\n  avg:        99.503 μs\n  min:        97.173
  μs\n  max:        103.887 μs\n  std dev:    1.985 μs\n=== morph/symbolic/demo/e2
  ===\n  warmup:     3 iterations\n  batches:    10 x 174\n  total:      174504.049
  μs\n  avg:        100.290 μs\n  min:        99.832 μs\n  max:        101.139 μs\n
  \ std dev:    0.345 μs\n=== morph/symbolic/demo/e3 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 171\n  total:      173859.715 μs\n  avg:        101.672 μs\n
  \ min:        101.424 μs\n  max:        102.096 μs\n  std dev:    0.212 μs\n===
  morph/symbolic/demo/e4 ===\n  warmup:     3 iterations\n  batches:    10 x 152\n
  \ total:      155114.153 μs\n  avg:        102.049 μs\n  min:        101.576 μs\n
  \ max:        103.791 μs\n  std dev:    0.632 μs\n=== morph/symbolic/demo/e5 ===\n
  \ warmup:     3 iterations\n  batches:    10 x 160\n  total:      164432.368 μs\n
  \ avg:        102.770 μs\n  min:        101.849 μs\n  max:        105.495 μs\n  std
  dev:    1.045 μs\n=== morph/symbolic/native/e5 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 165\n  total:      171308.171 μs\n  avg:        103.823 μs\n
  \ min:        102.973 μs\n  max:        106.133 μs\n  std dev:    0.997 μs\n===
  morph/symbolic/accum/0 ===\n  warmup:     3 iterations\n  batches:    10 x 121\n
  \ total:      105704.677 μs\n  avg:        87.359 μs\n  min:        87.144 μs\n
  \ max:        87.909 μs\n  std dev:    0.218 μs\n=== morph/symbolic/accum/400 ===\n
  \ warmup:     3 iterations\n  batches:    10 x 79\n  total:      70197.862 μs\n
  \ avg:        88.858 μs\n  min:        88.372 μs\n  max:        89.549 μs\n  std
  dev:    0.357 μs\n```\n\nThe results were calculated in [this GHA job][benchmark-gha]\non
  2026-10-13 at 15:50,\non Linux with 4 CPUs.\n\n<!-- benchmark_end -->\n\n## How
  to Contribute\n\nFork repository, make changes, then send us a [pull request][guidelines].\nWe
  will review your changes and apply them to the `master` branch shortly,\nprovided
  they don't violate our quality standards. To avoid frustration,\nbefore sending
  us your pull request please make sure all your tests pass:\n\n```bash\nmake all\n```\n\nTo
  generate a local coverage report for development, run:\n\n```bash\nmake coverage\n```\n\nTo
  build a `phino` executable into the root of the repository, run:\n\n```bash\nmake
  phino\n```\n\nThis produces an executable `phino` (or `phino.exe` on Windows) in
  the\nproject root, which you can run directly for quick local testing:\n\n```bash\n./phino
  --version\n```\n\nYou will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor
  [Stack ≥ 3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]:
  https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]: https://www.haskell.org/ghc/\n[guidelines]:
  https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]: https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]:
  https://en.wikipedia.org/wiki/LaTeX\n[java]: https://www.java.com/en/download/\n[curl]:
  https://curl.se/\n[gha]: https://docs.github.com/en/actions\n[jna]: https://github.com/java-native-access/jna\n[jna-native]:
  https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[issue-1291]: https://github.com/objectionary/phino/issues/1291\n[benchmark-gha]:
  https://github.com/objectionary/phino/actions/runs/38425077680\n"
