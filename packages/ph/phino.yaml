description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.157\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\nIn
  a [GitHub Actions][gha] workflow, one step downloads the binary\nfor the runner
  and puts it on the `PATH`:\n\n```yaml\n- uses: objectionary/phino@0.0.157\n  with:\n
  \   version-file: phino-version.txt\n- run: phino --version\n```\n\nThe file holds
  the version to install, such as `0.0.150`.\nGive `version: 0.0.150` instead of `version-file`
  to write the version\nin the workflow itself.\n\n## Build\n\nTo build `phino` from
  source, clone this repository and build it with\n[Cabal][cabal]:\n\n```bash\ngit
  clone git@github.com:objectionary/phino.git\ncd phino\ncabal build all\nsudo cp
  \"$(cabal list-bin phino)\" /usr/local/bin/phino\n```\n\nThe global `--pin` option
  fails the run when the installed version is not\nthe one given, and `--pin-file`
  reads that version from a file:\n\n```bash\nphino --pin=0.0.0.67 dataize hello.phi\n```\n\n##
  Dataize\n\nThen, you dataize the expression:\n\n```bash\n$ phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n###
  Symbolic λ functions\n\n`phino` implements no λ function.\nThey come from a YAML
  file given with `--symbolic`, one entry per λ function.\nAn entry never computes
  a value.\nIt answers with a term that holds a symbol, `\U0001D70E`, which names
  a value nobody\nworked out.\nHere is `atoms.yaml`, which the examples below use:\n\n```yaml\n-
  λ: L_number_(plus|times)\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n
  \ \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n```\n\n```bash\n$ cat sum.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n
  \ φ ↦ 5.plus( 6 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho sum.phi\n40-45-00-00-00-00-00-00\n```\n\nDataizing
  a symbol always gives the same bytes, the number 42, as above.\n\nInside an entry,
  `$` is the formation being fired and `Φ` is the universe.\nA meta is a named placeholder:
  `\U0001D6FF1`, `\U0001D6FF2` and so on hold bytes, while `\U0001D45B1`,\n`\U0001D45B2`
  and so on hold terms.\nAn entry may hold only the keys below, and any other key
  refuses the whole\nfile:\n\n* `λ` is a regular expression that matches the whole
  λ name.\n  No two entries may match the same name.\n* `dataize` binds a bytes meta
  to the data a term comes down to through\n  dataization, \U0001D53B.\n  The term
  is a path from `$`, as in `\U0001D6FF1: $.ρ`, or a meta another line binds,\n  as
  in `\U0001D6FF2: \U0001D45B1`.\n* `morph` binds a term meta to the normal form a
  term reaches through\n  morphing, \U0001D544.\n  The term is a path from `$`, as
  in `\U0001D45B1: $.x`, or a meta another line binds,\n  as in `\U0001D45B4: \U0001D45B3`.\n*
  `evaluate` binds a term meta to the answer of firing the formation another\n  meta
  holds, through evaluation, \U0001D53C, as in `\U0001D45B2: \U0001D45B1`.\n* `defer`
  binds a term meta to a fresh symbol when another meta holds a copy\n  of an object
  whose argument is a bare symbol, `⟦ λ ⤍ \U0001D70E1 ⟧`, and to that\n  term as it
  is otherwise.\n* `stay` binds a term meta to the term another meta holds, with every\n
  \ `( ρ ↦ … )` applied to a dispatch dropped.\n* `symbolize` binds a term meta to
  the term another meta holds, with every\n  datum turned into a fresh symbol.\n*
  `rewrite` binds a term meta to the term the meta under `of` holds, with the\n  rules
  under `rules` applied and nothing normalized afterwards.\n  The rules are written
  as in a [rule file](#rule-structure).\n* `\U0001D45B` is the term the entry answers
  with.\n  A bare `\U0001D70E` in it stands for a fresh symbol, and no `\U0001D6FF`
  may appear in it.\n* `join` answers with one term made of two sides, in place of
  `\U0001D45B`.\n  It holds `on`, the condition, which is a bytes meta of `dataize`
  or a path\n  from `$`.\n  It holds `left` and `right`, the two sides, each a path
  from `$` or a term\n  meta.\n  It may hold `otherwise`, a λ name that joins two
  formations of different\n  shapes one attribute at a time, and the file must answer
  that name too.\n\nAn entry holds either `\U0001D45B` or `join`, never both.\nThe
  lines of all blocks run in the order of the metas they read, not in the\norder of
  the blocks.\nA line that reads a meta nothing binds refuses the file.\n\n### Partial
  evaluation\n\nA λ name that no entry answers stops the run with an error.\nWith
  `--partial`, the run prints the residual program instead: what the known\ninputs
  decide is computed, and the rest stays in place:\n\n```bash\n$ cat partial.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦ ⟦ λ ⤍ L_number_as_bool
  ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --sweet --hide-rho partial.phi\n[ERROR]: No entry of --symbolic answers the λ function
  'L_number_as_bool'\n$ phino dataize --symbolic=atoms.yaml --partial --sweet --hide-rho
  partial.phi\nL_number_as_bool:λ\n```\n\nHere `2.times( 3 ).plus( 4 )` was computed,
  and the symbol it came to sits in\nthe hidden `ρ`, while `as-bool` stays where it
  was.\nAn operand that reaches the terminator `⊥` is left in place the same way.\n\n###
  Reducing a term inside a universe\n\nThe `--inside` option reduces a term the program
  does not hold, taking the\nprogram as the universe Φ.\nIt cannot be combined with
  `--locator`:\n\n```bash\n$ cat universe.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦
  ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --inside='5.plus( 6 )' universe.phi\n40-45-00-00-00-00-00-00\n```\n\n### Limits\n\nThree
  options stop a run that goes on for too long:\n\n* `--max-steps` bounds how deep
  morphing and dataization may nest,\n  `1000` by default;\n* `--max-firings` bounds
  how many λ functions the whole run may fire;\n* `--max-seconds` bounds how many
  seconds the whole run may take.\n\n`--partial` leaves a site in place when it runs
  out of steps or firings, but\na run out of time always fails.\n\n## Morph\n\nMorphing,
  \U0001D544, evaluates as far as the object model allows without asking\nfor data,
  and stops at the first formation it reaches:\n\n```bash\n$ cat two.phi\n⟦\n  bytes
  ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n  φ ↦ 5.plus(
  6 ).plus( 7 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho two.phi\n40-45-00-00-00-00-00-00\n$
  phino morph --symbolic=atoms.yaml --locator=Q.φ --sweet --hide-rho two.phi\n⟦ x
  ↦ 7.0, λ ⤍ L_number_plus ⟧\n```\n\nThe inner `5.plus( 6 )` fires, because `.plus`
  is dispatched on its result,\nwhile the outer call is left for dataization.\nWhere
  no formation is reachable, `morph` prints `⊥`.\nIt fails on a term that is not a
  normal form.\nIt takes every option of `dataize`.\n\n### Acyclic morphing\n\n`phino`
  stops no recursion by itself, so a run that never ends fails once\n`--max-steps`
  runs out.\nThe `--acyclic=<mode>` option makes the run notice a loop instead.\nWhen
  a reduction is about to enter a formation it is already inside, the run\nstops there
  and leaves the term in place, as `--partial` does.\nThe mode says when two formations
  are the same:\n\n* `proven` means equal up to a renaming of symbols;\n* `plausible`
  also means that the later one holds the earlier one under\n  wrappers it gained,
  such as a growing accumulator, so it may cut a\n  recursion that would have stopped.\n\nUnder
  `plausible`, a formation is fired only once, and a later firing of it\ntakes the
  answer of the first one.\nThe `--max-loops=<n>` option lets a reduction enter such
  a formation `n` more\ntimes before it is cut.\n`dataize` takes `--acyclic` too,
  and fails on a cut unless `--partial` is\ngiven, since a cut term holds no data
  to print.\n\n## Protocol\n\nThe `--protocol` option writes every λ function the
  run fired into a file,\nas a tree.\nA file whose name ends in `.xml` gets the tree
  as XML, for a program to read,\nand any other name gets indented text.\nHere, `L_down`
  answers with a call of its own object over a fresh symbol, so\nwithout `--acyclic`
  the run would go on until `--max-steps` runs out:\n\n```bash\n$ cat down.yaml\n-
  λ: L_down\n  dataize:\n    \U0001D6FF1: $.x\n  \U0001D45B: Φ.down( x ↦ ⟦ λ ⤍ \U0001D70E
  ⟧ )\n$ cat down.phi\n⟦\n  down ↦ ⟦ x ↦ ∅, λ ⤍ L_down ⟧,\n  y ↦ Φ.down( x ↦ ⟦ λ ⤍
  \U0001D70E1 ⟧ ).φ\n⟧\n$ phino morph --symbolic=down.yaml --locator=Q.y --acyclic=proven
  \\\n    --protocol=down.txt --sweet --hide-rho down.phi\n⟦ x ↦ \U0001D70E1:λ, λ
  ⤍ L_down ⟧.φ\n$ cat down.txt\n\U0001D544(Φ.y):\n  \U0001D45B·0·1 := Φ.down( x ↦
  \U0001D70E1:λ )\n  \U0001D53C(L_down):\n    \U0001D53B(ξ.x):\n      \U0001D6FF·1·1
  := \U0001D53B(\U0001D70E1:λ)\n    \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.x)\n
  \   \U0001D45B·1·1 := Φ.down( x ↦ \U0001D70E2:λ )  # \U0001D45B\n    \U0001D544(\U0001D45B·1·1):\n
  \     \U0001D45B·1·2 := Φ.down( x ↦ \U0001D70E2:λ )\n      morphed \U0001D45B·1·3
  := \U0001D45B·1·2\n    \U0001D45B·1·4 := \U0001D45B·1·2  # \U0001D544(\U0001D45B·1·1)\n
  \ looped \U0001D45B·0·1  # proven\n```\n\nIn a name such as `\U0001D45B·1·2`, the
  first number counts the firings, `0` outside\nevery firing, and the second counts
  the names within that firing.\nThe name `\U0001D6FF1·1` is the meta `\U0001D6FF1`
  of the first firing.\nA protocol may hold these lines:\n\n* `\U0001D53B(…):` and
  `\U0001D544(…):` open a block where dataization or morphing starts at a\n  new site,
  and what it does stands under it.\n* `\U0001D53C(…):` opens one firing, named by
  its λ function.\n* `\U0001D45B·0·1 := …` names an object an application made.\n*
  `\U0001D6FF1·1 := …` binds a meta of the entry, and the comment names the judgment\n
  \ and the term it came from.\n* `\U0001D45B·1·1 := …  # \U0001D45B` is the term
  the entry answered with, and the line\n  commented with `\U0001D544(\U0001D45B·1·1)`
  is its normal form.\n* `boxed …` is dataization stepping into the `φ` of a formation.\n*
  `\U0001D6FF·1·1 := …` closes a `\U0001D53B` block with the data it found, or with\n
  \ `\U0001D53B(\U0001D70E1:λ)` where it came down to a symbol.\n* `morphed …` closes
  a `\U0001D544` block with the term it came to.\n* `joined …`, `fabricated …` and
  `diverged …` are what a `join` made of its\n  two sides, or why it could not join
  them.\n* `deferred …` and `symbolized …` are the symbols a `defer` or a `symbolize`\n
  \ line minted.\n* `unanswered …` is a λ name no entry answers.\n* `stuck …` closes
  a firing that got stuck, and `stall …` stands under one\n  that `--acyclic=plausible`
  answered with an earlier stall.\n* `looped …` is where `--acyclic` cut a loop.\n*
  `starved …`, `spent …` and `timeout …` are where `--max-steps`,\n  `--max-firings`
  and `--max-seconds` ran out.\n* `msec …`, `firings …` and `fps …` close the file,
  and the listing above\n  leaves them out, since they differ from run to run.\n\nThe
  `--abridged` option folds every formation longer than sixty-four\ncharacters, or
  than `--abridged=WIDTH`, into its `φ`, `Δ` and `λ` and a count\nof the rest.\nThe
  `--abridged-data` option also cuts every byte string longer than eight\nbytes down
  to its first two bytes and its last two.\n\n## Rewrite\n\nYou can rewrite this expression
  with the help of [rules](#rule-structure)\ndefined in the `my-rule.yml` YAML file
  (here, the `!d1` and `!B1` are capturing\ngroups, similar to regular expressions):\n\n```yaml\nname:
  My custom rule\npattern: ⟦ Δ ⤍ !d1, !B1 ⟧\nresult: ⟦ Δ ⤍ 62-79-65, !B1 ⟧\n```\n\nThen,
  rewrite:\n\n```bash\n$ phino rewrite --rule=my-rule.yml hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65
  ⟧, t ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\nIf you want to use many rules, just use `--rule` as
  many times as you need:\n\n```bash\nphino rewrite --rule=rule1.yaml --rule=rule2.yaml
  ...\n```\n\nYou can also use [built-in rules](resources), which are designed\nto
  normalize expressions, alone or together with your own rules:\n\n```bash\nphino
  rewrite --normalize --rule=my-rule.yaml hello.phi\n```\n\nSome rules mint fresh
  names with the `random-string` function, and `--seed`\npicks the seed of its random
  generator, `0` by default.\n\nIf no input file is provided, the \U0001D711-expression
  is taken from `stdin`:\n\n```bash\n$ echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino
  rewrite --rule=my-rule.yml\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass
  [`XMIR`][xmir] as input. Use `--input=xmir` and `phino`\nwill parse given `XMIR`
  from file or `stdin` and convert it to `phi` AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml
  --input=xmir file.xmir\n```\n\nAlso `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout( α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍
  68-65-6C-6C-6F ⟧ ) ) )\n⟧\n```\n\nThe two styles may be mixed in one expression,
  unless `--monoform` is given.\n\nA formation of a single binding may be written
  as its asset, a colon,\nand the attribute the asset is bound to:\n\n```text\n⟦ Δ
  ⤍ FF-AA ⟧    = FF-AA:Δ    = FF-AA:D\n⟦ λ ⤍ \U0001D70E1 ⟧       = \U0001D70E1:λ       =
  !S1:L\n⟦ a ↦ ∅ ⟧        = ∅:a        = ?:a\n⟦ φ ↦ ξ.a ⟧      = ξ.a:φ      = $.a:@\n```\n\nThe
  colon binds as tightly as a dot, so `ξ.a:φ.b` is `⟦ φ ↦ ξ.a ⟧.b`.\nWith `--sweet`,
  `phino` prints every such formation this way.\n\nA formation has a receiver `ρ`
  only when it declares one among its voids, the\nway EO declares `^`, as in `⟦ ρ
  ↦ ∅, t ↦ ξ.ρ.k ⟧`.\n`phino` adds none of its own, so `ξ.ρ` in a formation that declares
  none\nis `⊥`.\n\n## Merge\n\nYou can merge several \U0001D711-expressions into a
  single one by merging their\ntop level formations:\n\n```bash\n$ cat bytes.phi\n⟦
  bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(x)
  ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦ number ↦ ⟦ minus(x) ↦ ⟦ λ ⤍
  L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi minus.phi --sweet\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ, minus(x) ↦ L_number_minus:λ
  ⟧\n⟧\n```\n\n## Match\n\nYou can test the \U0001D711-expression matches against
  the [rule](#rule-structure)\npattern. The result output contains matched substitutions:\n\n```bash\n$
  phino match --pattern='⟦ Δ ⤍ !d, !B ⟧' hello.phi\nB >> ⟦⟧\nd >> 68-65-6C-6C-6F\n```\n\n##
  Compile\n\nBy default, `phino` reads its rules from YAML and interprets them at
  every\nstep.\nThe `compile` command turns the built-in rules of normalization,\ncontextualization,
  morphing and dataization, and every `--rule` file, into\nthe Haskell module `compiled/generated/Compiled.hs`,
  and a second build links\nit in:\n\n```bash\nphino compile\ncabal build all\n```\n\nThe
  build links the module in only when the Cabal flag `compiled` is on.\nIf there is
  no `cabal.project.local`, `compile` creates one that turns the\nflag on, and otherwise
  it prints the lines to add to it.\nThe compiled rules take exactly the same steps
  as the YAML ones.\n`compile` refuses a rule it cannot turn into Haskell and names
  the reason.\nA binary built this way refuses to run once the built-in rules changed
  after\nthe last `compile`.\nTo test the whole suite against the compiled rules,
  run `make compiled`.\n\n## Explain\n\nYou can _explain_ the built-in rules by printing
  them in [LaTeX][latex]\nformat. Pass exactly one of `--normalize`, `--morph`, `--dataize`
  or\n`--contextualize` for the rewriting, morphing (\U0001D544), dataization (\U0001D53B)
  or\ncontextualization (\U0001D49E) rules (or `--rule` for a custom rule file):\n\n```bash\nphino
  explain --normalize\n```\n\nFor more details, use `phino [COMMAND] --help` option.\n\n##
  Rule structure\n\nThis is BNF-like yaml rule structure. Here types ended with\napostrophe,
  like `Attribute'` are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # returns True if every given attribute exists in\n      - Attribute'
  | [Attribute'] # the union of the given bindings\n      - Binding' | [Binding']\n
  \ | nf: Expression'      # returns True if given expression in normal form\n                         #
  which means that no more other normalization rules\n                         # can
  be applied\n  | absolute: Expression' # returns True if given expression is xi-free,
  i.e.\n                         # there is no ξ outside of a formation: it is Φ,
  a\n                         # formation, a dispatch with a xi-free subject, or an\n
  \                        # application with a xi-free subject and argument.\n                         #
  Combined with a normal-form check by the '\U0001D458'/'!k'\n                         #
  meta variable, which ranges over the absolute\n                         # expressions
  \U0001D4A6 ⊆ \U0001D4A9, used by the Rcopy rule.\n  | matches:             # returns
  True if given expression after dataization\n      - String           # matches to
  given regex\n      - Expression\n  | part-of:             # returns True if given
  expression is attached to any\n      - Expression'      # attribute in ginve bindings\n
  \     - BiMeta'\n  | formation:           # returns True if given expression is
  a formation\n      Expression'        # (an abstraction ⟦…⟧); used by morphing 'md'\n
  \                        # as 'not (formation \U0001D45B)', so a non-formation head
  is\n                         # morphed and a formation head is left to 'ml'\n  |
  gt:                  # returns True if the first comparable object is\n      - Comparable
  \      # greater than the second one\n      - Comparable\n  | disjoint:            #
  returns True if none of the given attributes exists\n      - [Attribute']     #
  in the given bindings\n      - Binding'\n\nComparable:              # comparable
  object that may be used in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:
  \                 # comparable number\n  = Integer              # just regular integer\n
  \ | IndexMeta'           # \U0001D456 (or !i), the index captured by an α\U0001D456
  argument\n  | length: BiMeta'      # calculate length of bindings by given meta
  binding\n  | domain: BiMeta'      # calculate number of unique attributes in given\n
  \                        # meta binding (excluding 'assets')\n\nExtension:               #
  substitutions extension used to introduce new meta variables\n  meta: [ExtArgument]
  \   # new introduced meta variable\n  function: String       # name of the function\n
  \ args: [ExtArgument]    # arguments of the function\n\nExtArgument\n  = Bytes'
  \              # !d\n  | Binding'             # !B\n  | Expression'          # !e\n
  \ | Attribute'           # !t\n```\n\nHere's list of functions that are supported
  for extensions:\n\n* `contextualize` - function of two arguments, that rewrites
  given expression\n  depending on provided context according to the contextualization\n
  \ [rules](assets/contextualize.jpg)\n* `random-tau` - creates an attribute with
  a random unique name. It accepts no\n  arguments; uniqueness is guaranteed across
  all names already taken in the\n  document.\n* `dataize` - dataizes given expression
  and returns bytes.\n* `concat` - accepts bytes or dataizable expressions as arguments,\n
  \ concatenates them into single sequence and convert it to expression\n  that can
  be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦ Δ ⤍ !d ⟧)`.\n*
  `sed` - pattern replacer, works like unix `sed` function.\n  Accepts two arguments:
  target expression and pattern.\n  Pattern must start with `s/`, consists of three
  parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces all
  the spaces with empty string. To escape braces and slashes\n  in pattern and replacement
  parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string` -
  accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `\U0001D6FF` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n* `!S` || `\U0001D70E`
  - a symbol standing where a λ name stands (see\n                [Symbolic λ functions](#symbolic-λ-functions)).
  It is spelled\n                the way a meta variable is spelled but is a name
  and no\n                capture: `\U0001D70E1` is one concrete symbol, which no
  substitution\n                ever binds, and a bare `\U0001D70E` in the answer
  of a `--symbolic`\n                entry asks for a fresh one\n\nA meta variable
  carries a suffix, like `!B1` or `\U0001D70F2`, to name what it\ncaptured, so that
  the `result`, `when`, `where` and `having` of a rule can\nread it back.\nA suffix
  starts with one, so `!B0` is refused.\nWithout a suffix, a meta variable is anonymous:
  it matches any term on its\nown, binds no name, and is refused anywhere but in a
  pattern, so\n`⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧` matches any
  two attributes.\n\nA positional (α) application argument is written as `α0`, `~0`
  (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured by an `!i`/`\U0001D456`
  meta variable.\n\n## Benchmark\n\nTo run performance benchmarks, you need [Java
  8+][java] and [curl][curl]:\n\n```bash\nmake bench\n```\n\nOn the first run, `make
  bench` downloads the compiled [`Native`][jna-native]\nclass of [JNA][jna], turns
  it into [XMIR][xmir] with\n[jeo-maven-plugin][jeo] and then into \U0001D711, and
  caches the results in\n`benchmark/tmp/`.\nBesides parsing, printing and rewriting
  that class, the suite morphs the\nentries of `benchmark/demo.phi` symbolically,
  one case per entry.\n\n<!-- benchmark_begin -->\n\n```text\n=== parse/phi ===\n
  \ warmup:     3 iterations\n  batches:    10 x 1\n  total:      1409532.338 μs\n
  \ avg:        140953.234 μs\n  min:        123104.580 μs\n  max:        169752.210
  μs\n  std dev:    19431.803 μs\n=== parse/xmir ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      6269190.661 μs\n  avg:        626919.066 μs\n
  \ min:        570410.014 μs\n  max:        708906.404 μs\n  std dev:    53168.480
  μs\n=== rewrite/normalize ===\n  warmup:     3 iterations\n  batches:    10 x 1\n
  \ total:      10.204 μs\n  avg:        1.020 μs\n  min:        0.842 μs\n  max:
  \       1.442 μs\n  std dev:    0.179 μs\n=== print/sweet/multiline ===\n  warmup:
  \    3 iterations\n  batches:    10 x 1\n  total:      3999871.155 μs\n  avg:        399987.116
  μs\n  min:        357813.221 μs\n  max:        448393.174 μs\n  std dev:    27725.936
  μs\n=== print/sweet/flat ===\n  warmup:     3 iterations\n  batches:    10 x 1\n
  \ total:      455172.450 μs\n  avg:        45517.245 μs\n  min:        40716.412
  μs\n  max:        55514.792 μs\n  std dev:    6068.706 μs\n=== print/salty/multiline
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      11916902.966
  μs\n  avg:        1191690.297 μs\n  min:        1124787.007 μs\n  max:        1324046.797
  μs\n  std dev:    62960.748 μs\n=== morph/symbolic/demo/e1 ===\n  warmup:     3
  iterations\n  batches:    10 x 15\n  total:      8063.096 μs\n  avg:        53.754
  μs\n  min:        52.409 μs\n  max:        56.184 μs\n  std dev:    0.955 μs\n===
  morph/symbolic/demo/e2 ===\n  warmup:     3 iterations\n  batches:    10 x 294\n
  \ total:      163954.216 μs\n  avg:        55.767 μs\n  min:        54.415 μs\n
