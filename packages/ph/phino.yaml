  ⟦ a ↦ \U0001D70E1:λ, b ↦ Φ.fact( n ↦ \U0001D70E3:λ ), λ ⤍ L_mul ⟧  # \U0001D45B2\n
  \   stuck(L_if)\nmsec(31)\nfirings(11)\nfps(355)\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\nThe first `L_mul` brings its `b` down, and that gets \U0001D53B into
  `fact` with\n`n ↦ \U0001D70E3`, the `formation(…)` line under it. Inside, the fork
  reduces its right\nbranch, and the walk of `--deep` over it would fire `L_mul` with
  `a ↦ \U0001D70E3` and\n`b ↦ Φ.fact( n ↦ \U0001D70E5 )`: the formation the first
  `L_mul` was fired with, `\U0001D70E3`\nstanding where `\U0001D70E1` stood and `\U0001D70E5`
  where `\U0001D70E3` stood, so the firing is cut\nbefore it opens. The cut is the
  `looped(…)` line under `\U0001D45B.6.2`, standing where\nthe block of the cut firing
  would have stood and commented with the judgment\nthe frame belonged to, the site
  it was cut at and the mode that cut it. What it\ncarries is the formation the frame
  above entered, as that frame had it, so the\ntwo are paired by their terms and no
  reader has to rename symbols by eye or\nfind the cut in the residue. Nothing runs
  under a cut, so no block opens under\nthe line. In the XML protocol it is\n`<looped
  by=\"morph\" match=\"proven\" at=\"Φ.a\U0001F3357\"><e>…</e></looped>`, with the\nsite
  and the mode as attributes and the formation in `<e>`. Without the option\nthe same
  run nests one round inside another until `--max-steps` runs out.\n\nA cut at the
  `φ` of a copy the walk of `--deep` has placed, such as\n`Φ.a\U0001F3354.φ`, answers
  that copy with a fresh symbol, the way a deferred copy is\nanswered. A fork above
  it then joins that symbol with its other branch,\ninstead of getting stuck on a
  copy nobody can read. The line names the\nsymbol, as in `looped(…) := \U0001D70E6
  \ # \U0001D544(Φ.a\U0001F3354.φ), plausible`, and the markup\nwrites the object
  the copy was made of and its arguments the way it writes\nthem for a deferred copy,
  on one line, broken here for reading:\n\n<!-- markdownlint-disable MD013 -->\n\n```xml\n<looped
  symbol=\"\U0001D70E6\" by=\"morph\" match=\"plausible\" at=\"Φ.a\U0001F3354.φ\"
  of=\"Φ.fact\">\n  <with><attr name=\"n\">\U0001D70E3</attr><attr name=\"acc\">?</attr></with>\n
  \ <e>⟦ c ↦ \U0001D70E2:λ, left ↦ 00-:Δ, right ↦ Φ.fact( n ↦ \U0001D70E3:λ:φ, acc
  ↦ Φ.pair( head ↦ \U0001D70E1:λ:φ, tail ↦ 00-:Δ ) ), λ ⤍ L_if ⟧</e>\n</looped>\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nA cut anywhere else, or at the `φ` of a copy nested
  inside a term, answers\nnothing and leaves the copy as it stood.\n\nWhat a frame
  remembers is the branch from the run down to it, never everything\nthe run has touched,
  so two siblings entering one formation enter it twice and\nonly a formation entered
  from inside itself is a loop: the fork at `Φ.x.φ`\nabove gets into `fact` with `n
  ↦ \U0001D70E3` once more, on a branch of its own, and is\nnot cut there. The cut
  costs one lookup and fires on the turn the repeat\nappears, so raising `--max-steps`
  from 40 to a million changes neither the\nanswer nor the time.\n\nWhat `proven`
  cannot see is a recursion that never comes back to the same\nformation: one whose
  accumulator grows by a wrapper every round. Give the\nfactorial an `acc` it builds
  a `pair` onto, drop `L_mul` from `fact.yaml`, and\nunder `proven` the run nests
  deeper until `--max-steps` runs out, since no\nrenaming of symbols turns a longer
  chain of pairs into a shorter one:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  cat facta.phi\n⟦\n  if ↦ ⟦ c ↦ ∅, left ↦ ∅, right ↦ ∅, λ ⤍ L_if ⟧,\n  zero ↦ ⟦ x
  ↦ ∅, λ ⤍ L_zero ⟧,\n  dec ↦ ⟦ x ↦ ∅, λ ⤍ L_dec ⟧,\n  pair ↦ ⟦ head ↦ ∅, tail ↦ ∅
  ⟧,\n  fact ↦ ⟦ n ↦ ∅, acc ↦ ∅, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ ξ.n ), left ↦ ξ.acc, right
  ↦ Φ.fact( n ↦ Φ.dec( x ↦ ξ.n ), acc ↦ Φ.pair( head ↦ ξ.n, tail ↦ ξ.acc ) ) ) ⟧,\n
  \ x ↦ Φ.fact( n ↦ ⟦ λ ⤍ \U0001D70E1 ⟧, acc ↦ ⟦ Δ ⤍ 00- ⟧ )\n⟧\n$ phino morph --deep
  --acyclic=plausible --partial --sweet --hide-rho --flat \\\n    --symbolic=facta.yaml
  --locator='Q.x' --protocol=facta.txt facta.phi\n⟦ n ↦ \U0001D70E1:λ, acc ↦ 00-:Δ,
  φ ↦ Φ.if( c ↦ \U0001D70E2:λ, left ↦ acc, right ↦ Φ.fact( n ↦ \U0001D70E3:λ, acc
  ↦ Φ.pair( head ↦ n, tail ↦ acc ) ) ) ⟧\n$ grep looped facta.txt\nlooped(⟦ c ↦ \U0001D70E2:λ,
  left ↦ 00-:Δ, right ↦ Φ.fact( n ↦ \U0001D70E3:λ, acc ↦ Φ.pair( head ↦ \U0001D70E1:λ,
  tail ↦ 00-:Δ ) ), λ ⤍ L_if ⟧)  # \U0001D544(Φ.a\U0001F3354.φ), plausible\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nUnder `plausible` the same formation means one
  the formation entered earlier\nis embedded in: the two have the same attributes,
  data and λ function at the\ntop, and every term the earlier one bound there is found
  again in the later\none, as it stands or somewhere below a wrapper it gained. Any
  symbol stands for\nany other, and nothing is looked for under a `ρ`, which holds
  the object a term\ncame from rather than a term it grew into. The second `if` above
  holds the\nfirst under one more `pair`, so it is cut, and its `looped(…)` line says\n`plausible`.
  A call nested in its own operand, such as a sum of sums, is never\ncut, since the
  inner call is smaller than the outer one and cannot hold it.\nThe mode is not sound,
  though: a recursion whose argument grows on its way to\nstopping is cut too, which
  is why the line names the mode that made the cut.\n\nThe mode also fires every formation
  once. Every use of a binding copies the\nterm bound to it, so a program reading
  `truncated ↦ ρ.abs.floor` in five\nplaces fires `abs` and `floor` five times over
  and mints five symbols for one\nvalue, and a guard written that way spends its whole
  budget saying the same\nthing again. \U0001D53C is a function of the formation it
  fires: the entry that\nanswers is found by the λ name the formation carries, every
  operand is\nreduced from its bindings inside the one universe of the run, and the
  answer\nis built from what they came down to. So a run under `plausible` keeps what\nevery
  firing answered, by the formation it fired, and a later firing of the\nsame formation
  takes that answer, with the very symbols the first one minted,\ninstead of making
  it again. Two bindings spelling one term then come to one\nsymbol:\n\n```bash\n$
  cat twins.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  a ↦ 7.plus( 5.plus( 6 ) ),\n  b ↦ 7.plus( 5.plus( 6 ) )\n⟧\n$ phino morph
  --symbolic=atoms.yaml --acyclic=plausible --deep --sweet \\\n    --hide-rho twins.phi\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ ⟧,\n  a ↦ ⟦ φ ↦ \U0001D70E2:λ,
  plus(x) ↦ L_number_plus:λ ⟧,\n  b ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ
  ⟧\n⟧\n```\n\nUnder `proven` `b` lands on `\U0001D70E4`, since the walk over it fires
  the inner sum\nand the outer one once more. The protocol of the run above still
  holds four\nfirings, two under `a` and two under `b`, since it records where \U0001D53C
  was asked\nand what it answered there; the two under `b` carry the answer lines
  of the\ntwo under `a` and no operand line, since nothing was reduced for them, and\nthey
  are not charged to `--max-firings`, which counts the firings the run\nmade. The
  formation is compared with everything it carries, `ρ` included, so\na firing on
  another object is another firing, yet it may take the same answer\nall the same:
  the run keeps every answer by the λ name and what the operands\ncame down to as
  well, and a firing whose operands come down to the data, the\nsymbols and the normal
  forms of one already answered takes that answer once\nthey are down, minting nothing.
  An attribute read from the `φ` of an object\nand then reached as a binding of it
  is read through two `ξ`, each the object\nminus the attribute being read, so it
  is two formations, but one firing, and\nso one symbol. A symbol counts as the symbol
  it is, not as the datum every\nsymbol manufactures, so two firings over two symbols
  stay two. The protocol\nwrites such a firing with its operand lines and the answer
  lines of the one\nit took the answer from, and `--max-firings` charges it like a
  firing made,\nsince a firing is charged as it starts bringing its operands down,
  which is\nthe only place a recursion widening inside its operands can be cut. A
  firing\ncut by the mode on its way to an answer keeps the cut, and the next firing
  of\nthe same formation is cut at its own site without reducing anything first. A\nfiring
  that got stuck keeps the λ function it got stuck on, and the next\nfiring of the
  same formation gets stuck at its own site the same way, with\nnothing reduced under
  it, as long as nothing new was answered in between.\nOnce something was, the formation
  is fired again, since an operand that could\nnot be brought down the first time
  may come down now.\n\nThe mode also walks a binding of the world once. Every dispatch
  on an object\nof the world copies it, and `--deep` walks every copy, so the tests
  of an\nobject are reduced once per copy of it the program holds. A copy goes by
  a\nname in the world, such as `Φ.num( φ ↦ ⟦ Δ ⤍ 2A- ⟧ )`, the name `dot` writes\ninto
  its `ρ`, and that name without its application, `Φ.num`, stands for every\ncopy.
  So a run under `plausible` enters `test` of `Φ.num` in the first copy it\nmeets
  and leaves it as written in every later one:\n\n```bash\n$ cat atoms.yaml\n- λ:
  L_id\n  morph:\n    \U0001D45B1: $.x\n  \U0001D45B: \U0001D45B1\n- λ: L_twice\n
  \ dataize:\n    \U0001D6FF1: $.ρ\n  \U0001D45B: Φ.num( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n$
  cat world.phi\n⟦\n  num ↦ ⟦\n    φ ↦ ∅,\n    twice ↦ ⟦ ρ ↦ ∅, λ ⤍ L_twice ⟧,\n    test
  ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 01- ⟧ ).twice\n  ⟧,\n  a ↦ ⟦ λ ⤍ L_id, x ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 2A-
  ⟧ ) ⟧,\n  b ↦ ⟦ λ ⤍ L_id, x ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 2B- ⟧ ) ⟧\n⟧\n$ phino morph --symbolic=atoms.yaml
  --acyclic=plausible --deep --partial \\\n    --sweet --hide-rho world.phi\n⟦\n  num(φ)
  ↦ ⟦ twice ↦ L_twice:λ, test ↦ Φ.num( φ ↦ 01-:Δ ).twice ⟧,\n  a ↦ ⟦\n    φ ↦ 2A-:Δ,\n
  \   twice ↦ L_twice:λ,\n    test ↦ ⟦ φ ↦ \U0001D70E1:λ, twice ↦ L_twice:λ, test
  ↦ Φ.num( φ ↦ 01-:Δ ).twice ⟧\n  ⟧,\n  b ↦ ⟦ φ ↦ 2B-:Δ, twice ↦ L_twice:λ, test ↦
  Φ.num( φ ↦ 01-:Δ ).twice ⟧\n⟧\n```\n\nA binding the copy filled, such as `φ` above,
  belongs to that copy alone and\nis entered every time. A binding left out is never
  replaced by what an earlier\ncopy came to, since a method may read the `ρ` or the
  `φ` of the copy it\nstands in, and so a recursion over copies of one object stops
  after its first\nround, with the second one as written.\n\nThe walk of `--deep`
  takes the bindings of the formation it starts at one\nafter another. When they are
  independent entries, such as the objects of a\nwhole runtime listed in one formation,
  the `--jobs` option walks them side by\nside on that many workers. Each binding
  gets its own memo, its own\n`--max-firings` tally and its own fresh names, so what
  it comes to does not\ndepend on which worker got there first. The answers and the
  protocol come out\nin the order of the bindings, with the symbols numbered as one
  walk would\nnumber them:\n\n```bash\n$ cat plus.yaml\n- λ: L_plus\n  dataize:\n
  \   \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B: Φ.num( φ ↦ ⟦ λ ⤍ \U0001D70E
  ⟧ )\n$ cat sums.phi\n⟦\n  num ↦ ⟦ φ ↦ ∅, plus ↦ ⟦ ρ ↦ ∅, x ↦ ∅, λ ⤍ L_plus ⟧ ⟧,\n
  \ l\U0001F335 ↦ ⟦\n    a ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 01- ⟧ ).plus( x ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 02-
  ⟧ ) ),\n    b ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 03- ⟧ ).plus( x ↦ Φ.num( φ ↦ ⟦ Δ ⤍ 04- ⟧ ) )\n
  \ ⟧\n⟧\n$ phino morph --symbolic=plus.yaml --deep --locator=Q.l\U0001F335 --jobs=2
  \\\n    --protocol=sums.txt --sweet --hide-rho sums.phi\n⟦ a ↦ ⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ L_plus:λ ⟧, b ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_plus:λ ⟧ ⟧\n$ cat sums.txt\n\U0001D544(Φ.l\U0001F335)\n
  \ \U0001D53C(L_plus)  # \U0001D544(Φ.l\U0001F335.a)\n    formation(⟦ φ ↦ 01-:Δ,
  plus(x) ↦ L_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3351-0)\n    \U0001D6FF1.1 := 01-
  \ # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ 02-:Δ, plus(x) ↦ L_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3351-1)\n
  \   \U0001D6FF2.1 := 02-  # \U0001D53B(ξ.x)\n    \U0001D45B.1.1 := Φ.num( φ ↦ \U0001D70E1:λ
  )  # \U0001D45B\n    \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ ⟧
  \ # \U0001D544(\U0001D45B.1.1)\n  \U0001D53C(L_plus)  # \U0001D544(Φ.l\U0001F335.b)\n
  \   formation(⟦ φ ↦ 03-:Δ, plus(x) ↦ L_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3352-0)\n
  \   \U0001D6FF1.2 := 03-  # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ 04-:Δ, plus(x)
  ↦ L_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3352-1)\n    \U0001D6FF2.2 := 04-  # \U0001D53B(ξ.x)\n
  \   \U0001D45B.2.1 := Φ.num( φ ↦ \U0001D70E2:λ )  # \U0001D45B\n    \U0001D45B.2.2
  := ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_plus:λ ⟧  # \U0001D544(\U0001D45B.2.1)\n```\n\nA
  fresh name a binding mints carries its place in the formation, `a\U0001F3352-0`
  for\nthe second one, so no two bindings ever mint the same name. The workers split\nthe
  time, not the work: the slowest binding still takes as long as it did,\nand the
  others no longer wait behind it. Without `--jobs`, or with\n`--jobs=1`, the walk
  is the one described above, sharing one memo and one\ntally across all bindings.\n\n##
  Rewrite\n\nYou can rewrite this expression with the help of [rules](#rule-structure)\ndefined
  in the `my-rule.yml` YAML file (here, the `!d1` and `!B1` are capturing\ngroups,
  similar to regular expressions):\n\n```yaml\nname: My custom rule\npattern: ⟦ Δ
  ⤍ !d1, !B1 ⟧\nresult: ⟦ Δ ⤍ 62-79-65, !B1 ⟧\n```\n\nThen, rewrite:\n\n```bash\n$
  phino rewrite --rule=my-rule.yml hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧, t ↦ ξ.k, k ↦
  ⟦⟧ ⟧\n```\n\nIf you want to use many rules, just use `--rule` as many times as you
  need:\n\n```bash\nphino rewrite --rule=rule1.yaml --rule=rule2.yaml ...\n```\n\nYou
  can also use [built-in rules](resources), which are designed\nto normalize expressions:\n\n```bash\nphino
  rewrite --normalize hello.phi\n```\n\nBoth flags may be combined, so that your own
  rules are applied\nalongside the built-in ones, in a single rewriting session:\n\n```bash\nphino
  rewrite --normalize --rule=my-rule.yaml hello.phi\n```\n\nSome rules mint fresh
  synthetic names via the `random-string` built-in. To\nkeep the output reproducible
  across runs, `phino` seeds the random generator\ndeterministically with `0` by default.
  Use `--seed` to pick a different seed:\n\n```bash\nphino rewrite --seed=42 --rule=my-rule.yml
  hello.phi\n```\n\nIf no input file is provided, the \U0001D711-expression is taken
  from `stdin`:\n\n```bash\n$ echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino rewrite
  --rule=my-rule.yml\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass [`XMIR`][xmir]
  as input. Use `--input=xmir` and `phino`\nwill parse given `XMIR` from file or `stdin`
  and convert it to `phi` AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml --input=xmir
  file.xmir\n```\n\nAlso `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout( α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍
  68-65-6C-6C-6F ⟧ ) ) )\n⟧\n```\n\nA formation of a single binding may be written
  as its asset, a colon,\nand the attribute the asset is bound to:\n\n```text\n⟦ Δ
  ⤍ FF-AA ⟧    = FF-AA:Δ    = FF-AA:D\n⟦ λ ⤍ \U0001D70E1 ⟧       = \U0001D70E1:λ       =
  !S1:L\n⟦ a ↦ ∅ ⟧        = ∅:a        = ?:a\n⟦ φ ↦ ξ.a ⟧      = ξ.a:φ      = $.a:@\n```\n\nThe
  colon binds as tightly as a dot, so `ξ.a:φ.b` is `⟦ φ ↦ ξ.a ⟧.b`.\nWith `--sweet`,
  `phino` prints every such formation this way, so\n`⟦ x ↦ ⟦ φ ↦ ξ.a ⟧ ⟧` comes out
  as `a:φ:x` and `⟦ x(a) ↦ ⟦ φ ↦ a ⟧ ⟧`\nas `⟦ x(a) ↦ a:φ ⟧`: the formation inline
  voids open takes the sugar,\nwhile the one holding the voids keeps its brackets,
  and so does\nevery formation in the salty syntax and in [LaTeX][latex].\n\nA formation
  has a receiver `ρ` only when it declares one among its voids, the\nway EO declares
  `^`: `⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧`, or `a(ρ) ↦ ⟦ t ↦ ξ.ρ.k ⟧` with\nthe void inline. `phino`
  adds none of its own, and a dispatch into a formation\nthat declares none hands
  it no `ρ` (the `skip` rule), so `ξ.ρ` there is `⊥`:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ echo '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍ 01- ⟧, a ↦ ⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧
  ⟧.a.t ⟧' | phino rewrite --normalize --sweet\n01-:Δ:x\n$ echo '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍
  01- ⟧, b ↦ ⟦ t ↦ ξ.ρ.k ⟧ ⟧.b.t ⟧' | phino rewrite --normalize --sweet\n⊥:x\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n## Merge\n\nYou can merge several \U0001D711-expressions
  into a single one by merging their\ntop level formations:\n\n```bash\n$ cat bytes.phi\n⟦
  bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(x)
  ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦ number ↦ ⟦ minus(x) ↦ ⟦ λ ⤍
  L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi minus.phi --sweet\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ, minus(x) ↦ L_number_minus:λ
  ⟧\n⟧\n```\n\n## Match\n\nYou can test the \U0001D711-expression matches against
  the [rule](#rule-structure)\npattern. The result output contains matched substitutions:\n\n```bash\n$
  phino match --pattern='⟦ Δ ⤍ !d, !B ⟧' hello.phi\nB >> ⟦⟧\nd >> 68-65-6C-6C-6F\n```\n\n##
  Compile\n\nBy default, `phino` reads its rules from YAML and interprets them at
  every\nstep. The `compile` command turns the rules into Haskell instead. Then a\nsecond
  build of `phino` runs them as plain functions:\n\n```bash\nphino compile\ncabal
  build all\n```\n\nThe command writes the module `compiled/generated/Compiled.hs`,
  which git\nignores. It compiles the built-in rules of normalization, the\ncontextualization
  function \U0001D49E, and every file you pass with `--rule`. The\n`--target` option
  writes the module somewhere else.\n\nA build links the module in only when the Cabal
  flag `compiled` is on. If\nthere is no `cabal.project.local`, `compile` creates
  one that turns the flag\non. If the file already exists, `compile` leaves it alone
  and prints the two\nlines to add to it:\n\n```text\npackage phino\n  flags: +compiled\n```\n\nThe
  compiled rules take exactly the same steps as the YAML ones, so the\noutput and
  every `--sequence` stay the same. A few things are still read from\nYAML at runtime:\n\n*
  the rules of morphing (\U0001D544) and dataization (\U0001D53B);\n* a `--rule` file
  that changed after `compile`;\n* the pattern of `match` and the `rewrite:` blocks
  of the `--symbolic` file.\n\nThe `explain` command also reads the rules from YAML.\n\n`compile`
  refuses a rule it cannot turn into Haskell and names the reason.\nFor example, it
  refuses a rule with `having`, a `where` function other than\n`contextualize` or
  `named`, or the conditions `matches` and `part-of`.\n\nA binary built this way refuses
  to run if the built-in rules changed after\nthe last `compile`, since it would run
  rules nobody wrote. Run `compile`\nagain and rebuild. To test the whole suite against
  the compiled rules, run:\n\n```bash\nmake compiled\n```\n\n## Explain\n\nYou can
  _explain_ the built-in rules by printing them in [LaTeX][latex]\nformat. Pass exactly
  one of `--normalize`, `--morph`, `--dataize` or\n`--contextualize` for the rewriting,
  morphing (\U0001D544), dataization (\U0001D53B) or\ncontextualization (\U0001D49E)
  rules (or `--rule` for a custom rule file):\n\n```bash\n$ phino explain --normalize\n\\begin{tabular}{rl}\n\\phinoNormalizationRule{alpha}\n
  \ { [[ B_1, \\tau -> ?, B_2 ]] ( \\phiTerminal{\\alpha_{i}} -> e ) }\n  { [[ B_1,
  \\tau -> ?, B_2 ]] ( \\tau -> e ) }\n  { $ i = \\vert \\overline{ B_1 } \\vert $
  }\n  { }\n\\phinoNormalizationRule{dc}\n  { T ( \\tau -> e ) }\n  { T }\n  { }\n
  \ { }\n...\n\\phinoNormalizationRule{stop}\n  { [[ B ]] . \\tau }\n  { T }\n  {
  $ [ \\tau \\char44{} @ \\char44{} L ] \\cap B = \\emptyset $ }\n  { }\n\\end{tabular}\n```\n\nThe
  morphing and dataization rules are printed the same way:\n\n```bash\n$ phino explain
  --morph\n\\begin{tabular}{rl}\n\\phinoMorphingRule{mf}\n  { \\mathbb{M}( [[ B ]],
  e ) }\n  { [[ B ]] }\n  { }\n  { }\n...\n\\phinoMorphingRule{universe}\n  { \\mathbb{M}(
  Q, e ) }\n  { \\mathbb{M}( \\phinoNormalize{ e }, e ) }\n  { $ e \\not= Q $ }\n
  \ { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --dataize\n\\begin{tabular}{rl}\n\\phinoDataizationRule{delta}\n
  \ { \\phinoDataize{ [[ B_1, D> \\delta_0, B_2 ]] } }\n  { \\delta_0 }\n  { }\n  {
  }\n...\n\\phinoDataizationRule{norm}\n  { \\phinoDataize{ n } }\n  { \\phinoDataize{
  \\mathbb{M}( n, e ) } }\n  { }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain
  --contextualize\n\\begin{phinoContextualizationInference}\n  \\phinoName{cxi}\n
  \ \\phinoConclusion{ \\phinoContextualize{ \\phiTerminal{\\xi} }{ k }{ k } }\n\\end{phinoContextualizationInference}\n...\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cd}\n  \\phinoPremise{ \\phinoContextualize{ n }{ k }{ n_1 } }\n  \\phinoConclusion{
  \\phinoContextualize{ n . \\tau }{ k }{ n_1 . \\tau } }\n\\end{phinoContextualizationInference}\n```\n\nFor
  more details, use `phino [COMMAND] --help` option.\n\n## Rule structure\n\nThis
  is BNF-like yaml rule structure. Here types ended with\napostrophe, like `Attribute'`
  are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # returns True if every given attribute exists in\n      - Attribute'
  | [Attribute'] # the union of the given bindings\n      - Binding' | [Binding']\n
  \ | nf: Expression'      # returns True if given expression in normal form\n                         #
  which means that no more other normalization rules\n                         # can
  be applied\n  | absolute: Expression' # returns True if given expression is xi-free,
  i.e.\n                         # there is no ξ outside of a formation: it is Φ,
  a\n                         # formation, a dispatch with a xi-free subject, or an\n
  \                        # application with a xi-free subject and argument.\n                         #
  Combined with a normal-form check by the '\U0001D458'/'!k'\n                         #
  meta variable, which ranges over the absolute\n                         # expressions
  \U0001D4A6 ⊆ \U0001D4A9, used by the Rcopy rule.\n  | matches:             # returns
  True if given expression after dataization\n      - String           # matches to
  given regex\n      - Expression\n  | part-of:             # returns True if given
  expression is attached to any\n      - Expression'      # attribute in ginve bindings\n
  \     - BiMeta'\n  | formation:           # returns True if given expression is
  a formation\n      Expression'        # (an abstraction ⟦…⟧); used by morphing 'md'\n
  \                        # as 'not (formation \U0001D45B)', so a non-formation head
  is\n                         # morphed and a formation head is left to 'ml'\n  |
  gt:                  # returns True if the first comparable object is\n      - Comparable
  \      # greater than the second one\n      - Comparable\n  | disjoint:            #
  returns True if none of the given attributes exists\n      - [Attribute']     #
  in the given bindings\n      - Binding'\n\nComparable:              # comparable
  object that may be used in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:
  \                 # comparable number\n  = Integer              # just regular integer\n
  \ | IndexMeta'           # \U0001D456 (or !i), the index captured by an α\U0001D456
  argument\n  | length: BiMeta'      # calculate length of bindings by given meta
  binding\n  | domain: BiMeta'      # calculate number of unique attributes in given\n
  \                        # meta binding (excluding 'assets')\n\nExtension:               #
  substitutions extension used to introduce new meta variables\n  meta: [ExtArgument]
  \   # new introduced meta variable\n  function: String       # name of the function\n
  \ args: [ExtArgument]    # arguments of the function\n\nExtArgument\n  = Bytes'
  \              # !d\n  | Binding'             # !B\n  | Expression'          # !e\n
  \ | Attribute'           # !t\n```\n\nHere's list of functions that are supported
  for extensions:\n\n* `contextualize` - function of two arguments, that rewrites
  given expression\n  depending on provided context according to the contextualization\n
  \ [rules](assets/contextualize.jpg)\n* `random-tau` - creates an attribute with
  a random unique name. It accepts no\n  arguments; uniqueness is guaranteed across
  all names already taken in the\n  document.\n* `dataize` - dataizes given expression
  and returns bytes.\n* `concat` - accepts bytes or dataizable expressions as arguments,\n
  \ concatenates them into single sequence and convert it to expression\n  that can
  be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦ Δ ⤍ !d ⟧)`.\n*
  `sed` - pattern replacer, works like unix `sed` function.\n  Accepts two arguments:
  target expression and pattern.\n  Pattern must start with `s/`, consists of three
  parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces all
  the spaces with empty string. To escape braces and slashes\n  in pattern and replacement
  parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string` -
  accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `\U0001D6FF` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n* `!S` || `\U0001D70E`
  - a symbol standing where a λ name stands (see\n                [Symbols](#symbols)).
  It is spelled the way a meta variable is\n                spelled but is a name
  and no capture: `\U0001D70E1` is one concrete\n                symbol, which no
  substitution ever binds, and a bare `\U0001D70E` in the\n                answer
  of a `--symbolic` entry asks for a fresh one\n\nA meta variable carries a suffix,
  like `!B1` or `\U0001D70F2`, to name what it\ncaptured, so that the `result`, `when`,
  `where` and `having` of a rule can\nread it back. An index starts with one: a suffix
  of `0`, as in `!B0` or\n`\U0001D70F0`, is refused where it is written, because it
  is a first index spelled\nwrong and no name. A positional argument keeps counting
  from zero, though,\nsince `α0` is an index of the calculus and no meta variable.\n\nWritten
  bare, with no suffix at all, a meta variable is anonymous: it matches\nwhatever
  term stands in its place, every occurrence on its own, and binds no\nname. Two anonymous
  metas of one kind are therefore two different captures,\nwhich is what lets a pattern
  ask for any two attributes without inventing\nnames for them:\n\n```yaml\nname:
  two-attributes\npattern: '⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧'\nresult:
  '⟦ x ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧'\n```\n\nSpelled with suffixes, that pattern would read `⟦
  \U0001D70F1 ↦ \U0001D4521, \U0001D70F2 ↦ \U0001D4522 ⟧` and\nname four captures
  the result never mentions, while `⟦ \U0001D70F1 ↦ \U0001D4521, \U0001D70F1 ↦ \U0001D4521
  ⟧`\nwould be rejected as a duplicated attribute.\n\nNothing can refer to an anonymous
  meta, since it has no name to be referred to\nby. Writing one outside a `pattern`
  (or the `match`, `universe` and `c-match` of\nan inference rule) is a mistake in
  the rule and is reported as the rule loads.\n\nA positional (α) application argument
  is written as `α0`, `~0` (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured
  by an `!i`/`\U0001D456` meta variable.\n\nIncorrect usage of meta variables in \U0001D711-expression
  patterns leads to\nparsing errors.\n\n## Benchmark\n\nTo run performance benchmarks,
  you need [Java 8+][java] and [curl][curl].\nMaven is downloaded automatically on
  first run via `benchmark/mvnw`.\n\nThe benchmark uses the compiled [`Native`][jna-native]
  class from\n[JNA][jna] — a large real-world Java class — as its test input.\nOn
  first run, `make bench` downloads the class, disassembles it to\n[XMIR][xmir] via
  [jeo-maven-plugin][jeo], converts it to \U0001D711 using\n`phino rewrite`, and caches
  the results in `benchmark/tmp/`.\nSubsequent runs skip straight to the benchmarks.\n\nBesides
  parsing, printing and rewriting that class, the suite morphs\nsymbolically. `benchmark/demo.phi`
  is a small world whose entries name the λ\nfunctions of `benchmark/atoms.yaml`,
  and each entry is a case of its own, so\nthat a slowdown of one of them is a line
  of the report rather than a share of\na single total. The smallest entry — one λ
  function fired against one unknown\n— is timed twice, over the demo world alone
  and over the same world merged\ninto the class, and the two numbers say between
  them what the world around an\nentry costs (see [#1291][issue-1291]).\n\nA case
  whose single run is measured in seconds gets fewer warmups and fewer\nbatches than
  a case measured in microseconds, since the whole suite runs\ninside one job; the
  report says how many of each a case was given.\n\n```bash\nmake bench\n```\n\n<!--
  benchmark_begin -->\n\n```text\n=== parse/phi ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      1094396.788 μs\n  avg:        109439.679 μs\n
  \ min:        101010.304 μs\n  max:        128313.535 μs\n  std dev:    10811.808
  μs\n=== parse/xmir ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     5710303.145 μs\n  avg:        571030.314 μs\n  min:        504770.068 μs\n
  \ max:        662347.068 μs\n  std dev:    46900.536 μs\n=== rewrite/normalize ===\n
  \ warmup:     3 iterations\n  batches:    10 x 1\n  total:      11.392 μs\n  avg:
  \       1.139 μs\n  min:        0.970 μs\n  max:        1.628 μs\n  std dev:    0.177
  μs\n=== print/sweet/multiline ===\n  warmup:     3 iterations\n  batches:    10
  x 1\n  total:      2401437.519 μs\n  avg:        240143.752 μs\n  min:        213136.984
  μs\n  max:        272722.750 μs\n  std dev:    16775.737 μs\n=== print/sweet/flat
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      2416626.820
  μs\n  avg:        241662.682 μs\n  min:        233315.703 μs\n  max:        254494.103
  μs\n  std dev:    5589.090 μs\n=== print/salty/multiline ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      7328848.511 μs\n  avg:        732884.851 μs\n
  \ min:        692672.535 μs\n  max:        772742.324 μs\n  std dev:    23401.078
  μs\n=== morph/symbolic/demo/e1 ===\n  warmup:     3 iterations\n  batches:    10
  x 3\n  total:      128456.280 μs\n  avg:        4281.876 μs\n  min:        4253.475
  μs\n  max:        4312.886 μs\n  std dev:    20.874 μs\n=== morph/symbolic/demo/e2
  ===\n  warmup:     3 iterations\n  batches:    10 x 5\n  total:      198825.013
  μs\n  avg:        3976.500 μs\n  min:        3937.010 μs\n  max:        4123.529
  μs\n  std dev:    54.483 μs\n=== morph/symbolic/demo/e3 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 3\n  total:      171306.263 μs\n  avg:        5710.209 μs\n  min:
  \       5671.534 μs\n  max:        5828.818 μs\n  std dev:    45.464 μs\n=== morph/symbolic/demo/e4
  ===\n  warmup:     3 iterations\n  batches:    10 x 6\n  total:      214186.131
  μs\n  avg:        3569.769 μs\n  min:        3556.854 μs\n  max:        3596.001
  μs\n  std dev:    11.389 μs\n=== morph/symbolic/demo/e5 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 15\n  total:      190902.360 μs\n  avg:        1272.682 μs\n
  \ min:        1266.976 μs\n  max:        1276.589 μs\n  std dev:    3.073 μs\n===
  morph/symbolic/native/e5 ===\n  warmup:     3 iterations\n  batches:    10 x 1\n
  \ total:      130864.617 μs\n  avg:        13086.462 μs\n  min:        12534.939
  μs\n  max:        13730.337 μs\n  std dev:    404.303 μs\n=== morph/symbolic/accum/0
  ===\n  warmup:     3 iterations\n  batches:    10 x 3\n  total:      217771.785
  μs\n  avg:        7259.060 μs\n  min:        7183.014 μs\n  max:        7458.925
  μs\n  std dev:    90.688 μs\n=== morph/symbolic/accum/400 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      210258.554 μs\n  avg:        21025.855 μs\n
  \ min:        20666.196 μs\n  max:        23018.525 μs\n  std dev:    672.165 μs\n```\n\nThe
  results were calculated in [this GHA job][benchmark-gha]\non 2026-09-29 at 12:02,\non
  Linux with 4 CPUs.\n\n<!-- benchmark_end -->\n\n## How to Contribute\n\nFork repository,
  make changes, then send us a [pull request][guidelines].\nWe will review your changes
  and apply them to the `master` branch shortly,\nprovided they don't violate our
  quality standards. To avoid frustration,\nbefore sending us your pull request please
  make sure all your tests pass:\n\n```bash\nmake all\n```\n\nTo generate a local
  coverage report for development, run:\n\n```bash\nmake coverage\n```\n\nTo build
  a `phino` executable into the root of the repository, run:\n\n```bash\nmake phino\n```\n\nThis
  produces an executable `phino` (or `phino.exe` on Windows) in the\nproject root,
  which you can run directly for quick local testing:\n\n```bash\n./phino --version\n```\n\nYou
  will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor [Stack ≥
  3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]: https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]:
  https://www.haskell.org/ghc/\n[guidelines]: https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]:
  https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]: https://en.wikipedia.org/wiki/LaTeX\n[java]:
  https://www.java.com/en/download/\n[curl]: https://curl.se/\n[jna]: https://github.com/java-native-access/jna\n[jna-native]:
  https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[issue-1291]: https://github.com/objectionary/phino/issues/1291\n[benchmark-gha]:
  https://github.com/objectionary/phino/actions/runs/36565203496\n"
