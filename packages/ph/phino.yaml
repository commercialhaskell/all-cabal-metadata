description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.156\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\nIn
  a [GitHub Actions][gha] workflow, one step downloads the binary\nfor the runner
  and puts it on the `PATH`:\n\n```yaml\n- uses: objectionary/phino@0.0.156\n  with:\n
  \   version-file: phino-version.txt\n- run: phino --version\n```\n\nThe file holds
  the version to install, such as `0.0.150`, and the\nwhitespace around it is ignored.\nGive
  `version: 0.0.150` instead of `version-file` to write the version\nin the workflow
  itself.\nThe step fails if no binary is released for the runner, such as\nLinux
  on ARM, or if `phino --version` prints another version.\n\n## Build\n\nTo build
  `phino` from source, clone this repository:\n\n```bash\ngit clone git@github.com:objectionary/phino.git\ncd
  phino\n```\n\nThen, run the following command (ensure you have [Cabal][cabal] installed):\n\n```bash\ncabal
  build all\n```\n\nNext, run this command to install `phino` system-wide:\n\n```bash\nsudo
  cp \"$(cabal list-bin phino)\" /usr/local/bin/phino\n```\n\nVerify that `phino`
  is installed correctly:\n\n```bash\n$ phino --version\n0.0.0\n```\n\nYou can ensure
  scripts are run with a specific version of `phino` using\nthe `--pin` global option.
  It exits with an error when the version supplied\ndoesn't match the installed one:\n\n```bash\nphino
  --pin=0.0.0.67 dataize hello.phi\n```\n\nThe `--pin-file` global option does the
  same, but reads the version from\na file, ignoring the whitespace around it:\n\n```bash\nphino
  --pin-file=version.txt dataize hello.phi\n```\n\n## Dataize\n\nThen, you dataize
  the expression:\n\n```bash\n$ phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n###
  Symbolic λ functions\n\nWhich λ functions exist is a property of the object model
  being dataized, not\nof the calculus, so `phino` implements none of them. They come
  from a YAML file\ngiven with `--symbolic`, one entry per λ function:\n\n```yaml\n-
  λ: L_number_(plus|times)\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n
  \ \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n```\n\nThe `λ` of an entry is
  the λ names it answers for, as a regular expression, so\nthe one above stands for
  `L_number_plus` and `L_number_times`. Under `dataize`\nstand the operands it brings
  down to data through \U0001D53B, each binding a bytes meta\n`\U0001D6FF1`, `\U0001D6FF2`
  and so on; under `morph` the operands it reduces to a normal\nform through \U0001D544,
  each binding an expression meta `\U0001D45B1`, `\U0001D45B2`. Both blocks are\nterms
  of the calculus, read against the formation being fired, so `ξ` is that\nformation
  and `$.x` its `x`, while `Φ` is the universe. Every entry numbers its\nown metas
  from `\U0001D6FF1` and `\U0001D45B1`, and the entry is what tells two `\U0001D6FF1`
  apart.\nAn operand whose reduction gets stuck, is cut or runs out of steps gets
  the\nfiring stuck right there: no later block runs, and `--partial` parks the\nfiring
  as a whole instead of handing the operand on as it was written.\n\nThe term under
  `\U0001D45B` is what the firing answers with. `phino` normalizes it\nexactly as
  it normalizes anything else, so `--protocol`, `--partial` and\n`--max-steps` work
  on it unchanged. It may name any meta the entry bound,\nthose of the two blocks
  below among them.\n\nAn entry reads no key but `λ`, `dataize`, `morph`, `evaluate`,
  `defer`, `stay`,\n`rewrite`, `symbolize`, `join` and `\U0001D45B`, and any other
  key, such as a\nmisspelled `joinn`, refuses the whole file, so a typo never drops
  a block\nwithout a word.\n\n### Firing what an operand came to\n\n\U0001D544 fires
  a λ function only where a dispatch reads the formation carrying it, so\nan operand
  reduced under `morph` may come to a formation whose λ function\nnobody fired, such
  as a call the program passed as an argument and never read.\nThere is a third block,
  `evaluate`, and each line of it fires such a formation\nthrough \U0001D53C and binds
  an expression meta of its own to the answer:\n\n```yaml\n- λ: L_apply\n  morph:\n
  \   \U0001D45B1: $.f\n  evaluate:\n    \U0001D45B2: \U0001D45B1\n  \U0001D45B: \U0001D45B2\n```\n\nThe
  right-hand side of a line names a meta bound by `morph` or by another line\nof the
  entry, and nothing else. A formation with a λ function is fired by the\nentry its
  λ name matches, the way \U0001D544 fires it, and the line binds its meta to\nthe
  normal form of the answer. A formation with no λ function is no call and\nstays
  as it is, and so does `⊥`. So does a bare symbol, `⟦ λ ⤍ \U0001D70E1 ⟧`, since it\nalready
  stands for a value nobody worked out and no entry answers it. A λ name\nno entry
  answers gets stuck, as it\ndoes anywhere else, and `--partial` parks it. Any other
  term, such as a\ndispatch a `rewrite` line, described below, took out of its formation,
  gets an\nentry stuck when it computes an `\U0001D45B`, while an entry that joins
  passes the term\non as it is, since a join compares whatever its sides come to.
  An answer is\nnot fired again,\neven when it is one more call: firing it takes one
  more line, so how many\ncalls an entry makes is written in its file and not guessed
  by `phino`. Each\nfiring of a line is one step deeper, the way a frame of \U0001D544
  or \U0001D53B is, so a\nrecursion running through `evaluate` lines alone spends
  `--max-steps` and is\ncut by `--acyclic` like any other.\n\nThe protocol writes
  the firing of a line as a block of its own, commented with\nthe meta it fired, `\U0001D53C(L_second):
  \ # \U0001D53C(\U0001D45B2)`, and the line binding the answer\nthe same way, `\U0001D45B3·1
  := \U0001D45B·3·2  # \U0001D53C(\U0001D45B2)`.\n\n### Deferring a copy over an unknown\n\nA
  term \U0001D544 leaves may be a copy of an object of the world, such as\n`Φ.step(
  tup ↦ Φ.items.tail )`, one of whose arguments reads to a bare symbol\n`⟦ λ ⤍ \U0001D70E1
  ⟧`. Nothing can be worked out about such a copy: its `φ` reads\n`tup.next`, an attribute
  of `\U0001D70E1` nobody knows, so morphing it gets stuck where\nthe symbol stands.
  There is a fourth block, `defer`, and each line of it reads\na meta and binds another,
  the way a line of `evaluate` does. When the term is a\ncopy one of whose arguments,
  `φ` and `ρ` aside, reads to a bare symbol, the\nline binds its meta to a fresh symbol
  and writes what the symbol stands for:\n\n```yaml\n- λ: L_step\n  morph:\n    \U0001D45B1:
  $.x\n  defer:\n    \U0001D45B2: \U0001D45B1\n  \U0001D45B: \U0001D45B2\n```\n\n```text\ndeferred
  \U0001D70E3 := Φ.step( tup ↦ \U0001D70E1:λ )  # \U0001D544(\U0001D45B1.φ)\n```\n\nThe
  markup writes it as `<deferred symbol=\"\U0001D70E3\" … of=\"Φ.step\">`, holding
  a\n`<with>` element with a `<symbol attr=\"tup\">\U0001D70E1</symbol>` per argument.
  When\nthe world declares no object the copy was made of, `of` names the `<formed>`\nelement
  that spells the copy out, and there is no `<with>`. Any other term,\na copy whose
  arguments read to no bare symbol among them, is bound as it\nstands, as `\U0001D45B2·1
  := \U0001D45B·1·1  # \U0001D45B1`. A `defer` line asks nothing of the `φ` of a\ncopy,
  so it defers one whose `φ` reads nothing of its own object too, such as\n`⟦ φ ↦
  Φ.bool( … ) ⟧`.\n\nAn argument that is no bare symbol, such as `w ↦ Φ.inc( ⟦ Δ ⤍
  2A- ⟧ )`, is\nworked out before the line is written. The entry morphs it in the
  copy, fires\nwhat that comes to, the way an `evaluate` line does, and writes every
  step to\nthe protocol under `\U0001D544(\U0001D45B1.w):`. The line then names the
  object the firing\nanswered, `Φ.box( x ↦ \U0001D70E1:λ, w ↦ \U0001D45B·2·2 )`, and
  so does the markup,\n`<meta attr=\"w\">\U0001D45B·2·3</meta>`, with a meta of its
  own count. A reader follows\nthe meta to the application that made the object. An
  argument whose morph or\nfiring gets stuck, is cut or runs out of steps gets the
  firing stuck right\nthere, as an operand does, and no `deferred` line is written.\n\nA
  `join` block, described below, defers nothing by itself. An entry that\njoins defers
  a side with a `defer` line of its own, reading the meta the side\nwas morphed to,
  so a side that is such a copy comes to a fresh symbol rather\nthan getting stuck
  inside the unknown. A side written as a path from `$` is\nmorphed and taken as it
  comes, a copy over a bare symbol included.\n\n### Joining on a condition nobody
  decided\n\nA branching λ function answers neither of its branches. Which one the
  program\ntakes is decided by a value nobody worked out, so handing one of them through\nwould
  drop the branch point from the program altogether, and joining two\ndifferent terms
  into one would make up a value no run of the program ever has.\n`join` is the fifth
  block: it names the condition and the two sides, and the\nentry answers the one
  term both sides join into, or gets stuck when they do\nnot join.\n\n```yaml\n- λ:
  L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  join:\n    on: \U0001D6FF1\n    left:
  $.left\n    right: $.right\n```\n\n`on` names the condition, a bytes meta the `dataize`
  block bound or a path\nfrom `$`, described below, and `left` and `right` are paths
  from `$`, read\nagainst the formation being fired the way\nan operand is, or metas
  the `morph` block or an `evaluate`, `stay`, `rewrite`,\n`symbolize` or `defer` line
  bound, as described below. An entry\nwith a `join` block has no `\U0001D45B`, since
  the term it joins is what it answers\nwith: an entry joins or it computes, never
  both. A block missing one of the\nthree keys, holding another but `otherwise`, described
  below, or naming under\n`on` anything but a meta of `dataize` or a path from `$`
  is refused when the\nfile is read, and\nso is a side reading a meta inside a term,
  such as `\U0001D45B1.x`, or naming a meta\nthat none of `morph`, `evaluate`, `stay`,
  `rewrite`, `symbolize` and `defer`\nbinds.\n\nA join morphs both of its sides first,
  each where it stands in the universe,\nunder a block of its own, `\U0001D544(Φ.a\U0001F3353):`
  for the left side and `\U0001D544(Φ.a\U0001F3354):` for\nthe right one. A side that
  is a meta was morphed already, by the `morph`\nblock, so the join takes the term
  the meta is bound to as it is and morphs\nnothing again. When the two come to the
  same term, nothing depends on the\ncondition: the join mints nothing and answers
  that term, and the line binding\nit is commented with both sides, `\U0001D45B·2·5
  := \U0001D45B·2·3  # \U0001D544(ξ.left), \U0001D544(ξ.right)`.\nWhen the two differ
  in their symbols alone, such as `Φ.number( φ ↦ \U0001D70E3:λ )` and\n`Φ.number(
  φ ↦ \U0001D70E4:λ )`, the join makes one term of them: every pair of symbols\nstanding
  at the same place gets a fresh symbol, which a line of its own says\nis the left
  one where the condition holds and the right one where it does not:\n\n```text\njoined
  \U0001D70E5 := \U0001D6FF1·2 ? \U0001D70E3 : \U0001D70E4\n```\n\nThe condition is
  named by the meta its `dataize` operand bound, `\U0001D6FF1·2`,\nsince the join
  reads the datum that line holds and runs no \U0001D53B of its own. A\npair met twice
  gets the same fresh symbol both times. Nothing is bound to the\ncondition, which
  stays the unknown it was.\n\nTwo sides that differ in anything else, a datum, a
  λ name or the shape of a\nterm, do not join, and neither do a side holding a datum
  and a side holding a\nsymbol, unless a `symbolize` line turned that datum into a
  symbol first, as\ndescribed below. Such a firing closes with a line naming the two
  sides it\ncould not join, the left one first:\n\n```text\ndiverged \U0001D45B·2·3
  vs \U0001D45B·2·5  # they differ at .x, and the join names no otherwise\n```\n\nA
  side is named by the line that bound it: the line its morph wrote, or the\nline
  of `morph`, `evaluate`, `stay`, `rewrite`, `symbolize` or `defer` whose\nmeta it
  reads, such as `\U0001D45B1·1`. A side that is a bare symbol is\nwritten as that
  symbol, and a side no line named, such as a datum its morph\nleft as it was, as
  the term it is. Past\nthat line the firing gets stuck the way a λ function no entry
  answers does:\n`--partial` parks the site the entry was fired at, and without it
  the command\nfails with `No entry of --symbolic answers the λ function 'L_fork'`.
  A side\nwhose morph gets stuck or is cut gets the firing stuck at once, the way
  an\noperand of `morph` does.\n\nThe comment of the line tells where the two sides
  differ and why the join\ncould not make one formation of them, so a reader knows
  what to change in\nthe file without rebuilding both sides by hand. The place is
  a path of\nattributes, such as `.x` or `.φ.Δ`. It walks down both sides through
  the\nformations they share and ends at the first attribute they bind differently,\nor
  that only one of them binds. It stops at an application or a dispatch, and\nthe
  comment leaves it out when the two sides differ as a whole, such as a\nformation
  and a dispatch. A ρ counts like any other attribute, so the comment\nmay name a
  `.ρ` that `--hide-rho` hides from the terms. The reason is one of\nthree: the join
  names no `otherwise`, described below, a side is no\nformation, as in `the right
  side is no formation`, or a side has a Δ or a λ,\nas in `the left side has λ`.\n\nTwo
  formations of different shapes may still stand for one object, when\nwhoever reads
  it asks it only for attributes both sides lead to alike. A\nblock may name a λ function
  under a fourth key, `otherwise`, and then such a\nfiring answers a formation binding
  every attribute of both sides to a copy\nof that function, which asks a copy of
  each side for the attribute:\n\n```yaml\n  join:\n    on: \U0001D6FF1\n    left:
  \U0001D45B1\n    right: \U0001D45B2\n    otherwise: L_join\n```\n\n```text\n⟦\n
  \ x ↦ ∅,\n  left\U0001F335 ↦ \U0001D45B1( x ↦ ξ.x ),\n  right\U0001F335 ↦ \U0001D45B2,\n
  \ φ ↦ ⟦\n    ρ ↦ ∅, λ ⤍ L_join, on\U0001F335 ↦ ⟦ Δ ⤍ \U0001D6FF1 ⟧,\n    left\U0001F335
  ↦ ρ.left\U0001F335.φ, right\U0001F335 ↦ ρ.right\U0001F335.φ\n  ⟧,\n  if ↦ ⟦\n    ρ
  ↦ ∅, λ ⤍ L_join, left ↦ ∅, right ↦ ∅, on\U0001F335 ↦ ⟦ Δ ⤍ \U0001D6FF1 ⟧,\n    left\U0001F335
  ↦ ρ.left\U0001F335.if( left ↦ ξ.left, right ↦ ξ.right ),\n    right\U0001F335 ↦
  ρ.right\U0001F335.if( left ↦ ξ.left, right ↦ ξ.right )\n  ⟧\n⟧\n```\n\nHere `\U0001D45B1`
  and `\U0001D45B2` stand for the two sides, `x` for a void of `\U0001D45B1`, `left`\nand
  `right` for the voids of the formations both sides bind `if` to, and\n`\U0001D6FF1`
  for the bytes the condition came down to. When the condition is a\nsymbol, such
  as `\U0001D70E7`, `on\U0001F335` holds that symbol, `⟦ λ ⤍ \U0001D70E7 ⟧`, and not
  the 42\nevery symbol is dataized to, so every copy still names the unknown it decides\nby.
  So asking the formation for an attribute means the same as asking\n`on\U0001F335.if(
  left\U0001F335, right\U0001F335 )` for it. Every name the formation adds carries\nthe
  \U0001F335 mark, as the names phino makes up do, such as `a\U0001F33514`, since
  no\nprogram can spell it: an attribute a side binds, such as the `left` and\n`right`
  voids of the `if` of a bool in EO, never clashes with them.\n\nThe formation leaves
  void every attribute either side leaves void, once even\nwhen both sides leave it
  void, and holds each side under `left\U0001F335` or\n`right\U0001F335` applied to
  its own voids. An argument handed to the formation thus\nreaches the side through
  `ξ`, while the side keeps the ρ it binds, which its\nown attributes may read. Every
  copy of the function asks a side for an\nattribute through its ρ, which the formation
  fills. The ρ of either side gets\nno copy of the function, nor does an attribute
  whose name ends with \U0001F335, since\na side may be a formation a join fabricated.
  An attribute only one side binds\ngets its copy too, since the other side may reach
  it through `φ`. A side\nholding a datum or a λ, such as a bare symbol `⟦ λ ⤍ \U0001D70E7
  ⟧`, keeps what it\nstands for where no attribute reaches it, so no such formation
  means the same\nas the two sides, and the firing writes `diverged` as it does with
  no\n`otherwise` at all, its comment naming the side and what it has, as in\n`the
  left side has Δ`.\n\nA copy of the function leaves void every void of the formations
  the sides\nbind its attribute to, once even when both leave it void, and those of
  the\nleft side first, so an argument handed over by position reaches the same void\non
  both sides. It applies a side binding the attribute to a formation to the\nvoids
  of that formation alone, since applying a formation to an attribute it\nlacks gives
  ⊥, and any other side to every void it leaves, since phino sees\nno void of a term
  it has not morphed. A method of the formation thus takes\nits arguments, as in `if(
  left ↦ …, right ↦ … )`, and hands them to both\nsides.\n\nThe firing writes a line
  naming the formation by the two sides, in place of\n`diverged`, and spells the formation
  out in its comment:\n\n```text\nfabricated \U0001D45B·2·8 := \U0001D45B1·1 and \U0001D45B2·1
  \ # ⟦ left\U0001F335 ↦ \U0001D45B1·1, …, φ ↦ ⟦ … ⟧, … ⟧\n```\n\nphino implements
  no `L_join`: the file defines it, as an entry that joins\n`$.left\U0001F335` and
  `$.right\U0001F335` on `$.on\U0001F335`:\n\n```yaml\n- λ: L_join\n  join:\n    on:
  $.on\U0001F335\n    left: $.left\U0001F335\n    right: $.right\U0001F335\n    otherwise:
  L_join\n```\n\nA path under `on` dataizes nothing: the firing reads the bytes or
  the symbol\nthe attribute holds off the formation it fires, so the condition is
  not\nbrought down a second time, and it gets stuck when the path leads to neither.\nIts
  `joined`\nline names the condition by the path, as `joined \U0001D70E4 := ξ.on\U0001F335
  ? \U0001D70E2 : \U0001D70E3`. A\nside that is no formation, or a formation holding
  a datum, which no attribute\nreaches, still gets the firing stuck.\n\nA side may
  raise. EO raises with an object, a copy of\n`⟦ message ↦ ∅, λ ⤍ L_throw ⟧`, whose
  λ function the file leaves out on\npurpose, so that an error of the program stays
  an error at runtime. Such a\nside is a term like any other, and it joins with no
  value the other side\nhas, so the firing gets stuck and `--partial` parks it:\n\n```bash\n$
  cat raise.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅ ⟧,\n  error ↦ ⟦ message
  ↦ ∅, λ ⤍ L_throw ⟧,\n  bool ↦ ⟦ if ↦ ∅ ⟧,\n  check ↦ ⟦ λ ⤍ L_check ⟧,\n  demo ↦
  ⟦ a ↦ Φ.check.if( 7, Φ.error( \"negative\" ) ) ⟧\n⟧\n$ cat raise.yaml\n- λ: L_check\n
  \ \U0001D45B: Φ.bool( if ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦ ∅, φ ↦ ⟦ λ ⤍ \U0001D70E
  ⟧ ⟧ )\n- λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  join:\n    on: \U0001D6FF1\n
  \   left: $.then\n    right: $.else\n$ phino dataize --symbolic=raise.yaml --locator=Q.demo.a
  --partial \\\n    --sweet --hide-rho raise.phi\n⟦ λ ⤍ L_fork, then ↦ 7, else ↦ Φ.error(
  \"negative\" ), φ ↦ \U0001D70E1:λ ⟧\n```\n\nThe `then` side comes to the bytes of
  7 and the `else` side to the copy of\n`error`, so the protocol ends in `diverged
  \U0001D45B·2·1 vs \U0001D45B·2·2`, commented with\n`they differ at .φ, and the join
  names no otherwise`, and the command prints\nthe `if` it parked.\nWithout `--partial`
  the command fails there, with\n`No entry of --symbolic answers the λ function 'L_fork'`.\n\n###
  Dropping the ρ of a dispatch\n\nThere is a sixth block, `stay`, and it reduces nothing.
  Each line of it takes\nthe term another meta of the entry is bound to and binds
  an expression meta of\nits own to that term with every `( ρ ↦ … )` dropped that
  is applied to a\ndispatch:\n\n```yaml\n- λ: L_fork\n  dataize:\n    \U0001D6FF1:
  $.φ\n  morph:\n    \U0001D45B1: $.then\n    \U0001D45B2: $.else\n  stay:\n    \U0001D45B3:
  \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n    on: \U0001D6FF1\n    left:
  \U0001D45B3\n    right: \U0001D45B4\n```\n\nThe right-hand side of a line names
  a meta bound by `morph` or by another line\nof the entry, and nothing else. Every
  position of the term is walked, the\nmethods and the `ρ` of a formation among them,
  and `\U0001D452.\U0001D70F( ρ ↦ \U0001D4522 )` becomes\n`\U0001D452.\U0001D70F`.
  So does a dispatch heading a chain of applications that bind no `ρ`:\n`\U0001D452.\U0001D70F(
  φ ↦ \U0001D4523 )( ρ ↦ \U0001D4522 )` becomes `\U0001D452.\U0001D70F( φ ↦ \U0001D4523
  )`. A `ρ` applied to anything\nelse, such as a formation, stays.\n\nDropping it
  changes no value. The `dot` rule answers a dispatch as\n`\U0001D45B1( ρ ↦ ⟦…⟧ )`,
  and then `copy` fills a void `ρ` of the body, `stay` keeps a\nbound one and `skip`
  drops it where the body declares none. So once `\U0001D452.\U0001D70F`\ncomes to
  a formation, a later `( ρ ↦ \U0001D4522 )` meets a `ρ` that is bound or not\nthere,
  and `stay` or `skip` drops it. The block only drops it earlier, before\nthe dispatch
  is reduced.\n\nThis is how a join brings two numbers to one shape. In EO `bytes.as-number`\nreads
  its `data` as `ρ`, so a branch computed through it comes to\n`Φ.number( φ ↦ Φ.bytes(
  φ ↦ \U0001D70E1 )( ρ ↦ ⟦ … ⟧ ) )`, with the copy hung on the\nbytes as their `ρ`,
  while a branch made of no object comes to\n`Φ.number( φ ↦ Φ.bytes( φ ↦ \U0001D70E2
  ) )`. The join compares the two as written,\nfinds a shape apart, and gets stuck;
  after `stay` they differ in their\nsymbols alone, and the join makes one term of
  them. The protocol writes each\nline of the block. A line that dropped a `ρ` is
  commented `stay(…)` with the\nmeta it took, so a reader sees that the term changed
  and what changed it, while\na line that dropped nothing is commented with the meta
  alone:\n\n```text\n\U0001D45B3·1 := Φ.number( φ ↦ Φ.bytes( φ ↦ \U0001D70E1:λ ) ):φ
  \ # stay(\U0001D45B1)\n\U0001D45B4·1 := \U0001D45B2·1  # \U0001D45B2\njoined \U0001D70E4
  := \U0001D6FF1·1 ? \U0001D70E1 : \U0001D70E2\n```\n\n### Standing a symbol for a
  datum\n\nThere is a seventh block, `symbolize`, and it reduces nothing either. Each
  line\nof it takes the term another meta of the entry is bound to and binds an\nexpression
  meta of its own to that term with every datum it holds turned into\na fresh symbol:\n\n```yaml\n-
  λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.then\n
  \   \U0001D45B2: $.else\n  symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4:
  \U0001D45B2\n  join:\n    on: \U0001D6FF1\n    left: \U0001D45B3\n    right: \U0001D45B4\n```\n\nThe
  right-hand side of a line names a meta bound by `morph` or by another line\nof the
  entry, and nothing else. The whole term is walked, the way a `rewrite`\nline walks
  it: every binding of every formation, `ρ` and methods among them,\nevery argument
  of every application, named or positional, and the target of\nevery dispatch. A
  `Δ ⤍ \U0001D44F` met anywhere becomes `λ ⤍ \U0001D70E4`, a symbol minted\nfresh,
  the way a bare `\U0001D70E` of an answer is. A datum off the `φ` chain counts\ntoo,
  since a value may sit there: the bool a `rewrite` line makes of a literal\nholds
  its datum inside the formation bound to `if`.\n\nThis is how a join makes one term
  of a literal and a value some firing\ncomputed. In EO `x.gt( 0 ).if( 1, x )` has
  one side that is the literal `1`, a\nnumber whose bytes hold the datum `3F-F0-…`,
  and another side that is a number\nwhose bytes hold a symbol. The two are numbers
  of one shape and differ in the\nvalue alone, yet a datum against a symbol is no
  pair of symbols, so the two do\nnot join. After `symbolize` both sides hold a symbol
  where the value stands,\nand the join makes one term of them. The protocol writes
  every symbol the\nblock minted with the datum it stands for, so a reader of the
  joined term can\ntell that `\U0001D70E4` was `1` on the left side. A line that turned
  a datum into a\nsymbol is commented `symbolize(…)` with the meta it took, while
  a line whose\nterm held no datum is commented with the meta alone:\n\n```text\nsymbolized
  \U0001D70E4 := 3F-F0-00-00-00-00-00-00  # 1.0\n\U0001D45B3·1 := Φ.number( φ ↦ Φ.bytes(
  φ ↦ \U0001D70E4:λ ) ):φ  # symbolize(\U0001D45B1)\n\U0001D45B4·1 := \U0001D45B2·1
  \ # \U0001D45B2\njoined \U0001D70E5 := \U0001D6FF1·1 ? \U0001D70E4 : \U0001D70E2\n```\n\nA
  line sees its own side alone, so a datum both sides share becomes two\nsymbols and
  then one joined symbol, and the joined term loses that datum. A\nfile that wants
  to keep it leaves the block out, and an entry without\n`symbolize` writes the same
  protocol it wrote before.\n\nThe blocks chain, and an entry that joins reads as
  a pipeline, every step of\nit on its own line. A side may go through a `stay` line,
  then an `evaluate`\nline, then a `symbolize` line, then a `defer` line, so that
  a call \U0001D544 left\nunfired is fired, a copy over a bare symbol is deferred,
  and two sides of one\nshape still join:\n\n```yaml\n- λ: L_fork\n  dataize:\n    \U0001D6FF1:
  $.φ\n  morph:\n    \U0001D45B1: $.then\n    \U0001D45B2: $.else\n  stay:\n    \U0001D45B3:
  \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  evaluate:\n    \U0001D45B5: \U0001D45B3\n
  \   \U0001D45B6: \U0001D45B4\n  symbolize:\n    \U0001D45B7: \U0001D45B5\n    \U0001D45B8:
  \U0001D45B6\n  defer:\n    \U0001D45B9: \U0001D45B7\n    \U0001D45B10: \U0001D45B8\n
  \ join:\n    on: \U0001D6FF1\n    left: \U0001D45B9\n    right: \U0001D45B10\n```\n\nAn
  `evaluate` line here works as it does in an entry that computes, except\nthat it
  passes on a term that is no formation instead of getting stuck. In EO\n`bool.and`
  is `flag.if( FF-.eq( x ), false )`, so one side morphs down to the\n`eq` of bytes
  with its λ function unfired, which could never join with the\nbool on the other
  side. The line fires it, and the side comes to a bool too,\nwhile the other side
  is a bool already, a formation with no λ function, and\nits line leaves it as it
  is. A `defer` line here works as it does in an entry\nthat computes too: it answers
  a copy over a bare symbol with a fresh symbol,\nwrites the `deferred …` line sited
  at the meta it read, such as `# \U0001D544(\U0001D45B8.φ)`,\nand binds any other
  term as it stands.\n\n### Rewriting a term with rules\n\nThere is an eighth block,
  `rewrite`, and it reduces nothing either. Each line of\nit takes the term another
  meta of the entry is bound to, named under `of`,\napplies the rules listed under
  `rules`, spelled with the `pattern`, `result`,\n`when`, `where` and meta variables
  a rule file uses, and binds an expression\nmeta of its own to the outcome:\n\n```yaml\n-
  λ: L_fork\n  dataize:\n    \U0001D6FF1: $.c\n  morph:\n    \U0001D45B1: $.a\n    \U0001D45B2:
  $.b\n  rewrite:\n    \U0001D45B3:\n      of: \U0001D45B1\n      rules: &bool\n        -
  name: true-literal\n          pattern: Φ.true\n          result: Φ.bool( if ↦ ⟦
  Δ ⤍ 01- ⟧ )\n        - name: false-literal\n          pattern: Φ.false\n          result:
  Φ.bool( if ↦ ⟦ Δ ⤍ 00- ⟧ )\n    \U0001D45B4:\n      of: \U0001D45B2\n      rules:
  *bool\n  join:\n    on: \U0001D6FF1\n    left: \U0001D45B3\n    right: \U0001D45B4\n```\n\nThe
  meta under `of` is one bound by `morph` or by another line of the entry,\nand nothing
  else. A line reads no key but `of` and `rules`, and two lines may\nshare their rules
  through a YAML anchor, as above. A rule is tried at every\nposition of the term,
  the outermost first. The first rule whose pattern\nmatches a position rewrites it,
  and a rewritten position is not walked into\nagain, so a rule whose result carries
  its own pattern never loops. Nothing is\nnormalized afterwards: a rewrite is a substitution
  the entry vouches for and\nnot a reduction, exactly as an answer is. A rule writing
  a symbol such as `\U0001D70E4`\ninto its result, or reading a meta its pattern never
  binds, is refused when the\nfile is read, since only a firing mints a symbol.\n\nThis
  is how a join compares a literal with a bool a computation answered. In\nEO the
  literal `Φ.true` stands where the other side holds `Φ.bool( … )`, the\nsame value
  in another shape, and the join gets stuck on the two as written.\nAfter `rewrite`
  both sides are bools. A line that changed its term is\ncommented with the block
  and the meta it read, while a line that changed\nnothing writes the plain line of
  a meta bound to another:\n\n```text\n\U0001D45B3·1 := ⟦ φ ↦ \U0001D70E2:λ, kq ↦
  Φ.bool( if ↦ 01-:Δ ) ⟧  # rewrite(\U0001D45B1)\n\U0001D45B4·1 := \U0001D45B2·1  #
  \U0001D45B2\njoined \U0001D70E4 := \U0001D6FF1·1 ? \U0001D70E2 : \U0001D70E3\n```\n\nThe
  markup writes both lines as a plain `<bound>`.\n\n### Morphing what a line made\n\nAn
  operand of `morph` may name a meta another line binds instead of a path\nfrom `$`.
  It reduces the term that meta is bound to through \U0001D544, the way an\noperand
  reading `$` is reduced, and binds a meta of its own to the normal\nform:\n\n```yaml\n-
  λ: L_fork\n  dataize:\n    \U0001D6FF1: $.c\n  morph:\n    \U0001D45B1: $.a\n    \U0001D45B2:
  $.b\n    \U0001D45B4: \U0001D45B3\n  rewrite:\n    \U0001D45B3:\n      of: \U0001D45B2\n
  \     rules:\n        - name: unwrap\n          pattern: ⟦ φ ↦ \U0001D4521 ⟧\n          result:
  \U0001D4521\n  join:\n    on: \U0001D6FF1\n    left: \U0001D45B1\n    right: \U0001D45B4\n```\n\nSuch
  an operand is a line of the entry, so it runs once the meta it names is\nbound,
  as described below. It takes the term as the other line bound it and\ndoes not read
  it against the formation being fired. An operand reading a meta\ninside a term,
  such as `\U0001D45B1.x`, is refused when the file is read, and so is\none naming
  a meta nothing binds.\n\nThis is how a join compares a side that `rewrite` made
  with a side in its\nnormal form. Above, `$.b` comes down to `⟦ φ ↦ Φ.t ⟧`, and the
  rule `unwrap`\ntakes out `Φ.t`, a path the join cannot compare with the object on
  the left.\nThe morph of `\U0001D45B3` brings the path down to the object it reads.
  In EO the same\nhappens to the `Φ.bool( … )` a `rewrite` line writes in place of
  `Φ.false`.\nThe protocol comments the line with the morph of the meta it read:\n\n```text\n\U0001D45B3·1
  := Φ.t  # rewrite(\U0001D45B2)\n\U0001D45B4·1 := \U0001D70E3:λ:φ  # \U0001D544(\U0001D45B3)\njoined
  \U0001D70E4 := \U0001D6FF1·1 ? \U0001D70E2 : \U0001D70E3\n```\n\n### The order of
  the lines\n\nThe lines of `morph`, `evaluate`, `defer`, `stay`, `rewrite` and `symbolize`\nrun
  in the order of the metas they read, not in the order of their blocks. A\nline of
  `morph` is an operand naming a meta. A line runs once every meta it\nreads is bound,
  so this entry fires what `x` came to and then fires the answer,\none more call,
  although the line doing so stands first:\n\n```yaml\n- λ: L_twice\n  morph:\n    \U0001D45B1:
  $.x\n  evaluate:\n    \U0001D45B3: \U0001D45B2\n    \U0001D45B2: \U0001D45B1\n  \U0001D45B:
  \U0001D45B3\n```\n\nThe line binding `\U0001D45B3` reads `\U0001D45B2`, which the
  line under it binds, so that line\nruns first. The `dataize` block and the operands
  of `morph` reading `$` read\nno meta and always run before all the others. Where
  no meta orders two lines,\nthey run in the order the list above gives their blocks,
  so a line of `morph`\nruns right after the line binding the meta it names, and the
  lines of one\nblock run in the order of their metas, `\U0001D45B2` before `\U0001D45B10`.
  A line reading a\nmeta nothing binds is refused when the file is read, and so is
  a line that\nreads the meta it binds, directly or through other lines, since it
  could never\nrun.\n\n### Symbols\n\nAn entry answers, it never computes. The job
  of these functions is symbolic\nmorphing: what `5.plus( 6 )` comes to is the arithmetic
  of the object model and\nnot `phino`'s, so an entry answers a term carrying a symbol
  standing for a\nvalue nobody worked out, and the data its `dataize` operands came
  down to is\nnot its to read. An answer mentioning a `\U0001D6FF` is refused where
  the file is read.\n\n`\U0001D70E` is a meta of the calculus, beside `\U0001D45B`,
  `\U0001D6FF` and `\U0001D453`, and it stands where\na λ name stands. In a term,
  `\U0001D70E1` is a concrete symbol: a λ function nothing\nanswers, which is what
  makes the value the term carries unknown. Firing it is\ntherefore the same question
  as firing a λ name the `--symbolic` file does not\ncarry, and gets the same answer:
  \U0001D53C stops there, the protocol records the site as\n`unanswered \U0001D70E1`,
  and `--partial` leaves the term where it stands. Dispatching\nan attribute off a
  symbol — `⟦ λ ⤍ \U0001D70E1 ⟧.plus( 5 )` — therefore taints its own\nbinding and
  nothing else; what stands beside it still computes. In an answer, a\nbare `\U0001D70E`
  asks for a fresh one, minted as the firing happens and numbered by the\nrun, so
  no two unknowns are ever spelled alike. Minting starts after the symbols\nthe program
  already carries, so a run over the \U0001D711-program an earlier run wrote\nnever
  spells a fresh symbol like one already standing there.\n\nDataizing a symbol never
  gets stuck. It answers a fixed datum, 42\n(`40-45-00-00-00-00-00-00`), the same
  one for every symbol, so \U0001D53B always\nanswers, a `\U0001D6FF` always holds
  concrete data and no firing ever declines for the\nlack of it:\n\n```bash\n$ cat
  sum.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  φ ↦ 5.plus( 6 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho
  sum.phi\n40-45-00-00-00-00-00-00\n```\n\n### The keys of the file\n\nEach `λ` is
  a regular expression, and it must match the whole λ name, so a\nplain name such
  as `L_number_plus` means that one function and nothing else,\nwhile `L_number_.*`
  stands for every function of `number`. The keys are unique:\nnothing tells two entries
  under one key apart, so a second entry under a key is\nunreachable and the file
  is refused rather than merely redundant.\n\nA λ name no key matches has no λ function
  at all, so \U0001D53C gets stuck on it.\nWithout `--symbolic` there is no entry
  at all and every λ function gets stuck:\n\n```bash\n$ phino dataize --sweet --hide-rho
  sum.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_plus'\n```\n\nThe
  file is read before anything is parsed or reduced, so a key that is no\nregular
  expression, an operand that is no meta of the kind its block binds, or\nan answer
  the calculus cannot read fails the run up front rather than half-way\nthrough a
  derivation.\n\n### Recording what fired\n\nEvery λ function fired on the way to
  the answer may be recorded in a\nmachine-readable protocol, with the `--protocol`
  option. The protocol is a\ntree: the run at the top, one block per firing under
  it, and inside the block\nthe operands the firing bound and the term it answered
  with. A judgment started\nat a new site opens a block too, and what it does stands
  under it.\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml
  --protocol=atoms.txt --quiet \\\n    --sweet --hide-rho sum.phi\n$ cat atoms.txt\n\U0001D53B(Φ):\n
  \ \U0001D544(Φ):\n    \U0001D45B·0·1 := 5\n    \U0001D45B·0·2 := \U0001D45B·0·1.plus(
  x ↦ 6 )\n  \U0001D53C(L_number_plus):\n    \U0001D53B(Φ.a\U0001F3350):\n      \U0001D544(Φ.a\U0001F3350):\n
  \       \U0001D45B·1·1 := 5\n        \U0001D45B·1·2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ
  )\n      \U0001D6FF·1·1 := 40-14-00-00-00-00-00-00  # 5.0\n    \U0001D6FF1·1 :=
  \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n    \U0001D53B(Φ.a\U0001F3351):\n      \U0001D544(Φ.a\U0001F3351):\n
  \       \U0001D45B·1·3 := 6\n        \U0001D45B·1·4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ
  )\n      \U0001D6FF·1·2 := 40-18-00-00-00-00-00-00  # 6.0\n    \U0001D6FF2·1 :=
  \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n    \U0001D45B·1·5 := Φ.number( φ ↦ \U0001D70E1:λ
  )  # \U0001D45B\n    \U0001D544(\U0001D45B·1·5):\n      \U0001D45B·1·6 := Φ.number(
  φ ↦ \U0001D70E1:λ )\n    \U0001D45B·1·7 := \U0001D45B·1·6  # \U0001D544(\U0001D45B·1·5)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n`\U0001D53B(…)` is the run and the term it was
  aimed at, `\U0001D544(…)` where the run is a\nmorphing, and `\U0001D53C(…)` is one
  firing, named by the entry that answered it. A line\nstanding in a block needs no
  comment to say which judgment made it and where:\nthe block it stands in says that
  already. A comment is written only where it\nsays something the block does not,
  such as the term an operand was reduced\nfrom, `\U0001D53B(ξ.ρ)`, or the meta an
  answer was read from, `\U0001D45B`, and every comment\nnaming a judgment is of that
  shape: a judgment applied to a term, which is the\nintent the value beside it came
  from. The firings are numbered across the\nwhole run, in the order they open, so
  `\U0001D6FF1·2` is the value bound to `\U0001D6FF1` by\nthe second firing of the
  run, whichever λ function that was, `\U0001D45B1·2` the same\nfor a `morph` meta,
  and `\U0001D45B·3·2` the answer of the third firing, so\n`\U0001D45B1·2 := \U0001D45B·3·2`
  reads \"the `\U0001D45B1` of this firing is what the third firing\nanswered\". One
  firing binds a meta once and no two firings\nshare a number, so every one of these
  names stands on exactly one line of the\nfile and a line naming another one points
  at it and no other.\n\nA nested `\U0001D53B(…):` or `\U0001D544(…):` line opens
  a block where a judgment starts at a\nsite other than the one of the block it stands
  in, and names that site. What\nthe judgment does stands one level deeper under it:
  the objects its\nnormalization makes, the firings it demands, and the judgments
  it starts in\nturn. A reader therefore sees which judgment made each line and at
  which site,\nrather than a flat list of lines each saying so. \U0001D53B of a term
  that is no\nformation asks \U0001D544 for the normal form of the same term first,
  through its\n`norm` rule, so a `\U0001D544(…):` block often stands right inside
  a `\U0001D53B(…):` block of\nthe same site, and `\U0001D45B·0·1 := 5` above is made
  by that \U0001D544 and not by \U0001D53B. A\njudgment started at the site of the
  block it stands in, and by the same\njudgment, opens nothing, and what it does joins
  that block. A block is written\nonly once a line stands in it, so a judgment that
  made nothing worth a line\nleaves no empty heading behind. The line is no firing:
  it binds no meta and\ntakes no number, so the metas of the firings under it are
  numbered as if it\nwere not there. A `\U0001D53B(…):` block ends with the datum
  the `delta` rule found,\nsuch as `\U0001D6FF·1·1 := 40-14-00-00-00-00-00-00`, named
  by the firing it stands in\nand a counter of its own, and the operand line right
  after the block names it.\nA datum of eight bytes is commented with the number those
  bytes hold as an\nIEEE 754 double, `# 5.0` here, since that is how a number keeps
  its data.\nIn the run above \U0001D53B gets into each number the entry brings down,
  and through\nits `φ` into the bytes that number holds, in the same block, since
  the site is\nthe same.\n\nAn answer stands on two lines and not one. A firing answers
  the term its entry\nwrote and `phino` morphs that term before standing it back into
  the program, so\n`\U0001D45B·1·5` is what the entry wrote, with the symbols this
  firing minted already in\nit, commented with `\U0001D45B` to name the key it was
  read from, and `\U0001D45B·1·7` is the\nnormal form \U0001D544 made of it, commented
  with `\U0001D544(\U0001D45B·1·5)` to say where it came from.\nThat morphing opens
  a block of its own, `\U0001D544(\U0001D45B·1·5):`, named after the term it\nstarted
  from, since that term stands nowhere in the program a locator could\nreach. It is
  the same morphing every other term goes through, and writing only its\noutcome would
  have the formation of `number` appear in place of the three\ntokens the entry wrote
  with nothing saying why. Whatever that morphing fires\nor applies writes its lines
  between the two, exactly where a firing an operand\ntook opens its block, so the
  order the lines come in is the order the work was\ndone in.\n\n`\U0001D45B·1·6 :=
  Φ.number( φ ↦ \U0001D70E1:λ )` is an object an application made. The `copy`\nrule
  of normalization fills a void of a formation with the argument it was\ngiven, and
  so makes a new object, whatever judgment is running and wherever in\nthe term the
  application stands. The line binds that object to a fresh `\U0001D45B` and\nspells
  the application: the object applied on the left and the argument it got\non the
  right, so `5` is `Φ.number( φ ↦ … )` in sugar. The `ρ` a dispatch gives\nthe attribute
  it takes writes no line. The block the line stands in names the\njudgment that normalized
  and the site it stood at. The name is counted with the\nmetas of the firing the
  line stands in, `\U0001D45B·1·5` before it and `\U0001D45B·1·7` after it,\nand an
  object made outside every firing is counted under `\U0001D45B·0`. From then on\nevery
  line spells the object by that name rather than as the formation it is,\nand the
  application by the same name, since `copy` makes the same object of the\nsame application
  wherever it stands: `\U0001D45B·1·1` is the object `5` made,\n`\U0001D45B·0·1.plus(
  x ↦ 6 )` is the `plus` of the first `5` applied to `6`, one line\nfor one call,
  and `\U0001D45B·1·7 := \U0001D45B·1·6` says the firing answered with the object
  \U0001D544\nmade of what the entry wrote. Such a line names its head and its argument
  that\nway, each on its own, and never the application as a whole, so a line spells
  out\nevery application, even one making an object an earlier one already made, the\nway
  `\U0001D45B·1·1 := 5` does, and a later line names the latest of them. Only an object\nstill
  standing as it was made is named: once a rule rewrote a part of it, it is\nanother
  object and it is spelled out again.\n\nWhere an operand came down to the datum a
  symbol stands for, the protocol writes\n`\U0001D53B(\U0001D70E1:λ)` in place of
  that 42 (`\U0001D70E1:λ` is the formation `⟦ λ ⤍ \U0001D70E1 ⟧`, in the\nsugar every
  sweet term is written with), so a reader sees that the value was\nmanufactured rather
  than read out of the program. A `\U0001D70E` is the name of a λ\nfunction and no
  term of its own, so \U0001D53B is applied to the formation carrying it\nand never
  to the name alone.\n\nA `join` block writes every symbol it minted,\n`joined \U0001D70E5
  := \U0001D6FF1·2 ? \U0001D70E3 : \U0001D70E4`, naming the condition by the meta
  of its\noperand line, and nothing is bound to the condition, which stays the unknown\nit
  was. A comment carries the letter of a judgment exactly where a judgment\nmade the
  value and the block around the line does not already say so.\n\nThe site of a firing
  is a locator, and the block a firing stands in names it,\nunder the letter of the
  judgment that asked for the firing: \U0001D53C is fired by the\n`ml` rule of morphing
  and by the `fire` rule of dataization, so a firing in the\nblock `\U0001D544(Φ.demo.a.φ):`
  is a λ function fired while \U0001D544 was reducing that\nbinding, and one standing
  right in `\U0001D53B(Φ):` was fired because dataization\ndemanded data of `Φ`. A
  chain such as `5.plus( 6 ).plus( 7 )` writes both: the\ninner call is fired inside
  the `\U0001D544(Φ):` block, while \U0001D544 reduces the head of the\nouter dispatch,
  and the outer one right in `\U0001D53B(Φ):`, because \U0001D53B asked for the\ndata.
  A line standing right in a firing has no block of its own around it, so\na line
  there that a judgment wrote at a site no block names, such as\n`starved …` below,
  carries that judgment and site as its comment. The site\nitself is where in the
  program the firing\nbelongs: the term the run was aimed at, so `Φ` for a run that
  was aimed at\nnothing in particular. An operand of a firing is reduced bound to
  a synthetic\nattribute of the universe (see `--inside` below), so a λ function fired
  while\nit came down is written under that attribute and not under the site of the\nfiring
  that asked for it, and a formation an `evaluate` line fires is written\nunder the
  meta it fired, `\U0001D53C(\U0001D45B2)`.\n\nAn operand line ends in the judgment
  that reduced it and the term it was\nreduced from, written as a comment after two
  spaces and `#`. The value alone\nsays what the meta was bound to and neither what
  it was bound from nor what\nwas done to it, so `\U0001D6FF1·1 := \U0001D6FF·1·1
  \ # \U0001D53B(ξ.ρ)` reads \"the `\U0001D6FF1` of this firing\nis the `ρ` of the
  formation brought down through \U0001D53B, and it came down to the\ndatum `\U0001D6FF·1·1`
  above\", where a `morph` operand reads `\U0001D45B1·5 := \U0001D45B·3·4  # \U0001D544(ξ.then)`\nand
  says that the `then` of the formation reached its normal form through \U0001D544.\nWhich
  of the two judgments ran is the whole difference between a line ending\nin data
  and one ending in a term. It is the very term the entry wrote under\nthat meta,
  spelled the way the calculus reads it — `$` is read as `ξ` — so a\nreader never
  has to open the `--symbolic` file beside the protocol and match\nevery line by λ
  name and meta number.\n\n`unanswered …` is a λ name no entry answers, standing where
  the block of its\nfiring would have stood. Nothing fired, so nothing opens under
  it. The line is\ncommented with the judgment that asked and the formation it was
  asking about,\n`\U0001D544(L_none:λ)`, which no block names, the way an operand
  line is commented\nwith the term it was reduced from: \U0001D53C is fired by the
  `ml` rule of morphing\nand by the `fire` rule of dataization, so the letter says
  where in the\nreduction the site stands and the term says which object the λ function
  that\ncould not fire belongs to. It is written whether or not `--partial` goes on\nto
  park the run, since the protocol records what \U0001D53C was asked for, and a\nquestion
  it could not answer belongs there as much\nas one it could — once per site and not
  once per attempt, since a site\n`--partial` parks stays in the residue, where a
  later step may meet it again:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_nope'\n$
  cat atoms.txt\n\U0001D53B(Φ):\n  \U0001D544(Φ):\n    \U0001D45B·0·1 := 5\n    \U0001D45B·0·2
  := \U0001D45B·0·1.plus( x ↦ 6 )\n    \U0001D53C(L_number_plus):\n      \U0001D53B(Φ.a\U0001F3350):\n
  \       \U0001D544(Φ.a\U0001F3350):\n          \U0001D45B·1·1 := 5\n          \U0001D45B·1·2
  := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·1 := 40-14-00-00-00-00-00-00
  \ # 5.0\n      \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F3351):\n
  \       \U0001D544(Φ.a\U0001F3351):\n          \U0001D45B·1·3 := 6\n          \U0001D45B·1·4
  := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·2 := 40-18-00-00-00-00-00-00
  \ # 6.0\n      \U0001D6FF2·1 := \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n      \U0001D45B·1·5
  := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·1·5):\n
  \       \U0001D45B·1·6 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D45B·1·7 :=
  \U0001D45B·1·6  # \U0001D544(\U0001D45B·1·5)\n  unanswered L_number_nope  # \U0001D53B(L_number_nope:λ)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nThe very same file comes back with `--partial`,
  where the run answers the\nresidue instead of failing: what `phino` could not decide
  is a property of the\nprogram and not of the option that decides what to do about
  it.\n\nThree more lines say why a firing gave no answer.\n`stuck L_outer` is the
  last line of a firing that got stuck, naming the λ\nfunction it got stuck on, which
  is seldom the one `unanswered …` names: that\none is written where it was asked
  for, and this one closes every firing the\nfailure passed on its way out. A join
  that could not join closes its own\nfiring with `diverged …` instead, as described
  above, and the firings around\nit with `stuck`.\n`stall L_outer` stands under a
  firing that `--acyclic=plausible` answered\nwith the stall an earlier firing of
  the same formation kept, so a told stall\nnever reads as a fresh firing that wrote
  nothing.\n`starved 3` is where `--max-steps=3` ran out, whether or not `--partial`
  goes\non to park it. It stands in the block of the judgment and the site the\nreduction
  stood at, and where the budget ran out before that block could open,\nright in a
  firing, it is commented with them instead, `starved 3  # \U0001D53B(Φ.a\U0001F3352)`:\n\n```text\n\U0001D544(Φ.x):\n
  \ \U0001D544(Φ.x.arg):\n    \U0001D53C(L_outer):\n      \U0001D53B(Φ.a\U0001F3350):\n
  \       starved 3\n      stuck L_outer\n  \U0001D53C(L_outer):\n    \U0001D53B(Φ.a\U0001F3351):\n
  \     \U0001D53C(L_outer):\n        starved 3  # \U0001D53B(Φ.a\U0001F3352)\n    stuck
  L_outer\n```\n\nThe markup spells them `<stuck λ=\"L_outer\"/>`, `<stalled λ=\"L_outer\"/>`
  and\n`<starved limit=\"3\" by=\"dataize\" at=\"Φ.a\U0001F3352\"/>`.\n\n`timeout
  5` is where `--max-seconds=5` ran out, placed and commented the same\nway and written
  at the first step the deadline refused.\nThe run ends there, with or without `--partial`,
  so it is always the last line\nof the protocol.\nThe markup spells it `<timeout
  limit=\"5\" by=\"morph\" at=\"…\"/>`.\n\n`spent 3` is where `--max-firings=3` ran
  out, placed and commented the same\nway and written where the firing it refused
  would have started.\nThe markup spells it `<spent limit=\"3\" by=\"dataize\" at=\"…\"/>`.\n\nEvery
  term is \U0001D711 on a single line, whatever `--output` and `--flat` say about\nthe
  result of the run, so a program reading the protocol back never has to know\nwhat
  the run printed. The file is truncated at the beginning of every run, so\nit always
  holds the firings of exactly one run.\n\nThe blocks come in the order the reduction
  walks the term, and that order is\nnot what the dependencies are read from — the
  symbols are. Take a comparison\nnobody can decide, a join branching on it, and an
  `atoms.yaml` of three\nentries, the λ functions named briefly to keep the lines
  below short:\n\n```yaml\n- λ: L_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2:
  $.x\n  \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_gt\n  dataize:\n    \U0001D6FF1:
  $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B: Φ.bool( if ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else
  ↦ ∅, φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ ⟧ )\n- λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n
  \ join:\n    on: \U0001D6FF1\n    left: $.then\n    right: $.else\n```\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ cat fork.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  bool ↦ ⟦ if ↦ ∅
  ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(ρ, x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧,\n
  \ foo(x) ↦ ⟦\n    φ ↦ ξ.x.gt( 0 ).if( ξ.x.plus( 1 ).plus( ξ.x ), ξ.x.plus( 2 ).plus(
  ξ.x ) ).plus( 5 )\n  ⟧,\n  demo ↦ ⟦ a ↦ Φ.foo( Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E1 ⟧
  ) ) ⟧\n⟧\n$ phino dataize --symbolic=atoms.yaml --locator=Q.demo.a \\\n    --protocol=fork.txt
  --quiet --sweet --hide-rho fork.phi\n$ cat fork.txt\n\U0001D53B(Φ.demo.a):\n  \U0001D544(Φ.demo.a):\n
  \   \U0001D45B·0·1 := Φ.foo( x ↦ Φ.number( φ ↦ \U0001D70E1:λ ) )\n    \U0001D45B·0·2
  := Φ.number( φ ↦ \U0001D70E1:λ )\n    \U0001D45B·0·3 := \U0001D45B·0·2.gt( x ↦ 0
  )\n    \U0001D53C(L_gt):\n      \U0001D53B(Φ.a\U0001F3350):\n        \U0001D544(Φ.a\U0001F3350):\n
  \         \U0001D45B·1·1 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D6FF1·1 :=
  \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F3351):\n
  \       \U0001D544(Φ.a\U0001F3351):\n          \U0001D45B·1·2 := 0\n          \U0001D45B·1·3
  := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·1 := 00-00-00-00-00-00-00-00
  \ # 0.0\n      \U0001D6FF2·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.x)\n      \U0001D45B·1·4
  := Φ.bool( if(then, else) ↦ ⟦ λ ⤍ L_fork, φ ↦ \U0001D70E2:λ ⟧ )  # \U0001D45B\n
  \     \U0001D544(\U0001D45B·1·4):\n        \U0001D45B·1·5 := Φ.bool( if(then, else)
  ↦ ⟦ λ ⤍ L_fork, φ ↦ \U0001D70E2:λ ⟧ )\n      \U0001D45B·1·6 := \U0001D45B·1·5  #
  \U0001D544(\U0001D45B·1·4)\n    \U0001D45B·0·4 := ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦
  ∅, φ ↦ \U0001D70E2:λ ⟧( then ↦ \U0001D45B·1·1.plus( 1 ).plus( \U0001D45B·1·1 ) )\n
  \   \U0001D45B·0·5 := \U0001D45B·0·4( else ↦ \U0001D45B·1·1.plus( 2 ).plus( \U0001D45B·1·1
  ) )\n    \U0001D53C(L_fork):\n      \U0001D6FF1·2 := \U0001D53B(\U0001D70E2:λ)  #
  \U0001D53B(ξ.φ)\n      \U0001D544(Φ.a\U0001F3353):\n        \U0001D45B·2·1 := Φ.number(
  φ ↦ \U0001D70E1:λ )\n        \U0001D45B·2·2 := \U0001D45B·2·1.plus( x ↦ 1 )\n        \U0001D53C(L_plus):\n
  \         \U0001D53B(Φ.a\U0001F3354):\n            \U0001D544(Φ.a\U0001F3354):\n
  \             \U0001D45B·3·1 := Φ.number( φ ↦ \U0001D70E1:λ )\n          \U0001D6FF1·3
  := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n          \U0001D53B(Φ.a\U0001F3355):\n
  \           \U0001D544(Φ.a\U0001F3355):\n              \U0001D45B·3·2 := 1\n              \U0001D45B·3·3
  := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )\n            \U0001D6FF·3·1 := 3F-F0-00-00-00-00-00-00
  \ # 1.0\n          \U0001D6FF2·3 := \U0001D6FF·3·1  # \U0001D53B(ξ.x)\n          \U0001D45B·3·4
  := Φ.number( φ ↦ \U0001D70E3:λ )  # \U0001D45B\n          \U0001D544(\U0001D45B·3·4):\n
  \           \U0001D45B·3·5 := Φ.number( φ ↦ \U0001D70E3:λ )\n          \U0001D45B·3·6
  := \U0001D45B·3·5  # \U0001D544(\U0001D45B·3·4)\n        \U0001D45B·2·3 := \U0001D45B·3·5.plus(
  x ↦ \U0001D45B·3·1 )\n      \U0001D544(Φ.a\U0001F3356):\n        \U0001D45B·2·4
  := Φ.number( φ ↦ \U0001D70E1:λ )\n        \U0001D45B·2·5 := \U0001D45B·2·4.plus(
  x ↦ 2 )\n        \U0001D53C(L_plus):\n          \U0001D53B(Φ.a\U0001F3357):\n            \U0001D544(Φ.a\U0001F3357):\n
  \             \U0001D45B·4·1 := Φ.number( φ ↦ \U0001D70E1:λ )\n          \U0001D6FF1·4
  := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n          \U0001D53B(Φ.a\U0001F3358):\n
  \           \U0001D544(Φ.a\U0001F3358):\n              \U0001D45B·4·2 := 2\n              \U0001D45B·4·3
  := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )\n            \U0001D6FF·4·1 := 40-00-00-00-00-00-00-00
  \ # 2.0\n          \U0001D6FF2·4 := \U0001D6FF·4·1  # \U0001D53B(ξ.x)\n          \U0001D45B·4·4
  := Φ.number( φ ↦ \U0001D70E4:λ )  # \U0001D45B\n          \U0001D544(\U0001D45B·4·4):\n
  \           \U0001D45B·4·5 := Φ.number( φ ↦ \U0001D70E4:λ )\n          \U0001D45B·4·6
  := \U0001D45B·4·5  # \U0001D544(\U0001D45B·4·4)\n        \U0001D45B·2·6 := \U0001D45B·4·5.plus(
  x ↦ \U0001D45B·4·1 )\n      joined \U0001D70E5 := \U0001D6FF1·2 ? \U0001D70E3 :
  \U0001D70E4\n      \U0001D45B·2·7 := ⟦ x ↦ \U0001D45B·4·1, λ ⤍ L_plus ⟧  # \U0001D544(ξ.then),
  \U0001D544(ξ.else)\n    \U0001D53C(L_plus):\n      \U0001D53B(Φ.a\U0001F3359):\n
  \       \U0001D544(Φ.a\U0001F3359):\n          \U0001D45B·5·1 := Φ.number( φ ↦ \U0001D70E5:λ
  )\n      \U0001D6FF1·5 := \U0001D53B(\U0001D70E5:λ)  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F33510):\n
  \       \U0001D544(Φ.a\U0001F33510):\n          \U0001D45B·5·2 := Φ.number( φ ↦
  \U0001D70E1:λ )\n      \U0001D6FF2·5 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.x)\n
  \     \U0001D45B·5·3 := Φ.number( φ ↦ \U0001D70E6:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·5·3):\n
  \       \U0001D45B·5·4 := Φ.number( φ ↦ \U0001D70E6:λ )\n      \U0001D45B·5·5 :=
  \U0001D45B·5·4  # \U0001D544(\U0001D45B·5·3)\n    \U0001D45B·0·6 := \U0001D45B·5·4.plus(
  x ↦ 5 )\n  \U0001D53C(L_plus):\n    \U0001D53B(Φ.a\U0001F33511):\n      \U0001D544(Φ.a\U0001F33511):\n
  \       \U0001D45B·6·1 := Φ.number( φ ↦ \U0001D70E6:λ )\n    \U0001D6FF1·6 := \U0001D53B(\U0001D70E6:λ)
  \ # \U0001D53B(ξ.ρ)\n    \U0001D53B(Φ.a\U0001F33512):\n      \U0001D544(Φ.a\U0001F33512):\n
  \       \U0001D45B·6·2 := 5\n        \U0001D45B·6·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ
  )\n      \U0001D6FF·6·1 := 40-14-00-00-00-00-00-00  # 5.0\n    \U0001D6FF2·6 :=
  \U0001D6FF·6·1  # \U0001D53B(ξ.x)\n    \U0001D45B·6·4 := Φ.number( φ ↦ \U0001D70E7:λ
  )  # \U0001D45B\n    \U0001D544(\U0001D45B·6·4):\n      \U0001D45B·6·5 := Φ.number(
  φ ↦ \U0001D70E7:λ )\n    \U0001D45B·6·6 := \U0001D45B·6·5  # \U0001D544(\U0001D45B·6·4)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n`\U0001D70E2` is minted by the first firing and
  consumed by the join, which morphs\nboth branches where they stand in the universe,
  `\U0001D544(Φ.a\U0001F3353):` and\n`\U0001D544(Φ.a\U0001F3356):`, and each morph
  fires the `plus` its branch starts with. `\U0001D70E3` is\nminted by the `plus(
  1 )` of `then` and `\U0001D70E4` by the `plus( 2 )` of `else`, and\nnothing else
  tells the two branches apart, so the join mints `\U0001D70E5` and writes,\non the
  `joined …` line, that `\U0001D70E5` is `\U0001D70E3` where `\U0001D6FF1·2` holds
  and `\U0001D70E4`\nwhere it does not, `\U0001D6FF1·2` being the operand line that
  brought `\U0001D70E2` down. A\nreader who knows the entry knows that `\U0001D70E3`
  belongs to `then`. Nothing is\nassigned to a `\U0001D70E`, it being the name of
  a λ function, so the decision nobody\nmade stands on a line of its own. The `plus`
  both branches end in reads the\njoined symbol as `\U0001D53B(\U0001D70E5:λ)`, and
  the `plus( 5 )` after it reads `\U0001D53B(\U0001D70E6:λ)`.\n\nTwo branches that
  differ in more than their symbols do not join. Had `else`\nbeen `ξ.x.plus( 2 )`,
  its morph would come to `\U0001D45B·2·4.plus( x ↦ 2 )`, holding\na datum where `then`
  holds a symbol, and the firing of `L_fork` would end in\n`diverged \U0001D45B·2·3
  vs \U0001D45B·2·5`, naming the two branches by the lines their morphs\nwrote, since
  one term for both would make `foo` read as a program that\ncomputes a condition,
  computes both branches and then makes up a value\nneither of them has. The comment
  of that line says that the two differ at\n`.x`, the argument each branch hands to
  its last `plus`, and that the join\nnames no `otherwise`.\n\nA firing that happened
  while an operand of another was being reduced stands one\nlevel deeper, under the
  firing that asked for it. The `plus( 1 )` of `then` is\nfired while the join morphs
  that branch, so it stands inside `\U0001D53C(L_fork)`. The\n`plus` both branches
  end in reaches the join as a call \U0001D544 left unfired, and is\nfired once the
  join answered, by the morph of `Φ.demo.a`, so it stands beside\n`\U0001D53C(L_fork)`
  rather than inside it. The last `\U0001D53C(L_plus)` is the one the outer\n`\U0001D53B`
  asked for after the morph.\n\n### The protocol as XML\n\nThe name of the file decides
  which of the two formats `--protocol` writes: a\nname ending in `.xml` gets the
  same tree as markup, every other name gets the\nindented text above. There is no
  option for it, since a caller who asks for a\nfile called `atoms.xml` and gets text
  back has been told nothing useful. Here\nis the run at the top of this section again:\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml
  --protocol=atoms.xml --quiet \\\n    --sweet --hide-rho sum.phi\n$ cat atoms.xml\n<?xml
  version=\"1.0\" encoding=\"UTF-8\"?>\n<protocol>\n  <dataize at=\"Φ\">\n    <morph
  at=\"Φ\">\n      <applied meta=\"\U0001D45B·0·1\" of=\"Φ.bytes\"><datum attr=\"φ\">40-14-00-00-00-00-00-00</datum></applied>\n
  \     <applied meta=\"\U0001D45B·0·2\" by=\"morph\" at=\"Φ\" of=\"Φ.number\"><meta
  attr=\"φ\">\U0001D45B·0·1</meta></applied>\n      <applied meta=\"\U0001D45B·0·3\"
  of=\"Φ.bytes\"><datum attr=\"φ\">40-18-00-00-00-00-00-00</datum></applied>\n      <applied
  meta=\"\U0001D45B·0·4\" of=\"Φ.number\"><meta attr=\"φ\">\U0001D45B·0·3</meta></applied>\n
  \     <applied meta=\"\U0001D45B·0·5\" by=\"morph\" at=\"Φ\" of=\"\U0001D45B·0·2.plus\"><meta
  attr=\"x\">\U0001D45B·0·4</meta></applied>\n      <morphed meta=\"\U0001D45B·0·6\">\U0001D45B·0·5</morphed>\n
  \   </morph>\n    <evaluate λ=\"L_number_plus\" by=\"dataize\" at=\"Φ\">\n      <dataize
  at=\"Φ.a\U0001F3350\">\n        <morph at=\"Φ.a\U0001F3350\">\n          <applied
  meta=\"\U0001D45B·1·1\" by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.number\"><meta
  attr=\"φ\">\U0001D45B·0·1</meta></applied>\n          <morphed meta=\"\U0001D45B·1·2\">\U0001D45B·1·1</morphed>\n
  \         <applied meta=\"\U0001D45B·1·3\" by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.bytes\"><datum
  attr=\"φ\">40-14-00-00-00-00-00-00</datum></applied>\n          <morphed meta=\"\U0001D45B·1·4\">\U0001D45B·1·3</morphed>\n
  \       </morph>\n        <dataized meta=\"\U0001D6FF·1·1\" number=\"5.0\">40-14-00-00-00-00-00-00</dataized>\n
  \     </dataize>\n      <bound meta=\"\U0001D6FF1·1\">\U0001D6FF·1·1</bound>\n      <dataize
  at=\"Φ.a\U0001F3351\">\n        <morph at=\"Φ.a\U0001F3351\">\n          <applied
  meta=\"\U0001D45B·1·5\" by=\"morph\" at=\"Φ.a\U0001F3351\" of=\"Φ.number\"><meta
  attr=\"φ\">\U0001D45B·0·3</meta></applied>\n          <morphed meta=\"\U0001D45B·1·6\">\U0001D45B·1·5</morphed>\n
  \         <applied meta=\"\U0001D45B·1·7\" by=\"morph\" at=\"Φ.a\U0001F3351\" of=\"Φ.bytes\"><datum
  attr=\"φ\">40-18-00-00-00-00-00-00</datum></applied>\n          <morphed meta=\"\U0001D45B·1·8\">\U0001D45B·1·7</morphed>\n
  \       </morph>\n        <dataized meta=\"\U0001D6FF·1·2\" number=\"6.0\">40-18-00-00-00-00-00-00</dataized>\n
  \     </dataize>\n      <bound meta=\"\U0001D6FF2·1\">\U0001D6FF·1·2</bound>\n      <minted
  symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \     <applied meta=\"\U0001D45B·1·9\" of=\"Φ.number\"><symbol attr=\"φ\">\U0001D70E1</symbol></applied>\n
  \     <built meta=\"\U0001D45B·1·10\">\U0001D45B·1·9</built>\n      <morph at=\"\U0001D45B·1·10\">\n
  \       <applied meta=\"\U0001D45B·1·11\" by=\"morph\" at=\"\U0001D45B·1·10\" of=\"Φ.number\"><symbol
  attr=\"φ\">\U0001D70E1</symbol></applied>\n        <morphed meta=\"\U0001D45B·1·12\">\U0001D45B·1·11</morphed>\n
  \     </morph>\n      <answered meta=\"\U0001D45B·1·13\">\U0001D45B·1·11</answered>\n
  \   </evaluate>\n    <manufactured meta=\"\U0001D6FF·0·1\">\U0001D70E1</manufactured>\n
  \ </dataize>\n</protocol>\n```\n\n<!-- markdownlint-enable MD013 -->\n\nThe root
  is `<protocol>`, holding the run in one element, named after the\njudgment it ran
  — `<dataize>` for a \U0001D53B, `<morph>` for a \U0001D544 — with `at` naming\nthe
  term it was aimed at, which is what the text format opens with as\n`\U0001D53B(Φ)`.
  After the run the root holds `<msec>`, `<firings>`\nand `<fps>`: how long the command
  took, how many λ functions it fired, and how\nmany it fired per second. The text
  format ends with the same three as\n`msec …`, `firings …` and `fps …`.\nThe examples
  here leave them out, since the time differs from run to run.\n`<evaluate>` is one
  firing of \U0001D53C, `λ` naming the entry that answered it, `by`\nnaming the judgment
  that asked for the firing — the same word the run is named\nafter and an `<unanswered>`
  carries —\nand `at` naming the site it was fired at. The text format leaves those
  two to\nthe block the firing stands in, `\U0001D53B(Φ):`, while the markup keeps
  them on every\nelement, so a program reading it never has to track the elements
  around one.\nA nested `<dataize at=\"Φ.a\U0001F3350\">` or `<morph at=\"Φ.a\U0001F3350\">`
  is a judgment started\nat a new site, which the text format writes as `\U0001D53B(Φ.a\U0001F3350):`
  or `\U0001D544(Φ.a\U0001F3350):`,\nand `at` names that site. Whatever the judgment
  does is written inside the\nelement, so it closes where the text format drops back
  to the indentation it\nopened at, and like the text line it counts nothing and names
  no meta.\n`<dataized>` closes the `<dataize>` element with the datum the `delta`
  rule\nfound, `meta` naming it the way the text format does, and the `<bound>` after\nthe
  element holds that name in place of the data. A datum of eight bytes also\ncarries
  `number`, the double the text format writes as the comment of its line.\n`<bound>`
  is one meta the firing bound, `meta` naming it the same way the text\nformat names
  it, counter and all, and the element holding the value it took:\nthe name of the
  term where the operand was reduced with \U0001D544, the datum itself\nwhere a `dataize`
  operand came down to data. `<manufactured>` is the other\nthing a dataization may
  come to, the datum manufactured for an unknown. It\ncloses the `<dataize>` element
  the way `<dataized>` does, `meta` naming it with\nthe same counter, and holds the
  symbol of that unknown rather than the 42\nstanding for it, `\U0001D70E2` where
  the text format writes the formation `\U0001D70E2:λ`. The\n`<bound>` after the element
  holds that name, as it does after a `<dataized>`,\nwhile the text format writes
  the whole line as `\U0001D6FF1·2 := \U0001D53B(\U0001D70E2:λ)`. The name of\nthe
  element is what tells a manufactured datum from data, the way `\U0001D53B(…)` does\nin
  the text format, so a reader never looks at the text to tell the two apart.\n`<answered>`
  holds the name of the term the firing answered with, named the same\nway by its
  own `meta`, and `<built>` before it holds the name of the term the\nentry wrote,
  the one \U0001D544 made that answer of: two elements rather than two\nattributes
  of one, for the same reason `<manufactured>` is no `<dataized>`.\n`<morphed>` closes
  the `<morph>` element with the name of the term the \U0001D544 came\nto, named the
  same way by its own `meta`, so\n`<morphed meta=\"\U0001D45B·1·12\">\U0001D45B·1·11</morphed>`
  says the \U0001D544 at `\U0001D45B·1·10` came to the\nobject `\U0001D45B·1·11`.
  Only the \U0001D544 that opened the element writes one: an operand a\nrule of \U0001D544
  morphs on its way stands inside the same element and closes nothing,\nand a \U0001D544
  that was parked or cut came to nothing and writes none. Two runs of \U0001D544\nat
  one site stand in one element, the way the text format merges two blocks of\none
  heading, and each closes with its own `<morphed>`, so the last one is what\nthe
  element came to: inside `<morph at=\"Φ.a\U0001F3350\">` the first run came to the\n`Φ.number`
  of `\U0001D45B·1·1` and the second to the `Φ.bytes` of `\U0001D45B·1·3`, which holds\nthe
  datum. The text format writes no line for it.\n\n`<applied meta=\"\U0001D45B·1·11\"
  by=\"morph\" at=\"\U0001D45B·1·10\" of=\"Φ.number\">` is an object\nan application
  made, which the text format writes as `\U0001D45B·1·6 := …` in the block\n`\U0001D544(\U0001D45B·1·5):`:
  `meta` names the object, counted with the `<built>`, the\n`<morphed>` and the `<answered>`
  of the firing it stands in, `by` and `at`\nname the judgment that normalized and
  the site it stood at, and `of` names the\nobject applied. The argument stands in
  an element named after the kind of its\nvalue, here a `<symbol>`, with `name` naming
  the attribute it fills and the\ntext holding the value. An application nothing reduced
  gets an `<applied>`\ntoo, with no `by` and no `at`, right before the element that
  holds it:\n`<applied meta=\"\U0001D45B·0·1\" of=\"Φ.bytes\">` is `Φ.bytes( 40-14-…
  )`, the argument of\nthe `Φ.number` that `\U0001D45B·0·2` applies. A later element
  holding an object holds\nits name instead, so `<answered meta=\"\U0001D45B·1·13\">\U0001D45B·1·11</answered>`
  says the\nfiring answered with it and `<morph at=\"\U0001D45B·1·10\">` that \U0001D544
  got into what the\nentry built.\n\nThe markup is for a program, which never has
  to parse a term of \U0001D711-calculus to\nread it. Every value the markup holds,
  in an attribute or as the text of an\nelement, is one of a few kinds: a symbol such
  as `\U0001D70E1`, a datum such as\n`40-14-00-00-00-00-00-00`, a meta such as `\U0001D45B·0·2`
  or `\U0001D6FF·1·1`, a path of\nattribute names off `Φ`, `ξ`, `ρ` or a meta, such
  as `\U0001D45B·0·2.plus`, a name such\nas `tail` or `L_fork`, or `⊥`. Inside `<applied>`,
  `<formed>` and `<with>`, the\nelement holding a value is named after its kind, so
  a reader never looks at the\ntext to tell a symbol from a meta: `<symbol>`, `<datum>`,
  `<meta>`, `<ref>` for\na path, and the empty `<bottom attr=\"x\"/>` for `⊥`. A term
  of any other kind is\nnamed by an element of its own, written before the first element
  that holds\nit, and is its meta from then on: an application by an `<applied>`,
  and a\nformation by a `<formed>`. A formation that copies an object of the world,\nbinding
  its `φ` to `\U0001D70E196`, is\n`<formed meta=\"\U0001D45B·3·9\" of=\"Φ.string\"><symbol
  attr=\"φ\">\U0001D70E196</symbol>`: `of`\nnames the object by its path, and every
  element inside is an attribute the\ncopy binds to a value other than the one the
  object has. A copy that binds\nnothing new is named by its path alone. A formation
  that copies no object of\nthe world has no `of` and holds all its bindings: an element
  for each bound\nattribute, named after the kind of its value, a `<void attr=\"x\"/>`
  for each\nvoid one, and its `λ` or `Δ`, if it has one, as an attribute of the element,\nsuch
  as `<formed meta=\"\U0001D45B·1·1\" λ=\"L_fork\">`. A term\nthe markup can name
  in none of these ways, such as an argument of a deferred\ncall that nothing worked
  out, is an expression meta, `\U0001D4521`: the same term gets\nthe same `\U0001D452`
  throughout the file and another term gets another, so a reader can\ntell two holes
  apart, while what the term is stays in the text format alone.\nSince the markup
  names terms the text format writes out, the two count their\nmetas each on their
  own: `\U0001D45B·1·11` of the markup above is `\U0001D45B·1·6` of the\ntext.\n\nA
  join writes `<joined symbol=\"\U0001D70E5\" on=\"\U0001D6FF1·2\" left=\"\U0001D70E3\"
  right=\"\U0001D70E4\"/>`,\none element per fresh symbol, which the text format writes
  as\n`joined \U0001D70E5 := \U0001D6FF1·2 ? \U0001D70E3 : \U0001D70E4`: the fresh
  symbol stands in `symbol`, the\nmeta of the condition in `on`, named the way `<bound>`
  names it, and the two\nit stands for in `left` and `right`. The two `<morph>` elements
  before it are\nthe sides being morphed where they stand in the universe. Two sides
  that do\nnot join write\n`<diverged left=\"\U0001D45B·2·3\" right=\"\U0001D45B·2·6\"
  at=\".x\" reason=\"the join names no otherwise\"/>`\nin its place, which the text
  format writes as\n`diverged \U0001D45B·2·3 vs \U0001D45B·2·5  # they differ at .x,
  and the join names no otherwise`,\nnaming each side the way the markup names any
  other value. `at` holds the\npath where the two sides differ, left out when they
  differ as a whole, and\n`reason` says why the join made no formation of them.\n\n`<symbolized
  symbol=\"\U0001D70E4\" number=\"1.0\">3F-F0-00-00-00-00-00-00</symbolized>` is\none
  symbol a `symbolize` line minted, which the text format writes as\n`symbolized \U0001D70E4
  := 3F-F0-00-00-00-00-00-00  # 1.0`: the fresh symbol stands in\n`symbol` and the
  datum it stands for is the text, with the double of eight\nbytes in `number`, as
  in `<dataized>`. The elements stand ahead of the\n`<bound>` of the line, and the
  markup binds the meta of that line as it binds\nany other.\n\n`<minted symbol=\"\U0001D70E1\">40-14-…
  40-18-…</minted>` is one symbol the firing\nminted, one element per bare `\U0001D70E`
  the entry wrote its answer with, standing\ninside the block ahead of the `<built>`
  carrying them. The symbol stands in\n`symbol` and the text is what is known about
  it: the values the `dataize`\nlines of the entry took, in the order the entry declares
  them, each spelled as\nits own line spells it — the bytes for a datum, `\U0001D70E1`
  for a symbol — and\nseparated by a space. With the `λ` of the block the element
  reads as the fact\n`\U0001D53B(\U0001D70E1:λ) == L_number_plus(40-14-…, 40-18-…)`,
  and a firing of an entry with\nno `dataize` line writes `<minted symbol=\"\U0001D70E1\"/>`.
  The symbol is also the edge\na reader joins on: a later `<manufactured meta=\"\U0001D6FF·5·1\">\U0001D70E2</manufactured>`
  names\nthe symbol the firing that wrote `<minted symbol=\"\U0001D70E2\">` handed
  out. A firing\nminting two symbols writes two elements and one minting none writes
  none,\nwhich no attribute on the answer could say: a term may carry several symbols,\nor
  carry one where the value it stands for is not a symbol at all. In the join\nabove,
  `\U0001D53C(L_gt)` writes `<minted symbol=\"\U0001D70E2\">` although `\U0001D70E2`
  sits under `if`\nand not where the value of the term is, while `\U0001D53C(L_fork)`
  writes none at all,\nsince the one symbol it mints is written as `<joined>`.\n\nA
  λ name no entry answers is `<unanswered λ=\"…\">`, standing where its\n`<evaluate>`
  would have stood with the name of the formation \U0001D53C was fired\nagainst as
  its text, such as `\U0001D45B·1·11.nope` below, and the judgment that asked\nin
  its `by` attribute, where the text format writes the letter of it. A firing\nthat
  happened while an operand of another was being reduced is an `<evaluate>`\ninside
  the one that asked, which is what the deeper indentation means in the\ntext. Elements
  are written as the run goes and\nthe open ones are closed when it ends, so a run
  that fails still leaves a\nwell-formed document behind:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml --protocol=atoms.xml
  --quiet \\\n    --sweet --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers
  the λ function 'L_number_nope'\n$ cat atoms.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<protocol>\n
  \ <dataize at=\"Φ\">\n    <morph at=\"Φ\">\n      <applied meta=\"\U0001D45B·0·1\"
  of=\"Φ.bytes\"><datum attr=\"φ\">40-14-00-00-00-00-00-00</datum></applied>\n      <applied
  meta=\"\U0001D45B·0·2\" by=\"morph\" at=\"Φ\" of=\"Φ.number\"><meta attr=\"φ\">\U0001D45B·0·1</meta></applied>\n
  \     <applied meta=\"\U0001D45B·0·3\" of=\"Φ.bytes\"><datum attr=\"φ\">40-18-00-00-00-00-00-00</datum></applied>\n
  \     <applied meta=\"\U0001D45B·0·4\" of=\"Φ.number\"><meta attr=\"φ\">\U0001D45B·0·3</meta></applied>\n
  \     <applied meta=\"\U0001D45B·0·5\" by=\"morph\" at=\"Φ\" of=\"\U0001D45B·0·2.plus\"><meta
  attr=\"x\">\U0001D45B·0·4</meta></applied>\n      <evaluate λ=\"L_number_plus\"
  by=\"morph\" at=\"Φ\">\n        <dataize at=\"Φ.a\U0001F3350\">\n          <morph
  at=\"Φ.a\U0001F3350\">\n            <applied meta=\"\U0001D45B·1·1\" by=\"morph\"
  at=\"Φ.a\U0001F3350\" of=\"Φ.number\"><meta attr=\"φ\">\U0001D45B·0·1</meta></applied>\n
  \           <morphed meta=\"\U0001D45B·1·2\">\U0001D45B·1·1</morphed>\n            <applied
  meta=\"\U0001D45B·1·3\" by=\"morph\" at=\"Φ.a\U0001F3350\" of=\"Φ.bytes\"><datum
  attr=\"φ\">40-14-00-00-00-00-00-00</datum></applied>\n            <morphed meta=\"\U0001D45B·1·4\">\U0001D45B·1·3</morphed>\n
  \         </morph>\n          <dataized meta=\"\U0001D6FF·1·1\" number=\"5.0\">40-14-00-00-00-00-00-00</dataized>\n
  \       </dataize>\n        <bound meta=\"\U0001D6FF1·1\">\U0001D6FF·1·1</bound>\n
  \       <dataize at=\"Φ.a\U0001F3351\">\n          <morph at=\"Φ.a\U0001F3351\">\n
  \           <applied meta=\"\U0001D45B·1·5\" by=\"morph\" at=\"Φ.a\U0001F3351\"
  of=\"Φ.number\"><meta attr=\"φ\">\U0001D45B·0·3</meta></applied>\n            <morphed
  meta=\"\U0001D45B·1·6\">\U0001D45B·1·5</morphed>\n            <applied meta=\"\U0001D45B·1·7\"
  by=\"morph\" at=\"Φ.a\U0001F3351\" of=\"Φ.bytes\"><datum attr=\"φ\">40-18-00-00-00-00-00-00</datum></applied>\n
  \           <morphed meta=\"\U0001D45B·1·8\">\U0001D45B·1·7</morphed>\n          </morph>\n
  \         <dataized meta=\"\U0001D6FF·1·2\" number=\"6.0\">40-18-00-00-00-00-00-00</dataized>\n
  \       </dataize>\n        <bound meta=\"\U0001D6FF2·1\">\U0001D6FF·1·2</bound>\n
  \       <minted symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \       <applied meta=\"\U0001D45B·1·9\" of=\"Φ.number\"><symbol attr=\"φ\">\U0001D70E1</symbol></applied>\n
  \       <built meta=\"\U0001D45B·1·10\">\U0001D45B·1·9</built>\n        <morph at=\"\U0001D45B·1·10\">\n
  \         <applied meta=\"\U0001D45B·1·11\" by=\"morph\" at=\"\U0001D45B·1·10\"
  of=\"Φ.number\"><symbol attr=\"φ\">\U0001D70E1</symbol></applied>\n          <morphed
  meta=\"\U0001D45B·1·12\">\U0001D45B·1·11</morphed>\n        </morph>\n        <answered
  meta=\"\U0001D45B·1·13\">\U0001D45B·1·11</answered>\n      </evaluate>\n      <morphed
  meta=\"\U0001D45B·0·6\">\U0001D45B·1·11.nope</morphed>\n    </morph>\n    <unanswered
  λ=\"L_number_nope\" by=\"dataize\">\U0001D45B·1·11.nope</unanswered>\n  </dataize>\n</protocol>\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n### Abridging the protocol\n\nA formation carrying
  a whole object is written flat on one line, so a real\nrun fills the protocol with
  lines tens of thousands of characters long. The\n`--abridged` option shortens every
  term the text protocol writes: a formation\nlonger than sixty-four characters keeps
  its `φ`, `Δ` and `λ` bindings and folds\nthe rest into a count. The markup writes
  no terms, only their names, so the\noption leaves it as it is. The width is a value
  of the option,\n`--abridged=120`, for a run that can read longer lines. The result
  the run\nprints stays whole, and the option is refused without `--protocol`.\nEvery
  byte string the protocol writes stays whole too, since a reader may need\nthe data
  a firing came down to:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ cat
  wide.phi\n⟦\n  t ↦ ⟦\n    φ ↦ ⟦ Δ ⤍ 48-65-6C-6C-6F-2C-20-77-6F-72-6C-64 ⟧,\n    left
  ↦ ξ.right,\n    right ↦ ξ.left,\n    middle ↦ ξ.left\n  ⟧\n⟧\n$ phino dataize --locator=Q.t
  --protocol=wide.txt --abridged --quiet \\\n    --sweet --hide-rho wide.phi\n$ cat
  wide.txt\n\U0001D53B(Φ.t):\n  \U0001D6FF·0·1 := 48-65-6C-6C-6F-2C-20-77-6F-72-6C-64\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nThe `--abridged-data` option cuts the data too:
  a byte string longer than eight\nbytes keeps its first two bytes and its last two,
  with the count of the bytes\ncut out between them. A formation folded into a count
  loses its data either\nway, and the option is refused without `--abridged`:\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize --locator=Q.t --protocol=wide.txt
  --abridged \\\n    --abridged-data --quiet --sweet --hide-rho wide.phi\n$ cat wide.txt\n\U0001D53B(Φ.t):\n
  \ \U0001D6FF·0·1 := 48-65-..(8b)..-6C-64\n```\n\n<!-- markdownlint-enable MD013
  -->\n\n### Reducing a term inside a universe\n\nA term that is no part of the program
  may still be reduced against it, with the\n`--inside` option: the expression it
  names is bound to a synthetic attribute\nprepended to the input expression, which
  the run takes as the universe Φ,\nnormalized there and then reduced.\n\n```bash\n$
  cat universe.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ
  ⤍ L_number_plus ⟧ ⟧\n⟧\n$ phino dataize --symbolic=atoms.yaml --inside='5.plus(
  6 )' universe.phi\n40-45-00-00-00-00-00-00\n```\n\nThis is the very trick `phino`
  plays internally to reduce the operands of a\nfiring, made available to whoever
  asks it to reduce a term the program does not\nhold. The option cannot be combined
  with `--locator`, since it aims the run at\nthe binding it mints itself. Both `dataize`
  and `morph` take `--symbolic` and\n`--inside`.\n\n### Partial evaluation\n\nA λ
  function no entry of the `--symbolic` file answers fails the run. This is\nwhat
  happens when an operation is deliberately left out — an input the object\nmodel
  has not declared yet, or an operation whose answer is not known. With\n`--partial`,
  dataization becomes partial evaluation instead: what the known\ninputs decide is
  computed, the rest survives as the residual program, which is\nprinted in place
  of the bytes, and the run ends successfully:\n\n```bash\n$ cat partial.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦ ⟦ λ ⤍ L_number_as_bool
  ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --sweet --hide-rho partial.phi\n[ERROR]: No entry of --symbolic answers the λ function
  'L_number_as_bool'\n$ phino dataize --symbolic=atoms.yaml --partial --sweet --hide-rho
  partial.phi\nL_number_as_bool:λ\n```\n\nHere `2.times( 3 ).plus( 4 )` was answered
  by the entries the file carries, so\nit was reduced — the symbol it came to sits
  in the hidden `ρ` of the residual\nprogram — while `as-bool` names a λ function
  no entry answers, so it stays in\nplace as a normal-form subterm. A stuck site opens
  no block in the\n`--protocol` file, since nothing fired there, and stands in it
  as\n`unanswered …`:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize
  --symbolic=atoms.yaml --partial --protocol=atoms.txt --quiet \\\n    --sweet --hide-rho
  partial.phi\n$ cat atoms.txt\n\U0001D53B(Φ):\n  \U0001D544(Φ):\n    \U0001D45B·0·1
  := 2\n    \U0001D45B·0·2 := \U0001D45B·0·1.times( x ↦ 3 )\n    \U0001D53C(L_number_times):\n
  \     \U0001D53B(Φ.a\U0001F3350):\n        \U0001D544(Φ.a\U0001F3350):\n          \U0001D45B·1·1
  := 2\n          \U0001D45B·1·2 := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·1
  := 40-00-00-00-00-00-00-00  # 2.0\n      \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n
  \     \U0001D53B(Φ.a\U0001F3351):\n        \U0001D544(Φ.a\U0001F3351):\n          \U0001D45B·1·3
  := 3\n          \U0001D45B·1·4 := Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·2
  := 40-08-00-00-00-00-00-00  # 3.0\n      \U0001D6FF2·1 := \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n
  \     \U0001D45B·1·5 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·1·5):\n
  \       \U0001D45B·1·6 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D45B·1·7 :=
  \U0001D45B·1·6  # \U0001D544(\U0001D45B·1·5)\n    \U0001D45B·0·3 := \U0001D45B·1·6.plus(
  x ↦ 4 )\n    \U0001D53C(L_number_plus):\n      \U0001D53B(Φ.a\U0001F3352):\n        \U0001D544(Φ.a\U0001F3352):\n
  \         \U0001D45B·2·1 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D6FF1·2 :=
  \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F3353):\n
  \       \U0001D544(Φ.a\U0001F3353):\n          \U0001D45B·2·2 := 4\n          \U0001D45B·2·3
  := Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ )\n        \U0001D6FF·2·1 := 40-10-00-00-00-00-00-00
  \ # 4.0\n      \U0001D6FF2·2 := \U0001D6FF·2·1  # \U0001D53B(ξ.x)\n      \U0001D45B·2·4
  := Φ.number( φ ↦ \U0001D70E2:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·2·4):\n
  \       \U0001D45B·2·5 := Φ.number( φ ↦ \U0001D70E2:λ )\n      \U0001D45B·2·6 :=
  \U0001D45B·2·5  # \U0001D544(\U0001D45B·2·4)\n  unanswered L_number_as_bool  # \U0001D53B(L_number_as_bool:λ)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nEvaluation stays demand-driven, as the calculus
  prescribes: an argument\nthat nothing asked for before the run got stuck is left
  as it is in the\nresidual program, for the next iteration.\n\nAn operand of a firing
  that reaches the terminator `⊥`, or a term no\ndataization rule matches, such as
  a formation whose `φ` is a void nothing\nfilled, never comes down to data either,
  and `--partial` parks that firing\nthe same way, writing the dead end into the protocol
  as `unanswered ⊥` with the\nterm that could not be dataized beside it. Dataization
  aimed at `⊥` itself still\nfails, with or without `--partial`, since there is no
  firing to park.\n\nThe nested morphing and dataization recursion is bounded by the\n`--max-steps`
  option (default `1000`): when the budget is exhausted, the run\nfails with `Dataization
  did not finish before reaching the limit of steps`.\nThis guards against non-terminating
  terms, which used to loop forever before\nthe bound was introduced:\n\n```bash\n$
  phino dataize --max-steps=50 problem.phi\n[ERROR]: Dataization did not finish before
  reaching the limit of steps: --max-steps=50\n```\n\nThat budget bounds how deep
  one branch goes, not how much the whole run does.\nAn entry that reduces two operands,
  each firing it again, doubles its work at\nevery level, so twenty levels stay far
  inside `--max-steps` and still fire a\nmillion times. The `--max-firings` option
  counts every λ function the run\nfires and fails the run once the count is spent;
  `--partial` parks it instead,\nthe way it parks a spent `--max-steps`. There is
  no limit unless the option is\ngiven:\n\n```bash\n$ cat split.yaml\n- λ: L_split\n
  \ morph:\n    \U0001D45B1: Φ.s.foo\n    \U0001D45B2: Φ.s.foo\n  \U0001D45B: ⟦ l
  ↦ \U0001D45B1, r ↦ \U0001D45B2 ⟧\n$ cat split.phi\n⟦ s ↦ ⟦ λ ⤍ L_split ⟧, x ↦ Φ.s.foo
  ⟧\n$ phino morph --symbolic=split.yaml --locator=Q.x --max-firings=64 split.phi\n[ERROR]:
  Evaluation did not finish before reaching the limit of firings: --max-firings=64\n```\n\nBoth
  budgets count work, so a run inside both of them may still take longer\nthan its
  caller can wait, and a caller that kills it gets a protocol nobody\nclosed. The
  `--max-seconds` option stops the run by the clock instead: once\nthat many seconds
  have passed since the command started, the next step the\nrun is about to take,
  whether it fires a λ function or not, fails it with\n`Evaluation did not finish
  before reaching the limit of seconds`, and so does\na check of `--acyclic` that
  is still comparing formations by then.\n`--partial` does not park it, since a run
  out of time has no site to park and\nnothing left to go on with. The protocol is
  closed as usual and its last line\nsays where the time ran out. There is no limit
  unless the option is given.\nHere a step budget of a hundred thousand lets the recursion
  of `split.phi`\nrun longer than five seconds:\n\n```bash\n$ phino morph --symbolic=split.yaml
  --locator=Q.x --partial \\\n    --max-steps=100000 --max-seconds=5 --protocol=split.txt
  --sweet --flat \\\n    split.phi\n[ERROR]: Evaluation did not finish before reaching
  the limit of seconds: --max-seconds=5\n$ grep -o 'timeout.*' split.txt\ntimeout
  5\n```\n\n## Morph\n\nDataization insists on bytes. Morphing \U0001D544 asks a different
  question: evaluate\nas far as the object model allows, without demanding data. It
  resolves Φ\nagainst the universe, peels dispatches and applications through\nnormalization,
  fires whichever λ functions sit under a dispatch, and stops at\nthe first formation
  it reaches, handing that formation back untouched. The\n`morph` command runs \U0001D544
  on its own:\n\n```bash\n$ cat two.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦
  ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n  φ ↦ 5.plus( 6 ).plus( 7 )\n⟧\n$ phino
  dataize --symbolic=atoms.yaml --sweet --hide-rho two.phi\n40-45-00-00-00-00-00-00\n$
  phino morph --symbolic=atoms.yaml --locator=Q.φ --sweet --hide-rho two.phi\n⟦ x
  ↦ 7, λ ⤍ L_number_plus ⟧\n```\n\nThe inner `5.plus( 6 )` fires, because `.plus`
  is dispatched on its result,\nand the symbol it answered with lands in the `ρ` hidden
  by `--hide-rho`. The\nouter application is saturated but bare, so \U0001D544 returns
  it and is finished;\nfiring it is dataization's job and takes `dataize` on to a
  datum.\n\nThe default locator `Q` morphs the whole top formation, which \U0001D544
  returns\nunchanged, so `--locator` is how one aims \U0001D544 at a subterm, exactly
  as in\n`dataize`. Unlike \U0001D53B, \U0001D544 is total: where no formation is
  reachable the answer\nis the terminator `⊥`, printed rather than reported as a failed
  run:\n\n```bash\n$ phino morph --locator=Q.x <<< '⟦ x ↦ ξ ⟧'\n⊥\n```\n\n\U0001D544
  maps normal forms to formations and `morph` does not normalize what it is\ngiven,
  so a term that is not a normal form, such as a dispatch off a formation\nwith neither
  `φ` nor `λ`, is reported as a failed run rather than answered:\n\n```bash\n$ phino
  morph --locator=Q.t <<< '⟦ t ↦ ⟦ x ↦ ⟦⟧ ⟧.x ⟧'\n[ERROR]: Morphing expects a normal
  form, but no morphing rule matches: ⟦⟧:x.x\n```\n\nThe whole `dataize` option surface
  applies unchanged — `--symbolic`,\n`--inside`, `--sequence`, `--headers`, `--steps-dir`,
  `--protocol`,\n`--partial`, `--max-steps`, `--shuffle`/`--seed`, `--output`, `--focus`
  and the\nrest.\n\n### Acyclic morphing\n\nWhether a program terminates is the object
  model's business, not the\ncalculus's, so phino prevents no recursion of its own
  and `--max-steps` is what\nends a run that never finishes. An entry answering with
  a firing of itself\ntherefore spends the whole budget before it fails, and what
  it fails on is the\nlimit rather than the loop:\n\n```bash\n$ cat loop.yaml\n- λ:
  L_loop\n  \U0001D45B: ⟦ λ ⤍ L_loop ⟧\n$ cat loop.phi\n⟦ x ↦ ⟦ λ ⤍ L_loop ⟧.foo ⟧\n$
  phino morph --symbolic=loop.yaml --locator='Q.x' --max-steps=40 loop.phi\n[ERROR]:
  Dataization did not finish before reaching the limit of steps: --max-steps=40\n```\n\nThe
  `--acyclic=<mode>` option makes a reduction notice. Every frame of \U0001D544 and\nof
  \U0001D53B remembers the formations the frames above it have entered, and only four\nplaces
  enter one: `fire` of \U0001D53B, `ml` of \U0001D544 and an `evaluate` line of an
  entry,\nwhich fire the λ function of a formation, and `box` of \U0001D53B, which
  gets into the\n`φ` body of a formation carrying no λ and no `Δ`. A frame about to
  enter a\nformation one of the frames above it has already entered is asking a question\nonly
  ever answered by asking it again, so the option stops there and parks the\nsite
  the way `--partial` parks a λ function that cannot fire: the answer is the\nterm
  the spine had reached, left where it stood, and the command exits\nsuccessfully.\n\n```bash\n$
  phino morph --symbolic=loop.yaml --locator='Q.x' --acyclic=proven \\\n    --max-steps=40
  --hide-rho loop.phi\n⟦ λ ⤍ L_loop ⟧.foo\n```\n\n\U0001D544 and \U0001D53B share
  that one memory. They call each other on the very term they\nwere asked about, and
  that handover is no loop, but it enters no formation\neither, so it is never remembered
  and never mistaken for one. A body\ndispatching the object it stands in is a loop
  \U0001D53B walks round on its own — \U0001D544\nstops at a formation every round,
  and `box` gets into it again — so `dataize`\ntakes the option too, and so does the
  run of \U0001D53B a λ function's `dataize` operand\nis brought down with:\n\n```bash\n$
  cat cyc.phi\n⟦ cyc ↦ ⟦ x ↦ ∅, φ ↦ Φ.cyc( ξ.x ) ⟧, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n$ phino dataize
  --locator='Q.t' --acyclic=proven --partial \\\n    --sweet --hide-rho --flat cyc.phi\n⟦
  cyc(x) ↦ Φ.cyc( x ):φ, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n```\n\n\U0001D53B insists on bytes and
  a parked term carries none, so under `dataize` the option\nwants `--partial` to
  have something to print: the residual program, exactly the\none it prints for a
  λ function that cannot fire. Without it the run stops on\nthe loop all the same,
  naming the formation it entered again instead of running\nthe budget down. Under
  `morph` nothing is asked for: \U0001D544 always has a term to\nanswer with, and
  a loop \U0001D53B meets under a firing parks the site the firing\nstands at.\n\nThe
  mode says what \"the same formation\" means, and there is no default, since\nno
  answer is right for every run. Under `proven` it means the same up to a\nrenaming
  of symbols: two\nformations are one where some one-to-one pairing of the symbols
  of the first\nwith those of the second makes them equal, so `\U0001D70E5` may stand
  where `\U0001D70E3` stood\nas long as it does so everywhere and no other symbol
  stands there too. Data,\nattribute names and λ names must still match exactly. That
  is what catches a\nrecursion over an unknown, which never repeats a term: every
  round mints fresh\nsymbols, so the formation it enters on the second round is the
  one it entered\non the first with new names for the unknowns. The renaming is sound
  because a\nsymbol is an opaque value nobody worked out — every one of them dataizes
  to the\nsame manufactured datum and no entry of `--symbolic` answers one — so a\nformation
  entered again with nothing but its symbols renamed replays the round\nit is inside
  forever. Data still tells rounds apart: a formation entered with\n`n ↦ 3` and then
  with `n ↦ 2` is two formations, so a recursion over data is\nnot cut while it goes
  on computing. Take an entry that answers a call of its\nown object over a fresh
  symbol, so every round fires the same λ function over\nan unknown it has never seen:\n\n```bash\n$
  cat down.yaml\n- λ: L_down\n  dataize:\n    \U0001D6FF1: $.x\n  \U0001D45B: Φ.down(
  x ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n$ cat down.phi\n⟦\n  down ↦ ⟦ x ↦ ∅, λ ⤍ L_down ⟧,\n  y
  ↦ Φ.down( x ↦ ⟦ λ ⤍ \U0001D70E1 ⟧ ).φ\n⟧\n$ phino morph --symbolic=down.yaml --locator=Q.y
  --acyclic=proven \\\n    --protocol=down.txt --sweet --hide-rho down.phi\n⟦ x ↦
  \U0001D70E1:λ, λ ⤍ L_down ⟧.φ\n$ cat down.txt\n\U0001D544(Φ.y):\n  \U0001D45B·0·1
  := Φ.down( x ↦ \U0001D70E1:λ )\n  \U0001D53C(L_down):\n    \U0001D6FF1·1 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.x)\n    \U0001D45B·1·1 := Φ.down( x ↦ \U0001D70E2:λ )  # \U0001D45B\n
  \   \U0001D544(\U0001D45B·1·1):\n      \U0001D45B·1·2 := Φ.down( x ↦ \U0001D70E2:λ
  )\n    \U0001D45B·1·3 := \U0001D45B·1·2  # \U0001D544(\U0001D45B·1·1)\n  looped
  \U0001D45B·0·1  # proven\n```\n\nThe first round fires `down` with `x ↦ \U0001D70E1`
  and answers it with `x ↦ \U0001D70E2`, and\nthe `φ` dispatched off that answer would
  fire it again: the formation the first\nround entered, `\U0001D70E2` standing where
  `\U0001D70E1` stood, so the firing is cut before it\nopens. The cut is the `looped
  …` line, standing where the block of the cut\nfiring would have stood: the block
  it stands in names the judgment the frame\nbelonged to and the site it was cut at,
  and the comment names the mode that\ncut it. What it carries is the formation the
  frame above entered, named by the\nline that made it, `\U0001D45B·0·1`, so the two
  are paired by their terms and no reader\nhas to rename symbols by eye or find the
  cut in the residue. Nothing runs under\na cut, so no block opens under the line.
  In the XML protocol it is\n`<looped by=\"morph\" match=\"proven\" at=\"Φ.y\" of=\"\U0001D45B·0·1\"/>`,
  with the site, the\nmode and the name of the formation as attributes. Without the
  option\nthe same run nests one round inside another until `--max-steps` runs out.\n\nWhat
  a frame remembers is the branch from the run down to it, never everything\nthe run
  has touched, so two siblings entering one formation enter it twice and\nonly a formation
  entered from inside itself is a loop. The cut costs one lookup\nand fires on the
  turn the repeat appears, so raising `--max-steps` from 40 to a\nmillion changes
  neither the answer nor the time.\n\nWhat `proven` cannot see is a recursion that
  never comes back to the same\nformation: one whose arguments grow by a wrapper every
  round. Take a factorial\nwith an accumulator it builds a `pair` onto, with `facta.yaml`
  answering\n`L_zero` and `L_dec` with a fresh symbol each and `L_if` joining on its\ncondition.
  Under `proven` the morph of every `right` fires the `if` inside it,\nnesting one
  level deeper than the last until `--max-steps` runs out, since no\nrenaming of symbols
  turns a longer chain of pairs into a shorter one. Under\n`plausible` it is cut on
  the first round:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ cat facta.phi\n⟦\n
  \ if ↦ ⟦ c ↦ ∅, left ↦ ∅, right ↦ ∅, λ ⤍ L_if ⟧,\n  zero ↦ ⟦ x ↦ ∅, λ ⤍ L_zero ⟧,\n
  \ dec ↦ ⟦ x ↦ ∅, λ ⤍ L_dec ⟧,\n  box ↦ ⟦ v ↦ ∅, φ ↦ ξ.v ⟧,\n  pair ↦ ⟦ head ↦ ∅,
  tail ↦ ∅, φ ↦ ξ.head ⟧,\n  fact ↦ ⟦ n ↦ ∅, acc ↦ ∅, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ ξ.n
  ), left ↦ ξ.acc, right ↦ Φ.fact( n ↦ Φ.dec( x ↦ ξ.n ), acc ↦ Φ.pair( head ↦ ξ.n,
  tail ↦ ξ.acc ) ).φ ).φ ⟧,\n  x ↦ Φ.fact( n ↦ ⟦ λ ⤍ \U0001D70E1 ⟧, acc ↦ Φ.box( v
  ↦ ⟦ Δ ⤍ 00- ⟧ ) ).φ\n⟧\n$ cat facta.yaml\n- λ: L_zero\n  dataize:\n    \U0001D6FF1:
  $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_dec\n  dataize:\n    \U0001D6FF1:
  $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_if\n  dataize:\n    \U0001D6FF1: $.c\n
  \ join:\n    on: \U0001D6FF1\n    left: $.left\n    right: $.right\n$ phino morph
  --acyclic=plausible --partial --sweet --hide-rho --flat \\\n    --symbolic=facta.yaml
  --locator='Q.x' --protocol=facta.txt facta.phi\nΦ.if( c ↦ Φ.zero( x ↦ \U0001D70E1:λ
  ), left ↦ Φ.box( v ↦ 00-:Δ ), right ↦ Φ.fact( n ↦ Φ.dec( x ↦ \U0001D70E1:λ ), acc
  ↦ Φ.pair( head ↦ \U0001D70E1:λ, tail ↦ Φ.box( v ↦ 00-:Δ ) ) ).φ ).φ\n$ grep 'looped\\|diverged'
  facta.txt\n      looped \U0001D45B·0·5  # plausible\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\nUnder `plausible` the same formation means one the formation entered
  earlier\nis embedded in: the two have the same attributes, data and λ function at
  the\ntop, and every term the earlier one bound there is found again in the later\none,
  as it stands or somewhere below a wrapper it gained. Any symbol stands for\nany
  other, and nothing is looked for under a `ρ`, which holds the object a term\ncame
  from rather than a term it grew into. The first `if` morphs both of its\nsides before
  it joins them, and its `right` holds a second `if`, which holds\nthe first under
  one more `pair` and one more `dec`, so that morph is cut, and\nits `looped …` line
  says `plausible`. A side cut that way gets the firing of\nthe first `if` stuck before
  it joins anything, so no `diverged …` line is\nwritten, and the cut parks the `if`
  where it stands. A call\nnested in its own operand, such as a sum of sums, is never
  cut, since the\ninner call is smaller than the outer one and cannot hold it.\nThe
  mode is not sound, though: a recursion whose argument grows on its way to\nstopping
  is cut too, which is why the line names the mode that made the cut.\n\nThe mode
  also fires every formation once. Every use of a binding copies the\nterm bound to
  it, so a program reading `truncated ↦ ρ.abs.floor` in five\nplaces fires `abs` and
  `floor` five times over and mints five symbols for one\nvalue, and a guard written
  that way spends its whole budget saying the same\nthing again. \U0001D53C is a function
  of the formation it fires: the entry that\nanswers is found by the λ name the formation
  carries, every operand is\nreduced from its bindings inside the one universe of
  the run, and the answer\nis built from what they came down to. So a run under `plausible`
  keeps what\nevery firing answered, by the formation it fired, and a later firing
  of the\nsame formation takes that answer, with the very symbols the first one minted,\ninstead
  of making it again. Two arguments spelling one term then come to one\nsymbol, here
  through an entry `L_pair` that fires both with `evaluate` lines:\n\n```bash\n$ cat
  twins.yaml\n- λ: L_number_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2:
  $.x\n  \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_pair\n  morph:\n    \U0001D45B1:
  $.a\n    \U0001D45B2: $.b\n  evaluate:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4:
  \U0001D45B2\n  \U0001D45B: ⟦ φ ↦ ⟦ a ↦ \U0001D45B3, b ↦ \U0001D45B4 ⟧ ⟧\n$ cat twins.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n
  \ pair ↦ ⟦ a ↦ ∅, b ↦ ∅, λ ⤍ L_pair ⟧,\n  t ↦ Φ.pair( 7.plus( 5.plus( 6 ) ), 7.plus(
  5.plus( 6 ) ) ).φ\n⟧\n$ phino morph --symbolic=twins.yaml --acyclic=plausible --locator=Q.t
  \\\n    --sweet --hide-rho twins.phi\n⟦\n  a ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ
  ⟧,\n  b ↦ ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ ⟧\n⟧\n```\n\nUnder `proven`
  `b` lands on `\U0001D70E4`, since its `evaluate` line fires the outer sum\nand the
  inner one once more. The protocol of the run above holds three firings\nof `L_number_plus`,
  two for `a` and one for `b`, since it records where \U0001D53C was\nasked and what
  it answered there; the one for `b` carries the answer lines of\nthe outer one for
  `a` and no operand line, since nothing was reduced for it,\nand it is not charged
  to `--max-firings`, which counts the firings the run\nmade. A join answered that
  way writes no `joined` line, since no line of its\nown binds the condition and the
  first firing already said what every symbol\nit minted stands for.\nThe formation
  is compared with everything it carries, `ρ` included, so\na firing on another object
  is another firing, yet it may take the same answer\nall the same: the run keeps
  every answer by the λ name and what the operands\ncame down to as well, and a firing
  whose operands come down to the data, the\nsymbols and the normal forms of one already
  answered takes that answer once\nthey are down, minting nothing. An attribute read
  from the `φ` of an object\nand then reached as a binding of it is read through two
  `ξ`, each the object\nminus the attribute being read, so it is two formations, but
  one firing, and\nso one symbol. A symbol counts as the symbol it is, not as the
  datum every\nsymbol manufactures, so two firings over two symbols stay two. The
  protocol\nwrites such a firing with its operand lines and the answer lines of the
  one\nit took the answer from, and `--max-firings` charges it like a firing made,\nsince
  a firing is charged as it starts bringing its operands down, which is\nthe only
  place a recursion widening inside its operands can be cut. A firing\ncut by the
  mode on its way to an answer keeps the cut, and the next firing of\nthe same formation
  is cut at its own site without reducing anything first. A\nfiring that got stuck
  keeps the λ function it got stuck on, and the next\nfiring of the same formation
  gets stuck at its own site the same way, with\nnothing reduced under it, as long
  as nothing new was answered in between.\nOnce something was, the formation is fired
  again, since an operand that could\nnot be brought down the first time may come
  down now.\n\nThe `--max-loops=<n>` option makes either mode more patient. A frame
  is cut\nonly once more than `n` of the formations the frames above it entered are
  the\nsame as the one it is about to enter, so a recursion that stops within `n`\nrounds
  is never cut, and one that goes on is cut `n` rounds later. The default\nis `0`,
  which cuts on the first repeat. The option needs `--acyclic`, since\nnothing else
  cuts a loop. Here the second `f` holds `Φ.start`, which the first\n`f` is bound
  to, under a `Φ.stop`, so `plausible` cuts it, even though `stop`\nanswers data at
  once:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ cat once.phi\n⟦\n  f
  ↦ ⟦ x ↦ ∅, φ ↦ ξ.x.again ⟧,\n  start ↦ ⟦ again ↦ Φ.f( x ↦ Φ.stop( v ↦ Φ.start )
  ) ⟧,\n  stop ↦ ⟦ v ↦ ∅, again ↦ ⟦ Δ ⤍ 01- ⟧ ⟧,\n  t ↦ Φ.f( x ↦ Φ.start )\n⟧\n$ phino
  dataize --locator=Q.t --acyclic=plausible once.phi\n[ERROR]: Reduction entered a
  formation it is already inside: ⟦ x ↦ Φ.stop( v ↦ Φ.start ), φ ↦ x.again ⟧\n$ phino
  dataize --locator=Q.t --acyclic=plausible --max-loops=1 once.phi\n01-\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n## Rewrite\n\nYou can rewrite this expression with
  the help of [rules](#rule-structure)\ndefined in the `my-rule.yml` YAML file (here,
  the `!d1` and `!B1` are capturing\ngroups, similar to regular expressions):\n\n```yaml\nname:
  My custom rule\npattern: ⟦ Δ ⤍ !d1, !B1 ⟧\nresult: ⟦ Δ ⤍ 62-79-65, !B1 ⟧\n```\n\nThen,
  rewrite:\n\n```bash\n$ phino rewrite --rule=my-rule.yml hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65
  ⟧, t ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\nIf you want to use many rules, just use `--rule` as
  many times as you need:\n\n```bash\nphino rewrite --rule=rule1.yaml --rule=rule2.yaml
  ...\n```\n\nYou can also use [built-in rules](resources), which are designed\nto
  normalize expressions:\n\n```bash\nphino rewrite --normalize hello.phi\n```\n\nBoth
  flags may be combined, so that your own rules are applied\nalongside the built-in
  ones, in a single rewriting session:\n\n```bash\nphino rewrite --normalize --rule=my-rule.yaml
  hello.phi\n```\n\nSome rules mint fresh synthetic names via the `random-string`
  built-in. To\nkeep the output reproducible across runs, `phino` seeds the random
  generator\ndeterministically with `0` by default. Use `--seed` to pick a different
  seed:\n\n```bash\nphino rewrite --seed=42 --rule=my-rule.yml hello.phi\n```\n\nIf
  no input file is provided, the \U0001D711-expression is taken from `stdin`:\n\n```bash\n$
  echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino rewrite --rule=my-rule.yml\n⟦ φ ↦
  ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass [`XMIR`][xmir] as input. Use `--input=xmir`
  and `phino`\nwill parse given `XMIR` from file or `stdin` and convert it to `phi`
  AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml --input=xmir file.xmir\n```\n\nAlso
  `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout( α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍
  68-65-6C-6C-6F ⟧ ) ) )\n⟧\n```\n\nThe two styles may be mixed in one expression,
  so `[[ x -> ∅ ]]` reads the\nsame as `⟦ x ↦ ∅ ⟧`. The `--monoform` option forbids
  that: the first symbol\nthat has two spellings picks the style of the whole expression,
  and a later\nsymbol of the other style is an error. Under `--monoform`, `[[ x ->
  ∅ ]]`\nfails, since `∅` at 1:9 mixes with the ASCII `[[` at 1:1. The option is\naccepted
  by `rewrite`, `dataize`, `morph`, `merge` and `match`.\n\nA formation of a single
  binding may be written as its asset, a colon,\nand the attribute the asset is bound
  to:\n\n```text\n⟦ Δ ⤍ FF-AA ⟧    = FF-AA:Δ    = FF-AA:D\n⟦ λ ⤍ \U0001D70E1 ⟧       =
  \U0001D70E1:λ       = !S1:L\n⟦ a ↦ ∅ ⟧        = ∅:a        = ?:a\n⟦ φ ↦ ξ.a ⟧      =
  ξ.a:φ      = $.a:@\n```\n\nThe colon binds as tightly as a dot, so `ξ.a:φ.b` is
  `⟦ φ ↦ ξ.a ⟧.b`.\nWith `--sweet`, `phino` prints every such formation this way,
  so\n`⟦ x ↦ ⟦ φ ↦ ξ.a ⟧ ⟧` comes out as `a:φ:x` and `⟦ x(a) ↦ ⟦ φ ↦ a ⟧ ⟧`\nas `⟦
  x(a) ↦ a:φ ⟧`: the formation inline voids open takes the sugar,\nwhile the one holding
  the voids keeps its brackets, and so does\nevery formation in the salty syntax and
  in [LaTeX][latex].\n\nA formation has a receiver `ρ` only when it declares one among
  its voids, the\nway EO declares `^`: `⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧`, or `a(ρ) ↦ ⟦ t ↦ ξ.ρ.k
  ⟧` with\nthe void inline. `phino` adds none of its own, and a dispatch into a formation\nthat
  declares none hands it no `ρ` (the `skip` rule), so `ξ.ρ` there is `⊥`:\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ echo '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍ 01- ⟧, a ↦
  ⟦ ρ ↦ ∅, t ↦ ξ.ρ.k ⟧ ⟧.a.t ⟧' | phino rewrite --normalize --sweet\n01-:Δ:x\n$ echo
  '⟦ x ↦ ⟦ k ↦ ⟦ Δ ⤍ 01- ⟧, b ↦ ⟦ t ↦ ξ.ρ.k ⟧ ⟧.b.t ⟧' | phino rewrite --normalize
  --sweet\n⊥:x\n```\n\n<!-- markdownlint-enable MD013 -->\n\n## Merge\n\nYou can merge
  several \U0001D711-expressions into a single one by merging their\ntop level formations:\n\n```bash\n$
  cat bytes.phi\n⟦ bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n  number ↦ ⟦\n    φ ↦
  ∅,\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦ number ↦ ⟦ minus(x)
  ↦ ⟦ λ ⤍ L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi minus.phi --sweet\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ, minus(x) ↦ L_number_minus:λ
  ⟧\n⟧\n```\n\n## Match\n\nYou can test the \U0001D711-expression matches against
  the [rule](#rule-structure)\npattern. The result output contains matched substitutions:\n\n```bash\n$
  phino match --pattern='⟦ Δ ⤍ !d, !B ⟧' hello.phi\nB >> ⟦⟧\nd >> 68-65-6C-6C-6F\n```\n\n##
  Compile\n\nBy default, `phino` reads its rules from YAML and interprets them at
  every\nstep. The `compile` command turns the rules into Haskell instead. Then a\nsecond
  build of `phino` runs them as plain functions:\n\n```bash\nphino compile\ncabal
  build all\n```\n\nThe command writes the module `compiled/generated/Compiled.hs`,
  which git\nignores. It compiles the built-in rules of normalization, the\ncontextualization
  function \U0001D49E, and every file you pass with `--rule`. The\n`--target` option
  writes the module somewhere else.\n\nA build links the module in only when the Cabal
  flag `compiled` is on. If\nthere is no `cabal.project.local`, `compile` creates
  one that turns the flag\non. If the file already exists, `compile` leaves it alone
  and prints the two\nlines to add to it:\n\n```text\npackage phino\n  flags: +compiled\n```\n\nThe
  compiled rules take exactly the same steps as the YAML ones, so the\noutput and
  every `--sequence` stay the same. A few things are still read from\nYAML at runtime:\n\n*
  the rules of morphing (\U0001D544) and dataization (\U0001D53B);\n* a `--rule` file
  that changed after `compile`;\n* the pattern of `match` and the `rewrite:` blocks
  of the `--symbolic` file.\n\nThe `explain` command also reads the rules from YAML.\n\n`compile`
  refuses a rule it cannot turn into Haskell and names the reason.\nFor example, it
  refuses a rule with `having`, a `where` function other than\n`contextualize` or
  `named`, or the conditions `matches` and `part-of`.\n\nA binary built this way refuses
  to run if the built-in rules changed after\nthe last `compile`, since it would run
  rules nobody wrote. Run `compile`\nagain and rebuild. To test the whole suite against
  the compiled rules, run:\n\n```bash\nmake compiled\n```\n\n## Explain\n\nYou can
  _explain_ the built-in rules by printing them in [LaTeX][latex]\nformat. Pass exactly
  one of `--normalize`, `--morph`, `--dataize` or\n`--contextualize` for the rewriting,
  morphing (\U0001D544), dataization (\U0001D53B) or\ncontextualization (\U0001D49E)
  rules (or `--rule` for a custom rule file):\n\n```bash\n$ phino explain --normalize\n\\begin{tabular}{rl}\n\\phinoNormalizationRule{alpha}\n
  \ { [[ B_1, \\tau -> ?, B_2 ]] ( \\phiTerminal{\\alpha_{i}} -> e ) }\n  { [[ B_1,
  \\tau -> ?, B_2 ]] ( \\tau -> e ) }\n  { $ i = \\vert \\overline{ B_1 } \\vert $
  }\n  { }\n\\phinoNormalizationRule{dc}\n  { T ( \\tau -> e ) }\n  { T }\n  { }\n
  \ { }\n...\n\\phinoNormalizationRule{stop}\n  { [[ B ]] . \\tau }\n  { T }\n  {
  $ [ \\tau \\char44{} @ \\char44{} L ] \\cap B = \\emptyset $ }\n  { }\n\\end{tabular}\n```\n\nThe
  morphing and dataization rules are printed the same way:\n\n```bash\n$ phino explain
  --morph\n\\begin{tabular}{rl}\n\\phinoMorphingRule{mf}\n  { \\mathbb{M}( [[ B ]],
  e ) }\n  { [[ B ]] }\n  { }\n  { }\n...\n\\phinoMorphingRule{universe}\n  { \\mathbb{M}(
  Q, e ) }\n  { \\mathbb{M}( \\phinoNormalize{ e }, e ) }\n  { $ e \\not= Q $ }\n
  \ { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --dataize\n\\begin{tabular}{rl}\n\\phinoDataizationRule{delta}\n
  \ { \\phinoDataize{ [[ B_1, D> \\delta_0, B_2 ]] } }\n  { \\delta_0 }\n  { }\n  {
  }\n...\n\\phinoDataizationRule{norm}\n  { \\phinoDataize{ n } }\n  { \\phinoDataize{
  \\mathbb{M}( n, e ) } }\n  { }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain
  --contextualize\n\\begin{phinoContextualizationInference}\n  \\phinoName{cxi}\n
  \ \\phinoConclusion{ \\phinoContextualize{ \\phiTerminal{\\xi} }{ k }{ k } }\n\\end{phinoContextualizationInference}\n...\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cd}\n  \\phinoPremise{ \\phinoContextualize{ n }{ k }{ n_1 } }\n  \\phinoConclusion{
  \\phinoContextualize{ n . \\tau }{ k }{ n_1 . \\tau } }\n\\end{phinoContextualizationInference}\n```\n\nFor
  more details, use `phino [COMMAND] --help` option.\n\n## Rule structure\n\nThis
  is BNF-like yaml rule structure. Here types ended with\napostrophe, like `Attribute'`
  are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # returns True if every given attribute exists in\n      - Attribute'
  | [Attribute'] # the union of the given bindings\n      - Binding' | [Binding']\n
  \ | nf: Expression'      # returns True if given expression in normal form\n                         #
  which means that no more other normalization rules\n                         # can
  be applied\n  | absolute: Expression' # returns True if given expression is xi-free,
  i.e.\n                         # there is no ξ outside of a formation: it is Φ,
  a\n                         # formation, a dispatch with a xi-free subject, or an\n
  \                        # application with a xi-free subject and argument.\n                         #
  Combined with a normal-form check by the '\U0001D458'/'!k'\n                         #
  meta variable, which ranges over the absolute\n                         # expressions
  \U0001D4A6 ⊆ \U0001D4A9, used by the Rcopy rule.\n  | matches:             # returns
  True if given expression after dataization\n      - String           # matches to
  given regex\n      - Expression\n  | part-of:             # returns True if given
  expression is attached to any\n      - Expression'      # attribute in ginve bindings\n
  \     - BiMeta'\n  | formation:           # returns True if given expression is
  a formation\n      Expression'        # (an abstraction ⟦…⟧); used by morphing 'md'\n
  \                        # as 'not (formation \U0001D45B)', so a non-formation head
  is\n                         # morphed and a formation head is left to 'ml'\n  |
  gt:                  # returns True if the first comparable object is\n      - Comparable
  \      # greater than the second one\n      - Comparable\n  | disjoint:            #
  returns True if none of the given attributes exists\n      - [Attribute']     #
  in the given bindings\n      - Binding'\n\nComparable:              # comparable
  object that may be used in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:
  \                 # comparable number\n  = Integer              # just regular integer\n
  \ | IndexMeta'           # \U0001D456 (or !i), the index captured by an α\U0001D456
  argument\n  | length: BiMeta'      # calculate length of bindings by given meta
  binding\n  | domain: BiMeta'      # calculate number of unique attributes in given\n
  \                        # meta binding (excluding 'assets')\n\nExtension:               #
  substitutions extension used to introduce new meta variables\n  meta: [ExtArgument]
  \   # new introduced meta variable\n  function: String       # name of the function\n
  \ args: [ExtArgument]    # arguments of the function\n\nExtArgument\n  = Bytes'
  \              # !d\n  | Binding'             # !B\n  | Expression'          # !e\n
  \ | Attribute'           # !t\n```\n\nHere's list of functions that are supported
  for extensions:\n\n* `contextualize` - function of two arguments, that rewrites
  given expression\n  depending on provided context according to the contextualization\n
  \ [rules](assets/contextualize.jpg)\n* `random-tau` - creates an attribute with
  a random unique name. It accepts no\n  arguments; uniqueness is guaranteed across
  all names already taken in the\n  document.\n* `dataize` - dataizes given expression
  and returns bytes.\n* `concat` - accepts bytes or dataizable expressions as arguments,\n
  \ concatenates them into single sequence and convert it to expression\n  that can
  be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦ Δ ⤍ !d ⟧)`.\n*
  `sed` - pattern replacer, works like unix `sed` function.\n  Accepts two arguments:
  target expression and pattern.\n  Pattern must start with `s/`, consists of three
  parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces all
  the spaces with empty string. To escape braces and slashes\n  in pattern and replacement
  parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string` -
  accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `\U0001D6FF` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n* `!S` || `\U0001D70E`
  - a symbol standing where a λ name stands (see\n                [Symbols](#symbols)).
  It is spelled the way a meta variable is\n                spelled but is a name
  and no capture: `\U0001D70E1` is one concrete\n                symbol, which no
  substitution ever binds, and a bare `\U0001D70E` in the\n                answer
  of a `--symbolic` entry asks for a fresh one\n\nA meta variable carries a suffix,
  like `!B1` or `\U0001D70F2`, to name what it\ncaptured, so that the `result`, `when`,
  `where` and `having` of a rule can\nread it back. An index starts with one: a suffix
  of `0`, as in `!B0` or\n`\U0001D70F0`, is refused where it is written, because it
  is a first index spelled\nwrong and no name. A positional argument keeps counting
  from zero, though,\nsince `α0` is an index of the calculus and no meta variable.\n\nWritten
  bare, with no suffix at all, a meta variable is anonymous: it matches\nwhatever
  term stands in its place, every occurrence on its own, and binds no\nname. Two anonymous
  metas of one kind are therefore two different captures,\nwhich is what lets a pattern
  ask for any two attributes without inventing\nnames for them:\n\n```yaml\nname:
  two-attributes\npattern: '⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧'\nresult:
  '⟦ x ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧'\n```\n\nSpelled with suffixes, that pattern would read `⟦
  \U0001D70F1 ↦ \U0001D4521, \U0001D70F2 ↦ \U0001D4522 ⟧` and\nname four captures
  the result never mentions, while `⟦ \U0001D70F1 ↦ \U0001D4521, \U0001D70F1 ↦ \U0001D4521
  ⟧`\nwould be rejected as a duplicated attribute.\n\nNothing can refer to an anonymous
  meta, since it has no name to be referred to\nby. Writing one outside a `pattern`
  (or the `match`, `universe` and `c-match` of\nan inference rule) is a mistake in
  the rule and is reported as the rule loads.\n\nA positional (α) application argument
  is written as `α0`, `~0` (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured
  by an `!i`/`\U0001D456` meta variable.\n\nIncorrect usage of meta variables in \U0001D711-expression
  patterns leads to\nparsing errors.\n\n## Benchmark\n\nTo run performance benchmarks,
  you need [Java 8+][java] and [curl][curl].\nMaven is downloaded automatically on
  first run via `benchmark/mvnw`.\n\nThe benchmark uses the compiled [`Native`][jna-native]
  class from\n[JNA][jna] — a large real-world Java class — as its test input.\nOn
  first run, `make bench` downloads the class, disassembles it to\n[XMIR][xmir] via
  [jeo-maven-plugin][jeo], converts it to \U0001D711 using\n`phino rewrite`, and caches
  the results in `benchmark/tmp/`.\nSubsequent runs skip straight to the benchmarks.\n\nBesides
  parsing, printing and rewriting that class, the suite morphs\nsymbolically. `benchmark/demo.phi`
  is a small world whose entries name the λ\nfunctions of `benchmark/atoms.yaml`,
  and each entry is a case of its own, so\nthat a slowdown of one of them is a line
  of the report rather than a share of\na single total. The smallest entry — one λ
  function fired against one unknown\n— is timed twice, over the demo world alone
  and over the same world merged\ninto the class, and the two numbers say between
  them what the world around an\nentry costs (see [#1291][issue-1291]).\n\nA case
  whose single run is measured in seconds gets fewer warmups and fewer\nbatches than
  a case measured in microseconds, since the whole suite runs\ninside one job; the
  report says how many of each a case was given.\n\n```bash\nmake bench\n```\n\n<!--
  benchmark_begin -->\n\n```text\n=== parse/phi ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      2384353.897 μs\n  avg:        238435.390 μs\n
  \ min:        215363.988 μs\n  max:        278245.089 μs\n  std dev:    23622.956
  μs\n=== parse/xmir ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     9841499.835 μs\n  avg:        984149.984 μs\n  min:        914833.083 μs\n
  \ max:        1089305.395 μs\n  std dev:    63059.625 μs\n=== rewrite/normalize
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      21.060 μs\n
  \ avg:        2.106 μs\n  min:        1.743 μs\n  max:        2.835 μs\n  std dev:
  \   0.353 μs\n=== print/sweet/multiline ===\n  warmup:     3 iterations\n  batches:
  \   10 x 1\n  total:      5903216.355 μs\n  avg:        590321.635 μs\n  min:        558729.133
  μs\n  max:        647658.702 μs\n  std dev:    30079.890 μs\n=== print/sweet/flat
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      725031.333
  μs\n  avg:        72503.133 μs\n  min:        65432.404 μs\n  max:        87819.934
  μs\n  std dev:    8921.233 μs\n=== print/salty/multiline ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      19159507.382 μs\n  avg:        1915950.738 μs\n
  \ min:        1869384.073 μs\n  max:        1995426.872 μs\n  std dev:    37221.957
  μs\n=== morph/symbolic/demo/e1 ===\n  warmup:     3 iterations\n  batches:    10
  x 8\n  total:      10829.586 μs\n  avg:        135.370 μs\n  min:        128.488
  μs\n  max:        150.356 μs\n  std dev:    6.143 μs\n=== morph/symbolic/demo/e2
  ===\n  warmup:     3 iterations\n  batches:    10 x 127\n  total:      172246.803
  μs\n  avg:        135.627 μs\n  min:        132.999 μs\n  max:        140.016 μs\n
  \ std dev:    2.239 μs\n=== morph/symbolic/demo/e3 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 132\n  total:      180903.978 μs\n  avg:        137.048 μs\n
  \ min:        135.244 μs\n  max:        140.700 μs\n  std dev:    1.678 μs\n===
  morph/symbolic/demo/e4 ===\n  warmup:     3 iterations\n  batches:    10 x 122\n
  \ total:      164908.704 μs\n  avg:        135.171 μs\n  min:        132.237 μs\n
  \ max:        139.304 μs\n  std dev:    1.887 μs\n=== morph/symbolic/demo/e5 ===\n
  \ warmup:     3 iterations\n  batches:    10 x 124\n  total:      165931.498 μs\n
  \ avg:        133.816 μs\n  min:        132.648 μs\n  max:        135.746 μs\n  std
  dev:    0.863 μs\n=== morph/symbolic/native/e5 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 5\n  total:      61089.359 μs\n  avg:        1221.787 μs\n  min:
  \       1040.609 μs\n  max:        2303.375 μs\n  std dev:    370.371 μs\n=== morph/symbolic/accum/0
  ===\n  warmup:     3 iterations\n  batches:    10 x 84\n  total:      94035.149
  μs\n  avg:        111.947 μs\n  min:        110.083 μs\n  max:        113.534 μs\n
  \ std dev:    1.157 μs\n=== morph/symbolic/accum/400 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 69\n  total:      92238.501 μs\n  avg:        133.679 μs\n  min:
  \       130.178 μs\n  max:        137.564 μs\n  std dev:    2.813 μs\n```\n\nThe
  results were calculated in [this GHA job][benchmark-gha]\non 2026-10-21 at 16:09,\non
  Linux with 4 CPUs.\n\n<!-- benchmark_end -->\n\n## How to Contribute\n\nFork repository,
  make changes, then send us a [pull request][guidelines].\nWe will review your changes
  and apply them to the `master` branch shortly,\nprovided they don't violate our
  quality standards. To avoid frustration,\nbefore sending us your pull request please
  make sure all your tests pass:\n\n```bash\nmake all\n```\n\nTo generate a local
  coverage report for development, run:\n\n```bash\nmake coverage\n```\n\nTo build
  a `phino` executable into the root of the repository, run:\n\n```bash\nmake phino\n```\n\nThis
  produces an executable `phino` (or `phino.exe` on Windows) in the\nproject root,
  which you can run directly for quick local testing:\n\n```bash\n./phino --version\n```\n\nYou
  will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor [Stack ≥
  3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]: https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]:
  https://www.haskell.org/ghc/\n[guidelines]: https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]:
  https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]: https://en.wikipedia.org/wiki/LaTeX\n[java]:
  https://www.java.com/en/download/\n[curl]: https://curl.se/\n[gha]: https://docs.github.com/en/actions\n[jna]:
  https://github.com/java-native-access/jna\n[jna-native]: https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[issue-1291]: https://github.com/objectionary/phino/issues/1291\n[benchmark-gha]:
  https://github.com/objectionary/phino/actions/runs/39630420210\n"
