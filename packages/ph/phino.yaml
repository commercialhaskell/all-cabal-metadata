  \ warmup:     3 iterations\n  batches:    10 x 277\n  total:      161047.794 μs\n
  \ avg:        58.140 μs\n  min:        57.025 μs\n  max:        58.757 μs\n  std
  dev:    0.553 μs\n=== morph/symbolic/demo/e4 ===\n  warmup:     3 iterations\n  batches:
  \   10 x 271\n  total:      156357.626 μs\n  avg:        57.697 μs\n  min:        57.150
  μs\n  max:        58.248 μs\n  std dev:    0.363 μs\n=== morph/symbolic/demo/e5
  ===\n  warmup:     3 iterations\n  batches:    10 x 260\n  total:      160590.902
  μs\n  avg:        61.766 μs\n  min:        59.089 μs\n  max:        79.533 μs\n
  \ std dev:    5.932 μs\n=== morph/symbolic/native/e5 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 5\n  total:      35947.906 μs\n  avg:        718.958 μs\n  min:
  \       682.191 μs\n  max:        764.860 μs\n  std dev:    22.764 μs\n=== morph/symbolic/accum/0
  ===\n  warmup:     3 iterations\n  batches:    10 x 142\n  total:      68966.685
  μs\n  avg:        48.568 μs\n  min:        47.428 μs\n  max:        49.936 μs\n
  \ std dev:    0.778 μs\n=== morph/symbolic/accum/400 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 112\n  total:      63083.756 μs\n  avg:        56.325 μs\n  min:
  \       55.561 μs\n  max:        57.281 μs\n  std dev:    0.537 μs\n```\n\nThe results
  were calculated in [this GHA job][benchmark-gha]\non 2026-10-26 at 12:05,\non Linux
  with 4 CPUs.\n\n<!-- benchmark_end -->\n\n## How to Contribute\n\nFork repository,
  make changes, then send us a [pull request][guidelines].\nWe will review your changes
  and apply them to the `master` branch shortly,\nprovided they don't violate our
  quality standards. To avoid frustration,\nbefore sending us your pull request please
  make sure all your tests pass:\n\n```bash\nmake all\n```\n\nTo generate a local
  coverage report for development, run:\n\n```bash\nmake coverage\n```\n\nTo build
  a `phino` executable into the root of the repository, run:\n\n```bash\nmake phino\n```\n\nYou
  will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor [Stack ≥
  3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]: https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]:
  https://www.haskell.org/ghc/\n[guidelines]: https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]:
  https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]: https://en.wikipedia.org/wiki/LaTeX\n[java]:
  https://www.java.com/en/download/\n[curl]: https://curl.se/\n[gha]: https://docs.github.com/en/actions\n[jna]:
  https://github.com/java-native-access/jna\n[jna-native]: https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[benchmark-gha]: https://github.com/objectionary/phino/actions/runs/40319368788\n"
