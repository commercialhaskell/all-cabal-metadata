description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.145\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\n##
  Build\n\nTo build `phino` from source, clone this repository:\n\n```bash\ngit clone
  git@github.com:objectionary/phino.git\ncd phino\n```\n\nThen, run the following
  command (ensure you have [Cabal][cabal] installed):\n\n```bash\ncabal build all\n```\n\nNext,
  run this command to install `phino` system-wide:\n\n```bash\nsudo cp \"$(cabal list-bin
  phino)\" /usr/local/bin/phino\n```\n\nVerify that `phino` is installed correctly:\n\n```bash\n$
  phino --version\n0.0.0\n```\n\nYou can ensure scripts are run with a specific version
  of `phino` using\nthe `--pin` global option. It exits with an error when the version
  supplied\ndoesn't match the installed one:\n\n```bash\nphino --pin=0.0.0.67 dataize
  hello.phi\n```\n\nThe `--pin-file` global option does the same, but reads the version
  from\na file, ignoring the whitespace around it:\n\n```bash\nphino --pin-file=version.txt
  dataize hello.phi\n```\n\n## Dataize\n\nThen, you dataize the expression:\n\n```bash\n$
  phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n### Symbolic λ functions\n\nWhich
  λ functions exist is a property of the object model being dataized, not\nof the
  calculus, so `phino` implements none of them. They come from a YAML file\ngiven
  with `--symbolic`, one entry per λ function:\n\n```yaml\n- λ: L_number_(plus|times)\n
  \ dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B: Φ.number(
  φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n```\n\nThe `λ` of an entry is the λ names it answers for,
  as a regular expression, so\nthe one above stands for `L_number_plus` and `L_number_times`.
  Under `dataize`\nstand the operands it brings down to data through \U0001D53B, each
  binding a bytes meta\n`\U0001D6FF1`, `\U0001D6FF2` and so on; under `morph` the
  operands it reduces to a normal\nform through \U0001D544, each binding an expression
  meta `\U0001D45B1`, `\U0001D45B2`. Both blocks are\nterms of the calculus, read
  against the formation being fired, so `ξ` is that\nformation and `$.x` its `x`,
  while `Φ` is the universe. Every entry numbers its\nown metas from `\U0001D6FF1`
  and `\U0001D45B1`, and the entry is what tells two `\U0001D6FF1` apart.\n\nThe term
  under `\U0001D45B` is what the firing answers with. `phino` normalizes it\nexactly
  as it normalizes anything else, so `--protocol`, `--partial` and\n`--max-steps`
  work on it unchanged. It may name any meta the entry bound,\nthose of the two blocks
  below among them.\n\n### Rewriting a term into another shape\n\nThere is a third
  block, `rewrite`, and it reduces nothing. Each line of it\ntakes a term another
  meta of the entry is already bound to, named under `of`,\napplies a list of ordinary
  rules to it, spelled with the very `pattern`,\n`result`, `when` and meta variables
  a rule file uses, and binds an expression\nmeta of its own to the outcome:\n\n```yaml\n-
  λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n
  \   \U0001D45B2: $.right\n  rewrite:\n    \U0001D45B3:\n      of: \U0001D45B1\n
  \     rules: &bool\n        - name: false-literal\n          pattern: >-\n            ⟦
  !B1, φ ↦ Φ.bool( if ↦ ⟦ ρ ↦ ∅, left ↦ ∅, right ↦ ∅,\n            φ ↦ ξ.right ⟧ ),
  !B2 ⟧\n          result: >-\n            ⟦ φ ↦ Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦
  ∅, right ↦ ∅,\n            φ ↦ ⟦ Δ ⤍ 00- ⟧ ⟧ ) ⟧\n    \U0001D45B4:\n      of: \U0001D45B2\n
  \     rules: *bool\n  \U0001D45B: \U0001D45B3\n```\n\nThe meta under `of` is one
  bound by `morph` or by a `rewrite` line above it,\nand nothing else. A rule is tried
  at every position of the term, the outermost\nfirst; the first rule whose pattern
  matches a position rewrites it, and a\nrewritten position is not walked into again,
  so a rule whose result carries\nits own pattern never loops. Nothing is normalized
  afterwards: a rewrite is a\nsubstitution the entry vouches for and not a reduction,
  exactly as an answer\nis. A rule writing a `\U0001D70E` into its result, or reading
  a meta its pattern never\nbinds, is refused where the file is read.\n\nThis is how
  a program brings two branches of a fork to one shape before they\nare compared.
  In EO a `Φ.false` is written `φ ↦ ξ.right` while a bool a firing\nanswered carries
  a symbol, and the two are one value in two spellings that\nonly the program knows
  to be one. The block runs before `symbolize` on purpose:\na result may write the
  datum a literal stands for, as `⟦ Δ ⤍ 00- ⟧` above, and\nthat datum is then stood
  into a known symbol the join can pair.\n\n### Standing data into unknowns\n\nThere
  is a fourth block, `symbolize`, and it reduces nothing. It takes a term\nanother
  meta of the entry is already bound to and binds an expression meta of\nits own to
  that same term with every datum in it standing for an unknown:\n\n```yaml\n- λ:
  L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2:
  $.right\n  symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n
  \ \U0001D45B: \U0001D45B3\n```\n\nThe right-hand side of a line names a meta bound
  by `morph`, by `rewrite` or by\na `symbolize` line above it, and nothing else; a
  term nobody reduced has no data\nto stand. Every `Δ ⤍ b` binding of that term becomes
  a `λ ⤍ \U0001D70Ek` naming a\nfresh symbol, one per occurrence, so `⟦ Δ ⤍ b ⟧` reads
  as `⟦ λ ⤍ \U0001D70Ek ⟧` and a\nliteral tuple gets several. A term carrying no datum
  passes through as it was.\n\nOnly the `φ` chain is walked. A term carries the value
  it stands for where\nthat chain ends, so a datum standing anywhere else says nothing
  about the term\nand is left alone, the whole subtree of it. What sits under `ρ`
  belongs to the\nobject around this one, and a normal form drags the universe it
  was reduced\ninside along under `ρ`, so a walk reaching into it would stand the
  data of the\nwhole program into unknowns to say one thing about one term. What sits
  under a\nmethod is code and not data: the `-1` of a `neg ↦ ⟦ φ ↦ ξ.ρ.times( -1 )
  ⟧`\nnobody has called is the body of a method, and minting a symbol for it, and
  for\nevery other literal every method of the carrier declares, would write unknowns\nnobody
  ever reads.\n\nThis is what lets an entry compare two branches of a fork. A literal
  is sugar\nfor `Φ.number( Φ.bytes( ⟦ Δ ⤍ … ⟧ ) )`, so a branch computed from a literal\nkeeps
  a datum three levels down where a branch computed from an unknown keeps\n`⟦ λ ⤍
  \U0001D70E ⟧`. A `Δ` against a `λ` is a difference in kind and not in value, and\nafter
  the stage both branches carry `⟦ λ ⤍ \U0001D70E ⟧` where they differ.\n\n### Joining
  the branches of a fork\n\nA branching λ function answers neither of its branches.
  Which one the program\ntakes is decided by a value nobody worked out, so handing
  one of them through\nwould drop the branch point from the program altogether and
  a reader would see\nthe condition computed and thrown away. `join` is the fifth
  block, and it\nreduces nothing either: it takes two metas the entry has bound already
  and\nbinds one of its own to the two terms joined into one.\n\n```yaml\n- λ: L_fork\n
  \ dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2:
  $.right\n  symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n
  \ join:\n    \U0001D45B5: [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\nA
  line names two metas bound by `morph`, by `rewrite`, by `symbolize` or by a\n`join`
  line above it, and never three: it stands for a choice between two\nbranches, and
  a walk over three terms in parallel is no such choice. The meta it\nbinds is one
  like any other, so the answer may name it alone, as above, or stand\nit inside a
  larger term.\n\n`phino` takes the two terms and requires them to match verbatim,
  with one\nexception: where `⟦ λ ⤍ \U0001D70EA ⟧` in one meets a different `⟦ λ ⤍
  \U0001D70EB ⟧` in the\nother, it mints a fresh `\U0001D70EC` and stands it there.
  The same symbol on both sides\nstays as it is, and the same pair met again further
  down gets the same fresh\nsymbol, since it is one choice however often the two terms
  differ by it; two\ndifferent pairs get two fresh symbols. Two identical terms join
  into that same\nterm and nothing is minted at all. The join keeps the type by construction,\nbeing
  the terms' own shape, so the file needs to know nothing about carriers.\n\nOnly
  the `φ` chain is compared, exactly as `symbolize` stands only that chain\ninto unknowns:
  a term carries the value it stands for where its `φ` chain ends,\nso every other
  binding is taken from the first branch, the whole subtree of it,\nand never compared
  at all. The two branches of a fork reach their normal forms\nin scopes of their
  own, so their `ρ` differ wherever the reduction left a\ntrace, and comparing them
  would refuse the join over something saying nothing\nabout either branch; a method
  is the same, its body being code nobody has\ncalled, so two branches differing inside
  one are not two values. The joined\nterm keeps the methods and the `ρ` of the first
  of the two, being of its shape,\nwhich is what lets the program go on dispatching
  on what the fork answered.\n\nA join is only ever between two expressions and a
  datum is never joined with\nanything, which is why `symbolize` runs before it: a
  known symbol, one that\nstage minted for a datum, is a symbol like any other here,
  so a literal branch\njoins with a computed one and two literal branches join too.
  Any other\ndifference — a datum against a symbol, two different data, a binding
  one term\ncarries and the other does not — is no join at all, and the firing gets
  stuck\nthe way a λ function no entry answers does, so `--partial` parks it rather
  than\naborting the run. A fork whose branches differ in structure, such as a `Φ.true`\nand
  a `Φ.false` written as `φ ↦ ξ.left` against `φ ↦ ξ.right`, is stuck, and\nbringing
  two such branches to one shape is the program's job and not `phino`'s,\nwhich its
  entry does in a `rewrite` block.\n\nA bare symbol, `⟦ λ ⤍ \U0001D70EA ⟧` with no
  carrier around it, is what the deep walk\nanswers a copy it deferred with (see Deep
  morphing below), and it joins with\na formation too. It has no `φ` chain of its
  own, only the symbol, so the join\npairs `\U0001D70EA` with the symbol the `φ` chain
  of the other term ends in, mints a\nfresh `\U0001D70EC` for that pair the usual
  way, and answers the bare `⟦ λ ⤍ \U0001D70EC ⟧`.\nThe methods of the formation are
  dropped, since the other branch may have\nnone of them. A formation whose `φ` chain
  ends in a datum, or which has no `φ`\nat all, does not join with a bare symbol.\n\nOne
  term being `⊥` is the exception, since `if. cond value ⊥` is how EO spells\n\"raise
  unless `cond`\": the program raises on that side of the condition and\nhas a perfectly
  good value on the other. The join then mints nothing, binds\nits meta to the other
  term as it stands and writes on which side the program\nraises, naming the condition
  by what the first `dataize` operand of the entry\ncame down to, as `terminate(\U0001D53B(\U0001D70E2:λ),
  right)  # \U0001D45B4` in the text format and\n`<terminate symbol=\"\U0001D70E2\"
  branch=\"right\"/>` in the markup. The deep walk fires\nsuch a fork too, since that
  `⊥` is an argument the program wrote rather than\none the reduction made.\n\nEvery
  symbol a join mints is written into the protocol as a fact of its own,\nso a reader
  ties it to the two it stands for without diffing the terms; the\nsection on `--protocol`
  below shows one.\n\n### Symbols\n\nAn entry answers, it never computes. The job
  of these functions is symbolic\nmorphing: what `5.plus( 6 )` comes to is the arithmetic
  of the object model and\nnot `phino`'s, so an entry answers a term carrying a symbol
  standing for a\nvalue nobody worked out, and the data its `dataize` operands came
  down to is\nnot its to read. An answer mentioning a `\U0001D6FF` is refused where
  the file is read.\n\n`\U0001D70E` is a meta of the calculus, beside `\U0001D45B`,
  `\U0001D6FF` and `\U0001D453`, and it stands where\na λ name stands. In a term,
  `\U0001D70E1` is a concrete symbol: a λ function nothing\nanswers, which is what
  makes the value the term carries unknown. Firing it is\ntherefore the same question
  as firing a λ name the `--symbolic` file does not\ncarry, and gets the same answer:
  \U0001D53C stops there, the protocol records the site as\n`unanswered(\U0001D70E1)`,
  and `--partial` leaves the term where it stands. Dispatching\nan attribute off a
  symbol — `⟦ λ ⤍ \U0001D70E1 ⟧.plus( 5 )` — therefore taints its own\nbinding and
  nothing else; what stands beside it still computes. In an answer, a\nbare `\U0001D70E`
  asks for a fresh one, minted as the firing happens and numbered by the\nrun, so
  no two unknowns are ever spelled alike. Minting starts after the symbols\nthe program
  already carries, so a run over the \U0001D711-program an earlier run wrote\nnever
  spells a fresh symbol like one already standing there.\n\nDataizing a symbol never
  gets stuck. It answers a fixed datum, 42\n(`40-45-00-00-00-00-00-00`), the same
  one for every symbol, so \U0001D53B always\nanswers, a `\U0001D6FF` always holds
  concrete data and no firing ever declines for the\nlack of it:\n\n```bash\n$ cat
  sum.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  φ ↦ 5.plus( 6 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho
  sum.phi\n40-45-00-00-00-00-00-00\n```\n\n### The keys of the file\n\nEach `λ` is
  a regular expression, and it must match the whole λ name, so a\nplain name such
  as `L_number_plus` means that one function and nothing else,\nwhile `L_number_.*`
  stands for every function of `number`. The keys are unique:\nnothing tells two entries
  under one key apart, so a second entry under a key is\nunreachable and the file
  is refused rather than merely redundant.\n\nA λ name no key matches has no λ function
  at all, so \U0001D53C gets stuck on it.\nWithout `--symbolic` there is no entry
  at all and every λ function gets stuck:\n\n```bash\n$ phino dataize --sweet --hide-rho
  sum.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_plus'\n```\n\nThe
  file is read before anything is parsed or reduced, so a key that is no\nregular
  expression, an operand that is no meta of the kind its block binds, or\nan answer
  the calculus cannot read fails the run up front rather than half-way\nthrough a
  derivation.\n\n### Recording what fired\n\nEvery λ function fired on the way to
  the answer may be recorded in a\nmachine-readable protocol, with the `--protocol`
  option. The protocol is a\ntree: the run at the top, one block per firing under
  it, and inside the block\nthe operands the firing bound and the term it answered
  with. A formation that\ndataization gets into opens a block too, and what fires
  inside it stands under\nit.\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho sum.phi\n$ cat atoms.txt\n\U0001D53B(Φ)\n  formation(⟦ bytes(φ) ↦ ⟦⟧,
  number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ ⟧, φ ↦ 5.plus( 6 ) ⟧)  # \U0001D53B(Φ)\n
  \   \U0001D53C(L_number_plus)  # \U0001D53B(Φ)\n      formation(⟦ φ ↦ Φ.bytes( φ
  ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3350)\n
  \       formation(40-14-00-00-00-00-00-00:Δ:φ)  # \U0001D53B(Φ.a\U0001F3350)\n      \U0001D6FF1.1
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)\n      formation(⟦ φ ↦ Φ.bytes( φ
  ↦ 40-18-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧)  # \U0001D53B(Φ.a\U0001F3351)\n
  \       formation(40-18-00-00-00-00-00-00:Δ:φ)  # \U0001D53B(Φ.a\U0001F3351)\n      \U0001D6FF2.1
  := 40-18-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n      \U0001D45B.1.1 := Φ.number(
  φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ L_number_plus:λ ⟧  # \U0001D544(\U0001D45B.1.1)\n    formation(⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ L_number_plus:λ ⟧)  # \U0001D53B(Φ)\n```\n\n<!-- markdownlint-enable MD013
  -->\n\n`\U0001D53B(…)` is the run and the term it was aimed at, `\U0001D544(…)`
  where the run is a\nmorphing, and `\U0001D53C(…)` is one firing, named by the entry
  that answered it and\ncommented with the judgment that asked for it and the site
  it was fired at.\nEvery comment of the file is of that shape: a judgment applied
  to a term, which\nis the intent the value beside it came from. The firings are numbered
  across the\nwhole run, in the order they open, so `\U0001D6FF1.2` is the value bound
  to `\U0001D6FF1` by\nthe second firing of the run, whichever λ function that was,
  `\U0001D45B1.2` the same\nfor a `morph` meta, and `\U0001D45B.3.2` the answer of
  the third firing, so\n`\U0001D45B1.2 := \U0001D45B.3.2` reads \"the `\U0001D45B1`
  of this firing is what the third firing\nanswered\". One firing binds a meta once
  and no two firings\nshare a number, so every one of these names stands on exactly
  one line of the\nfile and a line naming another one points at it and no other.\n\n`formation(…)`
  is a formation \U0001D53B got into through its `box` rule, which\ndataizes the `φ`
  of a formation carrying neither `Δ` nor `λ`. It is commented\nwith `\U0001D53B`
  and the site it was entered at, the way a firing is, and what the `φ`\nbody does
  stands one level deeper under it: the firings its dataization\ndemands, and the
  formations it gets into in turn. A reader therefore sees which\nobject a firing
  was made on the way into, rather than a flat list of firings.\nOnly `box` writes
  one, since \U0001D544 stops at a formation without getting into it\nand a formation
  whose λ is fired is already an `\U0001D53C(…)` block. The line is no\nfiring: it
  binds no meta and takes no number, so the metas of the firings under\nit are numbered
  as if it were not there. In the run above \U0001D53B gets into the\nprogram itself,
  since `Φ` binds `φ`; then into each number the entry brings\ndown, and through its
  `φ` into the bytes that number holds; and last into the\nnumber the entry answered,
  whose `φ` is the symbol `\U0001D70E1`, so nothing fires under\nthat one.\n\nAn answer
  stands on two lines and not one. A firing answers the term its entry\nwrote and
  `phino` morphs that term before standing it back into the program, so\n`\U0001D45B.1.1`
  is what the entry wrote, with the symbols this firing minted already in\nit, commented
  with `\U0001D45B` to name the key it was read from, and `\U0001D45B.1.2` is the\nnormal
  form \U0001D544 made of it, commented with `\U0001D544(\U0001D45B.1.1)` to say where
  it came from.\nIt is the same morphing every other term goes through, and writing
  only its\noutcome would have the formation of `number` appear in place of the three\ntokens
  the entry wrote with nothing saying why. Whatever that morphing fires\nopens its
  own block between the two lines, exactly where a firing an operand\ntook opens one,
  so the order the lines come in is the order the work was done\nin.\n\nWhere an operand
  came down to the datum a symbol stands for, the protocol writes\n`\U0001D53B(\U0001D70E1:λ)`
  in place of that 42 (`\U0001D70E1:λ` is the formation `⟦ λ ⤍ \U0001D70E1 ⟧`, in
  the\nsugar every sweet term is written with), so a reader sees that the value was\nmanufactured
  rather than read out of the program. A `\U0001D70E` is the name of a λ\nfunction
  and no term of its own, so \U0001D53B is applied to the formation carrying it\nand
  never to the name alone.\n\nA `symbolize` line writes a line per fresh symbol it
  minted, ahead of the line\nbinding the term that carries them, and that line is
  a fact and no assignment:\n`\U0001D53B(\U0001D70E44:λ) == 3F-F0-00-00-00-00-00-00`
  says that dataizing the formation\n`\U0001D70E44` names answers those bytes. Nothing
  binds bytes to a `\U0001D70E`, since it is\nneither a datum nor a term. A consumer
  reading the protocol back treats a\nsymbol with such a fact as a constant and every
  other symbol as an unknown.\n\nThe line binding the term of a `symbolize` one is
  commented with the meta it\nwas told to stand, `\U0001D45B3.1 := ⟦ λ ⤔ \U0001D7068
  ⟧  # \U0001D45B1`, and with no judgment\naround it: standing the data of a term
  into unknowns is the file's own\noperation and nothing of the calculus runs there,
  so the line names a meta of\nthe entry the way a `join` line names the two it joined.
  A comment carries the\nletter of a judgment exactly where a judgment made the value.\n\nThe
  site of a firing is a locator, written as a comment the way an operand\nline writes
  the term it came from, under the letter of the judgment that asked\nfor the firing:
  \U0001D53C is fired by the `ml` rule of morphing and by the `fire` rule\nof dataization,
  so `\U0001D544(Φ.demo.a.φ)` is a λ function fired while \U0001D544 was reducing\nthat
  binding and `\U0001D53B(Φ)` one fired because dataization demanded data of `Φ`.\nA
  chain such as `5.plus( 6 ).plus( 7 )` writes both: the inner call is fired\nwhile
  \U0001D544 reduces the head of the outer dispatch, the outer one because \U0001D53B
  asked\nfor the data. The site itself is where in the program the firing\nbelongs:
  the term the run was aimed at, so `Φ` for a run that was aimed at\nnothing in particular,
  and, under `--deep`, the binding the walk had entered\nwhen the λ function fired,
  since that walk reduces every part of the program\nin turn and one entry answers
  the same way wherever it is fired. A locator\nnames a binding and reaches no further,
  so a firing standing deeper inside a\nterm than that — under a dispatch, or in the
  argument of an application — is\nwritten under the last binding the walk entered,
  which is the smallest part of\nthe program a reader can aim a run of their own at.
  An operand of a firing is\nreduced bound to a synthetic attribute of the universe
  (see `--inside` below),\nso a λ function fired while it came down is written under
  that attribute and\nnot under the site of the firing that asked for it.\n\nAn operand
  line ends in the judgment that reduced it and the term it was\nreduced from, written
  as a comment after two spaces and `#`. The value alone\nsays what the meta was bound
  to and neither what it was bound from nor what\nwas done to it, so `\U0001D6FF1.1
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)` reads \"the\n`\U0001D6FF1` of this
  firing is the `ρ` of the formation brought down through \U0001D53B, and\nit came
  down to 20\", where a `morph` operand reads `\U0001D45B1.5 := \U0001D45B.3.2  #
  \U0001D544(ξ.then)`\nand says that the `then` of the formation reached its normal
  form through \U0001D544.\nWhich of the two judgments ran is the whole difference
  between a line ending\nin data and one ending in a term. It is the very term the
  entry wrote under\nthat meta, spelled the way the calculus reads it — `$` is read
  as `ξ` — so a\nreader never has to open the `--symbolic` file beside the protocol
  and match\nevery line by λ name and meta number.\n\n`unanswered(…)` is a λ name
  no entry answers, standing where the block of its\nfiring would have stood. Nothing
  fired, so nothing opens under it. The line is\ncommented with the judgment that
  asked and the formation it was asking about,\n`\U0001D544(L_none:λ)`, the way an
  operand line is commented with the term it was\nreduced from: \U0001D53C is fired
  by the `ml` rule of morphing and by the `fire` rule\nof dataization, so the letter
  says where in the reduction the site stands and\nthe term says which object the
  λ function that could not fire belongs to. It\nis written\nwhether or not `--partial`
  goes on to park the run, since the protocol records\nwhat \U0001D53C was asked for,
  and a question it could not answer belongs there as much\nas one it could — once
  per site and not once per attempt, since a site\n`--partial` parks stays in the
  residue and `--deep` walks over it again:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_nope'\n$
  cat atoms.txt\n\U0001D53B(Φ)\n  formation(⟦ bytes(φ) ↦ ⟦⟧, number(φ) ↦ ⟦ plus(x)
  ↦ L_number_plus:λ, nope ↦ L_number_nope:λ ⟧, φ ↦ 5.plus( 6 ).nope ⟧)  # \U0001D53B(Φ)\n
  \   \U0001D53C(L_number_plus)  # \U0001D544(Φ)\n      formation(⟦ φ ↦ Φ.bytes( φ
  ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ, nope ↦ L_number_nope:λ
  ⟧)  # \U0001D53B(Φ.a\U0001F3350)\n        formation(40-14-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3350)\n      \U0001D6FF1.1 := 40-14-00-00-00-00-00-00  #
  \U0001D53B(ξ.ρ)\n      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ ),
  plus(x) ↦ L_number_plus:λ, nope ↦ L_number_nope:λ ⟧)  # \U0001D53B(Φ.a\U0001F3351)\n
  \       formation(40-18-00-00-00-00-00-00:Δ:φ)  # \U0001D53B(Φ.a\U0001F3351)\n      \U0001D6FF2.1
  := 40-18-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n      \U0001D45B.1.1 := Φ.number(
  φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ L_number_plus:λ, nope ↦ L_number_nope:λ ⟧  # \U0001D544(\U0001D45B.1.1)\n
  \   unanswered(L_number_nope)  # \U0001D53B(L_number_nope:λ)\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\nThe very same file comes back with `--partial`, where the run answers
  the\nresidue instead of failing: what `phino` could not decide is a property of
  the\nprogram and not of the option that decides what to do about it.\n\nThree more
  lines say why a firing gave no answer.\n`stuck(L_outer)` is the last line of a firing
  that got stuck, naming the λ\nfunction it got stuck on, which is seldom the one
  `unanswered(…)` names: that\none is written where it was asked for, and this one
  closes every firing the\nfailure passed on its way out.\n`stall(L_outer)` stands
  under a firing that `--acyclic=plausible` answered\nwith the stall an earlier firing
  of the same formation kept, so a told stall\nnever reads as a fresh firing that
  wrote nothing.\n`starved(4)  # \U0001D53B(Φ.a\U0001F3351)` is where `--max-steps=4`
  ran out, commented with the\njudgment and the site the reduction stood at, whether
  or not `--partial` goes\non to park it:\n\n```text\n\U0001D544(Φ.x)\n  \U0001D53C(L_outer)
  \ # \U0001D544(Φ.x)\n    \U0001D53C(L_outer)  # \U0001D53B(Φ.a\U0001F3350)\n      starved(4)
  \ # \U0001D53B(Φ.a\U0001F3351)\n    stuck(L_outer)\n```\n\nThe markup spells them
  `<unfinished λ=\"L_outer\"/>`, `<stall λ=\"L_outer\"/>`\nand `<starved limit=\"4\"
  by=\"dataize\" at=\"Φ.a\U0001F3351\"/>`.\n\n`timeout(5)  # \U0001D544(…)` is where
  `--max-seconds=5` ran out, commented the same\nway and written at the first step
  the deadline refused.\nThe run ends there, with or without `--partial`, so it is
  always the last line\nof the protocol.\nThe markup spells it `<timeout limit=\"5\"
  by=\"morph\" at=\"…\"/>`.\n\n`spent(3)  # \U0001D53B(…)` is where `--max-firings=3`
  ran out, commented the same way\nand written where the firing it refused would have
  started.\nThe markup spells it `<spent limit=\"3\" by=\"dataize\" at=\"…\"/>`.\n\n`deferred(\U0001D70E2)
  := Φ.box( x ↦ \U0001D70E1:λ )  # \U0001D544(Φ.y)` is a copy the deep walk\ndeferred
  instead of entering it. The fresh symbol it answered the copy with\nstands in parentheses.
  The copy is written as a call of the object of the world\nit was made of, given
  the arguments that fill its voids, read. The comment\nnames the judgment and the
  site of the walk.\nThe object is found through the `ρ` of the copy: no `ρ` means
  `Φ`, a `ρ` that\nis a name means that name with its applications erased, and a `ρ`
  that is a\nformation means the object that formation was made of. Among the formations\ndeclared
  there, the copy was made of the one whose attributes cover its own,\nwhose voids
  it fills the most, and which shares the most bindings with it.\nWhen the world declares
  no such object, or two of them tie, the copy is\nwritten as it stood, such as `⟦
  x ↦ \U0001D70E1:λ, φ ↦ x.next ⟧`.\nThe markup spells it on one line, broken here
  for reading. The object stands\nin `of` and the arguments in `<with>`, both written
  whatever `--abridged`\nsays, and the copy as it stood stands in `<e>`, abridged
  as usual:\n\n```xml\n<deferred symbol=\"\U0001D70E2\" by=\"morph\" at=\"Φ.y\" of=\"Φ.box\">\n
  \ <with><attr name=\"x\">\U0001D70E1</attr></with>\n  <e>⟦ x ↦ \U0001D70E1:λ, φ
  ↦ x.next ⟧</e>\n</deferred>\n```\n\nEvery argument of the call is an `<attr>` of
  `<with>`. An argument that is a\nbare symbol, or a carrier of one whose `φ` leads
  to it, such as\n`Φ.number( φ ↦ \U0001D70E1:λ )` or `\U0001D70E1:λ:φ`, is spelled
  as that symbol, and any other\nargument is spelled `?`. A copy with no object of
  the world has neither `of`\nnor `<with>`, only `<e>`.\n\nEvery term is \U0001D711
  on a single line, whatever `--output` and `--flat` say about\nthe result of the
  run, so a program reading the protocol back never has to know\nwhat the run printed.
  The file is truncated at the beginning of every run, so\nit always holds the firings
  of exactly one run.\n\nThe blocks come in the order the reduction walks the term,
  and that order is\nnot what the dependencies are read from — the symbols are. Take
  a comparison\nnobody can decide, a fork branching on it, and an `atoms.yaml` of
  three\nentries, the λ functions named briefly to keep the lines below short:\n\n```yaml\n-
  λ: L_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B:
  Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_gt\n  dataize:\n    \U0001D6FF1: $.ρ\n
  \   \U0001D6FF2: $.x\n  \U0001D45B: Φ.bool( if ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦
  ∅, φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ ⟧ )\n- λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n
  \   \U0001D45B1: $.then\n    \U0001D45B2: $.else\n  join:\n    \U0001D45B3: [\U0001D45B1,
  \U0001D45B2]\n  \U0001D45B: \U0001D45B3\n```\n\n<!-- markdownlint-disable MD013
  -->\n\n```bash\n$ cat fork.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  bool ↦ ⟦ if ↦ ∅ ⟧,\n
  \ number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(ρ, x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧,\n  foo(x)
  ↦ ⟦\n    φ ↦ ξ.x.gt( 0 ).if( ξ.x.plus( ξ.x.plus( 1 ) ), ξ.x.plus( ξ.x ) ).plus(
  5 )\n  ⟧,\n  demo ↦ ⟦ a ↦ Φ.foo( Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E1 ⟧ ) ) ⟧\n⟧\n$ phino
  morph --deep --symbolic=atoms.yaml --locator=Q.demo.a \\\n    --protocol=fork.txt
  --quiet --sweet --hide-rho fork.phi\n$ cat fork.txt\n\U0001D544(Φ.demo.a)\n  \U0001D53C(L_gt)
  \ # \U0001D544(Φ.demo.a.φ)\n    formation(⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ,
  gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3350)\n    \U0001D6FF1.1 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3351)\n      formation(00-00-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3351)\n    \U0001D6FF2.1 := 00-00-00-00-00-00-00-00  #
  \U0001D53B(ξ.x)\n    \U0001D45B.1.1 := Φ.bool( if(then, else) ↦ ⟦ λ ⤍ L_fork, φ
  ↦ \U0001D70E2:λ ⟧ )  # \U0001D45B\n    \U0001D45B.1.2 := ⟦ if(then, else) ↦ ⟦ λ
  ⤍ L_fork, φ ↦ \U0001D70E2:λ ⟧ ⟧  # \U0001D544(\U0001D45B.1.1)\n  \U0001D53C(L_plus)
  \ # \U0001D544(Φ.demo.a.φ)\n    formation(⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ,
  gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3352)\n    \U0001D6FF1.2 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3353)\n      formation(3F-F0-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3353)\n    \U0001D6FF2.2 := 3F-F0-00-00-00-00-00-00  #
  \U0001D53B(ξ.x)\n    \U0001D45B.2.1 := Φ.number( φ ↦ \U0001D70E3:λ )  # \U0001D45B\n
  \   \U0001D45B.2.2 := ⟦ φ ↦ \U0001D70E3:λ, plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧
  \ # \U0001D544(\U0001D45B.2.1)\n  \U0001D53C(L_plus)  # \U0001D544(Φ.demo.a.φ)\n
  \   formation(⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3354)\n
  \   \U0001D6FF1.3 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n    formation(⟦
  φ ↦ \U0001D70E3:λ, plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3355)\n
  \   \U0001D6FF2.3 := \U0001D53B(\U0001D70E3:λ)  # \U0001D53B(ξ.x)\n    \U0001D45B.3.1
  := Φ.number( φ ↦ \U0001D70E4:λ )  # \U0001D45B\n    \U0001D45B.3.2 := ⟦ φ ↦ \U0001D70E4:λ,
  plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧  # \U0001D544(\U0001D45B.3.1)\n  \U0001D53C(L_plus)
  \ # \U0001D544(Φ.demo.a.φ)\n    formation(⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ,
  gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3356)\n    \U0001D6FF1.4 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_plus:λ, gt(x)
  ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F3357)\n    \U0001D6FF2.4 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.x)\n    \U0001D45B.4.1 := Φ.number( φ ↦ \U0001D70E5:λ )  # \U0001D45B\n
  \   \U0001D45B.4.2 := ⟦ φ ↦ \U0001D70E5:λ, plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧
  \ # \U0001D544(\U0001D45B.4.1)\n  \U0001D53C(L_fork)  # \U0001D544(Φ.demo.a.φ)\n
  \   \U0001D6FF1.5 := \U0001D53B(\U0001D70E2:λ)  # \U0001D53B(ξ.φ)\n    \U0001D45B1.5
  := \U0001D45B.3.2  # \U0001D544(ξ.then)\n    \U0001D45B2.5 := \U0001D45B.4.2  #
  \U0001D544(ξ.else)\n    \U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ),
  \U0001D53B(\U0001D70E5:λ) }\n    \U0001D45B3.5 := ⟦ φ ↦ \U0001D70E6:λ, plus(x) ↦
  L_plus:λ, gt(x) ↦ L_gt:λ ⟧  # [\U0001D45B1, \U0001D45B2]\n    \U0001D45B.5.1 :=
  \U0001D45B3.5  # \U0001D45B\n    \U0001D45B.5.2 := \U0001D45B3.5  # \U0001D544(\U0001D45B.5.1)\n
  \ \U0001D53C(L_plus)  # \U0001D544(Φ.demo.a.φ)\n    formation(⟦ φ ↦ \U0001D70E6:λ,
  plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F33511)\n    \U0001D6FF1.6
  := \U0001D53B(\U0001D70E6:λ)  # \U0001D53B(ξ.ρ)\n    formation(⟦ φ ↦ Φ.bytes( φ
  ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧)  # \U0001D53B(Φ.a\U0001F33512)\n
  \     formation(40-14-00-00-00-00-00-00:Δ:φ)  # \U0001D53B(Φ.a\U0001F33512)\n    \U0001D6FF2.6
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n    \U0001D45B.6.1 := Φ.number( φ
  ↦ \U0001D70E7:λ )  # \U0001D45B\n    \U0001D45B.6.2 := ⟦ φ ↦ \U0001D70E7:λ, plus(x)
  ↦ L_plus:λ, gt(x) ↦ L_gt:λ ⟧  # \U0001D544(\U0001D45B.6.1)\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\n`\U0001D70E3` is minted by the second firing and consumed by the third
  as\n`\U0001D53B(\U0001D70E3:λ)`, and `\U0001D70E2` by the first and consumed by
  the fork. `\U0001D70E4` and\n`\U0001D70E5` are what the two branches came to, and
  the fork consumes both: its `join`\nline makes them one term carrying `\U0001D70E6`,
  which the `plus( 5 )` standing after\nthe fork then reads as `\U0001D53B(\U0001D70E6:λ)`.
  The line\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ), \U0001D53B(\U0001D70E5:λ)
  }` is what ties the three\ntogether: dataizing the formation `\U0001D70E6` names
  answers what dataizing one of the\nother two answers. A reader who knows the entry
  knows that `\U0001D6FF1` is what decides\nbetween them and that the first of the
  two belongs to `then`. Nothing is\nassigned to a `\U0001D70E`, it being the name
  of a λ function, so the fact stands on a\nline of its own the way what a `symbolize`
  line knows does, and the line under\nit binds the meta, commented with the two metas
  it joined.\n\nWere the fork to answer one of its branches instead, the value of
  the other\nwould be minted and never consumed, and `foo` would read as a program
  that\ncomputes a condition, computes both branches and then drops the branch point.\n\nAll
  six firings stand under `Φ.demo.a.φ`, which is as near as a locator gets\nto any
  of them: the walk entered the `φ` of the formation `Φ.demo.a` morphs to,\nand everything
  under it — the dispatches of the chain, the arguments of `if` —\nstands under no
  attribute of any formation, so the binding the walk had entered\nis what the protocol
  writes them under.\n\nA firing that happened while an operand of another was being
  reduced stands one\nlevel deeper, under the firing that asked for it. Here it never
  happens,\nbecause deep morphing reduces both branches where they sit as arguments
  of\n`if`, long before the dispatch that fires the fork.\n\n### The protocol as XML\n\nThe
  name of the file decides which of the two formats `--protocol` writes: a\nname ending
  in `.xml` gets the same tree as markup, every other name gets the\nindented text
  above. There is no option for it, since a caller who asks for a\nfile called `atoms.xml`
  and gets text back has been told nothing useful. Here\nis the run at the top of
  this section again:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize
  --symbolic=atoms.yaml --protocol=atoms.xml --quiet \\\n    --sweet --hide-rho sum.phi\n$
  cat atoms.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<dataize at=\"Φ\">\n
  \ <formation at=\"Φ\" term=\"⟦ bytes(φ) ↦ ⟦⟧, number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ
  ⟧, φ ↦ 5.plus( 6 ) ⟧\">\n    <evaluate λ=\"L_number_plus\" by=\"dataize\" at=\"Φ\">\n
  \     <formation at=\"Φ.a\U0001F3350\" term=\"⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_number_plus:λ ⟧\">\n        <formation at=\"Φ.a\U0001F3350\" term=\"40-14-00-00-00-00-00-00:Δ:φ\">\n
  \       </formation>\n      </formation>\n      <bind meta=\"\U0001D6FF1.1\">40-14-00-00-00-00-00-00</bind>\n
  \     <formation at=\"Φ.a\U0001F3351\" term=\"⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_number_plus:λ ⟧\">\n        <formation at=\"Φ.a\U0001F3351\" term=\"40-18-00-00-00-00-00-00:Δ:φ\">\n
  \       </formation>\n      </formation>\n      <bind meta=\"\U0001D6FF2.1\">40-18-00-00-00-00-00-00</bind>\n
  \     <minted symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \     <built meta=\"\U0001D45B.1.1\">Φ.number( φ ↦ \U0001D70E1:λ )</built>\n      <answer
  meta=\"\U0001D45B.1.2\">⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_number_plus:λ ⟧</answer>\n
  \   </evaluate>\n    <formation at=\"Φ\" term=\"⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_number_plus:λ
  ⟧\">\n    </formation>\n  </formation>\n</dataize>\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\nThe root is the run itself, named after the judgment it ran — `<dataize>`
  for a\n\U0001D53B, `<morph>` for a \U0001D544 — with `at` naming the term it was
  aimed at, which is\nwhat the text format opens with as `\U0001D53B(Φ)`. `<evaluate>`
  is one firing of \U0001D53C, `λ`\nnaming the entry that answered it, `by` naming
  the judgment that asked for the\nfiring — the same word the root is named after
  and an `<unanswered>` carries —\nand `at` naming the site it was fired at. The text
  format writes those two as\nthe comment of its line, `\U0001D53B(Φ)`.\n`<formation
  at=\"Φ\" term=\"⟦ … ⟧\">` is a formation \U0001D53B got into through `box`,\nwhich
  the text format writes as `formation(⟦ … ⟧)  # \U0001D53B(Φ)`: `at` names the\nsite
  it was entered at and `term` holds the formation. Whatever the `φ` body\ndoes is
  written inside the element, so it closes where the text format drops\nback to the
  indentation it opened at, and like the text line it counts nothing\nand names no
  meta.\n`<bind>` is one meta the firing bound, `meta` naming it the same way the
  text\nformat names it, counter and all, and the element holding the value it took:
  a\nterm where the operand was reduced with \U0001D544, the datum itself where a
  `dataize`\noperand came down to data. `<dataize>` inside a firing is the other thing
  a\n`dataize` operand may come to, the datum manufactured for an unknown, and holds\nthe
  formation that unknown names rather than the 42 standing for it: a `\U0001D70E`
  is\nthe name of a λ function and no term of its own, so what \U0001D53B was applied
  to is\n`\U0001D70E2:λ` and never `\U0001D70E2` alone. It carries `meta` where the
  root carries\n`at`, the same difference the text format draws between `\U0001D53B(Φ)`
  at the top\nand `\U0001D6FF1.2 := \U0001D53B(…)` in a block. The name of the element
  is what tells a\nmanufactured datum from data, the way `\U0001D53B(…)` does in the
  text format, so\nnothing has to be read off the presence of an attribute. `<answer>`
  holds the\nterm the firing answered with, named the same way by its own `meta`,
  and\n`<built>` before it holds the term the entry wrote, the one \U0001D544 made
  that answer\nof: two elements rather than two attributes of one, for the same reason\n`<dataize>`
  is no `<bind>`.\n\n`<known symbol=\"\U0001D70E44\">3F-F0-00-00-00-00-00-00</known>`
  is the fact a `symbolize`\nline writes about a symbol it minted, which the text
  format writes as\n`\U0001D53B(\U0001D70E44:λ) == …`: the symbol stands in the attribute
  a reader joins\nlines on and the data dataizing its formation answers are the text
  of the\nelement. It takes `symbol` and not `meta`, since the fact is about the unknown\nand
  not about a meta the firing bound.\n\n`<joined symbol=\"\U0001D70E6\">\U0001D70E4
  \U0001D70E5</joined>` is the same kind of fact about a symbol\na `join` line minted,
  which the text format writes as\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ),
  \U0001D53B(\U0001D70E5:λ) }`: the fresh symbol stands\nin `symbol` and the two it
  was minted for are the text, in the order the line\nlisted the metas it joined.
  A line whose two terms differ at several places\nwrites one element per pair of
  symbols, and one whose terms are alike writes\nnone. The meta the line binds is
  a `<bind>` like every other meta of the\nfiring.\n\n`<minted symbol=\"\U0001D70E1\">40-14-…
  40-18-…</minted>` is one symbol the firing\nminted, one element per bare `\U0001D70E`
  the entry wrote its answer with, standing\ninside the block ahead of the `<built>`
  carrying them. The symbol stands in\n`symbol`, the way `<known>` and `<joined>`
  put theirs, and the text is what is\nknown about it: the values the `dataize` lines
  of the entry took, in the order\nthe entry declares them, each spelled as its own
  line spells it — the bytes\nfor a datum, `\U0001D70E1` for a symbol — and separated
  by a space the way `<joined>`\nlists its pair. With the `λ` of the block the element
  reads as the fact\n`\U0001D53B(\U0001D70E1:λ) == L_number_plus(40-14-…, 40-18-…)`,
  and a firing of an entry with\nno `dataize` line writes `<minted symbol=\"\U0001D70E1\"/>`.
  The symbol is also the edge\na reader joins on: a later `<dataize meta=\"\U0001D6FF1.5\">\U0001D70E2:λ</dataize>`
  names the\nsymbol the firing that wrote `<minted symbol=\"\U0001D70E2\">` handed
  out. A firing\nminting two symbols writes two elements and one minting none writes
  none,\nwhich no attribute on the answer could say: a term may carry several symbols,\nor
  carry one where the value it stands for is not a symbol at all. In the fork\nabove,
  `\U0001D53C(L_gt)` writes `<minted symbol=\"\U0001D70E2\">` although `\U0001D70E2`
  sits under `if`\nand not where the value of the term is, while `\U0001D53C(L_fork)`
  writes none at all,\nsince the symbol it answers with comes from a `join` line and
  stands in a\n`<joined>` of its own.\n\nA λ name no entry answers is `<unanswered
  λ=\"…\">`, standing where its\n`<evaluate>` would have stood with the formation
  \U0001D53C was fired against as its text\nand the judgment that asked in its `by`
  attribute, where the text format writes\nthe letter of it. A firing that happened
  while an operand of another was being\nreduced is an `<evaluate>` inside the one
  that asked, which is what the deeper\nindentation means in the text. Elements are
  written as the run goes and\nthe open ones are closed when it ends, so a run that
  fails still leaves a\nwell-formed document behind:\n\n<!-- markdownlint-disable
  MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml --protocol=atoms.xml
  --quiet \\\n    --sweet --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers
  the λ function 'L_number_nope'\n$ cat atoms.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<dataize
  at=\"Φ\">\n  <formation at=\"Φ\" term=\"⟦ bytes(φ) ↦ ⟦⟧, number(φ) ↦ ⟦ plus(x) ↦
  L_number_plus:λ, nope ↦ L_number_nope:λ ⟧, φ ↦ 5.plus( 6 ).nope ⟧\">\n    <evaluate
  λ=\"L_number_plus\" by=\"morph\" at=\"Φ\">\n      <formation at=\"Φ.a\U0001F3350\"
  term=\"⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ,
  nope ↦ L_number_nope:λ ⟧\">\n        <formation at=\"Φ.a\U0001F3350\" term=\"40-14-00-00-00-00-00-00:Δ:φ\">\n
  \       </formation>\n      </formation>\n      <bind meta=\"\U0001D6FF1.1\">40-14-00-00-00-00-00-00</bind>\n
  \     <formation at=\"Φ.a\U0001F3351\" term=\"⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_number_plus:λ, nope ↦ L_number_nope:λ ⟧\">\n        <formation at=\"Φ.a\U0001F3351\"
  term=\"40-18-00-00-00-00-00-00:Δ:φ\">\n        </formation>\n      </formation>\n
  \     <bind meta=\"\U0001D6FF2.1\">40-18-00-00-00-00-00-00</bind>\n      <minted
  symbol=\"\U0001D70E1\">40-14-00-00-00-00-00-00 40-18-00-00-00-00-00-00</minted>\n
  \     <built meta=\"\U0001D45B.1.1\">Φ.number( φ ↦ \U0001D70E1:λ )</built>\n      <answer
  meta=\"\U0001D45B.1.2\">⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_number_plus:λ, nope ↦ L_number_nope:λ
  ⟧</answer>\n    </evaluate>\n    <unanswered λ=\"L_number_nope\" by=\"dataize\">L_number_nope:λ</unanswered>\n
  \ </formation>\n</dataize>\n```\n\n<!-- markdownlint-enable MD013 -->\n\n### Abridging
  the protocol\n\nA formation carrying a whole object is written flat on one line,
  so a real\nrun fills the protocol with lines tens of thousands of characters long.
  The\n`--abridged` option shortens every term the protocol writes, in the text and\nthe
  XML alike: a formation longer than sixty-four characters keeps its `φ`,\n`Δ` and
  `λ` bindings and folds the rest into a count, and a byte string longer\nthan eight
  bytes keeps its first two bytes and its last two, with the count of\nthe bytes cut
  out between them. The width is a value of the option,\n`--abridged=120`, for a run
  that can read longer lines. The result the run\nprints stays whole, and the option
  is refused without `--protocol`:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  cat wide.phi\n⟦\n  t ↦ ⟦\n    φ ↦ ⟦ Δ ⤍ 48-65-6C-6C-6F-2C-20-77-6F-72-6C-64 ⟧,\n
  \   left ↦ ξ.right,\n    right ↦ ξ.left,\n    middle ↦ ξ.left\n  ⟧\n⟧\n$ phino dataize
  --locator=Q.t --protocol=wide.txt --abridged --quiet \\\n    --sweet --hide-rho
  wide.phi\n$ cat wide.txt\n\U0001D53B(Φ.t)\n  formation(⟦ φ ↦ 48-65-..(8b)..-6C-64:Δ,
  +3 ⟧)  # \U0001D53B(Φ.t)\n```\n\n<!-- markdownlint-enable MD013 -->\n\n### Reducing
  a term inside a universe\n\nA term that is no part of the program may still be reduced
  against it, with the\n`--inside` option: the expression it names is bound to a synthetic
  attribute\nprepended to the input expression, which the run takes as the universe
  Φ,\nnormalized there and then reduced.\n\n```bash\n$ cat universe.phi\n⟦\n  bytes
  ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧\n⟧\n$ phino
  dataize --symbolic=atoms.yaml --inside='5.plus( 6 )' universe.phi\n40-45-00-00-00-00-00-00\n```\n\nThis
  is the very trick `phino` plays internally to reduce the operands of a\nfiring,
  made available to whoever asks it to reduce a term the program does not\nhold. The
  option cannot be combined with `--locator`, since it aims the run at\nthe binding
  it mints itself. Both `dataize` and `morph` take `--symbolic` and\n`--inside`.\n\n###
  Partial evaluation\n\nA λ function no entry of the `--symbolic` file answers fails
  the run. This is\nwhat happens when an operation is deliberately left out — an input
  the object\nmodel has not declared yet, or an operation whose answer is not known.
  With\n`--partial`, dataization becomes partial evaluation instead: what the known\ninputs
  decide is computed, the rest survives as the residual program, which is\nprinted
  in place of the bytes, and the run ends successfully:\n\n```bash\n$ cat partial.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦ ⟦ λ ⤍ L_number_as_bool
  ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --sweet --hide-rho partial.phi\n[ERROR]: No entry of --symbolic answers the λ function
  'L_number_as_bool'\n$ phino dataize --symbolic=atoms.yaml --partial --sweet --hide-rho
  partial.phi\nL_number_as_bool:λ\n```\n\nHere `2.times( 3 ).plus( 4 )` was answered
  by the entries the file carries, so\nit was reduced — the symbol it came to sits
  in the hidden `ρ` of the residual\nprogram — while `as-bool` names a λ function
  no entry answers, so it stays in\nplace as a normal-form subterm. A stuck site opens
  no block in the\n`--protocol` file, since nothing fired there, and stands in it
  as\n`unanswered(…)`:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino
  dataize --symbolic=atoms.yaml --partial --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho partial.phi\n$ cat atoms.txt\n\U0001D53B(Φ)\n  formation(⟦ bytes(φ) ↦
  ⟦⟧, number(φ) ↦ ⟦ plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ, as-bool
  ↦ L_number_as_bool:λ ⟧, φ ↦ 2.times( 3 ).plus( 4 ).as-bool ⟧)  # \U0001D53B(Φ)\n
  \   \U0001D53C(L_number_times)  # \U0001D544(Φ)\n      formation(⟦ φ ↦ Φ.bytes(
  φ ↦ 40-00-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ,
  as-bool ↦ L_number_as_bool:λ ⟧)  # \U0001D53B(Φ.a\U0001F3350)\n        formation(40-00-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3350)\n      \U0001D6FF1.1 := 40-00-00-00-00-00-00-00  #
  \U0001D53B(ξ.ρ)\n      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ ),
  plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ, as-bool ↦ L_number_as_bool:λ
  ⟧)  # \U0001D53B(Φ.a\U0001F3351)\n        formation(40-08-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3351)\n      \U0001D6FF2.1 := 40-08-00-00-00-00-00-00  #
  \U0001D53B(ξ.x)\n      \U0001D45B.1.1 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n
  \     \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ L_number_plus:λ, times(x)
  ↦ L_number_times:λ, as-bool ↦ L_number_as_bool:λ ⟧  # \U0001D544(\U0001D45B.1.1)\n
  \   \U0001D53C(L_number_plus)  # \U0001D544(Φ)\n      formation(⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ, as-bool ↦ L_number_as_bool:λ
  ⟧)  # \U0001D53B(Φ.a\U0001F3352)\n      \U0001D6FF1.2 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.ρ)\n      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ
  ), plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ, as-bool ↦ L_number_as_bool:λ
  ⟧)  # \U0001D53B(Φ.a\U0001F3353)\n        formation(40-10-00-00-00-00-00-00:Δ:φ)
  \ # \U0001D53B(Φ.a\U0001F3353)\n      \U0001D6FF2.2 := 40-10-00-00-00-00-00-00  #
  \U0001D53B(ξ.x)\n      \U0001D45B.2.1 := Φ.number( φ ↦ \U0001D70E2:λ )  # \U0001D45B\n
  \     \U0001D45B.2.2 := ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ L_number_plus:λ, times(x)
  ↦ L_number_times:λ, as-bool ↦ L_number_as_bool:λ ⟧  # \U0001D544(\U0001D45B.2.1)\n
  \   unanswered(L_number_as_bool)  # \U0001D53B(L_number_as_bool:λ)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nEvaluation stays demand-driven, as the calculus
  prescribes: an argument\nthat nothing asked for before the run got stuck is left
  as it is in the\nresidual program, for the next iteration.\n\nAn operand of a firing
  that reaches the terminator `⊥`, or a term no\ndataization rule matches, such as
  a formation whose `φ` is a void nothing\nfilled, never comes down to data either,
  and `--partial` parks that firing\nthe same way, writing the dead end into the protocol
  as `unanswered(⊥)` with the\nterm that could not be dataized beside it. Dataization
  aimed at `⊥` itself still\nfails, with or without `--partial`, since there is no
  firing to park.\n\nThe nested morphing and dataization recursion is bounded by the\n`--max-steps`
  option (default `1000`): when the budget is exhausted, the run\nfails with `Dataization
  did not finish before reaching the limit of steps`.\nThis guards against non-terminating
  terms, which used to loop forever before\nthe bound was introduced:\n\n```bash\n$
  phino dataize --max-steps=50 problem.phi\n[ERROR]: Dataization did not finish before
  reaching the limit of steps: --max-steps=50\n```\n\nThat budget bounds how deep
  one branch goes, not how much the whole run does.\nAn entry that reduces two operands,
  each firing it again, doubles its work at\nevery level and still never gets deep,
  so no `--max-steps` stops it. The\n`--max-firings` option counts every λ function
  the run fires and fails the\nrun once the count is spent; `--partial` parks it instead,
  the way it parks a\nspent `--max-steps`. There is no limit unless the option is
  given:\n\n```bash\n$ cat split.yaml\n- λ: L_split\n  morph:\n    \U0001D45B1: Φ.s.foo\n
  \   \U0001D45B2: Φ.s.foo\n  \U0001D45B: ⟦ l ↦ \U0001D45B1, r ↦ \U0001D45B2 ⟧\n$
  cat split.phi\n⟦ s ↦ ⟦ λ ⤍ L_split ⟧, x ↦ Φ.s.foo ⟧\n$ phino morph --symbolic=split.yaml
  --locator=Q.x --max-firings=64 split.phi\n[ERROR]: Evaluation did not finish before
  reaching the limit of firings: --max-firings=64\n```\n\nBoth budgets count work,
  so a run inside both of them may still take longer\nthan its caller can wait, and
  a caller that kills it gets a protocol nobody\nclosed. The `--max-seconds` option
  stops the run by the clock instead: once\nthat many seconds have passed since the
  command started, the next step the\nrun is about to take, whether it fires a λ function
  or not, fails it with\n`Evaluation did not finish before reaching the limit of seconds`,
  and so does\na check of `--acyclic` that is still comparing formations by then.\n`--partial`
  does not park it, since a run out of time has no site to park and\nnothing left
  to go on with. The protocol is closed as usual and its last line\nsays where the
  time ran out. There is no limit unless the option is given:\n\n```bash\n$ phino
  morph --symbolic=split.yaml --locator=Q.x --partial --max-seconds=5 \\\n    --protocol=split.txt
  --sweet --flat split.phi\n[ERROR]: Evaluation did not finish before reaching the
  limit of seconds: --max-seconds=5\n$ grep -o 'timeout.*' split.txt\ntimeout(5)  #
  \U0001D544(Φ.a\U0001F33514250)\n```\n\n## Morph\n\nDataization insists on bytes.
  Morphing \U0001D544 asks a different question: evaluate\nas far as the object model
  allows, without demanding data. It resolves Φ\nagainst the universe, peels dispatches
  and applications through\nnormalization, fires whichever λ functions sit under a
  dispatch, and stops at\nthe first formation it reaches, handing that formation back
  untouched. The\n`morph` command runs \U0001D544 on its own:\n\n```bash\n$ cat two.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n
  \ φ ↦ 5.plus( 6 ).plus( 7 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho
  two.phi\n40-45-00-00-00-00-00-00\n$ phino morph --symbolic=atoms.yaml --locator=Q.φ
  --sweet --hide-rho two.phi\n⟦ x ↦ 7, λ ⤍ L_number_plus ⟧\n```\n\nThe inner `5.plus(
  6 )` fires, because `.plus` is dispatched on its result,\nand the symbol it answered
  with lands in the `ρ` hidden by `--hide-rho`. The\nouter application is saturated
  but bare, so \U0001D544 returns it and is finished;\nfiring it is dataization's
  job and takes `dataize` on to a datum.\n\nThe default locator `Q` morphs the whole
  top formation, which \U0001D544 returns\nunchanged, so `--locator` is how one aims
  \U0001D544 at a subterm, exactly as in\n`dataize`. Unlike \U0001D53B, \U0001D544
  is total: where no formation is reachable the answer\nis the terminator `⊥`, printed
  rather than reported as a failed run:\n\n```bash\n$ phino morph --locator=Q.x <<<
  '⟦ x ↦ ξ ⟧'\n⊥\n```\n\n\U0001D544 maps normal forms to formations and `morph` does
  not normalize what it is\ngiven, so a term that is not a normal form, such as a
  dispatch off a formation\nwith neither `φ` nor `λ`, is reported as a failed run
  rather than answered:\n\n```bash\n$ phino morph --locator=Q.t <<< '⟦ t ↦ ⟦ x ↦ ⟦⟧
  ⟧.x ⟧'\n[ERROR]: Morphing expects a normal form, but no morphing rule matches: ⟦⟧:x.x\n```\n\nThe
  whole `dataize` option surface applies unchanged — `--symbolic`,\n`--inside`, `--sequence`,
  `--headers`, `--steps-dir`, `--protocol`,\n`--partial`, `--max-steps`, `--shuffle`/`--seed`,
  `--output`, `--focus` and the\nrest.\n\n### Deep morphing\n\n\U0001D544 stops at
  the first formation it reaches and hands its bindings back as they\nwere written,
  since firing a bare λ is dataization's job, and `dataize`\nfollows the one path
  dataization demands and ends in bytes. What a program\nholds but nothing demands
  — the argument of a λ function no entry answers, for\none — is therefore reduced
  by neither. The `--deep` flag enters it:\n\n```bash\n$ cat gap.phi\n⟦\n  bytes ↦
  ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,\n  bar(x)
  ↦ ⟦ λ ⤍ L_bar ⟧,\n  demo ↦ ⟦ foo ↦ ⟦ n ↦ 3, φ ↦ Φ.bar( ξ.n.times( 5 ).times( 7 )
  ) ⟧ ⟧\n⟧\n$ phino morph --symbolic=atoms.yaml --inside='Q.demo.foo' \\\n    --sweet
  --hide-rho gap.phi\n⟦ n ↦ 3, φ ↦ Φ.bar( n.times( 5 ).times( 7 ) ) ⟧\n$ phino morph
  --deep --symbolic=atoms.yaml --inside='Q.demo.foo' \\\n    --sweet --hide-rho gap.phi\n⟦
  n ↦ 3, φ ↦ Φ.bar( ⟦ φ ↦ \U0001D70E2:λ, times(x) ↦ L_number_times:λ ⟧ ) ⟧\n```\n\nEvery
  binding of the formation is entered, recursively. \U0001D544 is asked about the\nterm
  standing there and, where it lands on a saturated formation whose λ an\nentry answers,
  that λ is fired and \U0001D544 is asked about the answer again. A term on\nwhose
  way a λ function fired is replaced by the answer of the last firing,\nmorphed: an
  entry answering `Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )` stands the formation of\n`number`
  there, the very one the same term written in the program morphs to, so\na value
  that came out of a firing and a value that was written as a literal are\none shape
  and can be compared leaf by leaf. That costs the size of the object's\nformation
  in the residual, which is the price of saying the same thing one way.\nA term nothing
  fired on stays exactly as it was written and only its own parts\nare walked, so
  `Φ.bar` keeps its name and what comes back is still the same\nprogram, reduced as
  far as the file allows. The step joins the chain under the\nname `deep`, so `--sequence`
  shows it, and `--max-steps` bounds the walk.\n\nTwo things are left alone. A λ no
  entry answers is not fired at all, so\n`--deep` stays as total as \U0001D544 itself
  and needs no `--partial`; a λ function that\ngets stuck deeper on a spine still
  fails the run, and `--partial` parks it,\nleaving that term as it was written. A
  firing the walk does make and cannot\nfinish — one whose operand never comes down
  to data, because a λ nothing\nanswers stands in it — is parked by `--partial` the
  same way: the binding it\nstood in is left as it was written, the walk enters the
  next one, and the\nprotocol shows the firing with nothing bound under it. One entry
  nothing can\nanswer therefore taints its own binding and not the whole run. A formation\nstill
  holding a void\nbinding is not fired either: the void is an argument the program
  has not given\nyet, so `times(x) ↦ L_number_times:λ` is a method waiting to be applied,\nnot
  an application waiting to be computed. Walking the whole program therefore\nfolds
  what it can and leaves the object model as it was declared:\n\n```bash\n$ phino
  morph --deep --symbolic=atoms.yaml --sweet --hide-rho gap.phi\n⟦\n  bytes(φ) ↦ ⟦⟧,\n
  \ number(φ) ↦ ⟦ times(x) ↦ L_number_times:λ ⟧,\n  bar(x) ↦ L_bar:λ,\n  demo ↦ ⟦
  n ↦ 3, φ ↦ Φ.bar( ⟦ φ ↦ \U0001D70E2:λ, times(x) ↦ L_number_times:λ ⟧ ) ⟧:foo\n⟧\n```\n\nOne
  kind of formation the walk does not enter at all: a copy with a `φ`\nwritten as
  code and an argument that is a bare symbol, a `⟦ λ ⤍ \U0001D70E1 ⟧` with\nno carrier
  around it. The symbol stands for a value nobody knows, so the body\ncan only ask
  it questions nobody can answer, and every firing spent inside\nthat body is wasted.
  The walk defers such a copy instead: it answers the copy\nwith a fresh symbol and
  writes a `deferred` line to the protocol, tying that\nsymbol to the copy it stands
  for, which only a run of the program can work out.\nThe walk reads every argument
  written as a dispatch before it decides, so\n`tup ↦ items.tail` counts when `items.tail`
  comes to a bare symbol, but it\nfires nothing while reading. A copy with no `φ`,
  such as a tuple, only holds\nits arguments, so reading one of them reaches the symbol
  and defers nothing.\nHere the walk defers the copy of `box`:\n\n```bash\n$ cat box.phi\n⟦\n
  \ box(x) ↦ ⟦ φ ↦ x.next ⟧,\n  y ↦ Φ.box( x ↦ ⟦ λ ⤍ \U0001D70E1 ⟧ )\n⟧\n$ phino morph
  --deep --locator=Q.y --protocol=p.txt --sweet --hide-rho box.phi\n\U0001D70E2:λ\n$
  head -2 p.txt\n\U0001D544(Φ.y)\n  deferred(\U0001D70E2) := Φ.box( x ↦ \U0001D70E1:λ
  )  # \U0001D544(Φ.y)\n```\n\n### Acyclic morphing\n\nWhether a program terminates
  is the object model's business, not the\ncalculus's, so phino prevents no recursion
  of its own and `--max-steps` is what\nends a run that never finishes. An entry answering
  with a firing of itself\ntherefore spends the whole budget before it fails, and
  what it fails on is the\nlimit rather than the loop:\n\n```bash\n$ cat loop.yaml\n-
  λ: L_loop\n  \U0001D45B: ⟦ λ ⤍ L_loop ⟧\n$ cat loop.phi\n⟦ x ↦ ⟦ λ ⤍ L_loop ⟧.foo
  ⟧\n$ phino morph --symbolic=loop.yaml --locator='Q.x' --max-steps=40 loop.phi\n[ERROR]:
  Dataization did not finish before reaching the limit of steps: --max-steps=40\n```\n\nThe
  `--acyclic=<mode>` option makes a reduction notice. Every frame of \U0001D544 and\nof
  \U0001D53B remembers the formations the frames above it have entered, and only four\nplaces
  enter one: `fire` of \U0001D53B and `ml` of \U0001D544, which fire the λ function
  of a\nformation, the walk of `--deep`, which fires the λ function of every formation\n\U0001D544
  leaves bare, and `box` of \U0001D53B, which gets into the `φ` body of a formation\ncarrying
  no λ and no `Δ`. A frame about to enter a formation one of the frames\nabove it
  has already entered is asking a question only ever answered by asking\nit again,
  so the option stops there and parks the site the way `--partial`\nparks a λ function
  that cannot fire: the answer is the term the spine had\nreached, left where it stood,
  and the command exits successfully.\n\n```bash\n$ phino morph --symbolic=loop.yaml
  --locator='Q.x' --acyclic=proven \\\n    --max-steps=40 --hide-rho loop.phi\n⟦ λ
  ⤍ L_loop ⟧.foo\n```\n\n\U0001D544 and \U0001D53B share that one memory. They call
  each other on the very term they\nwere asked about, and that handover is no loop,
  but it enters no formation\neither, so it is never remembered and never mistaken
  for one. A body\ndispatching the object it stands in is a loop \U0001D53B walks
  round on its own — \U0001D544\nstops at a formation every round, and `box` gets
  into it again — so `dataize`\ntakes the option too, and so does the run of \U0001D53B
  a λ function's `dataize` operand\nis brought down with:\n\n```bash\n$ cat cyc.phi\n⟦
  cyc ↦ ⟦ x ↦ ∅, φ ↦ Φ.cyc( ξ.x ) ⟧, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n$ phino dataize --locator='Q.t'
  --acyclic=proven --partial \\\n    --sweet --hide-rho --flat cyc.phi\n⟦ cyc(x) ↦
  Φ.cyc( x ):φ, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n```\n\n\U0001D53B insists on bytes and a parked
  term carries none, so under `dataize` the option\nwants `--partial` to have something
  to print: the residual program, exactly the\none it prints for a λ function that
  cannot fire. Without it the run stops on\nthe loop all the same, naming the formation
  it entered again instead of running\nthe budget down. Under `morph` nothing is asked
  for: \U0001D544 always has a term to\nanswer with, a loop \U0001D53B meets under
  a firing parks the site the firing stands at,\nand the walk of `--deep` goes on
  to the next binding.\n\nThe mode says what \"the same formation\" means, and there
  is no default, since\nno answer is right for every run. Under `proven` it means
  the same up to a\nrenaming of symbols: two\nformations are one where some one-to-one
  pairing of the symbols of the first\nwith those of the second makes them equal,
  so `\U0001D70E5` may stand where `\U0001D70E3` stood\nas long as it does so everywhere
  and no other symbol stands there too. Data,\nattribute names and λ names must still
  match exactly. That is what catches a\nrecursion over an unknown, which never repeats
  a term: every round mints fresh\nsymbols, so the formation it enters on the second
  round is the one it entered\non the first with new names for the unknowns. The renaming
  is sound because a\nsymbol is an opaque value nobody worked out — every one of them
  dataizes to the\nsame manufactured datum and no entry of `--symbolic` answers one
  — so a\nformation entered again with nothing but its symbols renamed replays the
  round\nit is inside forever. Data still tells rounds apart: a formation entered
  with\n`n ↦ 3` and then with `n ↦ 2` is two formations, so a recursion over data
  is\nnot cut while it goes on computing. Take a factorial over a symbolic argument,\nwith
  `fact.yaml` answering `L_zero`, `L_dec` and `L_mul` with a fresh symbol\neach and
  `L_if` a fork joining its two branches:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  cat fact.phi\n⟦\n  if ↦ ⟦ c ↦ ∅, left ↦ ∅, right ↦ ∅, λ ⤍ L_if ⟧,\n  zero ↦ ⟦ x
  ↦ ∅, λ ⤍ L_zero ⟧,\n  dec ↦ ⟦ x ↦ ∅, λ ⤍ L_dec ⟧,\n  mul ↦ ⟦ a ↦ ∅, b ↦ ∅, λ ⤍ L_mul
  ⟧,\n  fact ↦ ⟦ n ↦ ∅, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ ξ.n ), left ↦ ⟦ Δ ⤍ 01- ⟧, right
  ↦ Φ.mul( a ↦ ξ.n, b ↦ Φ.fact( n ↦ Φ.dec( x ↦ ξ.n ) ) ) ) ⟧,\n  x ↦ Φ.fact( n ↦ ⟦
  λ ⤍ \U0001D70E1 ⟧ )\n⟧\n$ cat fact.yaml\n- λ: L_zero\n  dataize:\n    \U0001D6FF1:
  $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_dec\n  dataize:\n    \U0001D6FF1:
  $.x\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_mul\n  dataize:\n    \U0001D6FF1:
  $.a\n    \U0001D6FF2: $.b\n  \U0001D45B: ⟦ λ ⤍ \U0001D70E ⟧\n- λ: L_if\n  dataize:\n
  \   \U0001D6FF1: $.c\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n
  \ symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n
  \   \U0001D45B5: [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n$ phino
  morph --deep --acyclic=proven --partial --sweet --hide-rho --flat \\\n    --symbolic=fact.yaml
  --locator='Q.x' --protocol=fact.txt fact.phi\n⟦ n ↦ \U0001D70E1:λ, φ ↦ Φ.if( c ↦
  \U0001D70E2:λ, left ↦ 01-:Δ, right ↦ Φ.mul( a ↦ n, b ↦ Φ.fact( n ↦ \U0001D70E3:λ
  ) ) ) ⟧\n$ cat fact.txt\n\U0001D544(Φ.x)\n  \U0001D53C(L_zero)  # \U0001D544(Φ.x.φ)\n
  \   \U0001D6FF1.1 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.x)\n    \U0001D45B.1.1
  := \U0001D70E2:λ  # \U0001D45B\n    \U0001D45B.1.2 := \U0001D70E2:λ  # \U0001D544(\U0001D45B.1.1)\n
  \ \U0001D53C(L_dec)  # \U0001D544(Φ.x.φ)\n    \U0001D6FF1.2 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.x)\n    \U0001D45B.2.1 := \U0001D70E3:λ  # \U0001D45B\n    \U0001D45B.2.2
  := \U0001D70E3:λ  # \U0001D544(\U0001D45B.2.1)\n  \U0001D53C(L_mul)  # \U0001D544(Φ.x.φ)\n
  \   \U0001D6FF1.3 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.a)\n    formation(⟦
  n ↦ \U0001D70E3:λ, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ n ), left ↦ 01-:Δ, right ↦ Φ.mul( a
  ↦ n, b ↦ Φ.fact( n ↦ Φ.dec( x ↦ n ) ) ) ) ⟧)  # \U0001D53B(Φ.a\U0001F3353)\n      \U0001D53C(L_if)
  \ # \U0001D53B(Φ.a\U0001F3353)\n        \U0001D53C(L_zero)  # \U0001D53B(Φ.a\U0001F3354)\n
  \         \U0001D6FF1.5 := \U0001D53B(\U0001D70E3:λ)  # \U0001D53B(ξ.x)\n          \U0001D45B.5.1
  := \U0001D70E4:λ  # \U0001D45B\n          \U0001D45B.5.2 := \U0001D70E4:λ  # \U0001D544(\U0001D45B.5.1)\n
  \       \U0001D6FF1.4 := \U0001D53B(\U0001D70E4:λ)  # \U0001D53B(ξ.c)\n        \U0001D45B1.4
  := 01-:Δ  # \U0001D544(ξ.left)\n        \U0001D53C(L_dec)  # \U0001D544(Φ.a\U0001F3357.b)\n
  \         \U0001D6FF1.6 := \U0001D53B(\U0001D70E3:λ)  # \U0001D53B(ξ.x)\n          \U0001D45B.6.1
  := \U0001D70E5:λ  # \U0001D45B\n          \U0001D45B.6.2 := \U0001D70E5:λ  # \U0001D544(\U0001D45B.6.1)\n
  \       looped(⟦ a ↦ \U0001D70E1:λ, b ↦ Φ.fact( n ↦ \U0001D70E3:λ ), λ ⤍ L_mul ⟧)
  \ # \U0001D544(Φ.a\U0001F3357), proven\n        \U0001D45B2.4 := ⟦ a ↦ \U0001D70E3:λ,
  b ↦ Φ.fact( n ↦ \U0001D70E5:λ ), λ ⤍ L_mul ⟧  # \U0001D544(ξ.right)\n        \U0001D53B(\U0001D70E6:λ)
  == 01-\n        \U0001D45B3.4 := \U0001D70E6:λ  # \U0001D45B1\n        \U0001D45B4.4
  := ⟦ a ↦ \U0001D70E3:λ, b ↦ Φ.fact( n ↦ \U0001D70E5:λ ), λ ⤍ L_mul ⟧  # \U0001D45B2\n
