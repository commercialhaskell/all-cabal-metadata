description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.154\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\nIn
  a [GitHub Actions][gha] workflow, one step downloads the binary\nfor the runner
  and puts it on the `PATH`:\n\n```yaml\n- uses: objectionary/phino@0.0.154\n  with:\n
  \   version-file: phino-version.txt\n- run: phino --version\n```\n\nThe file holds
  the version to install, such as `0.0.150`, and the\nwhitespace around it is ignored.\nGive
  `version: 0.0.150` instead of `version-file` to write the version\nin the workflow
  itself.\nThe step fails if no binary is released for the runner, such as\nLinux
  on ARM, or if `phino --version` prints another version.\n\n## Build\n\nTo build
  `phino` from source, clone this repository:\n\n```bash\ngit clone git@github.com:objectionary/phino.git\ncd
  phino\n```\n\nThen, run the following command (ensure you have [Cabal][cabal] installed):\n\n```bash\ncabal
  build all\n```\n\nNext, run this command to install `phino` system-wide:\n\n```bash\nsudo
  cp \"$(cabal list-bin phino)\" /usr/local/bin/phino\n```\n\nVerify that `phino`
  is installed correctly:\n\n```bash\n$ phino --version\n0.0.0\n```\n\nYou can ensure
  scripts are run with a specific version of `phino` using\nthe `--pin` global option.
  It exits with an error when the version supplied\ndoesn't match the installed one:\n\n```bash\nphino
  --pin=0.0.0.67 dataize hello.phi\n```\n\nThe `--pin-file` global option does the
  same, but reads the version from\na file, ignoring the whitespace around it:\n\n```bash\nphino
  --pin-file=version.txt dataize hello.phi\n```\n\n## Dataize\n\nThen, you dataize
  the expression:\n\n```bash\n$ phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n###
  Symbolic λ functions\n\nWhich λ functions exist is a property of the object model
  being dataized, not\nof the calculus, so `phino` implements none of them. They come
  from a YAML file\ngiven with `--symbolic`, one entry per λ function:\n\n```yaml\n-
  λ: L_number_(plus|times)\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n
  \ \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n```\n\nThe `λ` of an entry is
  the λ names it answers for, as a regular expression, so\nthe one above stands for
  `L_number_plus` and `L_number_times`. Under `dataize`\nstand the operands it brings
  down to data through \U0001D53B, each binding a bytes meta\n`\U0001D6FF1`, `\U0001D6FF2`
  and so on; under `morph` the operands it reduces to a normal\nform through \U0001D544,
  each binding an expression meta `\U0001D45B1`, `\U0001D45B2`. Both blocks are\nterms
  of the calculus, read against the formation being fired, so `ξ` is that\nformation
  and `$.x` its `x`, while `Φ` is the universe. Every entry numbers its\nown metas
  from `\U0001D6FF1` and `\U0001D45B1`, and the entry is what tells two `\U0001D6FF1`
  apart.\n\nThe term under `\U0001D45B` is what the firing answers with. `phino` normalizes
  it\nexactly as it normalizes anything else, so `--protocol`, `--partial` and\n`--max-steps`
  work on it unchanged. It may name any meta the entry bound,\nthose of the two blocks
  below among them.\n\n### Firing what an operand came to\n\n\U0001D544 fires a λ
  function only where a dispatch reads the formation carrying it, so\nan operand reduced
  under `morph` may come to a formation whose λ function\nnobody fired, such as a
  call the program passed as an argument and never read.\nThere is a third block,
  `evaluate`, and each line of it fires such a formation\nthrough \U0001D53C and binds
  an expression meta of its own to the answer:\n\n```yaml\n- λ: L_fork\n  morph:\n
  \   \U0001D45B1: $.left\n    \U0001D45B2: $.right\n  evaluate:\n    \U0001D45B3:
  \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n    \U0001D45B5: [\U0001D45B3,
  \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\nThe right-hand side of a line names
  a meta bound by `morph` or by another line\nof the entry, and nothing else. A formation
  with a λ function is fired by the\nentry its λ name matches, the way \U0001D544
  fires it, and the line binds its meta to\nthe normal form of the answer. A formation
  with no λ function is no call and\nstays as it is, and so does `⊥`. A λ name no
  entry answers gets stuck, as it\ndoes anywhere else, and `--partial` parks it. A
  λ function the entry names\nunder `terminators` is not fired at all, since it raises
  rather than answers.\nAn answer is not fired again, even when it is one more call:
  firing it takes\none more line, so how many calls an entry makes is written in its
  file and not\nguessed by `phino`. Each firing of a line is one step deeper, the
  way a frame\nof \U0001D544 or \U0001D53B is, so a recursion running through `evaluate`
  lines alone spends\n`--max-steps` and is cut by `--acyclic` like any other.\n\nThe
  protocol writes the firing of a line as a block of its own, commented with\nthe
  meta it fired, `\U0001D53C(L_second):  # \U0001D53C(\U0001D45B2)`, and the line
  binding the answer\nthe same way, `\U0001D45B3·1 := \U0001D45B·3·2  # \U0001D53C(\U0001D45B2)`.\n\n###
  Rewriting a term into another shape\n\nThere is a fourth block, `rewrite`, and it
  reduces nothing. Each line of it\ntakes a term another meta of the entry is already
  bound to, named under `of`,\napplies a list of ordinary rules to it, spelled with
  the very `pattern`,\n`result`, `when` and meta variables a rule file uses, and binds
  an expression\nmeta of its own to the outcome:\n\n```yaml\n- λ: L_fork\n  dataize:\n
  \   \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n
  \ rewrite:\n    \U0001D45B3:\n      of: \U0001D45B1\n      rules: &bool\n        -
  name: false-literal\n          pattern: >-\n            ⟦ !B1, φ ↦ Φ.bool( if ↦
  ⟦ ρ ↦ ∅, left ↦ ∅, right ↦ ∅,\n            φ ↦ ξ.right ⟧ ), !B2 ⟧\n          result:
  >-\n            ⟦ φ ↦ Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅,\n            φ
  ↦ ⟦ Δ ⤍ 00- ⟧ ⟧ ) ⟧\n    \U0001D45B4:\n      of: \U0001D45B2\n      rules: *bool\n
  \ \U0001D45B: \U0001D45B3\n```\n\nThe meta under `of` is one bound by `morph` or
  by another line of the entry,\nand nothing else. A rule is tried at every position
  of the term,\nthe outermost first; the first rule whose pattern matches a position
  rewrites\nit, and a rewritten position is not walked into again, so a rule whose
  result\ncarries its own pattern never loops. Nothing is normalized afterwards: a\nrewrite
  is a substitution the entry vouches for and not a reduction, exactly as\nan answer
  is. A rule writing a `\U0001D70E` into its result, or reading a meta its\npattern
  never\nbinds, is refused where the file is read.\n\nThis is how a program brings
  two branches of a fork to one shape before they\nare compared. In EO a `Φ.false`
  is written `φ ↦ ξ.right` while a bool a firing\nanswered carries a symbol, and the
  two are one value in two spellings that\nonly the program knows to be one. A `symbolize`
  line may read what a `rewrite`\nline made on purpose: a result may write the datum
  a literal stands for, as\n`⟦ Δ ⤍ 00- ⟧` above, and that datum is then stood into
  a known symbol the join\ncan pair.\n\n### Dropping the ρ of a dispatch\n\nThere
  is a fifth block, `stay`, and it reduces nothing either. Each line of it\ntakes
  a term another meta of the entry is already bound to and binds an\nexpression meta
  of its own to that term with every `( ρ ↦ … )` dropped that is\napplied to a dispatch:\n\n```yaml\n-
  λ: L_fork\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n  stay:\n
  \   \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n    \U0001D45B5:
  [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\nThe right-hand side
  of a line names a meta bound by `morph` or by another line\nof the entry, and nothing
  else. Every position of the term is walked, the\nmethods and the `ρ` of a formation
  among them, and `\U0001D452.\U0001D70F( ρ ↦ \U0001D4522 )` becomes\n`\U0001D452.\U0001D70F`.
  So does a dispatch heading a chain of applications that bind no `ρ`:\n`\U0001D452.\U0001D70F(
  φ ↦ \U0001D4523 )( ρ ↦ \U0001D4522 )` becomes\n`\U0001D452.\U0001D70F( φ ↦ \U0001D4523
  )`. A `ρ` applied to anything else, such as a formation, stays.\n\nDropping it changes
  no value. The `dot` rule answers a dispatch as\n`\U0001D45B1( ρ ↦ ⟦…⟧ )`, and then
  `copy` fills a void `ρ` of the body, `stay` keeps a\nbound one and `skip` drops
  it where the body declares none. So once `\U0001D452.\U0001D70F`\ncomes to a formation,
  a later `( ρ ↦ \U0001D4522 )` meets a `ρ` that is bound or not\nthere, and `stay`
  or `skip` drops it. The block only drops it earlier, before\nthe dispatch is reduced.\n\nThis
  is how a fork brings two numbers to one shape. In EO `bytes.as-number`\nreads its
  `data` as `ρ`, so a branch computed through it comes to\n`Φ.number( φ ↦ Φ.bytes(
  φ ↦ \U0001D70E1 )( ρ ↦ ⟦ … ⟧ ) )`, with the copy hung on the\nbytes as their `ρ`,
  while a branch made of no object comes to\n`Φ.number( φ ↦ Φ.bytes( φ ↦ \U0001D70E2
  ) )`. The join compares the two as written and\nthe tail refuses it; after `stay`
  they differ in their symbols alone. The\nprotocol writes each line of the block
  the way it writes a `rewrite` one,\ncommented with the meta it took.\n\n### Standing
  data into unknowns\n\nThere is a sixth block, `symbolize`, and it reduces nothing.
  It takes a term\nanother meta of the entry is already bound to and binds an expression
  meta of\nits own to that same term with every datum in it standing for an unknown:\n\n```yaml\n-
  λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n
  \   \U0001D45B2: $.right\n  symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4:
  \U0001D45B2\n  \U0001D45B: \U0001D45B3\n```\n\nThe right-hand side of a line names
  a meta bound by `morph` or by another line\nof the entry, and nothing else; a term
  nobody reduced has no data to stand.\nEvery `Δ ⤍ b` binding of that term becomes
  a\n`λ ⤍ \U0001D70Ek` naming a fresh symbol, one per occurrence, so `⟦ Δ ⤍ b ⟧` reads
  as\n`⟦ λ ⤍ \U0001D70Ek ⟧` and a\nliteral tuple gets several. A term carrying no
  datum passes through as it was.\n\nOnly the `φ` chain is walked. A term carries
  the value it stands for where\nthat chain ends, so a datum standing anywhere else
  says nothing about the term\nand is left alone, the whole subtree of it. What sits
  under `ρ` belongs to the\nobject around this one, and a normal form drags the universe
  it was reduced\ninside along under `ρ`, so a walk reaching into it would stand the
  data of the\nwhole program into unknowns to say one thing about one term. What sits
  under a\nmethod is code and not data: the `-1` of a `neg ↦ ⟦ φ ↦ ξ.ρ.times( -1 )
  ⟧`\nnobody has called is the body of a method, and minting a symbol for it, and
  for\nevery other literal every method of the carrier declares, would write unknowns\nnobody
  ever reads.\n\nThis is what lets an entry compare two branches of a fork. A literal
  is sugar\nfor `Φ.number( Φ.bytes( ⟦ Δ ⤍ … ⟧ ) )`, so a branch computed from a literal\nkeeps
  a datum three levels down where a branch computed from an unknown keeps\n`⟦ λ ⤍
  \U0001D70E ⟧`. A `Δ` against a `λ` is a difference in kind and not in value, and\nafter
  the stage both branches carry `⟦ λ ⤍ \U0001D70E ⟧` where they differ.\n\n### Joining
  the branches of a fork\n\nA branching λ function answers neither of its branches.
  Which one the program\ntakes is decided by a value nobody worked out, so handing
  one of them through\nwould drop the branch point from the program altogether and
  a reader would see\nthe condition computed and thrown away. `join` is the seventh
  block, and it\nreduces nothing either: it takes two metas the entry has bound already
  and\nbinds one of its own to the two terms joined into one.\n\n```yaml\n- λ: L_fork\n
  \ dataize:\n    \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2:
  $.right\n  symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n
  \ join:\n    \U0001D45B5: [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\nA
  line names two metas bound by `morph` or by other lines of the entry, and\nnever
  three: it stands for a choice between two branches, and a walk over three\nterms
  in parallel is no such choice. The meta it binds is one like any other,\nso the
  answer may name it alone, as above, or stand it inside a larger term.\n\n`phino`
  takes the two terms and requires them to match verbatim, with one\nexception: where
  `⟦ λ ⤍ \U0001D70EA ⟧` in one meets a different `⟦ λ ⤍ \U0001D70EB ⟧` in the\nother,
  it mints a fresh `\U0001D70EC` and stands it there. The same symbol on both sides\nstays
  as it is, and the same pair met again further down gets the same fresh\nsymbol,
  since it is one choice however often the two terms differ by it; two\ndifferent
  pairs get two fresh symbols. Two identical terms join into that same\nterm and nothing
  is minted at all. The join keeps the type by construction,\nbeing the terms' own
  shape, so the file needs to know nothing about carriers.\n\nOnly the `φ` chain is
  compared, exactly as `symbolize` stands only that chain\ninto unknowns: a term carries
  the value it stands for where its `φ` chain ends,\nso every other binding is taken
  from the first branch, the whole subtree of it,\nand never compared at all. The
  two branches of a fork reach their normal forms\nin scopes of their own, so their
  `ρ` differ wherever the reduction left a\ntrace, and comparing them would refuse
  the join over something saying nothing\nabout either branch; a method is the same,
  its body being code nobody has\ncalled, so two branches differing inside one are
  not two values. The joined\nterm keeps the methods and the `ρ` of the first of the
  two, being of its shape,\nwhich is what lets the program go on dispatching on what
  the fork answered.\n\nA join is only ever between two expressions and a datum is
  never joined with\nanything, which is why its branches go through `symbolize` first:
  a known\nsymbol, one that stage minted for a datum, is a symbol like any other here,
  so\na literal branch joins with a computed one and two literal branches join too.\nAny
  other difference — a datum against a symbol, two different data, a binding\none
  term carries and the other does not — is no join at all, and the firing\ngets stuck\nthe
  way a λ function no entry answers does, so `--partial` parks it rather than\naborting
  the run. A fork whose branches differ in structure, such as a `Φ.true`\nand a `Φ.false`
  written as `φ ↦ ξ.left` against `φ ↦ ξ.right`, is stuck, and\nbringing two such
  branches to one shape is the program's job and not `phino`'s,\nwhich its entry does
  in a `rewrite` block.\n\nA bare symbol, `⟦ λ ⤍ \U0001D70EA ⟧` with no carrier around
  it, is what an entry\nanswering `⟦ λ ⤍ \U0001D70E ⟧` makes, and it joins with a
  formation too. It has no `φ`\nchain of its own, only the symbol, so the join pairs
  `\U0001D70EA` with the symbol the\n`φ` chain of the other term ends in, mints a\nfresh
  `\U0001D70EC` for that pair the usual way, and answers the bare `⟦ λ ⤍ \U0001D70EC
  ⟧`.\nThe methods of the formation are dropped, since the other branch may have\nnone
  of them. A formation whose `φ` chain ends in a datum, or which has no `φ`\nat all,
  does not join with a bare symbol.\n\nA fork whose one branch calls a method often
  meets a decorator. In\n`if. (value.gte 0) (0.plus value) value.neg` the first branch
  comes to a\nnumber `X`, while `value.neg` is a method, `times -1 > @`, and comes
  to\n`⟦ φ ↦ X ⟧`, with the number one level down. The two differ in shape, so the\njoin
  is refused. An entry that says `lenient: true` beside its `join` block\nlets it
  through:\n\n```yaml\n- λ: L_fork\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2:
  $.right\n  join:\n    \U0001D45B3: [\U0001D45B1, \U0001D45B2]\n  lenient: true\n
  \ \U0001D45B: \U0001D45B3\n```\n\nEvery `join` line of such an entry joins a term
  with a formation whose `φ` is\nthat term, in either order, and answers `⟦ φ ↦ X
  ⟧`, with symbols minted inside\n`X` the usual way. Where both terms are formations,
  the one with the longer `φ`\nchain is taken for the decorator. The answer drops
  the `ρ` and the other\nattributes of the decorator, so it is not exactly the object
  either branch\nmade, which is why an entry is strict unless it says otherwise. Dataization\nstill
  reaches the same data through it. An entry that says `lenient: true` and\nhas no
  `join` line is refused when the file is read.\n\nA lenient entry also joins a bare
  symbol with a term that holds exactly one\nsymbol anywhere inside. In `bool.and`
  one branch comes to a bare\n`⟦ λ ⤍ \U0001D70E1 ⟧` and the other to `⟦ φ ↦ Φ.bool(
  if ↦ \U0001D458 ) ⟧`, where `\U0001D458` is\n`⟦ λ ⤍ L_fork, φ ↦ ⟦ λ ⤍ \U0001D70E2
  ⟧ ⟧`. The `φ` of the second is a call, so its\n`φ` chain ends in no symbol and a
  strict join stops there. A lenient one\nanswers a copy of the second term with `\U0001D70E2`
  replaced by a fresh `\U0001D70E3`, which\nstands for either `\U0001D70E1` or `\U0001D70E2`.
  The copy keeps every binding of the term, `ρ`\nincluded. A term with no symbol,
  or with two, is still refused.\n\nA lenient entry takes one more step before it
  gives up. A branch may be an\nordinary object, such as `⟦ φ ↦ ξ.eq, eq ↦ ⟦ λ ⤍ L_eq
  ⟧ ⟧`: a formation with\nno `λ`, whose `φ` reads an attribute of the object itself.
  Morphing stops at a\nformation, so the value of such a branch stays one call away
  and it joins with\nnothing. When a join fails, a lenient entry morphs the `φ` of
  every such\nbranch, fires what it comes to, the way an `evaluate` line does, and
  joins\nonce more. The step is taken once and is written to the protocol like any\noperand.
  Its firing counts against `--max-steps`, as one of an `evaluate`\nline does, and
  `--acyclic` cuts it when it fires again what it fired before.\nA branch whose `φ`
  reads nothing of its own object, such as\n`⟦ φ ↦ Φ.bool( … ) ⟧`, is left as it is,
  since morphing it only expands the\ncall.\n\nThat step gets stuck on a branch that
  is a copy, such as\n`Φ.step( tup ↦ Φ.items.tail )`, one of whose arguments reads
  to a bare\nsymbol `⟦ λ ⤍ \U0001D70E1 ⟧`: morphing its `φ`, `tup.next`, asks `\U0001D70E1`
  for an\nattribute nobody knows. An entry that says `defer: true` beside\n`lenient:
  true` does not enter such a copy. It answers the copy with a fresh\nsymbol, joins
  that symbol instead, and writes what it stands for:\n\n```text\ndeferred(\U0001D70E3)
  := Φ.step( tup ↦ \U0001D70E1:λ )  # \U0001D544(\U0001D45B2.φ)\n```\n\nThe markup
  writes it as `<deferred symbol=\"\U0001D70E3\" … of=\"Φ.step\">`, holding a\n`<with>`
  element with an `<attr name=\"tup\">\U0001D70E1</attr>` per argument, a `?` for\nan
  argument that is no bare symbol, and the copy itself in `<e>`. The `of` is\nleft
  out when the world declares no object the copy was made of. A copy whose\narguments
  read to no bare symbol is entered as before. An entry that says\n`defer: true` and
  is not lenient is refused when the file is read.\n\nThe same entry answers a copy
  it did enter when `--acyclic` cuts the firing\nits `φ` comes to. With `rec(n) ↦
  ⟦ φ ↦ Φ.fork( ⟦ λ ⤍ \U0001D70E1 ⟧, Φ.rec( ξ.n ) ) ⟧`,\nthe copy `Φ.rec( ⟦ φ ↦ ⟦
  λ ⤍ \U0001D70E2 ⟧ ⟧ )` reads to no bare symbol, so the step\nenters it, comes to
  the same fork, and fires it again, and the cut refuses\nthat firing. A lenient entry
  without `defer: true` loses the whole firing to\nthe cut. A deferring one answers
  the copy with a fresh symbol, joins that\nsymbol, and writes it on the `looped`
  line:\n\n```text\nlooped(\U0001D45B·1·3) := \U0001D70E3  # \U0001D53C(\U0001D45B2),
  proven\n```\n\nThe markup writes it as `<looped symbol=\"\U0001D70E3\" … of=\"Φ.rec\">`
  with the same\n`<with>` element a `deferred` record holds, here `<attr name=\"n\">\U0001D70E2</attr>`,\nsince
  an argument whose `φ` holds a bare symbol counts as that symbol.\n\nOne term being
  `⊥` is the exception, since `if. cond value ⊥` is how EO spells\n\"raise unless
  `cond`\": the program raises on that side of the condition and\nhas a perfectly
  good value on the other. The join then mints nothing, binds\nits meta to the other
  term as it stands and writes on which side the program\nraises, naming the condition
  by what the first `dataize` operand of the entry\ncame down to, as `terminate(\U0001D53B(\U0001D70E2:λ),
  right)  # \U0001D45B4` in the text format and\n`<terminate symbol=\"\U0001D70E2\"
  branch=\"right\"/>` in the markup.\n\nEO raises with an object too, a copy of `⟦
  message ↦ ∅, λ ⤍ L_throw ⟧`, whose\nλ function the file leaves out on purpose, so
  that an error of the program\nstays an error at runtime. An entry names such functions
  under `terminators`:\n\n```yaml\n- λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n
  \ morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n  join:\n    \U0001D45B3:
  [\U0001D45B1, \U0001D45B2]\n  terminators: [L_throw]\n  \U0001D45B: \U0001D45B3\n```\n\nA
  `join` line of such an entry takes a formation with `λ ⤍ L_throw`, or an\napplication
  of one, for a branch that raises, exactly as it takes `⊥`: it binds\nits meta to
  the other term and writes `terminate(…)`. An `evaluate` line never\nfires `L_throw`,
  since the entry names it under `terminators`, so the branch\nreaches the join as
  `morph` left it. The record names the `message` of that\nterm as its last argument,
  as written, as\n`terminate(\U0001D53B(\U0001D70E2:λ), right, 7.plus( 8 ))  # \U0001D45B4`
  in the text format and\n`<terminate symbol=\"\U0001D70E2\" branch=\"right\" message=\"7.plus(
  8 )\"/>` in the\nmarkup, so the error path can be lowered as well as the other branch.
  A raising\nterm with no `message` names none. A name under\n`terminators` that a
  key of the file matches is refused when the file is read,\nsince that function fires
  rather than raises.\n\nEvery symbol a join mints is written into the protocol as
  a fact of its own,\nso a reader ties it to the two it stands for without diffing
  the terms; the\nsection on `--protocol` below shows one.\n\n### The order of the
  lines\n\nThe lines of `evaluate`, `rewrite`, `stay`, `symbolize` and `join` run
  in the\norder of the metas they read, not in the order of their blocks. A line runs\nonce
  every meta it reads is bound, so this entry fires what its `rewrite` line\nunwrapped:\n\n```yaml\n-
  λ: L_pick\n  morph:\n    \U0001D45B1: $.x\n  rewrite:\n    \U0001D45B2:\n      of:
  \U0001D45B1\n      rules:\n        - name: unwrap\n          pattern: ⟦ φ ↦ \U0001D4521
  ⟧\n          result: \U0001D4521\n  evaluate:\n    \U0001D45B3: \U0001D45B2\n  \U0001D45B:
  \U0001D45B3\n```\n\nThe `evaluate` line reads `\U0001D45B2`, which the `rewrite`
  line binds, so the\n`rewrite` line runs first. The `dataize` and `morph` blocks
  read no meta and\nalways run before all the others. Where no meta orders two lines,
  they run in\nthe order the list above gives their blocks, and the lines of one block
  in the\norder of their metas, `\U0001D45B2` before `\U0001D45B10`. A line reading
  a meta nothing binds\nis refused when the file is read, and so is a line that reads
  the meta it\nbinds, directly or through other lines, since it could never run.\n\n###
  Symbols\n\nAn entry answers, it never computes. The job of these functions is symbolic\nmorphing:
  what `5.plus( 6 )` comes to is the arithmetic of the object model and\nnot `phino`'s,
  so an entry answers a term carrying a symbol standing for a\nvalue nobody worked
  out, and the data its `dataize` operands came down to is\nnot its to read. An answer
  mentioning a `\U0001D6FF` is refused where the file is read.\n\n`\U0001D70E` is
  a meta of the calculus, beside `\U0001D45B`, `\U0001D6FF` and `\U0001D453`, and
  it stands where\na λ name stands. In a term, `\U0001D70E1` is a concrete symbol:
  a λ function nothing\nanswers, which is what makes the value the term carries unknown.
  Firing it is\ntherefore the same question as firing a λ name the `--symbolic` file
  does not\ncarry, and gets the same answer: \U0001D53C stops there, the protocol
  records the site as\n`unanswered(\U0001D70E1)`, and `--partial` leaves the term
  where it stands. Dispatching\nan attribute off a symbol — `⟦ λ ⤍ \U0001D70E1 ⟧.plus(
  5 )` — therefore taints its own\nbinding and nothing else; what stands beside it
  still computes. In an answer, a\nbare `\U0001D70E` asks for a fresh one, minted
  as the firing happens and numbered by the\nrun, so no two unknowns are ever spelled
  alike. Minting starts after the symbols\nthe program already carries, so a run over
  the \U0001D711-program an earlier run wrote\nnever spells a fresh symbol like one
  already standing there.\n\nDataizing a symbol never gets stuck. It answers a fixed
  datum, 42\n(`40-45-00-00-00-00-00-00`), the same one for every symbol, so \U0001D53B
  always\nanswers, a `\U0001D6FF` always holds concrete data and no firing ever declines
  for the\nlack of it:\n\n```bash\n$ cat sum.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number
  ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n  φ ↦ 5.plus( 6 )\n⟧\n$ phino
  dataize --symbolic=atoms.yaml --sweet --hide-rho sum.phi\n40-45-00-00-00-00-00-00\n```\n\n###
  The keys of the file\n\nEach `λ` is a regular expression, and it must match the
  whole λ name, so a\nplain name such as `L_number_plus` means that one function and
  nothing else,\nwhile `L_number_.*` stands for every function of `number`. The keys
  are unique:\nnothing tells two entries under one key apart, so a second entry under
  a key is\nunreachable and the file is refused rather than merely redundant.\n\nA
  λ name no key matches has no λ function at all, so \U0001D53C gets stuck on it.\nWithout
  `--symbolic` there is no entry at all and every λ function gets stuck:\n\n```bash\n$
  phino dataize --sweet --hide-rho sum.phi\n[ERROR]: No entry of --symbolic answers
  the λ function 'L_number_plus'\n```\n\nThe file is read before anything is parsed
  or reduced, so a key that is no\nregular expression, an operand that is no meta
  of the kind its block binds, or\nan answer the calculus cannot read fails the run
  up front rather than half-way\nthrough a derivation.\n\n### Recording what fired\n\nEvery
  λ function fired on the way to the answer may be recorded in a\nmachine-readable
  protocol, with the `--protocol` option. The protocol is a\ntree: the run at the
  top, one block per firing under it, and inside the block\nthe operands the firing
  bound and the term it answered with. A judgment started\nat a new site opens a block
  too, and what it does stands under it.\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho sum.phi\n$ cat atoms.txt\n\U0001D53B(Φ):\n  \U0001D544(Φ):\n    \U0001D45B·0·1
  := 5\n    \U0001D45B·0·2 := \U0001D45B·0·1.plus( x ↦ 6 )\n  \U0001D53C(L_number_plus):\n
  \   \U0001D53B(Φ.a\U0001F3350):\n      \U0001D544(Φ.a\U0001F3350):\n        \U0001D45B·1·1
  := 5\n        \U0001D45B·1·2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )\n      \U0001D6FF·1·1
  := 40-14-00-00-00-00-00-00  # 5.0\n    \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n
  \   \U0001D53B(Φ.a\U0001F3351):\n      \U0001D544(Φ.a\U0001F3351):\n        \U0001D45B·1·3
  := 6\n        \U0001D45B·1·4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )\n      \U0001D6FF·1·2
  := 40-18-00-00-00-00-00-00  # 6.0\n    \U0001D6FF2·1 := \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n
  \   \U0001D45B·1·5 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n    \U0001D544(\U0001D45B·1·5):\n
  \     \U0001D45B·1·6 := Φ.number( φ ↦ \U0001D70E1:λ )\n    \U0001D45B·1·7 := \U0001D45B·1·6
  \ # \U0001D544(\U0001D45B·1·5)\n```\n\n<!-- markdownlint-enable MD013 -->\n\n`\U0001D53B(…)`
  is the run and the term it was aimed at, `\U0001D544(…)` where the run is a\nmorphing,
  and `\U0001D53C(…)` is one firing, named by the entry that answered it. A line\nstanding
  in a block needs no comment to say which judgment made it and where:\nthe block
  it stands in says that already. A comment is written only where it\nsays something
  the block does not, such as the term an operand was reduced\nfrom, `\U0001D53B(ξ.ρ)`,
  or the meta an answer was read from, `\U0001D45B`, and every comment\nnaming a judgment
  is of that shape: a judgment applied to a term, which is the\nintent the value beside
  it came from. The firings are numbered across the\nwhole run, in the order they
  open, so `\U0001D6FF1·2` is the value bound to `\U0001D6FF1` by\nthe second firing
  of the run, whichever λ function that was, `\U0001D45B1·2` the same\nfor a `morph`
  meta, and `\U0001D45B·3·2` the answer of the third firing, so\n`\U0001D45B1·2 :=
  \U0001D45B·3·2` reads \"the `\U0001D45B1` of this firing is what the third firing\nanswered\".
  One firing binds a meta once and no two firings\nshare a number, so every one of
  these names stands on exactly one line of the\nfile and a line naming another one
  points at it and no other.\n\nA nested `\U0001D53B(…):` or `\U0001D544(…):` line
  opens a block where a judgment starts at a\nsite other than the one of the block
  it stands in, and names that site. What\nthe judgment does stands one level deeper
  under it: the objects its\nnormalization makes, the firings it demands, and the
  judgments it starts in\nturn. A reader therefore sees which judgment made each line
  and at which site,\nrather than a flat list of lines each saying so. \U0001D53B
  of a term that is no\nformation asks \U0001D544 for the normal form of the same
  term first, through its\n`norm` rule, so a `\U0001D544(…):` block often stands right
  inside a `\U0001D53B(…):` block of\nthe same site, and `\U0001D45B·0·1 := 5` above
  is made by that \U0001D544 and not by \U0001D53B. A\njudgment started at the site
  of the block it stands in, and by the same\njudgment, opens nothing, and what it
  does joins that block. A block is written\nonly once a line stands in it, so a judgment
  that made nothing worth a line\nleaves no empty heading behind. The line is no firing:
  it binds no meta and\ntakes no number, so the metas of the firings under it are
  numbered as if it\nwere not there. A `\U0001D53B(…):` block ends with the datum
  the `delta` rule found,\nsuch as `\U0001D6FF·1·1 := 40-14-00-00-00-00-00-00`, named
  by the firing it stands in\nand a counter of its own, and the operand line right
  after the block names it.\nA datum of eight bytes is commented with the number those
  bytes hold as an\nIEEE 754 double, `# 5.0` here, since that is how a number keeps
  its data.\nIn the run above \U0001D53B gets into each number the entry brings down,
  and through\nits `φ` into the bytes that number holds, in the same block, since
  the site is\nthe same.\n\nAn answer stands on two lines and not one. A firing answers
  the term its entry\nwrote and `phino` morphs that term before standing it back into
  the program, so\n`\U0001D45B·1·5` is what the entry wrote, with the symbols this
  firing minted already in\nit, commented with `\U0001D45B` to name the key it was
  read from, and `\U0001D45B·1·7` is the\nnormal form \U0001D544 made of it, commented
  with `\U0001D544(\U0001D45B·1·5)` to say where it came from.\nThat morphing opens
  a block of its own, `\U0001D544(\U0001D45B·1·5):`, named after the term it\nstarted
  from, since that term stands nowhere in the program a locator could\nreach. It is
  the same morphing every other term goes through, and writing only its\noutcome would
  have the formation of `number` appear in place of the three\ntokens the entry wrote
  with nothing saying why. Whatever that morphing fires\nor applies writes its lines
  between the two, exactly where a firing an operand\ntook opens its block, so the
  order the lines come in is the order the work was\ndone in.\n\n`\U0001D45B·1·6 :=
  Φ.number( φ ↦ \U0001D70E1:λ )` is an object an application made. The `copy`\nrule
  of normalization fills a void of a formation with the argument it was\ngiven, and
  so makes a new object, whatever judgment is running and wherever in\nthe term the
  application stands. The line binds that object to a fresh `\U0001D45B` and\nspells
  the application: the object applied on the left and the argument it got\non the
  right, so `5` is `Φ.number( φ ↦ … )` in sugar. The `ρ` a dispatch gives\nthe attribute
  it takes writes no line. The block the line stands in names the\njudgment that normalized
  and the site it stood at. The name is counted with the\nmetas of the firing the
  line stands in, `\U0001D45B·1·5` before it and `\U0001D45B·1·7` after it,\nand an
  object made outside every firing is counted under `\U0001D45B·0`. From then on\nevery
  line spells the object by that name rather than as the formation it is,\nand the
  application by the same name, since `copy` makes the same object of the\nsame application
  wherever it stands: `\U0001D45B·1·1` is the object `5` made,\n`\U0001D45B·0·1.plus(
  x ↦ 6 )` is the `plus` of the first `5` applied to `6`, one line\nfor one call,
  and `\U0001D45B·1·7 := \U0001D45B·1·6` says the firing answered with the object
  \U0001D544\nmade of what the entry wrote. Such a line names its head and its argument
  that\nway, each on its own, and never the application as a whole, so a line spells
  out\nevery application, even one making an object an earlier one already made, the\nway
  `\U0001D45B·1·1 := 5` does, and a later line names the latest of them. Only an object\nstill
  standing as it was made is named: once a rule rewrote a part of it, it is\nanother
  object and it is spelled out again.\n\nWhere an operand came down to the datum a
  symbol stands for, the protocol writes\n`\U0001D53B(\U0001D70E1:λ)` in place of
  that 42 (`\U0001D70E1:λ` is the formation `⟦ λ ⤍ \U0001D70E1 ⟧`, in the\nsugar every
  sweet term is written with), so a reader sees that the value was\nmanufactured rather
  than read out of the program. A `\U0001D70E` is the name of a λ\nfunction and no
  term of its own, so \U0001D53B is applied to the formation carrying it\nand never
  to the name alone.\n\nA `symbolize` line writes a line per fresh symbol it minted,
  ahead of the line\nbinding the term that carries them, and that line is a fact and
  no assignment:\n`\U0001D53B(\U0001D70E44:λ) == 3F-F0-00-00-00-00-00-00` says that
  dataizing the formation\n`\U0001D70E44` names answers those bytes. Nothing binds
  bytes to a `\U0001D70E`, since it is\nneither a datum nor a term. A consumer reading
  the protocol back treats a\nsymbol with such a fact as a constant and every other
  symbol as an unknown.\n\nThe line binding the term of a `symbolize` one is commented
  with the meta it\nwas told to stand, `\U0001D45B3·1 := ⟦ λ ⤔ \U0001D7068 ⟧  # \U0001D45B1`,
  and with no judgment\naround it: standing the data of a term into unknowns is the
  file's own\noperation and nothing of the calculus runs there, so the line names
  a meta of\nthe entry the way a `join` line names the two it joined. A comment carries
  the\nletter of a judgment exactly where a judgment made the value and the block\naround
  the line does not already say so.\n\nThe site of a firing is a locator, and the
  block a firing stands in names it,\nunder the letter of the judgment that asked
  for the firing: \U0001D53C is fired by the\n`ml` rule of morphing and by the `fire`
  rule of dataization, so a firing in the\nblock `\U0001D544(Φ.demo.a.φ):` is a λ
  function fired while \U0001D544 was reducing that\nbinding, and one standing right
  in `\U0001D53B(Φ):` was fired because dataization\ndemanded data of `Φ`. A chain
  such as `5.plus( 6 ).plus( 7 )` writes both: the\ninner call is fired inside the
  `\U0001D544(Φ):` block, while \U0001D544 reduces the head of the\nouter dispatch,
  and the outer one right in `\U0001D53B(Φ):`, because \U0001D53B asked for the\ndata.
  A line standing right in a firing has no block of its own around it, so\na line
  there that a judgment wrote at a site no block names, such as\n`starved(…)` below,
  carries that judgment and site as its comment. The site\nitself is where in the
  program the firing\nbelongs: the term the run was aimed at, so `Φ` for a run that
  was aimed at\nnothing in particular. An operand of a firing is reduced bound to
  a synthetic\nattribute of the universe (see `--inside` below), so a λ function fired
  while\nit came down is written under that attribute and not under the site of the\nfiring
  that asked for it, and a formation an `evaluate` line fires is written\nunder the
  meta it fired, `\U0001D53C(\U0001D45B2)`.\n\nAn operand line ends in the judgment
  that reduced it and the term it was\nreduced from, written as a comment after two
  spaces and `#`. The value alone\nsays what the meta was bound to and neither what
  it was bound from nor what\nwas done to it, so `\U0001D6FF1·1 := \U0001D6FF·1·1
  \ # \U0001D53B(ξ.ρ)` reads \"the `\U0001D6FF1` of this firing\nis the `ρ` of the
  formation brought down through \U0001D53B, and it came down to the\ndatum `\U0001D6FF·1·1`
  above\", where a `morph` operand reads `\U0001D45B1·5 := \U0001D45B·3·4  # \U0001D544(ξ.then)`\nand
  says that the `then` of the formation reached its normal form through \U0001D544.\nWhich
  of the two judgments ran is the whole difference between a line ending\nin data
  and one ending in a term. It is the very term the entry wrote under\nthat meta,
  spelled the way the calculus reads it — `$` is read as `ξ` — so a\nreader never
  has to open the `--symbolic` file beside the protocol and match\nevery line by λ
  name and meta number.\n\n`unanswered(…)` is a λ name no entry answers, standing
  where the block of its\nfiring would have stood. Nothing fired, so nothing opens
  under it. The line is\ncommented with the judgment that asked and the formation
  it was asking about,\n`\U0001D544(L_none:λ)`, which no block names, the way an operand
  line is commented\nwith the term it was reduced from: \U0001D53C is fired by the
  `ml` rule of morphing\nand by the `fire` rule of dataization, so the letter says
  where in the\nreduction the site stands and the term says which object the λ function
  that\ncould not fire belongs to. It is written whether or not `--partial` goes on\nto
  park the run, since the protocol records what \U0001D53C was asked for, and a\nquestion
  it could not answer belongs there as much\nas one it could — once per site and not
  once per attempt, since a site\n`--partial` parks stays in the residue, where a
  later step may meet it again:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_nope'\n$
  cat atoms.txt\n\U0001D53B(Φ):\n  \U0001D544(Φ):\n    \U0001D45B·0·1 := 5\n    \U0001D45B·0·2
  := \U0001D45B·0·1.plus( x ↦ 6 )\n    \U0001D53C(L_number_plus):\n      \U0001D53B(Φ.a\U0001F3350):\n
  \       \U0001D544(Φ.a\U0001F3350):\n          \U0001D45B·1·1 := 5\n          \U0001D45B·1·2
  := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·1 := 40-14-00-00-00-00-00-00
  \ # 5.0\n      \U0001D6FF1·1 := \U0001D6FF·1·1  # \U0001D53B(ξ.ρ)\n      \U0001D53B(Φ.a\U0001F3351):\n
  \       \U0001D544(Φ.a\U0001F3351):\n          \U0001D45B·1·3 := 6\n          \U0001D45B·1·4
  := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )\n        \U0001D6FF·1·2 := 40-18-00-00-00-00-00-00
  \ # 6.0\n      \U0001D6FF2·1 := \U0001D6FF·1·2  # \U0001D53B(ξ.x)\n      \U0001D45B·1·5
  := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n      \U0001D544(\U0001D45B·1·5):\n
  \       \U0001D45B·1·6 := Φ.number( φ ↦ \U0001D70E1:λ )\n      \U0001D45B·1·7 :=
  \U0001D45B·1·6  # \U0001D544(\U0001D45B·1·5)\n  unanswered(L_number_nope)  # \U0001D53B(L_number_nope:λ)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nThe very same file comes back with `--partial`,
  where the run answers the\nresidue instead of failing: what `phino` could not decide
  is a property of the\nprogram and not of the option that decides what to do about
  it.\n\nFour more lines say why a firing gave no answer.\n`stuck(L_outer)` is the
  last line of a firing that got stuck, naming the λ\nfunction it got stuck on, which
  is seldom the one `unanswered(…)` names: that\none is written where it was asked
  for, and this one closes every firing the\nfailure passed on its way out.\n`unjoined(L_fork)`
  takes its place in the firing whose `join` line could not\npair its two branches,
  and carries them as the join last saw them,\n`unjoined(L_fork)  # \U0001D70E1:λ:l
  vs ⟦ l ↦ \U0001D70E2:λ, x ↦ ⟦⟧ ⟧`, so a fork the program\nleft in two shapes never
  reads as an operand that ran out of steps; the\nfirings around it still close with
  `stuck(L_fork)`.\n`stall(L_outer)` stands under a firing that `--acyclic=plausible`
  answered\nwith the stall an earlier firing of the same formation kept, so a told
  stall\nnever reads as a fresh firing that wrote nothing.\n`starved(3)` is where
  `--max-steps=3` ran out, whether or not `--partial` goes\non to park it. It stands
  in the block of the judgment and the site the\nreduction stood at, and where the
  budget ran out before that block could open,\nright in a firing, it is commented
  with them instead, `starved(3)  # \U0001D53B(Φ.a\U0001F3352)`:\n\n```text\n\U0001D544(Φ.x):\n
  \ \U0001D544(Φ.x.arg):\n    \U0001D53C(L_outer):\n      \U0001D53B(Φ.a\U0001F3350):\n
  \       starved(3)\n      stuck(L_outer)\n  \U0001D53C(L_outer):\n    \U0001D53B(Φ.a\U0001F3351):\n
  \     \U0001D53C(L_outer):\n        starved(3)  # \U0001D53B(Φ.a\U0001F3352)\n    stuck(L_outer)\n```\n\nThe
  markup spells them `<stuck λ=\"L_outer\"/>`,\n`<unjoined λ=\"L_fork\"><e>\U0001D70E1:λ:l</e><e>⟦
  l ↦ \U0001D70E2:λ, x ↦ ⟦⟧ ⟧</e></unjoined>`,\n`<stall λ=\"L_outer\"/>` and `<starved
  limit=\"3\" by=\"dataize\" at=\"Φ.a\U0001F3352\"/>`.\n\n`timeout(5)` is where `--max-seconds=5`
  ran out, placed and commented the same\nway and written at the first step the deadline
  refused.\nThe run ends there, with or without `--partial`, so it is always the last
  line\nof the protocol.\nThe markup spells it `<timeout limit=\"5\" by=\"morph\"
  at=\"…\"/>`.\n\n`spent(3)` is where `--max-firings=3` ran out, placed and commented
  the same\nway and written where the firing it refused would have started.\nThe markup
  spells it `<spent limit=\"3\" by=\"dataize\" at=\"…\"/>`.\n\nEvery term is \U0001D711
  on a single line, whatever `--output` and `--flat` say about\nthe result of the
  run, so a program reading the protocol back never has to know\nwhat the run printed.
  The file is truncated at the beginning of every run, so\nit always holds the firings
  of exactly one run.\n\nThe blocks come in the order the reduction walks the term,
  and that order is\nnot what the dependencies are read from — the symbols are. Take
  a comparison\nnobody can decide, a fork branching on it, and an `atoms.yaml` of
  three\nentries, the λ functions named briefly to keep the lines below short:\n\n```yaml\n-
  λ: L_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B:
  Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_gt\n  dataize:\n    \U0001D6FF1: $.ρ\n
  \   \U0001D6FF2: $.x\n  \U0001D45B: Φ.bool( if ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦
  ∅, φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ ⟧ )\n- λ: L_fork\n  dataize:\n    \U0001D6FF1: $.φ\n  morph:\n
  \   \U0001D45B1: $.then\n    \U0001D45B2: $.else\n  evaluate:\n    \U0001D45B3:
  \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n    \U0001D45B5: [\U0001D45B3,
  \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\n<!-- markdownlint-disable MD013
  -->\n\n```bash\n$ cat fork.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  bool ↦ ⟦ if ↦ ∅ ⟧,\n
  \ number ↦ ⟦ φ ↦ ∅, plus(ρ, x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(ρ, x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧,\n  foo(x)
  ↦ ⟦\n    φ ↦ ξ.x.gt( 0 ).if( ξ.x.plus( ξ.x.plus( 1 ) ), ξ.x.plus( ξ.x ) ).plus(
