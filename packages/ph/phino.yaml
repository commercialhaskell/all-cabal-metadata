description: "<!--\nSPDX-FileCopyrightText: Copyright (c) 2025 Objectionary.com\nSPDX-License-Identifier:
  MIT\n-->\n\n# Command-Line Manipulator of \U0001D711-Calculus Expressions\n\n[![DevOps
  By Rultor.com](https://www.rultor.com/b/objectionary/phino)](https://www.rultor.com/p/objectionary/phino)\n\n[![`phino`
  on Hackage](https://img.shields.io/hackage/v/phino)](http://hackage.haskell.org/package/phino)\n[![cabal-linux](https://github.com/objectionary/phino/actions/workflows/cabal.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/cabal.yml)\n[![stack-linux](https://github.com/objectionary/phino/actions/workflows/stack.yml/badge.svg)](https://github.com/objectionary/phino/actions/workflows/stack.yml)\n[![codecov](https://codecov.io/gh/objectionary/phino/branch/master/graph/badge.svg)](https://app.codecov.io/gh/objectionary/phino)\n[![Haddock](https://img.shields.io/badge/docs-Haddock-blue.svg)](https://objectionary.github.io/phino/)\n[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSES/MIT.txt)\n[![Hits-of-Code](https://hitsofcode.com/github/objectionary/phino?branch=master&label=Hits-of-Code)](https://hitsofcode.com/github/objectionary/phino/view?branch=master&label=Hits-of-Code)\n[![PDD
  status](https://www.0pdd.com/svg?name=objectionary/phino)](https://www.0pdd.com/p?name=objectionary/phino)\n\nThis
  is a command-line normalizer, rewriter, and dataizer\nof [\U0001D711-calculus](https://www.eolang.org)
  expressions.\n\nFirst, you write a simple [\U0001D711-calculus](https://www.eolang.org)
  expression\nin the `hello.phi` file:\n\n```text\n⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧, t
  ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\n## Installation\n\nThen you can install `phino` in two ways:\n\nInstall
  [Cabal][cabal] first and then:\n\n```bash\ncabal update\ncabal install --overwrite-policy=always
  phino-0.0.136\nphino --version\n```\n\nOr download binary from the internet using
  [curl](https://curl.se/) or\n[wget](https://en.wikipedia.org/wiki/Wget):\n\n```bash\nsudo
  curl -o /usr/local/bin/phino http://phino.objectionary.com/releases/macos-15/phino-latest\nsudo
  chmod +x /usr/local/bin/phino\nphino --version\n```\n\nDownload paths are:\n\n*
  Ubuntu 22.04: <http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest>\n*
  Ubuntu 24.04: <http://phino.objectionary.com/releases/ubuntu-24.04/phino-latest>\n*
  MacOS (ARM): <http://phino.objectionary.com/releases/macos-15/phino-latest>\n* MacOS
  (Intel): <http://phino.objectionary.com/releases/macos-14-large/phino-latest>\n*
  Windows: <http://phino.objectionary.com/releases/windows-2022/phino-latest.exe>\n\n##
  Build\n\nTo build `phino` from source, clone this repository:\n\n```bash\ngit clone
  git@github.com:objectionary/phino.git\ncd phino\n```\n\nThen, run the following
  command (ensure you have [Cabal][cabal] installed):\n\n```bash\ncabal build all\n```\n\nNext,
  run this command to install `phino` system-wide:\n\n```bash\nsudo cp \"$(cabal list-bin
  phino)\" /usr/local/bin/phino\n```\n\nVerify that `phino` is installed correctly:\n\n```bash\n$
  phino --version\n0.0.0\n```\n\nYou can ensure scripts are run with a specific version
  of `phino` using\nthe `--pin` global option. It exits with an error when the version
  supplied\ndoesn't match the installed one:\n\n```bash\nphino --pin=0.0.0.67 dataize
  hello.phi\n```\n\n## Dataize\n\nThen, you dataize the expression:\n\n```bash\n$
  phino dataize hello.phi\n68-65-6C-6C-6F\n```\n\n### Symbolic λ functions\n\nWhich
  λ functions exist is a property of the object model being dataized, not\nof the
  calculus, so `phino` implements none of them. They come from a YAML file\ngiven
  with `--symbolic`, one entry per λ function:\n\n```yaml\n- λ: L_number_(plus|times)\n
  \ dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B: Φ.number(
  φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n```\n\nThe `λ` of an entry is the λ names it answers for,
  as a regular expression, so\nthe one above stands for `L_number_plus` and `L_number_times`.
  Under `dataize`\nstand the operands it brings down to data through \U0001D53B, each
  binding a bytes meta\n`\U0001D6FF1`, `\U0001D6FF2` and so on; under `morph` the
  operands it reduces to a normal\nform through \U0001D544, each binding an expression
  meta `\U0001D45B1`, `\U0001D45B2`. Both blocks are\nterms of the calculus, read
  against the formation being fired, so `ξ` is that\nformation and `$.x` its `x`,
  while `Φ` is the universe. Every entry numbers its\nown metas from `\U0001D6FF1`
  and `\U0001D45B1`, and the entry is what tells two `\U0001D6FF1` apart.\n\nThe term
  under `\U0001D45B` is what the firing answers with. `phino` normalizes it\nexactly
  as it normalizes anything else, so `--protocol`, `--partial` and\n`--max-steps`
  work on it unchanged. It may name any meta the entry bound,\nthose of the two blocks
  below among them.\n\n### Standing data into unknowns\n\nThere is a third block,
  `symbolize`, and it reduces nothing. It takes a term\nanother meta of the entry
  is already bound to and binds an expression meta of\nits own to that same term with
  every datum in it standing for an unknown:\n\n```yaml\n- λ: L_fork\n  dataize:\n
  \   \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n
  \ symbolize:\n    \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  \U0001D45B:
  \U0001D45B3\n```\n\nThe right-hand side of a line names a meta bound by `morph`
  or by a\n`symbolize` line above it, and nothing else; a term nobody reduced has
  no data\nto stand. Every `Δ ⤍ b` binding of that term becomes a `λ ⤍ \U0001D70Ek`
  naming a\nfresh symbol, one per occurrence, so `⟦ Δ ⤍ b ⟧` reads as `⟦ λ ⤍ \U0001D70Ek
  ⟧` and a\nliteral tuple gets several. A term carrying no datum passes through as
  it was.\n\nOnly the `φ` chain is walked. A term carries the value it stands for
  where\nthat chain ends, so a datum standing anywhere else says nothing about the
  term\nand is left alone, the whole subtree of it. What sits under `ρ` belongs to
  the\nobject around this one, and a normal form drags the universe it was reduced\ninside
  along under `ρ`, so a walk reaching into it would stand the data of the\nwhole program
  into unknowns to say one thing about one term. What sits under a\nmethod is code
  and not data: the `-1` of a `neg ↦ ⟦ φ ↦ ξ.ρ.times( -1 ) ⟧`\nnobody has called is
  the body of a method, and minting a symbol for it, and for\nevery other literal
  every method of the carrier declares, would write unknowns\nnobody ever reads.\n\nThis
  is what lets an entry compare two branches of a fork. A literal is sugar\nfor `Φ.number(
  Φ.bytes( ⟦ Δ ⤍ … ⟧ ) )`, so a branch computed from a literal\nkeeps a datum three
  levels down where a branch computed from an unknown keeps\n`⟦ λ ⤍ \U0001D70E ⟧`.
  A `Δ` against a `λ` is a difference in kind and not in value, and\nafter the stage
  both branches carry `⟦ λ ⤍ \U0001D70E ⟧` where they differ.\n\n### Joining the branches
  of a fork\n\nA branching λ function answers neither of its branches. Which one the
  program\ntakes is decided by a value nobody worked out, so handing one of them through\nwould
  drop the branch point from the program altogether and a reader would see\nthe condition
  computed and thrown away. `join` is the fourth block, and it\nreduces nothing either:
  it takes two metas the entry has bound already and\nbinds one of its own to the
  two terms joined into one.\n\n```yaml\n- λ: L_fork\n  dataize:\n    \U0001D6FF1:
  $.φ\n  morph:\n    \U0001D45B1: $.left\n    \U0001D45B2: $.right\n  symbolize:\n
  \   \U0001D45B3: \U0001D45B1\n    \U0001D45B4: \U0001D45B2\n  join:\n    \U0001D45B5:
  [\U0001D45B3, \U0001D45B4]\n  \U0001D45B: \U0001D45B5\n```\n\nA line names two metas
  bound by `morph`, by `symbolize` or by a `join` line\nabove it, and never three:
  it stands for a choice between two branches, and a\nwalk over three terms in parallel
  is no such choice. The meta it binds is one\nlike any other, so the answer may name
  it alone, as above, or stand it inside a\nlarger term.\n\n`phino` takes the two
  terms and requires them to match verbatim, with one\nexception: where `⟦ λ ⤍ \U0001D70EA
  ⟧` in one meets a different `⟦ λ ⤍ \U0001D70EB ⟧` in the\nother, it mints a fresh
  `\U0001D70EC` and stands it there. The same symbol on both sides\nstays as it is,
  and the same pair met again further down gets the same fresh\nsymbol, since it is
  one choice however often the two terms differ by it; two\ndifferent pairs get two
  fresh symbols. Two identical terms join into that same\nterm and nothing is minted
  at all. The join keeps the type by construction,\nbeing the terms' own shape, so
  the file needs to know nothing about carriers.\n\nOnly the `φ` chain is compared,
  exactly as `symbolize` stands only that chain\ninto unknowns: a term carries the
  value it stands for where its `φ` chain ends,\nso every other binding is taken from
  the first branch, the whole subtree of it,\nand never compared at all. The two branches
  of a fork reach their normal forms\nin scopes of their own, so their `ρ` differ
  wherever the reduction left a\ntrace, and comparing them would refuse the join over
  something saying nothing\nabout either branch; a method is the same, its body being
  code nobody has\ncalled, so two branches differing inside one are not two values.
  The joined\nterm keeps the methods and the `ρ` of the first of the two, being of
  its shape,\nwhich is what lets the program go on dispatching on what the fork answered.\n\nA
  join is only ever between two expressions and a datum is never joined with\nanything,
  which is why `symbolize` runs before it: a known symbol, one that\nstage minted
  for a datum, is a symbol like any other here, so a literal branch\njoins with a
  computed one and two literal branches join too. Any other\ndifference — a datum
  against a symbol, two different data, a binding one term\ncarries and the other
  does not — is no join at all, and the firing gets stuck\nthe way a λ function no
  entry answers does, so `--partial` parks it rather than\naborting the run. A fork
  whose branches differ in structure, such as a `Φ.true`\nand a `Φ.false` written
  as `φ ↦ ξ.left` against `φ ↦ ξ.right`, is stuck, and\nbringing two such branches
  to one shape is the program's job and not `phino`'s.\n\nEvery symbol a join mints
  is written into the protocol as a fact of its own,\nso a reader ties it to the two
  it stands for without diffing the terms; the\nsection on `--protocol` below shows
  one.\n\n### Symbols\n\nAn entry answers, it never computes. The job of these functions
  is symbolic\nmorphing: what `5.plus( 6 )` comes to is the arithmetic of the object
  model and\nnot `phino`'s, so an entry answers a term carrying a symbol standing
  for a\nvalue nobody worked out, and the data its `dataize` operands came down to
  is\nnot its to read. An answer mentioning a `\U0001D6FF` is refused where the file
  is read.\n\n`\U0001D70E` is a meta of the calculus, beside `\U0001D45B`, `\U0001D6FF`
  and `\U0001D453`, and it stands where\na λ name stands. In a term, `\U0001D70E1`
  is a concrete symbol: a λ function nothing\nanswers, which is what makes the value
  the term carries unknown. Firing it is\ntherefore the same question as firing a
  λ name the `--symbolic` file does not\ncarry, and gets the same answer: \U0001D53C
  stops there, the protocol records the site as\n`?(\U0001D70E1)`, and `--partial`
  leaves the term where it stands. Dispatching an\nattribute off a symbol — `⟦ λ ⤍
  \U0001D70E1 ⟧.plus( 5 )` — therefore taints its own\nbinding and nothing else; what
  stands beside it still computes. In an answer, a\nbare `\U0001D70E` asks for a fresh
  one, minted as the firing happens and numbered by the\nrun, so no two unknowns are
  ever spelled alike. Minting starts after the symbols\nthe program already carries,
  so a run over the \U0001D711-program an earlier run wrote\nnever spells a fresh
  symbol like one already standing there.\n\nDataizing a symbol never gets stuck.
  It answers a fixed datum, 42\n(`40-45-00-00-00-00-00-00`), the same one for every
  symbol, so \U0001D53B always\nanswers, a `\U0001D6FF` always holds concrete data
  and no firing ever declines for the\nlack of it:\n\n```bash\n$ cat sum.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,\n  φ
  ↦ 5.plus( 6 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet --hide-rho sum.phi\n40-45-00-00-00-00-00-00\n```\n\n###
  The keys of the file\n\nEach `λ` is a regular expression, and it must match the
  whole λ name, so a\nplain name such as `L_number_plus` means that one function and
  nothing else,\nwhile `L_number_.*` stands for every function of `number`. The keys
  are unique:\nnothing tells two entries under one key apart, so a second entry under
  a key is\nunreachable and the file is refused rather than merely redundant.\n\nA
  λ name no key matches has no λ function at all, so \U0001D53C gets stuck on it.\nWithout
  `--symbolic` there is no entry at all and every λ function gets stuck:\n\n```bash\n$
  phino dataize --sweet --hide-rho sum.phi\n[ERROR]: No entry of --symbolic answers
  the λ function 'L_number_plus'\n```\n\nThe file is read before anything is parsed
  or reduced, so a key that is no\nregular expression, an operand that is no meta
  of the kind its block binds, or\nan answer the calculus cannot read fails the run
  up front rather than half-way\nthrough a derivation.\n\n### Recording what fired\n\nEvery
  λ function fired on the way to the answer may be recorded in a\nmachine-readable
  protocol, with the `--protocol` option. The protocol is a\ntree: the run at the
  top, one block per firing under it, and inside the block\nthe operands the firing
  bound and the term it answered with.\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho sum.phi\n$ cat atoms.txt\n\U0001D53B(Φ)\n  \U0001D53C(L_number_plus)
  \ # \U0001D53B(Φ)\n    \U0001D6FF1.1 := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)\n
  \   \U0001D6FF2.1 := 40-18-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n    \U0001D45B.1.1
  := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n    \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # \U0001D544(\U0001D45B.1.1)\n```\n\n<!-- markdownlint-enable
  MD013 -->\n\n`\U0001D53B(…)` is the run and the term it was aimed at, `\U0001D544(…)`
  where the run is a\nmorphing, and `\U0001D53C(…)` is one firing, named by the entry
  that answered it and\ncommented with the judgment that asked for it and the site
  it was fired at.\nEvery comment of the file is of that shape: a judgment applied
  to a term, which\nis the intent the value beside it came from. The firings are numbered
  across the\nwhole run, in the order they open, so `\U0001D6FF1.2` is the value bound
  to `\U0001D6FF1` by\nthe second firing of the run, whichever λ function that was,
  `\U0001D45B1.2` the same\nfor a `morph` meta, and `\U0001D45B.3.2` the answer of
  the third firing, so\n`\U0001D45B1.2 := \U0001D45B.3.2` reads \"the `\U0001D45B1`
  of this firing is what the third firing\nanswered\". One firing binds a meta once
  and no two firings\nshare a number, so every one of these names stands on exactly
  one line of the\nfile and a line naming another one points at it and no other.\n\nAn
  answer stands on two lines and not one. A firing answers the term its entry\nwrote
  and `phino` morphs that term before standing it back into the program, so\n`\U0001D45B.1.1`
  is what the entry wrote, with the symbols this firing minted already in\nit, commented
  with `\U0001D45B` to name the key it was read from, and `\U0001D45B.1.2` is the\nnormal
  form \U0001D544 made of it, commented with `\U0001D544(\U0001D45B.1.1)` to say where
  it came from.\nIt is the same morphing every other term goes through, and writing
  only its\noutcome would have the formation of `number` appear in place of the three\ntokens
  the entry wrote with nothing saying why. Whatever that morphing fires\nopens its
  own block between the two lines, exactly where a firing an operand\ntook opens one,
  so the order the lines come in is the order the work was done\nin.\n\nWhere an operand
  came down to the datum a symbol stands for, the protocol writes\n`\U0001D53B(\U0001D70E1:λ)`
  in place of that 42 (`\U0001D70E1:λ` is the formation `⟦ λ ⤍ \U0001D70E1 ⟧`, in
  the\nsugar every sweet term is written with), so a reader sees that the value was\nmanufactured
  rather than read out of the program. A `\U0001D70E` is the name of a λ\nfunction
  and no term of its own, so \U0001D53B is applied to the formation carrying it\nand
  never to the name alone.\n\nA `symbolize` line writes a line per fresh symbol it
  minted, ahead of the line\nbinding the term that carries them, and that line is
  a fact and no assignment:\n`\U0001D53B(\U0001D70E44:λ) == 3F-F0-00-00-00-00-00-00`
  says that dataizing the formation\n`\U0001D70E44` names answers those bytes. Nothing
  binds bytes to a `\U0001D70E`, since it is\nneither a datum nor a term. A consumer
  reading the protocol back treats a\nsymbol with such a fact as a constant and every
  other symbol as an unknown.\n\nThe line binding the term of a `symbolize` one is
  commented with the meta it\nwas told to stand, `\U0001D45B3.1 := ⟦ λ ⤔ \U0001D7068
  ⟧  # \U0001D45B1`, and with no judgment\naround it: standing the data of a term
  into unknowns is the file's own\noperation and nothing of the calculus runs there,
  so the line names a meta of\nthe entry the way a `join` line names the two it joined.
  A comment carries the\nletter of a judgment exactly where a judgment made the value.\n\nThe
  site of a firing is a locator, written as a comment the way an operand\nline writes
  the term it came from, under the letter of the judgment that asked\nfor the firing:
  \U0001D53C is fired by the `ml` rule of morphing and by the `fire` rule\nof dataization,
  so `\U0001D544(Φ.demo.a.φ)` is a λ function fired while \U0001D544 was reducing\nthat
  binding and `\U0001D53B(Φ)` one fired because dataization demanded data of `Φ`.\nA
  chain such as `5.plus( 6 ).plus( 7 )` writes both: the inner call is fired\nwhile
  \U0001D544 reduces the head of the outer dispatch, the outer one because \U0001D53B
  asked\nfor the data. The site itself is where in the program the firing\nbelongs:
  the term the run was aimed at, so `Φ` for a run that was aimed at\nnothing in particular,
  and, under `--deep`, the binding the walk had entered\nwhen the λ function fired,
  since that walk reduces every part of the program\nin turn and one entry answers
  the same way wherever it is fired. A locator\nnames a binding and reaches no further,
  so a firing standing deeper inside a\nterm than that — under a dispatch, or in the
  argument of an application — is\nwritten under the last binding the walk entered,
  which is the smallest part of\nthe program a reader can aim a run of their own at.
  An operand of a firing is\nreduced bound to a synthetic attribute of the universe
  (see `--inside` below),\nso a λ function fired while it came down is written under
  that attribute and\nnot under the site of the firing that asked for it.\n\nAn operand
  line ends in the judgment that reduced it and the term it was\nreduced from, written
  as a comment after two spaces and `#`. The value alone\nsays what the meta was bound
  to and neither what it was bound from nor what\nwas done to it, so `\U0001D6FF1.1
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)` reads \"the\n`\U0001D6FF1` of this
  firing is the `ρ` of the formation brought down through \U0001D53B, and\nit came
  down to 20\", where a `morph` operand reads `\U0001D45B1.5 := \U0001D45B.3.2  #
  \U0001D544(ξ.then)`\nand says that the `then` of the formation reached its normal
  form through \U0001D544.\nWhich of the two judgments ran is the whole difference
  between a line ending\nin data and one ending in a term. It is the very term the
  entry wrote under\nthat meta, spelled the way the calculus reads it — `$` is read
  as `ξ` — so a\nreader never has to open the `--symbolic` file beside the protocol
  and match\nevery line by λ name and meta number.\n\n`?(…)` is a λ name no entry
  answers, standing where the block of its firing\nwould have stood. Nothing fired,
  so nothing opens under it. The line is\ncommented with the judgment that asked and
  the formation it was asking about,\n`\U0001D544(L_none:λ)`, the way an operand line
  is commented with the term it was\nreduced from: \U0001D53C is fired by the `ml`
  rule of morphing and by the `fire` rule\nof dataization, so the letter says where
  in the reduction the site stands and\nthe term says which object the λ function
  that could not fire belongs to. It\nis written\nwhether or not `--partial` goes
  on to park the run, since the protocol records\nwhat \U0001D53C was asked for, and
  a question it could not answer belongs there as much\nas one it could — once per
  site and not once per attempt, since a site\n`--partial` parks stays in the residue
  and `--deep` walks over it again:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.txt --quiet \\\n    --sweet
  --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_nope'\n$
  cat atoms.txt\n\U0001D53B(Φ)\n  \U0001D53C(L_number_plus)  # \U0001D544(Φ)\n    \U0001D6FF1.1
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.1 := 40-18-00-00-00-00-00-00
  \ # \U0001D53B(ξ.x)\n    \U0001D45B.1.1 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n
  \   \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, nope
  ↦ L_number_nope:λ ⟧  # \U0001D544(\U0001D45B.1.1)\n  ?(L_number_nope)  # \U0001D53B(L_number_nope:λ)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\nThe very same file comes back with `--partial`,
  where the run answers the\nresidue instead of failing: what `phino` could not decide
  is a property of the\nprogram and not of the option that decides what to do about
  it.\n\nEvery term is \U0001D711 on a single line, whatever `--output` and `--flat`
  say about\nthe result of the run, so a program reading the protocol back never has
  to know\nwhat the run printed. The file is truncated at the beginning of every run,
  so\nit always holds the firings of exactly one run.\n\nThe blocks come in the order
  the reduction walks the term, and that order is\nnot what the dependencies are read
  from — the symbols are. Take a comparison\nnobody can decide, a fork branching on
  it, and an `atoms.yaml` of three\nentries, the λ functions named briefly to keep
  the lines below short:\n\n```yaml\n- λ: L_plus\n  dataize:\n    \U0001D6FF1: $.ρ\n
  \   \U0001D6FF2: $.x\n  \U0001D45B: Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )\n- λ: L_gt\n
  \ dataize:\n    \U0001D6FF1: $.ρ\n    \U0001D6FF2: $.x\n  \U0001D45B: Φ.bool( if
  ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦ ∅, φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ ⟧ )\n- λ: L_fork\n  dataize:\n
  \   \U0001D6FF1: $.φ\n  morph:\n    \U0001D45B1: $.then\n    \U0001D45B2: $.else\n
  \ join:\n    \U0001D45B3: [\U0001D45B1, \U0001D45B2]\n  \U0001D45B: \U0001D45B3\n```\n\n<!--
  markdownlint-disable MD013 -->\n\n```bash\n$ cat fork.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅
  ⟧,\n  bool ↦ ⟦ if ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦
  ⟦ λ ⤍ L_gt ⟧ ⟧,\n  foo(x) ↦ ⟦\n    φ ↦ ξ.x.gt( 0 ).if( ξ.x.plus( ξ.x.plus( 1 ) ),
  ξ.x.plus( ξ.x ) ).plus( 5 )\n  ⟧,\n  demo ↦ ⟦ a ↦ Φ.foo( Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E1
  ⟧ ) ) ⟧\n⟧\n$ phino morph --deep --symbolic=atoms.yaml --locator=Q.demo.a \\\n    --protocol=fork.txt
  --quiet --sweet --hide-rho fork.phi\n$ cat fork.txt\n\U0001D544(Φ.demo.a)\n  \U0001D53C(L_gt)
  \ # \U0001D544(Φ.demo.a.φ)\n    \U0001D6FF1.1 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n
  \   \U0001D6FF2.1 := 00-00-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n    \U0001D45B.1.1
  := Φ.bool( if ↦ ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦ ∅, φ ↦ \U0001D70E2:λ ⟧ )  # \U0001D45B\n
  \   \U0001D45B.1.2 := ⟦ λ ⤍ L_fork, then ↦ ∅, else ↦ ∅, φ ↦ \U0001D70E2:λ ⟧:if  #
  \U0001D544(\U0001D45B.1.1)\n  \U0001D53C(L_plus)  # \U0001D544(Φ.demo.a.φ)\n    \U0001D6FF1.2
  := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.2 := 3F-F0-00-00-00-00-00-00
  \ # \U0001D53B(ξ.x)\n    \U0001D45B.2.1 := Φ.number( φ ↦ \U0001D70E3:λ )  # \U0001D45B\n
  \   \U0001D45B.2.2 := ⟦ φ ↦ \U0001D70E3:λ, plus(x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦ ⟦ λ
  ⤍ L_gt ⟧ ⟧  # \U0001D544(\U0001D45B.2.1)\n  \U0001D53C(L_plus)  # \U0001D544(Φ.demo.a.φ)\n
  \   \U0001D6FF1.3 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.3
  := \U0001D53B(\U0001D70E3:λ)  # \U0001D53B(ξ.x)\n    \U0001D45B.3.1 := Φ.number(
  φ ↦ \U0001D70E4:λ )  # \U0001D45B\n    \U0001D45B.3.2 := ⟦ φ ↦ \U0001D70E4:λ, plus(x)
  ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧  # \U0001D544(\U0001D45B.3.1)\n  \U0001D53C(L_plus)
  \ # \U0001D544(Φ.demo.a.φ)\n    \U0001D6FF1.4 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.ρ)\n
  \   \U0001D6FF2.4 := \U0001D53B(\U0001D70E1:λ)  # \U0001D53B(ξ.x)\n    \U0001D45B.4.1
  := Φ.number( φ ↦ \U0001D70E5:λ )  # \U0001D45B\n    \U0001D45B.4.2 := ⟦ φ ↦ \U0001D70E5:λ,
  plus(x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧  # \U0001D544(\U0001D45B.4.1)\n
  \ \U0001D53C(L_fork)  # \U0001D544(Φ.demo.a.φ)\n    \U0001D6FF1.5 := \U0001D53B(\U0001D70E2:λ)
  \ # \U0001D53B(ξ.φ)\n    \U0001D45B1.5 := \U0001D45B.3.2  # \U0001D544(ξ.then)\n
  \   \U0001D45B2.5 := \U0001D45B.4.2  # \U0001D544(ξ.else)\n    \U0001D53B(\U0001D70E6:λ)
  ∈ { \U0001D53B(\U0001D70E4:λ), \U0001D53B(\U0001D70E5:λ) }\n    \U0001D45B3.5 :=
  ⟦ φ ↦ \U0001D70E6:λ, plus(x) ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧  # [\U0001D45B1,
  \U0001D45B2]\n    \U0001D45B.5.1 := \U0001D45B3.5  # \U0001D45B\n    \U0001D45B.5.2
  := \U0001D45B3.5  # \U0001D544(\U0001D45B.5.1)\n  \U0001D53C(L_plus)  # \U0001D544(Φ.demo.a.φ)\n
  \   \U0001D6FF1.6 := \U0001D53B(\U0001D70E6:λ)  # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.6
  := 40-14-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n    \U0001D45B.6.1 := Φ.number( φ
  ↦ \U0001D70E7:λ )  # \U0001D45B\n    \U0001D45B.6.2 := ⟦ φ ↦ \U0001D70E7:λ, plus(x)
  ↦ ⟦ λ ⤍ L_plus ⟧, gt(x) ↦ ⟦ λ ⤍ L_gt ⟧ ⟧  # \U0001D544(\U0001D45B.6.1)\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n`\U0001D70E3` is minted by the second firing and
  consumed by the third as\n`\U0001D53B(\U0001D70E3:λ)`, and `\U0001D70E2` by the
  first and consumed by the fork. `\U0001D70E4` and\n`\U0001D70E5` are what the two
  branches came to, and the fork consumes both: its `join`\nline makes them one term
  carrying `\U0001D70E6`, which the `plus( 5 )` standing after\nthe fork then reads
  as `\U0001D53B(\U0001D70E6:λ)`. The line\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ),
  \U0001D53B(\U0001D70E5:λ) }` is what ties the three\ntogether: dataizing the formation
  `\U0001D70E6` names answers what dataizing one of the\nother two answers. A reader
  who knows the entry knows that `\U0001D6FF1` is what decides\nbetween them and that
  the first of the two belongs to `then`. Nothing is\nassigned to a `\U0001D70E`,
  it being the name of a λ function, so the fact stands on a\nline of its own the
  way what a `symbolize` line knows does, and the line under\nit binds the meta, commented
  with the two metas it joined.\n\nWere the fork to answer one of its branches instead,
  the value of the other\nwould be minted and never consumed, and `foo` would read
  as a program that\ncomputes a condition, computes both branches and then drops the
  branch point.\n\nAll six firings stand under `Φ.demo.a.φ`, which is as near as a
  locator gets\nto any of them: the walk entered the `φ` of the formation `Φ.demo.a`
  morphs to,\nand everything under it — the dispatches of the chain, the arguments
  of `if` —\nstands under no attribute of any formation, so the binding the walk had
  entered\nis what the protocol writes them under.\n\nA firing that happened while
  an operand of another was being reduced stands one\nlevel deeper, under the firing
  that asked for it. Here it never happens,\nbecause deep morphing reduces both branches
  where they sit as arguments of\n`if`, long before the dispatch that fires the fork.\n\n###
  The protocol as XML\n\nThe name of the file decides which of the two formats `--protocol`
  writes: a\nname ending in `.xml` gets the same tree as markup, every other name
  gets the\nindented text above. There is no option for it, since a caller who asks
  for a\nfile called `atoms.xml` and gets text back has been told nothing useful.
  Here\nis the run at the top of this section again:\n\n```bash\n$ phino dataize --symbolic=atoms.yaml
  --protocol=atoms.xml --quiet \\\n    --sweet --hide-rho sum.phi\n$ cat atoms.xml\n<?xml
  version=\"1.0\" encoding=\"UTF-8\"?>\n<dataize locator=\"Φ\">\n  <evaluate λ=\"L_number_plus\"
  id=\"1\" judgment=\"dataize\" locator=\"Φ\">\n    <bind meta=\"\U0001D6FF1.1\">40-14-00-00-00-00-00-00</bind>\n
  \   <bind meta=\"\U0001D6FF2.1\">40-18-00-00-00-00-00-00</bind>\n    <minted>\U0001D70E1</minted>\n
  \   <built meta=\"\U0001D45B.1.1\">Φ.number( φ ↦ \U0001D70E1:λ )</built>\n    <answer
  meta=\"\U0001D45B.1.2\">⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧</answer>\n
  \ </evaluate>\n</dataize>\n```\n\nThe root is the run itself, named after the judgment
  it ran — `<dataize>` for a\n\U0001D53B, `<morph>` for a \U0001D544 — with `locator`
  naming the term it was aimed at, which is\nwhat the text format opens with as `\U0001D53B(Φ)`.
  `<evaluate>` is one firing of \U0001D53C, `λ`\nnaming the entry that answered it,
  `id` numbering it within the run, `judgment`\nnaming the one that asked for the
  firing — the same word the root and a\n`<stuck>` carry — and `locator` naming the
  site it was fired at. The text\nformat writes those two as the comment of its line,
  `\U0001D53B(Φ)`.\n`<bind>` is one meta the firing bound, `meta` naming it the same
  way the text\nformat names it, counter and all, and the element holding the value
  it took: a\nterm where the operand was reduced with \U0001D544, the datum itself
  where a `dataize`\noperand came down to data. `<dataize>` inside a firing is the
  other thing a\n`dataize` operand may come to, the datum manufactured for an unknown,
  and holds\nthe formation that unknown names rather than the 42 standing for it:
  a `\U0001D70E` is\nthe name of a λ function and no term of its own, so what \U0001D53B
  was applied to is\n`\U0001D70E2:λ` and never `\U0001D70E2` alone. It carries `meta`
  where the root carries\n`locator`, the same difference the text format draws between
  `\U0001D53B(Φ)` at the top\nand `\U0001D6FF1.2 := \U0001D53B(…)` in a block. The
  name of the element is what tells a\nmanufactured datum from data, the way `\U0001D53B(…)`
  does in the text format, so\nnothing has to be read off the presence of an attribute.
  `<answer>` holds the\nterm the firing answered with, named the same way by its own
  `meta`, and\n`<built>` before it holds the term the entry wrote, the one \U0001D544
  made that answer\nof: two elements rather than two attributes of one, for the same
  reason\n`<dataize>` is no `<bind>`.\n\n`<known symbol=\"\U0001D70E44\">3F-F0-00-00-00-00-00-00</known>`
  is the fact a `symbolize`\nline writes about a symbol it minted, which the text
  format writes as\n`\U0001D53B(\U0001D70E44:λ) == …`: the symbol stands in the attribute
  a reader joins\nlines on and the data dataizing its formation answers are the text
  of the\nelement. It takes `symbol` and not `meta`, since the fact is about the unknown\nand
  not about a meta the firing bound.\n\n`<joined symbol=\"\U0001D70E6\">\U0001D70E4
  \U0001D70E5</joined>` is the same kind of fact about a symbol\na `join` line minted,
  which the text format writes as\n`\U0001D53B(\U0001D70E6:λ) ∈ { \U0001D53B(\U0001D70E4:λ),
  \U0001D53B(\U0001D70E5:λ) }`: the fresh symbol stands\nin `symbol` and the two it
  was minted for are the text, in the order the line\nlisted the metas it joined.
  A line whose two terms differ at several places\nwrites one element per pair of
  symbols, and one whose terms are alike writes\nnone. The meta the line binds is
  a `<bind>` like every other meta of the\nfiring.\n\n`<minted>\U0001D70E1</minted>`
  is one symbol the firing minted, one element per bare `\U0001D70E`\nthe entry wrote
  its answer with, standing inside the block ahead of the\n`<built>` carrying them.
  That is the edge a reader joins on: a later\n`<dataize meta=\"\U0001D6FF1.5\">\U0001D70E2:λ</dataize>`
  names the symbol the firing that\nwrote `<minted>\U0001D70E2</minted>` handed out.
  A firing minting two symbols writes two\nelements and one minting none writes none,
  which no attribute on the answer\ncould say: a term may carry several symbols, or
  carry one where the value it\nstands for is not a symbol at all. In the fork above,
  `\U0001D53C(L_gt)` writes\n`<minted>\U0001D70E2</minted>` although `\U0001D70E2`
  sits under `if` and not where the value of\nthe term is, while `\U0001D53C(L_fork)`
  writes none at all, since the symbol it answers\nwith comes from a `join` line and
  stands in a `<joined>` of its own.\n\nA λ name no entry answers is `<stuck λ=\"…\">`,
  standing where its `<evaluate>`\nwould have stood with the formation \U0001D53C
  was fired against as its text and the\njudgment that asked in its `judgment` attribute,
  where the text format writes\nthe letter of it. A firing that happened while an
  operand of another was being\nreduced is an `<evaluate>` inside the one that asked,
  which is what the deeper\nindentation means in the text. Elements are written as
  the run goes and\nthe open ones are closed when it ends, so a run that fails still
  leaves a\nwell-formed document behind:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$
  phino dataize --symbolic=atoms.yaml --protocol=atoms.xml --quiet \\\n    --sweet
  --hide-rho stuck.phi\n[ERROR]: No entry of --symbolic answers the λ function 'L_number_nope'\n$
  cat atoms.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<dataize locator=\"Φ\">\n
  \ <evaluate λ=\"L_number_plus\" id=\"1\" judgment=\"morph\" locator=\"Φ\">\n    <bind
  meta=\"\U0001D6FF1.1\">40-14-00-00-00-00-00-00</bind>\n    <bind meta=\"\U0001D6FF2.1\">40-18-00-00-00-00-00-00</bind>\n
  \   <minted>\U0001D70E1</minted>\n    <built meta=\"\U0001D45B.1.1\">Φ.number( φ
  ↦ \U0001D70E1:λ )</built>\n    <answer meta=\"\U0001D45B.1.2\">⟦ φ ↦ \U0001D70E1:λ,
  plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, nope ↦ L_number_nope:λ ⟧</answer>\n  </evaluate>\n
  \ <stuck λ=\"L_number_nope\" judgment=\"dataize\">L_number_nope:λ</stuck>\n</dataize>\n```\n\n<!--
  markdownlint-enable MD013 -->\n\n### Reducing a term inside a universe\n\nA term
  that is no part of the program may still be reduced against it, with the\n`--inside`
  option: the expression it names is bound to a synthetic attribute\nprepended to
  the input expression, which the run takes as the universe Φ,\nnormalized there and
  then reduced.\n\n```bash\n$ cat universe.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number
  ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --inside='5.plus( 6 )' universe.phi\n40-45-00-00-00-00-00-00\n```\n\nThis is the
  very trick `phino` plays internally to reduce the operands of a\nfiring, made available
  to whoever asks it to reduce a term the program does not\nhold. The option cannot
  be combined with `--locator`, since it aims the run at\nthe binding it mints itself.
  Both `dataize` and `morph` take `--symbolic` and\n`--inside`.\n\n### Partial evaluation\n\nA
  λ function no entry of the `--symbolic` file answers fails the run. This is\nwhat
  happens when an operation is deliberately left out — an input the object\nmodel
  has not declared yet, or an operation whose answer is not known. With\n`--partial`,
  dataization becomes partial evaluation instead: what the known\ninputs decide is
  computed, the rest survives as the residual program, which is\nprinted in place
  of the bytes, and the run ends successfully:\n\n```bash\n$ cat partial.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦\n    φ ↦ ∅,\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧,\n    times(x) ↦ ⟦ λ ⤍ L_number_times ⟧,\n    as-bool ↦ ⟦ λ ⤍ L_number_as_bool
  ⟧\n  ⟧,\n  φ ↦ 2.times( 3 ).plus( 4 ).as-bool\n⟧\n$ phino dataize --symbolic=atoms.yaml
  --sweet --hide-rho partial.phi\n[ERROR]: No entry of --symbolic answers the λ function
  'L_number_as_bool'\n$ phino dataize --symbolic=atoms.yaml --partial --sweet --hide-rho
  partial.phi\nL_number_as_bool:λ\n```\n\nHere `2.times( 3 ).plus( 4 )` was answered
  by the entries the file carries, so\nit was reduced — the symbol it came to sits
  in the hidden `ρ` of the residual\nprogram — while `as-bool` names a λ function
  no entry answers, so it stays in\nplace as a normal-form subterm. A stuck site opens
  no block in the\n`--protocol` file, since nothing fired there, and stands in it
  as `?(…)`:\n\n<!-- markdownlint-disable MD013 -->\n\n```bash\n$ phino dataize --symbolic=atoms.yaml
  --partial --protocol=atoms.txt --quiet \\\n    --sweet --hide-rho partial.phi\n$
  cat atoms.txt\n\U0001D53B(Φ)\n  \U0001D53C(L_number_times)  # \U0001D544(Φ)\n    \U0001D6FF1.1
  := 40-00-00-00-00-00-00-00  # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.1 := 40-08-00-00-00-00-00-00
  \ # \U0001D53B(ξ.x)\n    \U0001D45B.1.1 := Φ.number( φ ↦ \U0001D70E1:λ )  # \U0001D45B\n
  \   \U0001D45B.1.2 := ⟦ φ ↦ \U0001D70E1:λ, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, times(x)
  ↦ ⟦ λ ⤍ L_number_times ⟧, as-bool ↦ L_number_as_bool:λ ⟧  # \U0001D544(\U0001D45B.1.1)\n
  \ \U0001D53C(L_number_plus)  # \U0001D544(Φ)\n    \U0001D6FF1.2 := \U0001D53B(\U0001D70E1:λ)
  \ # \U0001D53B(ξ.ρ)\n    \U0001D6FF2.2 := 40-10-00-00-00-00-00-00  # \U0001D53B(ξ.x)\n
  \   \U0001D45B.2.1 := Φ.number( φ ↦ \U0001D70E2:λ )  # \U0001D45B\n    \U0001D45B.2.2
  := ⟦ φ ↦ \U0001D70E2:λ, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, times(x) ↦ ⟦ λ ⤍ L_number_times
  ⟧, as-bool ↦ L_number_as_bool:λ ⟧  # \U0001D544(\U0001D45B.2.1)\n  ?(L_number_as_bool)
  \ # \U0001D53B(L_number_as_bool:λ)\n```\n\n<!-- markdownlint-enable MD013 -->\n\nEvaluation
  stays demand-driven, as the calculus prescribes: an argument\nthat nothing asked
  for before the run got stuck is left as it is in the\nresidual program, for the
  next iteration.\n\nThe nested morphing and dataization recursion is bounded by the\n`--max-steps`
  option (default `1000`): when the budget is exhausted, the run\nfails with `Dataization
  did not finish before reaching the limit of steps`.\nThis guards against non-terminating
  terms, which used to loop forever before\nthe bound was introduced:\n\n```bash\n$
  phino dataize --max-steps=50 problem.phi\n[ERROR]: Dataization did not finish before
  reaching the limit of steps: --max-steps=50\n```\n\n## Morph\n\nDataization insists
  on bytes. Morphing \U0001D544 asks a different question: evaluate\nas far as the
  object model allows, without demanding data. It resolves Φ\nagainst the universe,
  peels dispatches and applications through\nnormalization, fires whichever λ functions
  sit under a dispatch, and stops at\nthe first formation it reaches, handing that
  formation back untouched. The\n`morph` command runs \U0001D544 on its own:\n\n```bash\n$
  cat two.phi\n⟦\n  bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧,\n  φ ↦ 5.plus( 6 ).plus( 7 )\n⟧\n$ phino dataize --symbolic=atoms.yaml --sweet
  --hide-rho two.phi\n40-45-00-00-00-00-00-00\n$ phino morph --symbolic=atoms.yaml
  --locator=Q.φ --sweet --hide-rho two.phi\n⟦ x ↦ 7, λ ⤍ L_number_plus ⟧\n```\n\nThe
  inner `5.plus( 6 )` fires, because `.plus` is dispatched on its result,\nand the
  symbol it answered with lands in the `ρ` hidden by `--hide-rho`. The\nouter application
  is saturated but bare, so \U0001D544 returns it and is finished;\nfiring it is dataization's
  job and takes `dataize` on to a datum.\n\nThe default locator `Q` morphs the whole
  top formation, which \U0001D544 returns\nunchanged, so `--locator` is how one aims
  \U0001D544 at a subterm, exactly as in\n`dataize`. Unlike \U0001D53B, \U0001D544
  is total: where no formation is reachable the answer\nis the terminator `⊥`, printed
  rather than reported as a failed run:\n\n```bash\n$ phino morph --locator=Q.x <<<
  '⟦ x ↦ ξ ⟧'\n⊥\n```\n\nThe whole `dataize` option surface applies unchanged — `--symbolic`,\n`--inside`,
  `--sequence`, `--headers`, `--steps-dir`, `--protocol`,\n`--partial`, `--max-steps`,
  `--shuffle`/`--seed`, `--output`, `--focus` and the\nrest.\n\n### Deep morphing\n\n\U0001D544
  stops at the first formation it reaches and hands its bindings back as they\nwere
  written, since firing a bare λ is dataization's job, and `dataize`\nfollows the
  one path dataization demands and ends in bytes. What a program\nholds but nothing
  demands — the argument of a λ function no entry answers, for\none — is therefore
  reduced by neither. The `--deep` flag enters it:\n\n```bash\n$ cat gap.phi\n⟦\n
  \ bytes ↦ ⟦ φ ↦ ∅ ⟧,\n  number ↦ ⟦ φ ↦ ∅, times(x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,\n
  \ bar(x) ↦ ⟦ λ ⤍ L_bar ⟧,\n  demo ↦ ⟦ foo ↦ ⟦ n ↦ 3, φ ↦ Φ.bar( ξ.n.times( 5 ).times(
  7 ) ) ⟧ ⟧\n⟧\n$ phino morph --symbolic=atoms.yaml --inside='Q.demo.foo' \\\n    --sweet
  --hide-rho gap.phi\n⟦ n ↦ 3, φ ↦ Φ.bar( n.times( 5 ).times( 7 ) ) ⟧\n$ phino morph
  --deep --symbolic=atoms.yaml --inside='Q.demo.foo' \\\n    --sweet --hide-rho gap.phi\n⟦
  n ↦ 3, φ ↦ Φ.bar( ⟦ φ ↦ \U0001D70E2:λ, times(x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧ ) ⟧\n```\n\nEvery
  binding of the formation is entered, recursively. \U0001D544 is asked about the\nterm
  standing there and, where it lands on a saturated formation whose λ an\nentry answers,
  that λ is fired and \U0001D544 is asked about the answer again. A term on\nwhose
  way a λ function fired is replaced by the answer of the last firing,\nmorphed: an
  entry answering `Φ.number( φ ↦ ⟦ λ ⤍ \U0001D70E ⟧ )` stands the formation of\n`number`
  there, the very one the same term written in the program morphs to, so\na value
  that came out of a firing and a value that was written as a literal are\none shape
  and can be compared leaf by leaf. That costs the size of the object's\nformation
  in the residual, which is the price of saying the same thing one way.\nA term nothing
  fired on stays exactly as it was written and only its own parts\nare walked, so
  `Φ.bar` keeps its name and what comes back is still the same\nprogram, reduced as
  far as the file allows. The step joins the chain under the\nname `deep`, so `--sequence`
  shows it, and `--max-steps` bounds the walk.\n\nTwo things are left alone. A λ no
  entry answers is not fired at all, so\n`--deep` stays as total as \U0001D544 itself
  and needs no `--partial`; a λ function that\ngets stuck deeper on a spine still
  fails the run, and `--partial` parks it,\nleaving that term as it was written. A
  firing the walk does make and cannot\nfinish — one whose operand never comes down
  to data, because a λ nothing\nanswers stands in it — is parked by `--partial` the
  same way: the binding it\nstood in is left as it was written, the walk enters the
  next one, and the\nprotocol shows the firing with nothing bound under it. One entry
  nothing can\nanswer therefore taints its own binding and not the whole run. A formation\nstill
  holding a void\nbinding is not fired either: the void is an argument the program
  has not given\nyet, so `times(x) ↦ ⟦ λ ⤍ L_number_times ⟧` is a method waiting to
  be applied,\nnot an application waiting to be computed. Walking the whole program
  therefore\nfolds what it can and leaves the object model as it was declared:\n\n```bash\n$
  phino morph --deep --symbolic=atoms.yaml --sweet --hide-rho gap.phi\n⟦\n  bytes(φ)
  ↦ ⟦⟧,\n  number(φ) ↦ ⟦ times(x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,\n  bar(x) ↦ ⟦ λ ⤍ L_bar
  ⟧,\n  demo ↦ ⟦\n    n ↦ 3,\n    φ ↦ Φ.bar( ⟦ φ ↦ \U0001D70E2:λ, times(x) ↦ ⟦ λ ⤍
  L_number_times ⟧ ⟧ )\n  ⟧:foo\n⟧\n```\n\n### Acyclic morphing\n\nWhether a program
  terminates is the object model's business, not the\ncalculus's, so phino prevents
  no recursion of its own and `--max-steps` is what\nends a run that never finishes.
  An entry answering with a firing of itself\ntherefore spends the whole budget before
  it fails, and what it fails on is the\nlimit rather than the loop:\n\n```bash\n$
  cat loop.yaml\n- λ: L_loop\n  \U0001D45B: ⟦ λ ⤍ L_loop ⟧\n$ cat loop.phi\n⟦ x ↦
  ⟦ λ ⤍ L_loop ⟧.foo ⟧\n$ phino morph --symbolic=loop.yaml --locator='Q.x' --max-steps=40
  loop.phi\n[ERROR]: Dataization did not finish before reaching the limit of steps:
  --max-steps=40\n```\n\nThe `--acyclic` flag makes a reduction notice. Every frame
  of \U0001D544 and of \U0001D53B\nremembers the terms the frames above it are reducing,
  and a term that comes\nback is a question only ever answered by asking it again,
  so the flag stops\nthere and parks the site the way `--partial` parks a λ function
  that cannot\nfire: the answer is the term the spine had reached, left where it stood,
  and\nthe command exits successfully.\n\n```bash\n$ phino morph --symbolic=loop.yaml
  --locator='Q.x' --acyclic \\\n    --max-steps=40 --hide-rho loop.phi\n⟦ λ ⤍ L_loop
  ⟧.foo\n```\n\nEach judgment keeps its own memory, since \U0001D544 and \U0001D53B
  call each other on the very\nterm they were asked about and that handover is no
  loop. A body dispatching the\nobject it stands in is one \U0001D53B walks round
  on its own — \U0001D544 stops at a formation\nevery round and never sees the same
  term twice — so `dataize` takes the flag\ntoo, and so does the run of \U0001D53B
  a λ function's `dataize` operand is brought down\nwith:\n\n```bash\n$ cat cyc.phi\n⟦
  cyc ↦ ⟦ x ↦ ∅, φ ↦ Φ.cyc( ξ.x ) ⟧, t ↦ Φ.cyc( ⟦⟧ ) ⟧\n$ phino dataize --locator='Q.t'
  --acyclic --partial \\\n    --sweet --hide-rho --flat cyc.phi\n⟦ cyc(x) ↦ ⟦ φ ↦
  Φ.cyc( x ) ⟧, t ↦ ⟦ x ↦ ⟦⟧, φ ↦ Φ.cyc( x ) ⟧ ⟧\n```\n\n\U0001D53B insists on bytes
  and a parked term carries none, so under `dataize` the flag\nwants `--partial` to
  have something to print: the residual program, exactly the\none it prints for a
  λ function that cannot fire. Without it the run stops on\nthe loop all the same,
  naming the term it came back to instead of running the\nbudget down. Under `morph`
  nothing is asked for: \U0001D544 always has a term to answer\nwith, a loop \U0001D53B
  meets under a firing parks the site the firing stands at, and\nthe walk of `--deep`
  goes on to the next binding.\n\nWhat a frame remembers is the branch from the run
  down to it, never everything\nthe run has touched, so two sibling subterms that
  happen to be written alike\nstay two terms and only a term genuinely reached from
  itself is a loop. The cut\ncosts one lookup and fires on the turn the repeat appears,
  so raising\n`--max-steps` from 40 to a million changes neither the answer nor the
  time. The\nflag promises nothing about programs that loop without ever repeating
  a term —\na body that grows on every round rather than coming back still ends on
  the\nbudget.\n\n## Rewrite\n\nYou can rewrite this expression with the help of [rules](#rule-structure)\ndefined
  in the `my-rule.yml` YAML file (here, the `!d` is a capturing group,\nsimilar to
  regular expressions):\n\n```yaml\nname: My custom rule\npattern: Δ ⤍ !d\nresult:
  Δ ⤍ 62-79-65\n```\n\nThen, rewrite:\n\n```bash\n$ phino rewrite --rule=my-rule.yml
  hello.phi\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧, t ↦ ξ.k, k ↦ ⟦⟧ ⟧\n```\n\nIf you want to use
  many rules, just use `--rule` as many times as you need:\n\n```bash\nphino rewrite
  --rule=rule1.yaml --rule=rule2.yaml ...\n```\n\nYou can also use [built-in rules](resources),
  which are designed\nto normalize expressions:\n\n```bash\nphino rewrite --normalize
  hello.phi\n```\n\nBoth flags may be combined, so that your own rules are applied\nalongside
  the built-in ones, in a single rewriting session:\n\n```bash\nphino rewrite --normalize
  --rule=my-rule.yaml hello.phi\n```\n\nSome rules mint fresh synthetic names via
  the `random-string` built-in. To\nkeep the output reproducible across runs, `phino`
  seeds the random generator\ndeterministically with `0` by default. Use `--seed`
  to pick a different seed:\n\n```bash\nphino rewrite --seed=42 --rule=my-rule.yml
  hello.phi\n```\n\nIf no input file is provided, the \U0001D711-expression is taken
  from `stdin`:\n\n```bash\n$ echo '⟦ φ ↦ ⟦ Δ ⤍ 68-65-6C-6C-6F ⟧ ⟧' | phino rewrite
  --rule=my-rule.yml\n⟦ φ ↦ ⟦ Δ ⤍ 62-79-65 ⟧ ⟧\n```\n\nYou're able to pass [`XMIR`][xmir]
  as input. Use `--input=xmir` and `phino`\nwill parse given `XMIR` from file or `stdin`
  and convert it to `phi` AST.\n\n```bash\nphino rewrite --rule=my-rule.yaml --input=xmir
  file.xmir\n```\n\nAlso `phino` supports \U0001D711-expressions in\n[ASCII](https://en.wikipedia.org/wiki/ASCII)
  format and with\nsyntax sugar. The `rewrite` command also allows you to desugar
  the expression\nand print it in canonical syntax:\n\n```bash\n$ echo '[[ @ -> Q.io.stdout(\"hello\")
  ]]' | phino rewrite\n⟦\n  φ ↦ Φ.io.stdout(\n    α0 ↦ Φ.string( φ ↦ Φ.bytes( φ ↦
  ⟦ Δ ⤍ 68-65-6C-6C-6F, ρ ↦ ∅ ⟧ ) )\n  ),\n  ρ ↦ ∅\n⟧\n```\n\nA formation of a single
  binding may be written as its asset, a colon,\nand the attribute the asset is bound
  to:\n\n```text\n⟦ Δ ⤍ FF-AA ⟧    = FF-AA:Δ    = FF-AA:D\n⟦ λ ⤍ \U0001D70E1 ⟧       =
  \U0001D70E1:λ       = !S1:L\n⟦ a ↦ ∅ ⟧        = ∅:a        = ?:a\n⟦ φ ↦ ξ.a ⟧      =
  ξ.a:φ      = $.a:@\n```\n\nThe colon binds as tightly as a dot, so `ξ.a:φ.b` is
  `⟦ φ ↦ ξ.a ⟧.b`.\nWith `--sweet`, `phino` prints every such formation this way,
  the implicit\n`ρ ↦ ∅` aside, so `⟦ x ↦ ⟦ φ ↦ ξ.a ⟧ ⟧` comes out as `a:φ:x`. A formation\nwith
  inline voids keeps its brackets, as in `x(a) ↦ ⟦ φ ↦ a ⟧`, and so does\nevery formation
  in the salty syntax and in [LaTeX][latex].\n\n## Merge\n\nYou can merge several
  \U0001D711-expressions into a single one by merging their\ntop level formations:\n\n```bash\n$
  cat bytes.phi\n⟦ bytes ↦ ⟦ φ ↦ ∅ ⟧ ⟧\n$ cat number.phi\n⟦\n  number ↦ ⟦\n    φ ↦
  ∅,\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧\n  ⟧\n⟧\n$ cat minus.phi\n⟦ number ↦ ⟦ minus(x)
  ↦ ⟦ λ ⤍ L_number_minus ⟧ ⟧ ⟧\n$ phino merge bytes.phi number.phi minus.phi --sweet\n⟦\n
  \ bytes(φ) ↦ ⟦⟧,\n  number(φ) ↦ ⟦\n    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,\n    minus(x)
  ↦ ⟦ λ ⤍ L_number_minus ⟧\n  ⟧\n⟧\n```\n\n## Match\n\nYou can test the \U0001D711-expression
  matches against the [rule](#rule-structure)\npattern. The result output contains
  matched substitutions:\n\n```bash\n$ phino match --pattern='⟦ Δ ⤍ !d, !B ⟧' hello.phi\nB
  >> ⟦ ρ ↦ ∅ ⟧\nd >> 68-65-6C-6C-6F\n```\n\n## Explain\n\nYou can _explain_ the built-in
  rules by printing them in [LaTeX][latex]\nformat. Pass exactly one of `--normalize`,
  `--morph`, `--dataize` or\n`--contextualize` for the rewriting, morphing (\U0001D544),
  dataization (\U0001D53B) or\ncontextualization (\U0001D49E) rules (or `--rule` for
  a custom rule file):\n\n```bash\n$ phino explain --normalize\n\\begin{tabular}{rl}\n\\phinoNormalizationRule{alpha}\n
  \ { [[ B_1, \\tau -> ?, B_2 ]] ( \\phiTerminal{\\alpha_{i}} -> e ) }\n  { [[ B_1,
  \\tau -> ?, B_2 ]] ( \\tau -> e ) }\n  { $ i = \\vert \\overline{ B_1 } \\vert $
  }\n  { }\n\\phinoNormalizationRule{dc}\n  { T ( \\tau -> e ) }\n  { T }\n  { }\n
  \ { }\n...\n\\phinoNormalizationRule{stop}\n  { [[ B ]] . \\tau }\n  { T }\n  {
  $ \\tau \\notin B \\;\\text{and}\\; @ \\notin B \\;\\text{and}\\; L \\notin B $
  }\n  { }\n\\end{tabular}\n```\n\nThe morphing and dataization rules are printed
  the same way:\n\n```bash\n$ phino explain --morph\n\\begin{tabular}{rl}\n\\phinoMorphingRule{mf}\n
  \ { \\mathbb{M}( [[ B ]], e ) }\n  { [[ B ]] }\n  { }\n  { }\n...\n\\phinoMorphingRule{universe}\n
  \ { \\mathbb{M}( Q, e ) }\n  { \\mathbb{M}( \\phinoNormalize{ e }, e ) }\n  { $
  e \\not= Q $ }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain --dataize\n\\begin{tabular}{rl}\n\\phinoDataizationRule{delta}\n
  \ { \\phinoDataize{ [[ B_1, D> \\delta_0, B_2 ]] } }\n  { \\delta_0 }\n  { }\n  {
  }\n...\n\\phinoDataizationRule{norm}\n  { \\phinoDataize{ n } }\n  { \\phinoDataize{
  \\mathbb{M}( n, e ) } }\n  { }\n  { }\n\\end{tabular}\n```\n\n```bash\n$ phino explain
  --contextualize\n\\begin{phinoContextualizationInference}\n  \\phinoName{cxi}\n
  \ \\phinoConclusion{ \\phinoContextualize{ \\phiTerminal{\\xi} }{ k }{ k } }\n\\end{phinoContextualizationInference}\n...\n\\begin{phinoContextualizationInference}\n
  \ \\phinoName{cd}\n  \\phinoPremise{ \\phinoContextualize{ n }{ k }{ n_1 } }\n  \\phinoConclusion{
  \\phinoContextualize{ n . \\tau }{ k }{ n_1 . \\tau } }\n\\end{phinoContextualizationInference}\n```\n\nFor
  more details, use `phino [COMMAND] --help` option.\n\n## Rule structure\n\nThis
  is BNF-like yaml rule structure. Here types ended with\napostrophe, like `Attribute'`
  are built types from \U0001D711-expression [AST](src/AST.hs)\n\n```bnfc\nRule:\n
  \ name: String\n  pattern: String\n  result: String\n  when: Condition?       #
  predicate, works with substitutions before extension\n  where: [Extension]?    #
  substitution extensions\n  having: Condition?     # predicate, works with substitutions
  after extension\n\nCondition:\n  = and: [Condition]     # logical AND\n  | or:  [Condition]
  \    # logical OR\n  | not: Condition       # logical NOT\n  | eq:                  #
  compare two comparable objects\n      - Comparable\n      - Comparable\n  | in:
  \                 # check if attributes exist in bindings\n      - Attribute'\n
  \     - Binding'\n  | nf: Expression'      # returns True if given expression in
  normal form\n                         # which means that no more other normalization
  rules\n                         # can be applied\n  | absolute: Expression' # returns
  True if given expression is xi-free, i.e.\n                         # there is no
  ξ outside of a formation: it is Φ, a\n                         # formation, a dispatch
  with a xi-free subject, or an\n                         # application with a xi-free
  subject and argument.\n                         # Combined with a normal-form check
  by the '\U0001D458'/'!k'\n                         # meta variable, which ranges
  over the absolute\n                         # expressions \U0001D4A6 ⊆ \U0001D4A9,
  used by the Rcopy rule.\n  | matches:             # returns True if given expression
  after dataization\n      - String           # matches to given regex\n      - Expression\n
  \ | part-of:             # returns True if given expression is attached to any\n
  \     - Expression'      # attribute in ginve bindings\n      - BiMeta'\n  | formation:
  \          # returns True if given expression is a formation\n      Expression'
  \       # (an abstraction ⟦…⟧); used by morphing 'md'\n                         #
  as 'not (formation \U0001D45B)', so a non-formation head is\n                         #
  morphed and a formation head is left to 'ml'\n  | gt:                  # returns
  True if the first comparable object is\n      - Comparable       # greater than
  the second one\n      - Comparable\n  | disjoint:            # returns True if none
  of the given attributes exists\n      - [Attribute']     # in the given bindings\n
  \     - Binding'\n\nComparable:              # comparable object that may be used
  in 'eq' condition\n  = Attribute'\n  | Number\n  | Expression'\n\nNumber:                  #
  comparable number\n  = Integer              # just regular integer\n  | IndexMeta'
  \          # \U0001D456 (or !i), the index captured by an α\U0001D456 argument\n
  \ | length: BiMeta'      # calculate length of bindings by given meta binding\n
  \ | domain: BiMeta'      # calculate number of unique attributes in given\n                         #
  meta binding (excluding 'assets')\n\nExtension:               # substitutions extension
  used to introduce new meta variables\n  meta: [ExtArgument]    # new introduced
  meta variable\n  function: String       # name of the function\n  args: [ExtArgument]
  \   # arguments of the function\n\nExtArgument\n  = Bytes'               # !d\n
  \ | Binding'             # !B\n  | Expression'          # !e\n  | Attribute'           #
  !t\n```\n\nHere's list of functions that are supported for extensions:\n\n* `contextualize`
  - function of two arguments, that rewrites given expression\n  depending on provided
  context according to the contextualization\n  [rules](assets/contextualize.jpg)\n*
  `random-tau` - creates an attribute with a random unique name. It accepts no\n  arguments;
  uniqueness is guaranteed across all names already taken in the\n  document.\n* `dataize`
  - dataizes given expression and returns bytes.\n* `concat` - accepts bytes or dataizable
  expressions as arguments,\n  concatenates them into single sequence and convert
  it to expression\n  that can be pretty printed as human readable string:\n  `Φ.string(Φ.bytes⟦
  Δ ⤍ !d ⟧)`.\n* `sed` - pattern replacer, works like unix `sed` function.\n  Accepts
  two arguments: target expression and pattern.\n  Pattern must start with `s/`, consists
  of three parts\n  separated by `/`, for example, this pattern `s/\\\\s+//g`\n  replaces
  all the spaces with empty string. To escape braces and slashes\n  in pattern and
  replacement parts - use them with `\\\\`,\n  e.g. `s/\\\\(.+\\\\)//g`.\n* `random-string`
  - accepts dataizable expression or bytes as pattern.\n  Replaces `%x` and `%d` formatters
  with random hex numbers and\n  decimals accordingly. Uniqueness is guaranteed during
  one\n  execution of `phino`.\n* `size` - accepts exactly one meta binding and returns
  size of it and\n  `Φ.number`.\n* `tau` - accepts `Φ.string`, dataizes it and converts
  it to attribute.\n  If dataized string can't be converted to attribute - an error
  is thrown.\n* `string` - accepts `Φ.string` or `Φ.number` or attribute and converts
  it\n  to `Φ.string`.\n* `number` - accepts `Φ.string` and converts it `Φ.number`\n*
  `sum` - accepts list of `Φ.number` or `Φ.bytes` and returns sum of them as `Φ.number`\n*
  `join` - accepts list of bindings and returns list of joined bindings. Duplicated\n
  \ `ρ`, `Δ` and `λ` attributes are ignored, all other duplicated attributes are replaced\n
  \ with unique attributes using `random-tau` function.\n\n## Meta variables\n\nThe
  `phino` supports meta variables to write \U0001D711-expression patterns for\ncapturing
  attributes, bindings, etc.\n\nThis is the list of supported meta variables:\n\n*
  `!t` || `\U0001D70F` - attribute\n* `!i` || `\U0001D456` - the index of a positional
  (α) application argument,\n                captured by writing `α\U0001D456` (or
  `~!i`)\n* `!e` || `\U0001D452` - any expression\n* `!n` || `\U0001D45B` - any expression
  that is already in normal form (behaves like\n                `!e`/`\U0001D452`,
  but only binds a sub-expression in NF, so no explicit\n                `nf:` guard
  is needed)\n* `!k` || `\U0001D458` - any expression that is absolute, i.e. xi-free
  and in normal\n                form (ranges over `\U0001D4A6 ⊆ \U0001D4A9`); behaves
  like `!e`/`\U0001D452` but only\n                binds an absolute sub-expression,
  so no explicit `absolute:`\n                or `nf:` guard is needed\n* `!B` ||
  `\U0001D435` - list of bindings\n* `!d` || `\U0001D6FF` - bytes in meta delta binding\n*
  `!F` || `\U0001D453` - function name in meta lambda binding\n* `!S` || `\U0001D70E`
  - a symbol standing where a λ name stands (see\n                [Symbols](#symbols)).
  It is spelled the way a meta variable is\n                spelled but is a name
  and no capture: `\U0001D70E1` is one concrete\n                symbol, which no
  substitution ever binds, and a bare `\U0001D70E` in the\n                answer
  of a `--symbolic` entry asks for a fresh one\n\nA meta variable carries a suffix,
  like `!B1` or `\U0001D70F2`, to name what it\ncaptured, so that the `result`, `when`,
  `where` and `having` of a rule can\nread it back. An index starts with one: a suffix
  of `0`, as in `!B0` or\n`\U0001D70F0`, is refused where it is written, because it
  is a first index spelled\nwrong and no name. A positional argument keeps counting
  from zero, though,\nsince `α0` is an index of the calculus and no meta variable.\n\nWritten
  bare, with no suffix at all, a meta variable is anonymous: it matches\nwhatever
  term stands in its place, every occurrence on its own, and binds no\nname. Two anonymous
  metas of one kind are therefore two different captures,\nwhich is what lets a pattern
  ask for any two attributes without inventing\nnames for them:\n\n```yaml\nname:
  two-attributes\npattern: '⟦ \U0001D70F ↦ \U0001D452, \U0001D70F ↦ \U0001D452 ⟧'\nresult:
  '⟦ x ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧'\n```\n\nSpelled with suffixes, that pattern would read `⟦
  \U0001D70F1 ↦ \U0001D4521, \U0001D70F2 ↦ \U0001D4522 ⟧` and\nname four captures
  the result never mentions, while `⟦ \U0001D70F1 ↦ \U0001D4521, \U0001D70F1 ↦ \U0001D4521
  ⟧`\nwould be rejected as a duplicated attribute.\n\nNothing can refer to an anonymous
  meta, since it has no name to be referred to\nby. Writing one outside a `pattern`
  (or the `match`, `e-match` and `c-match` of\nan inference rule) is a mistake in
  the rule and is reported as the rule loads.\n\nA positional (α) application argument
  is written as `α0`, `~0` (ASCII), or\n`α\U0001D456`/`~!i` when its index is captured
  by an `!i`/`\U0001D456` meta variable.\n\nIncorrect usage of meta variables in \U0001D711-expression
  patterns leads to\nparsing errors.\n\n## Benchmark\n\nTo run performance benchmarks,
  you need [Java 8+][java] and [curl][curl].\nMaven is downloaded automatically on
  first run via `benchmark/mvnw`.\n\nThe benchmark uses the compiled [`Native`][jna-native]
  class from\n[JNA][jna] — a large real-world Java class — as its test input.\nOn
  first run, `make bench` downloads the class, disassembles it to\n[XMIR][xmir] via
  [jeo-maven-plugin][jeo], converts it to \U0001D711 using\n`phino rewrite`, and caches
  the results in `benchmark/tmp/`.\nSubsequent runs skip straight to the benchmarks.\n\nBesides
  parsing, printing and rewriting that class, the suite morphs\nsymbolically. `benchmark/demo.phi`
  is a small world whose entries name the λ\nfunctions of `benchmark/atoms.yaml`,
  and each entry is a case of its own, so\nthat a slowdown of one of them is a line
  of the report rather than a share of\na single total. The smallest entry — one λ
  function fired against one unknown\n— is timed twice, over the demo world alone
  and over the same world merged\ninto the class, and the two numbers say between
  them what the world around an\nentry costs (see [#1291][issue-1291]).\n\nA case
  whose single run is measured in seconds gets fewer warmups and fewer\nbatches than
  a case measured in microseconds, since the whole suite runs\ninside one job; the
  report says how many of each a case was given.\n\n```bash\nmake bench\n```\n\n<!--
  benchmark_begin -->\n\n```text\n=== parse/phi ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      1810402.021 μs\n  avg:        181040.202 μs\n
  \ min:        169827.114 μs\n  max:        204681.114 μs\n  std dev:    13154.216
  μs\n=== parse/xmir ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     7538811.226 μs\n  avg:        753881.123 μs\n  min:        694204.271 μs\n
  \ max:        840942.094 μs\n  std dev:    41681.127 μs\n=== rewrite/normalize ===\n
  \ warmup:     3 iterations\n  batches:    10 x 1\n  total:      597613.462 μs\n
  \ avg:        59761.346 μs\n  min:        54912.144 μs\n  max:        65342.026
  μs\n  std dev:    2994.555 μs\n=== print/sweet/multiline ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      4130310.545 μs\n  avg:        413031.054 μs\n
  \ min:        404823.433 μs\n  max:        426597.938 μs\n  std dev:    7495.509
  μs\n=== print/sweet/flat ===\n  warmup:     3 iterations\n  batches:    10 x 1\n
  \ total:      4284120.069 μs\n  avg:        428412.007 μs\n  min:        413571.324
  μs\n  max:        445658.981 μs\n  std dev:    11624.236 μs\n=== print/salty/multiline
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      13724020.907
  μs\n  avg:        1372402.091 μs\n  min:        1344331.661 μs\n  max:        1409368.695
  μs\n  std dev:    17786.287 μs\n=== morph/symbolic/demo/e1 ===\n  warmup:     3
  iterations\n  batches:    10 x 1\n  total:      866700.384 μs\n  avg:        86670.038
  μs\n  min:        86184.411 μs\n  max:        87168.132 μs\n  std dev:    285.902
  μs\n=== morph/symbolic/demo/e2 ===\n  warmup:     3 iterations\n  batches:    10
  x 1\n  total:      1188660.494 μs\n  avg:        118866.049 μs\n  min:        116047.655
  μs\n  max:        136278.751 μs\n  std dev:    5832.266 μs\n=== morph/symbolic/demo/e3
  ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:      1867565.431
  μs\n  avg:        186756.543 μs\n  min:        185066.327 μs\n  max:        187725.046
  μs\n  std dev:    1004.396 μs\n=== morph/symbolic/demo/e4 ===\n  warmup:     3 iterations\n
  \ batches:    10 x 1\n  total:      623551.322 μs\n  avg:        62355.132 μs\n
  \ min:        61620.682 μs\n  max:        63797.384 μs\n  std dev:    728.465 μs\n===
  morph/symbolic/demo/e5 ===\n  warmup:     3 iterations\n  batches:    10 x 1\n  total:
  \     186679.533 μs\n  avg:        18667.953 μs\n  min:        18384.769 μs\n  max:
  \       18868.158 μs\n  std dev:    149.307 μs\n=== morph/symbolic/native/e5 ===\n
  \ warmup:     1 iterations\n  batches:    4 x 1\n  total:      17947336.400 μs\n
  \ avg:        4486834.100 μs\n  min:        4167627.934 μs\n  max:        4633560.228
  μs\n  std dev:    189453.769 μs\n```\n\nThe results were calculated in [this GHA
  job][benchmark-gha]\non 2026-09-22 at 19:05,\non Linux with 4 CPUs.\n\n<!-- benchmark_end
  -->\n\n## How to Contribute\n\nFork repository, make changes, then send us a [pull
  request][guidelines].\nWe will review your changes and apply them to the `master`
  branch shortly,\nprovided they don't violate our quality standards. To avoid frustration,\nbefore
  sending us your pull request please make sure all your tests pass:\n\n```bash\nmake
  all\n```\n\nTo generate a local coverage report for development, run:\n\n```bash\nmake
  coverage\n```\n\nTo build a `phino` executable into the root of the repository,
  run:\n\n```bash\nmake phino\n```\n\nThis produces an executable `phino` (or `phino.exe`
  on Windows) in the\nproject root, which you can run directly for quick local testing:\n\n```bash\n./phino
  --version\n```\n\nYou will need [GHC ≥ 9.6.7][GHC] and [Cabal ≥ 3.0 (recommended)][cabal]\nor
  [Stack ≥ 3.0][stack] installed.\n\n[cabal]: https://www.haskell.org/cabal/\n[stack]:
  https://docs.haskellstack.org/en/stable/install_and_upgrade/\n[GHC]: https://www.haskell.org/ghc/\n[guidelines]:
  https://www.yegor256.com/2014/04/15/github-guidelines.html\n[xmir]: https://news.eolang.org/2022-11-25-xmir-guide.html\n[latex]:
  https://en.wikipedia.org/wiki/LaTeX\n[java]: https://www.java.com/en/download/\n[curl]:
  https://curl.se/\n[jna]: https://github.com/java-native-access/jna\n[jna-native]:
  https://github.com/java-native-access/jna/blob/master/src/com/sun/jna/Native.java\n[jeo]:
  https://github.com/objectionary/jeo-maven-plugin\n[issue-1291]: https://github.com/objectionary/phino/issues/1291\n[benchmark-gha]:
  https://github.com/objectionary/phino/actions/runs/35770947279\n"
