changelog: "# Changelog for `langchain-hs`\n\n## 0.0.5.0 - 2026-09-10\n\n### Major
  Architecture & Ecosystem Evolution\n\n- **3-Tier Monorepo Architecture**:\n  - `langchain-hs-core`
  (0.0.5.0): Zero-dependency pure core with `RunnableTree`, `ChatModel`, `ContentBlock`,
  `Tool`, `StreamEvent`, and `LangchainT`.\n  - `langchain-hs-graph` (0.0.5.0): Graph-based
  state machine engine with `StateGraph`, `StateReducer`, checkpointers, HITL, and
  multi-agent coordination.\n  - `langchain-hs` (0.0.5.0): Production integrations
  for Ollama, OpenAI, Gemini, Vector Stores, MCP, and Observability.\n- **Pure AST
  Pipelines (`RunnableTree`)**:\n  - The core selling point: Every component implements
  the `Runnable` typeclass.\n  - Compose pure GADT abstract syntax trees using `|>>`
  (sequential composition), `&>&` (parallel fan-out), and `>>>#` (fallback failover)
  without side effects before interpretation.\n- **LangGraph in Haskell (`StateGraph`)**:\n
  \ - Cyclic state machines with pure state reducers (`StateReducer s`) satisfying
  monoid associativity laws.\n  - Thread-safe STM in-memory checkpointer (`MemoryCheckpointer`)
  and persistent `SQLiteCheckpointer`.\n  - First-class Human-in-the-Loop (`HITL`)
  node interruption, inspect/edit state, and resumption via `resumeGraph`.\n  - Time-travel
  state replay and Graphviz DOT visualization export.\n- **Model Context Protocol
  (MCP)**:\n  - Native stdio and HTTP JSON-RPC 2.0 client implementation.\n  - Dynamic
  tool inspection and bidirectional schema mapping to Haskell `Tool` definitions.\n-
  **Decoupled Monad Transformer (`LangchainT env m a`)**:\n  - Removed redundant global
  config structs in favor of parameterization over custom user environment `env`.\n
  \ - Complete `MonadReader`, `MonadError`, `MonadIO`, and `MonadTrans` instances.\n
  \ - OpenTelemetry distributed tracing spans (`withSpan`) and structured JSON telemetry.\n
  \ - Three-state Circuit Breaker, exponential backoff retries with randomized jitter,
  and in-memory caching.\n- **Dependency & Performance Upgrades**:\n  - Upgraded to
  `ollama-haskell` `0.4.1.0` with JSON schema grammar constraints.\n  - Migrated to
  `MercuryTechnologies/openai` client.\n  - Full PVP upper bounds across all packages
  for Hackage compliance.\n\n### ⚠️ Breaking Changes from 0.0.3.0\n\n- **`LangchainT`
  is now parameterized over `env`** (`LangchainT env m a` instead of the former implicit
  `LangchainConfig`).\n  - Replace `runLangchainT config action` with `runLangchainT
  env action` where `env` is your custom environment type (use `()` if you have no
  shared config).\n  - The `MonadReader env (LangchainT env m)` instance gives you
  `ask`/`asks` to read your environment from within the monad.\n- **`ChatMessage`
  renamed to `Message`** throughout — update all pattern matches and constructor calls.\n-
  **Agent modules restructured** — `Langchain.Agent` is now split into `Langchain.Agent.ReAct`
  and `Langchain.Agent.PlanAndExecute` with updated type signatures for tool-call
  support.\n- **Removed `HtmlLoader`, `JsonLoader`, and `WebPageLoader` from `Langchain.DocumentLoader`**
  — Along with the `tagsoup` dependency. Users can write custom document loaders tailored
  to their schemas and formats.\n\n## 0.0.3.0 - 2025-11-16\n\n### Added\n\n- Added
  Agent middleware support.\n- Added image input support for OpenAI and Gemini.\n\n###
  Fixed\n\n- Fixed Ollama stream's onComplete callback.\n- Fixed system_fingerprint
  field to be nullable.\n\n### Changed\n\n- * Revamped Agent module with native tool_call
  support and improved architecture.\n- * Migrated to Mercury's OpenAI client.\n-
  * Changed Ollama params to use ChatOps type.\n- * Renamed ChatMessage to ChatHistory.\n-
  * Parameterized StreamHandler Token type.\n- * Added Langchain error type for better
  error handling.\n- Updated ollama-haskell to 0.2.1.0.\n\n## 0.0.2.0 - 2025-05-04\n\n###
  Added\n\n- Added `OpenAI` LLM integration.\n- Added `DirectoryLoader` for loading
  Documents from a directory.\n- Added `HuggingFace` LLM integration.\n- Added docusaurus
  documentation.\n- Added `OpenAI` embeddings integration.\n- Added GHC CI matrix
  build.\n- Added `TokenBufferMemory` Memory integration.\n- Added `RetrievalQA` chain.\n-
  Added `CalculatorTool` tool.\n\n### Fixed \n\n- Fixed `loadAndSplit` function for
  `PdfLoader`.\n- Minor documentation fixes.\n- Fixed `WebScraper` to only scrape
  textual content.\n- Made langchain-hs buildable till stack-lts-19.33\n- Fixed `React`
  agent.\n\n### Changed\n\n- Generalized LLMParams to accept different type per LLM.
  \n"
