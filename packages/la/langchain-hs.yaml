description: "# \U0001F99C️\U0001F517 LangChain Haskell (`langchain-hs`)\n\n> **The
  Pure Functional, Effect-Polymorphic AI Agent & Multi-Agent Graph Engine in Haskell**\n>\n>
  *A strictly typed, effect-polymorphic, AI ecosystem built on pure AST pipelines
  (`RunnableTree`), cyclic state machines (`StateGraph`), Model Context Protocol (MCP),
  and production observability.*\n\n---\n\n[![Hackage](https://img.shields.io/badge/hackage-0.0.5.0-blue.svg)](https://hackage.haskell.org/package/langchain-hs)\n[![GHC](https://img.shields.io/badge/GHC-9.8%2B-purple.svg)](https://www.haskell.org/ghc/)\n[![Components](https://img.shields.io/badge/components-20%20verified-brightgreen.svg)](#-20-core-components--verified-targets)\n[![Providers](https://img.shields.io/badge/providers-Ollama%20%7C%20OpenAI%20%7C%20Gemini-orange.svg)](#-dual-provider-parity-ollama--openai)\n[![License:
  MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n[![Whitepaper](https://img.shields.io/badge/whitepaper-read%20now-blueviolet.svg)](whitepaper.md)\n\n---\n\n##
  Why `langchain-hs`?\n\nModern AI orchestration frameworks often struggle with race
  conditions, hidden side-effects, fragile dynamic schemas, and uninspectable opaque
  execution chains. `langchain-hs` brings mathematical precision and functional programming
  principles to AI development:\n\n1. **First-Class Runnable AST Composition (`RunnableTree`)**:
  Every component—models, prompts, tools, chains, retrievers, and parsers—implements
  the `Runnable` typeclass. Connect components into trees or graphs using type-safe
  operators:\n   - `|>>` : Sequential composition (data flows from left to right).\n
  \  - `&>&` : Parallel fan-out (concurrent evaluation of independent branches).\n
  \  - `>>>#` : Fallback chains (automatic failover if the primary branch errors).\n2.
  **LangGraph in Haskell (`StateGraph`)**: Full cyclic state machine engine with pure
  monoidal state reducers (`StateReducer s`), thread-safe STM memory checkpointers
  (`TVar`), persistent SQLite checkpointers, Human-in-the-Loop (`HITL`) interrupts,
  and Time-Travel state replay.\n\n---\n\n\n### Monorepo Packages\n\n| Package | Directory
  | Version | Description |\n|---|---|---|---|\n| `langchain-hs-core` | [`langchain-hs-core/`](./langchain-hs-core)
  | `0.0.5.0` | Zero-dependency pure core: `RunnableTree`, `ChatModel`, `ContentBlock`,
  `Tool`, and `LangchainT`. |\n| `langchain-hs-graph` | [`langchain-hs-graph/`](./langchain-hs-graph)
  | `0.0.5.0` | Stateful graph engine: `StateGraph s m`, checkpointers, HITL, time-travel,
  and parallel nodes. |\n| `langchain-hs` | [`./`](./) | `0.0.5.0` | Production ecosystem:
  Ollama/OpenAI providers, Agents, MCP, Vector Stores, Chains, Observability. |\n|
  `examples` | [`examples/`](./examples) | - | 41 runnable executables covering all
  20 components for Ollama and OpenAI. |\n| `site` | [`site/`](./site) | - | Hakyll
  documentation website with live provider toggle and component reference. |\n\n---\n\n##
  20 Core Components & Verified Targets\n\n| # | Component | Package Layer | Ollama
  Executable | OpenAI Executable | Documentation |\n|:---:|---|---|---|---|:---:|\n|
  1 | **Chat Models** | `Langchain.Core.Model` | `stack run simpleollama` | `stack
  run simpleopenai` | [Docs](site/components/chat-models.md) |\n| 2 | **Conduit Streaming**
  | `Langchain.Core.Stream` | `stack run streamollama` | `stack run streamopenai`
  | [Docs](site/components/streaming.md) |\n| 3 | **Langchain Monad** | `Langchain.Core.Monad`
  | `stack run monadollama` | `stack run monadopenai` | [Docs](site/components/monad.md)
  |\n| 4 | **Tools & Function Calling** | `Langchain.Core.Tool` | `stack run toolollama`
  | `stack run toolopenai` | [Docs](site/components/tools.md) |\n| 5 | **Structured
  Outputs** | `Langchain.OutputParser` | `stack run jsonollama` | `stack run jsonopenai`
  | [Docs](site/components/structured-output.md) |\n| 6 | **RAG & Embeddings** | `Langchain.Embedding`
  | `stack run ragollama` | `stack run ragopenai` | [Docs](site/components/rag.md)
  |\n| 7 | **Hybrid Retrievers** | `Langchain.Retriever` | `stack run retrieverollama`
  | `stack run retrieveropenai` | [Docs](site/components/retrievers.md) |\n| 8 | **Memory
  Systems** | `Langchain.Memory` | `stack run memoryollama` | `stack run memoryopenai`
  | [Docs](site/components/memory.md) |\n| 9 | **Retrieval QA Chains** | `Langchain.Chain.RetrievalQA`
  | `stack run retrievalqaollama` | `stack run retrievalqaopenai` | [Docs](site/components/retrieval-qa.md)
  |\n| 10 | **Map-Reduce Processing** | `Langchain.Chain.MapReduce` | `stack run mapreduceollama`
  | `stack run mapreduceopenai` | [Docs](site/components/map-reduce.md) |\n| 11 |
  **ReAct Agent** | `Langchain.Agent.ReAct` | `stack run reactollama` | `stack run
  reactopenai` | [Docs](site/components/react-agent.md) |\n| 12 | **Plan-and-Execute
  Agent** | `Langchain.Agent.PlanAndExecute` | `stack run planandexecuteollama` |
  `stack run planandexecuteopenai` | [Docs](site/components/plan-and-execute.md) |\n|
  13 | **Guardrails & Safety** | `Langchain.Guardrails` | `stack run guardrailollama`
  | `stack run guardrailopenai` | [Docs](site/components/guardrails.md) |\n| 14 |
  **Resilience & Retries** | `Langchain.Resilience` | `stack run resilienceollama`
  | `stack run resilienceopenai` | [Docs](site/components/resilience.md) |\n| 15 |
  **Observability & Tracing** | `Langchain.Observability` | `stack run observabilityollama`
  | `stack run observabilityopenai` | [Docs](site/components/observability.md) |\n|
  16 | **Model Context Protocol** | `Langchain.MCP.Client` | `stack run mcpollama`
  | `stack run mcpopenai` | [Docs](site/components/mcp.md) |\n| 17 | **StateGraph
  Workflows** | `Langchain.Graph` | `stack run stategraphollama` | `stack run stategraphopenai`
  | [Docs](site/components/state-graph.md) |\n| 18 | **Multi-Agent Systems** | `Langchain.Graph.MultiAgent`
  | `stack run multiagentollama` | `stack run multiagentopenai` | [Docs](site/components/multi-agent.md)
  |\n| 19 | **Human-in-the-Loop (HITL)** | `Langchain.Graph.Checkpointer` | `stack
  run hitlollama` | `stack run hitlopenai` | [Docs](site/components/hitl.md) |\n|
  20 | **Runnables & AST Composition** | `Langchain.Core.Runnable` | `stack run runnableollama`
  | `stack run runnableopenai` | [Docs](site/components/runnables.md) |\n\n---\n\n##
  Code Showcases\n\n### 1. The Power of Runnables: Pure AST Composition\n\nCompose
  complex multi-stage pipelines using typed operators without executing any `IO` until
  interpretation:\n\n```haskell\n{-# LANGUAGE OverloadedStrings #-}\nmodule Main where\n\nimport
  Langchain.Prelude\n\n-- Compose pure AST pipelines with (|>>), (&>&), and (>>>#)\npipeline
  :: RunnableTree IO Text Text\npipeline =\n      runLambda (\\q -> (q, q))                          --
  duplicate input query\n  |>> (fetchDocuments &>& generateFollowup)              --
  parallel branch fan-out\n  |>> runLambda (\\(docs, fup) -> renderPrompt docs fup)
  -- pure prompt synthesis\n  |>> (invokeLLM primaryModel >>># invokeLLM backupModel)
  -- fallback resilience\n  |>> parseStructuredResponse                           --
  JSON parser\n\nmain :: IO ()\nmain = do\n  output <- interpret pipeline \"Explain
  Monads in Haskell\"\n  print output\n```\n\n---\n\n### 2. Dual-Provider Chat Comparison:
  Ollama vs OpenAI\n\n#### Ollama (Local & Offline)\n```haskell\n{-# LANGUAGE OverloadedStrings
  #-}\nimport Control.Monad.Except (runExceptT)\nimport qualified Data.Text.IO as
  T\nimport Langchain.Prelude\n\nmain :: IO ()\nmain = do\n  -- Connect to local Ollama
  instance (DeepSeek, Llama 3, Gemma)\n  model <- newOllama \"gemma3\" defaultConfig\n
  \ \n  let msg = [userMessage \"Write a poem about functional programming\"]\n  res
  <- runExceptT $ invoke model msg Nothing\n  case res of\n    Left err -> T.putStrLn
  $ errorMessage err\n    Right m  -> T.putStrLn $ extractMessageText m\n```\n*Run:*
  `stack run simpleollama`\n\n#### OpenAI / OpenRouter (Cloud)\n```haskell\n{-# LANGUAGE
  OverloadedStrings #-}\nimport Control.Monad.Except (runExceptT)\nimport qualified
  Data.Text.IO as T\nimport Langchain.Prelude\nimport OpenAI.Common (defaultModelName,
  getOpenRouterModel)\n\nmain :: IO ()\nmain = do\n  -- Connect to OpenAI or OpenRouter
  using environment API key\n  model <- getOpenRouterModel defaultModelName\n  \n
  \ let msg = [userMessage \"Write a poem about functional programming\"]\n  res <-
  runExceptT $ invoke model msg Nothing\n  case res of\n    Left err -> T.putStrLn
  $ errorMessage err\n    Right m  -> T.putStrLn $ extractMessageText m\n```\n*Run:*
  `stack run simpleopenai`\n\n---\n\n### 3. Stateful Graphs (`StateGraph`): Cyclic
  Multi-Agent Workflow\n\n```haskell\n{-# LANGUAGE OverloadedStrings #-}\nimport Langchain.Graph.StateGraph\nimport
  Langchain.Prelude\n\n-- Pure state with a list-append reducer\ndata AgentState =
  AgentState { messages :: [Message], loopCount :: Int }\n\n-- Build the graph using
  pure combinators\nworkflow :: StateGraph AgentState IO\nworkflow =\n  addEdge \"reviewer\"
  \"planner\"          -- cyclic feedback loop!\n    $ addConditionalEdge \"executor\"\n
  \       (\\s -> pure $ if done s then Right endNodeId else Right \"reviewer\")\n
  \   $ addEdge \"planner\" \"executor\"\n    $ addEdge startNodeId \"planner\"\n
  \   $ addNode \"reviewer\" (Node reviewerNode replaceFieldReducer)\n    $ addNode
  \"executor\" (Node executorNode replaceFieldReducer)\n    $ addNode \"planner\"
  \ (Node plannerNode  replaceFieldReducer)\n    $ emptyStateGraph\n\nmain :: IO ()\nmain
  = do\n  checkpointer <- newMemoryCheckpointer\n  case compileGraph workflow of\n
  \   Left err -> print err\n    Right compiled -> do\n      result <- runGraph compiled
  initialState (Just checkpointer)\n      print result\n```\n*Run:* `stack run stategraphollama`
  or `stack run stategraphopenai`\n\n---\n\n### 4. Model Context Protocol (MCP) Tools
  Integration\n\nConnect Haskell agents to any external MCP server (e.g., Hackage
  doc search, SQLite, Filesystem, GitHub) over stdio:\n\n```haskell\n{-# LANGUAGE
  OverloadedStrings #-}\nimport Langchain.Prelude\n\nmain :: IO ()\nmain = do\n  --
  Connect to any MCP server via stdio JSON-RPC 2.0\n  client <- newStdioMcpClient
  \"docker\" [\"run\", \"-i\", \"--rm\", \"mcp/hackage-doc\"]\n  \n  -- Discover available
  tools from server\n  mcpTools <- listMcpTools client\n  let nativeTools = map mcpToolToLangchainTool
  mcpTools\n  \n  -- Bind tools to your ReAct or Plan-and-Execute Agent\n  let agent
  = createReActAgent model nativeTools defaultAgentConfig\n  res <- runReActAgent
  agent \"Search Hoogle for the signature of 'traverse'\"\n  print res\n```\n*Run:*
  `stack run mcpollama` or `stack run mcpopenai`\n\n---\n\n## Installation\n\n###
  Stack\nAdd to your `stack.yaml`:\n```yaml\nextra-deps:\n  - langchain-hs-core-0.0.5.0\n
  \ - langchain-hs-graph-0.0.5.0\n  - langchain-hs-0.0.5.0\n```\nThen in your `.cabal`
  or `package.yaml`:\n```yaml\ndependencies:\n  - langchain-hs        # full ecosystem
  (providers, agents, MCP, vector stores)\n  - langchain-hs-core   # pure core only
  (no HTTP dependencies)\n  - langchain-hs-graph  # graph engine only\n```\n\n###
  Cabal\n```bash\ncabal install langchain-hs\n```\n\n---\n\n## Development & Quality
  Commands\n\nThe repository enforces strict code quality and formatting via `make`:\n\n```bash\n#
  Build the entire monorepo and all 41 example executables\nstack build\n\n# Run unit
  and property-based test suites\nstack test\n\n# Run HLint across all source trees
  (zero hints policy)\nmake lint\n\n# Check code formatting with Fourmolu\nmake format-check\n\n#
  Format all files in-place\nmake format\n\n# Build the documentation website (Hakyll)\nmake
  site-build\n\n# Run live documentation server with auto-reload (port 8000)\nmake
  site-watch\n```\n\n---\n\n## Documentation & Research\n\n| Resource | Description
  |\n|:---|:---|\n| **[Hackage Docs](https://hackage.haskell.org/package/langchain-hs)**
  | Full Haddock API reference for all exported modules |\n| **[Whitepaper](whitepaper.md)**
  | Deep technical dive: category theory foundations, algebraic laws, effect-polymorphic
  design, and advanced multi-agent patterns |\n| **[Documentation Website](site/)**
  | Hakyll site with 20 component pages, live provider toggle, and instant search
  (`Cmd+K`) |\n| **[Examples](examples/)** | 41 runnable executables covering every
  component for Ollama and OpenAI |\n\nTo build the Haddock API docs locally:\n```bash\nmake
  docs\n# Opens in .stack-work/install/.../doc/index.html\n```\n\n---\n\n## License\n\nDistributed
  under the **MIT License**. See [LICENSE](LICENSE) for details.\n"
