changelog: "# Changelog for `langchain-hs`\n\n## 0.0.6.0 - 2026-10-15\n\n### Highlights\n\n-
  **Complete Modular Provider Architecture**:\n  All concrete AI providers and protocol
  clients are now decoupled into standalone Hackage packages:\n  - `langchain-hs-core`
  (0.0.6.0): Core abstractions, runnables, tools, agents, vector stores, memory, output
  parsers, and resilience.\n  - `langchain-hs-graph` (0.0.6.0): Production StateGraph
  engine with state reducers, checkpointing, and time-travel replay.\n  - `langchain-hs-ollama`
  (0.0.6.0): Ollama chat model and embeddings provider.\n  - `langchain-hs-openai`
  (0.0.6.0): OpenAI, OpenRouter, and OpenAI-compatible provider with structured output
  and streaming.\n  - `langchain-hs-gemini` (0.0.6.0): Google Gemini provider with
  function calling and SSE streaming.\n  - `langchain-hs-mcp` (0.0.6.0): Model Context
  Protocol (MCP) client over stdio and HTTP JSON-RPC 2.0.\n  - `langchain-hs` (0.0.6.0):
  Umbrella package re-exporting `langchain-hs-core` and `langchain-hs-graph`.\n\n###
  StateGraph Productionization (`langchain-hs-graph`)\n\n- Replaced prototype modules
  with robust execution combinators: `runGraph`, `runGraphWithConfig`, `runGraphInterleaved`,
  and `streamGraphSteps`.\n- Added `runnableNode` and `chatModelNode` combinators
  to lift arbitrary `Runnable` and `ChatModel` instances into graph nodes.\n- Full
  support for recursion limits, step-by-step transition logging, checkpointing, and
  human-in-the-loop interruption.\n\n### Memory Hardening (`langchain-hs-core`)\n\n-
  **`InVariableMemory`**: Thread-safe STM-backed transactional memory with snapshotting,
  resets, and clear semantics.\n- **`SessionMemory`**: Multi-session conversation
  manager supporting per-session state isolation, active session tracking, and TTL-based
  pruning.\n- **`FileMemory`**: Persistent file-backed conversation memory with atomic
  disk writes and metadata preservation across process restarts.\n- **Reset Helpers**:
  Added explicit seed-state reset combinators `resetConversationBuffer`, `resetWindowBuffer`,
  `resetTokenBuffer`, and `resetEntitiesToInitial`.\n- **Umbrella Prelude Re-exports**:
  Re-exported all memory implementations (`ConversationBufferMemory`, `SessionMemoryStore`,
  `EntityMemory`, `CombinedMemory`), buffer reset helpers, and `splitDocuments` in
  `Langchain.Prelude`.\n\n### Output Parsers & Document Loaders\n\n- Trimmed fragile
  character-scanning parsers (`NumberSeparatedList`) and redundant wrapper types (`JSONOutputStructure`)
  in favor of type-safe `StructuredOutput` and `TextOutputParser`.\n- Hardened boolean
  output parser to exact normalized token recognition.\n- Added standard numeric `OutputParser`
  instances for `Int`, `Integer`, and `Double` with whitespace stripping.\n- Eliminated
  lazy I/O file handle leaks in `FileLoader` and `DirectoryLoader` with strict text
  I/O.\n- Added `splitDocuments` preserving document metadata across chunk splits,
  and provided default `loadAndSplit` implementation in `BaseLoader`.\n\n### Breaking
  Changes from 0.0.5.0\n\n- Provider modules are no longer bundled in `langchain-hs`:\n
  \ - For Ollama: Add `langchain-hs-ollama` to dependencies and `import Langchain.Provider.Ollama`.\n
  \ - For OpenAI: Add `langchain-hs-openai` to dependencies and `import Langchain.Provider.OpenAI`.\n
  \ - For Gemini: Add `langchain-hs-gemini` to dependencies and `import Langchain.Provider.Gemini`.\n
  \ - For MCP: Add `langchain-hs-mcp` to dependencies and `import Langchain.MCP.Client`.\n-
  `Langchain.Prelude` no longer re-exports provider-specific constructors (`newOllama`,
  `newOpenAI`, `newGemini`, `newStdioMcpClient`). Import the corresponding provider
  package.\n- `JSONOutputStructure` and `NumberSeparatedList` have been removed from
  `Langchain.OutputParser.Core` and `Langchain.Prelude`. Use `StructuredOutput` or
  `TextOutputParser`.\n\n## 0.0.5.0 - 2026-09-10\n\n### Major Architecture & Ecosystem
  Evolution\n\n- **3-Tier Monorepo Architecture**:\n  - `langchain-hs-core` (0.0.5.0):
  Zero-dependency pure core with `RunnableTree`, `ChatModel`, `ContentBlock`, `Tool`,
  `StreamEvent`, and `LangchainT`.\n  - `langchain-hs-graph` (0.0.5.0): Graph-based
  state machine engine with `StateGraph`, `StateReducer`, checkpointers, HITL, and
  multi-agent coordination.\n  - `langchain-hs` (0.0.5.0): Production integrations
  for Ollama, OpenAI, Gemini, Vector Stores, MCP, and Observability.\n- **Pure AST
  Pipelines (`RunnableTree`)**:\n  - The core selling point: Every component implements
  the `Runnable` typeclass.\n  - Compose pure GADT abstract syntax trees using `|>>`
  (sequential composition), `&>&` (parallel fan-out), and `>>>#` (fallback failover)
  without side effects before interpretation.\n- **LangGraph in Haskell (`StateGraph`)**:\n
  \ - Cyclic state machines with pure state reducers (`StateReducer s`) satisfying
  monoid associativity laws.\n  - Thread-safe STM in-memory checkpointer (`MemoryCheckpointer`)
  and persistent `SQLiteCheckpointer`.\n  - First-class Human-in-the-Loop (`HITL`)
  node interruption, inspect/edit state, and resumption via `resumeGraph`.\n  - Time-travel
  state replay and Graphviz DOT visualization export.\n- **Model Context Protocol
  (MCP)**:\n  - Native stdio and HTTP JSON-RPC 2.0 client implementation.\n  - Dynamic
  tool inspection and bidirectional schema mapping to Haskell `Tool` definitions.\n-
  **Decoupled Monad Transformer (`LangchainT env m a`)**:\n  - Removed redundant global
  config structs in favor of parameterization over custom user environment `env`.\n
  \ - Complete `MonadReader`, `MonadError`, `MonadIO`, and `MonadTrans` instances.\n
  \ - OpenTelemetry distributed tracing spans (`withSpan`) and structured JSON telemetry.\n
  \ - Three-state Circuit Breaker, exponential backoff retries with randomized jitter,
  and in-memory caching.\n- **Dependency & Performance Upgrades**:\n  - Upgraded to
  `ollama-haskell` `0.4.1.0` with JSON schema grammar constraints.\n  - Migrated to
  `MercuryTechnologies/openai` client.\n  - Full PVP upper bounds across all packages
  for Hackage compliance.\n\n### Breaking Changes from 0.0.3.0\n\n- **`LangchainT`
  is now parameterized over `env`** (`LangchainT env m a` instead of the former implicit
  `LangchainConfig`).\n  - Replace `runLangchainT config action` with `runLangchainT
  env action` where `env` is your custom environment type (use `()` if you have no
  shared config).\n  - The `MonadReader env (LangchainT env m)` instance gives you
  `ask`/`asks` to read your environment from within the monad.\n- **`ChatMessage`
  renamed to `Message`** throughout — update all pattern matches and constructor calls.\n-
  **Agent modules restructured** — `Langchain.Agent` is now split into `Langchain.Agent.ReAct`
  and `Langchain.Agent.PlanAndExecute` with updated type signatures for tool-call
  support.\n- **Removed `HtmlLoader`, `JsonLoader`, and `WebPageLoader` from `Langchain.DocumentLoader`**
  — Along with the `tagsoup` dependency. Users can write custom document loaders tailored
  to their schemas and formats.\n\n## 0.0.3.0 - 2025-11-16\n\n### Added\n\n- Added
  Agent middleware support.\n- Added image input support for OpenAI and Gemini.\n\n###
  Fixed\n\n- Fixed Ollama stream's onComplete callback.\n- Fixed system_fingerprint
  field to be nullable.\n\n### Changed\n\n- * Revamped Agent module with native tool_call
  support and improved architecture.\n- * Migrated to Mercury's OpenAI client.\n-
  * Changed Ollama params to use ChatOps type.\n- * Renamed ChatMessage to ChatHistory.\n-
  * Parameterized StreamHandler Token type.\n- * Added Langchain error type for better
  error handling.\n- Updated ollama-haskell to 0.2.1.0.\n\n## 0.0.2.0 - 2025-05-04\n\n###
  Added\n\n- Added `OpenAI` LLM integration.\n- Added `DirectoryLoader` for loading
  Documents from a directory.\n- Added `HuggingFace` LLM integration.\n- Added docusaurus
  documentation.\n- Added `OpenAI` embeddings integration.\n- Added GHC CI matrix
  build.\n- Added `TokenBufferMemory` Memory integration.\n- Added `RetrievalQA` chain.\n-
  Added `CalculatorTool` tool.\n\n### Fixed \n\n- Fixed `loadAndSplit` function for
  `PdfLoader`.\n- Minor documentation fixes.\n- Fixed `WebScraper` to only scrape
  textual content.\n- Made langchain-hs buildable till stack-lts-19.33\n- Fixed `React`
  agent.\n\n### Changed\n\n- Generalized LLMParams to accept different type per LLM.
  \n"
changelog-type: markdown
description: "# LangChain Haskell (langchain-hs)\n\n> Type-Safe AI Agents & Multi-Agent
  Graphs in Haskell\n\nA functional, effect-polymorphic Haskell ecosystem for building
  production AI applications, featuring pure AST pipelines (`RunnableTree`), cyclic
  state graphs (`StateGraph`), Model Context Protocol (MCP), and OpenTelemetry observability.\n\n[![Hackage](https://img.shields.io/badge/hackage-0.0.6.0-blue.svg)](https://hackage.haskell.org/package/langchain-hs)\n[![GHC](https://img.shields.io/badge/GHC-9.8%2B-purple.svg)](https://www.haskell.org/ghc/)\n[![License:
  MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n[![Documentation](https://img.shields.io/badge/docs-website-blueviolet.svg)](https://tusharad.github.io/langchain-hs/)\n\n---\n\n##
  Installation\n\nInstall `langchain-hs` and provider packages via **Cabal**:\n\n```bash\ncabal
  update\ncabal install langchain-hs langchain-hs-ollama langchain-hs-openai\n```\n\nOr
  add to your `stack.yaml`:\n\n```yaml\nextra-deps:\n  - langchain-hs-0.0.6.0\n  -
  langchain-hs-core-0.0.6.0\n  - langchain-hs-graph-0.0.6.0\n  - langchain-hs-ollama-0.0.6.0\n
  \ - langchain-hs-openai-0.0.6.0\n```\n\nPackage reference on Hackage: [https://hackage.haskell.org/package/langchain-hs](https://hackage.haskell.org/package/langchain-hs)\n\n---\n\n##
  1. Simple Chat Calling\n\nSend a prompt to an LLM (local Ollama, OpenAI, or Gemini)
  and retrieve a typed response:\n\n```haskell\n{-# LANGUAGE OverloadedStrings #-}\nmodule
  Main where\n\nimport Control.Monad.Except (runExceptT)\nimport qualified Data.Text.IO
  as T\nimport Langchain.Prelude\nimport Langchain.Provider.Ollama\n\nmain :: IO ()\nmain
  = do\n  -- Connect to local Ollama instance (DeepSeek, Llama 3, Gemma, etc.)\n  model
  <- newOllama \"llama3.2\" defaultConfig\n  \n  let messages = [userMessage \"Explain
  in two sentences why Haskell makes AI agents more reliable.\"]\n  result <- runExceptT
  $ invoke model messages Nothing\n  \n  case result of\n    Left err   -> T.putStrLn
  $ errorMessage err\n    Right resp -> T.putStrLn $ extractMessageText resp\n```\n\n###
  Output\n\n```text\nHaskell's static type system prevents common agent failures like
  missing dictionary keys or unexpected nulls before code ever reaches production.
  Furthermore, pure state transitions guarantee that autonomous agents cannot silently
  mutate variables behind your back.\n```\n\n---\n\n## 2. JSON Structured Output\n\nGuarantee
  that the LLM response conforms to a typed Haskell record using `FromJSON` and `ToSchema`:\n\n```haskell\n{-#
  LANGUAGE DeriveAnyClass #-}\n{-# LANGUAGE DeriveGeneric #-}\n{-# LANGUAGE OverloadedStrings
  #-}\n{-# LANGUAGE TypeApplications #-}\nmodule Main where\n\nimport Data.Aeson (FromJSON)\nimport
  qualified Data.Text as T\nimport qualified Data.Text.IO as T\nimport GHC.Generics
  (Generic)\nimport Langchain.Prelude\nimport Langchain.Provider.Ollama\n\n-- Define
  your target data schema\ndata Developer = Developer\n  { name              :: T.Text\n
  \ , preferredLanguage :: T.Text\n  , yearsOfExperience :: Int\n  , favoriteLibrary
  \  :: T.Text\n  } deriving (Show, Generic, FromJSON, ToSchema)\n\nmain :: IO ()\nmain
  = do\n  model <- newOllama \"llama3.2\" defaultConfig\n  \n  let prompt =\n        [
  userMessage \"Extract profile: Alan has been writing Haskell for 8 years and loves
  langchain-hs.\" ]\n      options = withStructuredOutput (Proxy @Developer) defaultOllamaConfig\n\n
  \ result <- runLangchainT () $ invoke model prompt (Just options)\n  case result
  of\n    Left err  -> T.putStrLn $ errorMessage err\n    Right msg -> T.putStrLn
  $ extractMessageText msg\n```\n\n### Output\n\n```json\n{\n  \"name\": \"Alan\",\n
  \ \"preferredLanguage\": \"Haskell\",\n  \"yearsOfExperience\": 8,\n  \"favoriteLibrary\":
  \"langchain-hs\"\n}\n```\n\n---\n\n## 3. Tool Calling\n\nEquip models with effectful
  Haskell tools. The LLM automatically emits structured tool calls, which your application
  executes and feeds back for final synthesis:\n\n```haskell\n{-# LANGUAGE OverloadedStrings
  #-}\n{-# LANGUAGE TypeApplications #-}\nmodule Main where\n\nimport Control.Monad.IO.Class
  (liftIO)\nimport qualified Data.Text as T\nimport qualified Data.Text.IO as T\nimport
  Langchain.Prelude\nimport Langchain.Provider.Ollama\n\nmain :: IO ()\nmain = do\n
  \ model <- newOllama \"qwen2.5:7b\" defaultConfig\n  \n  -- Instantiate typed filesystem
  tool\n  let fsTool   = findFilesTool @IO defaultSecurityPolicy\n      toolCfg  =
  withTools [fsTool] defaultOllamaConfig\n      prompt   = [userMessage \"Search for
  Haskell source files using find_files with pattern '*.hs'.\"]\n\n  res <- runLangchainT
  () $ do\n    response <- invoke model prompt (Just toolCfg)\n    case messageToolCalls
  response of\n      Just (tCall:_) -> do\n        liftIO $ T.putStrLn $ \"Tool Invoked:
  \" <> toolCallName tCall\n        liftIO $ T.putStrLn $ \"Arguments:    \" <> T.pack
  (show (toolCallArguments tCall))\n        \n        -- Execute tool with LLM arguments\n
  \       execResult <- liftIO $ toolExecute fsTool (toolCallArguments tCall)\n        let
  observation = case execResult of\n              Left err  -> \"Error: \" <> errorMessage
  err\n              Right out -> out\n        liftIO $ T.putStrLn $ \"Observation:
  \ \" <> observation\n        \n        -- Supply tool observation back to model
  for final response\n        let toolMsg = (toolMessage observation) { messageName
  = Just (toolCallName tCall) }\n            thread  = prompt ++ [response, toolMsg]\n
  \           \n        finalMsg <- invoke model thread (Just toolCfg)\n        liftIO
  $ T.putStrLn \"\\nFinal Assistant Answer:\"\n        liftIO $ T.putStrLn $ extractMessageText
  finalMsg\n      _ -> do\n        liftIO $ T.putStrLn $ extractMessageText response\n\n
  \ case res of\n    Left err -> T.putStrLn $ \"Error: \" <> errorMessage err\n    Right
  () -> pure ()\n```\n\n### Output\n\n```text\nTool Invoked: find_files\nArguments:
  \   fromList [(\"pattern\",String \"*.hs\")]\nObservation:  [\"src/Main.hs\",\"src/Agent.hs\",\"src/Tools.hs\"]\n\nFinal
  Assistant Answer:\nI scanned the repository and identified 3 Haskell source files
  matching your pattern:\n- src/Main.hs\n- src/Agent.hs\n- src/Tools.hs\n```\n\n---\n\n##
  4. ReAct Agent\n\nRun an autonomous **Reason + Act** agent loop that decomposes
  user tasks, selects tools, evaluates observations, and iterates until completion:\n\n```haskell\n{-#
  LANGUAGE OverloadedStrings #-}\nmodule Main where\n\nimport Control.Monad.Except
  (runExceptT)\nimport qualified Data.Text.IO as T\nimport Langchain.Prelude\nimport
  Langchain.Provider.Ollama\n\nmain :: IO ()\nmain = do\n  -- Setup sample file for
  demonstration\n  writeFile \"/tmp/server_status.txt\" \"Service: api-gateway, Status:
  Degraded, Latency: 420ms\"\n  \n  model <- newOllama \"qwen2.5:7b\" defaultConfig\n
  \ \n  -- Equip agent with file inspection tools\n  let policy = defaultSecurityPolicy\n
  \     tools  = [readFileTool Nothing policy, findFilesTool policy]\n      agent
  \ = defaultReActAgent model tools\n      prompt = [userMessage \"Inspect /tmp/server_status.txt
  using read_file and summarize the service health.\"]\n\n  res <- runExceptT $ runReActAgent
  agent prompt\n  case res of\n    Left err  -> T.putStrLn $ errorMessage err\n    Right
  msg -> T.putStrLn $ extractMessageText msg\n```\n\n### Output\n\n```text\n[ReAct
  Iteration 1]\nThought: I should read the contents of /tmp/server_status.txt to check
  the current health status.\nAction: read_file {\"path\": \"/tmp/server_status.txt\"}\nObservation:
  Service: api-gateway, Status: Degraded, Latency: 420ms\n\n[ReAct Iteration 2]\nThought:
  The file has been read. The api-gateway service is in a degraded state with elevated
  latency. I will now summarize this for the user.\n\nFinal Answer:\nThe api-gateway
  service is currently experiencing degraded health with high latency (420ms). Immediate
  investigation of the gateway service is recommended.\n```\n\n---\n\n## Documentation
  & Resources\n\n- **Hackage Package:** [https://hackage.haskell.org/package/langchain-hs](https://hackage.haskell.org/package/langchain-hs)\n-
  **Documentation Website:** [https://tusharad.github.io/langchain-hs/](https://tusharad.github.io/langchain-hs/)\n-
  **Whitepaper:** [whitepaper.md](whitepaper.md) (Effect polymorphism, categorical
  design, state graphs)\n- **Examples Directory:** [`examples/`](examples/)\n\n---\n\n##
  Development & Testing\n\n```bash\n# Build project\nstack build\n\n# Run test suite\nstack
  test\n\n# Code quality checks\nmake lint\nmake format-check\n```\n\n---\n\n## License\n\nDistributed
  under the **MIT License**. See [LICENSE](LICENSE) for details.\n"
