changelog-type: markdown
description: |
  # language-wgsl

  A simple Haskell package for representing [WGSL](https://www.w3.org/TR/WGSL),
  intended to closely match the specification. This package does not currently
  include a parser, and also does not represent purely syntactic details (such as
  whether an integer is hex or decimal).
