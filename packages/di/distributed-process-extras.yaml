changelog: "2026-10-22 Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.3.10
  \n\n* Added support for `time-1.15` and `time-1.16`.\n* Added support for `containers-0.8`.\n\n2025-02-04
  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.3.9\n\n* Ported test
  suite to use `tasty` rather than `test-framework`.\n* Addressed some compilation
  warnings (#467).\n\n2024-10-30  David Simmons-Duffin <dsd@caltech.edu> 0.3.8\n\n*
  Bump dependency bound for ansi-terminal\n\n2024-10-30 Laurent P. René de Cotret
  <laurent.decotret@outlook.com> 0.3.7\n\n* Removed dependency on `rematch` (#459)\n\n2024-09-03
  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.3.6\n\n* Bumped dependency
  bounds to support GHC 8.10.7 - GHC 9.10.1\n* Updated links to point to Distributed
  Haskell monorepo\n\n2017-06-13 Alexander Vershilov <alexander.vershilov@gmail.com>
  0.3.5\n* Bump dependencies\n* Cleanup code\n\n2017-02-05 Tim Watson <watson.timothy
  @ google mail service dot com> 0.3.0\n\n* re-implement whereIsRemote in terms of
  whereIsRemoteAsync\n* re-implement whereisOrStart to avoid leaking zombie processes\n*
  implement general NFSerializable instances\n* make Resolvable instance of (NodeId,
  String) exception safe\n* remove dependency on data-accessor\n* Relax upper bound
  on time for testing\n* documentation fixes and improvements\n\n2017-02-05 Tim Watson
  <watson.timothy @ google mail service dot com> 0.3.0\n\n* Update dependency bounds
  - drop support for distributed-process < 0.6.6\n* Drop support for GHC < 7.10\n*
  Fixes for testing with latest stack and CI changes\n\n2016-02-16 Facundo Domínguez
  <facundo.dominguez@tweag.io> 0.2.1.2\n\n* Update dependency bounds.\n\n2015-06-15
  Facundo Domínguez <facundo.dominguez@tweag.io> 0.2.1\n\n* Use random port in tests.\n*
  Add compatibility with ghc-7.10.\n* Fix dependency bounds.\n* Add missing NFData
  instances.\n"
