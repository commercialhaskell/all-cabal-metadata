description: "# i2c-bus\n\nLibrary for typed I2C communication with utilities for
  working with registers. \nImporting the module `I2C` will typically give you everything
  you need unless \nyou need access to low level functionality provided by your backend.\n\n\n##
  Features\n\n* Connections to chips on I2C buses.\n* An exception type `I2CErr`.\n*
  A module `I2C.Raw` to perform direct write and read using `Storable` types.\n* A
  module `I2C.Register` to work with chips that use registers. \n* Types for binary
  serialization between host architecture and chip hardware.\n* Handy utilities through
  Template Haskell to define chips, registers and \n  (sub)fields of registers.\n*
  Settings to control the code generation by Template Haskell.\n* An API specification
  for backend implementations. Currently, there is only \n  a Linux backend implemented.\n*
  `safe` FFI imports so that the calls do not block \n  [Haskell concurrency](https://www.vex.net/~trebla/haskell/ghc-conc-ffi.xhtml).\n\n\n##
  Examples\n\n~~~haskell\n{-# LANGUAGE TemplateHaskell #-}\nimport I2C\n\n$(chip \"PCF8575\")\n\ntestPCF8575
  :: IO ()\ntestPCF8575 = do\n    chip <- openChip @PCF8575 \"/dev/i2c-1\" 0x20\n
  \   \n    forM_ [0..0x00FF] $ \\ix -> do\n        rawwrite @Word16LE chip ix\n        threadDelay
  400000\n\n\n$(chip \"MYCHIP\")\n\n$(register8 ''MYCHIP 0x22 \"MY8\" 0x83)\n-- ^
  a register of type 'Word8' named MY8 at address 0x22 with default \n--   value 0x83.
  this generates a type 'MY8' and a value \n--   'regMY8 :: Register MYCHIP MY8'\n\n$(field
  ''MY8   \"A_FIELD\"  \"0000***0\")\n-- ^ MY8 contains a 3 bit (sub)field named A_FIELD.
  this generates a \n--   type 'A_FIELD' with get and set functions over the 'MY8'
  type.\n\n$(field ''MY8   \"A_BIT\"    \"00*00000\")\n-- ^ MY8 also has a one bit
  field named A_BIT. this generates a type\n--   'A_BIT' with get and set functions
  over the 'MY8' type, and \n--   additional functions for bit manipulation (bitset,
  bitclear, bittoggle).\n\n$(register ''MYCHIP 0x33 \"MY_A\" ''A)\n-- ^ a register
  of type 'A' named MY_A at address 0x33. \n--   this generates a value 'regMY_A ::
  Register MYCHIP A'. the type\n--   'A' must be an instance of 'Storable', and its
  implementation has to\n--   be relative to the chip hardware.\n~~~\n\nSee [tests/GHCI.hs](tests/GHCI.hs)
  and [tests/ssd1306](tests/ssd1306) for more examples. \n\n![Example](https://github.com/karamellpelle/i2c-bus/blob/main/README/example0.gif?raw=true)\n"
