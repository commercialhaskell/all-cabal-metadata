changelog: "## UNRELEASED\n\n## QuickCheck 2.19.0.0 (released 2026-09-16)\n* Additional
  `Arbitrary1` instances \n* Add compat instances for `OneTuple`\n* Better deprecation
  warning\n* Fix typos (thanks Ang)\n\n## QuickCheck 2.18.0.0 (released 2026-02-26)\n*
  BREAKING: Added a number of `CoArbitrary` and `Function` instances for types in
  `base`\n* Improve implementation of `shrinkIntegral` (thanks tom93)\n* Improve implementation
  of `Arbitrary NonEmptyList` (thanks konsumlamm)\n* Convert changelog to markdown
  (thanks Artem)\n* Deprecate `withMaxSuccess` in favour of the renamed `withNumTests`\n*
  `Test.QuickCheck.Function` marked as `Trustworthy` not `Safe`\n* Fix bug in heap
  example\n\n## QuickCheck 2.17.1.0 (released 2025-10-13)\n* Fix random-1.2 support
  (thanks bodigrim)\n* Update docs (thanks effectfully)\n\n## QuickCheck 2.17.0.0
  (released 2025-10-07)\n* Lower the memory use of `arbitrary` for `Double` and `Float`
  (thanks\nChickenProp)\n* BREAKING: Remove `Gen.Class`\n* BREAKING: Add `Arbitrary`
  instances for most of the types in `base`\n* Add microHS support (thanks Lennart)\n\n##
  QuickCheck 2.16.0.0 (released 2025-06-17)\n* Add a `Safe` declaration to `Test.QuickCheck.Monoids`\n*
  Fix `Test.QuickCheck.Features` to not depend on the internal testing loop\n* Add
  `withProgress` to install common callbacks for downstream tools\n* Relax bounds
  on `random` dependency (thanks to LaurentRDC and\nAndreas Abel)\n* Fix some haddock
  issues (thanks to pgujjula)\n* Use `displayException` instead of `show` (thanks
  Edsko)\n* Added helper monoids `Every` and `Some` for predicates (thanks\nMarcin)\n\n##
  QuickCheck 2.15 (released 2024-04-22)\n* BREAKING: properties without quantification
  are no longer implicitly\n  wrapped in once\n* Add witness property modifier and
  witnesses field in result on\ncompilers that support Typeable to allow conveniently
  exposing\ncounterexamples\n* Add assertException, assertExceptionIO, assertDeepException,
  and\nassertDeepExceptionIO (thanks to Alexey Kuleshevich)\n* Add withMaxSize, withMaxShrinks,
  and withMaxDiscardRatio combinators\n* Add recheck\n* Add HasCallStack to partial
  top-level functions\n* Updated some documentation\n* Fix overflow bug when calculating
  discard ratio\n* Fix error printing bug when shrinks are discarded\n* Fix withMaxSuccess
  not working when checkCoverage is turned on\n* Fix a bug whereby an unfortunately
  timed discard could unduly fail a\nproperty running with checkCoverage\n* Fix Arbitrary
  instance for Map breaking invariants from\nData.Map.Strict (thanks to Neil Mayhew)\n*
  Fix non-covered classes not showing up in output as 0% covered\n* Fix Negative's
  Arbitrary instance discarding an unnecessary number\nof generated values.\n* Fix
  promote doing an unnecessary seed split\n* Fix a bug whereby maxSuccess and discardRatio
  would interact poorly\nto produce too few size increases.\n* Fix a couple of underflow
  bugs in generators for Small Natural and\nRatio Natural\n* Fix a bug whereby the
  internal DISCARDED exception would show up\nuser-side in sample\n\n## QuickCheck
  2.14.3 (released 2023-05-31)\n* Add shrinkBoundedEnum (thanks to Jonathan Knowles)\n*
  Add discardAfter for discarding tests on timeout (thanks to Justus Sagemüller)\n*
  Add assertWith for monadic testing (thanks to KtorZ)\n* Add functionElements to
  Test.QuickCheck.Function (thanks to Oleg Grenrus)\n* Add Arbitrary instance for
  Newline (thanks to Daniel Bramucci)\n* Improve Arbitrary instances for Float and
  Double (thanks to Oleg Grenrus)\n* Improve arbitrarySizedFractional (thanks to Bodigrim)\n*
  Fix shrinkRealFrac and shrinkDecimal, which were broken\n* Speed up printing of
  progress messages (thanks to Bodigrim)\n* Add COMPLETE pragmas for Fn and family
  (thanks to ilkecan)\n* Make templateHaskell flag manual (thanks to Oleg Grenrus)\n\n##
  QuickCheck 2.14.2 (released 2020-11-14)\n* Add Arbitrary instances for Tree (thanks
  to Oleg Grenrus)\n* GHC 9.0 compatibility (thanks to Vilem-Benjamin Liepelt)\n\n##
  QuickCheck 2.14.1 (released 2020-07-05)\n* Compatibility with random >= 1.2.\n\n##
  QuickCheck 2.14 (released 2020-03-28)\n* QuickCheck is now much faster at generating
  test data!\n  As a result, many properties can now be tested a lot faster;\n  the
  examples distributed with QuickCheck run about twice as\n  fast as before, for example.
  Of course, your mileage may vary.\n\n  The reason for this is that there are now
  specialised versions\n  of the 'choose' combinator for various types. These are:\n
  \ chooseInt, chooseInteger, chooseBoundedIntegral, and chooseEnum.\n  These combinators
  are identical to 'choose' but much faster.\n  All QuickCheck combinators, with the
  exception of 'choose'\n  itself, use the new combinators behind the scenes.\n\n
  \ You should see a speedup without doing anything, but to get a\n  further speedup,
  consider replacing any uses of 'choose' in your\n  own generators with the new combinators.\n\n
  \ We are hoping that future releases of the 'random' library may\n  speed up 'choose',
  in which case these combinators may no longer\n  be needed.\n\n  Thanks to Oleg
  Grenrus for suggesting to bypass 'choose' for\n  random number generation, and providing
  the appropriate\n  primitive in his 'splitmix' random number library.\n\n* Smaller
  changes and bugfixes:\n- RecursivelyShrink and GSubterms are exported from\n  Test.QuickCheck.Test
  (thanks to Tom Mortiboy).\n- Don't generate invalid unicode characters\n  (thanks
  to Boris Stepanov).\n- When a call to 'within' fails, include the duration of the\n
  \ timeout in the failure report (thanks to William Rusnack).\n- In Gen, avoid splitting
  the seed in the implementation of\n  >>, *> and <* (thanks to David Feuer).\n- Fix
  a couple of bugs with shrinking of floating-point\n  numbers.\n- Export functionMapWith,
  functionEitherWith and\n  functionPairWith from Test.QuickCheck.Function\n  (thanks
  to Oleg Grenrus).\n- Remove redundant RealFloat constraint from\n  Arbitrary/CoArbitrary
  instances for Complex\n  (thanks to Bodigrim).\n\n## QuickCheck 2.13.2 (released
  2019-06-30)\n* Compatibility with GHC 8.8 (thanks to Bodigrim)\n* Improve error
  message when 'frequency' is used with only zero weights\n* Add 'functionVoid' combinator
  (thanks to Oleg Grenrus)\n* Tighten bounds for random package (thanks to Oleg Grenrus)\n\n##
  QuickCheck 2.13.1 (released 2019-03-29)\n* A couple of bug fixes\n\n## QuickCheck
  2.13 (released 2019-03-26)\n* Properties with multiple arguments now shrink better.\n
  \ Previously, the first argument was shrunk, then the second, and\n  so on. Now,
  the arguments are shrunk as a whole, so shrink steps\n  for different arguments
  can be interleaved.\n\n* New features:\n    - New modifiers Negative and NonPositive\n
  \   - A Testable instance for Maybe prop (where Nothing means 'discard\n      the
  test case')\n* Dependencies on C code removed:\n    - Use splitmix instead of tf-random
  for random number generation\n    - Remove dependency on 'erf' package\n* Small
  changes:\n    - Say 'Falsified' instead of 'Falsifiable' when a property fails\n*
  Compatibility improvements:\n    - Explicitly derive instance Typeable Args\n    -
  Lower bound on deepseq\n    - A script for building Hugs packages\n\n## QuickCheck
  2.12.6 (released 2018-10-02)\n* Make arbitrarySizedBoundedIntegral handle huge sizes
  correctly.\n* Add changelog for QuickCheck 2.12.5 :)\n\n## QuickCheck 2.12.5 (released
  2018-09-30)\n* Export isSuccess from Test.QuickCheck.\n* Export CoArbitrary even
  when generics are disabled (bugfix).\n* Fix bug in shrinkDecimal.\n* Include Test.QuickCheck.Gen
  in exposed modules for Haddock.\n\n## QuickCheck 2.12.3, 2.12.4 (released 2018-09-12)\n*
  Shrinking for Float and Decimal now works by reducing the number\n  of digits in
  the number. The new function shrinkDecimal\n  implements this shrinking behaviour.\n*
  Shrinking for Rational now tries to make the numerator and\n  denominator of the
  number smaller. Previously it tried to reduce\n  the magnitude of the number.\n\n##
  QuickCheck 2.12.2 (released 2018-09-10)\n* Fix infinite shrinking loop for fractional
  types.\n* Add SortedList modifier.\n\n## QuickCheck 2.12.1 (released 2018-09-06)\n*
  Fix bug in 'classify'.\n\n## QuickCheck 2.12 (released 2018-09-03)\n* Silently breaking
  changes!\n    - The Arbitrary instance for Word now generates only small\n      values,
  the same as Int\n    - cover no longer causes a property failure if coverage is\n
  \     insufficient. It just prints a warning. (But see next item!)\n\n* Overhaul
  of label/cover family of combinators:\n    - New property combinator checkCoverage,
  which checks coverage\n      requirements in a statistically sound way, and *does*
  fail if\n      they are not met.\n    - Order of arguments to cover swapped, to
  make it easier to\n      switch between classify and cover\n    - New combinators
  tabulate and coverTable, for reporting test\n      case distribution more flexibly
  than label.\n    - When label is called multiple times in a property, each call\n
  \     produces a separate table of frequencies.\n\n* New functions:\n    - (=/=):
  like (/=), but prints a counterexample\n      (thanks to tom-bop)\n    - forAllShow/forAllShrinkShow:
  quantification using an\n      explicit show function (thanks to Stevan Andjelkovic)\n
  \   - forAllBlind/forAllShrinkBlind: quantification without\n      printing anything\n
  \   - verboseShrinking: see how a counterexample is shrunk\n    - labelledExamples:
  given a property which uses label,\n      generate an example test case for each
  label\n    - idempotentIOProperty: a variant of ioProperty which shrinks\n      better
  but only works for idempotent I/O actions\n\n* Other improvements:\n    - MonadFix
  Gen instance (thanks to Jon Fowler)\n    - Rational numbers shrink using continued
  fractions\n      (thanks to Justus Sagemüller)\n    - Function instances for Const,
  Identity, and the types in\n      Data.Monoid; instance Functor Fun (thanks to Erik
  Schnetter\n      and Xia Li-yao)\n    - More of Test.QuickCheck.Function is exported
  from\n      Test.QuickCheck\n    - Semantics of .||. changed to improve short-circuiting:\n
  \     if the left argument's precondition is false, the right\n      argument is
  not evaluated and the whole disjunction is\n      considered to have a false precondition\n
  \   - Bug fix: suchThatMaybe always increased size to at least 1\n\n* Miscellaneous
  API changes:\n    - Result type has changed a bit:\n        - InsufficientCovered
  constructor is gone\n        - Type of labels has changed\n        - New fields
  classes, tables\n\n## QuickCheck 2.11.1 - 2.11.3 (released 2018-01-12)\n* Cosmetic
  fixes.\n\n## QuickCheck 2.11 (released 2018-01-12)\n* New features:\n    - InfiniteList
  modifier generates infinite lists and shows\n      only the relevant part.\n    -
  applyArbitrary2/3/4 for applying a function to random\n      arguments.\n    - Template
  Haskell function allProperties returns all\n      properties in a module.\n\n* Applicative
  Gen instances do less splitting.\n* Property now has a Typeable instance.\n* (===)
  now prints correct output when the property is true.\n* Test.QuickCheck now exports
  Fun constructor.\n* verboseCheck output is now slightly less confusing.\n\n## QuickCheck
  2.10.1 (released 2017-10-06)\n* Arbitrary instances for Foreign.C.Types are available
  in more\n  GHC versions.\n* Fixed a bug where withMaxSuccess didn't adjust the allowed\n
  \ number of discarded tests.\n* Remove quadratic behaviour in terminal output.\n\n##
  QuickCheck 2.10 (released 2017-06-15)\n* New combinators:\n    - withMaxSuccess
  sets the maximum number of test cases for a property.\n    - shrinkMap/shrinkMapBy
  are helpers for defining shrink functions.\n    - total checks that a value is non-crashing.\n
  \   - suchThatMap is similar to 'suchThat'\n      but takes a Maybe-returning function
  instead of a predicate.\n    - getSize returns the current test case size.\n\n*
  Random strings and characters now include Unicode characters by\n  default. To generate
  only ASCII characters, use the new\n  ASCIIString modifier or arbitraryASCIIChar
  generator.\n  The following modifiers and generators also control the\n  kind of
  strings generated: UnicodeString, PrintableString,\n  arbitraryUnicodeChar, arbitraryPrintableChar.\n\n*
  QuickCheck no longer catches asynchronous exceptions, which\n  means that pressing
  ctrl-C will now cancel testing without\n  printing a counterexample. If you are
  debugging an infinite loop,\n  please use the 'within' combinator or 'verboseCheck'
  instead.\n  ('within' is better as it allows the counterexample to be\n  shrunk.)\n\n*
  Much of Test.QuickCheck.Function (showable random functions)\n  is now exported
  from Test.QuickCheck.\n    - Test.QuickCheck.Function now defines functions and\n
  \     pattern synonyms which simplify testing functions of\n      more than one
  argument: apply2, apply3, Fn2, Fn3.\n\n* New typeclasses Arbitrary1 and Arbitrary2
  which lift Arbitrary\n  to unary/binary type constructors, like in Data.Functor.Classes.\n\n*
  Some Arbitrary instances have been removed: NonEmpty, Natural.\n  This is because
  they resulted in a lot of extra dependencies.\n  You can now find them in the quickcheck-instances
  package.\n  Alternatively, use the NonEmptyList and NonNegative modifiers.\n\n*
  New Arbitrary instances for the following types: Proxy, ExitCode,\n  WrappedMonad,
  WrappedArrow, QCGen, and the types in\n  Foreign.C.Types and Data.Functor.{Product,Compose}.\n
  \ Also a Function instance for Word.\n\n* The functions in Test.QuickCheck.Monadic
  which take an argument\n  of type PropertyM m a now expect that 'a' to be Testable,
  and test it.\n  To reduce breakage from this, () is now an instance of Testable
  which\n  always succeeds.\n    - PropertyM now has a MonadFail instance on recent
  GHCs.\n      Furthermore, the constraints on some instances were loosened.\n\n*
  Miscellaneous API changes:\n    - Result now returns the counterexample as a list
  of strings.\n      See the \"failingTestCase\" field.\n    - Args now has a `maxShrinks`
  argument, the maximum number of\n      shrinks to try before giving up shrinking.\n
  \   - The 'labels' field of Result now encodes frequencies as Doubles\n      rather
  than Ints.\n\n* Bugfixes:\n    - 'Test.QuickCheck.Function', 'Test.QuickCheck.Poly',
  and\n      'Test.QuickCheck.Monadic' are now Safe modules.\n    - Result.theException
  and Result.reason were taken from\n      the pre-shrunk counterexample, not the
  shrunk one.\n    - The Testable Property instance improperly used 'again'.\n    -
  Gen.>>= is strict in the result of split, fixing a space leak.\n    - within now
  gives a better error message on timeout\n\n* Some more examples and links have been
  added to the documentation.\n\n## QuickCheck 2.9.2 (released 2016-09-15)\n* Fix
  a bug where some properties were only being tested once\n* Make shrinking of floating-point
  values less aggressive\n* Add function chooseAny :: Random a => Gen a\n\n## QuickCheck
  2.9.1 (released 2016-07-11)\n* 'again' was only used in forAllShrink, not forAll\n\n##
  QuickCheck 2.9 (released 2016-07-10)\n* Arbitrary, CoArbitrary and Function instances
  for more types\n* Generics for automatic Function instances\n* A new combinator
  \"again\" which undoes the effect of \"once\"\n* Remove \"exhaustive\" from Testable
  typeclass;\n  instead, combinators which are nonexhaustive (such as forAll)\n  call
  \"again\", which should be more robust\n\n* Drop support for GHC 6.x\n\n* Fixed
  bugs:\n    * arbitrarySizedBoundedIntegral wasn't generating huge integers\n    *
  verboseCheck failed with Test.QuickCheck.Function\n    * label had a space leak\n\n##
  QuickCheck 2.8.2 (released 2016-01-15)\n* GHC 8 support\n* Add Arbitrary and CoArbitrary
  instances for types in\n  containers package\n* Improve speed of shuffle combinator\n*
  Only print to stderr if it's a terminal.\n* Small changes: slightly improve documentation,\n
  \ remove redundant constraints from some functions' types,\n  small improvements
  to Test.QuickCheck.All.\n\n## QuickCheck 2.8.1 (released 2015-04-03)\n* Fix bug
  where exceptions thrown printing counterexamples weren't\n  being caught when terminal
  output was disabled\n* Don't export Test.QuickCheck.Property.result\n\n## QuickCheck
  2.8 (released 2015-03-18)\n* New features:\n    * Support for GHC 7.10\n    * Arbitrary
  instance for Natural\n    * New generators shuffle and sublistOf\n    * Support
  for generic coarbitrary\n    * When using the cover combinator, insufficient coverage
  now\n      causes the property to fail\n\n* API changes:\n    * Test.QuickCheck.Function:
  new pattern synonym Fn\n    * genericShrink no longer requires Typeable\n    * Result
  has a new constructor InsufficientCoverage\n    * resize throws an error if the
  size is negative\n\n* Bug fixes:\n    * Fix memory leaks\n    * Exceptions thrown
  by callbacks now cause the test to fail\n    * Fixed a bug where the cover combinator
  wouldn't give a\n      warning if coverage was 0%\n\n## QuickCheck 2.7.3 (released
  2014-03-24)\n* Add annotations for Safe Haskell.\n\n## QuickCheck 2.7.2 (released
  2014-03-22)\n* Fix bug in cabal file which broke cabal test\n\n## QuickCheck 2.7.1
  (released 2014-03-20)\n* Fixed bug - the Small modifier didn't work on unsigned
  types\n* Changed arbitrarySizedIntegral to have an Integral constraint\n  instead
  of just Num\n\n## QuickCheck 2.7 (released 2014-03-19)\n\n* New features:\n    *
  New genericShrink function provides generic shrinking with GHC.\n    * New combinator
  x === y: fails if x /= y, but also prints their values\n    * New function generate
  :: Gen a -> IO a for running a generator.\n    * New combinators infiniteList and
  infiniteListOf for generating infinite lists.\n    * Several combinators added to
  the main Test.QuickCheck module which\n      were previously languishing in other
  modules. Of particular interest:\n      quickCheckAll, ioProperty.\n    * New combinators
  delay and capture which can be used (unsafely!)\n      to reuse the random number
  seed. Useful for generating\n      polymorphic (rank-2) values.\n    * A new Discard
  data type and a Testable instance for discarding test cases.\n    * All modifiers
  now have Functor instances and accessor functions.\n    * Pressing ctrl-C during
  shrinking now shows the last failed\n      test case, rather than the current shrinking
  candidate.\n    * Experimental support for UHC. You will need the latest version
  of Cabal from git.\n\n* Better distribution of test data:\n    * The Int generator
  now only generates fairly small numbers.\n    * The new Small and Large modifiers
  control the distribution of integers\n      (Small generates small numbers, Large
  from the whole range).\n    * Floating-point numbers shrink better.\n\n* Improved
  random number generation:\n    * QuickCheck now uses TFGen rather than StdGen on
  newer versions\n      of GHC, because StdGen's random numbers aren't always random.\n
  \   * 'variant' now uses a prefix code. This should prevent some\n      potential
  bananaskins with coarbitrary.\n\n* API changes:\n    * The Gen monad now uses an
  abstract type QCGen rather than StdGen.\n    * The Result type now returns the thrown
  exception and number\n      of failed shrink attempts.\n    * Property is now a
  newtype rather than Gen Prop as it was before.\n    * promote is moved into the
  new module Test.QuickCheck.Gen.Unsafe.\n    * 'printTestCase' is deprecated - its
  new name is 'counterexample'\n    * 'morallyDubiousIOProperty' is deprecated - its
  new name is\n      'ioProperty', no moral judgement involved :)\n\n## QuickCheck
  2.6 (released 2013-03-07)\n\n* Add convenience Function instances for up to 7-tuples\n*
  Make stderr line buffered to reduce console I/O.\n* Return a flag to say whether
  the test case was interrupted.\n\n## QuickCheck 2.5 (released 2012-06-18)\n\n* Replace
  maxDiscard with maxDiscardRatio\n* Remove Testable () instance.\n* Added a 'discard'
  exception that discards the current test case\n* Add accessors for modifiers (where
  it makes sense)\n* Rename 'stop' to 'abort' to avoid a name clash\n* Added a 'once'
  combinator\n* If a property is of type Bool, only run it once\n* Add coarbitraryEnum
  to Test.QuickCheck module.\n* Add 'coarbitrary' helper for Enums.\n* Rejiggled the
  formatting code to support multi-line error messages\n* Add instances for Ordering
  and Fixed.\n* Added arbitraryBoundedEnum generator (thanks to Antoine Latter).\n*
  Add verboseCheckAll and polyverboseCheck function for usability.\n"
changelog-type: markdown
description: |
  This is QuickCheck 2, a library for random testing of program properties.

  Add `QuickCheck` to your package dependencies to use it in tests or REPL.

  The quickcheck-instances [1] companion package provides instances for types in
  Haskell Platform packages at the cost of additional dependencies.

  The make-hugs script makes a Hugs-compatible version of QuickCheck.
  It may also be useful for other non-GHC implementations.

  [1]: http://hackage.haskell.org/package/quickcheck-instances
