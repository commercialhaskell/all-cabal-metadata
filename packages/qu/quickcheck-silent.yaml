changelog: "# Revision history for quickcheck-silent\n\n## 0.11.0.5 -- 2026-08-07\n\n*
  Updated `build.sh` based on feedack from `#haskell` on\n  [Libera](https://libera.chat/).\n
  \ ```irc\n  14:16 < comerijn> gentauro: At any rate to reproduce your hackage error
  I would try: cabal sdist, then copy the tarball to a new directory, unzip the tarball,
  try and build in that new directory, see if it works\n  ```\n\n* Adding, `withNumTests`
  based on feedack from `#haskell` on\n  [Libera](https://libera.chat/).\n  ```irc\n
  \ 14:46 < tomsmeding> gentauro: or too narrow, or something; in particular, Test.QuickCheck.Property.withNumTests
  is new since QuickCheck-2.18.0.0\n  ```\n\n## 0.11.0.4 -- 2026-08-07\n\n* Re-exporting
  `Test.QuickChech.Result` to avoid dependency on the `QuickChech`\n  package\n\n##
  0.11.0.3 -- 2026-08-07\n\n* There seem to be a lot of errors that aren't happening
  on build of the\n  project, but then, they are showing up when building the `Hackage`
  package:\n  \n  ```sh\n  Running phase: buildPhase\n  Preprocessing library for
  quickcheck-silent-0.11.0.2...\n  Building library for quickcheck-silent-0.11.0.2...\n
  \ [1 of 1] Compiling Test.QuickCheck.Silent ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o,
  dist/build/Test/QuickCheck/Silent.dyn_o )\n  <no location info>: error: [GHC-08674]\n
  \     The package (containers-0.7) is required to be trusted but it isn't!\n  ```\n\n##
  0.11.0.2 -- 2026-08-07\n\n* This did not help at all:\n\n  > _Hopefully importing
  the method from `Test.QuickCheck.Property` might help_\n\n  ```sh\n  Running phase:
  buildPhase\n  Preprocessing library for quickcheck-silent-0.11.0.1...\n  Building
  library for quickcheck-silent-0.11.0.1...\n  [1 of 1] Compiling Test.QuickCheck.Silent
  ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o, dist/build/Test/QuickCheck/Silent.dyn_o
  )\n  src/Test/QuickCheck/Silent.hs:70:16: error: [GHC-76037]\n      Not in scope:
  ‘QCP.withNumTests’\n      NB: the module ‘Test.QuickCheck.Property’ does not export
  ‘withNumTests’.\n     |\n  70 |   SilentProp . QCP.withNumTests n\n     |\n  ```\n\n*
  Therefore, `withNumTests` logic will be removed until fixed.\n\n## 0.11.0.1 -- 2026-08-07\n\n*
  It seems that there are some issues to build the package on `ghc-9.10.3`:\n\n  ```sh\n
  \ Running phase: buildPhase\n  Preprocessing library for quickcheck-silent-0.11.0.0...\n
  \ Building library for quickcheck-silent-0.11.0.0...\n  [1 of 1] Compiling Test.QuickCheck.Silent
  ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o, dist/build/Test/QuickCheck/Silent.dyn_o
  )\n  src/Test/QuickCheck/Silent.hs:38:5: error: [GHC-61689]\n      Module ‘Test.QuickCheck’
  does not export ‘withNumTests’.\n     |\n  38 |   , withNumTests\n     |\n  ```\n\n*
  Hopefully importing the method from `Test.QuickCheck.Property` might help.\n\n##
  0.11.0.0 -- 2026-08-06\n\n* First version. Released on an unsuspecting world.\n\n##
  References\n\n* Use of a fourth component [Version scheme][haskell-stack-ver].\n\n[haskell-stack-ver]:
  https://docs.haskellstack.org/en/stable/maintainers/version_scheme/#use-of-a-fourth-component\n"
