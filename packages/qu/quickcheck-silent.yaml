changelog: "# Revision history for quickcheck-silent\n\n## 0.11.0.11 -- 2026-08-18\n\n*
  The following issue only shows up once distribuited and built with `nix`:\n  ```\n
  \ Warning:\n      This package indirectly depends on multiple versions of the same\n
  \     package. This is very likely to cause a compile failure.\n        package
  QuickCheck (QuickCheck-2.18.0.0-DOrynHtGkwDJTvEyuDdhMp) requires containers-0.6.8-8162\n
  \       package quickcheck-silent (quickcheck-silent-0.11.0.10) requires containers-0.8-K3knBMiOLoF4ZXMnieGzr8\n
  \ ```\n  Therefore, we are changing the build depencies in `cabal` to:\n  ```\n
  \ containers >= 0.6 && < 1\n  ```\n\n## 0.11.0.10 -- 2026-08-18\n\n* Added basic
  test hierarchy capabilities: `suite`, `group` (category) and\n  `case`.\n\n* Exposing
  `property` in order to re-use defined silent property test cases with\n  other compatible
  `QuickChech` frameworks.\n  \n* Dropped the `Result` data type from `QuickChech`
  as it's a bit complex. A more\n  simple, heavily inspired in the `Count` type from
  the `HUnit` package has been\n  added.\n  \n* To be able to run test suites, both
  `quickCheckSilentSuite` and\n  `quickCheckSilentSuiteJSON` have been added.\n\n*
  Finally, `isSuccess` has been added to ease the iteration over a sequence of\n  test
  results to check if they are all successful.\n\n## 0.11.0.9 -- 2026-08-14\n\n* Feedback
  from `#nixos` on [Libera](https://libera.chat/) helped us realize that we can\n
  \ override which version of `QuickCheck` is available for `quickcheck-silent` by\n
  \ doing the following in a `nix-shell` sandbox:\n  ```nix\n  with import <nixpkgs>
  {};\n  \n  let\n    qcs-ver = \"0.11.0.8\"; \n    qcs-sha = \"7WD7706RaMQoVpooHBJLlsBoGfSCoF3mVZEm3O+XZ5g=\";\n
  \   \n    hpkgs984 = haskell.packages.ghc984.extend (\n      self: super: {\n        \n
  \       qcs011 = self.callHackageDirect { \n          pkg =    \"quickcheck-silent\";
  \n          ver =    qcs-ver; \n          sha256 = qcs-sha;\n        } { QuickCheck
  = haskell.packages.ghc984.QuickCheck_2_18_0_0; };\n      }\n    );\n  in\n  mkShell
  {\n    buildInputs = [\n      # NOTE: ghc-9.8.4 is used by Hackage\n      ( hpkgs984.ghcWithPackages
  (\n          pkgs: [\n            pkgs.qcs011\n            pkgs.stylish-haskell\n
  \           pkgs.haskell-language-server\n          ]\n        )\n      )\n    ];\n
  \   packages = [\n      …\n    ];\n  }\n  ```\n\n* Hopefully this approach might
  help, otherwise, we are reverting back again.\n\n## 0.11.0.8 -- 2026-08-08\n\n*
  Only support versions that are recommended for use:\n  - https://gitlab.haskell.org/ghc/ghc/-/wikis/GHC%20Status#most-recent-ghc-major-versions\n
  \ - https://github.com/NixOS/nixpkgs/tree/haskell-updates/pkgs/development/compilers/ghc\n
  \ \n  ```\n  - GHC == 9.4.8\n  * GHC == 9.6.7\n  * GHC == 9.8.4\n  * GHC == 9.10.3\n
  \ * GHC == 9.12.4\n  + GHC == 9.14.1\n  ```\n\n## 0.11.0.7 -- 2026-08-08\n\n* Lower
  bound back to `2.1` from `2.18`.\n\n## 0.11.0.6 -- 2026-08-08\n\n* Implementations,
  based on feedack from `#haskell` on\n  [Libera](https://libera.chat/) did not work,
  therefore, `withNumTests` logic\n  will be removed until fixed.\n\n## 0.11.0.5 --
  2026-08-07\n\n* Updated `build.sh` based on feedack from `#haskell` on\n  [Libera](https://libera.chat/).\n
  \ ```irc\n  14:16 < comerijn> gentauro: At any rate to reproduce your hackage error
  I would try: cabal sdist, then copy the tarball to a new directory, unzip the tarball,
  try and build in that new directory, see if it works\n  ```\n\n* Adding, `withNumTests`
  based on feedack from `#haskell` on\n  [Libera](https://libera.chat/).\n  ```irc\n
  \ 14:46 < tomsmeding> gentauro: or too narrow, or something; in particular, Test.QuickCheck.Property.withNumTests
  is new since QuickCheck-2.18.0.0\n  ```\n\n## 0.11.0.4 -- 2026-08-07\n\n* Re-exporting
  `Test.QuickChech.Result` to avoid dependency on the `QuickChech`\n  package\n\n##
  0.11.0.3 -- 2026-08-07\n\n* There seem to be a lot of errors that aren't happening
  on build of the\n  project, but then, they are showing up when building the `Hackage`
  package:\n  \n  ```sh\n  Running phase: buildPhase\n  Preprocessing library for
  quickcheck-silent-0.11.0.2...\n  Building library for quickcheck-silent-0.11.0.2...\n
  \ [1 of 1] Compiling Test.QuickCheck.Silent ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o,
  dist/build/Test/QuickCheck/Silent.dyn_o )\n  <no location info>: error: [GHC-08674]\n
  \     The package (containers-0.7) is required to be trusted but it isn't!\n  ```\n\n##
  0.11.0.2 -- 2026-08-07\n\n* This did not help at all:\n\n  > _Hopefully importing
  the method from `Test.QuickCheck.Property` might help_\n\n  ```sh\n  Running phase:
  buildPhase\n  Preprocessing library for quickcheck-silent-0.11.0.1...\n  Building
  library for quickcheck-silent-0.11.0.1...\n  [1 of 1] Compiling Test.QuickCheck.Silent
  ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o, dist/build/Test/QuickCheck/Silent.dyn_o
  )\n  src/Test/QuickCheck/Silent.hs:70:16: error: [GHC-76037]\n      Not in scope:
  ‘QCP.withNumTests’\n      NB: the module ‘Test.QuickCheck.Property’ does not export
  ‘withNumTests’.\n     |\n  70 |   SilentProp . QCP.withNumTests n\n     |\n  ```\n\n*
  Therefore, `withNumTests` logic will be removed until fixed.\n\n## 0.11.0.1 -- 2026-08-07\n\n*
  It seems that there are some issues to build the package on `ghc-9.10.3`:\n\n  ```sh\n
  \ Running phase: buildPhase\n  Preprocessing library for quickcheck-silent-0.11.0.0...\n
  \ Building library for quickcheck-silent-0.11.0.0...\n  [1 of 1] Compiling Test.QuickCheck.Silent
  ( src/Test/QuickCheck/Silent.hs, dist/build/Test/QuickCheck/Silent.o, dist/build/Test/QuickCheck/Silent.dyn_o
  )\n  src/Test/QuickCheck/Silent.hs:38:5: error: [GHC-61689]\n      Module ‘Test.QuickCheck’
  does not export ‘withNumTests’.\n     |\n  38 |   , withNumTests\n     |\n  ```\n\n*
  Hopefully importing the method from `Test.QuickCheck.Property` might help.\n\n##
  0.11.0.0 -- 2026-08-06\n\n* First version. Released on an unsuspecting world.\n\n##
  References\n\n* Use of a fourth component [Version scheme][haskell-stack-ver].\n\n[haskell-stack-ver]:
  https://docs.haskellstack.org/en/stable/maintainers/version_scheme/#use-of-a-fourth-component\n"
