changelog: "0.3.0.0 [2026.10.15]\n--------------------\n* Support for asynchronous
  execution added in module `Python.Inline.Async`.  It\n  uses API modelled after
  `async` package. Such computations could be\n  interrupted using `cancelPy` even
  when they're running python code or haskell\n  callback/\n* When threaded runtime
  is used `runPyInMain` could be reliably interrupted by\n  asynchronous exceptions.\n*
  Python module `inline_python` is now available. It contains exception types\n  used
  by library: `AsyncCancelled` and `HaskellError` which wraps haskell\n  exception
  from callback.\n* `Python.Inline.Monad` and `Python.Inline.Monad.QQ` modules providing
  monadic\n  API. It uses `MonadPy` type class which allows user code to carry around\n
  \ python dictionaries with global and local scopes.\n* Package now uses `Custom`
  build type. It now supports configuring python using\n  `python3-config` instead
  of `pkg-config` when `-fpython3-config` manual cabal\n  flag is set. Default behavior
  is unchanged.\n* Haskell exception raised in haskell callback will be rethrown if
  not caught by\n  python instead of being converted to `PyError`.\n* `evalPyFunction`
  is added to company of `eval` and `exec`. It uses new\n  `PyQuoteFun` data type
  as parameter.\n* `pySource` quasiquoter added. It loads python code from file. \n*
  `createModule` added which gives standard way of defining python code.\n* Bug fixes:\n
  - Memory leak in exception handling is fixed. Python exception object were never\n
  \  freed when exception propagated to haskell side.\n - `bindVar` and `codeFromString`,
  `codeFromText` violated memory safety but\n   happened to work correctly when strings
  were created by TH. Consider upgrade\n   if using them.\n\n0.2.1.0 [2026.01.13]\n----------------\n*
  `From/ToPy` instance for `Integer`&`Natural` added.\n* `vector-0.13.2` is required.\n*
  Python>=3.10 is supported. Boolean marshaling with python<3.12 is\n  fixed. Previously
  it caused crashes on counter decrement.\n* Documentation fixes.\n\n0.2 [2025.05.04]\n----------------\n*
  `FromPy`/`ToPy` instances added for: `Complex`, both strict and lazy `Text` &\n
  \ `ByteString`, `ShortByteString`, `Maybe a`.\n* Module `Python.Inline.Eval` added
  which support for eval/exec with user\n  supplied global and local variables.\n*
  QuasiQuotes `Python.Inline.QQ.pycode` added for creating `PyQuote` data type.\n\n0.1.1.1
  [2025.03.10]\n--------------------\n* Crash of python's main thread when one attempts
  to interrupt it fixed.\n\n0.1.1 [2025.02.13]\n------------------\n* Number of deadlocks
  in `runPyInMain` fixed:\n  - It no longer deadlocks if exception is thrown\n  -
  Nested calls no longer deadlock.\n  - Calling it from python callback.\n* `ToPy`
  instance added for `Py b`, `a -> Py b`, `a1 -> a2 -> Py b`\n\n\n0.1 [2025.01.18]\n----------------\nInitial
  release\n"
changelog-type: markdown
description: |-
  This package embeds python interpreter into haskell program and
  allows to write python snippets as quasiquotes. Values could be
  easily transferred between python and haskell. It's possible to
  call haskell from python as well.
