description: "# pandoc-md-slides\n\n## A Pandoc filter to convert markdown notes to
  markdown slides\n\nThis pandoc filter converts markdown notes (written in plain
  prose) into summarized slides.\nThe filter automatically splits long slides and
  resolves image target paths to new paths.\n\n## Installing using cabal\n\nYou can
  install the package by unpacking the tarball distributable in the releases page
  and running `cabal install`\n\n```bash\ntar -xvf pandoc-md-slides-<version>.tar.gz\ncd
  pandoc-md-slides-<version>\ncabal install\n```\n\n## Basic Usage\n\n```bash\npandoc
  test.md --filter md-slides -o outputs/output.md\n```\n\n## Transformations\n\n###
  Paragraph Blocks\n\nParagraph blocks are split based on newlines and summarized
  into a `BulletList`.\nThe resulting list will only keep important sentences (i.e.
  sentences with emphasized words and/or strong words).\n\nSeparate paragraphs will
  be placed in separate slides.\nOnly top-level paragraph blocks are transformed into
  lists.\n\n```markdown\n## Header\n\nThis is a paragraph block.\nThat contains **important
  sentences**.\nAnd unimportant sentences.\nIt will keep the *important ones*.\nThe
  header will be used as a *slide header*.\n\nSeparate Paragraphs will be placed in
  *separate slides*.\nLike *this one*.\nParagraphs with no headers will use the *most
  recent* headers as slide headers.\n```\n\n```markdown\n# Header\n\n- That contains
  **important sentences**.\n- It will keep the *important ones*.\n- The header will
  be used as a *slide header*.\n\n---\n\n# Header\n\n- Separate Paragraphs will be
  placed in *separate slides*.\n- Like *this one*.\n- Paragraphs with no headers will
  use the *most recent* headers as slide\n  headers.\n```\n\n### Splitting slides\n\nLong
  slides are split into multiple slides, if the blocks can be split.\nBlocks that
  can be split are, bullet lists (including the transformed summarized paragraphs),
  ordered lists, display math blocks, code, table.\n\nYou can configure the split
  behavior by controlling the slide lines (`-l`) and line width (`-w`) arguments.\nA
  slide is split if it exceeds the slide lines.\nThe number of lines of a slide is
  calculated based on the slide type and line width argument.\n\n```bash\npandoc -t
  json test.md | \\\n    md-filter -l 6 -w 60 | \\\n    pandoc -f json \\\n    -t
  markdown-simple_tables-multiline_tables-grid_tables \\\n    -o outputs/output.md\n```\n\nThe
  following default values will be used if the arguments are not set.\n\n- slide lines
  (`-l`) - 6\n- line width (`-w`) - 100\n\n```markdown\n## Header\n\n- item1\n- item2\n-
  item3\n- item4\n- item5\n- item6\n- item7\n- item8\n- item9\n- item10\n- item11\n-
  item12\n- item13\n```\n\n```markdown\n## Header\n\n- item1\n- item2\n- item3\n-
  item4\n- item5\n- item6\n\n---\n\n## Header\n\n- item7\n- item8\n- item9\n- item10\n\n---\n\n##
  Header\n\n- item11\n- item12\n- item13\n```\n\n#### Math\n\nWhen display math blocks
  are split, the display math is split based on math newlines (`\\\\`), ignoring newlines
  on `matrix` and `bmatrix` environments.\n\nIf the entire display math block are
  in an `aligned` environment, the split slides will inherit the `aligned` environment.\n\n```markdown\n##
  Header\n\n$$\n\\begin{aligned}\n{n \\choose r-1}+{n \\choose r}&=\\frac{n!}{(r-1)!(n-(r-1))!}+\\frac{n!}{r!(n-r)!}\\\\\n&=\\frac{n!}{(r-1)!(n-r+1)!}+\\frac{n!}{r!(n-r)!}\\\\\n&=\\frac{n!r}{r!(n-r+1)!}+\\frac{n!(n-r+1)}{r!(n-r+1)!}\\\\\n&=\\frac{n!r+n!(n-r+1)}{r!(n-r+1)!}\\\\\n&=\\frac{n!(n+1)}{r!(n+1-r)!}\\\\\n&=\\frac{(n+1)!}{r!(n+1-r)!}\\\\\n{n
  \\choose r-1}+{n \\choose r}&={n+1 \\choose r}\n\\end{aligned}\n$$\n```\n\n```markdown\n##
  Header\n\n$$\n\\begin{aligned}\n{n \\choose r-1}+{n \\choose r}&=\\frac{n!}{(r-1)!(n-(r-1))!}+\\frac{n!}{r!(n-r)!}\\\\\n&=\\frac{n!}{(r-1)!(n-r+1)!}+\\frac{n!}{r!(n-r)!}\\\\\n&=\\frac{n!r}{r!(n-r+1)!}+\\frac{n!(n-r+1)}{r!(n-r+1)!}\\\\\n&=\\frac{n!r+n!(n-r+1)}{r!(n-r+1)!}\n\\end{aligned}\n$$\n\n---\n\n##
  Header\n\n$$\n\\begin{aligned}\n&=\\frac{n!(n+1)}{r!(n+1-r)!}\\\\\n&=\\frac{(n+1)!}{r!(n+1-r)!}\\\\\n{n
  \\choose r-1}+{n \\choose r}&={n+1 \\choose r}\n\\end{aligned}\n$$\n```\n\n### Image
  target replacement\n\nYou can pass two arguments in the filter, input file directory,
  and output file directory.\nWhen used this way, the filter will replace image target
  paths with new paths resolved based on the output file directory.\nIf a path cannot
  be resolved based on the output file directory, then the said path is considered
  an external url or absolute path.\n\nHere's an example of applying arguments to
  the filter.\nHere the markdown is converted to `json` and the resulting `json` is
  piped to the filter with arguments, transformed `json` is then piped to a pandoc
  transformation back to the format `markdown-simple_tables-multiline_tables-grid_tables`.\n\n```bash\npandoc
  -t json test.md | \\\n    md-filter -s \".\" -o \"outputs/\" | \\\n    pandoc -f
  json \\\n    -t markdown-simple_tables-multiline_tables-grid_tables \\\n    -o outputs/output.md\n```\n\nHere's
  an example Makefile that you can use to automatically resolve the directories of
  the source and the output.\n\n```makefile\nINPUTDIR ?= $(dir $(SOURCE))\nOUTPUTDIR
  ?= $(dir $(OUTPUT))\n\n$(OUTPUT): $(SOURCE)\n\tpandoc -t json $(SOURCE) | \\\n\t\tmd-slides
  -s $(INPUTDIR) -o $(OUTPUTDIR) | \\\n\t\tremarkjs | \\\n\t\tpandoc -f json \\\n\t\t-t
  markdown-simple_tables-multiline_tables-grid_tables \\\n        -o $(OUTPUT)\n```\n\n##
  Extra configuration options\n\nYou can optionally create a `slides.yaml` in the
  directory you are running the filter.\nThis file can contain your configuration
  for `maxSlideLines`, `maxLineWidth`, `sourceDirectory`, `outputDirectory`.\nProgram
  arguments applied to the filter will override the yaml configuration.\n\nIt also
  contains the following extra configurations that are currently only possible through
  `slides.yaml`:\n\n### `keptSentences`\n\nThis is a list of strings that will be
  converted to a list of predicates that will be used to choose which sentences are
  kept in the `Para` to `BulletList` transformation.\nPredicates that are available
  are:\n\n- `all`: matches sentences\n- `important`: matches sentences that contain
  either `Strong` or `Emph`. This is the default behavior if `keptSentences` is not
  used.\n- `code`: matches sentences that contain inline `Code`\n- `math`: matches
  sentences that contain inline `Math`\n- `lastColon`: matches sentences that are
  positioned last in the paragraph and ends with `:`.\n- `none`: overrides the default,
  and matches no sentence.\n- `1`,`2`, `3` ...: matches the first, second, third or
  nth sentence\n\nYou can include multiple predicates. \nThese predicates will be
  combined through disjunction.\n\n``` yaml\nkeptSentences:\n  - code\n  - math\n
  \ - important\n```\n\nNote that, for `none` to properly function as a predicate,
  there must be no other predicates added to the list.\n\n### `unOrphanDisplayBlocks`\n\nThis
  is a boolean option when enabled, will use an optional transformation (applied last)
  that is applied on pairs of slides with the following characteristics:\n\n- The
  first slide contains a plain `BulletList`.\n- The last item in the `BulletList`
  is a sentence that ends with `:`.\n- The second slide contains a DisplayBlock (`DisplayMath`,
  `CodeBlock`, `Figure`, `Table`, `BulletList`, `OrderedList`).\n\nWhen this transformation
  is applied the last item from the first slide's list is transferred to the second
  slide.\n\nBelow we can see an example of this transformation applied after the other
  transformations.\n\n```markdown\n## Variables\n\n- Apply universal instantiation
  to $\\forall X q(X)$:\n\n## Variables\n\n$$\n\\begin{aligned}\nq(a) \\land \\\\\n\\neg
  q(a)\n\\end{aligned}\n$$\n```\n\n```markdown\n## Variables\n\n- Apply universal
  instantiation to $\\forall X q(X)$:\n\n$$\n\\begin{aligned}\nq(a) \\land \\\\\n\\neg
  q(a)\n\\end{aligned}\n$$\n```\n\nWhen enabling this option, you can make sure that
  colon ending sentences are kept by adding the `lastColon` predicate in `keptSentences`.\n"
