changelog-type: markdown
description: |
  # atelier-monitoring

  Moitoring, metrics, and tracing effects and utilities for
  [Effectful](https://github.com/haskell-effectful/effectful)-based applications
  — part of the \**atelie*r\* toolkit.

  `atelier-monitoring` provides a set of composable Effectful effects and
  supporting types for building structured, observable applications.

  ## License

  MIT — see [LICENSE](LICENSE).
