description: "# CFV: A simple file format for configuration variables\n\nDeclare configuration
  variables in a '.cfv' file and parse them.\n\nAn example of the contents of a CFV
  file is:\n\n```\n-- a comment\ngreeting = 'hello';                   -- single-quoted
  string\nempty    = \"\";                        -- double-quoted string\nnow      =
  `date +%s`;                -- run shell command\nhome'    = `echo \"$HOME\"`;            --
  access to your shells PATH\nsecret api_key = \"password/token/key\" -- a secret
  variable (public is default)\n```\n\nFor more information on the syntax of variable
  declarations see \n[Hackage](https://hackage-content.haskell.org/package/cfv-0.1.0.0)."
