changelog: "# Changelog\n\nAll notable changes to this project will be documented
  in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/).\n\n##
  v7 - 2026-09-16\n\n### Added\n- #48: Support for building a WASI reactor module
  via a flag by [@andy0130tw](https://github.com/andy0130tw).\n- CI workflow to publish
  releases to Hackage.\n\n### Changed\n- Redesign native Stack caching: single-writer,
  exact-match cache keys for the toolchain and compiled-dependency caches.\n- Require
  exact cache hits for the WASM toolchain and native-utilities (alex/happy) caches.\n-
  Hash the workflow file itself into the compiled-dependency cache key, so changes
  to the build commands invalidate stale caches.\n- Pin `haskell-actions/setup` to
  a full commit SHA instead of a mutable tag.\n\n### Fixed\n- #47: Fix a broken link
  to the release page by [@xnuk](https://github.com/xnuk).\n- Install clang64 ICU
  and pkgconf on Windows CI builds.\n- Fix the WASM `dist-newstyle` cache key to catch
  gitlink-only submodule bumps.\n- Fix alex/happy datadir loss across native-utilities
  cache restores.\n- Restore the ghcup cache before Haskell setup on macOS.\n- Pin
  the `yq` version on Windows to avoid GitHub API rate-limit failures.\n- Reuse the
  ghcup-installed GHC instead of Stack's own copy.\n- Stop treating a version print
  as WASM toolchain validation.\n- Drop the invalid `-with-rtsopts` `ghc-options`
  entry from the library stanza, which caused Hackage to reject package uploads.\n\n##
  v6 - 2026-04-11\n\n### Added\n- Support for Agda-2.8.0.\n- WASM build and release
  artefacts by [@andy0130tw](https://github.com/andy0130tw).\n- Development and stable
  release artefacts for all supported Agda versions: Agda-2.6.4.3, Agda-2.7.0.1, and
  Agda-2.8.0.\n- Separate release artefacts for macOS Apple Silicon and Intel Macs.\n-
  #39: Agda setup support for Agda-2.8.0 by [@andy0130tw](https://github.com/andy0130tw).\n-
  #40: JSON interaction mode response option by [@andy0130tw](https://github.com/andy0130tw).\n-
  #45: Support multiple `+AGDA ... -AGDA` blocks in CLI arguments by [@juliapath](https://github.com/juliapath).\n-
  WASM-specific test target.\n\n### Changed\n- Use single-digit language server release
  tags such as `v6`.\n- Drop Agda-2.6.3 support from the release matrix.\n- Target
  Agda-2.6.4.3, Agda-2.7.0.1, and Agda-2.8.0.\n- Build supported Agda targets with
  the GHC 9.10.2 Stack configuration.\n- Publish the rolling `dev` prerelease from
  `master`.\n- Replace the retired `macos-13` GitHub Actions runner with `macos-15-intel`.\n\n###
  Fixed\n- #44: Keep WASM RTS options in `package.yaml` so generated Cabal metadata
  does not drift by [@juliapath](https://github.com/juliapath).\n- Fix native and
  WASM compatibility issues by [@andy0130tw](https://github.com/andy0130tw).\n- Fix
  WASM CI for Agda-2.8.0 by checking out the matching Agda WASM submodule revision.\n-
  Fix WASM dependency resolution by pinning the WASM Cabal package set.\n- Fix dev
  release publishing so native and WASM artefacts are uploaded by the final release
  job.\n- Fix WASM `dist-newstyle` cache restore/save key mismatch.\n- Fix unsafe
  use of `Data.List.head` in rich-text rendering.\n\n## v0.2.7.0.1.5 - 2024-12-18\n\n###
  Added\n- New command line option `--version` and `-V` for printing version information.\n\n##
  v0.2.7.0.1.4 - 2024-12-6\n\n### Changed\n- Target only 3 versions of Agda at a time:
  Agda-2.7.0.1, Agda-2.6.4.3, and Agda-2.6.3.\n\n## v0.2.7.0.1.3 - 2024-12-5\n\n###
  Fixed\n- Add dummy LSP handlers for `initialized`, `workspace/didChangeConfiguration`,
  `textDocument/didOpen`, `textDocument/didClose`, `textDocument/didChange`, and `textDocument/didSave`
  to avoid errors in the client.\n\n## v0.2.7.0.1.2 - 2024-12-4\n\n### Fixed\n- Release
  of artefacts on macOS\n\n## v0.2.7.0.1.1 - 2024-12-4\n\n### Added\n- #29: Integration
  testing for the language server\n- Prebuilt binaries for Intel x64 macOS \n- Support
  for Agda-2.7.0.1\n\n### Changed\n- Unfied workflow for building and testing the
  language server across all platforms\n\n## v0.2.7.0.1.0 - 2024-12-2\n\n### Added\n-
  #22: agda 2.6.4 by [@andreasabel](https://github.com/andreasabel)\n- #23: lsp 2
  by [@andreasabel](https://github.com/andreasabel)\n\n### Fixed\n- Version information
  of the language server\n\n## v0.2.6.4.0.3 - 2023-12-14\n\n### Fixed\n- #15: Add
  missing handlers for `lsp` methods.\n- #24: Fix the encoding of binaries built on
  GitHub Actions.\n- Patch path to the \"data\" directory when the executable is built
  on GitHub Actions.\n\n## v0.2.6.4.0.0 - 2023-12-12\n\n### Changed\n- Embed Agda-2.6.4.\n-
  Builds with `lsp` < 1.7 on GHC 9.2 (LTS 20.26),\n  and with Cabal also on 9.4 and
  9.6.\n\n### Added\n- Build flag `Agda-2-6-3` to embed Agda-2.6.3 rather than 2.6.4.\n\n\n##
  v0.2.6.3.0 - 2023-11-23\n\n### Changed\n- Embed Agda-2.6.3.\n- Builds with `lsp`
  < 1.7 on GHC 8.10 (LTS 18.28), 9.0 (LTS 19.33), and 9.2 (LTS 20.26),\n  and with
  Cabal also on 9.4 and 9.6.\n\n### Added\n- Build flag `Agda-2-6-2-2` to embed Agda-2.6.2.2
  rather than 2.6.3.\n\n\n## v0.2.6.2.2.1 - 2023-11-21\n\n### Added\n\n- Building
  with `lsp-1.6`.\n  Builds with `lsp` < 1.7 on GHC 8.10 (LTS 18.28), 9.0 (LTS 19.33),
  and 9.2 (LTS 20.26).\n\n\n## v0.2.6.2.2 - 2023-11-21\n\n### Changed\n\n- Embed Agda-2.6.2.2.\n-
  Versioning scheme: _x.a.b.c.d.y_ where _a.b.c.d_ is the 4-digit Agda version (2.6.2.2),
  _x_ is 0 but may be bumped for revolutionary changes to the agda-language-server,
  and _y_ is for patch releases.\n- Builds with `lsp` < 1.5 on GHC 8.10 (LTS 18.28)
  and 9.0 (LTS 19.33).\n\n\n## v0.2.1 - 2021-10-25\n\nNo changes.\n\n\n## v0.2.0 -
  2021-10-22\n\n### Fixed\n- #2: Allow user to supply command-line options via agda-mode\n\n\n##
  v0.1.4 - 2021-10-04\n\n### Fixed\n- Resume sending HighlightingInfos to agda-mode\n\n\n##
  v0.1.3 - 2021-10-04\n\n### Fixed\n- Include DLLs in the bundle\n\n\n## v0.1.2 -
  2021-10-03\n\n### Fixed\n- #5: Connection Error\n"
