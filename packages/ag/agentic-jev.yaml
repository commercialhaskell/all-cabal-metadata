changelog: |
  # Changelog for agentic-jev

  ## 0.2.0.4 - 2026-10-06

  * Follows agentic's record field changes; no API change.

  ## 0.2.0.3 - 2026-10-06

  * `MissingToken` is `MissingKey`, like the other providers.
  * `requestBody` takes the `Jev` settings, like the other providers.

  ## 0.2.0.2 - 2026-10-01

  * No changes; released alongside agentic 0.2.0.2.

  ## 0.2.0.1 - 2026-10-01

  * No changes; released alongside agentic 0.2.0.1.

  ## 0.2.0.0 - 2026-10-01

  First release of the v2 design.
