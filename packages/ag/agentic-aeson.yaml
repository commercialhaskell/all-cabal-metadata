changelog: |
  # Changelog for agentic-aeson

  ## 0.2.1.0 - 2026-11-06

  * Follow Agentic's `Structure`/`Outline` API and fallible model compilation.
    Shared definition keys now sanitize applied type names and allocate distinct
    keys when different names sanitize or truncate to the same spelling.

  ## 0.2.0.5 - 2026-10-06

  * No changes; released alongside agentic 0.2.0.5.

  ## 0.2.0.4 - 2026-10-06

  * Follows agentic's record field changes; no API change.

  ## 0.2.0.3 - 2026-10-06

  * No changes; released alongside agentic 0.2.0.3.

  ## 0.2.0.2 - 2026-10-01

  * No changes; released alongside agentic 0.2.0.2.

  ## 0.2.0.1 - 2026-10-01

  * No changes; released alongside agentic 0.2.0.1.

  ## 0.2.0.0 - 2026-10-01

  First release of the v2 design.
