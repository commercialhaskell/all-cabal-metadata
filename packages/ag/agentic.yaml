  # Changelog for agentic

  ## 0.2.0.0 - 2026-10-01

  First release of the v2 design.
changelog-type: markdown
description: 'Typed agentic workflows built from Arrow combinators. A flow is a description:
  you can describe it as a tree, Mermaid or Graphviz before running anything, then
  interpret it against System One (Jev) and System Two (an LLM) providers. This is
  the core: flows, contracts, questions, the runtime and the interpreter. It depends
  only on base and text.'
