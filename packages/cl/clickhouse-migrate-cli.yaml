changelog: |
  # Changelog for clickhouse-migrate-cli

  ## 0.2.1.0 — 2026-11-14

  ### New Features

  - Add per-invocation `handleCommandWithExternalDrain` for embedding
    applications, preserving the ordinary handler, parser and JSON v1.

  ## 0.2.0.0 — 2026-11-08

  ### Breaking Changes

  - Extend the JSON v1 contract with both checksum formats in offline plans,
    the recorded checksum format in history/status, and replicated initialization
    fields and error codes.

  ### New Features

  - Populate offline plans with v1 and v2 migration and step digests.
  - Render replicated history and failures with structured evidence.

  ### Other Changes

  - Retain legacy `PlanStep` and `PlanMigration` construction and matching arities;
    legacy manually constructed reports render unknown v2 digests as null.
  - Require `clickhouse-migrate ==0.2.*` and update JSON golden fixtures.

  ## 0.1.0.0 — 2026-10-16

  Initial release.

  ### New Features

  - Reusable, composable administrative CLI for `clickhouse-migrate`
    (`ClickHouseMigrate.CLI`) with application-owned configuration, coordination,
    rendering and exit policy.
  - Composable parsing and dispatch of guarded commands with explicit result
    contracts (`ClickHouseMigrate.CLI.Parser`, `ClickHouseMigrate.CLI.Handler`).
  - Text and `schemaVersion` 1 JSON rendering
    (`ClickHouseMigrate.CLI.Render.Text`, `ClickHouseMigrate.CLI.Render.Json`).
  - Bounded adoption input files (`ClickHouseMigrate.CLI.AdoptionFile`).
  - Preserves partial evidence, explicit recovery, stdout/stderr separation and
    cancellation.
changelog-type: markdown
description: |
  # clickhouse-migrate-cli

  Mount `commandParser` or use `parseInvocation`, then pass the application-owned
  environment and compiled plan to `handleCommand`. The application chooses configuration,
  exclusive-access provider, event/diagnostic sinks, command policy, stdout and exit code.
  The reusable library performs no implicit environment/secret loading or process exit.
  Offline plan never evaluates the environment; mutations require a provider.

  Includes plan, status, history, verify with require-current, up with explicit retained
  initialization UUID, all four repair operations, and adoption preview/apply/resume.
  No force/reset/checksum-rewrite operations. Repair/adoption validate explicit audit,
  expected state and quiescence/evidence before core dispatch. Adoption reads only an
  explicit bounded strict JSON evidence file; executable SQL comes from the compiled plan.

  `renderJson` returns one schemaVersion 1 document without a newline. The caller writes
  it after normal return and keeps progress on a separate sink. Synchronous failures
  retain primary cause, latest acknowledged report, query/receipt identities and separate
  secondary errors. Cancellation is rethrown and may produce no final JSON. Default
  text/JSON excludes SQL, credentials and raw exception bodies. Frozen golden fixtures
  ship under test/golden; the workspace's docs/user/contracts/json-v1.md defines the wire format.
