changelog-type: markdown
description: "# Clafer Instance Generator\n\n##### v0.5.8\n\n[Clafer](http://clafer.org)
  is a powerful (equivalent to first-order predicate logic) yet lightweight structural
  modeling language. Despite simplicity and conciseness of Clafer, writing correct
  models remains challenging due to hard-to-predict interactions among all constraints
  expressed in the model.\n\n**Clafer instance generator** (ClaferIG) is an interactive
  tool that generates instances and counter examples of concrete clafers in a Clafer
  model. If the concrete clafers do not have contradicting constraints, the generator
  produces valid instance data. Otherwise, the generator produces an unsatisfiable
  core which included all contradicting constraints and generates a counter example
  by removing one constraint from the core. The generator can potentially produce
  many instances if the concrete clafers are not fully specialized. The generator
  produces different instances on-demand. With these capabilities, the instance generator
  can be used for debugging models: checking the consistency of the model and detecting
  under- and overconstraining of the model. The instance generator can also be used
  programmatically via API (the command line and interactive session interfaces only
  use the API).\n\nFor more information, see [technical report](http://gsd.uwaterloo.ca/node/462).\n\n##
  Contributors\n\n* [Michał Antkiewicz](https://uwaterloo.ca/wise-lab/profiles/michal-antkiewicz),
  Main developer.\n* [Jimmy Liang](http://gsd.uwaterloo.ca/jliang), Original developer.\n*
  Luke Michael Brown, co-op student May-Aug 2013. Many improvements.\n\n## Getting
  the Clafer Instance Generator\n\nClaferIG can be installed from a binary distribution
  (preferred), from Hackage, and from the source code.\n\n### Dependencies for running\n\nRegardless
  of the installation method, the following are required:\n\n* [Java](https://adoptium.net)
  17 or newer, 64-bit (a runtime is enough)\n* `alloyIG.jar` (in this repository)
  and [Alloy 6.2.0](https://github.com/AlloyTools/org.alloytools.alloy/releases/tag/v6.2.0)
  (`alloy6.2.0.jar`), in the directory of the `claferIG` executable\n  * Alloy includes
  the MiniSat solver with UnSAT cores for Linux and macOS; on Windows, ClaferIG generates
  instances but cannot compute UnSAT cores and near-miss instances\n  * the MiniSat
  build in Alloy 6.2.0 is several times slower than the one in Alloy 4.2 because it
  is compiled without optimization ([AlloyTools/org.alloytools.alloy#352](https://github.com/AlloyTools/org.alloytools.alloy/issues/352));
  ClaferIG uses `lib/libminisatprover.so` (`.dylib` on macOS) in the directory of
  its executable instead, if present. `make` builds it from source.\n\nThe Clafer
  compiler is part of `claferIG`: the executable `clafer` is not needed.\n\nClaferIG
  looks for the jars and `lib/` in the directory of its executable, after following
  symbolic links: put them next to the file itself, not next to a link to it.\n\n###
  Installation from binaries\n\nBinary distributions of Clafer Tools (`clafer`, `claferIG`,
  and `chocosolver` with the jars they need; Linux x86-64 for the recent releases)\ncan
  be downloaded from [Clafer Tools - Binary Distributions](https://wiselab.uwaterloo.ca/clafer-tools-binary-distributions/).\nThey
  include `alloyIG.jar`, `alloy6.2.0.jar`, and the optimized `lib/libminisatprover.so`.\n\n1.
  Download the binaries and unpack them into a `<target directory>` of your choice.\n2.
  Add the `<target directory>` to your system path so that the executables can be
  found.\n\n### Installation from Hackage\n\nClaferIG is available on [Hackage](https://hackage.haskell.org/package/claferIG)
  and it can be installed using either [`cabal-install`](https://hackage.haskell.org/package/cabal-install)
  or [`stack`](https://haskellstack.org).\nEither way, the jars are installed separately,
  into the directory of the executable.\n\n#### Installation using `cabal-install`\n\nDependencies\n\n*
  `ghc-9.6.7` or `ghc-9.12.4`\n* `cabal-install-3.10.3` or newer\n\n1. Use [`ghcup`](https://www.haskell.org/ghcup/)
  to install `ghc` and `cabal`\n2. `cabal update`\n3. `cabal install claferIG --install-method=copy
  --installdir=<target directory>`\n4. In the `<target directory>`, execute\n   *
  `curl -fsSL -o alloy6.2.0.jar https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar`\n
  \  * `curl -fsSL -O https://github.com/gsdlab/claferIG/raw/master/alloyIG.jar`\n5.
  Add the `<target directory>` to your system path.\n\n`--install-method=copy` is
  needed: by default, `cabal install` puts a symbolic link into its `bin` directory,
  and ClaferIG would look for the jars in cabal's package store, where the link points.\n\n####
  Installation using `stack`\n\nClaferIG is not part of Stackage snapshots, so give
  the versions of both packages; their dependencies come from the snapshot.\nThis
  release is tested with the snapshot `nightly-2026-11-11`:\n\n1. [Install `stack`](https://docs.haskellstack.org/en/stable/install_and_upgrade/)\n2.
  `stack install claferIG-0.5.8 clafer-0.5.8 --resolver nightly-2026-11-11`\n3. In
  `~/.local/bin` (``stack path --local-bin``), where the executable is copied, download
  the jars as in step 4 above.\n\n### Installation from the source code\n\nDependencies\n\n*
  [`stack`](https://haskellstack.org)\n* the source code of the [Clafer compiler](https://github.com/gsdlab/clafer)
  in a sibling directory `clafer` (`stack.yaml` builds it from `../clafer`)\n* On
  Linux, the development files of `gmp`, `ncurses` and `zlib`, needed to build ClaferIG
  and its dependencies\n  * on Ubuntu, execute `sudo apt install libgmp-dev libncurses-dev
  zlib1g-dev`\n\nOn Windows\n\n* [MSYS2](http://msys2.sourceforge.net/)\n* it is installed
  automatically by `stack setup` (see Building below)\n* update MSYS2 packages\n   *
  follow [III. Updating packages](http://sourceforge.net/p/msys2/wiki/MSYS2%20installation/)
  but always execute `stack exec pacman -- <arguments for pacman>`\n* execute\n   *
  `stack exec pacman -- -S make diffutils`\n\n### Important: branches must correspond\n\nAll
  related projects are following the *simultaneous release model*.\nThe branch `master`
  contains releases, whereas the branch `develop` contains code under development.\nWhen
  building the tools, the branches should match.\nReleases from branches 'master`
  are guaranteed to work well together.\nDevelopment versions from branches `develop`
  should work well together but this might not always be the case.\n\n### Building\n\n1.
  in some `<source directory>`, execute `git clone https://github.com/gsdlab/clafer.git`
  (check out the same branch as ClaferIG)\n2. in the same `<source directory>`, execute
  `git clone https://github.com/gsdlab/claferIG.git`\n3. in `<source directory>/claferIG`,
  execute `stack setup`. This will install all dependencies, build tools, and MSYS2
  (on Windows).\n4. `cd <source directory>/claferIG`\n  * `make`\n  * this also builds
  the optimized MiniSat solver with UnSAT cores in `lib/`, which needs `git`, `cmake`,
  a C++ compiler and a JDK\n\n### Installation\n\n1. execute `make install to=<target
  directory>`\n\n#### Note:\n> On Windows, use `/` with the `make` command instead
  of `\\`, e.g., `make install to=/c/clafer-tools-0.5.4/`\n\n\n## Integration with
  text editors\n\n* VS Code: [clafer-vscode](https://github.com/gsdlab/clafer-vscode)\n*
  Sublime Text 4: [ClaferToolsST](https://github.com/gsdlab/ClaferToolsST)\n* VIM:
  [clafer-vim](https://github.com/wasowski/clafer-vim)\n\n# Usage\n\nClafer Instance
  Generator can be used in interactive and batch modes, as well as, an API.\n\n##
  Command-line Usage\n\n(As printed by `claferIG --help`)\n\n```\nClaferIG 0.5.8\n\nclaferig
  [OPTIONS] FILE\n\nCommon flags:\n             --all[=INTEGER]                           Saves
  all instances or\n                                                       a counterexample.
  Reads\n                                                       scopes from a\n                                                       `.cfr.scope`
  file or\n                                                       uses the provided
  global\n                                                       scope.\n  -n=INTEGER
  \                                          Specify the maximum\n                                                       number
  of instances\n                                                       saved by --all.\n
  \            --savedir=FILE                            Specify the directory\n                                                       for
  storing saved files.\n             --import=FILE                             Compile
  the model\n                                                       together with
  the given\n                                                       file or URL, which
  is\n                                                       relative to the current\n
  \                                                      directory. A model also\n
  \                                                      imports files with\n                                                       --import
  in its //#\n                                                       OPTIONS directive,\n
  \                                                      relative to its own\n                                                       folder
  or URL.\n             --import-root=DIR                         Allow only local\n
  \                                                      imports inside DIR,\n                                                       after
  resolving '..' and\n                                                       symbolic
  links (command\n                                                       line only).
  Can be\n                                                       repeated.\n             --public-imports
  \                         Allow only URL imports\n                                                       from
  public addresses\n                                                       (command
  line only).\n             --import-base=URL                         The URL from
  which the\n                                                       model's text was
  read:\n                                                       its imports are relative\n
  \                                                      to the URL (command line\n
  \                                                      only).\n             --alloysolution=FILE
  \                     Convert Alloy solution\n                                                       to
  a Clafer solution.\n  -b         --bitwidth=INTEGER                        Set the
  bitwidth for\n                                                       integers.\n
  \ -m         --maxint=INTEGER                          Set the bitwidth for\n                                                       integers
  based on the\n                                                       largest required
  number.\n                                                       Overrides --bitwidth\n
  \                                                      argument.\n  -u         --useuids
  \                                Use unique clafer\n                                                       names
  in the Clafer\n                                                       solution.\n
  \            --addtypes                                Add colon/reference\n                                                       types
  to the Clafer\n                                                       solution.\n
  \ -j         --json                                    Render solution as\n                                                       JSON
  (forces 'addUids').\n  -d         --diff                                    Show
  each next\n                                                       instance, or state
  of a\n                                                       trace, as its changes\n
  \                                                      from the previous one.\n
  \            --dot                                     Render solution as a\n                                                       Graphviz
  graph: for a\n                                                       trace, its
  states and\n                                                       transitions.\n
  \            --tl=INTEGER                              Set the maximum length\n
  \                                                      of the traces of a\n                                                       dynamic
  model (default:\n                                                       10).\n  -i
  \        --flatten-inheritance-comp                Flatten inheritance\n                                                       during
  compiling\n                                                       ('alloy' mode
  only)\n  -l         --no-layout-comp                          Don't resolve off-side\n
  \                                                      rule layout during\n                                                       compiling\n
  \ -c         --check-duplicates-comp                   Check duplicated\n                                                       clafer
  names during\n                                                       compiling\n
  \ -f         --skip-resolver-comp                      Skip name resolution\n                                                       during
  compiling\n             --ss=SCOPESTRATEGY --scope-strategy-comp  Use scope computation\n
  \                                                      strategy during\n                                                       compiling:
  none, simple\n                                                       (default),
  or full.\n  -?         --help                                    Display help message\n
  \ -V         --version                                 Print version\n                                                       information\n
  \            --numeric-version                         Print just the version\n
  \                                                      number\n```\n\n`claferIG
  <model file name>.cfr`\n\n- opens an interactive session and displays an instance
  or a counterexample.\n\n`claferIG <model file name>.cfr -all <scope>`\n\n- opens
  a non-interactive session and saves all instances up to the provided scope or a
  counterexample to files named `<model file name>.cfr.<instance number>.data`, one
  instance per file.\n\n### Models in several files\n\nA model can import other files,
  as with the Clafer compiler: `--import=FILE` in the model's `//# OPTIONS` directive,
  relative to the model's folder, or on the command line, relative to the current
  directory. The files and their imports are compiled together as one model. A model
  and its imports can also be URLs (`http://`, `https://`). See [Models in several
  files](https://github.com/gsdlab/clafer#models-in-several-files) in the compiler's
  README.\n\n```\n//# OPTIONS --import=products.cfr\nMyPhone : Phone\n```\n\n`claferIG
  MyPhone.cfr` generates the instances of `MyPhone.cfr` with the clafers of `products.cfr`.
  The other options of the directives (e.g., `--maxint`, `--no-layout`) apply too,
  and an error names the file in which it is (`products.cfr:3:11`).\n\n### Dynamic
  models\n\nA dynamic model, with temporal operators (e.g., `X`, `U`, `initially`)
  or the temporal modifiers `initial` and `final`, describes how its instances change
  over time. Its solutions are traces: each `n`ext gives a trace, and the trace is
  a sequence of states, each an instance of the model. Alloy's traces are lassos:
  after the last state, the trace loops back to an earlier state, and repeats the
  states from there forever.\n\n```\n//# OPTIONS --import=TrafficLight.cfr\ntl : TrafficLight\n
  \   [ initially (green --> yellow --> red --> green --> yellow_on --> yellow_off
  --> off) ]\n```\n\n```\n=== Trace 1 Begin ===\n\n--- State 0 ---\ntl\n  on\n    normal\n
  \     green\n\n--- State 1 ---\ntl\n  on\n    normal\n      yellow\n\n...\n\n---
  State 6 ---\ntl\n  off\n\n--- Loop back to state 3 ---\n\n--- Trace 1 End ---\n```\n\n`--tl=INTEGER`
  and the command `tl <number>` set the maximum length of the traces (by default,
  10 states). The traces are given from the shortest, and each trace is different
  from the traces given before, as the states in which the instances are, regardless
  of the names of their atoms. `--all` saves each trace to its own file, and `--json`
  gives a trace as `{\"states\": [...], \"loop\": 3}`.\n\nTwo commands explore other
  traces than the next one:\n\n* `fork <number>` gives another trace with the same
  states as the last trace before the state `<number>`: what else can happen from
  there. E.g., `fork 2` keeps the states 0 and 1.\n* `config` gives a trace with another
  configuration: the clafers that do not change over time, e.g., the features of a
  product line declared `final`, differ from those of the traces given so far.\n\n`config`
  also works on static models, whose next instances often differ only in a value:
  it gives an instance whose structure, its clafers without the values of their references,
  differs from those of the instances given so far. Each `config` gives, e.g., another
  selection of features of a product line. The next instances then continue from it,
  without the structures given so far.\n\nThe command `check` checks the assertions
  of the model, also the nested ones and those of temporal models, one by one. An
  assertion holds for all the solutions within the scopes and the maximum trace length,
  so `No counterexample` does not prove it for larger scopes or longer traces. A counterexample
  is shown like any other solution, and the next solution of the model stays as it
  is. Checking a large model can take much longer than generating a solution; lower
  the maximum trace length (`tl`) to get a faster answer. `check <number>` checks
  only the assertions on that line, or all of them if the number is not positive.\n\n```\nclaferIG>
  check\nNo counterexample: tl.off => X tl.on (TrafficLight.cfr:13:10)\nCounterexample
  of: never tl.off (TrafficLight.cfr:12:10)\n=== Trace 3 Begin ===\n...\n2 assertion(s)
  checked within the scopes and the maximum trace length: 1 with a counterexample.\n```\n\nThe
  command `dot` saves the most recent solution as a Graphviz graph: a node for each
  state, with the instance as its label and the name of the state (`S0`, `S1`, ...)
  outside it, an edge to the next state, and a dashed edge back to the loop state.
  In the diff view, the first state is in full and each next state shows its changes,
  which keeps the graph of a large model readable. With `--dot`, solutions are given
  as such graphs, and `--all` saves them to `.dot` files. To render one:\n\n```bash\ndot
  -Tsvg TrafficLight.cfr.1.dot -o trace.svg\n```\n\nA dynamic model, or a scenario,
  with no traces has an unsat core: the constraints that contradict each other, e.g.,
  a scenario and the transition it does not follow, and a near-miss trace without
  one of them, as for a static model.\n\n```\n  1) green --> yellow (TrafficLight.cfr:6:33)\n
  \ 2) initially (green --> red) (scenario.cfr:3:7)\n```\n\nWith `--diff`, or after
  the command `d`, the first state, whose clafers all appear, is shown with `+` on
  each line, and each next state as its changes from the previous state: the clafers
  that appear (`+`), with their children, the clafers that disappear (`-`), and the
  values that change (`~`). Each change is indented as the clafer in the tree, and
  has the least-partially-qualified name of the clafer, which is qualified only as
  much as needed to tell it from the other clafers with the same name, e.g., `normal.yellow`
  if `flashing` also had a `yellow`. An instance has the same name in all the states
  of a trace, so a clafer that disappears and appears again is the same instance.\n\n```\n---
  State 0 ---\n+ tl\n+   on\n+     normal\n+       green\n\n...\n\n--- State 3 ---\n-
  \      red\n+       green\n\n--- State 4 ---\n-     normal\n+     flashing\n+       yellow_on\n```\n\nIn
  a static model, the diff view shows the first instance with `+` on each line, and
  each next instance as its differences from the previous instance, by their structure:
  the names of the instances of different solutions are unrelated, so the numbers
  of the instances are left out.\n\n## Interactive Session Usage\n\nIn the interactive
  mode, the users can invoke the following commands by pressing a letter marked in
  \ the command name between '' or the whole command as marked by '':\n\n```\nClaferIG
  v0.5.8\n\nYou can invoke the following commands as indicated by single quotes:\n[tab]
  \             - print the available commands\n                   - auto-complete
  command name, a clafer name, or clafer instance name in a given context\n'n'ext,
  [enter]    - to produce the next solution if available, an instance of a static
  model or a trace\n                     of a dynamic model, or to output a message
  that no more solutions exist within\n                     the given scope\n'i'ncrease
  \        - to increase the maximum number of instances of a given clafer or all
  clafers (scope)\n's'et              - to set the maximum number of instances of
  a given clafer or all clafers (scope)\n'm'axint, 'maxint' - to set the bitwidth
  by providing the largest integer\n'tl'               - to set the maximum length
  of the traces of a dynamic model\n'd'iff             - to show each next instance
  or state as its changes from the previous one, or in full\n                     (+
  appears, - disappears, ~ changes its value)\n'fork'             - to produce another
  trace with the same first states as the last trace\n'config'           - to produce
  a trace of a dynamic model whose clafers that do not change over time\n                     differ
  from those of the traces so far, or an instance of a static model whose\n                     clafers,
  without the values of their references, differ from those so far\nsa'v'e             -
  to save all instances displayed so far or a counterexample to files named \n                     <model
  file name>.cfr.<instance number>.data, one instance per file\n'check'            -
  to check the assertions of the model within the scopes and the maximum trace\n                     length,
  and to give a counterexample of each one that fails\n'dot'              - to save
  the most recent solution as a Graphviz graph, for a trace its states\n                     and
  transitions, to <model file name>.cfr.<solution number>.dot\n'q'uit             -
  to quit the interactive session\n'r'eload           - to reload your clafer model\n'h'elp
  \            - to display this menu options summary\n'scope'            - to print
  out the values of the global scope and individual Clafer scopes\n'saveScopes'       -
  to generate a '<model>.cfr-scope' file with the current scopes\n'loadScopes'       -
  to load scopes from a '<model>.cfr-scope' file\n'setUnsatCoreMinimization' - to
  choose UnSAT core minimization strategy [fastest | medium | best]. Default: fastest\n'c',
  'claferModel' - to print out the original Clafer model verbatim\n'a', 'alloyModel'
  \ - to print out the output of Clafer translator verbatim\n'alloyInstance'    -
  to print out the Alloy xml document of the most recent solution\n'f'ind             -
  to print a Clafer with given name found in the most recent solution\n\nParameterized
  command usage:\n'i [enter]'         - to increase for all clafers by 1\n'i <name>
  [enter]'  - to increase for the clafer <name> by 1\n'i <name> <number>' - to increase
  for the clafer <name> by <number>\n's <number> [enter]'- to set for the clafers
  to <number>\n's <name> <number>' - to set for the clafer <name> to <number>\n'f
  <name>'          - to display a clafer <name>\n'tl <number>'       - to set the
  maximum trace length to <number>\n'fork <number>'     - to produce another trace
  with the states of the last trace before state <number>\n'check <number>'    - to
  check only the assertions on line <number>, or all of them if it is not positive\n'setUnsatCoreMinimization
  fastest' - fastest but the worst\n'setUnsatCoreMinimization medium'\n'setUnsatCoreMinimization
  best' - best but slowest even for modest size cores\n```\n\n## Output format\n\nThere
  are two output formats: native (plain text, default) and JSON (`--json`).\n\n###
  Instance data (native)\n\nThe instance data notation is very similar to a regular
  Clafer notation for concrete clafers with a few differences:\n\n* no constraints\n*
  no types and super types\n    * except when `--useuids --addtypes` parameters are
  used\n* no clafer and group cardinalities (each clafer has the default group `(0..*)`
  and clafer `(1..1)` cardinality)\n* no clafers not present in the instance\n\nAdditionally,
  the data notation contains concrete values of the clafers and suffix numbers to
  distinguish among multiple instances of the same clafer.\n\n### Note:\n> The instance
  data models could be read by the Clafer translator if the translator had simple
  type inference support.\n\n#### Example\n\nFor a model\n\n```\nabstract A\n    a
  ?\n    b +\n    c -> integer ?\n    d -> E 2\n    g -> E 2\n        h -> integer\n\nabstract
  E\n    f ->> integer +\n\na1 : A\ne1 : E\ne2 : E\n```\n\nA possible instance data
  looks as follows:\n\n```\n=== Instance 1 Begin ===\n\na1\n    b$1\n    b$2\n    c
  -> 10\n    d$1 -> e1\n    d$2 -> e2\n    g1 -> e1\n        h$1 -> 5\n    g2 -> e2\n
  \       h$2 -> 2\n\ne1\n    f$1 -> 2\n    f$2 -> 3\n    f$3 -> 4\n    f$4 -> 2\n\n---
  Instance 1 End ---\n```\n\n### Near-miss instance\n\nNear-miss instance notation
  is the same as the instance data notation. Additionally, it indicates which constraints
  belong to the UnSAT Core.\n\n#### Example\n\nFor a model\n\n```\nabstract A\n    a
  ?\n    b ?\n        [ a ]   // C1\n\na1 : A\n    [ no a ]    // C2\n    [ b ]       //
  C3\n```\n\nConstraints C1, C2, and C3 form an UnSAT Core. Removal of any of them
  will make the model satisfiable. The constraint C1 is part of the model and cannot
  be removed (part of domain knowledge). Therefore, either C2 or C3 must be removed
  to remove the inconsistency.\n\nOn possible near-miss instance:\n\n```\na1\n    a\n
  \   b\n```\n\nHere, `C1` and `C3` are satisfied but `C2` is not. To resolve the
  conflict and assuming that the counter example is actually a correct instance data,
  the user has to modify the model by removing `C2`. However, should the counter example
  actually represent incorrect instance data, the user can remove `C3` to resolve
  the inconsistency.\n\n## Troubleshooting\n\n\nIf ClaferIG reports `No more instances
  found` for an inconsistent model instead of an UnSAT core,\nthe MiniSat solver with
  UnSAT cores is not available on your platform (Windows); see the dependencies above.\n\n##
  How it works\n\nThe Clafer instance generator:\n\n* translates the input Clafer
  model (.cfr) to an Alloy 6 model (.als). The compiler's intermediate representation
  (IR) contains the mapping between Clafer names and Alloy names. The IR also contains
  the scopes for each Alloy signature to ensure that a valid instance can be found
  if it exists\n* invokes Alloy Analyzer with the MiniSat solver with UnSAT cores
  to produce an instance or find an UnSAT core\n** given an UnSAT core, removes constraints
  from the core until an instance is found - that instance represents the counterexample
  which violates the removed constraints\n* translates the instance or the counterexample
  data produced by Alloy Analyzer to Clafer instance data format using the name map
  from IR in a reverse direction,\n* for a counterexample, translates the counter
  example in Alloy to Claefr instance data and constraint violations in Alloy into
  constraint violations in Clafer model\n\n# Need help?\n\n* Visit [language's website](http://clafer.org).\n*
  Report issues to [issue tracker](https://github.com/gsdlab/claferIG/issues)\n"
