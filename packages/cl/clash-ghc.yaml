changelog: "# Changelog for the Clash project\n\n## 1.10.2 *Sep 4th, 2026*\n\nHighlights:\n*
  On a large representative circuit, this release reduces total runtime by 80% compared
  to 1.10.0; smaller circuits also recover from some previous performance regressions.
  See the [Clash benchmark results](https://clash-lang.github.io/clash-benchmarks/?machine=oele&branch=clash-lang/clash-compiler@1.10)
  for the comparison.\n\nPerformance:\n* The `clash-lib` compile-time evaluator no
  longer projects the entire global binding map into a fresh heap on (virtually) every
  invocation. In the representative benchmark, this reduced runtime by about 27%.
  See [#3323](https://github.com/clash-lang/clash-compiler/pull/3323).\n* The `clash-ghc`
  compile-time evaluator peels elements from a literal `BitVector` via `unconcatBitVector#`
  directly as literals, rather than leaving residual `split#` calls for later rewrite
  passes. This speeds up normalization of designs that convert large `BitVector` constants
  to vectors. See [#3323](https://github.com/clash-lang/clash-compiler/pull/3323).\n*
  In `clash-lib`, the Core-type-to-HWType translation used by representability queries
  during normalization is memoized across the rewrite session rather than recomputed
  for every query. This speeds up normalization of designs with large or deeply nested
  types. See [#3323](https://github.com/clash-lang/clash-compiler/pull/3323).\n* The
  conversion from GHC Core to Clash Core in `clash-ghc` is faster on large designs:
  type-constructor annotations are pre-checked on the interned name, the accumulated
  TyCon map is no longer re-inserted at every occurrence, and global-variable types
  are converted once and cached. See [#3323](https://github.com/clash-lang/clash-compiler/pull/3323).\n*
  Identifier-only free-variable folds in `clash-lib` now skip unnecessary type traversal,
  yielding about 2% faster normalization. See [#3327](https://github.com/clash-lang/clash-compiler/pull/3327).\n*
  In the `clash-ghc`/`clash-lib` blackbox compilation path, blackbox functions and
  Haskell template functions now share a single Hint (GHC) session, and each distinct
  function is compiled exactly once. In larger designs, this reduced load time by
  about 20% and end-to-end runtime by about 2%. See [#3337](https://github.com/clash-lang/clash-compiler/pull/3337).\n*
  In `clash-lib`, alpha-equivalence checks on `Term` and `Type` no longer compute
  free variables. Microbenchmarks show substantial speedups; end-to-end tests show
  a modest 2.5% improvement in normalization runtime. See [#3335](https://github.com/clash-lang/clash-compiler/pull/3335).\n*
  In `clash-lib`, the cleanup phase that flattens the function hierarchy now runs
  the evaluator-backed transformations (`reduceConst`, `reduceNonRepPrim`) and the
  transformations that piggyback on their output as one bottom-up pass per flattening
  iteration, rather than during every settle round of the inner fixed-point loop.
  On larger designs, this produced about a 30% end-to-end improvement without changing
  generated HDL. See [#3338](https://github.com/clash-lang/clash-compiler/pull/3338).\n*
  In `clash-ghc`, GHC-to-Clash type conversion is memoized by GHC type, with unchanged
  output. Types repeat extensively across binders, and converting one evaluates family-instance
  reductions and name conversions per node. On larger designs, this roughly halved
  loading time. See [#3340](https://github.com/clash-lang/clash-compiler/pull/3340).\n*
  In `clash-lib`, `reduceNonRepPrim` dispatches on the primitive's name through a
  `HashMap` of handlers rather than walking a chain of string comparisons. On larger
  designs, this produced about a 6% end-to-end improvement. See [#3339](https://github.com/clash-lang/clash-compiler/pull/3339).\n*
  In `clash-lib`, beta-reduction in the `appProp` transformation now uses a sharing-preserving
  substitution that leaves unchanged subterms untouched instead of rebuilding every
  visited node. Output is unchanged. See [#3341](https://github.com/clash-lang/clash-compiler/pull/3341).\n*
  In `clash-lib`, the inlining transformations (`inlineWorkFree`, `inlineSmall`, `bindConstantVar`)
  now run cheap binder-only guards before computing type information, skip attempts
  at inner application-spine nodes, and stop measuring term size once it exceeds the
  inline limit. On larger designs, this reduced compiler runtime by about 8%. See
  [#3356](https://github.com/clash-lang/clash-compiler/pull/3356).\n\nAdded:\n* Blackboxes
  `~SYM`s can now be referenced by name\n\n  Instead of doing:\n  ```\n  \tsignal
  ~GENSYM[foo][3] : ..;\n  \tsignal ~GENSYM[bar][4] : ..;\n\n  \t.. <= ~SYM[3] - ~SYM[4];\n
  \ ```\n\n  You can now refer to SYMbols by name:\n  ```\n  \tsignal ~SYM[foo] :
  ..;\n  \tsignal ~SYM[bar] : ..;\n\n  \t.. <= ~SYM[foo] - ~SYM[bar];\n  ```\n\n  The
  old behaviour with `~GENSYM` and the numeric references is still fully supported.\n\n
  \ See [#3325](https://github.com/clash-lang/clash-compiler/issues/3325), implemented
  in [#3326](https://github.com/clash-lang/clash-compiler/pull/3326).\n* `clash-lib`
  now provides `Hashable Term` and `Hashable Type` instances. These were removed in
  Clash 1.4.7 due to a faulty implementation, but are now back. They hash modulo alpha
  equivalence, and so agree with `Eq Term` and `Eq Type`: alpha-equivalent terms hash
  alike. See [#3336](https://github.com/clash-lang/clash-compiler/pull/3336).\n\nChanged:\n*
  `clash-cosim` and `clash-ffi` packages have been removed from the `clash-compiler`
  repository and moved to standalone archived repositories. See [#3330](https://github.com/clash-lang/clash-compiler/pull/3330).\n*
  The `clash` command-line flag `-fclash-debug-count-transformations` now also reports
  how often each transformation was attempted (counters suffixed `!try`), next to
  the existing applied-rewrite counts. See [#3356](https://github.com/clash-lang/clash-compiler/pull/3356).\n\nFixed:\n*
  In `clash-lib`, alpha-equivalence on terms now compares the `NameMod` and `Attributes`
  of a tick under the enclosing renaming environment, instead of in isolation. See
  [#3335](https://github.com/clash-lang/clash-compiler/pull/3335).\n* In `clash-lib`,
  `freshenTm` now renames inside of an `Attributes` tick, added by `Clash.Annotations.SynthesisAttributes.annotateReg`.
  See [#3335](https://github.com/clash-lang/clash-compiler/pull/3335).\n* In `clash-lib`,
  alpha-equivalence and alpha-comparison on terms now compare the types of `Rec` let
  binders, which they previously ignored. A `NonRec` binder's type is pinned down
  by its right-hand side, so it does not need comparing, but a `Rec` binder may occur
  in its own right-hand side, so its type is not determined by the right-hand side:
  `let x = x in x` is the same term whether `x` is an `Int` or a `Bool`. `eqTerm`
  already compared them, so `Eq Term` and `eqTerm` disagreed on such terms. See [#3335](https://github.com/clash-lang/clash-compiler/pull/3335).\n*
  In `clash-lib`, `Ord Term` and `Ord Type` now behave lawfully. Comparison used to
  rename each pair of binders to a variable free in neither argument, preferring the
  left one, so which name an occurrence resolved to depended on which argument came
  first: `compare` on `forall a. forall b. b` and `forall c. forall d. c` returned
  `GT` whichever way round they were passed. See [#3335](https://github.com/clash-lang/clash-compiler/pull/3335).\n*
  In `clash-lib`, `reduceNonRepPrim` now pierces through type families, `newtype`s
  and `Signal` constructors when determining a primitive's result type. See [#3339](https://github.com/clash-lang/clash-compiler/pull/3339).\n*
  In `clash-lib`, the disjoint expression consolidation (DEC) transformation created
  non-exhaustive case-expressions when the consolidated function was not applied in
  every alternative. When constant propagation later reduced such a case-expression,
  compilation failed with `Clash error call: scrutinise: ...`. The argument-selecting
  case-expressions now carry a default alternative for the branches in which the consolidated
  function is not used [#2770](https://github.com/clash-lang/clash-compiler/issues/2770).
  See [#3344](https://github.com/clash-lang/clash-compiler/pull/3344).\n* In `clash-ghc`,
  type family applications no longer get stuck when the top entity's module is loaded
  from an interface file and nothing else in the design causes the interfaces holding
  the needed family instances to be read. This made designs mentioning e.g. `BitVector
  (BitSize Bool)` behind another type family fail with `Cannot reduce to an integer`.
  See [#1534](https://github.com/clash-lang/clash-compiler/issues/1534), fixed in
  [#3343](https://github.com/clash-lang/clash-compiler/pull/3343).\n* In `clash-lib`,
  `reduceNonRepPrim` now correctly accounts for non-work primitives returning a zero-length
  `Vec` and under-applied ones. See [#3348](https://github.com/clash-lang/clash-compiler/issues/3348),
  fixed in [#3349](https://github.com/clash-lang/clash-compiler/pull/3349).\n* Name-shadowing
  warnings caused by blackboxes re-using identifiers has been fixed. See [#3273](https://github.com/clash-lang/clash-compiler/issues/3273),
  fixed in [#3353](https://github.com/clash-lang/clash-compiler/pull/3353).\n* In
  `clash-ghc`, Clash no longer enables `-dynamic-too` when the build is already dynamic,
  which made GHC emit an `-Winconsistent-flags` warning. See [#3354](https://github.com/clash-lang/clash-compiler/issues/3354),
  fixed in [#3358](https://github.com/clash-lang/clash-compiler/pull/3358).\n* In
  `clash-lib`, the SystemVerilog backend no longer emits out-of-bounds array indices
  when a nested modifier selects a half of an `RTree`. The size of a tree half was
  computed as `(d-1)^2` instead of `2^(d-1)`, so for an `RTree 3` the right half was
  emitted as `[4:8]` on an array whose valid indices are `0..7`. See [#3359](https://github.com/clash-lang/clash-compiler/issues/3359),
  fixed in [#3360](https://github.com/clash-lang/clash-compiler/pull/3360).\n* In
  `clash-lib` and `clash-ghc`, structural equality and ordering now account for the
  names and types of variables, including in `eqTerm` and `eqType`, instead of relying
  only on variable uniques. See [#3361](https://github.com/clash-lang/clash-compiler/issues/3361),
  fixed in [#3362](https://github.com/clash-lang/clash-compiler/pull/3362).\n\n##
  1.10.1 *Aug 27th, 2026*\n\nHighlights:\n * Very significant performance improvements,
  further detailed below. We also created a site https://clash-lang.github.io/clash-benchmarks/
  where we track performance improvements. These graphs are for the current `master`
  branch, not for released Clash versions.\n * We have added support for the `checked-literals`
  package. Numeric literals (e.g., `5` or `3.2`) can now be checked at compile time.
  That is, you'll get a compile error if the literal does not fit the target type
  -- even in polymorphic contexts! You can enable the checker by adding the following
  to your project's Cabal file:\n\n    ```\n    library\n      [..]\n\n      build-depends:\n
  \       [..]\n        checked-literals\n\n      ghc-options: -fplugin=CheckedLiterals\n
  \   ```\n\n    See https://clash-lang.org/blog/2026-04-07-checked-literals/.\n\nPerformance:\n*
  `clash` and `clashi` now use GHC-style RTS defaults through executable `-with-rtsopts`
  flags instead of linking RTS hooks. The existing unused hooks have been removed.
  **Existing users should set `-with-rtsopts` to `-K512M -H -I5 -T` if they use their
  own Clash executable. These flags has been shown to give a ~25% compilation speed
  up in larger designs.** If you used a Clash starter project to initialize your design,
  you should change:\n\n    ```haskell\n    executable clash\n      [..]\n    ```\n\n
  \   To:\n\n    ```haskell\n    executable clash\n      [..]\n      ghc-options:
  \"-with-rtsopts=-K512M -H -I5 -T\"\n    ```\n\n    in the cabal file. See [#3252](https://github.com/clash-lang/clash-compiler/issues/3252).\n*
  Improved normalization performance for repeated top-down rewrite loops by avoiding
  full root restarts after every successful rewrite. This gives a ~17% performance
  improvements on larger designs [#3249](https://github.com/clash-lang/clash-compiler/issues/3249).\n*
  Clash now converts GHC Core to its own Clash Core in parallel. For larger projects,
  this can shave off ~40% of load times. See [#3299](https://github.com/clash-lang/clash-compiler/issues/3299).\n*
  Clash now prunes the binders it collects from top modules when loading from precompiled
  core. For larger projects, this can shave off 15% of package loading times. See
  [#3298](https://github.com/clash-lang/clash-compiler/issues/3298).\n* `flattenCallTree`
  now caches intermediate results, reducing Clash normalization by 10% for realistic
  designs. Fixes #[3246](https://github.com/clash-lang/clash-compiler/issues/3246).\n\nAdded:\n*
  `-fclash-debug-manifest-hash`. When enabled, Clash emits a `__debug_hash` object
  in `clash-manifest.json` listing the SHA256 of each input that feeds into the top-level
  `hash` (`tops`, `prim_map`, `clash_mod_date`, `call_graph`, `opts`). As the name
  implies, this should only be used to debug and should not be relied upon by tooling.
  See [#3280](https://github.com/clash-lang/clash-compiler/pull/3280).\n* `SaturatingNum`
  instances for `Erroring`, `Overflowing`, `Saturating`, `Wrapping`, and `Zeroing`.\n\nChanged:\n*
  Replaced the deprecated `data-binary-ieee754` dependency with `castDoubleToWord64`,
  `castFloatToWord32`, `castWord32ToFloat`, and `castWord64ToDouble` from `GHC.Float`.
  See [#3174](https://github.com/clash-lang/clash-compiler/issues/3174).\n* `flake.nix`
  now advertises the [clash-lang Cachix binary cache](https://clash-lang.cachix.org)
  via `nixConfig.extra-substituters`. Running `nix develop` will prompt you to trust
  the cache, avoiding having to build Clash from source. See [#3213](https://github.com/clash-lang/clash-compiler/issues/3213).\n\nFixed:\n*
  Clash no longer crashes for self-recursive global binders in very specific circumstances.
  See [#3311](https://github.com/clash-lang/clash-compiler/issues/3311).\n* Clash
  no longer crashes upon calling `sequenceA`/`traverse#` on a zero-sized `Vec`. See
  [#3290](https://github.com/clash-lang/clash-compiler/issues/3290).\n* Clash no longer
  crashes when constant-folding partial primitives in the GHC evaluator. This covers
  `shiftL`/`shiftR`/`rotateL`/`rotateR` with negative shift amounts on `BitVector`/`Signed`/`Unsigned`,
  `(^)` with negative exponents, `chr` on out-of-range integers, and `quot`/`rem`/`div`/`mod`
  by zero on `Int`/`Word`/`Int{8,16,32,64}`/`Word{8,16,32,64}`. Such expressions now
  fold to `undefined` (rather than crashing the compiler). Fixes [#3234](https://github.com/clash-lang/clash-compiler/issues/3234).\n*
  Clash no longer crashes with `mkVecNil: failed to instantiate Nil DC` when unfolding
  `traverse#` in very specific circumstances. See [#3291](https://github.com/clash-lang/clash-compiler/issues/3291).\n*
  Clash no longer errors when two `-i` import paths refer to the same directory via
  different syntactic spellings (e.g. `-isrc -isrc/.`) and a data file lives in that
  directory. See [#3142](https://github.com/clash-lang/clash-compiler/issues/3142).\n*
  Clash no longer produces an error when using `dataToTag` in combination with custom
  bit representations. See [#2724](https://github.com/clash-lang/clash-compiler/issues/2724).\n*
  Clash no longer takes exponential time and memory normalizing `foldl`/`scanl`/`splitAt`
  over a vector when the result keeps the (co-recursively defined) vector spine alive,
  e.g. `snd (foldl const (z, s) (xs :: Vec n a))`. The evaluator's `zipWith` and `splitAt`
  reductions now share their arguments instead of duplicating the vector spine on
  every peel. See [#3308](https://github.com/clash-lang/clash-compiler/issues/3308).\n*
  Clash now recognizes `~` when solving GADT arms. Fixes [#3232](https://github.com/clash-lang/clash-compiler/issues/3232).\n*
  Clash will no longer generate duplicate `attribute` when they're both used for top
  entity ports and internal signals. See [#3218](https://github.com/clash-lang/clash-compiler/issues/3218).
  The VHDL backend now also reports a clearer error when a synthesis attribute is
  declared with conflicting types in the same design.\n* Due to HDL standards, when
  the result of a top entity is read by another binder Clash is forced to introduce
  an internal indirection signal. Clash no longer attaches the top entity's `Annotate`
  synthesis attributes to that internal signal, preventing duplicate synthesis attributes
  in the generated HDL. See [#3224](https://github.com/clash-lang/clash-compiler/issues/3224).\n*
  Errors in `Synthesize` port annotations (e.g. a `PortProduct` on a non-product port)
  are now reported before a design is normalized, instead of afterwards. This avoids
  waiting for a potentially long normalization only to get a trivial port error. See
  [#3305](https://github.com/clash-lang/clash-compiler/issues/3305).\n* Run `bindConstantVar`
  after post-normalization `inlineCleanup`/`caseCon` so constant let-bindings exposed
  late are inlined before netlist generation [#3041](https://github.com/clash-lang/clash-compiler/issues/3041).\n*
  The VHDL primitives for `integerToNaturalThrow` and `integerToNaturalClamp` no longer
  contain syntax errors. See [#3315](https://github.com/clash-lang/clash-compiler/pull/3315).\n*
  The internal function `Clash.Util.Interpolate.i` in `clash-lib` no longer inserts
  an extra blank line after a paragraph that gets reflowed onto multiple lines. See
  [#2753](https://github.com/clash-lang/clash-compiler/issues/2753).\n* `deriveAutoReg`
  no longer fails on GHC versions where `KnownNat` lives in `GHC.Internal.TypeNats`
  rather than `GHC.TypeNats`. See [#3100](https://github.com/clash-lang/clash-compiler/issues/3100).\n*
  `makeTopEntity` now accounts for unary product types. See [#3066](https://github.com/clash-lang/clash-compiler/issues/3066).\n\n##
  1.10.0 *Apr 23rd, 2026*\n\nRelease highlight:\n* `Clash.Class.NumConvert`: Utilities
  for safely converting between various Clash number types [#2915](https://github.com/clash-lang/clash-compiler/pull/2915)\n\nAdded:\n*
  Added GHC 9.12 support\n* `Clash.Class.NumConvert`: Utilities for safely converting
  between various Clash number types [#2915](https://github.com/clash-lang/clash-compiler/pull/2915)\n*
  Add `Clash.XException.ShowX` instance for `Foreign.C.Types.CUShort`. [#2397](https://github.com/clash-lang/clash-compiler/pull/2397)\n*
  Introduced various new types to `Clash.Signal` to more easily represent time and
  its relation to your clock domain. New types: `Seconds`, `Milliseconds`, `Microseconds`,
  `Nanoseconds`, `Picoseconds`, `DomainToHz`, `HzToPeriod`, `PeriodToHz`, `PeriodToCycles`,
  `ClockDivider`. [#2734](https://github.com/clash-lang/clash-compiler/pull/2734)\n*
  `Distributive` and `Representable` instances for `Vec`\n* Resize functions `maybeResize`
  and `maybeTruncateB` to `Clash.Class.Resize`. Can be used to resize without loss
  of information. [#2779](https://github.com/clash-lang/clash-compiler/issues/2779)\n*
  Alongside the existing Eq-like and Ord-like signal operators like `.==.` and `.<=.`
  etc., there are now new functions for comparing with constants: `.==`, `==.`, `./=`,
  `/=.`, `.<=`, `<=.`, `.>=`, `>=.`, `.>`, `>.`, `.<`, `<.`, `.&&`, `&&.`, `.||`,
  `||.`. These are useful for comparing signals with constants in a more readable
  way. For example, `a .==. pure True` can now be replaced with `a .== True`. [#2545](https://github.com/clash-lang/clash-compiler/pull/2545)\n*
  instance `HasField f (Signal dom r) (Signal dom a)`. This means record dot accesses
  will be passed to the underlying type. For example, this will work:\n\n  ```haskell\n
  \ data MyRecord = MyRecord { myField :: Int }\n\n  a :: Signal dom MyRecord\n  a
  = pure (MyRecord 3)\n\n  b :: Signal dom Int\n  b = a.myField\n  ```\n* `BitPack`
  instance for `Data.Proxy.Proxy`\n* `apEn`, which is a `mux` that optionally applies
  an update function to a value. [#3029](https://github.com/clash-lang/clash-compiler/pull/3029)\n*
  `regEnN`, which is a chain of `regEn`s. [#3029](https://github.com/clash-lang/clash-compiler/pull/3029)\n*
  `Index 0` instances for `BitPack`, `Bits`, `Counter`, `FiniteBits`, `Parity`, and
  `SaturatingNum`. [#2784](https://github.com/clash-lang/clash-compiler/pull/2784)\n*
  Zero-sized block RAM implementations for `blockRam1` and `blockRamU`. [#2784](https://github.com/clash-lang/clash-compiler/pull/2784)\n*
  `Counter a => Counter (Vec 0 a)` instance. [#2784](https://github.com/clash-lang/clash-compiler/pull/2784)\n*
  `SaturatingNum` and `Bounded` instances for `Signal dom a`. The `sat` family (`satAdd`,
  `satSucc`, ...) can now be used on `Signal`s and `{min,max}Bound` can be used to
  construct them [#2931](https://github.com/clash-lang/clash-compiler/issues/2931)\n*
  `-fclash-no-concurrent-topentity-compilation` flag to disable concurrent compilation
  of top entities. This is mostly useful to get a consistent debug output.\n* `SomeBoundedSNat`
  and Hedgehog generators [#3183](https://github.com/clash-lang/clash-compiler/pull/3183)\n*
  `Eq`, `NFData`, `ShowX` and `BitPack` instances for `RamOp`.\n* `smapWithBounds`
  extending `smap` via offering a proof witness for the upper bound of the vector
  size to the mapping function. [#2686](https://github.com/clash-lang/clash-compiler/pull/2686)\n*
  The function `Clash.Explicit.DDR.ddrForwardClock`, which uses a DDR output primitive
  to forward a clock signal to a DDR-capable output pin. [#2876](https://github.com/clash-lang/clash-compiler/pull/2876)\n\nRemoved:\n*
  Support for GHC versions 9.4 and older\n* Newer Verilators (> v5) can deal with
  delay statements, hence removing the need for Clash specific workarounds. If you
  relied on Clash-generated Verilator shims, consider using `verilator --build --binary`
  instead.\n* Experimental feature \"multiple hidden domains\" [#2750](https://github.com/clash-lang/clash-compiler/pull/2750)\n*
  The deprecated module `Clash.Prelude.DataFlow` was removed. The `clash-protocols`
  package provides dataflow-based protocols and circuits. [#3181](https://github.com/clash-lang/clash-compiler/pull/3181)\n*
  The deprecated functions `altpll` and `alteraPll` were removed from the `Clash.Intel.ClockGen`
  module. Clash 1.8 introduced the new functions `altpllSync`, `alteraPllSync`, `unsafeAltpll`
  and `unsafeAlteraPll`. A name for the IP instantiation, handled by the _name_ argument
  to `altpll` and `alteraPll`, can be provided with the `Clash.Magic.setName` function.
  [#3181](https://github.com/clash-lang/clash-compiler/pull/3181)\n\nChanged:\n* `dfold`
  now offers a proof witness for the upper bound of the vector size to the folding
  function. Note that this change may require additional type annotations, as solutions
  working in the past may complain with an untouchable type error now. [#2686](https://github.com/clash-lang/clash-compiler/pull/2686)\n*
  You can now only create an `SDomainConfiguration` when the `period` of the domain
  is at least `1`. Pattern matching on an `SDomainConfiguration` bring the `1 <= period`
  into scope. This in turns enables the following code to typecheck:\n  ```\n  import
  Clash.Prelude\n  import Data.Proxy\n\n  f ::\n    forall dom .\n    KnownDomain
  dom =>\n    Proxy dom ->\n    SNat (PeriodToCycles dom (Milliseconds 1))\n  f Proxy
  = case knownDomain @dom of\n      SDomainConfiguration {} -> SNat\n  ```\n  where
  the `DivRU` in\n  ```\n  type PeriodToCycles (dom :: Domain) (period :: Nat) =  period
  `DivRU` DomainPeriod dom\n  ```\n  requires that the `DomainPeriod dom` is at least
  `1`. [#2740](https://github.com/clash-lang/clash-compiler/pull/2740)\n* `select`
  and `selectI` now use `<=` constraints instead of `CmpNat`. [#2873](https://github.com/clash-lang/clash-compiler/pull/2873)\n*
  `ResetStrategy` now contains the reset function, to avoid dummy arguments on `NoClearOnReset`
  [#2849](https://github.com/clash-lang/clash-compiler/pull/2849)\n* `Clash.Explicit.DDR`,
  `Clash.Intel.DDR` and `Clash.Xilinx.DDR`: [#2833](https://github.com/clash-lang/clash-compiler/pull/2833)\n
  \   - The constraints for the functions have been rewritten to use `DomainPeriod`,
  which makes them more readable and relaxes unnecessary constraints on the virtual
  DDR domain. The type-level variables for the domains have been renamed. `dom` is
  a real domain, `domDDR` is the virtual DDR domain.\n    - The Xilinx and Intel primitives
  only support domains where the rising edge is the active edge. This is now enforced
  at the type level by adding a constraint.\n    - The Xilinx and Intel primitives
  now directly support any data type that has a `BitPack` instance.\n* Order of type
  arguments for functions in `clash-prelude-hedgehog` now follows _size_, _domain_,
  _monad_. [#2880](https://github.com/clash-lang/clash-compiler/pull/2880)\n* The
  Clash Prelude now exports the `Default` class from the package `data-default` instead
  of from the now superseded `data-default-class`. If you import the `Default` class
  name or the `def` function from the `data-default-class` package _older than version
  0.2_, or one of your dependencies does, you might get a bewildering error message.
  You might get the error \"No instance for (Default T)\" even though there appears
  to be such an instance. The best solution is to make sure all your packages and
  dependencies use the `data-default` package and not the `data-default-class` package.
  The next most obvious solution is to make sure `data-default-class` is of version
  0.2 or higher, for instance by depending on it in your own package. If this creates
  a dependency conflict, another solution is to import the correct module. `Default`
  and `def` from `Clash.Prelude` or `Data.Default` are for the new `data-default`
  package. `Data.Default.Class` is for the `data-default-class` package. There are
  situations where this will still not be enough, but luckily the `Default` class
  is not used all that much. [#2891](https://github.com/clash-lang/clash-compiler/pull/2891)\n*
  Changed implementation of `(+>>)` to no longer require `KnownNat`\n* The `clash-prelude`
  package now uses `PolyKinds` by default, meaning all its type class instances are
  now more general than before. As an example, without `PolyKinds`, `BitPack (Proxy
  a)` would only be defined when `a :: Type`, with the extension it would be defined
  for any  `a :: k`. After this change, some instances in user code might now overlap.
  [#2994](https://github.com/clash-lang/clash-compiler/pull/2994)\n* When generating
  (System)Verilog, Clash now resets the default net type from none to the verilog
  default after the generated module. [#3005](https://github.com/clash-lang/clash-compiler/pull/3005)\n*
  The content from the `Clash.Tutorial` module and from https://clash-lang.readthedocs.io/
  has been split and moved to two new locations.\n  1. The actual tutorial parts has
  been moved to: https://docs.clash-lang.org/tutorial/\n  2. Parts that fit better
  in the clash compiler user guide have been moved to: https://docs.clash-lang.org/compiler-user-guide/\n\n
  \ Moving the documentation to these locations makes it easier to update their content
  as it is no longer needed to release a new version of the `clash-prelude` package
  for the publication of this content.\n* Vector functions in Verilog now have indices
  consistent with the Vec inputs/outputs (before they were reversed). This is convenient
  when writing design constraints, which can now be referenced consistently like `imap[0],imap[1],..`.
  See [#3088](https://github.com/clash-lang/clash-compiler/issues/3088).\n\nFixed:\n*
  Clash no longer gives `Dubious primitive instantiation warning` when using `unpack`
  [#2386](https://github.com/clash-lang/clash-compiler/issues/2386).\n* Clash now
  generates more intuitive names for specialized binders. See [#2508](https://github.com/clash-lang/clash-compiler/issues/2508).\n*
  `foldl` on `Vec` is now strict. See [this GitHub discussion](https://github.com/hasura/graphql-engine/pull/2933#discussion_r328821960)
  and [this blog post](https://well-typed.com/blog/90/) for more information. [#2482](https://github.com/clash-lang/clash-compiler/issues/2482)\n*
  Type families that appear in GHC core types are now normalized before being translated
  into their Clash core equivalent. See [#3063](https://github.com/clash-lang/clash-compiler/issues/3063).\n*
  Added an evaluator rule for `bigNatEq#` with compile-time constant arguments [#3084](https://github.com/clash-lang/clash-compiler/issues/3084)\n*
  Reduce constants to NF before specialization [#3129](https://github.com/clash-lang/clash-compiler/issues/3129)\n*
  `rotateL` and `rotateR` no longer error when used on `BitVector 0` [#2980](https://github.com/clash-lang/clash-compiler/issues/2980)\n*
  Behavior of `shiftR` is now documented for `Unsigned`, `BitVector`, `Index`, and
  `Signed` [#2959](https://github.com/clash-lang/clash-compiler/issues/2959)\n* Clash
  will no longer error if it finds the same data file more than once due to duplicate
  `-i` flags [#3141](https://github.com/clash-lang/clash-compiler/issues/3141)\n*
  Higher order blackboxes not propagating usage metadata for generated results [#3147](https://github.com/clash-lang/clash-compiler/issues/3147)\n*
  Run `caseCon` after post-normalization `inlineCleanup` [#3159](https://github.com/clash-lang/clash-compiler/issues/3159)\n*
  Failure to generate binder assignments in very specific cases [#3185](https://github.com/clash-lang/clash-compiler/issues/3185)\n*
  Clash won't create (invalid) netlist cases on Integer and Natural constructors anymore
  [#3157](https://github.com/clash-lang/clash-compiler/issues/3157)\n* Post-normalization
  flattening could leave a `Just` constructor as the scrutinee of a `case` after simplifying
  tuple projections [#3204](https://github.com/clash-lang/clash-compiler/issues/3204)\n*
  Clash no longer crashes on false positive free variable introduction in `reduceConst`
  and `constantSpec`. Fixes [#3206](https://github.com/clash-lang/clash-compiler/issues/3206).\n*
  `negate` for `Num Bit` is now defined as the additive inverse, i.e., `negate = id`.
  [#2999](https://github.com/clash-lang/clash-compiler/issues/2999)\n\n## 1.8.5 *Mar
  24th, 2026*\n\nAdded:\n* `Clash.Annotation.SynthesisAtrributes.annotateReg`, a function
  to add synthesis attributes (e.g. `ASYNC_REG`) to register declarations in the HDL
  generated by the Clash compiler.\n  [#3093](https://github.com/clash-lang/clash-compiler/pull/3093)\n*
  `registerSyncReset` [#3115](https://github.com/clash-lang/clash-compiler/issues/3115)\n\nFixed:\n*
  The `Clash.Explicit.Verification.check` blackbox now correctly uses the given clock
  line, not assuming any longer that it is already bound to an identifier in the first
  place. [#2907](https://github.com/clash-lang/clash-compiler/issues/2907)\n* The
  type of string literals passed to the `Clash.Explicit.Verification.check` blackbox
  now matches with the input provided via `Clash.Explicit.Verification.name`. [#2908](https://github.com/clash-lang/clash-compiler/issues/2908)\n*
  `toInteger`, `toEnum`, and `fromEnum` now correctly sign extend when using Verilog
  backend. [#2729](https://github.com/clash-lang/clash-compiler/issues/2729).\n* `dumpVCD`
  now properly aligns the first clock edges in multi-domain designs. [#3075](https://github.com/clash-lang/clash-compiler/issues/3075)\n*
  Removed the limit on the number of traces in `dumpVCD`. Also removed unnecessary
  double newlines after 1-bit signals. [#3082](https://github.com/clash-lang/clash-compiler/issues/3082)\n*
  In Clash simulation, `pack` for `Vec` and `RTree` had all bits undefined when the
  spine of the value had an `XException`. Now, those elements with defined bits will
  output those defined bits. In HDL, this was already the case. Example: consider
  `xs = 1 :> undefined :> Nil :: Vec 2 (Unsigned 4)` and `ys = 1 :> undefined :: Vec
  2 (Unsigned 4)`. `xs` merely has an undefined element, but `ys` has an undefined
  spine: it is a `:>` constructor that is undefined. `pack ys` used to be `0b...._....`
  but is now `0b0001_....`, just as `pack xs` already was.\n  [#3114](https://github.com/clash-lang/clash-compiler/pull/3114)\n*
  Clash drops cached normalization result. [#3109](https://github.com/clash-lang/clash-compiler/issues/3109)\n*
  Fix `holdReset` glitch behavior for asynchronous resets and wrong hold cycles for
  sync resets. [#3115](https://github.com/clash-lang/clash-compiler/issues/3115)\n*
  Do not emit source locations if `-g` is not passed to clash [#3132](https://github.com/clash-lang/clash-compiler/issues/3132)\n*
  `clash-ghc`: Remove `Opt_LlvmTBAA` from unwanted flags [#2508](https://github.com/clash-lang/clash-compiler/issues/2823)\n\n##
  1.8.4 *Nov 6th 2025*\n\nChanged:\n* Nix flake updated to make it more suitable for
  use in downstream projects. [#2987](https://github.com/clash-lang/clash-compiler/pull/2987)
  [#3060](https://github.com/clash-lang/clash-compiler/pull/3060)\n\nFixed:\n* `collapseRHSNoops`
  now runs after constant folding, making Clash able to constant fold more expressions
  than before. See [#3036](https://github.com/clash-lang/clash-compiler/issues/3036).\n*
  The `unzip` family no longer retains a reference to the original input for every
  (unevaluated) part of the output tuple. Similarly, `mapAccumL` and `mapAccumR` are
  now also more eager to drop references. This can help to prevent space leaks. See
  [#3038](https://github.com/clash-lang/clash-compiler/issues/3038).\n* Individual
  items of `iterateI` no longer retain a reference to the whole list, preventing space
  leaks. See [#3042](https://github.com/clash-lang/clash-compiler/issues/3042).\n*
  The compiler now tracks assignment types in more places, which can prevent \"clash
  error call\" errors in some specific cases. See [#3045](https://github.com/clash-lang/clash-compiler/issues/3045).\n*
  Test bench primitives now assign the string they want to pass to Verilog's `$display`
  to a variable before printing. This works around a limitation in IVerilog. See [#3046](https://github.com/clash-lang/clash-compiler/issues/3046).\n\n##
  1.8.3 *Oct 6th 2025*\n\nAdded:\n* `Counter` instances for `Bool`, `Bit`, `Int`,
  `Int8`, `Int16`, `Int32`, `Int64`, `Word`, `Word8`, `Word16`, `Word32`, `Word64`,
  `Identity` and `Maybe`. [#2692](https://github.com/clash-lang/clash-compiler/pull/2692)\n*
  The Vec type now has a [COMPLETE pragma](https://ghc.gitlab.haskell.org/ghc/doc/users_guide/exts/pragmas.html#complete-pragma)
  to avoid incomplete pattern matches when using the `(:>)` pattern. [#3020](https://github.com/clash-lang/clash-compiler/pull/3020)\n*
  RamOp now has an AutoReg instance. [#2792](https://github.com/clash-lang/clash-compiler/pull/2792)\n*
  Added instance `NFDataX (SimOnly a)` [#2900](https://github.com/clash-lang/clash-compiler/pull/2900)\n*
  Support for GHC 9.10 on Windows (macOS and Linux were already supported) [#2945](https://github.com/clash-lang/clash-compiler/pull/2945)\n*
  Added a `BitPack` instance for `Char` [#2957](https://github.com/clash-lang/clash-compiler/pull/2957)\n*
  Support for GHC 9.10.2 [#3003](https://github.com/clash-lang/clash-compiler/pull/3003)\n\nChanged:\n*
  Functions defined on `Clash.Class.Counter` are now public [#2692](https://github.com/clash-lang/clash-compiler/pull/2692)\n\nFixed:\n*
  Clash hanging when rendering `Index n` literals, for large values of `n` [#2813](https://github.com/clash-lang/clash-compiler/issues/2813)\n*
  Render overflowed Index literals as don't-cares in HDL [#2970](https://github.com/clash-lang/clash-compiler/pull/2970)\n*
  Clash errors out when `Clash.Sized.Vector.splitAt` is compile-time evaluated in
  an illegal context [#2831]https://github.com/clash-lang/clash-compiler/issues/2831\n*
  `Clash.Explicit.DDR`: [#2911](https://github.com/clash-lang/clash-compiler/pull/2911)\n
  \ - `ddrIn`: VHDL: Remove data input from sensitivity list of `ddrIn_neg_latch`
  register as it is superfluous. This should not affect functionality.\n  - `ddrOut`:
  VHDL: Fix incorrect usage of `Enable` input when the domain is set to asynchronous
  resets. Deasserting the `Enable` exhibited wrong behavior before this fix.\n* `Clash.Xilinx.DDR`:
  [#2911](https://github.com/clash-lang/clash-compiler/pull/2911)\n  - These primitives
  only support clocks where the rising edge is the active edge. Using them in a domain
  with falling active edges now causes an error.\n  - `oddr`: Fix VHDL and SystemVerilog
  erroring out during HDL generation\n  - Symbols in HDL for both `iddr` and `oddr`
  were renamed to match their function.\n* `Clash.Intel.DDR`: [#2911](https://github.com/clash-lang/clash-compiler/pull/2911)\n
  \ - These primitives only support clocks where the rising edge is the active edge.
  Using them in a domain with falling active edges now causes an error.\n  - Fix rendering
  HDL. It variously errored out or generated non-working HDL.\n  - Rendering HDL no
  longer causes Clash to issue a warning about an argument unused in Haskell but used
  in the primitive black box.\n* `makeTopEntity` now accounts for `SimOnly` constructs.
  This can prevent warnings in situtations where the `SimOnly` type would contain
  types `makeTopEntity` cannot handle. [#2897](https://github.com/clash-lang/clash-compiler/pull/2897)\n*
  Clash did not build on GHC 9.6.7 (but did on 9.6.6) [#2916](https://github.com/clash-lang/clash-compiler/issues/2916)\n*
  Ignore `Tick`s in `TermLiteral Integer`, `TermLiteral Char`, `TermLiteral Natural`,
  and `TermLiteral (SNat n)` [#2925](https://github.com/clash-lang/clash-compiler/pull/2925)\n*
  Fixed laziness issue in internal black box `imap_go` [#2542](https://github.com/clash-lang/clash-compiler/issues/2542)\n*
  Clash's evaluator now uses `TemplateHaskell` names to detect renamed symbols in
  `GHC.*` and `Clash.*`. Fixes errors similar to `No blackbox found for: GHC.Internal.Base.eqString`
  [#2972](https://github.com/clash-lang/clash-compiler/issues/2972)\n* No blackbox
  found for: `GHC.Internal.Control.Exception.Base.recSelError` on GHC 9.10 [#2966](https://github.com/clash-lang/clash-compiler/issues/2966)\n*
  Verilog and System Verilog code gen bug for `map head` [#2809](https://github.com/clash-lang/clash-compiler/issues/2809)\n*
  Error parsing blackbox: `Clash.Sized.Vector.head` [#2988](https://github.com/clash-lang/clash-compiler/issues/2988)\n*
  Clash no longer duplicates included datafiles when component is instantiated multiple
  times [#3008](https://github.com/clash-lang/clash-compiler/issues/3008)\n* Clash
  will no longer emit \"no blackbox found for\" `GHC.Real`'s exponentiation function
  if it is applied to constants [#3010](https://github.com/clash-lang/clash-compiler/pull/3010)\n*
  Clash will no longer error out when converting `ensureSpine` on Clash number types
  to HDL [#3021](https://github.com/clash-lang/clash-compiler/issues/3021)\n* Clash
  will no longer ignore Synthesize annotations when the function is used in an argument
  position [#3024](https://github.com/clash-lang/clash-compiler/issues/3024)\n\n##
  1.8.2 *Jan 3rd 2025*\n\nAdded:\n* Support for GHC 9.10 [#2758](https://github.com/clash-lang/clash-compiler/pull/2758)\n*
  Support for GHC 9.8.4 [#2852](https://github.com/clash-lang/clash-compiler/issues/2852)\n*
  Add `ShowX`, `NFDataX` instances for `Proxy` [#2637](https://github.com/clash-lang/clash-compiler/pull/2637)\n*
  Added `Clash.Sized.Vector.ToTuple.vecToTuple`: a way to safely work around incomplete
  patterns warnings on patterns involving `Vec`tors. [#2862](https://github.com/clash-lang/clash-compiler/pull/2682)\n*
  Added operator precedences for infix usage of functions exported from `Clash.Class.Num`:
  `mul`, `add`, `sub`, `satMul`, `satAdd`, `satSub`, `boundedMul`, `boundedAdd`, and
  `boundedSub`. This means that expressions such as `` a `add` b `mul` c `` now get
  parsed as `` a `add` (b `mul` c) `` instead of `` (a `add` b) `mul` c ``. [#2719](https://github.com/clash-lang/clash-compiler/pull/2719)\n\nChanged:\n*
  `BitVector n` now has an implementation for `ensureSpine` which ensures the constructor
  is present. [#2702](https://github.com/clash-lang/clash-compiler/pull/2702)\n* `xToBV`
  is now located in `Clash.Sized.Internal.BitVector` to avoid circular dependencies.
  [#2702](https://github.com/clash-lang/clash-compiler/pull/2702)\n* The error messages
  that mention the valid ranges for out-of-range inputs have been improved to be more
  intuitive: one of `<empty range>`, `[n]` or `[n..m]`. All _n..m_ ranges are now
  ordered with the lower bound on the left. [#2733](https://github.com/clash-lang/clash-compiler/pull/2733)\n\nFixed:\n*
  cabal: Make `workaround-ghc-mmap-crash` a noop on non-x86_64. Fixes [#2656](https://github.com/clash-lang/clash-compiler/issues/2656)\n*
  Clash no longer hides error messages if it fails to load external (precompiled)
  modules. Note: this fix only works from GHC 9.0 on. See [#2365](https://github.com/clash-lang/clash-compiler/issues/2365)\n*
  HDL generation fails when using multiple-hidden feature in combination with synthesis
  attributes [#2593](https://github.com/clash-lang/clash-compiler/issues/2593)\n*
  Clash no longer errors out in the netlist generation stage when a polymorphic function
  is applied to type X in one alternative of a case-statement and applied to a newtype
  wrapper of type X in a different alternative. See [#2828](https://github.com/clash-lang/clash-compiler/issues/2628)\n*
  various issues with black boxes and evaluator rules for number-related primitives
  [#2689](https://github.com/clash-lang/clash-compiler/pull/2689)\n* `genBitVector`
  no longer contains off-by-one error on for generated Naturals [#2704](https://github.com/clash-lang/clash-compiler/pull/2704)\n*
  (+>>.) and (.<<+) such that they are compliant with (+>>) and (<<+) for vectors
  of zero length in the sense that the input vector is kept unchanged. [#2730](https://github.com/clash-lang/clash-compiler/issues/2730)\n*
  Removed `stringsearch` dependency from `v16-upgrade-primitives`. See [#2726](https://github.com/clash-lang/clash-compiler/issues/2726)\n*
  Bug in the compile-time evaluator [#2781](https://github.com/clash-lang/clash-compiler/issues/2781)\n*
  Exponentiation (`Clash.Class.Exp`) is now right-associative with a precedence level
  of 8 (`infixr 8`). By accident, it used to lack a fixity declaration, meaning it
  was implicitly left-associative at level 9. [#2818](https://github.com/clash-lang/clash-compiler/pull/2818)\n*
  Unused argument warnings on writeToBiSignal# [#2822](https://github.com/clash-lang/clash-compiler/pull/2822)\n*
  Clash errored saying it cannot translate a globally recursive function in code that
  originally only contains let-bound (local) recursion [#2839](https://github.com/clash-lang/clash-compiler/issues/2839)\n*
  Clash generates illegal Verilog names [#2845](https://github.com/clash-lang/clash-compiler/issues/2845)\n\n##
  1.8.1 *Nov 10th 2023*\n\n* Bump package dependencies to allow inclusion in stackage-nightly\n*
  Bump package dependencies to allow building on GHC 9.8.1\n\n## 1.8.0 *Nov 10th 2023*\n\nRelease
  highlights:\n\n* Support for GHC 9.2, 9.4, 9.6 and 9.8. While GHC 9.2 is supported,
  we recommend users to skip this version as there is a severe degradation of error
  message quality. With this change, Clash now supports GHC versions 8.6 through 9.8.\n*
  Major overhaul of the clocking functionality in `Clash.Xilinx.ClockGen` and `Clash.Intel.ClockGen`,
  see their respective entries below\n* `mealyS` function (and several variations)
  to make writing state machines using the strict `State` monad easier\n* Overhaul
  of `resetGlitchFilter`, see its respective entries below.\n\nAdded:\n\n* `altpllSync`
  and `alteraPllSync` in `Clash.Intel.ClockGen`. These replace the deprecated functions
  without the `Sync` suffix. Unlike the old functions, these functions are safe to
  use and have a reset signal for each output domain that can be used to keep the
  domain in reset while the clock output stabilizes. All PLL functions now also support
  multiple clock outputs like the old `alteraPll` did. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n*
  \ A new clock type `DiffClock` is introduced to signify a differential clock signal
  that is passed to the design on two ports in antiphase. This is used by the differential
  Xilinx clock wizards in `Clash.Xilinx.ClockGen`. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n*
  `Clash.Explicit.Testbench.clockToDiffClock`, to create a differential clock signal
  in a test bench. It is not suitable for synthesizing a differential output in hardware.
  [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n* `resetGlitchFilterWithReset`,
  which accomplishes the same task as `resetGlitchFilter` in domains with unknown
  initial values by adding a power-on reset input to reset the glitch filter itself.
  [#2544](https://github.com/clash-lang/clash-compiler/pull/2544)\n* Convenience functions:
  `noReset`, `andReset`, `orReset` plus their unsafe counterparts [#2539](https://github.com/clash-lang/clash-compiler/pull/2539)\n*
  Convenience constraint aliases: `HasSynchronousReset`, `HasAsynchronousReset`, and
  `HasDefinedInitialValues` [#2539](https://github.com/clash-lang/clash-compiler/pull/2539)\n*
  `Clash.Prelude.Mealy.mealyS` and `Clash.Explicit.Mealy.mealyS` and their bundled
  equivalents `mealySB` which make writing state machines using the strict `State`
  monad easier. The tutorial has also been simplified by using this change. [#2484](https://github.com/clash-lang/clash-compiler/pull/2484)\n*
  An experimental feature allowing clocks to vary their periods over time, called
  \"dynamic clocks\". Given that this is an experimental feature, it is not part of
  the public API. [#2295](https://github.com/clash-lang/clash-compiler/pull/2295)\n*
  The prelude now exports `+>>.` and `.<<+`, which can be used to shift in a bit into
  a `BitVector` from the left or right respectively - similar to `+>>` and `<<+` for
  `Vec`s. [#2307](https://github.com/clash-lang/clash-compiler/pull/2307)\n* `Clash.DataFiles.tclConnector`
  and the executable `static-files` in `clash-lib`. They provide the Tcl Connector,
  a Tcl script that allows Vivado to interact with the metadata generated by Clash
  (Quartus support will be added later). See `Clash.DataFiles.tclConnector` for further
  information. More documentation about the Tcl Connector and the Clash<->Tcl API
  will be made available later. [#2335](https://github.com/clash-lang/clash-compiler/pull/2335)\n*
  Add `BitPack`, `NFDataX` and `ShowX` instances for `Ordering` [#2366](https://github.com/clash-lang/clash-compiler/pull/2366)\n*
  Verilog users can now influence the \"precision\" part of the generated `timescale`
  pragma using `-fclash-timescale-precision`. [#2353](https://github.com/clash-lang/clash-compiler/pull/2353)\n*
  Clash now includes blackboxes for `integerToFloat#`, `integerToDouble#` [#2342](https://github.com/clash-lang/clash-compiler/issues/2342)\n*
  Instances `Arbitrary (Erroring a)`, `Arbitrary (Saturating a)`, `Arbitrary (Saturating
  a)`, and `Arbitrary (Zeroing a)` [#2356](https://github.com/clash-lang/clash-compiler/pull/2356)\n*
  `Clash.Magic.clashSimulation`, a way to differentiate between Clash simulation and
  generating HDL. [#2473](https://github.com/clash-lang/clash-compiler/pull/2473)\n*
  `Clash.Magic.clashCompileError`: make HDL generation error out with a custom error
  message. Simulation in Clash will also error when the function is evaluated, including
  a call stack. HDL generation unfortunately does not include a call stack. [#2399](https://github.com/clash-lang/clash-compiler/pull/2399)\n*
  Added `Clash.XException.MaybeX`, a data structure with smart constructors that can
  help programmers deal with `XException` values in their blackbox model implementations
  [#2442](https://github.com/clash-lang/clash-compiler/pull/2442)\n*  `Clash.Magic.SimOnly`,
  A container for data you only want to have around during simulation and is ignored
  during synthesis. Useful for carrying around things such as: a map of simulation/vcd
  traces, co-simulation state or meta-data, etc. [#2464](https://github.com/clash-lang/clash-compiler/pull/2464)\n*
  `KnownNat (DomainPeriod dom)` as an implied constraint to `KnownDomain dom`. This
  reduces the amount of code needed to write - for example - clock speed dependent
  code. [#2541](https://github.com/clash-lang/clash-compiler/pull/2541)\n* `Clash.Annotations.SynthesisAttributes.annotate`:
  a term level way of annotating signals with synthesis attributes [#2547](https://github.com/clash-lang/clash-compiler/pull/2547)\n*
  `Clash.Annotations.SynthesisAttributes.markDebug`: a way of marking a signals \"debug\",
  instructing synthesizers to leave the signal alone and offer debug features [#2547](https://github.com/clash-lang/clash-compiler/pull/2547)\n*
  Add hex and octal BitVector parsing. [#1772](https://github.com/clash-lang/clash-compiler/pull/2505)\n*
  `1 <= n => Foldable1 (Vec n)` instance (`base-4.18+` only) [#2563](https://github.com/clash-lang/clash-compiler/pull/2563)\n*
  You can now use `~PERIOD`, `~ISSYNC`, `~ISINITDEFINED` and `~ACTIVEEDGE` on arguments
  of type `Clock`, `Reset`, `Enable`,`ClockN` and `DiffClock`. [#2590](https://github.com/clash-lang/clash-compiler/pull/2590)\n\nRemoved:\n\n*
  Deprecated module `Clash.Prelude.BitIndex`: functions have been moved to `Clash.Class.BitPack`
  [#2555](https://github.com/clash-lang/clash-compiler/pull/2555)\n* Deprecated module
  `Clash.Prelude.BitReduction`: functions have been moved to `Clash.Class.BitPack`
  [#2555](https://github.com/clash-lang/clash-compiler/pull/2555)\n* Deprecated function
  `Clash.Explicit.Signal.enable`: function has been renamed to `andEnable` [#2555](https://github.com/clash-lang/clash-compiler/pull/2555)\n*
  The module `Clash.Clocks.Deriving` has been removed. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n\nDeprecated:\n\n*
  `unsafeFromLowPolarity`, `unsafeFromHighPolarity`, `unsafeToLowPolarity`, `unsafeToHighPolarity`
  have been replaced by `unsafeFromActiveLow`, `unsafeFromActiveHigh`, `unsafeToActiveLow`,
  `unsafeToActiveHigh`. While former ones will continue to exist, a deprecation warning
  has been added pointing to the latter ones. [#2540](https://github.com/clash-lang/clash-compiler/pull/2540)\n*
  The functions `altpll` and `alteraPll` in `Clash.Intel.ClockGen` have been deprecated
  because they are unsafe to use while this is not apparent from the name. The `locked`
  output signal of these functions is an asynchronous signal which needs to be synchronized
  before it can be used (something the examples did in fact demonstrate). For the
  common use case, new functions are available, named `altpllSync` and `alteraPllSync`.
  These functions are safe. For advanced use cases, the old functionality can be obtained
  through `unsafeAltpll` and `unsafeAlteraPll`. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n\nChanged:\n\n*
  The wizards in `Clash.Xilinx.ClockGen` have been completely overhauled. The original
  functions were unsafe and broken in several ways. See the documentation in `Clash.Xilinx.ClockGen`
  for how to use the new functions. Significant changes are:\n  * `clockWizard` and
  `clockWizardDifferential` now output a `Clock` and a `Reset` which can be directly
  used by logic. Previously, it outputted a clock and an asynchronous `locked` signal
  which first needed to be synchronized before it could be used (hence the old function
  being unsafe). Additionally, the original `locked` signal was strange: it mistakenly
  was an `Enable` instead of a `Signal dom Bool` and there was a polarity mismatch
  between Clash simulation and HDL. The `locked` signal was also not resampled to
  the output domain in Clash simulation.\n  * There are new functions `unsafeClockWizard`
  and `unsafeClockWizardDifferential` for advanced use cases which directly expose
  the `locked` output of the wizard.\n  * All clock generators now have the option
  to output multiple clocks from a single instance.\n  * `clockWizardDifferential`
  now gets its input clock as a `DiffClock` type; use `clockToDiffClock` to generate
  this in your test bench if needed. Previously, the function received two clock inputs,
  but this generated `create_clock` statements in the top-level SDC file for both
  phases which is incorrect.\n  * A constraint was removed: The _output_ clock domain
  no longer requires asynchronous resets. This was originally intended to signal that
  the outgoing lock signal is an asynchronous signal. The constraint does not convey
  this  information at all and is wrong; it also prevents using synchronous resets
  in the circuit as recommended by Xilinx. Note that if you use the `unsafe` functions,
  it is still necessary to synchronize the `locked` output in your design.\n  * The
  port names of the primitives in HDL are now correctly lower case.\n  * Add Tcl generation.
  This moves the responsibility of MMCM component generation from the user to `clashConnector.tcl`,
  which can be found in [`clash-lib:Clash.DataFiles`](https://hackage.haskell.org/package/clash-lib-1.8.0/docs/Clash-DataFiles.html).\n
  \ * The wizards now use the user-provided name as the name of the _instance_ rather
  than the name of the _IP core_. This change was also done for `Clash.Intel.ClockGen`
  in Clash v1.2.0 in March 2020, when Clash started generating Intel Qsys files. Before
  that, the user needed to generate a Qsys component manually. Now, in Clash v1.8.0,
  we also generate the Tcl for Xilinx wizards. When the user is responsible for creating
  the IP core, it makes sense to always set the component name to the user-provided
  value. But when that is also generated by Clash, that is no longer needed. Allowing
  users to set the instance name instead makes it possible to match on the instance
  in SDC files and such.\n  [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n*
  The IP core generators in `Clash.Intel.ClockGen` now declare that their input domain
  needs to have asynchronous resets (`HasAsynchronousReset`), as the functions react
  asynchronously to their reset input and thus need to be glitch-free. The functions
  marked `unsafe` do not have this constraint; instead, the function documentation
  calls attention to the requirement. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n*
  `resetGlitchFilter` now uses a counter instead of shift register, allowing glitch
  filtering over much larger periods. [#2374](https://github.com/clash-lang/clash-compiler/pull/2374)\n*
  `resetGlitchFilter` now filters glitches symmetrically, only deasserting the reset
  after the incoming reset has stabilized. For more information, read [#2374](https://github.com/clash-lang/clash-compiler/pull/2374).\n*
  `resetGlitchFilter` does not support domains with unknown initial values anymore.
  Its previous behavior could lead to unstable circuits. Domains not supporting initial
  values should consider using `resetGlitchFilterWithReset` or `holdReset`. The previous
  behavior can still be attained through the new `unsafeResetGlitchFilter`. [#2544](https://github.com/clash-lang/clash-compiler/pull/2544)\n*
  `fromJustX` now uses `deepErrorX` instead of `errorX`. This adds `NFDataX` constraints
  to `blockRam` like functions, `asyncRam` and `writeToBiSignal`. [#2113](https://github.com/clash-lang/clash-compiler/pull/2113)\n*
  \ All memory functions now use `deepErrorX` for `XException`s. This adds `NFDataX`
  constraints to `asyncRom`, `asyncRomPow2` and `asyncRom#`. [#2113](https://github.com/clash-lang/clash-compiler/pull/2113)\n*
  Before this release, `scanl1` was re-exported from the Haskell Prelude. Clash's
  Prelude now exports a `Vec` specialized version. [#2172](https://github.com/clash-lang/clash-compiler/pull/2172)\n*
  When generating (System)Verilog, Clash now sets the default net type to `none`.
  This means any implicitly declared signal in the design will trigger an error when
  elaborating the design. [#2174](https://github.com/clash-lang/clash-compiler/pull/2174)\n*
  Blackbox templates no longer have the `outputReg` key, it has been replaced with
  the more general `outputUsage` which specifies how signals are used in terms of
  whether writes are\n\n    * continuous (i.e. a concurrent context)\n    * procedural
  non-blocking (i.e. `signal` in a VHDL process)\n    * procedural blocking (i.e.
  `variable` in a VHDL process)\n\n  The `~OUTPUTWIREREG` tag continues to work for
  backwards compatibility, but there is also a new `~OUTPUTUSAGE` tag which is recommended.
  In the future, the `~OUTPUTWIREREG` tag may be removed. [#2230](https://github.com/clash-lang/clash-compiler/pull/2230)\n*
  `Clash.Explicit.Testbench.outputVerifier` now takes an additional clock as an argument:
  the clock used by the circuit under test. If your tests use the same domain for
  the test circuit and design under test, consider using `Clash.Explicit.Testbench.outputVerifier'`.
  [#2295](https://github.com/clash-lang/clash-compiler/pull/2295)\n* `Clash.Explicit.Signal.veryUnsafeSynchronizer`
  now accepts either a static clock period or a dynamic one. If you don't use dynamic
  clocks, convert your calls to use `Left`. [#2295](https://github.com/clash-lang/clash-compiler/pull/2295)\n*
  `SDomainConfiguration` is now a record, easing field access. [#2349](https://github.com/clash-lang/clash-compiler/pull/2349)\n*
  \ Generalized the return types of `periodToHz` and `hzToPeriod`. Use a type application
  (`periodToHz @(Ratio Natural)`, `hzToPeriod @Natural`) to get the old behavior back,
  in case type errors arise. [#2436](https://github.com/clash-lang/clash-compiler/pull/2436)\n*
  `periodToHz` and `hzToPeriod` now throw an `ErrorCall` with call stack when called
  with the argument 0 (zero), instead of a `RatioZeroDenominator :: ArithException`.
  [#2436](https://github.com/clash-lang/clash-compiler/pull/2436)\n* `hasX` now needs
  an `NFDataX` constraint, in addition to an `NFData` one. This API change was made
  to fix an issue where `hasX` would hide error calls in certain situations, see [#2450](https://github.com/clash-lang/clash-compiler/issues/2450).\n*
  Clock generators now wait at least 100 ns before producing their first tick. This
  change has been implemented to account for Xilinx's GSR in clock synchronization
  primitives. This change does not affect Clash simulation. See [#2455](https://github.com/clash-lang/clash-compiler/issues/2455).\n*
  From GHC 9.4.1 onwards the following types: `BiSignalOut`, `Index`, `Signed`, `Unsigned`,
  `File`, `Ref`, and `SimIO` are all encoded as `newtype` instead of `data` now that
  [#2511](https://github.com/clash-lang/clash-compiler/pull/2511) is merged. This
  means you can once again use `Data.Coerce.coerce` to coerce between these types
  and their underlying representation. [#2535](https://github.com/clash-lang/clash-compiler/pull/2535)\n*
  The `Foldable (Vec n)` instance and `Traversable (Vec n)` instance no longer have
  the `1 <= n` constraint. `Foldable.{foldr1,foldl1,maximum,minimum}` functions now
  throw an error at run-/simulation-time, and also at HDL-generation time, for vectors
  of length zero. [#2563](https://github.com/clash-lang/clash-compiler/pull/2563)\n*
  The `maximum` and `minimum` functions exported by `Clash.Prelude` work on non-empty
  vectors, instead of the more generic version from `Data.Foldable`. [#2563](https://github.com/clash-lang/clash-compiler/pull/2563)\n*
  `unsafeToReset` and `invertReset` now have a KnownDomain constraint This was done
  in preparation for [Remove KnownDomain #2589](https://github.com/clash-lang/clash-compiler/pull/2589)\n\nFixed:\n\n*
  `altpll` and `alteraPll` in `Clash.Intel.ClockGen` now account for the input domain's
  `ResetPolarity`. Before this fix, the reset was always interpreted as an active-high
  signal. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n* Fix `alteraPll`
  `qsys` generation. PR [#2417](https://github.com/clash-lang/clash-compiler/pull/2417)
  (included in Clash v1.6.5) caused a bug in the generation of the `qsys` file: it
  generated a spurious extra output clock which was completely unused otherwise. [#2587](https://github.com/clash-lang/clash-compiler/pull/2587)\n*
  Files in `clash-manifest.json` are now (correctly) listed in reverse topological
  order [#2334](https://github.com/clash-lang/clash-compiler/issues/2334)\n* Dependencies
  in `clash-manifest.json` are now listed in reverse topological ordering [#2325](https://github.com/clash-lang/clash-compiler/issues/2325)\n*
  Clash now renders undefined bits set via `-fclash-force-undefined` correctly [#2360](https://github.com/clash-lang/clash-compiler/issues/2360)\n*
  `resetGen`'s documentation now mentions it is non-synthesizable ([#2375](https://github.com/clash-lang/clash-compiler/issues/2375))\n*
  `trueDualPortBlockRam` now handles undefined values in its input correctly  [#2350](https://github.com/clash-lang/clash-compiler/issues/2350)\n*
  `trueDualPortBlockRam` now correctly handles port enables when clock edges coincide
  [#2351](https://github.com/clash-lang/clash-compiler/issues/2351)\n* `Clash.Primitives.DSL.deconstructProduct`
  now projects fields out of a product [#2469](https://github.com/clash-lang/clash-compiler/issues/2469)\n*
  BiSignal test does not look through `Annotate` [#2472](https://github.com/clash-lang/clash-compiler/issues/2472)\n*
  Port size not rendered when type has more than one `Annotate` [#2475](https://github.com/clash-lang/clash-compiler/pull/2475)\n*
  Clash now preserves `NOINLINE` of functions being specialized [#2502](https://github.com/clash-lang/clash-compiler/issues/2502)\n*
  When `convertReset` was used with two domains that had a different reset polarity,
  the polarity of the signal was not changed.\n* Functional arguments of primitives
  cannot have 0-bit results [#2549](https://github.com/clash-lang/clash-compiler/issues/2549)\n*
  If the source reset of `convertReset` is synchronous, a flip-flop in the source
  domain is inserted to filter glitches from the source reset. [#2573](https://github.com/clash-lang/clash-compiler/pull/2573)\n*
  SystemVerilog backend: Assignment patterns for unpacked arrays now have an index
  for every element; improves QuestaSim compatibility. [#2595](https://github.com/clash-lang/clash-compiler/pull/2595)\n*
  Name duplication in generated Verilog involving reset synchronizer [#2598](https://github.com/clash-lang/clash-compiler/issues/2598)\n\nInternal
  added:\n\n* `Clash.Primitives.DSL.instDecl` now accepts `TExpr`s instead of `LitHDL`s
  as generics/parameters. This allows for VHDL black boxes to use all possible generic
  types. To ease transition, `litTExpr` has been added to `Clash.Primitives.DSL`.
  [#2471](https://github.com/clash-lang/clash-compiler/issues/2471)\n* `Clash.Core.TermLiteral.deriveTermToData`
  now works on records [#2270](https://github.com/clash-lang/clash-compiler/pull/2270)\n*
  `Clash.Primitives.getVec` tries to get all elements in a Vector from an expression
  [#2483](https://github.com/clash-lang/clash-compiler/pull/2483)\n* Added `Clash.Primitives.DSL.deconstructMaybe`.
  This DSL function makes it easy to deconstruct a `Maybe` into its constructor bit
  and data. This is often useful for primitives taking 'enable' and 'data' signals.
  [#2202](https://github.com/clash-lang/clash-compiler/pull/2202)\n* Added `unsafeToActiveHigh`
  and `unsafeToActiveLow` to `Clash.Primitives.DSL`. [#2270](https://github.com/clash-lang/clash-compiler/pull/2270)\n*
  Added `TermLiteral` instance for `Either` [#2329](https://github.com/clash-lang/clash-compiler/pull/2329)\n*
  `Clash.Primitives.DSL.declareN`, a companion to `declare` which declares multiple
  signals in one go. [#2592](https://github.com/clash-lang/clash-compiler/pull/2592)\n\nInternal
  changes:\n\n* `Clash.Primitives.DSL.boolFromBit` is now polymorphic in its HDL backend.
  [#2202](https://github.com/clash-lang/clash-compiler/pull/2202)\n* `Clash.Primitives.DSL.unsignedFromBitVector`
  is now polymorphic in its HDL backend. [#2202](https://github.com/clash-lang/clash-compiler/pull/2202)\n*
  `Clash.Primitives.DSL.fromBV` now converts some `BitVector` expression into some
  type. [#2202](https://github.com/clash-lang/clash-compiler/pull/2202)\n* Add `CompDecl`
  to `Clash.Netlist.Types.Declaration` to accomodate VHDL's `component` declarations.\n*
  Black box functions declare their usage, necessary for implicit netlist usage analysis
  implemented in [#2230](https://github.com/clash-lang/clash-compiler/pull/2230)\n*
  Added `showsTypePrec` to `TermLiteral` to make `TermLiteral SNat` work as expected.
  Deriving an instance is now a bit simpler. Instances which previously had to be
  defined as:\n\n  ```haskell\n  instance TermLiteral Bool where\n    termToData =
  $(deriveTermToData ''Bool)\n  ```\n\n  can now be defined using:\n\n  ```haskell\n
  \ deriveTermLiteral ''Bool\n  ```\n  [#2329](https://github.com/clash-lang/clash-compiler/pull/2329)\n\n##
  1.6.6 *Oct 2nd 2023*\n\n* Support Aeson 2.2\n* Dropped the snap package\n\n    The
  Clash snap package has not been a recommended way to use Clash for quite some time,
  and it is a hassle to support.\n\n    In order to build a snap package, we build
  .deb packages for Clash with Ubuntu 20.04 LTS. But the interaction between the Debian
  build system and GHC is problematic, requiring significant effort to support and
  to upgrade to a more recent Ubuntu release.\n\n    Additionally, snap packages have
  their own issues on distributions other than Ubuntu. Given that we no longer recommend
  people use our snap package and given the effort required to keep supporting them,
  we have decided to drop the snap package.\n\n## 1.6.5 *Jun 27th 2023*\n\nFixed:\n\n
  * Support building with all combinations of specific versions of our dependencies
  `hashable` and `primitive`. [#2485](https://github.com/clash-lang/clash-compiler/pull/2485)\n
  * The Haskell simulation of the PLL lock signal in `Clash.Clocks` (used by `Clash.Intel.ClockGen`)
  is fixed: the signal is now unasserted for the time the reset input is asserted
  and vice versa, and no longer crashes the simulation. HDL generation is unchanged.
  The PLL functions now have an additional constraint: `KnownDomain pllLock`. [#2420](https://github.com/clash-lang/clash-compiler/pull/2420)\n\nChanged:\n\n
  * Export the constructor for the `Wrapping` type in the `Clash.Num.Wrapping` module.
  See [#2292](https://github.com/clash-lang/clash-compiler/issues/2292)\n\n## 1.6.4
  *Aug 30th 2022*\nFixed:\n\n * Input validation of the used arguments in blackboxes
  is now complete. [#2184](https://github.com/clash-lang/clash-compiler/pull/2184)\n
  * `Clash.Annotations.BitRepresentation.Deriving.deriveAnnotation` no longer has
  quadratic complexity in the size of the constructors and fields. [#2209](https://github.com/clash-lang/clash-compiler/pull/2209)\n
  * Fully resolve type synonyms when deriving bit representations. [#2209](https://github.com/clash-lang/clash-compiler/pull/2209)\n
  * Disregard ticks when determining whether terms are shared. Fixes [#2233](https://github.com/clash-lang/clash-compiler/issues/2233).\n
  * The blackbox parser will make sure it fully parses its input, and report an error
  when it can't. [#2237](https://github.com/clash-lang/clash-compiler/issues/2237)\n
  * Wrap ~ARG[n] in parentheses. Fixes [#2213](https://github.com/clash-lang/clash-compiler/issues/2213)\n
  * The VHDL shift primitives no longer generate bound check failures. Fixes [#2215](https://github.com/clash-lang/clash-compiler/issues/2215)\n
  * Evaluator fails impredicative type instantiation of error values [#2272](https://github.com/clash-lang/clash-compiler/issues/2272)\n
  * Fix out of bound errors in toEnum/fromSLV for sum types [#2220](https://github.com/clash-lang/clash-compiler/issues/2220)\n
  * Netlist generation fails for certain uses of GADTs [#2289](https://github.com/clash-lang/clash-compiler/issues/2289)\n
  * The documentation for `ANN TestBench` had it backwards; it now correctly indicates
  the annotation is on the test bench, not the device under test. [#1750](https://github.com/clash-lang/clash-compiler/issues/1750)\n\nFixes
  with minor changes:\n\n * `reduceXor` now produces a result if the argument has
  undefined bits instead of throwing an `XException` (the result is an undefined bit).
  `reduceAnd` and `reduceOr` already always produced a result. [#2244](https://github.com/clash-lang/clash-compiler/pull/2244)\n\nAdded:\n\n
  * Support for symbols in types while deriving bit representations. [#2209](https://github.com/clash-lang/clash-compiler/pull/2209)\n
  * Support for promoted data types while deriving bit representations. [#2209](https://github.com/clash-lang/clash-compiler/pull/2209)\n
  * `scanlPar` and `scanrPar` in Clash's Prelude, as well as the `RTree` versions
  `tscanl` and `tscanr`. These variants of `scanl1` and `scanr1` compile to a binary
  tree of operations, with a depth of `O(log(n))` (`n` being the length of the vector)
  rather than a depth of `n` for `scanl1` and `scanr1`. [#2177](https://github.com/clash-lang/clash-compiler/pull/2177)\n
  * The GADT constructors for `RTree` (`RLeaf` and `RBranch`) are now exported directly
  in addition to the patterns `LR` and `BR`. [#2177](https://github.com/clash-lang/clash-compiler/pull/2177)\n
  * Added the `~ISSCALAR` template which can be used to check if an argument is rendered
  to a scalar in HDL. [#2184](https://github.com/clash-lang/clash-compiler/pull/2184)\n
  * Added support for records and infix constructors when using `Clash.Annotations.BitRepresentation.Deriving.deriveAnnotation`.
  [#2191](https://github.com/clash-lang/clash-compiler/pull/2191)\n * Clash now contains
  instances for `ShowX`, `NFDataX` and `BitPack` on the newtypes from the Data.Functor
  modules (`Identity`, `Const`, `Compose`, `Product` and `Sum`). [#2218](https://github.com/clash-lang/clash-compiler/issues/2218)\n\n##
  1.6.3 *Apr 7th 2022*\nFixed:\n  * Handle `~ISUNDEFINED` hole in black boxes for
  `BitVector` and for product types. This means that with `-fclash-aggressive-x-optimization-blackboxes`,
  resets are now omitted for _undefined_ reset values of such types as well. [#2117](https://github.com/clash-lang/clash-compiler/issues/2117)\n
  \ * The `alteraPll` primitive was unusable since commit `d325557750` (release v1.4.0),
  it now works again. [#2136](https://github.com/clash-lang/clash-compiler/pull/2136)\n
  \ * Simulation/Synthesis mismatch for X-exception to undefined bitvector conversion
  [#2154](https://github.com/clash-lang/clash-compiler/issues/2154)\n  * The VHDL
  blackbox for `Signed.fromInteger` can now handle any `Netlist Expr` as input [#2149](https://github.com/clash-lang/clash-compiler/issues/2149)\n
  \ * Clash no longer escapes extended identifiers when rendering SDC files. [#2142](https://github.com/clash-lang/clash-compiler/pull/2142)\n
  \ * The types defined in `clash-prelude-hedgehog` now come with `Show` instances
  [#2133](https://github.com/clash-lang/clash-compiler/issues/2133)\n  * Extreme values
  are now generated from the input range instead of the type's bounds [#2138](https://github.com/clash-lang/clash-compiler/issues/2138)\n\nInternal
  change:\n  * Clash now always generates non-extended identifiers for port names,
  so that generated names play nicer with different vendor tools. [#2142](https://github.com/clash-lang/clash-compiler/pull/2142)\n
  \ * Top entity name available in netlist context. Top entity name used in generated
  name for include files. [#2146](https://github.com/clash-lang/clash-compiler/pull/2146)\n\n##
  1.6.2 *Feb 25th 2022*\nFixed:\n  * Clash now compiles for users of Clang - i.e.,
  all macOS users.\n  * The `trueDualPortBlockRam` model did not accurately simulate
  concurrent active ports, thus causing a Haskell/HDL simulation mismatch for `asyncFIFOSynchronizer`.\n
  \ * `trueDualPortBlockRam` Haskell/HDL simulation mismatch for port enable.\n  *
  Sometimes `trueDualPortBlockRam` swapped the names of the ports in exception messages.
  [#2102](https://github.com/clash-lang/clash-compiler/pull/2102)\n  * The evaluator
  rule for unpack{Float,Double}# are now corrected to return boxed float and double
  instead of unboxed literals. [#2097](https://github.com/clash-lang/clash-compiler/issues/2097)\n\nChanged:\n
  \ * The `trueDualPortBlockRam` model now only models read/write conflicts for concurrent
  active ports\n  * The `trueDualPortBlockRam` model now models write/write conflicts
  for concurrent active ports\n\n## 1.6.1 *Feb 11th 2022*\nChanged:\n  * We accidentally
  released `v1.6.0` with the Cabal flag `multiple-hidden` enabled. This is an experimental
  feature, supposed to be disabled by default for releases. `v1.6.1` disables it again.\n\nAdded:\n
  \ * `Clash.Class.HasDomain.TryDomain` instances for Clash sized types\n\n## 1.6.0
  *Feb 10th 2022*\nAdded:\n  * `Clash.Class.Counter`: a class that defines a odometer-style
  supercounter. [#1763](https://github.com/clash-lang/clash-compiler/pull/1763)\n
  \ * `isLike` function for BitPack types. [#1774](https://github.com/clash-lang/clash-compiler/pull/1774)\n
  \ * 'seqErrorX' for catching both `XException` and `ErrorCall`. [#1839](https://github.com/clash-lang/clash-compiler/pull/1839)\n
  \ * `Clash.Explicit.BlockRam.File.memFile`, a function for creating the contents
  of the data files this blockRAM uses. Can also be imported from `Clash.Prelude.BlockRam.File`,
  `Clash.Prelude.ROM.File` and `Clash.Explicit.ROM.File`. [#1840](https://github.com/clash-lang/clash-compiler/pull/1840)\n
  \ * Support for Yosys compatible SVA to `Clash.Verification`. This enables formal
  verification using SymbiYosis for Verilog and SystemVerilog. [#1798](https://github.com/clash-lang/clash-compiler/pull/1798)\n
  \ * `Clash.Explicit.Signal.Delayed.forward`, a function that can be used to retime
  a `DSignal` into the future without applying any logic. [#1882](https://github.com/clash-lang/clash-compiler/pull/1882)\n
  \ * `Clash.Signal.andEnable` is the `HiddenEnable` version of `Clash.Explicit.Signal.andEnable`
  (formerly known as `enable`) [#1849](https://github.com/clash-lang/clash-compiler/pull/1849)\n
  \ * `runUntil`, a function to sample a signal until it returns a value that satisfies
  the user-given test. It is a convenience function that, among others, allow easy
  running of a `testBench` style function in Haskell simulation, logging assertion
  failures to stderr. [#1940](https://github.com/clash-lang/clash-compiler/pull/1940)\n
  \ * Support for true dual ported block ram through `Clash.Prelude.BlockRam.trueDualPortBlockRam`
  and `Clash.Explicit.BlockRam.trueDualPortBlockRam`. [#1726](https://github.com/clash-lang/clash-compiler/pull/1726)
  [#1975](https://github.com/clash-lang/clash-compiler/pull/1975)\n  * `clash-{prelude,lib}-hedgehog`
  packages which provide generators for types in `clash-prelude` and `clash-lib`.
  The former is published on Hackage. [#1976](https://github.com/clash-lang/clash-compiler/pull/1976)\n
  \ * Clash now contains black boxes which are verilator compatible. When running
  with `--verilog` or `--systemverilog` a C++ shim is automatically produced which
  can be used to quickly generate a verilated executable. Users who wish to interact
  with verilator simulations are recommended to use [clashilator](https://github.com/gergoerdi/clashilator).
  [#2019](https://github.com/clash-lang/clash-compiler/pull/2019)\n  * Support for
  YAML blackboxes. Clash will now pickup on files with a `.primitives.yaml` extension.
  While we recommend upgrading your primitive files to the new format, old style primitives
  are still supported. We've included a tool to automatically upgrade your JSON files,
  see [#2037](https://github.com/clash-lang/clash-compiler/pull/2037)\n  * `MemBlob`:
  a datastructure for efficient constants, typically used for initializing memories.
  [#2041](https://github.com/clash-lang/clash-compiler/pull/2041)\n\nFixed:\n\n  *
  BlockRam simulation is now less strict. [#1458](https://github.com/clash-lang/clash-compiler/issues/1458)\n
  \ * Don't overflow VHDL's integer type when addressing RAM/ROM in simulation.Addresses
  are masked to 32 bits to be sure to keep it within the simulator's range. [#1875](https://github.com/clash-lang/clash-compiler/pull/1875)\n
  \ * `show` on `BitVector 0` no longer results in an empty string. [#1785](https://github.com/clash-lang/clash-compiler/pull/1785)\n
  \ * Clash now preserves transfinite floating numbers (NaN, Infinity) when packing/unpacking
  [#1803](https://github.com/clash-lang/clash-compiler/issues/1803)\n  * `SynthesisAnnotation`s
  can now be defined in type synoynms without being excluded from the generated HDL
  [#1771](https://github.com/clash-lang/clash-compiler/issues/1771)\n  * Manifest
  files now correctly list bidirectional ports as \"inout\" rather than \"in\" [#1843](https://github.com/clash-lang/clash-compiler/issues/1843)\n
  \ * `div`/`rem`/`mod` now avoid division by zero during VHDL simulation. Due to
  the use of concurrent statements, even unreachable code would previously result
  in simulation error [#1873](https://github.com/clash-lang/clash-compiler/pull/1873)\n
  \ * Don't overflow the range of VHDL's natural type in shift/rotate, leading to
  simulation issues. Shift now saturates to a 31-bit shift amount. For rotate, in
  simulation only, the rotate amount is modulo the word width of the rotated value
  [#1874](https://github.com/clash-lang/clash-compiler/pull/1874)\n  * `shiftL` for
  Clash datatypes does not cause a crash anymore when running Clash code with a really
  large shift amount [#1874](https://github.com/clash-lang/clash-compiler/pull/1874)\n
  \ * VHDL generated for `Signed.fromInteger` now truncates, like the Clash simulation,
  when the result is smaller than the argument [#1874](https://github.com/clash-lang/clash-compiler/pull/1874)\n
  \ * Clash now preserves boolean combinational logic better when generating HDL [#1881](https://github.com/clash-lang/clash-compiler/issues/1881)\n
  \ * `valid` field of `TemplateFunction` is now checked for includes [#1945](https://github.com/clash-lang/clash-compiler/issues/1945)\n
  \ * Clash now generates clock generators that ensure that the amount of time between
  simulation start and the first active edge of the clock is equal to (/or longer
  than/) the period of the clock. The first active edges of the clocks do still occur
  simultaneously. [#2001](https://github.com/clash-lang/clash-compiler/issues/2001)\n
  \ * Expected values in assert become undefined when using `-fclash-compile-ultra`
  [#2040](https://github.com/clash-lang/clash-compiler/issues/2040)\n  * `toEnum`/`fromEnum`
  on sized types is now less eager to report warnings about integer functions being
  used [#2046](https://github.com/clash-lang/clash-compiler/issues/2046)\n\nChanged:\n\n
  \ * `Clash.Verification.PrettyPrinters` has been moved from clash-prelude to to
  `Clash.Verification.Pretty` in `clash-lib`. [#1798](https://github.com/clash-lang/clash-compiler/pull/1798)\n
  \ * RAM/ROM functions: They now throw `XExeception` for out-of-bounds address inputs,
  so this condition no longer aborts simulation. [#1875](https://github.com/clash-lang/clash-compiler/pull/1875)\n
  \ * `Vec`'s show instance now generates valid Haskell. [#1776](https://github.com/clash-lang/clash-compiler/issues/1776)\n
  \ * `ShowX` and its functions now produce valid Haskell [#1782](https://github.com/clash-lang/clash-compiler/issues/1782)\n
  \ * `bLit` now infers the size of the generated BitVector from the string given
  to it. This means you don't have to give it an explicit type signature anymore.
  This does slightly modify the syntax needed to invoke `bLit`. E.g., `$$(bLit \"00..1\")
  :: BitVector 5` should be rewritten as `$(bLit \"00..1\")`. If you relied on the
  size inference, wrap the new invocation in `resize`. For example: `resize $(bLit
  \"00..1\")`. [#1784](https://github.com/clash-lang/clash-compiler/pull/1784)\n  *
  `NumericUnderscores` is now enabled by default in `clash`, `clashi`, and starter
  projects using Clash >=1.6. [#1785](https://github.com/clash-lang/clash-compiler/pull/1785)\n
  \ * `Show` instance of `BitVector` now includes a `0b` prefix, making it a copyable
  expression for fully defined vectors. [#1785](https://github.com/clash-lang/clash-compiler/pull/1785)\n
  \ * `blockRam` uses `STArray` as the underlying representation to improve simulation
  performance [#1878](https://github.com/clash-lang/clash-compiler/pull/1878)\n  *
  `asyncRom` now throws `XException` for out-of-bounds addressing, no longer aborting
  simulation [#1878](https://github.com/clash-lang/clash-compiler/pull/1878)\n  *
  Clash now renders ADTs with all zero-width fields as enumerations in VHDL [#1879](https://github.com/clash-lang/clash-compiler/pull/1879)\n
  \ * A warning about possible hard-to-debug issues has been added to the `Clash.Signal`
  documentation on hidden clocks, resets, and enables, in the form of the section
  named \"Monomorphism restriction leads to surprising behavior\" [#1960](https://github.com/clash-lang/clash-compiler/pull/1960)\n
  \ * `Clash.Explicit.Testbench.outputVerifier` and `outputVerifierBitVector` now
  emit a warning if they are used improperly. This situation only arises when they
  are used in synthesized code rather than a test bench context. When the clock domains
  `circuitDom` and `testDom` are two different domains, the clock crossing inside
  `outputVerifier` is only suitable inside a test bench, not inside a synthesized
  circuit. Clash now emits a warning for this case. [#1931](https://github.com/clash-lang/clash-compiler/pull/1931)\n
  \ * `resetSynchronizer` now no longer takes an `Enable` argument. The argument was
  already marked for removal and was ignored. [#1964](https://github.com/clash-lang/clash-compiler/pull/1964)\n
  \ * Clash can now compile multiple entities concurrently, providing speedups to
  designs with multiple entities to build [#2034](https://github.com/clash-lang/clash-compiler/pull/2034)\n
  \ * All `asyncRam` variants and `asyncFIFOSynchronizer` now require that the data
  has an `NFDataX` instance. [#2055](https://github.com/clash-lang/clash-compiler/pull/2055)\n
  \ * Clash now respects the `-Werror` option from GHC [#2066](https://github.com/clash-lang/clash-compiler/pull/2066)\n
  \ * `asyncFIFOSynchronizer` now uses the synchronous dual-ported RAM `trueDualPortBlockRam`,
  where it previously used a dual-ported RAM with an asynchronous read port `asyncRam`.
  With this change it's nearly guaranteed that `asyncFIFOSynchronizer` actually synthesizes
  to a circuit that uses the dual-ported RAMs found on most FPGAs. [#2083](https://github.com/clash-lang/clash-compiler/pull/2083)\n\nDeprecated:\n
  \ * The function `Clash.Explicit.Signal.enable` is renamed to `andEnable` and the
  existing name deprecated [#1849](https://github.com/clash-lang/clash-compiler/pull/1849)\n
  \ * '-fclash-float-support': it is now on by default and can't be turned off. [#2048](https://github.com/clash-lang/clash-compiler/pull/2048)\n\nRemoved:\n\n
  \ * GHC 8.4 is no longer supported. Users should upgrade to at least GHC 8.6. [#1762](https://github.com/clash-lang/clash-compiler/pull/1762)\n\nInternal
  changes:\n  * `clash-lib` now uses `Data.Monoid.Ap` instead of `Data.Semigroup.Monad.Mon`.
  This means users defining primitives with `TemplateFunction` will need to replace
  `Mon`/`getMon` with `Ap`/`getAp`. [#1835](https://github.com/clash-lang/clash-compiler/pull/1835)\n
  \ * Clash now supports more expressive debug options at the command line [#1800](https://github.com/clash-lang/clash-compiler/issues/1800).\n
  \ * Added `zeroWidthSpec` transformation [#1891](https://github.com/clash-lang/clash-compiler/pull/1891)\n
  \ * Added `collapseRHSNoops` inlining stage and `WorkIdentity` constructor [#1896](https://github.com/clash-lang/clash-compiler/pull/1896)\n
  \ * Added `HasType` and `InferType` classes for getting / inferring core types from
  data representing some typed \"thing\" [#1915](https://github.com/clash-lang/clash-compiler/pull/1915)\n
  \ * Added `HasFreeVars` class for getting free variables from data \"containing\"
  variables [#1917](https://github.com/clash-lang/clash-compiler/pull/1917)\n  * Added
  the primitive equality type (`~#`) to `Clash.Core.TysPrim`. In order to make this
  change, `undefinedTy` and `unsafeCoerceTy` were moved from `Clash.Core.Type` to
  `Clash.Core.Util`. [#1955](https://github.com/clash-lang/clash-compiler/pull/1955)\n
  \ * Clash now keeps information about which let bindings are recursive from GHC
  core. This can be used to avoid performing free variable calculations, or sorting
  bindings in normalization. [#1980](https://github.com/clash-lang/clash-compiler/pull/1980)
  [#2000](https://github.com/clash-lang/clash-compiler/pull/2000)\n  *  Manifest files
  now use SHA256 for a cache invalidation digest [#1985](https://github.com/clash-lang/clash-compiler/pull/1985)\n\n##
  1.4.7 *Jan 30th 2022*\nFixed:\n  * Clash now shows days in time strings for compile
  runs which take longer than a day [#1989](https://github.com/clash-lang/clash-compiler/compare/issue-1989).\n
  \ * Types defined in the package head are no longer qualified in the package body
  when rendering VHDL [#1996](https://github.com/clash-lang/clash-compiler/issues/1996).\n
  \ * `asyncRam` with different read and write clocks no longer produce the wrong
  results in Haskell simulation. [#2031](https://github.com/clash-lang/clash-compiler/pull/2031)\n
  \ * `Clash.Explicit.RAM.asyncRam#` Haskell simulation incorrectly treated an _undefined_
  write enable as asserted. It now causes an _undefined_ value to be written instead.
  This problem did not propagate to the other `asyncRam` functions, where the same
  condition would simultaneously lead to an undefined write address, which would be
  handled correctly. This problem also only affects Haskell simulation, not the generated
  HDL. [#2031](https://github.com/clash-lang/clash-compiler/pull/2031)\n  * `Clash.Explicit.BlockRam.blockRam#`
  and `Clash.Explicit.BlockRam.File.blockRamFile#` Haskell simulation incorrectly
  treated an _undefined_ write enable as asserted. It now causes an _undefined_ value
  to be written instead. This problem did not propagate to the other `blockRam` functions,
  where the same condition would simultaneously lead to an undefined write address,
  which would be handled correctly. This problem also only affects Haskell simulation,
  not the generated HDL.([#2054](https://github.com/clash-lang/clash-compiler/pull/2054))\n\nInternal
  changes:\n  * Removed instances of `Hashable Term` and `Hashable Type` [#1986](https://github.com/clash-lang/clash-compiler/pull/1986)\n
  \ * Added structural equality on `Term` (`Clash.Core.Subst.eqTerm`) and `Type` (`Clash.Core.Subst.eqType`)\n\nInternal
  fixes:\n  * Enable used to be a `Bool` in the Blackbox DSL, so we could use `boolToBit`.
  However it now has its own type in the DSL (`Enable domainName`), so we've added
  a new conversion function in order to convert it to a Bool.\n\n\n## 1.4.6 *Oct 26th
  2021*\n\nFixed:\n\n  * Clash tries to cast-specialize non-\"global binders\" resulting
  in \"specialisation of non-work-free cast\" warning [#1933](https://github.com/clash-lang/clash-compiler/issues/1945)\n
  \ * More consistently render bare untyped and unsized literals for `~LIT` tags.
  This fixes [#1934](https://github.com/clash-lang/clash-compiler/issues/1934)\n\n##
  1.4.5 *Oct 13th 2021*\n\nChanged:\n\n * `clash-lib` now supports prettyprinter 1.7\n\nDocumentation:\n\n
  * The documentation on hidden clocks, resets, and enables has been corrected and
  extended in `Clash.Signal`.\n\n## 1.4.4 *Oct 11th 2021*\nChanged:\n\n * `clash-lib`
  now supports aeson >= 2.0\n\nFixed:\n\n * Dont' loop on recursive data types hiding
  behind type families [#1921](https://github.com/clash-lang/clash-compiler/issues/1921)\n
  * Recognize `enableGen` as workfree and don't duplicate registers [#1935](https://github.com/clash-lang/clash-compiler/issues/1935)\n\n\n##
  1.4.3 *Aug 8th 2021*\nFixed:\n\n * Clash no longer generates calls to `{shift,rotate}_{left,right}`
  in VHDL where the count is a negative number [#1810](https://github.com/clash-lang/clash-compiler/issues/1810).\n
  * Clash no longer incurs unnecessary compile-time complexity while compiling Vector
  indexing operator [#1557](https://github.com/clash-lang/clash-compiler/issues/1557)\n\n##
  1.4.2 *May 18th 2021*\nFixed:\n\n * Erroneous examples in `Clash.Annotation.TopEntity`
  documentation [#646](https://github.com/clash-lang/clash-compiler/issues/646) and
  [#654](https://github.com/clash-lang/clash-compiler/issues/654)\n * `unconcat` cannot
  be used as initial/reset value for a `register` [#1756](https://github.com/clash-lang/clash-compiler/issues/1756)\n
  * `showX` now doesn't crash if a spine of a `Vec` is undefined\n * `~ISACTIVEENABLE`
  in blackboxes works again, and now acts on `Signal dom Bool` in addition to `Enable
  dom`. Since [#1368](https://github.com/clash-lang/clash-compiler/pull/1368), enable
  lines were always generated even if they were known to be always enabled. Fixes
  [#1786](https://github.com/clash-lang/clash-compiler/issues/1786).\n * clash --show-options
  now shows -fclash-* options in GHC 9.0 [#1787](https://github.com/clash-lang/clash-compiler/issues/1787)\n
  * `makeRecursiveGroups` now correctly identifies mutual recursion between global
  binders ([#1796](https://github.com/clash-lang/clash-compiler/issues/1796)).\n\n##
  1.4.1 *April 6th 2021*\nFixed:\n\n * Broken VHDL primitive template for setSlice#
  [#1715](https://github.com/clash-lang/clash-compiler/issues/1715)\n * Unable to
  reduce nested type families [#1721](https://github.com/clash-lang/clash-compiler/issues/1721)\n
  * DEC transformation fails for functions applied to more than 62 arguments [#1669](https://github.com/clash-lang/clash-compiler/issues/1669)\n
  * Erroneous examples in BlockRam.File and ROM.File documentation [#1608](https://github.com/clash-lang/clash-compiler/issues/1608)\n
  * Blackboxes of `Clash.Sized.Vector` functions error on vectors containing `Clocks`,
  `Reset`, or `Enable` [#1606](https://github.com/clash-lang/clash-compiler/issues/1606)\n
  * `Clash.Signal.Delayed.delayI` cannot be reset, the `HiddenReset` constraint was
  unintentional. Asserting its reset has never worked. Removed the constraint [#1739](https://github.com/clash-lang/clash-compiler/pull/1739).\n
  * Annotate attributes cannot use type families [#1742](https://github.com/clash-lang/clash-compiler/issues/1742)\n\nChanged:\n\n
  * `Clash.Prelude.ROM.File.romFile` now takes an `Enum addr => addr` as address argument,
  making it actually useful. [#407](https://github.com/clash-lang/clash-compiler/issues/407)\n\n##
  1.4.0 *March 12th 2021*\nHighlighted changes (repeated in other categories):\n\n
  \ * Clash no longer disables the monomorphism restriction. See [#1270](https://github.com/clash-lang/clash-compiler/issues/1270),
  and mentioned issues, as to why. This can cause, among other things, certain eta-reduced
  descriptions of sequential circuits to no longer type-check. See [#1349](https://github.com/clash-lang/clash-compiler/pull/1349)
  for code hints on what kind of changes to make to your own code in case it no longer
  type-checks due to this change.\n  * Type arguments of `Clash.Sized.Vector.fold`
  swapped: before `forall a n . (a -> a -> a) -> Vec (n+1) a -> a`, after `forall
  n a . (a -> a -> a) -> Vec (n+1) a`. This makes it easier to use `fold` in a `1
  <= n` context so you can \"simply\" do `fold @(n-1)`\n  * `Fixed` now obeys the
  laws for `Enum` as set out in the Haskell Report, and it is now consistent with
  the documentation for the `Enum` class on Hackage. As `Fixed` is also `Bounded`,
  the rule in the Report that `succ maxBound` and `pred minBound` should result in
  a runtime error is interpreted as meaning that `succ` and `pred` result in a runtime
  error whenever the result cannot be represented, not merely for `minBound` and `maxBound`
  alone.\n  * Primitives should now be stored in `*.primitives` files instead of `*.json`.
  While primitive files very much look like JSON files, they're not actually spec
  complaint as they use newlines in strings. This has recently been brought to our
  attention by Aeson fixing an oversight in their parser implementation. We've therefore
  decided to rename the extension to prevent confusion.\n\nFixed:\n  * Result of `Clash.Class.Exp.(^)`
  has enough bits in order to deal with `x^0`.\n  * Resizes to `Signed 0` (e.g., `resize
  @(Signed n) @(Signed 0)`) don't throw an error anymore\n  * `satMul` now correctly
  handles arguments of type `Index 2`\n  * `Clash.Explicit.Reset.resetSynchronizer`
  now synchronizes on synchronous domains too [#1567](https://github.com/clash-lang/clash-compiler/pull/1567).\n
  \ * `Clash.Explicit.Reset.convertReset`: now converts synchronous domains too, if
  necessary [#1567](https://github.com/clash-lang/clash-compiler/pull/1567).\n  *
  `inlineWorkFree` now never inlines a topentity. It previously only respected this
  invariant in one of the two cases [#1587](https://github.com/clash-lang/clash-compiler/pull/1587).\n
  \ * Clash now reduces recursive type families [#1591](https://github.com/clash-lang/clash-compiler/issues/1591)\n
  \ * Primitive template warning is now retained when a `PrimitiveGuard` annotation
  is present [#1625](https://github.com/clash-lang/clash-compiler/issues/1625)\n  *
  `signum` and `RealFrac` for `Fixed` now give the correct results.\n  * Fixed a memory
  leak in register when used on asynchronous domains. Although the memory leak has
  always been there, it was only triggered on asserted resets. These periods are typically
  short, hence typically unnoticable.\n  * `createDomain` will not override user definitions
  of types, helping users who strive for complete documentation coverage [#1674] https://github.com/clash-lang/clash-compiler/issues/1674\n
  \ * `fromSNat` is now properly constrained [#1692](https://github.com/clash-lang/clash-compiler/issues/1692)\n
  \ * As part of an internal overhaul on netlist identifier generation [#1265](https://github.com/clash-lang/clash-compiler/pull/1265):\n
  \   * Clash no longer produces \"name conflicts\" between basic and extended identifiers.
  I.e., `\\x\\` and `x` are now considered the same variable in VHDL (likewise for
  other HDLs). Although the VHDL spec considers them distinct variables, some HDL
  tools - like Quartus - don't.\n    * Capitalization of Haskell names are now preserved
  in VHDL. Note that VHDL is a case insensitive languages, so there are measures in
  place to prevent Clash from generating both `Foo` and `fOO`. This used to be handled
  by promoting every capitalized identifier to an extended one and wasn't handled
  for basic ones.\n    * Names generated for testbenches can no longer cause collisions
  with previously generated entities.\n    * Names generated for components can no
  longer cause collisions with user specified top entity names.\n    * For (System)Verilog,
  variables can no longer cause collisions with (to be) generated entity names.\n
  \   * HO blackboxes can no longer cause collisions with identifiers declared in
  their surrounding architecture block.\n\n\nChanged:\n  * Treat enable lines specially
  in generated HDL [#1171](https://github.com/clash-lang/clash-compiler/issues/1171)\n
  \ * `Signed`, `Unsigned`, `SFixed`, and `UFixed` now correctly implement the `Enum`
  law specifying that the predecessor of `minBound` and the successor of `maxBound`
  should result in an error [#1495](https://github.com/clash-lang/clash-compiler/pull/1495).\n
  \ * `Fixed` now obeys the laws for `Enum` as set out in the Haskell Report, and
  it is now consistent with the documentation for the `Enum` class on Hackage. As
  `Fixed` is also `Bounded`, the rule in the Report that `succ maxBound` and `pred
  minBound` should result in a runtime error is interpreted as meaning that `succ`
  and `pred` result in a runtime error whenever the result cannot be represented,
  not merely for `minBound` and `maxBound` alone.\n  * Type arguments of `Clash.Sized.Vector.fold`
  swapped: before `forall a n . (a -> a -> a) -> Vec (n+1) a -> a`, after `forall
  n a . (a -> a -> a) -> Vec (n+1) a`. This makes it easier to use `fold` in a `1
  <= n` context so you can \"simply\" do `fold @(n-1)`\n  * Moved `Clash.Core.Evaluator`
  into `Clash.GHC` and provided generic interface in `Clash.Core.Evalautor.Types`.
  This removes all GHC specific code from the evaluator in clash-lib.\n  * Clash no
  longer disables the monomorphism restriction. See [#1270](https://github.com/clash-lang/clash-compiler/issues/1270),
  and mentioned issues, as to why. This can cause, among other things, certain eta-reduced
  descriptions of sequential circuits to no longer type-check. See [#1349](https://github.com/clash-lang/clash-compiler/pull/1349)
  for code hints on what kind of changes to make to your own code in case it no longer
  type-checks due to this change.\n  * Clash now generates SDC files for each topentity
  with clock inputs\n  * `deepErrorX` is now equal to `undefined#`, which means that
  instead of the whole BitVector being undefined, its individual bits are. This makes
  sure bit operations are possible on it. [#1532](https://github.com/clash-lang/clash-compiler/pull/1532)\n
  \ * From GHC 9.0.1 onwards the following types: `BiSignalOut`, `Index`, `Signed`,
  `Unsigned`, `File`, `Ref`, and `SimIO` are all encoded as `data` instead of `newtype`
  to work around an [issue](https://github.com/clash-lang/clash-compiler/pull/1624#discussion_r558333461)
  where the Clash compiler can no longer recognize primitives over these types. This
  means you can no longer use `Data.Coerce.coerce` to coerce between these types and
  their underlying representation.\n  * Signals on different domains used to be coercable
  because the domain had a type role \"phantom\". This has been changed to \"nominal\"
  to prevent accidental, unsafe coercions. [#1640](https://github.com/clash-lang/clash-compiler/pull/1640)\n
  \ * Size parameters on types in Clash.Sized.Internal.* are now nominal to prevent
  unsafe coercions. [#1640](https://github.com/clash-lang/clash-compiler/pull/1640)\n
  \ * `hzToPeriod` now takes a `Ratio Natural` rather than a `Double`. It rounds slightly
  differently, leading to more intuitive results and satisfying the requested change
  in [#1253](https://github.com/clash-lang/clash-compiler/issues/1253). Clash expresses
  clock rate as the clock period in picoseconds. If picosecond precision is required
  for your design, please use the exact method of specifying a clock period rather
  than a clock frequency.\n  * `periodToHz` now results in a `Ratio Natural`\n  *
  `createDomain` doesn't override existing definitions anymore, fixing [#1674](https://github.com/clash-lang/clash-compiler/issues/1674)\n
  \ * Manifest files are now stored as `clash-manifest.json`\n  * Manifest files now
  store hashes of the files Clash generated. This allows Clash to detect user changes
  on a next run, preventing accidental data loss.\n  * Primitives should now be stored
  in `*.primitives` files. While primitive files very much look like JSON files, they're
  not actually spec complaint as they use newlines in strings. This has recently been
  brought to our attention by Aeson fixing an oversight in their parser implementation.
  We've therefore decided to rename the extension to prevent confusion.\n  * Each
  binder marked with a `Synthesize` or `TestBench` pragma will be put in its own directory
  under their fully qualified Haskell name. For example, two binders `foo` and `bar`
  in module `A` will be synthesized in `A.foo` and `A.bar`.\n  * Clash will no longer
  generate vhdl, verilog, or systemverilog subdirectories when using `-fclash-hdldir`.\n
  \ * `Data.Kind.Type` is now exported from `Clash.Prelude` [#1700](https://github.com/clash-lang/clash-compiler/issues/1700)\n\n\nAdded:\n
  \ * Support for GHC 9.0.1\n  * `Clash.Signal.sameDomain`: Allows user obtain evidence
  whether two domains are equal.\n  * `xToErrorCtx`: makes it easier to track the
  origin of `XException` where `pack` would hide them [#1461](https://github.com/clash-lang/clash-compiler/pull/1461)\n
  \ * Additional field with synthesis attributes added to `InstDecl` in `Clash.Netlist.Types`
  [#1482](https://github.com/clash-lang/clash-compiler/pull/1482)\n  * `Data.Ix.Ix`
  instances for `Signed`, `Unsigned`, and `Index` [#1481](https://github.com/clash-lang/clash-compiler/pull/1481)
  [#1631](https://github.com/clash-lang/clash-compiler/pull/1631)\n  * Added `nameHint`
  to allow explicitly naming terms, e.g. `Signal`s.\n  * Checked versions of `resize`,
  `truncateB`, and `fromIntegral`. Depending on the type `resize`, `truncateB`, and
  `fromIntegral` either yield an `XException` or silently perform wrap-around if its
  argument does not fit in the resulting type's bounds. The added functions check
  the bound condition and fail with an error call if the condition is violated. They
  do not affect HDL generation. [#1491](https://github.com/clash-lang/clash-compiler/pull/1491)\n
  \ * `HasBiSignalDefault`: constraint to Clash.Signal.BiSignal, `pullUpMode` gives
  access to the pull-up mode. [#1498](https://github.com/clash-lang/clash-compiler/pull/1498)\n
  \ * Match patterns to bitPattern [#1545](https://github.com/clash-lang/clash-compiler/pull/1545)\n
  \ * Non TH `fromList` and `unsafeFromList` for Vec. These functions allow Vectors
  to be created from a list without needing to use template haskell, which is not
  always desirable. The unsafe version of the function does not compare the length
  of the list to the desired length of the vector, either truncating or padding with
  undefined if the lengths differ.\n  * `Clash.Explicit.Reset.resetGlitchFilter`:
  filters glitchy reset signals. Useful when your reset signal is connected to sensitive
  actuators.\n  * Clash can now generate EDAM for using Edalize. This generates edam.py
  files in all top entities with the configuration for building that entity. Users
  still need to edit this file to specify the EDA tool to use, and if necessary the
  device to target (for Quartus, Vivado etc.). [#1386](https://github.com/clash-lang/clash-compiler/issues/1386)\n
  \ * `-fclash-aggressive-x-optimization-blackboxes`: when enabled primitives can
  detect undefined values and change their behavior accordingly. For example, if `register`
  is used in combination with an undefined reset value, it will leave out the reset
  logic entirely. Related issue: [#1506](https://github.com/clash-lang/clash-compiler/issues/1506).\n
  \ * Automaton-based interface to simulation, to allow interleaving of cyle-by-cycle
  simulation and external effects [#1261](https://github.com/clash-lang/clash-compiler/pull/1261)\n\n\nNew
  internal features:\n  * `constructProduct` and `deconstructProduct` in `Clash.Primitives.DSL`.
  Like `tuple` and `untuple`, but on arbitrary product types.\n  * Support for multi
  result primitives. Primitives can now assign their results to multiple variables.
  This can help to work around synthesis tools limits in some cases. See [#1560](https://github.com/clash-lang/clash-compiler/pull/1560).\n
  \ * Added a rule for missing `Int` comparisons in `GHC.Classes` in the compile time
  evaluator. [#1648](https://github.com/clash-lang/clash-compiler/issues/1648)\n  *
  Clash now creates a mapping from domain names to configurations in `LoadModules`.
  [#1405](https://github.com/clash-lang/clash-compiler/pull/1405)\n  * The convenience
  functions in `Clash.Primitives.DSL` now take a list of HDLs, instead of just one.\n
  \ * `Clash.Netlist.Id` overhauls the way identifiers are generated in the Netlist
  part of Clash.\n  * Added `defaultWithAction` to Clash-as-a-library API to work
  around/fix issues such as [#1686](https://github.com/clash-lang/clash-compiler/issues/1686)\n
  \ * Manifest files now list files and components in an reverse topological order.
  This means it can be used when calling EDA tooling without causing compilation issues.\n\nDeprecated:\n
  \ * `Clash.Prelude.DataFlow`: see [#1490](https://github.com/clash-lang/clash-compiler/pull/1490).
  In time, its functionality will be replaced by [clash-protocols](https://github.com/clash-lang/clash-protocols).\n\nRemoved:\n
  \ * The deprecated function `freqCalc` has been removed.\n\n## 1.2.5 *November 9th
  2020*\nFixed:\n  * The normalizeType function now fully normalizes types which require
  calls to\nreduceTypeFamily [#1469](https://github.com/clash-lang/clash-compiler/issues/1469)\n
  \ * `flogBaseSNat`, `clogBaseSNat` and `logBaseSNat` primitives are now implemented
  correctly.Previously these primitives would be left unevaluated causing issues as
  demonstrated in [#1479](https://github.com/clash-lang/clash-compiler/issues/1469)\n
  \ * Specializing on functions with type family arguments no longer fails [#1477](https://github.com/clash-lang/clash-compiler/issues/1477)\n
  \ * `satSucc`, `satPred` correctly handle \"small types\" such as `Index 1`.\n  *
  `msb` no longer fails on values larger than 64 bits\n  * `undefined` can now be
  used as a reset value of `autoReg@Maybe` [#1507](https://github.com/clash-lang/clash-compiler/issues/1507)\n
  \ * Signal's `fmap` is now less strict, preventing infinite loops in very specific
  situations. See [#1521](https://github.com/clash-lang/clash-compiler/issues/1521)\n
  \ * Clash now uses correct function names in manifest and sdc files [#1533](https://github.com/clash-lang/clash-compiler/issues/1533)\n
  \ * Clash no longer produces erroneous HDL in very specific cases [#1536](https://github.com/clash-lang/clash-compiler/issues/1536)\n
  \ * Usage of `fold` inside other HO primitives (e.g., `map`) no longer fails [#1524](https://github.com/clash-lang/clash-compiler/issues/1524)\n\nChanged:\n
  \ * Due to difficulties using `resetSynchronizer` we've decided to make this function
  always insert a synchronizer. See: [#1528](https://github.com/clash-lang/clash-compiler/issues/1528).\n\n##
  1.2.4 *July 28th 2020*\n* Changed:\n  * Relaxed upper bound versions of `aeson`
  and `dlist`, in preparation for the new Stack LTS.\n  * Reverted changes to primitive
  definitions for 'zipWith', 'map', 'foldr', and 'init' introduced in 1.2.2. They
  have shown to cause problems in very specific circumstances.\n\n## 1.2.3 *July 11th
  2020*\n* Changed:\n  * Upgrade to nixos 20.03. Nix and snap users will now use packages
  present in 20.03.\n\n* Added:\n  * `instance Monoid a => Monoid (Vec n a)`\n  *
  `instance Text.Printf(Index)`\n  * `instance Text.Printf(Signed)`\n  * `instance
  Text.Printf(Unsigned)`\n\n* Fixed:\n  * Clash renders incorrect VHDL when GHCs Worker/Wrapper
  transformation is enabled [#1402](https://github.com/clash-lang/clash-compiler/issues/1402)\n
  \ * Minor faults in generated HDL when using annotations from `Clash.Annotations.SynthesisAttributes`\n
  \ * Cabal installed through Snap (`clash.cabal`) can now access the internet to
  fetch pacakges. [#1411]https://github.com/clash-lang/clash-compiler/issues/1411\n
  \ * Generated QSys file for `altpll` incompatible with Quartus CLI (did work in
  Quartus GUI)\n  * Clash no longer uses component names that clash with identifiers
  imported\n    from:\n    * IEEE.STD_LOGIC_1164.all\n    * IEEE.NUMERIC_STD.all\n
  \   * IEEE.MATH_REAL.all\n    * std.textio.all\n    when generating VHDL.\n    See
  https://github.com/clash-lang/clash-compiler/issues/1439.\n\n## 1.2.2 *June 12th
  2020*\n* Changed:\n  * The hardwired functions to unroll primitive definitions for
  'zipWith', 'map', 'foldr', and 'init' have been changed to only unroll a single
  step, whereas they would previously unroll the whole definition in one step. This
  allows Clash to take advantage of the lazy nature of these functions, in turn speeding
  up compilation speeds significantly in some cases. Part of [PR 1354](https://github.com/clash-lang/clash-compiler/pull/1354).\n\n*
  Added:\n  * Support for GHC 8.10\n  * Ability to load designs from precompiled modules
  (i.e., stored in a package database). See [#1172](https://github.com/clash-lang/clash-compiler/pull/1172)\n
  \ * Support for '-main-is' when used with `--vhdl`, `--verilog`, or `--systemverilog`\n
  \ * A partial instance for `NFDataX (Signal domain a)`\n\n* Fixed:\n  * Clash's
  evaluator now inlines work free definitions, preventing [situations where it would
  otherwise get stuck in an infinite loop](https://github.com/clash-lang/clash-compiler/pull/1354#issuecomment-635430374)\n
  \ * `caseCon` doesn't apply type-substitution correctly [#1340](https://github.com/clash-lang/clash-compiler/issues/1340)\n
  \ * Clash generates illegal SystemVerilog slice [#1313](https://github.com/clash-lang/clash-compiler/issues/1313)\n
  \ * Fix result type of head and tail Verilog blackboxes [#1351](https://github.com/clash-lang/clash-compiler/issues/1351)\n
  \ * Certain recursive let-expressions in side a alternatives of a case-expression
  throw the Clash compiler into an infinite loop [#1316](https://github.com/clash-lang/clash-compiler/issues/1316)\n
  \ * Fixes issue with one of Clash's transformations, `inlineCleanup`, introducing
  free variables [#1337](https://github.com/clash-lang/clash-compiler/issues/1337)\n
  \ * Fails to propagate type information of existential type [#1310](https://github.com/clash-lang/clash-compiler/issues/1310)\n
  \ * Certain case-expressions throw the Clash compiler into an infinite loop [#1320](https://github.com/clash-lang/clash-compiler/issues/1320)\n
  \ * Added blackbox implementation for 'Clash.Sized.Vector.iterateI', hence making
  it usable as a register reset value [#1240](https://github.com/clash-lang/clash-compiler/issues/1240)\n
  \ * `iterate` and `iterateI` can now be used in reset values [#1240](https://github.com/clash-lang/clash-compiler/issues/1240)\n
  \ * Prim evaluation fails on undefined arguments [#1297](https://github.com/clash-lang/clash-compiler/issues/1297)\n
  \ * Missing re-indexing in (Un)Signed fromSLV conversion [#1292](https://github.com/clash-lang/clash-compiler/issues/1292)\n
  \ * VHDL: generate a type qualification inside ~TOBV, fixes [#1360](https://github.com/clash-lang/clash-compiler/issues/1360)\n\n##
  1.2.1 *April 23rd 2020*\n* Changed:\n  * Treat `Signed 0`, `Unsigned 0`, `Index
  1`, `BitVector 0` as unit. In effect this means that 'minBound' and 'maxBound' return
  0, whereas previously they might crash [#1183](https://github.com/clash-lang/clash-compiler/issues/1183)\n
  \ * Infix use of `deepseqX` is now right-associative\n\n* Added:\n  * Add 'natToInteger',
  'natToNatural', and 'natToNum'. Similar to 'snatTo*', but works solely on a type
  argument instead of an SNat.\n  * `Clash.Sized.Vector.unfoldr` and `Clash.Sized.Vector.unfoldrI`
  to construct vectors from a seed value\n  * Added NFDataX instances for `Data.Monoid.{First,Last}`\n\n*
  Fixed:\n  * The Verilog backend can now deal with non-contiguous ranges in custom
  bit-representations.\n  * Synthesizing BitPack instances for type with phantom parameter
  fails [#1242](https://github.com/clash-lang/clash-compiler/issues/1242)\n  * Synthesis
  of `fromBNat (toBNat d5)` failed due to `unsafeCoerce` coercing from `Any`\n  *
  Memory leak in register primitives [#1256](https://github.com/clash-lang/clash-compiler/issues/1256)\n
  \ * Illegal VHDL slice when projecting nested SOP type [#1254](https://github.com/clash-lang/clash-compiler/issues/1254)\n
  \ * Vivado VHDL code path (`-fclash-hdlsyn Vivado`) generates illegal VHDL [#1264](https://github.com/clash-lang/clash-compiler/issues/1264)\n\n##
  1.2.0 *March 5th 2020*\nAs promised when releasing 1.0, we've tried our best to
  keep the API stable. We\nthink most designs will continue to compile with this new
  version, although special\ncare needs to be taken when using:\n\n  * Use inline
  blackboxes. Instead of taking a single HDL, inline primitives now\n    take multiple.
  For example, `InlinePrimitive VHDL \"..\"` must now be written\n    as `InlinePrimitive
  [VHDL] \"..\"`.\n\n  * Use the `Enum` instance for `BitVector`, `Index`, `Signed`,
  or `Unsigned`, as\n    they now respect their `maxBound`. See [#1089](https://github.com/clash-lang/clash-compiler/issues/1089).\n\nOn
  top of that, we've added a number of new features:\n\n  * `makeTopEntity`: Template
  Haskell function for generating TopEntity annotations. See [the documentation on
  Haddock](http://hackage.haskell.org/package/clash-prelude-1.2.0/docs/Clash-Annotations-TopEntity.html)
  for more information.\n\n  * `Clash.Explicit.SimIO`: ((System)Verilog only) I/O
  actions that can be translated to HDL I/O. See [the documentation on Haddock](http://hackage.haskell.org/package/clash-prelude-1.2.0/docs/Clash-Explicit-SimIO.html)
  for more information.\n\n  * `Clash.Class.AutoReg`: A smart register that improves
  the chances of synthesis tools inferring clock-gated registers, when used. See [the
  documentation on Haddock](http://hackage.haskell.org/package/clash-prelude-1.2.0/docs/Clash-Class-AutoReg.html)
  for more information.\n\nThe full list of changes follows. Happy hacking!\n\n* New
  features (API):\n  * `Clash.Class.Parity` type class replaces Prelude `odd` and
  `even` functions due to assumptions that don't hold for Clash specific numerical
  types, see [#970](https://github.com/clash-lang/clash-compiler/pull/970).\n  * `NFDataX.ensureSpine`,
  see [#748](https://github.com/clash-lang/clash-compiler/pull/803)\n  * `makeTopEntity`
  Template Haskell function for generating TopEntity annotations\n    intended to
  cover the majority of use cases. Generation failures should either\n    result in
  an explicit error, or a valid annotation of an empty `PortProduct`.\n    Any discrepancy
  between the _shape_ of generated annotations and the _shape_\n    of the Clash compiler
  is a bug. See [#795](https://github.com/clash-lang/clash-compiler/pull/795).\n    Known
  limitations:\n    * Type application (excluding `Signal`s and `:::`) is best effort:\n
  \   * Data types with type parameters will work if the generator can discover a
  single relevant constructor after attempting type application.\n    * Arbitrary
  explicit clock/reset/enables are supported, but only a single `HiddenClockResetEnable`
  constraint is supported.\n    * Data/type family support is best effort.\n  * Added
  `Bundle ((f :*: g) a)` instance\n  * Added `NFDataX CUShort` instance\n  * Clash's
  internal type family solver now recognizes `AppendSymbol` and `CmpSymbol`\n  * Added
  `Clash.Magic.suffixNameFromNat`: can be used in cases where `suffixName` is too
  slow\n  * Added `Clash.Class.AutoReg`. Improves the chances of synthesis tools inferring
  clock-gated registers, when used. See [#873](https://github.com/clash-lang/clash-compiler/pull/873).\n
  \ * `Clash.Magic.suffixNameP`, `Clash.Magic.suffixNameFromNatP`: enable prefixing
  of name suffixes\n  * Added `Clash.Magic.noDeDup`: can be used to instruct Clash
  to /not/ share a function between multiple branches\n  * A `BitPack a` constraint
  now implies a `KnownNat (BitSize a)` constraint, so you won't have to add it manually
  anymore. See [#942](https://github.com/clash-lang/clash-compiler/pull/942).\n  *
  `Clash.Explicit.SimIO`: ((System)Verilog only) I/O actions that can be translated
  to HDL I/O; useful for generated test benches.\n  * Export `Clash.Explicit.Testbench.assertBitVector`
  [#888](https://github.com/clash-lang/clash-compiler/pull/888/files)\n  * Add `Clash.Prelude.Testbench.assertBitVector`
  to achieve feature parity with `Clash.Explicit.Testbench`. [#891](https://github.com/clash-lang/clash-compiler/pull/891/files)\n
  \ * Add `Clash.XException.NFDataX.ensureSpine` [#803](https://github.com/clash-lang/clash-compiler/pull/803)\n
  \ * Add `Clash.Class.BitPack.bitCoerceMap` [#798](https://github.com/clash-lang/clash-compiler/pull/798)\n
  \ * Add `Clash.Magic.deDup`: instruct Clash to force sharing an operator between
  multiple branches of a case-expression\n  * `InlinePrimitive` can now support multiple
  backends simultaneously [#425](https://github.com/clash-lang/clash-compiler/issues/425)\n
  \ * Add `Clash.XException.hwSeqX`: render declarations of an argument, but don't
  assign it to a result signal\n  * Add `Clash.Signal.Bundle.TaggedEmptyTuple`: allows
  users to emulate the pre-1.0 behavior of \"Bundle ()\". See [#1100](https://github.com/clash-lang/clash-compiler/pull/1100)\n\n*
  New features (Compiler):\n  * [#961](https://github.com/clash-lang/clash-compiler/pull/961):
  Show `-fclash-*` Options in `clash --show-options`\n\n* New internal features:\n
  \ * [#918](https://github.com/clash-lang/clash-compiler/pull/935): Add X-Optimization
  to normalization passes (-fclash-aggressive-x-optimization)\n  * [#821](https://github.com/clash-lang/clash-compiler/pull/821):
  Add `DebugTry`: print name of all tried transformations, even if they didn't succeed\n
  \ * [#856](https://github.com/clash-lang/clash-compiler/pull/856): Add `-fclash-debug-transformations`:
  only print debug info for specific transformations\n  * [#911](https://github.com/clash-lang/clash-compiler/pull/911):
  Add 'RenderVoid' option to blackboxes\n  * [#958](https://github.com/clash-lang/clash-compiler/pull/958):
  Prefix names of inlined functions\n  * [#947](https://github.com/clash-lang/clash-compiler/pull/947):
  Add \"Clash.Core.TermLiteral\"\n  * [#887](https://github.com/clash-lang/clash-compiler/pull/887):
  Show nicer error messages when failing in TH code\n  * [#884](https://github.com/clash-lang/clash-compiler/pull/884):
  Teach reduceTypeFamily about AppendSymbol and CmpSymbol\n  * [#784](https://github.com/clash-lang/clash-compiler/pull/784):
  Print whether `Id` is global or local in ppr output\n  * [#781](https://github.com/clash-lang/clash-compiler/pull/781):
  Use naming contexts in register names\n  * [#1061](https://github.com/clash-lang/clash-compiler/pull/1061):
  Add 'usedArguments' to BlackBoxHaskell blackboxes\n\n* Fixes issues:\n  * [#974](https://github.com/clash-lang/clash-compiler/issues/974):
  Fix indirect shadowing in `reduceNonRepPrim`\n  * [#964](https://github.com/clash-lang/clash-compiler/issues/964):
  SaturatingNum instance of `Index` now behaves correctly when the size of the index
  overflows\n  an `Int`.\n  * [#810](https://github.com/clash-lang/clash-compiler/issues/810):
  Verilog backend now correctly specifies type of `BitVector 1`\n  * [#811](https://github.com/clash-lang/clash-compiler/issues/811):
  Improve module load behavior in clashi\n  * [#439](https://github.com/clash-lang/clash-compiler/issues/439):
  Template Haskell splices and TopEntity annotations can now be used in clashi\n  *
  [#662](https://github.com/clash-lang/clash-compiler/issues/662): Clash will now
  constant specialize partially constant constructs\n  * [#700](https://github.com/clash-lang/clash-compiler/issues/700):
  Check work content of expression in cast before warning users. Should eliminate
  a lot of (superfluous) warnings about \"specializing on non work-free cast\"s.\n
  \ * [#837](https://github.com/clash-lang/clash-compiler/issues/837): Blackboxes
  will now report clearer error messages if they're given unexpected arguments.\n
  \ * [#869](https://github.com/clash-lang/clash-compiler/issues/869): PLL is no longer
  duplicated in Blinker.hs example\n  * [#749](https://github.com/clash-lang/clash-compiler/issues/749):
  Clash's dependencies now all work with GHC 8.8, allowing `clash-{prelude,lib,ghc}`
  to be compiled from Hackage soon.\n  * [#871](https://github.com/clash-lang/clash-compiler/issues/871):
  RTree Bundle instance is now properly lazy\n  * [#895](https://github.com/clash-lang/clash-compiler/issues/895):
  VHDL type error when generating `Maybe (Vec 2 (Signed 8), Index 1)`\n  * [#880](https://github.com/clash-lang/clash-compiler/issues/880):
  Custom bit representations can now be used on product types too\n  * [#976](https://github.com/clash-lang/clash-compiler/issues/976):
  Prevent shadowing in Clash's core evaluator\n  * [#1007](https://github.com/clash-lang/clash-compiler/issues/1007):
