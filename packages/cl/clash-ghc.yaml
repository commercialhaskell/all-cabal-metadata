  Prevent substitution warning when using type equalities in top entities\n  * [#1033](https://github.com/clash-lang/clash-compiler/issues/1033):
  Fix issue where Clash breaks when using Clock/Reset/Enable in product types in combination
  with Synthesize annotations\n  * [#1075](https://github.com/clash-lang/clash-compiler/issues/1075):
  Removed superfluous constraints on 'maybeX' and 'maybeIsX'\n  * [#1085](https://github.com/clash-lang/clash-compiler/issues/1085):
  Suggest exporting topentities if they can't be found in a module\n  * [#1065](https://github.com/clash-lang/clash-compiler/pull/1065):
  Report polymorphic topEntities as errors\n  * [#1089](https://github.com/clash-lang/clash-compiler/issues/1089):
  Respect maxBound in Enum instances for BitVector,Index,Signed,Unsigned\n\n* Fixes
  without issue reports:\n  * Fix bug in `rnfX` defined for `Down` ([baef30e](https://github.com/clash-lang/clash-compiler/commit/baef30eae03dc02ba847ffbb8fae7f365c5287c2))\n
  \ * Render numbers inside gensym ([bc76f0f](https://github.com/clash-lang/clash-compiler/commit/bc76f0f1934fd6e6ed9c33bcf950dae21e2f7903))\n
  \ * Report blackbox name when encountering an error in 'setSym' ([#858](https://github.com/clash-lang/clash-compiler/pull/858))\n
  \ * Fix blackbox issues causing Clash to generate invalid HDL ([#865](https://github.com/clash-lang/clash-compiler/pull/865))\n
  \ * Treat types with a zero-width custom bit representation like other zero-width
  constructs ([#874](https://github.com/clash-lang/clash-compiler/pull/874))\n  *
  TH code for auto deriving bit representations now produces nicer error messages
  ([7190793](https://github.com/clash-lang/clash-compiler/commit/7190793928545f85157f9b8d4b8ec2edb2cd8a26))\n
  \ * Adds '--enable-shared-executables' for nix builds; this should make Clash run
  _much_ faster ([#894](https://github.com/clash-lang/clash-compiler/pull/894))\n
  \ * Custom bit representations can now mark fields as zero-width without crashing
  the compiler ([#898](https://github.com/clash-lang/clash-compiler/pull/898))\n  *
  Throw an error if there's data left to parse after successfully parsing a valid
  JSON construct ([#904](https://github.com/clash-lang/clash-compiler/pull/904))\n
  \ * `Data.gfoldl` is now manually implemented, in turn fixing issues with `gshow`
  ([#933](https://github.com/clash-lang/clash-compiler/pull/933))\n  * Fix a number
  of issues with blackbox implementations ([#934](https://github.com/clash-lang/clash-compiler/pull/934))\n
  \ * Don't inline registers with non-constant clock and reset ([#998](https://github.com/clash-lang/clash-compiler/pull/998))\n
  \ * Inline let-binders called [dsN | N <- [1..]] ([#992](https://github.com/clash-lang/clash-compiler/pull/992))\n
  \ * ClockGens use their name at the Haskell level [#827](https://github.com/clash-lang/clash-compiler/pull/827)\n
  \ * Render numbers inside gensym [#809](https://github.com/clash-lang/clash-compiler/pull/809)\n
  \ * Don't overwrite existing binders when specializing [#790](https://github.com/clash-lang/clash-compiler/pull/790)\n
  \ * Deshadow in 'caseCase' [#1067](https://github.com/clash-lang/clash-compiler/pull/1067)\n
  \ * Deshadow in 'caseLet' and 'nonRepANF' [#1071](https://github.com/clash-lang/clash-compiler/pull/1071)\n\n*
  Deprecations & removals:\n  * Removed support for GHC 8.2 ([#842](https://github.com/clash-lang/clash-compiler/pull/842))\n
  \ * Removed support for older cabal versions, only Cabal >=2.2 supported ([#851](https://github.com/clash-lang/clash-compiler/pull/851))\n
  \ * Reset and Enable constructors are now only exported from Clash.Signal.Internal\n
  \ * [#986](https://github.com/clash-lang/clash-compiler/issues/986) Remove -fclash-allow-zero-width
  flag\n\n## 1.0.0 *September 3rd 2019*\n* 10x - 50x faster compile times\n* New features:\n
  \ * API changes: check the migration guide at the end of `Clash.Tutorial`\n  * All
  memory elements now have an (implicit) enable line; \"Gated\" clocks have been removed
  as the clock wasn't actually gated, but implemented as an enable line.\n  * Circuit
  domains are now configurable in:\n    * (old) The clock period\n    * (new) Clock
  edge on which memory elements latch their inputs (rising edge or falling edge)\n
  \   * (new) Whether the reset port of a memory element is level sensitive asynchronous
  reset) or edge sensitive (synchronous reset)\n    * (new) Whether the reset port
  of a memory element is active-high or active-low (negated reset)\n    * (new) Whether
  memory element power on in a configurable/defined state (common on FPGAs) or in
  an undefined state (ASICs)\n\n    * See the [blog post](https://clash-lang.org/blog/0005-synthesis-domain/)
  on this new feature\n  * Data types can now be given custom bit-representations:
  http://hackage.haskell.org/package/clash-prelude/docs/Clash-Annotations-BitRepresentation.html\n
  \ * Annotate expressions with attributes that persist in the generated HDL,\n    e.g.
  synthesis directives: http://hackage.haskell.org/package/clash-prelude/docs/Clash-Annotations-SynthesisAttributes.html\n
  \ * Control (System)Verilog module instance, and VHDL entity instantiation names\n
  \   in generated code: http://hackage.haskell.org/package/clash-prelude/docs/Clash-Magic.html\n
  \ * Much improved infrastructure for handling of unknown values: defined spine,\n
  \   but unknown leafs: http://hackage.haskell.org/package/clash-prelude/docs/Clash-XException.html#t:NFDataX\n
  \ * Experimental: Multiple hidden clocks. Can be enabled by compiling\n    `clash-prelude`
  with `-fmultiple-hidden`\n  * Experimental: Limited GADT support (pattern matching
  on vectors, or custom\n    GADTs as longs as their usage can be statically removed;
  no support of\n    recursive GADTs)\n  * Experimental: Use regular Haskell functions
  to generate HDL black boxes for\n    primitives (in an addition to existing string
  templates for HDL black boxes)\n    See for example: http://hackage.haskell.org/package/clash-lib/docs/Clash-Primitives-Intel-ClockGen.html\n\n*
  Fixes issues:\n  * [#316](https://github.com/clash-lang/clash-compiler/issues/316)\n
