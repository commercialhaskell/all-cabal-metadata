changelog: |
  # Changelog

  ## 0.1.0.1 — 2026-11-24

  - Ship the shared patch version alongside the runtime and Cloud Storage packages.

  ## 0.1.0.0 — 2026-11-24

  - Provide `Unkai.Prelude` and `Unkai.Types` for generated service libraries, with shared request, response, and OAuth scope types.
  - Use `PatchField` from `Unkai.Data.JSON` to distinguish omitted fields, assigned values, and explicit JSON nulls.
  - Use Streamly to consume `Stream` values in `ResourceT IO`. Use `sinkLBS` to collect response chunks into a lazy `ByteString`.
  - Require GHC 9.12 or newer and use the GHC2024 language edition.
changelog-type: markdown
description: |
  # unkai-core

  Core data types and serialisation primitives shared by the generated
  `unkai-*` Google Cloud service libraries. Most users depend on
  [`unkai`](../unkai) and a service package such as `unkai-storage` rather than
  on this package directly.

  Released under the [Mozilla Public License 2.0](LICENSE).
