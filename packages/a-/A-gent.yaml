changelog: "# Revision history for Λ-gent\n\n## 0.11.0.20 -- 2026-10-21\n\n* Added
  [Cabal-plan][cabal-plan] info and topology for the project to help deal\n  with
  the `nix/NixOS` as well as `Hackage` issues when it comes to package\n  dependencies.\n\n*
  Added Mockup servers for traditional (outdated/legacy?) LLM's as well as SOM\n  with
  static JSON payloads for faster development pace:\n  \n  * `muppt.{sh|json}`: [OpenAI][openai-api]
  style chat completion API\n\n  * `musom.{sh|json}`: [Jev][jev-api] system one style
  API\n\n* Hone/Auto-mode were initially implemented with support for traditional\n
  \ (outdated/legacy?) LLM's. However due to the release of usable open source\n  decision
  models, we have refactored and now ONLY support [System One (API)\n  models (SOM)][systemone]:\n
  \ \n  ```\n  #!/bin/sh\n  \n  ################################################################################\n
  \ ##\n  ## Λ-gent, (c) 2026 SPISE MISU ApS, https://spdx.org/licenses/SSPL-1.0\n
  \ ##\n  ################################################################################\n
  \ \n  clear\n    \n  cwd=\"${HOME}/temp/a-gent/no-prelude-loc/\"\n  som=\"http://127.0.0.1:3000/v1\"
  # clef-omni-8bit, clef-flash-8bit and clef-Nbit\n  \n  LLM_PATH_CWD=\"${cwd}\" \\\n
  \ LLM_HSOM_LOCALHOST_SOM=\"${som}\" \\\n  LC_ALL=en_US.UTF-8 ./hone.lhs\n  ```\n\n*
  Hone-mode as well as Auto-mode, to provide `Λ-gent` with Automated Typed-Hole\n
  \ development capabilities, has been added as well. For more info, see the\n  following
  commands:\n  \n  ```\n  /disc   | Discover files with typed-holes and store them
  in /pile\n  /hole i | Show file (idx) typed-holes, if any. See /pile above\n  /fill
  \  | Send /pile to LLM, to fill typed-holes with best suggestions\n  ```\n  \n  and\n
  \ \n  ```\n  /exec   | Execute the automated mode. Limited by /mode auto\n  /halt
  \  | Bring automation to a halt. Limited by /mode auto\n  ```\n  \n  > **NOTE:**
  These modes depend on scaffolding that MUST be provided by the\n  > Plan-mode (generate
  minimum code files with typed-holes aka \"green\") as well\n  > as the Spec-mode
  (generating property-base test cases aka \"red\") as in the\n  > [Test-Driven Development
  (TDD)][tdd] mantra: \"red/green/refactor\".\n  > \n  > However, these modes are
  not released yet as by doing so, they would be\n  > limited ONLY to Haskell and
  hereby lock-in `Λ-gents` to a single programming\n  > language, which might not
  be ideal.\n\n* For the Spec-mode, still not released, we needed to be able to test
  as we\n  normally do (`QuickCheck`), but without any I/O effects. Therefore, a\n
  \ standalone library, [quickcheck-silent][quickcheck-silent], was created and\n
  \ published to `Hackage`. It will be used when invoking the following command:\n
  \ \n  ```\n  /test u | Test TAIL or /atom GIT branches (uid) against specification\n
  \ ```\n\n* Updated local worktree naming convention\n\n* Parsed files are now trimmed
  (`trimLines` in `src/Agent/LLM.hs`)\n\n* Expanded GIT support with the following
  commands:\n\n  ```\n  /repo   | List /atom created GIT branches, including description\n
  \ /tail   | Show (opt create) TAIL, based on origin/HEAD, as local storage\n  /diff
  u | Show GIT branch (uid) differences with TAIL or origin/HEAD\n  /disp   | Dispose
  /atom failed branches or are behind/older than TAIL\n  /meld   | Auto-merge branches
  with TAIL, if possible. See /disp above\n  /push   | Create a remote branch, on
  origin, for TAIL\n  /pull   | Retrieve latest snapshot of origin/HEAD. See /push
  above\n  /shed   | Remove TAIL, if merged with origin/HEAD. See /pull above\n  ```\n\n*
  Some scripts didn't work as expected after doing the suggestions from\n  [ShellCheck][shellcheck].\n\n*
  The project now aims to ONLY support the `GHC` versions that are recommended\n  for
  use, see References in `shell.nix`.\n\n[shellcheck]:        https://github.com/koalaman/shellcheck\n[quickcheck-silent]:
  https://hackage.haskell.org/package/quickcheck-silent\n[tdd]:               https://en.wikipedia.org/wiki/Test-driven_development\n[systemone]:
  \        https://systemonemodels.org/\n[openai-api]:        https://developers.openai.com/api/reference/chat-completions/overview\n[jev-api]:
  \          https://docs.typesafe.ai/concepts/system-one\n[cabal-plan]:        https://hackage.haskell.org/package/cabal-plan\n\n##
  0.11.0.19 -- 2026-07-11\n\n* Feature branch descriptions prefix tags for `Λ-gent`
  mode on success as done\n  for failures with `[FAIL]`.\n\n* Updated `GHC` from `9.12.2`
  to `9.12.4`.\n\n* Added a commercial source-available & non-copyleft license `SPISE
  MISU\n  License, v2 (SML-2.0)`. For more info, have a look at:\n  \n  * https://a-gent.org/about.html#licenses\n\n*
  Added a dummy OpenAI API mockup, to ease and increase development pace.\n\n* Added
  support for multitasking/batching of LLM prompt requests.\n\n## 0.11.0.18 -- 2026-05-18\n\n*
  Added the `/drop` command to remove end-user provided `load` will help clear\n  the
  context sent to the LLM when using basic chat capabilities.\n  \n* Refactored the
  main `chat` web script due to the addition of the `/drop`\n  command. Also added
  the result of executing the script:\n  \n  ```sh\n  # Exit Λ-gent with /e or /exit.
  For more commands, type /? or /help.\n  Λ-chat> ping\n  Message {role = \"assistant\",
  content = \"*PING*\"}\n  Λ-chat> /drop\n  Dropping end-user data load\n  Λ-chat>
  If I write ping, you write pong. If I write pong, you write ping\n  Message {role
  = \"assistant\", content = \"That sounds like a fun game. I'm ready.\"}\n  Λ-chat>
  pong\n  Message {role = \"assistant\", content = \"ping\"}\n  Λ-chat> pong\n  Message
  {role = \"assistant\", content = \"ping\"}\n  Λ-chat> ping\n  Message {role = \"assistant\",
  content = \"pong\"}\n  Λ-chat> pong\n  Message {role = \"assistant\", content =
  \"ping\"}\n  Λ-chat> /drop\n  Dropping end-user data load\n  Λ-chat> ping\n  Message
  {role = \"assistant\", content = \"*PING*\"}\n  Λ-chat> \n  ```\n\n## 0.11.0.17
  -- 2026-05-18\n\n* Inconsistency between `Linux` and `macOS` when it comes to default
  option for\n  `pwd`:\n  \n  * If no option is specified, `-P` is assumed (Linux)\n
  \ \n  * If no options are specified, the `-L` option is assumed (macOS)\n  \n  ```\n
  \ -L, --logical use PWD from environment, even if it contains symlinks\n  -P, --physical
  resolve all symlinks\n  ```\n\n* Removing exported helper functions from `Internal.RIO`
  that weren't used by\n  any other module.\n\n## 0.11.0.16 -- 2026-05-14\n\n* The
  Action and Message modules need to expose used types from the internal LLM\n  module
  as well.\n\n## 0.11.0.15 -- 2026-05-14\n\n* Internal LLM types MUST be exposed by
  LLM module.\n\n## 0.11.0.14 -- 2026-05-14\n\n* Ensured not to expose internal types.
  We import and re-export for type\n  signatures, but not the constructors.\n\n##
  0.11.0.13 -- 2026-05-14\n\n* Updated scripts from website with changes from `0.11.0.12`.\n\n
  \ > **NOTE:** Due to changes in this release, we need to check and update once\n
  \ > again.\n\n* Checked scripts on `macOS` with changes from `0.11.0.12`.\n\n  >
  **NOTE:** As before, with changes from this release, we need to check once\n  >
  again.\n\n* Moved `Message` and `Action` to their own modules. For `Action`, we
  also add\n  an internal module to avoid exposing type constructors.\n\n* Ensured
  not to expose internal types. We import and re-export for type\n  signatures, but
  not the constructors.\n\n## 0.11.0.12 -- 2026-05-12\n\nThere have been made some
  **major changes** to this library and therefore there\nis no backwards compatibility
  with previous versions:\n\n* Added support for `Code` mode, as in `read` and `write`
  files back and forth\n  to the `git` repository. A new tab will be added to the
  website with a script\n  explaining usage.\n\n* Added support for script integrity
  as known from `HTML`:\n\n  ```\n  <script integrity=\"sha256-YBbjT3uJjnS6ofC6HIal+4vNvgA9vZBfC/KMVN51URc=\"
  …></script>\n  ```\n  \n  If the `LLM_SIGN_SHA` environment variable is provided
  on execution, the\n  script will check it's own file `SHA-256` hash and compare
  to the provided:\n  \n  ```\n  # Λ-gent integrity failed:\n  > 2d3c326e2991da5876b820fe128c3840d3c0664c43907ce725f3f3f26f2fbabc
  (expected)\n  > 8f89a79f891ce329a6142c68962fcad0b438e7d0b80c9410f0141cc6c02437d0
  (observed)\n  ```\n\n* Adding `uuid` to main context future purposes.\n\n* Due to
  refactoring, the context lost a few properties (ex: `exit`, `hist`,\n  `root`, …)
  and some of the internals have changed. Still same output, but,\n  less chaotic.
  Furthermore, `rootPath` is no longer needed.\n\n* Due to refactoring, some of the
  exposed utils are no longer\n  relevant. Therefore, they are moved to an internal
  module.\n\n* Removed quotes from `curl` headers as some `LLM` API's would parse
  them, but\n  others would not.\n\n* Followed up on binary flags as we need to have
  the **least common** between\n  `Linux` distros and `macOS`.\n\n* Added the `/atom`
  and `/repo` commands to help parse and store files received\n  from LLM's `atomically`
  with help of `git worktree` as well as list the\n  produced `git branches`.\n\n*
  Added `message` and `action` types simplify and make more robust the\n  interactions
  between user and `Λ-gent`.\n\n* Wrapped `withExitCode…` functions in `try` (`Control.Exception`)
  to ensure the\n  `Λ-gents` don't crash and burn. Also wrapped `read` and `write`
  files as well\n  with `try`.\n\n## 0.11.0.11 -- 2026-04-19\n\n* Fixed a few misspells.\n\n*
  Refactored `Files` to `FilePaths`.\n\n* Refactored `Document(s)` to already existing
  `File(s)` for simplicity.\n\n* Excluding non-files (symbolic links) from search
  as this could bypass the\n  limitation of the current working directory.\n\n## 0.11.0.10
  -- 2026-04-17\n\n* Minor bug fixes and misspells.\n\n* Moved Agent/JSON.hs to Agent/Data/JSON.hs\n\n##
  0.11.0.9 -- 2026-04-16\n\n* Minor bug fixes.\n\n## 0.11.0.8 -- 2026-04-15\n\n* Refactored
  `/pile` to no longer storing a `find` filter but the absolute path\n  to the `find`
  results.\n  \n  > **NOTE:** Even though absolute path is stored, only relative will
  be shown.\n  \n* `/list` performance has been improved instead of performing the
  filters with\n  Haskell, it's now passed to the `find` command.\n  \n* Added logic
  to request `ISO-8601` timestamps (`UTC`) that are file path safe.\n\n* Added to
  website, info tab, a guide on how to setup LSP support for IDE's:\n\n  * https://a-gent.org/info.html#lsp-support-for-ides\n
  \ \n* Due to future `git-worktree` usage, the folder `/tmp/` MUST exist in the root\n
  \ of the project and it needs to be added to the `.gitignore` file to avoid\n  `GIT`
  collisions.\n  \n* Added `Internal.RIO` so the application can execute `RestrictedIO`,
  but,\n  consumers of the `Λ-gent` package will NOT.\n\n* All `Context` properties,
  except `load`, have now `internal` constructor\n  types. This will ensure that we
  will know that they have been instantiated by\n  the `Λ-gents`.\n  \n* From `0.11.0.6
  -- 2026-03-20` below:\n  \n  > **NOTE**: Fix is not verified. Well, this update
  will confirm (or not).\n  \n  * Package is NO longer marked as broken: https://github.com/NixOS/nixpkgs/blob/haskell-updates/pkgs/development/haskell-modules/configuration-hackage2nix/broken.yaml\n\n*
  Added `withExitCodeStdIn` as `curl` has a limit on data that can be sent as a\n
  \ parameter.\n\n* A `Agent.Data.ANSI.EscapeCode` module has been added to help distinguish\n
  \ between input/output.\n\n* `/send` (`/s`) has been added to provide the capability
  of sending `/pile`\n  files as context to messages sent to LLM's.\n\n* `repl` and
  `replWithMode` now need to provide an optional value for the\n  projects `rootPath`.
  This refactoring has been added to ease logic\n  implementation for the `Λ-gent`
  package.\n  \n  > **NOTE**: Changes to current existing Λ-gent scripts can be done
  by just\n  > post-fixing `Nothing`. Example: `replWithMode Echo eval Nothing`\n\n##
  0.11.0.7 -- 2026-03-30\n\n* We seem to have fixed multi-line issues. I guess we
  can say that we are\n  probably as good as `GHCi`.\n  \n  > **NOTE:** A thorough
  refactoring needs to be done to enforce `DRY`.\n\n* Added support for:\n\n  * `CTRL
  + L` clear screen.\n    \n  * `CTRL + U` clear text from current position to start
  of input.\n    \n  * `CTRL + K` clear text from current position to end of input.\n
  \   \n  * `CTRL + A` equivalent to `HOME`.\n    \n  * `CTRL + E` equivalent to `END`.\n
  \   \n  * `CTRL + D` equivalent to `DELETE`.\n\n## 0.11.0.6 -- 2026-03-20\n\n* Added
  a `todo.org` file in the root folder of the project. This will allow to\n  see current,
  but also future, status of the project.\n\n* Expanded file capabilities for `Code`
  and `Plan`.\n\n  * Files will be shown with `relative` paths. However, they will
  be handled\n    with `absolute` paths under the hood.\n\n* Added a few more `REPL`
  commands and improvements to typing.\n\n  * **NOTE**: There is a `bug` with regard
  of multi-line text. Hopefully it will\n    be fixed shortly.\n\n* No longer on Bluesky
  and therefore, removed from `cabal` file.\n\n* Issue with `haskellPackages` on `NixOS`.
  It seems that they use `stack` to\n  build with the latest `LTS`. The fix is to
  change in the `cabal` file the\n  following version contraint: `containers >= 0.7
  && < 1` as `stackage` only has\n  the version `0.7` of the `containers` package.\n
  \ \n  * **NOTE**: Fix is not verified. Well, this update will confirm (or not).\n\n*
  Added the `Agent.Control.Concurrent` module to provide support for\n  asynchronous
  tasks.\n\n* Added `Agent.Utils` modules to help for the respective `modes`. This
  will help\n  keep `Λ-gent` code small by providing ready to plug code bloks.\n\n##
  0.11.0.5 -- 2026-03-08\n\n* `ENTER` only triggers if something is typed.\n\n## 0.11.0.4
  -- 2026-03-08\n\n* Fixed the `BUG` when trying to print emojii's ('\U0001F34E',
  '\U0001F34F', …):\n\n  ```shell\n  <stdout>: hPutChar: invalid argument (cannot
  encode character '\\55357'\n  ```\n  \n  by adding `setLocaleEncoding utf8` to `replWithMode`.
  Now instead of crashing,\n  invalid `UTF-8` characters will just be shown as single
  or multiple `?`.\n\n## 0.11.0.3 -- 2026-03-06\n\n* Made `read` usable by providing
  support for:\n\n  * `BACKSPACE` and `DELETE` to remove characters.\n  \n  * Move
  back and forth with `←` & `→` (single characters) and `CTRL + ←` &\n    `CTRL +
  →` (words).\n    \n  * Move to start and end of the text with `HOME` and `END`.\n\n##
  0.11.0.2 -- 2026-03-05\n\n* Fixed issue with Hackage. The project now builds for:\n\n
  \ * `ghc-9.4.8`\n  \n  * `ghc-9.6.7`\n  \n  * `ghc-9.8.4`\n  \n  * `ghc-9.10.3`\n
  \ \n  * `ghc-9.12.2`\n\n## 0.11.0.1 -- 2026-03-05\n\n* Issue with Hackage. Since
  the service builds with `9.8.4` we have to comply\n  with that.\n\n## 0.11.0.0 --
  2026-03-04\n\n* Initial release after feedback from the NixOS Copenhagen User Group,
  March\n  meetup: <https://www.meetup.com/nixos-copenhagen-user-group/events/313205865/>\n\n*
  There is a `BUG` when trying to print emojii's ('\U0001F34E', '\U0001F34F', …):\n
  \ ```shell\n  <stdout>: hPutChar: invalid argument (cannot encode character '\\55357'\n
  \ ```\n\n## 0 -- 2026-02-25\n\n* First version. Released on an unsuspecting world.\n\n##
  References\n\n* Use of a fourth component [Version scheme][haskell-stack-ver].\n\n[haskell-stack-ver]:
  https://docs.haskellstack.org/en/stable/maintainers/version_scheme/#use-of-a-fourth-component\n"
