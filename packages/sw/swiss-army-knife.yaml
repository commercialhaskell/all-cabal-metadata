changelog: "#+TITLE: Changelog for swiss-army-knife\n#+AUTHOR: Fred Mitchell\n#+EMAIL:
  fred.mitchell@atomlogik.de\n* Unreleased\n  + =sak gitit create= takes =-r= / =--add-remote=
  to add the newly created\n    repo as a remote of the current local repo (named
  after the target), or\n    =-n NAME= / =--remote-name NAME= to choose the remote
  name. Works in git\n    and jj repos; checks run before the remote repo is created.\n
  \ + Local targets now report an absolute path, so it works as a remote URL.\n  +
  gitit API errors (GitHub, GitLab, Bitbucket) are reported as one line\n    with
  the HTTP status and the forge's message, instead of crashing on an\n    empty or
  non-JSON response body.\n  + Bitbucket: optional =BITBUCKET_PROJECT= selects the
  project new repos are\n    created in.\n  + README: full gitit documentation, including
  token setup for each forge.\n  + README: expanded documentation for every knife
  (flags, output, what each\n    one does under the hood), and a note on sudo.\n  +
  =make readme= regenerates =.github/README.md= (what GitHub displays) from\n    README.org;
  =make sdist= now runs it too.\n* 1.1.0.5 - 2026-07-11\n  + Made build static to
  get around dynamic mixmatch issues with GHC versions.\n  + Static made optional
  for Hackage installs. \n* 1.1.0.4 - 2026-07-01\n  + Adjusted cabal version to be
  lower for better coverage.\n  + GHC2021 for better coverage\n** Added\n- Cross-distro
  =sak kernel= command\n  - Now works on Arch, Debian, Ubuntu, Linux Mint, Pop!_OS,
  Fedora, RHEL, CentOS, Rocky Linux, and AlmaLinux\n  - Detects running kernel via
  =uname -r=\n  - Shows installed kernels using the native package manager (=pacman=,
  =dpkg-query=, or =rpm=)\n  - Graceful handling when optional kernel packages (e.g.
  =linux-lts=) are not installed\n\n** Changed\n- =Knives.Kernel= module is now fully
  distribution-agnostic\n- Cleaner output formatting with proper newlines\n- More
  robust command execution (no crashes on missing packages)\n\n** Fixed\n- Trailing
  newlines from =readProcess=\n- Ambiguous exception type error on GHC 9.14\n\n* 1.0.0.1
  and earlier\n** Versions\n   + 1.1.0.0 - Hackage release, renamed to swiss-army-knife
  (dropping the\n                \"-hs\" from the name. AUR will pull from Hackage
  instead.\n                of GitHub.\n   + 1.0.0.1 - enable and disable daemons,
  wg -l list has an extra field.\n              - Changelog.org removed. Basically
  a duplication of Versions here.\n              - version 1.0.0.0 was stillborn.
  Installation issues fixed\n   + 0.1.0.4 - fix for install issues with 0.1.0.3\n
  \  + 0.1.0.3 - 2 new feature, internally invokes sudo,\n      adopted \"standard\"
  for 4 number versioning X.Y.Z.W:\n\n      | # | Description                                   |\n
  \     |---+-----------------------------------------------|\n      | X | Major version
  (breaking changes)              |\n      | Y | Minor version (new features)                  |\n
  \     | Z | Patch version (bug fixes)                     |\n      | W | Build or
  revision number (specific iteration) |\n\n      So from now on, this will be applied.\n
  \  + 0.0.1.1 - new feature added\n   + 0.0.0.2 - bug fixes\n"
changelog-type: text
description: "#+OPTIONS: tags:nil -:nil ^:{} H:4\n* swiss-army-knife :TOC_7_gh:\n
  \ - [[#created-by][Created By]]\n  - [[#introduction][Introduction]]\n  - [[#installation][Installation]]\n
  \   - [[#static-builds-from-hackage][Static Builds from Hackage]]\n  - [[#documentation][Documentation]]\n
  \   - [[#privileges-sudo][Privileges (sudo)]]\n    - [[#sak---help][sak --help]]\n
  \   - [[#sak-version][sak version]]\n    - [[#sak-extip][sak extip]]\n    - [[#sak-kernel][sak
  kernel]]\n    - [[#sak-sleep][sak sleep]]\n    - [[#sak-zfscheck][sak zfscheck]]\n
  \   - [[#sak-wg][sak wg]]\n    - [[#sak-nm][sak nm]]\n    - [[#sak-sn][sak sn]]\n
  \   - [[#sak-gitit][sak gitit]]\n      - [[#managing-targets][Managing targets]]\n
  \     - [[#creating-a-repo][Creating a repo]]\n      - [[#local][Local]]\n      -
  [[#github][GitHub]]\n      - [[#gitlab][GitLab]]\n      - [[#bitbucket][Bitbucket]]\n
  \     - [[#errors][Errors]]\n  - [[#examples][Examples]]\n\n** Created By\n   Fred
  Mitchell & Atomlogik\n      \n** Introduction\n   Swiss-Army-Knife is a collection
  of useful\n   tools that you can do quickly.\n   \n   This is now in Hackage and
  the AUR. So in theory,\n   it can run \"anywhere\", though I have not had the time
  to test this,\n   so I am open to comments and pull requests. In particular, it
  is \n   gauranteed to run on Arch, and I do have some support for other\n   distros,
  and that will grow. But I have not had the time to fully\n   test other distros.\n\n
  \  So some knives will run \"anywhere\", but some that call out to\n   the system
  for system-specific information may have issues.\n   As I find out about them, I
  will fix them as quickly as I can.\n** Installation\n   + using cabal (recommended)\n
  \    #+begin_src sh\n       cabal update\n       cabal install swiss-army-knife\n
  \    #+end_src\n   + On Arch from the AUR\n     | using aura | aura -A swiss-army-knife
  |\n     | using yay  | yay -S swiss-army-knife  |\n     | using paru | paru -S swiss-army-knife
  |\n*** Static Builds from Hackage \n    To build a statically-linked binary, install:\n
  \   + =ghc-static= (Arch: =pacman -S ghc-static=)\n    + a static gmp (Arch: AUR
  =libgmp-static=)\n    + a static zlib — Arch's official package dropped =libz.a=
  as of 1.3.2;\n       build it yourself from https://zlib.net if needed.\n    Then:
  =cabal install swiss-army-knife -fstatic=\n** Documentation\n   These are the current
  \"knives\". More to come; suggestions welcome.\n\n   Every knife is a sub-command
  of =sak=, and each has its own help:\n   #+begin_src fish\n     sak --help          #
  list all knives\n     sak wg --help       # options for one knife\n   #+end_src\n\n***
  Privileges (sudo)\n    You don't need to run =sak= itself with =sudo=. The knives
  that\n    change system services (=wg=, =nm=, =sn=) call =sudo systemctl=\n    themselves,
  so expect a password prompt unless your sudoers\n    configuration allows =systemctl=
  without one. The other knives\n    run as your normal user.\n\n*** sak --help\n
  \   Lists all the knives with a one-line description of each.\n    =-v= / =--verbose=
  is accepted as a global flag, but no knife\n    uses it yet.\n\n*** sak version\n
  \   Prints the installed version of Swiss Army Knife.\n\n*** sak extip\n    Shows
  the external (public) IP address of your connection, which\n    is what the rest
  of the internet sees. Handy for confirming that a\n    VPN is actually in use. By
  default it also shows the approximate\n    location and time zone of that address.\n\n
  \   | Flag             | Meaning                                             |\n
  \   |------------------+-----------------------------------------------------|\n
  \   | -n, --nolocation | Show only the IP address, without location lookup.  |\n
  \   | -i, --ipv6       | Show your IPv6 address instead of the IPv4 address. |\n\n
  \   Example output:\n    #+begin_example\n      203.0.113.42\n      Location: Frankfurt
  am Main, Germany (DE)\n      Timezone: Europe/Berlin\n    #+end_example\n\n    The
  address comes from jsonip.com; the location from ip-api.com.\n    =-i= only works
  if your connection has IPv6. The location lookup\n    is done over plain HTTP and
  may reflect your IPv4 address even\n    with =-i=; use =-n= if you'd rather not
  send that request.\n\n*** sak kernel\n    Shows the kernel you are running and the
  kernel packages that are\n    installed, so you can tell whether you need a reboot
  after an\n    upgrade.\n\n    | Flag              | Meaning                                                      |\n
  \   |-------------------+--------------------------------------------------------------|\n
  \   | -j, --justversion | Print only the running kernel version (useful in scripts).
  \  |\n\n    Example output (Arch):\n    #+begin_example\n      Running kernel:  6.17.7-arch1-1\n
  \     Installed kernels:\n        linux 6.17.8.arch1-1\n        linux-lts 6.12.57-1\n
  \   #+end_example\n\n    The running kernel comes from =uname -r=. Installed kernels
  are\n    looked up with the distribution's package manager:\n\n    | Distribution
  family                                    | How                                           |\n
  \   |--------------------------------------------------------+-----------------------------------------------|\n
  \   | Arch                                                   | =pacman -Q= for linux,
  linux-lts, linux-zen, linux-hardened |\n    | Debian, Ubuntu, Mint, Pop!_OS, Kali,
  elementary, Zorin | =dpkg-query= for =linux-image-*=              |\n    | RHEL,
  CentOS, Fedora, Rocky, AlmaLinux, Oracle         | =rpm -qa kernel*= (headers, devel
  etc. excluded) |\n\n    Arch is the most tested. If the packages can't be determined,\n
  \   =sak kernel= says so and still shows the running kernel.\n\n*** sak sleep\n
  \   Suspends the machine (=systemctl suspend=).\n\n    | Flag               | Meaning
  \                                 |\n    |--------------------+------------------------------------------|\n
  \   | -w, --wait SECONDS | Wait this many seconds before suspending. |\n\n    #+begin_src
  fish\n      sak sleep          # suspend now\n      sak sleep -w 300   # suspend
  in 5 minutes\n    #+end_src\n\n    Suspend is requested with =-i=, so it goes ahead
  even if a program\n    (a video player, a download) is holding a suspend inhibitor.
  The\n    wait runs in the foreground; press Ctrl-C during it to cancel.\n\n*** sak
  zfscheck\n    *Arch Linux with archzfs only.* ZFS on Arch is an out-of-tree\n    module,
  and archzfs sometimes lags behind the newest kernel. If\n    you upgrade the kernel
  before ZFS supports it, the ZFS module\n    won't load and your pools won't import.
  =zfscheck= tells you,\n    before you upgrade, whether the kernel currently in the
  repos is\n    supported. That lets you stay on the regular =linux= kernel (held\n
  \   back when needed) instead of switching to =linux-lts=.\n\n    | Flag       |
  Meaning                                                     |\n    |------------+-------------------------------------------------------------|\n
  \   | -f, --full | Also show where the supported-kernel ceiling was read from. |\n\n
  \   It compares:\n    + the =linux= version in the repos, the one installed, and
  the\n      one running;\n    + the OpenZFS version the repos would install (=zfs-dkms=,
  or\n      =zfs-utils=), and the newest kernel that OpenZFS release\n      supports
  (=Linux-Maximum= in its =META= file, read from\n      =/usr/src/zfs-VERSION/META=
  if present, otherwise fetched from\n      the OpenZFS release tag on GitHub with
  =curl=);\n    + the exact kernel build that the prebuilt =zfs-linux= package\n      targets,
  if that package is available.\n\n    It then gives a verdict for both ways of installing
  ZFS:\n    #+begin_example\n        DKMS route:     OK\n        Prebuilt route: NO\n\n
  \     Upgrade possible: install linux, linux-headers and the ZFS packages in one
  transaction.\n    #+end_example\n\n    + *DKMS route*: OK when the repo kernel's
  major.minor version is\n      no newer than what the OpenZFS release supports.\n
  \   + *Prebuilt route*: OK only when =zfs-linux= was built for exactly\n      the
  repo kernel.\n    + If neither is OK it tells you not to upgrade the kernel yet.\n
  \     Add =linux= (and =linux-headers=) to =IgnorePkg= in\n      =/etc/pacman.conf=
  to hold it back while upgrading everything\n      else, and run =zfscheck= again
  later.\n\n    The repo versions come from pacman's sync databases, so the result\n
  \   is only as fresh as your last database sync. =curl= must be\n    installed for
  the GitHub fallback.\n\n*** sak wg\n    Manages WireGuard VPNs set up for =wg-quick=:
  each\n    =/etc/wireguard/NAME.conf= is a VPN called =NAME=, run by the\n    systemd
  unit =wg-quick@NAME=.\n\n    | Flag               | Meaning                                                            |\n
  \   |--------------------+--------------------------------------------------------------------|\n
  \   | -l, --list         | List each VPN with whether it is active and whether it
  is enabled. |\n    | -a, --activate VPN | Start VPN for this session only.                                   |\n
  \   | -A, --enable VPN   | Start VPN and enable it, so it also starts at boot.                |\n
  \   | -d, --deactivate   | Stop every active VPN. They stay enabled for the next
  boot.        |\n    | -D, --disable      | Disable every enabled VPN, and stop them.
  \                         |\n    | -r, --reactivate   | Restart every active VPN
  (e.g. after editing a config).            |\n\n    =-l= can be combined with any
  one other flag; the rest are\n    mutually exclusive. The list is printed before
  the action runs,\n    so it shows the state beforehand.\n\n    #+begin_src fish\n
  \     sak wg -l               # what's there and what's running\n      sak wg -d;
  sak wg -a de-berlin   # switch VPNs (one action per call)\n    #+end_src\n\n    =sak=
  needs to be able to read the =/etc/wireguard= directory to\n    find the VPN names.\n\n***
  sak nm\n    Controls NetworkManager (=NetworkManager.service=). Give exactly one\n
  \   flag:\n\n    | Flag             | Meaning                                    |\n
  \   |------------------+--------------------------------------------|\n    | -a,
  --activate   | Start it for this session.                 |\n    | -A, --enable
  \    | Start it and enable it at boot.            |\n    | -d, --deactivate | Stop
  it; it still starts at the next boot. |\n    | -D, --disable    | Stop it and disable
  it at boot.            |\n    | -r, --reactivate | Restart it.                                |\n\n
  \   Together with =sak sn= this makes switching between NetworkManager\n    and
  systemd-networkd a two-command job, e.g. =sak nm -D; sak sn -A=.\n    Don't leave
  both enabled: they will fight over the interfaces.\n\n*** sak sn\n    Controls systemd-networkd.
  It acts on both\n    =systemd-networkd.socket= and =systemd-networkd.service=, so
  the\n    socket doesn't restart the service behind your back. Give exactly\n    one
  flag:\n\n    | Flag             | Meaning                                                  |\n
  \   |------------------+----------------------------------------------------------|\n
  \   | -a, --activate   | Start socket and service for this session.               |\n
  \   | -A, --enable     | Start both, and enable the service at boot.              |\n
  \   | -d, --deactivate | Stop both; the service still starts at the next boot.    |\n
  \   | -D, --disable    | Stop both, and disable the service at boot.              |\n
  \   | -r, --reactivate | Restart both (e.g. after editing a =.network= file).     |\n\n***
  sak gitit\n    Creates the remote repository for a local Git (or jj) repo, on\n
  \   your own filesystem or on GitHub, GitLab or Bitbucket, and can add\n    it as
  a remote of the local repo in the same step.\n\n    Destinations are called /targets/.
  Each target has a name, a kind\n    (=local=, =github=, =gitlab= or =bitbucket=)
  and a location. They\n    are stored in =~/.config/swiss-army-knife/config.yaml=
  under the\n    =gitit= key, and managed with the sub-commands below rather than\n
  \   by editing the file.\n\n**** Managing targets\n     | Command                          |
  Description                                                       |\n     |----------------------------------+-------------------------------------------------------------------|\n
  \    | sak gitit list                   | List the configured targets and their
  kinds.                      |\n     | sak gitit add KIND NAME LOCATION | Add a target
  (KIND: local, github, gitlab or bitbucket).          |\n     | sak gitit delete
  NAME            | Remove a target.                                                  |\n
  \    | sak gitit default NAME           | Record a target as the default (not yet
  used by =create=).        |\n\n     LOCATION is a directory for =local= targets,
  and the forge's SSH\n     prefix for the others.\n\n     For example:\n     #+begin_src
  fish\n       sak gitit add local     origin    ~/pCloud/repo\n       sak gitit add
  github    github    git@github.com:flajann2\n       sak gitit add gitlab    gitlab
  \   git@gitlab.com:eltoro-maestro\n       sak gitit add bitbucket bitbucket git@bitbucket.org:eltoro-maestro\n
  \    #+end_src\n\n     For the forges the LOCATION is informational: the account
  a repo\n     is created in comes from the credentials described below.\n\n**** Creating
  a repo\n     #+begin_src fish\n       sak gitit create TARGET REPONAME [-r | -n
  NAME]\n     #+end_src\n\n     | Flag                   | Meaning                                                                       |\n
  \    |------------------------+-------------------------------------------------------------------------------|\n
  \    | -r, --add-remote       | Also add the new repo as a remote of the current
  repo, named after the target. |\n     | -n, --remote-name NAME | Same, but use NAME
  as the remote name (e.g. =origin=). Implies =-r=.          |\n\n     Without either
  flag, gitit only creates the repo and prints the\n     =git remote add= command
  for you to run yourself.\n\n     With =-r= or =-n=, run gitit from inside the local
  repo. Before\n     anything is created, gitit checks that\n     + the current directory
  is inside a git or jj repo, and\n     + the local repo does not already have a remote
  with that name,\n     so a typo never leaves an orphaned repo on the forge. In a
  jj\n     repo (including a colocated one) the remote is added with\n     =jj git
  remote add=, otherwise with =git remote add=. If adding\n     the remote fails after
  the repo was created, gitit prints the\n     exact command to add it by hand.\n\n
  \    Repos are currently created as public on all forges.\n\n**** Local\n     Creates
  a bare repo at =LOCATION/REPONAME.git=, for example on a\n     cloud-backed filesystem
  such as pCloud. The path is made absolute,\n     so it works as a remote URL from
  any directory. Fails if that path\n     already exists.\n\n**** GitHub\n     Needs
  a GitHub token, taken from the first of:\n     1. the =GITHUB_TOKEN= environment
  variable, or\n     2. the GitHub CLI's login (=gh auth token=), after =gh auth login=.\n
  \    A classic token needs the =repo= scope (=public_repo= is enough for\n     public
  repos); a fine-grained token needs /Administration: write/.\n     The repo is created
  under the account the token belongs to.\n\n**** GitLab\n     Needs a GitLab token,
  taken from the first of:\n     1. the =GITLAB_TOKEN= environment variable, or\n
  \    2. glab's saved login (=glab config get token=), after\n        =glab auth
  login=. If glab keeps the token in the system\n        keyring, gitit cannot read
  it from there; use =GITLAB_TOKEN=.\n     The token is a personal access token with
  the =api= scope,\n     created under /Edit profile → Access tokens/\n     (https://gitlab.com/-/user_settings/personal_access_tokens).\n
  \    For a self-hosted GitLab, set =GITLAB_HOST= (the same variable\n     glab uses);
  the default is =gitlab.com=. The project is created\n     in your user namespace.\n\n****
  Bitbucket\n     Bitbucket has no CLI login to borrow, so it is configured with\n
  \    environment variables:\n\n     | Variable              | Required | Meaning
  \                                                 |\n     |-----------------------+----------+----------------------------------------------------------|\n
  \    | =BITBUCKET_WORKSPACE= | yes      | Workspace slug, as in =bitbucket.org/WORKSPACE/...=
  \     |\n     | =BITBUCKET_EMAIL=     | yes      | The email address you log in
  to Atlassian with.          |\n     | =BITBUCKET_TOKEN=     | yes      | An Atlassian
  API token with Bitbucket scopes (see below). |\n     | =BITBUCKET_PROJECT=   | no
  \      | Key of the project to create the repo in.                |\n\n     *The
  token.* Use an Atlassian *API token*, not a repository,\n     project or workspace
  access token (those are tied to one\n     resource and cannot create new repos).
  Create it at\n     https://id.atlassian.com/manage-profile/security/api-tokens:\n
  \    1. Choose *Create API token with scopes* (the plain\n        /Create API token/
  button makes a token Bitbucket rejects with\n        \"API Token provided has no
  Bitbucket scopes\").\n     2. Pick *Bitbucket* as the app.\n     3. Grant =read:repository:bitbucket=,
  =write:repository:bitbucket=\n        and =admin:repository:bitbucket=. Nothing
  else is needed; avoid\n        the =delete:= scopes.\n     4. Copy the token; it
  is shown only once.\n\n     *The project.* Every Bitbucket repo belongs to a project.
  Without\n     =BITBUCKET_PROJECT=, Bitbucket uses the workspace's default\n     project,
  and if you can't create repos there it answers\n     \"You can't create repositories
  under this project\". Set it to\n     the key of a project you administer (shown
  under the workspace's\n     /Projects/ page).\n\n     In fish:\n     #+begin_src
  fish\n       set -Ux BITBUCKET_WORKSPACE eltoro-maestro\n       set -Ux BITBUCKET_EMAIL
  \    you@example.com\n       set -Ux BITBUCKET_PROJECT   KEY\n       read -s -x
  -U BITBUCKET_TOKEN    # paste the token; it is not echoed\n     #+end_src\n\n     To
  check the credentials without gitit (expect =200=; =401= means\n     the email/token
  pair is wrong):\n     #+begin_src fish\n       curl -s -o /dev/null -w '%{http_code}\\n'
  -u \"$BITBUCKET_EMAIL:$BITBUCKET_TOKEN\" \\\n            \"https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE?pagelen=1\"\n
  \    #+end_src\n\n     Bitbucket repo slugs are lowercase, so =MyRepo= becomes =myrepo=.\n\n****
  Errors\n     API failures are reported as one line with the HTTP status and the\n
  \    forge's own message, for example:\n     #+begin_example\n       gitit: Bitbucket
  API error (HTTP 400): project: You can't create repositories under this project.\n
  \    #+end_example\n     When the forge sends no message (Bitbucket answers a bad
  token with\n     an empty 401), gitit says whether the problem is authentication\n
  \    (401) or permissions/scopes (403).\n\n** Examples\n   | Command                        |
  Description                                                                                                        |\n
  \  |--------------------------------+--------------------------------------------------------------------------------------------------------------------|\n
  \  | sak extip                      | Will list your external IP and location information
  \                                                               |\n   | sak wg -l
  \                     | (If you are using wg_quick) will list all of your available
  WG vpns, as well as their active and enabled statuses. |\n   | sak wg -d                      |
  Will deactivate (but not disable) all WireGuard VPNs.                                                              |\n
  \  | sak wg -D                      | Will disable all enabled WireGuard VPNs, and
  stop them.                                                            |\n   | sak
  sn -A                      | Will enable and start systemd-networkd.                                                                            |\n
  \  | sak nm -D                      | Will disable and stop NetworkManager.                                                                              |\n
  \  | sak extip -n                   | Will print just your external IPv4 address.
  \                                                                       |\n   |
  sak kernel -j                  | Will print just the running kernel version.                                                                        |\n
  \  | sak sleep -w 300               | Will suspend the machine in 5 minutes.                                                                             |\n
  \  | sak zfscheck                   | Will tell you whether archzfs supports the
  kernel in the repos, before you upgrade.                                |\n   |
  sak gitit create origin myrepo | Will create a new remote repo named \"myrepo\"
  in the origin target.                                                 |\n   | sak
  gitit create github myrepo -r | Will create \"myrepo\" on GitHub and add it as remote
  \"github\" of the current repo.                          |\n   | sak gitit create
  gitlab myrepo -n origin | Will create \"myrepo\" on GitLab and add it as remote
  \"origin\" of the current repo.                   |\n   |                                |
  \                                                                                                                   |\n
  \  |--------------------------------+--------------------------------------------------------------------------------------------------------------------|\n"
