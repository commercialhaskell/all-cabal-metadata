changelog: "# Revision history for railroad\n\n## 0.1.1.4 -- 2026-10-10\n* Widen dependency
  upper bounds (tests pass):\n  - `effectful < 2.8`\n  - `validation < 1.4`\n* Stop
  using `Data.Validation.toEither`, which `validation-1.3` no longer exports.\n* Declare
  `hspec-discover` as a `build-tool-depends` of the test suite, so the tests build
  outside the nix shell.\n\n## 0.1.1.3 -- 2026-10-10\n* Documentation fixes: correct
  \"success\" typo and the doc comment of `(?)` in `Railroad.MonadError`.\n\n## 0.1.1.2
  -- 2026-04-17\n* Remove strictness annotation from `TooMany` constructor in `CardinalityError`.\n\n##
  0.1.1.1 -- 2026-02-28\n* Widen dependency bounds for better GHC compatibility:\n
  \ - `base` → `>= 4.17 && < 4.23` (supports GHC 9.4 through 9.14)\n  - `effectful`
  → `>= 2.5 && < 2.7` (allows current 2.6.x series)\n  - `mtl` lower bound relaxed
  to `>= 2.2`\n\n## 0.1.1.0 -- 2026-02-26\n* Add non unicode alias for `(?∅)`\n* Fix
  the fixity of `(??~)` to be inline with `(?~)`\n\n## 0.1.0.1 -- 2026-02-26\n\n*
  Fix that `Railroad.MonadError` is not exposed in the cabal file\n* Fix ambiguous
  occurrence of `(??~)` in `Railroad.MonadError` by hiding it in import.\n* Add tests
  for the MonadError version of the operators such that issues like the above will
  be caught \n\n## 0.1.0.0 -- 2026-02-25\n\n* First version. Released on an unsuspecting
  world.\n"
changelog-type: markdown
description: "A railway oriented mini-DSL for handling and interpreting error states
