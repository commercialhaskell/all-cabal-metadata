changelog: "# Revision history for railroad\n\n## 0.2.1.0 -- 2026-10-11\n* Add the
  tap operator `(?<*)`: runs an effect on the failure and passes the original value
  through\n  unchanged, so a failure can be logged or counted before a constant error
  throws it away:\n  `runQuery q ?<* logDbError ? err503`. The handler is a function
  of the failure (`CErr a -> m ()`)\n  and runs only when there is one. It needs only
  `Monad`, never throws, and is defined once, in\n  `Railroad.Bifurcate`, so `Railroad`
  and `Railroad.MonadError` re-export it.\n* Documentation: say \"unwrap\" instead
  of \"peel\" for taking apart one layer of a result.\n\n## 0.2.0.1 -- 2026-10-11\n*
  Documentation: a README section on the empty-collection gotcha (`?` on a traversable
  checks that\n  every element succeeds, so an empty one passes; chain `?+` before
  it), with the quantifiers each\n  operator corresponds to, and a note in the haddocks
  of `Bifurcate` and `?+`. A test pins it.\n\n## 0.2.0.0 -- 2026-10-11\n* Breaking:
  `(?>)` no longer throws. `m ?> p` tags the value (`Right a` if `p a`, else `Left
  a`,\n  carrying the rejected value) and is finished with `?` or `??`: `(m ?> p)
  toErr` becomes\n  `m ?> p ?? toErr`. It needs only `Functor`, so `Railroad.MonadError`
  re-exports the one definition.\n* Breaking: all operators are now `infixl 1` (they
  were `infixl 0`, and `?>` was `infixl 1`), like\n  `>>=`, `<&>` and `&`. `runQuery
  q ? err <&> f`, `f $ m ? e` and `m ? e ?> p` now parse as they read.\n  Code that
  compiled before keeps its meaning, except where an operator was mixed with another
  of\n  a different level.\n* New modules `Railroad.Bifurcate` (the class, `CErr`,
  `CRes`, and the operators that never throw:\n  `?>`, `??~`, `?~`, `?|`, `?|<>`)
  and `Railroad.Cardinality` (`CardinalityError`, `cardinalityErr`).\n  `Railroad`
  and `Railroad.MonadError` re-export both, so imports keep working, and all three\n
  \ modules now have explicit export lists. `Railroad.MonadError` no longer imports
  `Railroad`.\n* Breaking: `(??~)` and `(?~)` are defined once, in `Railroad.Bifurcate`,
  with the more general type\n  `Functor m => m a -> ...` (they were `Eff es a` in
  `Railroad`).\n* `(?|)` and `(?|<>)` simplified internally; their behaviour is unchanged.\n\n##
  0.1.2.1 -- 2026-10-11\n* Fix overlapping instances: `Either e (Maybe a)`, `Maybe
  (Maybe a)`, `Either e Bool` and the like\n  did not compile when used with `?`,
  so nested layers could not be peeled (the README's first\n  example did not compile).
  The outermost layer is now peeled first, as documented; lists and other\n  traversables
  inside a layer behave as before. Tests added, including the README example.\n\n##
  0.1.2.0 -- 2026-10-11\n* Add the fallback operator `(?|)`: runs the left action,
  and only if it fails runs the right one.\n  The two sides can be different structures
  (`Maybe`, `Either`, ...) with the same success type, the\n  last error is kept,
  and the result chains and is finished with `?` or `??`. It never throws, so\n  `Railroad.MonadError`
  re-exports the one definition.\n* Add `(?|<>)`, the same fallback but when every
  source fails the errors are combined with `<>`\n  in source order. The sources must
  agree on the error type (`CErr`) and the success type (`CRes`).\n* Documentation:
  a servant + effectful example and a section on the fallback operators in the README,\n
  \ clearer haddocks (module headers, `CErr`, `CRes`, each operator), and `readme.md`
  in `extra-doc-files`.\n* Add `tested-with` (GHC 9.4.8 to 9.14.1, the versions the
  test suite is run on).\n* Write the `validation` bound without a trailing zero or
  a strict lower bound:\n  `(>= 1.1 && < 1.3) || (>= 1.3.1 && < 1.4)`, the same set
  of releases as in 0.1.1.5.\n\n## 0.1.1.5 -- 2026-10-11\n* Exclude `validation-1.3.0`
  from the bounds: it does not build (it uses `foldable1-classes-compat`\n  without
  declaring it). `validation >= 1.3.1` needs `base >= 4.18`, so on GHC 9.4 the solver
  picked\n  1.3.0 under 0.1.1.4's `validation < 1.4` and the build failed.\n\n## 0.1.1.4
  -- 2026-10-10\n* Widen dependency upper bounds (tests pass):\n  - `effectful < 2.8`\n
  \ - `validation < 1.4`\n* Stop using `Data.Validation.toEither`, which `validation-1.3`
  no longer exports.\n* Declare `hspec-discover` as a `build-tool-depends` of the
  test suite, so the tests build outside the nix shell.\n\n## 0.1.1.3 -- 2026-10-10\n*
  Documentation fixes: correct \"success\" typo and the doc comment of `(?)` in `Railroad.MonadError`.\n\n##
  0.1.1.2 -- 2026-04-17\n* Remove strictness annotation from `TooMany` constructor
  in `CardinalityError`.\n\n## 0.1.1.1 -- 2026-02-28\n* Widen dependency bounds for
  better GHC compatibility:\n  - `base` → `>= 4.17 && < 4.23` (supports GHC 9.4 through
  9.14)\n  - `effectful` → `>= 2.5 && < 2.7` (allows current 2.6.x series)\n  - `mtl`
  lower bound relaxed to `>= 2.2`\n\n## 0.1.1.0 -- 2026-02-26\n* Add non unicode alias
  for `(?∅)`\n* Fix the fixity of `(??~)` to be inline with `(?~)`\n\n## 0.1.0.1 --
  2026-02-26\n\n* Fix that `Railroad.MonadError` is not exposed in the cabal file\n*
  Fix ambiguous occurrence of `(??~)` in `Railroad.MonadError` by hiding it in import.\n*
  Add tests for the MonadError version of the operators such that issues like the
  above will be caught \n\n## 0.1.0.0 -- 2026-02-25\n\n* First version. Released on
  an unsuspecting world.\n"
changelog-type: markdown
description: "# railroad\n\n**A terse railway-oriented error handling DSL for Haskell.
  Unwrap `Maybe`, `Either`, `Bool` or `Validation`, or throw a mapped error, with
  one short operator.**\n\nInstead of\n\n```haskell\nrows <- runQuery (userById uid)
  >>= either (const (throwError err503)) pure\nuser <- case rows of\n  []  -> throwError
  err404\n  [u] -> pure u\n  _   -> throwError err500\n```\n\nwrite\n\n```haskell\nuser
  <- runQuery (userById uid) ? err503 ?! cardinalityErr err404 (const err500)\n```\n\nHere
  `runQuery` returns `Eff es (Either DbError [row])`. Each operator\nunwraps one layer
  (the database failure, then \"exactly one row\") and says\nwhat to throw if it fails,
  so the happy path stays one line. A longer\n[servant example](#example-a-servant-backend)
  is below.\n\nThe purpose of `railroad` is to error handle tersely, keeping the\nhappy-path
  clean of control-flow and functor unpacking.  It does this\nwith 11 combinators,
  that abstract over binary co-products (`Bool`,\n`Maybe`, `Either`, `Validation`)
  and Traversables or Folds over them.\n\n```haskell\nimport Railroad.MonadError\nimport
  Control.Monad.Except\n\nexample :: Either String Int\nexample = runExcept $ do\n
  -- False ? \"error\" would make the block short circuit to Left \"error\"\n \n x
  <- pure (Just 2) ? \"Value missing\"\n \n -- Right (Just 1) ~> Just 1 ~> 1\n y <-
  pure (Right $ Just 1) ? \"Outer fail\" ? \"Inner fail\"\n \n -- [Just 4] ~> [4]
  ~> 4\n z <- pure [Just 4] ? \"List failed\" ?! const \"Not a single element\"\n
  \n q <- pure Nothing ?~ 1 \n \n pure (x + y + z + q) -- ~> Right 8 \n```\n\nYou
  just need to work in a monad which supports a `MonadError`-like\ncontext. Either
  by being an instance of `MonadError` or in an Eff\nstack with `Error`.\n\n[![Haskell](https://img.shields.io/badge/language-Haskell-%23612a7e.svg)](https://www.haskell.org/)\n[![License](https://img.shields.io/badge/license-BSD--3--Clause-blue.svg)](LICENSE)\n\n---\n\n##
  Modules\n\n- `Railroad`: the operators for the `effectful` `Error` effect.\n- `Railroad.MonadError`:
  the same operators for any `MonadError` (`mtl`, `ExceptT`, servant's `Handler`).\n-
  `Railroad.Bifurcate`: the `Bifurcate` class and the operators that never throw\n
  \ (`?>`, `?~`, `??~`, `?|`, `?|<>`, `?<*`); `Railroad.Cardinality`: `CardinalityError`.\n
  \ Both of the above re-export these, so you rarely import them directly.\n\n## Install\n\n###
  Nix\n\nHere is an expression you can add to `ghcWithPackages`:\n```nix\nrailroad
  = pkgs.haskellPackages.callCabal2nix \"railroad\" (pkgs.fetchFromGitHub \n  { owner
  \ = \"mastratisi\"\n  ; repo   = \"railroad\"\n  ; rev    = \"master\"\n  ; sha256
  = pkgs.lib.fakeSha256; # Nix will tell you the real hash on first build   \n  })
  {};\n```\n\n### Hackage\nThe package is under the name `railroad`. Link: https://hackage.haskell.org/package/railroad\n\n\n\n##
  Example: a servant backend\n\nHandlers in a servant + `effectful` backend (adapted
  from a real one)\nare chains of queries and checks where each failure is an HTTP
  status.\nThe queries return `Eff es (Either DbError [row])`: a database failure\nwrapping
  the rows. With `railroad`:\n\n```haskell\ngetUser :: Error ServerError :> es =>
  UserId -> Eff es UserDTO\ngetUser uid = do\n  user <- runQuery (userById uid) ?
  err503 ?! cardinalityErr err404 (const err500)\n  pure (toUserDTO user)\n\nregister
  :: Error ServerError :> es => Email -> Eff es Token\nregister email = do\n  runQuery
  (userByEmail email) ? err503 ?∅ const err409   -- must not exist yet\n  makeJWT
  email ? err500\n\nupdateAsset :: Error ServerError :> es => UserId -> Asset -> Eff
  es ()\nupdateAsset uid asset = do\n  -- permitted is an SQL exists, so it always
  returns exactly one row (see the gotcha below)\n  _ <- runQuery (permitted uid asset)
  ? err500 ? err403   -- db error, then \"not permitted\"\n  ...\n```\n\nEach operator
  unwraps one layer, left to right: `? err503` unwraps the\n`Either`, then `?!` demands
  exactly one row (none is a 404, several a\n500). The same handlers in plain Haskell:\n\n```haskell\ngetUser'
  uid = do\n  rows <- runQuery (userById uid) >>= either (const (throwError err503))
  pure\n  user <- case rows of\n    []  -> throwError err404\n    [u] -> pure u\n
  \   _   -> throwError err500\n  pure (toUserDTO user)\n\nregister' email = do\n
  \ rows <- runQuery (userByEmail email) >>= either (const (throwError err503)) pure\n
  \ unless (null rows) (throwError err409)\n  makeJWT email >>= either (const (throwError
  err500)) pure\n\nupdateAsset' uid asset = do\n  allowed <- runQuery (permitted uid
  asset) >>= either (const (throwError err500)) pure\n  unless (and allowed) (throwError
  err403)\n  ...\n```\n\nThe failure paths no longer take up lines, and the order
  of the layers is\nthe order you read them in. Validating a request with a `Validation`\nreports
  every problem at once: `pure (map validateFile files) ?? badRequest`\nturns all
  the invalid files into one 400. `Railroad.MonadError` has the\nsame operators for
  plain `MonadError`, including servant's `Handler`.\n\n## Understanding the Operators\n\n|
  Operator | Purpose                                       | Example                       |\n|----------|-----------------------------------------------|-------------------------------|\n|
  `??`     | Derail on error with custom error mapping     | `action ?? toMyError`
  \        |\n| `?`      | Derail with constant error                    | `action
  ? MyError`            |\n| `?>`     | Tag by predicate (`Left` carries the value)
  \  | `action ?> isGood ? NotGood`  |\n| `??~`    | Recover with a mapped default
  (error → value) | `action ??~ toDefaultVal`     |\n| `?~`     | Recover with a const
  default value            | `action ?~ defaultVal`        |\n| `?+`     | Derail
  on empty collection                    | `items ?+ NoResults`          |\n| `?!`
  \    | Derail if not exactly one element             | `items ?! fromCardinalityErr`
  |\n| `?∅`     | Derail on non-empty collections (alias `?@`)  | `items ?∅ DuplicateFound`
  \    |\n| `?\\|`    | Fall back to another action on error         | `cache k ?\\|
  db k ? NotFound` |\n| `?\\|<>`  | Fall back, combining the errors with `<>`     |
  `a ?\\|<> b ?? toErr`         |\n| `?<*`    | Run an effect on a failure, then carry
  on     | `action ?<* logIt ? MyError`  |\n\n\nAll operators are `infixl 1`, like
  `>>=`, `<&>` and `&`, so they chain\nleft to right with them without parentheses:\n`runQuery
  q ? err503 <&> toDTO`.\n\nFor the semantics of the operators there are 3 relevant
  questions:\nWhat counts as an error?  What happens in the error case?  What\nhappens
  in the success case?\n\n\n### What counts as an error?\nHere we can split the operators
  into two families. Those that\ninterpret errors on the structure of Functors and
  Traversable of\nFunctor. Those that interpret error on the cardinality of Foldables.\n\nFor
  the former, they all (`?`, `??`, `?~`, `??~`) interpret what\nan error is the same
  way:\n\n | Functor          | Error Constructor    | Error Info (`CErr`) | Result
  Info (`CRes`) |\n |------------------|----------------------|---------------------|----------------------|\n
  | `Bool`           | `False`              | `()`                | `()`                 |\n
  | `Maybe a`        | `Nothing`            | `()`                | `a`                  |\n
  | `Either e a`     | `Left`               | `e`                 | `a`                  |\n
  | `Validation e a` | `Failure`            | `e`                 | `a`                  |\n
  | `t f`            | Any element is error | `CErr f`            | `t (CRes f)`         |\n\nAn
  empty `t f` has no element to fail, so it succeeds: see [the gotcha](#gotcha-an-empty-collection-passes).\n\n\nFor
  the latter each operator (`?+`, `?!`, `?∅`) interpret what\ncardinalities of a Foldable
  counts as errors differently. To wit:\n\n| Operator    | Success Condition   | Error
  Info               | Result Info |\n|:------------|:--------------------|:-------------------------|:------------|\n|
  `?+`        | Non-empty           | `()`                     | `t a`       |\n|
  `?!`        | Exactly one element | `CardinalityError (t a)` | `a`         |\n|
  `?∅` / `?@` | Is empty            | `t a`                    | `()`        |\n\nWhere\n```haskell\n--
  | Structurally a @Maybe ta@ for cardinality failures\ndata CardinalityError ta =
  IsEmpty | TooMany ta\n\n-- | Catamorphism for CardinalityError\ncardinalityErr ::
  e -> (ta -> e) -> CardinalityError ta -> e\n```\n\n### What happens in the error
  case?\nWhen an error is detected, the railroad \"derails\":\n\n1. The provided error-mapping
  function is applied to the **Error\n   Info** (`CErr` or `CardinalityError`).\n2.
  The result of the error mapping is thrown\n3. This causes early termination of the
  monadic sequence.\n\n**Recovery Operators (`?~`, `??~`):** Unlike the other operators,\nthese
  do **not** derail the computation. Instead, they provide a\n\"switch\" to bring
  the logic back onto the happy path by providing a\ndefault value through a recovery
  function.\n\n\n**Traversal case:** For `Bool`, `Maybe`, `Either` the error\naccumulation
  is short-circuiting and stops at the first error. For \n`t (Validation e a)` the
  semigroup constraint on `e` is used to\naccumulate all errors together. For more
  information on accumulating\nerrors, see the\n[validation](https://hackage.haskell.org/package/validation/docs/Data-Validation.html)\npackage
  on Hackage.\n### What happens in the success case?\nIn the success case the result
  is unwrapped or validated (`?+`, `?!`)\nand the monad continues its execution. Result
  Info in the above tables\nshows the resulting type inside the monad.\n\n### Fallback
  operators\n`?|` and `?|<>` try one source after another and stop at the first\nsuccess.
  They are for sources that may be different structures (for\nexample a cache returning
  `Maybe` and a database returning `Either`)\nwith the same success type (`CRes`).
  The result is bifurcatable, so a\nfinal `?` or `??` turns a total failure into a
  throw:\n\n```haskell\ncache k ?| db k ?| legacy k ? NotFound\n```\n\n`?|` keeps
  the last error. `?|<>` also needs the sources to share the\nerror type (`CErr`)
  and combines all the errors with `<>`, in source\norder, when every source fails.
  Map differing error types to a common one\nfirst, for example with `note`-like functions:\n\n```haskell\n(cache
  k <&> note [CacheMiss]) ?|<> (db k <&> first pure) ?? NotFound\n```\n\nNeither throws
  by itself, and the right-hand side only runs if the left\none failed. Unlike `Validation`,
  which runs all independent checks and\ncollects every failure, a fallback chain
  succeeds on the first good answer.\n\n### Observing failures\nA constant error such
  as `? err503` throws the underlying failure away.\n`?<*` runs an effect on the failure
  first and passes the value through\nunchanged, so the next operator still sees it:\n\n```haskell\nrunQuery
  q ?<* logDbError ? err503\n```\n\nThe handler is a function of the failure (`CErr`),
  returns `m ()`, and\nruns only when there is a failure. Like `<*` it keeps the left
  value, and\nlike the other operators in `Railroad.Bifurcate` it never throws.\n\n##
  Gotcha: an empty collection passes\n\nOn a traversable, `?` and `??` check that
  **every** element succeeds\n(∀). Over an empty collection that holds vacuously,
  like `and []`:\n\n```haskell\npure ([] :: [Bool]) ? err403    -- succeeds, with
  []\n```\n\nThat surprises a permission check where \"no rows\" should mean \"not\npermitted\".
  Require at least one element first, with `?+` (∃), and\nchain the two checks:\n\n```haskell\n_
  <- runQuery (permitted uid asset) ? err500 ?+ err403 ? err403\n--                                    ^
  db error ^ >= 1 row ^ all True\n```\n\nThe cardinality operators are the other quantifiers,
  so the usual\nconditions are each one operator, and they chain:\n\n| Operator                            |
  Succeeds when                       | Logic                           |\n|-------------------------------------|-------------------------------------|---------------------------------|\n|
  `?` / `??` on `[Bool]`, `[Maybe a]` | every element succeeds              | ∀ x
  ∈ xs. succeeds x            |\n| `?+`                                | there is
  at least one element       | ∃ x ∈ xs                        |\n| `?!`                                |
  there is exactly one element        | ∃! x ∈ xs                       |\n| `?∅`
  \                               | there is no element                 | ¬∃ x ∈ xs
  \                      |\n| `?+` then `?`                       | there is one,
  and every one succeeds | (∃ x ∈ xs) ∧ (∀ x ∈ xs. succeeds x) |\n\n## More\nSee [`railroad.md`](railroad.md)
  for a deeper tour, or just read the\ncode at [`Railroad.hs`](src/Railroad.hs). It's
  a short file.\n\n## Contact\nFeel free to DM me on https://x.com/mastratisi97 .
  I find it\ninteresting to know if other people also have found this module\nuseful.\n"
