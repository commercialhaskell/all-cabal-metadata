changelog: |
  # Changelog for `gongju-text`

  All notable changes to the `gongju-text` package will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
  and this project adheres to the Haskell Package Versioning Policy (PVP).

  ## [0.1.0.0] — 2026-10-24

  ### Added
  - **`Gongju.Text.NonEmpty`**: Non-empty text refinements and safe splitting utilities using `mono-traversable`'s `NonNull`:
    - `toText`: Convert non-null text to strict text.
    - `fromText`: Safe constructor returning `Maybe (NonNull Text)`.
    - `wordsNE`: Split text into non-empty words as `Maybe (NonEmpty Text)`.
    - `linesNE`: Split text into non-empty lines as `Maybe (NonEmpty Text)`.
  - **`Gongju.Text.Stanza`**: Stanza splitting and parsing over polymorphic containers:
    - `Stanza`: Newtype wrapper around polymorphic text containers.
    - `stanzas`: Split strict text into stanzas of non-blank lines as standard lists (`[Stanza []]`).
    - `stanzasSeq`: Split strict text into stanzas collecting lines into `Data.Sequence.Seq`.
  - **`Gongju.Text.Layout`**: Lightweight indentation measurement and hierarchical block-nesting analysis:
    - `IndentedLine`: Line representation with measured leading whitespace indentation depth.
    - `Block`: Nested block structure with line content and recursive child sub-blocks.
    - `parseIndentedLines`: Measure space indentation depths across line lists.
    - `parseBlocks`: Build nested hierarchical block trees from indented lines.
  - Full test suite covering non-empty splits, stanza chunking, and hierarchical indentation parsing.
changelog-type: markdown
description: |
  # gongju-text

  **Structured text utilities, non-empty text collections, and layout parsing for Haskell.**

  `gongju-text` provides lightweight, robust text processing utilities leveraging non-empty refinements, polymorphic container targets, and layout-aware block and stanza parsing.

  ---

  ## Features

  1. **Non-Empty Text Refinements (`Gongju.Text.NonEmpty`):**
     - Safe construction and unwrap via `NonNull Text` (`fromText`, `toText`).
     - Non-empty word splitting (`wordsNE :: Text -> Maybe (NonEmpty Text)`).
     - Non-empty line splitting (`linesNE :: Text -> Maybe (NonEmpty Text)`).

  2. **Polymorphic Stanza Chunking (`Gongju.Text.Stanza`):**
     - Stanza grouping of lines separated by one or more blank or whitespace lines.
     - Container-polymorphic wrapper `Stanza container`.
     - List-based (`stanzas :: Text -> [Stanza []]`) and sequence-based (`stanzasSeq :: Text -> Seq (Stanza Seq)`) chunking.

  3. **Indentation and Block Parsing (`Gongju.Text.Layout`):**
     - Space-indentation measuring (`parseIndentedLines :: [Text] -> [IndentedLine]`).
     - Hierarchical indentation block tree construction (`parseBlocks :: [Text] -> [Block]`).
     - Zero-dependency layout analysis without full Markdown or YAML parser overhead.

  ---

  ## Quick Example

  ```haskell
  {-# LANGUAGE OverloadedStrings #-}

  import qualified Data.Text as T
  import Gongju.Text.NonEmpty (wordsNE)
  import Gongju.Text.Stanza (stanzas, unStanza)
  import Gongju.Text.Layout (parseBlocks, Block(..))

  main :: IO ()
  main = do
    -- 1. Non-empty word splitting
    print (wordsNE "hello   world")

    -- 2. Stanza grouping
    let doc = "First stanza line 1\nLine 2\n\nSecond stanza line 1\nLine 2"
    mapM_ (print . unStanza) (stanzas doc)

    -- 3. Indented block hierarchy
    let lines' = ["root", "  child 1", "  child 2", "    grandchild"]
    print (parseBlocks lines')
  ```

