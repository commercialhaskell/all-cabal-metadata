changelog: |
  2026-10-06  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.2.0

  * All the logical connections between two endpoints are now carried by a single QUIC connection (one stream
    each), rather than by one QUIC connection for each endpoint pairs. This has large performance implications:
    for multiple logical connections between two endpoints, `network-transport-quic` throughput increases by 50% over
    version 0.1.x, for a total of 3x throughput over `network-transport-quic`.
  * Breaking change: A new `socketOptions` field to `QUICTransportConfig`, allowing the user to control the UDP socket
    underlying a connection.

  2026-04-21  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.1.2

  * Eliminated a rare race condition that allowed the transport to read messages before
    marking the connection as open, violating the interface expectations.
  * Better handling of lost connections.
  * Fixed rare race condition in establishing connections.

  2026-01-01  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.1.1

  * Documentation and packaging improvements.

  2026-01-01  Laurent P. René de Cotret <laurent.decotret@outlook.com> 0.1.0

  * Initial release.
changelog-type: markdown
description: |
  # `network-transport-quic`

  This package provides an implementation of the `network-transport` interface, where networking is done via the QUIC protocol. The primary use-case for this package is as a Cloud Haskell backend.

  QUIC has many advantages over TCP, including:

  * No head-of-line blocking. Independent streams mean packet loss on one stream doesn't stall others;
  * Connection migration. Connections survive IP address changes, which is important when a device switches from e.g. WIFI to 5G;
  * Built-in encryption via TLS 1.3;

  In benchmarks, `network-transport-quic` performs better than `network-transport-tcp` in dense network topologies. For multiple logical connections between two endpoints, `network-transport-quic` can be 3x faster (in throughput) compared to `network-transport-tcp`.

  ## Usage example

  Provided you have a TLS 1.3 certificate, you can create a `Transport` like so:

  ```haskell
  import Data.List.NonEmpty qualified as NonEmpty
  import Network.Transport.QUIC (QUICTransportConfig(..), createTransport, credentialLoadX509)

  main = do
      let certificate = "path/to/cert.crt"
          key = "path/to/cert.key"

      creds <- credentialLoadX509 certificate key
      case creds of
          Left error_message -> error error_message
          Right credential -> do
              let config = QUICTransportConfig
                              { hostName = "my.hostname.com" -- or some IP address
                              , serviceName = "https" -- alternatively, some port number
                              , credentials = NonEmpty.singleton credential
                              , validateCredentials = True -- should be 'False' for self-signed certificate
                              }
              transport <- createTransport config
              ...
  ```

  There are tools online to help create self-signed TLS 1.3 certificates.
