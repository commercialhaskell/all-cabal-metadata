changelog: |
  # Changelog

  ## 0.5.2.0 — 2026-08-31

  ### Changed

  - Moved to the Keiro 0.15 cohort: `keiro ^>=0.15.0.0` and `keiro-core ^>=0.15.0.0`.
    Keiro 0.15.0.0's only breaking change is in `keiro-dsl`, which this package does not
    depend on; `keiro` and `keiro-core` are republished at the shared lockstep version with
    no source change. `keiki`, `kiroku-store`, `shibuya-core`, and `shibuya-kiroku-adapter`
    keep their existing bounds, because Keiro 0.15.0.0 requires the same versions of them
    that 0.14.0.0 did. This is a bounds-only change: no source changed and this package's
    API is unchanged.

  ## 0.5.1.0 — 2026-08-29

  ### Changed

  - Upgraded to the Baikai 0.6 cohort: `baikai ^>=0.6.0.0`,
    `baikai-claude ^>=0.6.0.0`, `baikai-effectful ^>=0.4.0.0`,
    `shikumi ^>=0.3.0.3`, and `shikumi-trace ^>=0.2.0.3`. Internal embedding
    construction now starts from Baikai's exported `emptyEmbeddingModel`, because
    Baikai 0.6 hides the evolvable `EmbeddingModel` constructor. The project also
    selects `http-client-tls ^>=0.4.0`, whose removal of a direct `crypton`
    dependency lets the cohort coexist with Kioku's `crypton ^>=1.1.4` requirement.
    Kioku's exported API and runtime behaviour are unchanged.

  ## 0.5.0.0 — 2026-08-22

  ### Breaking Changes

  - `parseMemoryEvent` and `parseSessionEvent` retain their public types but no longer accept Rei's
    retired `agent_memory_*`, `agent_session_*`, or `interactive_session_recorded` values. Kioku's
    native pre-partition events and `SessionResumed` payloads written before `force` remain
    supported. Consumers that still need a foreign wire format must own its finite migration codec;
    this narrowing ships on the 0.5.0.0 line, not as a 0.4 patch.
  - Raised the lockstep `keiro` and `keiro-core` bounds to `^>=0.14.0.0`. Keiro's exported outbox
    types gain the terminal rejected outcome and audit fields. `kioku-core` neither exhaustively
    matches nor directly constructs the affected types, so its source and exported API are
    unchanged; applications that also consume those Keiro outbox types must handle the new cases.

  ### Fixed

  - `applyArtifactMigration` now publishes a fully written temporary sibling through an atomic
    no-replace hard link. A destination created after the dry-run plan can no longer be overwritten:
    byte-identical content is accepted as already migrated, while differing content fails without
    changing either file. Published copies retain the historical source's permissions.
  - Workspace directory names and scope mirror filenames now consume one exported
    `slugWithDigest` implementation while preserving every existing persisted path byte for byte.
  - Distillation now refuses under-scoped work before it can read evidence, call an LLM, mutate a
    derived row, or write a mirror. L1 preflights `MemoryDistill`, `MemoryRecord`, and
    `MemoryForget`; L2/L3 timer fires require `MemoryDistill` and reject a context for the wrong
    space. Their shared partition, timer-outcome, and mirror-removal primitives replace the former
    duplicate handler implementations.
  - Memory lineage writes now require every `supersedes`, `supersededBy`, and merge-winner target to
    exist in the source memory's space before the first transition. Missing and cross-space targets
    both return `MemoryNotFound` without appending an event, while an accepted supersede or merge
    remains idempotent after its winner retires.
  - L1 watermark upserts now repair a row whose `memory_space_id` diverged from its globally unique
    session while keeping `last_turn_index` monotonic, so one successful pass restores cheap
    watermark skips instead of repeating extraction.
  - Timer dead letters and fire spans now attribute only an explicitly valid `memorySpaceId`.
    Missing, null, and unreadable ownership is reported as `unknown`; native pre-partition timer
    actions still execute in `kioku_legacy`, and the eight-attempt ceiling is unchanged.
  - Embedding startup and explicit backfills now apply the missing-or-stale content-hash predicate
    in both production SQL statements. Settled active rows no longer transfer their full content
    from PostgreSQL merely to be skipped in Haskell; the existing Haskell check remains as a race
    defense after candidate selection.
  - Vector capability detection now takes the projection schema and relation from
    `Kioku.Database.Schema` instead of repeating `kioku.memories` across catalog predicates. The
    separate bare `vector` type probe retains its search-path semantics.

  ### Changed

  - Memory and Session writes now consume the same permission/space/actor and legacy-space gates
    from `Kioku.Api.Access`, preserving their existing error constructors and check ordering while
    removing the two local policy copies.

  ## 0.4.1.0 — 2026-08-18

  ### Changed

  - Moved onto the Baikai 0.5 cohort: `baikai ^>=0.5.0.0`, `baikai-claude ^>=0.5.0.0`,
    `baikai-effectful ^>=0.3.0.3`, `shikumi ^>=0.3.0.2`, and `shikumi-trace ^>=0.2.0.2`. This is a
    bounds-only change — no `kioku-core` source changed and nothing it exports moved. Consumers
    pinned to Baikai 0.4 must move with it.

    `baikai-effectful` has no 0.5 release and never had a 0.4 one; 0.3.0.3 is the patch that widened
    its own `baikai` bound, so its version lags the rest of the cohort by design. `shikumi` and
    `shikumi-trace` are pinned at their newest patch rather than their series floor, because only
    those patches carry the Baikai 0.5 bounds; the earlier ones are tied to Baikai 0.4 and would
    give the solver a way to silently fall off the cohort.

    None of Baikai 0.5's breaking changes reach `kioku-core`. It touches only `Baikai.Auth`,
    `Baikai.Embedding`, `Baikai.Model`, `Baikai.Models.Generated`, `Baikai.Provider.Claude.Api`, and
    `Baikai.Provider.Registry`, none of which changed. `Response` gained an `evidence` field, but
    `kioku-core` only ever builds one in tests through the exported empty value rather than the
    record constructor, so the new field defaults in. It implements no provider, so the
    `doneTerminal`/`errorTerminal` signature change is unreachable; it decodes no `TraceEvent`, so
    the hand-written `FromJSON` is not a concern; and it stores no Baikai call identifier, so
    `newCallId`'s widening from 16 to 32 characters crosses no schema.

  ## 0.4.0.0 — 2026-08-17

  ### Breaking Changes

  - Moved onto the Keiro 0.13 / Kiroku 0.8 / Shibuya 0.9 cohort: `keiro ^>=0.13.0.0`,
    `keiro-core ^>=0.13.0.0`, `kiroku-store ^>=0.8.0.0`, `shibuya-core ^>=0.9.0.0`, and
    `shibuya-kiroku-adapter ^>=0.5.1.1`. A consumer that writes its own `Store` interpreter must
    handle Kiroku's new retention, checkpoint-initialization and visible-head constructors; one that
    matches exhaustively on `Kiroku.Store.Error.StoreError` must add arms for
    `TransientTransactionFailure` and `HistoryRetentionActive`; and one that matches on
    `Shibuya.Core.Ack.DeadLetterReason` must handle the new `ApplicationFailure` arm.
  - The library now builds with `-Werror=incomplete-patterns`. This is breaking only for a fork
    carrying its own partial matches; `kioku-core` itself was already clean.

  - Kioku's projections now live in the `kioku` PostgreSQL schema instead of `kiroku`, and every
    statement names them explicitly through the new internal `Kioku.Database.Schema` rather than
    resolving them through `search_path`. The event store is unchanged; Kioku still appends to the
    host's Kiroku streams. The runtime role needs `USAGE ON SCHEMA kioku` in addition to its
    existing table privileges.
  - Read-model identities advance with the relations they name: memory v2 -> v3
    (`kioku-memory-v3`), session v4 -> v5 (`kioku-session-v5`), turn v2 -> v3 (`kioku-turn-v3`).
    Keiro's registry stores no physical relation name, so the version bump is what makes a binary
    from the wrong side of `kioku/0012-relocate-projections-to-kioku-schema` fail closed with
    `ReadModelStaleSchema` instead of querying tables that have moved. `kioku-migrate up` reconciles
    the registry; a library embedder must call `Kioku.ReadModel.reconcileReadModelRegistry` itself
    before serving traffic.
  - pgvector capability detection now probes schema `kioku`, table `memories`. The `to_regtype`
    check for the `vector` type still resolves against the connection's search path, because the
    extension was deliberately not moved.

  ### Fixed

  - `Kioku.Worker.Failure.isTransientStoreError` now classifies `TransientTransactionFailure` as
    transient and `HistoryRetentionActive` as permanent. Both arms were absent: the first because
    the constructor is new in `kiroku-store` 0.8.0.0, the second since 0.7.0.0. Before 0.8.0.0
    PostgreSQL's `40001`/`40P01` reached this function as `UnexpectedServerError` and were called
    permanent, so a serialization failure or deadlock halted the embedding worker instead of
    retrying it.


  ### Breaking Changes

  - `recall` takes a `MemoryAccessContext` and a `RecallQuery` instead of a `RecallRequest`, and
    returns `Either RecallError [RecallHit]`. The target says what to search; the memory space comes
    from the context and nothing in the request can change it, so widening a target can never widen
    the tenancy. It is the one read that takes a whole context rather than a `MemorySpaceId`,
    because it is the only one that can be asked to widen.
  - `RecallRequest` and the new `legacyRecall` are **deprecated** wrappers for one release.
    `legacyRecall` maps the request's scope through `legacyRecallTarget` — so `ScopeGlobal` stays
    namespace-wide — refuses a request naming a space other than the one its context authorizes,
    and preserves the old `maxResults` edges (zero returns nothing; anything above 100 is clamped,
    which is unobservable because a fused result set holds at most 100 memories). See
    `docs/adr/an-explicit-recall-target-replaces-the-overloaded-scope.md` for the removal
    conditions.
  - `ExactScope (ScopeGlobal ns)` — ranked recall of the exact global bucket — **executes**, and
    returns the rows recorded with no entity scope rather than the whole namespace. Each of the
    three targets now compiles to its own SQL: the exact global bucket asks for
    `scope_kind IS NULL AND scope_ref IS NULL`, an exact entity compares both columns, and a
    namespace-wide target carries no scope clause at all. The single parameterised predicate they
    replace read NULL scope columns as "no scope filter", which is why the exact global bucket
    previously had to be refused. See
    `docs/adr/each-recall-target-gets-its-own-statement.md`.
  - `RecallError` lost `RecallExactGlobalUnsupported`. Its only remaining constructor is
    `RecallSpaceMismatch`, which only the deprecated `legacyRecall` can produce; `recall` keeps
    returning `Either` so that adding a refusal later is not a breaking change at every call site.
  - `RecallStrategy` moved to `kioku-api`'s `Kioku.Api.Recall`. `Kioku.Recall` re-exports it, so an
    existing import keeps working.
  - The recall test seams (`selectFtsCandidates`, `selectVectorCandidates`,
    `selectVectorCandidatesDiagnosed`) take a `ResolvedRecall` — a query bound to one authorized
    space with its target already compiled to a scope predicate. `resolveRecall` is the only way to
    build one, and it is total. `selectVectorCandidatesStmt`, `selectVectorCandidatesExactStmt`,
    `vectorCandidateQuery` and `memoryRecordColumns` are replaced by `vectorCandidateSql` /
    `ftsCandidateSql` and the `runVectorAnnCandidates` / `explainVectorAnnCandidates` /
    `explainVectorExactCandidates` / `explainFtsCandidates` transaction seams, which is how the
    recall harness stopped keeping its own copy of the vector SQL to `EXPLAIN`.
  - `Kioku.Distill.L1.FindMergeCandidates` receives the pass's `MemoryAccessContext` rather than its
    `MemorySpaceId`, and its error channel is `L1Error` rather than `ReadModelError`. `L1Error`
    gained `L1RecallRefused`, so a recall refusal cannot arrive at the consolidator as an empty
    candidate list.
  - **Behavior change:** `Kioku.Distill.L1.recallCandidates` draws merge candidates from the
    session's exact scope rather than from its whole namespace, so it agrees with
    `scopedScanCandidates` about which memories a session's atoms may merge into. A globally-scoped
    session used to draw candidates from every entity scope beside it — and could merge an atom into
    one, rewriting a memory that feeds a scene the session has nothing to do with. Entity-scoped
    sessions are unaffected; globally-scoped ones will report more `stored` and fewer `merged`.
  - Every memory and session command payload gained required fields: `memorySpaceId` and
    `actorPrincipal` on all of them, plus `ownerPrincipal` on `RecordMemoryData`,
    `StartSessionData`, and `RecordInteractiveSessionData`. Every construction site is a compile
    error until updated. The corresponding event payloads gained the same fields.
  - Every write function takes a `MemoryAccessContext` first and is named `*WithContext`:
    `recordWithContext`, `supersedeWithContext`, `archiveWithContext`, `updateTagsWithContext`,
    `updateConfidenceWithContext`, `mergeWithContext`, `startWithContext`, `awaitInputWithContext`,
    `resumeWithContext`, `forceResumeWithContext`, `completeWithContext`, `failSessionWithContext`,
    `recordInteractiveWithContext`, and `recordTurnWithContext`. The unsuffixed names remain as
    **deprecated** wrappers for one release; they take no context and refuse any payload naming a
    space other than `legacyMemorySpaceId`.
  - `distillSessionL1` takes a `MemoryAccessContext` first and demands the `MemoryDistill`
    permission before any LLM call.
  - `fireL1Timer`, `fireKiokuTimer`, `runKiokuTimerWorkerOnce`, and `drainKiokuTimers` take a
    `MemoryContextProvider`, because a worker discovers its own work and cannot arrive holding a
    context.
  - `MemoryWriteError` gained `MemoryNotPermitted`, `MemorySpaceMismatch`, and
    `MemoryActorMismatch`; `SessionWriteError` gained the three equivalents; `L1Error` gained
    `L1NotPermitted`.
  - An L1 timer payload that cannot be parsed now dead-letters instead of being ignored. Payloads
    written before this release parse fine and fire in the legacy space.
  - Every read function takes a `MemorySpaceId` first and returns nothing outside it:
    `Kioku.Memory.getMemoryRowById`, `getActiveRowsInNamespace`, `getActiveRowsByScope`,
    `getRowsBySession`, `getActiveRowsByType`, `getSupersessionChain`; `Kioku.Session.getById`,
    `getRecentInNamespace`, `getByScope`, `getByFocus`, `getByStartedRange`, `getChain`,
    `getDelegationChildren`, `getAwaitingByCorrelationKey`, `getTurns`; `Kioku.Recall.getById`,
    `getActiveByScope`, `getActiveInNamespace`, `getGlobal`, `getBySession`, `getByType`;
    `Kioku.Distill.L2.getScenesByScope` and `regenerateScene`; `Kioku.Distill.L3.getPersonaByScope`
    and `regeneratePersona`. Pass `memoryContextSpace` of the context that authorized the read.
  - `RecallRequest` gained a required `memorySpaceId` field.
  - Every read-model query record is now a record with named fields rather than a positional
    constructor, with `memorySpaceId` first: `MemoryByIdQuery`, `MemoriesByNamespaceQuery`,
    `MemoriesByScopeQuery`, `MemoriesBySessionQuery`, `MemoriesByTypeQuery`,
    `MemorySupersessionChainQuery`, and the nine session equivalents.
  - `MemoryRow`, `SessionRow`, `TurnRow`, `SceneRow`, and `PersonaRow` gained a leading
    `memorySpaceId` field.
  - `fireL2SceneTimer` and `fireL3PersonaTimer` take a `MemoryContextProvider`, like `fireL1Timer`.
  - Scene and persona timer ids and correlation ids now include the memory space, so two spaces
    sharing a namespace and scope no longer share one timer. Timers already scheduled keep their
    old ids and fire in the legacy space.
  - `runEmbeddingWorkerHost`, `embeddingWorkerProcessor`, and `embeddingHandler` take a
    `MemoryContextProvider`, like the timer handlers, because the embedding worker also discovers
    its own work.
  - `backfillMissingEmbeddings` takes an `EmbeddingWorkerEnv` and an `EmbeddingBackfillScope` in
    place of an `EmbeddingModel` and a dimension count.
  - `EmbedOutcome` gained `EmbedSpaceMismatch`.
  - `runKiokuTimerWorkerOnce` and `drainKiokuTimers` require `Tracing :> es`.
  - Scene and persona mirrors moved from `.kioku/{scenes,persona}/<slug>.md` to
    `.kioku/spaces/<space-dir>/{scenes,persona}/<slug>.md`. `sceneMirrorPath` and
    `personaMirrorPath` keep their signatures — the space comes from the row — but return different
    paths. Run `kioku migrate-artifacts` to relocate existing files.
  - A cross-space id on a write path now returns `MemoryNotFound` / `SessionNotFound` rather than
    reaching the aggregate and returning `MemoryCommandRejected`. That closes the existence oracle
    the previous release documented: an id in another space is now indistinguishable from one that
    was never written.
  - Read-model registry identities advanced: memory models to v2 / `kioku-memory-v2`, session models
    to v4 / `kioku-session-v4`, turns to v2 / `kioku-turn-v2`. `kioku-migrate` reconciles them; a
    host applying migrations as a library must call `reconcileReadModelRegistry` itself.

  ### Added

  - `Kioku.Partition` — the single place that decides what a payload written before memory spaces
    means: the legacy space, and a legacy-marked agent label. No codec invents its own default.
  - `Kioku.Distill.Timer.L1TimerPayload`, which carries the memory space a scheduled distillation
    pass belongs to.
  - `Kioku.Workspace` — the per-space artifact layout and the migration of the pre-partition tree.
    A memory space id is validated for a database column rather than for a path, so the directory
    component is a sanitised prefix plus a digest of the exact id: `..` cannot escape
    `.kioku/spaces`, and two ids that differ only in case cannot share a directory.
  - `kioku migrate-artifacts` — a dry run by default; `--apply` copies, never moves, and refuses a
    destination whose content differs.
  - `kioku worker --backfill --space ID` — an embedding backfill bounded to one memory space. The
    default stays every space.
  - A `kioku.timer.fire` span per fire attempt, carrying `kioku.memory_space_id`, the timer id, the
    attempt count, a bounded `kioku.timer.outcome`, and the failure reason. Metrics gained no space
    or principal label and must not: a space is caller-supplied text.
  - Aggregate state carries the memory space, and every non-creation edge guards on it, so a command
    naming a different space is refused by the state machine rather than by a read-model precheck.

  ### Compatibility

  - Events already on disk keep decoding. They land in `legacyMemorySpaceId`; an old free-text
    `agentId` is recorded as a legacy-marked label and never rewritten into a directory principal;
    an event that recorded no agent is `UnattributedPrincipal`. Encoders emit only the new form.
  - Reads are partitioned by the schema. Every read-model table carries a non-null
    `memory_space_id`, backfilled to `kioku_legacy`, and every statement names it. An upgraded
    single-space deployment sees exactly what it saw before. See
    `docs/user/upgrading-to-memory-spaces.md`.
  - Workspace mirrors are partitioned. Files written before this release stay at `.kioku/scenes`
    and `.kioku/persona`, which nothing writes to any more; `kioku migrate-artifacts` reports and
    relocates them. The one exception is deletion: emptying a scope in the legacy space unlinks its
    historical mirror too, because forgotten content surviving on disk is a retention failure
    rather than a stale cache.

  ## 0.3.0.0 — 2026-08-05

  ### Breaking Changes

  - Moved onto the Keiki 0.9 and Keiro 0.11 cohort: `keiki ^>=0.9.0.0`, `keiro ^>=0.11.0.0`, and
    `keiro-core ^>=0.11.0.0`. Kioku no longer builds against Keiki 0.4 or Keiro 0.4, and there is no
    version of `kioku-core` that spans both cohorts.
  - A consumer that links `kioku-core` now links Keiki 0.9's sealed constructor API. `InCtor` and
    `WireCtor` construction and record update are behind read-only patterns: manual behavior must go
    through `unavailableInCtor` / `unavailableWireCtor`, and constructors that need trusted
    structural evidence must use Keiki's Generic or Template Haskell producers. `mkWireCtor`,
    `mkWireCtor0`, `mkInCtor` and `mkInCtor0` are deprecated. Kioku's own aggregates already use the
    trusted TH path and needed no change, but a consumer that hand-writes constructors alongside
    Kioku's does.
  - Keiki 0.9 classifies replay head identity structurally and rewrites the default
    inversion-ambiguity analysis, so `validateEventStream` and `mkEventStream` may report a
    different conservative warning set after recompilation. `Kioku.Memory.EventStream` and
    `Kioku.Session.EventStream` both assemble through `mkEventStreamOrThrow`, which turns a warning
    into a runtime `error` at first use rather than a compile failure; both still assemble clean
    under 0.9. A consumer that builds its own streams should re-run its startup path, not just
    rebuild.

  ### Changed

  - No Kioku source change was required by the upgrade. Keiro's 0.5–0.11 releases are almost
    entirely `keiro-dsl` work, which Kioku does not depend on; the Keiro runtime surface Kioku
    imports is unchanged across the whole range.
  - Event payloads are unaffected. The `keiki-codec-json` wire format is unchanged across 0.4 → 0.9,
    and `Kioku.CodecCompatSpec` continues to decode literal pre-upgrade payloads under the new
    cohort.
  - Existing snapshots stay valid. Keiki's `Keiki.Shape` changed only by adding a
    `CanonicalTypeName Natural` instance, and no Kioku register slot uses `Natural`, so
    `regFileShapeHash` and `stateShapeHash` are unchanged and there is no snapshot rebuild.
  - The rest of the cohort does not move: `kiroku-store`, `shibuya-core`, `shibuya-kiroku-adapter`,
    `baikai`, `baikai-claude`, `baikai-effectful`, `shikumi` and `shikumi-trace` keep the bounds
    they had in 0.2.0.0.

  ## 0.2.0.0 — 2026-07-30

  ### Breaking Changes

  - Moved onto the Keiki 0.4 and Keiro 0.4 cohort: `keiki ^>=0.4.0.0`, `keiro ^>=0.4.0.1`, and
    `keiro-core ^>=0.4.0.1`. Kioku no longer builds against Keiki 0.2 or Keiro 0.3, and there is
    no version of `kioku-core` that spans both.
  - Keiro 0.4 tightens validated event-stream assembly: `mkEventStreamOrThrow` now rejects a codec
    whose schema version, event tags, or upcaster chain fail `mkCodec`, and it does so at
    evaluation time. Kioku's `memoryEventStream` and `sessionEventStream` both satisfy the stricter
    contract, but a consumer that builds its own streams alongside Kioku's will see the new
    validation at startup.
  - A consumer that links `kioku-core` now links Keiro 0.4's API changes directly, including the
    snapshot `state_shape_hash` invalidation and the timer and workflow-children changes. Kioku
    itself calls none of them — both of its event streams set `snapshotPolicy = Never` and
    `stateCodec = Nothing`, and it has no durable workflows — but the types are on the consumer's
    path.
  - Moved onto the Baikai 0.4 / Shikumi 0.3.0.1 cohort: `baikai ^>=0.4.1.0`,
    `baikai-claude ^>=0.4.0.1`, `baikai-effectful ^>=0.3.0.2`, `shikumi ^>=0.3.0.1`, and
    `shikumi-trace ^>=0.2.0.1`. The Shikumi bound names an exact patch level deliberately:
    `shikumi-0.3.0.0` is pinned to the Baikai 0.3 series and would let the solver fall off the
    intended cohort silently.

  ### Changed

  - The connection-settings path is unchanged. `Kioku.App.AppEnv.connectionSettings` still carries
    a `Kiroku.Store.Connection.ConnectionSettings` and `runAppIO` still acquires the store resource
    from it; `kiroku-store` does not move major versions in this cohort.

  ### Added

  - Added `Kioku.CodecCompatSpec` to the test-suite: thirteen literal pre-upgrade JSON payloads —
    one per `MemoryEvent` and `SessionEvent` constructor — asserted to decode under the new cohort,
    plus two tests pinning the native and legacy arms of `parseMemoryEvent`'s fallback.

  ## 0.1.0.0 — 2026-07-14

  ### Added

  - Added event-sourced memory commands, read models, merge and forget behavior, full-detail reads,
    and scoped active-memory lookup.
  - Added event-sourced sessions with turns, delegation lineage, awaiting/resume state, scoped reads,
    and aggregate-enforced identity and correlation invariants.
  - Added hybrid full-text and pgvector recall using Reciprocal Rank Fusion, vector capability and
    dimension checks, direct memory lookup, and continuous or one-shot embedding workers.
  - Added L1 memory extraction and consolidation, L2 scene regeneration, and L3 persona distillation
    through Shikumi programs, durable timers, and worker dispatch.
  - Added code-driven read-model registration and reconciliation plus compatibility decoding for
    legacy Rei events.

  ### Fixed

  - Prevented selective scopes from starving the approximate-nearest-neighbor recall channel and
    ordered vector candidates by distance before fusion.
  - Made atom and scope identities deterministic and collision-safe, surfaced extraction and
    consolidation failures, and validated LLM outputs before accepting them.
  - Propagated memory forget and confidence changes through scene and persona artifacts.
  - Made session lineage validation cycle-safe and returned conflicts for non-idempotent command
    replays instead of reporting false success.
  - Classified embedding failures into retry, dead-letter, and halt outcomes and wired recall-based
    merge candidates into timer processing.

  ### Changed

  - Updated the application environment for Keiro 0.3 and Kiroku Store 0.3: it now carries connection
    settings, acquires a `KirokuStoreResource`, and explicitly registers read models at startup.
  - Removed the unused `embedBatched` API, whose implementation did not perform batched requests.
