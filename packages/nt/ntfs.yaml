changelog: |
  # Changelog

  All notable changes to this project are documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the
  [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [Unreleased]

  ## [0.1.0.0] - 2026-11-27

  ### Added

  - Initial library skeleton with common NTFS domain types.
  - Pure parser for the NTFS boot sector and volume geometry helpers.
  - `NTFS.Volume` with boot-sector loading, cluster offsets and MFT record reads.
  - `NTFS.MFT.Record` with header parsing, update sequence fix-up and raw attribute slices.
changelog-type: markdown
description: |
  # ntfs

  A Haskell library for reading NTFS disk images. The goal is to build up from
  the volume structure: boot sector, MFT records, attributes and runlists first,
  then a high-level file system API.

  ## Status

  Early development. The boot sector parser and volume-level MFT record reads
  are available so far.

  ## Building

      cabal build
      cabal test
