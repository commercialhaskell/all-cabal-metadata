changelog: |
  # Revision history for Ansiform

  > Formerly Vis. The 0.4.0 release renames the package and the module namespace.

  ## Functional Versions

  ### 0.7.8.5 -- 2026-10-20
  * Added PVP upper bounds to the directory dependency of the test suite.

  ### 0.7.8.4 -- 2026-10-18
  * Finalized the package metadata with the author name and the project maintainer alias.
  * Documented the Hackage candidate workflow for verification before publication.

  ### 0.7.8.3 -- 2026-10-17
  * Removed docs/design-notes.md; the original notes remain available in the Git history.

  ### 0.7.8.2 -- 2026-10-17
  * Changed the Groups shortcut for the philosopher prompt from E to C.
  * Added a blank line below the prompt and removed the choose shortcut from the prompt page.
  * Removed the local secrets file path from the release guide and repository history.
  * Removed personal SSH paths from the release guide and reviewed the documentation, translating the remaining design notes.

  ### 0.7.8.1 -- 2026-10-17
  * Merged the Groups prompt message and input line into a single footer line.

  ### 0.7.8.0 -- 2026-10-17
  * Added readLineAt and readLineAtOn to Ansiform.Input for prompts printed inside a page.
  * The demo Groups prompt now lives in the footer, above the command keys, so nothing is printed below the footer.
  * Fixed the demo losing immediate key input after returning from a philosopher article.
  * Translated the demo prompt and the E key label to English.

  ### 0.7.7.1 -- 2026-10-17
  * Updated the README dependency list and documentation index.
  * Recorded the initial push and roadmap completion in the release checklist.

  ### 0.7.7.0 -- 2026-10-17
  * Added withLineInput and readLine to Ansiform.Input.
  * Replaced the Cicero and Locke shortcuts with an E Escolher prompt that accepts any philosopher number.
  * Back from a philosopher article now returns to the Groups screen.

  ### 0.7.6.0 -- 2026-10-17
  * Added dedicated demo screens and articles for Cicero and Locke.
  * Added C and L shortcuts to the Groups footer.
  * Added a CI matrix with GHC 9.2.8 and GHC 9.14.1.
  * Documented direct command-line Hackage tokens and SSH setup for GitHub.

  ### 0.7.5.2 -- 2026-10-17
  * Renamed CHANGELOG.md back to ChangeLog.md, following the Hackage convention.
  * Documented the Hackage token key at the top level of ~/.cabal/config.

  ### 0.7.5.1 -- 2026-10-17
  * Documented every public function and type with Haddock comments; all public modules report 100% coverage.
  * Changed the default theme footer to italic white for readability.
  * Documented Hackage and GitHub credential configuration in docs/releasing.md.

  ### 0.7.5.0 -- 2026-10-17
  * Added Borders with ASCII, light, heavy and double styles.
  * Added the printerTableBordered and printerGroupsBordered families.
  * Added the GitHub repository metadata and configured the origin remote.
  * The demo Rich screen now uses a light bordered table and unknown keys are ignored without a message.

  ### 0.7.4.0 -- 2026-10-17
  * Added Ansiform.Theme with Theme and defaultTheme.
  * Added blockMenuStyle for menu keys that use a Style instead of a Color.
  * Updated the demo header, footer, menus, rules and simple table to use the theme.
  * Fixed the demo Tables column width so Tchaikovsky is readable.
  * Added docs/theme.md.

  ### 0.7.3.0 -- 2026-10-17
  * Added Ansiform.Table with per-column alignment, maximum widths and ellipsis truncation.
  * Added printerTableFormat, printerTableFormat', printerTableLimitedFormat and printerTableLimitedFormat'.
  * Updated the demo Tables screen to right-align numeric columns and truncate long composer names.
  * Added docs/table-format.md.

  ### 0.7.2.0 -- 2026-10-17
  * Added handle-aware runners: startOn, drawOn, redrawOn, amendOn, replaceOn and their variants.
  * Added runPrinterOn, runPrinterDefaultOn and runPrinterDefaultOn' for writing to a specific handle.
  * Added Ansiform.Render with renderPage, renderSection and renderPrinter.
  * Added docs/render.md and expanded the demo article for the Article screen.

  ### 0.7.1.0 -- 2026-10-17
  * Added Ansiform.Input with withImmediateInput and readKey, making single-key interaction the standard library pattern.
  * Updated the demo to use the shared input API and restore terminal state automatically.
  * Added Unicode-aware display widths through Ansiform.Width, used for wrapping, alignment, lists and tables.
  * Added docs/input.md and updated the README quick start, pages, architecture, content and roadmap.

  ### 0.7.0 -- 2026-10-17
  * Added the ColorMode setting with Auto, Always and Never.
  * Auto suppresses ANSI styles when stdout is not a terminal, when NO_COLOR is set or when TERM is dumb.
  * Added the colorMode modifier and the autoColors, alwaysColors and neverColors shortcuts.
  * Added regression tests for style suppression and forced styling.
  * Renamed ChangeLog.md to CHANGELOG.md (reverted in 0.7.5.2).

  ### 0.6.1 -- 2026-10-17
  * Added the GitHub Actions CI workflow.
  * Added docs/releasing.md with the Hackage and GitHub checklist.
  * Added docs/roadmap.md with prioritized feature suggestions.
  * Added module-level Haddock headers to the public modules.

  ### 0.6.0 -- 2026-10-17
  * Renamed the internal vis* builders to form* (formItem, formBlock, formGroup, ...).
  * Renamed the low-level style helpers to descriptive names (applyStyle, resetStyle, styleCommands, colorCommands, formatCommands, setBackground, swapBackground).
  * Renamed the public visNumber to formNumber.
  * Updated the demo, tests and docs for the new builder names.

  ### 0.5.0 -- 2026-10-17
  * Removed the Vis prefix from all public types.
  * Renamed VisItem to Item, VisBlock to Block, and so on, including Color, Format, Style, Printer, Section, Page, Settings, Config, State and Sample.
  * Updated the demo, tests, README and docs for the new type names.
  * Kept the internal vis* builder helpers as implementation details.

  ### 0.4.0 -- 2026-10-17
  * Renamed the package to ansiform and the module namespace to Ansiform.
  * Changed the license from GPL-3.0-only to MIT.
  * Updated the README, docs, demo and tests for the new name.
  * Kept the Vis* type names for now; removing the prefix is future work.

  ### 0.3.5 -- 2026-10-17
  * Modernized the Cabal setup to cabal-version 3.0.
  * Added a common stanza and a cabal.project file.
  * Removed the obsolete Setup.hs and switched to the SPDX license identifier.
  * Documented the existing Hackage Vis package and recommended ansiform for publication.

  ### 0.3.4 -- 2026-10-17
  * Documented the name rationale and its relationship to vis-network.js.
  * Added a disambiguation note to the README.

  ### 0.3.3 -- 2026-10-17
  * Fixed printLineCenter so blocks respect the minimum space and never overlap.
  * Made the demo menu use the same shortcut presentation as the footer.
  * Split the demo footer commands into two rows to keep long labels readable.

  ### 0.3.2 -- 2026-10-17
  * Reflowed the README and documentation to remove hard wrapping.
  * Added a blank line above the demo's main header line.
  * Changed the demo to read single keys without a prompt or Enter.
  * Fixed the Exit key highlight in the demo menu.
  * Documented the evaluation of the proposed monadic Printer and Section interface.

  ### 0.3.1 -- 2026-10-17
  * Removed the extra solid bar from the demo header, which covered part of the second line.
  * Made the demo footer shortcuts functional with an interactive screen loop.
  * Documented the decision to defer the Text and Seq migrations.

  ### 0.3.0 -- 2026-10-17
  * Revival release: removed Example and internal modules from the public Vis module.
  * Added public Vis.Number and Vis.Sample modules.
  * Added the vis-demo executable and the vis-test suite.
  * Made paragraph wrapping, list layout and group layout total for empty and narrow inputs.
  * Fixed a division by zero in group overflow handling.
  * Preserved section line counts across chained replace calls.
  * Added documentation in docs/ and rewrote the README as an index.
  * Enabled -Wall and cleaned compiler warnings.

  ## Early Versions

  ### 0.2.2.7 -- 2020-05-29
  * Implementation of Sample instance for VisNumber.
  * Refining of Sample class and instances for all types.

  ### 0.2.2.5 -- 2020-05-23
  * Got rid of the Result type and module.
  * Reversal of Show instances to default, creation of Sample class.
  * Implementation of sample functions.
  * Created Printer for single Item.

  ### 0.2.2.1 -- 2020-05-21
  * Implemented minimum number of lines for Sections.

  ### 0.2.2.0 -- 2020-05-20
  * Finished amend functionality for VisPage and workflow.
  * Made Settings update at each redraw.
  * Created the new VisConfig type for internal use.
  * Made VisSettings the user exposed settings type.
  * Made the basic Run functions work with configs, not settings.
  * Created Draw module and internal State module.

  ### 0.2.1.4 -- 2020-05-19
  * Exposed the basic builders.
  * Reworked type runners to deal with IO separately.
  * Defined VisState type and top level functionality.
  * Created VisResult type to associate printed line numbers with Sections.
  * Separated VisPage internal functionality.

  ### 0.2.0.9 -- 2020-05-09
  * Gave up on verbose mode.
  * Moved VisPrinter type to internal module.
  * Reworked Show instances for most types and VisPrinter.
  * Reworked Show instance for VisSection and moved type to internal module.

  ### 0.2.0.5 -- 2020-05-08
  * Made VisItem remove non-printable characters.
  * Creation of Internal folder to separate internal modules.
  * Creation of Show Instances to implement the Verbose mode.
  * Implementation of Settings type and functions.
  * Improved Section type to calculate the total printed lines.

  ### 0.2.0.0 -- 2020-05-07
  * Major change so VisPrinter returns the number of lines printed.
  * Major refactoring and module splits.

  ### 0.1.1.0 -- 2020-04-25
  * VisPrinter functionality implemented.

  ### 0.1.0.5 -- 2020-04-19
  * Restarted project.
  * Implemented basic content types and styles.

  ### 0.1.0.0 -- 2018-06-12
  * First version, very basic functionality, not commited to VCS.
changelog-type: markdown
description: |
  # Ansiform

  [![CI](https://github.com/Tralen/ansiform/actions/workflows/ci.yml/badge.svg)](https://github.com/Tralen/ansiform/actions/workflows/ci.yml)
  [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://github.com/Tralen/ansiform/blob/master/LICENSE)

  Ansiform is a small Haskell library for building visual command line interfaces. It provides a declarative format DSL for styled text, rules, aligned lines, lists, groups, tables, paragraphs and multi-section pages.

  Builders are pure and produce immutable values. A thin drawing layer writes those values to the terminal and keeps track of how many lines were printed, so a page can be amended, replaced or redrawn in place.

  > **Formerly known as Vis.** Ansiform is a terminal formatting library, unrelated to the JavaScript `vis-network` graph visualization library or to the Hackage package [`Vis`](https://hackage.haskell.org/package/Vis) (3D graphics). See [Naming](docs/naming.md).

  Current version: **0.7.8.5**.

  Repository: <https://github.com/Tralen/ansiform>.

  ## Features

  - ANSI colors, bold, italic and underline, with automatic suppression on non-TTY output, `NO_COLOR` and `TERM=dumb`.
  - Immediate single-key input: a key press changes the screen without Enter.
  - Line input for prompts and numeric selection, including prompts printed inside a page and typed in place.
  - Unicode-aware display widths for alignment, wrapping, lists and tables.
  - Rendering to any `Handle` or to a `String` for embedding and golden tests.
  - Per-column table alignment, maximum widths and truncation with an ellipsis.
  - Optional ASCII, light, heavy or double box borders for tables and groups.
  - A reusable `Theme` record for consistent headers, footers, menus and tables.
  - Horizontal rules, solid backgrounds, offsets and padding.
  - Single-line and multi-line alignment.
  - Columns, lists, groups, simple tables and rich tables.
  - Paragraph and article wrapping with styled fragments.
  - Multi-section pages with amend, replace and redraw support.
  - Errors as data: malformed tables return `Nothing` instead of throwing.
  - Small dependency footprint: `ansi-terminal`, `terminal-size`, `split`, `transformers` and `directory`.

  ## Quick start

  ```haskell
  module Main where

  import Data.Char (toLower)
  import Ansiform

  main :: IO ()
  main = withImmediateInput $ do
    state <- start examplePage defaultSettings
    loop state

  loop :: State -> IO ()
  loop state = do
    key <- readKey
    case fmap toLower key of
      Just 'b' -> draw bodyPage state >>= loop
      Just 'h' -> draw examplePage state >>= loop
      Just 'x' -> pure ()
      _ -> loop state

  examplePage :: Page
  examplePage = page [header, body]

  bodyPage :: Page
  bodyPage = page [body]

  header :: Section
  header = sectionTopRule 1 (rule '=' (bold black'))
    [ printerSolidLineCenter 0 1 blue
        [ blockSimple "My Program" (bold white') ] ]

  body :: Section
  body = sectionBodyRule 1 (rule ':' (bold black'))
    [ printerLeft 2 (blockSimple "Hello, world!" styleDefault) ]
  ```

  Pressing `B` or `H` switches pages immediately; `X` exits. There is no prompt and no Enter.

  ## Build, test and run

  ```sh
  cabal build
  cabal test
  cabal run ansiform-demo
  ```

  `ansiform-demo` is an interactive gallery. Press the keys shown in the footer; the screen changes immediately, without a prompt or Enter. `B` returns to the menu, `R` redraws the current screen and `X` exits.

  ## Documentation

  - [Architecture](docs/architecture.md): module layout, invariants and the pure/IO boundary.
  - [Content](docs/content.md): items, blocks, groups, tables, paragraphs and their builders.
  - [Styles](docs/style.md): colors, formats and reusable text styles.
  - [Theme](docs/theme.md): reusable styles for headers, footers, menus and tables.
  - [Printers](docs/printers.md): every printer function and its arguments.
  - [Table formatting](docs/table-format.md): per-column alignment, maximum widths, truncation and borders.
  - [Sections](docs/sections.md): grouping printers and reserving minimum line counts.
  - [Pages and drawing](docs/pages.md): pages, state and the drawing lifecycle.
  - [Input](docs/input.md): immediate and line input, and the standard interaction loop.
  - [Render](docs/render.md): rendering pages, sections and printers to a `Handle` or a `String`.
  - [Settings](docs/settings.md): width, spacing and group overflow configuration.
  - [Demo](docs/demo.md): what the executable showcases.
  - [Naming](docs/naming.md): name rationale and disambiguation.
  - [Releasing](docs/releasing.md): Hackage and GitHub publication checklist.
  - [Roadmap](docs/roadmap.md): prioritized feature suggestions.

  ## Design principles

  1. **Immutable values.** Every public builder returns a new value; nothing is mutated after creation.
  2. **Pure core.** Layout, wrapping and table validation are pure functions. Only the drawing layer performs IO.
  3. **Errors as data.** Table builders return `Maybe Table`. There are no exceptions in the public API.
  4. **Immediate interaction.** The standard interaction is a single key press, handled by `Ansiform.Input` without Enter.
  5. **Reusable components.** Screens are assembled from shared builders such as `header`, `footer` and `rule`, keeping behavior and theming consistent.
  6. **Explicit versioning.** The package follows the PVP and every release is recorded in [ChangeLog.md](ChangeLog.md).

  ## License

  MIT. See [LICENSE](LICENSE).
