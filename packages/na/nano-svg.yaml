description: "# nano-svg\r\n\r\nA fast SVG parser for Haskell. Bytes in, a flat array
  of shapes out.\r\n\r\nFor geometry renderers, rasterizers and UI toolkits that need
  SVG icons and\r\nstatic vector artwork as paths. The library parses and normalizes
  geometry;\r\nthe caller handles rendering and viewport mapping.\r\n\r\n## Quick
  start\r\n\r\n`parseSvg :: ByteString -> Either String Document` reads UTF-8 SVG
  directly\r\nfrom a strict `ByteString`—no text-decoding step needed.\r\n\r\n```haskell\r\nimport
  Graphics.NanoSvg\r\nimport qualified Data.ByteString as BS\r\n\r\nmain :: IO ()\r\nmain
  = do\r\n  bytes <- BS.readFile \"clock.svg\"\r\n  case parseSvg bytes of\r\n    Left
  err -> putStrLn err\r\n    Right doc -> print (documentSize doc, length (documentShapes
  doc))\r\n```\r\n\r\nA `Document` contains the viewport size, the `viewBox` and a
  `SmallArray` of\r\n`Shape`s in paint order. Each shape carries its path, the `Matrix`
  that maps\r\nit into the `viewBox`, and its resolved `Style`. Relative path commands,\r\nshorthands
  and basic shapes become a common set of absolute path segments.\r\nThe renderer
  walks segments without resolving an SVG tree, style inheritance\r\nor a transform
  stack. It still tracks the current point and subpath start.\r\n\r\n## SVG scope\r\n\r\nSupports
  paths, rectangles, circles, ellipses, lines, polylines and polygons;\r\ngroups and
  `use` references; fills, strokes and inline styles; and SVG\r\ntransforms. The focus
  is the static geometry used in icons and vector assets.\r\n\r\nNot supported: gradients,
  patterns and other paint servers; `text`;\r\n`clipPath`, `mask` and `filter`; `marker`;
  CSS in a `style` element or an\r\nexternal sheet, and so `class` selectors; animation;
  and\r\n`preserveAspectRatio`, which is left to the renderer.\r\n\r\nUnknown elements
  are skipped along with their children. Group opacity is\r\nmultiplied into each
  shape rather than preserved as a compositing group.\r\nNested `svg` and referenced
  `symbol` elements do not establish viewports.\r\n\r\n## Modules\r\n\r\nThe parsing
  modules can also be used independently for individual path,\r\ntransform, color
  or length values.\r\n\r\n| Module | Purpose |\r\n| --- | --- |\r\n| `Graphics.NanoSvg`
  | `parseSvg`, and the types re-exported |\r\n| `Graphics.NanoSvg.Types` | the document
  model, on its own |\r\n| `Graphics.NanoSvg.Xml` | the tree, entity decoding, `DOCTYPE`
  and prefix stripping |\r\n| `Graphics.NanoSvg.Path` | path and transform parsing;
  basic shapes as segments |\r\n| `Graphics.NanoSvg.Color` | paints, colors, the keyword
  table |\r\n| `Graphics.NanoSvg.Number` | numbers, lengths, number and point lists
  |\r\n\r\n## Build\r\n\r\n```\r\ncabal build\r\ncabal test\r\ncabal haddock --open\r\n```\r\n"
