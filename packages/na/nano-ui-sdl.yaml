changelog: "# Changelog\n\n## Unreleased\n\n### Added\n\n- Shaped text. Lines are
  laid out by SDL_ttf and HarfBuzz with ligatures,\n  contextual forms and marks,
  and drawn glyph by glyph from the atlas.\n  Arabic, Hebrew, Devanagari, CJK and
  other scripts the UI font lacks are\n  drawn from installed fallback fonts (Noto,
  DejaVu, and the Windows and\n  macOS system fonts), found the first time a text
  needs them.\n\n### Changed\n\n- Bold and italic are drawn by the core's synthetic
  weight and slant over the\n  regular face, since SDL_ttf's style flags do not match
  the glyph images\n  shaped text draws. Text measurement uses the shaped width, so
  layout and\n  drawing agree.\n- Fallback fonts for other scripts are shared across
  font sizes and opened\n  only when a text needs a character they cover. Each coverage
  font is\n  opened once a session as a probe, and each size draws from a copy that\n
  \ shares the probe's file. Resolving 40 sizes that draw CJK, Arabic and\n  Devanagari
  opens 59 file descriptors instead of 959.\n- A shaped line is shaped once and shared
  by measuring, preparing and\n  drawing, and the font directories are walked once
  per process.\n- No longer depends on `vector`.\n- The framebuffer, glyph rasterization
  and snapping follow the window's\n  pixel density (`SDL_GetWindowPixelDensity`)
  instead of its display scale.\n  On Windows window coordinates are already pixels,
  so at 125% scaling every\n  frame drew 1.56 times the window's pixels and shrank
  them back when\n  presenting. Frames now draw at the window's size and text is no
  longer\n  resampled. Sizes are unchanged; geometry snaps to whole pixels rather\n
  \ than to the 1.25x grid, so edges can move by up to half a pixel.\n- The retained
  framebuffer is allocated in 256 pixel blocks and reused while\n  the window fits,
  so a resize drag no longer creates a new render target\n  for every pixel the border
  moves.\n\n### Fixed\n\n- A resize drag no longer trails the border by a step. Each
  step was drawn\n  on `SDL_EVENT_WINDOW_RESIZED`, before the renderer had resized
  its swap\n  chain, so it went to the old-size backbuffer and showed cropped or with
  a\n  bare strip; frames are now drawn on the pixel size change that follows.\n\n###
  Removed\n\n- `newSdlContext`; the runners create their own context.\n- `isDebugActive`,
  `newSdlDebugSampler`, `readSdlDebug` and `takeDebugLive`\n  from `NanoUI.Backend.Sdl`.
  The core event loop samples debug timing; read\n  the readout with `askSdlDebug`.\n-
  The font debugging exports `saveFontRenderText`, `queryFontKerning`,\n  `queryFontPairKerning`,
  `debugFontPair` and `dumpFontLayout`.\n- `NanoUI.Sdl.Session` is no longer an exposed
  module.\n\n## 0.1.0.1 -- 2026-09-18\n\n* \n\n## 0.1.0.0\n\nFirst release.\n"
changelog-type: markdown
description: |
  # nano-ui-sdl

  SDL3 window backend for [nano-ui](https://github.com/goolord/nano-ui). Text is
  shaped with SDL_ttf and HarfBuzz, drawn from the bundled Inter font or installed
  fonts looked up by family name, with fallback fonts for other scripts. The
  backend also opens native file dialogs.

  ```haskell
  {-# LANGUAGE OverloadedStrings #-}

  import NanoUI
  import NanoUI.Backend.Sdl (defaultSdlOptions, runSdlApp)

  main :: IO ()
  main = runSdlApp defaultSdlOptions (label "Hello")
  ```

  `runSdlAppReduce` runs a view against a model and an update function, for use
  with `NanoUI.Emit`. `SdlOptions` sets the window, fonts, font size, theme, and
  vsync.

  ## Running

  ```sh
  cabal run nano-ui-sdl-anim     # tween and spring animations
  cabal bench nano-ui-sdl-bench  # runFrame and SDL drawing timings
  ```

  ## Requirements

  SDL3 and SDL3_ttf 3.2 or later, and pkg-config. The backend is behind the `sdl`
  flag, which is on by default.

  On x86-64, `-f simd` compiles the draw-batch culler with AVX2. A binary built
  that way needs an AVX2 CPU.
