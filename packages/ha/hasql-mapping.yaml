changelog: |
  # v0.1.1.0

  - Added `Hasql.Mapping.IsTransaction` and `Hasql.Mapping.IsSession`, completing the class family alongside `IsScalar` and `IsStatement`.
  - Added `IsStatement.toSession`, `IsStatement.toPipeline`, `IsStatement.toTransaction`, `IsTransaction.toSessionWithUnboundedRetries` and `IsTransaction.toSessionWithoutRetries` runners.
  - New dependency: `hasql-transaction ^>=1.2.3`.

  # v0.1.0.2

  - Added support for Hasql 2.0.
changelog-type: markdown
description: |
  # hasql-mapping

  [![Hackage](https://img.shields.io/hackage/v/hasql-mapping.svg)](https://hackage.haskell.org/package/hasql-mapping)
  [![Continuous Haddock](https://img.shields.io/badge/haddock-master-blue)](https://nikita-volkov.github.io/hasql-mapping/)

  SDK for defining mappings between Haskell and PostgreSQL.

  The central piece of this library is the `IsStatement` typeclass, which is used for declaring type-safe mappings to particular SQL statements.
