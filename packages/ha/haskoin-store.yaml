changelog: "# Changelog\nAll notable changes to this project will be documented in
  this file.\n\nThe format is based on [Keep a Changelog](http://keepachangelog.com/en/1.0.0/)\nand
  this project adheres to [Semantic Versioning](http://semver.org/spec/v2.0.0.html)\n\n##
  [Unreleased]\n\n## [2.0.0] - 2026-11-25\n\nThis release brings the tokens of Bitcoin
  Cash (CashTokens,\n`docs/cashtokens.md`): the store reads the tokens of every output,
  keeps the\ntoken balance of every address and category, indexes each category, and\nanswers
  four new endpoints, counting the mempool. Outputs with tokens now\nhave their addresses,
  so the history and the balances of those addresses\nare whole.\n\nBefore upgrading,
  take a copy of the database: the migration to version 24\ncannot be undone, and
  on Bitcoin Cash it reads every block since May 2023,\nwhich takes hours. Upgrade
  every store of a fleet together, since the\nscripts of the shared pool take token
  entries. It needs haskoin-core 3.0,\nhaskoin-store-data 4.0 and haskoin-node 2.7.
  A store whose `--peer` nodes\nwhitelist it must now say what they grant (`--peer-permission`,
  or\n`PEER_PERMISSIONS=mempool,noban` for `whitebind=mempool,noban@…`): without\n`mempool`
  there, a Bitcoin store no longer asks them for their mempools.\n\n### Added\n- **The
  path of a transaction into the shared mempool is one machine,\n  specified and checked**
  (`docs/mempool-ingestion.md`,\n  `Haskoin.Store.Ingest`, run by `Haskoin.Store.Ingest.Run`).
  It replaces\n  five stages that each lost transactions in a way of their own: the
  queue\n  of announcements, the set of requests, the member's list of what waited,\n
  \ its offers by turn, and the question to the peers at the start.\n  - Every transaction
  id has one place, and leaves it settled or given up\n    for a counted reason (`ingest.given_up.*`).
  A store that gave\n    something up reads the whole mempool of its **sources** again:
  the\n    RPC of its node (`--node-rpc`), and the peers whose node gives its\n    mempool
  when asked. It also reads them when\n    one connects, when the pool lost what it
  had, and every ten minutes.\n    So a loss is temporary, where it lasted until a
  block: a node\n    announces a transaction to a peer once.\n  - What a peer names
  is asked of the pool before anything is fetched, so\n    reading a mempool that
  the pool has costs the list of its ids.\n  - Each peer has a window of requests
  out, from 16 to 4,096, that grows\n    as the peer answers and halves when it does
  not, in place of asking a\n    node for its whole mempool at once.\n  - A transaction
  is offered when it arrives, each after those that it\n    spends from: a chain enters
  root first, in any order of arrival.\n  - What peers name while the store is a block
  behind is kept, and asked\n    for once it is in sync, where it was dropped.\n  The
  document says what the path guarantees and how each claim is\n  established: by
  construction, proved by Liquid Haskell for every state\n  (`proofs/`: that nothing
  leaves in silence, the bounds on memory, and\n  that every step ends, with where
  each id is kept in a module of its\n  own, `Haskoin.Store.Ingest.Ledger`),\n  checked
  through every order of events of small worlds by a model\n  checker in the test
  suite (`Haskoin.Store.Ingest.Model`,\n  `scripts/check-ingest.sh`), or tested against
  Bitcoin Core and Bitcoin\n  Cash Node in Podman (`Haskoin.Store.MempoolSpec`, and\n
  \ `Haskoin.Store.NodeAxiomsSpec` for what is assumed of a node). A store\n  with
  no source, as one whose peers are all strangers on Bitcoin and\n  that has no RPC,
  says so in its log and in `/health`.\n- **The RPC of the node is a source of that
  path** (`--node-rpc`,\n  `Haskoin.Store.NodeRpc`): the store reads the node's whole
  mempool\n  through it when it starts, whenever it may have missed a transaction,\n
  \ when the pool lost what it had, and every ten minutes, as it does of a\n  peer
  that gives its mempool. So a store of Bitcoin Core that its node\n  does not whitelist
  no longer needs a block to get back what it missed.\n  To the machine the RPC is
  one more peer that is a source, asked within\n  a window that follows what the node
  delivers, so nothing of the machine\n  or of its proofs is particular to it. Before,
  the RPC was read only\n  after the pool had been emptied, 2,000 transactions every
  two seconds,\n  and a call that failed was taken for an empty mempool: a node that
  does\n  not answer now says nothing about what it has, and is tried again after\n
  \ a second, then two, up to a minute.\n- **`/health` says in words what it found.**
  Each check has a `text`,\n  such as \"The database is 4 blocks behind the best header,
  at height\n  688,798, more than the 2 allowed: the store is syncing, or cannot import\n
  \ blocks fast enough.\", and the top a `text` for the whole store: that it is\n
  \ healthy, with its height and peers, or what is wrong. They come from\n  haskoin-store-data
  4.0 (`healthText`), so a client writes the same.\n- **`/health` says how the store
  stands with the mempool of its nodes**,\n  in `mempool`: how many sources it has
  to read a whole mempool from\n  again, whether it may have missed transactions and
  has not read a\n  source since, and what is on its way to the pool. A store with
  no\n  source is healthy, and the `text` at the top says that what it misses\n  stays
  missed until a block.\n- **The check of the database says more**: beside the state
  of writes, the\n  compactions and flushes running, the full tables in memory waiting
  for a\n  flush, the size of the files and of their live data, and the errors in\n
  \ the background since the database opened, which say why writes are\n  slow. It
  is now a field of `HealthCheck` in haskoin-store-data\n  (`DatabaseHealth`), so
  the client reads it; the store added it to its\n  JSON outside the type before.\n-
  **Tokens of Bitcoin Cash (CashTokens).** Outputs that hold tokens have\n  their
  addresses now, with haskoin-core 3.0, and so are in the history,\n  the balance
  and the unspent outputs of those addresses. Outputs, inputs\n  and unspent outputs
  have a `token` field on Bitcoin Cash. New endpoints:\n  `/address/{address}/tokens`,
  the token balances of an address, and\n  `/token/{category}/holders`, `/unspent`
  and `/transactions`\n  (`docs/cashtokens.md`). They count the mempool, as an address's
  balance\n  does: the fleet's pool in Redis keeps, for each category, its\n  transactions
  and outputs, and for each address and category the sums of\n  a token balance. Every
  store of a fleet must run this version, since\n  the pool's scripts take token entries.\n\n-
  **Unix sockets for Redis, the node and its RPC.** `--redis-url\n  unix:PATH` reaches
  a Redis on a Unix socket; a peer written `unix:PATH`\n  is a Unix socket, with haskoin-node's
  peers on sockets; and\n  `--node-rpc-socket` sends the requests of `--node-rpc`
  through a Unix\n  socket, with the user and password of its URL. Neither node listens
  on a\n  socket itself, so it is something that joins one to the node, such as\n
  \ socat. The courier of a published transaction gives such a peer the zero\n  address
  in its version message, where haskoin-core's `sockToHostAddress`\n  stopped on it.\n\n-
  **The store asks what each peer's node allows.** With haskoin-node 2.7,\n  every
  peer runs a model of its node: the state machine of Bitcoin Core\n  32.1 or Bitcoin
  Cash Node 29.2.0 that haskoin-core translates from their\n  source. A message that
  the node would punish is not sent, and the log\n  says why, with the upstream line.
  When the pool fills again, the store\n  asks for the mempool only the peers whose
  node takes the request: one\n  that serves Bloom filters, as its version message
  says, or one that\n  whitelists the store with `mempool`. That replaces a rule of
  the store's\n  own, which asked every peer on Bitcoin Cash and only the `--peer`
  peers\n  on Bitcoin. That rule lost a Bitcoin Cash peer that served no Bloom\n  filters,
  and assumed that every `--peer` node whitelisted the store.\n  `--peer-permission`
  (`PEER_PERMISSIONS`) says what the nodes of `--peer`\n  grant, by the names of `-whitelist`.\n-
  **The courier knows which nodes say when they refuse.** The model of the\n  node
  says whether it answers a refused transaction with a `reject`. A\n  `pong` with
  no `reject` before it now means that a Bitcoin Cash Node kept\n  the transaction
  (`Kept`), and still only that a Bitcoin Core node is done\n  with it (`Took`).\n\n-
  **Documentation of the tokens.** The README has a section on the token\n  endpoints,
  with their answers and what each field means, one on how the\n  store keeps tokens,
  notes on upgrading to 2.0.0, and an example of the\n  Haskell client for tokens.
  `swagger.yaml` has an example answer of each\n  token endpoint, taken from a regtest
  chain.\n\n### Changed\n- The tests accept fast-logger 3.3 (`>= 3.2.9 && < 3.4`),
  as haskoin-node\n  2.7.0 does for\n  [stackage#8183](https://github.com/commercialhaskell/stackage/issues/8183).\n
  \ The store logs through haskoin-node, whose suite passes with 3.3.0. The\n  store's
  own suite was not run with it: `stack.yaml` builds with 3.2.9.\n- **The shared mempool
  is changed by decisions made in Haskell, each\n  carried out in Redis in one step
  or not at all**\n  (`Haskoin.Store.Fleet.Atomic`, `Haskoin.Store.Fleet.Pool.Decide`,\n
  \ `docs/concurrency.md`). Its rules were a Lua script of eight hundred\n  lines,
  which had two faults. A script that fails after its first write\n  keeps what it
  wrote, so an error in it left the pool half changed, as\n  the output of value 0
  did on 19 November; and the rules were kept\n  twice, in Lua to run and in Haskell
  to test against.\n  - A decision can only ask Redis questions and list writes, which
  its\n    type says. One small script that decides nothing asks the questions\n    again
  and carries out the writes only if every answer is the same;\n    otherwise it writes
  nothing and the decision is made again. An error\n    in a decision is an exception
  in Haskell before Redis is told\n    anything.\n  - The decisions are held to the
  script that they replace, which no\n    store runs any more: the two side by side
  in one Valkey, through\n    drawn sequences of offers, withdrawals, expiries and
  moves of the\n    tip, with all that Redis has compared after every step\n    (`Haskoin.Store.Fleet.DecideSpec`).\n
  \ - **The store that moves the tip has the floor.** A move of the tip\n    over
  a block reads for a second or more, and a decision is carried\n    out only if nothing
  that it read has changed: with transactions\n    offered all the time it would lose
  every race. So while a store moves\n    the tip, an offer is late and is made again,
  and withdrawals,\n    expiries, and drops and evictions of the cache wait for the
  next\n    turn. A move costs in proportion to its block. A store whose move is\n
  \   refused five turns in a row warns in its log, with how long the last\n    took
  and which answer of Redis had changed.\n  - **The floor lasts as long as the move.**
  The store says every two\n    seconds that it is at its move, in a key of its own
  (`fx:beat`), and\n    has the floor for ten seconds from each time. The floor lasted
  ten\n    seconds from when it was taken, and the move over a block of Bitcoin\n
  \   took longer than that to decide on a server: it was refused at every\n    turn,
  the tip staying where it was while the database went on. A\n    decision also judges
  time by one clock, read at its start, where it\n    read the clock again each time
  it asked Redis, and so found its own\n    lease of ten seconds run out. A store
  says in its log when a move\n    took a second or more, since transactions wait
  meanwhile, and\n    where the time went: reading the blocks, reading and writing
  the\n    cache, deciding, the calls to Redis, carrying it out, and the\n    garbage
  collector.\n  - **`haskoin-store-bench decide`** times what the move of the tip
  over\n    a block costs to decide, without Redis: each pass over the decision,\n
  \   its answers and writes, and what it allocates. Run it with\n    `+RTS -T -A64m`,
  as a store runs. The figures of this section were\n    measured without `-A64m`,
  where the collector goes over the model of\n    Redis three hundred times in a move:
  they compare one build with\n    another, and are more than twice what the move
  costs. With it the\n    move over 4,000 transactions is decided in 0.8 seconds.\n
  \ - **The move of the tip is gone through once.** It names what it will\n    ask
  before it starts, in steps, where it found its questions as it\n    went and was
  gone through from its start for each step: five times\n    through a block in the
  benchmark, and more on a server. Deciding the\n    move over 4,000 transactions
  takes 1.3 seconds where it took 4.4,\n    on a desktop, and decides the same. What
  it asks of the transactions\n    of the pool that a block is in conflict with is
  named ahead too: on\n    a server, blocks with such transactions took nine and fifteen\n
  \   seconds where the others took under five, and sixty of them made the\n    benchmark
  go from 1.1 seconds to 5.4; it is 1.2 with them named.\n  - **A store takes whatever
  its node has.** A transaction that a node\n    names is fetched and offered unless
  the pool has it. It was also left\n    alone if the fleet remembered having seen
  it, among the newest\n    100,000: a transaction that the pool had let go, for another
  that\n    took its place, and that the node took again later, stayed out of\n    the
  store for as long, through every reading of the node's mempool.\n    On a server
  one stayed out for hours. Two stores of a fleet whose\n    nodes hold transactions
  in conflict now each offer their own again\n    at every reading; the pool holds
  the one offered last. The set of\n    what the fleet saw (`fleet:seen`) is no longer
  kept: an offer writes\n    one thing less, and a member no longer trims it at each
  turn. The\n    key of an older store is left unread, and can be deleted.\n  - **A
  store asks its node for what a transaction spends from** when\n    the pool lacks
  it, at once. It waited for it to come by itself,\n    trying the transaction again
  after two seconds, four, eight, up to\n    twenty minutes, and a node names a transaction
  to a peer once: a\n    parent that a store had lost kept everything that spent from
  it out\n    of the pool until the next reading of the node's mempool. Bitcoin\n
  \   Core sends a transaction that it never named to the peer; Bitcoin\n    Cash
  Node says that it has it not, and there the store waits as it\n    did. The rule
  is in the model of the path, with a check that a\n    machine without it fails,
  and Liquid Haskell passes.\n  - **A store that has the RPC of its node reads it
  again when it\n    connects to the node as a peer.** A node names to a peer nothing\n
  \   that it took before the peer connected, and its RPC announces\n    nothing:
  what the node took between the reading of the RPC and the\n    connection was in
  neither, and stayed out of the store until the\n    next reading, ten minutes later.
  It lost four transactions in one\n    run of a test in about forty. A peer that
  connects and is no source\n    now makes the sources owe a reading. The model of
  the path has a\n    node with its RPC and a peer, and fails without the rule.\n
  \ - **A Grafana dashboard for the store's metrics**, read from InfluxDB\n    as
  Telegraf's statsd input writes them, for a store that sends its\n    own statistics
  (`--statsd-aggregates --statsd-no-events`):\n    `tools/grafana/haskoin-store.json`,
  with the script that generates\n    it. Nine rows and 46 panels: requests, one kind
  of request,\n    overload, blocks and peers, the database, the path into the\n    mempool,
  the cache of xpubs and the runtime. Telegraf sums the\n    store's statistics up
  a second time, which leaves counts, sums and\n    the longest right, and means,
  rates and percentiles wrong: the\n    dashboard reads the first and works the rest
  out, and\n    `docs/grafana.md` says how. Checked on a real Telegraf and InfluxDB\n
  \   with a known load, which `tools/grafana/check/run.sh` does again,\n    and not
  yet against a store in production. The README now lists the\n    metrics of the
  web server and of the reads of the database, which\n    the store sent and the README
  did not name, and what the statistics\n    of `--statsd-aggregates` are called.\n
  \ - **A test of a store whose Valkey is emptied while it runs**, as by\n    `FLUSHALL`,
  against Bitcoin Core and Bitcoin Cash Node\n    (`valkeyFlush` in `Haskoin.Store.MempoolSpec`).
  Valkey goes on\n    answering, so nothing fails, and only the epoch tells the store
  that\n    the pool is gone. The store must say so once, and have the mempool\n    of
  its node again within fifteen seconds, without being started\n    again. A store
  also reads the mempool of its node by the clock,\n    which alone brought the pool
  back after 26 seconds in a store made\n    unable to notice: the test empties Valkey
  right after that reading,\n    so that only the noticing meets its limit. It fails
  for a store\n    that does not notice, and for one that notices and does not read\n
  \   again. Tried once on servers too, under stores answering the\n    public, none
  of which was started again: Bitcoin Cash and the\n    testnets had the mempool of
  their node again in under three\n    seconds, and Bitcoin, with 65,962 transactions,
  in 233\n    (`docs/fleet-mempool.md`).\n  - **A store at the head of the chain is
  healthy, whatever the state of\n    its mempool.** `ok` of `/health`, and its status,
  no longer depend\n    on the two checks that look at transactions: `last-tx`, that
  one\n    came lately, and `pending-txs`, that few are asked for and not\n    received.
  A store that had every block was unhealthy, and taken out\n    of service, when
  its node went quiet or while it fetched a large\n    mempool. Both checks are still
  made and still say whether they\n    pass. `--tx-timeout` and `--max-pending-txs`
  set their limits as\n    before, and no longer decide anything.\n  - **A store takes
  no mempool transaction in until it has the\n    blocks.** While it takes its blocks,
  a store hears of new\n    transactions and cannot place one: what they spend is
  in blocks\n    that it has not yet. A store that took 160,000 blocks in half an\n
  \   hour fetched what its node named meanwhile, held thousands, and\n    gave them
  up for seven minutes after it had its blocks, saying\n    `syncing` all that time.
  Until a store first has its blocks, the\n    path into the pool now keeps nothing
  that a peer names or sends\n    and asks for nothing; then it reads its sources.
  And a store first\n    has its blocks only once its node has the headers of its
  peers\n    (`chainHasHeaders`, of haskoin-node 2.7.0): the\n    database caught
  up with the last header again and again while the\n    headers came, two thousand
  at a time. A rule of the machine (`begun`), with a check\n    in the model and two
  planted bugs that it finds; that a transaction\n    sent unasked is not kept either
  is tested by an example and not\n    checked; tested against both nodes on\n    a
  chain of 2,500 blocks, with a test that failed before.\n  - **A store no longer
  shows the coinbase of a block that its node\n    took back.** A node publishes over
  ZeroMQ the ids of the\n    transactions of a block that stops being part of its
  chain, the\n    coinbase too, and gives that coinbase when asked, since it keeps\n
  \   the block. A store with its node as a peer through the RPC and\n    ZeroMQ took
  it on the word of its node: an unconfirmed transaction\n    that could never confirm,
  until something emptied the pool. Two\n    were seen on each store of a testnet
  of a server, after a\n    reorganisation of two blocks. A coinbase is no longer
  taken in\n    when it arrives, whoever sent it: to the path into the pool, the\n
  \   peer does not have it. And one that is not in the chain of the\n    store is
  never offered to the pool. Tested against both\n    nodes, with a test that failed
  before (`staleCoinbase`). One that\n    is in a pool already stays there until the
  pool is emptied.\n  - **`/health` says how the mempool stands, in one word**\n    (`mempool.sync`):
  `syncing`, `synced` or `unknown`. After a start,\n    or after Redis lost its data,
  a store has its blocks at once and\n    its mempool a minute later, on Bitcoin:
  it is healthy meanwhile and\n    shows fewer unconfirmed transactions than its node.
  A deploy that\n    waited for `/health` gave a store traffic 70 seconds before its\n
  \   mempool was full: it can wait for `synced`.\n    - The mempool is measured against
  the nodes of the operator only.\n      It is `syncing` until each was asked for
  its mempool and had\n      twenty seconds to answer, the store has missed nothing
  of it\n      since, and the pool has decided on all that they named. A store\n      with
  no such node says `unknown`: what a stranger names is\n      nothing to measure
  a mempool against.\n    - It was a boolean, `filling`, for a few hours, measured
  against\n      every source. A store whose peers were all strangers said that it\n
  \     was filling for ever: a transaction that it could not verify kept\n      its
  place for twenty minutes, and another came before it left.\n    - In the machine
  of the path as T9 of `docs/mempool-ingestion.md`:\n      three checks in the model,
  and five planted bugs that it finds.\n      That a store comes to say `synced` is
  tested and not checked,\n      also on both nodes while transactions come without
  a pause.\n    - Needs haskoin-store-data 4.0.0.\n  - **A source is read every minute
  at least**, where it was every ten\n    minutes. While transactions come it is read
  every thirty seconds,\n    as before.\n  - **A node as a peer, through its RPC and
  its ZeroMQ socket**\n    (`--node-rpc` with `--node-zmq`, `NODE_ZMQ`; `docs/node-peer.md`).\n
  \   The peer-to-peer protocol is made for strangers: a node names what\n    it takes
  to a peer at its own pace, Bitcoin Core about fourteen a\n    second after a first
  batch, and in a burst a store was behind until\n    it next read the mempool, every
  thirty seconds. Somebody who runs\n    the node has its RPC, which answers anything,
  and its ZeroMQ\n    socket, which says what the node takes as it takes it.\n    -
  With both, the store has that node as one more peer\n      (`Haskoin.Store.NodePeer`):
  a pipe in memory, with a thread at\n      the other end that answers the messages
  of the peer-to-peer\n      protocol from the RPC (headers, blocks, transactions,
  the\n      mempool) and announces what the node publishes (`hashtx`,\n      `hashblock`,
  which both Bitcoin Core and Bitcoin Cash Node have).\n      Nothing else of the
  store changes: the node counts as a peer in\n      `/health`, it is a node of the
  operator, and it is a source.\n    - A store can run on it alone, with no `--peer`
  and no\n      `--discover`: discovery is no longer turned on for such a store.\n
  \   - Both connections are the peer. If the RPC fails or the socket\n      closes,
  the peer is gone; a ping is answered only once the node\n      answered a call,
  so a node that hangs is a peer that is silent;\n      and the node is asked for
  its best block every thirty seconds, in\n      case the socket went quiet. When
  messages may have been lost, the\n      whole mempool is named.\n    - The store
  speaks the protocol of ZeroMQ itself (ZMTP 3.0,\n      `Haskoin.Store.NodeZmq`),
  with no library of the system. A Unix\n      socket works as an address (`ipc://PATH`).\n
  \   - Tested against both nodes: the subscriber; a store with no other\n      peer
  that has 150 blocks, the mempool, what the node takes next\n      and its next block;
  the same store when its node hangs and goes\n      on; and on Bitcoin Core, 800
  transactions that the node took in\n      seconds, there within five seconds of
  the last with no reading,\n      where the peer-to-peer protocol alone is late.
  Not tested: a\n      first sync of a real chain this way, which takes one RPC call
  for\n      each block.\n    - **The RPC alone makes the node a peer too** (`--node-rpc`
  without\n      `--node-zmq`). Nothing publishes then, so the peer asks the node\n
  \     every five seconds: for its best block, and, while no other node\n      of
  the operator is a peer of the store, for the ids of its\n      mempool, of which
  it names those that are new. While every other\n      peer is a stranger, that keeps
  the store at most five seconds\n      behind a node that it trusts. Such a store
  runs with no\n      peer-to-peer connection as well, and discovery is not turned
  on\n      for it. Tested against both nodes (`polls`: three batches and a\n      block,
  each there within twelve seconds, which fails when the\n      peer asks every sixty).
  Not measured: what asking a mempool of\n      sixty thousand transactions every
  five seconds costs the node.\n    - **A store can run without ever connecting to
  a peer**, from no\n      chain at all: with the RPC of its node, and its ZeroMQ
  socket or\n      not. Tested on both nodes, each way, on a chain of more than\n
  \     2,500 blocks, which is more than a node gives of headers in one\n      answer
  (`noPeerEver`). Not tested on a real chain.\n    - **A store that has the RPC and
  not the ZeroMQ socket warns of\n      it**: the two are expected together. In the
  log, when the store\n      starts and when the peer connects, and in `/health`,
  as a\n      sentence in the new `warnings` and in `text`. A warning decides\n      nothing:
  `ok` and the status stay as they are. It needs\n      haskoin-store-data 4.0.0.\n
  \   - The web server no longer reads the RPC as a source of its own\n      (`nodeFeedLoop`):
  the node peer is that source.\n    - The node of `--node-rpc` is a node of the operator
  with\n      `--foreign-peers` too, which speaks of the nodes of `--peer`. It\n      was
  taken for a stranger.\n  - **The peers that the operator gave are kept** (`--peer`,
  and the\n    node of `--node-rpc`). They are the ones whose word the store takes,\n
  \   and the only reason for one to have no connection is now that it\n    takes
  none. From haskoin-node's branch `sticky-peers`:\n    - never dropped for its age:
  `--max-peer-life` is for peers found by\n      discovery;\n    - tried again every
  ten seconds at most when its connection ends,\n      for ever, where it waited up
  to ten minutes;\n    - a slot kept for it while it is away: with `--discover`, peers\n
  \     found on the network filled every slot meanwhile, and the node of\n      the
  operator found none when it came back.\n    Tested in haskoin-node, the first against
  both nodes. Not tested end\n    to end: a store with discovery whose own node is
  away.\n  - **A stranger is not taken at its word.** A store verifies no script:\n
  \   it takes a transaction because a node took it. It did so of every\n    peer,
  and a peer found by discovery is anybody: it could send a\n    spend of somebody's
  coins with a signature that does not verify,\n    and the store showed it, as a
  payment that was never made or as\n    coins spent that were not. A test offers
  such a transaction as the\n    store offered every one: it is taken.\n    - The
  store now takes the nodes of `--peer`, and the node of\n      `--node-rpc`, for
  nodes of its operator, and takes their word as\n      before. `--foreign-peers`
  (`FOREIGN_PEERS`) says that the nodes\n      of `--peer` are not.\n    - What only
  strangers name is looked at before it is offered. If\n      every signature of a
  coin locked to one key verifies, it is\n      taken. If one does not, or it spends
  more than it has, or its\n      tokens come from nowhere, it is given up with all
  that spends\n      from it (`ingest.given_up.forged`). If it spends a coin locked
  by\n      a script, which only a full node can judge, it is held until a\n      node
  of the operator names it, twenty minutes at most, and not\n      shown meanwhile
  (`ingest.given_up.not_vouched`).\n    - So a store with a node of its operator among
  its peers misses\n      nothing, and one with only strangers shows a spend of a
  script\n      when a block confirms it.\n    - The checks are in haskoin-core (`Haskoin.Transaction.Judge`,\n
  \     `judgeRelayed`), with those of `POST /transactions`, which moved\n      there
  from this package: they say nothing of a store, and other\n      programs can use
  them. Only what no node can take is refused: a\n      rule of relay is the node's
  own.\n    - The rule is in the machine of the path (T8 of\n      `docs/mempool-ingestion.md`),
  and the model has seven worlds for\n      it, 26 in all, with five planted bugs
  that it finds; its first\n      version had two of them. Liquid Haskell passes.
  Tested with real\n      signatures against a real pool, and against Bitcoin Core:
  a store\n      whose only peer is a stranger takes what the wallet of the node\n
  \     signed and not what a script spends, and takes both once the peer\n      is
  a node of its operator.\n    - It builds on haskoin-core's branch `judge-transactions`.\n
  \ - **A store of Bitcoin has a whole mempool again in a minute and a\n    half,
  where it took over three.** After each transaction that came,\n    the path into
  the pool said how many ids it knew, and counted them\n    by making a set of them
  all: 0.8 milliseconds for 65,000 on a\n    desktop, for each of 65,000 transactions.
  A store whose Redis had\n    lost its data, or that started on a new pool, took
  in 380\n    transactions a second with a core busy, its Redis idle and requests\n
  \   out to its node all the time: 233 and 259 seconds on a server\n    answering
  the public, 191 on one answering nobody. The count is the\n    size of a map now,
  and the same store took in 2,300 a second and had\n    the 65,314 transactions of
  its node after 87 seconds, 294 a second\n    from the first seconds and over 1,000
  from the second minute. What\n    remains is the offers, one at a time.\n  - **A
  store that is slow to fill its pool says where its time goes.**\n    Every ten seconds
  in which the path into the pool was busy for five\n    or more, it says in its log
  how many events, offers and questions to\n    the pool it went through, and how
  many milliseconds went to the\n    machine, to the offers, to the questions, to
  sending requests and to\n    saying its state, with the offers split into what each
  reads: whether\n    a block has the transaction, the outputs that it spends from
  the\n    database and from the pool, which of them are unspent, and the\n    pool's
  decision. Nothing outside the store could tell. That line is\n    what found the
  count above, after a cause reasoned from the shape of\n    a curve had been wrong.\n
  \ - **A store that takes a whole mempool at once offers each\n    transaction to
  the pool once.** A transaction that spends from one\n    that the store is still
  fetching waits for it, and was offered to\n    the pool all the same two seconds
  later, then four, eight and so\n    on, in case that one had been given up. The
  pool could only refuse\n    it. A held transaction is now offered at its time only
  if one of\n    those that it waits for has no place any more, which is what the\n
  \   time is for (`docs/mempool-ingestion.md`). Given 65,000\n    transactions in
  chains of 24 at once, with a millisecond for each\n    offer, the machine made 103,862
  futile offers and took 169 seconds;\n    it makes none now, and takes the 65 seconds
  of the offers\n    (`Haskoin.Store.IngestSpec`, in three seconds). Against Bitcoin\n
  \   Core with 24,000, a store with an empty pool made 44,000 futile\n    offers
  and had them all in 18 seconds; none and 13 seconds now. On a\n    server with 65,000
  it changed nothing that could be measured: this\n    was not what made the store
  slow there. The model checks the rule\n    both ways, with a planted bug for each,
  and Liquid Haskell passes.\n  - **The tip moves at once, and the pool lets go of
  the block's\n    transactions after it.** A move of the tip over a full block took\n
  \   what the block confirmed out of the pool in the same step: more than\n    a
  hundred thousand writes, for which the tip waited five to fifteen\n    seconds on
  a server, nearly one of them inside Redis, which answers\n    nobody else meanwhile,
  and more with every cached extended key. The\n    move now marks those transactions,
  one write for each, and they\n    leave afterwards, two hundred at a time. A request
  that would read\n    one of them takes it out first, so every answer is that of
  a pool\n    that has let go of everything; nothing enters the pool until it has.\n
  \   In the benchmark the move over 4,000 transactions is decided in 0.12\n    seconds
  where it took 0.8, and 2.7 with a cached key at every\n    address. A move that
  undoes a block is as it was.\n    `scripts/check-pool.sh` checks the three rules
  in small worlds, with\n    the decisions themselves: every pool, every block and
  every order of\n    taking out (`docs/tip-first.md`). And no decision can write
  to the\n    pool or to the cache while a transaction is marked: every write to\n
  \   one of their keys asks first, whatever the decision does for\n    itself. That
  taking transactions out leaves the same pool in any\n    order is proved by Liquid
  Haskell for the pool as a pure value\n    (`Haskoin.Store.Fleet.Pool.Order`).\n
  \ - **A store reads the mempool of its node every thirty seconds while\n    transactions
  come**, and twice as long after each reading that\n    follows none, up to the ten
  minutes that it was. Bitcoin Core names\n    transactions to a peer at fourteen
  a second after a first batch, to\n    a peer that it whitelists too, so a store
  was minutes and thousands\n    of transactions behind its node whenever the node
  took more: nothing\n    was lost, and all of it was late. Asked for its mempool,
  the node\n    names everything at once. A store says in its log when going through\n
  \   what a node named at once took a second or more.\n  - **`rbf` is true for every
  unconfirmed transaction on Bitcoin, and\n    false elsewhere.** The nodes of Bitcoin
  take a replacement of any\n    unconfirmed transaction, whatever it signals, since
  Bitcoin Core 28,\n    and Bitcoin Cash has no such rule. The field said whether
  a\n    transaction signalled replace-by-fee (BIP 125) or spent an\n    unconfirmed
  one that did, which the pool worked out for every\n    transaction and kept right
  as parents were confirmed and came back:\n    two sets in Redis, and questions about
  the children of every\n    transaction that a block confirmed. None of that is kept
  or asked\n    any more; the sets `pool:own` and `pool:rbf` of an older store are\n
  \   left unread. The move over 4,000 transactions is decided in 1.1\n    seconds.\n
  \ - **A decision of any size is carried out.** Its questions and writes\n    go
  to Redis a thousand to an argument, without the writes that a\n    later delete
  undoes and with one command for many members of a key.\n    They went as an argument
  for each word, 1,008,352 for the move of\n    the tip over one block of Bitcoin,
  and Redis closes the connection of\n    a command with more than 1,048,576.\n  -
  **It costs Redis more:** an offer that is taken is two calls where it\n    was one,
  and about 137 microseconds of Redis where the script took 74\n    (Valkey's own
  count). That leaves room for some seven thousand offers\n    a second.\n  - **Breaking
  for a fleet: keys start with `hs3:<network>:`**, where they\n    started with `hs2:`.
  Stores of this version and older ones on one\n    Redis are two fleets, each with
  its own pool. Upgrade every store of\n    a fleet together; the keys under `hs2:`
  can be deleted afterwards.\n  - **The cache of extended public keys is written the
  same way**\n    (`Haskoin.Store.Fleet.XPub.Decide`): building an entry, moving it\n
  \   with the tip in pieces, dropping and evicting. A script that failed\n    among
  the thousands of rows of a build left an entry half written. A\n    build of a key
  with 20 addresses costs Redis about 1.5 milliseconds\n    where it cost 1.0. Its
  reads are still one script and one call, and\n    write nothing but the note that
  a key was used: a move of the tip\n    that its store left for ten seconds is no
  longer ended by a read, but\n    by the build that follows the miss.\n  - **That
  a decision sees its own writes rightly is proved** for what it\n    asks about one
  cell: a field of a hash, a member of a set, the score\n    of a member, what a key
  holds. What a write does to a cell is written\n    once (`Haskoin.Store.Fleet.Atomic.Cells`),
  for the model of Redis and\n    for the decision, and Liquid Haskell checks, for
  every list of\n    writes, that the cell in the model after them is what the decision\n
  \   works out (`proofs/`). It assumes four facts of `Data.Map`. The rest\n    of
  what a decision can ask is tested, as before.\n  - **A write of the wrong kind to
  a key does not compile.** The script\n    that carries out a decision cannot fail
  half way unless Redis\n    refuses a command, which it does for a key of another
  kind and for an\n    addition to what is no number. A key now has its kind in its
  type\n    (`Haskoin.Store.Fleet.Atomic.Keys`), and the decisions are written\n    with
  questions and writes that each take keys of one kind.\n  The scripts of the reports
  and of the move of the tip without the pool\n  are as they were.\n- **The testnet3
  of Bitcoin Cash is `--net bchtest3`**, no longer\n  `bchtest`, as haskoin-core 3.0
  renames it after `bchtest4`. Bitcoin Cash\n  Node still runs testnet3, and the store
  keeps it, as it keeps Bitcoin\n  testnet3 (`btctest`), which haskoin-core deprecates.
  The name is also\n  the store's data directory, its prefix in Redis, its StatsD
  namespace\n  and its `network` in the API: before upgrading a store of testnet3,\n
  \ rename `DIR/bchtest` to `DIR/bchtest3`, and set `NET=bchtest3`. Its\n  shared
  mempool fills again under the new prefix. Addresses keep the\n  CashAddr prefix
  `bchtest`. `hsq -n bchtest3` follows.\n- **The tests name no address or port, and
  use only real nodes in\n  Podman.** The tests of downloading that a mock peer served
  in memory\n  (`StoreSpec`) now sync from Bitcoin Cash Node in Podman\n  (`Haskoin.Store.DownloadSpec`):
  the blocks asked 64 at a time, every\n  transaction of a block as the node has it,
  a second node taking over from\n  one frozen with `SIGSTOP`, and a heap that stays
  flat over 5000 blocks.\n  The web servers of the integration tests listen on Unix
  sockets, which the\n  tests, the WebSocket client and the client of haskoin-store-data
  reach;\n  the price service is a name that never resolves, and the RPC that does\n
  \ not answer is a socket that nothing listens on. The test of HTTPS makes\n  its
  certificate with openssl and its requests with curl in a container of\n  the test
  image, not with the programs of the machine. The mock peer of\n  the benchmark,
  and the peers of the tests of publishing, are named by\n  Unix sockets. The benchmark
  compiles again: it lacked the field\n  `nodeRpcSocket` of its web server, and now
  the permissions of its peer.\n- **The test of tokens queries the four endpoints**
  through the client of\n  haskoin-store-data, with the transactions in the mempool
  and then\n  confirmed: the balance of the address, the holders, the unspent outputs\n
  \ and the transactions of the category, and the amounts as strings in the\n  JSON.\n-
  **A store that does not sync in the integration tests explains\n  itself.** The
  tests keep the last 400 lines of the log of each store,\n  whether they print it
  or not, and when a store does not reach the best\n  block of its node in time they
  print them, with what the node says of its\n  chain and of its peers and what the
  store says of its health and peers.\n  A store stopped short of its node a few times
  on Bitcoin Cash Node, too\n  seldom to be run again with its log.\n- **The example
  of the client in the README compiles**: it needed\n  `OverloadedStrings` for the
  text of its address.\n- **The integration tests run their containers through\n  [podman-test](https://github.com/jprupp/podman-test)**,
  in place of the\n  code of their own in `integration/`: each environment is a pod
  with\n  Valkey on a Unix socket and the node's RPC and peer-to-peer ports bridged\n
  \ to sockets, and the store reaches all three through them, so the pod has\n  no
  network. The tests are skipped with `PODMAN_TEST_SKIP`, in place of\n  `HASKOIN_STORE_NO_PODMAN`.
  The Bitcoin Core node that does not whitelist the\n  store now gives it its mempool,
  and the store is told so: without it the\n  node closed the store's connection over
  the request, now and then during\n  a test. The test of\n  the Haskell client mines
  a block at each look until the client hears\n  one, where it mined one and waited:
  a client whose stream opened after\n  that block heard nothing.\n- **Database version
  24.** On Bitcoin Cash the migration from version 23\n  indexes the outputs that
  hold tokens since the upgrade of May 2023: hours,\n  once, and it carries on where
  it was if stopped. On Bitcoin it writes the\n  new version. Four new column families
  keep older stores out.\n- The checks of a published transaction read the token prefix
  with\n  haskoin-core's parser.\n- **Builds on haskoin-core 3.0**, which reads the
  token prefix and adds a\n  field to `Network`, with haskoin-node and haskoin-store-data
  4.0 on it\n  too. Until they are on Hackage, `stack.yaml` pins commits of their\n
  \ GitHub repositories. The Blockchain.info API gives the legacy addresses of the\n
  \ Bitcoin Cash test networks with the prefixes of testnet4, which are\n  those of
  testnet3, now that haskoin-core marks testnet3 as deprecated.\n- **Releasing and
  formatting moved to\n  [jprupp/tools](https://github.com/jprupp/tools)**, shared
  by the Haskell\n  packages of this family. `haskell-release` builds and tests the
  package,\n  builds the source and documentation archives, then tags the commit,\n
  \ pushes the tag and uploads both to Hackage. It leaves out the\n  documentation
  of the internal library `integration`, whose file\n  `haskoin-store:integration.txt`
  made Hackage refuse the archive, so a\n  release needs no step by hand. `haskell-format`
  replaces `scripts/format`.\n- **CI runs through the workflow that the packages share**
  in jprupp/tools,\n  which also keeps the cache of the Nix build per release of nixpkgs.\n
  \ `check-stack-paths` from there replaces `scripts/check-local-deps.sh`.\n- **`haskell-dev`,
  from jprupp/tools, is the fast loop of work on the\n  code**: `build`, `test` and
  `docs`, without optimisation and with the\n  tests in eight processes, about 75
  seconds in place of four minutes. The\n  five environments of `Haskoin.Store.IntegrationSpec`,
  each a node, a\n  Valkey and a store in Podman, are now groups at the top of the
  module, and\n  `haskell-dev.toml` names it, so that they run at the same time.\n\n###
  Fixed\n- **Races found by an audit of every protocol that runs at once**\n  (`docs/concurrency.md`,
  new, has each protocol, its machine, its owner,\n  the invariants and what changed):\n
  \ - a peer passed over during a stall was disconnected for a block it was\n    asked
  for once another brought the store in sync (`Sync.finish`);\n  - the refill ran
  the block store's in-sync check on the web thread; it\n    goes through the mailbox
  now;\n  - a peer could owe a block twice; a block of a branch the node had left\n
  \   could be imported; a revert published no best block;\n  - two threads pruning
  views could let go of the newest block's view;\n  - a store that was not live could
  empty the fleet's pool while one other\n    store was live; a store emptied it where
  the documentation said it\n    waits (`Unreadable`); a transaction in conflict could
  be lost for the\n    fleet; expiry could withdraw a transaction that had just come
  back;\n  - a request interrupted while it took the lock of an xpub left the job\n
  \   reserved for good; the listener of builds spun while Redis was down,\n    grew
  without bound and woke requests for builds that never happened;\n  - one slow answer
  from Redis made every store answer 503; background\n    loops could die in silence;
  an error skipped the asking of published\n    transactions;\n  - announcements of
  transactions held up blocks on the block store's\n    thread; the transactions waiting
  to be offered had no bound.\n- **New transactions and blocks show at once again.**
  Since the pool moved\n  to Redis, a transaction from a peer waited for the member's
  next turn,\n  up to two seconds, before it was in the pool and listed; it is offered\n
  \ as soon as it comes now (`Haskoin.Store.Ingest`). A store that a block\n  made
  well, as after a sync, took no turn for up to two seconds either:\n  the block woke
  the member before the health check had run, and the\n  member slept until its timer.
  It now takes a turn as soon as the store\n  is well (`Haskoin.Store.Fleet.turn`).
  Measured in a downstream regtest\n  suite: 1.3 to 2.0 seconds for a transaction
  against 0.3 to 0.4 on\n  1.12.1, and 2.0 seconds for 101 blocks after a start against
  0.01.\n- **A store no longer falls behind the mempool of its node.** On a server,\n
  \ a Bitcoin store fell 17,000 transactions behind its node: chains of 24\n  transactions
  that the node took in one second were offered child first\n  and took 23 rounds;
  announcements were dropped from a full queue, or\n  while the store was a block
  behind; and nothing asked the node again\n  for what was missed. The path into the
  pool is a new machine (see\n  Added).\n- **A Bitcoin Cash Node with `--node-rpc`
  no longer waits half a minute\n  when it stops.** The store kept its RPC connection
  open, and the node\n  waited until it had been idle for `-rpcservertimeout`. Every
  RPC request\n  closes its connection now.\n\n## [1.16.7] - 2026-11-20\n\n### Fixed\n-
  **A Bitcoin store no longer loses its peers when the pool fills again.**\n  A refill
  asked every connected peer for its mempool, and Bitcoin Core\n  disconnects a peer
  that asks unless it whitelists it: on groot the btc\n  store lost its three peers
  at once and answered 503 for seven seconds.\n  On Bitcoin only the peers given with
  `--peer` are asked now, since an\n  operator whitelists those; on Bitcoin Cash every
  peer still is, since\n  Bitcoin Cash Node answers anyone.\n\n## [1.16.6] - 2026-11-19\n\n###
  Fixed\n- **The pool no longer stops at a transaction that pays an output of value\n
  \ 0.** Taking such an output out of an address's summary added `-0`, which\n  Redis
  does not read as an integer. The script failed at every turn of the\n  fleet, and
  the pool took in nothing more until the next restart of the\n  pool. Pay-to-anchor
  outputs, which Bitcoin Core relays since version 29,\n  have value 0. Since Redis
  keeps what a failed script wrote before its\n  error, the summaries of the addresses
  that the stuck turn touched could\n  drift; emptying the pool clears them.\n- **A
  store no longer keeps every transaction it ever offered in memory.**\n  The fleet
  member kept a set of what it had offered to the pool, emptied\n  only when the pool
  was started again or Redis lost its data: about half\n  a million transactions a
  day on Bitcoin. It also made the store refuse,\n  silently, a transaction that left
  the pool and was sent again, such as\n  one that a replacement pushed out. The set
  is gone: the fleet's seen set\n  in Redis already keeps stores from fetching what
  the pool decided on.\n- **Orphans no longer stop the store from offering transactions.**
  A\n  transaction whose parent never came waited in memory for ever, and a\n  round
  offers the 2,000 oldest that wait: once that many orphans had piled\n  up, nothing
  else was offered. An orphan is now let go 20 minutes after\n  the store heard of
  it, as Bitcoin Core does.\n- **A restart of the pool no longer drops what the store
  was about to\n  offer.**\n- **A restart of the pool fills it again.** After a reorganisation
  deeper\n  than 50 blocks, the pool was emptied and its transactions came back only\n
  \ in a block, since the fleet had seen them and no store fetched them\n  again.
  The restart now empties the seen set too, and every store reads\n  its node's mempool
  over RPC (`--node-rpc`) and asks its peers for theirs,\n  as after a loss of Redis.\n-
  **A store no longer loses its Bitcoin Core peers after Redis loses its\n  data.**
  From the first refill on, the store asked every peer that\n  connected for its mempool.
  Bitcoin Core disconnects a peer that asks\n  unless it whitelists it or serves bloom
  filters, which it does not by\n  default; so the store lost its public Core peers
  one after the other.\n  It now asks only the peers connected at the refill, once.\n-
  **README: memory for indexes and filters.** They come to about 0.9% of the\n  database
  (16 GB for Bitcoin, 4 GB for Bitcoin Cash, measured on\n  api.haskoin.com), not
  0.34%; and they, Bloom filters included, are held\n  outside the block cache, not
  in it. The `--block-cache-mb` help said the\n  same wrong thing and is fixed too.\n-
  **Documentation brought up to date with Redis being required.** The\n  package description,
  the README's Docker quick start (it started the\n  store without Redis, which cannot
  work), the help of `/health` in\n  `swagger.yaml` (the `redis` and `database` fields
  are always there; a\n  store without Redis answers 503), and comments throughout
  the code that\n  still described an optional Redis, a store's own mempool, the token\n
  \ design or functions that no longer exist.\n- **`swagger.yaml`**: version 1.16.5;
  `request-too-large` (413) is sent;\n  the health check runs every second and at
  each block, not every 30\n  seconds; the 202 body of `POST /transactions` has a
  `message`.\n- **README**: `nocache` is accepted and ignored on xpub routes; `stack.yaml`\n
  \ may pin git commits; the integration image is under `integration/`; the\n  code
  map lists every module; links point at the document that has what\n  they promise.\n-
  **Messages about pending transactions** (the `/health` log, the help of\n  `--max-pending-txs`,
  the reference): they count transactions requested\n  from peers and not received
  yet, not transactions waiting to be imported.\n  The log line of the migration from
  version 20 says the transactions were\n  taken out of the chain, not moved.\n\n###
  Removed\n- **The stress test of the cache** (`stress/`, `scripts/stress-cache.sh`,\n
  \ `scripts/stress-report.py`, the `haskoin-store-stress` benchmark, and\n  wrk in
  the test image). It no longer ran against the current server and\n  measured a cache
  that no longer exists. `scripts/heap-profile-summary.py`\n  stays; the README says
  how to use it on its own.\n- **The StatsD gauge `store.queued_txs`**: it counted
  transactions waiting\n  to be imported, which the block store no longer holds, and
  was always 0.\n- **Dead code**: what the block store kept of transactions received
  from\n  peers, which nothing put there (`Haskoin.Store.BlockStore.Pending` now\n
  \ holds only the requests); `insertReplaced`; `BlockStoreConfig`'s\n  `mempoolTimeout`;
  and unused fields of the fleet member.\n\n### Changed\n- **`hsq --help` fits the
  terminal.** The usage text is laid out for the\n  terminal's width (at most 100
  columns): prose reflows, the command and\n  option lists stay aligned when there
  is room and stack when there is\n  not, and examples and the sample configuration
  are kept as written.\n\n## [1.16.5] - 2026-11-19\n\n### Added\n- **`hsq`, a command-line
  client for people** (`tools/hsq/hsq`, Python,\n  standard library only): a coloured
  summary of `/health`, refreshed with\n  `-w`, and any API path as laid-out JSON,
  over a Unix socket, HTTP or\n  HTTPS, with a configuration per network. `docs/hsq.md`
  explains it. It is\n  not part of the Haskell package.\n\n### Changed\n- **Clear
  messages when the store cannot start.** A new module,\n  `Haskoin.Store.Startup`,
  turns each usual failure into one line that\n  says what is wrong and what to do,
  printed without a backtrace, with\n  exit status 1: no Redis or Valkey listening,
  an unknown Redis host, a\n  Redis that wants a password or another one (it used
  to start and answer\n  503 to everything), a URL that is not Redis's, a data directory
  that\n  cannot be made, a database held by another store, a port in use or below\n
  \ 1024, a host that is not this machine's, a Unix socket in use, missing\n  HTTPS
  files, and an unknown `--net`. Redis is now connected first, before\n  the database
  opens, and with a timeout of five seconds.\n- **The warning when Redis stops answering
  gives the reason**, and says\n  that the store answers 503 until Redis is back (it
  said, wrongly, that\n  the store answered from the database).\n- **\"Not synchronized
  with the network\"**: the message of the 503 that a\n  store answers without the
  block to answer from, with haskoin-store-data\n  3.0.1, which it now requires. The
  code stays `behind-fleet`.\n\n## [1.16.4] - 2026-11-18\n\n### Fixed\n- **A reorganisation
  no longer loses the transactions of the abandoned\n  blocks.** A store alone in
  its fleet that reverted a block between its\n  report and its move of the fleet
  tip found the reported block off its\n  main chain, took that as a way it did not
  know, and moved the tip with an\n  emptied pool. The transactions of the abandoned
  blocks that no node had\n  any more were lost, and answered 404. Such a store now
  leaves the tip for\n  its next turn (`Unsettled` in `Haskoin.Store.Fleet.Member`).
  The\n  transactions still come back only in the commit that moves the tip, so\n
  \ none is ever both confirmed at the tip and in the pool. This was the\n  intermittent
  failure of the integration test \"sends again a payment that\n  the nodes forgot
  and the store lists\"; a test of the fleet's cache now\n  makes the race happen
  every time.\n\n## [1.16.3] - 2026-11-18\n\n### Added\n- **The API can listen on
  a Unix socket.** `--socket PATH` (`SOCKET`) makes\n  one, with the mode of `--socket-mode`
  (`SOCKET_MODE`, `0660` by default),\n  removes a stale one at start and refuses
  a path in use. A socket passed\n  by systemd socket activation (`LISTEN_FDS`) wins
  over both and over\n  `--host` and `--port`. The new `Haskoin.Store.Web.Listen`
  has both. The\n  access log shows `unix` for a client on such a socket.\n\n## [1.16.2]
  - 2026-11-18\n\n### Changed\n- **RocksDB gets a background job a core**, from 2
  to 16, instead of its\n  default of two. `--background-jobs` (`BACKGROUND_JOBS`)
  still overrides it,\n  and 0 still means RocksDB's default. A fresh sync of Bitcoin
  Cash froze at\n  height 436,814 because compactions fell behind and RocksDB stopped
  writes.\n  `max_subcompactions` stays at 1: `rocksdb-haskell-jprupp` 2.8.0 cannot
  set\n  it.\n\n### Added\n- **Write stalls are visible.** The new `Haskoin.Store.Database.Stalls`\n
  \ polls RocksDB every five seconds and logs a warning when it delays or stops\n
  \ writes, with the bytes of compaction pending, and a line when they recover.\n
  \ `/health` reports it under `\"database\"`; stopped writes make the store\n  unhealthy,
  delayed ones do not. StatsD gauges `db.pending_compaction_bytes`\n  and `db.write_delayed`.\n\n##
  [1.16.1] - 2026-11-18\n\n### Changed\n- **The stall follows the syncing peer's pace.**
  A peer is passed over when\n  it has sent nothing for four of its recent gaps between
  blocks, at least\n  two seconds, instead of always `--block-stall` seconds, which
  is now the\n  longest stall. A store that imports hundreds of small blocks a second\n
  \ waited ten seconds on a peer that had gone quiet; it now waits two. The\n  pure
  rules are in `Haskoin.Store.BlockStore.Sync` (`patience`,\n  `stallFloor`, `stallFactor`,
  and the new `gap` of `Sync`).\n\n### Fixed\n- **Header sync no longer stalls block
  sync.** haskoin-node waited for the\n  chain to import each batch of 2,000 headers
  before it passed on any other\n  peer message, and on Bitcoin Cash a batch took
  20 seconds. Blocks and pongs\n  waited behind it, and the store passed over peers
  that were delivering.\n  haskoin-node 2.6.1 no longer waits, and haskoin-core 2.0.1
  connects Bitcoin\n  Cash headers about 60 times as fast. Both are unreleased and
  pinned by\n  commit.\n\n## [1.16.0] - 2026-11-18\n\nThis release has one design
  (`docs/one-fleet.md`): Redis is required, every\nstore is a member of a fleet, the
  mempool is only in Redis, and every xpub is\nanswered from the fleet's cache.\n\n###
  Added\n- **Gauges of the latest block's import times** (`store.last_block_ms` and
  one per stage), which\n  keep their value until the next block, so that charts show
  the right time at any zoom.\n- **Admission control that adapts** (`Haskoin.Store.Web.Admission`,\n
  \ `Haskoin.Store.Web.Congestion`, `docs/congestion-control.md`). Only so many\n
  \ long requests (lists, whole blocks, xpubs) run at once, so that a busy store\n
  \ still answers its quick requests at once.\n  - **The limit follows the cores.**
  A probe on each capability waits on an\n    eventfd that a system thread rings every
  10 ms, and measures how late a\n    woken thread runs, less GHC's collector pauses.
  Every half second the\n    controller cuts the limit by a quarter when that delay
  is over\n    `--target-delay` (25 ms) and the cores are used at 90%, at most once
  a\n    round trip (the smoothed time a request holds its slot). The delay\n    alone
  does not cut: requests that wait for a slow disk make it jump\n    while the cores
  have room. It grows along TCP CUBIC's curve, back toward\n    the level of the last
  cut and then past it, while the delay is under the\n    target, every slot was used
  and the cores, smoothed over two seconds,\n    are used under 90%. The limit stays
  between `--min-requests` (two a\n    core) and `--max-requests` (sixteen a core;
  0 turns it all off).\n  - **The line in front is managed by CoDel** (100 ms interval,
  5 ms target;\n    while overloaded, a request that waited past 10 ms is refused).
  It holds\n    up to `--request-queue` (64) requests for up to `--request-wait` (1
  s).\n    It refuses nothing while the limit is free to rise (the cores under 90%,\n
  \   the limit under its ceiling): such a line waits for the limit to catch\n    up,
  and refusing it cost clients that ask one after the other a second\n    of `Retry-After`
  each. A refused request gets 429 `server-busy`\n    with `Retry-After: 1`, which\n
  \   clients and nginx take as \"come back later\"; a load generator retried\n    503s
  at once. A request in line sets no GHC timer: a sweep enforces the\n    waits.\n
  \ - **A request for an xpub gives its slot back while it waits for the\n    indexer**
  (`Admission.admittedAside`, `aside`), and takes one again\n    without the line.
  The indexer bounds that work; holding the slot left\n    plain requests waiting
  a second behind cold xpubs.\n  - **Options:** `--max-requests` (`MAX_REQUESTS`),
  `--min-requests`\n    (`MIN_REQUESTS`), `--target-delay` (`TARGET_DELAY`), `--request-queue`\n
  \   (`REQUEST_QUEUE`) and `--request-wait` (`REQUEST_WAIT`).\n  - **Metrics:** `web.cap.limit`,
  `web.cap.delay_us`, `web.cap.lateness_us`,\n    `web.cap.overloaded`, `web.cap.used`,
  `web.cap.round_trip_us`,\n    `web.cap.sojourn`, `web.cap.refused_full`,\n    `web.cap.refused_waited`,
  `web.cap.refused_codel`, `web.requests_waiting`,\n    and for each long route `web.cap.<route>.running`,
  `.waited`, `.held` and\n    `.refused`.\n  - **`haskoin-store-bench admission`**
  compares no limit, a fixed limit and\n    the adaptive one (`bench/Admission.hs`).\n-
  **Xpubs are indexed once, in the background** (`docs/xpub-indexing.md`).\n  - **`Haskoin.Store.XPub.Indexer`**:
  threads that read xpubs into the\n    fleet's cache, one a core by default. Jobs
  that requests asked for go\n    before upkeep, and no xpub is queued twice; a request
  for an xpub that is\n    queued or running joins its job. A sweeper thread refuses
  the requests\n    whose time is up, so no GHC timer is set.\n  - **`Haskoin.Store.XPub.Lock`**:
  the lock of an xpub in Redis\n    (`<prefix>idx:<id>`), so that one store of the
  fleet indexes it. Its value\n    says which store holds it and when that store expects
  to be done, by the\n    clock of Redis.\n  - **`Haskoin.Store.XPub.Service`**: the
  one door to the cache for the web\n    server. `xpubAsk` says what to do on a miss
  and gives an `Answer`;\n    `xpubDelete` takes an xpub out.\n  - **`Haskoin.Store.XPub`**:
  what the door, the indexer and the web server\n    share, `XPubReads` and the `Budget`
  of a job. Every job gets `noBudget`;\n    the type stays as the seam through which
  a job settles and tells its size.\n  - **`StoreConfig.xpubs`** (`XPubConfig`, `defaultXPubConfig`)
  and the\n    options `--xpub-workers` (`XPUB_WORKERS`, 0 for one a core), `--xpub-wait`\n
  \   (`XPUB_WAIT`, 10 seconds), `--xpub-horizon` (`XPUB_HORIZON`, 30 seconds)\n    and
  `--xpub-queue` (`XPUB_QUEUE`, 1000).\n  - **`web.reruns`** counts the requests answered
  again because an xpub that\n    they read changed meanwhile.\n- **Timings of the
  stages of a block import**, for StatsD: `store.block_prepare`,\n  `store.block_prefetch`,
  `store.block_apply` and `store.block_write`, and the\n  read ahead by kind of key,
  `store.block_read_unspents`,\n  `store.block_read_spenders` and `store.block_read_balances`
  (both zero now).\n  They say whether a slow block is the disk, RocksDB's cache or
  the CPU.\n- **`haskoin-store-bench import`** times the import of four kinds of full\n
  \ block on a database of a million unspent outputs, and prints the stages and\n
  \ the size of the batch (`bench/Import.hs`, `docs/block-import.md`).\n  **`haskoin-store-bench
  merge`** times reads of balances and spenders over\n  merge records that RocksDB
  has not compacted yet (`bench/Merge.hs`).\n- **`--background-jobs`** (`BACKGROUND_JOBS`):
  how many threads RocksDB may\n  use for flushes and compactions, RocksDB's default
  unless set. More of them\n  shorten a backlog of compactions when the disk and cores
  have room.\n  `StoreConfig` has `backgroundJobs`. Needs `rocksdb-haskell-jprupp`
  2.8.0.\n- **In the library:**\n  - `Haskoin.Store.Database.Writer`: `runWriterReport`
  gives a `BatchReport`\n    with the `BlockTimes` of a block and the size of its
  batch; the\n    `readAhead` functions fill a batch's read cache with multi-gets
  on all\n    cores; `mergeBalance` and `mergeSpender` change a balance or a group
  of\n    spenders without reading it; `withoutReadCache` reads the database every\n
  \   time.\n  - `Haskoin.Store.Logic.prepareBlock` gives the hashes, addresses and
  sizes\n    of a block.\n  - `Haskoin.Store.Database.Table`: the hash tables of a
  batch, keyed by the\n    hash that each key already holds.\n  - `Haskoin.Store.Database.Merge`:
  the merge operators of the balances and\n    the spenders.\n  - `Haskoin.Store.Database.Migrate`:
  `recordsVersion`, and a `MigrationError`\n    that says in words what is wrong with
  a version.\n  - `Haskoin.Store.Database.Reader` exports `withReader`,\n    `columnFamilyConfig`,
  `layeredFamilyConfig` and `mergeGuardFamily`, for\n    tests and benchmarks that
  open a database with other settings.\n  - `Haskoin.Store.Common.sortTxsWith` takes
  the hashes of the transactions\n    from a caller that has them.\n  - `Haskoin.Store.Exception`:
  `catchAny`, `handleAny` and `tryAny` catch any\n    error but not what stops a thread
  from outside; `bracket`, `bracket_`,\n    `finally` and `onException` run a cleanup
  that cannot be interrupted.\n  - `Haskoin.Store.Integration.Temp`, in the `integration`
  library: temporary\n    directories for the tests, the benchmark and the stress
  test.\n\n### Changed\n- **The fleet remembers what it saw, in Redis** (`fleet:seen`):
  the last\n  100,000 transactions that the pool decided on, taken, refused as a\n
  \ conflict or let go unconfirmed, marked by the pool's script in the same\n  step.
  No store fetches them again when a peer announces them, after a\n  restart either;
  what a store holds unoffered it does not fetch again from\n  its own peers. Each
  store kept its own set in memory before.\n- **Indexes and filters stay in memory**
  with their open table files, outside\n  the block cache, so data blocks can no longer
  evict them (about 0.34% of the\n  database).\n- **Redis is required, and every store
  is a member of a fleet**, even a\n  fleet of one (`docs/one-fleet.md`). Without
  Redis, or behind the fleet tip,\n  a store is unhealthy: `/health` answers 503,
  where it was 203 without Redis.\n- **The mempool is only in Redis.** A store hands
  the transactions that its\n  peers send to the pool and keeps no mempool of its
  own; RocksDB holds the\n  chain alone. A reverted block's transactions leave RocksDB,
  and the tip move\n  gives them back to the pool. `Haskoin.Store.Logic.Layered` is
  now\n  `Haskoin.Store.Logic`, which imports and reverts blocks, and `Query.Pooled`\n
  \ has `chainRead` in place of `databaseRead`.\n- **Migration:** a database of version
  18, 19 or 20 has its unconfirmed\n  transactions taken out of the chain's indices,
  and the pool gets them again\n  from the peers. Nothing is written to the old mempool
  column families.\n- **The tip move and the xpub cache are one Redis commit.** The
  member that\n  moves the fleet tip writes the cache's part in pieces, marking the
  entries\n  it touches (`cacheBegin`, `cachePieces`); one script then moves the pool,\n
  \ the fleet tip and the cache tip and stamps the entries (`fleetCommit`). A\n  read
  of a marked entry waits up to two seconds, then has its request\n  answered again.\n-
  **A reorganisation never empties the cache.** It is undone address by\n  address
  from the views at recent blocks (`tipMoves`). A store without a view\n  of the old
  tip does not move the tip; only a restart of the pool empties the\n  cache.\n- **The
  pool fills again after Redis loses its data.** An epoch key\n  (`fleet:epoch`) tells
  the stores; each asks its peers for their mempools\n  again and, with `--node-rpc`,
  reads its node's, 2,000 transactions every two\n  seconds. Xpub entries are built
  again on demand.\n- **Fewer round trips to Redis.** The fleet's Lua scripts are
  loaded once and\n  called by digest (`EVALSHA`), loaded again after `NOSCRIPT`.
  A request that\n  reads nothing of the pool, such as `/block/best`, reuses a tip
  seen in the\n  last 5 ms.\n- **Every answer about an xpub comes from the fleet's
  cache**, never from the\n  database. The routes `/xpub/{xpub}` (with `balances`,
  `transactions`,\n  `transactions/full` and `unspent`) and the Blockchain.info routes\n
  \ `multiaddr`, `rawaddr`, `unspent`, `balance` and `export-history` read the\n  cache,
  and on a miss wait for the one job that indexes the xpub. One store\n  of the fleet
  builds each entry, holding its dibs in Redis with its\n  estimate; the others wait
  for the commit, which Redis announces. Visible to\n  clients:\n  - a request that
  would wait longer than `--xpub-wait` (now ten seconds,\n    from five) gets 429
  `server-busy` with a `Retry-After` from the one\n    estimate in Redis, the same
  on every store. The estimate of a running job\n    comes from its size (`Budget.sized`)
  and the recent time per\n    transaction. The job goes on unless the xpub is beyond
  `--xpub-horizon`\n    or the queue is full. A request for several xpubs is refused
  with the\n    longest wait;\n  - a failed job, or an xpub evicted before the request
  read it twice, gives\n    503 with `Retry-After: 1`;\n  - every xpub is cached after
  its first query, small ones included;\n  - `swagger.yaml` has the 429 and 503 on
  each of these routes.\n- **A request reads one version of each xpub, never parts
  of two.** Every\n  commit gives an entry a new version, and a read gives the version
  in the\n  same script. A request that finds another version later is answered again\n
  \ from the start, before anything was sent (`web.reruns`). Responses built\n  from
  transaction bodies take each transaction's confirmation and each\n  output's spender
  from the entry at that version, read with the bodies in\n  one round trip.\n- **Lookahead
  addresses.** An entry holds a gap's worth of unused addresses\n  after each chain's
  window, so a payment to a wallet's next address is in\n  its entry as soon as the
  pool takes it.\n- **Redis evicts xpubs by GreedyDual**, keeping longest those that
  would\n  cost most to index again (`Haskoin.Store.XPub.greedyLua`). Entries record\n
  \ their cost in `fx:e:<id>:meta`, and `fx:prio` and `fx:level` replace\n  `fx:lru`.
  `cachedEntry` of `Haskoin.Store.Fleet.XPub` takes whether the read\n  is a use,
  and `cacheBuild` takes no time.\n- **The filters of `/events`** ask the indexer
  for an xpub that the cache does\n  not have, as the routes do. A refusal answers
  the stream or the opening of\n  a websocket with 429 or 503, and closes an open
  websocket with 1013.\n- **Options that no longer choose anything are gone:** `--redis`
  (`REDIS`),\n  `--fleet` (`FLEET`), `--no-xpub` (`NO_XPUB`), `--no-mempool`\n  (`NO_MEMPOOL`),
  `--sync-mempool` (`SYNC_MEMPOOL`), `--wipe-mempool`\n  (`WIPE_MEMPOOL`), `--redis-min-addrs`
  and `--redis-min-txs`\n  (`REDIS_MIN_ADDRS`, `REDIS_MIN_TXS`). `--redis-url` defaults
  to\n  `redis://localhost:6379`. `--redis-max-xpubs` only sets the size of the\n
  \ cache, and the store refuses to start below 1. `nocache` is accepted from\n  older
  clients and ignored.\n- **Removed from the library:** the database mempool and its
  copy in memory\n  (`Haskoin.Store.Database.Mempool`, `Haskoin.Store.Database.Copy`),
  the\n  layered queries (`Haskoin.Store.Database.Query.Layered`), the Redis cache\n
  \ of a store alone (`Haskoin.Store.Cache`), `runWriterMempool`,\n  `MempoolChanges`,
  `importBlockSequential`, `newMempoolTx`,\n  `deleteUnconfirmedTx`, and the metrics
  `store.mempool` and\n  `store.block_read_mempool`.\n- **A block is imported in stages,
  several times faster.** A full block took\n  a store of mainnet 13 to 18 seconds,
  with its disk and half its cores idle.\n  Now the hashes, addresses and sizes are
  worked out once on all cores; every\n  key the import needs is read ahead with multi-gets
  into the batch's cache,\n  each key once; the rules run in memory; and the batch
  is serialised on all\n  cores and written in one write. The database that comes
  out is the same,\n  byte for byte, as the tests check against the import of 1.15.1.\n-
  **The batch of a block is handed to RocksDB packed**, 256 KiB a call\n  (`writePacked`
  of `rocksdb-haskell-jprupp` 2.8.0): some forty foreign calls\n  for a block where
  there were 65,000. It is still one atomic write.\n- **A mined block is not validated.**
  A block that passed proof of work is\n  taken to have valid transactions, so the
  import reads only what it needs to\n  write the block: no spender of the chain,
  and no output that the block\n  itself makes. Only a coinbase is looked up in case
  it is confirmed already,\n  as two of 2010 are. A block that is not valid is written
  whole or not at\n  all; one that spends an output a block has spent is refused as
  an orphan.\n- **Database version 23: a block changes balances and spenders without\n
  \ reading them.** It writes how they change as RocksDB merge records, which\n  two
  merge operators that come with the store work out on reads and\n  compactions (`Haskoin.Store.Database.Merge`,
  `cbits/haskoin_store_merge.c`).\n  - **Upgrading from version 22 is one write**,
  made when the store first\n    opens the database.\n  - **There is no way back.**
  An older haskoin-store fails to open the\n    database, with an error about the
  column family `merge-operators`, and\n    leaves it as it was. Take a copy first
  if you may want to go back.\n  - **Answers are the same.** A balance or spender
  that recent blocks changed\n    costs a read a few microseconds more until RocksDB
  compacts it.\n  - Reverting a block reads and writes whole values, as before, and
  still\n    checks that a balance does not go below zero.\n- **Every table file stays
  open by default** (`--max-open-files 0`, where it\n  was 2000): with more files
  than the limit, a store of Bitcoin Cash opened\n  some 70,000 files to send one
  block. Raise the process's limit on open files\n  above the number of table files.\n-
  **The index and the filter of a table file are written in 4 KiB pieces**,\n  loaded
  as needed, where each was one block of up to megabytes. Files already\n  on disk
  keep the old layout until RocksDB rewrites them; until then give\n  the block cache
  about 1% of the database's size. Needs\n  `rocksdb-haskell-jprupp` 2.8.0.\n- **Lists
  are read from the database in chunks** (`rocksdb-query` 0.7.0):\n  one foreign call
  for a few hundred entries, in constant stack, where there\n  was one call for each
  entry. Those calls took some 28% of the processor\n  time of a busy store.\n- **Faster
  hashing and serialisation.** The hash tables of a batch hash keys\n  by the hash
  they already hold, the block store no longer hashes a block's\n  transactions again,
  and `stack.yaml` takes haskoin-core, haskoin-store-data\n  and haskoin-node from
  commits that serialise on a buffer directly.\n- **The heap collects less often.**
  The executable runs with `-A64m`, 64 MiB\n  of new objects for each core between
  collections, where GHC's default is 4:\n  about 60 MiB more memory a core for far
  fewer pauses. The collector is GHC's\n  default again; `GHCRTS=--nonmoving-gc` selects
  the non-moving one of 1.15.1.\n- **No secp256k1 context in the API of the library.**
  The store is built on\n  haskoin-core 2.0.0, haskoin-store-data 3.0.0 and secp256k1-haskell
  3.0.0,\n  where the context is global and `Ctx` is gone. The server is the same;\n
  \ programs that embed the library must change:\n  - delete `withContext`, `createContext`
  and every `ctx` passed to this\n    package; the field `ctx` is gone from `StoreConfig`,
  `Store`,\n    `BlockStoreConfig`, `StoreRead` and `DatabaseReader`, and `writerCtx`
  is\n    removed;\n  - `withLayeredReader`, `runWriter`, `deriveFunction`, `toUnspent`,\n
  \   `valToUnspent`, `poolTx`, `blockChanges`, `seenOf`, `relevant` and\n    `command`
  lost their `Ctx` argument and kept the order of the others;\n  - see the \"Migrating\"
  sections of the changelogs of haskoin-core and\n    haskoin-store-data.\n- **No
  unliftio.** The package uses `base`, `stm` and `async`, and is built on\n  nqe 0.7.0
  and statsd-rupp 0.6.0, whose functions now run in `IO`. No\n  exported type changed.
  A program that calls nqe or statsd-rupp from another\n  monad must lift those calls
  itself.\n- **Peers that hold up blocks are passed over.**\n  - A peer that delivers
  nothing for `--block-stall` seconds (ten by default)\n    is passed over and the
  next fastest asked for the same blocks; the stall\n    doubles for each peer passed
  over, up to the peer timeout.\n  - Blocks are asked only from peers that announced
  them, or that gave a\n    height at least that of the block when they connected.\n
  \ - The peers that have a block are pinged, and the first to answer is asked;\n
  \   one slower than `--block-ping` seconds (five by default) only if none\n    answers
  in time.\n  - The peer timeout (`--peer-timeout`) is 30 seconds by default, where
  it\n    was 120. A block of 32 MB must arrive within it, which takes a link of\n
  \   9 Mbit/s: set it higher on a slower one.\n  - `StoreConfig` and `BlockStoreConfig`
  have `blockStall` and `blockPing`,\n    and the block store takes `blockStoreAnnounced`
  and `blockStorePong`.\n- **`Haskoin.Store.Web.Router`:** a `Route` has a `cost`,
  light, short or\n  long, and the scope of `routerScoped` is told which route matched.\n\n###
  Fixed\n- **`/events` can watch an xpub again.** Its filter read the cache through\n
  \ a session with no balances, so every xpub filter failed with 503 or close\n  code
  1013. It now reads in a session of its own.\n- **A store whose last block is old
  still reports to its fleet.** Reports\n  are gated on being in sync and having peers,
  not on the age of the last\n  block, so a quiet chain such as regtest gets a fleet
  tip.\n- **A large wallet is read into the cache ten times faster.** Reloads found\n
  \ the bodies to read with `nub`, which is quadratic: on a wallet of 45,000\n  transactions
  that took 26 of the 28 seconds of its first reload, on 1.15\n  too. They de-duplicate
  with a hash set now, in linear time. The addresses\n  of a new transaction are no
  longer de-duplicated at all, as a set joins\n  them anyway.\n- **Requests no longer
  queue up behind each other in Warp's timeouts.**\n  time-manager 0.3 edits GHC's
  one timer queue at every pause, resume and\n  tickle of a connection's timeout,
  and under load a simple request waited\n  some 40 ms with a core idle. time-manager
  0.4.2 is pinned in `stack.yaml`\n  and bounded in `package.yaml`.\n- **Responses
  no longer wait for each other for their `Date` header.** Warp\n  computed its date
  once a second, and every response waited when the thread\n  computing it was stopped
  on a busy core. The store now gives every response\n  a `Date` of its own, computed
  twice a second.\n- **`store.block` reaches the StatsD server.** It was sent with
  a sampling\n  rate of zero, which sends nothing; now with a rate of one.\n\n## [1.15.1]
  - 2026-11-14\n\n### Added\n- **Metrics of the garbage collector.** With `--statsd`,
  the store sends\n  GHC's statistics under `rts.*` once a second: collections, the
  time that\n  every thread was stopped for them, the CPU that they used, the work
  of\n  the non-moving collector, allocation, and the size of the live data and\n
  \ of the heap. Every collection stops every thread, so they say how much\n  of a
  slow answer is the collector's. The executable now runs with\n  `+RTS -T`, which
  GHC needs to keep them.\n\n### Changed\n- **The old generation is collected while
  the store runs.** The executable\n  uses GHC's non-moving collector (`--nonmoving-gc`).
  The copying collector\n  stopped every thread while it copied all live data, gigabytes
  for a store\n  of mainnet, and under load every request waited for it, `/health`\n
  \ included. The heap can be larger, as old objects are not moved together.\n  `GHCRTS=--copying-gc`
  goes back to the copying collector.\n\n## [1.15.0] - 2026-11-14\n\nAnswers decode
  less of what they read, and write hex faster.\n\n### Changed\n- **Raw answers send
  the transactions as stored.** A raw transaction,\n  raw block, or the raw transactions
  of a block, were decoded, built into\n  their JSON form, with addresses and ids,
  turned back and serialized\n  again; and the spenders of their outputs were read
  for nothing. Now the\n  bytes of each transaction are found in its stored value
  and written as\n  they are. The raw block of 3,011 transactions of the load test
  takes 21\n  ms of CPU where it took 60, and its raw transactions 24 ms where they\n
  \ took 65. This covers `/transaction/:txid/raw`, `/transactions/raw`,\n  `/transactions/block/:block/raw`,
  the five `/block/…/raw` routes, and\n  the hex of `/blockchain/rawtx` and `/blockchain/rawblock`.\n-
  **A block's list of transactions is decoded when it is used.** Reading\n  a block
  decoded the hashes of all its transactions, 180 µs for a block\n  of 3,000, for
  the many reads that want its height or its header: the\n  health check, the best
  block of a request, the median time of a new\n  transaction, blocks without their
  transactions. `/block/best?notx=true`\n  on a block of 3,011 transactions takes
  0.06 ms of CPU where it took\n  0.24, and `/block/latest?notx=true` 31% less.\n-
  **Transactions in JSON are built without serializing them.** Their size\n  and weight
  are counted from their parts, and the id of a transaction\n  read by its id is not
  computed again (haskoin-store-data's\n  `toTransactionWithId`). With the faster
  hex of haskoin-core, 5,000 full\n  transactions of an address take 20% less CPU,
  and the 3,011 of a block\n  21% less.\n- **Hex is written faster** (haskoin-core):
  from a table of digit pairs,\n  and the hashes of transactions and blocks in one
  step, five times as\n  fast. A list of 100 transactions of an address takes 12%
  less CPU.\n- `StoreRead` has `getManyTxBytes`, the transactions as stored, and the\n
  \ new module `Haskoin.Store.Database.Slices` reads stored values in part.\n- The
  load test's last block holds 3,000 more transactions, when the chain\n  has 400
  blocks or more, and `scripts/bench-web.sh` measures the raw\n  answers.\n\n## [1.14.0]
  - 2026-11-14\n\nLong answers are encoded on several cores, addresses are written
  faster,\nand the load-test server works again.\n\n### Changed\n- **Long answers
  are encoded on several cores.** The answers that are\n  sent in pieces, such as
  the full transactions of an address, an xpub or\n  a block, and raw blocks, now
  encode up to eight pieces at once, as many\n  as the server has cores. On 5,000
  transactions of an address, with eight\n  cores, a request took 77 ms where it took
  176 ms. A server whose cores\n  are all busy answers about as many requests as before.
  In the library,\n  the pieces of `Haskoin.Store.Web.Pieces` are a `Piece`, made
  with\n  `piece` from an action that gives bytes, and `piecesResponse` takes how\n
  \ many to read at once.\n- **Addresses are written faster**, with haskoin-core 1.6.3,
  which this\n  version needs. Every input and output of a transaction in JSON carries\n
  \ its address. For 20,000 of them, reading the address from its script\n  takes
  3 ms where it took 33, writing a legacy address 60 ms where it\n  took 81, and a
  SegWit address 50 ms where it took 81. CashAddr was fast\n  already. A whole answer
  of transactions takes some 30% less to build and\n  encode.\n\n### Fixed\n- The
  load-test server, `haskoin-store-bench`, builds and syncs again. It\n  lacked the
  `nodeRpc` setting of 1.11.0, and it found no peer: since\n  haskoin-node 2.5 the
  mock peer has to be named, as the unit tests do.\n  `scripts/bench-web.sh` measures
  two answers of 5,000 transactions too,\n  and `BENCH_LOG=1` prints the log of the
  server.\n\n## [1.13.0] - 2026-11-13\n\nTransactions are handed over at once, a payment
  that a block replaced is\nanswered 410, and what a reorganisation puts back stays
  in the mempool.\n\n### Added\n- **A transaction that a block replaced is answered
  410, Gone**, at\n  `/transaction/:txid` and its raw form, with the transaction of
  the block\n  that won (`replaced-by`) and its height, for 2016 blocks. It was 404,
  as\n  for a transaction that never was, and a payment that a reorganisation\n  replaced
  simply vanished. A store keeps it with the block and deletes it\n  with its revert.
  The stores of a fleet keep it in the shared pool, as\n  the fleet tip moves past
  the block, and answer from that alike: a\n  store's own record depends on its own
  mempool. A transaction replaced in\n  the mempool is still 404. The client of haskoin-store-data
  reports the\n  410 as an error it does not know, until that package learns it.\n\n###
  Changed\n- **`POST /transactions` answers 202, \"handed over\", at once.** The store\n
  \ checks the transaction, hands it to every peer, each on a connection of\n  its
  own, and answers as soon as they took it, with the id and a message.\n  It no longer
  waits up to `--publish-timeout` for a node to announce the\n  transaction back:
  the wait was arbitrary, and said less than it seemed,\n  as Bitcoin Core refuses
  in silence. The transaction shows in the store\n  when a node announces it, usually
  within a second. A transaction that the\n  store has in a block is still answered
  200, and one that a node refuses\n  over RPC, or that every peer refuses with a
  reason, 400. The client of\n  haskoin-store-data takes the new answer as it took
  the old one.\n- With `--node-rpc`, a transaction that the node takes is answered
  202 too.\n- In the library, `Haskoin.Store.Web.Publish` answers with what was done\n
  \ (`Answer`: `ToPeers`, `ToNode`, `InBlock` and refusals) in place of\n  `Verdict`,
  and has no `Limits` or `Outbox`. `Haskoin.Store.Logic.Layered`'s\n  `revertBlock`
  takes the time of the revert, and `Haskoin.Store.Logic` has\n  `revertBlockAt`,
  which the tests compare it with.\n\n### Removed\n- **`--publish-timeout`** (`PUBLISH_TIMEOUT`),
  and the outbox that kept\n  failed transactions from being sent again for ten minutes.\n\n###
  Fixed\n- **Transactions that cost the store its connections are refused.** On\n
  \ regtest, a signature pushed in a longer form than it needs, and more\n  CashTokens
  out than in, both passed the store's checks, and Bitcoin Cash\n  Node closed every
  connection of the store when it was sent one. The\n  store now refuses an input
  script that does more than push data or\n  pushes it in a longer form than it needs,
  tokens that break the rules of\n  CashTokens, and a version that nodes do not take:
  1 and 2 on Bitcoin\n  Cash, 1 to 3 on Bitcoin. `docs/publishing.md` has what was
  measured.\n- **A transaction that a reorganisation puts back in the mempool stays\n
  \ there.** It went back with the time of its block, and the store deletes\n  mempool
  transactions older than `--mempool-timeout` (14 days) on every\n  clock tick: a
  transaction of a block older than that was gone in under a\n  second, while the
  nodes kept it. On a regtest chain whose blocks are\n  older than the timeout, every
  reorganisation did it. It now goes back\n  with the time of the revert.\n\n## [1.12.1]
  - 2026-11-13\n\n### Fixed\n- **A transaction that the store has unconfirmed is sent
  again** when it\n  is posted again. The store answered 200 at once and sent nothing,
  as\n  for a confirmed one. Its mempool is not held to its node's, so it could\n
  \ list a payment that the nodes forgot, after a reorganisation or when a\n  node
  lost its mempool, and the wallet had no way to get it back to them:\n  on Bitcoin
  Cash none at all until the store dropped it after 14 days.\n  Now it goes through
  the same checks, is given to a node over RPC or on\n  the courier, and is answered
  200 when the node took it, or with the\n  node's reason. A confirmed transaction
  is still answered at once.\n\n### Changed\n- In the library, the field `has` of
  `Haskoin.Store.Web.Publish.Publishing`\n  is now `holds`, which says whether the
  store has the transaction in a\n  block, in its mempool or not at all (`Held`).\n\n##
  [1.12.0] - 2026-11-13\n\nLong lists of transactions and raw blocks are sent while
  they are read,\nand pretty JSON is gone.\n\n### Removed\n- **Pretty JSON.** The
  `pretty` parameter is gone from every endpoint, and\n  a request with it is refused
  like any other unknown parameter. Pipe an\n  answer through a tool such as `jq`
  to read it indented.\n\n### Changed\n- **Long answers are sent while they are read.**
  The endpoints that answer\n  with all the transactions that the database lists somewhere
  read them a\n  hundred at a time, and send each hundred while they read the next:\n
  \ - `/address/:addr/transactions/full`, `/address/transactions/full` and\n    `/xpub/:xpub/transactions/full`;\n
  \ - `/transactions/block/:block` and `/transactions/block/:block/raw`;\n  - the
  raw blocks: `/block/:block/raw`, `/block/best/raw`,\n    `/block/height/:height/raw`,
  `/block/time/:time/raw` and\n    `/block/mtp/:time/raw`;\n  - `/blockchain/rawblock/:block`,
  in JSON and in hex, and\n    `/blockchain/block-height/:height`.\n\n  The bytes
  are the same. With 5,000 transactions of an address (15 MB) on\n  regtest, the first
  byte left after 11 ms where it took 96 ms, and sixteen\n  such requests at once
  took 197 MB of memory where they took 1,014 MB. The\n  whole response takes as long
  as before: encoding JSON is most of it.\n- These responses have no `Content-Length`.
  What can refuse the request is\n  checked before the first byte; a failure after
  it ends the response\n  before it is complete, where it used to be an error with
  a status.\n- Lists that the client names, such as `/transactions?txids=`, are read\n
  \ whole before they are answered, as before: what is asked for may not be\n  there.\n-
  The timings of these endpoints count the whole response, the time that\n  the client
  takes to read it included.\n- No longer depends on aeson-pretty.\n- **The warning
  of a slow request counts the whole response**, until its\n  last byte is sent. It
  counted only the time to make the status, which\n  for an answer sent while it is
  read is the first hundred transactions.\n  A client or proxy that reads slowly can
  now make a request slow. A\n  response cut short is logged too, ending in `, cut
  short`.\n\n## [1.11.0] - 2026-11-12\n\n`POST /transactions` is done another way,
  and now says what came of the\ntransaction. `docs/publishing.md` has the design
  and the measurements.\n\n### Changed\n- **A 200 means that a full node accepted
  the transaction and that the\n  server has it.** It used to mean that the transaction
  was sent, and came\n  at once whatever happened. The request now waits for a node
  to announce\n  the transaction back, for `--publish-timeout` (`PUBLISH_TIMEOUT`)\n
  \ seconds at most, 30 by default. With a node that whitelists the store\n  that
  takes milliseconds.\n- The transaction is handed to one node, on a connection made
  for it. It\n  used to go to half the peers, on the connections the store syncs from.\n-
  The transaction comes into the mempool when a node announces it on a\n  connection
  that never sent it. The store used to ask the peers it had\n  sent it to, once,
  five seconds later.\n- The same transaction posted again is sent once, and one that
  the store\n  has is not sent at all.\n\n### Added\n- The store refuses, with 400
  and the reason, a transaction that it can\n  tell no node will take:\n  - one that
  spends an output it does not know, one that a confirmed\n    transaction has spent,
  or a coinbase less than a hundred blocks old;\n  - one whose outputs are worth more
  than its inputs, or that is a\n    coinbase;\n  - one whose lock time has not passed;\n
  \ - one larger than nodes relay, or with an output that is dust;\n  - **one with
  a forged signature**, for coins locked to one key: key\n    hash, key, witness key
  hash plain or nested, and Taproot by its key;\n    on Bitcoin Cash with ECDSA and
  Schnorr signatures, and for coins that\n    hold tokens. This is `judgeInputs` of
  haskoin-core 1.6.2, which also\n    verifies multisig: with ECDSA signatures on
  both networks, with\n    Schnorr signatures on Bitcoin Cash, and the multisig of
  Taproot.\n- `--node-rpc` (`NODE_RPC`): the JSON-RPC URL of a full node. The store\n
  \ publishes through it (`sendrawtransaction`): the node checks\n  everything, says
  why it refuses, which Bitcoin Core does not tell a\n  peer, and does not close the
  store's connections over what it refuses.\n  When the node does not answer, the
  transaction goes to a peer.\n- **A peer is sent only what the store verified.**
  A transaction with an\n  input that the store cannot verify, a script that is not
  a key or a\n  multisig, is refused with 400 unless the store can send it over RPC.
  A\n  peer that finds a transaction invalid may close every connection of\n  the
  store, so sending on what it could not judge let anyone cut the\n  store off from
  its peers.\n- The reason of a node that refuses a transaction and says why, as Bitcoin\n
  \ Cash Node does, is the message of the 400.\n- 500 when no node could be reached,
  when a node closed the connection on\n  receiving the transaction, and when no node
  announced it in time. The\n  reference always listed these errors; the code gave
  none of them.\n- A transaction that a node refused, closed the connection on, or
  did not\n  announce is remembered for ten minutes and not sent again. Other\n  transactions
  are published as before.\n- The body of `POST /transactions` is read up to the length
  of the longest\n  transaction of the network in hexadecimal, and a longer one is
  answered\n  413. The server used to read a body of any size into memory.\n- `Store`
  has `connect`, the function that opens a connection to a node.\n- The integration
  tests run a store against a Bitcoin Core and a Bitcoin\n  Cash Node that do not
  whitelist it.\n\n### Fixed\n- **A published transaction was often not seen until
  a block confirmed\n  it.** Bitcoin Core does not give a transaction back on the
  connection\n  that sent it until its timer for announcements has run, five seconds
  on\n  average: the one request the store made at five seconds got `notfound`\n  three
  times in four against Bitcoin Core 32.1. A store whose only node\n  did not whitelist
  it then never took the transaction in.\n- **One request could cut a store off from
  half its peers.** A node that\n  finds a transaction invalid may close every connection
  from the address\n  that sent it, and Bitcoin Cash Node 29.2 does. A forged transaction
  went\n  to half the peers on the connections the store syncs from.\n- With no peer
  connected the answer was 200 and nothing was sent.\n\n## [1.10.1] - 2026-11-12\n\n###
  Changed\n- `swagger.yaml` names one server, `./`: the server that served it,\n  wherever
  it is mounted. It no longer lists the servers of api.haskoin.com,\n  which describe
  whatever version those run, not the server in front of\n  you. The server serves
  the file as it is, instead of adding itself to\n  that list.\n- The reference page
  at `/` has no list of servers to choose from and no\n  bar to load another description:
  it shows the reference of the server\n  that serves it, and nothing else.\n\n###
  Fixed\n- The licence links of `swagger.yaml` and `README.md` pointed to a file\n
  \ that does not exist, and the version in `swagger.yaml` said 1.9.1.\n\n## [1.10.0]
  - 2026-11-12\n\nThe API speaks JSON only. Its binary format is gone, from the server
  and\nfrom the documentation.\n\n### Removed\n\n- **The binary format.** `Accept:
  application/octet-stream` no longer\n  gives binary: every answer is JSON, errors
  and `/events` included. The\n  \"Binary format\" sections of `README.md` and `swagger.yaml`
  are gone.\n  Clients built with haskoin-store-data before 2.0.0 ask for binary and\n
  \ do not work with this server; version 2.0.0 of its client speaks JSON.\n- **Binary
  frames over the WebSocket** of `/events`. Events are sent in\n  text frames, and
  a binary frame from the client closes the connection\n  as a command that cannot
  be read.\n- **Raw bytes in `POST /transactions`.** The body is the transaction in\n
  \ hex.\n\n### Changed\n\n- Answers have `Vary: Accept-Encoding`, without `Accept`,
  which no longer\n  changes what is answered.\n- Depends on haskoin-store-data 2.0.0.\n\n###
  Added\n\n- `docs/fleet-mempool.md`: how the shared mempool of a fleet works, why\n
  \ it holds, and its weak points. A report in the repository, not in the\n  package.\n\n##
  [1.9.1] - 2026-11-11\n\n### Changed\n\n- **The health check runs every second**,
  where it ran every thirty, and\n  at once when the store has a new best block. `/health`
  answers from the\n  last result, so a load balancer and a fleet acted on news of
  up to half\n  a minute ago. Redis is asked every five seconds.\n  `--health-check-interval`
  still sets the interval.\n\n- **Log levels say who has the problem.** An error in
  the log is now\n  something wrong with the store or its database, so that an alert
  on\n  errors is worth having. The README has a table of the levels.\n  - A transaction
  from a peer that the store refuses (an orphan, a double\n    spend, one without
  funds, one already confirmed) is logged for\n    debugging. These were errors, several
  a minute on a healthy server.\n  - A request answered 4xx or 503 is logged for debugging,
  like a\n    successful one. Only a 500 is an error.\n  - A peer that times out or
  sends a block that was not asked for is a\n    warning.\n  - Redis or the price
  service not answering is a warning: the store\n    goes on without them, and `/health`
  says so.\n  - **An outage of Redis is logged once when it starts and once when it\n
  \   is over** (`Haskoin.Store.Outage`), and for debugging in between. The\n    loops
  of a fleet and the worker of the cache each logged every failed\n    attempt, every
  second or two, and nothing said when Redis was back.\n    `memberLoop`, `memberCacheLoop`
  and `memberEvents` no longer take a\n    function to tell of a failure.\n  - Each
  transaction imported into the mempool is logged for debugging,\n    where it was
  information.\n  - With haskoin-node 2.5.1: a peer that hangs up or misbehaves is
  not an\n    error, and the comings and goings of peers are logged for debugging.\n\n###
  Fixed\n\n- **A fleet could stop answering for good after an outage.** A server goes\n
  \ through 50 blocks at most to tell the shared mempool what they did, and\n  further
  than that it may only empty the mempool, which Redis allowed to\n  a server that
  was alone. Two or more servers that came back together\n  more than 50 blocks past
  the block that the fleet last answered from\n  each kept the other from moving on,
  and every request was answered 503\n  `behind-fleet` from then on.\n  - Any server
  may now move the fleet when the way is too long for all of\n    them (`fleetRestart`,
  `wayBetween`): the shared mempool is emptied, a\n    counter in Redis says so (`fleet:restarts`),
  and every server that\n    sees it offers its whole mempool again. A server did
  not notice\n    before that another one had emptied the mempool.\n  - A test builds
  the stuck fleet on purpose, with two members of one\n    fleet (`Haskoin.Store.Fleet.MemberSpec`).\n-
  **A server that had just started took a turn in its fleet before its\n  first health
  check**, reported the blocks that it had then, and with no\n  other server there
  moved the fleet to them. It now waits for the check.\n\n### Added\n\n- **A change
  of health is logged**: a warning with what is wrong when\n  `/health` stops answering
  200, and a line when it does again; the same\n  for Redis. Nothing said so before
  but the 503s of the requests.\n- **An access log**, off by default: `--access-log`
  (`ACCESS_LOG`) logs\n  every request with the address of the client, the status
  and the time\n  it took.\n- With `--debug`, a member of a fleet says why its report
  was not taken\n  and what became of each attempt to move the fleet's block.\n- `HASKOIN_TEST_LOG`
  prints the time of each line, and the lines of the\n  two stores of the fleet test
  under their names.\n- **A slow request is logged as a warning**, with how long it
  took:\n  `--slow-request` (`SLOW_REQUEST`), five seconds by default, 0 for never.\n-
  `stress/results/2026-11-10/`: the results of a full default stress run\n  on version
  1.9.0, with a comparison against the run of the day before on\n  1.8.1. A cache
  reload takes 234 ms on average where it took 2,448, and\n  no longer grows with
  the xpub.\n\n## [1.9.0] - 2026-11-10\n\n### Added\n\n- `--fleet` (`FLEET`): servers
  that share a Redis answer as one. Every\n  request is answered from the newest block
  that all live servers have and\n  from one mempool that they share in Redis, so
  that the same request gets\n  the same answer whichever server a load balancer picks,
  also while a\n  block or a transaction is on its way through them.\n  - Each server
  keeps its database as it was at each of its last six\n    blocks, reports them under
  a lease of ten seconds, and offers its\n    unconfirmed transactions to the shared
  pool. The fleet tip moves in one\n    step, together with what the blocks in between
  did to the pool.\n  - A server that does not have the block that the fleet answers
  from says\n    503 with `behind-fleet`. One whose health check fails stops reporting,\n
  \   and stops counting when its lease runs out.\n  - Without Redis a server answers
  from its own database and `/health` says\n    203.\n  - `Haskoin.Store.Manager`
  runs the member (`Store.fleet`), the block\n    store takes a view of the database
  right after each block\n    (`BlockStoreConfig.onBest`), and the web server answers
  through\n    `Haskoin.Store.Database.Query.Pooled`.\n  - An integration test runs
  two servers as a fleet against a real node and\n    Redis and compares their answers
  with a payment in the pool and after\n    the block that confirms it.\n  - `docs/layered-database/FleetCost.hs`
  times a store alone against the\n    same store in a fleet, with 40,000 transactions
  in the pool: a fleet\n    adds about one round trip to Redis to a request. A request
  is answered\n    from the tip that the member last read, which its first read of
  the\n    pool checks; a transaction's body comes with what spends its outputs;\n
  \   and a first page is as large as the page asked for.\n\n- A cache of xpubs for
  a fleet (`Haskoin.Store.Fleet.XPub`), under the\n  options of the cache of a server
  alone: `--redis-min-addrs`,\n  `--redis-min-txs` and `--redis-max-xpubs`. Until
  now `--fleet` answered\n  every request about an xpub from the database, with a
  read of the shared\n  pool for each address that it touches.\n  - An entry has the
  chain's part of a wallet at one block, which is the\n    same for the whole cache,
  and the part of the shared pool, which the\n    script of the pool keeps as it changes
  the pool. Transactions and\n    outputs of both are in one sorted set each, in the
  order of the API.\n  - The cache answers only while its block is the fleet tip.
  The server\n    that moves the tip brings the cache along, with what the new blocks\n
  \   did at the addresses that entries have. If it does not, or after a\n    reorganisation,
  the cache is emptied.\n  - The cache is at a move of the fleet tip, which the pool
  counts, and\n    not just at a block: the tip can leave a block and come back to
  it.\n  - Every read of balances runs the scan of the xpub over the entry and\n    misses
  unless it reads exactly the addresses of the entry, so a\n    payment in the pool
  to an unused address cannot leave the gap wrong.\n  - Entries are built in the background
  by the server that missed, and\n    extended when an xpub gains addresses.\n  -
  A request about a wallet of 464 addresses and 19,499 transactions\n    takes 1.3
  to 2.2 milliseconds through it, where a fleet took 5 to 38;\n    for a wallet with
  400 addresses in the pool, 3 to 4 where it took 5 to\n    126 (`docs/layered-database/fleet-cost.txt`).\n
  \ - The test of the member compares every answer about a wallet through\n    the
  cache with the uncached one after each step of random histories,\n    and the two
  servers of the integration test do the same over HTTP.\n  - StatsD metrics under
  `fleet.cache.*`: hits, misses, builds and their\n    time, builds given up, evictions,
  and the times that the cache was\n    emptied. The log says why the cache was emptied
  each time, and with\n    `--debug` has a line for each entry built and each block
  that the\n    cache was brought to.\n- Built with `rocksdb-haskell-jprupp` 2.7.1,
  and every scan by address\n  uses an iterator that RocksDB stops where the address
  ends, so that a\n  scan cannot walk over deleted keys that follow it. The migration
  reads\n  the transactions with an iterator that is asked for the order of them\n
  \ all.\n- Built with `haskoin-node` 2.5.0, which has the fixes of its security\n
  \ review: among them, a block from a peer is checked against its header\n  before
  the store sees it, so a peer can no longer pass off transactions\n  of its choice
  under a real header. It also allows the new binding. On\n  regtest its discovery
  no longer finds a node on this machine: name the\n  node with `--peer`.\n- **`/events`
  agrees across a fleet.** The servers of a fleet send the\n  events of the block
  and the mempool that they share, read from a stream\n  in Redis that the pool's
  script writes as it makes each change, and no\n  longer those of their own nodes.
  A block is told when the fleet has\n  moved to it, with every block that it moved
  through.\n- **`/events` takes up where a client left.** `?after=` with the hash
  of\n  the last event heard starts the stream after it, over HTTP and over the\n
  \ WebSocket. The server keeps its last 10,000 events in one log that all\n  clients
  read (`Haskoin.Store.Web.Events`), in place of a queue for each.\n  It answers 404
  when it does not have the event. The servers of a fleet\n  keep the same events,
  so a client may come back to another one.\n- **A WebSocket client chooses the transactions
  it hears about**: by\n  address, by extended public key with a type of address,
  or with a Bloom\n  filter as in BIP 37, with the commands of `EventCommand` in\n
  \ `haskoin-store-data` 1.11. Blocks are always sent, and a client that\n  sends
  no command hears everything, as before. A key is watched up to its\n  gap, which
  moves on with its payments.\n- **The choice can be in the URL of `/events`**, so
  that it holds from\n  the first event: `quiet=true` for blocks alone, `addresses`,
  `xpub` with\n  `derive` (one type or several), and `filter` with `functions`, `tweak`\n
  \ and `flags`. The HTTP stream takes them too, also under `POST` with a\n  form.
  `{\"type\":\"none\"}` goes back to blocks alone.\n- **The WebSocket speaks binary
  too**: binary frames when the handshake\n  asks for binary or the client sends a
  binary frame, for events and\n  commands alike.\n- **HTTPS**, optional and off by
  default: `--tls-cert` and `--tls-key`\n  (`TLS_CERT`, `TLS_KEY`) make the server
  speak HTTPS on its port.\n- **The reference of the API at the root of the server.**
  `/` is a page\n  that shows `swagger.yaml` as it was when the server was built,
  and can\n  try requests against it; `/swagger.yaml` is the file.\n- **`HEAD` and
  `OPTIONS`** are answered: the headers of what `GET` gives,\n  and what a browser
  may send from another site.\n- **Answers are compressed** with gzip for clients
  that accept it, but for\n  the stream of events.\n- **Lists in a body.** The endpoints
  that take a list of addresses,\n  blocks, heights or transactions accept `POST`
  with the parameters in a\n  form, so that a long list need not fit in a URL.\n-
  **`Retry-After`** on every 503.\n- **Errors in binary.** A request that asks for
  the binary format gets\n  its errors in that format too, the 503 of a server behind
  its fleet\n  included. They were JSON whatever was asked. This needs\n  `haskoin-store-data`
  1.10, whose client reads both.\n- **The `Accept` header is read as a list with weights.**
  Binary is sent\n  when `application/octet-stream` is listed with a weight above
  0 that is\n  no less than that of `application/json`. The header used to be compared\n
  \ with that one string, so a list or a weight silently gave JSON. Every\n  answer
  has `Vary: Accept`.\n- **The raw lists start with a count**, in binary: `/transactions/raw`,\n
  \ `/block/{block}/transactions/raw` and `/block/height/{height}/raw` were\n  the
  one kind of list without it. A binary client of those three\n  endpoints has to
  change with the server.\n- `haskoin-store --help` names the environment variable
  of every option.\n- `swagger.yaml` documents the binary format: how to ask for it,
  the\n  encoding of each type that the API returns, and what differs from JSON.\n-
  Gauges `fleet.cache.xpubs` and `fleet.cache.addresses`: how many xpubs\n  the cache
  of a fleet holds, and how many addresses between them.\n\n### Changed\n\n- A WebSocket
  client of `/events` that sends something the server cannot\n  read as a command
  is disconnected, with code 1008 and the reason. What\n  clients sent used to be
  ignored.\n- The HTTP stream of `/events` no longer holds a view of the database
  for\n  as long as its client listens.\n\n- Since version 2.6.4 the binding reads
  the key and the value of a row of\n  an iterator without the cost of a safe foreign
  call.\n  Every list and every count takes between a half and a third of the time:\n
  \ the first 100 transactions of a busy address 221 microseconds instead of\n  575,
  and the number of transactions of a wallet with 19,499 of them 34\n  milliseconds
  instead of 78.\n- **Bloom filters are on by default**, as was always meant: until
  the\n  binding was fixed, `--bloom` built none. `--no-bloom`, or `BLOOM=false`,\n
  \ turns them off; `--bloom` is still accepted. An existing database gets\n  filters,
  and the memory that they take in the block cache, as its table\n  files are written
  again.\n- **Transactions that leave the mempool unconfirmed are no longer kept.**\n
  \ The API already answered 404 for them, but their bodies stayed in the\n  database,
  marked as deleted, for ever, and each server had its own.\n  - A server remembers
  the last hundred thousand that it deleted, in\n    memory, so as not to fetch them
  again from its peers. The fleet's rule\n    for conflicting transactions and the
  cache of a server alone, which\n    both asked the database whether a transaction
  had been deleted, ask\n    that memory instead.\n  - The cache of a server alone
  takes a transaction that Redis has as\n    unconfirmed for more than ten minutes,
  and that the database does not\n    have, for deleted and not for one that it has
  not seen yet.\n  - Bodies that version 20 marked as deleted stay in a migrated database\n
  \   and are ignored. A page that starts at a deleted transaction is empty.\n- Removed
  reports that no longer describe the store: five intermediate\n  stress runs, the
  measurement of a mempool mirrored in memory, and the\n  superseded runs in `docs/layered-database/query-cost.txt`.\n
  \ `docs/layered-database.md` is rewritten as a description of what\n  exists, a
  quarter of its length.\n- **Database version 22: the record of a confirmed transaction
  is written\n  once**, by the block that confirms it, and is the same on every server\n
  \ that has the block, so that what the chain's column families hold\n  follows from
  the chain alone.\n  - **Its time is the time of its block.** A server that had seen
  a\n    transaction in its mempool used to keep the time of that when a block\n    confirmed
  it: two servers then gave two values of `time` for the same\n    confirmed transaction,
  which the servers of a fleet must not do. A\n    transaction that returns to the
  mempool when its block leaves the main\n    chain has the time of that block there.\n
  \ - **The spenders of its outputs are under keys of their own**, in the\n    `spender`
  column family, sixteen outputs to a key (`SpenderKey`).\n    They were in the record,
  which each block that spent one of its\n    outputs read and wrote whole again.
  A spend now reads and writes a\n    value of a few dozen bytes and leaves the record
  alone.\n  - Reading a confirmed transaction in full takes a second key: 18\n    microseconds
  where it took 11.5, and 0.8 milliseconds for a hundred\n    where it took 0.4. Lists
  by address and by xpub cost the same, and so\n    does writing, on the small records
  of the measurements.\n  - A database of version 21 is migrated the first time the
  store opens\n    it (`migrateRecords`). **It reads every transaction of the database\n
  \   and writes nearly every one again**, since nothing lists those that\n    need
  it and most have a spender in them: many hours for a database of\n    Bitcoin, and
  room for a second copy of its transactions until RocksDB\n    has compacted the
  first away. The log says how far it is, and it can\n    be interrupted and started
  again.\n  - The tests that run the store through random histories now choose them\n
  \   from a database of version 20 that goes through the same\n    (`withShadow`).
  Given a layered database, the chooser found next to\n    nothing in the mempool,
  and the blocks of the tests of the fleet\n    confirmed almost none of it.\n- **Database
  version 21: the mempool has an area of its own.** Unconfirmed\n  transactions are
  no longer written into the indices of the chain. They\n  are kept apart and applied
  on top when a query is answered\n  (`docs/layered-database.md`), so the chain's
  data changes only when a\n  block is imported or reverted.\n  - A database of version
  20 is migrated the first time the store opens it,\n    and the log says how many
  mempool transactions were moved. **Older\n    stores refuse the database afterwards**:
  copy a production database\n    before upgrading.\n  - The block store imports with
  the rules of `Haskoin.Store.Logic.Layered`.\n    A block that spends an output of
  a transaction that is only in the\n    mempool is refused as an orphan; no valid
  block does that.\n  - Each request of the web server reads one snapshot of the database
  for\n    everything it answers, so the parts of a response agree with each\n    other.
  `routerScoped` in `Haskoin.Store.Web.Router` is what gives a\n    request its snapshot.\n
  \ - `--wipe-mempool` deletes the keys of the mempool area, in less time\n    than
  it took to delete each transaction by the rules, and it no longer\n    keeps the
  wiped transactions as deleted ones.\n  - `StoreRead` has a new query, `getAddressesTxCount`.\n
  \ - Programs that embed the store and read its database with\n    `Haskoin.Store.Database.Query`
  have to move to\n    `Haskoin.Store.Database.Query.Layered`: the old queries do
  not see the\n    mempool of a database of version 21.\n- Xpub addresses are derived
  up to an exact gap: every address up to the last\n  used one of each chain, then
  exactly `--xpub-gap` unused ones, and always\n  the first `--xpub-gap-init` addresses.
  Addresses used to be read 32 at a\n  time with the gap checked between batches,
  so the store looked between 33\n  and 64 addresses past the last used one, and started
  counting again at index\n  20. This is why api.haskoin.com saw a payment 34 addresses
  past the last\n  used one, which wallets with a gap of 20 or 32 do not see. Payments
  that far\n  away are no longer seen; raise `--xpub-gap` to see them.\n- New Redis
  cache of xpubs (`Haskoin.Store.Cache`), replacing the old one:\n  - Whenever a transaction
  touches a cached xpub, or a reorganisation changes\n    one of its transactions,
  the store reads the whole xpub again from its\n    database and replaces the entry
  in one Lua script, so cached answers are\n    always answers of the database.\n
  \ - Everything a response needs is in Redis, transaction bodies included,\n    shared
  between xpubs, with the spenders of their outputs kept up to date.\n    A store
  that has not imported a transaction yet still serves it.\n  - Several stores can
  share one Redis. Each change of a cached xpub is\n    claimed and applied once,
  by the first store to see it; stores that catch\n    up find their changes done
  and do no work. A store never replaces an entry\n    that knows more than its database
  (a higher block, or a transaction it has\n    not seen), so stores do not undo each
  other's work, and every entry is\n    written together with the bodies it needs,
  so a store that is behind can\n    serve it in full.\n  - The rules for claims and
  for replacing entries are pure decisions\n    (`Haskoin.Store.Cache.Protocol`).
  A model test runs several stores\n    catching up with a chain in random interleavings
  against a model of\n    Redis, and checks that they end with the entry of the tip,
  that no\n    store replaces an entry with one that knows less, that each change
  is\n    written once, and that stores catching up after the first write nothing.\n
  \ - A reload writes only the differences between the xpub in the database\n    and
  its entry in Redis, read in chunks first, instead of rewriting the\n    whole entry;
  its script checks that the entry did not change since.\n    Rewriting an xpub of
  15,000 transactions held Redis for up to 77 ms,\n    during which it answered no
  other client. A store reloads up to four\n    xpubs at once.\n  - A page of the
  transactions or unspent outputs of a cached xpub is one\n    round trip to Redis:
  a Lua script finds where it starts, from the\n    position of the start transaction
  in the xpub itself, and reads it.\n    It took four or five, and read the whole
  body of the start\n    transaction to find its position.\n  - A store marks a cached
  xpub as used at most every ten seconds, for\n    eviction, instead of on every read,
  which made every read a write.\n  - `--redis-min-txs` (`REDIS_MIN_TXS`, default
  1000) also caches xpubs\n    with at least that many transactions in their addresses,
  however few\n    addresses they have.\n  - Keys start with `hs2:<network>:`, so
  the cache can share a Redis with the\n    cache of older versions and with stores
  of other networks.\n  - `--redis-max-xpubs` (`REDIS_MAX_XPUBS`, default 10000) replaces\n
  \   `--redis-max-keys`: the least recently used xpubs past this many are\n    evicted.
  `--redis-sync-interval` is removed.\n  - StatsD metrics: `cache.hits`, `cache.misses`,
  `cache.reloads`,\n    `cache.stale`, `cache.evictions` and `cache.reload` (milliseconds).\n-
  `n_tx` of `/blockchain/multiaddr` counts every transaction of the shown\n  addresses
  and xpubs, not only those on the page, and `n_tx_filtered` those\n  that pass the
  filter. `n_tx` of `/blockchain/rawaddr` for an xpub is its\n  number of transactions,
  not the size of the page.\n- The web server runs directly on WAI and Warp, without
  Scotty. Routes,\n  parameters and passing a request to the next route are in\n  `Haskoin.Store.Web.Router`,
  a small router over WAI; a handler is a plain\n  function from the state of the
  server and the request to a response in\n  `IO`, and stops early by throwing an
  `Except`, which becomes the JSON\n  error. Every response carries `Access-Control-Allow-Origin:
  *`, error\n  responses included. The endpoints, their parameters and their responses\n
  \ are as before.\n- No monad transformers, except conduits, and no functions polymorphic
  over\n  `MonadIO` or `MonadUnliftIO`: everything runs in plain `IO`. Database queries
  are\n  functions that take the `DatabaseReader` (`Haskoin.Store.Database.Query`);\n
  \ imports take a `Writer` handle (`Haskoin.Store.Database.Writer`,\n  `Haskoin.Store.Logic`);
  the block store and the manager pass their state\n  explicitly. The classes `StoreReadBase`
  and `StoreReadExtra` are replaced\n  by `StoreRead`, a record of the same queries
  as functions in `IO`, which\n  `databaseRead` gives for a database; `getTransaction`
  and the other\n  helpers of `Haskoin.Store.Common` take it as their first argument.
  The state\n  of the web server, which every handler takes as an argument instead
  of\n  reading it from a `ReaderT`, holds the queries to answer with, the cache\n
  \ in front of those about xpubs;\n  `nocache=true` gives a handler a state whose
  queries read only the\n  database. `withStore`, `runWeb`, `runWebSocket` and the
  `blockStore*`\n  functions are in `IO`. `WriterT`, `ImportM`, the `StoreWrite` class,\n
  \ `BlockT`, `CacheT`, `DatabaseReaderT` and `withDB` were removed earlier\n  in
  this release. This changes the library API.\n- The package uses the GHC2024 edition,
  with `DuplicateRecordFields`,\n  `NoFieldSelectors`, `OverloadedRecordDot` and `OverloadedStrings`
  on for\n  every module, and explicit deriving strategies.\n\n- haskoin-store-data
  moves to its own repository,\n  [jprupp/haskoin-store-data](https://github.com/jprupp/haskoin-store-data),\n
  \ with its history and its own releases, and haskoin-store moves to the root\n  of
  this one; `store/` and `data/` are gone. haskoin-store depends on\n  `haskoin-store-data
  ^>= 1.9`. The package has a full description, PVP\n  upper bounds on every dependency,
  and no `Setup.hs`.\n- Legacy addresses are called `legacy` in the `derive` parameter,
  the default.\n  `normal`, the name they had, is still accepted, so old URLs keep
  working;\n  it said nothing about the kind of address. Error messages use the new\n
  \ name. Built with haskoin-store-data at commit `b304acd2`.\n- The executable gives
  memory back to the system as soon as its heap no\n  longer needs it (`--disable-delayed-os-memory-return`
  in its default RTS\n  options). By default GHC marks such memory free for the kernel
  to take when\n  it runs short, and Linux counts it as resident until then, so the
  heap of a\n  busy store seemed to grow without end, by the size of each peak, with
  little\n  live data. The stress test records the resident GHC heap and how much
  of it\n  is lazily freed. The heap profile and the runs that found this are in\n
  \ `stress/results/2026-11-09-memory`, and `scripts/heap-profile-summary.py`\n  summarises
  a heap profile.\n- The cache brings an entry up to date from what changed, instead
  of reading\n  the whole xpub from RocksDB and Redis on every change, which the stress
  test\n  showed was almost all the time of a reload, growing to seconds at 100,000\n
  \ transactions per xpub. A reload reads the changed transactions, the outputs\n
  \ they create and spend at addresses of the xpub, and the balances of its\n  addresses,
  which are compared with Redis's to catch a change the entry\n  missed. The whole
  xpub is still read when it is first cached, when the\n  entry is more than a block
  behind, when an address with transactions enters\n  or leaves the gap, when a balance
  does not match, and every ten minutes.\n  Entries keep an index of their unspent
  outputs by outpoint\n  (`x:<id>:uop`), in format version 3; entries of version 2
  are upgraded by\n  their next reload. New metric `cache.full_reloads`.\n- A reload
  whose balances show changes it was not told of first looks for\n  them, instead
  of reading the whole xpub: the transactions that the database\n  has for the addresses
  whose balances moved, in the mempool or in blocks\n  after the one the entry was
  written at, and the mempool transactions of the\n  entry that have since been confirmed
  or dropped, up to 1,000. Under load the\n  database is often ahead of the events
  being applied, which made about one\n  reload in ten of the stress test a full one.\n-
  Bodies that Redis already has, such as those of the transactions that a\n  block
  confirms, are rewritten before the commit of a reload, 200 to a\n  script, instead
  of in it. The commit of a block that confirms a thousand\n  transactions of an xpub
  had about 8,000 arguments and held Redis for 10 to\n  30 ms, the only commands of
  the stress test that took that long.\n- The scheduled full reload of a cached xpub
  comes every five to ten\n  minutes, an interval that depends on the xpub, instead
  of every ten for\n  all. Xpubs cached together were read whole together each time:
  in the full\n  stress test, four xpubs of tens of thousands of transactions raised
  the\n  heap from under 100 MiB to 785 MiB for a few seconds every ten minutes.\n-
  `docs/cache-consistency.md` analyses how a cached xpub can differ from the\n  database
  without any check noticing, including spenders of cached\n  transactions that no
  reload repairs, and what would prevent it.\n- `docs/layered-database.md`: a design
  for keeping the mempool out of the\n  chain's indices, in an area of its own that
  is applied on top when a query\n  is answered, with the measurements behind it and
  what it means for the\n  cache. The store still runs on the layout of version 20;
  this adds the\n  parts that could be proved ahead of the switch:\n  - `Haskoin.Store.Database.Types`
  has the keys of the mempool area\n    (`MemSpenderKey`, `MemAddrKey`, `MemDeletedKey`)
  and a marker for\n    migrations that work in several writes (`MigrationKey`).\n
  \ - `Haskoin.Store.Database.Mempool` has the keys that one mempool\n    transaction
  contributes, and what the mempool does to the balance and\n    the unspent outputs
  of an address.\n  - `Haskoin.Store.Database.Migrate` moves a database of version
  20 to the\n    layered layout without a resync: it takes every mempool transaction
  out\n    of the chain's indices and writes it to the mempool area, in atomic\n    batches
  that can be interrupted. Nothing calls it yet.\n  - `withLayeredReader` opens a
  database with the extra column family,\n    `mempool-addr`, that the layout needs.\n
  \ - Tests build databases with the store's own rules from random histories\n    of
  payments, blocks, replacements, deletions and reorganisations,\n    migrate them,
  and check that every query answers as before, that the\n    chain's column families
  are those of a database that never saw a\n    mempool, and that emptying the mempool
  area leaves the chain's answers.\n- `Haskoin.Store.Logic.Layered`: the rules that
  import and revert blocks\n  and add, replace and delete mempool transactions in
  the layered layout of\n  `docs/layered-database.md`, with the functions, results
  and errors of\n  `Haskoin.Store.Logic`. Blocks are written to the chain's column
  families\n  alone, and the mempool to its own area. The store does not use them
  yet.\n  - `Haskoin.Store.Database.Writer` can write the mempool area in the same\n
  \   atomic batch as the chain; batches of today's rules write nothing there.\n  -
  Tests give the same random history to both sets of rules, on Bitcoin and\n    on
  Bitcoin Cash: payments, replacements, deletions, blocks in and out of\n    order,
  reorganisations, and transactions and blocks that must be\n    refused. Every operation
  must have the same result and move the same\n    transactions in and out of the
  mempool, every query must answer the same\n    after it, and at the end the database
  of today's rules, once migrated,\n    must equal that of the new rules key for key.\n
  \ - One difference is on purpose: a block that spends an output of an\n    unconfirmed
  transaction is refused by the new rules, as that output is\n    not in the chain.
  Today it is imported.\n- `Haskoin.Store.Database.Query.Layered`: every query of
  the store for the\n  layered layout, with the names and arguments of\n  `Haskoin.Store.Database.Query`,
  and `layeredRead`, which gives them as the\n  record of queries that the web server
  answers with. The store does not use\n  them yet.\n  - A query takes a `View`, a
  RocksDB snapshot that only `withView` makes,\n    so that the chain and the mempool
  are read as they were at one moment.\n  - Pages are cut from the mempool's part
  of a list followed by the chain's\n    part, by today's rules for starts, offsets
  and limits, for one address,\n    for several, and for extended public keys.\n  -
  Mempool spenders are looked up only for the outputs of a transaction\n    that no
  block spends, in one multi-get for a whole page of transactions.\n  - `MemDeletedKeyP`
  matches deleted transactions by the start of their\n    hash, for the short transaction
  numbers of the Blockchain.info API.\n  - Tests ask today's queries and the new ones
  for pages with random\n    limits, offsets and starts, on databases migrated from
  today's layout,\n    on databases built by the rules of the layered layout, and
  on databases\n    upgraded in the middle of a history. They also check that an open
  view\n    goes on answering from its moment while blocks and transactions are\n
  \   written.\n- A summary for each address that the mempool touches, in the layered\n
  \ layout (`MemSummary`, under `MemAddrSumKey`): the number of its mempool\n  transactions,
  and the amounts and numbers of the outputs that the mempool\n  pays to it, spends,
  and both pays and spends. The measurements showed the\n  queries of that layout
  to be too slow for an address with much in the\n  mempool, and for any address right
  after a block, because they scanned\n  everything that the mempool has for an address
  to answer anything.\n  - A balance is now two reads by key, and an address with
  nothing in the\n    mempool is found by a key that is not there.\n  - Lists of transactions
  and of unspent outputs read the mempool's entries\n    only for addresses that have
  some, and only as far as the page goes.\n  - The rules keep the summary with every
  transaction that enters or leaves\n    the mempool, and the migration writes all
  of them from the entries that\n    it moved. The tests work every summary out again
  after each operation.\n  - Measured again with `QueryCost.hs`: the balance of an
  address with\n    6,216 entries in the mempool takes 11 microseconds instead of
  35\n    milliseconds, a page of its transactions what it takes in version 20,\n
  \   the balances of a wallet of 464 busy addresses 1.9 milliseconds instead\n    of
  110, and nothing gets slower right after a block. Keeping the\n    summaries costs
  about 110 microseconds for each transaction that passes\n    through the mempool.
  `docs/layered-database.md` has the tables.\n- `docs/layered-database/QueryCost.hs`
  writes one synthetic history into a\n  database of each layout and times the rules
  and the queries of both,\n  checking that the answers agree. `docs/layered-database.md`
  has the\n  results and what follows from them: writing costs the same when syncing\n
  \ and 14% more for a transaction that passes through the mempool; the new\n  queries
  cost 10 to 15 microseconds more for a request when the mempool\n  has nothing for
  what is asked; and they are too slow, as built, for\n  addresses that the mempool
  touches a lot and for any address right after\n  a block. The document proposes
  a summary for each address in the mempool\n  area, read by key, and two changes
  to the RocksDB binding.\n- Documentation: a page that starts at a height has no
  unconfirmed\n  transactions, whatever the height. The comment on `AtBlock` said
  that a\n  height above the best block includes them, and the API reference could
  be\n  read that way. The behaviour is unchanged.\n- The stress report breaks the
  commands that blocked Redis down by script,\n  and commits by full and incremental
  reloads, with their numbers of\n  arguments.\n- `Haskoin.Store.Fleet`: the rules
  by which stores that share a Redis agree\n  on one block to answer from, the fleet
  tip, as pure decisions with a model\n  test. It is the first part of the design
  for a fleet that answers as one,\n  in `docs/layered-database.md`. Nothing uses
  it yet.\n  `Haskoin.Store.Fleet.Redis` carries the rules out against Redis, with
  a\n  Lua script for each step that has to be one step, and a test that takes\n  random
  sequences of steps through a real Redis and through the rules and\n  compares them
  after each. `Haskoin.Store.Fleet.Pool` has the rules of the\n  mempool that such
  stores share, as of the fleet tip: what may be offered,\n  which of two conflicting
  transactions stays, what leaves and why, and how\n  the pool follows the tip forwards
  and across a reorganisation. A model\n  test keeps it valid on top of the tip through
  random offers, blocks and\n  reversals. One more Lua script carries these rules
  out, moving the tip and\n  changing the pool in one step, and is compared with them
  step by step in a\n  real Redis like the others; the comparison found a case that
  the rules had\n  left open, a transaction that comes back from an abandoned block
  and\n  spends what the pool already spends, which now wins. The pool also keeps,\n
  \ for each address, what its transactions do there: the transactions and\n  the
  outputs paid to it in the order of a list, the outputs of it that are\n  spent,
  and their sums, so that a balance is one read and a list is read\n  by the page,
  as in a store's own mempool area.\n- `Haskoin.Store.Database.Query.Pooled`: the
  queries of the store with a\n  mempool that is not its own on top of the chain,
  for the shared pool of a\n  fleet. `read.lua` and `poolRead` read that pool from
  Redis, each read\n  with a check that the fleet tip has not moved. The tests hold
  these\n  queries to those of the layered layout with the store's own mempool as\n
  \ the pool. `fleetAdvance` can empty the pool for a store that is alone and\n  does
  not know the way from the old tip.\n- `Haskoin.Store.Fleet.Member`: what a store
  does as a member of a fleet.\n  It keeps a view at each recent block, reports them,
  moves the fleet tip\n  with what the blocks in between did to the pool, offers its
  mempool, and\n  answers from the view at the tip with the pool on top. A test with
  a real\n  Redis takes a store that is alone in its fleet through random histories\n
  \ and compares every answer with the store's own after each step. It found\n  that
  a body kept in the pool went stale when a parent was confirmed or\n  came back,
  because a transaction inherits from its unconfirmed parents\n  whether it can be
  replaced by fee; the pool now keeps that apart from the\n  body and corrects it
  as transactions come and go.\n- `Haskoin.Store.Database.Views` keeps the database
  as it was at each recent\n  block, a RocksDB snapshot for each, so that a store
  can answer from the\n  block that its fleet agrees on and not only from its newest.
  Views that\n  are no longer needed are let go, and one that a request is reading
  is\n  released when the request is done. Nothing uses it yet.\n- A store whose Redis
  does not answer goes on answering from its database,\n  instead of failing every
  request that the cache would have served. A\n  request waits at most two seconds
  for Redis; after that the store leaves\n  Redis alone until a health check finds
  it again. Meanwhile `/health`\n  answers 203, Non-Authoritative Information, with
  the header\n  `Haskoin-Degraded: redis`, when every other check passes: a status
  in the\n  200s, so that load balancers keep the store, and not 200, so that\n  monitoring
  notices. The body of `/health` has a new check, `redis`, for a\n  store that has
  a cache; it does not count towards `ok`. It comes with\n  haskoin-store-data 1.9.0,
  which the store now takes from Hackage.\n- Breaking: transactions that were deleted
  are no longer returned. A\n  transaction that was replaced, dropped from the mempool,
  or was the\n  coinbase of a block that left the main chain used to answer by id
  with\n  `\"deleted\": true`; clients that did not look at that field took it for
  a\n  pending payment. It now gives 404, is left out of lists of transactions\n  fetched
  by id, and a page cannot start at it. The `deleted` field stays in\n  responses
  and is always false. The bodies stay in the database.\n- Breaking: parameters are
  checked. A request with a parameter that its\n  endpoint does not accept, such as
  a misspelt `limt=10` or `pretty` on the\n  Blockchain.info endpoints, which never
  honoured it, gives 400\n  `Unknown parameter: …`; and a value that cannot be read,
  such as\n  `notx=yes`, `limit=-1`, `filter=4`, `format=xml` or an unknown currency,\n
  \ gives 400 `Invalid value for parameter …`. Both used to be ignored, and\n  the
  client got an answer to a question it did not ask. Requests are\n  checked before
  anything is done. The Blockchain.info endpoints accept\n  `format=json`, which their
  clients often send. Each route of the router\n  declares the parameters it accepts,
  and reading an undeclared one is an\n  error of the program, so the two cannot drift
  apart.\n- An xpub asked about with the wrong `derive` gives 400, with a message
  that\n  names the right kind, instead of an empty wallet: when the xpub has no\n
  \ transactions with the kind asked for, the store checks the first\n  `--xpub-gap-init`
  addresses of the other kinds. This applies to the `/xpub`\n  endpoints and to `/blockchain/rawaddr`.
  A wallet unused with every kind\n  still gets an empty answer, and wallets in use
  cost nothing more.\n- `swagger.yaml` explains the API, not only lists it: an introduction
  to its\n  conventions (amounts, ordering, paging, formats, errors, unconfirmed\n
  \ transactions, reorganisations, xpubs, live events, Blockchain.info\n  compatibility)
  and the reasons for them, and a description of every\n  endpoint, parameter and
  field. It documents `/dbstats`, the WebSocket at\n  `/events` and the `time` field
  of the health check, which were missing,\n  and corrects the health check examples
  and the version.\n- The README tutorial pages with `height`, the parameter the server
  reads;\n  it said `start`, which the server ignores.\n- Every line of code is shorter
  than 120 columns, `swagger.yaml` included,\n  whose long hexadecimal and xpub examples
  are split into equal pieces that\n  parse to the same values. `scripts/format` formats
  `integration/` and\n  `stress/` too.\n- Scripts live in files of their own: the
  Lua scripts of the cache in\n  `src/Haskoin/Store/Cache/lua/`, embedded at compile
  time with\n  `file-embed`; the script of wrk in `stress/wrk.lua`, one for every\n
  \ endpoint, given its paths on the command line; and the shell steps of CI\n  in
  `scripts/check-local-deps.sh` and `scripts/install-system-libraries.sh`.\n  The
  scripts do the same as before.\n\n### Fixed\n\n- `--bloom` builds Bloom filters.
  It built none when the store was built\n  against RocksDB 6.24 or later, as the
  Docker image is, because\n  `rocksdb-haskell-jprupp` passed the size of the filter
  to RocksDB with the\n  wrong type. Nothing failed; a lookup of a key that is not
  there just went\n  on reading data blocks to find that out. The store is now built
  with\n  `rocksdb-haskell-jprupp` 2.6.3, which has the fix. A store that already\n
  \ runs with `--bloom` starts building filters when it is upgraded, for the\n  table
  files written from then on: about 1.25 bytes for each key, held in\n  the block
  cache. Size that on a full database, or turn the option off to\n  keep things as
  they were.\n- `--bloom` no longer asks for filters on the two indices by address,
  which\n  are scanned and not read by key. With a filter, a scan of an address that\n
  \ has nothing steps over every key deleted since the last flush: 810\n  microseconds
  after 5,000 mempool transactions were deleted, against 13\n  without filters. No
  store was affected, because no filter was ever built;\n  with the fixed binding
  they would have been. The option still builds\n  filters for transactions, unspent
  outputs, blocks, balances and the\n  mempool.\n- `/blockchain/multiaddr` no longer
  reads every transaction of the wallet to\n  count them. `n_tx` of one xpub is its
  count (a `ZCARD` when it is cached);\n  for several xpubs and addresses, the database
  counts the distinct\n  transactions of all their addresses from the keys of its
  index. The\n  transactions of a page are read in pages of about the size asked for,
  and\n  their bodies a page at a time, instead of one by one; `/blockchain/rawaddr`\n
  \ does the same. In the stress test, with xpubs of about 15,000\n  transactions,
  the median time of a multiaddr request went from 3.2 seconds\n  to 36 milliseconds,
  and it no longer grows with the wallet.\n- Containers left by an integration test
  run that was killed are removed\n  by the next run, as intended: listing them used
  a template that Podman\n  refuses, so they were never found.\n- `--peer HOST[:PORT]`
  works as documented. It was read as a Haskell\n  string, so only `--peer '\"HOST:PORT\"'`,
  with the quotes, was accepted.\n- The syncing peer is disconnected when it sends
  a block that was not\n  requested, as the documentation of the block store said.
  The block was\n  imported if the node knew its header. The state of the block download
  is\n  now a pure state machine (`Haskoin.Store.BlockStore.Sync`) with property\n
  \ tests, which also found that a block listed twice in one request was\n  outstanding
  twice.\n- The block store no longer starts a thread for every transaction it\n  requests,
  to forget the request twenty seconds later. Requested and\n  received mempool transactions
  are one pure value\n  (`Haskoin.Store.BlockStore.Pending`), with property tests,
  and old\n  requests are forgotten on the clock tick of the block store.\n- Build
  against haskoin-node 2.4.0, from the head of its\n  `fix-header-sync-stall` branch.
  The block store reserves its syncing peer\n  as an owner of its own (`reservePeer`,
  `releasePeer`), so no other part of\n  the node can release it; header searches
  run with `chainRunHeaders`. The\n  store stopped following the chain\n  when a peer
  announced new blocks with an inventory message instead of\n  headers, which peers
  do when many blocks are found at once; it stayed at\n  the old height until the
  peer reconnected.\n- Mempool transactions that entered the mempool in the same second
  could be\n  listed twice in the transactions of an xpub or a multiaddr wallet, and\n
  \ their order differed from page to page. Every merge now orders them as the\n  database
  and the cache store them (`txRefKey`, `unspentKey`).\n- `nocache=true` on `/xpub/:xpub/transactions`
  and `/xpub/:xpub/unspent` no\n  longer reads, or fills, the cache.\n- `confirmations`
  of `/blockchain/unspent` no longer wraps around for an\n  output in a block newer
  than the chain of the store.\n\n### Added\n\n- `scripts/stress-cache.sh`, a stress
  test of the Redis cache: a regtest\n  chain, Valkey and wrk in Podman, a haskoin-store
  server, hundreds of\n  thousands of transactions between a few wallets, and wrk
  on their xpubs\n  all the while, with a report (`scripts/stress-report.py`) of reloads,\n
  \ lag, resources, the commands that blocked Redis (from its slow log) and\n  latencies,
  and a check of the cached answers at the end. The Podman\n  helpers of the integration
  tests are an internal library (`integration`)\n  that the stress program shares,
  and the test image has wrk in a layer of\n  its own.\n- `stress/results/2026-11-09/`:
  the results of a full default stress run,\n  kept for comparison with later runs.\n-
  `runWebSocket` serves the API on a socket that already listens. The tests\n  bind
  port 0 and pass the socket, so their web servers get free ports with\n  no window
  in which another program could take them; the containers publish\n  their ports
  on random ports of the host.\n- Integration tests against regtest chains of Bitcoin
  Core and Bitcoin Cash\n  Node, with Valkey, in Podman containers built from Ubuntu
  26.04 and\n  release tarballs checked against pinned hashes, one cached layer per\n
  \ download, so nothing is downloaded twice. They are skipped when Podman\n  cannot
  run containers or `HASKOIN_STORE_NO_PODMAN` is set.\n\n## [1.8.1] - 2026-11-07\n\n###
  Changed\n\n- Documentation: the README explains the purpose and design of the store,
  with\n  installation steps, a full configuration reference, monitoring and a\n  tutorial,
  and the Haddock of every module and function says why it works the\n  way it does.\n-
  Build against nqe 0.6.9, rocksdb-haskell-jprupp 2.6.1, rocksdb-query 0.6.1,\n  statsd-rupp
  0.5.0.2, secp256k1-haskell 2.0.1, haskoin-node 2.3.1 and\n  Stackage nightly-2026-11-07.\n\n##
  [1.8.0] - 2026-11-07\n\n### Changed\n\n- Index the mempool by the time each transaction
  entered it. `/mempool`,\n  `/blockchain/unconfirmed-transactions` and the health
  check read only the\n  page they return, newest first, instead of loading and sorting
  the whole\n  mempool on every request. Data version 20: a version 18 or 19 database
  is\n  migrated when it is opened, with no resync.\n- The block store no longer reads
  the whole mempool to publish mempool\n  events, to set the mempool gauge or to find
  expired transactions. Each\n  import reports which transactions it added to the
  mempool or removed from\n  it; pruning reads only the oldest entries of the index.
  Before, every\n  block, every batch of new transactions and every clock tick (several
  per\n  second) read the whole mempool at least once.\n- Count the transactions of
  an xpub without building the list of all of them\n  when the cache is not used.\n-
  Keep the derived addresses of the 512 to 1024 most recently queried xpubs\n  in
  memory. Every xpub query derived each address again before reading a\n  balance.
  Addresses depend only on the xpub, so the cache never goes stale.\n- Page the unspent
  outputs of an xpub by merging its addresses in order of\n  block, stopping once
  the page is full, instead of decoding up to offset\n  plus limit outputs of every
  address and sorting them all. The pages are\n  the same.\n- Count the transactions
  of an xpub by merging the raw keys of its\n  addresses, without decoding keys or
  reading values.\n- Open the iterators of a query over many addresses in one bracket
  instead\n  of one bracket each. Every call into RocksDB walked the stack past one\n
  \ frame per address.\n- Double the page, up to 1024 rows, when streaming a source
  by offset, as\n  `/blockchain/unspent` does. The rows read and skipped grew with
  the square\n  of the rows returned.\n- Check that an xpub is cached in the same
  Redis round trip as the read of\n  its balances, transaction count, or a page of
  its transactions or unspent\n  outputs that does not start at a transaction.\n-
  Serialize a transaction at most twice to compute its id, size and weight,\n  and
  stop looking up its witnesses with a quadratic list index.\n- Build on haskoin-core
  1.6.1, which encodes CashAddr and Base58 addresses\n  faster: about 10% less CPU
  per request on endpoints that return many\n  addresses.\n- The executable uses every
  core of the host by default (`-N` instead of\n  `-N4`). Set `+RTS -N<n> -RTS` on
  the command line to choose a number.\n- Read the balances of many addresses, and
  lists of transactions, with one\n  RocksDB multi-get instead of one read per key.
  `StoreReadBase` has a new\n  method, `getManyTxData`, which defaults to reading
  the transactions one by\n  one; `getTransactions` reads many transactions with it.\n-
  Give RocksDB a block cache of 1 GiB by default, shared by all column\n  families,
  and keep their index and filter blocks in it at high priority,\n  with those of
  level 0 pinned. Before, each column family had RocksDB's\n  default cache of 32
  MiB, and index and filter blocks stayed in memory\n  outside any cache for every
  open file. Set the size with `--block-cache-mb`\n  or `BLOCK_CACHE_MB`; 0 restores
  the RocksDB defaults. `StoreConfig` and\n  `withDatabaseReader` take the size in
  bytes. Requires rocksdb-haskell-jprupp\n  2.6.0.\n\n### Added\n\n- `store/bench`:
  a benchmark server that syncs a synthetic regtest chain and\n  serves the web API
  on it, and times the encoding of a response with the\n  argument `micro`. `scripts/bench-web.sh`
  runs wrk against it and reports\n  the CPU time of the server per request.\n\n##
  [1.7.0] - 2026-11-06\n\n### Changed\n\n- Build on haskoin-core 1.6.0 and haskoin-node
  2.3.0, the releases with the\n  fixes of the November 2026 security review. Their
  changelogs list the\n  changes to message parsing, header validation and peer handling
  that the\n  store now runs with.\n- An output has an address only when the network
  defines one for its script,\n  as in haskoin-core 1.6.0. A SegWit-shaped output
  has no address on Bitcoin\n  Cash. A 256-bit script hash output (`OP_HASH256`, a
  push of 32 bytes,\n  `OP_EQUAL`) has none on Bitcoin. Such an output is no longer
  indexed under\n  an address, and its `address` is `null`. Entries that an older
  version\n  wrote under such an address stay in the database. No request can name
  them,\n  since the address has no text form on the network.\n- `POST /transactions`
  takes a body that holds one transaction and nothing\n  else. Bytes after the transaction
  are refused, as Bitcoin Core does for a\n  raw transaction. They used to be ignored.\n-
  `POST /transactions` takes the transaction in the format that peers of the\n  network
  read. A network without SegWit, such as Bitcoin Cash, has the\n  format without
  witness only.\n- `GET /peers` gives the `version` of a peer as a signed number,
  as\n  haskoin-core 1.6.0 reads it. A peer that sends version ffffffff has version\n
  \ -1, where it used to appear as 4294967295.\n- Breaking, in `haskoin-store-data`:
  `toTransaction` takes the `Network` as\n  its first argument, and the `version`
  field of `PeerInfo` is an `Int32`.\n  The binary form of `PeerInfo` is the same
  bytes as before.\n- From haskoin-node 2.3.0: a peer is disconnected when it sends
  more than\n  50000 entries in an `inv` or `getdata` message. On Bitcoin Cash a message\n
  \ may be at most 2 MiB, unless it carries block content. Transactions from\n  Bitcoin
  Cash peers are read in the format without witness only.\n\n### Fixed\n\n- A response
  no longer fails on a transaction with an output that has no\n  address on the network.
  Since haskoin-core 1.5.0 the JSON encoder of such\n  an address threw, which cut
  the response off. One such output is in Bitcoin\n  block 211997 (transaction\n  `a4bfa8ab6435ae5f25dae9d89e4eb67dfa94283ca751f393c1ddc5a837bbc31b`,\n
  \ output 0).\n\n## [1.6.5] - 2026-11-04\n\n### Fixed\n\n- Build on haskoin-core
  1.5.1, which evaluates the ASERT difficulty rule at the\n  parent block. With 1.5.0
  the store rejected a valid block on Bitcoin Cash\n  mainnet at height 975899.\n\n##
  [1.6.4] - 2026-11-04\n\n### Added\n\n- Support Bitcoin testnet4 (`NET=btctest4`),
  from haskoin-core 1.4.0.\n- Option `--block-window` (`BLOCK_WINDOW`) to set how
  many blocks to request\n  from the syncing peer at a time.\n- Option `--write-buffer-mb`
  (`WRITE_BUFFER_MB`) to cap RocksDB memtables\n  across all column families, 256
  MiB by default (0 = unlimited). Without a\n  cap the nine column families can keep
  up to 1.1 GiB of memtables.\n- Option `--max-wal-mb` (`MAX_WAL_MB`), 1024 MiB by
  default (0 = RocksDB\n  default), to bound the RocksDB write-ahead log: once it
  is larger, the\n  column families holding its oldest file are flushed so the file
  can be\n  deleted.\n- `/dbstats` starts with the memory RocksDB uses outside the
  GHC heap:\n  memtables and table readers for each column family, and the block cache.\n-
  The mempool is kept in its own column family, one key per transaction,\n  instead
  of as a single list value that every import batch read, loaded\n  into a hash table
  and wrote back whole. Data version 19: a version 18\n  database is migrated when
  it is opened, with no resync.\n\n### Changed\n\n- Replace monad-logger with the
  fast-logger `Logger` from haskoin-node 2.0.0.\n- Request 64 blocks at a time from
  the syncing peer instead of 500, and ask\n  for more once fewer than 16 remain,
  to bound memory use while catching up.\n- haskoin-store-data builds against secp256k1-haskell
  2.0.0, which hides the\n  raw `PubKey` constructor: `XPubSpec` reads its stored
  key with `pubKey`,\n  which checks it.\n- Build on haskoin-core 1.5.0, haskoin-node
  2.1.2 and secp256k1-haskell 2.0.0.\n  `genesisBlock` no longer takes a context.\n-
  A pay-to-public-key output has no address any more, as in haskoin-core\n  1.5.0.
  Its coins cannot be spent with the input script of the P2PKH address\n  of the same
  key, so they are no longer counted under that address.\n- The block store no longer
  reads the whole mempool four extra times on every\n  internal ping: it compares
  mempool snapshots only when there are pending\n  transactions to import or expired
  ones to delete.\n- Run with four capabilities (`-N4`) instead of one per core (`-N`),
  so that\n  memory overhead does not grow with the size of the host. Override with\n
  \ `+RTS -N<n> -RTS`.\n- Docker image: pin the base image to Debian trixie (RocksDB
  9.10) by digest\n  instead of `debian:latest`, and run with `MALLOC_ARENA_MAX=2`
  to limit\n  malloc fragmentation from RocksDB.\n- Each `/events` client, websocket
  or HTTP stream, gets a queue of at most\n  10,000 events and is disconnected when
  it fills up, instead of the queue\n  growing for as long as the client stays connected.
  Store events that\n  `/events` does not show are no longer queued for its clients.\n-
  A request waiting for another to load an xpub into the cache retries for\n  about
  30 seconds, with at most 5 seconds between attempts, and then serves\n  the xpub
  from the database. It used to retry forever with a delay that\n  doubled each time.\n\n-
  Continuous integration on GitHub Actions: build, run both test suites,\n  and check
  that the heap stays flat while syncing 6000 regtest blocks.\n\n### Fixed\n\n- Support
  full-RBF: accept replacements of transactions that do not signal BIP125.\n- Correct
  various space leaks.\n- `Unspent` implements `coinInputKind`, new in haskoin-core
  1.5.0, from its\n  output script, so coin selection with it no longer fails at run
  time.\n\n### Added\n\n- Support for testnet4 on both networks.\n\n## [1.6.3] - 2026-08-31\n\n###
