changelog: "# Changelog\nAll notable changes to this project will be documented in
  this file.\n\nThe format is based on [Keep a Changelog](http://keepachangelog.com/en/1.0.0/)\nand
  this project adheres to [Semantic Versioning](http://semver.org/spec/v2.0.0.html)\n\n##
  [Unreleased]\n\n## [1.11.0] - 2026-11-12\n\n`POST /transactions` is done another
  way, and now says what came of the\ntransaction. `docs/publishing.md` has the design
  and the measurements.\n\n### Changed\n- **A 200 means that a full node accepted
  the transaction and that the\n  server has it.** It used to mean that the transaction
  was sent, and came\n  at once whatever happened. The request now waits for a node
  to announce\n  the transaction back, for `--publish-timeout` (`PUBLISH_TIMEOUT`)\n
  \ seconds at most, 30 by default. With a node that whitelists the store\n  that
  takes milliseconds.\n- The transaction is handed to one node, on a connection made
  for it. It\n  used to go to half the peers, on the connections the store syncs from.\n-
  The transaction comes into the mempool when a node announces it on a\n  connection
  that never sent it. The store used to ask the peers it had\n  sent it to, once,
  five seconds later.\n- The same transaction posted again is sent once, and one that
  the store\n  has is not sent at all.\n\n### Added\n- The store refuses, with 400
  and the reason, a transaction that it can\n  tell no node will take:\n  - one that
  spends an output it does not know, one that a confirmed\n    transaction has spent,
  or a coinbase less than a hundred blocks old;\n  - one whose outputs are worth more
  than its inputs, or that is a\n    coinbase;\n  - one whose lock time has not passed;\n
  \ - one larger than nodes relay, or with an output that is dust;\n  - **one with
  a forged signature**, for coins locked to one key: key\n    hash, key, witness key
  hash plain or nested, and Taproot by its key;\n    on Bitcoin Cash with ECDSA and
  Schnorr signatures, and for coins that\n    hold tokens. This is `judgeInputs` of
  haskoin-core 1.6.2, which also\n    verifies multisig: with ECDSA signatures on
  both networks, with\n    Schnorr signatures on Bitcoin Cash, and the multisig of
  Taproot.\n- `--node-rpc` (`NODE_RPC`): the JSON-RPC URL of a full node. The store\n
  \ publishes through it (`sendrawtransaction`): the node checks\n  everything, says
  why it refuses, which Bitcoin Core does not tell a\n  peer, and does not close the
  store's connections over what it refuses.\n  When the node does not answer, the
  transaction goes to a peer.\n- **A peer is sent only what the store verified.**
  A transaction with an\n  input that the store cannot verify, a script that is not
  a key or a\n  multisig, is refused with 400 unless the store can send it over RPC.
  A\n  peer that finds a transaction invalid may close every connection of\n  the
  store, so sending on what it could not judge let anyone cut the\n  store off from
  its peers.\n- The reason of a node that refuses a transaction and says why, as Bitcoin\n
  \ Cash Node does, is the message of the 400.\n- 500 when no node could be reached,
  when a node closed the connection on\n  receiving the transaction, and when no node
  announced it in time. The\n  reference always listed these errors; the code gave
  none of them.\n- A transaction that a node refused, closed the connection on, or
  did not\n  announce is remembered for ten minutes and not sent again. Other\n  transactions
  are published as before.\n- The body of `POST /transactions` is read up to the length
  of the longest\n  transaction of the network in hexadecimal, and a longer one is
  answered\n  413. The server used to read a body of any size into memory.\n- `Store`
  has `connect`, the function that opens a connection to a node.\n- The integration
  tests run a store against a Bitcoin Core and a Bitcoin\n  Cash Node that do not
  whitelist it.\n\n### Fixed\n- **A published transaction was often not seen until
  a block confirmed\n  it.** Bitcoin Core does not give a transaction back on the
  connection\n  that sent it until its timer for announcements has run, five seconds
  on\n  average: the one request the store made at five seconds got `notfound`\n  three
  times in four against Bitcoin Core 32.1. A store whose only node\n  did not whitelist
  it then never took the transaction in.\n- **One request could cut a store off from
  half its peers.** A node that\n  finds a transaction invalid may close every connection
  from the address\n  that sent it, and Bitcoin Cash Node 29.2 does. A forged transaction
  went\n  to half the peers on the connections the store syncs from.\n- With no peer
  connected the answer was 200 and nothing was sent.\n\n## [1.10.1] - 2026-11-12\n\n###
  Changed\n- `swagger.yaml` names one server, `./`: the server that served it,\n  wherever
  it is mounted. It no longer lists the servers of api.haskoin.com,\n  which describe
  whatever version those run, not the server in front of\n  you. The server serves
  the file as it is, instead of adding itself to\n  that list.\n- The reference page
  at `/` has no list of servers to choose from and no\n  bar to load another description:
  it shows the reference of the server\n  that serves it, and nothing else.\n\n###
  Fixed\n- The licence links of `swagger.yaml` and `README.md` pointed to a file\n
  \ that does not exist, and the version in `swagger.yaml` said 1.9.1.\n\n## [1.10.0]
  - 2026-11-12\n\nThe API speaks JSON only. Its binary format is gone, from the server
  and\nfrom the documentation.\n\n### Removed\n\n- **The binary format.** `Accept:
  application/octet-stream` no longer\n  gives binary: every answer is JSON, errors
  and `/events` included. The\n  \"Binary format\" sections of `README.md` and `swagger.yaml`
  are gone.\n  Clients built with haskoin-store-data before 2.0.0 ask for binary and\n
  \ do not work with this server; version 2.0.0 of its client speaks JSON.\n- **Binary
  frames over the WebSocket** of `/events`. Events are sent in\n  text frames, and
  a binary frame from the client closes the connection\n  as a command that cannot
  be read.\n- **Raw bytes in `POST /transactions`.** The body is the transaction in\n
  \ hex.\n\n### Changed\n\n- Answers have `Vary: Accept-Encoding`, without `Accept`,
  which no longer\n  changes what is answered.\n- Depends on haskoin-store-data 2.0.0.\n\n###
  Added\n\n- `docs/fleet-mempool.md`: how the shared mempool of a fleet works, why\n
  \ it holds, and its weak points. A report in the repository, not in the\n  package.\n\n##
  [1.9.1] - 2026-11-11\n\n### Changed\n\n- **The health check runs every second**,
  where it ran every thirty, and\n  at once when the store has a new best block. `/health`
  answers from the\n  last result, so a load balancer and a fleet acted on news of
  up to half\n  a minute ago. Redis is asked every five seconds.\n  `--health-check-interval`
  still sets the interval.\n\n- **Log levels say who has the problem.** An error in
  the log is now\n  something wrong with the store or its database, so that an alert
  on\n  errors is worth having. The README has a table of the levels.\n  - A transaction
  from a peer that the store refuses (an orphan, a double\n    spend, one without
  funds, one already confirmed) is logged for\n    debugging. These were errors, several
  a minute on a healthy server.\n  - A request answered 4xx or 503 is logged for debugging,
  like a\n    successful one. Only a 500 is an error.\n  - A peer that times out or
  sends a block that was not asked for is a\n    warning.\n  - Redis or the price
  service not answering is a warning: the store\n    goes on without them, and `/health`
  says so.\n  - **An outage of Redis is logged once when it starts and once when it\n
  \   is over** (`Haskoin.Store.Outage`), and for debugging in between. The\n    loops
  of a fleet and the worker of the cache each logged every failed\n    attempt, every
  second or two, and nothing said when Redis was back.\n    `memberLoop`, `memberCacheLoop`
  and `memberEvents` no longer take a\n    function to tell of a failure.\n  - Each
  transaction imported into the mempool is logged for debugging,\n    where it was
  information.\n  - With haskoin-node 2.5.1: a peer that hangs up or misbehaves is
  not an\n    error, and the comings and goings of peers are logged for debugging.\n\n###
  Fixed\n\n- **A fleet could stop answering for good after an outage.** A server goes\n
  \ through 50 blocks at most to tell the shared mempool what they did, and\n  further
  than that it may only empty the mempool, which Redis allowed to\n  a server that
  was alone. Two or more servers that came back together\n  more than 50 blocks past
  the block that the fleet last answered from\n  each kept the other from moving on,
  and every request was answered 503\n  `behind-fleet` from then on.\n  - Any server
  may now move the fleet when the way is too long for all of\n    them (`fleetRestart`,
  `wayBetween`): the shared mempool is emptied, a\n    counter in Redis says so (`fleet:restarts`),
  and every server that\n    sees it offers its whole mempool again. A server did
  not notice\n    before that another one had emptied the mempool.\n  - A test builds
  the stuck fleet on purpose, with two members of one\n    fleet (`Haskoin.Store.Fleet.MemberSpec`).\n-
  **A server that had just started took a turn in its fleet before its\n  first health
  check**, reported the blocks that it had then, and with no\n  other server there
  moved the fleet to them. It now waits for the check.\n\n### Added\n\n- **A change
  of health is logged**: a warning with what is wrong when\n  `/health` stops answering
  200, and a line when it does again; the same\n  for Redis. Nothing said so before
  but the 503s of the requests.\n- **An access log**, off by default: `--access-log`
  (`ACCESS_LOG`) logs\n  every request with the address of the client, the status
  and the time\n  it took.\n- With `--debug`, a member of a fleet says why its report
  was not taken\n  and what became of each attempt to move the fleet's block.\n- `HASKOIN_TEST_LOG`
  prints the time of each line, and the lines of the\n  two stores of the fleet test
  under their names.\n- **A slow request is logged as a warning**, with how long it
  took:\n  `--slow-request` (`SLOW_REQUEST`), five seconds by default, 0 for never.\n-
  `stress/results/2026-11-10/`: the results of a full default stress run\n  on version
  1.9.0, with a comparison against the run of the day before on\n  1.8.1. A cache
  reload takes 234 ms on average where it took 2,448, and\n  no longer grows with
  the xpub.\n\n## [1.9.0] - 2026-11-10\n\n### Added\n\n- `--fleet` (`FLEET`): servers
  that share a Redis answer as one. Every\n  request is answered from the newest block
  that all live servers have and\n  from one mempool that they share in Redis, so
  that the same request gets\n  the same answer whichever server a load balancer picks,
  also while a\n  block or a transaction is on its way through them.\n  - Each server
  keeps its database as it was at each of its last six\n    blocks, reports them under
  a lease of ten seconds, and offers its\n    unconfirmed transactions to the shared
  pool. The fleet tip moves in one\n    step, together with what the blocks in between
  did to the pool.\n  - A server that does not have the block that the fleet answers
  from says\n    503 with `behind-fleet`. One whose health check fails stops reporting,\n
  \   and stops counting when its lease runs out.\n  - Without Redis a server answers
  from its own database and `/health` says\n    203.\n  - `Haskoin.Store.Manager`
  runs the member (`Store.fleet`), the block\n    store takes a view of the database
  right after each block\n    (`BlockStoreConfig.onBest`), and the web server answers
  through\n    `Haskoin.Store.Database.Query.Pooled`.\n  - An integration test runs
  two servers as a fleet against a real node and\n    Redis and compares their answers
  with a payment in the pool and after\n    the block that confirms it.\n  - `docs/layered-database/FleetCost.hs`
  times a store alone against the\n    same store in a fleet, with 40,000 transactions
  in the pool: a fleet\n    adds about one round trip to Redis to a request. A request
  is answered\n    from the tip that the member last read, which its first read of
  the\n    pool checks; a transaction's body comes with what spends its outputs;\n
  \   and a first page is as large as the page asked for.\n\n- A cache of xpubs for
  a fleet (`Haskoin.Store.Fleet.XPub`), under the\n  options of the cache of a server
  alone: `--redis-min-addrs`,\n  `--redis-min-txs` and `--redis-max-xpubs`. Until
  now `--fleet` answered\n  every request about an xpub from the database, with a
  read of the shared\n  pool for each address that it touches.\n  - An entry has the
  chain's part of a wallet at one block, which is the\n    same for the whole cache,
  and the part of the shared pool, which the\n    script of the pool keeps as it changes
  the pool. Transactions and\n    outputs of both are in one sorted set each, in the
  order of the API.\n  - The cache answers only while its block is the fleet tip.
  The server\n    that moves the tip brings the cache along, with what the new blocks\n
  \   did at the addresses that entries have. If it does not, or after a\n    reorganisation,
  the cache is emptied.\n  - The cache is at a move of the fleet tip, which the pool
  counts, and\n    not just at a block: the tip can leave a block and come back to
  it.\n  - Every read of balances runs the scan of the xpub over the entry and\n    misses
  unless it reads exactly the addresses of the entry, so a\n    payment in the pool
  to an unused address cannot leave the gap wrong.\n  - Entries are built in the background
  by the server that missed, and\n    extended when an xpub gains addresses.\n  -
  A request about a wallet of 464 addresses and 19,499 transactions\n    takes 1.3
  to 2.2 milliseconds through it, where a fleet took 5 to 38;\n    for a wallet with
  400 addresses in the pool, 3 to 4 where it took 5 to\n    126 (`docs/layered-database/fleet-cost.txt`).\n
  \ - The test of the member compares every answer about a wallet through\n    the
  cache with the uncached one after each step of random histories,\n    and the two
  servers of the integration test do the same over HTTP.\n  - StatsD metrics under
  `fleet.cache.*`: hits, misses, builds and their\n    time, builds given up, evictions,
  and the times that the cache was\n    emptied. The log says why the cache was emptied
  each time, and with\n    `--debug` has a line for each entry built and each block
  that the\n    cache was brought to.\n- Built with `rocksdb-haskell-jprupp` 2.7.1,
  and every scan by address\n  uses an iterator that RocksDB stops where the address
  ends, so that a\n  scan cannot walk over deleted keys that follow it. The migration
  reads\n  the transactions with an iterator that is asked for the order of them\n
  \ all.\n- Built with `haskoin-node` 2.5.0, which has the fixes of its security\n
  \ review: among them, a block from a peer is checked against its header\n  before
  the store sees it, so a peer can no longer pass off transactions\n  of its choice
  under a real header. It also allows the new binding. On\n  regtest its discovery
  no longer finds a node on this machine: name the\n  node with `--peer`.\n- **`/events`
  agrees across a fleet.** The servers of a fleet send the\n  events of the block
  and the mempool that they share, read from a stream\n  in Redis that the pool's
  script writes as it makes each change, and no\n  longer those of their own nodes.
  A block is told when the fleet has\n  moved to it, with every block that it moved
  through.\n- **`/events` takes up where a client left.** `?after=` with the hash
  of\n  the last event heard starts the stream after it, over HTTP and over the\n
  \ WebSocket. The server keeps its last 10,000 events in one log that all\n  clients
  read (`Haskoin.Store.Web.Events`), in place of a queue for each.\n  It answers 404
  when it does not have the event. The servers of a fleet\n  keep the same events,
  so a client may come back to another one.\n- **A WebSocket client chooses the transactions
  it hears about**: by\n  address, by extended public key with a type of address,
  or with a Bloom\n  filter as in BIP 37, with the commands of `EventCommand` in\n
  \ `haskoin-store-data` 1.11. Blocks are always sent, and a client that\n  sends
  no command hears everything, as before. A key is watched up to its\n  gap, which
  moves on with its payments.\n- **The choice can be in the URL of `/events`**, so
  that it holds from\n  the first event: `quiet=true` for blocks alone, `addresses`,
  `xpub` with\n  `derive` (one type or several), and `filter` with `functions`, `tweak`\n
  \ and `flags`. The HTTP stream takes them too, also under `POST` with a\n  form.
  `{\"type\":\"none\"}` goes back to blocks alone.\n- **The WebSocket speaks binary
  too**: binary frames when the handshake\n  asks for binary or the client sends a
  binary frame, for events and\n  commands alike.\n- **HTTPS**, optional and off by
  default: `--tls-cert` and `--tls-key`\n  (`TLS_CERT`, `TLS_KEY`) make the server
  speak HTTPS on its port.\n- **The reference of the API at the root of the server.**
  `/` is a page\n  that shows `swagger.yaml` as it was when the server was built,
  and can\n  try requests against it; `/swagger.yaml` is the file.\n- **`HEAD` and
  `OPTIONS`** are answered: the headers of what `GET` gives,\n  and what a browser
  may send from another site.\n- **Answers are compressed** with gzip for clients
  that accept it, but for\n  the stream of events.\n- **Lists in a body.** The endpoints
  that take a list of addresses,\n  blocks, heights or transactions accept `POST`
  with the parameters in a\n  form, so that a long list need not fit in a URL.\n-
  **`Retry-After`** on every 503.\n- **Errors in binary.** A request that asks for
  the binary format gets\n  its errors in that format too, the 503 of a server behind
  its fleet\n  included. They were JSON whatever was asked. This needs\n  `haskoin-store-data`
  1.10, whose client reads both.\n- **The `Accept` header is read as a list with weights.**
  Binary is sent\n  when `application/octet-stream` is listed with a weight above
  0 that is\n  no less than that of `application/json`. The header used to be compared\n
  \ with that one string, so a list or a weight silently gave JSON. Every\n  answer
  has `Vary: Accept`.\n- **The raw lists start with a count**, in binary: `/transactions/raw`,\n
  \ `/block/{block}/transactions/raw` and `/block/height/{height}/raw` were\n  the
  one kind of list without it. A binary client of those three\n  endpoints has to
  change with the server.\n- `haskoin-store --help` names the environment variable
  of every option.\n- `swagger.yaml` documents the binary format: how to ask for it,
  the\n  encoding of each type that the API returns, and what differs from JSON.\n-
  Gauges `fleet.cache.xpubs` and `fleet.cache.addresses`: how many xpubs\n  the cache
  of a fleet holds, and how many addresses between them.\n\n### Changed\n\n- A WebSocket
  client of `/events` that sends something the server cannot\n  read as a command
  is disconnected, with code 1008 and the reason. What\n  clients sent used to be
  ignored.\n- The HTTP stream of `/events` no longer holds a view of the database
  for\n  as long as its client listens.\n\n- Since version 2.6.4 the binding reads
  the key and the value of a row of\n  an iterator without the cost of a safe foreign
  call.\n  Every list and every count takes between a half and a third of the time:\n
  \ the first 100 transactions of a busy address 221 microseconds instead of\n  575,
  and the number of transactions of a wallet with 19,499 of them 34\n  milliseconds
  instead of 78.\n- **Bloom filters are on by default**, as was always meant: until
  the\n  binding was fixed, `--bloom` built none. `--no-bloom`, or `BLOOM=false`,\n
  \ turns them off; `--bloom` is still accepted. An existing database gets\n  filters,
  and the memory that they take in the block cache, as its table\n  files are written
  again.\n- **Transactions that leave the mempool unconfirmed are no longer kept.**\n
  \ The API already answered 404 for them, but their bodies stayed in the\n  database,
  marked as deleted, for ever, and each server had its own.\n  - A server remembers
  the last hundred thousand that it deleted, in\n    memory, so as not to fetch them
  again from its peers. The fleet's rule\n    for conflicting transactions and the
  cache of a server alone, which\n    both asked the database whether a transaction
  had been deleted, ask\n    that memory instead.\n  - The cache of a server alone
  takes a transaction that Redis has as\n    unconfirmed for more than ten minutes,
  and that the database does not\n    have, for deleted and not for one that it has
  not seen yet.\n  - Bodies that version 20 marked as deleted stay in a migrated database\n
  \   and are ignored. A page that starts at a deleted transaction is empty.\n- Removed
  reports that no longer describe the store: five intermediate\n  stress runs, the
  measurement of a mempool mirrored in memory, and the\n  superseded runs in `docs/layered-database/query-cost.txt`.\n
  \ `docs/layered-database.md` is rewritten as a description of what\n  exists, a
  quarter of its length.\n- **Database version 22: the record of a confirmed transaction
  is written\n  once**, by the block that confirms it, and is the same on every server\n
  \ that has the block, so that what the chain's column families hold\n  follows from
  the chain alone.\n  - **Its time is the time of its block.** A server that had seen
  a\n    transaction in its mempool used to keep the time of that when a block\n    confirmed
  it: two servers then gave two values of `time` for the same\n    confirmed transaction,
  which the servers of a fleet must not do. A\n    transaction that returns to the
  mempool when its block leaves the main\n    chain has the time of that block there.\n
  \ - **The spenders of its outputs are under keys of their own**, in the\n    `spender`
  column family, sixteen outputs to a key (`SpenderKey`).\n    They were in the record,
  which each block that spent one of its\n    outputs read and wrote whole again.
  A spend now reads and writes a\n    value of a few dozen bytes and leaves the record
  alone.\n  - Reading a confirmed transaction in full takes a second key: 18\n    microseconds
  where it took 11.5, and 0.8 milliseconds for a hundred\n    where it took 0.4. Lists
  by address and by xpub cost the same, and so\n    does writing, on the small records
  of the measurements.\n  - A database of version 21 is migrated the first time the
  store opens\n    it (`migrateRecords`). **It reads every transaction of the database\n
  \   and writes nearly every one again**, since nothing lists those that\n    need
  it and most have a spender in them: many hours for a database of\n    Bitcoin, and
  room for a second copy of its transactions until RocksDB\n    has compacted the
  first away. The log says how far it is, and it can\n    be interrupted and started
  again.\n  - The tests that run the store through random histories now choose them\n
  \   from a database of version 20 that goes through the same\n    (`withShadow`).
  Given a layered database, the chooser found next to\n    nothing in the mempool,
  and the blocks of the tests of the fleet\n    confirmed almost none of it.\n- **Database
  version 21: the mempool has an area of its own.** Unconfirmed\n  transactions are
  no longer written into the indices of the chain. They\n  are kept apart and applied
  on top when a query is answered\n  (`docs/layered-database.md`), so the chain's
  data changes only when a\n  block is imported or reverted.\n  - A database of version
  20 is migrated the first time the store opens it,\n    and the log says how many
  mempool transactions were moved. **Older\n    stores refuse the database afterwards**:
  copy a production database\n    before upgrading.\n  - The block store imports with
  the rules of `Haskoin.Store.Logic.Layered`.\n    A block that spends an output of
  a transaction that is only in the\n    mempool is refused as an orphan; no valid
  block does that.\n  - Each request of the web server reads one snapshot of the database
  for\n    everything it answers, so the parts of a response agree with each\n    other.
  `routerScoped` in `Haskoin.Store.Web.Router` is what gives a\n    request its snapshot.\n
  \ - `--wipe-mempool` deletes the keys of the mempool area, in less time\n    than
  it took to delete each transaction by the rules, and it no longer\n    keeps the
  wiped transactions as deleted ones.\n  - `StoreRead` has a new query, `getAddressesTxCount`.\n
  \ - Programs that embed the store and read its database with\n    `Haskoin.Store.Database.Query`
  have to move to\n    `Haskoin.Store.Database.Query.Layered`: the old queries do
  not see the\n    mempool of a database of version 21.\n- Xpub addresses are derived
  up to an exact gap: every address up to the last\n  used one of each chain, then
  exactly `--xpub-gap` unused ones, and always\n  the first `--xpub-gap-init` addresses.
  Addresses used to be read 32 at a\n  time with the gap checked between batches,
  so the store looked between 33\n  and 64 addresses past the last used one, and started
  counting again at index\n  20. This is why api.haskoin.com saw a payment 34 addresses
  past the last\n  used one, which wallets with a gap of 20 or 32 do not see. Payments
  that far\n  away are no longer seen; raise `--xpub-gap` to see them.\n- New Redis
  cache of xpubs (`Haskoin.Store.Cache`), replacing the old one:\n  - Whenever a transaction
  touches a cached xpub, or a reorganisation changes\n    one of its transactions,
  the store reads the whole xpub again from its\n    database and replaces the entry
  in one Lua script, so cached answers are\n    always answers of the database.\n
  \ - Everything a response needs is in Redis, transaction bodies included,\n    shared
  between xpubs, with the spenders of their outputs kept up to date.\n    A store
  that has not imported a transaction yet still serves it.\n  - Several stores can
  share one Redis. Each change of a cached xpub is\n    claimed and applied once,
  by the first store to see it; stores that catch\n    up find their changes done
  and do no work. A store never replaces an entry\n    that knows more than its database
  (a higher block, or a transaction it has\n    not seen), so stores do not undo each
  other's work, and every entry is\n    written together with the bodies it needs,
  so a store that is behind can\n    serve it in full.\n  - The rules for claims and
  for replacing entries are pure decisions\n    (`Haskoin.Store.Cache.Protocol`).
  A model test runs several stores\n    catching up with a chain in random interleavings
  against a model of\n    Redis, and checks that they end with the entry of the tip,
  that no\n    store replaces an entry with one that knows less, that each change
  is\n    written once, and that stores catching up after the first write nothing.\n
  \ - A reload writes only the differences between the xpub in the database\n    and
  its entry in Redis, read in chunks first, instead of rewriting the\n    whole entry;
  its script checks that the entry did not change since.\n    Rewriting an xpub of
  15,000 transactions held Redis for up to 77 ms,\n    during which it answered no
  other client. A store reloads up to four\n    xpubs at once.\n  - A page of the
  transactions or unspent outputs of a cached xpub is one\n    round trip to Redis:
  a Lua script finds where it starts, from the\n    position of the start transaction
  in the xpub itself, and reads it.\n    It took four or five, and read the whole
  body of the start\n    transaction to find its position.\n  - A store marks a cached
  xpub as used at most every ten seconds, for\n    eviction, instead of on every read,
  which made every read a write.\n  - `--redis-min-txs` (`REDIS_MIN_TXS`, default
  1000) also caches xpubs\n    with at least that many transactions in their addresses,
  however few\n    addresses they have.\n  - Keys start with `hs2:<network>:`, so
  the cache can share a Redis with the\n    cache of older versions and with stores
  of other networks.\n  - `--redis-max-xpubs` (`REDIS_MAX_XPUBS`, default 10000) replaces\n
  \   `--redis-max-keys`: the least recently used xpubs past this many are\n    evicted.
  `--redis-sync-interval` is removed.\n  - StatsD metrics: `cache.hits`, `cache.misses`,
  `cache.reloads`,\n    `cache.stale`, `cache.evictions` and `cache.reload` (milliseconds).\n-
  `n_tx` of `/blockchain/multiaddr` counts every transaction of the shown\n  addresses
  and xpubs, not only those on the page, and `n_tx_filtered` those\n  that pass the
  filter. `n_tx` of `/blockchain/rawaddr` for an xpub is its\n  number of transactions,
  not the size of the page.\n- The web server runs directly on WAI and Warp, without
  Scotty. Routes,\n  parameters and passing a request to the next route are in\n  `Haskoin.Store.Web.Router`,
  a small router over WAI; a handler is a plain\n  function from the state of the
  server and the request to a response in\n  `IO`, and stops early by throwing an
  `Except`, which becomes the JSON\n  error. Every response carries `Access-Control-Allow-Origin:
  *`, error\n  responses included. The endpoints, their parameters and their responses\n
  \ are as before.\n- No monad transformers, except conduits, and no functions polymorphic
  over\n  `MonadIO` or `MonadUnliftIO`: everything runs in plain `IO`. Database queries
  are\n  functions that take the `DatabaseReader` (`Haskoin.Store.Database.Query`);\n
  \ imports take a `Writer` handle (`Haskoin.Store.Database.Writer`,\n  `Haskoin.Store.Logic`);
  the block store and the manager pass their state\n  explicitly. The classes `StoreReadBase`
  and `StoreReadExtra` are replaced\n  by `StoreRead`, a record of the same queries
  as functions in `IO`, which\n  `databaseRead` gives for a database; `getTransaction`
  and the other\n  helpers of `Haskoin.Store.Common` take it as their first argument.
  The state\n  of the web server, which every handler takes as an argument instead
  of\n  reading it from a `ReaderT`, holds the queries to answer with, the cache\n
  \ in front of those about xpubs;\n  `nocache=true` gives a handler a state whose
  queries read only the\n  database. `withStore`, `runWeb`, `runWebSocket` and the
  `blockStore*`\n  functions are in `IO`. `WriterT`, `ImportM`, the `StoreWrite` class,\n
  \ `BlockT`, `CacheT`, `DatabaseReaderT` and `withDB` were removed earlier\n  in
  this release. This changes the library API.\n- The package uses the GHC2024 edition,
  with `DuplicateRecordFields`,\n  `NoFieldSelectors`, `OverloadedRecordDot` and `OverloadedStrings`
  on for\n  every module, and explicit deriving strategies.\n\n- haskoin-store-data
  moves to its own repository,\n  [jprupp/haskoin-store-data](https://github.com/jprupp/haskoin-store-data),\n
  \ with its history and its own releases, and haskoin-store moves to the root\n  of
  this one; `store/` and `data/` are gone. haskoin-store depends on\n  `haskoin-store-data
  ^>= 1.9`. The package has a full description, PVP\n  upper bounds on every dependency,
  and no `Setup.hs`.\n- Legacy addresses are called `legacy` in the `derive` parameter,
  the default.\n  `normal`, the name they had, is still accepted, so old URLs keep
  working;\n  it said nothing about the kind of address. Error messages use the new\n
  \ name. Built with haskoin-store-data at commit `b304acd2`.\n- The executable gives
  memory back to the system as soon as its heap no\n  longer needs it (`--disable-delayed-os-memory-return`
  in its default RTS\n  options). By default GHC marks such memory free for the kernel
  to take when\n  it runs short, and Linux counts it as resident until then, so the
  heap of a\n  busy store seemed to grow without end, by the size of each peak, with
  little\n  live data. The stress test records the resident GHC heap and how much
  of it\n  is lazily freed. The heap profile and the runs that found this are in\n
  \ `stress/results/2026-11-09-memory`, and `scripts/heap-profile-summary.py`\n  summarises
  a heap profile.\n- The cache brings an entry up to date from what changed, instead
  of reading\n  the whole xpub from RocksDB and Redis on every change, which the stress
  test\n  showed was almost all the time of a reload, growing to seconds at 100,000\n
  \ transactions per xpub. A reload reads the changed transactions, the outputs\n
  \ they create and spend at addresses of the xpub, and the balances of its\n  addresses,
  which are compared with Redis's to catch a change the entry\n  missed. The whole
  xpub is still read when it is first cached, when the\n  entry is more than a block
  behind, when an address with transactions enters\n  or leaves the gap, when a balance
  does not match, and every ten minutes.\n  Entries keep an index of their unspent
  outputs by outpoint\n  (`x:<id>:uop`), in format version 3; entries of version 2
  are upgraded by\n  their next reload. New metric `cache.full_reloads`.\n- A reload
  whose balances show changes it was not told of first looks for\n  them, instead
  of reading the whole xpub: the transactions that the database\n  has for the addresses
  whose balances moved, in the mempool or in blocks\n  after the one the entry was
  written at, and the mempool transactions of the\n  entry that have since been confirmed
  or dropped, up to 1,000. Under load the\n  database is often ahead of the events
  being applied, which made about one\n  reload in ten of the stress test a full one.\n-
  Bodies that Redis already has, such as those of the transactions that a\n  block
  confirms, are rewritten before the commit of a reload, 200 to a\n  script, instead
  of in it. The commit of a block that confirms a thousand\n  transactions of an xpub
  had about 8,000 arguments and held Redis for 10 to\n  30 ms, the only commands of
  the stress test that took that long.\n- The scheduled full reload of a cached xpub
  comes every five to ten\n  minutes, an interval that depends on the xpub, instead
  of every ten for\n  all. Xpubs cached together were read whole together each time:
  in the full\n  stress test, four xpubs of tens of thousands of transactions raised
  the\n  heap from under 100 MiB to 785 MiB for a few seconds every ten minutes.\n-
  `docs/cache-consistency.md` analyses how a cached xpub can differ from the\n  database
  without any check noticing, including spenders of cached\n  transactions that no
  reload repairs, and what would prevent it.\n- `docs/layered-database.md`: a design
  for keeping the mempool out of the\n  chain's indices, in an area of its own that
  is applied on top when a query\n  is answered, with the measurements behind it and
  what it means for the\n  cache. The store still runs on the layout of version 20;
  this adds the\n  parts that could be proved ahead of the switch:\n  - `Haskoin.Store.Database.Types`
  has the keys of the mempool area\n    (`MemSpenderKey`, `MemAddrKey`, `MemDeletedKey`)
  and a marker for\n    migrations that work in several writes (`MigrationKey`).\n
  \ - `Haskoin.Store.Database.Mempool` has the keys that one mempool\n    transaction
  contributes, and what the mempool does to the balance and\n    the unspent outputs
  of an address.\n  - `Haskoin.Store.Database.Migrate` moves a database of version
  20 to the\n    layered layout without a resync: it takes every mempool transaction
  out\n    of the chain's indices and writes it to the mempool area, in atomic\n    batches
  that can be interrupted. Nothing calls it yet.\n  - `withLayeredReader` opens a
  database with the extra column family,\n    `mempool-addr`, that the layout needs.\n
  \ - Tests build databases with the store's own rules from random histories\n    of
  payments, blocks, replacements, deletions and reorganisations,\n    migrate them,
  and check that every query answers as before, that the\n    chain's column families
  are those of a database that never saw a\n    mempool, and that emptying the mempool
  area leaves the chain's answers.\n- `Haskoin.Store.Logic.Layered`: the rules that
  import and revert blocks\n  and add, replace and delete mempool transactions in
  the layered layout of\n  `docs/layered-database.md`, with the functions, results
  and errors of\n  `Haskoin.Store.Logic`. Blocks are written to the chain's column
  families\n  alone, and the mempool to its own area. The store does not use them
  yet.\n  - `Haskoin.Store.Database.Writer` can write the mempool area in the same\n
  \   atomic batch as the chain; batches of today's rules write nothing there.\n  -
  Tests give the same random history to both sets of rules, on Bitcoin and\n    on
  Bitcoin Cash: payments, replacements, deletions, blocks in and out of\n    order,
  reorganisations, and transactions and blocks that must be\n    refused. Every operation
  must have the same result and move the same\n    transactions in and out of the
  mempool, every query must answer the same\n    after it, and at the end the database
  of today's rules, once migrated,\n    must equal that of the new rules key for key.\n
  \ - One difference is on purpose: a block that spends an output of an\n    unconfirmed
  transaction is refused by the new rules, as that output is\n    not in the chain.
  Today it is imported.\n- `Haskoin.Store.Database.Query.Layered`: every query of
  the store for the\n  layered layout, with the names and arguments of\n  `Haskoin.Store.Database.Query`,
  and `layeredRead`, which gives them as the\n  record of queries that the web server
  answers with. The store does not use\n  them yet.\n  - A query takes a `View`, a
  RocksDB snapshot that only `withView` makes,\n    so that the chain and the mempool
  are read as they were at one moment.\n  - Pages are cut from the mempool's part
  of a list followed by the chain's\n    part, by today's rules for starts, offsets
  and limits, for one address,\n    for several, and for extended public keys.\n  -
  Mempool spenders are looked up only for the outputs of a transaction\n    that no
  block spends, in one multi-get for a whole page of transactions.\n  - `MemDeletedKeyP`
  matches deleted transactions by the start of their\n    hash, for the short transaction
  numbers of the Blockchain.info API.\n  - Tests ask today's queries and the new ones
  for pages with random\n    limits, offsets and starts, on databases migrated from
  today's layout,\n    on databases built by the rules of the layered layout, and
  on databases\n    upgraded in the middle of a history. They also check that an open
  view\n    goes on answering from its moment while blocks and transactions are\n
  \   written.\n- A summary for each address that the mempool touches, in the layered\n
  \ layout (`MemSummary`, under `MemAddrSumKey`): the number of its mempool\n  transactions,
  and the amounts and numbers of the outputs that the mempool\n  pays to it, spends,
  and both pays and spends. The measurements showed the\n  queries of that layout
  to be too slow for an address with much in the\n  mempool, and for any address right
  after a block, because they scanned\n  everything that the mempool has for an address
  to answer anything.\n  - A balance is now two reads by key, and an address with
  nothing in the\n    mempool is found by a key that is not there.\n  - Lists of transactions
  and of unspent outputs read the mempool's entries\n    only for addresses that have
  some, and only as far as the page goes.\n  - The rules keep the summary with every
  transaction that enters or leaves\n    the mempool, and the migration writes all
  of them from the entries that\n    it moved. The tests work every summary out again
  after each operation.\n  - Measured again with `QueryCost.hs`: the balance of an
  address with\n    6,216 entries in the mempool takes 11 microseconds instead of
  35\n    milliseconds, a page of its transactions what it takes in version 20,\n
  \   the balances of a wallet of 464 busy addresses 1.9 milliseconds instead\n    of
  110, and nothing gets slower right after a block. Keeping the\n    summaries costs
  about 110 microseconds for each transaction that passes\n    through the mempool.
  `docs/layered-database.md` has the tables.\n- `docs/layered-database/QueryCost.hs`
  writes one synthetic history into a\n  database of each layout and times the rules
  and the queries of both,\n  checking that the answers agree. `docs/layered-database.md`
  has the\n  results and what follows from them: writing costs the same when syncing\n
  \ and 14% more for a transaction that passes through the mempool; the new\n  queries
  cost 10 to 15 microseconds more for a request when the mempool\n  has nothing for
  what is asked; and they are too slow, as built, for\n  addresses that the mempool
  touches a lot and for any address right after\n  a block. The document proposes
  a summary for each address in the mempool\n  area, read by key, and two changes
  to the RocksDB binding.\n- Documentation: a page that starts at a height has no
  unconfirmed\n  transactions, whatever the height. The comment on `AtBlock` said
  that a\n  height above the best block includes them, and the API reference could
  be\n  read that way. The behaviour is unchanged.\n- The stress report breaks the
  commands that blocked Redis down by script,\n  and commits by full and incremental
  reloads, with their numbers of\n  arguments.\n- `Haskoin.Store.Fleet`: the rules
  by which stores that share a Redis agree\n  on one block to answer from, the fleet
  tip, as pure decisions with a model\n  test. It is the first part of the design
  for a fleet that answers as one,\n  in `docs/layered-database.md`. Nothing uses
  it yet.\n  `Haskoin.Store.Fleet.Redis` carries the rules out against Redis, with
  a\n  Lua script for each step that has to be one step, and a test that takes\n  random
  sequences of steps through a real Redis and through the rules and\n  compares them
  after each. `Haskoin.Store.Fleet.Pool` has the rules of the\n  mempool that such
  stores share, as of the fleet tip: what may be offered,\n  which of two conflicting
  transactions stays, what leaves and why, and how\n  the pool follows the tip forwards
  and across a reorganisation. A model\n  test keeps it valid on top of the tip through
  random offers, blocks and\n  reversals. One more Lua script carries these rules
  out, moving the tip and\n  changing the pool in one step, and is compared with them
  step by step in a\n  real Redis like the others; the comparison found a case that
  the rules had\n  left open, a transaction that comes back from an abandoned block
  and\n  spends what the pool already spends, which now wins. The pool also keeps,\n
  \ for each address, what its transactions do there: the transactions and\n  the
  outputs paid to it in the order of a list, the outputs of it that are\n  spent,
  and their sums, so that a balance is one read and a list is read\n  by the page,
  as in a store's own mempool area.\n- `Haskoin.Store.Database.Query.Pooled`: the
  queries of the store with a\n  mempool that is not its own on top of the chain,
  for the shared pool of a\n  fleet. `read.lua` and `poolRead` read that pool from
  Redis, each read\n  with a check that the fleet tip has not moved. The tests hold
  these\n  queries to those of the layered layout with the store's own mempool as\n
  \ the pool. `fleetAdvance` can empty the pool for a store that is alone and\n  does
  not know the way from the old tip.\n- `Haskoin.Store.Fleet.Member`: what a store
  does as a member of a fleet.\n  It keeps a view at each recent block, reports them,
  moves the fleet tip\n  with what the blocks in between did to the pool, offers its
  mempool, and\n  answers from the view at the tip with the pool on top. A test with
  a real\n  Redis takes a store that is alone in its fleet through random histories\n
  \ and compares every answer with the store's own after each step. It found\n  that
  a body kept in the pool went stale when a parent was confirmed or\n  came back,
  because a transaction inherits from its unconfirmed parents\n  whether it can be
  replaced by fee; the pool now keeps that apart from the\n  body and corrects it
  as transactions come and go.\n- `Haskoin.Store.Database.Views` keeps the database
  as it was at each recent\n  block, a RocksDB snapshot for each, so that a store
  can answer from the\n  block that its fleet agrees on and not only from its newest.
  Views that\n  are no longer needed are let go, and one that a request is reading
  is\n  released when the request is done. Nothing uses it yet.\n- A store whose Redis
  does not answer goes on answering from its database,\n  instead of failing every
  request that the cache would have served. A\n  request waits at most two seconds
  for Redis; after that the store leaves\n  Redis alone until a health check finds
  it again. Meanwhile `/health`\n  answers 203, Non-Authoritative Information, with
  the header\n  `Haskoin-Degraded: redis`, when every other check passes: a status
  in the\n  200s, so that load balancers keep the store, and not 200, so that\n  monitoring
  notices. The body of `/health` has a new check, `redis`, for a\n  store that has
  a cache; it does not count towards `ok`. It comes with\n  haskoin-store-data 1.9.0,
  which the store now takes from Hackage.\n- Breaking: transactions that were deleted
  are no longer returned. A\n  transaction that was replaced, dropped from the mempool,
  or was the\n  coinbase of a block that left the main chain used to answer by id
  with\n  `\"deleted\": true`; clients that did not look at that field took it for
  a\n  pending payment. It now gives 404, is left out of lists of transactions\n  fetched
  by id, and a page cannot start at it. The `deleted` field stays in\n  responses
  and is always false. The bodies stay in the database.\n- Breaking: parameters are
  checked. A request with a parameter that its\n  endpoint does not accept, such as
  a misspelt `limt=10` or `pretty` on the\n  Blockchain.info endpoints, which never
  honoured it, gives 400\n  `Unknown parameter: …`; and a value that cannot be read,
  such as\n  `notx=yes`, `limit=-1`, `filter=4`, `format=xml` or an unknown currency,\n
  \ gives 400 `Invalid value for parameter …`. Both used to be ignored, and\n  the
  client got an answer to a question it did not ask. Requests are\n  checked before
  anything is done. The Blockchain.info endpoints accept\n  `format=json`, which their
  clients often send. Each route of the router\n  declares the parameters it accepts,
  and reading an undeclared one is an\n  error of the program, so the two cannot drift
  apart.\n- An xpub asked about with the wrong `derive` gives 400, with a message
  that\n  names the right kind, instead of an empty wallet: when the xpub has no\n
  \ transactions with the kind asked for, the store checks the first\n  `--xpub-gap-init`
  addresses of the other kinds. This applies to the `/xpub`\n  endpoints and to `/blockchain/rawaddr`.
  A wallet unused with every kind\n  still gets an empty answer, and wallets in use
  cost nothing more.\n- `swagger.yaml` explains the API, not only lists it: an introduction
  to its\n  conventions (amounts, ordering, paging, formats, errors, unconfirmed\n
  \ transactions, reorganisations, xpubs, live events, Blockchain.info\n  compatibility)
  and the reasons for them, and a description of every\n  endpoint, parameter and
  field. It documents `/dbstats`, the WebSocket at\n  `/events` and the `time` field
  of the health check, which were missing,\n  and corrects the health check examples
  and the version.\n- The README tutorial pages with `height`, the parameter the server
  reads;\n  it said `start`, which the server ignores.\n- Every line of code is shorter
  than 120 columns, `swagger.yaml` included,\n  whose long hexadecimal and xpub examples
  are split into equal pieces that\n  parse to the same values. `scripts/format` formats
  `integration/` and\n  `stress/` too.\n- Scripts live in files of their own: the
  Lua scripts of the cache in\n  `src/Haskoin/Store/Cache/lua/`, embedded at compile
  time with\n  `file-embed`; the script of wrk in `stress/wrk.lua`, one for every\n
  \ endpoint, given its paths on the command line; and the shell steps of CI\n  in
  `scripts/check-local-deps.sh` and `scripts/install-system-libraries.sh`.\n  The
  scripts do the same as before.\n\n### Fixed\n\n- `--bloom` builds Bloom filters.
  It built none when the store was built\n  against RocksDB 6.24 or later, as the
  Docker image is, because\n  `rocksdb-haskell-jprupp` passed the size of the filter
  to RocksDB with the\n  wrong type. Nothing failed; a lookup of a key that is not
  there just went\n  on reading data blocks to find that out. The store is now built
  with\n  `rocksdb-haskell-jprupp` 2.6.3, which has the fix. A store that already\n
  \ runs with `--bloom` starts building filters when it is upgraded, for the\n  table
  files written from then on: about 1.25 bytes for each key, held in\n  the block
  cache. Size that on a full database, or turn the option off to\n  keep things as
  they were.\n- `--bloom` no longer asks for filters on the two indices by address,
  which\n  are scanned and not read by key. With a filter, a scan of an address that\n
  \ has nothing steps over every key deleted since the last flush: 810\n  microseconds
  after 5,000 mempool transactions were deleted, against 13\n  without filters. No
  store was affected, because no filter was ever built;\n  with the fixed binding
  they would have been. The option still builds\n  filters for transactions, unspent
  outputs, blocks, balances and the\n  mempool.\n- `/blockchain/multiaddr` no longer
  reads every transaction of the wallet to\n  count them. `n_tx` of one xpub is its
  count (a `ZCARD` when it is cached);\n  for several xpubs and addresses, the database
  counts the distinct\n  transactions of all their addresses from the keys of its
  index. The\n  transactions of a page are read in pages of about the size asked for,
  and\n  their bodies a page at a time, instead of one by one; `/blockchain/rawaddr`\n
  \ does the same. In the stress test, with xpubs of about 15,000\n  transactions,
  the median time of a multiaddr request went from 3.2 seconds\n  to 36 milliseconds,
  and it no longer grows with the wallet.\n- Containers left by an integration test
  run that was killed are removed\n  by the next run, as intended: listing them used
  a template that Podman\n  refuses, so they were never found.\n- `--peer HOST[:PORT]`
  works as documented. It was read as a Haskell\n  string, so only `--peer '\"HOST:PORT\"'`,
  with the quotes, was accepted.\n- The syncing peer is disconnected when it sends
  a block that was not\n  requested, as the documentation of the block store said.
  The block was\n  imported if the node knew its header. The state of the block download
  is\n  now a pure state machine (`Haskoin.Store.BlockStore.Sync`) with property\n
  \ tests, which also found that a block listed twice in one request was\n  outstanding
  twice.\n- The block store no longer starts a thread for every transaction it\n  requests,
  to forget the request twenty seconds later. Requested and\n  received mempool transactions
  are one pure value\n  (`Haskoin.Store.BlockStore.Pending`), with property tests,
  and old\n  requests are forgotten on the clock tick of the block store.\n- Build
  against haskoin-node 2.4.0, from the head of its\n  `fix-header-sync-stall` branch.
  The block store reserves its syncing peer\n  as an owner of its own (`reservePeer`,
  `releasePeer`), so no other part of\n  the node can release it; header searches
  run with `chainRunHeaders`. The\n  store stopped following the chain\n  when a peer
  announced new blocks with an inventory message instead of\n  headers, which peers
  do when many blocks are found at once; it stayed at\n  the old height until the
  peer reconnected.\n- Mempool transactions that entered the mempool in the same second
  could be\n  listed twice in the transactions of an xpub or a multiaddr wallet, and\n
  \ their order differed from page to page. Every merge now orders them as the\n  database
  and the cache store them (`txRefKey`, `unspentKey`).\n- `nocache=true` on `/xpub/:xpub/transactions`
  and `/xpub/:xpub/unspent` no\n  longer reads, or fills, the cache.\n- `confirmations`
  of `/blockchain/unspent` no longer wraps around for an\n  output in a block newer
  than the chain of the store.\n\n### Added\n\n- `scripts/stress-cache.sh`, a stress
  test of the Redis cache: a regtest\n  chain, Valkey and wrk in Podman, a haskoin-store
  server, hundreds of\n  thousands of transactions between a few wallets, and wrk
  on their xpubs\n  all the while, with a report (`scripts/stress-report.py`) of reloads,\n
  \ lag, resources, the commands that blocked Redis (from its slow log) and\n  latencies,
  and a check of the cached answers at the end. The Podman\n  helpers of the integration
  tests are an internal library (`integration`)\n  that the stress program shares,
  and the test image has wrk in a layer of\n  its own.\n- `stress/results/2026-11-09/`:
  the results of a full default stress run,\n  kept for comparison with later runs.\n-
  `runWebSocket` serves the API on a socket that already listens. The tests\n  bind
  port 0 and pass the socket, so their web servers get free ports with\n  no window
  in which another program could take them; the containers publish\n  their ports
  on random ports of the host.\n- Integration tests against regtest chains of Bitcoin
  Core and Bitcoin Cash\n  Node, with Valkey, in Podman containers built from Ubuntu
  26.04 and\n  release tarballs checked against pinned hashes, one cached layer per\n
  \ download, so nothing is downloaded twice. They are skipped when Podman\n  cannot
  run containers or `HASKOIN_STORE_NO_PODMAN` is set.\n\n## [1.8.1] - 2026-11-07\n\n###
  Changed\n\n- Documentation: the README explains the purpose and design of the store,
  with\n  installation steps, a full configuration reference, monitoring and a\n  tutorial,
  and the Haddock of every module and function says why it works the\n  way it does.\n-
  Build against nqe 0.6.9, rocksdb-haskell-jprupp 2.6.1, rocksdb-query 0.6.1,\n  statsd-rupp
  0.5.0.2, secp256k1-haskell 2.0.1, haskoin-node 2.3.1 and\n  Stackage nightly-2026-11-07.\n\n##
  [1.8.0] - 2026-11-07\n\n### Changed\n\n- Index the mempool by the time each transaction
  entered it. `/mempool`,\n  `/blockchain/unconfirmed-transactions` and the health
  check read only the\n  page they return, newest first, instead of loading and sorting
  the whole\n  mempool on every request. Data version 20: a version 18 or 19 database
  is\n  migrated when it is opened, with no resync.\n- The block store no longer reads
  the whole mempool to publish mempool\n  events, to set the mempool gauge or to find
  expired transactions. Each\n  import reports which transactions it added to the
  mempool or removed from\n  it; pruning reads only the oldest entries of the index.
  Before, every\n  block, every batch of new transactions and every clock tick (several
  per\n  second) read the whole mempool at least once.\n- Count the transactions of
  an xpub without building the list of all of them\n  when the cache is not used.\n-
  Keep the derived addresses of the 512 to 1024 most recently queried xpubs\n  in
  memory. Every xpub query derived each address again before reading a\n  balance.
  Addresses depend only on the xpub, so the cache never goes stale.\n- Page the unspent
  outputs of an xpub by merging its addresses in order of\n  block, stopping once
  the page is full, instead of decoding up to offset\n  plus limit outputs of every
  address and sorting them all. The pages are\n  the same.\n- Count the transactions
  of an xpub by merging the raw keys of its\n  addresses, without decoding keys or
  reading values.\n- Open the iterators of a query over many addresses in one bracket
  instead\n  of one bracket each. Every call into RocksDB walked the stack past one\n
  \ frame per address.\n- Double the page, up to 1024 rows, when streaming a source
  by offset, as\n  `/blockchain/unspent` does. The rows read and skipped grew with
  the square\n  of the rows returned.\n- Check that an xpub is cached in the same
  Redis round trip as the read of\n  its balances, transaction count, or a page of
  its transactions or unspent\n  outputs that does not start at a transaction.\n-
  Serialize a transaction at most twice to compute its id, size and weight,\n  and
  stop looking up its witnesses with a quadratic list index.\n- Build on haskoin-core
  1.6.1, which encodes CashAddr and Base58 addresses\n  faster: about 10% less CPU
  per request on endpoints that return many\n  addresses.\n- The executable uses every
  core of the host by default (`-N` instead of\n  `-N4`). Set `+RTS -N<n> -RTS` on
  the command line to choose a number.\n- Read the balances of many addresses, and
  lists of transactions, with one\n  RocksDB multi-get instead of one read per key.
  `StoreReadBase` has a new\n  method, `getManyTxData`, which defaults to reading
  the transactions one by\n  one; `getTransactions` reads many transactions with it.\n-
  Give RocksDB a block cache of 1 GiB by default, shared by all column\n  families,
  and keep their index and filter blocks in it at high priority,\n  with those of
  level 0 pinned. Before, each column family had RocksDB's\n  default cache of 32
  MiB, and index and filter blocks stayed in memory\n  outside any cache for every
  open file. Set the size with `--block-cache-mb`\n  or `BLOCK_CACHE_MB`; 0 restores
  the RocksDB defaults. `StoreConfig` and\n  `withDatabaseReader` take the size in
  bytes. Requires rocksdb-haskell-jprupp\n  2.6.0.\n\n### Added\n\n- `store/bench`:
  a benchmark server that syncs a synthetic regtest chain and\n  serves the web API
  on it, and times the encoding of a response with the\n  argument `micro`. `scripts/bench-web.sh`
  runs wrk against it and reports\n  the CPU time of the server per request.\n\n##
  [1.7.0] - 2026-11-06\n\n### Changed\n\n- Build on haskoin-core 1.6.0 and haskoin-node
  2.3.0, the releases with the\n  fixes of the November 2026 security review. Their
  changelogs list the\n  changes to message parsing, header validation and peer handling
  that the\n  store now runs with.\n- An output has an address only when the network
  defines one for its script,\n  as in haskoin-core 1.6.0. A SegWit-shaped output
  has no address on Bitcoin\n  Cash. A 256-bit script hash output (`OP_HASH256`, a
  push of 32 bytes,\n  `OP_EQUAL`) has none on Bitcoin. Such an output is no longer
  indexed under\n  an address, and its `address` is `null`. Entries that an older
  version\n  wrote under such an address stay in the database. No request can name
  them,\n  since the address has no text form on the network.\n- `POST /transactions`
  takes a body that holds one transaction and nothing\n  else. Bytes after the transaction
  are refused, as Bitcoin Core does for a\n  raw transaction. They used to be ignored.\n-
  `POST /transactions` takes the transaction in the format that peers of the\n  network
  read. A network without SegWit, such as Bitcoin Cash, has the\n  format without
  witness only.\n- `GET /peers` gives the `version` of a peer as a signed number,
  as\n  haskoin-core 1.6.0 reads it. A peer that sends version ffffffff has version\n
  \ -1, where it used to appear as 4294967295.\n- Breaking, in `haskoin-store-data`:
  `toTransaction` takes the `Network` as\n  its first argument, and the `version`
  field of `PeerInfo` is an `Int32`.\n  The binary form of `PeerInfo` is the same
  bytes as before.\n- From haskoin-node 2.3.0: a peer is disconnected when it sends
  more than\n  50000 entries in an `inv` or `getdata` message. On Bitcoin Cash a message\n
  \ may be at most 2 MiB, unless it carries block content. Transactions from\n  Bitcoin
  Cash peers are read in the format without witness only.\n\n### Fixed\n\n- A response
  no longer fails on a transaction with an output that has no\n  address on the network.
  Since haskoin-core 1.5.0 the JSON encoder of such\n  an address threw, which cut
  the response off. One such output is in Bitcoin\n  block 211997 (transaction\n  `a4bfa8ab6435ae5f25dae9d89e4eb67dfa94283ca751f393c1ddc5a837bbc31b`,\n
  \ output 0).\n\n## [1.6.5] - 2026-11-04\n\n### Fixed\n\n- Build on haskoin-core
  1.5.1, which evaluates the ASERT difficulty rule at the\n  parent block. With 1.5.0
  the store rejected a valid block on Bitcoin Cash\n  mainnet at height 975899.\n\n##
  [1.6.4] - 2026-11-04\n\n### Added\n\n- Support Bitcoin testnet4 (`NET=btctest4`),
  from haskoin-core 1.4.0.\n- Option `--block-window` (`BLOCK_WINDOW`) to set how
  many blocks to request\n  from the syncing peer at a time.\n- Option `--write-buffer-mb`
  (`WRITE_BUFFER_MB`) to cap RocksDB memtables\n  across all column families, 256
  MiB by default (0 = unlimited). Without a\n  cap the nine column families can keep
  up to 1.1 GiB of memtables.\n- Option `--max-wal-mb` (`MAX_WAL_MB`), 1024 MiB by
  default (0 = RocksDB\n  default), to bound the RocksDB write-ahead log: once it
  is larger, the\n  column families holding its oldest file are flushed so the file
  can be\n  deleted.\n- `/dbstats` starts with the memory RocksDB uses outside the
  GHC heap:\n  memtables and table readers for each column family, and the block cache.\n-
  The mempool is kept in its own column family, one key per transaction,\n  instead
  of as a single list value that every import batch read, loaded\n  into a hash table
  and wrote back whole. Data version 19: a version 18\n  database is migrated when
  it is opened, with no resync.\n\n### Changed\n\n- Replace monad-logger with the
  fast-logger `Logger` from haskoin-node 2.0.0.\n- Request 64 blocks at a time from
  the syncing peer instead of 500, and ask\n  for more once fewer than 16 remain,
  to bound memory use while catching up.\n- haskoin-store-data builds against secp256k1-haskell
  2.0.0, which hides the\n  raw `PubKey` constructor: `XPubSpec` reads its stored
  key with `pubKey`,\n  which checks it.\n- Build on haskoin-core 1.5.0, haskoin-node
  2.1.2 and secp256k1-haskell 2.0.0.\n  `genesisBlock` no longer takes a context.\n-
  A pay-to-public-key output has no address any more, as in haskoin-core\n  1.5.0.
  Its coins cannot be spent with the input script of the P2PKH address\n  of the same
  key, so they are no longer counted under that address.\n- The block store no longer
  reads the whole mempool four extra times on every\n  internal ping: it compares
  mempool snapshots only when there are pending\n  transactions to import or expired
  ones to delete.\n- Run with four capabilities (`-N4`) instead of one per core (`-N`),
  so that\n  memory overhead does not grow with the size of the host. Override with\n
  \ `+RTS -N<n> -RTS`.\n- Docker image: pin the base image to Debian trixie (RocksDB
  9.10) by digest\n  instead of `debian:latest`, and run with `MALLOC_ARENA_MAX=2`
  to limit\n  malloc fragmentation from RocksDB.\n- Each `/events` client, websocket
  or HTTP stream, gets a queue of at most\n  10,000 events and is disconnected when
  it fills up, instead of the queue\n  growing for as long as the client stays connected.
  Store events that\n  `/events` does not show are no longer queued for its clients.\n-
  A request waiting for another to load an xpub into the cache retries for\n  about
  30 seconds, with at most 5 seconds between attempts, and then serves\n  the xpub
  from the database. It used to retry forever with a delay that\n  doubled each time.\n\n-
  Continuous integration on GitHub Actions: build, run both test suites,\n  and check
  that the heap stays flat while syncing 6000 regtest blocks.\n\n### Fixed\n\n- Support
  full-RBF: accept replacements of transactions that do not signal BIP125.\n- Correct
  various space leaks.\n- `Unspent` implements `coinInputKind`, new in haskoin-core
  1.5.0, from its\n  output script, so coin selection with it no longer fails at run
  time.\n\n### Added\n\n- Support for testnet4 on both networks.\n\n## [1.6.3] - 2026-08-31\n\n###
  Added\n\n- Allow disabling web server to sync block chain only.\n\n## [1.6.2] -
  2026-08-13\n\n### Fixed\n\n- Fix upstream regressions in haskoin-node.\n\n## [1.6.1]
  - 2026-08-13\n\n### Fixed\n\n- Support latest version of haskoin-node.\n\n## [1.6.0]
  - 2026-08-12\n\n### Fixed\n\n- Support for Bitcoin Cash 256-bit scripts.\n- Address
  parsing now allows only correct lengths.\n\n## [1.5.16] - 2025-05-08\n\n### Changed\n\n-
