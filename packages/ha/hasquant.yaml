changelog: |
  ## 0.8.0.0 (2026)

  - Added value-based Settings snapshots with checked restoration, preserving floating dates
    and observer settings, and native fixing-history name normalization for context owners.

  - Added QuantLib 1.44 support, while retaining compatibility with 1.43. New bindings include
    Rough Heston pricing, mark-to-market cross-currency basis swaps, FX reset cash flows, and
    Gaussian1d (GSR) swaptions on overnight-indexed swaps. Calls requiring 1.44, and non-default
    values of arguments added in 1.44, report `UnsupportedQuantLibVersion` on 1.43.
  - Deprecated the `ItalyExchange` calendar, following QuantLib 1.44; it will be removed when
    hasquant adopts QuantLib 1.45. Use `TARGET` instead.
  - `OvernightIndexedSwap` is now a `FixedVsFloatingSwap`; its fair-rate and fixed-leg inspectors
    come from the generic `FixedVsFloatingSwap` instances.
  - Expanded term-structure and bootstrap-helper support, including dated helper constructors and
    implied-quote calculations on caller-supplied curves. Several existing constructor signatures
    changed to expose additional configuration.
  - Extended model and engine support, including an exact-mean option for Heston–Hull–White pricing
    that avoids numerical failures in the upstream approximation. `analyticH1HwEngine` now requires
    an `H1HwMean` argument and rejects a negative equity/rate correlation with either integration control.
  - Split Longstaff-Schwartz regression into `lsmFit` (basis coefficients) and `lsmEvaluate`, which
    reproduce `lsmRegress`/`lsmRegressMulti` bit for bit within one build; `lsmEvaluatorIdentity`
    names that build so stored coefficients can be refused elsewhere.
  - Improved simulation and fixing inspection: `pathGeneratorSequence` exposes the random variates
    actually consumed, and inflation fixing dependencies now follow the dates and interpolation
    rules QuantLib uses.
  - Improved callback validation, exception safety, and object ownership across the FFI, including
    a fix for a MultiCurve ownership cycle.

  ## 0.7.0.0 (2026)

  The final broad API-coverage batch adds Haskell callbacks for payoffs, optimization, regression and
  finite-difference workflows, wider pricing and curve support, index history analysis with the
  matrix decompositions that feed PCA and correlation salvaging, a standalone SOFR-OIS exposure
  example, and substantially more upstream-derived test coverage. Collections now
  encode emptiness and numeric scale more precisely, and the C++ shims share more of their template
  dispatch and allocation plumbing.

  Many functions have been renamed and/or compacted where a single function accepts a sum type and
  calls different internal functions depending on its arguments. The breaking rename is an attempt to make the API easier to explore and discover; the compact
  API is still in flux.

  Another breaking change is the removal of the `QuantLib.Syntax` module and its Template Haskell partial-call helpers.

  ## 0.6.0.0 (2026)

  Rethought multiple inheritance for secondary interfaces (`AffineModel`, `Gaussian1dModel`): instead of a second `Upcastable` node, each leaf now gets a standalone, eagerly-materialized upcast (e.g. `hullWhiteAsAffineModel`). This traded a pure wrap at the call site for an explicit `IO`-sequenced conversion, so a few call sites that used to be pure functions are now `IO` actions — a small, deliberate cost for one fewer hand-rolled sum type per interface. Also generalized several accessor return types one `AnyOf` layer deeper (`SwaptionHelper`, `FixedVsFloatingSwap`) to keep them cast-free, and added a further batch of bindings: Gaussian1d model instruments/engines, YoY/CPI inflation vol surfaces and cap/floors, commodities, cross-currency swaps, and BlackAtmVolCurve/SabrVolSurface/OptionletStripper2.

  ## 0.5.0.2 (2026)

  Support for RelinkableHandle has finally landed. As it turned out the current model is a perfect fit for it: term structures, quotes, and vol surfaces now relink uniformly, so building on top of a live quote or curve propagates updates correctly. Also removed all remaining `dynamic_cast` usage from the C++ shim in favor of dedicated typed bindings, and added a batch of further instrument/engine bindings (SABR vol cubes, Heston FD engines, CDS/counterparty engines, amortizing bonds, exchange rates, CMS legs, and more).
  Added GitHub Actions to test various platforms and GHC versions.

  ## 0.4.0.0 (2026)

  Extended the functionality, added more instruments and asset classes: equity index/cash-flow/total-return-swap, variance and compound options, zero-coupon swaps, further inflation-linked instruments, SABR smile sections, and several rate/vol-related bindings. Widened many existing constructors to their full upstream arity, and added Windows build support.

  ## 0.2.7.0 (2026)

  Polished FFI helpers and reduced technical debt. Updated static data, added inflation.

  ## 0.2.6.0 (2026)

  Finished migration to the new approach without explicit typeclasses — time to publish.

  ## 0.2.5.0 (2022)

  Got rid of typeclasses, which required introducing more boilerplate and more manual marshalling to work around some C2HS shortcomings.

  But now I'm able to avoid some dangerous extensions.

  Revived allocation tracking in C++ code to ensure all objects are freed properly.

  Restored Haddock comments on function arguments.

  Without typeclasses, the inheritance can be expressed even better — if you don't look at the code underlying it ;)

  E.g., you don't need to chain asXXX casts, and in most cases you don't need the casts at all.

  As part of the effort, I generalized arguments (e.g., `GenBond a` instead of `Bond`).

  Eventually, some typeclasses emerged again, but they're not visible to the end user.

  ## 0.2.0.0 (2021)

  Migrated to C2HS, which actually resulted in more manageable code.

  Typeclasses were used again to express inheritance relations and to use marshalling provided by C2HS.

  Haddock comments on function arguments were lost in the process.

  ## 0.1.0.0 (2012-2013)

  Initial implementation. Two projects: qlc (C part like wxcore) and quantlib.

  The latter used Template Haskell to build code that marshalls data, given a foreign declaration and a function signature.

  Tried to separate exceptions into two types: checked (via Either) and unchecked (IO).

  Some ideas of handling C++ templates were taken from QuantLibXL.

  All broke with the next Haskell release (7.8?), where you could no longer use TH to define a function when its signature is known (I used the signature to build the actual marshalling of arguments).

  Heavy use of typeclasses to express inheritance (with lots of extensions used).

  Due to some quirks in the interaction between TH and foreign code, I had to create a custom cabal `Setup.hs` because TH had to load my C code during compilation.

  Some code was generated by scripts using Doxygen files.

  ``` haskell
    vanillaSwap :: VanillaSwapType -- ^type
      -> Double -- ^nominal
      -> Schedule -- ^fixedSchedule
      -> Double -- ^fixedRate
      -> DayCounter -- ^fixedDayCount
      -> Schedule -- ^floatSchedule
      -> IborIndex -- ^iborIndex
      -> Double -- ^spread
      -> DayCounter -- ^floatingDayCount
      -> BusinessDayConvention -- ^paymentConvention
      -> IO VanillaSwap
    vanillaSwap = $(ffiCall 'vanillaSwap) c_vanillaSwap -- automatic generation of marshalling code

    foreign import ccall safe "ql.h qlVanillaSwap"
      c_vanillaSwap :: CInt -> CDouble -> Ptr CSchedule -> CDouble -> Ptr CDayCounter -> Ptr CSchedule -> Ptr CIborIndex -> CDouble -> Ptr CDayCounter -> CInt -> Ptr CString -> IO (Ptr CVanillaSwap)
  ```
changelog-type: markdown
description: |
  Haskell bindings to [QuantLib](https://www.quantlib.org/).

  Supported functionality includes
  - yield, credit, inflation, and volatility curves;
  - IBOR, overnight, swap, and inflation indexes;
  - fixed, floating, amortizing, callable, and convertible bonds;
  - vanilla, barrier, Asian, compound, variance, and basket options;
  - vanilla, CMS, OIS, CDS, zero-coupon, and portfolio-credit (synthetic CDO, nth-to-default) swaps and instruments;
  - risk statistics (VaR, expected shortfall, ...) over caller-supplied samples;
  - large numeric vectors as `vector`'s storable `Vector Double` and dense matrices compatible with hmatrix;
  - and analytic, tree, finite-difference, and Monte Carlo engines from Black-Scholes through SABR and Heston.

  hasquant is a close-to-1:1 `c2hs` wrapper over QuantLib's C++ API, not a framework. It binds 2,000+ constructors and non-trivial methods (around 20% of QuantLib's surface) and deliberately excludes 2,000+ methods (mostly mutators or getters that only repeat constructor inputs).

  Type safety is a primary API goal. Phantom-typed pointers (`GenBond a`, `GenQuote a`, …) preserve the relevant part of QuantLib's object hierarchy in Haskell, so invalid object combinations are compile-time errors rather than failed casts at runtime. The C++ shim uses runtime downcasts only where QuantLib's architecture dictates them; otherwise, bindings expose a concrete leaf type when one is needed. Enums mirror upstream values explicitly.

  hasquant does not depend on [QuantLib-SWIG](https://github.com/lballabio/QuantLib-SWIG). References to it identify prior art for API-shape decisions only.

  The ownership model, enum/ADT design, and C-shim conventions predate AI assistance. AI now helps extend coverage, but each binding is checked against upstream signatures and established patterns, then tested.

  Examples are in `test/example/QuantLib/Example`; most deliberately follow QuantLib examples and tests, prioritizing fidelity to the upstream fixture over idiomatic Haskell. `QuickStart` is the readability-oriented exception. The Hspec suite is dispatched from `test/main/QuantLib/MainTest.hs`.

  Published package: https://hackage.haskell.org/package/hasquant. Current Haddock: https://khorser.github.io/hasquant.

  # Releasing

  Add a `HACKAGE_TOKEN` repository secret containing an API token from a Hackage
  account with permission to upload `hasquant`. The Release workflow uses the existing
  Linux CI image (GHC 9.10.3 / QuantLib 1.43) to build source and Haddock tarballs.

  1. Push a version tag matching `hasquant.cabal` (`v.0.8.0.0`, `v0.8.0.0`, or
     `0.8.0.0`), then dispatch **Release** from the default branch with that `tag`
     and `operation=release`.
  2. The workflow saves both tarballs on a GitHub release and uploads a Hackage
     candidate plus its docs. Review the candidate using the links in the job summary.
     Set `upload_candidate=false` for a GitHub-only run; that run needs no Hackage token.
  3. Promote the reviewed candidate manually on Hackage, then dispatch **Release**
     again with the same `tag` and `operation=published-docs`. This uploads the saved
     documentation tarball to the published version without rebuilding or uploading
     a source package. The operation can be repeated if the docs upload fails.

  GitHub releases default to drafts. The `draft` input applies only when creating a
  release; reruns replace its assets while preserving its current publish state.
  Publish the GitHub release separately when ready. GitHub draft status is independent
  of Hackage candidate status, and `draft`/`upload_candidate` are ignored by
  `published-docs`. Hackage upload failures fail the workflow; assets already saved on
  GitHub remain available.

  # Quick Example

  Build and price a five-year SOFR OIS:

  ``` haskell
  import Data.List.NonEmpty (NonEmpty(..))

  let today = 2 `january` 2024
  setEvaluationDate (Just today)

  cal <- calendar TARGET
  settle <- advance cal today (2, Days) Following False
  let maturity = addGregorianYearsClip 5 settle

  dc <- dayCounter (Actual360 False)
  curve <- interpolatedZeroCurve
    ((settle, 0.030) :|
      [ (addGregorianYearsClip 1 settle, 0.032)
      , (addGregorianYearsClip 2 settle, 0.034)
      , (addGregorianYearsClip 5 settle, 0.036)
      , (addGregorianYearsClip 10 settle, 0.038)
      ]) dc cal [] Linear

  sofr <- overnightIborIndex Sofr (Just curve)

  sched <- schedule (Just settle) maturity (1, Years) cal
    ModifiedFollowing ModifiedFollowing Backward False Nothing Nothing

  ois <- overnightIndexedSwap Payer 10000000 sched 0.035 dc sofr 0.0
    0 Following cal False AveragingCompound Nothing Nothing 0 False

  engine <- discountingSwapEngine curve (Just False) Nothing Nothing
  setPricingEngine ois engine

  npv ois >>= print       -- 70994.8441727506
  fairRate ois >>= print  -- 3.6554153626327204e-2
  ```

  This is `QuantLib.Example.QuickStart.run`, run by `cabal run hasquant_example -f buildExample` and covered by `test/hspec/QuantLib/Spec/Examples.hs`.

  # Goals and Scope

  hasquant provides pricing, curve-building, and risk primitives; callers own orchestration. `app/SofrXva` owns CSV parsing and pipeline wiring, and uses hasquant for curve construction and discounting.

  Two things follow from that split:

  - Calendar, currency, day-counter, and index enums are usable without a pricing engine.
  - Monte Carlo tests and examples use fixed nonzero RNG seeds; QuantLib treats `seed = 0` as entropy.

  Out of scope: reimplementing or independently binding QuantLib's interpolation, optimization, linear-algebra, and RNG internals, unless another binding needs one exposed.

  ## Roadmap
  - Identify which [OpenSourceRiskEngine](https://opensourcerisk.org) functionality should be bound, e.g. `https://github.com/OpenSourceRisk/Engine/blob/master/QuantExt/qle/indexes/fallbackiborindex.hpp`
  - Build a declarative embedded DSL as a sibling project to define contracts, portfolios, market data, and calculation scenarios (unpublished WIP), use it for XVA and other complext calculations
  - Expose that DSL through an agent-callable tool, so an LLM can construct and price products through validated hasquant operations rather than generated pricing logic.
  - Keep the exact-mean H1-HW backport (`cbits/qlExactMeanH1HwEngine.h`) until both supported QuantLib release series provide `AnalyticH1HWEngine::VarianceRootMean::Exact`; `ExactMean` already selects the native engine when the linked headers expose it.
  - On adopting QuantLib 1.45 (dropping 1.43):
    - remove the `ItalyExchange` calendar, deprecated in 1.44 (replacement: `TARGET`);
    - drop the boost branches of `cbits/qlStdCompat.h` and spell `std::optional`/`std::any` directly;
      its versioned-argument macro then becomes unconditional or moves to the 1.45 pair.
  - See [github issues](https://github.com/khorser/hasquant/issues) for more formalized tasks

  # Testing

  Tests reuse QuantLib fixtures and cached values when available. Enum-dispatched bindings also get smoke tests that construct and check representative values; these catch stale or incorrect enum mappings that can survive a clean build and the ordinary test suite.

  `tools/ql-methods-1.43.txt` and `tools/ql-methods-1.44.txt` track constructors and non-trivial methods. Coverage: https://khorser.github.io/hasquant/coverage/hpc_index.html.

  # QuantLib version policy

  hasquant supports the latest patch release of the two most recent stable QuantLib series
  (1.42 and 1.42.1 are one series), starting with 1.43 and 1.44. Patch releases replace their
  predecessor without moving the window; release candidates are tested early but displace nothing.
  Each hasquant release lists the exact QuantLib versions it supports, and no fixes are backported
  to versions outside the window.

  Bindings to APIs QuantLib deprecates are removed when hasquant adopts the next stable series
  (e.g. deprecated in 1.44, removed on adopting 1.45), with the removal series and replacement
  documented in advance. Removals bump hasquant's major version under the
  [PVP](https://pvp.haskell.org/) and are listed in the release notes.

  The Haskell API is the same on both supported versions. On the older one, calls that need the
  newer QuantLib raise `UnsupportedQuantLibVersion`, as do most newer arguments set to anything
  but their upstream default. Newer validation may also apply there, and results can still differ.

  # Building

  GHC 9.10 is the primary development version. GHC 8.10.6 (`base >= 4.14`) is the supported floor and is checked against Stackage lts-18.8. GitHub CI also tests with GHC 9.6.7, 9.8.4, 9.12.4, 9.14.1.

  Install QuantLib 1.43 or 1.44: [Linux](https://www.quantlib.org/install/linux.shtml), [macOS](https://www.quantlib.org/install/macosx.shtml), or [CMake](https://www.quantlib.org/install/cmake.shtml).

  Linux and macOS are the primary, well-tested platforms. Windows builds work too, but QuantLib has to be rebuilt with GHC's own bundled Clang first — see [`WINDOWS.md`](WINDOWS.md) for the recipe.

  hasquant never uses intraday dates, so prefer a QuantLib built without `QL_HIGH_RESOLUTION_DATE` (check `ql/config.hpp`). With it, every `Date` operation goes through boost `posix_time`. In a GSR-calibration-heavy workload that was 59% of CPU, and turning it off cut run times from 309 s to 156 s and from 76 s to 28 s, with bit-identical results. Homebrew's formula turns it on (`--enable-intraday`); CMake leaves it off by default:

  ```
  cmake -S QuantLib-1.43 -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/opt/quantlib-1.43 \
    -DCMAKE_INSTALL_NAME_DIR=$HOME/opt/quantlib-1.43/lib -DQL_BUILD_EXAMPLES=OFF -DQL_BUILD_TEST_SUITE=OFF
  cmake --build build -j && cmake --install build
  brew unlink quantlib
  ```

  To use custom built QuantLib copy `cabal.project.local.customQL` to `cabal.project.local` and update the paths.

  ## Cabal

  Build everything, including tests and the flagged executables:
  `cabal build all --enable-tests -f buildExample -f buildSofrXva`

  Run tests: `cabal test all --enable-tests` (add `--test-options=--skip=LONG` for the fast path)

  Build and run examples: `cabal run hasquant_example -f buildExample`.
  The example executable is `buildable: False` without that flag, so HLS also needs it — add `package hasquant` / `flags: +buildExample` to `cabal.project.local` to edit `main/exe` with HLS.

  To trace allocations:
  `cabal run hasquant_example -f buildExample -f trackAllocations`

  The trace defaults to stderr. Use a file to keep program output separate:

  `QLTRACK_ALLOCATIONS=/tmp/trace.log cabal run hasquant_example -f buildExample -f trackAllocations`

  `tools/alloc-summary.py /tmp/trace.log` pairs allocations and frees, reports live objects and double frees, and exits nonzero on an accounting failure.

  **Caution:** Cabal does not rebuild `cxx-sources` when only a flag changes. Before enabling `trackAllocations`, delete `build/cbits` and confirm a built object contains `allocated` before trusting an empty trace.

  Run GHCi: `cabal repl lib:hasquant`

  See `q` script in the project root for more options, [fzf](https://github.com/junegunn/fzf) is needed

  ### Pinned dependencies

  Dependencies are pinned to Stackage snapshots stored as cabal constraint files in `cabal/`:

  | Project file | GHC | Snapshot |
  |---|---|---|
  | `cabal.project` (default) | 9.10.3 | lts-24.56 |
  | `cabal.project.lts-22.44` | 9.6.7 | lts-22.44 |
  | `cabal.project.lts-18.8` | 8.10.6 | lts-18.8 |
  | `cabal.project.unpinned` | others | none |

  Select a non-default project with `--project-file=<file>`, which then reads `<file>.local` instead of `cabal.project.local`.
  Each snapshot's `with-compiler` selects the matching versioned `ghc-X.Y.Z` binary installed by GHCup.
  To add or refresh a snapshot, run `tools/stackage-cabal-config.sh lts-X.Y` and import the generated `cabal/stackage-lts-X.Y.config` from a project file.

  ## Docker

  The Linux x86_64 image runs the GHC 8.10.6 compatibility gate:
  `docker compose build`, then
  `docker compose run --rm -it hasquant sh -c 'ghcup install ghc 8.10.6 && cabal update && cabal build all --project-file=cabal.project.lts-18.8 --enable-tests -f buildExample -f buildSofrXva && cabal test all --project-file=cabal.project.lts-18.8 --enable-tests -f buildExample -f buildSofrXva'`.

  Drop `-it` when running without a TTY (CI, or a scripted check) — it fails there.

  The image persists GHCup and Cabal caches and keeps build outputs off the host.

  # On Types

  Public APIs use concrete types by default. Public capability classes are reserved for genuine
  multiple-inheritance interfaces and operations shared by related types with the same signature and
  semantics. Blanket constraints still expose implementation details and can rule out otherwise valid
  callers; concrete types and explicit upcasts remain the better choice when no common capability is
  being expressed.

  The practical exception is collections of related QuantLib objects. Types such as `[GenQuote q]` and `NonEmpty (GenRateHelper rh)` carry one shared phantom parameter, so every element must have the same type. Supporting an arbitrary mixture of sibling types directly would require existential wrappers or additional public constraints throughout higher-level APIs. Instead, callers explicitly upcast elements to their common parent before putting them in one list.

  Container types also communicate intent. Ordinary lists are used for small or genuinely optional collections; `NonEmpty` makes required schedules, helpers, notionals, and curve nodes impossible to omit accidentally. Large homogeneous numeric data—Monte Carlo paths, regression data, and volatility grids—uses storable `RealVector` and `RealMatrix` values, avoiding the allocation overhead of boxed lists while retaining explicit dimensions. These distinctions put useful invariants and performance expectations in the API instead of leaving them to documentation and runtime checks.

  ## How to read types

  `CallableBond` accepts only callable bonds. `GenBond a` accepts `Bond` and its derivatives:
  ``` haskell
  type Bond = GenBond CBond
  type FixedRateBond = GenBond CFixedRateBond
  type ConvertibleBond = GenBond CConvertibleBond
  type CallableBond = GenBond CCallableBond
  ```

  `GenInstrument a` (for example, `npv`) accepts every instrument. An implicit upcast allocates a temporary C-side handle and frees it after the call, so reuse `asBond` or `asInstrument` when making repeated calls through a common parent type.

  Cash flows follow the same pattern: `GenCashFlow cf` is the common root, with
  `GenFloatingRateCoupon`, `GenIndexedCashFlow`, and `GenDigitalCoupon` preserving useful
  intermediate families. A homogeneous subtype list can be passed directly to `cashFlowLeg`;
  heterogeneous lists explicitly materialize `CashFlow` elements with `asCashFlow` first.
