changelog: "# v2.1.0.0\n\n## Breaking\n\n- `Hasql.Decoders.rowVector` now decodes
  into any `Data.Vector.Generic` vector (`Vector`, unboxed, storable, primitive) instead
  of only the boxed `Data.Vector.Vector`, picked by the type the result is consumed
  as. Call sites that left the vector type to be inferred with nothing pinning it
  down (no type signature, no boxed-`Vector`-specific downstream use) will now hit
  an ambiguous type error and need an explicit annotation. (#336)\n\n- `Hasql.Connection.use`
  now returns `UseError` instead of a single session-error type. `UseError` has two
  constructors:\n\n  - `SessionUseError` wraps a `SessionError` - the session ran
  but reported a recoverable error (a server error, a decode failure). The connection
  is still live.\n  - `ConnectionUseError` - the connection is gone, for any reason:
  a dropped socket, a request libpq refused to send outright, an unexpected response,
  a bug in Hasql. `use` has closed the handle before returning; every subsequent `use`
  on the same `Connection` reports this error again.\n\n  Code that pattern-matched
  on the old session-error type now matches on `UseError`. The `SessionUseError` arm
  covers the recoverable errors that `SessionError` already expressed; `ConnectionUseError`
  replaces every constructor that meant the connection was gone.\n\n- `Hasql.Errors.IsError`
  no longer has an `isTransient` method. Whether a failure is worth retrying depends
  on the caller's retry policy and, for server errors, the SQLSTATE reported through
  `toSqlState` - not on a verdict the driver hands out. No replacement is provided.\n\n-
  `Hasql.Connection.acquire` now returns `AcquireError` instead of a plain `Text`
  message. The five constructors are organized by which stage of `acquire` failed
  - connecting, checking the server version, or initializing session settings - since
  that is what the driver actually observes, rather than by a best-effort classification
  of `libpq`'s (locale-dependent, adapter-dependent) error text:\n\n  - `ConnectionAcquireError`
  - the connection could not be established, and no structured signal exists to say
  why. This is the residual case at the connection stage: DNS failure, connection
  refused, TLS negotiation failure, a rejected password, a missing database, and any
  other rejection all land here alike.\n  - `ConnectionPasswordRequiredAcquireError`
  - the server demanded a password and none was available, reported from `libpq`'s
  own flag rather than inferred from message text.\n  - `VersionTooOldAcquireError`
  - the server's version is below the minimum this driver supports, carrying the server's
  major, minor and patch version as `Int`s rather than formatted prose.\n  - `InitializationConnectionLossAcquireError`
  - session initialization failed and the connection died, with prose and nothing
  else.\n  - `InitializationServerErrorAcquireError` - session initialization failed
  and the server said why, carrying a structured `ServerError` with a SQLSTATE.\n\n-
  A `ConnectionUseError` now closes the connection before returning. `Hasql.Connection.release`
  on a spent handle does nothing. Pools already discarded connections on fatal errors,
  so this makes the driver keep the contract its callers were already assuming.\n\n
  \ As a consequence `Hasql.Connection.release` is idempotent, and a released connection
  can no longer be reached through `use`. Both were undefined behaviour before: `libpq`
  forbids touching a connection after `PQfinish`, and the driver already closed connections
  it could not clean up.\n\n  The driver no longer attempts to repair a connection
  it failed to send on. There is nothing it can assume about the protocol state of
  such a connection, and the only repair available - pushing a Sync - has the side
  effect of flushing and committing whatever the failed session had queued. Closing
  it is both simpler and more honest.\n\n- An exception that cuts a session short
  - one thrown by the session itself, or an interruption delivered from another thread
  by `timeout`, `race` or `killThread` - now closes the connection. It propagates
  as before, but the handle it fired on is spent from then on, so a `timeout` around
  a session costs a connection rather than returning one. Pools reconnect; code holding
  a `Hasql.Connection.Connection` directly has to acquire a new one. Server-side session
  state - anything `set` on the connection - goes with it, where it used to be deliberately
  preserved across an interruption.\n\n  The driver used to bring such a connection
  back to a clean state instead - draining results, aborting the transaction, deallocating
  prepared statements. That repair is blocking network IO performed under a mask,
  so on a connection whose peer has gone away it never returns and the very interruption
  being handled never lands. It could also report its own failure as a returned error
  without rethrowing, which made `timeout` yield `Just (Left _)` instead of `Nothing`.
  Neither is worth the connection it saves.\n\n## Non-breaking\n\n- Support `iproute-1.8`.\n\n-
  Prepared statement names are now content-addressed (`hasql_` plus a SHA-256 digest
  of the SQL and parameter OIDs) rather than per-connection counters. The Haskell
  API is unchanged. (#324)\n\n- `42P05` (\"prepared statement already exists\") no
  longer forces the driver to evict the statement cache entry, and the mapping survives
  it. (#331)\n\n## Fixes\n\n- `Hasql.Connection.acquire` now finishes the underlying
  connection on every failure path, and no longer ignores the result of its session-init
  statements.\n\n- Send requests libpq refuses outright (e.g. over 65535 parameters)
  now close the connection, so a retry wrapper cannot resend the identical rejected
  request against the same handle forever. (#327)\n\n- A send failure partway through
  a pipeline left the connection stuck in pipeline mode with undrained results, so
  every later session on it failed too. The connection is now closed rather than handed
  back. (#326)\n\n- A pipeline whose send fails partway through no longer applies
  the statements preceding the failure. In pipeline mode libpq buffers until a Sync,
  so those statements had not reached the server; what put them there was the recovery
  attempt, whose Sync flushed and committed them on the way to reclaiming the connection.
  Such a pipeline is now discarded whole, matching what a pipeline that fails on a
  server error already did.\n\n- A session that catches a pipeline failure and carries
  on no longer runs the rest of itself against a connection the send failed on. The
  remaining operations report `ConnectionUseError` instead, and the connection is
  closed however the session ends - including when it swallows the failure and succeeds.
  Previously the first serial statement after such a catch blocked forever on results
  the server had never been asked for.\n\n- A connection lost while receiving results
  is now reported as `ConnectionUseError`, matching how the send side already classified
  a lost socket. It used to surface as a `StatementSessionError` carrying `UnexpectedRowCountStatementError`
  - \"expected 1 row, got 0\" - which is not transient, so retry wrappers did not
  retry it and pools returned the dead connection for reuse.\n\n# v2.0.1.0\n\n## New
  Features\n\n- `IsError` gained a `toSqlState` method, exposing the SQLSTATE the
  server reported for an error, or `Nothing` where the error carries no server code.
  It saves consumers from pattern-matching their way down to the nested `ServerError`
  — a dig that has to be rewritten every time the error types gain a constructor.\n\n
  \ ```haskell\n  case Errors.toSqlState err of\n    Just \"23505\" -> handleUniqueViolation\n
  \   _ -> rethrow err\n  ```\n\n  The method has a default implementation returning
  `Nothing`, so existing instances keep compiling. Instances for error types that
  *wrap* another error type must override it and delegate to the wrapped value, otherwise
  they silently report `Nothing` for codes they do carry.\n\n# v2.0.0.3\n\n## Fixes\n\n-
  Work around the bug in Cabal due to which documentation does not get generated for
  definitions reexported from sublibs.\n\n# v2.0.0.2\n\nWork around the bugs in Cabal/Haddock
  that cause missing documentation for two-hop reexported internal modules.\n\n# v2.0.0.1\n\nSupport
  for `pqi-1.1`.\n\n# v2.0.0.0\n\nNew era: the transport layer is now pluggable via
  [`pqi`](https://github.com/nikita-volkov/pqi), and an alpha pure-Haskell backend,
  [`pqi-native`](https://github.com/nikita-volkov/pqi-native), is available for early
  adopters. Goal: a reliable, performant, no-C-dependency replacement for libpq.\n\n##
  Breaking\n\n- `Hasql.Connection.acquire` now takes an explicit adapter as its first
  argument, ahead of `Settings`. To keep prior behaviour, depend on [`pqi-ffi`](https://hackage.haskell.org/package/pqi-ffi)
  and pass `Pqi.Ffi.adapter`. To try the native backend, depend on [`pqi-native`](https://hackage.haskell.org/package/pqi-native)
  and pass `Pqi.Native.adapter`.\n\n# 1.10\n\nMajor revision happened.\n\n## New Features\n\n-
  **OID by name resolution**.\n\n  Encoders and decoders now support resolving PostgreSQL
  type OIDs by their names at runtime. This enables working with custom types (enums,
  composite types, domains) without hardcoding OID values. The system includes an
  OID cache to optimize repeated lookups and automatically queries `pg_type` and related
  system catalogs when needed. This change affects array, composite, and value encoders/decoders
  throughout the codec system.\n\n- **Decoder compatibility checks**.\n\n  Previously
  decoders were silently accepting values of different types, if binary decoding did
  not fail. Now decoders check if the actual type of the column matches the expected
  type of the decoder and report `UnexpectedColumnTypeStatementError` error if they
  do not match. They also match the amount of columns in the result with the amount
  of columns expected by the decoder and report an error if they do not match.\n\n-
  **No resets on errors**.\n\n  Previously when an async exception was raised during
  the execution of a session, the connection would get reestablished to recover from
  any possible half-finished states. That led to a loss of the connection-local state
  on the server side. Now the connection recovers without resetting.\n\n- **Redesigned
  connection configuration API**.\n\n  The connection settings API has been completely
  redesigned to be more composable and user-friendly. Settings are now represented
  as a monoid, allowing easy combination of multiple configuration options. The API
  now supports both URI and key-value connection string formats, with individual setters
  for common parameters like host, port, user, password, etc.\n\n- **Custom codec
  API**.\n\n  Added `Hasql.Encoders.custom` and `Hasql.Decoders.custom` functions
  providing a low-level API for defining custom value encoders and decoders. These
  functions offer fine-grained control over OID resolution, allowing you to:\n  -
  Specify static OIDs when known at compile time\n  - Automatically resolve OIDs at
  runtime by type name\n  - Declare dependencies on other types needed for serialization/deserialization
  (e.g., field types in composite types)\n  - Implement custom binary encoding/decoding
  logic with access to resolved OIDs\n\n  This is particularly useful for advanced
  use cases like custom composite types with field validation or specialized binary
  formats.\n\n## Breaking changes\n\n- Text instead of ByteString for textual data.\n
  \ - The public API now uses `Text` instead of `ByteString` for SQL statements and
  error messages.\n\n- Custom type mappings (enums and composite types) now require
  specifying names for the types being mapped.\n  - This will automatically identify
  the types with the DB and do deep compatibility checks.\n\n- Decoder checks are
  now more strict and report `UnexpectedColumnTypeStatementError` when the actual
  type of a column does not match the expected type of the decoder. Previously such
  mismatches were silently ignored and could lead to either autocasts or runtime errors
  in later stages.\n  - E.g., `int4` column decoded with `int8` decoder will now report
  `UnexpectedColumnTypeStatementError` instead of silently accepting the value.\n\n-
  Session now has exclusive access to the connection for its entire duration. Previously
  it was releasing and reacquiring the lock on the connection between statements.\n
  \ - If you need the old behaviour, you can use `ReaderT Connection (ExceptT SessionError
  IO)`.\n\n- Dropped `MonadReader Connection` instance for `Session`.\n\n- Dropped
  `Monad` and `MonadFail` instances for the `Row` decoder. `Applicative` is enough
  for all practical purposes.\n\n- Errors model completely overhauled.\n  - `ConnectionError`
  restructured and moved from the `Hasql.Connection` module to `Hasql.Errors`.\n  -
  `SessionError` restructured and moved from the `Hasql.Session` module to `Hasql.Errors`.\n\n-
  `usePreparedStatements` setting dropped. Use `disablePreparedStatements` instead.\n\n-
  `Hasql.Session.sql` renamed to `Hasql.Session.script` to better reflect its purpose.\n\n-
  Connection configuration API overhaul to improve UX.\n  - `Hasql.Connection.acquire`
  now takes a single `Settings` value instead of a list of `Setting` values.\n  -
  The `Hasql.Connection.Setting` module has been replaced with `Hasql.Connection.Settings`.\n
  \ - Settings are now constructed using flat monoid composition instead of hierarchical
  lists requiring multiple imports.\n  - Removed `Hasql.Connection.Setting.Connection`
  and related submodules.\n\n- Custom value decoder signature changed.\n\n  The `Hasql.Decoders.custom`
  function signature has been extended to support more explicit control over type
  resolution. It now requires:\n  - Optional static OIDs parameter (previously implicit)\n
  \ - List of additional type dependencies needed for decoding\n  - The decoder function
  now receives an OID lookup function as its first parameter\n\n  This change enables
  more robust custom type handling but requires updating existing custom decoder implementations.\n\n-
  Exception instances on error types removed. The error types here were never thrown
  as exceptions. Wrap them in your own exception type if you need to throw them.\n\n#
  1.9\n\n- Revised the settings construction exposing a tree of modules\n- Added a
  global prepared statements setting\n\n## Why the changes?\n\nTo introduce the new
  global prepared statements setting and to make the settings API ready for extension
  without backward compatibility breakage.\n\n## Instructions on upgrading the 1.8
  code\n\n### When explicit connection string is used\n\nReplace\n\n```haskell\nHasql.Connection.acquire
  connectionString\n```\n\nwith\n\n```haskell\nHasql.Connection.acquire \n  [ Hasql.Connection.Setting.connection
  (Hasql.Connection.Setting.Connection.string connectionString)\n  ]\n```\n\n### When
  parameteric connection string is used\n\nReplace\n\n```haskell\nHasql.Connection.acquire
  (Hasql.Connection.settings host port user password dbname)\n```\n\nwith\n\n```haskell\nHasql.Connection.acquire\n
  \ [ Hasql.Connection.Setting.connection\n    ( Hasql.Connection.Setting.Connection.params\n
  \     [ Hasql.Connection.Setting.Connection.Param.host host,\n        Hasql.Connection.Setting.Connection.Param.port
  port,\n        Hasql.Connection.Setting.Connection.Param.user user,\n        Hasql.Connection.Setting.Connection.Param.password
  password,\n        Hasql.Connection.Setting.Connection.Param.dbname dbname\n      ]\n
  \   )\n  ]\n```\n\n# 1.8.1\n\n- In case of exceptions thrown by user from inside
  of Session, the connection status gets checked to be out of transaction and unless
  it is the connection gets reset.\n\n# 1.8\n\n- Move to \"iproute\" from \"network-ip\"
  for the \"inet\" datatype (#163).\n\n# 1.7\n\n- Decidable instance on `Encoders.Params`
  removed. It was useless and limited the design.\n- `QueryError` type renamed to
  `SessionError`.\n- `PipelineError` constructor added to the `SessionError` type.\n\n#
  1.6.3.1\n\n- Moved to \"postgresql-libpq-0.10\"\n\n# 1.6.3\n\n- Added `unknownEnum`
  encoder\n\n# 1.6.2\n\n- Added composite encoder\n- Added `oid` and `name` encoders\n\n#
  1.6.1\n\n- Added `jsonLazyBytes` and `jsonbLazyBytes`\n\n# 1.6\n\n- Added position
  to `ServerError` (breaking change).\n- Disabled failure on empty query.\n\n# 1.5\n\n-
  Added column number to `RowError` (breaking change).\n- Added `MonadReader Connection`
  instance for Session.\n"
changelog-type: markdown
description: |
  # Hasql

  [![Hackage](https://img.shields.io/hackage/v/hasql.svg)](https://hackage.haskell.org/package/hasql)
  [![Continuous Haddock](https://img.shields.io/badge/haddock-master-blue)](https://nikita-volkov.github.io/hasql/)

  PostgreSQL driver for Haskell, that prioritizes:

  - **Reliability.** Failures come back as values, and the type says whether the connection survived them. See [Errors](#errors).
  - **Flexibility.** Sessions compose, codecs are assembled from parts, and even the transport is a choice you make. See [Ecosystem](#ecosystem).
  - **Performance.** Statements are prepared by default and can be pipelined into a single round-trip via `Hasql.Session.pipeline`.

  Hasql is production-ready and actively maintained. It's used by many companies and most notably by the [Postgrest](https://github.com/PostgREST/postgrest) project. The API changes at major versions and each major release is supported for at least a year, as described under [Support policy](#support-policy). Every change is recorded in the [changelog](CHANGELOG.md).

  Upgrading from 1.x? `Hasql.Connection.acquire` now takes a transport adapter as its first argument, so switching is a one-argument change, and the error types have been reshaped. The [changelog](CHANGELOG.md) lists every break.

  ## Getting started

  Hasql carries no C dependency. It programs against the ["pqi"](https://github.com/nikita-volkov/pqi) interface, and you pick the adapter that implements it. That means you depend on two packages, not one:

  ```cabal
  build-depends:
    hasql,
    pqi-ffi,  -- or pqi-native
  ```

  `Hasql.Connection.acquire` then takes the adapter explicitly, as its first argument:

  ```haskell
  connection <- Hasql.Connection.acquire Pqi.Ffi.adapter settings
  ```

  ["pqi-ffi"](https://github.com/nikita-volkov/pqi-ffi) is the stable, production-proven default. ["pqi-native"](https://github.com/nikita-volkov/pqi-native) is a pure-Haskell alpha with no C dependency at all. [Transport adapters](#transport-adapters) covers how to choose.

  ## Example

  Following is a complete application, which sums three numbers in Postgres by running one statement twice on the same connection.

  ```haskell
  {-# LANGUAGE OverloadedStrings #-}

  import Data.Functor.Contravariant
  import Data.Int
  import Hasql.Session (Session)
  import Prelude
  import qualified Hasql.Connection as Connection
  import qualified Hasql.Connection.Settings as Settings
  import qualified Hasql.Decoders as Decoders
  import qualified Hasql.Encoders as Encoders
  import qualified Hasql.Session as Session
  import qualified Hasql.Statement as Statement
  import qualified Pqi.Ffi

  main :: IO ()
  main = do
    acquisition <- Connection.acquire Pqi.Ffi.adapter settings
    case acquisition of
      Left err -> fail (show err)
      Right connection -> do
        result <- Connection.use connection (sumSession 3 8 4)
        print result
    where
      settings =
        mconcat
          [ Settings.hostAndPort "localhost" 5432,
            Settings.user "postgres",
            Settings.password "postgres",
            Settings.dbname "postgres"
            -- Prepared statements are enabled by default.
            -- To disable them (e.g., for pgbouncer compatibility):
            -- Settings.noPreparedStatements True
          ]

  -- | Session abstracts over the execution of operations on a connection.
  -- It has a Monad instance, so statements compose.
  sumSession :: Int64 -> Int64 -> Int64 -> Session Int64
  sumSession a b c = do
    ab <- Session.statement (a, b) sumStatement
    Session.statement (ab, c) sumStatement

  -- | Statement is a definition of an individual SQL-statement, accompanied by
  -- a specification of how to encode its parameters and decode its result.
  sumStatement :: Statement.Statement (Int64, Int64) Int64
  sumStatement = Statement.preparable sql encoder decoder
    where
      sql =
        "select $1 + $2"
      encoder =
        mconcat
          [ fst >$< Encoders.param (Encoders.nonNullable Encoders.int8),
            snd >$< Encoders.param (Encoders.nonNullable Encoders.int8)
          ]
      decoder =
        Decoders.singleRow
          (Decoders.column (Decoders.nonNullable Decoders.int8))
  ```

  [Your First Statement](https://github.com/nikita-volkov/hasql-docs/blob/main/your-first-statement.md) is the same program with the annotations left in, explaining the encoder and decoder vocabulary line by line.

  ## Errors

  Every operation reports its failures as values. There are three error types, in `Hasql.Errors`, and which one you get tells you what state you're left in.

  `Hasql.Connection.acquire` returns `AcquireError`, organized by the stage that failed: connecting, checking the server version, or initializing session settings.

  `Hasql.Connection.use` returns `UseError`, which splits on the only distinction the caller can act on:

  ```haskell
  result <- Connection.use connection session
  case result of
    Right a -> pure a
    -- The session failed, the connection is still live and reusable.
    Left (Errors.SessionUseError err) -> ...
    -- The connection is gone. Hasql has already closed it.
    Left (Errors.ConnectionUseError reason) -> ...
  ```

  A `ConnectionUseError` means the handle is spent. Hasql finished the connection before returning, so every later `use` on it reports the same error and `release` is a no-op. Pools must discard it rather than return it. A `SessionUseError` carries a `SessionError` and leaves the connection untouched.

  All three types implement `IsError`, which renders a message and details for logging and exposes the server's SQLSTATE through `toSqlState` where one was reported.

  ## Documentation

  The long-form material lives in [hasql-docs](https://github.com/nikita-volkov/hasql-docs).

  - [**Your First Statement**](https://github.com/nikita-volkov/hasql-docs/blob/main/your-first-statement.md) - an annotated walkthrough of a complete Hasql program, explaining the encoder and decoder vocabulary line by line. Start here if the [Example](#example) above went past too fast.

  - [**Data-Access Architecture**](https://github.com/nikita-volkov/hasql-docs/blob/main/data-access-architecture.md) - a normative reference for organizing database integration code built on Hasql. It specifies how to layer types, statements, transactions and sessions, where the application domain enters the picture, how the three error channels differ, and what to test at each level. Every rule carries its rationale and derives from the capability differences between Hasql's four constructs.

  - [**Why Make It an Ecosystem?**](https://github.com/nikita-volkov/hasql-docs/blob/main/why-an-ecosystem.md) - the rationale for splitting Hasql into many small, separately-versioned libraries instead of one large one.

  The architecture reference is written to be consumed directly by coding agents as well as by people. Point an agent at [the raw file](https://raw.githubusercontent.com/nikita-volkov/hasql-docs/main/data-access-architecture.md) and it has the whole system in context, with the rules numbered so they can be cited back in review.

  Per-module API docs are on [Hackage](https://hackage.haskell.org/package/hasql), and the [continuous Haddock](https://nikita-volkov.github.io/hasql/) tracks `master`.

  ## Ecosystem

  Hasql is not just a single library, it is a granular ecosystem of composable libraries, each isolated to perform its own task and stay simple. Each one is separately versioned and separately owned, so a change in one doesn't ripple into the others and anyone can publish an alternative without asking. Instead of debating how transactions or cursors should be abstracted, the ecosystem carries competing answers side by side. [Why Make It an Ecosystem?](https://github.com/nikita-volkov/hasql-docs/blob/main/why-an-ecosystem.md) gives the full argument.

  <!-- TODO: curate this list. Every published extension is still on a pre-2.x
       release, and at least one entry below redirects the reader elsewhere. -->

  - ["hasql"](https://github.com/nikita-volkov/hasql) - the root of the ecosystem, which provides the essential abstraction over the PostgreSQL client functionality and mapping of values. Everything else revolves around that library.

  - ["hasql-transaction"](https://github.com/nikita-volkov/hasql-transaction) - an STM-inspired composable abstraction over database transactions providing automated conflict resolution.

  - ["hasql-pool"](https://github.com/nikita-volkov/hasql-pool) - a Hasql-specialized abstraction over the connection pool.

  - ["hasql-postgresql-types"](https://github.com/nikita-volkov/hasql-postgresql-types) - integration with the ["postgresql-types"](https://github.com/nikita-volkov/postgresql-types) library, which is a collection of Haskell types precisely modeling PostgreSQL types without data loss or compromise.

  - ["hasql-dynamic-statements"](https://github.com/nikita-volkov/hasql-dynamic-statements) - a toolkit for generating statements based on the parameters.

  - ["hasql-th"](https://github.com/nikita-volkov/hasql-th) - Template Haskell utilities, providing compile-time syntax checking and easy statement declaration.

  - ["hasql-cursor-query"](https://github.com/nikita-volkov/hasql-cursor-query) - a declarative abstraction over cursors.

  - ["hasql-cursor-transaction"](https://github.com/nikita-volkov/hasql-cursor-transaction) - a lower-level abstraction over cursors, which however allows to fetch from multiple cursors simultaneously. Generally though "hasql-cursor-query" is the recommended alternative.

  - ["hasql-migration"](https://github.com/tvh/hasql-migration) - A port of postgresql-simple-migration for use with hasql.

  - ["hasql-listen-notify"](https://github.com/awkward-squad/hasql-listen-notify) / ["hasql-notifications"](https://github.com/diogob/hasql-notifications) - Support for PostgreSQL asynchronous notifications.

  - ["hasql-optparse-applicative"](https://github.com/sannsyn/hasql-optparse-applicative) - "optparse-applicative" parsers for Hasql.

  - ["hasql-implicits"](https://github.com/nikita-volkov/hasql-implicits) - implicit definitions, such as default codecs for standard types.

  - ["hasql-interpolate"](https://github.com/awkward-squad/hasql-interpolate) - a QuasiQuoter that supports interpolating Haskell expressions into Hasql queries.

  <sup>Want to list your package or correct something here? Make a PR.</sup>

  ### Transport adapters

  Unlike the extension libraries above, which are optional, a transport adapter is mandatory: Hasql needs one to talk to the server at all.

  - ["pqi"](https://github.com/nikita-volkov/pqi) - the driver-agnostic interface that Hasql programs against. Pulled in automatically. You don't depend on it directly.

  - ["pqi-ffi"](https://github.com/nikita-volkov/pqi-ffi) - the stable adapter, backed by the C "libpq" library. It requires "libpq" of at least version 14 to be installed to compile, which typically just means having a recent PostgreSQL distro installed. Through it Hasql is tested against a wide range of PostgreSQL servers, starting from version 9.

  - ["pqi-native"](https://github.com/nikita-volkov/pqi-native) - a from-scratch, pure-Haskell implementation of the Postgres wire protocol, with no C dependency at all.

  "pqi-native" is thoroughly tested: ["pqi-conformance"](https://github.com/nikita-volkov/pqi-conformance) runs it side by side with "libpq" on the same inputs and checks that the results agree, and the test-suites of "hasql", ["hasql-pool"](https://github.com/nikita-volkov/hasql-pool) and ["hasql-transaction"](https://github.com/nikita-volkov/hasql-transaction) now run against both adapters, so the whole stack above the transport is exercised on it too. It's still labelled **alpha**, because it is not yet proven at production scale. That status lifts when it gets traction and successful usage reports.

  The two adapters are fully interchangeable. Swapping between them is a one-argument change, nothing else, so you can try "pqi-native" today with no lock-in and fall back without a rewrite.

  ## Discussions

  Join [GitHub Discussions](https://github.com/nikita-volkov/hasql/discussions) to ask questions, provide feedback, suggest and vote on features, and help shape the future of Hasql.

  ## Support policy

  This policy is intended to balance stability for users with the ability to evolve the library.

  Each major release of Hasql is supported for at least **one year** from the date of its first release. During this period, fixes are backported to the latest minor version of that major release.

  After the support period ends, the release may continue to work but is no longer guaranteed to receive fixes.

  You're welcome to post requests to change the policy or issues if you believe something is not being addressed.
