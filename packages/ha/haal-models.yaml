changelog: "# Changelog for `haal-models`\n\nAll notable changes to this project will
  be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand
  this project adheres to the\n[Haskell Package Versioning Policy](https://pvp.haskell.org/).\n\n##
  0.1.3.0 - 2026-10-10\n\n### Changed\n- Builds against `haal` 0.7: bumped the dependency
  to\n  `haal >= 0.7.0.0 && < 0.8`. The models are unchanged.\n\n## 0.1.2.0 - 2026-10-03\n\n###
  Changed\n- All models are regenerated with the table-based `haal-gen`, which builds\n
  \ them with `Haal.Automaton.MealyAutomaton.mkMealyAutomatonTable` instead of\n  one
  equation per transition. Types, state numbering, and transitions are\n  unchanged,
  and stepping a model is as fast as before. The package builds\n  in about half the
  time at `-O1` and a third at `-O0`. This requires the\n  `haal` release that adds
  `mkMealyAutomatonTable`. Bumped dependency \n  to `haal >= 0.6 && haal < 0.7`.\n\n##
  0.1.1.0 - 2026-04-22\n\n### Added\n- `tasty-bench`-based benchmark suite in `bench/`
  covering end-to-end\n  learning on real protocol models (MQTT, TLS, TCP) and scaling
  analysis\n  across model sizes. Run with `stack bench haal-models`.\n\n### Changed\n-
  Bumped `haal` dependency bound to `>= 0.5.0.0 && < 0.6`.\n\n## 0.1.0.0 - 2026-03-21\n\n-
  Initial release. Pre-built Mealy automaton models for DTLS, MQTT, TCP,\n  and TLS
  protocols generated from DOT files via `haal-gen`.\n"
changelog-type: markdown
description: A collection of real-world Mealy automaton models (DTLS, MQTT, TCP, TLS)
  bundled for use with the haal library.
