changelog: |
  # Changelog for synapse-cc

  ## 0.4.0

  ### Breaking

  - Built on `plexus-synapse >= 4.0 && < 5` and `plexus-protocol >= 0.6 && < 0.7`
    (was `plexus-synapse >= 3.14.3 && < 3.18`). The IR synapse-cc builds and
    hands to the generator is synapse 4.0's IR 3.0 (a method's `returns`,
    `error`, `progress` and `cardinality` read from the plexus 0.7 schema),
    so the generator must read IR 3.0. Backends must serve plexus 0.7 or the
    published 0.7.0 line.
  - `watch`: a failed hash call reports the server's typed error, rendered as
    plexus-protocol 0.6's `renderRemoteError` line.

  ### Changed

  - `synapse-cc-test`, which needs a live substrate on `127.0.0.1:4444`, is
    now opt-in: `cabal test -f live-tests`. The hermetic suites
    (`safe6-authcheck`, `naming`) run by default.
  - `cabal.project` lists only `.`; the plexus packages come from Hackage.

  ## Since 0.3.3 (unpublished 0.3.4 - 0.3.6)

  - The generator is `service-codegen`, found by that name first;
    `--service-codegen` replaces the generator's old flag (hidden, still
    read). `synapse.lock` writes `serviceCodegen` and reads either key.
  - Warns when the generator found is older than 0.5.0, which does not leave
    server-injected parameters out of generated methods.
  - `synapse-cc init` takes or infers the backend; a `cargo build` step for
    generated Rust clients; the registry endpoint is read from
    `PLEXUS_REGISTRY_URL`.
  - Auth: `--cookie` and `--header`, credentials scanned from the
    environment, token resolution through synapse's `_self` credential
    store, and a warning when cookie auth does not match the backend.
changelog-type: markdown
description: "# synapse-cc\n\n**Unified compiler toolchain for Plexus backends**\n\n`synapse-cc`
  (synapse compiler collection) orchestrates the complete pipeline from backend schema
  discovery to compiled, ready-to-use client libraries.\n\n## Features\n\n- \U0001F527
  **Unified Interface**: Single command to generate clients from any backend\n- \U0001F50D
  **Smart Tool Discovery**: Finds local development builds or installed versions\n-
  ⚡ **Fast**: Incremental caching skips regeneration when schemas haven't changed
  (IR cache at `~/.cache/plexus-codegen/synapse/ir/`, per-file code cache via service-codegen)\n-
  \U0001F3AF **Multi-Language**: TypeScript and Rust today (`rust` requires a service-codegen
  built with `--features rust`); `python` parses but has no generator yet\n- \U0001F6E0️
  **Complete Pipeline**: schema → IR → generated code → installed deps → compiled
  artifact → smoke tests\n- \U0001F510 **Credential lifecycle**: Per-backend defaults
  store shared with `synapse` — set, inspect, and rotate JWTs / cookies / headers
  via `synapse-cc _self <backend> …`. Values held as reference URIs (`literal:`, `env://`,
  `file://`, `keychain://`) so secrets live in the OS keychain or env vars, not plaintext.
  JWT decoding flags expired tokens at a glance.\n\n## Installation\n\n### From Source\n\n```bash\ncd
  synapse-cc\ncabal build\ncabal install\n```\n\n### Dependencies\n\n`synapse-cc`
  requires these tools to be available:\n- **synapse** - Schema discovery and IR generation\n-
  **service-codegen** ≥ 0.5.0 - Code generation from IR. Earlier releases write a\n
  \ parameter the server injects (`pdSource`: auth, header, derived, …) into the\n
  \ generated methods as an optional `unknown` argument; synapse-cc says so when\n
  \ it finds one (SYNAPSE-CC-2)\n\nThe tool will automatically find them if they're:\n-
  In your `$PATH`\n- In local development directories (`../synapse`, `../service-codegen`)\n-
  In `~/.plexus/bin/`\n\n**The generator is `service-codegen`** (0.5.1 on; NAMING-10
  — a Plexus backend\nis a *service*). synapse-cc 0.3.6 looks for it under that name
  first — on\n`$PATH`, then `../service-codegen/target/…`, `~/.plexus/bin`, `~/.cargo/bin`
  —\nand only then under its old name, saying the old name is deprecated. Its path\nis
  `--service-codegen PATH` (the old flag still works for one release, hidden,\nwith
  a note). `synapse.lock` is written with `serviceCodegen`, the generator's\nJSON
  is read as `serviceCodegenVersion`, a code cache's toolchain as\n`tvServiceCodegen`;
  each old key is still read. NAMING-18 removes the old\nnames; `scripts/naming-gate.sh`
  (the `naming` test suite) fails on a new one.\nsynapse-cc 0.3.6 builds against `plexus-synapse`
  3.14.3 up to 3.17.\n\n## Usage\n\nThe CLI is subcommand-shaped:\n\n```bash\nsynapse-cc
  init [BACKEND]                  # scaffold synapse.config.json\nsynapse-cc build
  \                          # build every target in synapse.config.json\nsynapse-cc
  build TARGET BACKEND [OPTIONS]  # one-off build, no config file\nsynapse-cc watch
  BACKEND [PLUGIN...]       # rebuild on schema changes\nsynapse-cc wait [BACKEND]
  \                 # block until backend(s) reachable\nsynapse-cc _self BACKEND VERB
  ...          # credentials store (shared with synapse)\n```\n\n### Quickstart (config-driven)\n\nA
  service scaffolded by `axon new` ships a `synapse.config.json` pre-pointed\nat itself
  — `synapse-cc build` works unedited from the service directory\n(server must be
  running). Real run:\n\n```\n$ synapse-cc build\n==> Discovering tools...\n[+] Found
  all required tools\n[i] Building \"client\" → src/lib/plexus\n\n==> Reading schema...\n[+]
  Schema ready (2 plugins)\n\n==> Generating code...\n[+] Code generated (11 files)\n\n==>
  Installing dependencies...\n[+] Dependencies installed\n\n==> Building...\n[+] Build
  passed\n\n==> Running tests...\n[+] Tests passed\n[+] client → src/lib/plexus/\n```\n\nWithout
  a config file, `synapse-cc init <backend>` scaffolds one; with the\nbackend argument
  omitted it is **inferred** — from a co-located Plexus\nservice crate, then from
  the local registry — and the inference is\nannounced. There is no silent default
  backend:\n\n```\n$ synapse-cc init\n[!] missing BACKEND argument — no co-located
  Plexus service crate found and\n    no backend discoverable on the registry at 127.0.0.1:4444.\n
  \   Run: synapse-cc init <backend>\n```\n\n### Quickstart (one-off, no config)\n\n```bash\nsynapse-cc
  build typescript substrate          # TS client → ./generated/\nsynapse-cc build
  rust substrate -o ./client    # Rust client, ends in cargo build\n```\n\nThe backend
  is resolved **by name via the registry** (endpoint from\n`PLEXUS_REGISTRY_URL`,
  default `ws://127.0.0.1:4444`; `-H`/`-P` set the\nfallback). A real `rust` run:\n\n```\n$
  synapse-cc build rust zechodev -o ./rust-client\n==> Discovering tools...\n[+] Found
  all required tools\n\n==> Resolving zechodev via registry at ws://127.0.0.1:4444...\n\n==>
  Reading schema...\n[+] Schema ready (2 plugins)\n\n==> Generating code...\n[+] Code
  generated (5 files)\n\n==> Building...\n[+] Build passed\n\n==> Running tests...\n[+]
  Tests passed\n\n[+] Client → ./rust-client/\n```\n\n`-t rust` ends in a real `cargo
  build` of the generated crate (Z2H-7) — the\nartifact compiles or the command fails.\n\n###
  Options (build / watch)\n\n```\n  -o, --output DIR        Output directory (default:
  ./generated)\n  --transport ws|browser  ws (Node.js, default) or browser (native
  WebSocket,\n                          for Tauri/WebView)\n  --no-install            Skip
  dependency installation\n  --no-build              Skip compilation step\n  --no-tests
  \             Skip running smoke tests\n  --cache-dir DIR         Cache directory
  (default: ~/.cache/plexus-codegen)\n  --force                 Force regeneration
  (ignore cache)\n  --debug                 Enable debug logging\n  --synapse PATH
  \         synapse binary path (overrides discovery)\n  --service-codegen PATH      service-codegen
  binary path (overrides discovery)\n  -t, --token JWT         JWT auth token (see
  Credentials below)\n  --token-file PATH       Read JWT from file\n  -H, --host HOST
  \        Registry/discovery host (default: 127.0.0.1)\n  -P, --port PORT         Registry/discovery
  port (default: 4444)\n```\n\n### Rust target prerequisite\n\n`build rust` requires
  a service-codegen binary compiled with the `rust` feature\n(`cargo build --release
  --features all` in the service-codegen repo). A\ntypescript-only binary fails with:\n\n```\n[!]
  Error: service-codegen failed (exit code 1)\nError: Rust codegen not enabled. Rebuild
  with --features rust\n```\n\nPoint `--service-codegen` at a rust-enabled build if
  the discovered one is not.\n\n### Credentials & Headers\n\nsynapse-cc shares a **single
  defaults store** with synapse at `~/.plexus/<backend>/defaults.json`. Any JWT, cookie,
  or header you set via either CLI is immediately visible to the other. The file holds
  credential-reference URIs (`literal:`, `env://`, `file://`, `keychain://`), resolved
  at request time.\n\n```bash\n# Inspect what's stored + decode any JWTs + flag expired
  tokens\nsynapse-cc _self <backend> show\n\n# Store a JWT (auto-wrapped as literal:)\nsynapse-cc
  _self <backend> set cookie access_token \"eyJ...\"\n\n# Store a reference to an
  env var (preferred in CI)\nsynapse-cc _self <backend> set cookie access_token \"env://MY_JWT\"\n\n#
  Import a JWT file\nsynapse-cc _self <backend> import-token ~/Downloads/jwt.txt\n\n#
  Clear all defaults for a backend\nsynapse-cc _self <backend> clear --yes\n```\n\nThe
  `_self` subcommand tree is identical to `synapse _self <backend> …` — they share
  the same library implementation. See synapse's README for the full verb list, URI
  scheme reference, and legacy `~/.plexus/tokens/<backend>` migration behavior.\n\nPer-invocation
  overrides: `--token <jwt>`, `SYNAPSE_TOKEN` env, `--token-file <path>`, `--cookie
  KEY=VALUE`, `--header KEY=VALUE` — all flow through the same priority chain as synapse,
  with CLI values winning over stored defaults per key.\n\n## Architecture\n\n```\nsynapse-cc
  (Haskell)\n    ↓\n    ├─→ synapse (Haskell) → IR (JSON)\n    ↓\n    ├─→ service-codegen
  (Rust) → Generated Code\n    ↓\n    └─→ Language Tools (npm, tsc, etc.) → Compiled
  Artifact\n```\n\n## Development\n\n### Project Structure\n\n```\nsynapse-cc/\n├──
  synapse-cc.cabal         # Cabal project file\n├── app/\n│   └── Main.hs              #
  Entry point, subcommand dispatch\n└── src/\n    └── SynapseCC/\n        ├── Types.hs
  \          # Core types, Options, synapse.config.json types\n        ├── CLI.hs
  \            # Subcommand + option parsing\n        ├── Config.hs          # synapse.config.json
  load/init\n        ├── Detect.hs          # Project detection for `init` inference\n
  \       ├── Discover.hs        # Tool discovery (synapse, service-codegen)\n        ├──
  RegistryResolve.hs # Backend-name resolution via the registry\n        ├── Pipeline.hs
  \       # Pipeline orchestration\n        ├── Process.hs         # Subprocess helpers\n
  \       ├── Cache.hs           # Incremental IR caching\n        ├── Merge.hs           #
  Three-way merge bookkeeping\n        ├── Dependency.hs      # Plugin dependency
  resolution\n        ├── Language.hs        # Per-language install/build/test steps\n
  \       ├── Auth.hs            # Token priority chain (wraps Synapse.Self)\n        ├──
  Watch.hs           # watch subcommand\n        ├── Wait.hs            # wait subcommand\n
  \       └── Logging.hs         # Pretty output\n```\n\n### Building\n\n```bash\ncabal
  build\n```\n\n### Running from source\n\n```bash\ncabal run synapse-cc -- build
  typescript substrate --debug\n```\n\n### Testing\n\n```bash\n# Scaffold and start
  a throwaway backend (any free port)\naxon new mysvc --port 4452 && cd mysvc && cargo
  run &\n\n# Generate, compile, and smoke-test a client against it — the scaffold's\n#
  synapse.config.json is already pointed at ws://127.0.0.1:4452\nsynapse-cc build\n```\n\n##
  Status\n\nShipped: tool discovery, pipeline orchestration, config-driven multi-target\nbuilds
  (`synapse.config.json`), incremental IR + code caching with three-way\nmerge, dependency
  installation + compile + smoke-test steps (bun/npm for\nTypeScript, cargo for Rust),
  watch mode, `wait`, registry-based backend\nresolution (`PLEXUS_REGISTRY_URL`),
  shared credentials store (`_self`).\n\nNot shipped: a `python` generator (the target
  parses; service-codegen has no\nemitter), remote/distributed caching.\n\n## Contributing\n\nSee
  [PLAN.md](./PLAN.md) for detailed implementation plan and design decisions.\n\n##
  License\n\nMIT\n"
