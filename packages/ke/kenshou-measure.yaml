changelog: |
  # Changelog

  ## 0.1.0.0 - 2026-10-28

  ### New Features

  - First public release of the measurement toolkit: load models, latency recording, samplers, statistics, health gates, and paired comparison.
  - `poolMethodologyFor` reads a layer's recommended pool size from its bundle instead of a built-in constant.

  ### Other Changes

  - Extracted from `mori://shinzui/keiro-runtime-kenshou` at commit `a1648293443ad88ff1695ed800ff44c99993574e`, with its package and module names unchanged.
