changelog: |
  # Changelog

  ## 0.1.0.0 - 2026-10-28

  ### New Features

  - First public release of the diagnostics toolkit: heap-leak verdicts on live bytes after major collections, stall capture, lock graphs, and profiling guards.
  - Stall captures name advisory locks with the labels bundles contribute, and the watchdog takes its configuration from the registry.

  ### Other Changes

  - Extracted from `mori://shinzui/keiro-runtime-kenshou` at commit `a1648293443ad88ff1695ed800ff44c99993574e`, with its package and module names unchanged.
