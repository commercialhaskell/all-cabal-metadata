changelog: |
  # Changelog

  All notable changes to `keiro-dsl` are recorded here. The format follows
  [Keep a Changelog](https://keepachangelog.com/), and the package follows the
  [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## Unreleased

  ## 0.13.0.0 — 2026-08-17

  ### Breaking Changes

  - Requires `kiroku-store >=0.8 && <0.9`, replacing the previous `>=0.7 && <0.8`
    bound, so that generated service runtimes resolve against the same Kiroku
    release as the rest of the package set.
  - Requires the lockstep `keiro-core ^>=0.13.0.0`.

  ## 0.12.0.0 — 2026-08-14

  ### Breaking Changes

  - Generated `WorkflowRuntime` modules no longer expose the pure
    `awaitAwakeableId` coordinate helper. They instead expose an abstract
    `AwaitBinding`, one value per declared await, and `allocateDeclaredAwait`, which
    allocates through the runtime and returns the opaque `AwakeableId` together with
    its await action. Compiled generated-runtime consumers now need the direct
    dependencies required by that effectful allocation surface.
  - Removes the zero-caller Spec-only `pureRefusals` and `constraintPlan` shims
    from `Keiro.Dsl.ScaffoldRun`. Use `pureRefusalsForService` and
    `constraintPlanForService`; callers that genuinely have only a `Spec` can
    cross the compatibility boundary explicitly with `legacyCheckedService`.
  - The public DSL AST replaces read-model `rmConsistency`/`rmScope`/`rmFeed`/
    `rmSubscription` with `rmFreshness` and `rmSupply`, replaces projection-owner
    `poFeed` with `poDelivery`, and adds `ProjectionDelivery`,
    `QueryFreshnessNode`, and `ReadModelSupply`. `DiagnosticCode` gains the
    catalog cursor/source-ordering and delivery/freshness evolution cases.
    Exhaustive consumers and direct record construction must migrate; released
    source-language behavior is unchanged.
  - Removes the semantic-only planning and check entry points from
    `Keiro.Dsl.ScaffoldRun`: `planServiceScaffold`, `planServiceScaffoldWithGoldens`,
    `planServiceScaffoldWithRuntimePackage`,
    `planServiceScaffoldWithRuntimePackageAndGoldens`, `planScaffold`,
    `planScaffoldWithGoldens`, and `checkServiceDiagnostics`. Once behavior provenance
    became part of planning, these wrappers could only derive a `CompatibilityLineOnly`
    source index, whose behavior-source join refuses every aggregate transition and
    rejection anchor — so they refused every transition-bearing service that they
    planned cleanly under 0.11.0.0. Migrate by parsing with `parseSourceDocument` and
    passing the document's `documentSourceIndex` to `planIndexedServiceScaffold`,
    `planIndexedServiceScaffoldWithGoldens`,
    `planIndexedServiceScaffoldWithRuntimePackage`,
    `planIndexedServiceScaffoldWithRuntimePackageAndGoldens`, or
    `checkIndexedServiceDiagnostics`. A `Spec` constructed programmatically can still
    be planned by building a complete exact index with
    `Keiro.Dsl.SourceIndex.exactSemanticSourceIndex` over `semanticSourceSubjects`,
    taking responsibility for the spans it asserts. The Spec-only module-set builders
    (`scaffoldModules`, `scaffoldModulesWithGoldens`) and every execution entry point
    are unchanged.
  - The public DSL AST adds `DomainOutcomeTypes`, `TransitionOutcome`, outcome
    fields to `Aggregate`/`Transition`, and corresponding located duplicate
    evidence. `LanguageFeature`, `RuntimeCapability`, and `DiagnosticCode` gain
    typed-outcome cases, and `BehaviorRequirement` gains
    `requirementDomainOutcome`; exhaustive consumers and direct record
    construction must be updated. The syntax and generated API exist only in
    candidate language 5.
  - The public DSL AST changes `WqField.wqfType` from `Name` to
    `QueuePayloadType`, adds `wqfLoc`, and adds optional `queryTypes` to
    `ReadModelNode`. `UseSite`, `MappedRootKind`, `MappedConsumer`,
    `TypeGraphError`, `DiagnosticCode`, and `TypeGraph` gain mapped
    queue/read-model/projection cases or fields; exhaustive consumers and direct
    record construction must be updated. Existing language-1–4 source and
    generated meaning is unchanged.
  - `WorkspaceMember` gains `wmSourceIndex`, `WorkspaceSpec` gains `wsSourceIndex`, and
    `composeWorkspace` now accepts `ParsedSourceDocument` inputs. `DiagnosticCode` gains
    `WorkspaceSourceIndexInvalid`; exhaustive matches and direct record construction must be
    extended. Bare-`Spec` adapters remain available but expose only `CompatibilityLineOnly`
    positions rather than fabricated exact columns.
  - `BehaviorRequirement` gains stable `requirementOrigin` and optional
    `requirementExactLocation` fields; `Refusal` and `DiagnosticCode` gain behavior-source-anchor
    cases. Exhaustive library consumers must extend their matches. Scaffold and check planning now
    require a complete exact source index and refuse missing, inexact, duplicate, or colliding
    behavior anchors before writes.
  - `ScaffoldRecord` and `WorkspaceRecord` gain optional semantic-impact snapshots;
    `ScaffoldReport` and `WorkspaceScaffoldReport` gain typed semantic and generated-artifact impact
    fields. Exhaustive direct record construction must initialize the new fields. Standalone
    scaffolding now reports an existing byte-identical generated module as `Unchanged`, matching the
    workspace path instead of rewriting it.
  - Regenerate mapped-service output once: declaration-wide assertions moved from every aggregate
    `Harness` into the context `StructuralConformance` module, which must be added to the consuming
    Cabal module inventory; the context `BehaviorSourceMap` and additive ledger `semantic-impact`
    row must be added at the same baseline. Compile the runtime package and run the generated service
    conformance target after reconciling the Cabal fragment. Unrelated aggregate files are now
    byte-stable when a declaration outside their semantic closure changes, and source-only movement
    rewrites the source map rather than behavior contracts or create-once witnesses.
  - Requires `kiroku-store >=0.7 && <0.8`, keeping generated conformance and
    runtime fixtures on the same Kiroku effect surface as Keiro 0.12.

  ### New Features

  - Publishes Language 5 as the sole stable and default authoring contract. Language 4 remains an
    immutable published compatibility contract. The conformance manifest now records explicit
    per-suite language ownership, retains Language 4 generated bytes, and includes the live
    workflow allocate/signal/completion proof in the stable Language 5 lane.
  - Candidate Language 5 accepts bounded `external-read` declarations and lowers them to
    versioned `AllRowsExternalRead` catalog contracts whose result shape is derived from
    the checked query binding. Validation covers SQL identities, query/target cardinality,
    revision compatibility, and surface generations; diff, ledger, pretty-print, and
    workspace paths distinguish retirement, version addition, compatibility changes, and
    result-shape changes. Create-once catalog holes include a typed keyed-contract helper
    for application-owned private SQL implementations.
  - Candidate Language 5 accepts projection-revision bridges and generates catalog
    provisioner, schema-validator, physical-target live/replay, and verification holes.
    Revision/provisioner identities and ordered promotion names participate in canonical
    catalog and group-slice identity; published Languages 1–4 are unchanged.

  - Exposes `checkedProjectionSupplies`, the lazily shared projection-supply
    analysis attached to each `CheckedService`.
  - Candidate Language 5 separates projection delivery from query freshness.
    Projection owners declare `delivery = inline | subscription`; catalog-bound
    read models declare `freshness = immediate | wait-for-head ...` and derive any
    durable cursor from their validated owner. Capability diagnostics reject
    missing, ambiguous, or unreachable waits before generation. Generated code
    uses the truthful read-model builders, while diffs, ledgers, workspaces,
    harnesses, fingerprints, and compiled conformance expose delivery, freshness,
    and cursor facts independently. Languages 1–4 retain byte-compatible
    `feed`/`consistency`/`scope` behavior.
  - Exposes `Keiro.Dsl.ProjectionSupply` as the shared order-independent authority for
    catalog query-to-owner resolution. Candidate Language 5 accepts several query models
    supplied by one owner without legacy aggregate projection clauses, rejects split or
    double ownership with located diagnostics, generates source-selected inline handlers
    once, and records separate backing-target and supplier facts in scaffold ledgers,
    diffs, harnesses, workspaces, and compiled conformance.

  - Candidate language 5 adds exhaustive typed domain outcomes. Aggregates may
    declare rejection/no-op result types and label each live transition as
    accepted, rejected with a checked reason, or no-op with a checked reason.
    Scaffolding exports the aggregate `DomainCommandHandler`, dispatches directly
    on Keiki's exact selected edge, and evaluates only the selected reason term.
    Exact-reason conformance, mutation coverage, semantic diff/behavior identity,
    and 8/32/128/512 linear generation scaling are included; fold fingerprints,
    event history, snapshots, replay, and published languages 1–4 are unchanged.
  - Candidate language 5 registers and generates mapped workqueue fields
    (`field -> "wire" : TypeExpr`) and atomic read-model query input/result
    clauses. Both resolve recursively into located `TypeGraph` roots, while
    languages 1–4 reject the owned colon or `query` token. Workqueues receive
    exact structural/opaque payload codecs inside their schema-version-1 envelope;
    read models receive deterministic Haskell query aliases without claiming SQL
    conversion or migration ownership.
  - Adds one integrated mapped-surface qualification gate across events,
    registers, workqueues, query contracts, and aggregate-derived projections.
    Exact-tree tests prove locality remains constant under unrelated workspace
    growth; restoring mutations cover bindings, queue arms/null policy, query
    signatures, projection fingerprints, semantic consumers/reports, service-law
    uniqueness, and semantic-impact ledger tags.
  - Exposes `Keiro.Dsl.ConsumerTypePlan`, the codec-agnostic authority for
    rendering a resolved mapped expression's consumer Haskell occurrence,
    deterministic imports, and transitive mapped dependencies. Projection
    semantic impact now derives event-only consumers for aggregate sources and
    records category/all sources as unsupported heterogeneous boundaries.
  - Exposes `Keiro.Dsl.SemanticImpact`, the checked and deterministic authority for mapping current
    command-field, private-event-field, and register roots to aggregate declaration closures and the
    complete service declaration inventory. Future mapped root constructors must extend its
    exhaustive `UseSite` fold before the package compiles.
  - Exposes `Keiro.Dsl.StructuralConformance` and emits one context module for declaration-wide
    mapped binding, fixture, opaque-boundary, coverage, and projection-witness checks. The generated
    service facade runs that list once under `structural/`; aggregate harnesses retain codec,
    wire-policy, snapshot/register, and replay evidence only for their checked mapped closure.
  - Exposes `Keiro.Dsl.SourceIndex`. `parseSourceDocument` and `lowerSurfaceDocument` return exact,
    checked aggregate state and transition spans beside the unchanged semantic `ParsedSource`;
    compatibility parser entry points retain syntax-valid duplicate-name graphs while reusing the
    same surface/lowering seam. Workspace members retain normalized member-local indices and
    `WorkspaceSpec` retains their checked, unrelocated union.
  - Exposes `Keiro.Dsl.BehaviorSourceMap` and emits one deterministic context source map from frozen
    behavior keys to exact current file, line, and column. Generated behavior contracts resolve
    failure positions through that map; contracts and newly created witness comments no longer
    embed volatile source lines. `behavior-obligations` appends exact `file`, `column`, and `quality`
    location fields without changing schema `keiro-dsl/behavior-obligations/1`.
  - `SemanticImpactSnapshot`, `MappedImpactDelta`, and `SemanticImpactReport` provide one canonical
    checked-consumer projection for diff and scaffold explanations. Current single/workspace ledgers
    persist an additive `semantic-impact` row, and current diff CLI JSON appends `semanticImpact` to
    `keiro-dsl/diff-report/1`; legacy ledgers retain an explicitly unavailable old baseline.

  ### Bug Fixes

  - Generated await helper names now use the same suffix-aware derivation in
    validation and emission, so colliding declarations such as `foo-bar` and
    `foo_bar` are rejected before generation. Compiled workflow-runtime conformance
    now proves the opaque generated allocation/signalling/resume path against a live
    migrated PostgreSQL database.
  - `keiro-dsl diff` now classifies read-model query-policy changes across the language
    4-to-5 migration. Weakening legacy `consistency = Strong` to
    `freshness = immediate`, or narrowing the waited head scope, is a breaking
    `QueryFreshnessChanged` finding. Scope-preserving rewrites are equivalent,
    strengthenings are additive `CompatibilityStrengthened` findings, and the spurious
    additive `Strong scope widened` verdict from mixed-policy comparisons is gone.
    Same-language diff classification is unchanged.
  - Published languages 1–4 once again accept `outcome` as an ordinary identifier, restoring the
    0.11.0.0 grammar that candidate-language-5 outcome syntax accidentally narrowed. Outcome clause
    words are contextual rather than globally reserved, so language-5 sources may also use
    `outcome` as an identifier while retaining typed accepted, rejected, and no-op clauses.

  ### Other Changes

  - Requires `keiro-core ^>=0.12.0.0`, matching the stable Language 5 runtime
    contract and the lockstep package release.
  - The source distribution now includes the BSD-3-Clause license file.
  - Regenerates the 39-entry checked-in conformance corpus so every generated
    provenance banner records `keiro-dsl 0.12.0.0`; generated behavior and all
    non-banner bytes remain unchanged.
  - Check, scaffold, harness, and diff paths now share one projection-supply
    analysis per run and per diff side, while replay-impact planning reads each
    checked service's cached type graph. Diagnostics, generated bytes, scaffold
    records, and diff reports are unchanged.
  - Source-span capture now uses Megaparsec's offset-derived consumed chunk instead of repeatedly
    measuring the complete remaining `Text` suffix. Exact half-open spans, parser compatibility, and
    generated service behavior are unchanged; the effect is limited to DSL parse-time tooling.
  ## [0.11.0.0] - 2026-08-05

  ### Breaking Changes

  - `DiagnosticCode` gains `DecodeBodyPostureUnsupported`,
    `DispatchOnAppendedUnsupported`, `TimerNotMineUnsupported`, and
    `IntakeBindHeaderUnknown`; exhaustive matches must be extended. Each closes a
    spelling the grammar accepted that no runtime implements, and each warns on
    released languages below 4 and errors from language 4 on. `intake … body
    lenient` is refused because generated codecs decode a body strictly;
    `on-appended` other than `AckOk` is refused on both process and router
    dispatch rows because a successful append is always acked; `not-mine Fired` is
    refused because the timer worker marks a timer `Fired` only when the fire
    action returns an appended event id; and an intake `bind … from header "x"`
    naming a header outside keiro's canonical envelope set is refused because the
    Kafka inbox reads a fixed header set and cannot be remapped. The spelling that
    matches the runtime stays accepted and silent in every case.
  - A process `dispatch-id` line is now checked as strictly as a router's. It must
    read exactly `strategy=uuidv5 from=(name, correlationId, sourceEventId,
    emitIndex)` — the tuple `Keiro.ProcessManager` actually derives from — where
    previously any strategy identifier and any tuple parsed and were discarded.
    Routers keep their own `(name, key, sourceEventId, targetStreamName,
    occurrence)`. A process spec that wrote anything else is now a parse error.
  - `check`'s warning policy now covers structural coverage. When an invocation
    supplies `--coverage-report`, its findings are ordinary diagnostics of this
    run: `--deny-warnings` and `--deny CoverageOpaqueSurface` escalate them, they
    appear in the `keiro-dsl/check-report/1` diagnostics array as line-0 entries,
    and the report's `ok` therefore accounts for them. Previously
    `check spec --coverage-report r --deny-warnings` printed coverage warnings and
    exited 0, so a CI job that believed it had a no-warning gate did not have one.
    Coverage output is now emitted with the other diagnostics, before `--emit` and
    `--explain-bindings` output rather than after.
  - `check --deny CODE` now refuses a code `check` cannot emit instead of
    accepting a denial that can never match. Cross-revision codes (for example
    `EvtFieldWireKeyChanged`, `WorkflowShapeChanged`) are a `diff` concern and are
    rejected outright; structural-coverage codes are rejected unless the same
    invocation passes `--coverage-report`; `--deny CoverageOpaqueGateExceeded` is
    rejected in every invocation, because that code is the error `--fail-on-opaque`
    itself raises and never a deniable warning — pass the flag instead. Any CI
    file that named such a code was not gating on it and now fails loudly.
    `Keiro.Dsl.Validate` exports the underlying `DiagnosticOrigin` and
    `diagnosticOrigin` registry.
  - `keiro-dsl new intake` no longer spells the unenforced `required cross-check
    body` flags on its bind row, so the intake skeleton passes the documented
    `check --min-language 4 --deny-warnings` CI gate as generated (previously it
    warned `IntakeBindFlagUnenforced` out of the box). The router and process
    skeletons keep their idiomatic benign-inversion spellings and therefore gate
    CI with a selective `--deny` list rather than `--deny-warnings`.
  - The `keiro-dsl/coverage-report/1` JSON now spells warning severity `"warning"`
    rather than `"advisory"`, matching `keiro-dsl/check-report/1`. There is one
    severity vocabulary across keiro-dsl's JSON. Consumers matching the literal
    string `"advisory"` (available since 0.4.0.0) must be updated.
  - `DiagnosticCode` loses `EmitDeriveHoleUnrealized` and
    `WqFieldOptionalUnsupported`, and gains `TimerDecodeStatusUnknown`,
    `TimerDeadLetterTextInvalid`, and `PgmqFanoutFunctionInvalid`; exhaustive
    matches must be extended. The code fired unconditionally on every `emit` node because
    `derive … hole` is mandatory grammar, so it carried no information and made
    `check --deny-warnings` permanently red for any emit-bearing service. The
    scaffold report's no-modules line already names each emit node that
    contributes nothing. `WqFieldOptionalUnsupported` is removed with the model it
    described: every workqueue payload field is required, because generated
    decoders read all of them with `o .:`. `WqField` therefore loses `wqfRequired`,
    the `required` marker is accepted but selects nothing, and adding a payload
    field is now classified breaking however it is spelled — a job already queued
    under the old shape does not contain it, which the previous "new optional
    field is additive" classification denied.
  - The three surfaces ExecPlan 197 recorded as descriptive-only are now checked
    against the references they name. A timer's `decode unknown-status` must be a
    status the timer table stores (`Scheduled`, `Firing`, `Fired`, `Cancelled`,
    `Dead`); its `dead-letter` reason must not be blank, since it is the text an
    operator-written worker passes to `Keiro.Timer.deadLetterTimer`; a pgmq
    `dedup key` must be a generated selector of its source read model, reported
    with the existing `DispatchReadModelFieldUnknown`; and a pgmq `fanout body`
    must be spellable as a Haskell value identifier. Emit `source`, `key`, and map
    discriminant names remain the one documented descriptive-only surface, because
    no typed source namespace exists to resolve them against.
  - `WorkspaceScaffoldReport` gains `wsrInertNodes`, and a workspace scaffold now
    renders the same `no-modules:` line the single-spec report has always
    rendered. `Keiro.Dsl.ScaffoldRun` exports the shared `inertNodesOf` and
    `renderInertNodeSection`.
  - `Keiro.Timer.Schema.TimerStatus` (in **keiro**) additionally derives `Enum` and
    `Bounded` so consumers can enumerate the lifecycle rather than restate it.
  - `Keiro.Dsl.ScaffoldRun`'s `Refusal` gains `SidecarMovesAlreadyApplied`;
    exhaustive matches must be extended. Sidecar renames are applied before the
    later scaffold gates run, so a refusal after that point used to claim "nothing
    was written" while the renames were on disk. The note is appended to such a
    refusal set and states that the renames are idempotent and need no undo.
  - A legacy `keiro-dsl-conformance-record.txt` anywhere in the output tree is now
    migrated, not only when the run also plans a conformance package. A spec that
    stopped generating one previously left the record orphaned and unreadable,
    because the current reader has no legacy parser. The scan is depth-bounded and
    skips the `.keiro-dsl-name-migrations` backup root.
  - `FieldWireKeyInvalid` additionally refuses a wire key with leading or trailing
    whitespace or a control character, naming the offending codepoint. Aliases stay
    exempt from a declared `wire … fields=camelCase` convention — preserving a
    brownfield key is what they are for — so this is structural usability only. A
    spec that shipped `as "family "` now fails `check`.
  - `Keiro.Dsl.CheckReport`'s `reportLanguage` is now
    `Maybe CheckReportLanguage`, and the new `workspaceRefusalReport` builds the
    report for a workspace refused during composition. Such a report serializes
    `"language": null` because no service graph was composed.
  - Scaffold sidecars now use role-bearing names. On disk,
    `keiro-dsl-scaffold-record.<context>.txt` becomes
    `keiro-dsl-ledger.context.<context>.txt`, the workspace form becomes
    `keiro-dsl-ledger.workspace.<service>.txt`, `keiro-dsl-conformance-record.txt`
    becomes `keiro-dsl-conformance-ledger.txt`, and the generated
    `keiro-dsl-manifest.<context>.<ext>` / `keiro-dsl-manifest.workspace.*` files
    become `keiro-dsl-cabal-fragment.context.<context>.<ext>` and
    `keiro-dsl-cabal-fragment.workspace.<service>.<ext>`. The Cabal fragment — not
    the former manifest name — is the authoritative generated build inventory.
    An out tree holding legacy names now **refuses without writing**; review the
    listed moves and rerun `scaffold --apply-name-migrations` to rename them
    losslessly. Duplicate old files that cannot be renamed are preserved under
    `.keiro-dsl-name-migrations/sidecar-v1/`.
  - `Keiro.Dsl.ScaffoldRun`'s `Refusal` gains `SidecarMigrationRequired` and
    `SidecarMigrationRefusal`; `ScaffoldReport` gains `reportSidecarMoves` and
    `WorkspaceScaffoldReport` gains `wsrSidecarMoves`. Exhaustive matches and
    record constructions must be extended. Two new modules are exposed:
    `Keiro.Dsl.SidecarNames` (the role-bearing name vocabulary and legacy-name
    recognition) and `Keiro.Dsl.SidecarMigration` (the planned move set and its
    apply path).
  - The renamed conformance ledger also changes format: the whitespace-row
    `keiro-dsl-conformance-record.txt` becomes the versioned
    `keiro-dsl conformance ledger v1` with typed JSON file rows. The parser
    ignores unknown row kinds and unknown JSON keys so future rows decode, while
    retaining the service-key, malformed-record, unsafe-path, and case-folded
    duplicate-path refusals. Legacy conformance records are converted **only** by
    the explicit `--apply-name-migrations` path; no implicit upgrade exists.
  - `AggregateField` gains `aggregateFieldSelector :: Maybe Name` and
    `aggregateFieldWireKey :: Maybe Text`, and `ContractField` gains
    `cfSelector :: Maybe Name`, `cfWireKey :: Maybe Text`, and `cfLoc :: Loc`
    (both in `Keiro.Dsl.Grammar`). Code that constructs these records positionally
    or matches them exhaustively must be updated; `Nothing` selector and wire-key
    values reproduce the pre-alias behavior exactly.
  - `RouterReadModelUnverified` previously existed as a declared but never-emitted
    `DiagnosticCode` constructor. It now carries real semantics and is emitted
    when a router's resolved read model cannot be verified, so a consumer that
    matched the constructor as unreachable — or a `--deny` list that named it as a
    no-op — now sees live diagnostics.
  - Router duplicate-disposition notices moved from `ProcessBenignInversion` to
    the distinct `RouterBenignInversion`. An adopter CI list that passes
    `--deny ProcessBenignInversion` silently stops matching router rows; add
    `--deny RouterBenignInversion` to preserve the previous gate.
  - Requires `keiki >=0.9 && <0.10`, replacing `>=0.8 && <0.9`. Generated
    aggregate domains continue to use `deriveAggregateCtorsAll` and
    `deriveWireCtorsAll`, which now produce Keiki's trusted structural
    constructor evidence. Consumers must solve with Keiki 0.9 and recompile;
    generated validation results may change where 0.9 can distinguish structural
    heads or prove replay candidates disjoint.
  - Generated module segments, types, constructors, values, selectors, and create-once
    source paths now use one checked UpperCamelCase/lowerCamelCase policy. Compound
    logical names such as `service_oncall` therefore move from `Service_oncall` to
    `ServiceOncall`; consumers must apply the reported source migration and recompile.
  - `DiagnosticCode` gains `IdentUnsafeNormalization`,
    `GeneratedOccurrenceReserved`, `GeneratedOccurrenceCollision`, and
    `GeneratedHaskellNameChanged`. `Refusal` gains
    `GeneratedNameInvariantViolation`, `NameMigrationRequired`, and
    `NameMigrationRefusal`. Exhaustive matches must be extended.
  - `ScaffoldReport` and `WorkspaceScaffoldReport` gain generated-name source-move
    evidence. `ScaffoldRecord` and `WorkspaceRecord` gain a generated-Haskell naming
    edition and stable module-role rows; missing additive rows decode as the legacy
    naming edition.
  - `DiagnosticCode` gains `FieldWireKeyCollision`, `FieldWireKeyInvalid`, and
    `EvtFieldWireKeyChanged`. Exhaustive matches must be extended.
  - `DiagnosticCode` appends `LanguageVersionBelowMinimum` and now derives `Ord`,
    `Enum`, and `Bounded`. Exhaustive matches must be extended. `check`, `scaffold`,
    and the working-tree side of `diff` add a stderr language-contract notice for
    compatibility-only sources, changing exact-stderr consumers.
  - `DiagnosticCode` appends `AggregateEmpty`, `ContractEmpty`,
    `GeneratedPathCollision`, `GeneratedImportCycle`, `BehaviorDerivationInvalid`,
    `ConformanceFactKeyCollision`, and `GeneratedPlanningInvariantViolation`.
    Exhaustive matches must be extended; specs that scaffold already could not lower
    now fail earlier during `check`.
  - `DiagnosticCode` appends thirteen accepted-surface warning and language-4 error
    codes, including process/router resolution, bounded windows, queue payload types,
    derived IDs, projection/outbox fields, and the distinct
    `RouterBenignInversion`; exhaustive matches must be extended. The never-emitted
    `DuplicateUpcasterSource`, `IdentHaskellKeyword`, `IdentNotConstructorSafe`, and
    `MappedGuardUnsupported` constructors are removed.
  - `IdExpr` gains the parsed `ideField`, and `ScaffoldReport` gains
    `reportInertNodes`; callers constructing or exhaustively matching these exported
    records must be updated.

  ### New Features

  - Generated-name collision planning now registers the selector generation
    actually emits — the explicit `haskell` alias when declared, otherwise the raw
    DSL name — instead of a camelized rendering of it. `{foo_bar, fooBar}` in one
    record is no longer reported as a collision between two fields that in fact
    generate distinct selectors, and the diagnostic no longer claims `foo_bar`
    "normalizes to" `fooBar`, which generation never did. A name that cannot be a
    Haskell selector is still refused, by the generated-name audit that owns that
    rule and names the offending declaration.
  - `check --report-out` creates missing parent directories, and a workspace
    refused during composition now writes the report a single spec has always
    written for the equivalent failure. A parse failure and an unreadable or
    unparseable workspace manifest still write none: they precede any coded
    diagnostic.
  - `scaffold --apply-name-migrations` applies an explicitly reviewed legacy-to-current
    source move, backs up original generated and create-once files, rewrites exact
    Haskell module references outside comments/literals, journals content digests, and
    resumes exact interrupted states. Ordinary scaffolding reports the complete plan
    and writes nothing.
  - Generated-only source evolution is classified as consumer-build advisory with
    re-scaffold, recompile, and conformance remedies while wire, replay, SQL, runtime,
    and persisted identities remain compatible.
  - Language 4 direct aggregate and integration-contract fields accept independent
    `haskell <selector>` and `as "<wire-key>"` aliases. Generated records use the
    selector, codecs/goldens use the wire key, and `fields(Command)` preserves both.
  - `check --min-language N` enforces a registered released-language floor.
    `--deny-warnings` and repeatable/comma-separated `--deny CODE` make selected
    warnings CI-failing without changing their severity. `--report-out` writes the
    append-only `keiro-dsl/check-report/1` schema for sources and workspaces through
    the new `Keiro.Dsl.CheckReport` module.
  - Language 4 now resolves every internally decidable process, router, projection,
    publisher, queue, pgmq source-key, read-model identity, and timer-ID surface,
    and rejects duration values that cannot fit the runtime `Int` seconds
    representation. Released languages 1–3 keep their prior acceptance.

  ### Other Changes

  - The conformance-corpus driver cross-checks its plan against
    `keiro-dsl.cabal`: a suite compiling generated Haskell that no plan entry
    regenerates now fails `corpus-regen check` naming the suite, and a plan entry
    no test-suite compiles fails too. The plan is derived from tracked ledgers
    alone, so deleting one silently dropped a suite from regeneration *and* from
    both existing consistency checks, which are scoped to plan entries.
    `regenerate` also refuses a dirty corpus (with `--allow-dirty` for local
    iteration) and prints the exact `git checkout --` recovery line.
  - The scaffold report's two sidecar lines are relabelled `fragment:` and
    `ledger:` to match the files they name; they read `manifest:` and `record:`
    while pointing at `keiro-dsl-cabal-fragment.*` and `keiro-dsl-ledger.*`.
    Consumers scraping those stderr labels must be updated.
  - The `generated-output` Cabal stanza adds `-Werror` behind the new manual flag
    `werror-generated` (default off, because Hackage rejects an unconditional
    `-Werror`; this repository's `cabal.project` turns it on), so a warning
    regression in generated code fails the build instead of building green. `src`
    keeps `-Wall` non-fatal. Enabling it exposed five real import over-approximations in the
    generator, all now fixed: a publisher imported `ExponentialBackoffOptions`
    under a constant backoff; a nominal-projections module imported the four
    `Keiki.ProjectionDomain` text combinators used only by the unenforced-ID
    pattern; a transducer imported the type of every write source, when only guard
    operands are rendered with a `K.Index … Type` annotation; a transducer imported
    an enforced ID's `parse<Id>`, which only a literal names; and a contract codec
    imported `(.:)` when every field decodes through `explicitParseField`.
    Generated output is correspondingly smaller; no behavior changed.
    `keiro-dsl-conformance-skeletons` keeps `-Wunused-imports`/`-Wunused-matches`
    non-fatal, because its hole modules are deliberately unfilled templates.

  - Generated behavior contracts and harnesses now carry complete signatures,
    annotated behavior cells, named sample constants, runtime-backed read-model
    facts, evidence-rich failures, and usage-conditional imports. The
    `keiro/behavior-conformance/1` JSON failure object adds the append-only
    `subject` field. The conformance corpus was regenerated under `-Wall` and now
    has a clean-tree regeneration policy gate; consumers should re-scaffold and
    recompile. Behavior keys, wire data, shape hashes, fold identity, and replay
    semantics are unchanged.
  - Adds a record-derived conformance-corpus driver with focused public-CLI replay,
    create-once preservation, record/disk and Cabal/disk consistency checks, and a
    test-owned accept mode for the six renderer goldens.
  - Adds the exported stable `ModuleRole`/`moduleRole` projection for
    `ScaffoldModule` artifacts and a generated-source naming audit plus repository
    policy gate.
  - Language 4 selects syntax profile 3. The generated occurrence reserved set is
    narrowed to the 23 term identifiers GHC rejects under the advertised GHC2024
    contract, so contextual words including `family`, `via`, and `qualified` are
    accepted and compile-proven.
  - Generated aggregate conformance now derives transducer rendering, predicate
    verification, behavior `EdgeRef`s, and initial live probes from one source-wide
    transition layout. Replay-only initial edges receive detailed replay witnesses but
    never `step`-based acceptance helpers, and duplicate generated declarations are
    rejected before writes.
  - Source and workspace checking and both scaffold planners now share one pure gate
    order: fold surface, lowering, module construction, conformance-package planning,
    then module-plan refusals. Workspace planning therefore reports a lowering refusal
    before a simultaneous facade-key refusal. Valid generated output is unchanged.
  - Accepted but inert intake flags, emit derivations, optional queue markers, and
    inline subscriptions now warn; scaffold reports list emit, pgmq dispatch, and
    operation nodes that contribute no modules. Timer dead-letter text, pgmq fanout
    functions, and pgmq top-level dedupe keys are explicitly descriptive-only.
    Existing valid generated output remains byte-identical.

  ## 0.10.0.0 — 2026-08-03

  ### Breaking Changes

  - `Keiro.Dsl.AggregateType` no longer exports `aggregateHaskellType` or
    `aggregateImports`. A resolved aggregate type now yields the typed
    `AggregateHaskellSource` returned by `aggregateConsumerHaskellSource`, read
    through `aggregateSourceReferences` and `aggregateSourceStaticImports` and
    rendered with `renderAggregateHaskellSource`, so consumer-owned types flow
    into the import planner instead of being flattened into module-qualified
    text.
  - `Keiro.Dsl.ScaffoldRun`'s `Refusal` gained the `DuplicateConformanceFactKeys`
    and `ConformancePackageRefusal` constructors, and `ScaffoldReport` gained the
    `reportConformancePackage` field. Exhaustive matches and literal report
    construction must be updated.
  - `Keiro.Dsl.Workspace`'s `WorkspaceManifest` gained the `wmfRuntimePackage`
    and `wmfRuntimePackageLoc` fields.
  - The generated build manifest now emits the complete Cabal fragment: a
    `default-language: GHC2024` line, an `OverloadedStrings` `default-extensions`
    block, and — when a service conformance facade is generated — an
    `exposed-modules` block that removes the facade from `other-modules`.
    Consumers must repaste the fragment rather than merging only the module and
    dependency blocks.

  ### New Features

  - A configured Keiro service now generates at most one local conformance
    package. `scaffold` emits a service-level conformance facade
    (`<Generated prefix>.Conformance`) in the consumer's runtime package and a
    separate runnable conformance package whose runner imports only that facade,
    so per-node harness modules stay out of the consumer's public API. See
    ADR 20.
  - The runtime Cabal package is now explicit build metadata. A workspace
    manifest may carry an optional `runtime-package <cabal-name>` clause, and
    `keiro-dsl scaffold` accepts `--runtime-package PACKAGE`, which takes
    precedence over the manifest value. The name is validated against Cabal's
    package-name grammar and is never inferred from the service name, directory,
    or nearby Cabal files. New module `Keiro.Dsl.RuntimePackage` exports
    `RuntimePackageName`, `mkRuntimePackageName`, and `isCabalPackageName`.
  - New modules `Keiro.Dsl.ServiceHarness` and `Keiro.Dsl.ConformancePackage`
    expose the facade and package planning surfaces.
  - Generated Haskell now has an explicit, checked language contract. The
    manifest owns the `GHC2024` + `OverloadedStrings` baseline, and overwriteable
    generated modules declare specialized pragmas locally only when their emitted
    syntax needs them, drawn from a closed set (`BlockArguments`,
    `DeriveAnyClass`, `DuplicateRecordFields`, `OverloadedLabels`,
    `OverloadedRecordDot`, `QualifiedDo`, `TemplateHaskell`, `TypeFamilies`).
    Tracked generated output is independently checked against that set. See
    ADR 19.

  ### Other Changes

  - Generated event codecs now derive one named event-type allow-list per
    aggregate and render unknown-event diagnostics from that same value, so the
    diagnostic text can no longer drift from the accepted set.
  - Generated structural record fields and union payloads now use minimal
    precedence-correct parentheses without changing schema or wire semantics.
  - Generated Haskell now plans consumer-owned imports once per module. Unique
    type names use explicit unqualified imports; collisions, external values,
    constructors, generated shapes, and binding APIs use deterministic short
    qualified aliases. Imports are merged, deduplicated, and sorted without
    changing wire schemas, fingerprints, provenance, or create-once ownership.

  ## 0.9.0.0 — 2026-08-02

  ### Breaking Changes

  - Requires `keiki >=0.8 && <0.9`, replacing the previous `>=0.7 && <0.8` bound,
    in lockstep with `keiro-core` and `keiro`.
  - Aggregate fold fingerprints widen from 16-hex-digit FNV-1a-64 to
    32-lowercase-hex-digit FNV-1a-128. This intentionally invalidates snapshots
    produced with the old fold discriminator; re-scaffold generated transducers
    before deploying `0.9.0.0`. Read-model shape, mapped-wire, and behavior-key
    64-bit identities are unchanged.
  - Aggregate fold, diff, replay-impact, and workspace-diff service APIs now
    return `Either FoldSurfaceError`; scaffold planning refuses the same error
    before module generation. Removes the misleading legacy/version-1
    `Spec`-only wrappers `aggregateFoldFingerprint`, `aggregateFoldSurface`,
    `diffSpecs`, `replayImpact`, `nominalEqualityContract`,
    `nominalEqualityIdentity`, and `nominalEqualityIdentities`. Retain and pass a
    `CheckedService`, or explicitly use `legacyCheckedService` at a deliberate
    compatibility boundary.
  - `DiagnosticCode` gains append-only constructors for contract TypeID
    admission and for closed policy, numeric, duplicate, identity, external-name,
    intake-coupling, topic-alias, and wire-clause validation. Exhaustive matches
    over `DiagnosticCode` must be extended. `RolloutConstraint` also gains
    `RolloutProducerFirst`.
  - Removes the unreachable exported grammar types `Derivation`,
    `DerivStrategy`, `Disposition`, `DispAction`, `EnvelopeBinding`, and
    `EnvelopeLayer`. No parser, renderer, validator, or generator constructed
    them; use the live node-specific derivation, disposition, and intake binding
    types instead.
  - Workqueue `jobOutcomeFor` functions now accept a generated queue-named closed
    outcome sum instead of `Text`; inbox generation exposes closed outcome and
    detailed disposition sums carrying retry delays, dead-letter reasons, and
    runtime failure detail. Replace string literals and bare acknowledgement
    matches with the generated constructors.
  - Structural projection witnesses are renamed from hex-mangled identifiers to
    deterministic owner-and-JSON-pointer names, with a stable suffix only for
    normalized-name collisions. Re-scaffold and update hand-owned imports and
    uses; witness values and projection semantics are unchanged.
  - Aggregate stream categories are fixed to their generated event-stream
    definition phantom. `PMCommand` and router consumers must use the new
    `<aggregate>CommandCategory`, fixed to the command phantom; generated process
    categories are fixed to the saga event-stream definition.
  - `workflowFacts` changes from packed `[(String, String)]` values to the
    generated `WorkflowFacts` record with separate body, await-label, and
    patch-identifier lists. Honest zero-constructor command/event declarations
    are now empty datatypes rather than a synthetic `()` constructor.

  ### New Features

  - Runtime semantics now uses private monotone capability profiles rather than
    consumer-maintained identifier-string lists. Aggregate fold identity and
    replay transition comparison use a total frozen canonical encoder independent
    of presentation pretty-printing, and replay pairing of guard-disambiguated
    sibling transitions is declaration-order invariant. Fold identity applies the
    standard FNV-1a-128 octet fold to that frozen UTF-8 surface.
  - Adds `language keiro-dsl 4`, selecting syntax profile 2 and
    `keiro-dsl/runtime-semantics/3`. Relative to language 3, aggregate ID
    admission, fold fingerprints, and replay classification remain unchanged;
    versions 1 through 3 retain their released semantics.
  - Designates language 4 as the sole stable authoring contract. `inspect` now
    reports language 4 as `stable` and versions 1 through 3 as
    `compatibility-only`; every `new <kind>` skeleton starts at language 4.
    Historical and unversioned sources remain accepted with their released
    semantics and are never silently upgraded.
  - Moves the primary conformance baseline to language 4: 226 stable fixtures and
    30 stable-primary compiled suites are enforced against 14 named source
    exceptions, two compatibility suites, and one version-independent suite.
    `keiro-dsl-conformance-contract` now owns the typed TypeID contract proof;
    the former permissive target is explicitly
    `keiro-dsl-conformance-contract-v1-compat`, and the redundant
    `keiro-dsl-conformance-contract-typeid` target is removed.
  - Closes accepted-but-unenforced service surfaces. Values that cannot lower to
    working generated code are rejected under every language version; language 4
    additionally enforces numeric floors, duplicate/shadowing rules, stable
    runtime identity uniqueness, Kafka and PostgreSQL naming, intake envelope
    and schema coupling, contract topic aliases, and the aggregate wire
    convention. Emit source/key/discriminant names remain explicitly
    descriptive-only.
  - Language-4 public contract fields declared as `typeid "inc"` now scaffold as
    `KindID "inc"`. Generated encoders keep canonical JSON strings, while
    field-path-aware decoders reject malformed text, the wrong prefix,
    non-canonical spelling, and non-v7 UUIDs through Keiro's frozen admission
    policy. Their manifests add `keiro-core` and `mmzk-typeid`; single-file and
    workspace records persist stable per-field ID-domain identities.
  - Adds service-aware `scaffoldContractForService`,
    `manifestDependenciesForService`, and `renderManifestForService` entry points.
    Existing `Spec`-only functions remain legacy/version-1 wrappers, and CLI and
    workspace semantic routes use the checked service.
  - Diffing an unchanged contract TypeID field from language 3 to language 4 now
    emits `ContractTypeIdDomainChanged`: public consumers and consumer builds are
    breaking, with producer-first and drain-required rollout. Producers must emit
    the frozen TypeID-v7 domain, legacy-invalid in-flight messages must drain or
    be remediated, and consumers must then be re-scaffolded, recompiled, and run
    through contract conformance.
  - Generated contract topic constants are exported. Generated contract,
    aggregate, mapped-enum, nominal, and union decoders now report the rejected
    value, complete expected set, and Aeson field path without changing accepted
    wire bytes.
  - Generated files carry the package version, effective language version, and a
    stable node origin in their provenance banner. Overwrite, stale, and
    workspace-adoption checks accept both this frozen stamped shape and the
    historical banner, but reject unrelated marker comments.
  - Regenerated committed fixtures pass the repository Fourmolu configuration;
    event decode arms render one field per line, contract topics no longer need
    private-binding warning suppression, and generated workflow facts expose
    typed list structure.

  ### Other Changes

  - Generated build manifests now declare the complete consumer compilation
    contract: `default-language: GHC2024` and `OverloadedStrings` as the sole
    default extension, followed by the module and dependency blocks. Generated
    modules emit specialized local LANGUAGE pragmas only when their syntax needs
    them. Re-scaffold before compiling under the narrower advertised profile;
    create-once hand-owned files keep their existing local pragmas.

  ## 0.8.0.0 — 2026-08-01

  ### Breaking Changes

  - `LanguageDefinition` gains two fields — `definitionSyntaxProfile` and
    `definitionRuntimeSemantics`. The type is exported as `LanguageDefinition (..)` from
    `Keiro.Dsl.LanguageVersion`, so positional construction and non-wildcard record patterns no longer
    compile. `definitionBodyParser` is retained as a compatibility projection but is no longer
    consulted for parser dispatch.

  ### New Features

  - Adds the public `Keiro.Dsl.Source`, `Keiro.Dsl.Syntax`, and `Keiro.Dsl.Frontend` advanced API.
    Source-aware tooling can parse an ordered, located `SurfaceSource`, inspect exact half-open spans,
    and lower explicitly to the existing `ParsedSource`/`Spec` semantic boundary.
  - Adds structured frontend failures with source-selection, body-parsing, and lowering phases;
    stable codes; exact primary spans; messages; expected items; and supported-version metadata.
    Megaparsec types remain internal.
  - Adds `syntaxProfileIdentifier`, `syntaxProfileSupportsFeature`,
    `languageVersionsSupportingFeature`, and `sourceLanguageDiagnosticMessage` to
    `Keiro.Dsl.LanguageVersion`.

  ### Other Changes

  - Organizes the `.keiro` grammar into internal concern modules behind the stable
    `Keiro.Dsl.Parser` compatibility facade. CLI and workspace members still parse once through that
    facade; semantic checking, scaffolding, diffing, fingerprints, and replay consume only lowered
    semantic values.
  - Makes every released registry entry explicitly select an immutable syntax profile and runtime-
    semantics identity. Version 3 deliberately reuses version 2's syntax profile; adding a future
    version no longer inherits syntax or runtime behavior from numeric ordering.
  - Keeps `parseSource`, `parseSpec`, `parseSpecText`, their rendered diagnostics, the complete 0.7
    acceptance matrix, and generated Haskell bytes unchanged. Canonical pretty printing remains
    non-lossless: the located surface layer does not retain comments or whitespace.
  - Derives `languageFeatureMinimumVersion` and `languageSupportsFeature` from the registry's syntax
    profiles instead of numeric version ordering.

  ## 0.7.0.0 — 2026-08-01

  ### Breaking Changes

  - Language version 3 makes each generated prefix-bearing ID abstract. Import
    `parseX`, `mkX`, and `xText` from `Generated.<Context>.Nominals`; the raw
    constructor and `unsafeXFromLegacyText` live only in the generated internal
    replay module. Version 1, version 2, and legacy-unversioned generated output
    retain their released constructor and decoder behavior.

  - `DiagnosticCode` gains the append-only `IdDomainContractChanged` constructor.
    Exhaustive matches must classify the new command/public-codec, replay,
    snapshot, persisted-identity, and consumer-build vector.

  - Generated service-level IDs and enums now live in one context-level
    `Generated.<Context>.Nominals` module instead of being redeclared in every
    aggregate `Domain`. Hand-owned modules that construct these values must import
    the constructors from `Nominals` explicitly. Re-scaffolding overwrites only
    generated files; event wire bytes and canonical nominal identities are
    unchanged.

  - Requires `keiki >=0.7 && <0.8`. Keiki 0.7 deliberately treats predicates
    crossing a one-way generated projection as opaque to symbolic proof, so
    verification may now return `UnverifiedOpaque` where an earlier release
    reported `Verified*`. Runtime stepping and replay are unchanged. Supply an
    exact projection with its reverse witness when proof-strength verification is
    required; behavior-conformance reports retain this surface as unverified.

  - `DiagnosticCode` gains the append-only `EventOutputCommandMismatch` and
    `AggregateEventlessStateChange` constructors. Exhaustive matches must be
    extended. A version-2 transition that emits no event may no longer change
    control state or registers; only an actual no-op is accepted.

  - Requires `keiro-core ^>=0.7.0.0` for the `Keiro.Codec.IdDomain` contract that
    generated version-3 identifier code imports. The bound is now explicit; the
    0.6.0.0 library dependency on `keiro-core` carried no version constraint.

  ### New Features

  - Adds `language keiro-dsl 3`, selecting
    `keiro-dsl/runtime-semantics/2`. Prefix-bearing IDs now use the frozen
    `keiro-dsl/id-domain/typeid-v7/1` contract: canonical lowercase TypeID-v7
    text, the declared prefix and one underscore, a 26-character Crockford
    suffix, UUIDv7 version/variant bits, and JSON strings. Runtime admission and
    Keiki 0.7 exact textual projection domains derive from the same contract.
  - Generated and consumer-bound v3 IDs validate before binding conversion,
    current JSON decoding, literals, and scaffold samples. Binding harnesses add
    exact projection, fixture-domain, distinct-representation, wrong-prefix, and
    normalization probes. Scaffold/workspace records and `--explain-bindings`
    persist the ID-domain version independently of nominal equality.
  - Historical generated-event decoding retains an explicitly named internal
    legacy constructor, while the same malformed text is rejected at current
    command/public decoding with its JSON field path. Domain adoption emits
    `IdDomainContractChanged`: old history remains readable, old snapshots miss,
    public consumers break, consumer builds are advisory, and rollout is
    producer-last. The compiled `keiro-dsl-conformance-id-domain-migration`
    target and restoring mutation script pin this split.

  - Adds the public `CheckedService`/`EffectiveLanguageContract` semantic boundary.
    Single-source and workspace CLI routes now retain the selected contract through
    validation, scaffold and harness planning, generated fold fingerprints, diff,
    replay-impact analysis, inspection JSON, and additive scaffold-record rows.
    `Spec`-only APIs remain explicit legacy/version-1 compatibility wrappers.
    Grammar-only v1/v2 differences preserve generated and fold bytes; a future
    runtime-semantic generation receives its own fingerprint discriminator.

  - Plans one deterministic Haskell owner for every generated service-level ID and
    enum across single-file and multi-file services. Aggregate rings import only
    their resolved uses, unused declarations are not imported into unrelated
    domains, and member reordering or ownership moves leave generated nominal type
    identity unchanged. A compiled two-aggregate workspace conformance suite passes
    shared ID and enum values across both rings and round-trips both codecs.

  - Generates version-2 events declared as `fields(Command)` directly from one
    checked total identity mapping. The runtime no longer imports a create-once
    identity-copy function for direct, aliased-wire, optional, nominal, `Time`,
    `Natural`, or structural command fields. Explicit event fields remain
    hand-owned, and stale generated-identity hooks are reported as obsolete.
  - Adds `behavior-obligations FILE --format=text|json` for single specs and
    workspaces. Schema `keiro-dsl/behavior-obligations/1` inventories stable
    semantic keys for every live transition from a live-reachable state, every
    reachable rejection cell, and every replay-only transition, with owner and
    conservative evidence metadata but no consumer fill claims.
  - Generates an aggregate-specific `BehaviorContract` plus create-once
    `BehaviorHoles`. Typed live and replay witnesses execute through the generated
    codec and Keiki 0.7 detailed attribution. Schema
    `keiro/behavior-conformance/1` reports required, filled, pending, missing,
    duplicate, stale, failed, verified, and unverified keys. The default gate
    fails incomplete or false evidence; `--fail-on-unverified` opts into a
    stricter proof policy.

  ### Bug Fixes

  - Parses the optional `language keiro-dsl N` preamble only after leading trivia
    and before `context`. Nested `language` fields and declarations no longer look
    like misplaced or duplicate preambles, and version-2 feature gates now arise
    from their grammar productions instead of raw source substrings. Comments,
    strings, wire keys, and legal identifiers containing `using`, `Integer`,
    `implementation hole`, `reg.`, or `cmd.` remain inert.

