changelog: |
  # Changelog

  All notable changes to `keiro-ops` are recorded here. The format follows
  [Keep a Changelog](https://keepachangelog.com/), and the package follows the
  [Haskell Package Versioning Policy](https://pvp.haskell.org/).

  ## [Unreleased]

  ## 0.23.0.0 — 2026-10-30

  ### Breaking Changes

  - Require `kiroku-store ^>=0.13.0.1` from
    mori://shinzui/kiroku/packages/kiroku-store and align internal dependencies with
    the shared release. Follow the Keiro upgrade blueprint for upstream exhaustive
    matches and composed migration `0017`; existing operational commands retain
    their behavior.

  ## 0.22.0.0 — 2026-10-27

  ### Breaking Changes

  - Require the Kiroku Store 0.12 cohort from
    mori://shinzui/kiroku/packages/kiroku-store; apply migration 0016 from
    mori://shinzui/kiroku/packages/kiroku-store-migrations with affected workers
    stopped, then restart new binaries before using namespace targets. Update
    exhaustive subscription target/event matches and low-level record constructors.

  - Direct `AppHooks` records must supply `aggregates` and `processManagers`; `emptyAppHooks` leaves them disabled. `OpsOutcome` adds `InspectionFailed`, requiring exhaustive consumers to handle structured codes.
  - `wf show/steps/journal` return `InspectionFailed` for typed inspection errors. `pgmq dlq read` requires `--force` to reserve rows; an unforced invocation previews and exits 1.

  ### New Features

  - Add embedded `pm types` with shared JSON and human metadata output, including
    empty catalogs and aliases, without requiring a manager name or store reads.
    Hosts may supply a bounded direct encoder through `runCommandWithReadEncoding`.

  - Add bounded projection-status pages and `projection status`, preserving the
    frozen v1 relation and complete-list compatibility API. Page keys precede
    correlated status reads; no writer index is added. HTTP feed protocol and
    canonical view definitions are available as foundations for live feeds.

  - Add process-manager persisted-state inspection and bounded raw stream listing,
    pending-timer pages with filter-bound cursors, and database-clock shard
    ownership/listing. Reads add no worker queries, polling tasks or migrations.
    Embedded `pm show/list` uses the additive `AppHooks.processManagers` field;
    `emptyAppHooks` leaves this optional catalog off.


  - An optional `AppHooks.aggregates` catalog mounts read-only `aggregate types|list|show|snapshot` commands. Snapshot show adds `observed_at` and `age_seconds`.

  - Bounded header presentation reuse through an alternative runner that checks the exact current row before returning prepared JSON bytes.

  - Bounded `wf inspect` commands and typed inspection errors; shared workflow rendering and paged compatibility reads.


  - Export the authoritative command grammar, classifier, runner, and invocation fields for alternative front ends.


  - `pm show/list` accepts reaction-state descriptors with explicitly unavailable provenance. Capture and `legacy-positional-v1` remain legacy positional features scheduled for retirement before 1.0.
  - Workflow list/show JSON includes `status_class`; step rows include `recorded_at`. Show uses owner-table creation-key ordering for children and awakeables. Shard status includes database `observed_at`, `heartbeat_at`, `updated_at` and `lease_age_seconds`.

  ### Bug Fixes

  - Treat `pgmq dlq read` as a mutation because it reserves messages for 30 seconds. It now previews by default and requires `--force` to read; the HTTP surface uses POST with explicit confirmation.


  - Default workflow inspection consumes primary-key `wf-key2` pages; old default tokens fail closed and the obsolete exceptional-key refusal is removed. Filtered and creation-order reads retain host deadlines.

  ## 0.21.0.0 — 2026-10-14

  ### Bug Fixes

  - Schema verification no longer warns about, or refuses mutations because of, the
    `keiro.external_read_<function>_binding` view that Keiro creates for an all-rows
    external-read contract. Binding views recorded with `managed_by = 'keiro'` are allowed runtime
    additions when verification can read the registry; `--allow-schema-drift` is again reserved for schemas this
    binary was not built for. Fixed in `keiro-migrations`; no `keiro-ops` source change.

  ## 0.20.0.0 — 2026-10-12

  ### Breaking Changes

  - Require the Kiroku 0.11 cohort from
    mori://shinzui/kiroku/packages/kiroku-store; see the root changelog and
    upgrade blueprint for subscription constructors, decoding, and migration
    guidance.

  ## 0.19.0.1 — 2026-10-05

  ### Other Changes

  - Admit effectful 2.7 alongside 2.6: `effectful <2.8` and
    `effectful-core >=2.6 && <2.7 || >=2.7.1.1 && <2.8`. Exclude the
    effectful-core 2.7.0.0–2.7.1.0 performance regression. Bounds only; no source changed.

  ## 0.19.0.0 — 2026-09-25

  ### Other Changes

  - Require `kiroku-store >=0.9.0.1 && <0.10`. The test suite requires
    `pgmq-migration >=0.6.1.1 && <0.7`. The version moves in lockstep with the
    rest of the packages, and the `keiro`, `keiro-pgmq`, and `keiro-migrations` bounds
    are raised accordingly.

  ## 0.18.0.0 — 2026-09-20


  No changes this release. The version moves in lockstep with the rest of the
  packages, and the `keiro`, `keiro-pgmq`, and `keiro-migrations` bounds are
  raised accordingly.

  ## 0.17.0.0 — 2026-09-17

  ### Breaking Changes

  - Forced `pgmq dlq purge` execution now calls the visibility-guarded library API,
    reports the actual deleted count, and fails without deleting when metrics show
    hidden rows from an inspection. The global `--force` flag still authorizes the
    mutation after preview; it does not bypass this safety refusal.

  ### Other Changes

  - No user-facing library changes. The test-suite's `pgmq-migration` bound moves
    from `>=0.5 && <0.6` to `>=0.6 && <0.7` with the PGMQ 0.6 adoption.

  ## 0.16.0.0 — 2026-09-07

  ### Other Changes

  - No user-facing changes; release in lockstep with the Keiro 0.16.0.0 package set.

  ## 0.15.0.0 — 2026-08-30

  ### Other Changes

  - The `keiro-test-support` dependency in the test-suite stanza now carries the
    lockstep bound, now that `keiro-test-support` is published to Hackage. Library
    consumers are unaffected.

  ## 0.14.0.0 — 2026-08-21

  ### Breaking Changes

  - Requires the lockstep `keiro ^>=0.14.0.0`, `keiro-pgmq ^>=0.14.0.0`, and
    `keiro-migrations ^>=0.14.0.0`.

  ### New Features

  - `outbox list` accepts `--status rejected` and renders `rejected_at`,
    `rejection_code`, and bounded `rejection_detail` in human and JSON output.

  ## 0.13.0.0 — 2026-08-17

  ### Breaking Changes

  - Requires `kiroku-store >=0.8 && <0.9`, replacing the previous `>=0.7 && <0.8`
    bound.
  - Requires the lockstep `keiro ^>=0.13.0.0`, `keiro-pgmq ^>=0.13.0.0`, and
    `keiro-migrations ^>=0.13.0.0`.

  ## 0.12.0.0 — 2026-08-14

  ### Breaking Changes

  - Requires `kiroku-store >=0.7 && <0.8` for explicit checkpoint lifecycle, the
    public transaction-composable reset API, and the visible-head query used by
    the operator position commands, plus the renewable retention evidence required by
    schema-versioned rebuilds.

  ### New Features

  - Embedded `rebuild reproject-stream GROUP PROJECTION STREAM` previews exact serving
    revision, target, dedup, stream-history, and work-admission facts and executes only
    with `--force`. The positive `--max-events` limit defaults to 1000 and is rechecked
    against locked stream metadata before the group fence. Human and v2 JSON outcomes
    report the admitted limit, cleared rows, replay/application counts, dedup
    inserted/existing counts, and verification; typed refusals have stable operator codes.

  - Embedded read-only `rebuild external-read CONTRACT VERSION` inspection and
    preview/`--force` `rebuild retire-external-read CONTRACT VERSION`. Both render the
    supported catalog report with contract state, surface generation, PostgreSQL
    dependents, and execute grants; forced retirement uses the library lifecycle API.
  - Embedded `rebuild versioned start|status|resume|abandon`, database-backed
    `rebuild retired`, and preview/`--force` `rebuild drop-retired`. Commands render the
    supported catalog operations reports, derive the physical fleet from the mounted
    validated catalog, and expose stable versioned JSON for runs and retirement blockers.

  - `Keiro.Ops.Parse.nonNegativeReader`, a message-parameterized bounded reader
    now shared by global-position, stream-version, and generation options without
    changing their accepted values or domain-specific errors.
  - A standalone, schema-checked operations console for Keiro- and Kiroku-owned
    database operations, with human tables and stable JSON generated from the
    same result values.
  - Preview-before-`--force` mutations, schema-drift refusal, and typed stream-name
    confirmation for permanent stream operations.
  - `AppHooks`, `opsCommandTree`, `runOpsInvocation`, and `mainWithHooks` for
    mounting application-owned workflow resume, timer dispatch, candidate-code
    replay audit, and validated projection-catalog rebuild commands.
  - Read-only `stream subscriptions` and
    `projection position --subscription NAME` commands backed by the public
    Kiroku 0.4 durable checkpoint inventory. Both preserve member rows and report
    `global_position_distance`; neither queries Kiroku's private schema or claims
    a relevant-event lag.
  - Projection catalog inventory and rebuild JSON expose each subscription's
    stable `checkpointOnMissing` value from the same validated catalog used by
    runtime registration and rebuild planning.
  - Embedded catalog operations add `rebuild adopt GROUP...`. Without `--force`
    it classifies every catalog group, shows stored/current slice fingerprints
    and removed groups, and prints the exact force invocation. With `--force` it
    calls the supported transactional adoption API and reports the adopted rows.
    Existing rebuild list and preview tables also expose slice identity.
  - Rebuild run tables now include `group_slice`, so status and mutation previews
    expose `$pre-canonical` directly during migration recovery.
  - Embedded `wf resume-once` results expose `advanced` and `paced` counts plus
    `sleep_due` and the sorted set of `unregistered_names` in JSON (and the
    corresponding human columns), so an operator can terminate a bounded drain on
    durable progress, identify missing workflow definitions, and distinguish due
    sleeps that require the timer worker rather than another resume pass.

  ### Bug Fixes

  - The non-forced `rebuild adopt` preview now distinguishes the named groups it will adopt
    from out-of-scope catalog drift and warns when skipped groups will still refuse startup
    registration.
  - `rebuild status` and the non-forced `rebuild abandon` preview now work for
    pre-canonical runs, enabling the documented abandon, adopt, and fresh-start
    recovery sequence without direct SQL.

  ### Other Changes

  - First public release. Requires `keiro ^>=0.12.0.0`,
    `keiro-migrations ^>=0.12.0.0`, and `keiro-pgmq ^>=0.12.0.0`.
  - The source distribution now includes the BSD-3-Clause license file.
  - `rebuild adopt` now renders scope-annotated group, registration, and old-name rows and
    reports the forced transaction through `keiro/catalog-adoption-preview/v2` and
    `keiro/catalog-adoption-outcome/v2` JSON envelopes. Preview refuses a requested group
    absent from the catalog with `AdoptGroupNotInCatalog`, matching forced execution.
