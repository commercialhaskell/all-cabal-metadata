changelog: |
  # Changelog

  ## 0.1.0.0 - 2026-10-28

  ### New Features

  - First public release of the leased verification cell client, payload publishing, and file and GCS object stores.
  - Cells bind named resources through a `resources` block; `Kenshou.Remote.Cell.Legacy` adapts cells that still describe a broker.

  ### Other Changes

  - Extracted from `mori://shinzui/keiro-runtime-kenshou` at commit `a1648293443ad88ff1695ed800ff44c99993574e`, with its package and module names unchanged.
changelog-type: markdown
description: Leases verification cells, publishes immutable run payloads, submits
