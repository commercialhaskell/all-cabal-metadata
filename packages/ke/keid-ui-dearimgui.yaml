changelog: |
  # Changelog for keid-dearimgui

  ## 0.2.0.0

  - Bump upstream to `dear-imgui-3.0.0`, with `dear-imgui-raw`, `dear-imgui-impl-glfw` and `dear-imgui-impl-vulkan`.
    * Dear ImGui is updated to 1.93.0. See the `dear-imgui` changelog for the API changes.
    * `Render.ImGui.Window.Window` flags are `ImGuiWindowFlags` from `DearImGui.Raw.Enums.ImGuiWindowFlags`.
    * The descriptor pool holds only sampled images and samplers, sized to the backend minimums.
    * `allocateWith` and `allocateWithFonts` take a number of extra sampled image sets for textures registered with `DearImGui.Raw.Impl.Vulkan.addTexture`.
  - `allocate`, `allocateWith`, `allocateWithFonts` and `renderWith` take a `HasRendering` target. Dear ImGui renders with dynamic rendering using the target's formats and sample count.
  - Removed the subpass index argument.
  - Fixed `Render.ImGui.allocateWith` destroying its descriptor pool before `vulkanShutdown` when the stage is interrupted.
  - Fixed ImGui texture uploads using the graphics queue while another thread submits to it.

  ## 0.1.5.0

  - Bump upstream to `dear-imgui-2.5.0'.
    * Breaking change around DrawList API.

  ## 0.1.4.0

  - Add `Render.ImGui.Widget`, building composable widgets on top of keid-frp-banana.
    * Mini-breaking by bringing in a whole new dependency set, but not much.

  ## 0.1.3.2

  - Add `Render.ImGui.askWindowBox`, a helper to get a `Box` using dear-imgui coordinates.
  - Add `Render.ImGui.Window`:
    - a set of helpers to produce ImGui windows with the requested propeties and run actions inside them.
    - and also a bridge to the experimental `geomancy-layout` "views" layout.

  ## 0.1.3.1

  - Update for dear-imgui-2.3.0.

  ## 0.1.3.0

  - Update for dear-imgui-2.2.1.

  ## 0.1.2.1

  - Update for keid-core-0.1.8.0.

  ## 0.1.2.0

  - Added `renderWith` helper to inject DearImGui initialization in stage rendering components.

  ## 0.1.1.1

  - Added `Vk.deviceWaitIdle` injection in `afterLoop`.
    * Should fix release/allocate race between two imgui-using stages back-to-back.

  ## 0.1.1.0

  - Added `allocateWithFonts` from dear-imgui-1.3.0.

  ## 0.1.0.1

  - Removed unused deps.

  ## 0.1.0.0

  Initial import.
