changelog-type: markdown
description: "# peg-matching\n\n**peg-matching** is a Haskell library for parsing,
  analyzing, matching, and \nrewriting syntax trees using Parsing Expression Grammars
  (PEGs) and user-defined \npatterns. It is designed for research and experimentation
  with syntax-driven \ntransformations and pattern matching in abstract syntax trees
  (ASTs).\n\n## Features\n\n- **PEG Parsing:** Define grammars using PEGs and parse
  input strings into syntax \ntrees.\n- **Pattern Language:** Express complex patterns
  over syntax trees, including \nvariables, choices, sequences, and repetitions.\n-
  **Pattern Matching:** Match patterns against parsed trees and capture subtrees.\n-
  **Rewriting:** Rewrite syntax trees by applying pattern-based transformations.\n-
  **Semantic Analysis:** Validate grammars and patterns, detect left recursion, \nduplicate
  rules, and other semantic errors.\n- **Pretty Printing:** Human-readable output
  for grammars, patterns, and trees.\n- **Extensible:** Modular design for easy extension
  and integration.\n\n## Project Structure\n\n```haskell\nsrc/\n  Match/\n    Capture.hs
  \      -- Pattern matching and capture\n    Rewrite.hs       -- Tree rewriting\n
  \ Parser/\n    Base.hs          -- Parser combinators and utilities\n    ParsedTree.hs
  \   -- PEG-based parser to AST\n    Pattern.hs       -- Pattern parser\n    Peg.hs
  \          -- PEG grammar parser\n  Pipeline/\n    MatchPipeline.hs -- High-level
  pipeline for parsing, matching, and rewriting\n  Quote/\n    Base.hs          --
  Quasi-quoter base functions\n    Pattern.hs       -- Pattern quasi-quoter\n    Peg.hs
  \          -- PEG quasi-quotter\n  Semantic/\n    Pattern.hs       -- Semantic analysis
  for patterns\n    Peg.hs           -- Semantic analysis for PEGs\n  Syntax/\n    Base.hs
  \         -- Core types (Terminal, NonTerminal, etc.)\n    ParsedTree.hs    -- AST
  definition and utilities\n    Pattern.hs       -- Pattern types\n    Peg.hs           --
  PEG types and utilities\ninput/\n  peg/               -- Example PEG grammars\n
  \ pattern/           -- Example pattern files\n  file/              -- Example input
  files\ntest/\n  Main.hs            -- Property and sanity tests\n```\n\n## Getting
  Started\n\n### Installation\n\n`peg-matching` is published on\n[Hackage](https://hackage.haskell.org/package/peg-matching).
  To use it in your\nown project, add it to the `build-depends` of your `.cabal` file:\n\n```cabal\nbuild-depends:\n
  \   base >=4.17 && <5\n  , peg-matching >=0.1 && <0.2\n```\n\nOr install it directly:\n\n```bash\ncabal
  update\ncabal install --lib peg-matching\n```\n\nThe sections below are for building
  this repository from source, which you only\nneed if you intend to work on the library
  itself.\n\n### Prerequisites\n\nYou may build the project either locally or using
  Docker.\n\n#### Local environment\n\n- [GHC](https://www.haskell.org/ghc/) (>= 9.4)\n-
  [Cabal](https://www.haskell.org/cabal/), or [Stack](https://docs.haskellstack.org/en/stable/)\n\n####
  Docker environment\n\n- [Docker](https://www.docker.com/)\n- Docker Compose\n\n###
  Building\n\nFirst, clone the repository:\n\n```bash\ngit clone https://github.com/lives-group/peg-matching\ncd
  peg-matching\n```\n\nAfter this, you may build using Cabal:\n\n```bash\ncabal update\ncabal
  build\n```\n\nOr with Stack:\n\n```bash\nstack build\n```\n\nAlternatively, you
  also may use docker to setup. \nAfter cloning the repository, run:\n\n```bash\ndocker
  compose build\ndocker compose run ghci\n```\n\nThis will already run ```cabal update```
  inside the container for you.\n\n## Usage\n\nYou can use the library in your own
  Haskell projects or run the provided pipelines \nfor parsing, matching, and rewriting:\n\n```haskell\nimport
  Pipeline.MatchPipeline\n\n-- Parse and validate a PEG grammar from a string\nlet
  grammarResult = parseValidGrammar \"S <- \\\"a\\\" S / \\\"b\\\"\"\n\n-- Parse and
  validate patterns\nlet patternsResult = parseValidPatterns grammarString patternString\n\n--
  Parse an input file and match patterns\nlet matchResult = parseMatch grammarString
  patternString inputString\n```\n\n### QuasiQuoters\n\nThis library also exposes
  compile-time QuasiQuoters for PEG grammars and patterns.\nUse `Quote.Peg.grammar`
  to embed a PEG definition directly in Haskell source, and\n`Quote.Pattern.patterns`
  to embed pattern definitions.\n\nExample:\n\n```haskell\nimport qualified Quote.Peg
  as QPeg\nimport qualified Quote.Pattern as QPattern\n\nmyGrammar :: Grammar\nmyGrammar
  = [QPeg.grammar|\n    S <- \"a\" S / \"b\"\n|]\n\nmyPatterns :: [NamedSynPat]\nmyPatterns
  = [QPattern.patterns|\n    pattern example : S := \"a\" (S := \"b\")\n|]\n```\n\n###
  File-based Pipeline Functions\n\nMost pipeline functions also have `IO` variants
  that accept file paths instead of raw \nstrings. These allow you to directly specify
  files containing PEG, patterns, and input data.  \nYou can find several example
  PEG, pattern, and input files in the `input/` directory \nto experiment with. The
  file extension for PEG and pattern files are .peg and .pat\nrespectively, but they
  are simple text files.\n\n### Tests\n\nThe `test/` directory contains property-based
  and sanity tests for the main algorithms\nand is still in progress. \nYou can use
  these to check the correctness and robustness of the library.\n\nSee the [Haddock
  documentation](#documentation) for detailed API usage and examples.\n\n### Running
  examples\n\nAfter building the project, you may run some provived examples. First,
  run the REPL:\n\n```bash\ncabal repl\n```\n\nAnd then load the pipeline module:\n```bash\n:l
  Pipeline.MatchPipeline\n```\n\n#### Example 1 - Parsing a file: \nRun\n```bash\nparseFileIO
  \"input/peg/expression.peg\" \"input/file/expression.txt\" True\n```\n\nThe ```parseFileIO```
  function takes as arguments two files and a boolean. The first is a \nfile that
  contains the PEG, while the second contains the input data. The boolean indicates\nin
  which way you want the parsed content to be displayed: if ```True```, it will flatten
  the content\nand show it exactly as is in the file. Otherwise, it you show the generated
  tree.\n\nThe result should be:\n```bash\n(1+2)*3\n```\n\nIf you ran with ```False```:\n```bash\nNT
  E\n╰╴Seq\n  ├╴NT T\n  | ╰╴Seq\n  |   ├╴NT F\n  |   | ╰╴Right\n  |   |   ╰╴Seq\n
  \ |   |     ├╴\"(\"\n  |   |     ╰╴Seq\n  |   |       ├╴NT E\n  |   |       | ╰╴Seq\n
  \ |   |       |   ├╴NT T\n  |   |       |   | ╰╴Seq\n  |   |       |   |   ├╴NT
  F\n  |   |       |   |   | ╰╴Left\n  |   |       |   |   |   ╰╴NT n\n  |   |       |
  \  |   |     ╰╴\"1\"\n  |   |       |   |   ╰╴Star []\n  |   |       |   ╰╴Star
  [\n  |   |       |     ├╴Seq\n  |   |       |     | ├╴\"+\"\n  |   |       |     |
  ╰╴NT T\n  |   |       |     |   ╰╴Seq\n  |   |       |     |     ├╴NT F\n  |   |
  \      |     |     | ╰╴Left\n  |   |       |     |     |   ╰╴NT n\n  |   |       |
  \    |     |     ╰╴\"2\"\n  |   |       |     |     ╰╴Star []\n  |   |       |     ╰╴]\n
  \ |   |       ╰╴\")\"\n  |   ╰╴Star [\n  |     ├╴Seq\n  |     | ├╴\"*\"\n  |     |
  ╰╴NT F\n  |     |   ╰╴Left\n  |     |     ╰╴NT n\n  |     |       ╰╴\"3\"\n  |     ╰╴]\n
  \ ╰╴Star []\n```\n\n#### Example 2 - Matching with patterns: \nRun\n```bash\nparseMatch1IO
  \"input/peg/python.peg\" \"input/pattern/factorial.pat\" \"input/file/fact_math.py\"
  \"factorial_call\"\n```\n\nThe ```parseMatch1IO``` function takes as arguments three
  files and one string. The files\nare the PEG file, pattern file and input file,
  respectively. The string is an identifiers for \nany pattern inside the pattern
  file. In this case, ```factorial_call``` is a pattern that \nmatches with calls
  to functions named ```math.factorial```.\n\nThe output should be something like
  this:\n```bash\nfactorial_call: match!\n```\nIndicating that the indicated pattern
  did match inside the file.\n\nRunning\n```bash\nparseMatch1IO \"input/peg/python.peg\"
  \"input/pattern/factorial.pat\" \"input/file/fact_while.py\" \"factorial_call\"\n```\nwill
  produce something like this:\n```bash\nfactorial_call: not match!\n```\nIndicating
  that the indicated pattern did not match inside the file.\n\n#### Example 3 - extracting
  call graph from a Python file: \nRun\n```bash\nparseCallGraphIO \"input/peg/python.peg\"
  \"input/pattern/call_graph.pat\" \"input/file/ex4.py\" \"definition\" \"call\"\n```\n\nThe
  ```parseCallGraphIO``` function takes as arguments three files and two strings.
  The files\nare the PEG file, pattern file and input file, respectively. The strings
  are identifiers for \npatterns inside the pattern file, where the first one is a
  pattern that matches with functions definitions and the second one a pattern that
  matches with function calls.\n\nThe output should be something like this:\n```bash\nbhaskara
  -> delta\nbhaskara -> math.sqrt\n```\nIndicating that the function ```bhaskara```
  calls both ```delta``` and ```math.sqrt```.\n\n#### Example 4 - rewriting based
  on patterns: \nThis is the content of ```input/file/if.py```:\n```python\nif not
  a:\n    print(b)\n    print(b1)\nelse:\n    print(c)\n    print(c1)\n```\n\nRun\n```bash\nparseRewriteIO
  \"input/peg/python.peg\" \"input/pattern/subst_if.pat\" \"input/file/if.py\" \"if_def\"
  \"subst\"\n```\n\nThe ```parseRewriteIO``` function takes as arguments three files
  and two strings. The files\nare the PEG file, pattern file and input file, respectively.
  The strings are identifiers for \npatterns inside the pattern file, where the first
  one is a pattern that matches with some\ndesired data and the second one specifies
  how to rewrite the matched data.\n\nThe output should be something like this:\n```bash\nif
  a:print(c)\nprint(c1)else:print(b)\nprint(b1)\n```\nThe printing is a bit broken,
  but it is possible to see that it swapped the ```if``` and\n```else``` body and
  removed the ```not``` from the condition.\n\nYou may change the input files (and
  their contents) for new tests, if you wish.\n\n## Documentation\n\nAll modules are
  documented with Haddock. To generate HTML documentation:\n\n```bash\ncabal haddock\n```\n\nor\n\n```bash\nstack
  haddock\n```\n\nThe documentation covers:\n- PEG and pattern syntax\n- Pattern matching
  and rewriting\n- Error handling and semantic checks\n"
