description: |
  # Tone
  tone wav synthesizer

  Usage

  ```
  tone --help
  tone 440 | aplay
  ```

  Install

  ```
  cabal install tone
  ```

  Development

  ```
  cabal build
  cabal haddock
  cabal run test
  cabal run tone -- --help
  ```
