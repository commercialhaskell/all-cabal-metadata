changelog: "# Revision history for mischief-render\n\n## 0.1.1.0\n\n* Added `windowToWorldPos`
  function. \n* Added comparisons, `select` and `pick` to shaders, for conditional
  control flow. \n* Added `CameraBackground` and `CameraZoom` components. \n* Added
  a field in the render settings for which default sampler the material will use.
  Useful for pixel art.  \n\n## 0.1.0.0 \n\n* First version. Released on an unsuspecting
  world.\n"
changelog-type: markdown
description: "# mischief-render \n\nThis library adds rendering (via WGPU) to Mischief.
  It lets you write low-level shader code directly in Haskell monads and seamlessly
  bind GPU data and run custom materials. It also provides built-in API for Cameras,
  Sprites and Animations. \n\nThis library lives in the official [repo](https://codeberg.org/mischief/mischief)
  and is considered a \"core library\" of the ecosystem. \n\nTo contribute, you can
  file issues, such as bug reports and feature requests, in the official [repository](https://codeberg.org/mischief/mischief).\nYou
  can also join the official server on discord to be kept up to date with updates
  and chat with the rest of the community. Link in the aforementioned repo. \n\nYou
  can go through the official rendering book at the `Mischief.Render` module above.
  \ \n\n### Disclaimer\n\nThe API is mostly limited to 2D (although 3D is possible
  and will be supported oficially in the future).\n\nMany performance optimizations
  and features have been intentionally ommitted for now. The plan is to have\na small
  stable core that will be expanded over time.\n"
