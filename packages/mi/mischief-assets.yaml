changelog: "# Revision history for mischief-assets\n\n## 0.1.0.0 \n\n* First version.
  Released on an unsuspecting world.\n"
changelog-type: markdown
description: "# mischief-assets\n\nThis library provides ways of integrating data-driven
  design into your Mischief projects.\nIt lets you define, load and save Assets, such
  as .kdl files and images, as entities. It also allows hot-reloading. \n\nThis library
  lives in the official [repo](https://codeberg.org/mischief/mischief) and is considered
  a \"core library\" of the ecosystem. \n\nTo contribute, you can file issues, such
  as bug reports and feature requests, in the official [repository](https://codeberg.org/mischief/mischief).\nYou
  can also join the official server on discord to be kept up to date with updates
  and chat with the rest of the community. Link in the aforementioned repo. \n\nCheck
  out the Asset Book in the Mischief.Assets module to learn about using it! "
