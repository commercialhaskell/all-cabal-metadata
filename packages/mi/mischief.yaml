changelog: "# Revision history for mischief\n\n## 0.1.1.0 \n\n### mischief-render
  0.1.0.0 -> 0.1.1.0 \n\n* Added `windowToWorldPos` function. Can be used, for instance,
  to determine the world position of the mouse.\n* Added comparisons, `select` and
  `pick` to shaders, for conditional control flow. \n* Added `CameraBackground` and
  `CameraZoom` components. \n* Added a field in the render settings for which default
  sampler the material will use. Useful for pixel art.  \n\n### mischief-math 0.1.0.0
  -> 0.1.1.0 \n\n* Added Field Accessors for V4. \n* Fixed a minor quaternion rotation
  bug. \n\n### mischief-ecs 0.2.1.0 -> 0.2.2.0 \n\n* Performance improvements when
  chaining multiple Changed filters with Or. \n* Performance improvements when querying
  for all archetypes and later filtering them.  \n\n## 0.1.0.0 \n\n* First version.
  Released on an unsuspecting world.\n"
changelog-type: markdown
description: "# Mischief \nThis is the main Mischief library! It doesn't really contain
  anything in itself. It's a sort-of nexus with \ngates to all the other Mischief
  libraries. Read more at the `Mischief` module above!   "
