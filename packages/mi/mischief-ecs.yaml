changelog: "# Revision history for mischief-ecs\n\n## 0.2.3.0 \n\n* Fixed a bug when
  checking for change detection on components that are not yet registered\n* Added
  compile-time optimizations for query filters when using quasi-queries.  \n\n## 0.2.2.0
  \n\n* Performance improvements when chaining multiple Changed filters with Or. \n*
  Performance improvements when querying for all archetypes and later filtering them.
  \ \n\n## 0.2.1.0 \n\n* Fixed bug related to ChildOf hierarchy traversal \n* Significantly
  improved query filter performance  \n\n## 0.2.0.0 \n\nAlmost a full rework of the
  high-level API in the previous version. The ECS is now designed to encourage functional
  coding. Also many performance improvements and bug fixes. \n\n## 0.1.0.0 \n\nFirst
  version. Released on an unsuspecting world. \n"
changelog-type: markdown
description: "# mischief-ecs \n\nThis is the ECS library for the Mischief game engine.
  It is the root of every other library that's part of the engine. In other words,
  this is the source of all Mischief. \n\nIt is meant to be a simple, yet powerful
  archetype ECS written fully in Haskell, that provides a unique blend of Data-Oriented
  Design\nand Functional Programming.\n\nTo contribute, you can file issues, such
  as bug reports and feature requests, in the official [repository](https://codeberg.org/mischief/mischief).\nYou
  can also join the official server on discord to be kept up to date with updates
  and chat with the rest of the community. Link in the aforementioned repo. \n\nCheck
  out the [Learn You an ECS for Great Mischief](https://hackage-content.haskell.org/package/mischief-ecs/docs/Mischief-ECS.html)
  book to learn about using this library! \n"
