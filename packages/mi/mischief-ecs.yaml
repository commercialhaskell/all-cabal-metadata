changelog: "# Revision history for mischief\n\n## 0.2.0.0 \n\nAlmost a full rework
  of the high-level API in the previous version. The ECS is now designed to encourage
  functional coding. Also many performance improvements and bug fixes. \n\n## 0.1.0.0
  \n\nFirst version. Released on an unsuspecting world. \n"
changelog-type: markdown
description: "# Mischief \n\nThis is the ECS library for the Mischief game engine.
  It is the root of every other library that's part of the engine. In other words,
  this is the source of all Mischief. \n\nIt is meant to be a simple, yet powerful
  archetype ECS written fully in Haskell, that provides a unique blend of Data-Oriented
  Design\nand Functional Programming.\n\nTo contribute, you can file issues, such
  as bug reports and feature requests, in the official [repository](https://codeberg.org/mischief/mischief).\nYou
  can also join the official server on discord to be kept up to date with updates
  and chat with the rest of the community. Link in the aforementioned repo. \n\nCheck
  out the [Learn You an ECS for Great Mischief](https://hackage-content.haskell.org/package/mischief-ecs/docs/Mischief-ECS.html)
  book to learn about using this library! \n"
