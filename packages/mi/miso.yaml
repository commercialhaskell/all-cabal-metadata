author: David M. Johnson <code@dmj.io>
basic-deps:
  base: <5
  bytestring: <0.13
  containers: <0.9
  mtl: <2.4
  text: <2.2
  transformers: <0.7
changelog: "# Changelog\n\nAll notable changes to `miso` are documented here.\n\n##
  1.13.0.0\n\n### Added\n\n- **Native mobile backend.** `miso` can now target native
  mobile devices by\n  driving the [Lynx](https://lynxjs.org) dual-thread runtime
  instead of the\n  browser DOM. New `Miso.Native` entry point (`native` / `nativeWithContext`),\n
  \ the `Miso.Native.Element.*` element / event / property / method vocabulary,\n
  \ and main-thread event handlers for low-latency gestures. Gated behind the\n  `native`
  cabal flag (`-fnative`); web / WASM builds are unaffected.\n\n  Because the flag
  is off by default, the `Miso.Native.*` modules do not\n  appear in the Hackage-generated
  documentation — build locally with\n  `-fnative`, or see the `sample-app-native`
  directory for a worked example\n  with iOS and Android hosts.\n\n- **App-global
  `context`.** A single value shared by every `Component` in the\n  tree (miso's analogue
  of React Context): seed with `startAppWithContext`,\n  read with `getContext` (or
  the first argument to `view`), update with\n  `modifyContext` / `modifyContext_`
  / `putContext`, and opt components into\n  context-driven re-renders with `useContext`.
  `ComponentInfo` gained a\n  `componentInfoContext` lens. The motivating use case
  is propagating\n  settings such as locale or theme to every component without threading
  them\n  through `props`.\n\n- **Cookie Store API.** New `Miso.Cookie` module wrapping
  the browser's\n  [CookieStore API](https://developer.mozilla.org/en-US/docs/Web/API/CookieStore)\n
  \ as `Effect` combinators — `cookieGet`, `cookieGetAll`, `cookieSet`,\n  `cookieDelete`,
  `cookieDeleteWith`, the `Cookie` record and `defaultCookie`\n  constructor, plus
  `_`-suffixed synchronous variants. `Miso.Subscription.Cookie`\n  adds `cookieChangeSub`
  for subscribing to `CookieChangeEvent`s. Requires a\n  secure context (HTTPS or
  `localhost`); on browsers without the API\n  (e.g. Firefox) the error callback fires
  and `cookieChangeSub` is a no-op.\n\n- **`canvasSub`.** New `Miso.Subscription.Canvas`
  module. `canvasSub` drives\n  a `<canvas>` in a tight `requestAnimationFrame` loop,
  bypassing virtual DOM\n  construction entirely — unlike `Miso.Canvas`, whose `draw`
  runs during the\n  diffing process on discrete events. Pair it with `onCreatedWith`
  /\n  `onDestroyed` and `startSub` / `stopSub` to start the loop when the canvas\n
  \ mounts and stop it on unmount. The draw callback receives each frame's\n  high-resolution
  timestamp and a snapshot of the component's current model\n  (see the `Sub` change
  below), and the queued frame is cancelled before the\n  callback is freed on teardown.\n\n-
  **`Miso.Trace`.** A browser-console analogue of `Debug.Trace` for\n  debugging pure
  code such as `view` functions or helpers called from\n  `update`. `trace`, `traceId`,
  `traceWith`, `traceShow`, `traceShowId`,\n  `traceShowWith`, `traceM` and `traceShowM`
  log with `console.log`; the\n  `traceWarn*` and `traceError*` families log with
  `console.warn` and\n  `console.error` respectively, gaining the browser's severity
  filtering\n  and stack traces. `traceTo` generalises over any `MisoString -> IO
  ()`\n  console function from `Miso.FFI`. Like `Debug.Trace`, these are built on\n
  \ `unsafePerformIO` and are a debugging aid only.\n\n- **Synchronous `Miso.Fetch`
  variants.** `_`-suffixed counterparts for the\n  whole surface — `getJSON_`, `postJSON_`,
  `postJSON'_`, `putJSON_`,\n  `getText_`, `postText_`, `putText_`, `getBlob_`, `postBlob_`,
  `putBlob_`,\n  `getFormData_`, `postFormData_`, `putFormData_`, `getUint8Array_`,\n
  \ `postUint8Array_`, `putUint8Array_`, `getArrayBuffer_`, `postArrayBuffer_`,\n
  \ `putArrayBuffer_`, `postImage_`, `putImage_`. Each blocks the calling\n  thread
  and returns `Either (Response error) (Response body)`. Best used\n  inside `Miso.Effect.io`
  / `io_` so the scheduler thread is not blocked.\n\n- **Cross-thread effects.** `runOnBG`
  and `runOnMain` (with the supporting\n  `Thread` type) dispatch an action's `update`
  onto the background (BTS) or\n  main (MTS) thread of the Lynx runtime. Off the native
  runtime, or when\n  already on the target thread, both behave as an ordinary `issue`.\n\n-
  **Main-thread event handlers.** `onMain` / `onMainWithOptions` in\n  `Miso.Event`
  register handlers that run directly on the main thread, for\n  low-latency gesture
  and animation work. `Miso.Native.MainThread` provides\n  `MainThreadRef` and the
  imperative operations those handlers drive.\n  `eventHandlerConvert` / `eventHandlerDecoder`
  and the `EventHandler` type\n  are exported for building custom handlers.\n\n- **Static
  components.** `mountStatic` and `mountStaticWithProps` mount a\n  `Component` through
  a `StaticPtr` (`SomeStaticComponent`), so the component\n  survives the dual-thread
  boundary; `vcomp_` / `vcomp` turn the resulting\n  pointer into a `View`. Unlike
  the non-static combinators these need no key —\n  the compile-time `StaticKey` supplies
  identity. To opt a statically mounted\n  child into `context` re-renders, set the
  field directly:\n  `mountStatic comp { useContext = True }`. `mountUseContext` is
  the\n  non-static equivalent.\n\n- **Every exported name is documented.** `cabal
  haddock` reported 118\n  undocumented exports across 34 modules — mostly the Lynx
  event payloads,\n  decoders, method parameter records and `Events` maps under\n
  \ `Miso.Native.Element.*`. All now carry Haddock.\n\n- **Context-seeding SSR entry
  points.** `misoWithContext` and\n  `prerenderWithContext` hydrate a server-rendered
  page with an explicit\n  initial `context`; `setContext` seeds the global context
  for use from the\n  `ToHtml` renderer. `Miso.Reload` gained matching `liveWithContext`
  and\n  `reloadWithContext`.\n\n- **Lynx thread detection.** `getThreads`, `onBTS`
  and `onMTS` in `Miso.FFI`\n  report which thread the current code is executing on.\n\n-
  **CSS helpers.** `transition_` builds a single shorthand `transition`\n  declaration
  (so an imperative `transition: none` reset on the main thread\n  clears it as one
  key), and `cubicBezier` produces a `cubic-bezier(…)`\n  timing function.\n\n- **`Miso.DSL`
  additions.** `await` for awaiting a JS promise from Haskell,\n  and the `JSException`
  type (which now has an `Exception` instance).\n\n- **`DirectEvents`.** `VNode` carries
  a set of directly-dispatched events,\n  readable via `nodeDirectEvents`, used by
  the native runtime to skip the\n  scratch-node round trip.\n\n- **Types that were
  reachable but not exported.** Several types appeared in\n  exported signatures without
  being exported themselves, so callers could not\n  name them: `Consumed` (the payload
  of `Miso.Native.Element.List.Method`'s\n  callback), `GetTextBoundingRect` (the
  parameter of `getTextBoundingRect`),\n  `ListItemInfo`, `AnimationType` and `UIAppearanceDetailEventType`
  (field\n  types of exported Lynx event records), and `ComponentIds` (the type of\n
  \ `ComponentState`'s `_componentChildren`). `Miso.JSON` now exports `ToJSON`\n  with
  both methods — `toJSONList` was hidden, so it could not be overridden\n  outside
  the module — along with the four generic-deriving classes missing\n  from its `Generics`
  group (`GToJSONRep`, `GToJSONSumNullary`,\n  `GFromJSONRep`, `GFromJSONSumNullary`).
  `Miso.Lens.Generic` likewise exports\n  the type-level machinery its `HasLens` instances
  mention (`GSet`,\n  `GetFieldType`, `TotalityCheck`, `And`, `Or`).\n\n- **`aeson`
  cabal flag.** When enabled (`-faeson`, off by default),\n  `Miso.JSON` keeps its
  API but is defined in terms of\n  [aeson](https://hackage.haskell.org/package/aeson):
  `Value`, `Object`, and\n  `Parser` become aeson's types, so existing aeson `ToJSON`
  / `FromJSON`\n  instances work directly with `Miso.Fetch`, `Miso.WebSocket`, and
  the event\n  decoders. Signatures are unchanged — the accessors still take `MisoString`\n
  \ keys, `withArray` still passes the continuation a `[Value]`, `withNumber`\n  still
  passes a `Double`, and `Result` still carries `MisoString` error\n  messages. On
  the JS / WASM backends orphan instances make `JSString` a\n  first-class JSON citizen.
  Miso's own generic-deriving machinery (`GToJSON`\n  et al.) is not exported in this
  mode; aeson's `genericToJSON` / `Options` /\n  `camelTo2` are re-exported instead.
  CI runs the WASM integration suite in\n  both modes.\n\n- **`text` cabal flag on
  WASM.** When enabled (`-ftext`, off by default),\n  `MisoString` is `Data.Text.Text`
  instead of `JSString` on the WASM\n  backend too (previously this was only possible
  on the `VANILLA` / SSR\n  build). `Data.JSString` remains the FFI boundary type,
  so DOM writes\n  still convert `Text -> JSString` on the way out. Number formatting
  and\n  parsing take advantage of this to avoid unnecessary FFI round trips:\n  `toMisoString`
  on `Int` / `Word` / `Double` / `Float` builds `Text`\n  directly via `Data.Text.Lazy.Builder`
  (`decimal` / `realFloat`) instead\n  of allocating a throwaway `JSVal` via JS's
  `.toString()`, since GHC's\n  `Show` formatting is what these functions target on
  this backend\n  regardless. Likewise,\n  `fromMisoString` on `Int` / `Word` / `Double`
  / `Float` parses directly\n  with `Data.Text.Read` instead of round-tripping through\n
  \ `JSString`/`parseInt`/`parseFloat`, while reproducing the JS parsers'\n  semantics:
  leading/trailing whitespace and trailing garbage are\n  ignored, a leading `+`/`-`
  is accepted, and integers with a `0x`/`0X`\n  prefix parse as hexadecimal. CI gained
  a `playwright-wasm-aeson-text`\n  target that runs the WASM integration suite with
  both the `aeson` and\n  `text` flags enabled together.\n\n### Changed\n\n- **Breaking:
  `View` and `Attribute` gained type parameters.**\n  `View context model action`
  and `Attribute model action`. This lets event\n  handlers read the current `model`
  and supports the native dual-thread\n  `static` handler protocol. `VNode` now carries
  a `DirectEvents` set, the\n  key moved into `SomeComponent (Maybe Key) …`, and `VComp`
  / `VCompStatic` /\n  `SomeStaticComponent` were restructured. Downstream `view`
  and attribute\n  signatures must be updated accordingly.\n\n- **Breaking: `Sub`
  gained a `model` type parameter.** `Sub action` is now\n  `Sub model action`, and
  a subscription receives a second argument — an\n  `IO model` that returns a snapshot
  of the component's current model:\n  `type Sub model action = Sink action -> IO
  model -> IO ()`. This lets\n  long-running subscriptions (like `canvasSub`) read
  the latest model\n  without threading it through actions. All bundled subscriptions
  were\n  updated; user-defined subscriptions that ignore the model need only accept\n
  \ (and discard) the extra argument, e.g.\n  `tickSub sink _ = forever (threadDelay
  delay >> sink Tick)`. `mapSub`,\n  `createSub`, and `startSub` were updated accordingly.\n\n-
  **Breaking: `Miso.Binding` was removed.** The experimental lens-based\n  parent/child
  model synchronisation mechanism (`Binding`, `Bindings`,\n  `Precedence`, and the
  `bindings` field on `Component`) is gone, along with\n  its propagation phase in
  the scheduler. Use the new app-global `context`\n  for shared state, or asynchronous
  messaging via `broadcast` / `Miso.PubSub`\n  for point-to-point communication.\n\n-
  **Breaking: `parent` and `ROOT` were removed.** `Component` no longer\n  carries
  a `parent`; the `ROOT` marker that demarcated the top of the page\n  is unnecessary
  without it. Both are superseded by `context`.\n\n- **Breaking: `Miso.Types.keyed`
  was removed.** Use the keyed constructors\n  directly: `textKey` / `textKey_` for
  text, `fragment_` / `vfrag_` for\n  fragments, `mount_` / `vcomp_` / `mountStatic`
  for components, and\n  `key_` in the attribute list for element nodes.\n\n- **Breaking:
  runtime internals dropped from `Miso.FFI`.** `mountComponent`,\n  `unmountComponent`
  and `modelHydration` (and `getComponentContext` from\n  `Miso.FFI.Internal`) were
  documented as runtime-use-only and have been\n  removed as part of the dual-thread
  rework. They have no user-facing\n  replacement.\n\n- **Breaking: `autocomplete_`
  takes a `MisoString`.** It was\n  `Bool -> Attribute action`, which could only produce
  `\"on\"` / `\"off\"` and\n  could not express the many other valid values (`\"email\"`,
  `\"new-password\"`,\n  …). It is now `MisoString -> Attribute action`; replace `autocomplete_
  True`\n  with `autocomplete_ \"on\"`.\n\n- **Breaking: `Miso.Util.Parser.endOfInput`
  was generalised** from\n  `Parser a ()` to `ParserT r [a] [] ()`. Call sites are
  unaffected unless\n  they carried an explicit type annotation.\n\n- **`MisoString`
  `length` and `take` are code-point based on WASM.** They\n  previously counted UTF-16
  code units, so a string holding a single\n  astral-plane character (an emoji, say)
  reported a length of 2. They now\n  agree with `Data.Text` and with the GHCJS backend.
  Only the WASM backend\n  was affected.\n\n- **`context` no longer requires `ToJSON`
  / `FromJSON`.** The constraints\n  were unused — `context` is never sent across
  the dual-thread boundary.\n\n### Removed\n\n- **`Miso.String.QQ`.** The `misoString`
  QuasiQuoter for multiline\n  `MisoString` literals is gone. GHC's `MultilineStrings`
  extension\n  (GHC 9.12+) covers the use case directly — enable the pragma and write\n
  \ triple-quoted `MisoString` literals. (`Miso.FFI.QQ` and `Miso.Lens.TH`,\n  the
  other `template-haskell`-flag modules, are unaffected.)\n\n### Fixed\n\n- **`Miso.Fetch`'s
  `none` response type no longer double-fires the success\n  callback.** `fetchCore`
  called the success callback directly for\n  `responseType == \"none\"` and then
  fell through into a second, unconditional\n  `.then` that called it again with `body:
  undefined`. Every `post*`/`put*`\n  variant that discards the response body (`postJSON`,
  `postJSON_`, `putText`,\n  `putBlob_`, etc.) dispatched its success action twice
  per request.\n\n- **Native: attribute removal actually removes the attribute.**
  The MTS\n  drawing context's `removeAttribute` called `__SetAttribute(node, key,
  '')`.\n  The engine's `Element::SetAttribute` (`lynx/core/renderer/dom/element.cc`)\n
  \ only takes the removal branch when the value is lepus-empty\n  (`null`/`undefined`)
  — an empty string is an ordinary string value, so it\n  was stored in `updated_attr_map_`
  instead of being removed. Every prop\n  diffed off a native element (`dom.ts`'s
  `diffProps`, which routes native\n  removals through this path) was setting it to
  `''` rather than clearing\n  it. Now passes `null`.\n\n- **`rAFSub` now cancels
  the pending animation frame on unsubscribe.**\n  Release freed the `requestAnimationFrame`
  callback without cancelling the\n  frame already queued in the browser; the next
  frame then invoked a freed\n  callback and crashed the WASM RTS with `internal error:
  stg_ap_p_ret`.\n  `Miso.Canvas`'s `draw` also moved from a `syncCallback` to an\n
  \ `asyncCallback`, fixing a `schedule: re-entered unsafely` crash when a\n  component
  unmounted mid-diff.\n\n- **Non-bubbling media events are registered in the capture
  phase.**\n  `durationchange`, `loadeddata`, `loadedmetadata` and `loadstart` do
  not\n  bubble, so their delegated listeners — registered in the bubble phase —\n
  \ never received them and `onLoadedMetadata` and friends silently never\n  fired.
  They are now registered with capture, like the other non-bubbling\n  entries in
  `mediaEvents`.\n\n- **Native: the layout custom event is recognised under its released
  name.**\n  Released Lynx engines (e.g. LynxExplorer apps) emit it as `layout`, while\n
  \ newer Lynx sources emit `layoutchange`; miso only listened for the latter,\n  so
  `onLayoutChange` never fired on released engines. `onLayout` /\n  `onLayoutMainWith`
  are added as aliases so apps can bind both when the\n  host engine version is unknown.\n\n-
  **Native: `consumeSlideEvent_` sends the shape Lynx expects.** Lynx parses\n  `consume-slide-event`
  as `[start, end]` angle-range pairs (degrees,\n  -180..180), but the binding serialised
  a flat list of angles instead of\n  paired ranges, a shape the engine silently ignores.\n\n-
  **`autocorrect_` and `spellcheck_` wrote to the wrong attribute.** Both\n  emitted
  `autocomplete` instead of their own attribute name. `spellcheck_`\n  additionally
  now emits `\"true\"` / `\"false\"` rather than `\"on\"` / `\"off\"`.\n\n- **`MOUNT`
  errors on a missing `domRef`** instead of synthesizing a bogus\n  parent node and
  failing later in the diff.\n\n- **Key-based model recovery is gated on `liveMode`,**
  so a component no\n  longer reuses an unrelated model outside of hot reload.\n\n-
  **`pendingStaticKey` / `pendingMainThread` are reset before plain `On`\n  handlers
  run,** preventing state from one handler leaking into the next.\n\n- **`-fssr` compiles
  together with `-fnative`.**\n\n- **`JSException` derives `Exception`,** so it can
  be `throw`n and `catch`ed\n  normally.\n\n- **Non-bubbling `mouseleave`/`pointerleave`
  are registered in the capture\n  phase.** Neither event bubbles per the DOM spec
  (unlike `mouseout` /\n  `pointerout`, which correctly bubble), but the delegated
  listener was\n  registered in the bubble phase, so `onMouseLeave` / `onPointerLeave`\n
  \ handlers on any non-root element silently never fired. Same bug class as\n  the
  non-bubbling media events fix above, extended to these two.\n\n- **`vcomp` was misused
  as a synonym for `component` in `Miso.hs`'s\n  documentation.** `vcomp` builds a
  `VCompStatic` from a `StaticPtr` (the\n  static-component feature), not a `Component`
  from `model` / `update` /\n  `view` functions. The module's own \"Your first Component\"
  example and two\n  other doc snippets used `vcomp` where `component` was meant,
  so copying\n  them verbatim would not typecheck.\n\n- **`MisoString`'s `drop` is
  code-point-based on WASM, matching `take` /\n  `length`.** `take` / `length` were
  made code-point-based to fix\n  astral-character (e.g. emoji) miscounting, but `drop`
  was left on raw\n  UTF-16 slicing. Since `splitAt` is defined as `(take n xs, drop
  n xs)`,\n  the two disagreed on where position `n` falls for any string containing\n
  \ an astral character before it, corrupting the split.\n\n- **`-ftext` `parseInt`
  mis-parses negative hex.** `\"-0x1A\"` checked for a\n  `0x` / `0X` prefix before
  stripping a sign, so it never matched and fell\n  through to a decimal parse of
  `\"0x1A\"`, silently returning `0` instead of\n  `-26`. The sign is now stripped
  first, then the remainder is checked for\n  a hex prefix.\n\n- **`eventJSON` decodes
  a null/undefined path as `null` instead of\n  crashing.** A decoder path landing
  on `null`/`undefined` — `relatedTarget`,\n  `currentTarget`, `form`, `list`, etc.
  are all legitimately null/undefined\n  on many real DOM events — hit `'length' in
  obj` on the nullish value and\n  threw `TypeError`, crashing event dispatch instead
  of decoding the field\n  as `null`. An intermediate nullish step one segment earlier
  had the same\n  problem; both are now handled.\n  \n- **`freeLifecycleHooks` frees
  a component's `mount`/`unmount` callbacks\n  again.** It read the `mount`/`unmount`
  fields off the component's own\n  rendered content root instead of the `VComp` wrapper
  node that actually\n  holds them (reachable one hop up, via the content root's `parent`
  link),\n  so `fromJSVal` always failed and `freeFunction` was never called. Every\n
  \ non-root `Component` unmount — normal teardown and every GHCi hot-reload\n  cycle
  — leaked the closures `mountCallback`/`unmountCallback` capture,\n  which includes
  the whole `initialize` closure (`app`, `events`, `sink`,\n  `model`). See Note [Freeing
  event handler callbacks] in `Miso.Runtime`.\n\n### Performance\n\n- **Short-lived
  `JSVal` handles are freed eagerly in the WASM runtime.**\n  On the WASM backend
  every `JSVal` carries a weak pointer with a C\n  finalizer, and the RTS copies all
  of them at every GC — so the hundreds of\n  scratch handles `buildVTree` allocates
  per frame made GC pauses scale with\n  handle churn (~100 ms pauses with ~50 KB
  of live data in profiling). The\n  runtime now releases handles nothing else can
  reach via the new\n  `Miso.DSL.freeJSVal` (`GHC.Wasm.Prim.freeJSVal` on WASM, a
  no-op on other\n  backends), and event handler callbacks are freed when their vtree
  is\n  replaced. Measured on miso-mario, `C_FINALIZER_LIST` copied per GC dropped\n
  \ from 7.3 MB to 2.3 MB. See Note [Freeing VTree handles] in `Miso.Runtime`.\n\n-
  **`StableName` dirty-checking extended to `context` and `props`.**\n  `modelCheck`
  was generalised to `dirtyCheck :: Eq a => a -> a -> Bool` and\n  applied to the
  remaining sites that performed a full structural `Eq` walk\n  on every check. The
  common case — two reads of the same `IORef` returning\n  the same heap object —
  now short-circuits on pointer equality, which\n  matters most for large contexts
  such as i18n translation maps.\n\n- **Main-thread events dispatch directly,** with
  no scratch-node or JS\n  round trip.\n\n- **The thread environment (`mts` / `bts`
  / `web`) is cached** as a static\n  global in the runtime rather than re-queried
  on every `initialize` /\n  `initComponent`.\n"
