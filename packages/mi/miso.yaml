  />\n   </a>\n<p align=\"center\">:ramen: <a href=\"https://haskell-miso.org\"><b>miso</b></a>
  | A library for building web and <a href=\"https://github.com/haskell-miso/miso-lynx\">mobile</a>
  applications</p>\n</p>\n\n<p align=\"center\"> \n  <a href=\"https://discord.gg/QVDtfYNSxq\">\n
  \   <img src=\"https://img.shields.io/badge/discord-miso-5865F2.svg?style=for-the-badge&logo=discord&logoColor=white\"
