changelog: "# Changelog\n\nAll notable changes to `miso` are documented here.\n\n##
  1.15.0.0\n\n### Added\n\n- **`rAFLoop`** (`Miso.Subscription.Util`). A self re-scheduling\n
  \ `requestAnimationFrame` loop as a `Sub`, with one callback for the whole\n  loop:
  `rAFLoop :: IO (Double -> IO ()) -> Sub model action`. The `IO`\n  action runs once
  at start and builds the per-frame handler, so it is the\n  place to acquire what
  the handler needs. `rAFSub`, `rAFSubElapsed` and\n  `canvasSub` are now built on
  it.\n\n- **`Functor` instances for `View` and `Attribute` (non-`native` builds).**\n
  \ `fmap` / `<$>` / `<$` map the `action` a view or attribute produces, so a\n  sub-view
  written against one `action` type can be embedded in another\n  (`ChildAction <$>
  Child.view m`). These existed before 1.13.0.0 and were\n  dropped when the Lynx
  dual-thread runtime landed. Mapping stops at component\n  boundaries (`VComp` /
  `VCompStatic` keep their own `action`), and passes\n  through the ambient accessors
  `VContext` / `VProps` / `VModel`. **Not\n  available under the `native` flag**:
  a main-thread (`OnStatic`) handler\n  crosses threads as a bare `StaticKey` that
  the main thread re-dispatches at\n  the owning component's `action` type, and an
  arbitrary mapping function\n  can't travel with it. See `Note [Functor View]` in
  `Miso.Types`.\n\n- **`Miso.UUID`.** A `UUID` type backed by `MisoString`, with an
  API that\n  mirrors `Data.UUID` from the `uuid` package: `toString` / `fromString`,\n
  \ `toText` / `fromText`, strict and lazy ASCII `ByteString` conversions,\n  `toByteString`
  / `fromByteString` (16 bytes, network order), `toWords` /\n  `fromWords`, `toWords64`
  / `fromWords64`, `nil` and `null`. `nextRandom`\n  generates a v4 UUID with the
  browser's `crypto.randomUUID()`, which is only\n  available in secure contexts (HTTPS
  or `localhost`). Parsing accepts the\n  `8-4-4-4-12` form in either case and normalizes
  it to lowercase; `Show` and\n  `Read` use the unquoted form, like `Data.UUID`. Instances
  are provided for\n  `ToMisoString` / `FromMisoString`, `ToJSON` / `FromJSON`, `ToJSVal`
  /\n  `FromJSVal`, and `Router` (as a route capture).\n\n- **MicroHs backend (alpha).**
  miso compiles with\n  [MicroHs](https://github.com/augustss/MicroHs), to WebAssembly
  or\n  JavaScript through emscripten, and passes the integration test suite on\n
  \ both. The flake provides MicroHs with miso installed (`nix develop .#mhs`),\n
  \ and the [`miso` CLI](https://github.com/haskell-miso/cli) builds miso\n  applications
  with it without GHC or Nix.\n\n- **`CSS.content`** (`Miso.CSS`). The\n  [`content`](https://developer.mozilla.org/en-US/docs/Web/CSS/content)\n
  \ property: `content :: MisoString -> Style`.\n\n### Removed\n\n- **Breaking: `mountStaticWithProps`.**
  It was a deprecated synonym for\n  `mountStatic` since 1.14.0.0, when `mountStatic`
  began accepting components\n  with `props`. Replace it with `mountStatic`; call
  sites are otherwise\n  unchanged.\n\n### Changed\n\n- **Printed query strings list
  entries in key order, joined with `&`.**\n  Flags used to come after the params
  as separate `?`-groups. Code that\n  matches on the exact output of `prettyURI`,
  `prettyRoute` or `href_` may\n  need updating; see the matching entry under Fixed.\n\n-
  **Breaking: `uriFragment` no longer includes the leading `#` (#1696).**\n  `parseURI`
  (and so `getURI`, `uriSub` and `FromJSON URI`) stored the\n  fragment as `\"#cool\"`,
  contrary to the documented contract, and `toURI` on a\n  route with a `Fragment`
  field stored `\"##intro\"`. `prettyURI` appended the\n  field as-is, so a hand-built
  `URI \"foo\" \"section-1\" mempty` printed as\n  `/foosection-1` and `prettyRoute`
  printed `##intro`. The fragment is now\n  stored without the `#`, and `prettyURI`
  adds one when it is non-empty.\n  URIs printed from parsed input (`getURI`, `uriSub`,
  `routerSub`, `route`)\n  are unchanged.\n\n  Migration: stop stripping `#` from
  a parsed `uriFragment`, and compare\n  against the bare value (`uriFragment uri
  == \"top\"`). Fragments written with\n  a leading `#` (`uri { uriFragment = \"#top\"
  }`) still print correctly, since\n  `prettyURI` doesn't repeat an existing `#`.\n\n-
  **Event handlers run synchronously, during dispatch, on every backend.**\n  `on`
  / `onWithOptions`, event delegation and `addEventListener` (and the\n  subscriptions
  built on it: `windowSub`, `windowSubWithOptions`,\n  `keyboardSub`, `arrowsSub`,
  `onLineSub`, `uriSub`, ...) now call their\n  callback synchronously. On WASM they
  were asynchronous, so a handler could\n  run after the browser had finished dispatching
  the event: `preventDefault`\n  / `stopPropagation` then did nothing (#1334), and
  event data that only\n  exists during dispatch (a `DataTransfer`) was gone. On WASM,
  a synchronous\n  callback is now followed by a round of the RTS scheduler loop,
  so the\n  actions it queued are processed right away (#1683). A callback passed
  to\n  `addEventListener` must not block (`threadDelay`, `await`, `takeMVar`,\n  ...):
  on WASM, `threadDelay` or `await` in a synchronous callback raises\n  `WouldBlockException`,
  which stops the Haskell runtime if uncaught; on the\n  JS backend the callback is
  silently abandoned. Hand blocking work to the\n  `sink` (or `forkIO` it) instead.\n\n-
  **Breaking: `OnStatic` exists only under the `native` flag.** Elsewhere\n  `event`
  now dereferences the `StaticPtr` itself and builds a plain `On`.\n  Runtime behavior
  is unchanged — no web backend ever dispatched by\n  `StaticKey` — but code that
  pattern-matches on `OnStatic` must be guarded\n  with `#ifdef NATIVE` (or match
  `On` instead).\n\n- **Breaking: GHCJS 8.6 is no longer supported.** The GHC JavaScript
  backend\n  (`arch(javascript)`) is now the only JS target. The `GHCJS_OLD` code
  paths,\n  `impl(ghcjs)` conditionals and the `ghcjs-prim` dependency are removed,
  along\n  with the legacy nixpkgs pin (`legacyPkgs`) and its GHCJS 8.6 / GHC 8.6.5\n
  \ Nix targets.\n\n- **`MisoString` on the WASM and MicroHs backends now behaves
  like\n  `Data.Text`**, which is what it is on the server, so client and server\n
  \ agree. Positions and lengths count code points everywhere (`head`, `last`,\n  `tail`,
  `init`, `uncons`, `index`, `takeEnd`, `dropEnd`, `cons`, `snoc`,\n  `singleton`,
  `intersperse`, `justify*`, `maximum`, `minimum` used to see\n  the two halves of
  an emoji separately), and:\n  - `lines \"a\\n\" == [\"a\"]` and `lines \"\" == []`
  (no trailing empty line);\n  - `words`, `strip`, `stripStart` and `stripEnd` use
  `isSpace`: `words`\n    splits on tabs and newlines too, and `strip` no longer removes
  U+FEFF,\n    U+2028 or U+2029;\n  - `replace` replaces every occurrence, literally
  (it replaced only the\n    first, and expanded `$&` in the replacement);\n  - `split
  p s` no longer appends an empty piece when `s` has no separator;\n  - `stripSuffix
  \"\"` and `dropEnd 0` / `takeEnd 0` leave the string alone;\n  - `commonPrefixes
  \"foo\" \"foobar\"` is `Just (\"foo\", \"\", \"bar\")`, not\n    `Nothing`;\n  -
  `chunksOf k \"\"` is `[]`, and `chunksOf` with `k < 0` no longer loops;\n  - `unfoldrN`
  keeps its characters in order and stops at `Nothing`;\n  - `pack`, string literals
  and `textToJSString` keep a leading U+FEFF (the\n    `TextDecoder` dropped it);\n
  \ - `toLower` maps character by character (JavaScript's `toLowerCase`\n    turned
  a word-final `Σ` into `ς`);\n  - `head`, `last`, `init`, `index`, `maximum`, `minimum`
  and `count` fail\n    with a Haskell `error` instead of a JavaScript exception (which
  is fatal\n    on MicroHs);\n  - `compare` (`Ord`) uses code point order, so `Map
  MisoString` keys order\n    the same on client and server (JavaScript's `<` put
  emoji before\n    U+E000 to U+FFFF). The GHC JavaScript backend, whose `JSString`
  comes\n    from ghcjs-base, still compares code units.\n\n- **`Miso.Canvas` operations
  call direct foreign imports.** Every\n  straight-line `CanvasRenderingContext2D`
  operation (`fillRect`, `arc`,\n  `moveTo`, `globalAlpha`, `fillText`, ...) has its
  own import in\n  `Miso.Canvas.FFI`; the generic path marshalled the method name
  and\n  allocated a `JSVal` per argument on every call. `fillStyle`, `strokeStyle`\n
  \ and `shadowColor` with an `RGB` or `RGBA` colour pass the channels as\n  numbers
  and build the `rgb(...)` string in JavaScript. The public API is\n  unchanged, and
  native GHC keeps the generic calls.\n\n- **Lynx toolchain and SDK bumped.** `@lynx-js/rspeedy`
  0.18.4,\n  `@lynx-js/react-rsbuild-plugin` 0.22.1, `@lynx-js/react` 0.129.1,\n  `@lynx-js/types`
  4.4.2 and `@lynx-js/type-element-api` 0.0.12. The sample\n  native hosts now share
  one SDK version, 4.0.3 (Android was on 3.8.0, iOS on\n  4.0.0), the newest stable
  release published on both Maven and CocoaPods.\n\n### Fixed\n\n- **JS backend: `freeFunction`
  releases the callback.** It was a no-op, and\n  the JS RTS keeps every callback
  as a permanent GC root until it is\n  released, so each event handler freed on re-render,
  each mount / unmount\n  callback and each rAF / canvas callback leaked, along with
  everything it\n  closed over, for the lifetime of the page.\n\n- **`createSub` keeps
  its thread's delay within a 32-bit `Int`.** The `Sub`\n  thread parked itself with
  a `threadDelay` of 10^10 microseconds, which does\n  not fit an `Int` on wasm32.
  GHC wrapped it silently; MicroHs checks `Int`\n  arithmetic and threw `Overflow`,
  so the `Sub` was released right after it\n  was acquired (a `windowSub` never received
  an event).\n\n- **`stopSub` from an `rAFSub` / `rAFSubElapsed` / `canvasSub` action
  no\n  longer crashes.** Each frame callback re-scheduled itself after\n  dispatching,
  and `release` freed it. The wasm RTS has no timer, so it\n  context-switches at
  every heap-block boundary when another thread is\n  runnable; sinking the action
  woke the scheduler, which could run the\n  `stopSub` and free the callback before
  the callback resumed and called\n  `requestAnimationFrame` on its own freed handle
  (`getJSVal` throws, and\n  the runtime is gone). The callback now owns its own lifetime:
  stopping the\n  `Sub` sets a flag, and on its next frame the callback frees itself
  instead\n  of re-scheduling, so it is freed one frame later than before and nothing\n
  \ else ever touches it. `rAFSubElapsed` also no longer allocates (and leaks)\n  a
  new callback every frame. See `Note [rAFLoop teardown]` in\n  `Miso.Subscription.Util`.\n-
  **Empty query values parse.** After `=` the lexer needed at least one\n  character,
  so `?a=&b` parsed as the flag `a` and dropped `b`, and a\n  `QueryParam (Just \"\")`
  printed as `?q=` decoded back as `Nothing`. `?a=`\n  now gives `a` the value `\"\"`,
  so a `QueryParam \"q\" MisoString` route\n  decodes `?q=` as `Just \"\"` instead
  of `Nothing`.\n\n- **`ToMisoString (QueryParam p a)` prints `?key=value`.** It printed
  the\n  value and key swapped, as `?value=key`.\n\n- **`prettyQueryString` / `prettyURI`
  print one `?` and separate entries with\n  `&`.** Flags were printed as extra `?`-groups
  after the params (`?a=1?flag`,\n  `?a?b`), which a browser read as `a` = `1?flag`
  and as one key `a?b`. Every\n  entry now follows a single `?`, in key order (`?a=1&flag`,
  `?a&b`), and\n  entries with an empty key are skipped. This changes the output of\n
  \ `prettyRoute`, `href_`, `pushURI` / `replaceURI` / `pushRoute`, and the\n  `ToMisoString`
  / `ToJSON` instances of `URI`. `parseURI` still accepts the\n  old form.\n\n- **A
  generic `Index` route keeps its query fields when encoded.**\n  `fromRoute` emitted
  only `IndexToken` for an index constructor, dropping\n  its `QueryParam` and `QueryFlag`
  fields, so `prettyRoute` and `href_`\n  printed `/` where they should print `/?page=2`.
  Decoding already read\n  those fields. (A `Fragment` field is now encoded too, but
  `Fragment`\n  fields still can't be decoded.)\n\n- **`QueryParam Nothing` is left
  out of the URL.** It was printed as a bare\n  flag, so a route with an unset param
  linked to `/widget?bar` rather than\n  `/widget`. This applies to every generic
  route, not just index routes. It\n  now prints nothing; decoding a URL without the
  key still gives\n  `QueryParam Nothing`, and so does a URL with the bare key (`?bar`),
  so\n  existing links still parse. `fromRoute` and `toURI` change too: the key\n
  \ no longer appears in the token list or in `uriQueryString`.\n\n- **The fragment
  lexer takes everything after the `#`.** It only accepted\n  path-segment characters,
  so it stopped at the first `/`, `?`, `#`, `=`,\n  `&`, space or `[`, and the rest
  was dropped or misparsed as path or query.\n  `/#/users/1?tab=2` parsed as `URI
  \"\" \"\" mempty`, and `/foo#a/b` parsed as\n  path `foo/b` with fragment `a`. The
  fragment lexer now takes the rest of\n  the input verbatim, as browsers report it
  in `location.hash`, so\n  `parseURI \"/#/users/1?tab=2\"` has fragment `/users/1?tab=2`,
  and `/foo#a/b`\n  has path `foo`. `route` and `routerSub` ignore the fragment; to
  route on a\n  `#/…` hash, run `toRoute` on `uriFragment`. (The query lexer still
  stops at\n  a `/` or `?` inside a query value, so `/login?next=/home#tab` still
  loses\n  everything from that `/` on.)\n\n- **`eitherDecode` and `decode` return
  `Left` / `Nothing` on invalid JSON\n  instead of throwing (WASM, JS backend, MicroHs).**
  They called\n  `JSON.parse` through an `unsafe` import, and its `SyntaxError` escaped:
  on\n  WASM the update that decoded the text was lost, and on MicroHs, where an\n
  \ exception in an `unsafe` import is fatal, the runtime stopped. The error\n  is
  now caught in JavaScript, and `eitherDecode` returns\n  `Left \"eitherDecode: <message>\"`
  with `JSON.parse`'s message, where it used\n  to put the input string. Invalid input
  does not decode as `null`, so it is\n  a `Left` for a `Maybe a` too. `VANILLA` builds
  already returned `Left`.\n\n- **`toHtml` escapes attribute values.** Property values,
  class names and\n  style declarations were written between quotes as they were,
  so a `\"` in\n  one ended the attribute, and user-controlled text could inject markup
  into\n  prerendered HTML. They are now escaped with `htmlEncode`, as text nodes\n
  \ are. The browser decodes them back, so the DOM attributes and hydration are\n
  \ unchanged. If you escaped attribute values yourself to work around this,\n  stop:
  they will now be escaped twice (`&amp;` renders as `&amp;amp;`).\n\n- **`toHtml`
  renders a `textarea`'s value as its content.** Browsers ignore\n  a `value` attribute
  on a `<textarea>`, so prerendering from any backend but\n  `VANILLA` (where `textarea_`
  already moved the value) produced an empty\n  textarea. The value is now rendered,
  escaped, after the textarea's\n  children. An empty value leaves the textarea empty
  (on `VANILLA` it\n  rendered as a single space, which became the textarea's value),
  and a\n  leading newline survives parsing (the HTML parser drops the first one).\n\n-
  **WASM: `startApp` no longer evaluates `miso.js` a second time after\n  `withJS`.**
  `initComponent` (behind `startApp`, `miso`, `renderApp`,\n  `prerender`, `reload`
  and `live`) evaluated it unconditionally, replacing\n  `globalThis.miso` and dropping
  anything set on it in between. It now loads\n  `miso.js` only if `withJS` has not.
  `renderApp` also loads `miso.js` before\n  installing its drawing context: it wrote
  to `globalThis.miso` before\n  anything had created it, so it always threw on WASM.
  The `withJS` Haddock\n  now says that `main` must use it before calling anything
  that reads\n  `globalThis.miso` (`Miso.FFI`, `Miso.Random`, `Miso.JSON.decode`,
  ...)\n  ahead of `startApp`.\n  \n- **A tab, newline, form feed or carriage return
  in a class no longer\n  breaks rendering.** `class_` / `classes_` / `classList_`
  strings were split\n  on spaces only, so `\"foo\\tbar\"` reached `classList.add`
  as one token, which\n  throws `InvalidCharacterError` mid-patch, while server rendering
  of the same\n  view worked. Classes are now split on ASCII whitespace, as the HTML
  parser\n  splits a `class` attribute. Broken since 1.9.0.\n\n- **`MisoString` on
  the WASM and MicroHs backends no longer does work one\n  character at a time over
  the FFI.** `length` allocated an array of the\n  whole string and `uncons` called
  it, so everything that walks a string was\n  O(n²): `lines` over 110 KB took minutes.
  Functions that take a Haskell\n  function (`map`, `filter`, the folds, `any`, `all`,
  `takeWhile`, `break`,\n  `groupBy`, `split`, `zip`, the scans, ...) made three FFI
  calls per\n  character; they now convert to `Text` once and slice the original string\n
  \ for the result. Searching and splitting (`breakOn`, `splitOn`, `lines`,\n  `words`,
  `replace`, `strip`, `commonPrefixes`, ...) is one native call per\n  piece. See
  `scripts/bench-jsstring` for the benchmark.\n\n## 1.14.0.0\n\n### Added\n\n- **`VModel`
  / `vmodel` / `withModel`.** The `model` counterpart of\n  `VProps`: an ambient accessor
  (not a node) wrapping a\n  `model -> View context props model action` function,
  so a helper deep in a\n  view tree can read the enclosing component's `model` without
  needing it\n  threaded through as an explicit argument. Resolved against the mounting\n
  \ component's current `model` whenever the enclosing `View` is built, and\n  against
  its initial (or hydrated) `model` when rendered with `toHtml`.\n  `withModel` is
  a synonym for `vmodel`.\n- **`svgWith_`** (`Miso.Native.X.Element.Svg`). Native
  inline SVG content\n  that reads the enclosing component's `context` / `props` /
  `model`:\n  `svgWith_ attrs content` is an `<svg>` that obtains all three ambiently
  via\n  `withContext` / `withProps` / `withModel` and hands them to `content_`, so\n
  \ the content may use `vcontext` / `vprops` / `vmodel` directly.\n- **`VProps` /
  `vprops` / `withProps`.** The `props` counterpart of\n  `VContext`: an ambient accessor
  (not a node) wrapping a\n  `props -> View context props model action` function,
  so a helper deep in a\n  view tree can read the enclosing component's `props` without
  needing it\n  threaded through as an explicit argument. `ImplicitParams` or a `Reader`\n
  \ could serve the same purpose, at the cost of a GHC-specific extension or a\n  monadic
  style for view code. Resolved against the mounting\n  component's current `props`
  whenever the enclosing `View` is built or\n  rendered (`toHtml` on a bare `View`
  uses `()`). `withProps` is a synonym\n  for `vprops`.\n- **`toHtmlWith`.** `toHtmlWith
  :: context -> props -> model -> View context\n  props model action -> ByteString`
  renders a `View` whose `context`, `props`\n  or `model` type is not `()`, supplying
  the values `VContext` / `VProps` /\n  `VModel` accessors resolve against.\n- **`VContext`
  / `vcontext` / `withContext`.** An ambient accessor (not a\n  node) wrapping a `context
  -> View context props model action` function, so a helper deep in a view tree can
  read the app-global\n  `context` without needing it threaded through as an explicit
  argument.\n  Resolved against the current `context` whenever the enclosing `View`
  is\n  built or rendered; it does not itself trigger a redraw — that is still\n  governed
  solely by `useContext`. `withContext` is a synonym for `vcontext`.\n- **`onDestroyedWith`**
  (`Miso.Event`). Like `onDestroyed` but also receives\n  the element's (already-detached)
  `DOMRef`, completing the lifecycle hook\n  family alongside `onCreated` / `onCreatedWith`
  and `onBeforeDestroyed` /\n  `onBeforeDestroyedWith`.\n\n### Removed\n\n- **Breaking:
  `setContext`.** It existed to seed the `globalContext` cell for\n  the `ToHtml`
  renderer, and that cell is gone: the renderer now takes the\n  `context` as an argument,
  `ToHtml` requires `context ~ ()`, and there is no\n  cell at all until an app starts,
  so the call it was added for is now a type\n  error rather than something you fix
  by calling it first. Seed the `context`\n  with `startAppWithContext` / `misoWithContext`
  / `prerenderWithContext`,\n  change it from `update` with `modifyContext` / `putContext`,
  and pass it to\n  `toHtmlWith` for server-side rendering.\n\n### Changed\n\n- **Breaking:
  `view` takes only the `model`.** The `view` field of a\n  `Component` was `context
  -> props -> model -> View context props model\n  action`; it is now `model -> View
  context props model action`. The\n  `context` and `props` are read where they are
  actually needed with the\n  ambient accessors `withContext` / `vcontext` and `withProps`
  / `vprops`,\n  which resolve at the point the enclosing `View` is built or rendered.
  A\n  `view` that ignored them no longer has to name them (`\\_ _ _ -> …` becomes\n
  \ `\\_ -> …`), and one that used them reads them at the point of use instead\n  of
  threading them down through every helper. `toHtmlWith` still takes the\n  `context`,
  `props` and `model` — they are what the accessors in the\n  rendered tree resolve
  against — but the `view` it is applied to now takes\n  only the `model`: `toHtmlWith
  ctx props model (view comp model)`.\n\n  The `model` stays an argument purely for
  convenience — it is the one of the\n  three a `view` almost always needs. It is
  available ambiently too, so\n  `view _ = withModel $ \\m -> …` is equivalent to
  taking it as an argument;\n  `withModel` / `vmodel` remain the better choice for
  a helper deep in the\n  tree that the `model` is not otherwise passed to.\n\n- **Breaking:
  the app-global `context` cell is owned by the app, not by a\n  top-level CAF.**
  The `globalContext` `IORef` is gone. `initComponent` now\n  creates the cell and
  every mounted component holds a *reference* to it as\n  `_componentContext` (lens
  `componentContext`), so there is exactly one\n  value per running app: no component
  holds a copy, none can disagree, and\n  `modifyContext` (via the new `modifyContextAll`)
  is a single\n  `atomicModifyIORef'` on that cell rather than a rewrite of every
  component.\n  On Lynx each thread runs its own `initComponent` and so owns its own
  cell.\n  `buildVTree` receives the context as an explicit argument, so `VContext`
  is\n  resolved exactly like `VProps`, and the render path takes a plain value —\n
  \ no effectful read inside rendering, and no `undefined`-seeded global to\n  force.
  The scheduler's propagation pass is unchanged. Consequences:\n  `toHtmlWith` takes
  the `context`\n  first (`toHtmlWith ctx props model view`) and `ToHtml (View …)`
  requires\n  `context ~ ()` alongside `props ~ ()` and `model ~ ()`; the Lynx SVG\n
  \ `content_` takes the `context`, `props` and `model` ahead of the content\n  `View`;
  `Miso.Reload`'s stable pointer no longer carries a context cell and\n  recovers
  the old context by reading the root component's cell, seeding a\n  fresh one on
  reload.\n- **`SomeStaticComponent` now holds the component; `propsTypeOnly` is\n
  \ gone.** A static mount is the component itself bundled with its\n  dictionaries,
  `SomeStaticComponent props context` (existential over `model`\n  / `action`, `props`
  kept visible), rather than a `props -> SomeComponent`\n  function. `VCompStatic`
  holds `StaticPtr (SomeStaticComponent props context)`\n  next to the `props` value
  and the runtime builds the `SomeComponent` at\n  mount time. Because the dictionaries
  now sit in the value a `StaticKey`\n  resolves to, the Lynx main thread recovers
  the child's `action` and\n  `props` types from the key alone, so the lazy `propsTypeOnly`
  placeholder\n  and the \"every constructor is lazy in props\" invariant are gone.\n
  \ `mountStatic` now accepts components with or without `props`;\n  `mountStaticWithProps`
  remains as a deprecated alias until 1.15. Code that\n  pattern-matches the `SomeStaticComponent`
  constructor directly sees its\n  payload change from a function to a `Component`.
  A new `MountConstraints`\n  synonym declares the shared dictionary set once for
  `SomeComponent` and\n  `SomeStaticComponent`. Call sites such as\n  `vcomp_ (static
  (mountStatic comp))` are unchanged.\n- **`toHtml` collapses adjacent text nodes
  inside fragments and across a\n  `[View]`.** Previously only an element's direct
  children were collapsed,\n  so an empty text node inside a `vfrag` rendered as a
  lone space that the\n  client's hydration walk (which recurses into fragments) could
  not\n  reconcile, silently falling back to a full re-render.\n- **`vcontext` / `vprops`
  / `vmodel` children are resolved before being built.** The\n  runtime now looks
  through these wrappers before deciding what to do with\n  a child, so one that resolves
  to an empty fragment is skipped like an\n  inline `fragment []`, and one that resolves
  to a plain node has its JS\n  handle freed after linking like any other node. `toHtml`
  likewise\n  resolves them before collapsing adjacent text nodes, matching the\n
  \ client's hydration-time tree.\n- **Breaking: `View` gained a `props` type parameter.**
  `View context model\n  action` is now `View context props model action`, matching
  the order of\n  `Component context props model action`. Unlike `context`, `props`
  are\n  per-component, so `VProps` is resolved through the type system the same\n
  \ way `model` is, rather than through a global cell. Mount combinators\n  (`mount_`,
  `mountWithProps`, `(+>)`, `vcomp`, …) forget the child's\n  `props` at the boundary
  exactly as they forget its `model` and `action`.\n  Update signatures by inserting
  a `props` variable after `context`; code\n  that leaves it polymorphic needs no
  other change. `ToHtml (View …)` and\n  `ToHtml [View …]` now require `context ~
  ()`, `props ~ ()` and\n  `model ~ ()`: a bare `View` is static markup, and a component's
  view is\n  rendered with `toHtmlWith` (so `toHtml (view ctx () m)` becomes\n  `toHtmlWith
  ctx () m (view ctx () m)`). `content_` in\n  `Miso.Native.X.Element.Svg.Property`
  now takes the `context`, `props` and\n  `model` to render against, ahead of the
  content `View`; use `svgWith_` to\n  obtain all three ambiently from the enclosing
  component.\n\n### Fixed\n\n- **`onDestroyedWith` / `onBeforeDestroyedWith` now receive
  the element's\n  `DOMRef` instead of `undefined`.** `callDestroyed` and\n  `callBeforeDestroyed`
  invoked the hooks with no argument, so the `DOMRef`\n  callback was always `undefined`
  on the Haskell side. Zero-argument\n  `onDestroyed` / `onBeforeDestroyed` users
  are unaffected.\n- **Static mounts now carry their `StaticKey` as the diff key.**
  A\n  `VCompStatic` node had no `key`, so two different `static` sites at the\n  same
  position compared equal in the differ: the first component stayed\n  mounted and
  the second's `diffProps` ran against it with props of an\n  unrelated type. `buildComp`
  now sets `key` to the mount's `StaticKey`\n  (unique per `static` site) when no
  explicit key is given, so swapping\n  `vcomp_ (static (mountStatic A))` for `vcomp_
  (static (mountStatic B))`\n  replaces the child. Siblings built from one `static`
  site still diff\n  positionally.\n\n## 1.13.0.0\n\n### Added\n\n- **Native mobile
  backend.** `miso` can now target native mobile devices by\n  driving the [Lynx](https://lynxjs.org)
  dual-thread runtime instead of the\n  browser DOM. New `Miso.Native` entry point
  (`native` / `nativeWithContext`),\n  the `Miso.Native.Element.*` element / event
  / property / method vocabulary,\n  and main-thread event handlers for low-latency
  gestures. Gated behind the\n  `native` cabal flag (`-fnative`); web / WASM builds
  are unaffected.\n\n  Because the flag is off by default, the `Miso.Native.*` modules
  do not\n  appear in the Hackage-generated documentation — build locally with\n  `-fnative`,
  or see the `sample-app-native` directory for a worked example\n  with iOS and Android
  hosts.\n\n- **App-global `context`.** A single value shared by every `Component`
  in the\n  tree (miso's analogue of React Context): seed with `startAppWithContext`,\n
  \ read with `getContext` (or the first argument to `view`), update with\n  `modifyContext`
  / `modifyContext_` / `putContext`, and opt components into\n  context-driven re-renders
  with `useContext`. `ComponentInfo` gained a\n  `componentInfoContext` lens. The
  motivating use case is propagating\n  settings such as locale or theme to every
  component without threading them\n  through `props`.\n\n- **Cookie Store API.**
  New `Miso.Cookie` module wrapping the browser's\n  [CookieStore API](https://developer.mozilla.org/en-US/docs/Web/API/CookieStore)\n
  \ as `Effect` combinators — `cookieGet`, `cookieGetAll`, `cookieSet`,\n  `cookieDelete`,
  `cookieDeleteWith`, the `Cookie` record and `defaultCookie`\n  constructor, plus
  `_`-suffixed synchronous variants. `Miso.Subscription.Cookie`\n  adds `cookieChangeSub`
  for subscribing to `CookieChangeEvent`s. Requires a\n  secure context (HTTPS or
  `localhost`); on browsers without the API\n  (e.g. Firefox) the error callback fires
  and `cookieChangeSub` is a no-op.\n\n- **`canvasSub`.** New `Miso.Subscription.Canvas`
  module. `canvasSub` drives\n  a `<canvas>` in a tight `requestAnimationFrame` loop,
  bypassing virtual DOM\n  construction entirely — unlike `Miso.Canvas`, whose `draw`
  runs during the\n  diffing process on discrete events. Pair it with `onCreatedWith`
  /\n  `onDestroyed` and `startSub` / `stopSub` to start the loop when the canvas\n
  \ mounts and stop it on unmount. The draw callback receives each frame's\n  high-resolution
  timestamp and a snapshot of the component's current model\n  (see the `Sub` change
  below), and the queued frame is cancelled before the\n  callback is freed on teardown.\n\n-
  **`Miso.Trace`.** A browser-console analogue of `Debug.Trace` for\n  debugging pure
  code such as `view` functions or helpers called from\n  `update`. `trace`, `traceId`,
  `traceWith`, `traceShow`, `traceShowId`,\n  `traceShowWith`, `traceM` and `traceShowM`
  log with `console.log`; the\n  `traceWarn*` and `traceError*` families log with
  `console.warn` and\n  `console.error` respectively, gaining the browser's severity
  filtering\n  and stack traces. `traceTo` generalises over any `MisoString -> IO
  ()`\n  console function from `Miso.FFI`. Like `Debug.Trace`, these are built on\n
  \ `unsafePerformIO` and are a debugging aid only.\n\n- **Synchronous `Miso.Fetch`
  variants.** `_`-suffixed counterparts for the\n  whole surface — `getJSON_`, `postJSON_`,
  `postJSON'_`, `putJSON_`,\n  `getText_`, `postText_`, `putText_`, `getBlob_`, `postBlob_`,
  `putBlob_`,\n  `getFormData_`, `postFormData_`, `putFormData_`, `getUint8Array_`,\n
  \ `postUint8Array_`, `putUint8Array_`, `getArrayBuffer_`, `postArrayBuffer_`,\n
  \ `putArrayBuffer_`, `postImage_`, `putImage_`. Each blocks the calling\n  thread
  and returns `Either (Response error) (Response body)`. Best used\n  inside `Miso.Effect.io`
  / `io_` so the scheduler thread is not blocked.\n\n- **Cross-thread effects.** `runOnBG`
  and `runOnMain` (with the supporting\n  `Thread` type) dispatch an action's `update`
  onto the background (BTS) or\n  main (MTS) thread of the Lynx runtime. Off the native
  runtime, or when\n  already on the target thread, both behave as an ordinary `issue`.\n\n-
  **Main-thread event handlers.** `onMain` / `onMainWithOptions` in\n  `Miso.Event`
  register handlers that run directly on the main thread, for\n  low-latency gesture
  and animation work. `Miso.Native.MainThread` provides\n  `MainThreadRef` and the
  imperative operations those handlers drive.\n  `eventHandlerConvert` / `eventHandlerDecoder`
  and the `EventHandler` type\n  are exported for building custom handlers.\n\n- **Static
  components.** `mountStatic` and `mountStaticWithProps` mount a\n  `Component` through
  a `StaticPtr` (`SomeStaticComponent`), so the component\n  survives the dual-thread
  boundary; `vcomp_` / `vcomp` turn the resulting\n  pointer into a `View`. Unlike
  the non-static combinators these need no key —\n  the compile-time `StaticKey` supplies
  identity. To opt a statically mounted\n  child into `context` re-renders, set the
  field directly:\n  `mountStatic comp { useContext = True }`. `mountUseContext` is
  the\n  non-static equivalent.\n\n- **Every exported name is documented.** `cabal
  haddock` reported 118\n  undocumented exports across 34 modules — mostly the Lynx
  event payloads,\n  decoders, method parameter records and `Events` maps under\n
  \ `Miso.Native.Element.*`. All now carry Haddock.\n\n- **Context-seeding SSR entry
  points.** `misoWithContext` and\n  `prerenderWithContext` hydrate a server-rendered
  page with an explicit\n  initial `context`; `setContext` seeds the global context
  for use from the\n  `ToHtml` renderer. `Miso.Reload` gained matching `liveWithContext`
  and\n  `reloadWithContext`.\n\n- **Lynx thread detection.** `getThreads`, `onBTS`
  and `onMTS` in `Miso.FFI`\n  report which thread the current code is executing on.\n\n-
  **CSS helpers.** `transition_` builds a single shorthand `transition`\n  declaration
  (so an imperative `transition: none` reset on the main thread\n  clears it as one
  key), and `cubicBezier` produces a `cubic-bezier(…)`\n  timing function.\n\n- **`Miso.DSL`
  additions.** `await` for awaiting a JS promise from Haskell,\n  and the `JSException`
  type (which now has an `Exception` instance).\n\n- **`DirectEvents`.** `VNode` carries
  a set of directly-dispatched events,\n  readable via `nodeDirectEvents`, used by
  the native runtime to skip the\n  scratch-node round trip.\n\n- **Types that were
  reachable but not exported.** Several types appeared in\n  exported signatures without
  being exported themselves, so callers could not\n  name them: `Consumed` (the payload
  of `Miso.Native.Element.List.Method`'s\n  callback), `GetTextBoundingRect` (the
  parameter of `getTextBoundingRect`),\n  `ListItemInfo`, `AnimationType` and `UIAppearanceDetailEventType`
  (field\n  types of exported Lynx event records), and `ComponentIds` (the type of\n
  \ `ComponentState`'s `_componentChildren`). `Miso.JSON` now exports `ToJSON`\n  with
  both methods — `toJSONList` was hidden, so it could not be overridden\n  outside
  the module — along with the four generic-deriving classes missing\n  from its `Generics`
  group (`GToJSONRep`, `GToJSONSumNullary`,\n  `GFromJSONRep`, `GFromJSONSumNullary`).
  `Miso.Lens.Generic` likewise exports\n  the type-level machinery its `HasLens` instances
  mention (`GSet`,\n  `GetFieldType`, `TotalityCheck`, `And`, `Or`).\n\n- **`aeson`
  cabal flag.** When enabled (`-faeson`, off by default),\n  `Miso.JSON` keeps its
  API but is defined in terms of\n  [aeson](https://hackage.haskell.org/package/aeson):
  `Value`, `Object`, and\n  `Parser` become aeson's types, so existing aeson `ToJSON`
  / `FromJSON`\n  instances work directly with `Miso.Fetch`, `Miso.WebSocket`, and
  the event\n  decoders. Signatures are unchanged — the accessors still take `MisoString`\n
  \ keys, `withArray` still passes the continuation a `[Value]`, `withNumber`\n  still
  passes a `Double`, and `Result` still carries `MisoString` error\n  messages. On
  the JS / WASM backends orphan instances make `JSString` a\n  first-class JSON citizen.
  Miso's own generic-deriving machinery (`GToJSON`\n  et al.) is not exported in this
  mode; aeson's `genericToJSON` / `Options` /\n  `camelTo2` are re-exported instead.
  CI runs the WASM integration suite in\n  both modes.\n\n- **`text` cabal flag on
  WASM.** When enabled (`-ftext`, off by default),\n  `MisoString` is `Data.Text.Text`
  instead of `JSString` on the WASM\n  backend too (previously this was only possible
  on the `VANILLA` / SSR\n  build). `Data.JSString` remains the FFI boundary type,
  so DOM writes\n  still convert `Text -> JSString` on the way out. Number formatting
  and\n  parsing take advantage of this to avoid unnecessary FFI round trips:\n  `toMisoString`
  on `Int` / `Word` / `Double` / `Float` builds `Text`\n  directly via `Data.Text.Lazy.Builder`
  (`decimal` / `realFloat`) instead\n  of allocating a throwaway `JSVal` via JS's
  `.toString()`, since GHC's\n  `Show` formatting is what these functions target on
  this backend\n  regardless. Likewise,\n  `fromMisoString` on `Int` / `Word` / `Double`
  / `Float` parses directly\n  with `Data.Text.Read` instead of round-tripping through\n
  \ `JSString`/`parseInt`/`parseFloat`, while reproducing the JS parsers'\n  semantics:
  leading/trailing whitespace and trailing garbage are\n  ignored, a leading `+`/`-`
  is accepted, and integers with a `0x`/`0X`\n  prefix parse as hexadecimal. CI gained
  a `playwright-wasm-aeson-text`\n  target that runs the WASM integration suite with
  both the `aeson` and\n  `text` flags enabled together.\n\n### Changed\n\n- **Breaking:
  `View` and `Attribute` gained type parameters.**\n  `View context model action`
  and `Attribute model action`. This lets event\n  handlers read the current `model`
  and supports the native dual-thread\n  `static` handler protocol. `VNode` now carries
  a `DirectEvents` set, the\n  key moved into `SomeComponent (Maybe Key) …`, and `VComp`
  / `VCompStatic` /\n  `SomeStaticComponent` were restructured. Downstream `view`
  and attribute\n  signatures must be updated accordingly.\n\n- **Breaking: `Sub`
  gained a `model` type parameter.** `Sub action` is now\n  `Sub model action`, and
  a subscription receives a second argument — an\n  `IO model` that returns a snapshot
  of the component's current model:\n  `type Sub model action = Sink action -> IO
  model -> IO ()`. This lets\n  long-running subscriptions (like `canvasSub`) read
  the latest model\n  without threading it through actions. All bundled subscriptions
  were\n  updated; user-defined subscriptions that ignore the model need only accept\n
  \ (and discard) the extra argument, e.g.\n  `tickSub sink _ = forever (threadDelay
  delay >> sink Tick)`. `mapSub`,\n  `createSub`, and `startSub` were updated accordingly.\n\n-
  **Breaking: `Miso.Binding` was removed.** The experimental lens-based\n  parent/child
  model synchronisation mechanism (`Binding`, `Bindings`,\n  `Precedence`, and the
  `bindings` field on `Component`) is gone, along with\n  its propagation phase in
  the scheduler. Use the new app-global `context`\n  for shared state, or asynchronous
  messaging via `broadcast` / `Miso.PubSub`\n  for point-to-point communication.\n\n-
  **Breaking: `parent` and `ROOT` were removed.** `Component` no longer\n  carries
  a `parent`; the `ROOT` marker that demarcated the top of the page\n  is unnecessary
  without it. Both are superseded by `context`.\n\n- **Breaking: `Miso.Types.keyed`
  was removed.** Use the keyed constructors\n  directly: `textKey` / `textKey_` for
  text, `fragment_` / `vfrag_` for\n  fragments, `mount_` / `vcomp_` / `mountStatic`
  for components, and\n  `key_` in the attribute list for element nodes.\n\n- **Breaking:
  runtime internals dropped from `Miso.FFI`.** `mountComponent`,\n  `unmountComponent`
  and `modelHydration` (and `getComponentContext` from\n  `Miso.FFI.Internal`) were
  documented as runtime-use-only and have been\n  removed as part of the dual-thread
  rework. They have no user-facing\n  replacement.\n\n- **Breaking: `autocomplete_`
  takes a `MisoString`.** It was\n  `Bool -> Attribute action`, which could only produce
  `\"on\"` / `\"off\"` and\n  could not express the many other valid values (`\"email\"`,
  `\"new-password\"`,\n  …). It is now `MisoString -> Attribute action`; replace `autocomplete_
  True`\n  with `autocomplete_ \"on\"`.\n\n- **Breaking: `Miso.Util.Parser.endOfInput`
  was generalised** from\n  `Parser a ()` to `ParserT r [a] [] ()`. Call sites are
  unaffected unless\n  they carried an explicit type annotation.\n\n- **`MisoString`
  `length` and `take` are code-point based on WASM.** They\n  previously counted UTF-16
  code units, so a string holding a single\n  astral-plane character (an emoji, say)
  reported a length of 2. They now\n  agree with `Data.Text` and with the GHCJS backend.
  Only the WASM backend\n  was affected.\n\n- **`context` no longer requires `ToJSON`
  / `FromJSON`.** The constraints\n  were unused — `context` is never sent across
  the dual-thread boundary.\n\n### Removed\n\n- **`Miso.String.QQ`.** The `misoString`
  QuasiQuoter for multiline\n  `MisoString` literals is gone. GHC's `MultilineStrings`
  extension\n  (GHC 9.12+) covers the use case directly — enable the pragma and write\n
  \ triple-quoted `MisoString` literals. (`Miso.FFI.QQ` and `Miso.Lens.TH`,\n  the
  other `template-haskell`-flag modules, are unaffected.)\n\n### Fixed\n\n- **`Miso.Fetch`'s
  `none` response type no longer double-fires the success\n  callback.** `fetchCore`
  called the success callback directly for\n  `responseType == \"none\"` and then
  fell through into a second, unconditional\n  `.then` that called it again with `body:
  undefined`. Every `post*`/`put*`\n  variant that discards the response body (`postJSON`,
  `postJSON_`, `putText`,\n  `putBlob_`, etc.) dispatched its success action twice
  per request.\n\n- **Native: attribute removal actually removes the attribute.**
  The MTS\n  drawing context's `removeAttribute` called `__SetAttribute(node, key,
  '')`.\n  The engine's `Element::SetAttribute` (`lynx/core/renderer/dom/element.cc`)\n
  \ only takes the removal branch when the value is lepus-empty\n  (`null`/`undefined`)
  — an empty string is an ordinary string value, so it\n  was stored in `updated_attr_map_`
  instead of being removed. Every prop\n  diffed off a native element (`dom.ts`'s
  `diffProps`, which routes native\n  removals through this path) was setting it to
  `''` rather than clearing\n  it. Now passes `null`.\n\n- **`rAFSub` now cancels
  the pending animation frame on unsubscribe.**\n  Release freed the `requestAnimationFrame`
  callback without cancelling the\n  frame already queued in the browser; the next
  frame then invoked a freed\n  callback and crashed the WASM RTS with `internal error:
  stg_ap_p_ret`.\n  `Miso.Canvas`'s `draw` also moved from a `syncCallback` to an\n
  \ `asyncCallback`, fixing a `schedule: re-entered unsafely` crash when a\n  component
  unmounted mid-diff.\n\n- **Non-bubbling media events are registered in the capture
  phase.**\n  `durationchange`, `loadeddata`, `loadedmetadata` and `loadstart` do
  not\n  bubble, so their delegated listeners — registered in the bubble phase —\n
  \ never received them and `onLoadedMetadata` and friends silently never\n  fired.
  They are now registered with capture, like the other non-bubbling\n  entries in
  `mediaEvents`.\n\n- **Native: the layout custom event is recognised under its released
  name.**\n  Released Lynx engines (e.g. LynxExplorer apps) emit it as `layout`, while\n
  \ newer Lynx sources emit `layoutchange`; miso only listened for the latter,\n  so
  `onLayoutChange` never fired on released engines. `onLayout` /\n  `onLayoutMainWith`
  are added as aliases so apps can bind both when the\n  host engine version is unknown.\n\n-
  **Native: `consumeSlideEvent_` sends the shape Lynx expects.** Lynx parses\n  `consume-slide-event`
  as `[start, end]` angle-range pairs (degrees,\n  -180..180), but the binding serialised
  a flat list of angles instead of\n  paired ranges, a shape the engine silently ignores.\n\n-
  **`autocorrect_` and `spellcheck_` wrote to the wrong attribute.** Both\n  emitted
  `autocomplete` instead of their own attribute name. `spellcheck_`\n  additionally
  now emits `\"true\"` / `\"false\"` rather than `\"on\"` / `\"off\"`.\n\n- **`MOUNT`
  errors on a missing `domRef`** instead of synthesizing a bogus\n  parent node and
  failing later in the diff.\n\n- **Key-based model recovery is gated on `liveMode`,**
  so a component no\n  longer reuses an unrelated model outside of hot reload.\n\n-
  **`pendingStaticKey` / `pendingMainThread` are reset before plain `On`\n  handlers
  run,** preventing state from one handler leaking into the next.\n\n- **`-fssr` compiles
  together with `-fnative`.**\n\n- **`JSException` derives `Exception`,** so it can
  be `throw`n and `catch`ed\n  normally.\n\n- **Non-bubbling `mouseleave`/`pointerleave`
  are registered in the capture\n  phase.** Neither event bubbles per the DOM spec
  (unlike `mouseout` /\n  `pointerout`, which correctly bubble), but the delegated
  listener was\n  registered in the bubble phase, so `onMouseLeave` / `onPointerLeave`\n
  \ handlers on any non-root element silently never fired. Same bug class as\n  the
  non-bubbling media events fix above, extended to these two.\n\n- **`vcomp` was misused
  as a synonym for `component` in `Miso.hs`'s\n  documentation.** `vcomp` builds a
  `VCompStatic` from a `StaticPtr` (the\n  static-component feature), not a `Component`
  from `model` / `update` /\n  `view` functions. The module's own \"Your first Component\"
  example and two\n  other doc snippets used `vcomp` where `component` was meant,
  so copying\n  them verbatim would not typecheck.\n\n- **`MisoString`'s `drop` is
  code-point-based on WASM, matching `take` /\n  `length`.** `take` / `length` were
  made code-point-based to fix\n  astral-character (e.g. emoji) miscounting, but `drop`
  was left on raw\n  UTF-16 slicing. Since `splitAt` is defined as `(take n xs, drop
  n xs)`,\n  the two disagreed on where position `n` falls for any string containing\n
  \ an astral character before it, corrupting the split.\n\n- **`-ftext` `parseInt`
  mis-parses negative hex.** `\"-0x1A\"` checked for a\n  `0x` / `0X` prefix before
  stripping a sign, so it never matched and fell\n  through to a decimal parse of
  `\"0x1A\"`, silently returning `0` instead of\n  `-26`. The sign is now stripped
  first, then the remainder is checked for\n  a hex prefix.\n\n- **`eventJSON` decodes
  a null/undefined path as `null` instead of\n  crashing.** A decoder path landing
  on `null`/`undefined` — `relatedTarget`,\n  `currentTarget`, `form`, `list`, etc.
  are all legitimately null/undefined\n  on many real DOM events — hit `'length' in
  obj` on the nullish value and\n  threw `TypeError`, crashing event dispatch instead
  of decoding the field\n  as `null`. An intermediate nullish step one segment earlier
  had the same\n  problem; both are now handled.\n  \n- **`freeLifecycleHooks` frees
  a component's `mount`/`unmount` callbacks\n  again.** It read the `mount`/`unmount`
  fields off the component's own\n  rendered content root instead of the `VComp` wrapper
  node that actually\n  holds them (reachable one hop up, via the content root's `parent`
  link),\n  so `fromJSVal` always failed and `freeFunction` was never called. Every\n
  \ non-root `Component` unmount — normal teardown and every GHCi hot-reload\n  cycle
  — leaked the closures `mountCallback`/`unmountCallback` capture,\n  which includes
  the whole `initialize` closure (`app`, `events`, `sink`,\n  `model`). See Note [Freeing
  event handler callbacks] in `Miso.Runtime`.\n\n### Performance\n\n- **Short-lived
  `JSVal` handles are freed eagerly in the WASM runtime.**\n  On the WASM backend
  every `JSVal` carries a weak pointer with a C\n  finalizer, and the RTS copies all
  of them at every GC — so the hundreds of\n  scratch handles `buildVTree` allocates
  per frame made GC pauses scale with\n  handle churn (~100 ms pauses with ~50 KB
  of live data in profiling). The\n  runtime now releases handles nothing else can
  reach via the new\n  `Miso.DSL.freeJSVal` (`GHC.Wasm.Prim.freeJSVal` on WASM, a
  no-op on other\n  backends), and event handler callbacks are freed when their vtree
  is\n  replaced. Measured on miso-mario, `C_FINALIZER_LIST` copied per GC dropped\n
  \ from 7.3 MB to 2.3 MB. See Note [Freeing VTree handles] in `Miso.Runtime`.\n\n-
  **`StableName` dirty-checking extended to `context` and `props`.**\n  `modelCheck`
  was generalised to `dirtyCheck :: Eq a => a -> a -> Bool` and\n  applied to the
  remaining sites that performed a full structural `Eq` walk\n  on every check. The
  common case — two reads of the same `IORef` returning\n  the same heap object —
  now short-circuits on pointer equality, which\n  matters most for large contexts
  such as i18n translation maps.\n\n- **Main-thread events dispatch directly,** with
  no scratch-node or JS\n  round trip.\n\n- **The thread environment (`mts` / `bts`
  / `web`) is cached** as a static\n  global in the runtime rather than re-queried
  on every `initialize` /\n  `initComponent`.\n"
