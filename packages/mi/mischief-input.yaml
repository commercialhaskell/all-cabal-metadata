description: "# mischief-input \n\nLibrary that adds input functionality to Mischief.
  Go to the root module above, `Mischief.Input`, for more information and examples.
  \  \n\nThis library lives in the official [repo](https://codeberg.org/mischief/mischief)
  and is considered a \"core library\" of the ecosystem. \n\nTo contribute, you can
  file issues, such as bug reports and feature requests, in the official [repository](https://codeberg.org/mischief/mischief).\nYou
  can also join the official server on discord to be kept up to date with updates
  and chat with the rest of the community. Link in the aforementioned repo. \n"
