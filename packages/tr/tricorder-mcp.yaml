changelog: |
  # Changelog

  All notable changes to `tricorder-mcp` will be documented in this file.

  The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
  and this project adheres to the [PVP](https://pvp.haskell.org/).

  ## [Unreleased]

  ## [1.0.0.1] - 2026-10-30

  ### Fixed

  - `start_daemon`, `stop_daemon` and `restart_daemon` now invoke `tricorder daemon {start,stop,restart}` instead of the removed top-level `start`, `stop` and `restart` subcommands. Non-breaking. (Thanks @michael-xavier-well)

  ## [1.0.0.0] - 2026-10-29

  ### Changed

  - Uses the new flags for Tricorder's `status`, `daemon stop` and
    `daemon restart` commands.
  - Support new `IfBuildIsPending` option.
  - Rename `start` and `restart` tools' `force` option to `ignorePendingQueries`.

  ## [0.2.0.0] - 2026-10-23

  ### Changed

  - The `status` tool now shows only the first line of a test suite's error
    message unless `verbose` is set.
    ([#585](https://github.com/tweag/tricorder/issues/585))
  - The `test_results` tool now uses the new, more granular
    `tricorder test suites` command.

  ## [0.1.3.1] - 2026-10-20

  ### Fixed

  - Pre-built binaries on GitHub were built against paths in `/nix/store`, and
    were not portable to systems that did not have Nix installed. The binaries are
    now correctly linked to be used on non-Nix machines, and NixOS machines with
    `nix-ld` enabled.

  ## [0.1.3.0] - 2026-09-17

  ### Added

  - Proper support for GHC 9.14.

  ## [0.1.2.2] - 2026-09-16

  ### Changed

  - Bumped `atelier-core`, `atelier-prelude` and `tricorder-types`.

  ## [0.1.2.1] - 2026-09-11

  ### Changed

  - Require `tricorder-types ^>=0.3`.

  ## [0.1.2.0] - 2026-09-10

  ### Changed

  - Require `effectful-core >=2.7 && <2.8`.
  - Require `effectful-plugin >=2.2 && <2.3`.

  ### Added

  - Reintroduce project root argument, but as an optional argument, defaulting to
    using the current working directory. This allows the agent to control
    multiple Tricorder sessions at the same time.

  ## [0.1.1.0] - 2026-09-01

  ### Changed

  - `tricorder-mcp` no longer requires the agent to pass the directory of the
    project in question, and will instead infer it from the current working
    directory or use the directory passed from the agent harness.
  - Added more accurate and detailed descriptions for each tool.

  ## [0.1.0.0] - 2026-08-19

  ### Added

  - Initial release.
changelog-type: markdown
description: |
  # tricorder-mcp

  Model Context Protocol server for [Tricorder](../tricorder/README.md).

  ## Installation

  `tricorder-mcp` needs to be downloaded or installed onto your machine before Claude or Copilot can use it.

  ### Hackage

  Download or install from [Hackage](https://hackage.haskell.org/package/tricorder-mcp):

  ```bash
  cabal install tricorder-mcp
  # or
  stack install tricorder-mcp
  ```

  ### GitHub release

  Download and install from [GitHub releases](https://github.com/tweag/tricorder/releases), and place the binary in your `PATH`.

  ## Add MCP server to your agent

  ### With Claude

  If you put `tricorder-mcp` in your `PATH`:

  ```bash
  claude mcp add tricorder -- tricorder-mcp
  ```

  Alternatively, if you want to refer to `tricorder-mcp` by an absolute path:

  ```bash
  claude mcp add tricorder -- /path/to/tricorder-mcp
  ```

  ### With Copilot

  Use the `/mcp add` command within Copilot, or use the CLI directly:

  ```bash
  copilot mcp add tricorder -- tricorder-mcp
  ```

  Alternatively, if you want to refer to `tricorder-mcp` by an absolute path:

  ```bash
  copilot mcp add tricorder -- /path/to/tricorder-mcp
  ```

  ## Usage

  Prompt your agent to use the `tricorder` MCP server whenever you want it to
  perform some work. Alternatively, you can add it to your repo's `AGENT.md` to
  ensure your agent always knows that the MCP server is available.

  ## License

  MIT — see [LICENSE](LICENSE).
