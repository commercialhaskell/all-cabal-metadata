description: |
  # `monoidmap-nothunks`

  [![Latest Release](
    https://img.shields.io/hackage/v/monoidmap-nothunks?label=Latest%20Release&color=227755
  )](https://hackage.haskell.org/package/monoidmap-nothunks)
  [![Development Branch](
    https://img.shields.io/badge/Development%20Branch-API%20Documentation-225577
  )](https://jonathanknowles.github.io/monoidmap/monoidmap-nothunks/)

  ## Overview

  This package provides thunk detection support for the [`monoidmap`](https://hackage.haskell.org/package/monoidmap) package, compatible with the [`nothunks`](https://hackage.haskell.org/package/nothunks) package.
